WORLD.18142.t: "Fall Grau"
WORLD.18142.d: "Following the so-called Riga incident and the severance of the German-Baltic union by the conservative National Socialist leadership of Reichsland Baltikum, Germany has reacted by mobilizing its forces.\nOfficially, the aim of Fall Grau, is to be a 'large-scale military excersise to improve Europäische Pakt coordination'. In reality, the goal is to depose the leadership of RL Baltikum and to prevent an open revolt within National Socialist hardliner factions in Eastern Europe.\n\nWithout foreign support and only defended by hastily-formed militias, RL Baltikum has little chance to resist occupation."
WORLD.18142.a: "The Reichsländer's last desperate attempt to survive in a changed world."

WORLD.18144.t: "The New Millennium peace broken"
WORLD.18144.d: "Regions of Nigeria and Cameroon are once again plunged into chaos as the popularly dubbed “New Millennium Peace” was broken yesterday by one of the warlords. From the islamic fundamentalists in the northern regions to the southern remnants of the old regime led by Muhammadu Buhari the sound of gunfire is ever so present and the KdN’s hope for peace in the region is thwarted once more.\n\nThe Nigerian civil war is an ongoing conflict that has plagued the already unstable region since 1983. When a coup happened that ended the first republic and installed a general - Muhammadu Buhari to power; first as a sporadic series of minor conflicts between a couple of radical contingents against the state troops, but it reached its current state in the late 1999. Fearing a global immigration crisis, KdN has pushed for a temporary peace and all sides agreed to cease firing at the new year’s eve but it seems now, one year later that no peaceful means to end the war had been made. "
WORLD.18144.a: "The Tragedy!"

WORLD.18145.t: "Alexander Falk as Inspector General of Mauritius"
WORLD.18145.d: "In the complicated world of the Mauritius Special Economic Zone, the Inspector General serves as the administration’s leader, and has the arduous task of linking Germania, the local government and the Island’s web of corporations together.\nSince the Zone’s establishment, the tradition of selecting one of its most prominent shareholders for the position has been upheld.\nAs expected by observers, the current Inspector General of the \"Sonderwirtschaftszonengeneralinspektions-und-Aufsichtsbehörde\", the Bureau tasked with overseeing the Special Economic Zone, Reinhard Siekaczek, has now been replaced by Weltnetz entrepreneur Alexander Falk.\nFalk is regarded as a major figure in the so-called New Economy and the digitalisation of Germany, specializing in providing internet service to millions of customers."
WORLD.18145.a: "As long as the profits continue..."

WORLD.18146.t: "Siekaczek continues Mauritian Leadership"
WORLD.18146.d: "In the complicated world of the Mauritius Special Economic Zone, the Inspector General serves as the administration’s leader, and has the arduous task of linking Germania, the local government and the Island’s web of corporations together.\nSince the Zone’s establishment, the tradition of selecting one of its most prominent shareholders for the position has been upheld.\nAs expected by observers, the current Inspector General of the \"Sonderwirtschaftszonengeneralinspektions-und-Aufsichtsbehörde\", the Bureau tasked with overseeing the Special Economic Zone, Reinhard Siekaczek, has held onto his position despite numerous calls for a leadership change in recent weeks, with Mauritius most influential corporate entities denying a change in leadership, in favour of Siekaczek."
WORLD.18146.a: "As long as the profits continue..."

WORLD.18147.t: "Leo Kirchner as Inspector General of Mauritius"
WORLD.18147.d: "In the complicated world of the Mauritius Special Economic Zone, the Inspector General serves as the administration’s leader, and has the arduous task of linking Germania, the local government and the Island’s web of corporations together.\nSince the Zone’s establishment, the tradition of selecting one of its most prominent shareholders for the position has been upheld.\nAs expected by observers, the current Inspector General of the \"Sonderwirtschaftszonengeneralinspektions-und-Aufsichtsbehörde\", the Bureau tasked with overseeing the Special Economic Zone, Reinhard Siekaczek, has now been replaced by Media proprietor Leo Kirch.\nLeo Kirch is known to rarely seek public attention, yet is highly influential and has greatly contributed to the television industry in Europe."
WORLD.18147.a: "As long as the profits continue..."

WORLD.18150.t: "2002 Mount Etna Eruption"
WORLD.18150.d: "News coming from the Italian Island of Sicily depict a beautiful-yet-devastating event:\nMount Etna has erupted!\nVolcanologists have defined this happening as \"The Perfect Eruption\", and is also considered one of the most explosive ones of the last 100 years.\nThe Geological event started between the night of the 26 and the morning of 27 October.\nA strong seismic crisis began on the southern and northern slopes; on the latter slope, two buildings used as restaurants and hotels were destroyed by the earthquakes, luckily, there were no victims but some towns suffered damage.\nThe Eruption has been visible even from space, and volcanic ash arrived even on Northern African Coasts.\n Of great interest Is the formation of two new craters, One at 2750 meters and the other at 2800 meters.\n\nBesides the damage, it was a marvelous geological spectacle that was observed from every corner of the Mediterranean."
WORLD.18150.a: "Earth never ceases to amaze its sons!"

WORLD.18152.t: "Serbia Leaves the Europäische Pakt"
WORLD.18152.d: "The drastic Reforms implemented by the German Government have sent shockwaves across Europe. Whilst some nations welcome the Democratisation of the Europäische Pakt, others, most notably Serbia, have condemned Speer Jr.'s Leadership. This has now been taken to its extreme - with Mirko Jović announcing Serbia's immediate withdrwal from the Europäische Pakt.\nConsidering Serbia's reliance on trade with the Europäische Pakt, many consider an immediate government crisis in Serbia impending. Wether this will end in Isolation, a revolution or a shift torwards another Great Power remains to be seen."
WORLD.18152.a: "Will the Jović Regime Endure this?"

