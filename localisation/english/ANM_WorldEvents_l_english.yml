WORLD.18112.t: "The Volkshalle Bombing"
WORLD.18112.d: "Grim news are coming from the capital of the Greater German Reich. Germanias most recognizeable site, the Volkshalle, planned by Albert Speer Senior himself, has been attacked by armed terrorists.\nDuring the annual public holiday on the death of Führer Speer Sr., a large celebration was held within the Volkshalle. However, masked gunmen opened fire on the attendees, and followed by detonating suicide vests, killing hundreds, possibly thousands of civilians in the process. Some are saying that this is the deed of the so called SS-Werwolf, a remnant Burgundian terrorist force from the times of Heinrich Himmler, but a official government response is still missing.\nImages of smoke columns rising above the Germanian skyline and the burning Volkshalle have recieved worldwide attention.\n\nWith the most devastating terrorist attack in history, the feeling of invincibility and hope, following the beginning of the 21st century, has gone out with a bang - and in its place, fear of the future to follow."
WORLD.18112.a: "Truly Shocking."
WORLD.18112.b: "With a vile attack on our people, the SS reveals itself."

WORLD.18113.t: "Angela Merkel wins German Elections!"
WORLD.18113.d: "For the first time in seventy years, free elections have been held in Germany. With the dissolution of the NSDAP, and the self-abolition of the Führer title, Albert Friedrich Speer has retired, with his goal of German democratization complete.\n\nA coalition of the major pro-democratic parties, led by Angela Merkel’s Liberal-Democratic Party, has succeeded in gaining an absolute majority, leading to Angela Merkel taking the office of chancellor. Merkel, notable for being the first female head of government in German history, is a staunch supporter of de-nazification, further liberal reforms within Germany, and the restructuring of German society away from National Socialist influences. She enjoys special popularity among the German youth, with her being described as the ‘voice of the new Germany’. \nMuch work lies ahead of the new Government. The Republic has existed for merely a few months, and key issues, such as the restoration of German reputation on the International stage,are still left to be dealt with."
WORLD.18113.a: "Germany takes a step into the future."

WORLD.18114.t: "Joseph Fischer wins German Elections!"
WORLD.18114.d: "For the first time in seventy years, free elections have been held in Germany. With the dissolution of the NSDAP, and the self-abolition of the Führer title, Albert Friedrich Speer has retired, with his goal of German democratization complete.\n\nA coalition of the major pro-democratic parties, led by Gerhard Fischers Social Democrats, has succeeded in gaining an absolute majority, leading to Joseph \"Joschka\" Fischer taking the office of chancellor. Fischer, an advocate of expansion of the declining welfare system, further autonomy to the German territories in the east, and strict denazification, has gained his main voting base from the urban population and various minorities, being perceived as a supporter of the rights of those left behind by the Mußgnugite Regime.\n\nMuch work lies ahead of the new Government. The Republic has existed for merely a few months, and key issues, such as the reform of the Europäische Pakt and the structure of the young state itself are still left to be dealt with."
WORLD.18114.a: "After half a century, Germany is free."

WORLD.18115.t: "Helmut Kohl wins German Elections!"
WORLD.18115.d: "For the first time in seventy years, free elections have been held in Germany. With the dissolution of the NSDAP, and the self-abolition of the Führer title, Albert Friedrich Speer has retired, with his goal of German democratization complete.\n\nKohl, a strong supporter of European Unity, the implementation of a federal system within Germany and the former Reichsländer in the east, and denazification of society, has gained his main voting base from the liberal German middle class, being perceived as a figure of opposition against the Mußgnug Regime, and as a visionary thinker for the German future.\n\nMuch work lies ahead of the new Government. The Republic has existed for merely a few months, and key issues, such as the end of National Socialist influence, the restoration of German reputation on the International stage, the reform of the Europäische Pakt and the structure of the young state itself are still left to be dealt with."
WORLD.18115.a: "Germany, and Europe, enter a new era."

