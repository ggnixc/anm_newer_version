WORLD.18128.t: "The Prachtstraße Incident"
WORLD.18128.d: "Shocking events have occured in the capital of the Greater German Reich.\nWith the escalation of the pro-democratic movement, the protest along the so-called Prachtstraße, the enormous boulevard in front of the Volkshalle by reformist activists has come to a bloody end.\nWith the military violently crushing the non-violent protestors, casualities are within the hundreds, and all across the nation, the movement has been eliminated via coordinated crackdowns.\nFührer Speer, who has been indicated to show sympathies for the protestors and the reformist cause, appears absent. Most of the party's leading reformist figures have been placed under house arrest or demoted for defending the protestors, and it seems as if Germany's true political control now lies within the hands of the conservative NSDAP leadership."
WORLD.18128.a: "Worrying News from Germania. Hopefully this will not affect the Pakt."
WORLD.18128.b: "A controversial step, but necessary."
WORLD.18128.c: "Is there any hope for German democracy?"
WORLD.18128.e: "Another defeat to the liberal menace."

WORLD.18129.t: "Günther Deckert becomes Führer"
WORLD.18129.d: "Günther Deckert, the leader of the hardline-conservative faction calling for a "return to Hitler's Germany values" that came to power recently has gave a speech outside the entrance to the Reichstag where he announced his vision as a Führer.\nIn a scathing speech, he claimed that economic liberalization "harms the spirit and weakens the Aryan people" and that today's Germany is "a shame compared to its glorious past under Adolf Hitler".\n\nDeckert has criticized countless times processes he said are "erasing the identity of the nation" and he has controversial statements to say the least such as a call for returning to using the call ''Heil'' with the name of the Führer, like ''Heil Hitler'' was used before the 1960s instead of the currently used ''Heil Germania''.\n\nThe polarization he brings has acquired him plenty of rivals that call him a "traitor" by his fellow party members and a "reactionary" by youth organizations. "
WORLD.18129.a: "A return to the 50s?"

WORLD.18130.t: "Martin Mußgnug becomes Führer"
WORLD.18130.d: " "
WORLD.18130.a: " "

WORLD.18131.t: "The Dissolution of the NSDAP"
WORLD.18131.d: "In a turn of events expected by none, the German Government under Albert Friedrich Speer has announced the self-dissolvement of the National Socialist German Workers Party, the NSDAP, dismantling the major force of National Socialism within Germany.\n\nAfter a drastic purge of Hitlerite and Speerite hardliners following the events of the Grand Plaza Occupation in Germania, and a failed military coup in response to vast reform programms by the Führer and his cabinet, it seems as if the campaigns of so-called Offenheit and Umgestaltung, Openness and Restructuring, have indeed come into fruition. Against all odds, Germany has abandoned the path of fascism. \nThe void left by the extremely powerful party is still to be filled, and observers expect new political movements to reveal themselves. While many in Germany view it as a highly controversial decision, international reactions have been largely positive, with the USA congratulating Germany on a 'step torwards the future'. Already, swastikas, party flags and monuments are torn down across the nation by celebrating protestors, as reports of violence and tensions are coming in from more conservative areas. \n The Consequences throughout the German Sphere in Europe remain to be seen."
WORLD.18131.a: "The curtains crawl on National Socialism."
WORLD.18131.b: "A new Germany rises."

