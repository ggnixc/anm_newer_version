WORLD.18161.t: "The Zhongtou Crisis"
WORLD.18161.d: "The City of Nanjing and the Legislative Yuan are in a terrible mess today. The FSA and Nanjing Metropolitan Police has announced having arrested several members of the Legislative Yuan and senior executives of Zhongtou (CENTRAL INVESTMENT HOLDING CO. LTD.), on charges of financial fraud, disruption of financial order and bribery.\n\nJudging from the previous investigation track, the scope of impact is bound to extend to multiple former KMT party assets, as well as senior officials of finance and national security, including the Ministry of Finance and “No.435”.\n\nFormer KMT party assets, like the Zhongtou Company, Huaxin Bank and China Development play an important role in the City of Nanjing, and are also popular in Korea AEZ, Japan, and the U.S. secondary market. Any carelessness will make the financial markets in East Asia - even the Pacific Financial Rim - face a collapse of confidence."
WORLD.18161.a: "The day Ouroboros stops."

WORLD.18162.t: "NSE Index Crash"
WORLD.18162.d: "As the Zhongtou Case is becoming more and more severe in politics, the great reckoning upon former KMT assets has become the first topic in Asian economic circles. The freezing of the investment market and the uncertainty of the regulatory authorities have led to the large-scale flight and transfer of funds from the three major sectors of infrastructure, energy and insurance. The NSE index, which has been in a depressed state since the case was made public, fell sharply today.\n\nCommentators say that China's efforts to rescue the market with financial funds have already failed, and the "concern" expressed by the Bank of Japan and the Ministry of Finance has not helped the market regain confidence in "Asian Synergy". Although the market is generally pessimistic about the NSE Index's rebound, the NLP's opposition commentators who have always been active in Guangdong have kept unexpected silence."
WORLD.18162.a: "Earth’s gravity, men’s freefall."

WORLD.18163.t: "Merrill Lynch Conducts Asset Liquidation"
WORLD.18163.d: "With the comprehensive contraction of Chinese and Japanese capital under the economic depression and the collapse of financial institutions in the Korea AEZ, an unnamed insider said that Merrill Lynch Asia recently conducted a large-scale asset liquidation at a low price.\n\nIt is reported that Merrill Lynch's investment and product design in the Asia Pacific region have tended to radicalize since the new CEO took office in 1998. As a Wall Street company has taken a share of the spoils in the Asia Pacific market, the company's dividend has reached a new high.\n\nAlthough the Asian bear market has been significant, the news of full asset liquidation still exceeded the market consensus. It is estimated that the losses caused by the one-time rapid asset clearing will be huge, which also makes the media worry about the actual situation of Merrill Lynch's balance sheet and the status of relevant market maker transactions."
WORLD.18163.a: "East Wind to Wall Street."

WORLD.18164.t: "Bank of Chosen AEZ Declares Bankruptcy"
WORLD.18164.d: "Today, the Bank of the Chosen Autonomous Economic Zone announced bankruptcy and reorganization due to "deterioration of debt structure". This institution has long managed the cooperation of local consortia and is also the long-term liquidator of Asian countries' capital exchange.\n\nWith its highly liberalized policy, Chosen has become an important node of commodity futures and forex trading at the turn of the century and has attracted a large number of enterprises and shipping companies to register. After the Nanjing stock market crash, the support of the Bank of the Chosen AEZ was generally regarded as effective control over crisis spillover - until today.\n\nAEZ authorities and the Joint Conference on Chosen Peninsula development promised the media that an emergency hearing would be held. But the market sentiment is widely believed to have crossed the Rubicon River."
WORLD.18164.a: "Time for a margin call."

WORLD.18165.t: "The 2nd German Civil War"
WORLD.18165.d: "Since the bombing of the Volkshalle, the German reich fell deeper and deeper into a crisis which consumed all parts of its society. As the state was helpless to stop terrorism, political radicalisation and massive unrest, voices of discontent grew within the NSDAP.\nAfter an unsuccessfull coup, the central government in Germania has lost control over much of the country to a loose alliance of dissidents within the party and military.\nArmed militias and insurgents have filled the power vacuum across the nation, dozens of factions battle for influence over Germany's regions.\n\nMeanwhile, the Europäische Pakt has collapsed, the eastern territorries of the Reich have begun to prepare for a Soviet Invasion, and armed themselves with portions of their former overlord's nuclear arsenal.\nThe remaining stockpile has been transfered to Germania itself and various former allies, as Germany, just like it did after the death of Hitler, falls into civil war."
WORLD.18165.a: "After 4 decades, war returns to Germany."

WORLD.18170.t: "Duce Baghino Steps Down From His Position"
WORLD.18170.d: "Earlier in the morning, the now former Duce of Italy, Francesco Giulio Baghino has made a decision that was long expected from the international community and his colleagues - his formal resignation form the position of Duce was ratified and accepted by the Grand council of fascism and from tomorrow Cesco Baghino will no longer be the Italian Duce citing old age and frail health as the main reasons.\n\nHe has been the Italian Duce since the removal of Almirante from that position back in 1987 but his reign over the Kingdom was mostly limited to being that of a figurehead and a puppet for the PNF to preserve the status quo in the then almost collapsing state.\n\nUncertainty is what awaits Italy as major PNF players are now converging in the Council's palace to debate over the upcoming months who exactly will succeed the former Duce."
WORLD.18170.a: "Le cose finiscono, ma i ricordi durano per sempre."

WORLD.18173.t: "Brazil Wins the 2002 World Cup!"
WORLD.18173.d: "The 2002 FIFA World Cup that was hosted in Japan has officially ended with a Brazilian victory over the German Reich. The result was 2 - 0 when the referee sounded his whistle for the last time on the grass of the Yokohama International Stadium, throwing the Brazilian national team and the people of Brazil in a state of euphoria.\n\nThe Golden Boot was also won by a Brazilian, their best goalscorer and in turn the tournament's - Ronaldo while the Reich's goalkeeper Oliver Khan was proclaimed the tournament's best goalkeeper. With this World Cup coming to a close, soccer fans around the world will for now need to wait until 2006 when the 18th World Cup will be hosted in Mexico."
WORLD.18173.a: "See you all in four years."

WORLD.18174.t: "France Wins the World Cup!"
WORLD.18174.d: ""
WORLD.18174.a: ""

WORLD.18200.t: "West Thrace Declares Independence"
WORLD.18200.desc: "As the hysteric Thracian Crisis finally draws to a close, a new state headed by Muslim separatists — the Republic of West Thrace — has emerged in southeastern Europe. Sightings of Turkish troop movements, captured via helicopter, have led to rumors that the separatists may be connected to or aided by the Ankara administration, though these facts have not yet been verified. The Bulgarian government has yet to issue a public statement.\n\nIt remains to be seen how Ahmed Dogan, the leader of the newly founded republic, plans to rule. His inner-party coup and removal of the previous leader of the MNODvB, Necmettin Hak, have certainly shrouded the leader's motivations and goals in mystery."
WORLD.18200.a: "The need for freedom is inherent in human nature."
WORLD.18200.b: "The Jackboot’s hold over Europe grows weaker..."
WORLD.18200.c: "Has Bulgaria fallen so far?"

WORLD.18201.t: "Kampuchea launches 'Operation Chenla'"
WORLD.18201.desc: "Heightening the decades-long conflict raging across the Strung Treng province, the government of Kampuchea has, as of yesterday evening, launched what it calls ‘Operation Chenla’ — an aggressive effort to resolve “continued violations of Khmer sovereignty by the treacherous Lao government”. Eschewing a formal declaration of war, Kampuchean troops have already moved to occupy the island of Phu Quoc, a de jure territory of Vietnam. \n\nInternational reactions are mixed. As Indochina is thrown into chaos, the nations of Thailand and Burma have formally backed Kampuchea. Hindustan, China, and Langkasuka denounced the incident as a gross act of unprovoked conflict by the Kampuchean government, while the regional giants Japan and Manchuria have yet to comment. The consequences of a war between two members of the CPS have yet to be seen, although observers are watching the conflict with keen interest."
WORLD.18201.a: "A match lit on a pile of tinder."

WORLD.18202.t: "Kampuchea wins the Chenla War"
WORLD.18202.desc: "In a shocking result, the “Chenla War” has come to an end, with the nation of Kampuchea seizing its claimed territories of Stung Treng and the island of Phu Quoc by force. Both Laos and Vietnam have officially condemned the actions of the Kampuchean government, while Japan, to the aforementioned nations’ disdain, has remained stoically silent on the issue. \n\nKampuchean president Khieu Samphan has declared a week of public holidays to celebrate the nation’s “great victory”, while promising to reclaim other “lost Khmer territories” — which many observers have interpreted as Kampuchea’s former western provinces, now de jure parts of Thailand. As both China and Hindustan condemn the proceedings, it has become increasingly apparent that Japan, in the end, will serve as the final arbiter of the conflict."
WORLD.18202.a: "The balance shifts."

WORLD.18203.t: "Kampuchean Government Overthrown"
WORLD.18203.desc: "As many expected from the outset of the joint Vietnamese-Laotian invasion of Kampuchea, Kampuchean forces have, as of this morning, been repelled from Strung Treng and Phu Quoc by the numerically-superior invading force. As a result, the Kampuchean Social Republican Party — a Chinese-backed grouping of anti-Samphan rebels — has taken advantage of the chaos to stage a complete overthrow of the Kampuchean government  Khieu Samphan has fled to Bangkok, while the new transitional government has demanded his extradition back to Phnom Penh to try him for the many crimes committed under his tenure. \n\nThailand and Burma have both expressed extreme discontent, likening Samphan’s ousting to a “sinister Chinese plot”. Japan, meanwhile, has called for the new government to allow the voice of the people to take precedence, a move largely interpreted as evidence of dissatisfaction with the Sinophile leadership of the KSRP."
WORLD.18203.a: "The snake finally eats its own tail."

WORLD.18204.t: "Joint Invasion of Kampuchea"
WORLD.18204.desc: "The newfound peace on the Indochinese peninsula was interrupted today by the invasion of Kampuchea by Laotian, Vietnamese, and Thai forces, heavily aided by the ROCAF and IJA, in what has been described as a joint GEACPS intervention. This sudden invasion follows a reported Kampuchean incursion into Thailand’s eastern territories, which was quickly repelled by Thai forces as they advanced onto Phnom Penh.\n\nLaos and Vietnam would also join, hoping to reverse their recent losses in the Chenla War, and the three armies would quickly take over the country with ease as the armed forces crumbled under the onslaught of rebel forces and the three armies. Khieu Samphan has fled to Jakarta along with much of his cabinet while the nation has been put under an interim government, led by the avowed Japanophile Keat Chhon, who has also maintained links with the Thai. Elections have been set for mid-April as the interim government will stabilize the country’s economy and disarm any remaining rebel groups."
WORLD.18204.a: "He who lives by the sword dies by the sword."

WORLD.18205.t: "Khem Veasna Inaugurated as President"
WORLD.18205.desc: "With the recent collapse of Khieu Samphan’s government in the disastrous Chenla War, the Kampuchean Social Republican Party, a grouping of anti-Samphan rebels, took over the nation, hoping to reverse the disasters of the former ministry. Today, the National Assembly has convened and elected Khem Veasna, a Khmer-Chinese politician and prominent KSRP leader as the new President of Kampuchea.\n\nNoted alumni of the Academia Sinica in Nanjing , Veasna is an ardent sinophile and adherent of the Chinese government’s official ideology of Chen Gongbo Thought and is expected to be cordial towards the Vietnamese and Laotian governments, while maintaining cool relations with Thailand. China, Vietnam, Laos, Hindustan, and Langkasuka have all congratulated the new President on his ascension, while the reception from Japan, Thailand, and Burma has been reportedly cool, in light of the new President’s overt connections to China."
WORLD.18205.a: "A visionary steers a bold course for Kampuchea."

WORLD.18206.t: "Mario Covas Resigns"
WORLD.18206.desc: "In a somber press conference broadcast across the nation this morning, Brazilian president Mario Covas announced that he would be resigning from the office following a bladder cancer diagnosis. First elected in 1995 following the scandal-ridden Martins administration, Covas embarked on a grand program of healing the nation and restoring public trust in government. \n\nAmid a slew of well-wishes from the public and the leaders of allied nations, Covas leaves behind a nation now struggling to find its footing again. The foundation for a bright future has been laid and it now falls to vice-president Geraldo Alckmin to continue the work."
WORLD.18206.a: "Can Brazil handle one more crisis?"

WORLD.18207.t: "Geraldo Alckmin Elected"
WORLD.18207.desc: "Surprise abounded in Brazil today as incumbent president Geraldo Alckmin of the PSD managed to beat the odds by securing another term in office. Alckmin originally assumed office after the shock resignation of Mario Covas and was widely expected to serve only as an interim president until the next elections. \n\nNow with more legitimacy in the eyes of the public, the former anesthesiologist will now attempt to finish the work started by Covas while pursuing his own pro-business liberal agenda while uniting the nation through political honesty and delivering results."
WORLD.18207.a: "The PSD secures a new lease on life."

WORLD.18208.t: "Leonel Brizola Elected in Brazil"
WORLD.18208.desc: "Leonel Brizola makes history after bringing the PTB to victory once more after decades in opposition. His sweeping platform promises nationalizations, universal healthcare, labor rights expansion, and agrarian reform. Internationally, he pledges alignment with the USSR, China, India, and Mexico—a direct challenge to Western dominance. \n\nBrazil's workers and peasants flood the streets in celebration, while elites watch nervously. Global reactions are sharply divided: Moscow, Delhi, and Mexico City hail a "new era," Washington offers tepid recognition, and Germania denounces it as "Judeo-Bolshevik surrender.""
WORLD.18208.a: "A caudillo rejuvenated."

WORLD.18209.t: "Enéas Carneiro Elected in Brazil"
WORLD.18209.desc: "The ballots are counted—Brazil enters the new millennium under firebrand nationalist Enéas Carneiro of PRP. Defeating a fractured opposition, including humiliated incumbent Geraldo Alckmin, his victory shocks the world. Leonel Brizola of PTB vows resistance: "They shall not pass!" \n\nCarneiro pledges military expansion, nuclear ambitions, and alliances with Germany, Japan, and Italy. His radical agenda: nationalize industries, impose traditionalist education, and enact eugenicist laws. Global reactions split—Washington and Moscow condemn the result, while Axis powers cheer. Protests and celebrations erupt nationwide as Brazil’s future teeters on the brink."
WORLD.18209.a: "The Latin light begins to dim."

WORLD.18210.t: "Silvio Santos Elected in Brazil"
WORLD.18210.desc: "In a stunning victory, media mogul Silvio Santos of PSP wins Brazil’s presidency, capitalizing on public disgust with corruption. The self-made billionaire ran an unorthodox campaign—tossing cash at rallies, vowing to "run Brazil like SBT," and promising economic lotteries while slashing bureaucracy. \n\nHis PSP, desperate to shed its scandal-ridden past, embraced him as a clean outsider. Supporters cheer his anti-establishment pragmatism ("We’ll trade with anyone but Nazis!"), while critics fear rule by game-show theatrics. As celebrations erupt nationwide, one thing is clear: Brazilian politics will never be the same. "Baú da Felicidade" now holds the nation’s future."
WORLD.18210.a: "A new face, for a new populism."

WORLD.18211.t: "Roseana Sarney Elected in Brazil"
WORLD.18211.desc: "Roseana Sarney of UDN wins Brazil’s election, embodying her party’s struggle between tradition and modernity. The businesswoman-turned-politician campaigned as both a liberal reformer and guardian of conservative values—promising economic revitalization while vowing to crush "leftist land invaders."\n\nWashington warmly congratulates her victory, signaling hopes for closer cooperation. Domestically, reactions split: entrepreneurs cheer her pro-market stance, while hardliners demand crackdowns. The weakened UDN pins its revival on her ability to balance old oligarchs and reformists. As the Sarney dynasty begins a new chapter, all wonder—will she modernize Brazil or deepen its contradictions?"
WORLD.18211.a: "Same old, same old."

WORLD.18212.t: "Restoration of the Russian Monarchy"
WORLD.18212.desc: "The Tver Conference has concluded, and with it, the restoration of the monarchy in Russia. In a gilded Orthodox ceremony, the new Grand Duke of All Rus’ was crowned, dissolving the provisional government and ushering in an era anchored in imperial tradition.\n\nDmitry Vasilyev, an Orthodox hardliner and fanatical nationalist, has been appointed as head of the new government. Backed by monarchist clergy and Blackhundredist ideologues, his government pledges the national and spiritual rebirth of Holy Rus’, seeking to reshape society under divine authority.\n\nThe German Reich has issued a warm message of congratulations, hailing the new order as a “bulwark of tradition in an adrift world.” In contrast, most governments beyond the Pakt condemned the restoration as reactionary authoritarianism and warned of a new wave of repression across the East."
WORLD.18212.a: "When monarchism meets Nazism, things get... complicated."

WORLD.18213.t: "The Tver Conference Collapses"
WORLD.18213.desc: "After the mysterious death of collaborationist leader Dmitriy Vasilyev, the Tver crisis descended into chaos. Delegates spiralled into infighting until nearby Wehrmacht units intervened to restore order, leaving the provisional government leaderless.\n\nIn the resulting power vacuum, Alexey “Dobroslav” Dobrolovsky marshalled a coalition of pagan-nationalists and occult ideologues. Embracing radical Rodnover mysticism, ultranationalism, and rejecting both Christianity and the imperial legacy, he decreed an “Aryan solar revival,” “ancestral rites,” and the “purification of the steppe from Abrahamic corruption.”\n\nDespite having extended formal recognition, even the Reich is said to be uneasy with the development. Some scholars are reportedly interested in the new regime, while the civilian administrators warn of long-term instability and international fallout."
WORLD.18213.a: "Nazis, mystics, and Slavic druids — what could go wrong?"

WORLD.18215.t: "Pat Buchanan inaugurated President of the United States"
WORLD.18215.desc: "In a shocking outcome for American politics, Republican candidate Pat Buchanan has won the United States presidential election, narrowly beating out his Democrat opponent. Buchanan’s rise to the Oval Office has caught political insiders with disbelief as he mobilized a grassroots campaign of conservative activists and far-right donors to a successful primary challenge against incumbent President Robert Dole, who had been embroiled in controversy amid the ongoing financial crisis gripping the nation.\n\nIn a stunning reversal of political trends, Buchanan’s victory signals a shift toward isolationism, protectionism, and nativism. As the man marred by controversy takes the highest office of the land, Mr. Buchanan delivered a fiery inaugural speech, vowing to “restore an America fundamental to Christian values.” Many commentators are already drawing parallels to former President Nixon’s controversial presidency. It remains to be seen whether Buchanan’s victory will have serious repercussions in a very dynamic decade for American politics."
WORLD.18215.a: "A Republic, Not an Empire"

WORLD.18216.t: "Robert Dole Re-inaugurated President of the United States"
WORLD.18216.desc: "In spite of innumerous challenges, incumbent President Robert Dole has been re-elected to the office of president under the Republican ticket. Facing a uniquely strong primary challenger from arch-conservative Pat Buchanan, while also confronting an immense popularity deficit from his handling of the February financial crisis, Dole’s victory has been hailed as one of the most surprising upsets in modern political hisotry.\n\nIn his inauguration speech, Dole vowed to continue fighting for “common-sense conservative ideals” seemingly a appeal to the right, while also championing the importance of bipartisan coopration. Dole and his Vice President nominee, Pete Wilson, have resumed their work in the administration, returning to the duties of office as the country remains in a state of semi-crisis."
WORLD.18216.a: "A Better Man. For a Better America"

WORLD.18217.t: "George Mitchell inaugurated President of the United States"
WORLD.18217.desc: "After a heavily contested Primary and an intense campaign season, Democratic candidate and Senate Majority Leader George Mitchell has won the United States presidential election against his Republican opponent. One of the more deep-seated establishment liberals within his party, Mitchell’s candidacy, while anticipated, was not a forgone conclusion. Although facing the full might of the Progressive Caucus under Senator Thomas Harkin, he went on to win the primary and the general election, focusing on unity and renewal.\n\nAt his inaugural address, Mitchel assured conservatives and liberals of his commitment to work towards bipartisan and unifying goals. Mitchell has proclaimed that the process of healing from the country’s recent financial woes will begin day 1 of his presidency. Though not an exciting choice to the more progressive members of the Democrat base, Mitchell’s presidency is looked upon optimistically by the public, as he remains one of the more trusted figures in American politics."
WORLD.18217.a: "No conflict too big, no problem too small"

WORLD.18218.t: "Thomas Harkin inaugurated President of the United States"
WORLD.18218.desc: "After a tense primary and heated campaign season, Thomas Harkin of the Democratic Party has won the United States presidential election against his Republican opponent. Hailing from the Midwestern state of Iowa, Harkin seeks to restore a more traditional Democratic party platform, focusing on labor and agricultural issues, with a progressive tinge on the social spectrum.\n\nIn his inauguration address, Harkin promised to bring his regional brand of “prairie progressivism” to the nation as a whole. Harkin’s victory has reignited the progressive wing of the Democratic Party, a faction that has historically butted heads with more liberal elements since the presidencies of Burton, Reagan, and Eagleton. To the cheers of many across the nation as he prepares to take office, Harkin has promised to focus on America’s wretched and underrepresented, pledging to fight a war against the country’s societal ills."
WORLD.18218.a: "Harkin, doing the job right"

WORLD.18219.t: "FKgP Wins 1998 Hungarian Elections"
WORLD.18219.desc: "The 1998 Hungarian election has brought about the victory of the Independent Smallholders’ Party, an outcome that comes as a surprise to few observers. The party, known for its Christian, conservative, and agrarian values, has managed to sway a significant majority of the population with its promises of stability, land reform, and emphasis on traditional values, enabling it to form a government. \n\nAppointed as the new Minister-President is party leader Göncz Árpád, a seasoned and well-liked political veteran, who has promised to “Serve those who have no servants”. While the prospect of radical changes and sweeping reforms may have diminished with this outcome, there appears to be a prevailing confidence in the new government's ability to uphold and reinforce the nascent democracy."
WORLD.18219.a: "A small step forward is a step nonetheless"

WORLD.18220.t: "PSZP Wins 1998 Hungarian Elections"
WORLD.18220.desc: "The 1998 Hungarian elections, widely regarded as a pivotal moment in the country's history, have marked the beginning of a new era with the triumph of the youthful liberals of the Party of Liberty. Fueled by a yearning for authentic transformation and national rejuvenation, the party's newly established government appears to place more emphasis on zeal than on experience, as evidenced by their leader and Hungary’s newest Minister-President, the 38-year-old Szent-Iványi István. \n\nThe party advocates for the dismantling of previous corporatist policies and the dirigisme-based economic model, advocating for the implementation of free-market capitalism and the liberalisation of the economy, including, to the surprise of many, the strengthening of bonds with the country's Europakt allies."
WORLD.18220.a: "Noblesse oblige"

WORLD.18221.t: "MSZDP Wins 1998 Hungarian Elections"
WORLD.18221.desc: "In a significant upset, the 1998 Hungarian elections have resulted in the victory of the Hungarian Social Democratic Party, marking the first time a left-wing government has taken power in the country since 1919. Many observers remain puzzled by the outcome, with some attributing it to a wave of discontent with the status quo that swept over the country in the aftermath of the former ruling coalition’s dissolution, a wave that the party appears to have successfully capitalized on to secure their victory. \n\nThe party has nominated the popular and well-known representative Király Zoltán as Minister-President - although many suspect he is intended to serve merely as the face, and not the true head of the new government, someone to maintain a facade of unity while factions vie in the shadows. For the time being, however, the nation still grapples with coming to terms with this sudden and drastic change."
WORLD.18221.a: "Perhaps the future can reconcile the present and the past"

WORLD.18222.t: "Slovak 1999 elections begin!"
WORLD.18222.desc: "As 1999 unfolds, the Slovak Republic prepares for what is, on paper, its first contested presidential election in decades. The three legal parties, which have formed an unyielding coalition for over 60 years, face a defining moment. The conservative faction of the Slovak National Party (SNS), led by President Peter Dubček, hoped to maintain its grip on power, while on the other hand, the radical faction, under the leadership of Jozef Sasík, promised a more drastic shift. \n\nYet, beneath the political maneuvering, few believe in the genuine potential for change. The democratic process in Slovakia is little more than a farce designed to placate the population while the actual power remains firmly with Germania. The world watches closely, but for the Slovaks, this election may simply be another bitter reminder that the will of foreign powers binds their nation’s fate."
WORLD.18222.a: "A new face, yet the same chains"

WORLD.18223.t: "Peter Dubček Re-Elected In The 1999 Slovak Elections!"
WORLD.18223.desc: "The results are in, and as expected, Peter Dubček has been re-elected as President of Slovakia in the tightly controlled 1999 elections. Despite years of criticism for his cautious policies and perceived subservience to the German Reich, Dubček’s stability platform appealed to a weary populace unwilling to gamble on radical change. \n\nAs the nation moves forward under his continued leadership, questions remain about whether Dubček will bring meaningful improvements or simply maintain the status quo as a reliable puppet of the Reich."
WORLD.18223.a: "Some things never change"

WORLD.18224.t: "Jozef Sásik Wins Slovak Elections With An Unexpected Turnaround!"
WORLD.18224.desc: "The 1999 party elections have concluded, and Jozef Sásik, representing the radical wing of the SNS, has claimed victory. Sásik’s fiery rhetoric and promises of asserting Slovak sovereignty resonated with the disillusioned populace, frustrated with years of stagnation under Peter Dubček’s cautious policies. \n\nAs Slovakia braces for this political shift, many wonder if Sásik’s leadership will deliver real change or plunge the nation into even more instability."
WORLD.18224.a: "Radicals never lead to anything beneficial"

WORLD.18225.t: "1999 Slovakian Elections Hampered Amidst Wartime Crisis!"
WORLD.18225.desc: "The chaos of the Third West Russian War spills into Slovakia, disrupting the scheduled 1999 elections. With resources strained and German attention diverted, the Slovak government postponed the elections, citing “wartime emergencies.“ The move sparked accusations of power-grabbing from Jozef Sásik, a militarist promising to rebuild Slovakia’s strength, while Peter Dubček called for calm and continuity. \n\nThe delay heightens tensions, with public trust eroding and whispers of German interference fueling discontent. Slovakia teeters on the edge of unrest as its people demand clarity and accountability amidst growing uncertainty."
WORLD.18225.a: "This will not end well"

WORLD.18226.t: "Dubček Re-Elected In Postponed 1999 Slovak Elections!"
WORLD.18226.desc: "Slovakia has finally held its long-postponed elections after months of delay caused by the Third West Russian War. Official results announced in Bratislava confirmed Peter Dubček’s victory, securing him another term as the nation’s leader. While state media lauded the outcome as a triumph of stability and Slovak “democracy,” many citizens remain unconvinced. \n\nDespite the formality of the process, the German Reich’s silent approval ensured Dubček’s continued leadership over the nation. His moderate approach, seen by some as pragmatic and by others as spineless, has secured his favor with the Reich but alienated those yearning for more autonomy. For many Slovaks, the election changes nothing — their future remains bound to Germania’s will."
WORLD.18226.a: "Another populace blinded by lies, it seems"

WORLD.18227.t: "Sasik Wins Postponed 1999 Slovak Elections!"
WORLD.18227.desc: "After months of delay caused by the Third West Russian War, Slovakia has finally held its long-postponed elections. Official results from Bratislava confirm Jozef Sasík’s surprising victory, signaling a potential shift in the nation’s political landscape. While state media hailed the election as a triumph for Slovakia’s democracy, many see Sasík’s rise as challenging the long-established order. \n\nThough the elections were heavily controlled by Slovakia's coalition of three legal parties, Sasík's radical rhetoric and appeal to those disillusioned with Dubček’s moderate approach won the day. With tacit approval from the German Reich, Sasík's victory nonetheless represented a crack in the facade of stability. \n\nIn the streets of Bratislava, the mood is tense. Some view Sasík’s leadership as the beginning of a new era, while others fear it could bring greater instability to the country."
WORLD.18227.a: "Radicals never lead to anything beneficial"

WORLD.18228.t: "Slovak Government Coup by Hlinka’s Guard!"
WORLD.18228.desc: "After years of delay, the promised elections for Slovakia never came, a casualty of the ongoing Third West Russian War and the government's emergency measures. The Slovak people, already exhausted and strained by the war’s toll, are pushed to their breaking point. Mass riots erupt in cities across the country as civilians, fed up with the broken promises and a government that refuses to listen, take to the streets in a desperate bid for change. \n\nAmidst the turmoil, Peter Dubček, once seen as a symbol of moderate reform, is tragically assassinated by the rioters, bringing the final nail in the coffin for the SNS. The Hlinka's Guard seized power in a swift coup 3 days later, overthrowing the government and instituting martial law. The junta vowed to restore order and bring about free elections at any cost, regardless of the consequences that may bring."
WORLD.18228.a: "How will Germania respond to this?"

WORLD.18229.t: "The First Democratic Election In Slovakian History!"
WORLD.18229.desc: "With the German defeat in the Third West Russian War and the Reich's inability to maintain its grip across the crumbling Europakt, Slovakia's fragile government fell to a coup d'état led by the Hlinka’s Guard. Despite their initial seizure of power, the Guard quickly yielded to German demands for stability. Under German supervision, Slovakia was allowed to hold its first truly fair national elections, a stark departure from its history of political manipulation. \n\nFor the first time in its history, Slovakia will host genuine democratic elections, free from external manipulation. The world watches with bated breath as the Slovak people prepare to determine their destiny in this historic moment of self-determination."
WORLD.18229.a: "Another victim freed from the claws of the Reich"

WORLD.18230.t: "The Reactionary Nationalists Secure The Slovak Election!"
WORLD.18230.desc: "In the wake of Germany's defeat in the Third West Russian War and the subsequent collapse of Slovakia's central authority, the Hlinka Guard orchestrated a coup d’etat and organized the first “fair“ elections in Slovak history. Amid growing public discontent and calls for a return to national pride, the Reactionary Nationalist party, SZS-D, led by Andrej Danko, emerges as the victor. Danko's platform, which champions traditional Slovak values, opposition to foreign influence, and rejection of liberal reforms, resonates with a populace yearning for stability and a revival of the nation's sovereignty. \n\nSZS-D's victory signals a shift toward a more insular, conservative Slovakia. Danko’s rhetoric and vision for a return to a “stronger“ Slovakia quickly gained traction as many sought a way out of the turmoil caused by foreign dominance, ushering in a new era of reactionary nationalism that promises a firm rejection of external interference and a return to perceived national glory. Whether this path will lead to proper stability or further divisions remains uncertain."
WORLD.18230.a: "We shall see if they rejuvenate the dead Slovak soul"

WORLD.18231.t: "The National Conservatists Victorious In The Slovak Elections!"
WORLD.18231.desc: "In the aftermath of Slovakia's collapse following Germany's defeat in the Third West Russian War, the Hlinka Guard organized the first “fair“ elections in Slovak history. Amid rising dissatisfaction with the chaotic military rule, the Slovak populace turned to Sergej Kozlik's party, SOŽ-K. Kozlik’s emphasis on Slovak cultural pride, traditional values, and the rejection of foreign interference resonates with voters desperate for stability and a return to national dignity. \n\nWith the Hlinka Guard stepping aside to allow for elections, SOŽ-K’s victory ushered in a period of cautious optimism. Kozlik’s platform promises a return to Slovak traditions, social unity, and pragmatic governance, drawing support from disillusioned citizens and elite segments. Though the new leadership offers hope for a more stable and self-sufficient Slovakia, the future remains uncertain as the nation rebuilds in the shadow of its past and the lingering influence of Germany."
WORLD.18231.a: "How will Germany react to this?"

WORLD.18232.t: "The Anocratic Party Will Lead Slovakia Forwards!"
WORLD.18232.desc: "Following Slovakia’s collapse shortly after the end of the Third West Russian war and the Hlinka Guard’s relinquishment of power, the first “fair“ elections took place, where the HzDS, led by Vladimir Mečiar, emerged victorious. Mečiar's focus on strengthening state authority and pragmatic governance appeals to a broad electorate tired of instability, with promises of a more flexible, less ideological government. \n\nHzDS's victory marks a shift towards Mečiar's vision of governance, raising questions about whether his anocratic approach will successfully navigate Slovakia's rebuilding process and address the nation's pressing challenges."
WORLD.18232.a: "Finally, an end to their misery"

WORLD.18233.t: "Dubček Re-Elected In The 2006 Slovak Elections!"
WORLD.18233.desc: "Jozef Sásik’s tenure as leader for 7 consecutive years has divided Slovakia deeply. His relentless push for remilitarization has drained resources from the struggling civilian sector, sparking widespread frustration among the population. As economic hardships persist and public services crumble, calls for change grow louder. \n\nPeter Dubček seizes the moment, campaigning on a promise of stability and prioritizing civilian needs. Disillusioned by Sásik’s militaristic policies, voters rallied behind Dubček, seeking a return to cautious reforms and focusing on improving everyday life. His victory signals a rejection of radicalism and a desire for steadier leadership."
WORLD.18233.a: "Return to the past?"

WORLD.18234.t: "Sásik Secures Victory In The 2006 Slovak Elections!"
WORLD.18234.desc: "After countless years of stagnation under Peter Dubček’s leadership, Slovakia faces mounting frustration over its economic struggles and subservience to the Reich. Dubček’s cautious approach, focused on appeasing Germania, has done little to alleviate growing discontent, with his reforms failing to deliver meaningful change. \n\nJozef Sásik, seizing the moment, emerges as the voice of a disillusioned populace. Campaigning on a platform of radical nationalism and promises of a stronger, more autonomous Slovakia, Sásik won the electorate. His fiery rhetoric and vision for a militarized, more autonomous state resonates with those yearning for decisive action. Sásik's victory marks a turning point for Slovakia, ushering in an era of heightened nationalism and ambitious policies. Whether his leadership will lift the nation or push it further into turmoil remains to be seen."
WORLD.18234.a: "A loud cry from a desperate populace"

WORLD.18235.t: "The Radicals Win The Slovak Elections In A Decisive Victory!"
WORLD.18235.desc: "After the collapse of Dubček's government, the Reich successfully diplomatically pacified Slovakia and organized national elections under its close oversight. These elections resulted in a decisive victory for the radical faction of the SNS, led by Jozef Sásik. \n\nSásik’s fiery rhetoric and uncompromising vision appealed to Slovakians disillusioned by years of political instability and economic stagnation. With promises of bold reforms and a renewed focus on national strength, his faction has galvanized a movement determined to chart a new course for Slovakia. \n\nThis election marks a significant shift in the country’s political landscape, as Sásik’s leadership promises to bring sweeping changes. The future of Slovakia now rests in the hands of an uncertain man."
WORLD.18235.a: "How could they be so delusional?"

WORLD.18236.t: "The Technocrats Win The Slovak Elections In A Close Tie!"
WORLD.18236.desc: "Following the Reich's pacification of Slovakia, national elections were held under strict oversight and heavy influence, resulting in the victory of the SNS's technocratic faction, led by Vladimir Chovan. This victory marks a subtle shift in the SNS's direction. As a proponent of modernization and administrative efficiency, Chovan seeks to reform Slovakia's stagnant governance while keeping it firmly under German influence. \n\nDespite this, many Slovaks harbor doubts about the sincerity of his promises or the extent of his autonomy from Germania. Some see this as a fleeting chance for meaningful change; others believe it’s merely a reshuffling of loyal puppets. Regardless, the Reich’s grip on Slovakia remains unyielding, ensuring that any reforms serve their interests above all else."
WORLD.18236.a: ""

WORLD.18237.t: "First “Fair” Elections In Slovak History?"
WORLD.18237.desc: "Following Germany’s defeat in the Third West Russian War against the USSR, Slovakia, which was deeply reliant on the Reich for economic stability, military support, and political guidance, collapsed shortly after the end of the war. The loss of their German overlord threw the country into chaos, with the central government unable to maintain order. Amid the turmoil, the Hlinka Guard seized control, establishing military authority to stabilize the nation and restore order. \n\nUnable to restore order themselves, the Reich, preoccupied with their own internal struggles, allowed Slovakia's first ”fair” elections in its history. The military junta's grip on power remains tenuous, and with the country on the brink of collapse, the prospect of new leadership provides a glimmer of hope — though the future remains uncertain."
WORLD.18237.a: "They deserved the justice"

WORLD.18238.t: "N.C. Coalition Government announces Resignation"
WORLD.18238.desc: "Yesterday, to the surprise of the Irish press, First Minister of the Northern Counties John Gorman announced the resignation of his government, with the support of the Ulster Democratic, Alliance and Republican Parties. Citing the Irish Government’s declaration of support in the 3WRW for Germany, Gorman said this support for Germany “would not be parroted by our coalition”. The shock resignation from Stormont comes as the latest pile of political pressure against Bertie Ahern’s Government in Dublin, which faces re-election in a month’s time.\n\nAhern’s Cabinet faces strong headwinds due to credible allegations of corruption against the Fianna Fáil party and Ahern personally, alongside the Government’s unpopular support for Germany in the 3WRW. The opposition in both Dublin and Belfast hopes to finally oust FF from power after over a decade of control, with Fine Gael and Labour running on a joint platform against them. However, FF’s grassroots support remains strong, and foreign intervention by outside powers is expected, as they hope Ireland may finally fall to their side."
WORLD.18238.a: "Bertie is holding on by a thread."

WORLD.18239.t: "Bertie wins another term for FF"
WORLD.18239.desc: "With the polls closed in Ireland, the results have delivered an unexpected win for Bertie Ahern and Fianna Fáil, securing a fourth term for the natural governing party of Ireland. Despite facing an uphill struggle, including a united opposition and corruption allegations, Bertie and the FF grassroots have persevered once again, promising to keep Ireland going and support Germania against the Soviet war machine in Europe.\n\nThe Reich's Public Affairs Office has congratulated Bertie on another election win, one which the struggling empire needs amidst the chaos in Europe. Meanwhile, Washington remains quiet as the OFN-leaning opposition coalition has already fallen into blame games and infighting, with the leaders of the UDP, RP, and Alliance continuing to boycott a government formation in protest of Bertie’s re-election, leaving the Northern Counties in the hands of the civil service."
WORLD.18239.a: "Bertie does it again."

WORLD.18240.t: "Fine Gael wins Irish Election"
WORLD.18240.desc: "The final results from the Irish election have revealed a victory for Fianna Fáil’s historic rival, Fine Gael, which is once again leading a coalition government with their Labour allies. With the battered FF returning to the opposition after over a decade of government, FG Leader Alan Dukes has declared that a wave of change has overtaken Ireland, promising sweeping social reforms for the hungry electorate once promised by his mentor Garret FitzGerald in 1982.\n\nWashington has welcomed Dukes’s elevation to Taoiseach with open arms, with the hope that Ireland may finally shift decisively to the OFN under the Pro-OFN FG, even with the more OFN-sceptical Labour at their side. A spokesperson for the Führer has decried the election result as a successful propaganda operation by American agents as Germania struggles to retain its grasp over the continent and Bertie faces questions over his leadership of FF."
WORLD.18240.a: "Has Ireland finally broken from Germania?"

WORLD.18241.t: "Labour wins Irish Election"
WORLD.18241.desc: "Irish newspapers have reported a shock result after Ireland’s election: Fianna Fáil has fallen to the opposition coalition, but instead of Fine Gael leading it, Labour has unexpectedly emerged as the largest party at the helm. Previously seen as the third party in Irish politics, often playing second fiddle to bigger FF or FG, a “Spring tide” has seemed to overtake the nation as Labour leader Dick Spring becomes the first non-FF/FG Irish Leader since Independence.\n\nWashington has sent its congratulations to Spring as Ireland’s new leader. Despite the party’s previous suspicion of OFN membership, Spring has spent considerable effort to make the party more moderate, electable, and OFN-friendly, an effort made easier by the Pro-OFN FG on its side. Commentators in Germania meanwhile have called Spring a crypto-Bolshevik, as FF leader Bertie Ahern faces a potential leadership challenge as he enters opposition."
WORLD.18241.a: "The Spring Tide lifts Labour’s ship to victory."

