WORLD.18117.t: "Alexander Gauland wins German Elections!"
WORLD.18117.d: "Following the arrest of Martin Mußgnug, the dissolution of the National Socialist German Workers party, and finally, the first free elections since the end of the Weimar Republic, it seemed as if Germany was on the way to a democratic future.\n\nThis dream has now been shattered.\nThe neo-Speerite NSDAP successor ‘German National Social People's Party' has achieved an absolute majority in the election. Despite incredible efforts on reforming German society, it seems as if the population stood loyal to Speerism all along. Many leading figures of the ‘Offenheit’ and ‘Umgestaltung’ campaigns have left the country, and once again, portraits of Führer Speer Senior are hung up across the nation. Though the National Social People’s Party has denied any direct connection between itself and the NSDAP, they have proclaimed their desire to revert almost all of the post-Mußgnug reforms.\nWith Alexander Gauland, an outspoken admirer of Speer Senior, as chancellor, the short period of German Democracy ends in almost the same way it did seventy years ago."
WORLD.18117.a: "Truly bittersweet."

WORLD.18124.t: "Finnish Biological Attack on Stockholm"
WORLD.18124.d: "Shock and fear resonate within Europe, as something expected by none has happened - The autocratic, environmentalist regime of Finland has attacked its fellow Europäische Pakt member Sweden without warning.\n\nAfter Finnish Jets entered Swedish airspace and dropped bombs, not into the city centre of Stockholm, but mostly into the Mälaren Lake, combat with the Swedish airforce ensued, which was assisted by German and Norwegian Jets as well. As of now, it has been revealed that the goal of the Finnish was to infect Stockholm and its water supply with Anthrax through a modified Bacillus anthracis bacteria.\nAlthough hundreds of the victims have already died, it seems as if the outbreak has been contained.\nNonetheless, Finland has de-facto initiated war with the Europäische Pakt, and already, combat between Sweden, Norway and Finland is taking place in Lappland, while Luftwaffe air raids strike Finlands major cities and naval bases.\nStill, the mystery remains: Why has Finland attempted to cause an Anthrax pandemic?\n"
WORLD.18124.a: "Has Finland lost its mind?"
WORLD.18124.b: "They will be avenged."
WORLD.18124.c: "We will make them pay."
WORLD.18124.e: "The world does not understand, but we do not need them to."

WORLD.18125.t: "Operation Nordlicht"
WORLD.18125.d: "Although caught by suprise by the Finnish attack, Sweden and Germany have mobilized their forces, and a full attack on Linkola's Regime is in progress. Reports of chemical and biological weapons being used by Finland, and various abuses of Europäische Pakt warfare conventions, aswell as the attack on Stockholm itself have led to Finland being condemned by most of the international community. Faced by the entirety of the Europäische Pakt, defeat is almost certain. Still, the well-equipped Finnish Military and the harsh terrain and climate will lead to massive difficulties, a lession the Sovjets had to learn four times already."
WORLD.18125.a: "Another Burgundy?"

