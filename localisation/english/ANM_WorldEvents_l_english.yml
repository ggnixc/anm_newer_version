WORLD.18135.t: "The Burgundian Offensive"
WORLD.18135.d: "Troubling news are coming from west Europe, just mere days after the tragic bombing at Volkshalle whose perpetrators are still only known to Germany, another tragedy has occured. This time however, in Europäische Pakt's joint mission to reconstruct the lands of the former Ordenstaat of Burgundy.\n\nA myth in the free world, they have now became a fact, the SS Remnants, are in fact real and have started an insurgency from their forest hideouts.\nLed by the daughter of their first and only Reichsführer-SS, they vow to 'liberate' the Burgundian land from the hands of degeneracy.\nBoth French and German governments are still refusing to comment on the situation but one thing is certain, they wont stand aside while these demons of the past are trying to recreate their Ordensstaat."
WORLD.18135.a: "Will fate ever spare the Burgundian people?"
WORLD.18135.b: "These devils will be annihilated, once and for all."
WORLD.18135.c: "These devils will be annihilated, once and for all."
WORLD.18135.e: "The degenerates shiver as the SS rises again!"

