 FIN_the_third_angel:0 "The Third Angel"
 FIN_the_third_angel_desc:0 "$FIN_EastEffects_2$\n§g--------------§!\n"
 
 FIN_EastEffects_2:0 "§F§g...poured out his bowl into the rivers and the springs of water, and they became blood. And I heard the angel in charge of the waters say,\n\n“Just are you, O Holy One, who is and who was,\n  for you brought these judgements.\nFor they have shed the blood of saints and prophets,\n   and you have given them blood to drink.\nIt is what they deserve!”:§!\n - $MODIFIER_GLOBAL_MONTHLY_POPULATION$: [?FIN_EastEffects^0|=%+1]\n - $admin_program_cost_factor$: [?FIN_EastEffects^1|=%-2]\n - $military_expenditures_factor$: [?FIN_EastEffects^2|=%-2]\n - $education_policy_monthly_rate$: [?FIN_EastEffects^3|+=2]\n - $agriculture_monthly_rate$: [?FIN_EastEffects^4|=+2]\n - $MODIFIER_STABILITY_FACTOR$: [?FIN_EastEffects^5|=%+2]\n - §RThe cultural makeup of the territories subject to the Sword Scabbard Law will change over time.§!§!"
 
