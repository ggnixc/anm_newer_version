 #National Spirits
 FIN_the_other_finland:0 "The Other Finland"
 FIN_the_other_finland_desc:0 "The 1952 bumper crop in the Reichskommissariat Ukraine collapsed several agrarian economies across Europe. The worst affected by German abandonment of imports in favour of their new breadbasket were Romania and Bulgaria, but the unmodernised and predominantly agrarian Finland—whose agricultural sector had expanded thanks to its eastern conquests—was no less damaged by the change in trade patterns.\n\nUnlike its Balkan counterparts, Finland had an alternative. Rather than industrialise, it exported its goods to neighbouring Sweden and relied on the internal market. This meant that while farming remained steady, industrialisation fell by the wayside and only minor industrial growth was observed, so that Finland remains to this day an outdated, resource-exporting economy.\n\nMost Finns, being proudly traditionalist, are happy for things to stay this way. However, some ask how long can this carry on if Finland is truly going to modernise. They ask: will Finland come into the modern age, or instead continue to rely on the Swedish behemoth and the German state colossus?"
 FIN_die_ostfrage_finnlands:0 "Die Ostfrage Finnlands"
 FIN_die_ostfrage_finnlands_desc:0 "$FIN_EastEffects$\n§g--------------§!\nIt is true that Greater Finland as an idea entered the Finnish sociopolitical consciousness at the same time as the far-right rose elsewhere in Europe. However, it was not confined to the far-right. Quite the opposite: it spread throughout left-wing and right-wing Finnish political thought, likewise metastasizing into Finnish academia like a cancer. The crucial similarity between the Greater Finland idea and other expansionist systems of thought is ultranationalism and militarism, both of which served it well when the Winter War whipped all Finland into a fury and led it to join the German conquest.\n\nGeneral Aksel Airo, Mannerheim's trusted aide, drew up five distinct border proposals; the last of these was presented to the Germans and became Finland's current eastern limit. Greater Finland, having been actualised, is furthered with a mix of deportations and colonisation. However, it is not yet so strong as to be able to ignore Russian resistance should it boil over."
 FIN_EastEffects:0 "§F§gEnlarge the place of your tent, stretch your tent curtains wide, do not hold back; lengthen your cords, strengthen your stakes. For you will spread out to the right and to the left; §eyour descendants will dispossess nations and settle in their desolate cities:§!§!\n - $MODIFIER_GLOBAL_MONTHLY_POPULATION$: [?FIN_EastEffects^0|=%+1]\n - $admin_program_cost_factor$: [?FIN_EastEffects^1|=%-2]\n - $military_expenditures_factor$: [?FIN_EastEffects^2|=%-2]\n - $education_policy_monthly_rate$: [?FIN_EastEffects^3|+=2]\n - $agriculture_monthly_rate$: [?FIN_EastEffects^4|=+2]\n - $MODIFIER_STABILITY_FACTOR$: [?FIN_EastEffects^5|=%+2]\n - §RThe cultural makeup of the territories subject to the Sword Scabbard Law will change over time.§!§!"
 FIN_the_spiderweb:0 "The Spiderweb"
 FIN_the_spiderweb_desc:0 "Finnish society, to the outside world, seems mostly to rest on two pillars: the common civilian and said civilian's political representatives. In reality, however, there is another column that is perhaps best compared to a spider's web: a parallel system representing the interests of nationalistic forces in public society and in both inter- and intra-party relations. Its primary manifestations - the groups known as Nouseva Suomi, Raivajaat, and AKS - have formed a tripartite compact with a twofold aim: to both entrench the party establishment and further cement romantic nationalism in Finnish societal consciousness.\n\nGermanophilia is rampant; one of its strongest exponents is the so-called "boutique" around Social Democratic politician Kalle Lehmus. Whereas it is officially the private intelligence arm of the SDP, this "boutique" also serves the interests of the nationalist think tank attached to said party known as Raivajaat. As to Raivajaat's non-SDP allies, AKS dominates the university youth groups and frequently exerts its influence to stymie the educational opportunities of those that do not join it, while NS - the analogue of Raivajaat in the right wing, and led by the same chairman as AKS - serves as a public-advisory committee both affirmatively encouraging Finnish expansionist nationalism and going into the mud to sink those that scorn it as impractical or immoral."
 FIN_the_watchtower:0 "The Watchtower"
 FIN_the_watchtower_desc:0 "The Finnish state, as currently constituted, is a watchtower overlooking the Russian time of troubles. It serves as an enforcer against the possibility that the currently-obliterated Russian polity might reconstitute itself again. For that reason, the Germans and the Swedes fight to influence it at each other's expense.\n\nGermany and Sweden are not so foolhardy as to hurt Finland in seeking influence over it. For now, the conflict is mostly silent, a tug-of-war conducted almost entirely through words between the Suecophilic Agrarians, SDP centrists, and Kok. reformists on one side and assorted Germanophilic groups such as the SDP right, the AKS, and NS on the other."
 FIN_the_shadow_presidency:0 "Leskinen's Shadow Presidency"
 FIN_the_shadow_presidency_desc:0 ""No, seriously, who's in charge these days? Big or Little Väiski?"\n\nVäinö Leskinen, always one to act like a high-flying top party bureaucrat, often seems to have reduced Väinö Tanner into nothing more than a puppet. Tanner often lacks the wherewithal to resist such a situation, since the once active and powerful politician is losing his tempo with age. Things that would have come naturally to Tanner—such as resisting internal coups—simply do not do so any longer.\n\nAs a result, Leskinen increasingly seems to be the one running the show in President and SDP chair Tanner's place from the shadows. But his control is not hidden enough to prevent people growing wary of him and asking who really is the President of Finland: is it the old socialist, Big Väiski, or the brother-in-arms socialist, Little Väiski?"
 FIN_SDP_wary_democrats_tt:0 "§ROther §PDemocrats§! grow wary of of Leskinen...§!"
 
