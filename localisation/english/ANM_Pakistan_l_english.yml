 ##Ideas##
 ###########
 PAK_Something_Is_Happening: "Something Is Happening"
 PAK_Something_Is_Happening_desc: "Over the last decade, things have been relatively stable for the nation of Pakistan, at least on the surface. But to the average citizen, things could not be worse. Over more than a decade of Syeda Abida Hussain’s rule, the average income has decreased significantly, the agricultural situation has deteriorated rapidly, with most families unable to feed themselves, and corruption has run rampant. \n\nBut now, a sense of foreboding has been cast over the country. Everyone feels the same wind of doom, bringing with them the beginnings of a crisis that no one has experienced before. As the crisis hurls itself closer and closer to revealing itself, many people fail to comprehend how their living situation could get worse. But one has to remember that in Pakistan, there is no such thing as rock bottom."
 PAK_Metastasis: "Metastasis"
 PAK_Metastasis_desc: "A single thing binds every notable political movement, regional government, and national party in Pakistan: corruption. The intricate web of bribes, patronage, and nepotism dominates every aspect of the Pakistani government, requiring leaders to rely on it to stay in power, while also taking their own sample of this fruit. \n\nHowever, the same corruption that brings much of Pakistan’s political class to power also cripples any state initiatives, whether it be development, reparations or social reforms. As corruption becomes an ingrained aspect of Pakistani society and bleeds into economic matters like production and distribution, it becomes apparent that Pakistan will have to come face to face with the illness that it has ignored for so long."
 PAK_Those_That_We_Must_Sacrifice: "Those That We Must Sacrifice…"
 PAK_Those_That_We_Must_Sacrifice_desc: "Comparable to its eastern neighbor's high growth rates, the Pakistani economy has been one of the fastest-growing economies throughout its existence, a source of pride for its citizens and its allies. But beneath this golden exterior lies a rotten husk of an economy, a nation with non-existent labor laws, a society that keeps most of its children out of school and working in factories for scraps, and bonded labor being a prominent aspect of Pakistan’s workforce. With every waking day being a return to the horrible life of a laborer, the Pakistani working class calls out to a savior, anyone, to save them from this plight. "
 PAK_For_The_Ones_Who_Will_Always_Rule_Us: "For the Ones Who Will Always Rule Us"
 PAK_For_The_Ones_Who_Will_Always_Rule_Us_desc: "When looking over the political development of Pakistan, many will notice that it hasn’t evolved since the collapse of the British Raj, especially regarding the social class that dominates politics: the aristocracy. Controlling all aspects of Pakistani society through their continued economic privileges, the aristocracy is responsible for the unchanged feudal order, one that crushes its citizens, most of them rural tenant farmers, under land rents, bonded labor, and the absence of social mobility. \n\nThrough the manipulation of votes and a democracy where either party’s differences are regional disputes and aristocratic fighting, the aristocracy’s fist continues to wrap itself tightly around the neck of Pakistan, until the breath finally leaves the suffering nation."
