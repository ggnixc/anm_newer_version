 POLITICS_ABIDA_HUSSEIN_DESC: "Syeda Abida Hussain, born in 1948 in the city of Jhang, province of Punjab, is a Pakistani aristocrat who has always lived in a completely different world compared to most of her countrymen.\n\nBrought up in a wealthy feudal family - one deemed powerful enough for her father to be made an honourary Colonel in the British Indian Army -  she naturally enjoyed a British-style education in the city of Lahore, at the Covenant of Jesus and Mary Catholic school. In 1971, after her father's passing, Abida entered national politics on a conservative platform, quickly joining the Pakistani Muslim League in the process. Due to her feudal family descent, she had the opportunity to take advantage of the young political scene of the country, something which she certainly did, making pacts and deals to increase her standing within the party. She is considered by many to be the spiritual successor of Viqar-un-Nisa Noon, an old political ally and personal friend of hers, due to the similarities in their policies. However, her legacy as a politician wouldn't be without incidents, as SSP insurgents attempted to claim her life on multiple occasions while she was visiting her home district.\n\nElected as Prime Minister in 1985, she is the nation's longest-serving leader and is not likely to abandon politics. Yet her premiership has been marked by general conservatism that has drawn the ire of a significant portion of the population, due to over 11 years of virtually no social reform under her government. As a staunch conservative, she seeks to maintain the current political and judicial state apparatus, a system which, in the eyes of many, is long overdue for change. She, of course, faces many enemies who seek to undermine her position, but will her connections and financial ties be enough to maintain her influence?"
 PAK_Abida_Hussain_hog_desc: "Prime Minister\n--------------\nSyeda Abida Hussain, born in 1948 in the city of Jhang, province of Punjab, is a Pakistani aristocrat who has always lived in a completely different world compared to most of her countrymen.\n\nBrought up in a wealthy feudal family - one deemed powerful enough for her father to be made an honourary Colonel in the British Indian Army -  she naturally enjoyed a British-style education in the city of Lahore, at the Covenant of Jesus and Mary Catholic school. In 1971, after her father's passing, Abida entered national politics on a conservative platform, quickly joining the Pakistani Muslim League in the process. Due to her feudal family descent, she had the opportunity to take advantage of the young political scene of the country, something which she certainly did, making pacts and deals to increase her standing within the party. She is considered by many to be the spiritual successor of Viqar-un-Nisa Noon, an old political ally and personal friend of hers, due to the similarities in their policies. However, her legacy as a politician wouldn't be without incidents, as SSP insurgents attempted to claim her life on multiple occasions while she was visiting her home district.\n\nElected as Prime Minister in 1985, she is the nation's longest-serving leader and is not likely to abandon politics. Yet her premiership has been marked by general conservatism that has drawn the ire of a significant portion of the population, due to over 11 years of virtually no social reform under her government. As a staunch conservative, she seeks to maintain the current political and judicial state apparatus, a system which, in the eyes of many, is long overdue for change. She, of course, faces many enemies who seek to undermine her position, but will her connections and financial ties be enough to maintain her influence?"
 PAK_Shaukat_Aziz_eco_desc: "Minister of Finance, Revenue and Economic Affairs\n--------------\nBorn in Karachi on the 6th of March, 1949, Shaukat Aziz currently serves as the Minister of Finance of the Islamic Republic of Pakistan.\n\nWhile still in his youth, Aziz attended Saint Patrick's School in Karachi. But, due to his father's profession as a radio engineer, the family would move around the border regions of the Republic of India. In 1967, he would go on to obtain his degree in economics from Gordon College. With the war between the Indian Governments on the horizon, however, the man would go to work as a local banker, and later financier. With the loss of the Delhi government, and with the declaration of independence of the Pakistani nation, Aziz went on to witness the first years of the new Muslim state. Characterized by their political instability, ethnic infighting, and a rise in poverty, the first Karachi governments left behind a bitter legacy for its successors.\n\nBut, with the ascension of Syeda Abida Hussain, Shaukat Aziz was appointed as her Finance Minister and has gained a reputation as her chief economic advisor. While an advocate of measured, calm technocracy, Aziz's role is truly that of a fireman - leaping from building to building to put out the economic catastrophes that his own government causes, with his planned reforms left by the wayside. Although he is the favored candidate by the PML, their very same corrupt and aristocratic nature makes Aziz's plans impossible to accomplish."
 PAK_Nawar_Akbar_Bugti_for_desc: "Minister of Foreign Affairs\n--------------\nAs a personification of the tribal politics that plague the nation of Pakistan, Nawab Akbar Bugti was put in his position simply to satisfy the elite class of Balochistan.\n\nBorn in the British Raj, Dera Bugti district in 1926, he was the son of the local chieftain, Nawab Mehrab Bugti. Being part of the aristocratic upper class, he was able to attend the Karachi Grammar School and the Aitchison College after the death of his paternal figure. He served as one of the leaders of the Union of Baloch States before supporting its annexation into Pakistan. He soon became a member of the Pakistan Muslim League, and in recent developments was appointed as foreign minister by the newest federal administration. While he seems unencumbered by age, he would personally not wish to continue serving directly under the government, as he would much rather rule his district and hometown of Dera Bugti, where he is an autocrat and accountable to none."
 PAK_Jehangir_Karamat_sec_desc: "Chief of the Army Staff\n--------------\nBorn on the 20th of February 1941 in the coastal city of Karachi, Jehangir Karamat's family had roots in the city of Sahiwal in the province of Punjab.\n\nKaramat Ahmad, a serviceman in the Indian administration, was his paternal figure, which would open the gates of possibilities for the young child. He would go on to graduate from Saint Patrick's High School in Karachi, where he would remain for most of his young adulthood. With religious violence in the province of Punjab on the rise, and with the start of a war between the Delhi and Calcutta governments, Karamat would go on to witness the creation of Pakistan through a military invasion from the North-Western Frontier Province. After the Karachi government was set up, he would join the Pakistan Military Academy in the city of Kakul, becoming a well-respected cadet. He then slowly ascended through the ranks within the army, becoming Chief of Army Staff in the end. He is seen as conservative by most of his governmental peers, wishing for the civilian government to not intervene with the military and their separate issues. Behind closed doors, he detests the political class of his country, believing that the armed forces are the only anti-political institution in the Pakistani state."

