 #TUR_itatur_decisions_desc: "Finally, the time has come for us to take back what is rightfully ours! Our mighty armies are clashing with the Italian Governorate in the Levant, and we will show these newcomers that Turkey has always been the true master of the Middle East. To war and glory!"
