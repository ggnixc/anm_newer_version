 ##Ideas##
 #########
 TUR_kurdish_issue_0_level: "Kurdish Issue: Dormant"
 TUR_kurdish_issue_0_level_desc: "Anatolia's Kurdish population has long enjoyed generous autonomy. Indeed, until the fall of the Ottoman Empire, the local Kurdish lords were able to handle their own affairs, provided that they maintained loyalty to the Sultan and paid their due tribute. We know however, that our new Republic cannot operate on the same system. The foundation of any modern Nation-State is centralization, and despite all the miracles that modernity brings to these people, there are many among them who are less than pleased.\n\nOpposition to our policies, ranging from autonomism to outright separatism, exists both within our borders and in the various insurgent groups hosted in countries such as Iraq, ready to pounce on any weakness to achieve their dreams of a Free Kurdistan. We cannot allow this to pass.\n\nThankfully, separatist sentiments are at an §Kall-time low§!. The majority of opposition comes from exiled groups based in enemy territory, and any attempts at smuggling their ideas within our borders are easily contained. Anatolia remains One."
 TUR_kurdish_issue_1_level: "Kurdish Issue: Manageable"
 TUR_kurdish_issue_1_level_desc: "Anatolia's Kurdish population has long enjoyed generous autonomy. Indeed, until the fall of the Ottoman Empire, the local Kurdish lords were able to handle their own affairs, provided that they maintained loyalty to the Sultan and paid their due tribute. We know however, that our new Republic cannot operate on the same system. The foundation of any modern Nation-State is centralization, and despite all the miracles that modernity brings to these people, there are many among them who are less than pleased.\n\nOpposition to our policies, ranging from autonomism to outright separatism, exists both within our borders and in the various insurgent groups hosted in countries such as Iraq, ready to pounce on any weakness to achieve their dreams of a Free Kurdistan. We cannot allow this to pass.\n\n§bWhile we have noticed a larger than usual amount of activity on the border, our security apparatus has so far been able to maintain close check on smuggling rings trying to bring subversive materials, or worse, into our country. The situation remains manageable.§!"
 TUR_kurdish_issue_2_level: "Kurdish Issue: Worrying"
 TUR_kurdish_issue_2_level_desc: "Anatolia's Kurdish population has long enjoyed generous autonomy. Indeed, until the fall of the Ottoman Empire, the local Kurdish lords were able to handle their own affairs, provided that they maintained loyalty to the Sultan and paid their due tribute. We know however, that our new Republic cannot operate on the same system. The foundation of any modern Nation-State is centralization, and despite all the miracles that modernity brings to these people, there are many among them who are less than pleased.\n\nOpposition to our policies, ranging from autonomism to outright separatism, exists both within our borders and in the various insurgent groups hosted in countries such as Iraq, ready to pounce on any weakness to achieve their dreams of a Free Kurdistan. We cannot allow this to pass.\n\n§LOur grasp on the situation is clearly escaping us. While not in outright insurgency, there have been many reports of open protest and even terrorist attacks on government buildings in the Kurdish-populated areas of our country. If we do not act quickly, this could easily slip out of hand.§!"
 TUR_kurdish_issue_3_level: "Kurdish Issue: Overwhelming"
 TUR_kurdish_issue_3_level_desc: "Anatolia's Kurdish population has long enjoyed generous autonomy. Indeed, until the fall of the Ottoman Empire, the local Kurdish lords were able to handle their own affairs, provided that they maintained loyalty to the Sultan and paid their due tribute. We know however, that our new Republic cannot operate on the same system. The foundation of any modern Nation-State is centralization, and despite all the miracles that modernity brings to these people, there are many among them who are less than pleased.\n\nOpposition to our policies, ranging from autonomism to outright separatism, exists both within our borders and in the various insurgent groups hosted in countries such as Iraq, ready to pounce on any weakness to achieve their dreams of a Free Kurdistan. We cannot allow this to pass.\n\n§RThe Kurdish revolt has led to near-complete collapse of our state capacity in much of our territory. What were once isolated terrorist cells now strike wherever and whenever they please, even as far as Ankara or Istanbul. The Republic might be facing an existential threat, not seen since the Mondros ceasefire.§!"
 TUR_the_sword_of_kizagan_khan: "The Sword of Kızagan Khan"
 TUR_the_sword_of_kizagan_khan_desc: "In the Turkic legends of old, Kızagan Khan, the God of War, wielded his spear in battle against the wicked and unjust and shielded honorable warriors from harm. Though the modern Republic of Turkey adheres to the strict secularism instilled by Atatürk, the legend of the Turkic god is not as fictional as it seems.\n\nIn the minds of Turkish soldiers, officers, and generals, they are the sword and shield of the Republic, defending it against those that would seek to cause it harm. The Sword of Kızagan Khan, embodied now in bayonets and rifles, still hovers precariously above the necks of Turkish politicians. Whether it shall fall, not even the Kızagan Khan himself can say."
 TUR_the_republic_of_black_gold: "The Republic of Black Gold"
 TUR_the_republic_of_black_gold_desc: "Since Turkey's victory in the Middle East over 40 years ago, and the subsequent period of prosperity, the Republic's economy has undergone a profound transformation. Industrialisation and modernisation of the oil industry have made it one of the premier players in the oil market in its region.\n\nThough the Republic could not hope to break Italy's stranglehold on the oil market, it has managed to carve out a successful niche. Aided by its close relations with the both the Reich and the OFN, it seems black gold shall continue to flow from Mosul."
 TUR_the_military_furnace: "The Military Furnace"
 TUR_the_military_furnace_desc: "The bloated amalgamation of competing institutions that comprise the Turkish military has long been a significant drain on the country's budget. Cronyism and corruption, fueled by a constant supply of money, have led to a massively bloated military apparatus.\n\nWith the TSK's budget requests growing more onerous by the year, politicians across the spectrum have attempted to rein them in, with little success. The guardians of the Constitution demand their share of the slice, and the governments of the day have no choice but to oblige."
 TUR_undecided_economic_policy: "Undecided Economic Policy"
 TUR_undecided_economic_policy_desc: "The issue of economic policy has been one of the most contentious divides across Turkey since its foundation. Initially following a policy of dirigisme, this state of affairs was overturned throughout the troubled 1980s. The rapid liberalization of the economy under Özal was followed by a return to statist policies under Bülent Ecevit, leaving Turkey's economy in chaos.\n\nThe idiosyncratic nature of the economy is an issue that continues to plague Turkey to this day, and is an issue which must be solved one way or another. Whichever way the tide of history turns, the Turkish people demand their government makes a choice and sticks with it."

 
