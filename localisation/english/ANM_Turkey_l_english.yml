 ##Ministers##
 #############

 TUR_Murat_Karayalcin: "Murat Karayalçın"
 TUR_Murat_Karayalcin_hog_desc: "§YHead of Government\nLeft Kemalism§!\n§F--------------§!\n§LBorn on the 26th of October 1943, in the northern city of Samsun, Murat Karayalçın's adult life has been defined by one event: meeting Erdal İnönü while studying in Ankara. Becoming friends not long after, Karayalçın supported the young İnönü's political career from the start. Working around the clock, he helped secure İnönü's election as mayor in 1979 and again in 1984 in a landslide. Now fully involved in the CHP, he secured his election as mayor of Ankara in 1989 after İnönü stepped down but declined to pursue a second term; instead he once again chose to step down to help İnönü's political career, this time centered around the Presidency.\n\nWith Erdal İnönü winning the 1995 presidential elections by a slim plurality, the choice of who to turn to as his second-in-command was obvious; Murat Karayalçın was appointed Prime Minister within hours of İnönü's inauguration. A staunch loyalist, Karayalçın has nonetheless proven to be more than a mere sycophant. Progressive, technocratic and empathetic, he is every bit the humane intellectual he purports to be. The only thing he cares for more than his friend is Ankara, his adopted hometown. His connections among the people and powerbrokers of the capital helped his rise to prominence in the first place, and he intends to reciprocate this to people of the city, having already spearheaded dozens of projects for the betterment of the city. Whatever comes next in this troubled chapter of Turkish history, Karayalçın intends to stand by his convictions and his friend, at all costs.§!"

 TUR_Hikmet_Cetin: "Hikmet Çetin"
 TUR_Hikmet_Cetin_for_desc: "§YForeign Minister\nKemalism§!\n§F--------------§!\n§LComing from a prestigious family of Kurdish origin, Hikmet Çetin's life has been a history of overaccomplishment. Becoming one of the few people to finish high school in his rural hometown, he moved on to the capital to study at Ankara University. Graduating from the department of economics and finance, he went on to serve in several planning boards in the State Planning Organisation, and later a teacher in the Middle Eastern Technical University. In the 1970s he entered the arena of politics by joining the CHP, and won a seat to the Grand National Assembly in 1977. There, he met the rising star of the CHP, Erdal İnönü, and they developed a close rapport. Afterwards, he served in the cabinet of President Bülent Ecevit until his fall, and ran for the CHP's nomination for the 1995 presidential elections against İnönü. Despite this, they remained close and İnönü invited him to his cabinet as Minister of Foreign Affairs.\n\nHailing from the liberal wing of the CHP, Çetin remains an ardent supporter of the liberal economic policies introduced under Ecevit, supporting the further relaxation of dirigisme. He also remains a fervent advocate for the OFN. Under his tenure at the foreign ministry, he has overseen the further deepening of ties with the OFN, with Turkey committing itself further to its role as an OFN Partner. Despite this, he remains one of the most popular politicians in the government due to one simple characteristic: his ability to see reason, articulate his thoughts precisely, and his willingness to compromise. As İnönü's cabinet pulls him every which way, Çetin intends to make sure that he is not led astray from the path he believes Turkey must go down.§!"

 TUR_Yilmaz_Ates: "Yılmaz Ateş"
 TUR_Yilmaz_Ates_eco_desc: "§YEconomic Minister\nKemalism§!\n§F--------------§!\n§LFrom his roots as a simple journalist, Yılmaz Ateş rose rapidly through the ranks of the CHP. First elected as a member of the National Assembly, Ateş found his talents put to good use in mediating between the Orthodox and Left Kemalist wings of the CHP. His work in uniting the party earned him several high ranking positions in the party, and his cunning and tact ensured he gained the respect and admiration of friends and foes alike.\n\nNow a veritable titan of the CHP orthodoxy, Yılmaz Ateş has set himself one goal above all: to prevent liberals and socialists pulling İnönü away from Atatürk's vision. The CHP is above all, the party of the Father of the Turks, nothing else. Liberals aspiring to undercut Statism or Socialists attacking Nationalism, all are nothing but snakes poisoning the very soul of the Republic; a soul Ateş is willing to protect even at the cost of his own.§!"

 TUR_Husamettin_Cindoruk: "Hüsamettin Cindoruk"
 TUR_Husamettin_Cindoruk_sec_desc: "§YSecurity Minister\\nRight Kemalism§!\n§F--------------§!\n§LWith the alliance of the Left Kemalists and the aging Orthodox Kemalists dominant in the CHP, it may then seem surprising that Erdal İnönü turned to Hüsamettin Cindoruk for the post of Interior Minister. That surprise evaporates when one looks at the aging Cindoruk's life. Born to an illustrious family with deep political roots, Cindoruk's career, if not the heights he would reach, was clear from birth. Joining the CHP Youth League in 1952, Cindoruk quickly made a name for himself among his peers. This experience and popularity helped him immensely when he joined the party as a full member and was elected as a MP not long after. Serving in the cabinet of both the Gülek and the short-lived Demirel presidencies, his dramatic fall from power seemed like the end of career; yet proved little more than a speedbump.\n\nReturning to politics at the behest of his friends in the marginalised Right Kemalist group of the CHP, he became the group's leader following the retirement of Fetih Çelikbaş and supported İnönü's bid for the Presidency as an olive branch to the Orthodox Kemalists. This gesture earned him goodwill and a position in the newly elected President İnönü's cabinet. Supporting Turhan Feyzioğlus doctrine of Kemalism, focused on education, bureaucratism, anti-radicalism and liberal economics, he seeks the revitalisation of the ailing right wing of the Party against the growing dominance of the Kemalist Left; how he hopes that accomplish that, only he seems to know.§!"
 
 #TUR_Fahri_Koruturk: "Fahri Korutürk"
 #TUR_Fahri_Koruturk_hog_desc: "§YHead of Government\nPaternalism§!\n§F------------§!\n§LBorn in 1903, Admiral Korutürk's career has borne witness to several eras of the Turkish Republic. The Istanbulite earned his spurs in the unstable world of the thirties, taking part in numerous missions and naval attachés across old Europe and quickly becoming fluent in the language of diplomacy. The Atlantropa 'project' sealed all chances of any career in the Navy. Instead, he earned prominent postings as an ambassador to Turkey's allied states.\nA veteran of the Triumvirate's paradoxical procedures and present ever since its founding under Inonu and Mussolini, Korutürk's appointment as Prime Minister has reoriented Turkey's vision outwards, towards its dubious allies.§!"
 
 #TUR_Cemal_Gursel_sec_desc: "§YSecurity Minister\nPaternalism§!\n§F------------§!\n§LBorn in Erzurum in 1895, Cemal Gürsel's career in the Turkish military is perhaps the only one that can rival the President's own. Serving With distinction in the Ottoman army during the First World War, Gürsel was captured by the British in 1917 and learned French if only to spite his captors, before returning as a seasoned commander to lead new Republic's militias in the Turkish War of Independence and the Turkish Armed Forces to victory in the Second World War. A capable and popular member of the President's cabinet, the old General is adored by the public and the military in equal parts.\n\nSo far, he has used this influence to disseminate one message:\nA strong and professional military, dedicated to serving the Turkish state - and the Turkish people.§!"
 
 #TUR_Ferit_Melen: "Ferit Melen"
 #TUR_Ferit_Melen_eco_desc: "§YEconomic Minister\nPaternalism§!\n§F------------§!\n§LA member of the generation that was raised in the midst of Ataturk's glorious revolution, it is no surprise that the minister of the economy is one of the loudest voices calling for adherence to Kemalist principles. Born in 1906 and graduating from the University of Ankara in 1931, Ferit Melen is a staunch proponent of state intervention in the economy, one of the 'six arrows' of Kemalist ideology. A nationalist and life-long civil servant, he was instrumental in shaping the modern Turkish economy; This has made the Minister of the Economy a polarizing figure to say the least, with criticism from both the left and the right:\n criticism which has only strengthened his faith in the thought of Mustafa Kemal, and tempered his nationalism into a dogmatic orthodoxy.§!"
 
 #TUR_Feridun_Cemal: "Feridun Cemal"
 #TUR_Feridun_Cemal_for_desc: "§YForeign Minister\nPaternalism§!\n§F------------§!\n§LFeridun Cemal Erkin is a familiar face in the President's cabinet. Long-time ambassador, reliable diplomat, and well-known influence in the Foreign Ministry. Feridun has always urged a degree of caution when it came to tampering with Turkey's international position, warranted after a grueling experience as part of the Republic's embassy to Germania. A calm and rational voice in a cabinet of ardent nationalists, the foreign minister's advice might as well be foreign, for how little it's taken.\nNonetheless, the man has served the republic with dignity and was an invaluable asset in turning the country away from the Reich and towards the Mediterranean, while preventing a war anticipated by all.§!"
 
