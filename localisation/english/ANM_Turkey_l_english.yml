 ##Leader Bios##
 ###############
 POLITICS_ERDAL_INONU_DESC: "President\n--------------\n“I know you're no worse than most men but I thought you were better. I never saw you as a man. I saw you as my father.”\n- Arthur Miller, All My Sons\n\nHow can any humble academician wish to live up the name of the second greatest man in the Republic of Turkey's history? Milli Şef İsmet İnönü was the closest person to the might of The Ghazi Atatürk in many people's minds, so surely nobody could?\n\nThat would be true, were it not for Erdal İnönü. İsmet's son was born in the nation's newly reshaped capital of Ankara. With a fully original name invented by İsmet himself, the young man would go on to finish his early academics with great success. Considered gifted from a young age, Erdal would go on to achieve political success, by his own merits as an academic, without needing to leverage the prestigious name his father earned in the fields of Anatolia.\n\nHis time to shine would come after the Ecevit crisis, where despite his intention to avoid the position, he would find himself thrust into the role of official negotiator for the newly formed non-partisan government and would then take his chances at the party congress despite his lack of a strong platform. Now, Erdal İnönü has been elected the 9th President of Turkey amidst economic confusion, demands to continue Ecevit's reform and external pressure. As his administration takes shape, uncertainty lingers in the halls of power. Erdal faces a nation burdened by social fatigue despite decades of prosperity, cautious optimism and the quiet urgency for change as the new millennium approaches. He will most likely only serve a single term, but damn it, will he make good use of it."
 
