## Descriptions ##
 # Country Leader #
 POLITICS_JOSE_UTRERA_MOLINA_DESC: "Franco is dead and has been for over 20 years, but Francosim still lives and dominates Iberia. Spain is a Democracy and has been for over 20 Years, but many of those who ran the Government under Franco and Salazar are still running the show, with Jose Utrera Molina being no exception.\n\nServing as a FET-JONS Party Worker, Provincial Governor, and a Member of the Iberian Council, Molina was a dedicated Franocist and feared the waning support for Falangism during the '60s. He worked to motivate the Francoist youth movements ahead of the 1970 Elections, which resulted in a victory for the Francoist-aligned Alianza Popular, and served as the Housing Minister in the new government until unexpected death in 1976.\n\nAfter some political maneuvering, Molina managed to become Valcárcel’s successor as President of Iberia. Since then, he has tried to keep the fire and spirit of Francoism and Catholic Iberia alive, managing to keep the Alianza Popular in power as he spouts the same rhetoric that de Valcárcel and Franco used. It also helps that he restricts most of the genuine political opponents by branding them Terrorists and locking them away to where their “Destabilizing Speeches” can’t be heard." 

 # Minister #
 IBR_Manuel_Monteiro_hog_desc: "“Home is where there is no bread, everyone scolds, and no one is right” is a Portuguese proverb that speaks to the youth of the Portuguese União Nacional. Numerous theories emerge from the ranks of the UN's youth parliamentarians. Monteiro, who served as the organization's president from 1985 to 1989, was a significant figure in those ranks.\n\nRivalry amongst candidates for vice president began in 1993, following Lucas Pires' dismissal on charges of being overly liberal. Monteiro became the new vice president of Iberia with the assistance of Adriano Moreira, the foreign minister in the 1960s.Even if Monteiro comes off as a relaxing and nice man in interviews, he is an ambitious man, and we will take the risk if an opportunity presents itself, no matter the repercussions."
 IBR_Alfonso_Armada_sec_desc: "Bolsheviks, to many Catholics around the world, are the natural enemy of the people. But to Alfonso Armada, they are to be considered lesser than scum.\n\nBorn in an aristocratic family with military traditions, Alfonso's upbringing was destined to be one of a conservative leaning. He would finish high school in 1935, and in the following year, at the ripe age of 16, he joined the nationalist forces in support of the anti-republican coalition. After the triumph of Caudillo Francisco Franco, Alfonso would become a member of the División Azul, and would take part in the siege of Leningrad, a city which would inevitably fall to the German Reich. With a shining career up to this point, he returned to Spain and became an instructor in various military schools. After the formation of the Iberian Union, Alfonso soon became a member of the newly formed conservative party, Unión Nacional. After their recent electoral victory, Armada was appointed by the current Prime Minister as the Minister of Defence, being considered a shining example of a strong, but most importantly, anti-communist, authority figure."
 IBR_Jose_Miguel_Judice_for_desc: "A mongrel, a bastard and a traitor to many, José Miguel Júdice seemed the perfect candidate for the role of Foreign Minister of Idea.\n\nHis family is built on layers upon layers of foreign descent from Europe, so much so that it makes people wonder how Miguel reached such a high position in the conservative government of the  Unión Nacional. Well, the secrets lie in his knowledge of the individual. He graduated in the domain of law, and soon became an assistant in many more colleges in Lisbon and Coimbra. Being second-in-command during Spínola vice-presidency, a prominent Portuguese political figure, he joined the Unión Nacional in hopes of making a name for himself. While his diverse background did not help him in the slightest, his skill in deal making was what propelled him to his current position. After all, who doesn't need a chameleon as their foreign minister?"
 IBR_Antonio_Hernandez_Mancha_eco_desc: "The Unión Nacional has been an organization that aims at bringing the idea of the first Spanish Caudillo into the new Millennium, and Antonio Hernández Mancha is the perfect example of such a politician.\n\nBorn on the 1st of April, 1951, Mancha in the region of Badajoz, where he lived an obscure life until he became a prosecutor in  Córdoba, and later Granada. In 1980, he became a member of the UN, being an outlier among his young peers for his staunchly conservative views. Slowly, he became a deputy in parliament through his pragmatic personality, and eventually ran in the local Andaluzian election as the Unión Nacional's representative in 1991. A year later, however, Mancha would found himself in controversy as he pushed forward a censorship bill against the liberal wing of the party, a motion which unfortunately did not pass through the parliament. Although a figure that is susceptible to cause disputes, Antonio is nonetheless popular within the Iberian southern region, cause by his support of corporatist economic view, but with a “patriotic twist.” We will watch this controversial career with great interest."


### Ideas ###
 IBR_Tourist_Hotspot: "The Tourist Hotspot of Europe"
 IBR_Tourist_Hotspot_desc: "The Iberian peninsula is home to one of the strongest tourism-based economies in the European continent, thanks to its natural wonders such as the beaches on the Mediterranean coast  and its rich and historically important cities like Lisbon or Madrid.\n\nEvery year thousands, if not millions, of tourists come from every part of the world to our country, wherever it is for spending their holidays or only taking a pause from their monotonous lives and enjoy new activities thanks to the vast options that Iberian tourism offers to them.\n\nNevertheless, our government profits from this high-intensity tourism, earning Iberia the record of being the most visited country in the world, only rivalled by few other countries around the globe."
 IBR_Between_Two_Worlds: "Between Two Worlds"
 IBR_Between_Two_Worlds_desc: "Iberia’s position in Europe has put it on the center of contestation between the OFN and the Europakt, both superblocs fighting a silent and covert conflict to bring the Union in their respective spheres.\n\nThe current government wishes to continue its policy of neutrality in order to preserve the balance of power in Europe but with the passing of time it is starting to become apparent that soon or later Iberia must make its mind on who to support in the International chess game.\n\nIn the meanwhile, the two giants will continue their attempts to persuade Iberia into joining their orbits but will the OFN gain  a foothold in the old world? Or shall the Reichsadler continue to take under its wings more sons and daughters of Europa?"
 IBR_The_Basque_Conflict: "The Basque Conflict"
 IBR_The_Basque_Conflict_desc: "Although the Iberian Union has assumed a somewhat-more democratic shape and has given the various ethnic minorities more representation in the government, not everyone has been content with this solution and still vies for the total independence of their native soil.\n\nThe most prominent and troublesome Independentist group is the ETA, the most prominent and active openly terrorist group for the Independence of the Basque region which has been active in Iberia since the late 50s.\n\nThey have not given up their goal, and have the blood of hundreds of innocent people on their hands through various terroristic activities ranging from bombings to assassinations on various civilian and military figures, with their activity intensifying in the later years.\n\nShouldn’t the government take immediate and firm action against this rebellious scum, Iberia may not live long enough to see the dawn of the new century."

# Events #
 IBR_discontent.1.t: "Iberia’s Growing Nationalism"
 IBR_discontent.1.desc: "A quick glance at the 1989 edition of ‘La Historia de Iberia,’ the standard textbook issued to nearly every eighth grader in the Spanish-speaking regions of Iberia, will inform readers that the scourge of terrorism that rocked Iberia during the time of the Caudillos was stamped out long ago. The Iberia of today, it reads, is a harmonious landscape of divergent languages and cultures. This sanitized history, unfortunately, couldn’t be further from the truth. \n\nSurfing the net reveals a litany of small, personal websites, all featuring name-filled guestbooks, hit counters in the thousands, and garish, repeating patterns of regional flags for backgrounds. These small sites, each with their own bustling forum of supporters, feature no shortage of hastily-typed manifestos bemoaning the injustices inflicted upon one region or another. The Portuguese, according to many such sites, are a minor partner in the Union, and Iberia is really controlled by the Spaniards. Other sites make the case for Galician autonomy, while others still demand outright independence for regions like Catalonia and the Basque Country -- through any means necessary. \n\nAs these websites grow in popularity, their users have moved their activities into the real world, organizing protests that, more often than not, result in violence. To the average Iberian, these fringe groups are barely even worth thinking about — but, if left unchecked, their impact could be far greater than expected. It is imperative that we, as patriotic Iberians, fight this growing tide of radicalism at every turn. Failure to do so could spell the end of Iberia by the dawn of the new Millennium."
 IBR_discontent.1.a: "We must do something to stop this unrest."