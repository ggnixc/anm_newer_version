### Leader Localisation ###
 ## Country Leaders ##
 POLITICS_PINO_RAUTI_DESC: "Giusseppe Umberto 'Pino' Rauti, born on the 19th November 1926 is the current Duce of Italian Social Republic established by Italo Balbo some forty years ago. Being active in politics since 1948 he quickly rose through the ranks of the PNF from the leader of the Fascist youth to the position of the prime minister under Alfredo Pazzaglia's cabinet, who like him was against the war with Kenya because he saw it as unnecessary waste of money on a swath of unusable land. The so called ''Almirante's blunder“, when the Italian National Republican Army lost to a bunch of Kenyan farmers and peasants a coalition of moderate reformists took control of the Constitutional Assembly, lead to a quick rise on Rauti's part. After Pazzaglia's retirement in 1995, Rauti won in an landslide with his promise of major economic overhaul that will propel Italy into a new economic renaissance but that proved to be easier said than done. Old party members and major corporate players blocked any and all of Rauti's reforms to the point that the Duce realised that he himself isn't the leader of their nation but corporations and the old guard.\n\n Since then Rauti is looking the past times when the word of the Duce meant something and it was worth something. He must bring back the glory of the past."
 POLITICS_FRANCESCOBAGHINO_DESC: "Francesco Giulio Baghino is the 4th Duce of the Regno D'Italia, and he was destined to bring the Kingdom and its sphere into the new Millennium through wise political leadership and the finalization of the Italian recovery from the crisis…Or at least this was what he thought to do.\n\nBorn on the 4th June 1911 in the city of Taranto in the Prosperous Sea-region of  Liguria, he knew the hardships of the First World War.\nIn the early 1930s he started a career as a Journalist but when Italy joined its Teutonic Ally in the Second World War he enlisted as a soldier, climbing the ranks and becoming a Officer. \n\nIn the 1960s he retired from the military and decided to enter into Politics using his oratory skills and eventually managed to become a leading-figure in the moderate faction of Duce Italo Balbo's clique  following his ascension as Leader.\n\nIn 1976, with the Death of Balbo, he became Party Secretary under Fanfani's Administration and during this time he tried to persuade the Duce to push for a crackdown in the Rebelling Colonies but in vain.\n\nHis time to shine came when he was chosen to become the new Duce by the various factions of the PNF, and since the beginning he wanted to lead Italy into a new Era of Prosperity and Stability but he quickly realized what he actually was: A puppet for the squabbling and aggressive cliques of the Party, fighting like Vultures in an attempt to take for their respective leader the mantle of future Duce.\n\nBaghino, upon realizing this, grew lethargic and even arrived to despise his new position. But he had to carry on for the Country's sake, or it would have been plunged into a worse situation than the one it already was. \nBut now, in the year 2000, with him growing disillusioned day after day and losing faith in his leadership, Baghino is now thinking of handling power to the Gran Consiglio del Fascismo and spend his last days on Earth and in the Bel Paese without the Heavy Burden of the Cutthroat Politics of the Kingdom…"

 ## Ministers ##
 ITA_minister_Ignazio_La_Russa_hog: "Ignazio La Russa"
 ITA_minister_Ignazio_La_Russa_hog_desc: "------------\nBorn on 18 July 1947, in Sicily at the height of the PNF's popularity in Italy and Mussolini's control over the country, he would be exposed to Fascism early due to his father, a political secretary of the Fascist Party in Sicily.\n\nIngazio would become interested in politics and especially Fascism at an early age, due to his father's rising popularity in the PNF in Sicily. Becoming an exchange student in Austria during the early 1960's, he returned home as a young man and entered the PNF's inner workings at the height of the 'Dopo Ciano' era, under Duce Italo Balbo.\n\nRising through the ranks of the government, he would fill various roles such as the leader of the GIL and Secretary of the PNF. \n\nIt was under Baghino that he truly began to rise in the party hierarchy, firstly being assigned as an adviser to the local collaborators of Croatia where he styled himself as a competent and shrewd statesman and then as the head of government of the Italian Kingdom in 1994."
 ITA_minister_Filippo_Berselli_sec: "Filippo Berselli"
 ITA_minister_Filippo_Berselli_sec_desc: "------------\nFilippo Berselli was born on the 20th of September 1941 in Bologna, in his youth he would live under a great empire, dominating both sides of the Mediterranean, he looked upon the great Duce, Benito Mussolini, as the one who brought glory to Italy, who restored Mare Nostrum. After the death of Mussolini, he would continue supporting the government of Galeazzo Ciano. Following the collapse of the Triumvirate, he would join the military, and fought in the Italo-Turkish war. \n\nAfter the ascension of Italo Balbo and the application of his reforms, he would feel betrayed and abandoned, the Bel Paese and Fascism was lying in shambles, as it's legacy was betrayed. He would continue his career in the military in the ranks, but after the death of Balbo, he would start a career in politics, as a extreme reactionary, he would first become a local official in Bologna, and eventually he would rise further and further in the ranks of the PNF, in the end finally becoming the security minister, bringing the New Roman Regime one step closer to truly restoring their Spazio Vitale once and for all…"
 ITA_minister_Alfredo_Mantica_for: "Alfredo Mantica"
 ITA_minister_Alfredo_Mantica_for_desc: "------------\nAlfredo Mantica born on the 17th July of 1943 in Rimini. A fervent nationalist and supporter of fascism, he joined the Gioventù Italiana del Littorio as soon as he could, and then the Gruppi Universitari Fascisti when he began studying in the Cattolica.\nWhile originally somewhat resistant to Balbo's reforms, he soon enough perceived the great achievements that the changes had to the system and became a fervent supporter of Italo Balbo.\n\nAfter the death of the Great Duce and ascension of Fanfani to the role Mantica found himself rapidly advancing in his field. First serving in low level ambassadorships to the Italian puppet states of Croatia and Albania for half a decade he was soon relocated to serve as Italian ambassador for the Holy See.\nIn the end he was placed as an ambassador to the United States, a position he held until the end of Fanfani's rule. In the early 80s Fafani retired due to ill health and after a heated debate Francesco Baghino became the new Duce, Mantica was recalled from Washington and given the position of a deputy foreign minister of Italy.\nFinally when his colleague and friend Ingazio La Russa became Duce's second in command Mantica was officially made Italy's minister of foreign affairs."
 ITA_minister_Giulio_Tremonti_eco: "Giulio Tremonti"
 ITA_minister_Giulio_Tremonti_eco_desc: "------------\nTremonti was born on 18 August 1947 in Lombardia to a family partly of ancestry from the Mezzogiorno. His family had not been involved in politics or any functions of the Italian Fascist government, and had been mostly liberal. One of his uncles was briefly detained by OVRA in the late 1930's for anti-war agitation in the wake of the Italo-Ethiopian war.\n\nTremonti attended law school and became a lawyer in Milano, soon thereafter joining the Finance Ministry as an accountant and legal specialist, quickly rising through the ranks.\n\nIn the government of Amintore Fanfani he would become the Head of the Department of the Treasury, and in the government of Francesco Baghino, he would become Minister of Finance."


### National Spirits ###
 ITA_King_Amedeo: "King Amedeo I"
 ITA_King_Amedeo_desc: "His Royal Majesty Amedeo I di Savoia-Aosta is the current monarch of Italy by the grace of god and the will of the Italian people, may his reign last long!\n\nBorn in the year 1943, growing up he was not groomed to be the king of Italy but rather the king of Croatia, a puppet kingdom on the other side of the Adriatic coast that was established back in the Second World War by the local fascist who received support from our first Duce but soon after the end of the war they fall from his grace, resulting in a coup that ousted them from power.\nAmadeo ascended on the Croatian throne after his late father murder by the Croatian rebels but not before the country was clesned of such filth. He ruled the lands of Croatia up until the turbulent years of the so called Oil Crisis, when by sheer luck a band of Yemeni terrorists managed to kill the heir presumtive, leaving Amadeo with no other choice but to accept the Italian crown.He left Croatia in the hands of the local collaborators who were instructed to serve as caretakers of the allied kingdom.\nAmadeo was crowned soon after the death of Umberto II in 1983 and even if the king is a mere figurehead he is to this day widely seen in a positive light by the Italian people, a real rarity considering their political scene."
 ITA_Strait_Bridge: "The Strait Bridge"
 ITA_Strait_Bridge_desc: "Balbo's legacy is surrounded by his economic reforms that over the course of time, permitted him to start what passed to history as the most important Italian infrastructural project  of the last century: the gargantuan Bridge on the Strait of Messina.\nIt expanded greatly the economical capabilities of Southern Italy, but most importantly it made the Duce earning the respect and support of thesouthern Italian communities. Sadly, Balbo wasn't able to see the project finished as it was completed in 1982,  years after his death. \nBut this jewel of engineering shall remain a shining pearl of our Duce hard work in the name of the Fatherland! " 
 ITA_nomoreempire: "Collapsed Colonial Hegemony"
 ITA_nomoreempire_desc: "Oh Italy, the fate must have been cruel to permit you to endure the last 30 years. The first spark was the collapse of East Africa and then everything collapsed under its own weight with most of the Empire fracturing, the Empire which you worked hard to build and swore to defend at all costs to avenge the past humiliations all for nothing if not other wrongs and mistakes. And then, you were subjected to a spiral of near-endless economical downfall which ravaged upon you and in the end you were left alone in the world, decaying and plaguing yourself with political instability."
 ITA_recoveringeconomy: "Recovering Economy"
 ITA_recoveringeconomy_desc: "The Italian economy was still recovering from the catastrophic Oil crisis that nearly vanquished the most powerful European economies, when in the 80s the Second West Russian war destroyed again the peace and prosperity of the blood-soaked continent that Europe is. In fact, in that time-period Italy was overwhelmed by the sudden cessation of imports from the Zollverein, and its weakened economy didn't take the blow leading to yet another financial crisis that still lasts today. Sadly our government is still trying to fix the mess, but it is stopped by neglecting bureaucrats and by the labyrinth in the Italian administrations, causing unrest in the lower classes of the Italian people."
 ITA_computergoldenage: "Italian Computerization Golden Age"
 ITA_computergoldenage_desc: "Since the launching of Weltnetz, the whole world thrived for some time, eventually continuing to develop marvelous additions for the growing computer industry but that eventually reached a point of stagnation. Nevertheless, that did not happen in the Kingdom of Italy, which took great efforts to modernise its computer and internet technology, all thanks to the genius of Luigi Bonavoglia, the creator of the first Italian-made operational system: the Da Vinci 1 and then also the first Italian-made Computer, the  MD 900 a upgraded descendant of previous Italian prototypes for a computer. In the dawn of the new millennium, Italy is the second most computerized country in Europe, with the computer technology perfectly integrated in the military,bureaucratic and economical apparatus of the state, and this will continue for the next decade, also supported by the latest Italian OS: the Macchiavelli 2000."
 

