### Events ###
 italy_anm.1.t: "Venetian Great Theatre \"La Fenice\" Re-opens!"
 italy_anm.1.d: "Today on 14 Decembre 2003, the famous Theatre of Venice "La Fenice" Re-opens following years of reconstruction caused by a man-made fire. \n\nIn fact, On 29 January 1996, a devastating arson attack destroyed the theatre. The fire kept the firefighters  busy throughout all the night. \n\nAfter months long investigations, It was discovered that the Fire wasn't an accident, but actually a plot made by the VIET Corporation that was maintaining the Theatre to In order to not iincur a penalty due to the delays accumulated by their company, they decided to cause a small fire to cause a delay attributable to higher force.\n\nTwo workers of it were arrested, and still today they are rotting in jail after a failed attempt by one of the two to escape to Mexico.\n\nReturning on a positive side, today marks the start of a week-long inauguration in honor of the Theatre, under the direction of the famed Italian Conductor Riccardo Muti, at the presence of the Duce itself.\n\nOn  the inauguration day, at the Theatre were performed Beethoven's \"Die Weihe des Hauses\", Igor 'Fëdorovič Stravinskij's \"Symphony of Psalms\"and Antonio Caldara's \"Te Deum\"."
 italy_anm.1.a: "Finally Venetians can enjoy again yet another wonder of their culturally-rich past."
 italy_anm.2.t: "Duce Baghino Steps Down From His Position"
 italy_anm.2.d: "Earlier in the morning, the now former Duce of Italy, Francesco Giulio Baghino has made a decision that was long expected from the international community and his colleagues - his formal resignation form the position of Duce was ratified and accepted by the Grand council of fascism and from tomorrow Cesco Baghino will no longer be the Italian Duce citing old age and frail health as the main reasons.\n\nHe has been the Italian Duce since the removal of Almirante from that position back in 1987 but his reign over the Kingdom was mostly limited to being that of a figurehead and a puppet for the PNF to preserve the status quo in the then almost collapsing state.\n\nUncertainty is what awaits Italy as major PNF players are now converging in the Council's palace to debate over the upcoming months who exactly will succeed the former Duce."
 italy_anm.2.a: "Le cose finiscono, ma i ricordi durano per sempre."
