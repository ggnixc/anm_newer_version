### Descriptions
VIC_vo_van_kiet_desc: "“Glory belongs to the young people who realize themselves early, dare to set out to overcome all difficulties and hardships, and commit to the Fatherland.”
\n\nHow did Võ Văn Kiệt make his way to this current position?
\n\nHe was born in a poor family in Vĩnh Long; at the age of 16, he soon took part in the anti-imperialist movement. Kiệt was rescued from a Kempeitai post in 1951 and discovered the death of his wife and children upon being freed. Having no time for grief, he immediately began his tiresome journey to the headquarters in the north.
Võ Văn Kiệt was deeply admired by the Party members because of his imagination and intrepidity. He dominated almost every debate with his far-sighted rhetoric and idealistic visions. During the war, he oversaw infrastructure projects and became the head of the provisional administration of Huế in 1978.
After the war, Kiệt became adored by the people thanks to his economic and social reforms in the late 1980s. His ambitious plan to construct a grand network of power grids across the country was a massive icing on the cake for him, thanks to his management and the coordinated support from the ROC and USSR. The Party elevated him, eventually he was promoted to General Secretary in 1991. He wants to turn Vietnam into a truly progressive, equal and prosperous nation through “Đổi Mới” - a series of liberalization and renovation of the country. Although its effectiveness has been largely reduced by many conditions, the reforms succeeded in bringing unprecedented growth.
Kiệt's diligent effort to weed out the 'extremists' from the Party has largely succeeded. For the time being, under his benevolent leadership, all factions within the Party are working together for the sake of the nation."

VIC_le_minh_huong_desc: "Lê Minh Hương himself is an interesting man. Hương didn’t commit only to the People’s Public Security - but surprisingly, he also served as head of the People's Committee of Hà Tĩnh, Deputy Minister of Internal Affairs and was a member of the Ministry of Foreign Affairs for many years. 
Hương’s attitude towards the power struggle within the Party is nonchalant, as he knows his sole job is to protect and serve the nation as the Minister of Public Security. But does he have his independent ideology? 
Hương believes in the creation of a counterintelligence state in Vietnam - dominated by the MPS, and functions based on a pragmatic socialist system - technically speaking, something of a totalitarian communist regime, but with a mixed economy.
Hương is fine with serving under either a Reformist, Conservative or a Militarist government. But should the Party find itself torn apart by the race for influence between these three factions - Hương will know exactly what to do."

VIC_do_muoi_desc: "Đỗ Mười became the President in 1991. He was renowned for being a devout follower of Marxist-Leninist doctrine and a staunch supporter of a return to communist orthodoxy. On a particular occasion, he struck a chord after saying, “Capitalists are like sewer rats; whenever one sees them popping up one must smash them to death!.” 
\n\nNow to answer the rather tricky question: How did a hardliner like him become prominent in an increasingly reformist environment?
As it turns out, he nominally allied with the reformist wing since 1992 and showed a supportive stance towards Kiệt’s reforms - hence he became trusted by Kiệt thanks to his architectural skills and dodged multiple political purges. But as Võ Văn Kiệt grows older day by day, Mười slowly expresses his true ideological intentions and consolidates his position as the de-facto leader of the conservative faction within the CPV.
To him - ‘Đổi Mới’ is but an insidious conspiracy to defy and contravene the true principles of the revolution and bring corrupt capitalism to Vietnam. Mười has plans to transform Vietnam into the immortal bastion of communism in Southeast Asia, regardless of how long it takes him to prepare."

VIC_le_duc_anh_desc: "Having led the armies of the Việt Minh through the hardest battles of the Liberation War - Lê Đức Anh is considered one of the ‘top dogs’ of the military, a war hero and charismatic figure within the Communist Party of Vietnam. Being a staunch conservative, Anh narrowly avoided persecution by the reformist faction - thanks to his reputation amongst senior Party members and most of the military officers. 
Anh is considered even more uncompromising than Đỗ Mười, and repeatedly recommended maintaining a tight leash on both domestic and foreign affairs. As a man who has fought tirelessly in the brutal war - he wants the armed forces to gain the authority to become more involved in politics and governmental affairs. But unfortunately, his militarist clique has experienced a significant decline in influence and members - which has forced him to make a pragmatic deal with Đỗ Mười’s conservative wing. 
However, his belief remains unchanged. Lê Đức Anh has always considered the army to be the true cornerstone of the revolution - and no politicians can ever have a better backbone to carry out such an important task."

VIC_nguyen_sinh_hung_desc: "Hùng was born in the same place where Hồ Chí Minh had come to life: Nam Đàn District, Nghệ An. He was a student at the University of Finance and Account. In 1972, Hùng served as an officer in a Japanese-owned bank in Hanoi. Around this time, the Việt Minh experienced near extinction and was pushed back to its starting place. 
However, the turning point came in 1976, when the Great Asian War broke out and the Việt Minh regained momentum thanks to the distraction of Japanese forces and coordinated aid from Japan’s rivals. Hùng capitalized on this occasion and defected to the communist side. He was chosen to be one of those who would later lay the foundation for the Ministry of Finance. After the war, he managed the restructuring of the national shipbuilding industry and was admired for effectively responding to maladroit attempts that could have wasted billions. During the reconstruction period, he was well-known for exuberantly helping Chinese and American delegates with carrying out proper investment, accelerating the reconstruction progress. 
Upon formally becoming the Minister of Finance, he strongly denounced authoritarianism, corruption and irresponsibility. Thanks to him, trade with the Republic of China and the USA has been strengthened, the economy has seen drastic transformation and the policies have become more flexible."

