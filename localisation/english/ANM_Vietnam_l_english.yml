### Leaders ###
 ## Names ##
 VIN_Tran_Thien_Khiem: "Trần Thiện Khiêm"

 ## Descriptions ##
 POLITICS_TRAN_THIEN_KHIEM_DESC: "One of the most ardent Vietnamese nationalists, Tran Thien Khiem is a relic of another time, a time when military cliques ruled Vietnam, from Ngo Dinh Diem to Nguyen Kanh, and where Vietnam was yet another backward and post-colonial backwater. But much like the world around it, Vietnam has also rapidly changed, with Khiem playing no small role in that transformation. An aspiring military officer part of Ngo Dinh Diem’s clique, Khiem would be a participant in most of the revolving door military coups that dominated the post-Communist period, although finally sticking with good friend and commanding officer Trần Chánh Thành.\n\nServing as his deputy for the better part of two decades, he would aid Thanh in the rapid development of Vietnam, financed by Chinese and Japanese money.  But as Thanh died, the party nearly tore itself apart over which sun to orbit, and Khiem was forced to intervene to prevent a broader conflict. Although stabilizing Vietnam after Thanh’s death, Khiem contains none of the leadership skills, nor charisma that his predecessor contained. Now, after ruling Vietnam for nearly a decade, Khiem can feel the angel of death calling him, and although content with life, he wonders what will happen to his great nation after his death, and how it will continue to change."

### Ideas ###
 VIN_Splinters_within_the_Colossus: "Splinters within the Colossus: Prevalent"
 VIN_Splinters_within_the_Colossus_desc: "The combination of civilian political mechanisms and military control over the civilian political sector in Vietnam created a byzantine government structure, often called the Colossus for its vastness. Within this gargantuan system, several major and minor cliques compete to influence the state’s machinery, frequently leading to infighting among the party-state and reducing political efficiency.\n\nAs of late, the Colossus is splintered, the unification of the stratocratic party-state splitting into three different factions, each differing in their approaches to domestic and foreign policy, from Chinese-influenced social republicans to Japanese-inspired finance bureaucrats. As the infighting between these cliques grows, the government grows more divided and falters in the face of civil and violent resistance. "
 VIN_Whispers_of_the_Red_Flag: "Whispers of the Red Flag"
 VIN_Whispers_of_the_Red_Flag_desc: "In the bulging streets and alleyways that make up the city of Hà Nội, gossip is commonplace. But so are whispers fearful of reprisal, once powerful shouts against imperialism and Pan-Asianism. So lives on the myth of the Việt Minh.\n\nIn the fervent year of 1972, Vietnam saw the fall of the collaborationist regime at the hands of the communist guerrillas, which quickly took control of the nation. But as swift as liberation was, so was the invasion that followed it. Full of preparedness, both Japan and China sent their respective armies to quell the insurgency. While the Việt Minh has long ceased to be an official threat, splinter movements and organizations can be found all over Vietnam. Their new methods of resistance have showcased the twisted nature of their minds, as news of terrorist attacks taking place in crowded city centers is not unheard of. A cancer is plaguing the Republic, and the disease must be combated. "
 VIN_Lowly_Moon_Between_Two_Suns: "A Lowly Moon Between Two Suns"
 VIN_Lowly_Moon_Between_Two_Suns_desc: "From the rubble that was caused by the Việt Minh takeover of the nation, emerged a new, shining republic, built on the pillars of Pan-Asian ideals. But this rebirth could not have been achieved without the generous influx of Japanese and Chinese aid. The aforementioned economic giants of the Co-Prosperity Sphere diligently assisted the republican government in its reconstruction efforts, seeking to prevent the possibility of another communist insurgency from transpiring.\n\nThe price for this financing would entail the deepening of both economic and military relations with either of the behemoths, a dilemma which the Vietnamese government has sought to turn a blind eye to. The Land of the Blue Dragon has been keenly observing the rise in tensions between the Tōkyō and Nanjing regimes, and as the curtain is drawing in, the nation must choose which side of history it will fight for."
 VIN_War_on_Phu_Quoc: "The War on Phú Quốc"
 VIN_War_on_Phu_Quoc_desc: "The Co-Prosperity Sphere, as its name suggests, is an organization meant to represent the combined efforts of nations of Asian origin to achieve peace and economic affluence. In reality, many members of the pact find themselves at odds, most commonly land disputes driving their mutual hatred.\n\nNo different is the Phu Quoc conflict. The ascension of Khieu Samphan to the presidential throne in 1976 brought with it many irredentist claims that were forcefully laid dormant, to placate the governments of both Thailand and Vietnam. The island of Phu Quoc is an example of such assertions, with the Kampuchean government showcasing its military prowess with every pretext they have the chance to justify. While officially the region is under rightful Vietnamese control, should Tōkyō not guarantee the territorial integrity of our nation, it is uncertain whether our government will stand by and allow itself to be humiliated by such excuses of ethno-nationalists. The wick of the Indochinese powder keg only awaits the day it will be lit up."
