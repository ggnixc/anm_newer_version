### Events ###
 VIN.news.1.t:0 "Khong Minh Du secures his leadership"
 VIN.news.1.desc:0 "In these dark times the lands of Asia find themselves at one of the history's many crossroads. The westernised and imperialist states of China and Japan alongside their puppets are experiencing an economic free fall due to the fiscal crash but Vietnamese nation is not faring any better. Being closed from the rest of the world Vietnamese economy whose main source of income was agriculture stagnated to that degree that some are even fearing famine.\n\nThinking that chairman Khong Minh Du was leading Vietnam to its ruin a party congress was proposed to determine shall the leadership be subject to change. The VCP congress was a battleground between the current government, the Doi Mois and the young socialist for a week but it seems that the current chairman, Khong Minh Du has managed to secure his position, purging the unruly rebels from the party."
 VIN.news.1.a: "\"Want\" rather than \"Inequality\" is the cause of trouble."
 VIN.news.2.t:0 "The Doi Moi Faction Dominates VCP"
 VIN.news.2.desc:0 "The spokesperson of the Vitenamese Communist Party has announced to the people of Vietnam and with that to the world that there will be leadership changes in Vietnam. Following the stagnation or downright collapse of the agricultural sector in the whole of Vietnam many started to question is Khong Minh Du actually capable of spearheading the revolution in Asia.\n\nBiggest and the most formidable foe from inside the party was Do Muoi and his clique of party officials that where dubbed Doi Moi. They easily won the vote with over 80% of the party supporting them. International observers are optimistic as Du Muoi did express his desire to open up the sole communist state in South East Asia a bit more towards China and Japan. Will the new president succeed and deliver on his promises about fixing the state remains to be seen."
 VIN.news.2.a: "Our congratulations to Mr. Muoi."
 VIN.news.3.t:0 "The Youth Faction Dominates VCP" 
 VIN.news.3.desc:0 "Following the stagnation of the Vietnamese economy as the agricultural sector came to a standstill many were demanding change in the leadership. The current chairman was accused of corruption, negligence and myriad of other violations by the members of the VCP who demanded a party congress to be held.\n\nAfter the last votes were cast in the halls of the national assembly it was announced that Anh Ba Sam of the young socialists has won. Even though he is still seen as young by other politicians his proposed plan for economic revitalisation was accepted. In his inaugural speech he promised to strengthen the collective economy and weaken the direct state control over the agricultural sector by granting them more autonomy. He also stated how he plans to continue to fight the class struggle and at the same time protect a small portion of the elite by giving them rights to intervene in the agricultural sector."
 VIN.news.3.a: "Is he the real deal or nothing more than an upstart youngster is to be seen"
 VIN.news.4.t:0 "Nong Duc Manh Dominates VCP" 
 VIN.news.4.desc:0 "Stagnating economy, disastrous economic reforms, long forgotten agricultural sectory. These are just some of the accusations that the members of the Vietnamese assembly shouted at the current General Secretary. The current secretary, Mr. Minh Du did everything to mitigate the damage and try to save face but alas it was all in vain as he was voted out of his office.\n\nNow he is succeeded by a complete opposite of his character, Nong Duc Manh, an industrialist at heart whose background while not being the clearest has managed to meteorically rise through ranks, first being one of the youngest chairmen of the assembly and now as the new general secretary. In his inaugural speech he outlined his plan to transform Vietnam from a backwater agricultural country into a modern industrial state by selectively opening the country to various foreign investers."
 VIN.news.4.a: "Our congratulations to the new secretary."

