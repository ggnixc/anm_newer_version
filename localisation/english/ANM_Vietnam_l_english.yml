 #Ministers
 VIN_Bui_Diem: "Bùi Diễm"
 VIN_Le_Minh_Dao: "Lê Minh Đảo"
 VIN_Nguyen_Xuan_Oanh: "Nguyễn Xuân Oánh"
 VIN_Ha_Thuc_Ky: "Hà Thúc Ký"

 #Descriptions
VIN_Duong_Hieu_Nghia_desc: "Born in Sa Đéc, 1925, Dương Hiếu Nghĩa studied in Đà Lạt military school and became a renowned tank commander during the war - thanks to his trophies in the battles of Thanh Hóa and Huế. 
\n\nWell-known by most people, Nghĩa was a staunch supporter of Nguyễn Khánh’s junta, Nghĩa himself ordered his tank division to blockade Huế and shoot down several buildings suspected to be the shelters of pro-monarchy forces. During the war, his armored division successfully penetrated the exposed fortifications of the Việt Minh in Thanh Hóa, and performed remarkably in the long and brutal defense of Huế in the final month of the conflict. 
\n\nAs a considerably influential figure in the ARVN and a trusted partner of Nguyễn Khánh, Nghĩa consistently remained as an important military general who had a concrete political position under the administrations of Nguyễn Văn Thiệu and Nguyễn Cao Kỳ. 
After officially coming to power in 1991, Nghĩa proved himself to be an autocratic and militaristic leader. He somewhat reminds the South Vietnamese people of the NMC’s leadership from 1965-1978 - mainly due to the increased presence of the military and new regulations of political parties. Nghĩa’s prevalence as the most powerful man in the government occurred in quite an unenviable period where there is a renewed wave of disorientation, looming economic stagnation and an ongoing crisis within the apparatus. 
With the ‘National Malaise’ still in full-swing, Nghĩa has to deal with the situation while balancing the interests of factions within the government."

VIN_Bui_Diem_desc: "Before becoming the second most powerful man in the Republic, Bùi Diễm was the ambassador to the Empire of Japan for 10 years.
\nIn the early 1980s, facilitated by the growing influence of the NPGV within the government, Bùi Diễm’s role became much more important. Diễm served as an advisor on foreign policies and sometimes even essential internal policies. During Nguyễn Cao Kỳ’s reign, he was a moderate politician within the cabinet that advised Kỳ to loosen his grip to implement minimal reforms, which succeeded to some extent. 
\nDiễm is and has always been fighting to save the image of the Republic - and he is considered the strongest reform-minded figurehead under Nghĩa’s presidency. Influenced by his previous visits to Guangdong and Chōsen, Diễm believes that in order to thrive, the Republic has to follow these models, prioritize larger corporations with high competitiveness and productivity while absorbing or regulating smaller, uncompetitive ones to secure maximum growth. Diễm himself has several plans to further integrate Vietnam into the Sphere’s economic bloc while strengthening self-sufficiency and empowering state-sponsored oligarchic families. With the turbulence in the country becoming more severe than ever, what’s in store for him?"

VIN_Le_Minh_Dao_desc: "Who was the intrinsical guardian of the Republic during its most perilous time? To hardliners and veterans alike, the answer is undeniably, Lê Minh Đảo. 
\n\nApril 19th, 1978, will be forever remembered as the day when Đảo’s ascendancy as top military commander of the ARVN became a reality. Đảo led the ARVN’s most experienced division during the bloody battle of Đà Nẵng, in which he effectively demobilized the Việt Minh and took the initiative to retaliate. Đảo then slowly rose up to power and became the Chief of the Joint General Staff in 1990. 
\n\nĐảo has never been on the same wavelength with politicians. To him - they’re just a bunch of sheeps, too afraid and greedy to act for the benefits of the nation. While he and his sons were shedding tears and blood in the battlefield - their so-called leaders were enjoying the spoils behind the line; and his peacetime proposal to purge the military and government of corrupt people even fell on deaf ears. Đảo is leading the ONRO - a nationalistic, radical and hawkish clique of officers who seek to finish what the previous junta couldn’t: completely unroot weakness from the core of the state.
\n\nWill Đảo choose to grin and bear under this nascent regime? Or will he rise up and reshape the Republic under his iron-willed vision? Only time will tell."

 VIN_Ha_Thuc_Ky_desc: "Hà Thúc Ký was born in Huế and was the youngest of eight children. Ký studied in the University of Hanoi and succeeded in getting a bachelor’s degree in engineering. After the Japanese takeover of Indochina, Ký became a member of the Nationalist Party of Vietnam and took part in the fight against the Việt Minh.
\n\nMany people defined Ký as a ‘man who is at war with everybody’ due to his perplexing relationship with almost every leader of the Republic. Under Vũ Ngọc Anh’s administration, he was at odds with the corrupt nature of the government and disdained the display of weakness toward the communist insurgents. When Nguyễn Khánh abolished the monarchy in 1965, Ký was re-invited into the government to serve as Minister of Internal Affairs; however, this quickly ended as Ký and Khánh failed to find a common ground. In 1980, Nguyễn Văn Thiệu signed a decree which outlawed other political parties - and Ký was persecuted in the process, as Thiệu saw him as a threat. 
\n\nHowever, under the presidency of Dương Hiếu Nghĩa, Ký was reinstated and nominated as the new Minister of Foreign Affairs because of his previous effort to strengthen unity within the Sphere in the struggle against communism. Being highly admired by his passion, Ký utilizes this reputation to call for national unity, reforms in economy, politics, culture and education. 


"
