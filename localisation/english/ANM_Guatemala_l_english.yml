 GUA_Manuel_Colom_Argueta: "Manuel Colom Argueta"
 POLITICS_GUATAMALA_DESC: "The premier of Guatemala ever since the Mexican-Guatemalan War, Argueta is a relic of a time that has long passed this world. Initially a prominent lawyer within Guatemalan society, his fame would arise with public opposition to the recently installed military government of Miguel Ygdioras Fuentes, founding the Unidad Revolucionaria Democrática as an opposition party. Following the deposition of Fuentes in the Mexican-Guatemalan War, Argueta would be a prominent collaborator of the transitional regime, fully committing to the ideals of exporting the Mexican Revolution to Guatemala.\n\nWinning the elections and becoming president of Guatemala, Argueta would institute several social reforms, including land reform, nationalization of several industries, and passing more labor rights, expanding his image beyond that of a Mexican puppet. But as the years went by, Argueta’s government has weathered crisis after crisis, his original popular appeal post-Fuentes melting away in the face of deep economic depression. With Guatemala now in profound crisis, the new millennium holds one thing for certain, Argueta will go. "
 
 #NAT. SPIRITS
 GUA_Big_Brother: "Big Brother in the North"
 GUA_Big_Brother_desc: "Ever since the fated Mexican-Guatemalan War of 1967, the destiny of Guatemala has always been controlled by the strings of its northern neighbor, Mexico. With the establishment of a sister dictatorship in Guatemala, the ideals of the Mexican Revolution and the PRI were set in another country, an experiment of whether those ideals could persist abroad.\n\nNow nearly 30 years later, the Mexican Revolution in Guatemala persists, despite its many contradictions, with the PRI’s sister party, the PRD persisting as the dominant party in this semi-democracy.  As Mexico’s control tries to hide behind the shadows, it becomes apparent that this contradiction will eventually lead to a reckoning that will ultimately force the dual nature of Guatemala to be reconciled, to follow Mexico for eternity, or for Guatemala to finally choose its path."
 GUA_Red_Fields: "Red Fields, Orange Temples"
 GUA_Red_Fields_desc: "Although the Guatemalan PRD regime has successfully transplanted the Mexican Revolution into the social fabric of Guatemala, including its populist aspects like land reform, state unions, and development, an aspect of social discontent still exists among the populace from tenant farmers to the indigenous Mayans.\n\nRelatively tame during the '60s and '70s, albeit due to Mexican occupation, the discontent has flourished into a full-fledged revolutionary insurgency, led by communists, revolutionary socialists, and Mayan leaders, as the nascent Guatemalan insurgency fails to stop the spread of the revolution. With the insurgency growing more and more every day, it seems that Mexican troops will have to enter Guatemala once more, to pacify their neighbor and cut the head off of the communist snake."
 GUA_Mirage_of_Perfection: "The Mirage of Perfection"
 GUA_Mirage_of_Perfection_desc: "Identical to the Mexican one, the Guatemalan government is regarded as the same “perfect dictatorship”  model, controlling both the left and right-wing opposition. But underneath the surface, the same fundamental issues exist within the Guatemalan one as the Mexican one. A corrupt bureaucracy, the decay of state ideology, and rapid inflation have spurred societal turmoil and turbulence within the nation of Guatemala.\n\nIt seems that with the reforms of the Mexican government, the cracks within the Guatemalan dictatorship are breaking the structure of the government. To last into the new millennium, it seems that Guatemala must embark on the same reforms that its big brother has, or be doomed to be destroyed."