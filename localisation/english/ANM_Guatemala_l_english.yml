 GUA_Manuel_Colom_Argueta: "Manuel Colom Argueta"
 POLITICS_GUATAMALA_DESC: "The premier of Guatemala ever since the Mexican-Guatemalan War, Argueta is a relic of a time that has long passed this world. Initially a prominent lawyer within Guatemalan society, his fame would arise with public opposition to the recently installed military government of Miguel Ygdioras Fuentes, founding the Unidad Revolucionaria Democrática as an opposition party. Following the deposition of Fuentes in the Mexican-Guatemalan War, Argueta would be a prominent collaborator of the transitional regime, fully committing to the ideals of exporting the Mexican Revolution to Guatemala.\n\nWinning the elections and becoming president of Guatemala, Argueta would institute several social reforms, including land reform, nationalization of several industries, and passing more labor rights, expanding his image beyond that of a Mexican puppet. But as the years went by, Argueta’s government has weathered crisis after crisis, his original popular appeal post-Fuentes melting away in the face of deep economic depression. With Guatemala now in profound crisis, the new millennium holds one thing for certain, Argueta will go. "
 
