 ## Decisions
 GER_Kartenhaus_SIG_power_trend: "§D-- §YPower§! Shifts in the §sReich§! --§!"
 GER_Toolbox_Politics_make_moves: "Make £kartenhaus_texticon §WMoves§!"
 GER_Toolbox_Politics_make_moves_desc: "The political sphere is fickle, and the situation can fluctuate wildly from one day to the next. Therefore, maintaining our influence will require a proactive approach. By reaching out to potential allies, calling in favors, and throwing money around, we can strengthen our position and grant ourselves a stronger position from which to pursue the party's agendas."
 GER_Toolbox_Politics_crack_down_on_dissent: "Crack Down on £GER_NSDAP_Dissident §gDissent§!"
 GER_Toolbox_Politics_crack_down_on_dissent_desc: "Across the land, there stands disorder, traitors of the highest kind that seek to bring down the current regime. Often, in such circumstances, the simplest option is the best. Ordering the Orpo and the Gestapo to go out and initiate another wave of investigations and arrests will hopefully make quick work of the suspected enemies of the regime, and preserve the stability of Germany."
 GER_Toolbox_Politics_promises_to_the_people: "Promises to the £sig_people §YPeople§!"
 GER_Toolbox_Politics_promises_to_the_people_desc: "Unfortunately, due to circumstances beyond our control, the popularity of the regime has faltered in recent times. In order to reduce popular discontent and recover support, we shall give these discontent groups what they want. By making various promises to these groups, we can hopefully gain back our lost support, and restore the popularity of the regime."

