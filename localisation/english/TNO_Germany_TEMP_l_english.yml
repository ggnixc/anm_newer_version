 ##SIG #1:PEOPLE
 GER_SIG_People: "People"
 GER_SIG_People_Colored: "£sig_people §Y$GER_SIG_People$§!"
 GER_SIG_People_Formatted: "The $GER_SIG_People$"
 GER_SIG_People_Bormann_Desc: "Numbering over a hundred million, the §sReich§!'s citizens have been in a state of division and unrest for upwards of a decade. Once, the glory of conquest instilled them with tremendous patriotism, while the flow of loot, imports and raw materials from occupied territories allowed them to enjoy some of the highest living standards in the world. Now, the vast din of humanity cries out to their §LFührer§!; some for bread, some for lead; some for peace, some for war; some for life, some for death. It was the people who made the triumph of National Socialism possible, and they can bring it down just as easily."

 ##SIG #7:REICHSWERKE
 GER_SIG_Reichswerke: "Reichswerke"
 GER_SIG_Reichswerke_Colored: "£sig_reichswerke §Y$GER_SIG_Reichswerke$§!"
 GER_SIG_Reichswerke_Formatted: "$GER_SIG_Reichswerke$"
 GER_SIG_Reichswerke_Bormann_Desc: "Dominated mostly by £reichswerke_logo §gReichswerke§!, a major steel and arms conglomerate, the industry of §YCentral Germany§! is the closest to Germania and therefore both easy to influence and an influencer itself. Much of the economy in §YCentral Germany§! relies on these corporations; in an ideal world they would provide hundreds of thousands of jobs for the massive populace of Germania. However, Germania is largely an economic drain, as much of the jobs that would have gone to the populace have instead become subject to the system of slave contracting, whereby corporations contract the labor of groups of slaves owned by some holder. The executives of these corporations have little incentive to change the situation."

 ##SIG #8:IG FARBEN
 GER_SIG_IG_Farben: "IG Farben"
 GER_SIG_IG_Farben_Colored: "£sig_igfarben §Y$GER_SIG_IG_Farben$§!"
 GER_SIG_IG_Farben_Formatted: "$GER_SIG_IG_Farben$"
 GER_SIG_IG_Farben_Bormann_Desc: "The largest players in the §YRhineland§!'s industry are £igfarben_logo §LIG Farben§!, one of the world's largest chemical companies, and a great innovator in the field of synthetic oil; and §nKrupp§!, a centuries-old titan of steel and guns responsible for a sizeable chunk of §sGermany§! heavy industry in both World Wars. There are, of course, dozens of industrial corporations in the §YRhineland§!, but the dominance of these two is near-absolute when it comes to politics. Overwhelmingly favored by Hitler during his reign, the sheer amount of industrial output produced by these juggernauts is truly staggering. As the coal-fields of the Ruhr valley become active again and the wheels of industry begin to turn once more, the §LFührer§! must tread carefully around the giants of Rhenish industry and their countless slaves, for another upset could see the §sGermany§! economy collapse completely for a second time."

 ##SIG #9:SIEMENS
 GER_SIG_Siemens: "Siemens"
 GER_SIG_Siemens_Colored: "£sig_siemens §Y$GER_SIG_Siemens$§!"
 GER_SIG_Siemens_Formatted: "$GER_SIG_Siemens$"
 GER_SIG_Siemens_Bormann_Desc: "Less directly tied to the war industry than its northern and western counterparts, the corporations of the south are no less vital to the economy. Requiring more skilled laborers, corporations like £siemens_logo §BSiemens§! (innovators in computing and electronic machines) and £daimlerbenz_logo §EDaimler-Benz§! (producers of both military and civilian vehicles) have little use for slaves, though small workforces of them are still maintained for drudge work. This leaves them in something of a precarious position; there are not enough skilled workers in §sGermany§! to allow them to grow, but purchasing and training slaves to build delicate electronics, engines and whitegoods is out of the question. The £super_forpol_usa_texticon §MUnited States§! and £super_forpol_japan_texticon §RJapan§! are quickly outpacing §sGermany§! innovation in these areas, and resentment has been stewing against the §jNSDAP§!'s obsession with heavy industry for decades now. The §LFührer§! must put them to use, or put them down."

 ##SIG #11:BANKS
 GER_SIG_Banks: "Banks"
 GER_SIG_Banks_Colored: "£sig_state_bureaucracy §Y$GER_SIG_Banks$§!"
 GER_SIG_Banks_Formatted: "The $GER_SIG_Banks$"
 GER_SIG_Banks_Bormann_Desc: "A favorite target of the Nazis from the earliest days, banks are eternally unpopular but necessary for the survival of the §sThird Reich§!. Though 'Jewish' and 'plutocratic' influences were purged long ago, the same complains endure: the banks are greedy, deprive the common man of his earnings and are responsible for every single economic hardship endured by §sGermany§!. Ironically, the banks have always held close ties to the §jNSDAP§!, handling the financial wizardry that enabled Hitler's 'economic miracle' of the early 1930s. The banks also managed the massive influx of loot from occupied nations, turning it into liquid assets to fuel the engine of the German war machine and keep the citizenry fed and clothed. Though theoretically at the §LFührer§!'s beck and call, the banks control far too much of the §sReich§!'s economy for his liking; crossing them could prove particularly disastrous, no matter how many guns he can point in their direction."