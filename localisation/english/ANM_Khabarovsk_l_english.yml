#Leader Descriptions 
 KHA_Gorodskoy_Sovet_desc:0 "The Khabarovsk City Council, known to the locals as the Gorodskoy Sovet, was established on the day Khabarovsk gained its independence, joining the ranks of the so-called “microstates” of the world.\n\nTo prevent the city’s government from degrading into an oligarchy, the framers of the Khabarovsk constitution mandated that the City Council would consist of four representatives, each from a different institution within the city -- one for the military, one for the working class, one for the merchants, and one for the monied class.\n\nThe city has thrived ever since. Thanks to the guiding hand of a capable and competent government, poverty has been eliminated within the city’s borders. The University of Khabarovsk’s class of 2000 -- by far the largest in its history -- exemplifies the city’s exponential population growth. Investors flock to Khabarovsk from all corners of the world, and each day, ground is broken on an ambitious new construction project.\n\nAs Khabarovsk continues its upward growth, however, so too do the calls for democracy within the far-eastern city state. Indeed, what began as quiet murmurs from the shadows have snowballed into a massive movement of citizens demanding free elections. Each day, rain or shine, the windows of Khabarovsk tremble at the sound of the booming chants from the streets.\n\nThus far, the Council has managed to hold onto its power -- and perhaps it shall for the foreseeable future. Whether or not democracy is destined to take hold within the Free City, the current balance of power is destined to shift one way or another. With so many bickering factions vying for power within and without, the nature of this coming shift is far too volatile to predict.\n\nNo matter what happens, one thing is certain -- as the world turns a page to the next millennium, so too shall Khabarovsk begin a new chapter of its history." 
 
