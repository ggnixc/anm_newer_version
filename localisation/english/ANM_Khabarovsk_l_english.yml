 #MINISTERS
 ##Head of Government
 KHA_minister_Sokolov_Alexander_Nikolaevich_hog:0 "Alexander Nikolaevich Sokolov"
 KHA_minister_Sokolov_Alexander_Nikolaevich_desc:0 "§iLeft-wing Populism\n--------------\nBorn and raised in Khabarovsk, Alexander Nikolaevich Sokolov joined the workforce at the age of fourteen when he secured a job at a local steel refinery. Nikolaevich slowly worked his way up the ranks, and after many years of backbreaking labor, eventually found himself in the boss’s chair.\n\nHis new role provided him an opportunity to implement the tenents of Communist thought that he had learned from his fellow workers. As head of the factory, Nikolaevich delegated more decision-making responsibilities to his workers, increased their pay, and worked to provide a dramatically safer working environment. Nikolaevich’s reforms would increase the factory’s productivity by such a significant margin that, within a few years, he had more money than he knew what to do with.\n\nNikolaevich would go on to use his newfound capital to buy out a handful of other factories in and around Khabarovsk. Nikolaevich’s innovative, Marxism-informed methods would earn him notoriety as a popular figurehead for Khaborovsk Communists, Socialists, and Anarchists alike.\n\nDespite his Communist leanings, Nikolaevich never imagined himself as a politician -- but the trauma of the Golod Zima would prove to be an animating force in his life. Now having achieved the office of Mayor of Khabarovsk, Nikolaevich, having witnessed firsthand the struggles of his people, works every day to provide a better life for his constituents."

 ##Foreign Minister
 KHA_minister_Lee_Seung_yeon_for:0 "Lee Seung-yeon"
 KHA_minister_Lee_Seung_yeon_desc:0 "§iMarket Liberalism\n--------------\nLee Seung-yeon has never known a free Korea. By the time of her birth in 1968, much of the culture of her once-proud nation had already rotted away under Tokyo’s uncompromising policy of Japanisation, and the situation was only becoming worse by the day.\n\nUnable to accept this fate, her family sacrificed their time and labor, volunteering as teachers in an underground network of schools that served to educate the youth of Seoul about the true history of Korea. When the operation was exposed by local collaborators, it was time to leave -- and in the end, Lee’s family found refuge just north of the Manchurian border in the city of Khabarovsk.\n\nIn her new home, Lee devoted her life to helping the local Korean community hang onto its ancient traditions. Thanks to her tireless work, the small community would flourish into an entire neighborhood of fluent Korean-speakers, within which Lee would rise to the status of local celebrity.\n\nLee’s efforts, however, were met with great resistance from the Steel Group -- a far-right faction of Russians fighting to scrub foreign influence from their native Khabarovsk. Threats, vandalism, and outright violence between Koreans and Russians became commonplace in the ensuing years -- but tensions would reach a boiling point when Lee came home from a routine trip to the market to find her husband lying face-down in a pool of blood.\n\nDespite the horrific tragedy, Lee refused to be intimidated. Now, in addition to her service in the Council as Public Relations Officer, Lee Seung-yeong works on behalf of the city’s ever-growing Korean community. Her aims are humble -- providing food, shelter, and opportunity for her fellow expatriots. From her fellow councilors, she asks only for the recognition, respect, and liberty of her Korean brothers and sisters."
 
 ##Economy Minister
 KHA_minister_Efim_Isaakovich_Zelmanov_eco:0 "Efim Isaakovich Zelmanov"
 KHA_minister_Efim_Isaakovich_Zelmanov_desc:0 "§iTechnocratic Corporatism\n--------------\nMany of Efim Isaakovich Zelmanov’s fondest childhood memories were written within the walls of the South Khabarovsk Synagogue, where his mother and father sacrificed innumerable hours caring for the poor and downtrodden.\n\nAt the age of ten, Zelmanov’s precocious intellect rivaled that of someone twice his age. It was a shame, then, that such a gifted mind had come into the world in the frozen wastes of Siberia, a backwater desert of little opportunity. The youngster's talent, fortunately, would not be wasted for long. On his eighteenth birthday, his local community, having pooled together what little money they had to spare, surprised the young Zelmanov with a one-way ticket to the United States. There, Zelmanov was quickly accepted into Harvard University.\n\nOne fateful night, Zelmanov slumped into his easy chair and reached for the remote. Not three seconds after the aging CRT had crackled to life, he was pinching himself. The seige of his hometown, said the news anchor, had finally come to an end. Khabarovsk had been declared an international neutral zone -- a “Free City”.\n\nSoon, Zelmanov was  in contact with Alexander Nikolaevich, the man in charge of the nascent city state, to establish a foreign exchange program between Harvard and the University of Khabarovsk. When his plane first touched down on the bumpy runway of Nevelskoy International Airport, he couldn’t have ever imagined the heights to which his humble mission to spearhead the exchange program would propel him. Nevertheless, Councilman Zelmanov’s portrait now adorns the walls of City Hall, underscored by his official title -- City Treasurer.\n\nThese days, Efim Isaakovich Zelmanov works night and day to repay the community that bought him that fateful plane ticket all those years ago. His signature -- as far as the City budget is concerned -- is the magic spell that manifested the procession of skyscrapers that now stand proud along the eastern bank of the Amur River."
 
 ##Security Minister
 KHA_minister_Kravchenko_Vladimir_Viktorovich_sec:0 "Vladimir Viktorovich Kravchenko"
 KHA_minister_Kravchenko_Vladimir_Viktorovich_desc:0 "§iUltramilitarism\n--------------\nAfter Vladimir Viktorovich Kravchenko's parents fled eastwards during the collapse of the first Soviet Union, they found a new home in the humble city of Khabarovsk. During his youth, Viktorovich experienced first-hand the poor living conditions endured by the local Russian population; he didn’t realize until well into his adulthood that a better life could exist, that making a daily choice between eating dinner and heating one’s home was not, in fact, how every Russian lived.\n\nSeeking to provide a modicum of stability for his family, Viktorovich joined the local military administration at the age of seventeen, training in anti-guerrilla tactics during the day and patrolling the winding streets of Khabarovsk at night. At first, Viktorovich found himself a lone wanderer on the dark streets of the frigid, far-eastern metropolis, but in short order, the first untrained volunteer signed up to split the night shift with him.\n\nIn a matter of months, Viktorovich had gathered together a sizable band of untrained volunteers, all willing to put their lives on the line to keep their fellow Russians safe and secure. Viktorovich would go on to transform this group into a battalion capable of holding its own against those who would threaten the sovereignty of his adoptive home.\n\nWhen war knocked on the gates of Khabarovsk, Viktorovich and his battalion were hired by the city’s leftist mayor, Alexander Nikolaevich, to serve as an emergency police force, maintaining -- to the best of their ability -- peace and stability in turbulent times.\n\nNow, in his current role on the Council as Khabarovsk’s Head of Enforcement, Kravchenko Vladimir Viktorovich reflects upon the hardships of the past. He is determined to transform Khabarovsk for the better -- to ensure that the next generation needn’t ever sleep with hunger swirling in their stomachs." 


 #IDEAS 
 KHA_unemployed_by_choice:0 "Unemployed by Choice"
 KHA_unemployed_by_choice_desc:0 "There is no unemployment in the Free City of Khabarovsk -- not in the traditional sense, at least. Thanks to Mayor Nikolaevich’s wildly successful “Communal Labor Detachment” program, opportunities to work are so abundant that any capable citizen who spends their days idle does so by choice, not by circumstance.\n\nThe seeds of this peculiar situation were first sown by Khabarovsk’s erstwhile overlord, the Empire of Japan. Failing to see the city as anything more than a source of warm bodies to feed into the Sphere’s ever-metastasizing industrial base, the Tokyo parasites sank their fangs into the city’s workforce, leeching away each and every able-bodied man and woman with rapacious zeal.\n\nFor decades, the only constant that the citizens of Khabarovsk could depend on were the daily fleets of Japanese ships sailing up and down the Amur River -- and the scores of young people sulking on board with rifles trained on their backs. Decades of exploitation eventually drained the city of any and all productive workers, leaving behind only the elderly, infirm, and mentally feeble.\n\nWhen Khabarovsk at last threw off its shackles in the aftermath of the Great Asian War, the dearth of young, able-bodied workers was the first challenge to overcome. The Communal Labor Detachment, then, was created to make the most of the city’s remaining human resources. Work was thrust to every pair of open hands, and thirty years later, there are still more jobs available than there are people to work them."
 KHA_mercenary_presence:0 "Mercenary Presence"
 KHA_mercenary_presence_desc:0 "Concerned with the small size of the Khaborovsk Municipal Garrison, the City Council elected to hire a mercenary force to supplement the city’s defenses in the late ‘80s. The Council needn't wait long for their security needs to be met, as mercenaries from all over eastern Russia flocked to Khabarovsk in search of gainful employment.\n\nNow, unfortunately, the elimination of one problem has given rise to another; Hired guns now outnumber the city’s native conscripts, and have used their leverage to greatly inflate their paychecks. A significant portion of the city’s already-tight budget is now wastefully eaten up by mercenary salaries. With little funds to spare, the Council has no choice but to let bridges crumble, potholes widen, and garbage accumulates on the streets."
 KHA_nevelskoy_airport:0 "Nevelskoy International Airport"
 KHA_nevelskoy_airport_desc:0 "The Nevelskoy International Airport, the largest in eastern Russia, is the go-to refueling station for trans-pacific air travel. The airport is composed of two main terminals: the largest is used primarily by civilians traveling for pleasure, while the second, smaller terminal accommodates wealthier customers such as politicians and businessmen.\n\nWhile considered small by international standards, the Nevelsky Airport is the lifeblood of Khabarovsk -- without this vital infrastructure, the city would quickly find itself without a major source of food and other imported goods. Should anything happen to jeopardize the airport's operation, mass unrest would surely follow."
 KHA_counterfeit_coalition:0 "Counterfeit Coalition"
 KHA_counterfeit_coalition_desc:0 "What happens when you put an Ultranationalist, a Socialist, a Corporatist, and a Liberal in the same room together? Describing Khabarovsk’s City Council sounds like the beginning of a bad joke, but for the citizens of Khabarovsk, the insurmountable gridlock within the city government is no laughing matter.\n\nUnbeknownst to the public at large, a high-stakes battle rages within the Khabarovsk City Council as factions within factions split based on the pettiest of disagreements. It's a miracle, then, that the Council didn’t dissolve entirely when deciding which color to repaint City Hall.\n\nTo the typical bystander, the Council’s ragtag coalition of political opposites seems to work flawlessly, but one doesn’t need to squint hard to see the worms squirming beneath the rock. In truth, the dysfunctional council has driven the denizens of Khabarovsk towards other means of getting things done; Shady organizations, backroom deals, and rampant money laundering have filled in the gaps fostered by the city’s gridlocked government."

