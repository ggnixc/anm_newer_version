 ### Leader Desc ###
 POLITICS_GRIGORY_ROMANOV_DESC: "General Secretary of the Communist Party of the Soviet Union \n--------------\nWhen the Soviet Union collapsed and shattered following the First West Russian War in 1955, several people speculated a return of the Romanov Dynasty in a re-unified Russia.  Few however predicted a Red Romanov to rise to the Summits of the Kremlin, in a Soviet Union similar to the days gone by. \n\nGrigory Vasilyevich Romanov was born in 1923 in Novgorod into a small Russian peasant family. A soldier during the First Great Patriotic War, he had to bear witness as the Germans tore through the Union and shattered it into pieces. He resided in Gorky as the Soviet Armies withdrew back, biding his time. As Suslov began to rebuild the USSR, Romanov joined the Communist Party of Komi, which eventually was re-established as the Communist Party of the Soviet Union when the USSR was reunited in 1972. \n\nFollowing Suslov's death in 1982 and his successor Viktor Grishin in 1992, Romanov took the mantle as General Secretary of the KPSS as a result of his good reputation presiding the De-Germanisation and Reconstruction of the Leningrad Oblast following the Soviet Victory in the Third Great Patriotic War of 1981. \n\nAs the New Millennium approaches, Romanov is determined to continue Suslov's Vision of the USSR, as he eyes the Western Occupied Lands of the Union, still yet to be liberated by Moscow.."

