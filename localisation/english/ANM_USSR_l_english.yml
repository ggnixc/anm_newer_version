 ### Nat. Spirits ###
 FER_Neutral_Zone: "Far Eastern Neutral Zone"
 FER_Neutral_Zone_desc: "With Soviet Partisans ravaging the Manchurian Countryside, as well as Nanjing beginning to assert itself in the Sphere, the Empire of Japan and Union of Soviet Socialist Republics agreed to discuss the status of Outer Manchuria. As Part of the Treaty of Sapporo signed in 1975 between the two nations, the Far Eastern Republic of the 1920s will be restored, the territory will be demilitarised and turned into a neutral zone, and on paper, the land will technically return to Soviet control. Japanese concerns that Vladivostok would once again be used as a Naval dagger at the Heart of Nippon, like in 1905, are thereby addressed with the demilitarisation. \n\nDue to the upcoming Second West Russian War, along with the dealing of its repercussions, Moskva has diverted its attention elsewhere and has respected the Status Quo of the treaty ever since. That is not to say everyone in the Politburo is satisfied with the current arrangement, with some equating the Demilitarisation to the same humiliation Russia suffered in 1905. Nevertheless, so long as the Fascist Menace of Germania occupies Eastern Europe and the Caucasus, the status of the FER will remain on the backburner of policy considerations."
 FER_Cultural_Melting_Pot: "A Melting Pot of Cultures"
 FER_Cultural_Melting_Pot_desc: "When the Tsars annexed Outer Manchuria in 1860 with the Convention of Peking, the territory was a sparsely populated area due to the Qing forbidding Han migration into Manchuria in order to preserve its Manchu identity. This allowed the Russians of the time to settle into the area relatively easily. However, in a cruel twist of Fate, as the armies of the Wehrmacht smashed into Moskva, the Manchurian lapdogs of the Yamato once again seized the region in 1943. This time, the Han, Korean and Japanese people settled the Cities of Outer Manchuria, including Vladivostok and Khabarovsk, resulting in Russians becoming a minority in the region. \n\nArticle 2 of the Treaty of Sapporo stipulates the rights of these settlers must be respected. While the Asian population provides an abundance of cheap labour for the construction of Industry and Infrastructure, the Loyalties of said population are certainly questionable. If push comes to shove and a crisis embroils Northern Asia once more, many of them will certainly choose to side with Nanjing and Tokyo over our regime."
 FER_No_Units: "§RThe Armed Forces of the Union of Soviet Socialist Republics are forbidden to be stationed here.§!"

 ### Leader Desc ###
 POLITICS_YEVGENY_NAZDRATENKO_DESC: "Chairman of the Government of the Far Eastern Republic \n--------------\nYevgeny Ivanovich Nazdratenko was born in a far away land of the Pacific, distanced from the Union's Crushing Defeats in the First Great Patriotic War against the Fascist Beasts of Germania. Nevertheless, he and his family experienced the repercussions of the Soviet collapse. Born in 1949 at the town of Petropavlovsk-Kamchatsky, he was but a boy when Yagoda's Presidium of the Supreme Soviet was torn apart by the Heirs of Harbin, leaving the Soviet Pacific Navy stranded in Kamchatka. Despite these setbacks, Yagoda managed to recoup and regroup, reclaiming the Far East and re-uniting with the Red Fleet, bringing about some semblance of stability. \n\nAs the Soviet Union reunited, Nazdratenko attended the Vladivostok State University of Economics and Service, renamed from the Urajio State University when the Union successfully negotiated a return of Outer Manchuria from Japan. Nazdratenko graduated in 1983 with a Specialisation in Economics, and took interest in Yagoda and Kosygin's System of Cost Accounting, whereby corporations and limited open markets would be tolerated by the Presidium to accelerate the 'developmental' stage of Socialism. \n\nWith a promotion to the position of Chairman of the FER in 1993, Nazdratenko will aim to build on the Legacy of Yagoda and his System of Cost Accounting, and if he performs his duties to a high standard, perhaps even Moskva can take inspiration from Yagoda's Theories in full..."

