 ### Ministers ###

 SOV_Gennady_Yanayev_hog_desc: "Chairman of the Presidium of the Supreme Soviet \n§eMarxism-Leninism§!\n--------------\nThe death of the Soviet Union should’ve also heralded the death of communism in Russia. Instead, the Union’s collapse created generations of young Russians who swore through clenched teeth to bring back the glory of the USSR, avenge the Great Patriotic War, and behead the despicable Teutonic serpent lurking to the west. Gennady Yanayev, "Chairman of the Presidium of the reborn Soviet Union, embodies the vengeful spirit of this generation to a tee. \n\nBorn in Gorky in 1937, Yanayev was only a child when the USSR collapsed into a miserable mosaic of squabbling warlord states. Having studied as a mechanical engineer, he spent much of his young adulthood producing tanks for the Gorky Military Commission, and when Gorky finally reunited with the Communist Party of Komi in 1964, he joined the reformed KPSS and briefly led the Gorky Komsomol. An active member of the Defence Industry Workers Union in western Russia, Yanayev rose to become the Leader of the All-Union Central Council of Trade Unions after the Third Great Patriotic War. In this role, he was instrumental in rebuilding union organisations in the newly-liberated Moscow territories. \n\nWith Grigory Romanov’s rise to power in 1992, Yanayev's success in integrating the Moscow territories and outspoken support for Romanov led to his appointment as Premier of the USSR. Now, as the second most powerful man in all of Russia, Yanayev’s long-held dream to emancipate the entirety of his Motherland’s stolen territories is, at last, within reach."

 SOV_Vladimir_Kryuchkov_sec_desc: "Minister of Internal Affairs \n§eMarxism-Leninism§!\n--------------\nCritics of the USSR say that the MVD is simply a cudgel weighted to crush any and all dissent. The MVD, of course, flatly rejects these baseless criticisms. After all, under Vladimir Kryuchkov’s watchful eye, dissenting opinions are allowed to be spoken freely...as long as they happen to be the correct ones. \n\nBorn in 1924 in Stalingrad, Kryuchkov originally studied to be a lawyer, but was forced, alongside his family, to flee eastwards as German troops laid siege to the city. Eventually settling in Irkutsk, he finished his law studies and worked for a time as a prosecuting attorney. Kryuchkov’s uncanny ability to break down even the toughest of defendants attracted the attention of Yagoda’s NKVD, and, after a handful of enticing offers, Kryuchkov soon donned the badge of an NKVD agent. \n\nKryuchkov’s first missions primarily involved breaking Sablin’s Mutiny and smothering dissent against the Presidium. After reunification, Kryuchkov worked to sow dissent in Eastern Europe in the leadup to the Third Great Patriotic War, all the while climbing the ranks of the NKVD. In 1988, he was finally promoted to head of the reorganised MVD. \n\nWith the post-reunification dissent from right-wing groups now residing comfortably in the past, Kryuchkov’s MVD now turns its gaze inward. A hardline Communist, Kryuchkov fears what the reforms of Lukyanov and his 'Pragmatists' could bring to the USSR — and he will not hesitate to 'offer a helping hand' should the reforms go too far..."

 SOV_Aleksandr_Bessmertnykh_for_desc: "Minister of Foreign Affairs \n§eBolshevism§!\n--------------\nWith each amber sunrise, the behemoth-sized shadow of the Soviet Union looms larger over the Volkshalle. But even the mightiest of giants are nothing without reliable allies by their side — and Alexander Bessmertnykh is one of them. \n\nBorn in 1933 in the vast Siberian tundra, Bessmertnykh was just ten years old when he lost his father in the torrid fires of the Great Patriotic War. From then on, he was forced to rely on his mother, who moved his family to Chelyabinsk. There, despite his moderate Communist views, Bessmertnykh became an administrator in the West Siberian People’s Republic, quietly rising through the ranks until Khrushchev’s interparty coup of Kaganovich. Having somehow avoided the ensuing purges, Bessmertnykh played a minor role in the reunification negotiations between Khrushchev and Suslov and, much later, the final reunification of the entirety of Russia. \n\nPost-reunification, the light of Bessmertnykh's rising star fully shined during the USSR-Japan Treaty of Sapporo negotiations, during which his silver tongue secured Vladivostok and a handful of other Japanese-occupied territories for the USSR. In 1976, Bessmertnykh, assigned the post of US Ambassador, established full diplomatic relations between the USSR and the United States, forging an unbreakable partnership to oppose the murderous regime in Germania. He was shortly thereafter promoted to Foreign Minister under Romanov’s premiership, the position he continues to hold to this day. \n\nIt is thanks to Bessmertnykh’s diligent alliance-building that, today, at the cusp of the Third Millennium, the USSR is more prepared than ever to end, once and for all, the scourge of National Socialism that has plagued the people of Europe for over half a century. Should the Fourth Great Patriotic war ever come to pass, Bessmertnyk will be the man to facilitate support from the soaring eagle across the Pacific."

 SOV_Anatoly_Lukyanov_eco_desc: "Minister of Finance \n§ePragmatic Communism§!\n--------------\nWhat better place to put your fiercest rival for the top job than your very own cabinet? You get to keep a constant eye on all of their business, and the moment they commit any blunder, big or small, you’ve got a free excuse to toss them out with next week’s trash. That’s what Anatoly Lukyanov believes is happening, at least. Why the hell else would Grigory Romanov, of all people, offer him the cushy post of Finance Minister? \n\nDriven from his hometown of Smolensk during the First Great Patriotic War, Lukyanov and his family — sans the fresh, shrapnel-ridden corpse of his father — fled to the Far East before finally settling down in Magadan. Once Yagoda’s forces finally liberated the area , Lukyanov joined up with the local Communist Party branch. He soon ascended to the rank of Port Manager for Magadan, helping to liberalise the economy and establish 'Special Economic Zones' within certain parts of the city. \n\nPost-reunification, Lukyanov, a supporter of the Cost Accounting System brought in by Yagoda, rocketed up the ranks of the Communist Party. After the death of Viktor Grishin, Lukyanov was one of the favourites to succeed him as Premier, but he was ultimately bested by Grigory Romanov. \n\nLukyanov may not be Premier just yet, but even so, what better place to be than the cabinet of your fiercest rival? While he may have put you there to shut you up, he’s got to spend a large chunk of time and effort keeping a close eye on you. If you know what you’re doing, of course, you can still get away with some shady dealings here and there — not that Romanov’s dependable Finance Minister would ever deign to sink so low. \n\nYes, Anatoly Lukyanov may not be running the show just yet, but he’s already got the next act scripted and ready to go once old Romanov exits stage left."

