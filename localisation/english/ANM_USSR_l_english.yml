 SOV_get_law_tooltip: "[GetAssortedLawsDescSOV]"
 SOV_Laws_Secession_Republics_Forbidden_desc: "§cArticle 17§! of the £GFX_SOV_txticon_hammer_sickle  §e1934 Bukharin Constitution§! stated: “To every £GFX_SOV_txticon_soviet_icon  §eUnion Republic§! is reserved the right freely to secede from the §eUSSR§!”. In §eMikhail Suslov's§! eyes, this seemingly insignificant clause had massively damaged the territorial integrity of the §eUSSR§!, tearing it to shreds as the £GFX_SOV_txticon_Swastika  §oGerman Reich§! began to advance in the War of 1955. \n\nFrom §RAlexander Shumsky§! in the §eUkrainian SSR§!, to §RZhumabek Tashenov§! in the §eKazakh Republic§!, traitorous elements attempted to secede from the §eSoviet§! project and create independent socialist states during the motherland's greatest weakness. Taking lessons from the £GFX_SOV_txticon_america_icon  §MUnited States§! after their civil war, the £GFX_SOV_txticon_hammer_sickle  §e1973 Soviet Constitution§! forbids any £GFX_SOV_txticon_soviet_icon  §eUnion Republic§! from seceding. This way, no backstabber may sabotage the §eSoviet§! war effort from behind and attempt to sow the seeds of §odefeat§!. \n\n§cArticle 72:§! Each £GFX_SOV_txticon_soviet_icon  §eUnion Republic§! does not retain the right to freely secede from the §eUSSR§!. \n\n£GFX_SOV_txticon_hammer_sickle  §eThe Union of Soviet Socialist Republics§!, indivisible forever more.§!"
 SOV_Laws_Guiding_Hand_desc: "§cArticle 6:§! The leading and guiding force of §eSoviet§! society and the nucleus of its political system, of all state organisations and public organisations, is the £GFX_SOV_txticon_soviet_icon  §eCommunist Party of the Soviet Union.§! The §eCPSU§! exists for the people and serves the people. The £GFX_SOV_txticon_soviet_icon  §eCommunist Party,§! armed with £GFX_SOV_txticon_hammer_sickle  §eMarxism-Leninism,§! determines the general perspectives of the development of society and the course of the home and foreign policy of the §eUSSR§!, directs the great constructive work of the §eSoviet§! people, and imparts a planned, systematic and theoretically substantiated character to their struggle for the victory of §ecommunism.§! All party organisations shall function within the framework of the £GFX_SOV_txticon_hammer_sickle  §eConstitution of the USSR.§! \n\nNone shall question the wisdom of our great £GFX_SOV_txticon_soviet_icon  §eCommunist Party,§! for it expresses the will and interests of the workers, peasants, and intelligentsia, the working people of all the nations and nationalities of the country, organised on the principle of §Rdemocratic centralism.§! \n\n§e- General Secretary Mikhail Suslov§!"
 SOV_Laws_Exterminate_Bandits_desc: "The reclamation of Muscovy has left a multitude of £GFX_SOV_txticon_Swastika  §oOstdeutsch,§! §qRussian collaborators,§! §ibourgeoisie§! and other elements dangerous to the §esocialist system§! behind our borders. Therefore, the §eMGB, £GFX_SOV_txticon_hammer_sickle  Ministry for State Security,§! is authorised to take any approach deemed to be necessary to eliminate subversive elements in any part of Muscovy. Any combatant, officer or bandit considered to be a threat is to be §Rexecuted§! or §Rcaptured§! without military or civilian tribunal. \n\nGlory to the unshakable £GFX_SOV_txticon_hammer_sickle  §eUnion of Soviet Socialist Republics.§! \n\nThe unchecked power of the §eMGB§! may have §Rconsequences§! in the future..."
 SOV_Laws_Collective_Rule_desc: "With the reunification of the £GFX_SOV_txticon_hammer_sickle  §eSoviet Union§! and §eMikhail Suslov§! at its helm, the policy of §Rcollective leadership§! was implemented. A proponent of inner-party democracy, §eSuslov§! aimed to avoid the calamities of the Bukharin-Stalin era prior to and during the §RGreat Patriotic War.§! \n\n§eSuslov§! argues that without §Rcollective rule,§! the §eUSSR§! would end up with one man dominating the political system, which was the main cause of the §RSoviet Civil War§! in 1942 and ultimately led to defeat by the £GFX_SOV_txticon_Swastika  §oGerman Reich.§! By ruling in an autocratic fashion and allowing less representation from fellow party members, the §eUnion§! is more susceptible to infighting, coups and civil wars. \n\nTherefore, powers and functions are distributed among the £GFX_SOV_txticon_soviet_icon  §ePolitburo, the Council of Ministers and the Central Committee,§! limiting the powers of the £GFX_SOV_txticon_hammer_sickle  §eGeneral Secretary§! and §ePremier.§!"
 SOV_Laws_FER_Different_desc: "§cArticle 108:§! The highest body of state authority of the §eUSSR§! shall be the £GFX_SOV_txticon_soviet_icon  §eSupreme Soviet of the USSR.§! The £GFX_SOV_txticon_soviet_icon  §eSupreme Soviet of the USSR§! is empowered to deal with all matters within the jurisdiction of the £GFX_SOV_txticon_hammer_sickle  §eUnion of Soviet Socialist Republics,§! as defined by this £GFX_SOV_txticon_hammer_sickle  §eConstitution.§! \n\nWhile this is nominally true throughout the §eUnion§!, the §cFar Eastern Republic§! exists in a state of limbo due to the £GFX_SOV_txticon_Japan_nation  §jJapanese Empire's§! conditions for returning the region to our rightful rule. The §jTreaty of Sapporo§! restricts §eMoscow's§! actions in the §cFER§!, allowing for greater economic freedoms and looser political control. Thus, the §cFER§! served as §RYagoda's§! and now §RLukyanov's§! testing ground for the §RSystem of Khozraschyot.§! The §eUnion§! will never be truly united so long as the §cFER§! remains."
 SOV_Laws_COMECON_desc: "The £GFX_SOV_txticon_Swastika  §oNational Socialist Vermin§! to our west possesses the §QEuropean Economic Community§! to subjugate all of Europe, while the £GFX_SOV_txticon_Japan_nation  §jJapanese Empire§! to our east continues to maintain the §PCo-Prosperity Sphere§! in Asia, albeit weaker with the breakaway of §iChina.§! \n\nNevertheless, to counteract these economic unions, the £GFX_SOV_txticon_comecon  §eCouncil for Mutual Economic Assistance§! was founded in 1975. The §eUSSR,§! as part of the world system of socialism and of the socialist community, promotes and strengthens §cfriendship, co-operation, and comradely mutual assistance§! with other socialist countries on the basis of the principle of socialist internationalism. The £GFX_SOV_txticon_comecon  §eCOMECON§! enables the §eUnion§! to take an active part in socialist economic integration and the socialist international division of labour."
 SOV_Laws_Partial_Collectivisation_desc: "A fundamental component of §Rsocialism§! and £GFX_SOV_txticon_hammer_sickle  §eMarxism-Leninism§! is the policy of £GFX_SOV_txticon_hammer_sickle  §ecollectivisation.§! While §RBukharinists§! and §eStalinists§! agree on the end goal of the abolition of individual landholdings and labour into nominally collectively controlled and openly or directly state controlled farms, §eStalinists§! argue for its immediate implementation to eliminate the §ibourgeois kulaks,§! while §RBukharinists§! argue for temporary private landholdings under the §RNew Economic Policy§! to encourage the peasantry to increase production. \n\nThe end result of §eMikhail Suslov§! and §RGenrikh Yagoda's§! compromise in 1971 to reunify the §eUSSR§! was that the §cagricultural debate§! would be temporarily halted, mending the §eSoviet§! national schism until Moskva was liberated. Now, with Muscovy reclaimed for a decade, and reconstruction nearing completion, the debate on £GFX_SOV_txticon_hammer_sickle  §ecollectivisation§! must be settled at last, either in the §eStalinists'§! or §RBukharinists'§! favour."

