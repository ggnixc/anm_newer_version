 SOV_minister_Gennady_Yanayev_hog_desc: "Chairman of the Council of Ministers \n§VBolshevism§!\n--------------\nThe Death of the Soviet Union should’ve been the death of Communism in Russia. Instead, it created Generations of young Russians who swore to bring back the glory of the USSR, avenge the Great Patriotic War, and Strangle Nazism until the old remains were the bodies of its former supporters. Gennady Yanayev, Premier of the Reborn Soviet Union, is the embodiment of this Generation. \n\nBorn in Gorky in 1937, he was only a child when the USSR collapsed into an Era of Warlord States. He studied as a Mechanical Engineer to help produce tanks for the Gorky Military Commission. When the Gorky finally reunited with the Communist Party of Komi in 1964, he joined the reformed KPSS and briefly led the Gorky Komsomol. He was active in a number of Youth Organisations and the Defence Industry Workers Union in West Russia until finally becoming the Leader of the All-Union Central Council of Trade Unions after the 2WRW. He was instrumental in rebuilding Union Organisations in the newly liberated Moscow territories. \n\nWith Grigory Romanov’s rise to power in 1992, Yanayev's success in integrating the Moscow territories and support for Romanov led him to be appointed as Premier of the USSR. Now, as the 2nd most powerful individual in the Soviet Union, Yanayev is determined to liberate all of Russia and not just Moscow."
 SOV_minister_Vladimir_Kryuchkov_sec_desc: "Minister of State Security \n§VMarxism-Leninism§!\n--------------\nCritics of the USSR say that the MGB crushes and suppresses any dissent. The MGB rejects this criticism, people’s opinions in the USSR are allowed to be different as long as they are different in the same way as everyone else. This is the way that Vladimir Kryuchkov’s MGB is run. \n\nBorn in 1924 in Volgograd, Kryuchkov originally studied to be a lawyer but was forced alongside his family to flee Eastwards as German troops laid siege to the city. As the Union collapsed, Kryuchkov’s Family moved further east until they reached the city of Irkutsk. There, he used his law studies to enter the Judicial System originally as a Prosecutor, but his ability to break Defendants attracted the attention of Yagoda’s NKVD. He soon became an NKVD agent, helping break Sablin’s Mutiny and smother any dissent against the Presidium. He rose through the ranks of the NKVD as Yagoda consolidated his hold over the Far East and Siberia. \n\nWith the Reunification of the USSR under Yagoda and Suslov, Kryuchkov climbed further up the rank, helping to sow dissent in Eastern Europe prior to the 2WRW. In 1988, he was finally made head of the reorganised MGB. A Hardline Communist, he fears what the reforms of Lukyanov and his “Pragmatists” could bring to the USSR and will not hesitate to step in should the reforms go too far." 
 SOV_minister_Aleksandr_Bessmertnykh_for_desc: "Minister of Foreign Affairs \n§VBolshevism§!\n--------------\nEven the Greatest Superpowers need Allies by their side, and that's a job for Alexander Bessmertnykh. \n\nBorn in 1933 in Biysk in the vast Siberian landscape. He lost his father during the Great Patriotic War when he was just ten and forced to rely on his Mother, who moved them to Chelyabinsk. There, Bessmertnykh became an Administrator in the West Siberian People’s Republic despite his moderate communist views. He quietly rose through the ranks until Khrushchev’s interparty coup of Kaganovich. He was able to avoid the purges and played a minor role in the Reunification Negotiations between Khrushchev and Suslov. After the Reunification, he was promoted further and again played a role in the Negotiations between Suslov and Yagoda. \n\nBessmertnykh's star fully shined in the Vladivostok Negotiations between the USSR and Japan, where he was able to gain Vladivostok and other territories occupied by Japan for the Soviet Union via the Treaty of Sapporo. He became ambassador to the United States in 1976, establishing full diplomatic relations between the last Free Superpower fighting against the Fascist menaces, and was promoted to Foreign Minister under Romanov’s premiership. Should another war between Germany and the Union break out, Bessmertnyk will be the man to facilitate support from the Eagle across the Pacific."
 SOV_minister_Anatoly_Lukyanov_eco_desc: "Minister of Finance \n§VYagodschina§!\n--------------\nWhat better place to put your rival for the top job than as one of your most important ministers? You get to have constant eyes on them, and if they mess up, you can discredit him as his Opposition to you. But it can legitimise their claim for your spot and make opposing you easier if you can’t keep him under control. Grigory Romanov will find out soon. \n\nDriven from his hometown of Smolensk and losing his father during the War, Lukyanov and his family fled to the Far East before finally ending up in Magadan. While he quietly opposed the Fascist’s control over the Port City, he saw the benefits of good trade relations between Russia and the United States. When Yagoda’s forces finally liberated the area, he joined the local Communist Party Branch. He became the Port Manager for Magadan, helping bolster trade and establish Special Economic Zones in the city. While still a Communist, he supported the liberalisation of the Economy. \n\nWhen Yagoda reunited with Suslov’s reformed USSR, Lukyanov quickly rose through the ranks of the KPSS as a supporter of State Capitalism brought in by Yagoda. After the death of Viktor Grishin, Lukyanov was one of the favourites to succeed him as General Secretary, but he was bested by Grigory Romanov. Despite this, he was appointed Romanov’s Finance Minister as a tactical move to keep an eye on him. He may not be running the show, but he’s planning the next act once Romanov exits stage left."

