 ### Tooltips ###
 
 ### Nat. Spirits ###

 SOV_Suslov_Vision: "Suslov's Vision"
 SOV_Suslov_Vision_desc: "Mikhail Andreyevich Suslov, the man who saved the Union during its darkest times, had experienced and seen it all during his lifetime. He was a teenager when the Russian Revolution of 1917 occurred, he was a middle-aged man when the Fascist Horde tore the Union apart into shreds, he was there during the turbulent 'democratic' times of the Komi Republic, where he personally had to kill off assassins sent by the reactionary Passionariyy Organisation. Most indispensable of all, he was there to re-unite the Union and prepare it for Revenge against Germania. \n\nSuslov was a man obsessed with Orthodoxy and the Teachings of Lenin, implementing policies like Collective Leadership of the Party, token Social Reforms and Centralisation of the Economy, to the point where he was labelled as the 'Pope' for Orthodox Communists. Additionally, Suslov was opposed to the 'one-man rule' revisionists of Kaganovich, along with the ideas of Military Primacy by Tukhachevsky. For now, it seems Suslov's Vision of the Union will continue to last following Victory in the Third Great Patriotic War."
 SOV_Supremacy_MGB: "Supremacy of the MGB"
 SOV_Supremacy_MGB_desc: "The Ministry of State Security, or MGB for short, is the Soviet security apparatus designed to deal with internal and external threats, as well as to conduct espionage. Following the end of the Third Great Patriotic War, the Peoples' Commissariats were renamed into Ministries, renaming the NKVD into the MGB. \n\nAs a Result of Suslov integrating Yagoda's Siberian Soviet Republic in 1972, the NKVD of the time was fused as well, and it was kept Strong in order to combat the remaining Reactionaries and Fascists still holding out and resisting the re-united Union of Soviet Socialist Republics. Furthermore, the NKVD was paramount in the De-Germanisation of Moscowien, reintegrating its lands and eliminating any sympathisers to the Fascist Menace of Germania. \n\nAs the New Millennium approaches, many in the Politburo, including Romanov himself, have begun to question the MGB's extensive power and strength. The anarchic era of the Russian Warlord Period has long past, and for a stable Union, its Secret Apparatus will have to be firmly under and loyal to the Communist Party. The current state of affairs certainly will not last."
 SOV_System_of_Khozraschyot: "System of Khozraschyot"
 SOV_System_of_Khozraschyot_desc: "The System of Khozraschyot, or System of Cost Accounting, is an Economic System devised by Yagoda and his Premier Kosygin during the time of the Siberian Soviet Republic. It aims to adapt Socialism with the Material Needs of the Russian People. The System takes Bukharin’s New Economic Policy and goes a step further, allowing private enterprise and market systems to flourish with state supervision. Yagoda argues that Bukharin did not go far enough with the NEP, and that productive forces were not sufficiently developed which resulted in the defeat of the First Great Patriotic War to the Germans. \n\nAdditionally, the Treaty of Sapporo states that the Zaibatsus must be permitted to remain in the Far Eastern Republic to conduct business and trade. Together with American Companies like Boeing, which were invited in the 60s to the Russian Pacific Coast, as well as State owned Enterprises like PJSC Sberbank, a thriving and competitive Business market is forming in the FER. As a result, this Reform and Opening Up policy has led to The Far East outcompeting the traditional powerhouse Cities of European Russia in certain aspects economically."
 SOV_Legacy_of_Zhukov: "Marshal Zhukov's Legacy"
 SOV_Legacy_of_Zhukov_desc: "Georgy Konstantinovich Zhukov, Grand Marshal of the Soviet Union, was Suslov's right-hand man during the tumultuous period of the Russian Anarchy. Following Suslov's electoral victory in the Komi Republic in 1962, he extended a welcome hand to Zhukov, unifying the two states under a Common Banner in order to Salvage Russia from its toughest period. Suslov would remain as General Secretary of the Communist Party, and Zhukov would be the Grand Marshal of the Red Army. \n\nAs the Fascist Pigs of Germania rested on their laurels and laid back comfortably off their looted wealth, Zhukov pioneered and honed several Military Tactics during the Re-unification wars of Russia. Such methods include Defense in Depth, utilising Tanks not as a frontal barrage like the Blitzkrieg but withholding them to advance on an Enemy's flanks, as well as mixing inexperienced regiments with Skilled ones in order to improve the formers' Morale and Training. Despite passing away in 1974, the Soviet Army continued to apply his tactics and teachings in order to attain Victory and reclaim Moskva during the Third Great Patriotic War."
 SOV_The_Scars_of_Moscowien: "The Scars of Moscowien"
 SOV_The_Scars_of_Moscowien_desc: "Although the Union may have reclaimed Moscowien from the Fascist Vermin, much still needs to be done in order for the region to fully recover. During the Barbaric times of German rule, entire villages were razed to the ground, cities were settled by Aryans and Ostdeutsch and renamed to hideous German names to honour the War Criminals that plundered Russia, and Railway Gauges were transformed from the Russian 1520mm gauge to the standard gauge of 1435mm. Generalplan Ost was carried out with devastating effect, reducing the population of the region to half of pre-World War 2 levels. Significant effort and resources would be required for our People and Nation to recover from this tragedy."
 SOV_Job_Half_Done: "A Job Half Done"
 SOV_Job_Half_Done_desc: "Gazing upon the Devastation, Mass Graves and Plundering upon the former Moscowien, some members of the Communist Party and the Wider Public have pondered on the question of 'Why did General Secretary Viktor Grishin sign a Peace Treaty in such a hasty fashion with the Germans in 1984?'. They decry that our Byelorussian, Ukrainian and Caucasian Brothers and Sisters continue to languish under the Nazi thumb, and that the Union should have continued to exploit the collapsing German lines during the Second West Russian War to liberate all of Eastern Europe once and for all. \n\nThe Union and Communism's Mission of a Stateless and Classless Worldwide Society will one day be fulfilled by us, and the National Socialist Vermin of Germania will be the first on the Chopping Block."
 
 ### Events ###

 SOV_space.1.t: "Vostok 1 Launch a Flawless Success"
 SOV_space.1.desc: "Yesterday, Sergey Avdeev became the first Soviet citizen to breach Mankind’s Final Frontier aboard Vostok 1, the Soviet Union’s first-ever manned spacecraft mission. The USSR is now the fifth nation in the world to carry out the monumental feat, following Germany, the United States, Japan, and Italy. \n\nTo many, the successful launch is a symbol of a resurgent Soviet Union, freed from the shackles of poverty and strife that once held the nation in the margins of history. Washington has extended a warm congratulations, emphasising the need for “friendly competition in outer space to promote another century of innovation”. Tokyo issued a brief statement acknowledging the triumph. An apoplectic Germania has outright refused to comment. \n\nRegardless of international reception, one fact is clear — the Soviet Union’s first foray into the cosmos is undoubtedly a massive coup for the fledgling Great Power and for the cause of Communism."
 SOV_space.1.a: "And on Mars there will be Apple Blossoms."
 SOV_space.1.b: "A pig wearing Lipstick is still a Pig."
 SOV_space.1.c: "We Extend our Congratulations."

