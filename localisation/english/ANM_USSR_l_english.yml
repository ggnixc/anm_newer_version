 ### Ministers ###

 SOV_Gennady_Yanayev_hog_desc: "Chairman of the Council of Ministers \n§VMarxism-Leninism§!\n--------------\nThe death of the Soviet Union should’ve also heralded the death of communism in Russia. Instead, the Union’s collapse created generations of young Russians who swore through clenched teeth to bring back the glory of the USSR, avenge the Great Patriotic War, and behead the despicable Teutonic serpent lurking to the west. Gennady Yanayev, Premier of the reborn Soviet Union, embodies the vengeful spirit of this generation to a tee. \n\nBorn in Gorky in 1937, Yanayev was only a child when the USSR collapsed into a miserable mosaic of squabbling warlord states. Having studied as a mechanical engineer, he spent much of his young adulthood producing tanks for the Gorky Military Commission, and when Gorky finally reunited with the Communist Party of Komi in 1964, he joined the reformed KPSS and briefly led the Gorky Komsomol. An active member of the Defence Industry Workers Union in western Russia, Yanayev rose to become the Leader of the All-Union Central Council of Trade Unions after the Third Great Patriotic War. In this role, he was instrumental in rebuilding union organisations in the newly-liberated Moscow territories. \n\nWith Grigory Romanov’s rise to power in 1992, Yanayev's success in integrating the Moscow territories and outspoken support for Romanov led to his appointment as Premier of the USSR. Now, as the second most powerful man in all of Russia, Yanayev’s long-held dream to emancipate the entirety of his Motherland’s stolen territories is, at last, within reach."

 SOV_Vladimir_Kryuchkov_sec_desc: "Minister of State Security \n§VMarxism-Leninism§!\n--------------\nCritics of the USSR say that the MGB is simply a cudgel weighted to crush any and all dissent. The MGB, of course, flatly rejects these baseless criticisms. After all, under Vladimir Kryuchkov’s watchful eye, dissenting opinions are allowed to be spoken freely...as long as they happen to be the correct ones. \n\nBorn in 1924 in Stalingrad, Kryuchkov originally studied to be a lawyer, but was forced, alongside his family, to flee eastwards as German troops laid siege to the city. Eventually settling in Irkutsk, he finished his law studies and worked for a time as a prosecuting attorney. Kryuchkov’s uncanny ability to break down even the toughest of defendants attracted the attention of Yagoda’s NKVD, and, after a handful of enticing offers, Kryuchkov soon donned the badge of an NKVD agent. \n\nKryuchkov’s first missions primarily involved breaking Sablin’s Mutiny and smothering dissent against the Presidium. After reunification, Kryuchkov worked to sow dissent in Eastern Europe in the leadup to the Third Great Patriotic War, all the while climbing the ranks of the NKVD. In 1988, he was finally promoted to head of the reorganised MGB. \n\nWith the post-reunification dissent from right-wing groups now residing comfortably in the past, Kryuchkov’s MGB now turns its gaze inward. A hardline Communist, Kryuchkov fears what the reforms of Lukyanov and his 'Pragmatists' could bring to the USSR — and he will not hesitate to 'offer a helping hand' should the reforms go too far..."

 SOV_Aleksandr_Bessmertnykh_for_desc: "Minister of Foreign Affairs \n§VBolshevism§!\n--------------\nWith each amber sunrise, the behemoth-sized shadow of the Soviet Union looms larger over the Volkshalle. But even the mightiest of giants are nothing without reliable allies by their side — and Alexander Bessmertnykh is one of them. \n\nBorn in 1933 in the vast Siberian tundra, Bessmertnykh was just ten years old when he lost his father in the torrid fires of the Great Patriotic War. From then on, he was forced to rely on his mother, who moved his family to Chelyabinsk. There, despite his moderate Communist views, Bessmertnykh became an administrator in the West Siberian People’s Republic, quietly rising through the ranks. Having avoided the ensuing purges, Bessmertnykh played a minor role in the reunification negotiations between Kaganovich and Suslov and, much later, the final reunification of the entirety of Russia. \n\nPost-reunification, the light of Bessmertnykh's rising star fully shined during the USSR-Japan Treaty of Sapporo negotiations, during which his silver tongue secured Vladivostok and a handful of other Japanese-occupied territories for the USSR. In 1976, Bessmertnykh, assigned the post of US Ambassador, established full diplomatic relations between the USSR and the United States, forging an unbreakable partnership to oppose the murderous regime in Germania. He was shortly thereafter promoted to Foreign Minister under Romanov’s premiership, the position he continues to hold to this day. \n\nIt is thanks to Bessmertnykh’s diligent alliance-building that, today, at the cusp of the Third Millennium, the USSR is more prepared than ever to end, once and for all, the scourge of National Socialism that has plagued the people of Europe for over half a century. Should the Fourth Great Patriotic war ever come to pass, Bessmertnyk will be the man to facilitate support from the soaring eagle across the Pacific."

 SOV_Anatoly_Lukyanov_eco_desc: "Minister of Finance \n§VYagodschina§!\n--------------\nWhat better place to put your fiercest rival for the top job than your very own cabinet? You get to keep a constant eye on all of their business, and the moment they commit any blunder, big or small, you’ve got a free excuse to toss them out with next week’s trash. That’s what Anatoly Lukyanov believes is happening, at least. Why the hell else would Grigory Romanov, of all people, offer him the cushy post of Finance Minister? \n\nDriven from his hometown of Smolensk during the First Great Patriotic War, Lukyanov and his family — sans the fresh, shrapnel-ridden corpse of his father — fled to the Far East before finally settling down in Magadan. Once Yagoda’s forces finally liberated the area , Lukyanov joined up with the local Communist Party branch. He soon ascended to the rank of Port Manager for Magadan, helping to liberalise the economy and establish 'Special Economic Zones' within certain parts of the city. \n\nPost-reunification, Lukyanov, a supporter of the Cost Accounting System brought in by Yagoda, rocketed up the ranks of the Communist Party. After the death of Viktor Grishin, Lukyanov was one of the favourites to succeed him as General Secretary, but he was ultimately bested by Grigory Romanov. \n\nLukyanov may not be General Secretary just yet, but even so, what better place to be than the cabinet of your fiercest rival? While he may have put you there to shut you up, he’s got to spend a large chunk of time and effort keeping a close eye on you. If you know what you’re doing, of course, you can still get away with some shady dealings here and there — not that Romanov’s dependable Finance Minister would ever deign to sink so low. \n\nYes, Anatoly Lukyanov may not be running the show just yet, but he’s already got the next act scripted and ready to go once old Romanov exits stage left."

 ### Decisions ###

 ### Focuses ###
 SOV_union_resurgent: "A Union, Resurgent"
 SOV_union_resurgent_desc: "More than fifty years ago, our sacred Union suffered a catastrophic defeat at the hands of the filthy Nazis. Most people of the world would not even give the benefit of the doubt when they were told that the Union would return one day. But we did the unthinkable in the 1980s. The red flag with the hammer and sickle now flies once again at the top of the Kremlin. The entire world is still astonished by the victory, and our people are still jubilant. \n\nFollowing the reconstruction of West Russia and the return of Outer Manchuria to its righteous master, the Union of Soviet Socialist Republics reclaimed its status as a great power and it is starting to hold a candle to the giants on the globe, including our archnemesis, the Greater Germanic Reich. Our military is ascendant, our people are working hard to develop the country, our resurgent Union is growing by leaps and bounds. As a new millennium is impending, there are tasks to fulfill. And the old debt still remains unmitigated…"
 SOV_secretary_romanov: "General Secretary Romanov"
 SOV_secretary_romanov_desc: "Grigory has come a long way from a low-ranked officer in a warlord state. Entering the fifth year of his tenure as General Secretary of the reborn Soviet Union, Comrade Romanov's reign has been largely uneventful as of now. To some a disappointment, to others a welcome change of pace following the chaos and bloodshed of the Smuta and Third Great Patriotic War. \n\nThis is not to say he has done nothing at all of course. Every day, he has worked tirelessly to keep the pragmatists and MGB in check, prepared for the upcoming launch of the first Soviet mission to space, and prepared the nation for the inevitable Fourth Great Patriotic War, when the Hitlerite menace will at last be expelled from the Motherland and the scars of the First Great Patriotic War may at long last begin to fully heal. \n\nLet the world think we have gone quiet. They shall soon see the true might of the Motherland."
 SOV_29th_kpss_congress: "29th Congress of the Party"
 SOV_29th_kpss_congress_desc: "With the dawn of the new year, arises the advent of a new congress. While this may be an annual phenomenon for outside observers, the 29th Congress marks an important day in the history of the Union. With the progress being made in the reconstruction of the reconquered Moscowien territories, our space program succeeding, and the solidification of the reborn Union, the Congress has become a place to confront the issues and contradictions that have become apparent within our party and the Union as a whole."
 SOV_uphold_marxism_leninism: "Uphold Suslov's Theories"
 SOV_uphold_marxism_leninism_desc: "How does one even begin to describe Suslov? From his political maneuvering that saved the Komi Republic from a fascist coup to the formation of the alliance with Zhukov’s West Russian Revolutionary Front to reunite West Russia to the reunification of the Union through his personal friendship and diplomatic charm with Lazar Kaganovich and Genrikh Yagoda. Suslov remade the Union and enshrined his place as one of the founding fathers of the Union. He is the father of the modern Union and the architect of Marxism-Leninism.  Suslov’s ideological framework and his writings constitute the base of the Union’s official ideology of Marxism-Leninism. For the Union to continue, we must follow the teachings of Suslov and the synthesis of Marx, Lenin, and Bukharin that he devised."
 SOV_party_unity: "Unity of the Communist Party"
 SOV_party_unity_desc: "The Communist Party of the Soviet Union - the glorious light that has always guided the people through the most perilous and turbulent time - is and has always been the head of the Red Bear. Without it, the USSR and what was left of it wouldn’t have had a chance to turn the tide and complete the task of reunification. \n\nHowever, ideologically speaking, there are always inevitable differences between members of the Party - which could also escalate into open-conflict, significantly decreasing functionality and efficiency of the Party. Power struggles have been a major characteristic of the CPSU - but the problem is: can we allow it to exist in this period? \n\nThe war against fascism as we know - is in fact, unconcluded. Just a few hundreds kilometers away from Moskva - there are still hungry wolves waiting impatiently to pillage and desolate the Motherland once for all - and they’ve learned much from their defeat. Our comrades must bear one thing in mind: without a synthesized leadership structure, the Union is destined to tremble again under the wrath of the Nazis. Ignoring the apparent polarity between various ideological wings within the Party - all must remember that the CPSU is always a unified organization tasked with leading the protection of the Soviet homeland and the revolution. And should the enemies on the other side of the border notice a minuscule sign of division - it will be too late for us to realize."
 SOV_eight_five_year_plan: "Begin the Eighth Five Year Plan"
 SOV_eight_five_year_plan_desc: "The Eighth Five-Year Plan, set to begin at the advent of the new year, is the culmination of decisions and proposals laid out during the 28th Party Congress of 1997. Among the goals of the Eight Five-Year Plan are the economic resurgence of the West Russian territories through collaboration with the OFN, expansion, and centralization of the existing industry within Central Siberia, revitalization of the Siberian Plan, and finally, the development of the Far Eastern Republic to take greater advantage of the Special Economic Zones established. The Eighth Five-Year Plan has also set a target GDP of 500 billion dollars by the end of 2001, which would be compounded by further economic ties with the Americans and Japanese. But arguably, the most pressing decision within the Eight Five Year Plan is not the accomplishment of targets but the methods of implementation. Should we tow the orthodox line and continue the New Economic Policy, listen to Khruschevites and implement a policy of centralization, or follow Yagoda’s example of regulated state capitalism?"
 SOV_new_economic_policy: "Abide by the New Economic Policy"
 SOV_new_economic_policy_desc: "As the Americans say, “If it ain’t broke, don’t fix it.” Why should we deviate from the New Economic Policy, the pinnacle of Soviet economic development and the brainchild of Bukharin when it has worked so well for us until now? \n\nFor so long, the delicate balance between small private trade and markets and a centralized industry has kept the economic situation of our union perfectly in balance. Allowing peasants to sell their crops for a profit allows for the enrichment of peasants and a stable agricultural base. Allowing the state to manage all of the industries and large firms allows us to maintain good working conditions for the workers, mobilize the war industry in times of crisis, and plan out the development of our war-torn territories. \n\nA more perfect accord could not be made, even by Lenin himself. If the Union must endure, so must the New Economic Policy."
 SOV_limited_free_enterprise: "Trials with Limited Free Enterprise"
 SOV_limited_free_enterprise_desc: "Decades ago, we used to deplore all forms of privatization and free trade, in accordance with the anti-capitalistic notion that was viewed as the immutable framework of the Marxist-Leninist theory. But no system lasts forever, there can always be a certain limit to its effectiveness as the world is invariably ever-evolving. To switch from building small monuments to larger ones, a worker must learn to abandon his ‘long-established’ way and learn to make an uncompromising overhaul. \n\nThe same can be said for our progress towards a communist utopia. Revisiting the insufficiency of our past policies and some of our current ones, it is a fact that reforms are a must. We will eventually do away with the imprudent quest for economic autarky, strict state-planning and bureaucracy to finally realize the full potential of the Soviet Union. Stagnated economic growth and low productivity are the limitations of orthodox policies which need to be dealt with in order to cultivate a wealthy, free-willed and industrious society - the perfect driving force in our road to the realization of the ideal Soviet dream. Ruling out all the concerns about the integrity of the Party, we must admit the fact that without prosperity and stability - there can be no equal society. A thorough transition to a socialist market economy is the best way to generate rapid GDP growth. While carefully liberalizing the Union, we will still maintain state supervision to some degree, but with some alterations, such as freeing private businesses from the threat of being labeled as ‘bourgeoisie’, as well as getting rid of the skeptical attitude towards limited capitalism."
 SOV_top_down_approach: "A Top-Down Approach"
 SOV_top_down_approach_desc: "“Either we do it, or we shall be crushed.” were the words uttered by Joseph Stalin when talking about the state of industrialization of the Union in 1922. When looking at his analysis today, the truth in his words is shockingly apparent. \n\nThe NEP failed to industrialize our nation and thus left us open to the monstrosities of the Great Patriotic War and the hordes of Teutonic hordes of Huns that ravaged our motherland. Now, with the industrial potential of the Donbas and Minsk lost to us, we cannot afford to take any chances. We must prioritize the development of our Union over anything, and that means that the economy should be directed from the top. \n\nCapable bureaucrats combined with the brightest economic and mathematical minds the Union has to offer who are aided by the new computer technologies coming out of the Sphere and America will ensure that the centralized development of our economy will proceed in the most efficient manner possible. Prioritization of a rapid expansion of our military industries and arsenals, followed by an increase in heavy industry development and resource extraction should allow for the Union to finally surpass the Reich in all its glory, and snuff out the dim fire of Fascism in Europe."
 SOV_tighten_comecon_integration: "Tighten Integration with the COMECON"
 SOV_tighten_comecon_integration_desc: "The reunification of the Soviet Union in 1972 set up new opportunities for us to establish connections with revolutionary movements across the world - those that were in desperate need of foreign financial aid in order to afford equipment and build their armies. The formation of COMECON happened to meet the Union’s need to find new allies and trade partners while bolstering communist influence around the globe. \n\nWhile COMECON is undeniably struggling with a shortage of members and the difficulties caused by geographical barriers…we have to gleefully recognize the importance of such an initiative and the augmentation of our legitimacy as the valiant leader of the international revolution ever since COMECON was born. \n\nBut to truly turn COMECON into a powerful and efficient economic bloc dedicated to the empowerment of socialist nations - further integrations are imperatively necessary. To firmly lay the foundation for concordant economic cooperation - the Union will first organize more conferences to generate more opportunities for us to consolidate the bonds with our allies, thus allowing us to diversify trading activities and provide manpower if needed. Our brothers in PALF, Ecuador, Azad Hind Government and Syria eagerly need us to develop their economy, education, technology and agriculture - in order to thrive in their own regions. While North Vietnam - a particularly special case according to the Politburo - requires an exceptional effort from outside to speed up the recovery, deal with the constant embargoes from the Japanese and eventually prepare for a conflict that could turn the tide in Asia. \n\nLong and short, while our relatively modest bloc has challenges to overcome - we will go the extra mile to realize the dream of a mighty Comintern, ready to deter any threat from the reactionary fascists and capitalists."
 SOV_pizza_hut_moskva: "Pizza Huts in Moskva"
 SOV_pizza_hut_moskva_desc: "“No matter if it is a white cat or a black cat; as long as it can catch mice, it is a good cat.” \n\nIf materialistic capitalism can actually prove to be an effective driving force for the development of our great Soviet society - then why don’t we give it a chance? After all, clinging too tightly onto the core tenets of Marxism-Leninism is ignorant and inflexible - judging by how globalized and connected the world around us has become in the last decades. Putting aside all the misgivings and disagreements, we will introduce even more stimulative policies to allow Western businesses to prosper within the country. Our people will gain access to even more Western goods and services - and the cumulative effects will significantly increase their content and productivity. We will also learn from our economic partners by specifically letting more foreign technological innovations be incorporated into our nation. \n\nIn the new era, those who become adept to changes, rise, those who don’t, become vanquished."
 SOV_increase_self_reliance: "Increase in Self-Reliance"
 SOV_increase_self_reliance_desc: "“A pragmatic way to make the sacred Union prosper” is the very habitual excuse that the ‘reformers’ use when they intrinsically seek to erode the true legacy of our Party. A loyal revolutionary will always acknowledge the other side of a close partnership with Western capitalist countries - after all, we have to bear one thing in mind: The United States and the OFN only lend us a hand when we serve a purpose to their cause. Who knows when they will have a change of heart? \n\nThe core values of the Soviet system are based on self-determination and self-sufficiency. The excessive openness will slowly prevent us from accomplishing the goal of the revolution - and slowly but surely tarnish the qualities we have strived so hard to build. At least we will maintain moderate cooperation with the capitalists - but with stricter boundaries so that we can retain more independence from their support, economically and politically."
 SOV_integrate_muscovy: "Integrating Muscovy"
 SOV_integrate_muscovy_desc: "Reclaiming Muscovy was part and parcel of the process of retaking the Motherland’s pride and strength. The Germans, during their hasty retreat, abandoned some of the most essential assets, which would lay foundation for further development of the Soviet economy. On the other hand, those despicable invaders also left undesirable traces on our land. The German settlers present a nerve-wracking issue while most of Russian population there remain impoverished and illiterate. Decades of exploitation and oppression have left our cultural heritage vandalized, the countryside ravaged and our people traumatized. \n\nReintegrating Muscovy back into the Union has the lion's share of attention in our internal decision-making processes. The Party leadership has proposed a multitude of diverse choices, and we must prudently take every single possibility into account, in order that it will bring societal balance and economic growth to the region."
 SOV_complete_relocating_germans: "Complete the Explusions"
 SOV_complete_relocating_germans_desc: "..."
 SOV_amnesty_for_expertise: "Amnesty for Expertise"
 SOV_amnesty_for_expertise_desc: "The problem of German settlers is indeed outrageous and distressing for the Soviet citizens and officialdom alike. After all, we cannot force the people to grudgingly accept the presence of those heavily associated with our former oppressors - without strict conditions. \n\nWe do have the right to follow a different direction. Adopting a less inflexible approachment might enable us to see the potential in the Germans and prevent any kind of wastage. We will choose those with at least years of factual experience in economic, industrial or technological branches, then, we will grant them greater autonomy to travel, work and become integrated members of the new Soviet society - if they show enough dedication and cooperation for a certain period. More importantly, it will be a good, transient remedy against the current brain drain that the Union is having. But of course, we will avoid addressing this policy publicly and ensure that there won't be any unbalanced elevation."
 SOV_let_the_mgb_finish: "Rely Upon the MGB Once More"
 SOV_let_the_mgb_finish_desc: "Even after liberating Muscovy, we have to straightforwardly admit one thing: the leftovers of the fascist abomination haven’t been uprooted yet. The vindictive menaces are but not limited to Wehrmacht remnants, German agents, collaborationists and those with treacherous anti-Soviet sentiment. The way they operate becomes more methodical, clandestine and efficient over time, thus causing an atmosphere of distress and anxiety amongst the populace. Terrorism continues to plague vulnerable hotspots as these troublemakers learn to become immune to conventional measures. \n\nThe right tool for the job is no other than the MGB itself - the treasure sword of the Party and the people. Thanks to increased funding and enhanced training programs, our spies have certainly become more proficient in turn. With the approval of the Politburo, they will be entrusted with the task of dealing with the harbingers of chaos and bringing security to our nation. Let us hope that the MGB will live up to our expectations."
 SOV_no_to_drugs: "Say NO to Drugs!"
 SOV_no_to_drugs_desc: "If one asks how ubiquitous drug usage is in the godforsaken land of Muscovy - the answer is pretty obvious. When the Nazis came here and preached their so-called ‘Aryan supremacy’, they gladfully unleashed an even bigger drug epidemic against the Russian people. As the Germans consolidated their rule, the black market flourished as well due to the policies of demoralization and destabilization of the local populace. \n\nAnd the consequences? As a matter of fact, what’s left of the drug market is still lurking in the villages, towns and cities of Muscovy. Those insidious smugglers cheer upon counting stacks of money after poisoning generations of able-bodied Soviet men, women…and even children. This tangible problem persists and poses a malicious danger to the development of Muscovy. It’s high time we stepped in to spread beneficial advice to our countrymen and eradicate one of the ugliest remnants of the lamentable colonial era."
 SOV_refit_railway_gauges: "Refit the Railway Gauges"
 SOV_refit_railway_gauges_desc: "..."
 SOV_resettlement_programs: "Resettlement Programs"
 SOV_resettlement_programs_desc: "The German invasion of the Soviet Union caused one of the largest evacuations in the history of mankind, where millions abandoned their birthplace in search for new accommodation in the East. While Siberia became more developed and populous thanks to this, Muscovy has suffered a severe shortage of indigenous Russian inhabitants. To recover stability and counterbalance the concerning remnants of German settlers, a thorough process of resettlement is needed. \n\nFirst, and foremost, we will rehabilitate pre-war administrative data relating to families that formerly took up residency in Muscovy in order to organize the transfer of them back to the exact location where they belonged. And then, temporary accommodations will be provided, given the substandard housing conditions of Muscovy after the liberation. Before an effective amelioration can be done, interim financial and medical assistance will be given to our people to assure them. This process will also involve the expulsion of German settlers from their current domiciles in order to add more space for the programs."
 SOV_repurpose_abandoned_infra: "Reuse Abandoned Infrastructure"
 SOV_repurpose_abandoned_infra_desc: "..."
 SOV_restore_historical_buildings: "Restore Historical Landmarks"
 SOV_restore_historical_buildings_desc: "..."
 SOV_palace_of_the_soviets: "The Palace of the Soviets"
 SOV_palace_of_the_soviets_desc: "..."
 SOV_construct_kaganovichka: "Construct the Kaganovichka"
 SOV_construct_kaganovichka_desc: "During the Nazi colonization of Muscovy, millions of our countrymen became deracinated as a consequence of displacement. They had no choice but to miserably flee from their homes - which were turned into nightmares to live in by the German swines. The sorrowful trail to the east made them dream of the day when they could finally return to their land with thorough living conditions and benevolent care from the government. \n\nAs part of the development, stabilization and repopulation plan for this region - providing functional housing is integral for our people to return to their old homes and start their new life. Muscovy is in dire need of more workforce to restore its liveliness and affluence. Long ago, Lazar Kaganovich devised a type of apartment building that promotes low-cost and quick technologies. Our architects also contributed to the process of choosing materials, construction techniques and room designs. Due to its value, ‘‘Kaganovichka’’ can be utilized by us during this period. The reasonable cost and shortened time will greatly increase the feasibility of mass-construction, quickly meeting the needs of our people. Even though we’ll have to deal with poor quality and finite space, this provisional solution can prove to be very beneficial."
 SOV_review_ssrs: "Review the Union Republics"
 SOV_review_ssrs_desc: "We must remember that our Union is not composed of a single, unitary people but rather a patchwork of nationalities and ethnicities. Our Union’s model allows for the perfect amount of autonomy for national minorities balanced with central power over the ASSRs when it comes to the economy and military. To ensure that the Union is running smoothly, we must inspect the conditions of all of the different republics with our union and examine their predicaments. After all, how can all of us prosper when some of us remain suffering?"
 SOV_status_of_karelia_ssr: "Assess the Karelian Republic"
 SOV_status_of_karelia_ssr_desc: "The Karelian Republic is the most chaotic of our autonomous republics. A combination of native Karelians, ethnic Russians, and Finnish exiles makes the stability of the republic particularly volatile. Adding further fuel to the flame, the Nazi puppet in Helsinki funds several violent fascist Karelian paramilitaries within the republic, some of whom are stay-behind Finnish military units from the Third Great Patriotic War. While Luykanov and his pragmatists argue that further autonomy and economic freedom within the ASSR would do well to calm tensions, Romanov and the orthodox faction are convinced that only the dissolution of the SSR and the destruction of Karelian nationalism will bring an end to the woes of East Karelia."
 SOV_keep_karelo_finnish_ssr: "Maintain the Soviet Republic"
 SOV_keep_karelo_finnish_ssr_desc: "Ultimately, Lukyanov’s arguments have prevailed. The policy of banning Karelian culture and language would only push more people to join the Finnish proxies within our republic. Instead, increasing the autonomy of the republic along with an official promotion of Karelian culture and language would extend the hand of peace towards moderate Karelian nationalists and discredit the radicals. Another one of our priorities should be the economic development of East Karelia to ensure that no Karelian citizen goes to sleep with a hungry stomach or sleeps on the street. Through the validation of the Karelian identity and focusing on the improvement of material conditions for Karelians, we can dismantle the Karelian nationalists without firing a single shot."
 SOV_integrate_into_rsfsr: "It has Gone Past Its Due!"
 SOV_integrate_into_rsfsr_desc: "The creation of the Karelian SSR was a mistake. When the Soviet Union and Finland inevitably come to blows again, our utmost priority should be the neutralization of the Karelian fifth column before they can do damage to us. As decided by General Secretary Romanov, the Karelian SSR will be dissolved, effective immediately, and reabsorbed into the Russian Socialist Federative Republic as an ASSR. To ensure the stability and loyalty of the region, we will increase our military presence, further fortify the borders with our contentious neighbor, and increase anti-smuggling and police initiatives. As the past 14 years have shown us, a benevolent approach toward minorities who are predetermined toward reactionary beliefs is contradictory. Instead of welcoming them, we should treat them like the separatist reactionary swine they are."
 SOV_kazakh_brothers: "Our Loyal Kazakh Brothers"
 SOV_kazakh_brothers_desc: "Throughout the long history of the Union, filled with adversities and setbacks - we have heard enough of countless backstabbers and opportunistic separatists in the SSRs, or even on our own sovereign soil. \n\nHowever, Kazakhstan has proven to be quite a far-cry from these outrageous cases. The revolutionary cause has never died there, due to the consistent and steadfast leadership of the legitimate SSR. From 1943 all the way to 1972, the Kazakh SSR remained unified and loyal to its former overlord- and the only case of discontentment was the short-lived rebellion in 1968, which was effortlessly quelled by the dependable Mikhail Solomentsev. The reintegration of the Kazakh SSR into the Union in 1972 happened smoothly as if Kazakhstan had already been ours from the beginning. \n\nThe loyalty of our Kazakh brethren is admirably unquestioned, and as the Union seeks to deepen the connections between all communities, Kazakhstan will undeniably get their well-deserved privileges as a generous reward for their commitment to the greater good of the Bolshevik revolution. That involves the further elevation of Kazakh statesmen, development of new facilities, expansion of infrastructure, extra industrial investment and increased funds for governmental projects. May Kazakhstan prosper in harmony and her people look up to us as loving brothers who liberated them from poverty and bondage."
 SOV_turkic_ssrs: "The Other Turkic Republics"
 SOV_turkic_ssrs_desc: "In the 1970s, the wicked Kempeitai turned the Turkes Kenes into a tragic bloodbath, which made more than half of Turkestan fall into a state of utter insubordination. The other ‘sovereign’ states quickly threw themselves into Japan’s mercy to find a way to reconstruct. However, the days of disorientation and dependence on Japan came to an end as the resurgent Union launched a campaign to restore its rightful authority over the steppes. \n\nWhile rebuilding its economy, the Tajik SSR made Afghanistan pay the blood debt by conducting a border offensive and reclaiming the territory stolen by the Afghan thieves. After the Second West Russian War, the Turkmen SSR’s attitude toward Iran was overwhelmingly antagonistic as the First Secretary pledged to counteract German influence by any means possible. \n\nThough Turkestan is characterized by strife, war and tension - we still have plans to develop it. Cotton, also known as the ‘‘white gold’’ has got the lion’s share of attention from our economic policymakers who seek to facilitate larger exports. To be able to nurture bigger fields of cotton, we will begin by slowly draining the Aral Sea as an attempt to irrigate the desert. Less important but not meaningless in the list of priorities is the further inspection of the southern defenses, which will help us to stiffen our ability to deter any threat."
 SOV_polish_assr: "The Tenacious Poles"
 SOV_polish_assr_desc: "Now for the ASSR that has the most tragic background: the Polish ASSR. \n\nFollowing the defeat in the Second World War, the Polish underground partisans diligently waited for the right time to come back and stab the Nazi oppressors in their most tempestuous moment. It seemed like their dream of a free Polish nation came true when the tyrannical Adolf Hitler kicked the bucket in 1963, plunging Germany and its entire sphere of influence into anarchy. But the triumph was evanescent - as the damned Germans got back on their feet again - and destroyed everything that the Polish Home Army had taken nearly two decades to build. \n\nAn ASSR for exiled Poles was established way back in the days of the Second World War, now, with all hope of restoring Poland dashed away and the bitter remnants of the Polish resistance fleeing eastward - the ASSR is still growing day by day. It is believed that the Poles have accepted this land as their new permanent home. However, their unadulterated will to take revenge has always remained a constant, hence some exiled Polish officials have made an impassioned plea to help them more with building a strong Polish ASSR and eventually, revitalizing and rearming a Polish militia force which will most likely fight side by side with us…in the upcoming showdown with the Reich. \n\nMay Poland and her people find freedom and strength under the wings of the Soviet Motherland."
 SOV_tabs_on_fer: "Keeping Tabs on the Far East"
 SOV_tabs_on_fer_desc: "The Far Eastern Republic is a unique entity tied to multi-faceted matters. On one hand, thanks to our agreement with the Japanese, it enjoys a distinguished degree of autonomy and implements its own laissez-faire policies, generating considerable economic growth while vitalizing the affluence of materialistic capitalism. On the other, there is an undesirable consequence where malpractices and discordance are becoming more facilitated. \n\nSurely, under our paternalistic benevolence, we must still try to assert concrete authority over the Far Eastern Republic - without damaging too much of its capability to thrive. The utmost job involves tracking down bribery, corruption, smuggling, tax evasion, poor treatment of workers and even possible covert infiltrations. As the reports from the MGB headquarters suggest, we already have a few active suspects in the Far East - who are still insidiously seeking to infringe the principal foundations of the Soviet system in the region due to their hunger for wealth and power. A steadfast intervention from our agencies will efficiently keep everything in check and thwart any zealous attempts to seize profit - both domestic and foreign. \n\nUndeniably, the MGB will once again be the spearhead of our policy. And only then will the Far Eastern Republic prosper without any instability."
 SOV_establish_exile_ssrs: "Re-establish Our Stolen Republics"
 SOV_establish_exile_ssrs_desc: "Things have gone like a rollercoaster for our former Eastern European autonomous republics for the last decades. From the years of adversities under Bukharin’s disastrous management, the Second Great Patriotic War and then the age of bondage under the Nazi colonial administrations. The loathsome hands of the Nazi colossus have unfailingly continued to get rid of every trace of our dear brethren’s sovereignty until this day. \n\nWhat’s left of the native resistance movements has gathered here, in the heart of the proletariat revolution. Among them are dominantly the Belarussians and Ukrainians - those who have suffered the worse fate than us, and their determination to return to their own soil is still unwavering. Acknowledging the pivotal purpose of organizing proper government-in-exile of the Soviet republics, the Politburo has agreed upon a unified decision. By formally recognizing the old claims of Ukrainian and Byelorussian SSRs, we will manage to attain a larger base of support for the upcoming liberation war. Plus, it will pave way for another fresh wave of discontentment within the Eastern Reichslands, destabilizing and demoralizing the disdained oppressors. \n\nThe exiled governments of the autonomous SSRs will also prove to be useful when it comes to re-establishing our control over Eastern European territories, should we triumph against the Germanic hordes."
 SOV_violate_treaty_riga: "Violate the Treaty of Riga"
 SOV_violate_treaty_riga_desc: "The Treaty of Riga was considered to be a humiliating event for the German Reich and a pronounced testimony to the resurgence of the Union. One might assume that it technically put an end to all the hostilities between Germany and Russia - but does that notion really match the truth? \n\nTo say that the Second West Russian War satisfied the goal of total reunification of the Soviet Union is practically an overestimation. Muscovy was just a tip of the iceberg, compared to the amount of rightful territories that the Nazis took from us - and we, the proud children of the Motherland, cannot sit idly and look how the Germans slowly pollute the lands of our dear brethren for the own good of the Aryan race. \n\nBesides Ukraine, Belarus and Caucasus, we have another abominable thorn - Militarbezirk Homel - the stubborn remnants of the oppressors of Muscovy that have gathered there and showed their militaristic stance that will eventually be the major factor for further transgressions. It is clear that war will come to Europe once again, and this so-called peace treaty will be torn apart like nothing…And we will be the ones that remind the Nazis about one thing: Our battle is not done yet."
 SOV_diamond_jubilee: "Our Diamond Jubilee Awaits"
 SOV_diamond_jubilee_desc: "The enemies of the Bolshevik revolution - bloodthirsty fascists and reactionary capitalists alike - once cherished the illusion that our Union died with Bukharin’s decimating failure in the Great Patriotic War. On the contrary, our durability and endurance have always been unimaginable. The tenacious armies of the Union persevered in the face of extreme internal and external adversities, while the far-sighted leaders of the Party maintained the backbone of our structure - turning the USSR into a formidable economic and military power, capable of prospering for decades to come. \n\nThe Red Bear, once thought to have been annihilated by the Swastika, is now turning 75 years old - and it will continue to grow and overwhelm its rivals with an unwavering might similar to that of every Soviet veteran, patriot and citizen. Thanks to legendary figures such as Zhukov, Kaganovich and Yagoda; our Union has never vanished, instead it came back to the world and debased what was viewed as the strongest anti-revolutionary power in the world. \n\nNow, it’s time for us to reminisce about the laborious road behind us that has lasted for 75 years, and to celebrate the successful reconstruction of the Soviet Union. Let us look up to those who have strived so hard for our future to wake up the daunting spirit inside each of us…as the true challenge is ahead."
 
 ### Tooltips ###
 
 ### Nat. Spirits ###

 SOV_Suslov_Vision: "Suslov's Vision"
 SOV_Suslov_Vision_desc: "The Germans have Hitler. The Americans have Washington. The Soviets have Suslov. \n\nMikhail Andreyevich Suslov, the visionary who saved the Union during the darkest of dark times, has truly seen it all. His childhood came to a screeching halt during the Russian Revolution of 1917. He wept as the fascist hordes tore his beloved nation into shreds in ‘43, and fought tooth-and-nail against the Passionariyy during the turbulent days of the Komi 'Republic'. Most indispensable of all, however, was his vital role in reuniting the embattled Soviet Union and preparing it for its long-sought revenge against the Teutonic savages. \n\nObsessed with the teachings of Lenin, Suslov implemented collective leadership within the Party, centralised the Russian economy (to the point of being informally labelled the 'Pope' of Orthodox Communists), and enacted a laundry list of social reforms that turned Russian society on its head. \n\nThough myriad scars remain, and shall remain for decades to come, the apocalyptic hellscape of the Russian anarchy is no more. For better or for worse, the fingerprints of Mikhail Suslov — the father of the resurgent Soviet state — are plain to see wherever one cares to look."
 SOV_Supremacy_MGB: "Supremacy of the MGB"
 SOV_Supremacy_MGB_desc: "Comparable to the American CIA or the Japanese Kempeitai, the Ministry of State Security (MGB) is a Soviet security apparatus authorised by the state to deal with internal and external threats through the means of espionage. \n\nImmediately post-reunification, the MGB — or, as it was known at the time, the NKVD — was granted an absurd amount of power and resources to eliminate the remaining fascists, reactionaries, and cultist freaks still holding out against the reunited Soviet Union. After the Third Great Patriotic War, the agency played a paramount role in the De-Germanisation of Moscowien, reintegrating conquered lands and 'assisting' the Ostdeutsch settlers in finding their way back to their Vaterland...or the nearest ditch. \n\nBut as the new millennium approaches, many in the Politburo — including Romanov himself — have begun to question the excessive power wielded by the MGB. As the anarchic era of the Second Smuta continues to recede into the annals of history, the all-powerful MGB has become less of a necessity and more of a liability. In order to ensure the stability and longevity of the Union, says Romanov, all state apparatuses must be absolutely loyal to the Communist Party. \n\nThe current state of affairs, however, is highly questionable..."
 SOV_System_of_Khozraschyot: "System of Khozraschyot"
 SOV_System_of_Khozraschyot_desc: "Devised by Yagoda and his Premier Kosygin during the time of the Siberian Soviet Republic, The system of Khozraschyot, (or 'Cost Accounting'), is an economic system which aims to adapt socialism with the material needs of the Russian people. Khozraschyot takes Bukharin’s 'New Economic Policy' one step further, allowing private enterprise and market systems to flourish with state supervision. Yagoda argues that Bukharin did not go far enough with the NEP, and that productive forces were not sufficiently developed which resulted in the defeat of the First Great Patriotic War to the Germans. \n\nTogether with American companies like Boeing and state-owned Enterprises like PJSC Sberbank, a thriving and competitive business market is forming on the Eastern Coast of the Union and its port of Magadan. As a result, the Far East’s roaring economic engine has enabled it to begin outgrowing the various metropolitan powerhouses of Western Russia."
 SOV_Legacy_of_Zhukov: "Marshal Zhukov's Legacy"
 SOV_Legacy_of_Zhukov_desc: "Georgy Konstantinovich Zhukov, Grand Marshal of the Soviet Union, was Suslov's right-hand man during the tumultuous Russian Anarchy. Suslov extended a welcome hand to Zhukov after taking control of the Komi Republic in 1962, unifying the two states in order to salvage Russia from the clutches of despair. \n\nAs the fascist swine of Germania rested on their looted laurels, Zhukov, a major player in the Russian wars of reunification, sharpened his sword, pioneering a number of innovative military tactics and strategies. Though he would ultimately pass in 1974, the Soviet Army would make use of his playbook, dubbed the “Zhukov Doctrine,” to reclaim Moskva during the Third Great Patriotic War. \n\nThe majority of Russia’s most accomplished Generals swear by Zhukov Doctrine to this day, but as time wears on, a few have dared to accuse the tried-and-true tactics, crafted nearly 40 years ago, of being unsuitable for the modern battlefield. Such conflicts may seem petty now — but as the shadow of Germania still looms large over Europe, they must be resolved before the two giants inevitably come to blows once again."
 SOV_The_Scars_of_Moscowien: "The Scars of Moscowien"
 SOV_The_Scars_of_Moscowien_desc: "Although the Union may have wrenched Moscowien from the claws of the fascist vermin, there is still much to be done before the region even comes close to resembling its pre-invasion self. \n\nDuring the Germans’ barbaric rule, Generalplan Ost was carried out with devastating results, reducing the native population of the region by nearly half. Entire villages were razed to the ground. The smoldering ashes, settled by blonde-haired swine, were redubbed with hideous German names to honor the beasts and war criminals responsible for the rape of the Soviet people. \n\nBy some miracle, Western Russia has markedly improved in the last fifteen years, but a litany of problems remain. Nothing grows in soil poisoned by chemical weapons. Infrastructure barely exists outside of large population centres. Millions of traumatised, poverty-stricken citizens, desperate for any chance to forget the horrors of the past, can do nothing but turn to the bottle and waste the days away. \n\nWinning the war, as it turns out, was the easy part."
 SOV_Job_Half_Done: "A Job Half Done"
 SOV_Job_Half_Done_desc: "The lands formerly known as ‘Reichskommissariat Moscowien’, dotted with mass graves, deserted villages, and plundered cities, are a shocking showcase of the Teuton’s capacity for cruelty. With Moskva back in Russian hands, the healing can begin, but that begs the question — what about the others? \n\nAn increasing number of Party members have, as of late, decried the fact that our Byelorussian, Ukrainian, and Caucasian brothers continue to languish under the Nazi thumb. They silently curse the name of the deceased General Secretary Viktor Grishin, insisting that, during the Third Great Patriotic War, the Union should have continued exploiting the collapsing German lines to push the vermin all the way to Germania. \n\nThe past is the past — but the future is an open book. To that end, these same Party members have, for the past several years, lobbied for a Fourth Great Patriotic War: an end to the trilogy of German-Soviet conflicts that will, once and for all, liberate our Slavic brethren from the German yoke. \n\nAnd, as their voices grow ever louder, others are starting to listen..."
 
 ### Events ###

 SOV_space.1.t: "Vostok 1 Launch a Flawless Success"
 SOV_space.1.desc: "Yesterday, Sergey Avdeev became the first Soviet citizen to breach Mankind’s Final Frontier aboard Vostok 1, the Soviet Union’s first-ever manned spacecraft mission. The USSR is now the fifth nation in the world to carry out the monumental feat, following Germany, the United States, Japan, and Italy. \n\nTo many, the successful launch is a symbol of a resurgent Soviet Union, freed from the shackles of poverty and strife that once held the nation in the margins of history. Washington has extended a warm congratulations, emphasising the need for “friendly competition in outer space to promote another century of innovation”. Tokyo issued a brief statement acknowledging the triumph. An apoplectic Germania has outright refused to comment. \n\nRegardless of international reception, one fact is clear — the Soviet Union’s first foray into the cosmos is undoubtedly a massive coup for the fledgling Great Power and for the cause of Communism."
 SOV_space.1.a: "And on Mars there will be Apple Blossoms."
 SOV_space.1.b: "A pig wearing Lipstick is still a Pig."
 SOV_space.1.c: "We Extend our Congratulations."

