 ### Nat. Spirits ###
 FER_Neutral_Zone: "Far Eastern Neutral Zone"
 FER_Neutral_Zone_desc: "The year was 1975. Vicious Soviet partisans ravaged the Manchurian countryside. The long-ignored Nanjing began to seriously assert itself within the Sphere. Backed into a geopolitical corner, the Empire of Japan and their Soviet neighbours agreed, at long last, to put their differences aside and finally discuss the status of Outer Manchuria. \n\nTheir negotiations ultimately culminated in the Treaty of Sapporo, which reinstated the long-forgotten Far Eastern Republic of the 1920s. Though technically under de jure Soviet control, the territory was fully demilitarised in order to calm Japanese concerns that Vladivostok could once again 'be wielded  as a naval dagger at the Heart of Nippon'. \n\nThough the treaty was far from perfect, Soviet officials, more concerned with the upcoming Second West Russian War, agreed without much pushback. Nowadays, however, many in the Politburo have expressed dissatisfaction with the current arrangement, equating the demilitarisation to the humiliation Russia suffered in 1905. Nevertheless, so long as the fascist menace of Germania occupies Eastern Europe and the Caucasus, the status of the Far Eastern Republic seems destined to languish on the political backburner."
 FER_Cultural_Melting_Pot: "A Melting Pot of Cultures"
 FER_Cultural_Melting_Pot_desc: "For centuries, Manchuria's Qing rulers, in the interest of preserving the area’s Manchu identity, forbade Han migration into the vast territory. It is thanks to these strict migration laws that, when the Tsars of old annexed Outer Manchuria during the 19th century, the sparsely-populated land was ripe for the coming tide of Russian settlement. \n\nIn a cruel twist of fate, however, the Manchurian lapdogs of the Yamato once again seized the region in 1943 as the armies of the Wehrmacht smashed into Moskva. Uncountable numbers of Han, Korean, and Japanese migrants poured into Vladivostok and Khabarovsk, and Russians became a minority in Manchuria once again. \n\nWhile these new settlers provide an abundance of cheap labour, the loyalties of said population are more than questionable. If push comes to shove and a crisis embroils Northern Asia once more, our intelligence suggests that many of them will side with Nanjing and Tokyo over us, their rightful rulers..."
 FER_No_Units: "§RThe Armed Forces of the Union of Soviet Socialist Republics are forbidden to be stationed here.§!"

 ### Leader Desc ###
 POLITICS_YEVGENY_NAZDRATENKO_DESC: "Chairman of the Government of the Far Eastern Republic \n--------------\nYevgeny Ivanovich Nazdratenko was born in a far away land of the Pacific, distanced from the Union's Crushing Defeats in the First Great Patriotic War against the Fascist Beasts of Germania. Nevertheless, he and his family experienced the repercussions of the Soviet collapse. Born in 1949 at the town of Petropavlovsk-Kamchatsky, he was but a boy when Yagoda's Presidium of the Supreme Soviet was torn apart by the Heirs of Harbin, leaving the Soviet Pacific Navy stranded in Kamchatka. Despite these setbacks, Yagoda managed to recoup and regroup, reclaiming the Far East and re-uniting with the Red Fleet, bringing about some semblance of stability. \n\nAs the Soviet Union reunited, Nazdratenko attended the Vladivostok State University of Economics and Service, renamed from the Urajio State University when the Union successfully negotiated a return of Outer Manchuria from Japan. Nazdratenko graduated in 1983 with a Specialisation in Economics, and took interest in Yagoda and Kosygin's System of Cost Accounting, whereby corporations and limited open markets would be tolerated by the Presidium to accelerate the 'developmental' stage of Socialism. \n\nWith a promotion to the position of Chairman of the FER in 1993, Nazdratenko will aim to build on the Legacy of Yagoda and his System of Cost Accounting, and if he performs his duties to a high standard, perhaps even Moskva can take inspiration from Yagoda's Theories in full..."

