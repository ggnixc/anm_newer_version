 ### Leader Desc ###
 POLITICS_GRIGORY_ROMANOV_DESC: "Chairman of the Council of Ministers \n--------------\nWhen the Soviet Union collapsed in the aftermath of the First Great Patriotic War, even the laziest of speculators could have foreseen that, if the Motherland were to ever be reunited under the monarchical system of old, a man by the name of “Romanov” could return to the gilded summit of the Kremlin. Few, however, could have predicted this scenario would come to pass in a renewed Red Russia. \n\nIn 1923, Grigory Romanov was born into a small peasant family from Novgorod. A soldier in the First Great Patriotic War, Romanov watched through tear-blurred eyes as an army of skull-capped barbarians tore his beloved country to pieces. Gravely wounded from the gruelling fight, he hunkered down in Gorky, biding his time as the Red Army withdrew into the frigid Russian interior. \n\nYears later, as Mikhail Suslov began to reforge the ravaged pieces of the old Union, Romanov entered the ranks of what would, post-reunification, eventually evolve into the reborn Communist Party of the Soviet Union. Through the years, Romanov ascended through the Party ranks, eventually earning a reputation as one of the Politburo’s most prominent members for his role in presiding over the de-Germanisation and reconstruction of the Leningrad Oblast following the Soviet Victory in the Third Great Patriotic War. \n\nPremier Suslov would perish in 1982, followed by his successor, Viktor Grishin, ten years later. At last, it was Romanov’s turn to take the mantle of Premier — the third to do so since the Union’s reunification. As the year 2000 approaches, Romanov is determined to continue Suslov's vision of collective leadership and his grand synthesis. All the while, he eyes the occupied lands to the west, dreaming of the day when they, too, shall be liberated by proletarian arms."
 POLITICS_ALEXANDER_BAYGUSHEV_DESC: "Chairman of the Council of Ministers \n--------------\n"

