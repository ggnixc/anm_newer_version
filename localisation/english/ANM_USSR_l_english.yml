 ### Nat. Spirits ###

 SOV_Suslov_Vision: "Suslov's Vision"
 SOV_Suslov_Vision_desc: "The Germans have Hitler. The Americans have Washington. The Soviets have Suslov. \n\nMikhail Andreyevich Suslov, the visionary who saved the Union during the darkest of dark times, has truly seen it all. His childhood came to a screeching halt during the Russian Revolution of 1917. He wept as the fascist hordes tore his beloved nation into shreds in ‘43, and fought tooth-and-nail against the Passionariyy during the turbulent days of the Komi 'Republic'. Most indispensable of all, however, was his vital role in reuniting the embattled Soviet Union and preparing it for its long-sought revenge against the Teutonic savages. \n\nObsessed with the teachings of Lenin, Suslov implemented collective leadership within the Party, centralised the Russian economy (to the point of being informally labelled the 'Pope' of Orthodox Communists), and enacted a laundry list of social reforms that turned Russian society on its head. \n\nThough myriad scars remain, and shall remain for decades to come, the apocalyptic hellscape of the Russian anarchy is no more. For better or for worse, the fingerprints of Mikhail Suslov — the father of the resurgent Soviet state — are plain to see wherever one cares to look."
 SOV_Supremacy_MVD: "Supremacy of the MVD"
 SOV_Supremacy_MVD_desc: "Comparable to the American CIA or the Japanese Kempeitai, the Ministry of Internal Affairs (MVD) is a Soviet security apparatus authorised by the state to deal with internal and external threats through the means of espionage. \n\nImmediately post-reunification, the MVD — or, as it was known at the time, the NKVD — was granted an absurd amount of power and resources to eliminate the remaining fascists, reactionaries, and cultist freaks still holding out against the reunited Soviet Union. After the Third Great Patriotic War, the agency played a paramount role in the De-Germanisation of Moskowien, reintegrating conquered lands and 'assisting' the Ostdeutsch settlers in finding their way back to their Vaterland...or the nearest ditch. \n\nBut as the new millennium approaches, many in the Politburo — including Romanov himself — have begun to question the excessive power wielded by the MVD. As the anarchic era of the Second Smuta continues to recede into the annals of history, the all-powerful MVD has become less of a necessity and more of a liability. In order to ensure the stability and longevity of the Union, says Romanov, all state apparatuses must be absolutely loyal to the Communist Party. \n\nThe current state of affairs, however, is highly questionable..."
 SOV_System_of_Khozraschyot: "System of Khozraschyot"
 SOV_System_of_Khozraschyot_desc: "Devised by Yagoda and his Premier Kosygin during the time of the Siberian Soviet Republic, The system of Khozraschyot, (or 'Cost Accounting'), is an economic system which aims to adapt socialism with the material needs of the Russian people. Khozraschyot takes Bukharin’s 'New Economic Policy' one step further, allowing private enterprise and market systems to flourish with state supervision. Yagoda argues that Bukharin did not go far enough with the NEP, and that productive forces were not sufficiently developed which resulted in the defeat of the First Great Patriotic War to the Germans. \n\nTogether with American companies like Boeing and state-owned Enterprises like PJSC Sberbank, a thriving and competitive business market is forming on the Eastern Coast of the Union and its port of Magadan. As a result, the Far East’s roaring economic engine has enabled it to begin outgrowing the various metropolitan powerhouses of Western Russia."
 SOV_Legacy_of_Zhukov: "Marshal Zhukov's Legacy"
 SOV_Legacy_of_Zhukov_desc: "Georgy Konstantinovich Zhukov, Grand Marshal of the Soviet Union, was Suslov's right-hand man during the tumultuous Russian Anarchy. Suslov extended a welcome hand to Zhukov after taking control of the Komi Republic in 1962, unifying the two states in order to salvage Russia from the clutches of despair. \n\nAs the fascist swine of Germania rested on their looted laurels, Zhukov, a major player in the Russian wars of reunification, sharpened his sword, pioneering a number of innovative military tactics and strategies. Though he would ultimately pass in 1974, the Soviet Army would make use of his playbook, dubbed the “Zhukov Doctrine,” to reclaim Moskva during the Third Great Patriotic War. \n\nThe majority of Russia’s most accomplished Generals swear by Zhukov Doctrine to this day, but as time wears on, a few have dared to accuse the tried-and-true tactics, crafted nearly 40 years ago, of being unsuitable for the modern battlefield. Such conflicts may seem petty now — but as the shadow of Germania still looms large over Europe, they must be resolved before the two giants inevitably come to blows once again."
 SOV_The_Scars_of_Moskowien: "The Scars of Moskowien"
 SOV_The_Scars_of_Moskowien_desc: "Although the Union may have wrenched Moskowien from the claws of the fascist vermin, there is still much to be done before the region even comes close to resembling its pre-invasion self. \n\nDuring the Germans’ barbaric rule, Generalplan Ost was carried out with devastating results, reducing the native population of the region by nearly half. Entire villages were razed to the ground. The smoldering ashes, settled by blonde-haired swine, were redubbed with hideous German names to honor the beasts and war criminals responsible for the rape of the Soviet people. \n\nBy some miracle, Western Russia has markedly improved in the last fifteen years, but a litany of problems remain. Nothing grows in soil poisoned by chemical weapons. Infrastructure barely exists outside of large population centres. Millions of traumatised, poverty-stricken citizens, desperate for any chance to forget the horrors of the past, can do nothing but turn to the bottle and waste the days away. \n\nWinning the war, as it turns out, was the easy part."
 SOV_Job_Half_Done: "A Job Half Done"
 SOV_Job_Half_Done_desc: "The lands formerly known as ‘Reichskommissariat Moskowien’, dotted with mass graves, deserted villages, and plundered cities, are a shocking showcase of the Teuton’s capacity for cruelty. With Moskva back in Russian hands, the healing can begin, but that begs the question — what about the others? \n\nAn increasing number of Party members have, as of late, decried the fact that our Byelorussian, Ukrainian, and Caucasian brothers continue to languish under the Nazi thumb. They silently curse the name of the deceased Premier Viktor Grishin, insisting that, during the Third Great Patriotic War, the Union should have continued exploiting the collapsing German lines to push the vermin all the way to Germania. \n\nThe past is the past — but the future is an open book. To that end, these same Party members have, for the past several years, lobbied for a Fourth Great Patriotic War: an end to the trilogy of German-Soviet conflicts that will, once and for all, liberate our Slavic brethren from the German yoke. \n\nAnd, as their voices grow ever louder, others are starting to listen..."
 SOV_Lukyanov_Economic_Reform_4: "Lukyanov's Economic Reforms Progress: Full Reform"
 SOV_Lukyanov_Economic_Reform_4_desc: "Amidst a revolutionary climate, Anatoly Lukyanov emerged as a prominent reformist, seeking to dismantle the rigid command economics dictated by Marxist ideology. He championed comprehensive reforms aimed at granting local enterprises and national corporations greater autonomy, positing that such changes would not only benefit the proletariat but also accelerate their liberation. As he gained traction among reformist factions, the loosening grip of the Marxist-Leninist wing within the CPSU has begun to accelerate the full realization of his proposals. \n\nWith Lukyanov’s ascendancy as Premier of the Soviet Union, Lukyanov now has full reign to implement his vision of a Union free from the dogmatism of the past. The implementation of economic cooperation with the Americans, the de-collectivization of farmlands allowing individual farmers to lease land, manage production, and sell surplus crops on the market along with the reduction of central planning have seen great progress. While ideological purists decry the betrayal of Marx’s teachings, Lukyanov ignores their remarks, as the Union marches forward richer than ever."
 SOV_A_New_European_Master: "A New European Master"
 SOV_A_New_European_Master_desc: "For a moment, there was nothing but a deafening silence. Our soldiers' advances were stopped at the command of their generals, each of them wondering what prompted such sudden orders from the party. And then, the news was revealed to them, and as a response, the air of the fields was filled with nothing but tears of joy and hurrahs in celebration of the Union's victory over fascism. \n\nOur victory has brought back the strength of the Union not seen since 1940. No longer can the Germanic Huns proclaim themselves to be the strongest nation in Europe with the devastating defeat in the latest German-Soviet War. With the Reich in disarray, this is a golden opportunity that we cannot let go of. We have a chance to extend the revolution beyond our borders, as the proletariat in Europe yearn for liberation. \n\nGlory to the Soviet Union and the workers of the world!"
 SOV_A_Self_Focused_Union: "Deepened Cooperation with the OFN"
 SOV_A_Self_Focused_Union_desc: "The resurgence of the Soviet Union onto the world stage has shaken the otherwise chaotic status quo even more. Rising from the ashes of the Russian Anarchy, no one was able to tell in which direction the Soviet authorities lean against. To some, the original commitment promised by the previous revolutionaries was the only logical answer. A foreign policy dictated by cooperation with fellow proletarian nations, all brought together in their struggle against imperialism and fascism. But to others, reaching an agreement with the Organization of Free Nations was the only viable option. In their eyes, the riches that the Washington administration possessed would be an essential tool in the fight against the Reich. \n\nThe Soviet Union, wanting to concentrate on the liberation of its Union republics, opted for deepened ties with the United States. As a result, relations with other remaining socialist countries, while still positive, were damaged nonetheless. But first and foremost, liberation requires capital to finance it."
 SOV_KGB_Empowered: "KGB - Empowered"
 SOV_KGB_Empowered_desc: "The KGB, much like its predecessor organizations, is the current security agency of the Union of Soviet Socialist Republics. While the People's Commissariat for Internal Affairs would be reformed after the reunification of the Soviet Union, the organization would go on to be transformed into the Ministry of State Security. With the uneasy Peace Treaty of 1976, the agency would once again be renamed to the Committee of State Security. However, this time, a major increase in government funds would accompany this change, as the lands of Muscovy would need to be heavily monitored in order to stamp out possible collaborator cells or bandits. \n\nWhile the tumorous Nazi bandits plagued and pillaged our rightful lands out of their own self loathing and greed, the KGB and its agents worked diligently to suppress these terrorists. Everyday we receive new reports of pro-German scum being either captured or eliminated from the countryside. Such news should not only be celebrated, but funded by the state in order to completely wipe them out of existence. The KGB shall be granted an increase in funding for their impressive achievements, and with thousands of new recruits joining every year, the future looks bright for the proletariat. \n\nWhat must one do to cleanse the lands from fascism?"
 
 ### Events ###

 SOV_space.1.t: "Vostok 1 Launch a Flawless Success"
 SOV_space.1.desc: "Yesterday, Sergey Avdeev became the first Soviet citizen to breach Mankind’s Final Frontier aboard Vostok 1, the Soviet Union’s first-ever manned spacecraft mission. The USSR is now the fifth nation in the world to carry out the monumental feat, following Germany, the United States, Japan, and Italy. \n\nTo many, the successful launch is a symbol of a resurgent Soviet Union, freed from the shackles of poverty and strife that once held the nation in the margins of history. Washington has extended a warm congratulations, emphasising the need for “friendly competition in outer space to promote another century of innovation”. Tokyo issued a brief statement acknowledging the triumph. An apoplectic Germania has outright refused to comment. \n\nRegardless of international reception, one fact is clear — the Soviet Union’s first foray into the cosmos is undoubtedly a massive coup for the fledgling Great Power and for the cause of Communism."
 SOV_space.1.a: "And on Mars there will be Apple Blossoms."
 SOV_space.1.b: "A pig wearing Lipstick is still a Pig."
 SOV_space.1.c: "We Extend our Congratulations."

 SOV_power_struggle.1.t: "New Premier Chosen for Victory Scenario"
 SOV_power_struggle.1.desc: "Choices are below:"
 SOV_power_struggle.1.a: "Lukyanov"
 SOV_power_struggle.1.b: "Kryuchkov"
 SOV_power_struggle.1.c: "Baygushev"

 SOV_antarctica.1.t: "1996 New Zealand Elections"
 SOV_antarctica.1.desc: "Normally, the Soviet Union, free from the decadence of bourgeois democracy, a system which offers a paradise for the rich and deception for the exploited proletariat, does not need to concern itself with elections of other nations. Nevertheless, the upcoming November 1996 elections in New Zealand is of great concern for the Soviet Union. The Soviet Antarctic lease on the Ross Dependency will expire in 1998, and the following elected government of New Zealand will be the one to negotiate a renewal of our lease. \n\nSoviet-New Zealand relations have been fairly cordial over the years, with the common aims of denuclearisation in the Pacific region, and the united struggle against the superpowers of Germany and Japan. The Soviet Union is also a key export market for New Zealand. The incumbent Labour Party may still be amicable to a renewal of our lease in Antarctica, but a victory of the National Party will likely result in the termination of the agreement given their anti-socialist nature. \n\nA key factor to note is that it is New Zealand's first election to be held under the new mixed-member proportional electoral system, where a proportional distribution of votes would be taken into account for parliament seat allocations. As such, it will benefit parties like the NZ First and Alliance, which may contravene or aid our interests respectively. Thus, it is in our best interests to covertly support the re-election of the incumbent Labour Party as much as possible, to ensure the extension of our lease."
 SOV_antarctica.1.a: "We shall do what we must."

