l_english:
  BE_GERMAN_COLLAPSE_T:0 "The 2nd German Civil War§!"
  BE_GERMAN_COLLAPSE_D:0 "Of all the passions that inspire a man in a battle, none, we have to admit, is so powerful and so constant as the longing for honor and renown.\n- Carl von Clausewitz"
  BE_GERMAN_COLLAPSE_A:0 "And so ends the German Century."
  BE_PIEDNOIR_CONQUEST_FRANCE_T:0 " Resurgent Empire §!"
  BE_PIEDNOIR_CONQUEST_FRANCE_D:0 "I cannot prevent the French\n from being French.\n- Charles de Gaulle"
  BE_PIEDNOIR_CONQUEST_FRANCE_A:0 "Vive la France!"
  BE_TOTSOC_COUP_USSR_T:0 " Hardline coup in USSR§!"
  BE_TOTSOC_COUP_USSR_D:0 "It is not by chance that I am talking about the need to restore the former power. Otherwise they won't let us survive!\n- Vladimir Aleksandrovich Kryuchkov"
  BE_TOTSOC_COUP_USSR_A:0 "Permanent revolution"