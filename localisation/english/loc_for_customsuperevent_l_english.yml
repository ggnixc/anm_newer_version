l_english:
  BE_GERMAN_COLLAPSE_T: "The 2nd German Civil War§!"
  BE_GERMAN_COLLAPSE_D: "Of all the passions that inspire a man in a battle, none, we have to admit, is so powerful and so constant as the longing for honor and renown.\n- Carl von Clausewitz"
  BE_GERMAN_COLLAPSE_A: "And so ends the German Century."
  BE_PIEDNOIR_CONQUEST_FRANCE_T: " Resurgent Empire §!"
  BE_PIEDNOIR_CONQUEST_FRANCE_D: "I cannot prevent the French\n from being French.\n- Charles de Gaulle"
  BE_PIEDNOIR_CONQUEST_FRANCE_A: "Vive la France!"
  BE_TOTSOC_COUP_USSR_T: " Hardline coup in USSR§!"
  BE_TOTSOC_COUP_USSR_D: "It is not by chance that I am talking about the need to restore the former power. Otherwise they won't let us survive!\n- Vladimir Aleksandrovich Kryuchkov"
  BE_TOTSOC_COUP_USSR_A: "Permanent revolution"