 # Southern African Customs Union
 RegionalOrganization_SACU: "Southern African Customs Union"
 RegionalOrganization_SACU_colored: "§J$RegionalOrganization_SACU$§!"
 RegionalOrganization_SACU_desc_0: "Conceived after the costly Anglo-Boer War, the Southern African Customs Union is the oldest Customs Union still functioning. Invented to strengthen trade links between the Southern African colonies and thus secure revenue and resources, the SACU has been repurposed following the fall of the Home Islands at the hands of the Germans and the seizure of the High Commission Territories by the newly independent South Africa.\n\nFor all intents and purposes, the cause of colonial extraction of wealth and minerals continues, but with Pretoria reaping the benefits, the SACU acting as an extension of its economic dominance over its neighbors. While its initial sphere (South Africa, Bechuanaland, Basutoland, and Swaziland) has been limited, proposals have been made to expand and further strengthen the concept by establishing a "Commonwealth of Southern Africa" between the apartheid state and its regional partners."

