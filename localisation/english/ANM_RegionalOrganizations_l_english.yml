 # African Labour Board
 RegionalOrganization_AfricanLabourBoard: "African Labour Board"
 RegionalOrganization_AfricanLabourBoard_colored: "§r$RegionalOrganization_AfricanLabourBoard$§!"
 RegionalOrganization_AfricanLabourBoard_desc_0: "The African Labour Board is an international treaty and organization made up of a wide array of colonial empires, settler states and independent majority-rule nations in Africa, bilaterally managing areas of shared concern - migration control, workforce, and remittances.\n\nWith migrant labor a staple of the African economy continent-wide, the Board exists to formalize and regulate the migration of this labor force and the remittances they send back, so that migration quotas are met and remittances can be extracted and taxed by the Board itself and the relevant signatory state. There are two types of signatories to the Board - the 'producers' of a labor force and the 'consumers.' South Africa is purely a consumer, the independent African nations are producers, and the colonial empires are both.\n\nFor the countless Africans who leave their homes to sell their labor abroad, the Board is a layer of bureaucracy they legally must interface with to provide for their families, but it is also a means to surveille and screen their political loyalties and affiliations. While European settlers face zero restrictions or regulations to their work or travel from the Board, the lives of the vast majority of migrant laborers are just input on a ledger, expected to suffer any abuse, exploitation or indignity so long as there is still work to be done. And there is always work."

