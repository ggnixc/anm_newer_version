## Descriptions ##
 POLITICS_AHMED_DOGAN_DESC: "For quite a short time, Ahmed Dogan has become one of the most polarizing figures in Bulgaria's history. To the Muslim community, Dogan is a leader, perhaps a prophet or even savior. Quite contrary to the Bulgarian perspective, demonizing the politician with Turkish familial roots.\n\nAt the dawn of the 1980's, Dogan enlisted himself into various organizations arguing for the rights of the Muslim minority, becoming the right-hand man in the Muslim National Liberation Movement in Bulgaria. With time, however, the organization once fighting for the religious rights of marginalized communities, found itself in a limbo with the increasing reformist tendencies displayed by the central government. As such, the MNODvB turned their eyes to their ethnic brothers across the Bosphorus.\n\nThus, in the wake of the Third West Russian War, seeking to take advantage of the destabilized European theater, the separatists kickstarted the Thracian Crisis. Following an inner-party coup in the final stages before independence, Ahmed Dogan transformed the MNODvB into a political entity, labeled the Movement for Rights and Freedom. The leader himself remains an anomaly, and while he has previously accepted aid from Ankara, the opportunist is well aware of the possible deals he could strike with Sofiya should he play his cards right. In his own words:\n\n“The power is in my hands!”"
