 #LEADER DESCRIPTIONS#
 POLITICS_Naomi_Blumenthal_DESC: "Naomi experienced grief at an early age when her father was killed in the failed 1940s Jewish uprising in the Levant as a member of Irgun and her mother died of an illness when she was only 11.\nShe went through several foster families after these events but did not feel she belonged. As a young woman, she moved to Jeshurun a few years after the nation was officially established and graduated with honors in law. She entered politics in the 70s and surprised and officially joined SAI. Within the party, she surprised the party veterans by her power in debates. Her strong desire to integrate and improve her new homeland led her to several headlines in the newspapers, especially in light of being a party member who did not hesitate to confront the left-wing rule of the late 1980s. After a long struggle against Sharon and the remnants of his supporters, she took over the party in the 1999 primaries and general elections.Naomi holds on to power due to her ability to compromise between the various power brokers of her party. Whether She will keep the reins of Jeshurun is unknown, but her leadership thus far has been acceptable amongst the people. If Naomi Blumenthal is to hold on to his power, she will make many tough compromises, to orient the nation into the future."
 #FOCUSES#
 ISR_a_talk_with_the_mossad: "Congo ablaze"
 ISR_a_talk_with_the_mossad_desc: "The situation in the Congo is continuing to spiral of control but perhaps it also includes opportunities and not just difficulties for our nation. We must think carefully before making any decision. "
 ISR_review_the_operational_plan: "Review the Operational Plan"
 ISR_review_the_operational_plan_desc: "Such an operation will require a careful examination of all the details to make sure there are as few faults as possible. Even after the deployment there will no doubt be many moving parts in the moment of truth. "
 ISR_review_our_equipment: "Review the Operational Plan"
 ISR_review_our_equipment_desc: "Logistically, we have the needed equipment, it's just a matter of transferring it to our team. "
 ISR_brief_the_opposition: "Brief the Opposition"
 ISR_brief_the_opposition_desc: "And now, the hard part. We will have to share the opposition leader in our course. It does not matter if he agrees or not, what matters is that we must not hide it from him. He deserves to know at least some general details from us, because otherwise he will in any case find out in the security update he receives from the chief of staff, so it is better that we explain everything to him in private. "
 ISR_going_dark: "Going Dark"
 ISR_going_dark_desc: "Godspeed"
 ISR_a_narrow_victory: "A narrow victory"
 ISR_a_narrow_victory_desc:"It was supposed to be an easy election campaign this time. However, something unexpected happened from the moment Shevah Weiss entered the arena. A man who was supposedly anti-social by some former friends, who was not known in the public arena other than being a marginal MK. From the moment he became the leader of the left, his mighty campaign swept the masses and along with the insane coincidence of Sharon who lost popularity from moment to moment, we could not rest for a moment in the campaign. No one knew what would happen on election night and a number of party members were even sure that the right would go back to the opposition. The next day, the votes tallied, we won the elections and just barely were able to form a government, in the aftermath of the closest election in the nations history. Blumenthal had proved herself, but at what cost."
 #OPINION MODIFIERS#
 jewish_nation: "Jewish Nation"
 ##STARTING SPIRITS##
 ISR_homeland_for_the_jewish_people: "The Jewish Home"
 ISR_homeland_for_the_jewish_people_desc: "Since the days of ancient Rome, we have not had a nation of our own, and after so long we have finally succeeded in forming a §Ghomeland for our people§!".
 ISR_developed_economy: "Developed Economy"
 ISR_developed_economy_desc: "Well before the establishemnt of the state, and even more so after that, the Hebrew Yisuhv had a tremendous human spirit of building a state for themselves. Together with the support and enthusiasm of the Jews of the world, previous generations here have built a well developed economy within decades"
 ISR_a_pluralistic_nation: "A Pluralistic Nation"
 ISR_a_pluralistic_nation_desc: "With the establishment and development of the Jewish nation, we have a large and diverse population. It has opened its doors to waves of Jewish immigrants from various parts of the world, from North America and the USSR to the Levant and Ethiopia. This policy encouraged a culture of merging many of our Jewish values. Not just for the Jewish population, the arabic population that reside in our nation has also been influenced and influenced our nation. No matter how cynical one may view our nation and society, no one can deny the diversity of the population. The Jewish people are also divided into a mosaic of different cultures. In such a diverse society, there is no doubt that there is great sensitivity in dealing with the tension of various people that inhabit our nation. Handling the dualistic state of this nation will be key to the future development of Israel."
