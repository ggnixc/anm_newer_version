 ### MINISTERS ###
 ISR_michael_b_oren_for: "Michael B. Oren"
 
 anmisrael_event.1.t: "Shabbat Dinner"
 anmisrael_event.1.desc: "John was out of his depth. Being an evangelist who came from the Jerusalem district to Israel to experience the rest of the Holy Land, he found the people warm and welcoming. But they also tended to say whatever came to their minds straight to him, without any filter. \nHe met Aaron, a good friend, eighteen years old like John himself, who helped him translate in front of a food vendor who had difficulty with English. Aaron invited him to experience a Shabbat meal with the rest of his family, just like that. The family had greeted him warmly, and despite their religions differing, they showed him great hospitality. \nHe had to admit, the food was excellent. The fish was cooked to perfection, and he enjoyed that chicken soup. Everything was going well at least. It was delightful to sit in their yard there and enjoy the food.\nThen Aaron's uncle mentioned how much he hated the Levantine Union.Things rapidly began to spiral out of control at the table, with everyone at the table beginning to argue.\n''Well, if the Levantine Union didn't exist, There wouldn't be a nation for you to live in!'\n'The Union takes your nation's capital and puts it in Arab pockets.''\n''And why do we even bother to think about the Italians?''\n''Well, we can't just ignore that they gave us our freedom!''\n''Shame on you! They joined the War with the Amaleks!''\n'Even on his deathbed, Mussolini repented from that!'\nMinutes of this went on, until Aaron pulled John away from the table, and took him to his room where they played video games for some time. He didn't even know what they were screaming about after all."
 anmisrael_event.1.a: "Who is Mussolini, Aaron?"