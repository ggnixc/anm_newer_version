 CRN_garrison_desc: "The Cornwall Garrison stands as the pride of Germany's foreign fighting forces. While many of the garrisons of the various Reichskommissariats throughout Europe are poorly equipped and badly trained, just barely holding on, Generaloberst Franz Halder's men are well trained veterans, rivaling even those Wehrmacht soldiers serving in Germany proper."
 CRN_Extreme_Overextension_desc: "Though officially residing within English territory, the Cornwall Garrison has been given a substantial amount of land to watch over. So substantial, in fact, that the Garrison has had difficulty holding on to and patrolling the territory. This has displeased the Garrison's minders in Germania, who have cut funding until the situation improves. This displeasure has further filtered down to the men themselves, leading to some loss of morale among the soldiers."
 CRN_No_Gov_desc: "The Cornwall Garrison resides in a strange position within the Einheitspakt. Unlike other German controlled territories, the Garrison's ultimate purpose is not Germanization and eventual integration into the Reich, but simply to keep the English under wraps. Thus, Cornwall has not been given the bureaucratic structures it needs to exist as a proper nation, relying on Germany for most matters of military production and reinforcement."

