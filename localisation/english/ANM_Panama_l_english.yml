PAN_Militarised_Nation: "The Militarised Nation"
PAN_Militarised_Nation_desc: "One of Noriega’s first acts as “President” of Panama was to push for the nation to rapidly militarise to protect itself from its enemies (Or depending on whom you ask, Noriega’s enemies). He made everyone join the military for years’ worth of conscription once they were above 18, pushed for the creation of local defence forces and poured millions from the state coffers into national security and defence.\n\nThis massive military build-up meant that Panama needed to buy large amounts of military weapons and gear. Luckily for Noriega, both Germany and Japan were willing to sell him the equipment he needed for a price. Now Panama is one of the most militarised nations in the world, protecting its people, its sovereignty (and most importantly, its drugs)"

 
