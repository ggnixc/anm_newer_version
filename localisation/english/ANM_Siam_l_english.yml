 SIA_Damrong_Latthapipat: "Damrong Latthapipat"

 ### Ministers

 SIA_Chalermphan_Srivikorn: "Chalermphan Srivikorn\n--------------\nPrime Minister\nProgressive Conservatism"
 SIA_Thaksin_Shinawatra: "Thaksin Shinawatra\n--------------\nMinister of Foreign Affairs\nAnocracy"
 SIA_Montree_Phongpanich: "Montree Phongpanich\n--------------\nMinister of Finance\nManagerial State"
 SIA_Senae_Sittipunt: "Senae Sittipunt\n--------------\nMinister of Interior and Public Health\nFascist Populism"

 SIA_Chalermphan_Srivikorn_hog_desc: "Belonging to Thailand’s nascent intelligentsia, Chalermphan Srivikorn is Thailand’s most prominent democratic leader, leading the democratic opposition against the Manangkhasila Party. After receiving a degree from Bangkok Christian College, he would later attend Kyoto Imperial University, where he would study business and law. Returning to Thailand to become a successful business leader, Srivikorn would use his business connections to help him spur a career in politics. \n\nLeading the Independent Party, he would be one of Prasit Kanchanawat’s most stringent critics and a vocal opposition leader within the legislature. After the establishment of the 1983 constitution, Srivikorn would become the country’s first independent Prime Minister in the 1992 elections, Although his victory was sweet, it quickly turned sour as the dual executive role led to constant clashes with Damrong, leading to little of Srivikorn’s agenda being passed. While appearing as cooperative and a good friend of Damrong to the public, Srivikorn secretly plots to depose him and the Manangkhasila Party to turn Thailand into a true democracy, just one that is guided by himself."
 SIA_Senae_Sittipunt_sec_desc: "Leader of the hardline conservatives within the Manangkhasila Party, Senae Sittipunt is a relic of another time, one where the military dominated Thai politics, and when the talk of democracy would get you a bullet in the head. A politician with a military background, Sittipunt was instrumental in the Thai government’s repression of the Communist Party of Thailand and other left-wing insurgent groups, gaining a reputation as a brutal commander, one who showed no mercy to his opponents. \n\nFollowing Chumpon's government and the subsequent rise of Prasit, Senae entered politics and rapidly gained prominence.  A staunch opponent of democratization, he was a vocal critic of Damrong's government, even targeting Damrong personally.  Suspicions lingered about Senae's possible involvement with officers plotting to overthrow the President.  However, after Chalermphan's 1994 election victory, Senae was appointed Minister of the Interior and now stands as the sword over Damrong’s head, waiting for the day that his chains rust and he can show the people the power of the sword once more."
 SIA_Thaksin_Shinawatra_for_desc: "Born in the San Kamphaeng district, in the province of Chiang Mai, Thailand, his family was quite influential throughout the city, as their ancestry had built connections since their arrival in 1908. In his adolescent years, he moved to the capital of the province to study at Montfort College, a Catholic school in the city. In 1986, he would go on to fund the computer rental business, Advanced Info Service, one that would make him one of the wealthiest men in Thailand. \n\nDue to his newfound success, Thaksin would venture into the political scene, joining the Democratic Party in 1992 and becoming Foreign Minister merely 2 years after his ascension. His stay would be cut short, however, after he would enter into a conflict with various unnamed party members, which would cause his defection to the Manangkhasila Party in 1995. Having influence in both the Thai market and the military structure of the republic, Thaksin thinks that he is fit to ascend to an even higher position within the government, that is, if he can manipulate the situation in his favor."
 SIA_Montree_Phongpanich_eco_desc: "One of Thailand’s premier modernists, and Japan’s greatest ally in Bangkok, Montree Phongpanich is yet another businessman turned politician and another paragon of Thailand’s intelligentsia. Being educated at Pathumwan Mechanical College, his work at the Bangkok Oil Refinery and the National Highway Department would give him the bureaucratic skills to truly stand out among his peers. \n\nGoing to Japan to earn a degree in finance, Phongpanich would become inspired by Japanese finance developmentalism, returning to Thailand and pursuing a career in business in the agriculture industry. Being elected to the House of Representative soon after, his work would primarily be concerned with infrastructure and urban modernization, quickly becoming a valued asset to the government and being appointed finance minister in 1989. Now, Phongpanich seeks the crown, to fully modernize his country and turn Thailand into the Sphere’s premier jewel."
 
