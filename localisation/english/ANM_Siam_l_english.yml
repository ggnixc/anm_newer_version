### DESCRIPTIONS 

## Leaders ##
 SIA_Damrong_Latthapipat: "Damrong Latthapipat"

## Country Leader ##
POLITICS_DAMRONG_LATTHAPIPAT_DESC: "An aide of the 4th President of the Republic, Damrong Latthapipat did not anticipate that he would become the next leader of Thailand. Previously serving as the Minister of Science and Technology under Prasit Kanchanawat's administration, the death of his mentor shook the political scene of the nation. In retrospect, the main reason he agreed to step up to the position was so that the ultranationalists within the government would not be able to expand their influence and possibly coup the state. In his heart, Damrong is an avid supporter of individual liberties, being disillusioned with the status-quo across the Asian continent.\n\nBut the toughest roadblock in his crusade against authoritarianism in Thailand is perhaps his own party. The Manangkhasila Party, an amalgamation of all strata of society and corrupt bureaucrats, has found itself at odds with the current president on a number of occasions. The conservative and anti-parliamentarian nature of the political organization is a well-understood fact to most of the populace, who behind closed doors sympathize with their head of state.\n\nThe clash between the aspirations of the people and the wrath of the party remains to be seen."

 ### National Spirits
 SIA_Two_Faced_State: "Two-faced State"
 SIA_Two_Faced_State_desc: "With the ratification of Prasit’s new constitutional order in 1983, Thailand would become another hybrid, semi-democratic regime among its Southeast Asian peers. While the position of the president could only be voted on by members of the Manangkhasila Party, the Prime Minister of Thailand is allowed to be put up to universal suffrage, where any person, regardless of political affiliation can vote for their candidate. \n\nWhile the introduction of a semblance of democracy has been well-received among the Thai population, the struggle between the dominant Manangkhasila Party and the dissident democratic parties has caused severe political gridlock, reducing the government’s public perception and its efficiency."
 SIA_Thai_Wave: "Thai Wave"
 SIA_Thai_Wave_desc: "Since the birth of the Greater Co-Prosperity Sphere, the nation of Thailand has been a close affiliate of the Japanese Empire. From the jungles of Burma to the grasslands of Kampuchea, our country has followed the lead of the anti-imperialist wave that enveloped Asia. But, the new status quo reemerged the fabric of authoritarianism in Thai politics. \n\nFor many years, the nation has struggled to appeal to the international market outside of Tokyo's grasp, and only recently has freedom of expression normalized. The effects of these new laws were felt almost immediately, as a new surge of tourists entered the streets of Bangkok. In a short time, Thailand became the Sphere's hotspot for tourism, as the nation's culture has recently become popular in online circles."
 SIA_2475_Revolution_of_Deception: "2475 Revolution of Deception"
 SIA_2475_Revolution_of_Deception_desc: "§B“Dictatorship shall fall, democracy shall prosper.”§! - Khrong Chandawong. \n\nWhile democracy was always achieved through the struggle of common folk that endured too much, it was brittle, and the term can be twisted and molded to fit a narrative friendly to that of the government. Look no further than Thailand. \n\nAfter the 1932 Revolution led by the People's Party, a constitutional government was promised to the peasants and workers of Thailand, long subjugated by the absolutist rule of the monarch of that time. But, to regular citizens who have lived through the 5 consecutive cabinets that spoke of elective rule and prosperity, the vow was but an empty reassurance of an era that was never to come. Only in 1983, when the new constitution was signed into law by the Prasit administration, did the hope of eventual freedom ignite once more. But whether this government can maintain its commitment to liberty or not, is unknown to the Thai people."
 SIA_Catch_Me_if_You_Can: "Catch Me if You Can"
 SIA_Catch_Me_if_You_Can_desc: "Our enlightened leader, President Damrong, has begun to guide Thailand towards democracy. However, people will rebel even against benevolent leadership, and change always has its enemies. Those who cling to dying authoritarian traditions have begun to plot against The President. \n\nBut Damrong has not been idle. He has pulled from all available resources. His administration will stop at nothing to find these traitors… and bring them to justice."

