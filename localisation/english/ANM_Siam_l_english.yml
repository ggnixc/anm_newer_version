 POLITICS_CHUAN_LEEKPAI_DESC: "A Hokkien descent from a third-generation Peranakan family, Chuan Leekpai was born in the year 1938 in Thailand’s coastal Trang Province. One of nine siblings from a devoutly religious family, Leekpai spent much of his early life studying at a prominent Buddhist school in Bangkok. \n\nHaving always held a keen interest in government and law, Leekpai would later attend Thammasat University, another prominent Bangkok academy. Admitted to the school despite a less-than-stellar entrance exam score, Leekpai's indefatigable work ethic would redeem him over the following years. After several exhausting years of study, he would eventually earn his keep as a barrister at the Thai Bar Association. \n\nWithin the world of Thai law, the newly-minted barrister would quickly make a name for himself by presiding over several high-profile civil and criminal cases. His charm and quick wit popularized his name throughout the nation  — and Leekpai, energized by his newfound fame, began the arduous climb toward the prestigious office he could only dream of holding as a boy — the Thai Presidency. A few campaigns and a brief stint in the National Assembly later, fortune would smile upon him, and he would at last achieve his dream to be sworn in as the President of Thailand. \n\nThe eyes of the nation now closely scrutinize the charismatic barrister who charmed his way to the highest office in the land. Some say that his voluminous legal expertise and seemingly-infinite charisma is already enough to cement his legacy as one of Thailand’s greatest leaders. Others, however, suspect President Leekpai’s administration to be naught but a paper tiger, ready to collapse into a heap of ashes at the slightest spark..."


### DESCRIPTIONS 

## Leaders ##
SIA_Damrong_Latthapipat: "Damrong Latthapipat"

## Country Leader ##
SIA_Damrong_Latthapipat_desc: "An aide of the 4th President of the Republic, Damrong Latthapipat did not anticipate that he would become the next leader of Thailand. Previously serving as the Minister of Science and Technology under Prasit Kanchanawat's administration, the death of his mentor shook the political scene of the nation. In retrospect, the main reason he agreed to step up to the position was so that the ultranationalists within the government would not be able to expand their influence and possibly coup the state. In his heart, Damrong is an avid supporter of individual liberties, being disillusioned with the status-quo across the Asian continent.\n\nBut the toughest roadblock in his crusade against authoritarianism in Thailand is perhaps his own party. The Manangkhasila Party, an amalgamation of all strata of society and corrupt bureaucrats, has found itself at odds with the current president on a number of occasions. The conservative and anti-parliamentarian nature of the political organization is a well-understood fact to most of the populace, who behind closed doors sympathize with their head of state.\n\nThe clash between the aspirations of the people and the wrath of the party remains to be seen."

 ### National Spirits
 SIA_Two_Faced_State: "Two-faced State"
 SIA_Two_Faced_State_desc: "After Prasit’s government ratified the new constitution in 1983 it was roughly stated that only members of the Manangkhasila Party could vote for the president of the nation, but the position of Prime Minister could be voted on by the people no matter what party they were affiliated with. This has made Thailand an oddity among authoritarian nations as an important position of the government can be democratically elected by the people. If the two positions come from different parties though, it can be hard for any real changes to be made."
 SIA_Thai_Wave: "Thai Wave"
 SIA_Thai_Wave_desc: "Since the birth of the Greater Co-Prosperity Sphere, the nation of Thailand has been a close affiliate of the Japanese Empire. From the jungles of Burma to the grasslands of Kampuchea, our country has followed the lead of the anti-imperialist wave that enveloped Asia. But, from the new status-quo reemerged the fabric of authoritarianism in Thai politics.\n\nFor many years, the nation has struggled to appeal to the international market outside of Tōkyō's grasp, and only in recent developments was monitored freedom of expression normalized. The effects of these new laws were felt almost immediately, as a new surge of tourists entered the streets of Bangkok. In a short amount of time, Thailand became the Sphere's hotspot for tourism, as the nation's culture has recently become popular in online circles."
 SIA_2475_Revolution_of_Deception: "2475 Revolution of Deception"
 SIA_2475_Revolution_of_Deception_desc: "While democracy was always achieved through the struggle of common folk that endured too much, it was always brittle, and the term can be twisted and molded to fit a narrative friendly to that of the government. Look no further than Thailand.\n\nAfter the 1932 Revolution led by the People's Party, a constitutional government was promised to the peasants and workers of Thailand, long subjugated by the absolutist rule of the monarch of that time. But, to regular citizens who've lived through the 5 consecutive cabinets that spoke of elective rule and prosperity, the vow was but an empty reassurance of an era that was never to come. Only in 1983, when the new constitution was signed into law by the Prasit administration, did hope of eventual freedom ignite once more. But whether this government can maintain its commitment to liberty or not, is unknown to the Thai people."
 SIA_Catch_Me_if_You_Can: "Catch Me if You Can"
 SIA_Catch_Me_if_You_Can_desc: "Placeholder."

