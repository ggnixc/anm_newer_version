 ### National Spirits
 SIA_lion_of_asia: "Lion of Asia"
 SIA_lion_of_asia_desc: "After the Great Asian War, Thailand was one of the countries to recover the fastest. Reverse-engineering great amounts of technological information on the supplies Japan provided Thailand with during the war lead to what many call the "Decade of Thailand": The country's ascension to one of the greatest exporters of technology in Asia, combined with the soaring economy that was developed. Many people can say it with confidence and pride that Thailand became what she was destined to be. A free, democratic and prosperous economic giant of Asia... at least for the moment."
