l_english:
 ANM_PEACE_POPUP_FLAVOR_BIS: "Life is neither good or evil, but only a place for good and evil."
 ANM_PEACE_POPUP_FLAVOR_BRG: "To live is to suffer, to survive is to find some meaning in the suffering."
 TNO_PEACE_POPUP_TITLE: "DIPLOMATIC ALERT"
 TNO_PEACE_POPUP_DESCRIPTION: "[GetWarStatus]"
 TNO_PEACE_POPUP_FLAVOR: "[GetFlavor]"

 TNO_PEACE_POPUP_CLOSE: "CLOSE"

 TNO_PEACE_POPUP_COUNTRY_PLURAL: " and their allies "
 TNO_PEACE_POPUP_COUNTRY_SINGULAR: " "

 TNO_PEACE_POPUP_COUNTRY_PLURAL_HAS: " and their allies have "
 TNO_PEACE_POPUP_COUNTRY_SINGULAR_HAS: " has "

 #TNO_PEACE_POPUP_WINNER_FACTION_LEADER: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§!"
 #TNO_PEACE_POPUP_WINNER_NOT_FACTION_LEADER: "As part of §Y[winning_country.GetFactionName]§!, [winning_country.GetFlag] §Y[winning_country.GetNameDef]§!, "
#
 #TNO_PEACE_POPUP_LOSER_FACTION_LEADER: "[losing_country.GetFlag] §Y[losing_country.GetNameDef]§!"
 #TNO_PEACE_POPUP_LOSER_NOT_FACTION_LEADER: "[losing_country.GetFlag] §Y[losing_country.GetNameDef]§!, as part of §Y[losing_country.GetFactionName]§!,"

 #Peace event/war loc
 TNO_PEACE_POPUP_WAR_CONCLUSION: "[GetWarConclusionLoc]"
 TNO_PEACE_POPUP_WAR_CONTINUING: "[GetWarContinuationLoc]"

 #Wars that have finished
 TNO_PEACE_POPUP_WAR_CONCLUSION_OSTLAND: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAlliesWithHas]defeated [losing_country.GetFlag] §Y[losing_country.GetNameDef]§![GetLoserAllies]as the battle for control of §YOstland§! rages on."
 
 TNO_PEACE_POPUP_WAR_CONCLUSION_SAF_WIN: "The §YSouth African War§! has come to a close, with [winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAllies]finally defeating [losing_country.GetFlag] §Y[losing_country.GetNameDef]§![GetLoserAllies]."
 TNO_PEACE_POPUP_WAR_CONCLUSION_SAF_LOSE: "The §YSouth African War§! has come to a close, with [winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAllies]finally defeating [losing_country.GetFlag] §Y[losing_country.GetNameDef]§![GetLoserAllies]."
 
 TNO_PEACE_POPUP_WAR_CONCLUSION_BRG_FRA: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAlliesWithHas]seized land from [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! in the chaos of §YThe German Civil War§!"

 TNO_PEACE_POPUP_WAR_CONCLUSION_GCW: "The delicate balance of power in §YThe German Civil War§! continues to shift as [winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAllies]conquers [losing_country.GetFlag] §Y[losing_country.GetNameDef]§![GetLoserAllies]"

 TNO_PEACE_POPUP_WAR_CONCLUSION_DEFAULT: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAlliesWithHas]defeated [losing_country.GetFlag] §Y[losing_country.GetNameDef]§![GetLoserAllies]in a war."
 
 TNO_PEACE_POPUP_WAR_IBERIAN_WARS: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAlliesWithHas]defeated [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! as the §YIberian Wars§! rage on."
 
 TNO_PEACE_POPUP_WAR_CONCLUSION_AMERICAN_POLICING: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§![GetWinnerAlliesWithHas]defeated [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! in an §YAmerican policing action§!."

 TNO_PEACE_POPUP_WAR_CONCLUSION_TURKISH_VICTORY: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§! has taken its claims from the [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! in a §Yborder skirmish§! in the aftermath of the bombing of the §YMalta Conference§!."

 TNO_PEACE_POPUP_WAR_CONCLUSION_IME_VICTORY: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§! has halted the assault from [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! in a §Yborder skirmish§! in the aftermath of the bombing of the §YMalta Conference§!."

 TNO_PEACE_POPUP_WAR_CONCLUSION_GER_PLANZEROWIN: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§! has placed its vice-like grip back on [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! after they daringly escaped."

 TNO_PEACE_POPUP_WAR_SCOTLAND_WIN: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§! have conquered [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! and have inherited the Isle."

 #Capitulation (war continuing) events
 
 TNO_PEACE_POPUP_WAR_CONTINUING_DEFAULT: "[winning_country.GetFlag] §Y[winning_country.GetNameDef]§! has defeated [losing_country.GetFlag] §Y[losing_country.GetNameDef]§! in an ongoing conflict."
 
 #Flavor loc
 
 TNO_PEACE_POPUP_FLAVOR_DEFAULT: "War is hell."

 #Germany flavor

 TNO_PEACE_POPUP_FLAVOR_BORMANN: "This earth is not a fairy-land, but a struggle for life."
 TNO_PEACE_POPUP_FLAVOR_SPEER: "History will show the trials to be necessary."
 TNO_PEACE_POPUP_FLAVOR_GOERING: "The victor will always be the judge, and the vanquished the accused."
 TNO_PEACE_POPUP_FLAVOR_HEYDRICH: "The world is just a barrel-organ which the Lord God turns Himself. We all have to dance to the tune which is already on the drum."
 TNO_PEACE_POPUP_FLAVOR_DSR: "Don't be afraid of death so much as an inadequate life."
 TNO_PEACE_POPUP_FLAVOR_SPEIDEL: "You have fought like lions and been led by donkeys."
 TNO_PEACE_POPUP_FLAVOR_SCHOERNER: "So we move lost through,\nThe gray no man's land.\nMaybe none of us will return\nBack in homeland."

 #Ostland flavor
 TNO_PEACE_POPUP_FLAVOR_KOVNER: "But what happens to a dream deferred?"
 TNO_PEACE_POPUP_FLAVOR_MEYER: "The caged bird cries no more."
 TNO_PEACE_POPUP_FLAVOR_OSTLAND: "The status quo lies destroyed."
 TNO_PEACE_POPUP_FLAVOR_JECKELN: "The sun sets on the SS."
 TNO_PEACE_POPUP_FLAVOR_VITUSKA: "A pauper's crown lies shattered."
 TNO_PEACE_POPUP_FLAVOR_DRECHSLER: "The talons have been clipped."


 #Mongolia flavor
 TNO_PEACE_POPUP_FLAVOR_MEN: "The Mongol nation, united."
 TNO_PEACE_POPUP_FLAVOR_MON: "Order has been restored to the steppe."
 TNO_PEACE_POPUP_FLAVOR_SVO_MEN: "Mongolia has been unified."

 #Western Insurrection
 TNO_PEACE_POPUP_FLAVOR_YUN_NPA: "The Mad Dog has been put down, and Order in the Southwest reigns once more."

 #GAW flavor
 TNO_PEACE_POPUP_FLAVOR_CHI_GAW: "As Japanese troops march through Shanghai, Beijing, and Nanjing, the hope of freedom is squashed. Japan has won the war against China, and consequently the eastern world as a whole."
 
 #BRG-BRT-FRA flavor
 TNO_PEACE_POPUP_FLAVOR_FRA: "A shadow falls over France."
 
 #Iberian Wars
 TNO_PEACE_POPUP_FLAVOR_SPR: "Hemos pasado!"
 TNO_PEACE_POPUP_FLAVOR_SPA: "What was born by the sword shall die by the sword."
 TNO_PEACE_POPUP_FLAVOR_SPS: "In the end the tablecloth was rent in wounds, And there did the blushing roses drop, On the caries of the worn tabletop."
 TNO_PEACE_POPUP_FLAVOR_CNT: "El sueño esta muerto."
 TNO_PEACE_POPUP_FLAVOR_CTL: "Catalunya siempre será libre en nuestros corazones."
 TNO_PEACE_POPUP_FLAVOR_IBR: "The tortured Union meets its end."
 TNO_PEACE_POPUP_FLAVOR_MOR: "Morocco fades into history once more."
 TNO_PEACE_POPUP_FLAVOR_BSQ: "Once more, the young defeat the old."
 TNO_PEACE_POPUP_FLAVOR_TBA: "The flame of youth burns out."
 TNO_PEACE_POPUP_FLAVOR_FSR: "Dona eis requiem."
 TNO_PEACE_POPUP_FLAVOR_GAL: "The pilgrim's road meets its end."
 TNO_PEACE_POPUP_FLAVOR_WAI: "Daddah's dream is toppled."
 TNO_PEACE_POPUP_FLAVOR_POR: "The Estado Novo meets its end."
 TNO_PEACE_POPUP_FLAVOR_RPP: "The carnation withers."
 TNO_PEACE_POPUP_FLAVOR_PRT: "Porto finds peace once more."
 TNO_PEACE_POPUP_FLAVOR_RIF: "History repeats itself."
 
 
 #American policing actions flavor
 TNO_PEACE_POPUP_FLAVOR_GUY: "Injustice anywhere is a threat to justice everywhere."
 TNO_PEACE_POPUP_FLAVOR_WIN: "The West Indies' house divided could not stand."

 #2nd Italo Turkish War
 TNO_PEACE_POPUP_FLAVOR_IME: "O, mia patria, sì bella e perduta!"
 TNO_PEACE_POPUP_FLAVOR_TUR: "Del Giordano le rive saluta, di Sionne le torri atterrate..."
 
 #SAF flavor
 TNO_PEACE_POPUP_FLAVOR_ANC: "The Pan-African dream lies defeated."
 TNO_PEACE_POPUP_FLAVOR_BOR: "The Boer state has been ended, but the conflict has not."
 TNO_PEACE_POPUP_FLAVOR_SAF: "The light of democracy has been extinguished in Africa."
 TNO_PEACE_POPUP_FLAVOR_ANG: "The airport of Africa could not stand up to the Americans in the air."
 TNO_PEACE_POPUP_FLAVOR_MZB: "So ends Hüttig's reign of terror."

 #War Plan 0 
 TNO_PEACE_POPUP_FLAVOR_CZE: "Though their bravery was commendable, Bohemia has once more fallen prey to the German Reich."
 TNO_PEACE_POPUP_FLAVOR_SLO: "Bratislava burns, and with it, the last bastion of a brighter future. There is no hope left for the people of Slovakia."
 TNO_PEACE_POPUP_FLAVOR_POL: "Though the men and woman of the Polish homeland fought with everything they had, Poland is lost. Perhaps this time forever."

 #UOB Flavour
 TNO_PEACE_POPUP_FLAVOR_SCO: "Towing in gallant fame, Scotland my mountain hame, High may your proud standards Gloriously wave."
 
 #Russia
 TNO_PEACE_POPUP_FLAVOR_WRS: "Only in death does duty end."
 TNO_PEACE_POPUP_FLAVOR_VOL: "Perhaps peace never had a chance in Russia."
 TNO_PEACE_POPUP_FLAVOR_NIK: "Pandora's box shall be forever closed."
 TNO_PEACE_POPUP_FLAVOR_GAY: "A faithful man shall abound with blessings."
 TNO_PEACE_POPUP_FLAVOR_KIR: "The eagle will never again cry."
 TNO_PEACE_POPUP_FLAVOR_MAR: "Russia is not kind to Dual Authorities."
 TNO_PEACE_POPUP_FLAVOR_SAM: "The traitors will never get to tell their side of the story."
 TNO_PEACE_POPUP_FLAVOR_CHU: "The war machines lie broken and scattered."
 TNO_PEACE_POPUP_FLAVOR_PRM: "There remains some justice in the Russian Anarchy."
 TNO_PEACE_POPUP_FLAVOR_TAR: "Freedom is a thing worth dying for."
 TNO_PEACE_POPUP_FLAVOR_BKR: "The muezzins sing no more."
 TNO_PEACE_POPUP_FLAVOR_VTY: "The doorway to Europe lies open - and with it comes the smell of war once more."
 TNO_PEACE_POPUP_FLAVOR_KST: "Shorn of its protectors, the neutral city has been thrown to the wolves."
 TNO_PEACE_POPUP_FLAVOR_DON: "Poland is lost once more."
 TNO_PEACE_POPUP_FLAVOR_ARL: "Chairman Onoprienko's experiment has ended in failure."
 TNO_PEACE_POPUP_FLAVOR_AKT: "Only embers remain in Aktau's furnaces."
 TNO_PEACE_POPUP_FLAVOR_KAZ: "The soldiers too will take strike action, they'll break ranks and fight no more..."
 TNO_PEACE_POPUP_FLAVOR_DER: "Indeed Allah is the most Forgiving, the Merciful!"
 TNO_PEACE_POPUP_FLAVOR_SEM: "The sweetest flower that ever grew is withered to the stalk."
 TNO_PEACE_POPUP_FLAVOR_KOK: "The Khan could not outride history."
 TNO_PEACE_POPUP_FLAVOR_VOR: "The damned souls no longer guard their Hell."
 TNO_PEACE_POPUP_FLAVOR_KOM: "Thieves and bandits cannot defeat an army."
 TNO_PEACE_POPUP_FLAVOR_TOB: "Old soldiers never die - they just fade away."
 TNO_PEACE_POPUP_FLAVOR_ISH: "A nation of iron, a land of tears."
 TNO_PEACE_POPUP_FLAVOR_OMS: "They would find peace in death."
 TNO_PEACE_POPUP_FLAVOR_UDM: "The merchants traded the rope on which they are now hanged."
 TNO_PEACE_POPUP_FLAVOR_FAV: "She smiled sadly, as she flew into the night."
 TNO_PEACE_POPUP_FLAVOR_PAV: "Not even a Falcon can fly against a storm."
 TNO_PEACE_POPUP_FLAVOR_ERS: "The Poet is dead, a slave to honor."
 TNO_PEACE_POPUP_FLAVOR_KHA: "And onwards ran the River of Anarchy."
 TNO_PEACE_POPUP_FLAVOR_SAH: "Andreev's mutiny ended as it began."
 TNO_PEACE_POPUP_FLAVOR_KEM: "The mad king's reign is over."
 TNO_PEACE_POPUP_FLAVOR_ALT: "The calls for tradition have been deafened by the drums of war."
 TNO_PEACE_POPUP_FLAVOR_SVO: "Their last thoughts were of home, and the people they had loved."
 TNO_PEACE_POPUP_FLAVOR_IRK: "In the face of pain there are no heroes."
 TNO_PEACE_POPUP_FLAVOR_BRY: "To the madness of daring, we chant a song."
 TNO_PEACE_POPUP_FLAVOR_SEV: "Lost souls have finally found their rest."
 TNO_PEACE_POPUP_FLAVOR_YAK: "Their diamonds shine bright no more."
 TNO_PEACE_POPUP_FLAVOR_WCH: "There is no middle ground; the Russian Tsar should reign, or perish."
 TNO_PEACE_POPUP_FLAVOR_AMR: "Ignited by a tragedy, the Fascists of Russia perished in a farce."
 TNO_PEACE_POPUP_FLAVOR_MAG: "The best laid plans of mice and men often go awry."
 TNO_PEACE_POPUP_FLAVOR_KMC: "Their sorrow scattered to the heartless sea."
 TNO_PEACE_POPUP_FLAVOR_OMO: "He will wipe away every tear from their eyes, and death shall be no more."

 #After Midnight
 TNO_PEACE_POPUP_FLAVOR_WRS_AM: "Through the graves the wind is blowing."
 TNO_PEACE_POPUP_FLAVOR_VOL_AM: "The enslaved were not bricks in your road, and their lives were not chapters in your redemptive history."
 TNO_PEACE_POPUP_FLAVOR_NIK_AM: "The Regent's abomination passes into the night."
 TNO_PEACE_POPUP_FLAVOR_MAR_AM: "The Pale Horse rides no more."
 TNO_PEACE_POPUP_FLAVOR_SAM_AM: "Thou hast made us for thyself, O Lord, and our heart is restless until it finds its rest in thee."
 TNO_PEACE_POPUP_FLAVOR_MIR_AM: "Poland has died for a third time, choking on its own blood."
 TNO_PEACE_POPUP_FLAVOR_TAR_AM: "Pressing close, our enemies bellicose, unsleeping, Aim to make us feeble, if our name is scorned, if our fame is shamed, What defines us as a people?"
 TNO_PEACE_POPUP_FLAVOR_ORE_AM: "The end may justify the means as long as there is something that justifies the end."
 TNO_PEACE_POPUP_FLAVOR_URL_AM: "Sing your death song and die like a hero going home."
 TNO_PEACE_POPUP_FLAVOR_BAS_AM: "The light of progress in Russia has gone out."
 TNO_PEACE_POPUP_FLAVOR_AKT_AM: "The Mad Dog put down."
 TNO_PEACE_POPUP_FLAVOR_KOK_AM: "A man cries over the loss of his wife until she is buried. A man cries over the loss of his Motherland until he is buried."
 TNO_PEACE_POPUP_FLAVOR_KOM_AM: "The hand of Fate has ripped them from the sky."
 TNO_PEACE_POPUP_FLAVOR_TOB_AM: "What remains in diseases after the crisis is apt to produce relapses."
 TNO_PEACE_POPUP_FLAVOR_OMS_AM: "Confounded, though immortal. But his doom, reserved him to more wrath; for now the thought both of lost happiness and lasting pain torments him."
 TNO_PEACE_POPUP_FLAVOR_FAV_AM: "They would cry out for freedom no more."
 TNO_PEACE_POPUP_FLAVOR_PAV_AM: "The new republic, built on hope, has been strangled in its cradle."
 TNO_PEACE_POPUP_FLAVOR_ERS_AM: "We must never forget that art is not a form of propaganda; it is a form of truth."
 TNO_PEACE_POPUP_FLAVOR_KHA_AM: "They died free. There is no better end."
 TNO_PEACE_POPUP_FLAVOR_SAH_AM: "You cannot buy the revolution. You cannot make the revolution. You can only be the revolution. It is in your spirit, or it is nowhere."
 TNO_PEACE_POPUP_FLAVOR_ALT_AM: "Rurik's line has been swept away, never to be seen again."
 TNO_PEACE_POPUP_FLAVOR_IRK_AM: "Alexei has passed forever beyond our grasp."
 TNO_PEACE_POPUP_FLAVOR_BRY_AM: "Another king joins the ghostly ranks of Russian nobility."
 TNO_PEACE_POPUP_FLAVOR_AMR_AM: "No good deed goes unpunished."
 TNO_PEACE_POPUP_FLAVOR_MAG_AM: "The rivers of wealth have been replaced with blood."
 TNO_PEACE_POPUP_FLAVOR_KMC_AM: "No one was coming to save them."