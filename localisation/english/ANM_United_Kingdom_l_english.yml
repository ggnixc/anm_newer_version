 #STARTING SPIRITS#
 ENG_slug: "The Slug of European Economics"
 ENG_slug_desc: "The Social Credit system, though may enjoy its rapturous praises sung to the heavens by the British People's Party is a system that does irreparable damage to the British economy.  Booming industry that once led the globe has decayed, leaving the cities of the North from remnants of their Industrial glory.\n\nAs for its agricultural policies,  they have seen limited success. Though Britain competes against the major European agricultural producers, it crawls behind the behemoths of Germany and the USSR. Those in the country are forced into low paying, agricultural jobs, subsidised by weak government loans.\n\nAs for how the system has continued? Grease is the answer,  grease that has flowed from the top of society within the United Kingdom to lather all beneath. Innovation of the Social credit system is suppressed, and the system from Wallop to Tracy has dragged on, dragging its dogged people with it."
 ENG_ministry_shadow: "Shadows of the Ministry"
 ENG_ministry_shadow_desc: "To believe all this started with the English Ministry, a small collection of like minded aristocrats, philosophers and agriculturists practically boggles the mind. Gerard Wallop's rise to prominence enshrined the group and its ideology into the soul of the nation against the predictions of all sane men.\n\nThough Social Credit started as an ideology, it has become almost a cult within the psyche of the nation. The Greenshirts expanded massively to be nationally encompassing, both a boy scouts and party militia in one. The vitality and heritage of the land is rigged into both education and culture, the country has bloomed while the cities have rotted.\n\nAs for the party that has driven the Social Credit movement, the BPP has remained firm in its fervour. Politics blended with a cult of personality towards the ideology with its advancement the core of all policies. Politicians driven to demonstrate loyalty rather than skill, and ideologues pushed to the front of politics."
