 ## Descriptions ##
 # Country Leaders #
 POLITICS_MARLIN_HANBURY_TRACY_DESC: "Britain, once the conqueror of the globe, one foot on Cairo and the other on the Cape, has been left a bloated corpse out in the sun. Its architect, a man who still lives in the Britain of long ago, sits upon his ivory tower, the spires of which obscure his view of those crawling hand and foot below.\n\nAs a young man his ferocity was unmatched, a passionate defender of his nation's history and culture. This would lead Tracy to become Gerard Wallop's Ace in the House of Lords, decimating arguments with poise and precision. But time has left him, much like Britain, to rot.\n\nWhen Gerard Wallop retired, though few would admit it, only one man was to fit the role. Though others would try, in 1988 Tracy would finally succeed his mentor, what was to the Sudeley family their greatest historical triumph turned to dirt in their mouths.\n\nTracy's premiership has been marked by unrest, his speeches turning to the ramblings of an aging man who neither controls his words, nor his cabinet. Though able to command the ideology of Wallop effectively, his orthodoxy has allowed it to decay. Perhaps he is unwilling to reform, or simply doesn't know how.\n\nAs one man sneers with imperial majesty upon a nation reduced to farmers, beggars and thieves, others whisper as Tracy engrosses himself in theory while history surges forward around him. For Merlin Hanbury Tracy, he must embrace the change of the coming era, or risk himself becoming confined to the pages of history himself."
 POLITICS_NEIL_HAMILTON_DESC: "What does it means for a man to live a lie? To rise every morning, the day’s falsehoods already pre-rehearsed, coming instinctively, felt as deeply as honest men feel the truth? A maddening prospect for most, a black hole waiting to devour their souls. At the precipice, most would step back. Neill Hamilton has jumped in with both feet.\n\nAfter years in proximity to power in Britain, Hamilton has used every trick of the trade; brown envelopes for greasy palms, jobs for the boys, perks for his supporters, and nothing for the rest. He has lived his life with a certain look in the eye, and an easy smile - and now as those who blundered to trust him turn their backs, he gets his chance to put the knife in. Up until now, he has painted himself as the man-of-the-people, the only man at the helm fighting to transform Social Credit into a true engine of national rejuvenation.\n\nAs his premiership matures, day by day, week by week, the mask slips just a little bit more, the effort of pretense more half-hearted, the same old lie repeated with a little less enthusiasm. As slick young professionals flock to rally around their champion of the ‘middle classes’, nesting in the rejuvenated City of London, all begin to realise the truth; Hamilton has transformed Britain into an economic engine, roaring back into life, not for the sake of the country, but for the sake of himself and his dear friends. As the fallen mask lies shattered on the floor, the nation looks into the eyes of Neil Hamilton, and see only an empty vessel, ever-hungry for the day when it shall feel filled and content - a day they know shall never come."
 POLITICS_NIKOLAI_TOLSTOY_DESC: "“The Aristocrat of Aristocrats”, “The Shadow Monarch”, “The Royal Hand”, these titles all befell Tolstoy from his start of his career at the British People’s Party, his powerful speeches to the elitist party awarded the Royalist a massive influence over the party, and slowly started planting his ideas of a kingdom straight out of 17th century Russia, which now engulfs his entire party in a smoke that has seemingly no end in sight. The one part of the party that has not been entirely engulfed is the Germanophile Dogs - those who hold a secret hatred of the White Russian and are squeamish of a Britain centuries outdated, now slowly being relegated to the backwaters of the "British" Peoples Party.\n\nThe weight of his titles, achievements, and the wide networks that Tolstoy once used to control the party now no longer weigh on the “Grim-White Hand”, as his own ideals are now forced onto a nation which once ruled “An Empire on which the Sun never set”, with his former position of Deputy Prime Minister, and his more obvious, yet unofficial, title as “Head of Propaganda”, his “Great Game” lies within instilling his ideas into the Party and Populace, while keeping the more knowledgeable ones at bay and the Germans appeased. Whatever the outcome, many outside of Britain argue that he could have had a worse fate, but with Britain slugging into the New Millennium, the British people, who have endured hardship since the dawn of the New Order, fear a phrase that once brought pride for 500 years:\n\n“God Save the King!”"
 # Cabinet Members #
 ENG_Gregory_Lauder_Frost_hog_desc: "Beneath the rim of his brandy glass, two cold uncaring eyes bore into his colleagues. Whether in the glamor and style of Aristocratic dining rooms, or the shadowed Halls of Parliament, he wears a mask of fake smiles and carries a dictionary of fake compliments.\n\nNicholas Lauder Frost did not aspire to high office but knew it was his right. From the moment his father first took him to Westminster, to the day he tightly smiled and shook Tracy's hand. With a single loose handshake, Frost knew the machinations of politics required something fresh, a jolt to an ideology left in the mud.\n\nAnd so Lauder Frost has made himself the Revolutionary of a new ideal, a new Social Credit, one truly loyal to the sharpness of its founder. The right hands have been shaken, the backs slapped and calves whipped. The stove has been lit, now Frost tends to it with a gentle poker. One push too soft may sputter it out, one too harsh risks setting not just the stove, but himself, and all those around him ablaze."
 ENG_Neil_Hamilton_eco_desc: "To characterize Neil Hamilton would be near impossible, an aspiring Aristocrat perhaps, a sharp speaker, a con man of the highest regard, an ideologue and visionary, or a clown elevated far beyond his station. But in truth he is a man deeply underestimated, long considered too ridiculous for public office, Hamilton has transformed those laughs, into cheers as time and time again, he charms his way forward.\n\nThough originally a youth leader in the People's Boy Scouts, Hamilton, through years of work for the institution of the BPP, soon found himself selected for office as an MP. Within that role, his flair for the theatrics, shocking displays, and his willingness to connect with the common man would win the hearts and minds of many in Britain. It would be precisely that charisma that would carry him into the cold embrace of the Tracy government.\n\nHamilton is not the smartest man in parliament, nor is he the bravest, but he is the most unpredictable. Where his career will go after Tracy’s premiership is anyone’s guess. With a smirk and a wink, Hamilton continues to hold his cards so close to his chest, that no one else at the table realizes he holds them at all."
 ENG_Jane_Birdwood_for_desc: "To believe in Social Credit is to live in a immortal echo chamber of ego, indulgence, fortitude and denial - for a woman as talented and experienced as Lady Jane Birdwood these come naturally. A peer of Gerard Wallop himself, hers has been a transformation from an admittedly reluctant member of its vanguard, ushering in its birth, to singing its praises - even as those praises struggle to be heard above the cacophony of shouts, swears and screams that have defined its history.\n\nThough becoming Prime Minister herself in the late 1980s, many believed her resignation, born of a slew of slimy, half baked rumours would be the final end of her career - Birdwood has shown them differently. A woman as mired in the movement as has ever been seen - being there from its birth, and who follow it to its inevitable end.\n\nYet she is aging, her weakening grasp of subjects of policy, obstinate  immovability on reform and hostility to progress represent the Tracy Ministry’s most treacherous flaws. For now the age old institutions of government my act as a palliative for these obvious flaws, but as the Winds of Changes sweep the country, many feel Birdwood and her ilk will be flung to the wind alongside them."
 ENG_John_Skeffington_sec_desc: "Through the drudgery of meetings, endless ideological debates, and the slurred shouting matches over purity, in truth politics on Tracy's Britain has become a great hunt, perpetuated by the enthusiasm its participants have for this great game. For John Skeffington, he could only wish to be mounted on horseback again, shooter in hand, alongside a jolly collection of the old Eton Rifles.\n\nIn politics, a topic is sized up, you track its scent, learn the intimacies of its territory and custom. Then, quiet as a whisper, and usually most cautiously - you follow the trail. The party is gathered, and the pursuit begins; some pursue for its head, others for the loins, and those best taught? Simply for the love of the game. \n\nIn the malaise of it all, keeping ones’ instincts true to oneself is absolute key. All the books of Keynes, or Walpole or Smith can tell only so much as how to enter the game, but never how to win it. Through a decade of politics John Skeffington has seen politics in its truest, rawest form and knows when to leave and when to pursue.\n\nFor when one finds himself in the bush, rifle in hand, to quiver and whimper is to lose - to be mocked. To settle your grip, stand fast and take aim, to taste the sweet smell of gunsmoke - that is to taste the spoils of victory."
 

