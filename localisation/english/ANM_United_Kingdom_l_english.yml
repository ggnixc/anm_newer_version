 WORLD.18199.t: "Standoff in the North Sea"
 WORLD.18199.desc: "To those following recent tensions between the United Kingdom and the Crown Dependency of the Shetlands, the degree of escalation between the two has reached historic levels. The decades of tit-for-tat encounters between the two contenders is taking a turn for worse with reports indicating a small flotilla from the Canadian Royal Navy has been encircled by the British one.\n\nThe reasoning has almost singularly been due to the United Kingdom's ongoing claim to the entirety of the Shetlands and their surrounding waters. After withstanding a bullish campaign of British harassment against Shetland fishing vessels and oil-rigs, recent weeks have seen a particularly dogged campaign by the Canadians to stand ground against the British state policy of maritime aggression.\n\nWhile negotiations between the two sides are still ongoing, there has been an increase in sightings of Kriegsmarine ships nearby."
 WORLD.18199.a: "Troubling."

