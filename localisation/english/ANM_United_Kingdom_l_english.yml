ENG_Laws_Abolished_Parliament_Act_desc:0 "One of the most important pieces of legislation in British history, the §OParliament Act 1911§! was introduced following the §sHouse of Lords§!' rejection of the §YLiberal§! government's "§xPeople's Budget§!" in 1909. Passed following two confirmatory general elections in 1910, it established the dominance of the §OHouse of Commons§! over the §sHouse of Lords§!, effectively removing the power of the Lords to block government legislation.\n\nFollowing the fall of the §eEmpire§! at the hands of the §rMaster of Europe§!, the §sBritish People's Party§! would repeal the act, allowing the unelected aristocracy to regain their "birthright" control over government policy, irrevocably rearranging the balance of power in Westminster.\n\nIn this new age of §Ufascist ideologues§! and §topportunistic collaborators§!, one wonders what barriers the "will of the people" in the §OCommons§! will face with the newly-restored influence of the §sPeers§!."
ENG_Laws_BPP_Constitution_desc:0 "Founded following the German liberation of Britain, the British People's Party is the sole legal political party allowed to operate in the United Kingdom. The party constitution transforms the state into a benevolent apparatus that acts as the sole custodian of both the welfare and right to life of the British people, in order to properly protect them from the threats posed by usury, speculation, and their ilk. In practice, this provides dictatorial power to the government alongside the ability to punish and kill political opponents at will."
ENG_Laws_Renounced_War_desc:0 "How the mighty have fallen. With the twin humiliations posed by defeat in the Second World War and the crippling loss of the empire, it is clear that Britannia no longer rules the waves - or indeed, much of anything. The nation's days of conquest are well and truly over. Now that the British Isles find themselves sandwiched between two superpowers at opposite sides of the Atlantic, it is unilaterally agreed that the nation will only ever take to the fields of battle in self-defence - or to come to the aid of an ally."
ENG_Laws_Conlcuded_Deportations_desc:0 "It is well-known that the subjects of the Reich must join their master in subjugating and deporting those considered 'untermensch' - and Britain is no exception. Under the watch of several successive ministries, the Isles are now almost - if not entirely - free from what the Germans consider to be impure, with the precious few that remain or have not yet fled live a fearful existence - eking out a living in the quiet corners of society, hoping that the government will not return to finish the job."
ENG_Laws_Speculation_Ban_desc:0 "The hoarding of land for the sake of one's own enrichment against the nation's common good is considered one of the seminal crimes against morality in BPP doctrine, and is often seen as the most widespread of all of global finance's crimes. It is only by the will of the state that this wretched flower has been prevented from taking bloom across the nation. With land speculation illegalised, a homeowner cannot legally own any more than one property - unless they have proven residency for up to four months in any other dwelling. It is through this that nobody can grow fat and selfish merely through owning land."
ENG_Laws_Monopoly_Ban_desc:0 "Global usury and finance often finds itself a comfortable home in large conglomerates and firms - in those glittering towers and smoke-filled rooms, the great spiders in the web of degeneracy plot away. Ergo, the government has taken steps to prevent such a monopoly forming in Britain. A series of harsh antitrust laws applying to the morally bankrupt corporations and firms that dwell in both the East and West prevent them spreading their bile here - and all the while, encouraging investment and cooperation from our friends in the Pakt in their place."
ENG_Laws_Partified_Civil_Service_desc:0 "During the early days of the BPP regime, it was ruled that all members of the civil service must hold BPP membership. What started as a simple bureaucratic trick designed to help solidify the new party's power quickly grew into one of the regime's greatest assets; compromises of interest, funnelling of electoral patronage, and the knowledge that the bureaucracy will loyally go along with whatever is asked of it has helped many a government work its way through a crisis, and it will doubtlessly continue to do so unless something was changed."
ENG_Laws_National_Purity_Act_desc:0 "To safeguard the youth of our isle from danger more insidious than any Resistance bomb, the National Purity Act decrees that possession of any “anti-British” materials is hereby prohibited by law, and punishable by either severe fines or in extreme cases, prison sentences. The definition of anti-British materials can vary considerably in nature, ranging from possessing Marxist literature to listening to American songs on the radio. What is consistent, however, are provisions stating that any such materials must be turned in to the authorities immediately, and those who consume them should be reported at once."
ENG_Laws_The_Imperial_State_desc:0 "The trappings of the old Britain remain, covering Parliament and the people she governs and shielding them from our vision. This will be rectified. Holes are already being cut in the broken remnants of our fallen empire to clear the way for a grand reformation into a new and perfect empire. One indivisible, unconquerable and fascist Imperial State."
ENG_Laws_NHS_Early_desc:0 "In order to carry out the duties of the Minister of Health to promote a culture of health and sanitation, a national, governmental body will be set up to make fit the lives of the citizens of England, Scotland and Wales. This body's purpose, amongst others, is to primarily improve the prevention, diagnosis and suppression of illnesses, diseases and epidemics. In it, and the Minister of Health's duties', the service will provide the proper provisions necessary to care for the sick and injured citizens of the United Kingdom of Great Britain."
ENG_Laws_The_Workplace_Organisations_Act_desc:0 "Of the many evils of Bolshevism, few are so vile as the means by which they corrupt unions to turn a worker against his own nation. To ward against such treachery from within, the unions of Britain shall commence the process of reorganization into a collective administration.\n\nSuch a process cannot be done overnight of course. To this end, the government has taken steps to add additional supervisory roles to each union, and establish further regulations around union activity. On top of this, a number of government liaisons shall be established between the different unions of Britain to ensure a harmonious and most importantly loyal leadership."


### Events ###
 ## Flavour ##
 ENG_flavour_event.1.t: "Dusty Shelves"
 ENG_flavour_event.1.desc: "Claire sighed, feeling her eyelids droop as she stole another glance at the two ticking hands on her wrist. The gloomy morning mist had never quite cleared, and the single streetlight that still managed to shine could only flicker every few seconds before giving up once again. Another gloomy Manchester morning.\n     The line to get into Fagen’s Grocery stretched all the way around the block, and, as usual, was inching along at a snail’s pace. For the love of Christ. Couldn’t these people move any faster? There wasn’t much time before her sister would be leaving for work, and if she wasn’t back with the formula by then, there’d be hell to pay.\n     A bell chimed. Two people — a young couple who looked to be in their early thirties — rushed out of the little corner store, dragging their crying son behind them. Dad carried two bags in his arms. Only one was filled, and not by much. Claire sighed. Better to cling to false hope than be eaten alive by despair like everyone else.\n\nShuffling forward another pace, Claire glanced down at the stained booklet in her hand. She half-heartedly flicked through the worn-out pages. Bacon. Eggs. Fat. Meat. Cheese. Bacon. Eggs. Fat. Meat. Cheese. All stamped over. One page left. One more week to go—\n     Another chime. “Err, sorry, everyone...” spoke the familiar, gruff voice of old Mr. Fagen himself. He stood outside the door, an awkward look on his face as he addressed the winding queue. “If you’re here looking for formula, we’re fresh out,” he said, scratching his neck, “Next shipment should be here sometime before next Thursday.”\n     A rumbling murmur traced the length of the line. Some shook their heads, turning to leave. Some shouted curses at Mr. Fagen, at the local MP, at Almighty God himself. Claire was one of them. She clenched her teeth, hot-footing it toward the store across town, but stumbled to a halt at the harsh crash that sounded behind her.\n     The window of Fagen’s Grocery was completely shattered. Several men charged the door, and Claire was forced forward by the screaming mob behind her. She’d never forget the desperate rage that dripped from their voices."
 ENG_flavour_event.1.a: "“What the hell are we supposed to do, then?! Let my baby go hungry?!”"
 ENG_flavour_event.2.t: "Lay Down the Law and Break It"
 ENG_flavour_event.2.desc: "A pair of shadeless light bulbs bathed Josie’s studio flat in stale, off-yellow light. The forty-something fidgeted in her seat, eyes fixed on the common housefly buzzing through. The insect rested for a moment on the smoke-stained wallpaper, briefly digged the place, then continued on its way.\n     A pair of cops sat across her on a ragged-looking sofa. It wasn’t in the greatest shape — the leather was worn down on both cushions, the armrests sort of smelled, and the frame made a grating creak every time anyone so much as reached for the remote — but the free sidewalk-sofa was still a step up from sitting on the floor. \n\n     “My name is Albert,” said one of the two officers, politely removing his cap. “My friend here is David.”\n     Josie nodded, twisting up her shirt. “O-Okay...”\n     “We wanted to express our concern about the crowd your son Tom has been associating with. He works for the Birmingham Machine Company, doesn’t he?”\n     “He changes jobs frequently,” Josie breathed. Her posture was no less rigid as she glanced at a photo of herself and a young boy on the wall behind her. “He said something like that in his last letter.”\n     “Ma’am, are you familiar with the ‘Independent Union’ movement?”\n     “I…y-yes. I’ve heard of it—”\n     The other cop, David, sat forward, a stern look chiseled onto his face. “And you’re aware of the severe consequences that come with associating with those types of groups, yes? You understand what would happen if Tom were to be caught attending their meetings?”\n\nJosie swallowed, but nothing but warm air managed to squeeze its way down her parched throat. She eyed the pack of cigarettes on the table. “Listen. I’ll tell him not to go anymore, okay? You have to believe me — he’s just a kid. A good kid. Young, stupid, fresh out of school. He doesn’t understand—”\n     David held up a well-calloused hand. “Tell him that the Ministry of Internal Security is willing to forgive him — and you — if he cooperates. I’m sure I don’t need to go into more detail...?”\n     Albert shot David a nasty look as Josie’s body shrank in on itself. “Christ, David. That’s enough. She gets it,” he said, shaking his head. His palms cupped his knees as he looked again at Josie. “We just want what is best for everyone, ma’am.”"
 ENG_flavour_event.2.a: "“We work in the interest of the public order.”"
 ENG_flavour_event.3.t: "The Humiliation Ritual"
 ENG_flavour_event.3.desc: "The sun hid behind a cloudy morning sky, and the rain streaks marking the edifice of H.M.P Portland coalesced into a single shade of matte gray. Standing amidst the miserable scene, a half-dozen boys, the eldest almost a man, the youngest perhaps half that age. All stood stark and stone-faced, save for the youngest, whose eyes were red with tears.\n     The eldest boy looked at the warder attending them through blackened, contemptuous eyes. Two days prior, he had spit into the face of a guard in the heat of the moment, and this punishment was but one of many that had been heaped onto him over the past 48 hours.\n     He and the other troublemakers would stand there, beside the bed of oleanders, from the break of dawn until someone saw fit to march them off back to their cells. Such punishments were ubiquitous across Britain's borstals and orphanages, and it didn’t take a great deal of provocation to end up on the receiving end; refusing meals, 'rank cheek', or even a dirty look directed at the wrong guard was liable to see you dragged from your bed and subjected to whatever novel terror the prison faculty had concocted on a whim.\n\nBy lunchtime, the youngest boy had stopped crying, though not for lack of trying — his eyes were simply too raw. His body heaved with each strained sob. The sound was sickening, but for all the boy’s wordless cries of misery, no words of comfort came his way. By the evening, even he stood stone-faced and silent, too exhausted to do anything else.\n     At last, with the sun almost setting, the superintendent walked down the rain-slicked steps. He nodded to the boys' attendant warder, and, one-by-one, they were marched up the stairs. As the youngest passed him, the superintendent halted him bodily,  “Wells—”, he said, wearing a look that could turn water to ice,"
 ENG_flavour_event.3.a: "“You wet the bed again.”"
 ENG_flavour_event.4.t: "Operation Engineer"
 ENG_flavour_event.4.desc: "Pitch-black smoke, swirling in great, pulsing columns, stained the skies of Liverpool.\n     Nowhere else in the country was the contempt for the Regime more potent. Liverpool remembered the closures. They remembered the lay-offs, the depressions and repressions, and worst of all, they remembered Hillsborough — that dark day in April when the pigs had slaughtered them by the hundreds. Like they were animals.\n     For months now, the tensions had merely simmered, but last week’s announcement of even stricter rationing had been the final straw. Idle youth swarmed the streets by the thousands, and any attempts by the police to suppress them had been met with savage volleys of bricks and petrol bombs. The bridges across the Mersey were locked down, and whole swaths of the city were written off as 'No-Go Zones'. By lunchtime, the army was en route.\n     Dispatched at dawn, the troops entered Everton, passing a Prince Rupert's Tower desecrated with crude graffiti — “FEED THE SCOUSERS”, “FREE EVERTON”, “NO GODS, NO KINGS”.\n\nTurning up Hamilton Road, the convoy was forced to a halt. Half a dozen young men stood atop a barricade. For a heartbeat, they simply stared, indignant eyes regarding the fleet of armored cars sputtering to a halt before them.\n     A white flare streaked the sky, and all at once, the youth smashed dented bin-lids upon the ground. The cacophony could be heard for miles. A light switched on in a window one block over. Ten more followed, then one-hundred, then one-thousand. In the blink of an eye, the whole neighborhood was stirring from their beds, a veritable flood of people pouring from behind every door. They clutched guns, knives, and white-hot pokers, joining the barricade’s sentries by the thousands.\n     The army held firm, determined. They doused the barricades with tear gas, and at first, the irregulars shrank away — but it wasn’t long before the ferocious tide surged forward, hungry voices trembling with rage. Hundreds would never know whether the battle had been fought in vain."
 ENG_flavour_event.4.a: "£music_note A world become one of salads and sun — Only a fool would say that. £music_note "
