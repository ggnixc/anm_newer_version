 #LEADER DESCRIPTIONS# 
 POLITICS_MERLIN_TRACY_DESC: "If the Kingdom of Great Britain is a ship, Tracy has been proven to be a captain of a ship at half mast, half blown apart by enemy cannons and shredded by the waves of time, with half his crew whispering of mutiny under his helm, that pretends, despite all this to be the jewel of the ocean, conquering the waves for God and King. \n\nTracey’s rise to the top of the BPP can only be described as one of a captain riding the clashing waves of British Politics. Inheriting his peerage from his father at Age 2, Tracy would take his seat as the British ship crashed into the rocks, the Premiership of John Moore Brazbon, rocked with incompetence would see the end to a unsteady period of tranquility that it has seen under his predecessors. The subsequent English Civil War would see Tracy make his name for the first time, arguing for fierce retribution against the rebels and acting as the a fierce prosecutor over many of the cases. His vitriol and harsh justice would owe him murmurs of approval amongst the Lords, and spits of disgust among the common man. He would ride the waves of change in subsequent governments, acting with vigour in the Maudling government and the short lived governments of the 1970s, until eventually finding himself elevated to Home Secretary under Clark. \n\nA keen supporter of the Parliamentary Act of 1947, Tracy’s career has been one of the utmost orthodox of the party, though he may of bent for Clark, introducing key reforms as Home Secretary, with every reform came a setback, the Union Act of 1984, came with the Censorship Act of 1985. Every reform attempted by the government saw Tracy tugging at the ships wheel, allowing it to sail, but ensuring it was never flung off course. His ascent to Prime Minister would come after a power struggle, Tracy, unwilling to listen to the suggestions of his peers would create a cabinet stuffed with only the most trusted lapdogs, perfect to lay the grounds of Tracy’s vision, without forcing him to confront the growing waves that lay ahead. \n\nIn Tracy’s time in office, Britain would see itself after years of negotiations under Clark as an equal member in the Einheitspakt, with British Businesses emboldened and limited public support behind his party for the first time in decades. Tracy in all his eccentricities has never shifted, his policies shifting only to adapt to the growing world, but keeping the same authoritarian vigour, making it the dominant force in which all life in the Kingdom revolves around. King, Country and God are the only forces Tracy respects, far less than his fellow MPs."
 
