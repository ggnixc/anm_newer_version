 ## Descriptions ##
 # Country Leaders #
 POLITICS_MARLIN_HANBURY_TRACY_DESC: "Britain, once the conqueror of the globe, one foot on Cairo and the other on the Cape, has been left a bloated corpse out in the sun. Its architect, a man who still lives in the Britain of long ago, sits upon his ivory tower, the spires of which obscure his view of those crawling hand and foot below.\n\nAs a young man his ferocity was unmatched, a passionate defender of his nation's history and culture. This would lead Tracy to become Gerard Wallop's Ace in the House of Lords, decimating arguments with poise and precision. But time has left him, much like Britain, to rot.\n\nWhen Gerard Wallop retired, though few would admit it, only one man was to fit the role. Though others would try, in 1988 Tracy would finally succeed his mentor, what was to the Sudeley family their greatest historical triumph turned to dirt in their mouths.\n\nTracy's premiership has been marked by unrest, his speeches turning to the ramblings of an aging man who neither controls his words, nor his cabinet. Though able to command the ideology of Wallop effectively, his orthodoxy has allowed it to decay. Perhaps he is unwilling to reform, or simply doesn't know how.\n\nAs one man sneers with imperial majesty upon a nation reduced to farmers, beggars and thieves, others whisper as Tracy engrosses himself in theory while history surges forward around him. For Merlin Hanbury Tracy, he must embrace the change of the coming era, or risk himself becoming confined to the pages of history himself."
 # Cabinet Members #
 ENG_gregory_lauder_frost_desc: "Beneath the rim of his brandy glasses lay two cold, calculating, uncaring eyes. In the glamor and style of the Aristocratic halls, or the shadowed, tired, rooms of the House of Parliament, smiles a mask of politeness. Blending in with the eccentric Nobles through the use of forced laughter, and fet formalities.\n\nNicholas Lauder Frost did not aspire to high office, but he knew it was his right. From the moment his father first brought him to Westminster, to the day he smiled and shook Tracy’s hand. With a single handshake, Frost knew the machinations of politics needed something new, a jolt to the ideology left in the mud.\n\nAnd so Frost has made himself the Revolutionary of a new ideal, a new Social Credit, one truly loyal to the sharpness of its founder. The stove has been lit, now Frost tends to it with a gentle poker. He knows one push too soft may sputter it out, and one too harsh risks not just setting the stove, but himself ablaze."
 ENG_john_graeme_wood_desc: "From the maintenance of the British Union of Fascists’ Blackshirts, to the growth of the Greenshirts of the British People’s Party, few have been a member in the British Far Right longer than John Graeme Wood. A young man in the BUF, decades of experience have harnessed expertise that have become invaluable in terms of running the varied organizations under the thumb of the BPP.\n\nHolding a collection of key positions during the early years of the Party, Wood officially entered parliament in the last years of Gerard Wallop as an official advisor to the defense department. Since then he has only succeeded in masterfully expanding the department to encompass nearly all aspects of social life, with the Greenshirts becoming integral parts of the education system, tying education and defense into one. As for the parties Blackshirts, years of regimentation have allowed them to transform into a near perfect secret police in the seat of the failed MI6 and MI5, becoming figureheads for political transformation.\n\nAlongside this however Wood is one of Parliament's longest serving members. Though he has been near invaluable it is well known he is an old dog, hostile to change of any kind within the Social Credit system. Butting heads with any attempt at reform that will affect his well groomed department, to attempt to modernize defense is to fight an uphill battle, against a political giant of the last twenty years."
 ENG_neil_hamilton_desc: ""
 ENG_roger_scrunton_desc: "The government of Merlin Hanbury-Tracy has long been wracked with the theme of intellectualism over substance of character. This has mainly led to a government of inaction, left out to fester in the midday sun that is the turning century. Few represent this better than the ideology and career of Roger Scrunton, a novelist, scholar and journalist. Throughout his career Scrunton’s masterful dedication to the Social Credit cause has won him acclaim throughout Parliament.\n\nGraduating in philosophy, Scrunton’s mind would soon turn to the field of politics as in the Britain of Gerard Wallop they were common bedfellows. A core founding member of the Dining Groups that would embellish the growing Social Credit ideology. Scrunton would help in the development of the ideology nationally, publishing a variance of essays solidifying the system in the public conscience.\n\nScunton would be brought into office in the early days of the Tracy Administration. Very few could more ruthlessly defend the nation's spirit on the world stage than Scrunton. Since rising to office, his cold and merciless defense of the ideology to the Europakt may have won him little friends, but has won him the undying love of the Prime Minister."
 

