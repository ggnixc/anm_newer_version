 ENG_Legacy_Of_The_BPP: "Legacy of The BPP"
 ENG_Legacy_Of_The_BPP_desc: ""
 ENG_Growing_Disillusionment: "Growing Disillusionment"
 ENG_Growing_Disillusionment_desc: "The rule of the BPP has always depended on one thing, the same thing vital to its inception, the Parliamentary Act of 1947. This act, forced through commons in the wake of the devastation in the Second World War, would see the Party subsume all of British societal life. The Act, in short, greatly enlarged governmental authority, not just granting the Prime Minister and his cabinet the ability to push through bills without opposition, but also greatly expanding the powers of the House of Lords, granting them the ability to create their own bills, based on their own agenda. Much of the UK voting landscape was as well reshaped into new districts, councils and counties, formed solely out of a desire to maintain dominance in the greatly weakened electoral system. This Act, alongside the stipulations of the Treaty of Portsmouth would ensure that British democracy remained, but with only one party. \n\nThough this would change somewhat with the Political Expression Bill of 1965. The crowning achievement of Prime Minister Rab Butler, the Bill would allow the formation of new political parties to run against the BPP, heralded as revolutionary at the time, this Bill soon turned into sand as it quickly became evident as Butler stepped down and was swiftly replaced by his protege, Reginald Maudling, who won on a landslide against a slew of rigged, bribed and silenced political opposition. This ensured that among the British people one phrase was clear,'you can vote, but only for one party'. \n\nThis has only decreased in popularity the longer the government has maintained itself, criticised by those on the right and the left, and even more so inside the BPP itself from its own reformist wing. This has led to calls for a time of change, a reformation of the Act and even moreso, the Party itself."
 ENG_British_Malaise: "The British Malaise"
 ENG_British_Malaise_desc: "Every action has its equal and opposite reaction, this is never more certain in the case of Britain, whatever she does, she is watched. Though Britain may of been able to negotiate her independence from Germany over the past few decades, granting her far increased autonomy and self government, she is still tied to the chains that bound her. Germany dominates the British Market, saturating it heavily with German goods, products and business interests, Germany relies on British coal and steel and Britain relies on German goods and employment, a perfectly self destructionary relationship. Therefore the British economy is tied to that of Germany, and a slip up from the big brother, will conversely cause its sibling to stagnate spontaneously in response. \n\nThough Britain may have gained that independence, it has not come without a caveat. The Germans have relaxed their garrison presence over the years but though they’ve called off their dogs, those dogs have left a shit on our plate in their absence, the SS-GB. Technically a wing of our “Secret Services” the aim of the organisation is clear, monitoring, enforcing and maintenance of German racial laws, this includes the investigation of those with links to Jews, Communists and Reactionaries. In practice this group is a haven for the most radical followers of National Socialism and its offcuts to grow. The group monitors every aspect of life in the Isles and every person in it, one slip up, a wrong move, a badly placed joke, too deep a exploration into ones heritage and that person will see themselves on a surprise “sightseeing trip” to some of the most far flung parts of the German Reich. Let’s hope nothing unfortunate can ever happen there, for all they know Oświęcim is lovely this time of year. "
