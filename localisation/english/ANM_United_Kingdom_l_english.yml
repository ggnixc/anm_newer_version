### STARTING SPIRITS ###
 ENG_slug: "The Slug of European Economics"
 ENG_slug_desc: "The Social Credit system, though it may enjoy rapturous praises sung by the British People’s Party, has done irreparable damage to the British economy. Booming industry that once led the world, has decayed into something unrecognizable. This has affected the industrial cities of the North more than anything, leaving them husks of their former might.\n\nLuckily, the agricultural policies have proven to be slightly more fruitful than the industrial ones. Though Britain competes well with other European agricultural producers, they are still miles behind Germany and the USSR. Those who choose agriculture as a career path are forced into low paying jobs, subsidized by weak government loans.\n\nNow the question arises, how has such a system existed for so long? Grease is the answer, grease that has flown from the top of British society to lather all that exists below. There is no innovation of the Social Credit system, it has dragged on from Wallop to Tracy, dragging its dogged people behind it."
 ENG_ministry_shadow: "Shadows of the Ministry"
 ENG_ministry_shadow_desc: "To believe this all started with the English Ministry, a small collection of aristocrats, philosophers, and agriculturalists, boggles the mind. Gerard Wallop’s rise to prominence enshrined the group and its ideology into the very soul of the British nation, against the predictions of all sane men. \n\nThough Social Credit began as an ideology, it has slowly evolved into a cult within the psyche of the nation. The Greenshirts expanded massively to become nationally encompassing, both a Boy Scouts and a militia at the same time. The vitality and heritage of the land is rigged into both education and culture, the country has bloomed while the cities have rotted.\n\nAs for the party that has driven the Social Credit system forward, the BPP has remained firm in its fervor. Politics blended with a cult of personality towards the ideology, has led to it being present in almost every aspect of British life. Politicians are driven to demonstrate loyalty rather than skill, with ideologues pushed to the top of the government."
 ENG_better_bred: "Those Better Bred"
 ENG_better_bred_desc: "Those of higher breeding have ensured their dominance within the political system, as God himself intended. The days of the peasants in the Communist Party decimating our glorious nation’s culture, or the traitors of the Labour Party, are finally over. Now, the nation belongs to those who built it, the Lords and Ladies of the party.\n\nThe enshrinement of the House of Lords has leant the Aristocrats of the nation true influence. Being born to a noble family ensures that you will have an easy and fruitful career in politics. As such, many politicians of today are Lords themselves. The common man must know their place in this glorious country, the bottom."
 ENG_pariah: "Pakt Pariah"
 ENG_pariah_desc: "Though unofficial Europakt policy towards its Western European members has always been one of cooperation and negotiation, the United Kingdom has strained even Germania’s most forgiving. The United Kingdom's insistence on economic standouts from its ostracization to German MegaCorporations to its collapsing economic growth. Time and time again are Germania's advisors shunned, with bitter ambivalence from the ruling class of Britain to their attempted interference.\n\nIt is only the dedication to both the core tenets of National Socialist ideas and the New Order of Europe that the regime has survived. The United Kingdom has remained firmly dedicated to the maintenance of Fascism over Europe, even if she may disagree in how that Fascism is shaped.\n\nAs for Germany, the island remains a barb in her side. Its constant instability, sycophantic political system, and archaic ruling class are an infuriating drag on the future of the Europakt, stifling their aspirations for economic unity by the propping up of a decimated economy, ruining the potential of once one of their wealthiest allies. Britain and Germany may need one another for the future of Europe, but neither will bend first, nor show vulnerability in the face of either the greatest crisis."
 ENG_politt_name: "In Politt's Name"
 ENG_politt_name_desc: "The legacy of resistance has become one of death for the battered heroes of the many uprisings in the last fifty years. Consistently, even in the last days and weeks, the regime of the United Kingdom has clawed back her grip on the mantle of the Isles in one way or another. This has taken its toll on the strength of both its people and its resistance, with what was once a passive nation’s uniting goal becoming an increasingly desperate fight against the tide.\n\nThose who seek to resist the tide, turn to what has always been its fiercest warrior, the Union and Labour movements. Though these have become increasingly controlled by the state, with Unions outlawed for more than thirty years, the Unions of the nation have become informal, moving underground, from neighbor to neighbor. The dilapidated cities of the nation have become perfect festering grounds for the breeding of new devotees, those left out of work from government neglect, those hypnotized into a system of hate, or those just looking to fight.\n\nFor now the government's fiercest enemy has become the Revolutionary Communist Party of Britain. Espousing the ideological virtues of the original CPGB’s father, Harry Politt. Their street warriors battle the indoctrination of the nation's youth, uniting all and any under the Red Banner. Whether this be the spreading of information, the destruction of the nation’s corrupt institutions, or the removal of her worst, Britain will be Free, In Politt’s name..."


