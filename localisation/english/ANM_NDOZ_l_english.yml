###leaders###
 POLITICS_BELA_BUGAR_DESC_NDOZ: "Béla Bugár was until recently an unknown man. Born in 1958 in Bratislava, a Hungarian, living in Slovakia, he moved to the NDOZ, and after departing university he became a representative of the Hungarians in the Governing Council. Even then he excepted to be at most a footnote in history, he never thought he would once lead a „nation”. But his charming intellect and fiery speeches reached the attention of the Hungarian government, who found him to be the perfect Governor for the upcoming 2 years. Now it is his responsibility to root out the extremists of the KNG and the FBH, calm the civilian population, and somehow maintain peace between Hungary and Slovakia. However hard it may be.§!"
