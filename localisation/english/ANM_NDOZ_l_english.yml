 NDO_kdn_troops_status_observers: "KdN troops status: §RObservers§!"
 NDO_kdn_troops_status_observers_desc: "This region is a hot zone of the world, and for this reason, the KdN Peacekeeping Forces have deployed battalions to aid the government in destroying the threat(s). The battalions however only serve to maintain order and are doing nothing to actively hunt down terrorists.§!"
