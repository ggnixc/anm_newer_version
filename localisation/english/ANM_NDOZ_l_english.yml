###IDEAS###
 NDO_kng_insurgency_extreme: "KNG Insurgency - §RExtreme§!"
 NDO_kng_insurgency_extreme_desc: "Kral’s National Guard is an ultranationalist Pan-Slovak terrorist group, secretly funded by the Slovak government. They are vehemently Anti-Hungarian and are famed for their constant attacks against the Hungarian inhabitants of the Zone, using even the most unconventional tactics imaginable. If the NDOZ is to survive, dealing with this problem is of utmost importance.§!"
