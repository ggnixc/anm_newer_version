 NDO_fbh_insurgency_extreme: "FBH Insurgency - §RExtreme§!"
 NDO_fbh_insurgency_extreme_desc: "The Felvidéki Betyár Hadosztály is a Neo-Revisionist and vehemently Hungarian group with many of its members being former members of the now-banned NYKP. They pledged to accept nothing else than the complete extermination of the Slovak population of the territory, and are using every opportunity to do so. If the NDOZ is to survive, dealing with this problem is of utmost importance.§!"
