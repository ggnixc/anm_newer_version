 NDO_bystrica_treaty: "Bystrica treaty"
 NDO_bystrica_treaty_desc: "The Bystrica Treaty, signed between the Vodca of Slovakia Alexander Mach, and the Regent of Hungary István Horthy Sr. created the North Danube Occupation Zone as a means of maintaining the stability of the region, and as a compromise over who shall own the disputed territory. The treaty granted the territory a democratically elected parliament and obliged both countries to ensure the safety and stability of the region. The „Parlament” of the NDOZ, however, is a rather unique one: of its 150 members 75 are always Slovakian and 75 are always Hungarian, to ensure that both sides are equally represented. Instead of voting for parties, the people vote for the representative who they want to get into the parliament, while the Governor of the region is appointed for two years, switching between the two countries.§!"
 NDO_slovak_german_settlers: "Slovak-German settlers"
 NDO_slovak_german_settlers_desc: "To balance the ethnicity level in the traditionally Hungarian-populated region of South Slovakia, the Slovak government encouraged Slovakian and German settlers to move to the region, creating a sizeable minority in the region, that resulted in the skyrocketing the ethnic tensions.§!"
 NDO_civil_unrest: "Civil unrest"
 NDO_civil_unrest_desc: "With the constant terror attacks from KNG and FBH, the population of the NDOZ is starting to doubt the ability of the central government to keep them safe and maintain stability, a factor that led to ever-growing civil unrest.§!"