### Characters ###
## Names ##
 COS_Rodrigo_Odio: "Rodrigo Carazo Odio"
## Descriptions ##
 POLITICS_COSTA_RICA_DESC: "Born in Costa Rica's historical capital of Cartago on December 27th, 1926, Rodrigo Carazo Odio graduated with a degree in economics from the Universidad de Costa Rica. Odio entered his political career as the founding manager of the National Institute of Housing and Urban Planning, where he oversaw large-scale urbanization of the nation as well as clearing many of the country's worst slums. He would later move into working as the director of the Central Bank of Costa Rica, before joining the Legislative Assembly and eventually becoming president of the Legislative Assembly.\n\nFollowing a successful bid for the presidency, Odio would lead a large-scale expansion of the nation's hydrocarbon network. Now, as fascism is once again on the rise in the region, he seeks to move towards what might be the most controversial act in the last half century of the nation, the re-establishment of a standing army."

### National Spirits ###
 COS_the_dominant_liberation: "The Dominant Liberation"
 COS_the_dominant_liberation_desc: "The Partido Liberación Nacional leads Costa Rica with an inordinate dominance of the political scene, being the country's dominant political party since the 1960s. The PLN has been able to maintain this one-party rule not through political strong-arming or corruption but by promising the Costa Rican people prosperity and following through.\n\nTaking a page out of her northern allies' book, the PLN encompasses many of the same big tent policies as the Partido Revolucionario Institucional, but has maintained a strong true democracy foundation, a fact which the same cannot be said for the PRI."
 COS_the_creeping_shadow: "The Creeping Shadow"
 COS_the_creeping_shadow_desc: "Since 1949, Costa Rica has had no permanent standing military as outlined in Article 12 of the Costa Rican constitution. Instead, the nation has relied on its small but elite Public forces and Special Intervention Unit, focusing predominantly on civil order and combating local cartels. However, with fascism once again creeping into Latin America, these civilian forces are no longer suitable to handle the rising threat, leaving no other choice but the remilitarization of Costa Rica.\n\nWith the assistance of both Mexico and Cuba, Costa Rica has begun the process of reconstructing its armed forces. Though officially prohibited from maintaining “The Army as a permanent institution”, the constitution does allow the non-permanent establishment of a military, though with such a vague description this leaves much to interpretation."
