  KdN_anm_kdnevents.4.t:0 "Israeli Recognition in the KdN"
  KdN_anm_kdnevents.4.desc:0 "The Koalition der Nationen Parliament in Hamburg has, yet again, started a vote on the recognition of Israel as a full KdN Parliament member, promoting it from observer status. The diplomatic blocks of pro-and anti-Israel nations have taken their sides already, however, the biggest suprise might be on wether Germany will finally shift its policy torwards the country."
  KdN_anm_kdnevents.4.a:0 "The KdN Assembly will be heated with tension,\nthis is for sure!"
  KdN_anm_kdnevents.3.t:0 "Israeli Recognition in the KdN"
  KdN_anm_kdnevents.3.desc:0 "The Koalition der Nationen Parliament in Hamburg has, yet again, started a vote on the recognition of Israel as a full KdN Parliament member, promoting it from observer status. The diplomatic blocks of pro-and anti-Israel nations have taken their sides already, however, the biggest suprise might be on wether Germany will finally shift its policy torwards the country."
  KdN_anm_kdnevents.3.a:0 "The KdN Assembly will be heated with tension,\nthis is for sure!"
  
  KdN_anm_kdnevents.5.t:0 "KdN Assembly Vote - [GetANMKDN_currentvotedescription_short]"
  KdN_anm_kdnevents.5.desc:0 "The Koalition der Nationen Parliament in [GetANMKDN_currentkdnseat] has gathered to vote on the '[GetANMKDN_currentvotedescription_short]' resolution.\nWe will observe the debate closely, and have to choose our side carefully. Other nations within our diplomatic sphere will likely be influenced by our stance on the topic as well."
  KdN_anm_kdnevents.5.a:0 "The KdN Assembly will be heated with tension,\nthis is for sure!"
  
  KdN_anm_kdnevents.6.t:0 "KdN Council Vote - [GetANMKDN_currentcouncilvotedescription_short]"
  KdN_anm_kdnevents.6.desc:0 "The Koalition der Nationen Council in [GetANMKDN_currentkdnseat] has gathered to vote on the '[GetANMKDN_currentcouncilvotedescription_short]' resolution.\nWe will observe the debate closely, and have to choose our side carefully, as the KdN Permanent Security Council Members decide the KdN's actions against violations of International Law, and uphold global peace."
  KdN_anm_kdnevents.6.a:0 "The KdN Council will be heated with tension,\nthis is for sure!"