 #Descriptions
 POLITICS_AST_Joh_Bjelke_Petersen_DESC: "Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last Labour leader of Australia. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labour Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"

 AST_Joh_Bjelke_Petersen_hog_desc: "Prime Minister\n--------------\n"Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last Labour leader of Australia. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labour Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"
 AST_Andrew_Peacock_for_desc: "Minister for Foreign Affairs\n--------------\nA seasoned diplomat — words that professionally summarise Andrew Peacock. Born on February 13, 1939, in Melbourne, his career in diplomacy and politics determine Australia's mark in international relations. Notably serving as the ambassador to the United States before he was appointed the Foreign Minister.\n\nPeacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Bjelke-Petersen. He was able to show exemplary skills in diplomacy, contributing significantly to fostering strong ties despite American condemnations of human rights abuses by the Bjelke-Petersen government. His tenure in D.C. was characterised by a commitment to promoting Australia's interests on the global stage and navigating international issues. Following his successful ambassadorship, Andrew Peacock's political career took another significant turn when he assumed the role of Australia's Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena.\n\nHowever, Peacock's political journey was not without its intricacies. His endorsement of Joh Bjelke-Petersen during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labour Party from securing victory, Peacock threw his support behind Joh, despite any disagreements he might have had about his policies.\n\nThe eyes of history are ever-watching. Should the coalition fall out and Joh lose his grip on power, Peacock would be the first man to consider taking over..."
 AST_Peter_Costello_eco_desc: "Minister for Finance\n--------------\nOne thing can be said about Peter Costello's career, started as a Social Democrat student politician, and ended up as the conservative treasurer of Australia. Born on August 14, 1957, in Melbourne, into a middle-class family, Costello's journey has seen him evolve from a student politician to a prominent barrister, until he was eventually appointed as the treasurer.\n\nCostello's early entry into politics began during his university days, when he immersed himself in student politics. Initially identifying as a social democrat, an assault against him from a left-wing student politician led to the reassessment of his political beliefs. This incident marked a turning point, prompting Costello to realign himself with conservative ideologies after graduation, pursuing a career in law, as a barrister. His legal expertise and advocacy skills quickly propelled him into prominence within the legal community, even representing some of Australia's best-known industrial relations disputes.\n\nIn the 1990s, Costello became a household name, eventually rising in the ranks of the government, and eventually getting appointed as the treasurer, a position where he showed a keen understanding of economic matters and fiscal policies. Serving in this critical role, Costello played an important part in helping the Australian economy recover from the riots against the government."
 AST_Ian_McLachlan_sec_desc: "Minister for Defence\n--------------\nMcLachlan has had a long journey to his position as Minister of Defense. Before his career, in what feels like another life, he was a Cricket player. He’d later become the president of the South Australian Cricket Association. However, that was not where his destiny would end. He would get into politics, joining the House of Representatives. Before long, he would be selected for his current position. If he can do that job as well as he can play cricket, then Australia has little to worry about."
 