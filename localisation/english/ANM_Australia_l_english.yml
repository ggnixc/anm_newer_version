# Nat Spirits
 AST_United_in_Name_Only: "United in Name Only"
 AST_United_in_Name_Only_desc: "Although there officially exists a coalition between Bjelke-Petersen's National Country Party and the Liberal Party, it has always been clear that it's nothing more than a sham, an attempt by the Liberals to avoid sharing the fate of the Labours, and by the NCP to sell their authoritarian agenda to the broader populace.\n\nHowever, now more than ever, the Liberals both within and without the party demand the end of the coalition between the two parties. With Joh's name stained by corruption, embezzlement, and brutal police crackdowns, it is clear to them that the people's faith in Bjelke-Petersen has been lost, and the only way for the Liberal Party to get to power once again, is to distance themselves from the so-called "Collapsing mess of the NCP" and reconcile with those who still have faith in Australian democracy. Should the legacy of Joh prove to be stronger than the people's desire for change, such a move would have grave consequences, however... "
 AST_Red_Menace: "The 'Red' Menace"
 AST_Red_Menace_desc: "Although the Australian Labour Party was never officially banned, they have been the victim of heavy suppression from Joh Bjelke-Petersen's government, with its parliamentary presence and membership shrinking to a tenth of its pre-Joh size.\n\nMass arrests against several prominent Labour politicians and activists such as Bill Hayden, Bob Hawke, and Gough Whitlam for "Conspiracy against the state" and "Communist sympathies" have contributed to the fall of the Labours. It is now widely known that openly supporting the ALP is a surefire way to invoke the ire of the Commonwealth Police and the citizens brainwashed into believing the lies of the Country Party. Despite this, the Labours (and alongside them, the radicals of the CPA) live on in underground movements, which are slowly becoming widespread throughout the country. And as the end of Joh's rule seemingly nears, they are ready to seize power once again - one way or another."
 AST_Werewolves_of_Australia: "The Werewolves of Australia"
 AST_Werewolves_of_Australia_desc: "Ever since 1917, the Commonwealth Police, now named Australian Federal Police has been in charge of maintaining law and order in Australia - tasked with disrupting serious, complex and organised crime including terrorism and violent extremism.\n\nAt least this was the case before the rule of Bjelke-Petersen began.\n\nEver since 1971, the Australian Federal Police has devolved into an institution that spends more time opressing the people it nominally protects, having earned the nickname "Werwolves of Australia" due to the brutality of their methods, that many have likened to the Nazi paramilitaries bearing the same name. With suspected ALP supporters and critics of the Country Party or Joh getting beaten up and arrested being an everyday occurence, it is clear to everyone that the Werwolves are not here to protect and serve.\n\nThey are here to rule, to hunt, and to kill - to stay true to their name."

