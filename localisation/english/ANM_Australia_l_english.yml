# Tooltips
 AST_Coalition_tt: "§VThe people expect a more unified coalition..."
# Nat Spirits
 AST_United_in_Name_Only: "United in Name Only"
 AST_United_in_Name_Only_desc: "Although there officially exists a coalition between Bjelke-Petersen's National Country Party and the Liberal Party, it has always been clear that it's nothing more than a sham, an attempt by the Liberals to avoid sharing the fate of the Labours, and by the NCP to sell their authoritarian agenda to the broader populace.\n\nHowever, now more than ever, the Liberals both within and without the party demand the end of the coalition between the two parties. With Joh's name stained by corruption, embezzlement, and brutal police crackdowns, it is clear to them that the people's faith in Bjelke-Petersen has been lost, and the only way for the Liberal Party to get to power once again, is to distance themselves from the so-called "Collapsing mess of the NCP" and reconcile with those who still have faith in Australian democracy. Should the legacy of Joh prove to be stronger than the people's desire for change, such a move would have grave consequences, however... "
 AST_Red_Menace: "The 'Red' Menace"
 AST_Red_Menace_desc: "Although the Australian Labour Party was never officially banned, they have been the victim of heavy suppression from Joh Bjelke-Petersen's government, with its parliamentary presence and membership shrinking to a tenth of its pre-Joh size.\n\nMass arrests against several prominent Labour politicians and activists such as Bill Hayden, Bob Hawke, and Gough Whitlam for "Conspiracy against the state" and "Communist sympathies" have contributed to the fall of the Labours. It is now widely known that openly supporting the ALP is a surefire way to invoke the ire of the Commonwealth Police and the citizens brainwashed into believing the lies of the Country Party. Despite this, the Labours (and alongside them, the radicals of the CPA) live on in underground movements, that are slowly becoming more and more widespread throughout the country. And as the end of Joh's rule seemingly nears, they are ready to seize power once again - one way or another."
 AST_Werewolves_of_Australia: "The Werewolves of Australia"
 AST_Werewolves_of_Australia_desc: "Ever since 1917, the Commonwealth Police, now named Australian Federal Police has been in charge of maintaining law and order in Australia - tasked with disrupting serious, complex and organised crime including terrorism and violent extremism.\n\nAt least this was the case before the rule of Bjelke-Petersen began.\n\nEver since 1971, the Australian Federal Police has devolved into an institution that spends more time opressing the people it nominally protects, having earned the nickname "Werwolves of Australia" due to the brutality of their methods, that many have likened to the Nazi paramilitaries bearing the same name. With suspected ALP supporters and critics of the Country Party or Joh getting beaten up and arrested being an everyday occurence, it is clear to everyone that the Werwolves are not here to protect and serve.\n\nThey are here to rule, to hunt, and to kill - to stay true to their name."

##Characters

 AST_Joh_Bjelke_Petersen: "Joh Bjelke-Petersen"
 AST_Andrew_Peacock: "Andrew Peacock"
 AST_Peter_Costello: "Peter Costello"
 AST_Ian_McLachlan: "Ian McLachlan"
 
 #Descriptions
 POLITICS_AST_Joh_Bjelke_Petersen_DESC: "Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last Labour leader of Australia. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labour Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"
 POLITICS_AST_ANDREW_PEACOCK_DESC: "From the Japanese bombings of Northern Australia to the Aboriginal cries of freedom and equality, Andrew Peacock has seen it all. Born only 2 years before the war that would rock the Pacific, Peacock has - since birth, shown a deep admiration for those who have led the then young nation of Australia. Peacock’s first political adventure began in 1961 when he unsuccessfully contested the seat of his home suburb of Yarra on the side of Liberal Party in the Federal Elections. From this early boost Peacock began to branch off into attempting to become the leader of the Liberal Party itself. A feat which he would accomplish multiple times.\n\nAs the years ticked past and the once young nation bared its deep-rooted wounds to the public, Peacock volunteered his lead. Now with him in charge of the nation, he has brought it upon himself to fill the cracks which allowed for such political instability to occur in a claimed free nation. Australia must push through the storm."
 AST_Andrew_Peacock_hog_desc: "Prime Minister\n--------------\nWhile the face of Australia has been, for the past 25 years, Joh Bjelke-Petersen, it is clear that its heart and brains are no longer the frailing old President. Instead, those titles belong to none other than Prime Minister Andrew Peacock. Peacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Bjelke-Petersen. He showed exemplary skills in diplomacy, contributing significantly to fostering strong ties with America, despite condemnations of human rights abuses by the Bjelke-Petersen government. Following his successful ambassadorship, his political career took another significant turn when he assumed the role of Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena to the best of his abilities.\n\nHowever, while seemingly Peacock is another loyal follower of Joh, this assumption would be far from the truth. His endorsement of Bjelke-Petersen and the Country Party during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labour Party from securing victory, Peacock threw his support behind Joh despite disagreements about his policies, and it is clear that to him, Petersen is but a means to this end.\n\nAnd should the coalition fall out and Joh lose his grip on power, Peacock would be the first man to consider taking over..."
 AST_Peter_Costello_eco_desc: "Minister for Finance\n--------------\nIf someone had told young Peter Costello, a Social Democrat student politician that one day he would end up as the conservative treasurer of Australia's most right-wing regime ever, he certainly would have laughed at the impossible idea. However, the idea became a reality, and Peter Costello hardly has anything to laugh about, as he is desperately trying to hold Australia back from being swallowed by the financial black hole that the corruption and poor decisions of Bjelke-Petersen have summoned. Born on August 14, 1957, in Melbourne, into a middle-class family, Costello's early entry into politics began during his university days, when he immersed himself in student politics. Initially identifying as a social democrat, an assault against him from another left-wing student led to the reassessment of his political beliefs, prompting Costello to realign himself with conservative ideologies after graduation, pursuing a career in law, as a barrister. His legal expertise and advocacy skills quickly propelled him into prominence within the legal community, even representing some of Australia's best-known industrial relations disputes.\n\nIn the 1990s, Costello became a household name, quickly rising in the ranks of the government, and eventually getting appointed as treasurer, a decision made as a last-ditch effort by the governing coalition, to save Australia from utter financial ruination. While he does everything in his power to help the ailing economy, it is becoming more and more clear that until Petersen rules, the economy will stay exactly where the country is - down under."
 AST_Ian_McLachlan_sec_desc: "Minister for Defence\n--------------\nMcLachlan has had a long journey to his position as Minister of Defense. Before his career, in what feels like another life, he was a Cricket player. He’d later become the president of the South Australian Cricket Association. However, that was not where his destiny would end. He would get into politics, joining the House of Representatives. Before long, he would be selected for his current position. If he can do that job as well as he can play cricket, then Australia has little to worry about."
 
 #Events
 WORLD.18192.t: "Joh Bjelke-Petersen Assassinated"
 WORLD.18192.desc: "Joh Bjelke-Petersen, the President of Australia for twenty years, was killed when a grenade was thrown at his motorcade and exploded. The suspect, one Jack Mundey, has been found and arrested.\n\nWith Bjelke-Petersen’s 20-year reign over, a new coalition has taken over. The Liberal Party’s leader, Prime Minister Andrew Peacock, has become the nation’s Head of State until elections can be held.\n\nFractures are already starting to show in the new administration. Bickering and deadlock have frozen the government for a time, while new political cliques seem to be forming and growing more ambitious. Some fear that this may foreshadow increasing radicalism as the country tries to find a new direction."
 WORLD.18192.a: "A foundation that’s been rotting for 20 years, now tested."