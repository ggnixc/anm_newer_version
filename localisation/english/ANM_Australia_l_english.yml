# Tooltips
 AST_Coalition_tt: "§VThe people expect a more unified coalition..."
# Nat Spirits
 AST_United_in_Name_Only: "United in Name Only"
 AST_United_in_Name_Only_desc: "Despite the coalition between Petersen's National Country Party and the Liberal party, several evidence signifies the deteriorating condition of the coalition. One of the major causes of the rising tensions between both parties can be attributed by major disagreements over several national issues such as abortion and rural rights — the differenced between both parties' economic policies can also be put into account. Another factor would be regarding the rising dissaproval of the Liberals towards Joh, members of the Liberals that are willing to call off their coalition with the Country Party are slowly growing.\n\nAs Petersen's political capabilities continue to deteriorate due to his age, the Liberals and even some politicians in Petersen's party watches with interest on who will be the next Prime Minister." 
 AST_Labour_Opposition: "Labour Opposition"
 AST_Labour_Opposition_desc: "Although the Labour Party was never banned officially, they have been the victims of heavy suppression from Joh Bjelke-Petersen's government — shrinking tenfold than before. Mass arrests against several prominent Labour politicians and activists such as Bill Hayden, Bob Hawke, and Gough Whitlam for alleged 'plots against the government' contributed to the fall of the Labours. With the Labours associated as 'Communist plotters', It has been widely known that openly supporting the labours will lead to shunning by Australians who fear repercussions from the state Police.\n\nDespite this, underground movements composing the Labours, the far left and even some liberal members of the coalition are slowly becoming more widespread throughout the country — plotting to remove Joh from power through any means necessary. §VNo matter what it takes..."
 AST_Wolves_of_Australia: "The Wolves of Australia"
 AST_Wolves_of_Australia_desc: "Ever since 1917, the Commonwealth Police has been in charge of maintaining law and order in the country — tasked with disrupting serious, complex and organised crime including terrorism and violent extremism. With this, The police are known as the "Wolves of the Australia", prowling for alleged Socialist extremists and petty criminals — most of whom are a part of the opposition varying from former Labour politicians and even students.\n\nWhile this was not the case before, the recent rise of Joh Bjelke-Petersen and his party turned the Commonwealth Police into an institution that closely watches over the people. An example of this was during Joh's premiership in Queensland, wherein the police were responsible for brutally suppressing riots in the state. Even during the present, every protesters against the government, be they students, workers, or politicians — are beaten and locked up.\n\nThe wolves shall observe their prey's every move — for every wrong move they do, the Wolves strike and blood will spill." 
##Characters

 AST_Joh_Bjelke_Petersen: "Joh Bjelke-Petersen"
