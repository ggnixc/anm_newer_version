 #Descriptions
 POLITICS_AST_Joh_Bjelke_Petersen_DESC: "Johannes Bjelke-Petersen, or how his critics call him "Bjelke-Hitlerson", had witnessed how Australia was ruined by the elites and communists in Canberra — from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last labour leader to take seat.\n\nHis memories, once many as books in a library, have slowly been receding into something similar to television static. Many in the Coalition, including a minority in his own party would say that Joh's fall began before his age caught up — when he first decided that he was superior to everyone else. He made a million decisions without consultation, half of them successful, half of them not. However one must not underestimate Bjelke-Petersen, for he was able to sway the coalition to make him the first leader to come from the Country Party — winning over the likes of McMahon, Snedden, and Fraser, and finally defeating Whitlam in what seemed to be an election heavily stacked against him.\n\nIn the eyes of other countries, corruption is a curse bestowed upon them. But for Joh's Australia, corruption is nothing but a game played everyday. If it wasn't for the rampant corruption inside the parliament, Bjelke-Petersen would not even be able to assert full control throughout the country.\n\nStorm clouds have broken over Australia a long time ago. But perhaps sunlight can finally reach its shores in the new millenium..." 
 
 AST_Joh_Bjelke_Petersen_hog_desc: "Prime Minister\n--------------\nJohannes Bjelke-Petersen, or how his critics call him "Bjelke-Hitlerson", had witnessed how Australia was ruined by the elites and communists in Canberra — from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last labour leader to take seat.\n\nHis memories, once many as books in a library, have slowly been receding into something similar to television static. Many in the Coalition, including a minority in his own party would say that Joh's fall began before his age caught up — when he first decided that he was superior to everyone else. He made a million decisions without consultation, half of them successful, half of them not. However one must not underestimate Bjelke-Petersen, for he was able to sway the coalition to make him the first leader to come from the Country Party — winning over the likes of McMahon, Snedden, and Fraser, and finally defeating Whitlam in what seemed to be an election heavily stacked against him.\n\nIn the eyes of other countries, corruption is a curse bestowed upon them. But for Joh's Australia, corruption is nothing but a game played everyday. If it wasn't for the rampant corruption inside the parliament, Bjelke-Petersen would not even be able to assert full control throughout the country.\n\nStorm clouds have broken over Australia a long time ago. But perhaps sunlight can finally reach its shores in the new millenium..." 
 AST_Andrew_Peacock_for_desc: "Minister for Foreign Affairs\n--------------\nA seasoned diplomat — words that professionally summarise Andrew Peacock. Born on February 13, 1939, in Melbourne, his career in diplomacy and politics determines Australia's mark in international relations. Notably serving as the ambassador to the United States before he was appointed the Foreign Minister.\n\nPeacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Prime Minister Bjelke-Petersen. He was able to show exemplary skills in diplomacy, contributing significantly to fostering strong ties despite American condemnations of human rights abuses by the Bjelke-Petersen government. His tenure in D.C. was characterized by a commitment to promoting Australia's interests on the global stage and navigating international issues. Following his successful ambassadorship, Andrew Peacock's political career took another significant turn when he assumed the role of Australia's Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena.\n\nHowever, Peacock's political journey was not without its intricacies. His support for Joh Bjelke-Petersen as the Prime Minister during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labour Party from securing victory, Peacock threw his support behind Joh, despite any disagreements he might have had about his policies.\n\nThe eyes of history are ever-watching. Should the coalition fall out and Joh lose his grip on power, Peacock would be the first man to consider taking over..."
 AST_Peter_Costello_eco_desc: "Minister for Finance\n--------------\nOne thing can be said about Peter Costello's career, started as a Social Democrat student politician, and ended up as the conservative treasurer of Australia. Born on August 14, 1957, in Melbourne, into a middle-class family, Costello's journey has seen him evolve from a student politician to a prominent barrister, until he was eventually appointed as the treasurer.\n\nCostello's early entry into politics began during his university days, when he immersed himself in student politics. Initially identifying as a social democrat, an assault against him from a left-wing student politician led to the reassessment of his political beliefs. This incident marked a turning point, prompting Costello to realign himself with conservative ideologies after graduation, pursuing a career in law, as a barrister. His legal expertise and advocacy skills quickly propelled him into prominence within the legal community, even representing some of Australia's best-known industrial relations disputes.\n\nIn the 1990s, Costello became a household name, eventually rising in the ranks of the government, and eventually getting appointed as the treasurer, a position where he showed a keen understanding of economic matters and fiscal policies. Serving in this critical role, Costello played an important part in helping the Australian economy recover from the riots against the government."
 AST_Ian_McLachlan_sec_desc: "Minister for Defence\n--------------\nMcLachlan has had a long journey to his position as Minister of Defense. Before his career, in what feels like another life, he was a Cricket player. He’d later become the president of the South Australian Cricket Association. However, that was not where his destiny would end. He would get into politics, joining the House of Representatives. Before long, he would be selected for his current position. If he can do that job as well as he can play cricket, then Australia has little to worry about."
 