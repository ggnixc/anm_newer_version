# Tooltips
 AST_Coalition_tt: "§VThe people expect a more unified coalition..."
# Nat Spirits
 AST_United_in_Name_Only: "United in Name Only"
 AST_United_in_Name_Only_desc: "Despite the coalition between Petersen's National Country Party and the Liberal party, several evidence signifies the deteriorating condition of the coalition. One of the major causes of the rising tensions between both parties can be attributed by major disagreements over several national issues such as abortion and rural rights — the differenced between both parties' economic policies can also be put into account. Another factor would be regarding the rising dissaproval of the Liberals towards Joh, members of the Liberals that are willing to call off their coalition with the Country Party are slowly growing.\n\nAs Petersen's political capabilities continue to deteriorate due to his age, the Liberals and even some politicians in Petersen's party watches with interest on who will be the next Prime Minister." 
 AST_Red_Menace: "The 'Red' Menace"
 AST_Red_Menace_desc: "Although the Labour Party was never banned officially, they have been the victims of heavy suppression from Joh Bjelke-Petersen's government — shrinking tenfold than before. Mass arrests against several prominent Labour politicians and activists such as Bill Hayden, Bob Hawke, and Gough Whitlam for alleged 'plots against the government' contributed to the fall of the Labours. With the Labours associated as 'Communist plotters', It has been widely known that openly supporting the labours will lead to shunning by Australians who fear repercussions from the state Police.\n\nDespite this, underground movements composing the Labours, the far left and even some liberal members of the coalition are slowly becoming more widespread throughout the country — plotting to remove Joh from power through any means necessary. §VNo matter what it takes..."
 AST_Werewolves_of_Australia: "The Werewolves of Australia"
 AST_Werewolves_of_Australia_desc: "Ever since 1917, the Commonwealth Police has been in charge of maintaining law and order in Australia - tasked with disrupting serious, complex and organised crime including terrorism and violent extremism.\n\nAt least this was the case before the rule of Bjelke-Petersen began.\n\nEver since 1971, the Commonwealth Police has devolved into an institution that spends more time opressing the people it nominally protects, having earned the nickname "Werwolves of Australia" due to the brutality of their methods, that many have likened to the Nazi paramilitaries bearing the same name. With suspected ALP supporters and critics of the Country Party or Joh getting beaten up and arrested being an everyday occurence, it is clear to everyone that the Werwolves are not here to protect and serve.\n\nThey are here to rule, to hunt, and to kill - to stay true to their name."

