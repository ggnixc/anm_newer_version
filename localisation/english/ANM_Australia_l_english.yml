 #Descriptions
 POLITICS_AST_Joh_Bjelke_Petersen_DESC: "Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the last Labour leader of Australia. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labour Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"
 POLITICS_AST_ANDREW_PEACOCK_DESC: "From the Japanese bombings of Northern Australia to the Aboriginal cries of freedom and equality, Andrew Peacock has seen it all. Born only 2 years before the war that would rock the Pacific, Peacock has - since birth, shown a deep admiration for those who have led the then young nation of Australia. Peacock’s first political adventure began in 1961 when he unsuccessfully contested the seat of his home suburb of Yarra on the side of Liberal Party in the Federal Elections. From this early boost Peacock began to branch off into attempting to become the leader of the Liberal Party itself. A feat which he would accomplish multiple times.\n\nAs the years ticked past and the once young nation bared its deep-rooted wounds to the public, Peacock volunteered his lead. Now with him in charge of the nation, he has brought it upon himself to fill the cracks which allowed for such political instability to occur in a claimed free nation. Australia must push through the storm."
 AST_Robin_Gray_hog_desc: "Prime Minister\n--------------\nSitting at the table in the House of Representatives’ centre, Robin Gray leads a government viewed by the Australian people with apathy and contempt.\n\nFew nationally predicted the rise of Gray to the Prime Ministership. Previously serving as Premier of Tasmania, the once-liberal politician became known as a keen believer in the development of Tasmania’s rich natural resources to drive the island state’s economy. Goaded by then-Prime Minister Joh Bjelke-Petersen, Gray systemically destroyed significant parts of Tasmania’s ecosystem to funnel money into the mining and forestry industries, unhindered by the federal government in the name of ‘states rights’. Following the conclusion of Gray’s second term as Premier of Tasmania, he decided to move into Federal politics, defecting to the Nationals and reestablishing their presence in Tasmania. After only a handful of years in Federal Parliament, he was appointed as Prime Minister by Joh in what was little more than a rubber stamp approval by the Coalition.\n\nGray now holds the nation’s second highest office in a time of significant political upheaval. His controversial perspective on environmental and social rights draws ire from many in Australia, and many in the National and Liberal caucus only pay him lip service, owing to his support from Joh. For Gray, he only wishes for Australia to maintain its identity: a commonwealth grounded in rich natural spoils, led by believers in true Australian values. Most in Australia know, however, that whenever Gray speaks, he truly does not speak for himself. Most importantly, Gray knows that Joh’s time as his puppet master will soon be over, and when that day does come, his own future in the halls of power will be of great concern." AST_Andrew_Peacock_for_desc: "Minister for Foreign Affairs\n--------------\nWhile the face of Australia has been, for the past 25 years, Joh Bjelke-Petersen, it is clear that its heart and brains are no longer the frailing old President. Instead, those titles belong to none other than the Minister of Foreign Affairs, Andrew Peacock. Peacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Bjelke-Petersen. He showed exemplary skills in diplomacy, contributing significantly to fostering strong ties with America, despite condemnations of human rights abuses by the Bjelke-Petersen government. Following his successful ambassadorship, his political career took another significant turn when he assumed the role of Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena to the best of his abilities.\n\nHowever, while seemingly Peacock is another loyal follower of Joh, this assumption would be far from the truth. His endorsement of Bjelke-Petersen and the Country Party during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labour Party from securing victory, Peacock threw his support behind Joh despite disagreements about his policies, and it is clear that to him, Petersen is but a means to this end.\n\nAnd should the coalition fall out and Joh lose his grip on power, Peacock would be the first man to consider taking over..."
 AST_Andrew_Peacock_for_desc: "Minister for Foreign Affairs\n--------------\nWhile the face of Australia has been, for the past 25 years, Joh Bjelke-Petersen, it is clear that its heart and brains are no longer the frailing old President. Instead, those titles belong to none other than the Minister of Foreign Affairs, Andrew Peacock. Peacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Bjelke-Petersen. He showed exemplary skills in diplomacy, contributing significantly to fostering strong ties with America, despite condemnations of human rights abuses by the Bjelke-Petersen government. Following his successful ambassadorship, his political career took another significant turn when he assumed the role of Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena to the best of his abilities.\n\nHowever, while seemingly Peacock is another loyal follower of Joh, this assumption would be far from the truth. His endorsement of Bjelke-Petersen and the Country Party during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labour Party from securing victory, Peacock threw his support behind Joh despite disagreements about his policies, and it is clear that to him, Petersen is but a means to this end.\n\nAnd should the coalition fall out and Joh lose his grip on power, Peacock would be the first man to consider taking over..."
 AST_Peter_Costello_eco_desc: "Minister for Finance\n--------------\nIf someone had told young Peter Costello, a Social Democrat student politician that one day he would end up as the conservative treasurer of Australia's most right-wing regime ever, he certainly would have laughed at the impossible idea. However, the idea became a reality, and Peter Costello hardly has anything to laugh about, as he is desperately trying to hold Australia back from being swallowed by the financial black hole that the corruption and poor decisions of Bjelke-Petersen have summoned. Born on August 14, 1957, in Melbourne, into a middle-class family, Costello's early entry into politics began during his university days, when he immersed himself in student politics. Initially identifying as a social democrat, an assault against him from another left-wing student led to the reassessment of his political beliefs, prompting Costello to realign himself with conservative ideologies after graduation, pursuing a career in law, as a barrister. His legal expertise and advocacy skills quickly propelled him into prominence within the legal community, even representing some of Australia's best-known industrial relations disputes.\n\nIn the 1990s, Costello became a household name, quickly rising in the ranks of the government, and eventually getting appointed as treasurer, a decision made as a last-ditch effort by the governing coalition, to save Australia from utter financial ruination. While he does everything in his power to help the ailing economy, it is becoming increasingly clear that until Petersen rules, the economy will stay exactly where the country is - down under."
 AST_Michael_Jeffery_sec_desc: "Minister for Defence\n--------------\nMichael Jeffery, born on December 12, 1937, in Wiluna, Western Australia. His life's journey has been characterised by a strong commitment to his country, most notably through his extensive military career, and his appointment as the Minister for Defence.\n\nJeffery's early life was marked by a deep sense of duty, leading him to join the Australian Army in 1955. His military career spanned several decades, serving during the South African War and the Indonesian Civil War, during which he garnered a reputation for excellence and leadership. Notably, he served in various command roles, including as a Major General. His military prowess was underscored by a strong sense of discipline, integrity, and dedication to the defence of Australia's interests.\n\nIn recognition of his distinguished service, President Joh Bjelke-Petersen assigned him to oversee the organisation and management of the Australian Defence Force — marking his transition from being a military man to serving in Bjelke-Petersen's cabinet.\n\nHowever, Jeffery's tenure as the Minister for Defence was not without challenges. Unrest begins to grow in major urban areas as the status of Bjelke-Petersen's deteriorating mind becomes more apparent. While it was President Joh Bjelke-Petersen himself who appointed him in this position, personal disagreements with Joh would always arise. Despite this, Jeffery remained committed in serving the Department of Defence.\n\nAll he can privately say is "What the hell is Petersen doing this time?""
 #Events
 WORLD.18192.t: "Joh Bjelke-Petersen Assassinated"
 WORLD.18192.desc: "Joh Bjelke-Petersen, the President of Australia for twenty-five years, was killed when a grenade was thrown at his motorcade and exploded. The suspect, one Jack Mundey, has been found and arrested.\n\nWith Bjelke-Petersen’s 25-year reign over, a new coalition has taken over. The Prime Minister Robin Gray, has become the nation’s Head of State until elections can be held.\n\nFractures are already starting to show in the new administration. Bickering and deadlock have frozen the government for a time, while new political cliques seem to be forming and growing more ambitious. Some fear that this may foreshadow increasing radicalism as the country tries to find a new direction."
 WORLD.18192.a: "A foundation that’s been rotting for 25 years, now tested."
 WORLD.18193.t: "Andrew Peacock Elected President"
 WORLD.18193.desc: "In the aftermath of the assasination of Australian President Joh Bjelke-Petersen, the latest election of the Commonwealth of Australia has seen his Minister of Foreign Affairs and Australian Liberal Party leader Andrew Peacock replace Bjelke-Petersen in the Lodge. This was seen as a suprise by few, considering the massive sway the Liberal-National coalition holds over Australia, as Peacock has earned an outstanding two-third of all votes, despite his suprising decision during his tenure as Interim Prime Minister to allow the Australian Labour Party's uninterrupted participation in the election, earning them their largest victory since Bjelke-Petersen's election in 1971. Whether this signals a return of Australian democracy, once thought to be killed and buried forever by the autocracy of Bjelke-Petersen, or merely a new layer of paint upon the autocracy he introduced to Australia, is not yet clear, but analysts and common citizens alike are hopeful that even in the latter case, Peacock will be a less opressive and more benelovent leader than his predecessor."
 WORLD.18193.a: "Land down under, hopes up high."
 WORLD.18194.t: "Alexander Downer Elected President"
 WORLD.18194.desc: "Celebrations are ringing across all major cities of Australia, as news of the election of the former Minister of Foreign Affairs Alexander Downer to the post of President have reached the public. His election came as a major shift compared to the rule of the late President Joh Bjelke-Petersen, putting an end to 25 years of Liberal-National rule, with Downer announcing the breakup of the coalition in favor of a partnership with the Australian Labour Party, once reduced to a political pariah under Bjelke-Petersen's rule. Downer also stated his intention to restore the pre-1971 Constitution of Australia, which many hope will mark a decisive return to democratic rule in Australia."
 WORLD.18194.a: "The Sun shines the brightest after a long night."
 WORLD.18195.t: "Robin Gray Holds On"
 WORLD.18195.desc: "Though many political analysts believed that the assassination of Australian President Joh Bjelke-Petersen would result in a radical change to the Australian political scene, they appear to have been proven wrong by the election of Robin Gray to the post. Gray, a close friend of Bjelke-Petersen has promised to uphold the status quo, and reassured Liberal politicians about his resolve towards maintaining the coalition between the Australian Liberal Party and the National Party. However, he has also promised to do away with some of the more controversial pieces of legislation passed under his predecessor's reign and to tone down the violence that has been increasingly gripping the continent in its clutches, leading to many hoping, that gradual change and liberalisation will still be possible under his reign."
 WORLD.18195.a: "Familiar, if nothing else."
 WORLD.18196.t: "Graeme Campbell Cracks Down on Dissent"
 WORLD.18196.desc: "Shock, upset and dread fills the citizens of Australia with the announcement of Graeme Campbell's ascension as President. A trusted confidant and cabinet member of the assassinated Joh Bjelke-Petersen, Campbell has already promised to uphold his legacy, accusing "Labour's communist weasels" for the assassination, and promising a swift crackdown on supporters of the left-wing movement, even threatening discontent ALP members who spoke up against the oppressive policies of the National Party. Reports are already pouring in about the declaration of martial law in all major cities of the Republic, Australian police units dragging thousands of people off of the streets, and military units opening fire on protesters in Sydney demanding the end of "New South Dachau." 
 WORLD.18196.a: "A land of prisoners once again."
