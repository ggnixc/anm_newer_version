 #Descriptions
 POLITICS_Joh_Bjelke_Petersen_DESC: "Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the first and last President of the god-forsaken Republic. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labor Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"
 POLITICS_ANDREW_PEACOCK_DESC: "From the Japanese bombings of Northern Australia to the Aboriginal cries of freedom and equality, Andrew Peacock has seen it all. Born only 2 years before the war that would rock the Pacific, Peacock has - since birth, shown a deep admiration for those who have led the then young nation of Australia. Peacock’s first political adventure began in 1961 when he unsuccessfully contested the seat of his home suburb of Yarra on the side of Liberal Party in the Federal Elections. From this early boost Peacock began to branch off into attempting to become the leader of the Liberal Party itself. A feat which he would accomplish multiple times.\n\nAs the years ticked past and the once young nation bared its deep-rooted wounds to the public, Peacock volunteered his lead. Now with him in charge of the nation, he has brought it upon himself to fill the cracks which allowed for such political instability to occur in a claimed free nation. Australia must push through the storm."
 POLITICS_ROBIN_GRAY_DESC: "Born on March 1, 1940, in suburban Melbourne, Robin Gray has had a political career eerily similar to that of the late Joh Bjelke-Petersen. After getting involved in Tasmanian politics, he served as Premier for the Liberal Party, starting in 1982. Eventually becoming disillusioned with the Liberals, Gray turned to Bjelke-Petersen, loyally overseeing significant state infrastructure development and undermining both the Liberal and Labor parties on the island. Still, he had his sights set higher. Finally, an opportunity arose. When offered the position as Bjelke-Petersen’s new Deputy Prime Minister, Gray was happy to accept, his loyalty finally paying off.\n\nNow, Gray finds himself thrust into the ministry following the assassination of his longtime friend and ally. Narrowly defeating the opposition in the election and maintaining stability, an uneasy status quo holds. As hardliners plot behind his back and pro-democracy voices call for liberalization, Gray faces a long road ahead in maintaining the order that brought him to power."
 AST_Joh_Bjelke_Petersen_hog_desc: "Prime Minister\nAristocratic Conservatism\n--------------\n"Johannes "Joh" Bjelke-Petersen - or "Bjelke-Hitlerson" if you ask his opponents — remembers many things. He remembers witnessing how Australia was led to the brink of destruction by the communists of the ALP - from the disastrous term of the Beazley and Evatt Ministry, up until the ministry of Jim Cairns, the first and last President of the god-forsaken Republic. He remembers the poverty and misery the Canberra Elites have forced the common people of Australia into. He remembers his glorious victory over Cairns and McMahon in 1971, the first step the Land Down Under has taken to the right direction in decades. He remembers these things that are no longer, for he and his Country Party has rid Australia of these treacherous snakes, once and for all.\n\nBut his memories, once as numerous as the books in the National Library, appear to have been condemned to share the same fate he once condemned the Constitution of Australia to - being shredded to pieces. Many in the Coalition, including a minority in his own party speak more and more openly about removing him from the office he has held for the last quarter of a century, as the all-encompassing corruption he used to sodify his rule, now tramples the future of Australia's economy, and the former members of the Labor Party turn to radicalism and terrorism more and more often to express their opinion on the current state of affairs.\n\nAnd as the last days of his reign slowly pass by, many - including Joh himself - are left wondering; Will the layer of clouds he has built over the continent outlive its creator? Or will it be swept away, to reveal whatever might be hiding on the other side?"
 AST_Andrew_Peacock_for_desc: "Minister for Foreign Affairs\nPaternalistic Conservatism\n--------------\nWhile Australia's now hollow Prime Minister fades further into obscurity with each passing day, it has become increasingly evident that a new struggle for the continent's heart and mind is emerging. Andrew Sharp Peacock finds himself locked in an endless game of tug-of-war with Deputy Prime Minister Robin Trevor Gray over the nation's fate, both awaiting the frail old man's downfall to seize their opportunity.\n\nPeacock's journey in diplomacy began when he assumed the role of Australia's ambassador to the United States in 1975, during reassignments made by Bjelke-Petersen. He showed exemplary skills in diplomacy, contributing significantly to fostering strong ties with America, despite condemnations of human rights abuses by the Bjelke-Petersen government. Following his successful ambassadorship, his political career took another significant turn when he assumed the role of Foreign Minister, employing his diplomatic finesse to strengthen Australia's position in the global arena to the best of his abilities.\n\nHowever, while seemingly Peacock is another loyal follower of Joh, this assumption would be far from the truth. His endorsement of Bjelke-Petersen and the Country Party during the 1971 elections stemmed from strategic considerations rather than ideological alignment. Acknowledging the need to prevent the Australian Labor Party from securing victory, Peacock threw his support behind Joh despite disagreements about his policies, and it is clear that to him, Petersen is but a means to this end."
 AST_Ray_Braithwaite_eco_desc: "Minister for Finance\nPaternalistic Developmentalism\n--------------\nRaymond Allen Braithwaite was born on December 6, 1933, in Finch Hatton, Queensland, Australia. Growing up in rural Queensland, he developed a love for numbers drawn to their logic and certainty. In Year 11 of secondary school, he joined the Australian Defence Force to fund his college education and pursue a career in finance. In 1955, he graduated from the University of Queensland with a degree in accounting.\n\nAfter completing his military service, Braithwaite worked as a chartered accountant until 1964. With the National Party's rise, he entered politics, joining the Mackay City Council. In 1969, he narrowly beat out the incumbent labor candidate winning a seat in the House of Representatives. Two years later, the National Party would make history by winning the federal election.\n\nSuddenly in a position to achieve more than he ever thought possible, Braithwaite used his economic expertise to join Bjelke-Petersen's new National Party cabinet as Minister of Finance. Now he sits at the top of his field only threatened by the growing discourse from within. While he does everything in his power to help the ailing economy, it is becoming more and more clear that until Bjelke-Petersen rules, the economy will stay exactly where the country is - down under."
 AST_Bruce_Scott_sec_desc: "Minister for Defence\nRight-Wing Populism\n--------------\nBruce Craig Scott is seen by many as the stereotypical National—born and raised in the rural town of Roma Queensland, self-employed as a wool and grain grower, and president of his local graziers' association. To the National caucus, he embodies the ideal Australian, a figure who seems increasingly rare amidst a sea of malapportionment, corruption, and unrest—both within and outside the party.\n\nIt was therefore little surprise that, after Scott secured a seat in Parliament, Prime Minister Robin Gray hastily promoted him to the frontbench—if for no other reason than as a measure of legitimacy. Uncontroversial and professional, Scott's appointment played at least a minor role in the Nationals' campaign to rebrand themselves as an honest countryman's party after Joh Bjelke-Petersen’s dubious rise to power in the early seventies.\n\nScott is fully aware of his obligations—both as Defence Minister and as the Nationals' poster boy. While loyal to Bjelke-Petersen and Gray, Scott senses the coming storm. For both his self-interest and the interest of his department, he is determined to weather this storm and emerge as more than just a political gambit by the Nationals' upper echelon. Perhaps one day he can finally see Australia for what it truly is, beneath its rotting democratic façade."
 #Events
 WORLD.18192.t: "Joh Bjelke-Petersen Assassinated"
 WORLD.18192.desc: "Joh Bjelke-Petersen, Australia’s long-serving Prime Minister of 25 years, met a violent end today when an improvised explosive device struck his motorcade, killing him instantly. Authorities have apprehended the suspect, one John Percy, whose motives remain unknown.\n\nWith Bjelke-Petersen’s reign coming to an abrupt end, a new coalition has taken action. Deputy Prime Minister Robin Gray has stepped in as the nation’s acting Prime Minister, promising stability until snap elections can be organized.\n\nHowever, fractures have already begun to show in the new administration. Heated infighting and political deadlock have totally paralyzed the Australian government. Meanwhile, emerging political cliques seem to already be forming in the shadows, suggesting tensions run deeper beneath the surface. For many, there is a growing fear that this shock could set the nation alight in a wave of new radicalism as the country struggles to find direction in the post-Joh Bjelke-Petersen era."
 WORLD.18192.a: "A foundation rotting for 25 years, now tested."
 WORLD.18193.t: "Andrew Peacock Elected Prime Minister"
 WORLD.18193.desc: "In the aftermath of the assasination of Australian Prime Minister Joh Bjelke-Petersen, the latest election of the Commonwealth of Australia has seen his Minister of Foreign Affairs and Australian Liberal Party leader Andrew Peacock replace Bjelke-Petersen in the Lodge. This was seen as a suprise by few, considering the massive sway the Liberal-National coalition holds over Australia, as Peacock has earned an outstanding two-third of all votes, despite his suprising decision during his tenure as Interim Prime Minister to allow the Australian Labor Party's uninterrupted participation in the election, earning them their largest victory since Bjelke-Petersen's election in 1971. Whether this signals a return of Australian democracy, once thought to be killed and buried forever by the autocracy of Bjelke-Petersen, or merely a new layer of paint upon the autocracy he introduced to Australia, is not yet clear, but analysts and common citizens alike are hopeful that even in the latter case, Peacock will be a less opressive and more benelovent leader than his predecessor."
 WORLD.18193.a: "Land down under, hopes up high."
 WORLD.18194.t: "Alexander Downer Elected Prime Minister"
 WORLD.18194.desc: "Celebrations are ringing across all major cities of Australia, as news of the election of the former Minister of Foreign Affairs Alexander Downer to the post of Prime Minister have reached the public. His election came as a major shift compared to the rule of the late Prime Minister Joh Bjelke-Petersen, putting an end to 25 years of Liberal-National rule, with Downer announcing the breakup of the coalition in favor of a partnership with the Australian Labor Party, once reduced to a political pariah under Bjelke-Petersen's rule. Downer also stated his intention to restore the pre-1971 Constitution of Australia, which many hope will mark a decisive return to democratic rule in Australia."
 WORLD.18194.a: "The Sun shines the brightest after a long night."
 WORLD.18195.t: "Robin Gray Holds On"
 WORLD.18195.desc: "Though many political analysts believed that the assassination of Australian Prime Minister Joh Bjelke-Petersen would result in a radical change to the Australian political scene, they appear to have been proven wrong by the election of Robin Gray to the post. Gray, a close friend of Bjelke-Petersen has promised to uphold the status quo, and reassured Liberal politicians about his resolve towards maintaining the coalition between the Australian Liberal Party and the National Party. However, he has also promised to do away with some of the more controversial pieces of legislation passed under his predecessor's reign and to tone down the violence that has been increasingly gripping the continent in its clutches, leading to many hoping, that gradual change and liberalisation will still be possible under his reign."
 WORLD.18195.a: "Familiar, if nothing else."
 WORLD.18196.t: "Graeme Campbell Cracks Down on Dissent"
 WORLD.18196.desc: "Shock, upset and dread fills the citizens of Australia with the announcement of Graeme Campbell's ascension as Prime Minister. A trusted confidant and cabinet member of the assassinated Joh Bjelke-Petersen, Campbell has already promised to uphold his legacy, accusing "Labor's communist weasels" for the assassination, and promising a swift crackdown on supporters of the left-wing movement, even threatening discontent ALP members who spoke up against the oppressive policies of the National Party. Reports are already pouring in about the declaration of martial law in all major cities of the Republic, Australian police units dragging thousands of people off of the streets, and military units opening fire on protesters in Sydney demanding the end of "New South Dachau." 
 WORLD.18196.a: "A land of prisoners once again."
