  reichstagguifreydescription: "Gerhard Frey§!\nThe millionaire media mogul Gerhard Frey is one of the most influential people in the Speerite NSDAP. A supporter of extensive free market reforms, the Europapakt and German Nationalism, he has made a large following within the NSDAP. By many however, he is seen as the embodyment of ruthless capitalism in the German Government.\nAligned Reichstag Members:[?parliament_seat_array^0]\nRelation to Jörg Haider:\n[GetGerANMrelationsfreyhaider]([?GER_ANM_reichstagfactionopinion_frey_haider|-0])\nRelation to Johanna Grund:\n[GetGerANMrelationsfreygrund]([?GER_ANM_reichstagfactionopinion_frey_grund|-0]).\nRelation to Gerhard Kaindl:\n[GetGerANMrelationsfreykaindl]([?GER_ANM_reichstagfactionopinion_frey_kaindl|-0]).\nRelation to Peter Dehoust:\n[GetGerANMrelationsfreydehoust]([?GER_ANM_reichstagfactionopinion_frey_dehoust|-0]).\nRelation to Franz Schönhuber:\n[GetGerANMrelationsfreyschoenhuber]([?GER_ANM_reichstagfactionopinion_frey_schoenhuber|-0])."
  reichstagguihaiderdescription: "Jörg Haider\nJörg Haider,as much of a celebrity as a politican, is the public face of the Mußgnug Regime. A minor party clerk from Alpen-u. Donaugaue merely a few years ago, he has risen through the ranks at a rapid pace. Socially progressive, but with a conservative approach to the Europäische Pakt, and a anti-autonomy and xenophobic rhetoric.\nAligned Reichstag Members:[?parliament_seat_array^1]\nRelation to Gerhard Frey:\n[GetGerANMrelationsfreyhaider]([?GER_ANM_reichstagfactionopinion_frey_haider|-0])\nRelation to Johanna Grund:\n[GetGerANMrelationshaidergrund]([?GER_ANM_reichstagfactionopinion_haider_grund|-0]).\nRelation to Gerhard Kaindl:\n[GetGerANMrelationsfreykaindl]([?GER_ANM_reichstagfactionopinion_haider_kaindl|-0]).\nRelation to Peter Dehoust:\n[GetGerANMrelationshaiderdehoust]([?GER_ANM_reichstagfactionopinion_haider_dehoust|-0]).\nRelation to Franz Schönhuber:\n[GetGerANMrelationshaiderschoenhuber]([?GER_ANM_reichstagfactionopinion_haider_schoenhuber|-0])."
  reichstagguigrunddescription: "Johanna Grund\nJohanna Grund is remarkable, not only for being the most powerful woman within the NSDAP, but also a vocal opponent of further Europäische Pakt integration and immigration, and being an advocate for increased minority autonomy, militarisation, and a harsh foreign policy, especially against Italy, which she considers to be Germany's true Erbfeind.\nAligned Reichstag Members:[?parliament_seat_array^2]\nRelation to Gerhard Frey:\n[GetGerANMrelationsfreygrund]([?GER_ANM_reichstagfactionopinion_frey_grund|-0])\nRelation to Jörg Haider:\n[GetGerANMrelationshaidergrund]([?GER_ANM_reichstagfactionopinion_haider_grund|-0]).\nRelation to Gerhard Kaindl:\n[GetGerANMrelationsgrundkaindl]([?GER_ANM_reichstagfactionopinion_grund_kaindl|-0]).\nRelation to Peter Dehoust:\n[GetGerANMrelationsgrunddehoust]([?GER_ANM_reichstagfactionopinion_grund_dehoust|-0]).\nRelation to Franz Schönhuber:\n[GetGerANMrelationsgrundschoenhuber]([?GER_ANM_reichstagfactionopinion_grund_schoenhuber|-0])."  
  reichstagguikaindldescription: "Gerhard Kaindl\nThe Gauleiter and Leader of the Welthauptstadt, Kaindl, represents the ever-expanding German police state. Not progaganda around national pride will save the German Nation, but discipline and authoritarianism. Already, some are jokingly refering to his Germania as the 'ORPO-Staat Germania'. This might be more than just humourous exaggeration...\nAligned Reichstag Members:[?parliament_seat_array^3]\nRelation to Gerhard Frey:\n[GetGerANMrelationsfreykaindl]([?GER_ANM_reichstagfactionopinion_frey_kaindl|-0])\nRelation to Jörg Haider:\n[GetGerANMrelationshaiderkaindl]([?GER_ANM_reichstagfactionopinion_haider_kaindl|-0]).\nRelation to Johanna Grund:\n[GetGerANMrelationsgrundkaindl]([?GER_ANM_reichstagfactionopinion_grund_kaindl|-0]).\nRelation to Peter Dehoust:\n[GetGerANMrelationskaindldehoust]([?GER_ANM_reichstagfactionopinion_kaindl_dehoust|-0]).\nRelation to Franz Schönhuber:\n[GetGerANMrelationskaindlschoenhuber]([?GER_ANM_reichstagfactionopinion_kaindl_schoenhuber|-0])."  
  reichstagguimerchteheimerdescription: "Peter Dehoust\nDehoust, one of the most prominent figures within the Reichstag, sees Germany, and the Europäische Pakt, on a mission to 'strengthen European civilisation', to triumph over both eastern and American influences. He even advocates for expanding German territory and culture overseas, almost reminiscent of the 2nd Reich's colonial imperialism.\nAligned Reichstag Members:[?parliament_seat_array^4]\nRelation to Gerhard Frey:\n[GetGerANMrelationsfreydehoust]([?GER_ANM_reichstagfactionopinion_frey_dehoust|-0])\nRelation to Jörg Haider:\n[GetGerANMrelationshaiderdehoust]([?GER_ANM_reichstagfactionopinion_haider_dehoust|-0]).\nRelation to Johanna Grund:\n[GetGerANMrelationsgrunddehoust]([?GER_ANM_reichstagfactionopinion_grund_dehoust|-0]).\nRelation to Gerhard Kaindl:\n[GetGerANMrelationskaindldehoust]([?GER_ANM_reichstagfactionopinion_kaindl_dehoust|-0]).\nRelation to Franz Schönhuber:\n[GetGerANMrelationsdehoustschoenhuber]([?GER_ANM_reichstagfactionopinion_dehoust_schoenhuber|-0])."  
  reichstagguischoenhuberdescription: "Franz Schönhuber\nFranz Schönhuber has built a presence in the governments of both Speers for decades. The main figure behind the foundation of the Europäische Pakt and Fall Schwarz is regarded as a strong advocate for further Pakt integration, especially seeking closer relations with France, but also keeping a conservative stance on immigration and society.\nAligned Reichstag Members:[?parliament_seat_array^5]\nRelation to Gerhard Frey:\n[GetGerANMrelationsfreyschoenhuber]([?GER_ANM_reichstagfactionopinion_frey_schoenhuber|-0])\nRelation to Jörg Haider:\n[GetGerANMrelationshaiderschoenhuber]([?GER_ANM_reichstagfactionopinion_haider_schoenhuber|-0]).\nRelation to Johanna Grund:\n[GetGerANMrelationsgrundschoenhuber]([?GER_ANM_reichstagfactionopinion_grund_schoenhuber|-0]).\nRelation to Gerhard Kaindl:\n[GetGerANMrelationskaindlschoenhuber]([?GER_ANM_reichstagfactionopinion_kaindl_schoenhuber|-0]).\nRelation to Peter Dehoust:\n[GetGerANMrelationsdehoustschoenhuber]([?GER_ANM_reichstagfactionopinion_dehoust_schoenhuber|-0])."  
     