 ##Ideas##
 #########
 BEN_A_Bitter_Remnant: "A Bitter Remnant"
 BEN_A_Bitter_Remnant_desc: "The once proud Government of Free India, the shining beacon of pan-Asianism on the Indian Subcontinent, has now been relegated to the Andaman and Nicobar Islands in the Indian Ocean. As Delhi's Forces marched into Calcutta in 1983 during the Great Asian War, the Free Indian leadership went into Exile as a result, residing in areas such as Malaya and the Andaman Islands. \n\nThe so-called 'Free India' is now nothing more but a naval base for the Westernmost Point of the Empire of the Rising Sun, with many in Tokyo resigning to the fate that the Pan-Asian experiment has failed in India. Still, some government officials of the Azad Hind continue to decry the Delhi Government as Western lapdogs, and vow to return back to the mainland. Whether anyone would take them seriously is another topic of discussion."
