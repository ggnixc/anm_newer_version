 ##Leader Descriptions##
 #######################
 AZH_Chitta_Basu: "Chitta Basu"
 POLITICS_CHITTA_BASU_DESC: "How does one turn a starving, artificial backwater into one of the strongest nations in Asia? When historians examine this development in the future, they will find that the leadership of Chitta Basu was invaluable. Born in Dacca to a family of farmers, Basu would earn a graduate degree from the University of Calcutta and become introduced to the venerated Suhas Chandra Bose during his time there.\n\nStruck by his charm and dedication to independence, Basu would join the All-India Forward Bloc as a promising leader, under the guidance of Bose and R.K. Hadulkar. When Bose would stage a mutiny in East India, many in the AIFB would join him, including Basu, in hopes of proclaiming a socialist revolution. But it would quickly be for naught as Netaji would ally himself with the dreaded Japanese.\n\nFor years, Basu and the AIFB left would relentlessly criticize the Co-Prosperity Sphere, only to be bound to it after they took power. When the Great Asian War took place, Basu was one of the delegates to the Republican side in the peace treaty and willingly left the Japanese sphere.\n\nWhen his mentor R.K. Hadulkar would pass away in 1979, Basu would reluctantly take the reins of leadership. Under his guidance, East India would develop a large industrial base, collectivize agriculture, and modernize itself. Now, with strong diplomatic ties to many socialist nations and movements throughout Asia, Azad Hind stands as the vanguard of the Asian revolution, and they owe it all to Chitta Basu."

 AZH_Jayanta_Roy: "Jayanta Roy"

 ##Ideas##
 AZH_Sphere_Matters: "Matters of the Sphere"
 AZH_Sphere_Matters_desc: "After the crises of the 70s, a new status quo in the Sphere has been forged. While the pan-Asianist project was initially directed at Japan’s whims, two emerging powers have their newfound influence to mold the Sphere to their visions. The Chinese dragon seeks to make the Sphere an equal arrangement between its Asian brothers, prescribing its centralized left corporatist model onto the Sphere while the Indian tiger aims to export the flames of revolutionary self-determination into Asia, to realize the Sphere’s goal of liberation from imperialism. \n\nBetween them stands the Japanese sun, which seeks to preserve its subtle neoimperialist hegemony over Asia, while cowing both of its partners back into submission. As both the dragon and the tiger grow more voracious and potent, the sun that has shone its light over Asia for so long may finally be eclipsed, and the continent's future may be changed forever."
 AZH_Liberation_Arsenal: "Arsenal of National Liberation"
 AZH_Liberation_Arsenal_desc: "From the jungles of South America to the battlegrounds of Africa to the deserts of West Asia, one desire exists in every person, a future of liberation, where colonization and imperialism have been destroyed. In these emerging struggles against imperialism and oppression, there has been a constant aiding force: Hindustan's presence. \n\nWhether it was the FLN in Algeria, the Sandinistas in Nicaragua, the FRELIMO in Mozambique, or the Dhofar Liberation Front in Oman, the Calcutta government has always aided its fellow national liberation movements, through bullets, arms, air support, and volunteers. That legacy of anti-imperialism and national liberation continues today, where Hindustan is willing to give its blood, work its sweat, and shed its tears to destroy global imperialism."
 AZH_Red_Spectre: "The Red Spectre"
 AZH_Red_Spectre_desc: "If you ask members of the Hindustan Samyavada Sangha about the Communist Party of Hindustan, you will get a different answer each time. The Swaraj wing will claim that they are natural allies of the HSS, the Ekata will claim that they are incompetent rabble-rousers and the Samanvay will claim that they are the single most dangerous threat to Hindustan. \n\nSince the reunification of the nation, the CPH has bloomed into the second-largest communist party in the world while being a passive opponent of the HSS regime. In 1986, Ashok Ghosh’s Swaraj wing would form a coalition with the CPH, which caused the party to split over the issue of collaboration with the HSS. Once the Ekata wing expelled them from the government in 1991, the two wings would reconcile. Now the CPH waits in the shadows for the HSS to falter and when it does, they will be ready to begin the people’s revolution that Hindustan has long awaited."
