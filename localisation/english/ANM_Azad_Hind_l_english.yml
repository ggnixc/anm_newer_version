 ##Leader Descriptions##
 #######################
 AZH_Chitta_Basu: "Chitta Basu"
 POLITICS_CHITTA_BASU_DESC: "How does one turn a starving, artificial backwater into one of the strongest nations in Asia? When historians examine this development in the future, they will find that the leadership of Chitta Basu was invaluable. Born in Dacca to a family of farmers, Basu would earn a graduate degree from the University of Calcutta and become introduced to the venerated Suhas Chandra Bose during his time there.\n\nStruck by his charm and dedication to independence, Basu would join the All-India Forward Bloc as a promising leader, under the guidance of Bose and R.K. Hadulkar. When Bose would stage a mutiny in East India, many in the AIFB would join him, including Basu, in hopes of proclaiming a socialist revolution. But it would quickly be for naught as Netaji would ally himself with the dreaded Japanese.\n\nFor years, Basu and the AIFB left would relentlessly criticize the Co-Prosperity Sphere, only to be bound to it after they took power. When the Great Asian War took place, Basu was one of the delegates to the Republican side in the peace treaty and willingly left the Japanese sphere.\n\nWhen his mentor R.K. Hadulkar would pass away in 1979, Basu would reluctantly take the reins of leadership. Under his guidance, East India would develop a large industrial base, collectivize agriculture, and modernize itself. Now, with strong diplomatic ties to many socialist nations and movements throughout Asia, Azad Hind stands as the vanguard of the Asian revolution, and they owe it all to Chitta Basu."

 AZH_Jayanta_Roy: "Jayanta Roy"
 POLITICS_JAYANTA_ROY_DESC: "Born in the major Bengali town of Murshidabad and originally a teacher, Roy perfectly represents the ideal Hindustani citizen. Conscripted into the army at the beginning of the Great South Asian War, he would serve within the Logistics Corps, where his management of industrial resources and armaments would earn him prominence within the government. He would later go on to win the election to Hind's Rajya Sabha in 1972, where he would serve for 19 years and become the leader of the orthodox Subhasist wing of the Hindustan Samyavada Sangha. \n\nOpposing Premier Ghosh’s radical politics, Roy would ally with the moderates and the anti-communists and oust Ghosh, being elected Premier after winning an intra party vote by a landslide. Spearheading the Corrective Revolution, Roy would repeal most of Ghosh’s socialist reforms while mending relations with Japan. As the time comes for Hindustan to choose a new leader, Ghosh is more than happy enough to leave his post and leave the partisan squabbles of the HSS to his younger peers."
 
 AZH_Mulayam_Singh_Yadav: "Mulayam Singh Yadav"
 AZH_Priya_Ranjan_Dasmunsi: "Priya Ranjan Dasmunsi"
 AZH_Laxmi_Indira_Panda: "Laxmi Indira Panda"
 AZH_Kanshi_Ram: "Kanshi Ram"

 ##Ministers##
 AZH_Mulayam_Singh_Yadav_hog_desc: "President of the Hindustan Samyavada Sangha\n--------------\nRepresenting a break from the traditional Bengali political class that dominates the People’s Republic of Hindustan, Yadav is the chief ideologue and power broker behind the orthodox Subhasist faction. Born in Uttar Pradesh, his initial profession would be education which the devastation of the war would quickly dash.  Motivated by socialist ideals, he would join the Hindustan Samyavada Sangha and quickly rise in the ranks due to his connections with the political class of Uttar Pradesh, becoming a minister within the administration. \n\nHis oratory skills would quickly gain him a reputation through his fierce opposition of both the Swaraj and Samanvay wings, and he would quickly rise to be the leader of the Ekata faction within the Lok Sabha. Now, with his mentor Jayanta Roy looking to retire, Yadav seeks to be the leader to lead Hindustan into the future, one of Subhasist orthodoxy, anti-imperialism, and economic prosperity."
 AZH_Priya_Ranjan_Dasmunsi_eco_desc: "Minister of Finance\n--------------\nThe gris eminence behind the Samanvay wing of the Hindustan Samyavada Sangha and Japan’s favorite Hindustani, Priya Ranjan Dasmunsi is equally reviled and adored across Hindustan. Rising to prominence as a staunch anti-communist within Bengal, his tenure in the student wing of the HSS would lead him to join the Japanophilic faction led by Pranab Mukherjee. \n\nWorking as a junior minister within the Economic Ministry, his promotion of extensive welfare programs would be adopted by the state as a measure against rising communism. With the fall of Ghosh’s Swaraj government, Dasmunsi would be reinvited into the government in an attempt to form a broad coalition of HSS politicians in a unity cabinet. Plotting within the shadows, Dasmunsi seeks the premiership to finish what his mentor failed in, the extermination of the nation’s left."
 AZH_Laxmi_Indira_Panda_for_desc: "Minister of External Affairs\n--------------\nBorn in the year 1930, on the outskirts of the city of Rangoon in what was formerly the British colony of Burma, Panda was just an ordinary, Odia girl. She is now a key member of the Hindustani government and a national hero for her service during the War of Independence. When she was only 14 years old, Panda joined the Indian National Army as a member, and one of the main leaders, of the all-female Rani of Jhansi Regiment. \n\nServing as a major and one of the youngest officers of the INA, Panda was the only Odia woman to serve in the INA during pre-independence times. Serving as Roy’s foreign minister and as a popular figurehead, she has largely upheld the orthodox anti-imperialist internationalist policy of the Republic and in the light of the previous administration’s failures, has worked to remedy the relationship between Calcutta and Tokyo."
 AZH_Kanshi_Ram_sec_desc: "Minister of Home Affairs\n--------------\nOne of the few Swaraj politicians to escape the purges of the Corrective Revolution, Ram’s popularity among the lower castes is invaluable to the current administration. One of the most renowned social activists within Hindustan, Ram’s previous work as a junior minister within the Interior Ministry has been invaluable in the improvement of Hindustan’s wretched castes. One of the most popular men in India, his appointment to the Minister of the Interior has been seen as a placation of the lower castes, especially after the Swaraj wing’s outstanding popularity among them."

 ##Ideas##
 AZH_Dragon_Tiger_Sun: "The Dragon, The Tiger and the Sun"
 AZH_Dragon_Tiger_Sun_desc: "After the crises of the 70s, a new status quo in the Sphere has been forged. While the pan-Asianist project was initially directed at Japan’s whims, two emerging powers have their newfound influence to mold the Sphere to their visions. The Chinese dragon seeks to make the Sphere an equal arrangement between its Asian brothers, prescribing its centralized left corporatist model onto the Sphere while the Indian tiger aims to export the flames of revolutionary self-determination into Asia, to realize the Sphere’s goal of liberation from imperialism. \n\nBetween them stands the Japanese sun, which seeks to preserve its subtle neoimperialist hegemony over Asia, while cowing both of its partners back into submission. As both the dragon and the tiger grow more voracious and potent, the sun that has shone its light over Asia for so long may finally be eclipsed, and the continent's future may be changed forever."
 AZH_Liberation_Arsenal: "Arsenal of National Liberation"
 AZH_Liberation_Arsenal_desc: "From the jungles of South America to the battlegrounds of Africa to the deserts of West Asia, one desire exists in every person, a future of liberation, where colonization and imperialism have been destroyed. In these emerging struggles against imperialism and oppression, there has been a constant aiding force: Hindustan's presence. \n\nWhether it was the FLN in Algeria, the Sandinistas in Nicaragua, the FRELIMO in Mozambique, or the Dhofar Liberation Front in Oman, the Calcutta government has always aided its fellow national liberation movements, through bullets, arms, air support, and volunteers. That legacy of anti-imperialism and national liberation continues today, where Hindustan is willing to give its blood, work its sweat, and shed its tears to destroy global imperialism."
 AZH_Red_Spectre: "The Red Spectre"
 AZH_Red_Spectre_desc: "If you ask members of the Hindustan Samyavada Sangha about the Communist Party of Hindustan, you will get a different answer each time. The Swaraj wing will claim that they are natural allies of the HSS, the Ekata will claim that they are incompetent rabble-rousers and the Samanvay will claim that they are the single most dangerous threat to Hindustan. \n\nSince the reunification of the nation, the CPH has bloomed into the second-largest communist party in the world while being a passive opponent of the HSS regime. In 1986, Ashok Ghosh’s Swaraj wing would form a coalition with the CPH, which caused the party to split over the issue of collaboration with the HSS. Once the Ekata wing expelled them from the government in 1991, the two wings would reconcile. Now the CPH waits in the shadows for the HSS to falter and when it does, they will be ready to begin the people’s revolution that Hindustan has long awaited."
 AZH_Netajis_Legacy: "Netaji’s Legacy"
 AZH_Netajis_Legacy_desc: "For most Hindustanis, Subhas Chandra Bose is a figure larger than life. Regarded as the founding father of modern Hindustan, the widely adored Netaji has been the cornerstone of the ideology of the Hindustan Samyavada Sangha, a legacy to live up to. \n\nToday, to the common man, Netaji is a reminder of the unity that binds together the diverse and vast place that is Hindustan. Regardless of caste, creed, religion, and class, he sought to bind people into a single national identity, an aegis to reshape Hindustan for the better. As we look toward the new millennium, our unity will help guide us through the struggles, foreign and domestic, large and small, to ensure a brighter future for all of us. "
 AZH_The_Cancer_On_The_Indus: "The Cancer On the Indus"
 AZH_The_Cancer_On_The_Indus_desc: "When we prevailed over the reactionary Delhi government in our war to retake India, we unleashed a hidden evil onto the world. Its reactionary ideals and sectarian policies were vile, even in the face of the decadent Republic and the Afghan puppets that it replaced. Even worse, it became a harbinger of national socialism as it joined the Einheitspakt and fell under Germany’s umbrella. \n\nNowadays, the presence of the Karachi regime in the West is a constant malalignment towards our territories in the hinterlands, openly promoting sectarian politics, funding secessionist militias, and contributing to extremist terrorism within our borders. While Germany strays its attention to Europe more and more, perhaps the time has finally come to kill the devil that we gave birth to."
