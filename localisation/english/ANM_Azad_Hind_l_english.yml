 ##Leader Descriptions##
 #######################
 AZH_Chitta_Basu: "Chitta Basu"
 POLITICS_CHITTA_BASU_DESC: "How does one turn a starving, artificial backwater into one of the strongest nations in Asia? When historians examine this development in the future, they will find that the leadership of Chitta Basu was invaluable. Born in Dacca to a family of farmers, Basu would earn a graduate degree from the University of Calcutta and become introduced to the venerated Suhas Chandra Bose during his time there. Struck by his charm and dedication to independence, Basu would join the All-India Forward Bloc as a promising leader, under the guidance of Bose and R.K. Hadulkar. When Bose would stage a mutiny in East India, many in the AIFB would join him, including Basu, in hopes of proclaiming a socialist revolution. But it would quickly be for naught as Netaji would ally himself with the dreaded Japanese. For years, Basu and the AIFB left would relentlessly criticize the Co-Prosperity Sphere, only to be bound to it after they took power. When the Great Asian War took place, Basu was one of the delegates to the Republican side in the peace treaty and willingly left the Japanese sphere. When his mentor R.K. Hadulkar would pass away in 1979, Basu would reluctantly take the reins of leadership. Under his guidance, East India would develop a large industrial base, collectivize agriculture, and modernize itself. Now, with strong diplomatic ties to many socialist nations and movements throughout Asia, Azad Hind stands as the vanguard of the Asian revolution, and they owe it all to Chitta Basu."


 ##Ideas##
 AZH_Success_of_the_Hindustan_Land_Development_Program: "Success of the Hindustan Land Development Program"
 AZH_Success_of_the_Hindustan_Land_Development_Program_desc: "The Hindustan Land Development Program, the brainchild of the social nationalist government under Subhas Chandra Bose, has finally come to fruition. By redistributing lands previously held by the zamindars to millions of peasants who cultivate along the Ganga-Brahmaputra delta, we have allowed the farmers to enrich themselves, garnering a solid support base for our regime among the lower classes."
 AZH_Revolutionary_Government: "A Revolutionary Government"
 AZH_Revolutionary_Government_desc: "Since K. Mohan Singh ceded power to the civilian government in 1967, the All India Forward Bloc, led by R. K. Haldulkar and Chitta Basu, has governed the breakaway state. Citing numerous influences, from Iosif Stalin to Che Guevara to Gamal Abdel Nasser, the ideology of the AIFB has been that of revolutionary socialism. The egalitarian and collective policies caused discontent with the prominent gentry within the Bengal Delta but won the peasants' and workers' admiration and loyalty, creating a strong national spirit."
 AZH_Ghost_of_the_Samurai: "The Ghost of the Samurai"
 AZH_Ghost_of_the_Samurai_desc: "When we left the Co-Prosperity Sphere to save ourselves from the Delhi government and cut all ties with the Japanese, we did so in a chaotic and unorganized manner. Millions of dollars of Zaibatsu assets and programs were left unfinanced, Japanese-owned factories were left without workers, and access to the oil and rubber of Southeast Asia was cut off. Our economy never recovered from the shock of cutting off our largest trade partner and contributed to the country’s omnipresent economic malaise. To rid ourselves of this problem, we must either pursue a policy of nationalization and turning over Zaibatsu and Japanese-owned properties to worker cooperatives or negotiate a deal with the Japanese that would give us access to the markets of the Co-Prosperity Sphere again."
 AZH_Facade_of_Equality: "The Facade of Equality"
 AZH_Facade_of_Equality_desc: "The passage of civil rights legislation acknowledging Bengali culture, language, and the Bengali race has been a massive step in the process of healing racial tensions between the Bengali minority and the Indo-Aryan majority. But while on paper, Bengalis and Indo-Aryans are equal economically, most Bengalis are severely impoverished and are much worse off than their Indo-Aryan counterparts. While the government has been doing much to alleviate the condition, it is not one of their primary concerns. Continuing to ignore this problem might bring the revolutionary project of East India to the brink and perhaps even secession…."
