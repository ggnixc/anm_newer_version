 ### Characters ###

 ## Leader Descs ##

 POLITICS_ANATOLIY_KAMINSKI_DESC: "Anatoliy Vladimirovich Kaminski is a man with a storied past. Born in Baley, Eastern Russia in 1950, his time in the country was to be short-lived due to the beginning of the Russian Warlord Era, which had erupted in 1955 following the First West Russian War. His family moved to Romania, where they eventually settled down in Odessa. \n\nFollowing the end of the Odessa Hostage Crisis, Bucharest had decided it was time to abolish the Transnistria Governorate in favour of an Autonomous Region of Pridnestrovie, with referendums in each Province deciding whether to join Romania or become autonomous. An opportunity finally arrived for Ukrainians to have representation again, which Kaminskiy took advantage of. Initially being a member of the City Council of Balta, he quickly rose through the ranks of the DPP and was elected as Prime Minister of the Pridnestrovie Diet in 1994. \n\nKaminskiy has the unenviable duty of keeping the peace between Ukrainians, Romanians and the German minority alike, but it is an obligation he will have to fulfill nevertheless."

 ### Ideas ###

 TNS_Last_Bastion_Of_Free_Ukraine: "Last Bastion of 'Free' Ukraine"
 TNS_Last_Bastion_Of_Free_Ukraine_desc: "When the Wehrmacht smashed into and destroyed the USSR in 1942, it was as if all hope was lost for the Ukrainian People. Were they doomed to be suppressed by the Swastika and its Romanian stooges forever? Despite these setbacks, the Odessa Hostage Crisis proved to be a ray of hope. Tired of the money sink and waste of resources that was the Transnistria Governorate, Romania finally decided to dissolve it and appoint an autonomous Diet of Pridnestrovie. \n\nAt last, the Ukrainian people of the region finally regained the rights that they had lost since the Ukrainian Rada dissolved in 1917. Suffrage was granted to all above 20, and people could vote for whoever they wanted, at least in theory. The Romanians in Bucharest, along with the influential German Minority in Pridnestrovie never fail to pick their favourites and assist candidates who proclaim to subscribe to the 'Pan-European Dream'. The struggle for a free Ukraine is evidently not over."
 TNS_Spectre_Of_Communism: "The Spectre of Communism"
 TNS_Spectre_Of_Communism_desc: "As the Second West Russian War raged on, and the borders of the USSR approached ever closer towards Ukraine, Partisan forces once again began to ravage the countryside of Pridnestrovie. The dream of re-establishing the Ukrainian Soviet Socialist Republic once again became a realistic possibility. \n\nTaking advantage of the weak military of Pridnestrovie designed by Bucharest to prevent the possibility of rebellion, Partisan forces snake through the Countryside, recruiting volunteers dissatisfied with Romanian oversight over Pridnestrovie affairs. They often disappear across the porous border of Romania or Reichsland Ukraine as their forces seem to reach their dying breath, only to reappear in numbers anew a few weeks later, causing a big headache for the Pridnestrovie Army. \n\n§VShould this issue not be dealt with, a rebellion will certainly occur if the USSR manages to seize the initiative again in a future war.§!"

 TNS_False_Identity: "A False Identity"
 TNS_False_Identity_desc: "While the Union has liberated the Moldovans from the Romanian bourgeoisie and its fascist overlords in Germania, many citizens of the region do not share the same sentiments. As a result of Romania's ownership of Bessarabia from 1918 until the present day, bar a brief period during the Second World War, the population primarily identifies as Romanian first, and not Moldovan. Thus, many inhabitants have either left for Bucharest as refugees, or organised mass protests against our lawful annexation of Bessarabia. \n\nTo curtail such reactionary ideas and thinking, the Sovietisation of Moldavia will commence. The Romanian Latin alphabet will be converted back to Cyrillic as it was used before the 19th century. Furthermore, Russian will be a required language for any top leadership positions, and there will be policies enacted in order to differentiate Romanian and Moldovan culture to foster unity between Moldova and the other Soviet Republics."

