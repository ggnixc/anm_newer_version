l_english:
 JER_city_of_god:0 "City Of God"
 JER_city_of_god_desc:0 "Jerusalem is of particular importance to the three Abrahamic religions: Islam, Judaism, and Christianity. The historical-religious connection of Jerusalem to every believer is extremely valuable, to say the least. Throughout history, the city has been a focal point for religious wars from the Crusaders to Italian rule. Today, peace is maintained, neutrality and the inclusion of every believer of the Holy City for all continues, even if such or other pressures are bubbling here and there."
 JER_a_modern_city_state:0 "A Modern City-State"
 JER_a_modern_city_state_desc:0 "Although technically, the rule of the Jerusalem City Council also includes small areas outside the city itself, the entire world sees Jerusalem as an independent state city. The city council has to deal daily with a huge amount of bureaucracy and conflicts which it has to bridge between all those who are in its territory with the limited resources at its disposal, despite the financial support of the members of the Levantine Union."