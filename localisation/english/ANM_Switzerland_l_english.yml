 ### National Spirits ###

 SWI_Pain_in_the_Alps: "Pain in the Alps"
 SWI_Pain_in_the_Alps_desc: "Four decades have passed, yet the effects of the Alpine Crisis still haunt our country. The fall of Liechtenstein to this day serves as a painful reminder of the omnipresent prospect of a German invasion, should we show a sign of weakness. While the "National Redoubt" has been a successful deterrent so far, the cost of maintaining the system of fortifications takes an ever larger toll on the ailing Swiss economy. Should we fail to revitalize it, the facade of our Alpine Fortress will go down the drain…\n\n\n…and with it, all seven hundred years of our history."
 SWI_What_We_Are_Proud_Of: "What We Are Proud Of..."
 SWI_What_We_Are_Proud_Of_desc: "Schweiz. Suisse. Svizzera. Svizra. We are all that.\n\n\nWhat started out as a defensive alliance of farming communities ended up producing one of the most multicultural, cosmopolitan and decentralized nations of the world. Significant powers of self-governance rest with the cantons that make up the Confederation, a level of autonomy only seen in few other places around the globe. Many would argue that such a system will bring with it painful inefficiencies in this modern age - however it has helped hold together and keep content the collection of nationalities that make up Switzerland, and provided the Confederation the crucial stability it needed to weather any crisis.\n\n\nWe can only hope it will stay this way."
 SWI_And_What_We_Are_Not: "...And What We Are Not"
 SWI_And_What_We_Are_Not_desc: "Swiss democracy is dying, and its her people that dig its grave. The Vollmachtsregelung that has been reigning over Switzerland since the start of the Second World War has been increasingly centralizing power in the hands of the Federal Council, and away from the cantons. While elections still happen, and laws are still passed, everyone is well-aware of the fact that they are merely a show in the theater of the VMR. While some still hope that the true democracy of old can be restored, it seems the status quo is here to stay. Whether this is for the better or worse of the Confederation is up to the future to judge."




