 #Ideas
 LEB_The_people_of_Lebanon: "The People of Lebanon"
 LEB_The_people_of_Lebanon_desc: "Lebanon has an almost equal demographic balance of a small Muslim majority over a large Christian minority. Despite the fact that membership in the Levantine Union has made Lebanon relatively prosperous, there are incessant arguments that Lebanon’s resources are given to the Christian sector at the Muslim expense, or vice versa. This creates some tensions, even if they are usually below the surface."
