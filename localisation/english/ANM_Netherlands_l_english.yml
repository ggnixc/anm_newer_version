#IDEAS 
 HOL_pillarization: "Hernieuwde Verzuiling"
 HOL_pillarization_desc: "Before WW2 the Netherlands was a 'pillarized' society; catholic-, reformed-, and social-leaning classes lived completely separated from each other. After our defeat against the invading German forces a puppet regime was installed to show the Dutch people the greatness of the 'pan-Germanic' National Socialistic cause. This led to the abrupt dismantling of the much beloved 'verzuiling', causing permanent unrest from the religious-leaning countryside’s.\n\nWhen Biesheuvel took power during the chaos of the German Civil War, he promised his people peace and prosperity. During his reign he personally oversaw the creation of a new pillarization system, one where the fascists, religious and liberal-leaning classes would live, study, and work separately from each other. This renewed pillarization brought peace back to the country, allowing it finally start recovering from the 20 years of direct Nazi occupation."
 HOL_europakt_shipwright: "Europakt's Shipwrights"
 HOL_europakt_shipwright_desc: "The Dutch navy is the only navy that successfully defeated the British navy in open-sea combat, at least that was until the Kriegsmarine became our equal. Ever since our surrender to the German invading forces our shipyards have been constructing new, improved battleships for the Kriegsmarine. Years of experience has made our shipyards one of the finest in the world, producing state of the art ships capable of matching the naval might of the USA.\n\nWith the ever shifting stability of the world the demand for new, improved ships did not diminish. Currently about 40% of the Kriegsmarine’s ships are produced in our shipyards, generating a great amount of revenue for our economy. However, our nation is small in size so we must import almost all needed goods to keep the production going, an interruption in this flow could have serious consequences for our economy. On top of that this arrangement makes it nearly impossible for us to maintain our own navy.§\n\n\n§o(Yearly timed decisions to supply certain ships to pakt members, it is wise to keep up with all their demands unless we wish to lose our spot as Europa’s greatest shipbuilders.)" 
 
