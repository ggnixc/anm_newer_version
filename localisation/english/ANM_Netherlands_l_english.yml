#Leader Descriptions 
 HOL_hans_janmaat_desc: "Johannes Gerardus Henkdrikus (Hans) Janmaat was born on November 3, 1934 in the small town of Nes aan de Amstel, which no longer exists since its merger with the larger city of Amstelveen in 1964. Janmaat’s upbringing was heavily influenced by his catholic parents, and he has been a member of the Catholic Church ever since. As a little boy Janmaat was fascinated by the airplanes that flew over his little home, causing him to pursue a study in aeronautical engineering. Janmaat excelled in high school and became an honorary student in the aeronautical engineering department from the Technical University of Delft. It did not take long for Germany to take notice of his talent, and a group of High-ranking university recruiters was sent to Delft to find and persuade Janmaat to complete his education in one of their universities.\n\nSo, in 1959 Janmaat swapped his small student apartment in Delft for a luxury home in the suburbs of München, supplied to him by the Technical University there. However, it was not meant to last, during the final year of his study doubts about his true heritage came to light. It did not take long for this rumor to reach the wrong people, and Janmaat was forcefully removed from the university because his mom was of Jewish origin. He returned home with the hope he could finish his studies there, only to find out that he was no longer welcome at universities in the Netherlands neither.\n\nDisillusioned with the current government, he decided that the only way to change the system was from within. Borrowing books from the ‘pure’ Germanic students he would master the theory of Political Science. When Biesheuvel came to power during the German anarchy Janmaat took this opportunity to acquire himself a position within the civil administration. It did not take long for him to align himself with Biesheuvel’s NU movement since the alternatives where literal jew-hating fascists. Over the years Janmaat quickly grew the ladder of power within the NU and became one of Biesheuvel’s trusted advisors. When Biesheuvel announced his retirement in the early 90’s he unexpectedly chose Janmaat as his successor.\n\nNow Janmaat, a firm catholic, is the most influential person within the Corporatic German-Dutch Civil Administration. His ascension to power was criticized from all directions from the political spectrum, yet Janmaat managed to consolidate his control. Now, almost 10 years later it is up to him to change the Netherlands for the better, or worse…"

