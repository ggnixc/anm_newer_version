 ##events
 RAJ.general.1.t:0 "Republic Day Parade (1/2)"
 RAJ.general.1.desc:0 "Hands folded neatly behind his back, President Sharad Anantrao Joshi wore a serious look as he watched the procession. Thus far, the Republic Day festivities had been exactly the same as in previous years: A float carrying a children’s chorus here, an acrobat-flanked marching band there, and, of course, a menagerie of military vehicles escorted by columns of sharply-dressed troops.\n\n“Enjoying yourselves, gentlemen?” Joshi remarked, glancing at the pair of diplomats seated to his left.\n\nThe Chinese ambassador nodded. “The marching band was quite enjoyable. Not quite as skilled as China’s Central Military Band, but an impressive showing of musicianship nonetheless.”\n\n“I agree, Mr. President.” replied the representative from Japan. “Your people have come so far since the days of the Raj -- I am reminded of the swift modernization of my own country. Perhaps one day India will be able to reflect on the same progress.”\n\nDespite the ambassador’s condescending remark, a knowing smile tugged on the President’s lips. “I believe that day is closer than you think.”\n\n“Mm.” Nodded the balding man from Japan. “Perhaps, given the proper support.”\n\nBefore long, the final feature of the parade, a trio of bulky flatbed trucks, had peeked over the horizon. One by one, the white tarps concealing their cargo fell down onto the street, revealing three enormous nuclear missiles proudly signed with the Indian tricolor.\n\n“A-Are those...?” The American ambassador to Joshi’s right swallowed, eyes locked on the world-ending weaponry advancing down Rajpath Path. The Asian diplomats to the President’s left covered their mouths in horror.\n\nJoshi turned to face the pair as they hastily stood up from their seats. “What’s the matter, gentlemen? Running late?” he sniped, making no attempt to conceal the mocking cadence of his words. “Shame. I was just about to deliver my remarks...”"
 RAJ.general.1.a:0 "India wouldn’t be talked down to any longer."

 RAJ.general.2.t:0 "Republic Day Parade (2/2)"
 RAJ.general.2.desc:0 "As the final notes of Jana Mana Gana faded into uproarious applause, President Joshi lowered his stiff salute. Beholding the flag for a moment longer, the President blinked away budding tears, adjusted his tie, and approached the podium.\n\n“Good morning, sons and daughters of India!”\n\nAlready, the crowd was roaring. Joshi clenched his teeth, resisting the urge to crack a smile. “Seven years ago, our nation celebrated the 50-year anniversary of our independence from British rule. Today, our 50th Republic Day, marks another important milestone in our nation’s storied history: 50 years since Dr. Ambedkar’s greatest work, the Indian Constitution, was ratified by our Parliament — 50 years since the true beginning of the Republic of India.”\n\nA second round of applause gave the President an opportunity to clear his throat. “While the vipers of Tokyo desperately wring out the final drops of wealth from their shattered kleptocracy, our flourishing cities stand on their own, built with Indian brick and Indian labor. While the Chinese claw at each other’s throats over the pettiest of differences, our people, a diverse mosaic of languages, races, and religions, stands united against those who would revel in our destruction.”\n\n“Our great republic has faced a multitude of challenges over the course of these first five decades, and, as we look toward our centennial, a gauntlet of trials awaits us on the horizon. Pollution fills our streets and chokes our skies. Despite the rapid growth of our economy, the scourge of poverty still grips our nation. Rampant corruption metastasizes like a cancer at all levels of government.”\n\n“But to you, the people of India, I make this solemn promise; United, we shall rise to the challenge. India will shock the world!”\n\nAs the crowd’s applause reached a fever pitch, the seemingly-endless array of troops assembled before the President snapped a smart salute. A single, unified voice rang out from the center of Rajpath Path." 
 RAJ.general.2.a:0 "“Jai Hind!”"
 
 RAJ.general.3.t:0 "Indian Nuclear Test Sends Shockwaves"
 RAJ.general.3.d:0 "This morning, the alarming levels of radiation detected by the Australian Navy were confirmed by Indian officials to be the result of a nuclear test on the Kerguelen Islands. The incident all but confirms the Indian Government’s claim of possessing a small arsenal of intercontinental ballistic missiles.\n\nIndia’s conduct has provoked near universal condemnation from the international community. The Japanese Prime Minister has called India’s actions 'aggressive, reckless, and lacking any modicum of tact’. Chinese officials, meanwhile, have accused the Indian government of nuclear espionage.\n\nRegardless, it is undeniable that India has officially joined the ranks of the world’s ‘nuclear powers’. The effects that these developments will have on India’s role on the world stage are uncertain, but unquestionably significant."
 RAJ.general.3.a:0 "The clock ticks closer to midnight..."
 
 RAJ.general.4.t:0 "A Bridge Between Nations"
 RAJ.general.4.d:0 "President Joshi let a smile slip. He couldn’t help it -- not after one of his famous quips went over so well with the audience. Adjusting his tie in the moment it took for the laughter to die down, he leaned closer to the podium. \n\n“...but I digress,” He wore a practiced smile for the audience of politicians, businessmen, and day laborers gathered under the shadow of a sparkling, modern-style bridge, “The reason we are gathered here today is to commemorate the striking symbol of human ingenuity and determination before us: The India-Sri Lanka Friendship Bridge.”\n\n“Over the next decade, this vital piece of infrastructure will not only improve the ease of transportation and commerce between our two nations, but it will also bring our people -- and our economies -- closer together than ever before.”\n\n“Thank you, President Joshi.” The Sri Lanken President nodded, flashing his Indian counterpart a knowing smile. “In closing, President Joshi and I would like to extend our humblest gratitudes to all those who have taken part in this remarkable project, no matter how small their contributions. Without the hard work and dedication of the workers, engineers and bureaucrats who saw this project through to completion, the construction of this modern marvel would have never been possible. \n\n“It is our sincere hope that this international bond, forged in iron and steel, will stand for generations as an embodiment of the unbreakable bond between Sri Lankans and the people of India.” \n\nThe burst of applause from the crowd punctuated the end of the speech better than any writer could ever hope to do with words alone. Right on cue, the sudden flashing of hundreds of cameras erupted as the two leaders met in the center of the stage, hands locked in a firm handshake. "
 RAJ.general.4.a:0 "To eternal friendship"