 IND_Continued_Communal_Violence: "Continued Communal Violence"
 IND_Continued_Communal_Violence_desc: "After the reintegration of the Kalat territories, communal violence in the hinterlands of the Indus has spiked. Massive riots and pogroms against Hindu communities and Muslim communities are common within major cities like Lahore and Karachi, and the violence seems to be spreading inward toward cities like Delhi and Chandigarh. The brutality and damage caused by the violence not only cause a significant economic impact but also further divisions within our already fractured country."
 IND_Stranglehold_of_Congress: "The Stranglehold of Congress"
 IND_Stranglehold_of_Congress_desc: "Politicians in India like to claim that the Republic is the world’s largest democracy, but it doesn’t seem that way for the majority of the population. For the past 50 years, the Indian National Congress has had a complete political monopoly on the Indian government. The monopoly seems to be reaching its breaking point, with factional and ideological struggles within the party contributing to further fragmentation. Open disillusionment with the INC has contributed to distrust and paranoia among the general populace. Whether any party is strong enough to knock down Congress from its ivory tower is yet to be seen, but whoever succeeds will ensure a political monopoly for their party for years to come."
 IND_Legacy_of_Mirzapur: "The Legacy of Mirzapur"
 IND_Legacy_of_Mirzapur_desc: "With our failure in the Great Asian War against our rival government in the East, the military budget of the Republic has been expanded to massive proportions. Hiring military contractors from the West, purchasing large amounts of weapons, and investing in domestic arms factories and R&D development has caused our country to become innovative, at least in the art of war. But behind all this development and production lies a fundamental question yet to be answered: when our chance comes again, will we prevail?"
 IND_Red_Spectre_in_the_South: "Red Spectre in the South"
 IND_Red_Spectre_in_the_South_desc: "In 1967, the call to arms for the peasants left behind by the Desai government harkened. Joining the Communist Party of India and inspired by Mao and the Chinese Communist Party’s rural protracted people’s war, the peasants began the Naxalite rebellion. With broad support among the tribal, impoverished, and low-caste populations, the Naxalites began the bloodiest insurgency known to man. The number of police officers, reservists, and local militia casualties in insurgency areas quickly reached the thousands as the Conservative government declared a policy of no compromise. When the progressive-socialist coalition got elected, the insurgency drastically decreased in the northern areas but continued in the south. While the worst of the violence has passed, reports of insurgent regions indicate that something big is on the horizon, most likely backed by the treacherous Azad Hind government in the East."
 
