l_english:
 IND: "Republic of India"
 IND_DEF: "The Republic of India"
 IND_ADJ: "Indian"

 IND_THENEWORDER_DESC: "The fall of the British Raj in 1944 to the forces of the Axis left a power vacuum to fill. In those desperate deciding moments, the INC declared a republic and clawed their way across India, until the gunfire ended. And then, shortly afterwards, chaos once again engulfed India, as Hyderabad fell to a socialist insurgency. Although the Indian government crushed the insurgency and annexed Hyderabad, the Telanganies continue to agitate against the government. Now India holds on by a thread, and while the smart leadership has ensured that the Republic stays, it won't last forever, with Prime Minister Nehru's health failing. the Azad Hind stands guard on the border, ready to crush Indian democracy at any moment shall crisis engulf India once again. the fate of the young Republic is yet to be decided, but we can only hope to the Gods that it is a positive one."
 IND_DEBUG_DECISIONS: "Debug Decisions For India"

 ##Leader desc
 IND_Chandra_Sekhar: "Chandra Sekhar"
 POLITICS_CHANDRA_SEKHAR_DESC: "Born to a poor peasant family in Uttar Pradesh, Chandra Sekhar truly represents the agrarian socialist revolution that has inflamed India in the past two decades. Leading a radical student organization at the University of Allahabad,he joined the regional Praja Socialist Party in 1961. Pursuing national politics for the first time in 1964, his clout and popularity within the PSP and the state of Uttar Pradesh led him to be elected to the Rajya Sabha, the lower house of the Indian legislature.\n\nInitially an independent, he quickly aligned with the Indian National Congress and joined their ranks our years later. He fiercely decried the rampant inequality in the cities, the privatization of agriculture, and the growth of the military-industrial complex. Finding allies within the Socialist Party, Sekhar tried to mobilize a coherent opposition to the Desai government, but inner factionalism within the INC  led to his expulsion from the INC. As Indian society faltered in the wake of the Eastern war and the conservative government failed to pick up the pieces, Sekhar managed to work with Ram Kishore Shukla to unite the Progressive wing and the SPI.\n\nIn the 1989 elections, the coalition finally defeated the Conservatives with the help of the defecting Liberal caucus. Sekhar would lead the Progressive-Socialist coalition to another smashing victory in the 1991 general elections. Under Sekhar’s ministry, the Naxalite insurgency has been calmed down in the North, economic growth within the Republic has accelerated, the agricultural stability has increased, and perhaps the best achievement of all, negotiations with the Calcutta government have reached a consensus. As India looks to the future, Sekhar seeks to be paramount in leading India into the new millennium."
