 IND: "Republic of India"
 IND_DEF: "The Republic of India"
 IND_ADJ: "Indian"

 IND_THENEWORDER_DESC: "The fall of the British Raj in 1944 to the forces of the Axis left a power vacuum to fill. In those desperate deciding moments, the INC declared a republic and clawed their way across India, until the gunfire ended. And then, shortly afterwards, chaos once again engulfed India, as Hyderabad fell to a socialist insurgency. Although the Indian government crushed the insurgency and annexed Hyderabad, the Telanganies continue to agitate against the government. Now India holds on by a thread, and while the smart leadership has ensured that the Republic stays, it won't last forever, with Prime Minister Nehru's health failing. the Azad Hind stands guard on the border, ready to crush Indian democracy at any moment shall crisis engulf India once again. the fate of the young Republic is yet to be decided, but we can only hope to the Gods that it is a positive one."
 IND_DEBUG_DECISIONS: "Debug Decisions For India"


