 POLITICS_HORST_VON_SCHROETER_DESC: " "
 MRZ_special_economic_zone: "Mauritius Special Economic Zone"
 MRZ_special_economic_zone_desc: "Mauritius is an autonomous part of Germany, and arguably, its strangest. A loose immigration policy, aswell as investment from across the Pakt have expanded the remote island to a massive population centre. After initially being part of German Madagascar, it was briefly jointly occupied by the Jewish and Tanindrazanian forces in the wake of the colony's collapse, and was reconquered by the Reich in the bloody Mascarene War. The newly appointed governor, Admiral Horst von Schroeter, quickly realized the sheer economic opportunity of immmigration, and his domain was granted the status of Sonderwirtschaftszone, a unique position that allowd it to completely open up for foreign investment, reducing wage, safety and environmental standards in exchange for an economic boom that soon hit the island. Discontent with the Reich's discrimination against foreign labourers, von Schroeter stopped Germanisation efforts and opened up almost all immigration restrictions, whilst angering Germania, his actions were tolerated for the sake of stability and economic growth. As of now, Mauritius claims to be the 'Germania of Africa', and while it still is a long way for that claim to become truth, it certainly is on its road to be so."
 MRZ_heart_of_the_indian_ocean: "Star of the Indian Ocean"
 MRZ_heart_of_the_indian_ocean_desc: "Mauritius is a giant melting pot of cultures. While the relatively small German and French populations make up the elite, Indians, Cantonese, Burmese, Indonesians, Arabs, Persians, Turks and many more inhabit Ludwig-Hafen. Attracted by the many jobs created through Europapakt Investment, the stability and the relative absentia of racial policies compared to the rest of Germany, many now call the beating economic heart of the Indian Ocean their home. No stop for Mauritius' growth is in sight, but while the massive immigration certainly granted the island massive economic productivity in its Computer, Clothing, Consumer Electronics, Naval and Chemical Industry, tensions are rising between them and the Franco-German ruling class, as demands of political representation, while being surpressed, grow ever louder. Not only that, if Mauritius wants to truly become a home of quality technology manufacturing, it will need to elevate, train and educate its foreign workforce - which will upset the upper class severely."
 MRZ_lighter_shade_of_black: "A Lighter Shade of Black"
 MRZ_lighter_shade_of_black_desc: "Madagascar is the Reich's last Stronghold in Africa, with the rest being torn away as a result of native revolts. Nevertheless, it is used as a dumping ground for Politicians who have fell out of favour in Germania, and is melting pot of Rocket Scientists and Astrophysicists owing to the German Rocket Launch Site located at Antsiranana. The Island's far and remote location away from the prying eyes of Germania has led to a relatively less oppressive and a more laid back culture in the European Communities of Madagascar."
 MRZ_mauritian_miracle: "The Mauritian Miracle"
 MRZ_mauritian_miracle_desc: "A few decades prior, noone could have expected Mauritius to take on such rapid growth, such enormous wealth. Its remote location and the lack of ressources except for sugar could have condemned the island to remain a rural, backwater region forever. Moreover, German colonisation and its bloody downfall, aswell as the Mascarene War devastated the island. It was the clever policy of encouraging investment and immigration that allowed Mauritius growth to accelerate with such speed. Textile, Chemical, High-Tech and Financial Industry have transformed it into a economic hub unlike any other. While wages are low and work hours often exceed the regulations, a job in Mauritius is viewed by many of the poorest across the Indian Ocean as a ticked to wealth and sucess. "
