 ### ANM Help GUI (Clippy) Localisation ###
 ClippyTextBoxDesc: "It looks like you need some help with the '[GetText_HelpTopic]'! Press one of the following options to get started:"

 ## Topics ##
 ANM_Help_GUI_Topic_1: "The E.W. Decisions GUI"
 

 ## Options ##
 ANM_Help_GUI_Topic_1a: "The Mini-tabs"
 ANM_Help_GUI_Topic_1b: "Economic Stability"
 ANM_Help_GUI_Topic_1c: "The Euromark Projekt"

 ## Option Descriptions ##
 ANM_Help_GUI_Topic_1a_desc: "The Mini-tabs are a new feature of the E.W. GUI, which allows you to quickly access important information about your country. They can be found at the top of the screen and provide a quick overview of your country's status."
 ANM_Help_GUI_Topic_1b_desc: "Economic Stability is a key aspect of the E.W. GUI, which helps you manage your country's economy effectively. It provides insights into your economic performance and suggests ways to improve it."
 ANM_Help_GUI_Topic_1c_desc: "The Euromark Projekt is an initiative to stabilize the economy of the European Union. It aims to create a common currency and improve economic cooperation between member states."
