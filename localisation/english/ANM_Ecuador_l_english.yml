 # Nat Spirit
 ECU_Siege_Mentality: "Siege Mentality"
 ECU_Siege_Mentality_desc: "Ecuador since the third revolution finds itself surrounded by countries that want nothing to do with it and are probably itching to destroy it when given the chance, from the american puppets occupying their own territory in Galápagos and reactionary forces in the south and north in the shape of Colombia and Peru there aren’t many, if any, routes for Ecuador to reach the outside world, what this lead to is a siege mentality being held by the government, with the military receiving hefty investments in case of a future war.\n\nAlongside military buildup however Ecuador is also intent to break the siege, and so the government has focused on arming and training socialist militias from across the continent, specially in Peru, in the hopes of gaining more allies and freeing itself from the siege it finds itself in."
