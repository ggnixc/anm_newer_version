 #Leader desc.
 POLITICS_Romeo_Velasquez_DESC:0 "In the words of a US Military Spokesman during the Reagan Administration on America’s approach to Central America, “Honduras is the keystone to our policy down there”. Unfortunately for the US, Romeo Vásquez Velásquez has been a severe wrench in their work.\n\nBorn in 1957, Velásquez joined the army in 1972 when he was just 15 years old. The Honduran Army was notorious for overthrowing governments they didn’t like, with Velásquez himself involved in two different coups in the 70s. Initially neutral in whether Honduras should lean towards the OFN or CPS, he soon became a hardcore Anti-American General as he saw them as an Empire seeking to control all of Central America, but he also opposed ties to Japan. With the election of the Pro-American Roberto Córdova in 1995, Velásquez seized his chance and overthrew Córdova, citing his “radical and unstable agenda.\n\nWith his newfound power, he began to crack down on those who supported either the Americans or the Japanese. Both powers condemned his power grab and cut off ties with Honduras, seriously damaging its economy and international relations, leading to a major recession. Velásquez continues to hold onto power thanks to the loyalty of his group of Far-Right and Fierce Nationalist Soldiers, but resistance against him has boomed since his ascent to power, with many seeking a return to free elections. But Velásquez will have to be dragged out kicking and screaming for that to happen."
 
 #Ideas
 HON_Anti_Americanism:0 "Anti-Americanism"
 HON_Anti_Americanism_desc:0 "In 1995, Romeo Vasquez and his clique of far-right nationalists overthrew the democratically-elected government of President Roberto Córdova, accusing his administration of being “compromised by anti-hispanic, anti-catholic, imperialist American interests."\n\nEver since, Honduras’s Interim Government has enacted an aggressive campaign against anything deemed too “American.” Citizens caught wearing blue jeans or drinking Coke can face up to three years imprisonment. The broadcast of any English-language media — originating from the United States or otherwise — is grounds for the complete shutdown of any radio or TV station that dares defy Vasquez’s righteous decree.\n\nOddly enough, the Interim Goverment’s rabid isolationism seems to overlook the new flood of German and Chinese products filling store shelves. Probably just a coincidence..."
 HON_Terrorism:0 "Terrorism from the Left and Right"
 HON_Terrorism_desc:0 "Vasquez’s radical agenda and his overthrow of the previous democratically-elected government have, unsurprisingly, attracted many critics from the left and the right. But the lengths they’re willing to go to undermine Vasquez’s regime has certainly shocked those within his government.\n\nHis government has accused the Soviets and the Americans of funding leftist resistance groups, who frequently attack isolated garrisons and troops in the rural countryside. Vasquez has also accused the Japanese of funding right-wing groups with drug money, who have been implicated in the assassination of multiple Pro-Vasquez figures.\n\nWith trust in the security forces falling, Vasquez’s allies dying at the hands of an increasingly radical opposition and growing cries for freedom and rights from all levels of Honduran Society, if Vasquez is unable to contain the rebel groups, his days will be numbered."
 HON_Cycle:0 "The Army and Government Cycle"
 HON_Cycle_desc:0 "Honduras is stuck in a never-ending cyle between the Government and the Army. As soon as the people elect a new popular democratic government, ready to serve them and better the lives of everyone in the country, the army moves in and overthrows the government. Sometimes they say it’s to keep te country stable, other times it’s because the government’s agenda is too radical, everytime it’s just an excuse to further the power of the army and their generals. This cycle has been ongoinging for decades, with the most recent example being Romeo Vasquez’s overthrow of the democratically-elected Roberto Córdova in 1995.\n\nThis cycle of short-lived democratic governments followed by corrupt military governments has left Honduras as one of the poorest Latin American Countries, with much of the state’s funding going towards the military and its generals rather than the country or it’s citizens. If this cycle continues, Honduras will fall further and further behind its neighbours."

