 JAP_minister_Oriki_Ryoichi_sec: "Oriki Ryoichi"
 JAP_minister_Yoriko_Kawaguchi_for: "Yoriko Kawaguchi"
 JAP_minister_Hiranuma_Takeo_eco: "Hiranuma Takeo"
 
 JAP_minister_Shinzo_Abe_hog_desc: "--------------\nBorn in Tokyo on September 21, 1954, Shinzo Abe displayed brilliance and leadership qualities from a young age. First obtaining a degree in political science from Seikei University, Abe would later further his academic pursuits by obtaining a master's degree in public administration, solidifying his expertise in governance and policy-making. \n\nIn government, Abe has always demonstrated a strong commitment to improving Japan's economy and its image abroad. During his current tenure as Japan’s Deputy Prime Minister, he has thus far played a key role in implementing policies that have aimed to advance international relations and support economic growth. Domestic issues are no stranger to Abe’s resume, either — from healthcare reform, to education policies, to social welfare programs, Abe has worked diligently to ensure that the needs and aspirations of all of his constituents are met. \n\nAbe's steadfast leadership and unwavering commitment to his country has earned him widespread respect and recognition. He has proven himself to be a strong advocate for Japan's interests, working tirelessly to strengthen Japan’s position on the global stage."
 JAP_minister_Oriki_Ryoichi_sec_desc: "--------------\nBorn in 1950 in Kumamoto Prefecture, Oriki Ryoichi served with distinction in the Great Asian War shortly after graduating from the National Defence Academy in 1972. He and his troops, though outnumbered and under-supplied, held Beijing for 40 days against a non-stop Chinese onslaught. Though the city would inevitably fall back into enemy hands, Ryoichi’s bravery and courage managed to stall the Chinese forces long enough to spare Manchukuo from invasion.  \n\nRyoichi’s charisma and capable leadership was instrumental in putting down the Korean Uprising of 1981. For his role in keeping Chōsen under the Japanese thumb, Ryoichi was promoted to Chief of Staff of the Imperial Japanese Army in 1985. In 1994, he was appointed to his current role —  Japan’s Minister of Defense under Prime Minister Ishihara Shintaro. \n\nBefore the end of his tenure, Oriki Ryoichi intends to leave the Co-Prosperity Sphere a far different place than it was before him. As Japan's Empire is slowly picked apart by Communists and Western saboteurs, his hardline stance with regard to dealing with rebellious elements in Japan's sphere is a far cry from his soft-hearted predecessors."
 JAP_minister_Yoriko_Kawaguchi_for_desc: "--------------\nBorn in the heart of Tokyo in the midst of the Second World War, Yoriko Kawaguchi is Japan’s top diplomat in an era in which the Rising Sun recedes ever further into a defensive shell of isolation. Kawaguchi, whose resume sports degrees in both International Relations and Economics, began her governmental career in the Mid-1960s as an economic and trade advisor within Japan’s Department of Foreign Affairs. \n\nKawaguchi would go on to make several high-profile connections during her time in Foreign Affairs, particularly with members of the Sakigiku Mintō party. In the early 70s, Kawaguchi’s work would take her to the Japanese Embassy in Washington, D.C., where she would eventually be nominated as the Japanese Ambassador to America in 1985. \n\nWith Ishihara Shintaro’s rise to power in 1992, Kawaguchi’s wealth of diplomatic experience, particularly in dealing with the Americans, made her an obvious pick for the incoming Prime Minister’s new Minister of Foreign Affairs. While Kawaguchi is mostly well-aligned with Shintaro’s views, she notably differs in terms of her support for Sakoku-kai thought, which posits that Japan should take a more active role in Asian affairs. Tensions are currently low between the Prime Minister and his top diplomat, but, as the most dramatic century in world history limps toward the finish line, the smallest geopolitical spark could change that dynamic in the blink of an eye."
 JAP_minister_Hiranuma_Takeo_eco_desc: "--------------\nTakeo Hiranuma was born in Tokyo in 1939 during the Second Sino-Japanese War. At the time, his Mother was the great-niece of then-Prime-Minister Kiichirō Hiranuma; Takeo was adopted into the Hiranuma family. As a young man, Hiranuma attended Keio University, using his experience to kick-start his political career working as an aide for Eisaku Satō, another erstwhile Primer Minister. \n\nHiranuma was initially assigned to be Japan’s Vice Minister of Finance in 1983. In 1993, he was promoted to Minister of Transport, and thereafter Minister of Economy in 1995. In his current role, Hiranuma is a known friend of big business, bailing out the Daiei Supermarket Chain in 1996 and attempting to Privatize the Postal Service of Japan. \n\nHiranuma is well-known for making contentious remarks and holding radical racial positions, having spoken out many times against reconciliation and ethical treatment of Chinese, Korean and Taiwanese civilians. When Japan's credit rating was downgraded as a result of the Yasuda Crisis, Hiranuma infamously remarked into a hot microphone; 'Half of South Africa's people are AIDS patients! How could our credit rating possibly be lower than theirs?!' It is no surprise, then, that Prime Minister Shintaro entrusted Hiranuma to be his Economy Minister, given their similar views and cordial relationship."
