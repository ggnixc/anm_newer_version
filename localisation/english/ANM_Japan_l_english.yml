## Descriptions ##
# Country Leader #
 POLITICS_YASUO_FUKADA_DESC: "The heir to Japanese conservatism, the world expected a lot more of Yasuo Fukuda’s leadership of Japan. Born to the arbiter of Japan’s conservative revolution, Fukuda Takeo, it was expected that little Yasuo would follow his father into politics. Now 60 years later, it seems that Yasuo has fulfilled his father's legacy, at least on the surface. Entering national politics at the age of 54, he never reached the prominence that his father did, preferring to be a backbencher to more charismatic politicians like Michio Ochi and Ibuki Bunmei.\n\nNominated to be prime minister by his father’s old friends within the party, Yasuo would inherit an unstable Japan, ruined after the scandals of Michio. A shy man, he never carried the appeal of his predecessors and largely served the whims of his cabinet as a figurehead. While having solved some of the problems of the former ministry, Japanese society remains polarized and fractured, leaving Yasuo to ponder whether he has lived up to his father’s hopes or doomed Japan to a dark future."
 POLITICS_KOJI_KAKIZAWA_DESC: "The face of opposition and radicalism within the Kaihatsuto, Kakizawa is regarded by many of his peers as a brilliant yet arrogant bureaucrat, making friends within the party as quickly as he makes enemies. Another alumni of the prestigious School of Law at Tokyo Imperial University, Kakizawa would begin to work in the Ministry of Finance in 1960, Kakizawa would be assigned to development of Kyōeiken economies, aiding countries like Kampuchea, Vietnam and Hindustan. Returning to domestic work around the Oil Crisis, Kakizawa would ascend to being the Director of Budget Affairs for the Miyazawa ministry.\n\nFollowing the collapse of the ministry, Kakizawa and several other young bureaucrats would be drawn to the rapidly rising Young Technocrats faction, standing in opposition to the establishment. Remaining a stalwart for the faction throughout the Bronze Decade, he would be left as one of the only founders as most of his peers were exiled to Guangdong as the Ōkurashōkachū set in. Leading the newly constituted New Technocrats in opposition to the corrupt and nepotistic post-political structure of the Ōkurashōkachū, he would become a popular opposition leader. Through the failures of Fukuda, Bunmei and Ikeda, Kakizawa has finally ascended to the top of the system, determined to remake Japan in his vision and return it to the glories of the 70s."
 POLITICS_YUKIJIKO_IKEDA_DESC: "Another arbiter of a political family within Japan, Yukihiko Ikeda owes a lot to his father-in-law and seeming namesake, Hayato Ikeda. Joining the Ministry of Finance in 1961, and married into Ikeda’s family through his only daughter, Keiko. Establishing a background in foreign affairs and finance policy, Ikeda quickly became one of the paragons of the Kaihatsuto.\n\nInstrumental in the creation of the Ōkurashōkachū along with his mentor Kiichi Miyazawa, Ikeda quickly rose within the ranks of the party, becoming leader of the neo-conservative technocrats in opposition to  the Fukudites. Now at the helm of the nation, Ikeda hopes to lead Japan into a future of united, common-sense, post-political society, seemingly making the Ōkurashōkachū a vehicle of popular will."
 POLITICS_IBUKI_BUNMEI_DESC: "Coming from a premier political dynasty within Japanese politics, Ibuki Bunmei is renowned for being one of the primary architects of the Ōkurashōkachū system, or Finance Dynasty. Graduating from Kyoto Imperial University, Bunmei would find his calling in the Finance Ministry, finding a place in the Secretarial Division, managing the resources and employees of the Ministry. Joining Kaya Okinori’s faction of finance bureaucrats, he would forge friendships with Hideo Bo and Michio Ochi, influential members of Fukuda’s clade.\n\nBiding in his time in the shadows during, Bunmei would rise to power during the second Miyazawa ministry where he partook in the shaping of the new system that would dominate Japanese politics for the future. Having to see the downfall of his friend Michio Ochi, Bunmei would ascend to being the party’s secretary-general, the second most important position in Japan. Revealing himself from the shadows, Bunmei seeks the rationalization of the Japanese state, eliminating the concept of politics and truly maximizing the control of Ōkurashōkachū to realize a perfect, utopian society of economic maximization, apolitical government, and most of all, total subordination to order."
# Ministers # 
 JAP_Ibuki_Bunmei_hog_desc: "Coming from a premier political dynasty within Japanese politics, Ibuki Bunmei is renowned for being one of the primary architects of the Ōkurashōkachū system, or Finance Dynasty. Graduating from Kyoto Imperial University, Bunmei would find his calling in the Finance Ministry, finding a place in the Secretarial Division, managing the resources and employees of the Ministry. Joining Kaya Okinori’s faction of finance bureaucrats, he would forge friendships with Hideo Bo and Michio Ochi, influential members of Fukuda’s clade.\n\nBiding his time in the shadows during the Bronze Decade, Bunmei would rise to power during the second Miyazawa ministry where he partook in the shaping of the new system that would dominate Japanese politics for the future. Having to see the downfall of his friend Michio Ochi, Bunmei would ascend to being the party’s secretary-general, the second most important position in Japan. Effectively the leader of Japan through his strong-arming of Yasuo, Bunmei plots to take the reins for himself and discard the bumbling fool into the dustbin of history."
 JAP_Hiroshi_Miyazawa_sec_desc: "The son of career politician Yutaka Miyazawa, Hiroshi Miyazawa has always been overshadowed by his more charismatic and influential brother. Entering the Ministry of Home Affairs during the same timeframe of his brother’s rise in the Ministry of Finance, doing administrative work in Chiba Prefecture post-Great East Asian War. Working as the Chief Cabinet Secretary for the Ministry of Home Affairs during the Okinori ministry, Miyazawa would be recognized as one of the more competent officials within the network of patronage and nepotism.\n\nFollowing his brother’s ascendancy to prime minister, Miyazawa would be appointed to the head of the Ministry of Home Affairs, aiding in the implementation of his brother’s primary project, the Social Asset Development Program, seen as a limited success. After the collapse of his brother’s government, Miyazawa would stay out from politics throughout the Bronze Decade, but returned and became a key player in the Ōkurashōkachū. Now, Miyazawa has returned to being the head of the Home Affairs Ministry, with many rumors that he acts as an agent of his recently retired brother’s will, and a ticking time bomb within the ministry."
 JAP_Tadao_Chino_eco_desc: "One of the few non-dynastic politicians within the current ministry, Chino’s appointment as the Finance Minister, a position regarded as the second most powerful in Japan, comes as a result of the inherent compromise between the factions in the  Ōkurashōkachū. Coming from a humble middle class background in Shizuoka Prefecture, Chino would attend the Tokyo Imperial University and gain a degree in law, graduating at the top of his class.\n\nJoining the Ministry of Finance and working at the Budget Bureau, Chino would establish good connections with much of the Japanese political establishment while staying out of factional politics. Heading the Budget Bureau throughout much of the late 80s and early 90s, Chino would be appointed as finance minister during Michio Ochi’s ministry, the only minister who survived the collapse of his ministry due to his popularity and competence. As Finance Minister under Fukuda, Chino seeks to reconcile factionalism within his ministry, recovering from the recession of 1992 and lead Japan into a future of economic prosperity."
 JAP_Yukihiko_Ikeda_for_desc: "Another arbiter of a political family within Japan, Yukihiko Ikeda owes a lot to his father-in-law and seeming namesake, Hayato Ikeda. Joining the Ministry of Finance in 1961, and married into Ikeda’s family through his only daughter, Keiko. Establishing a background in foreign affairs and finance policy, Ikeda quickly became one of the paragons of the Kaihatsuto.\n\nInstrumental in the creation of the Ōkurashōkachū along with his mentor Kiichi Miyazawa, Ikeda quickly rose within the ranks of the party, becoming leader of the Keynesian technocrats in opposition with the Fukudites. As the country languishes in political disorder and instability, Ikeda wonders of alternatives to his creation, troubled by the chaos of his home nation."
 
### Starting Ideas ###
 JAP_Samurai_and_Wolf: "The Samurai and the Wolf"
 JAP_Samurai_and_Wolf_desc: "A bond forged in the flames of the new order, the Italo-Japanese relationship has withstood the test of the turmoil and upheaval of the Cold War. Japanese technology, economic assistance, and geopolitical backing are vital for Italy’s ever-fracturing grip on its new Roman Empire while the Italian monopoly on oil and its continued prevention of total German domination of Europe are both key to global Japanese hegemony. Whatever the new millennium may hold, one thing is for certain, the bond between the samurai and the wolf shall never be shattered."
 JAP_Two_Suns_One_Sky: "Two Suns, One Sky"
 JAP_Two_Suns_One_Sky_desc: "On November 5th, 1943, Wang Jingwei and Hideki Tojo signed an agreement to a hundred years of cooperation between China and Japan, and a millennium of pan-Asian prosperity. But the promise of the twin dragons taking their place in the sun was a lie, and the Japanese’s prosperity was founded on the sweat and the blood of the people of China.\n\nWith the Middle Kingdom's rapid modernization and the Japanese's failure to bring it under their boot, an uneasy tension has settled as the two powers now tread the balance that holds the continent together. As spheres of influence are carved out, it soon becomes apparent that this continent is not big enough to contain two competing ideologies, two competing visions of pan-Asianism, much less two different superpowers."
 JAP_Legacy_of_Bronzes: "A Legacy of Bronzes"
 JAP_Legacy_of_Bronzes_desc: "In 1975, the Japanese Empire could be considered the definitive global hegemon. A booming economy that showed no tears from the energy crisis, a stable political scene with a leader wielding a popular mandate, and a society eager for the future.\n\nThis would all come crashing down in a week, as Japanese society entered a period of social turmoil, political instability, and economic malaise termed the Bronze Decade. Although long over, the Bronze Decade’s legacy still leaves deep scars, and a hidden rot within national institutions, ideology, and culture."
 JAP_Okurajotai: "Ōkurajōtai"
 JAP_Okurajotai_desc: "After the disaster of the Yasuda Crisis, a new faction would take the reins of control from the disgraced Home Ministry Clique, the Finance Ministry Clique, an association of Keynesian technocrats seeking to maximize the economic efficiency and growth of Japan.\n\nNow, more than 3 decades later, the institutional influence of the Finance Ministry has been embedded into the very fabric of Japanese society and politics. The brightest Japanese minds go on to work within the ministry, while most of the government is composed of Finance Ministry veterans, even in non-Finance positions. The Home Isles have been transformed into a machine, one to maximize economic efficiency and growth, and another Yasuda will never happen."
 JAP_Mas_Maiorum: "Mos Maiorum"
 JAP_Mas_Maiorum_desc: "With the fires of the Bronze Decade ravaging Japan, a cabal of radical differences and rivalries would come together for unity, stability and most of all, power. Their goal was to radically transform the Japanese political scene, one in freefall, into the politically efficient machine it is today, one without the flaws or shortcomings of the previous system.\n\nOnce regarded as a solution of political perfection, the Finance Dynasty has now fallen out of favor with most Japanese citizens and political actors. As fierce opposition from the revived New Technocrats mounts and the independent liberal opposition sways more of the population to their cause, it becomes apparent that this system will either fix its flaws to see the future or fail like every other political order in Japanese history."

