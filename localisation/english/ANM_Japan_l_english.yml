 #starting Ideas

 JAP_Colonial_Crisis: "Colonial Crisis"
 JAP_Colonial_Crisis_desc: "For decades, the Empire’s so-called “Co-Prosperity Sphere” has devolved into an increasingly- fractured mosaic of resentment, inefficiency, and chaos. Anti-Japanese sentiment, Independence Movements, and a neverending plague of armed revolts against the Collaborator Governments teem under the surface like worms squirming beneath a rock. \n\nIn Chōsen, resistance has steadily grown even after the brutally-crushed revolt of 1981. The leaders of Papua New Guinea stubbornly demand ever-greater autonomy. Even more-independent allies like Thailand and Indonesia have drifted away from Tokyo, inching closer to the United States and the emergent Soviet Union with every passing day. \n\nEven the most optimistic within the Collaborator Governments acknowledge the bed of dry kindling their house is built upon. A single wayward spark could light a blaze strong enough to bring the whole system down.  To the pessimists, it isn’t a question of if, but when."

 JAP_The_Dimming_Sun: "The Dimming Sun"
 JAP_The_Dimming_Sun_desc: "Thirty years ago, a billion subjects across the East kowtowed to the Rising Sun — the Master of Asia. Where did it all go wrong? \n\nAzad Hind is history, wrestled out of Japan’s grasp by the Republic of India. Both China and Indochina ravaged the Sphere with cataclysmic, costly rebellions, abandoning the Empire and cutting it off from a vital artery of natural and human resources. \n\nThe Japan of today, cruelly dubbed the “Sick Man of Asia” by geopolitical foes eager to point and laugh, is a far cry from the mighty hegemon it once was. The economy stagnates. Enemies foreign and domestic meddle constantly in Tokyo’s affairs. New parties emerge from the left and right as half-baked democratic reforms cast the National Diet into an era of disorder and instability. \n\nHas the Land of the Rising Sun finally set?"

 JAP_The_Democratic_Facade: "The Democratic Façade"
 JAP_The_Democratic_Facade_desc: "Japan has existed as a democratic state for more than a decade. In theory, the people can vote for any politician they please, but in practice, Japan’s political right-wing remains an overwhelmingly dominant force in the country thanks to the Imperial Political Bureau. \n\nThe organization, which reports to none other than the Emperor himself, keeps the government on a short leash in the name of preventing "violations of Imperial Policy.” The Bureau has the final say in drawing polling districts, shaping voting laws, and apportioning seats in the National Diet. The end result of such political meddling is a system that is insurmountably biased toward the interests of the rich and powerful, ensuring that true Liberal Democracy is never achieved in Japan."

 JAP_The_Economic_Web: "The Economic Web"
 JAP_The_Economic_Web_desc: "The Japanese economy is wide in breadth, but spread perilously thin. The Home Islands rely on Indonesia for manufactured goods, depend on Thailand to produce consumer goods and services, and would wither on the vine without the constant flow of foreign currency from Chōsen. \n\nAs Japan’s stagnating economy continues to claw itself out of the bottomless chasm of decline, its weakend borrowing power and lower debt limit serve only as weights to pull them deeper into the depths.  With interest rates hovering at historic lows, however, the Government, closely linked to the Zaibatsus which permeate throughout its sphere, isn’t too concerned. \n\nJapan, it seems, has failed to learn from the Yasuda Crisis. Should any cogs in the economic web falter, history shall repeat itself, and Nippon will burn."

 #Events

 JAP.general.1.t: "The Curtains Fall"
 JAP.general.1.desc: "In Conference Room 3C of the Boeing Head Offices in Chicago, five of the company’s best financial analysts were tasked with looking into the Mitsubishi Aircraft Corporation, a subsidiary of the massive Mitsubishi Corporation. The MAC, despite only being in business for less than a decade, was already making inroads with Latin American Airlines which previously were strong customers of Boeing. Thomas led the team looking into their financial records to see how the company was able to expand so aggressively.\n\nThomas was tired. Usually, he goes home at 7 PM, but this important task from his supervisor forced him to stay late. He turned his head towards the only clock in the room. 2:13 AM. Thank God it was the weekend he didn’t have to come to work tomorrow, or I guess today if we’re being technical. The group was looking into the company’s profits, which were decent for a rapidly expanding company, but where did they get the money to expand so aggressively? The Head Mitsubishi Corporation has several subsidiaries, so it can’t spare that much, even with its gigantic scale in the Japanese Economy.\n\nThomas grabbed a sheet on the company’s debts, reading over it, he widened his eyes. He found the source. The MAC was taking several loans out from different Japanese banks, and these loans were massive. The company’s meagre profits (when compared to the loans), which they only managed to get in the green in the last 11 quarters, couldn’t possibly pay back the interest on the loans, let alone the lump sums. His eyes darted to the interest rates for the loans on the sheet. By God, he saw it now. The rates were extremely low, far lower than the banks here in America offered. That’s how the company kept itself afloat. Thomas slammed the sheet back on the table and thought to himself."
 JAP.general.1.a: "“No way this is sustainable.”"
 JAP.general.2.t: "Do Your Research"
 JAP.general.2.desc: "Gösta Selander was never a huge fan of flights. He wasn’t scared of flying, but he always preferred to have his feet on the ground. He always preferred using trains, buses or his car when he needed to. It didn’t help that his flight to Tokyo took over 15 hours. At least he could get some sleep during the flight.\n\n“First time flying?”, Gösta heard from his right. As he turned his head, he saw an elderly Japanese man smiling at him. “No, I’ve flown before I’m just not a huge fan of flying myself”.\n\n“Well it’s gonna be a long flight so I’d advise going to sleep for most of the trip, easy way to relax, that’s what I used to do when I needed to relax for my flights to Europe”, the man replied. Gösta thought about it, it seemed like a pretty good idea. “Sounds good, it’d be nice to destress before I land in Japan.”\n\nThe elderly Japanese man stuck out his hand, which Gösta shook. “I’m Kamata Taheiji, I work in Sweden for the Mitsubishi Motors' Scandinavia Division”, Taheiji said to Gösta, waiting for the man to talk about himself. “Gösta Selander, I’m flying to Tokyo to research Japan’s involvement in the Second World War…"
 JAP.general.2.a: "“And I work for Paradox.”"
 JAP.general.3.t: "A Good-Natured Debate"
 JAP.general.3.desc: "YamatoBro45- Everyone is always talking about how China rebelling against their rightful masters a disaster for us, but the Chinese should’ve been grateful to us for helping with their modernisation and industrialisation, if it wasn’t for us they’d still be living in bamboo huts.\n\nTheAosaginohi999- Shut the fuck up you Hirohito bootlicker. You “Pan-Asian” idiots really believe Japan is fucking destined to rule over everyone instead of letting them decide for themselves because we’re somehow superior.\n\n77WindMaster- Oh no we got one of those Anti-Monarchists in here.\n\nYamatoBro45- Damn straight we’re destined to rule over everyone, Pan-Asianism is the future, together under our Leadership Asia could’ve entered a Golden Age until the damn Chinese betrayed us.\n\nTheAosaginohi999- Holy fuck you are dumb, did they ever teach you about what we really did in China to you in School. Don’t worry you can ask your history teacher once the weekend is over.\n\nSoBoLoHo- Guys, please calm down, I don’t want this chatroom to be taken down by the mods. I mean the original topic was on what your favourite Japanese mythological creature was you children.\n\nTheAosaginohi999- Shut up and suck my nuts, what the hell is the Imperial Family gonna do to me if I don’t shut up.\n\nModerator Bot- This Chatroom has been closed and no more messages shall be sent under the orders of the Imperial Political Bureau for [Spreading Anti-Imperial Family Propaganda]. Accounts engaged in this activity have been suspended and are uhe meantime."
 JAP.general.3.a: "The Imperial Family shouldn’t be the one you worry about."nder review for their actions. Please use a different chatroom in t

 #Leader

 POLITICS_ISHIHARA_SHINTARO_DESC: "Since the end of the Great Asian War, the roaring flame of the Japanese Empire has shrunk down to a flickering ember. Driven into a corner, the embattled nation doubled down on many of its most nationalistic policies, expelling all foreigners, enacting strict racial laws, and banning all non-Japanese from residing within the country. For some, these laws went too far — according to Ishihara Shintaro, they didn't go far enough. \n\nBorn to a middle-class family in 1932, Shintaro attended Hitotsubashi University in hopes of becoming a famous writer. After obtaining his diploma, he began writing plays and novels before eventually joining the staff of a local newspaper in the 1960s. After years of tight deadlines and late nights, Shintaro would become disillusioned with his writing career, and would quit his job to join up with the Imperial Japanese Army in the late 60s. In the Army, Shintaro was stationed in Vietnam, where he fought the Communist Revolutionaries in the Viet Minh well into the early 70s. \n\nIn 1972, Shintaro returned to Japan to enter the world of politics. After only three years, he would be elected to what would later become Tokyo’s longest-lasting governorship. Despite his litany of controversial statements on women, race, and religion, leading the most populous prefecture in the country earned Shintaro no shortage of political influence. Shintaro helped to form the Chrysanthemum Party with several of his right-wing compatriots after Japan democratized in 1981. Governor Shintaro quickly ascended the ranks of the party, and when then-Prime-Minister Fukuda Takeo stepped down in 1992, the prolific Shintaro succeeded him with ease. \n\nSome had hoped that Prime Minister Shintaro would tone down the inflammatory statements he’d gained a reputation for making as Tokyo’s Governor, but this fantasy did not come to pass. A fierce Japanese Nationalist to his core, Shintaro hasn’t been shy about making his ideals known to the public, no matter how controversial they may be. Even after four years as Japan’s Prime Minister, Ishihara Shintaro’s plans for his country are just getting started. Many outside Japan brush off Shintaro's oft-repeated promise to have the 'Rising Sun shine anew over East Asia' as his typical fiery rhetoric — but others aren’t so sure."

 ## Ministers ##
 
