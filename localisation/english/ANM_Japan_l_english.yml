 JAP_get_law_tooltip: "[GetAssortedLawsDescJAP]"
 JAP_Economic_Management_Board_desc: "Since the §eYasuda Crisis§! in 1963, the §GEconomic Management Board§! has been the cornerstone of Japanese economic and financial policy as the state’s primary economic entity. Through strict adherence to an emulation of §qdirigist§! policy, §Gthe Economic Management Board§! sets economic targets and areas of development, which enterprises and zaibatsus are “encouraged” to follow. By setting targets and growth areas, the Board ensures a §d“permanent development”§! policy that allows Japan to grow its economy and constantly weather §Ceconomic crises§!."
 JAP_Asian_Humanist_Urbanization_desc: "Since the rapid expansion of §PJapanese§! urban areas, guidelines established under the ministry of §cKaya Okinori§! have outlined the characteristics and aesthetics of the Japanese metropolises. Focusing on §Straditionalist§! architecture in public settings, mass transit through the §iShinkansen§! network, and the construction of natural beauties like public gardens and parks, the §PAsian Humanist§! model for urbanization has seen the construction of some of the world’s most habitable cities."
 JAP_Zenkoku_Nochikaiho_desc: "The cornerstone of §gFukuda Takeo’s§! ministry, the §GNochikaiho§!, as it is known within Japanese society, transformed the §Speasantry§! of Japan from a low social class to one of the bastions of political influence within Japan. Redistributing large §dzaibatsu§! plots to small-scale farmers, strengthened Japanese agricultural stability by nearly doubling agrarian output. However, the loopholes left open by the §GFukuda§! ministry allowed for the continued exploitation of the Japanese §Speasants§!, a major cause of discontent and a factor in the §OBronze Decade§!."
 JAP_National_Security_Act_desc: "One of the most important pieces of legislation in modern history, the §ENational Security Act§! was the landmark policy in the quelling of the §Jdecade of disorder§! that plagued Japan. Granting the government unlimited powers in the case of vaguely defined “large-scale public unrest”, the act has entrenched the §Enational security state§! into Japanese public affairs, with the national and metropolitan police forces using excessive violence, surveillance and sometimes even torturing dissidents ranging from §Dstudent activists§! to §ecommunist§! laborers.\n\nAlthough the legislation was seen as a necessary measure in calming the country down, many within the opposing §Ddemocratic parties§! and the faction of §cNew Technocrats§! within the §cKaihatsuto§! heavily oppose it, making it one of the most polarizing issues in today’s §PJapan§!."
 JAP_Imperial_Citizenship_Law_desc: "The most controversial act in Japanese history, the §JImperial Citizenship Law of 1983§! granted §Dpolitical rights§! to all of the colonies of the Japanese empire, from §CChosen§! to §SUraijo§!. Championed and passed by the eccentric §gconservative§! Juro Matsumoto, it was met with wide positive §einternational§! reception.\n\nWhile granted suffrage and all the political rights of a Mainlander, the restriction lies in the representation in the §cImperial Diet§!, with §CChosen§! and §IFormosa§! netting around 44 seats, compared to the §oHome Islands’§! 465."
 JAP_Paternalistic_Democracy_desc: "With Fukuda Takeo’s dissolution of the §cYokusan Seijikai§! following the fallout of the §SSuccession Crisis§!, Japan returned to its pre-war political system, ostensibly a §Ddemocratic constitutional monarchy§!. However, many international observers and domestic experts have designated Japan a §Lpaternalistic democracy§!, rather than a traditional §Dliberal democracy§!.\n\nWhile the incumbent §rNational Development Group§! or the §rKaihatsuto§! ensures free elections, its §hpartification§! of several state institutions, a non-transparent electoral process, and the consistent targeting of political dissidents has ensured that Japan remains an §Lilliberal§! democracy, one that always ensures a victory for its incumbent party."


