## General Events ##
 JAP.general.1.t: "Red Reflections"
 JAP.general.1.desc: "Snow fell hard on a chilly Sapporo night, the bright red-blue lights reflected off the young officer's visor as he stood in formation outside the seemingly abandoned apartment. He tightened his grip on his rifle, trying to fight the gnawing feeling in his stomach. The orders had sounded easy enough: reports indicated a possible Kakumaru-ha stronghold that needed to be exterminated—sweep the building, neutralize any resistance, and arrest the remaining militants. It had all seemed so simple in the briefing. But now, he couldn’t shake a creeping sense of dread. When the first crackle of orders came over the radio, the Sergeant signaled to breach.\n\nThey burst through the entrance, and chaos erupted instantly. Shots rang out as orders and shouts blended with the gunfire. Charging down the narrow halls, every corner turned into a fortification. The thick smoke hazed his vision as shots buzzed past him, hitting several of his fellow officers. He raised his rifle and fired blindly into the wall of smoke.\n\nAs the shroud cleared momentarily, he froze, the weight of his rifle growing heavy in his hands. There, staring back at him, were the dead, blank eyes of a boy—barely college age—a face he'd seen almost every day. It was the neighbor's son. The chaos around him continued yet for a brief moment, everything faded into silence. The screech of his radio jolted him back. The Sergeant was ordering to fallback; the militants had escaped through an emergency exit, and casualties were too severe to continue. Local police would secure the scene. As he evacuated from the scene with his fellow officers, he couldn't shake the feeling of sorrow, as the hot tears falling from his face would melt the snow beneath him, carrying him onto another day."
 JAP.general.1.a: "Red snow, fading echoes."
 JAP.general.2.t: "Moment of Reckoning"
 JAP.general.2.desc: "“Today’s the day, man,” Hiro said anxiously to Shindo, tension in his voice as they, like so many others, headed to see the recruits for the Ministry of Finance.\n“Calm down man, with our performances on our exams and the interviews, there’s no way the Ministry would deny us”, Shindo responded, “I mean, the fact we got into a place like this to begin with basically makes us shoe-ins. Kyoto Imperial fucking University isn’t exactly some no-name school. This is gonna it, man. We’re finally in the big leagues.”\n\nHiro’s anxiety was calmed by his old friend and they approached the list. They had to push through the people huddled around the slip of paper on the wall, the slip that would decide their futures. Lo and behold, Hiro found his own name, breathing a sigh of relief, and beaming with satisfaction as he looked to Shindo, whose expression showed only devastation, the huddled crowd dispersing.\n\n“Oh, Shindo…”, he put his hand on his shoulder, “It’s gonna be ok, we’ll figure something out. Maybe we can get you reeval—”\n\n“FUCK YEAH!”, he was interrupted, “I’m set for life guys!”, an athlete, Kazuma, Hiro remembered, was celebrating his recruitment with some buddies, but that made no sense. The man had terrible grades and had even been suspended for missing too many classes. How could someone like him be considered worthy by the Ministry when Shindo wasn’t?\n“My dad’s gonna finally be off my ass!”, Kazuma then exclaimed, and that’s when he remembered: The bastard’s dad worked at the budget bureau. It all made sense now. Old-fashioned nepotism. All too common in today’s world. He wished he could do something about this, something to make it so power was given to the ones who deserved it.\n\nThen, just next to the recruitment paper on the bulletin board, something caught his eye. A poster for those “New Technocrats” he remembered hearing about. A group of political outsiders  critiquing the government and who were part of one of the KHS’s rapidly rising political research councils. Now, Hiro wasn’t one to jump on political bandwagons, but he couldn’t deny that, given the circumstances, the poster’s proposition enticed him. He recalled seeing an office for the party not too far from the school. Perhaps he could drop in, and see how he could help."
 JAP.general.2.a: " Nothing is permanent — except the promise of change."
 JAP.general.3.t: "Saturday Night Live"
 JAP.general.3.desc: "As the sun set on Nagasaki, detectives Jiro Hayashi and Kin Saito would enter Bar Nagare, a frequent location for cops in the Hamamachi district. Officially off-duty, the two stalwart friends were retiring for the night.\n\n“Hey, barkeep! Get us two pints of Yebisu” shouted Hayashi, as both of them sat down in a corner. With the communist presence mainly focused in Honshu and Shikoku, Nagasaki police mainly tackled petty crimes and the occasional yakuza activities from the local Kyūshū-Ozaki-kai. As Saito got up to fetch their beers from the counter, Hayashi began to fiddle with his holster, reminded of the string of killings that had been occurring in Nagasaki, the majority of the victims being dockworkers.\n\nWhen Saito returned with the pints, Hayashi asked, “What do you think is happening in Nagasaki Port?”\n\nSaito took a sip. “To be honest, I think it’s a case of loan sharks, maybe related to the Bōryokudan.”\n\n“No, no,” Hayashi shook his head in disagreement, “The Bōryokudan don’t dump bodies in the harbor. Too amateurish. This is someone else, a newer person or organization.”\n\n“Hm,” Saito took another sip, “Maybe you’re onto something.”\n\nThe conversation would quickly shift from the murders to local sports, to the elections in Nagasaki. Hayashi was a staunch liberal while Saito was more inclined towards the KHS. As they got up to leave the bar and go home, Hayashi would pay the barkeep and they both exited the bar together.\nBefore the door had even closed behind them, they witnessed a man fall onto the sidewalk, his body crumpling across the pavement.The man gurgled, choking on something as they rushed over to help. \nThey flipped him over. The man’s body was riddled with stab wounds, and his legs were mush from the jump. As Saito patted him down for some form of identification, Hayashi looked up to see a mysterious figure on the rooftop of the building next to the bar, a tax office for the local government. The figure stayed on the roof briefly before disappearing, presumably running off the rooftop."
 JAP.general.3.a: "A game is afoot."
 JAP.general.4.t: "A Dragon in Slumber"
 JAP.general.4.desc: "In the Reception Hall of the Presidential Palace, tension simmered. On one side sat the Chinese delegation, a seemingly-endless mixture of gray and black suits. Across the polished Huanghuali table sat the Japanese delegation, led by Foreign Minister Yukihiko Ikeda, who remained composed, though his softly tapping pen betrayed his unease. They had gathered here today at the Chinese government's insistence on renegotiating the Pearl Treaty, the agreement deciding the formal integration of much of Guangdong province into the proper territory of China.\n\n“The economic and strategic importance of the Three Pearls to China’s national security is too great to continue to go undiscussed,” a Chinese delegate began, his tone measured. “We are prepared to offer the port assets of Wenzhou and Tianjin — as well as major trade concessions in coal and natural gas resources — to Japan with a guarantee of protection for all Japanese assets in the Pearls. In return, we seek formal annexation of Hong Kong, Macao, and Guangzhou. This new treaty will meet Japan's energy needs, address its concerns over naval and trade ports, and foster greater cooperation across the Co-Prosperity Sphere.”\n\nIkeda nodded slightly. “China’s perspective is clear, but the annexation of these cities raises serious concerns. Dual sovereignty over the Three Pearls was guaranteed under the current treaty. The implications of this shift could disrupt the fragile balance of the current status quo. We must be able to negotiate a less drastic compromise, especially harsher concessions on the Chinese side if we were to abolish the dual sovereignty of the Pearls.”\n\n“No offense, Minister, but your statements are shortsighted and fail to consider the broader interests of the Pan-Asian project. Without these vital cities, China can nev—”\n\nA younger Japanese delegate cut in sharply. “This is outrageous! You’re demanding submission, not cooperation!” His voice echoed, shattering the fragile calm. “All you wish to do is erode Japanese power in the region, and I will not stand for it!”"
 JAP.general.4.a: "Somewhere in the room, a kettle whistled."
 JAP.general.5.t: "Poking the Dragon"
 JAP.general.5.desc: "The Chinese delegate's eyes narrowed. “Accusations will not resolve anything. If Japan views our terms as unreasonable, perhaps we should reassess our broader cooperation.”\n\n“Gentlemen, please,” Ikeda raised his hand, “We must focus on solutions.” Yet the mood had soured irreparably. Heated barbs flew across the table, and the discussion devolved into acrimony.\n\n“Japan cannot maintain this occupation forever!”\n\n“You only wish to dismantle Japan from within!”\n\n “Excuse me? We will not tolerate any more of this disrespect!”\n\nWith the chairs crashing harshly against the wooden floor, the Chinese delegation rose, glaring down at the Japanese delegates before exiting the chamber without another word.\n\nThe room was thick with frustration. As the Chinese delegation departed, Ikeda bowed slightly, though his thoughts were heavy. He feared all he had done was awaken a new resolve within the already-cold Chinese, and the struggle that had nearly torn apart the Sphere 20 years ago was coming back in full force."
 JAP.general.5.a: "The western dragon grows restless."