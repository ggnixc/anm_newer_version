 ###LEADER DESCRIPTIONS
 
 POLITICS_MIRIAM_DEFENSOR_DESC: "Born on June 15th, 1945 in collaborator-controlled Iloilo City, Miriam Defensor Santiago earned her law degree from the University of the Philippines in 1969 shortly after the fall of the Second Republic. She later pursued further studies at several different universities in the United States, including Harvard Law School.\n\nIn 1971, Santiago began her career in the administration of President Magsaysay. By 1983, she would be appointed to a judgeship, and by ‘87, elected Senator. In a matter of years, her public service would make her a household name, known throughout the country for her tough stance on political corruption.\n\nSantiago is known to the masses for her sharp wit, fearless personality, and remarkable legal expertise. Since her successful run for the presidency in the 1998 election, Santiago's party has pushed through a multitude of popular reforms designed to combat crime and corruption in the Philippines."
 
