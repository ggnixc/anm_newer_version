  CLL_OFN_Support: "OFN Involvement"
  CLL_OFN_Support_desc: "Despite the historical American animosity against leftism, the Colombian Revolutionary Union receives support from the OFN and is the friendliest side towards it in the Civil War. This is due to the pro-Americanism of the Gaitanistas and the fact that the enemies of the Revolutionary Union are aided by the Dominicans and fascists.\n\nFor now, the OFN and Venezuela have provided plenty of support to the movement, and they will continue to do it so unless the situation were to radically change."

