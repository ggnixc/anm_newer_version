  # Leader Descriptions
  POLITICS_GUADALUPE_SALCEDO_UNDA_DESC: "Despite a wish for stronger institutions, Latin Americans cannot help but admire the romantic guerrilla leader. The old revere Bolívar and Sandino, the youths and intellectuals salute Fidel Castro, and the communists hail Che Guevara. For many Colombians, hope is embodied in their very own Capitán Salcedo.\n\nBorn in an Arauca cattle village to a Liberal family, Salcedo like many country boys was imprisoned for cattle theft. Upon release he was swept up in celebration - Dr. Gaitán, the campesinos' hero, had become President. Gáitan created a paradise for the long-suffering campesinos, taught them the power of direct democracy, and kept the fascists who threatened their traditions at bay. To Salcedo and many others like him, Gáitan was the warm and kindly sun in the sky- and when Gáitan was murdered, an eclipse had descended upon Colombia as the Blackshirts marched. A talented horseman, Salcedo rallied the surrounding villages together and expelled the fascists with his daring guerrilla attacks.\n\nNow the Supreme Commander of the Revolutionary Armed Forces of the Eastern Plains, Salcedo has sworn before his hero's portrait to fight for his menaced ideals, to defend the poor and oppressed and wretched. He sees himself as the modern General Rondón, commanding the cavalry into patriotic salvation, and the utter defeat of the fascist oligarchs who want to rob Colombia of its independence. Gaitán told the people to charge forwards to victory, and Salcedo will lead their charge."

  ### EVENTS ###
  WORLD.30109.t: "[Get_newspaper_header]Government Victory in Colombia!"
  WORLD.30109.desc: "Against all expectations, the National Front has succeeded in the Colombian Civil War. Following the successful ousting of General Rojas Pinilla, the Front went on to defeat the twin threats of fascists and revolutionaries. Promising a stable and safe democracy, one free of the oligarchy of the past, they have signaled their intent to respect Gaitán's wishes, and build a new, liberal society.\n\nTis development has impacted both sides of the Atlantic, as this is an astounding victory for Iberian interests in the region. The Organization of Free Nations has hesitantly recognized the new democracy, with Washington sending congratulations, while Tokyo remains silent. Elections are planned to be held, but concerns have already surfaced that despite the existing power-sharing agreement, the old two-party system has returned."
  WORLD.30109.a: "All that is old, is new again."

  WORLD.30110.t: "[Get_newspaper_header]Revolutionary Victory in Colombia!"
  WORLD.30110.desc: "As guerrillas march uncontested in the streets, the Colombian Revolutionary Union has emerged triumphant. Fighting back both the New Granada fascists and the central government alike, the left-wing faction sparked into revolution by Gaitán's assassination has emerged with an undisputed mandate.\n\nEmbassies from across the Organization of Free Nations and Havana, who backed the Revolutionary Union, have extended their congratulations and support to the new anti-fascist government as it enters into a transitional period.\n\nAs the leaders of the Revolutionary Union prepare to meet in Bogota to vote on a new constitution, it remains to be seen whose vision will emerge triumphant, and take power in the ravaged country."
  WORLD.30110.a: "Potential and uncertainty yet await Colombia."

  WORLD.30111.t: "[Get_newspaper_header]New Granadan Victory in Colombia!"
  WORLD.30111.desc: "With the surrender of the Bogotá government and the Colombian Revolutionary Union, the ultra-rightist coalition of New Granada has won out in the Colombian Civil War.\n\nWelcomed by joyous crowds in Bogotá, the self-declared Duce, Gilberto Alzate Avendaño, held a ceremony proclaiming Colombia's renaming as the "State of New Granada" and was formally declared Duce. Envoys from the former Axis Powers have attended the ceremony with a view on strengthening cooperation with the new regime.\n\nThe only pronouncement from America is a terse note: "The pretender state of New Granada will meet with no recognition from the free world."
  WORLD.30111.a: "It is well done!"
  WORLD.30111.b: "Damn it all to hell!"
  WORLD.30111.c: "I... see."
  
  WORLD.30112.t: "[Get_newspaper_header]Government Victory in the Colombian Civil War!"
  WORLD.30112.desc: "With the New Granada fascists and Revolutionary Union crushed, the self-styled 'Caesar of the Andes' Gustavo Rojas Pinilla has emerged triumphant and put an end to the Civil War. Enjoying significant popular support due to the implementation of numerous populist reforms, Pinilla's position appears unassailable, despite the autocratic nature of his government. As martial law is lifted, Pinilla has already pledged to continue his popular developmental programs.\n\nDespite his victory, the international response has been silence, as all parties who heavily invested in the outcome have now quietly pulled back. Nonetheless, Pinilla has indicated a desire to work with international partners, though with one clear expectation - Colombia will chart its own path, and no one else."
  WORLD.30112.a: "How long can this peace last?"