 #Leaders
 CHI_Zhu_Rongji: "Zhu Rongji"
 POLITICS_ZHU_RONGJI_DESC: "Born in Changsha, Hunan, to a family of wealthy landowners. Raised by his uncle, Zhu Xuefang, after the death of his parents, he graduated from Beijing’s Tsinghua University. Joining a KMT student organization, he became the student leader of the local organization four years after the Great East Asian War ended. He would begin his career as a politician by becoming a civil servant independent of the North China Political Council. Primarily serving in Beijing, Rongji would grow attracted to Chen Gongbo’s Reorganization Faction, primarily because of his earlier ties to socialist organizations. Actively participating in the efforts to sabotage Baisheng’s Five Great Modernizations, Rongji would become a prominent member of the Reorganization Faction through his charisma, oratory skills, and friendliness toward rival members within the government. During Gongbo’s tenure as Premier, Rongji would be appointed the head of Hebei province, primarily focusing on the modernization and development of both Beijing and Tianjin. His state-capitalist policies would earn him great regard as a capable administrator and economic prodigy as Hebei became the second wealthiest province behind Zhejiang Province. During the beginning of the Great Asian War, Rongji’s infrastructure development would prove particularly helpful to ROCAF forces defending against IJA encroachments against Beijing. Mostly seen as a shadow politician, he would become a national hero for leading the city of Beijing through a three-week IJA siege. This popularity would make him unofficially the heir to Zhou Longxiang and the future leader of the Republic, at least before the formation of the Weixinpai faction. With the compromise between the two factions within the GMD, Qiao Shi, a rival of Rongji, would be chosen. Rongji, furious at the outcome, relegated himself to a background role in politics. When Shi retired in 1991, the party elite within the Gaizupai called upon Rongji once more as a partisan candidate to combat the growing influence of the Reformationists. Taking a stance against the market-oriented politics of the Chinese liberals, Rongji’s state-capitalist reforms would significantly reduce corruption within the bureaucracy and business sector at the cost of economic growth. With political polarization growing between the two factions of the GMD and facing external progressive opposition, Rongji seems determined to cement the National Revolution into Chinese society forever. But with the growing cracks in the foundation of the government, Rongji may shatter what he intends to cement."
 
 #Ministers
 CHI_minister_Wen_Jiabao_hog: "Wen Jiabao"
 CHI_minister_Zhang_Qingwei_eco: "Zhang Qingwei"
 CHI_minister_Qian_Qichen_for: "Qian Qichen"
 CHI_minister_Zhou_Tienong_sec: "Zhou Tienong"
 CHI_Wen_Jiabao: "Wen Jiabao"
 CHI_Zhang_Qingwei: "Zhang Qingwei"
 CHI_Qian_Qichen: "Qian Qichen"
 CHI_Zhou_Tienong: "Zhou Tienong"

 CHI_minister_Wen_Jiabao_hog_desc: "Every leader needs a candidate for popular appeal. While populists in China are easier to find than rabbits on a sunny day, no populist can match the charisma and appeal of Wen Jiabao. Beginning his career as a geologist and resource prospector in the Shaanxi region, Jiabao built a reputation as an easygoing man, always listening to the concerns of his employees and subordinates. Through this polite and outgoing demeanor, he constructed a network of patronage, attracting the eye of the rising star, Zhu Rongji. Becoming fast friends, Jiabao would rise rapidly through government posts, becoming an advisor to Premier Zhou Longxiang. While Rongji took a break from politics after Qiao Shi’s appointment, Jiabao was appointed President of the Control Yuan, heading Shi’s central bureaucracy. Jiabao would work with the finance ministers to ensure the government could fund Shi’s reforms, especially in establishing the National Healthcare System. Jiabao’s work establishing the pensions and welfare state would make him very popular in Chinese society, and many people would see him as a statesman who truly cared about the people. When Shi retired in 1992, Jiabao was promoted to the President of the Legislative Yuan, spearheading Rongji’s anti-corruption efforts and limiting the size of the federal bureaucracy. As China enters the new millennium, Jiabao continues to be the popular appeal of the Rongji government, the man with the smiling face and the vanguard of the Reorganization faction."
 CHI_minister_Zhang_Qingwei_eco_desc: "Representing the new generation of the Gaizupai, Qingwei is a relatively new entry into politics.  A technocrat by heart, Qingwei graduated from Northwestern Polytechnical University in Xi’an, studying aerospace engineering. Heading the ROC's nascent air design department, Qingwei would aid the ROCAF’s air force by developing new fighters for the army. Those fighter designs would be instrumental in the Great Asian War by actively engaging Japanese fighters and contesting their air superiority over mainland China. For the success of his fighters, Qingwei was promoted to the chair of the National Science and Technology Commission within the Control Yuan. Heading Chinese research and development efforts into weapons and technology, Qingwei would become a party darling, particularly revered by the elders of the Gaizupai. Leaving his post to his protege, Chen Qiufa, Qingwei became an analyst for the Ministry of Economic Affairs, analyzing the effects of Premier Qiao Shi’s welfare reforms. With the retirement of Qiao Shi, Rongji promoted Qingwei to the head of the Ministry of Economic Affairs, earning Qingwei’s devotion. By formulating several policies to lower inflation from the extensive welfare state and excessive government spending, Qingwei quickly became the leader of the young guard of the Gaizupai. Now, as the Rongji government looks uncertain in the face of financial woes and the economic downturn of the Pearl SEZ, Qingwei looks to be the bright, shining flame of the Gaizupai, leading it into the new millennium."
 CHI_minister_Qian_Qichen_for_desc: "A prominent Chinese diplomat and statesman born in Tianjin, China, Qian has played a crucial role in shaping China's foreign policy and international relations for several decades. Qian held various high-ranking positions in the Chinese government.  Qichen's career in diplomacy began in the 1950s, and he steadily rose through the ranks due to his diplomatic skills and expertise. He is known for his pragmatic and prudent approach, advocating for dialogue and cooperation in international affairs. His contributions to China's foreign policy were characterized by a commitment to maintaining stability and fostering positive relationships with other nations. Playing a significant role in the diplomatic rapprochement between the Soviet Union and China during the late 80s, Qian was appointed official ambassador to the Soviet Union in 1986. Continuing his post until 1992, Qian was promoted to the Minister of Foreign Affairs to begin the policy of broad front diplomacy,  attempting to woo regional rivals like the Soviet Union and the Republic of India to ally against the Empire of Japan. Qian has worked tirelessly to foster good relations with both countries. Still, his personal affairs set a dark shadow over the Rongji government, especially the countless bribes he’s taken from other politicians. Ultimately, if anything could bring Rongji’s government crashing down, it would be Qian’s corruption and revelation of his grievances."
 CHI_minister_Zhou_Tienong_sec_desc: "A graduate in agricultural economics, Zhou began his career in local government and steadily climbed the political ranks. He served in various capacities, displaying a keen interest in rural affairs. His commitment to addressing agricultural challenges led him to become a prominent figure in the agricultural revitalization initiative, advocating for modernization and sustainable practices in farming communities.  Becoming a popular politician among rural communities, Zhou became the vice chair of the Control Yuan during the Qiao Shi premiership. A proponent of bridging the rural-urban divide, he would introduce significant agricultural subsidies into the Chinese economies, allowing for greater income for farmers and ensuring that farmers would have stable incomes. When Zhu Rongji ascended to the post of Premier, he appointed Zhou Tienong as the head of the Control Yuan, the cornerstone of his agricultural policy. Continuing his work as administrator of the Agricultural Bureau, he would ensure the agrarian stability of Chinese society by decentralizing large agricultural producers but keeping the extensive supply chains that kept most of China fed. By doubling agricultural output during his time as President, Zhou would contribute to the growing Chinese economy through significant agricultural exports to the Europakt. Seeing the peasantry of China well-fed, clothed, and educated, Zhou considers his work to be fulfilled and seeks to retire soon."
 
 #starting Ideas
 CHI_Fracturing_Dangguo: "Fracturing Dangguo"
 CHI_Fracturing_Dangguo_desc: "Essential to the government of the Kuomintang since 1921, the principle of the party-state has played a significant role in China's social and economic development. But as progressive democratic opposition to the central government and the Kuomintang itself grows divided among ideological lines, China’s transition to democracy seems to be soon by most international observers. However, as eager as the Chinese populace seems for democracy, the central government disregards this sentiment and shows no inherent desire for a democratic transformation. This has caused the political divide between the liberal-minded factions, the progressive independent organizations, and the Wangist old guard to deepen, with each faction promising their process and management of Minquan."
 CHI_visions: "The Visions of the Father, The Pursuits of the Uncle"
 CHI_visions_desc: "Similar to Mustafa Kemal in Turkey and Juan Peron in Argentina, the ideas of Wang Jingwei and his visions for China have left a complex legacy behind in China. Before Chen Gongbo came to power, Wang Jingwei thought was subject to many interpretations, the only coherent messages of the ideology being pan-Asian nationalism and anti-communism. But Gongbo would establish the ideological framework of Wang Jingwei Thought, defining the social, economic, and foreign aspects that China would need to follow to become a power on the world stage. Constructing a social corporatist economy that combined Japanese-style corporatism and Indian-style socialism to construct an industrial base for China rapidly, Gongbo was seen as the savior of China after the nation’s triumph in the Great Asian War, and Wang Jingwei Thought would become the paramount ideology within the country as every ideologue and political scientist would attempt to interpret it to suit their own needs. Today, the triumph of Wang Jingwei Thought and Chen Gongbo’s interpretations have contributed to the massive legitimacy and popularity behind the Wangist Guomindang government, proving to be troublesome for the Western exiles and KMT reformists that comprise the Weixinpai."
 CHI_incomplete_liberation: "The Incomplete Liberation"
 CHI_incomplete_liberation_desc: "The conclusion of the Great Asian War in 1979 represented the end of the Century of Humiliation in the minds of many Chinese citizens. For the first time in nearly a century,  the Chinese nation had thrown off the yoke of the foreign imperialists. But one thing still lingers in the mind of the Chinese populace, which is the question of Manchuria. The birthplace of the Qing Empire is regarded as a part of China, and the Japanese subjugation of Manchuria by the Japanese is seen as a mark of Chinese national honor. The ideologues within the Kuomintang view the presence of the State of Manchuria as a sign of an incomplete liberation and the recovery of the State of Manchuria as the foremost foreign policy objective for the Republic of China."
 CHI_shadow_of_the_eagle: "Shadows of the Eagle"
 CHI_shadow_of_the_eagle_desc: "With America’s detente with Japan cooling relations and the Soviets pursuing the return of Outer Manchuria, our only aid to fight the Great Asian War came from the German Reich. While many Chinese diplomats regard the partnership as unsavory, we view it as geopolitical pragmatism. Germany provides us with many of their weapons and financial, agricultural, and industrial aid to better develop our country for the second fight with Japan. Unfortunately, much of the world doesn’t see this in the same light. Being sponsored by the Nazis has given us a bad light in the eyes of the rest of the world, and finding allies, or even trade partners, has been quite tricky."

 
 
 #Events
 CHI.general.2.t: "Both sides of the Donghai Sea"
 CHI.general.2.desc: "It has been twenty years since the treaty was signed in Hanseong. The moment when the Chinese and Japanese delegation smiled and shook hands with each other, letting bygones be bygones, is still fresh in people's minds.\n\nGreat changes have taken place in China, Japan, Korea, and across whole Asia. In the 1980s, there were no such many international conglomerates in Korea, no such frequent shuttles or airliners. Nowadays, tall buildings sprang up on the Korean peninsula: Haier, Wanda, Hyundai, Daewoo, Panasonic, Sony, while the flag of blue-sky-and-white-sun and the Nippon flag are flying together in the air - and this scene are often seen in both countries streets. Of course, things like the \"Greater East Asia Co-Prosperity Sphere\" are recognized fascist by both governments exist no more, instead, there is a regional win-win relationship.\n\nSurely there will be some dissidents are calling for \"don't forget the feud between China and Japan\", keeping saying words like \"Nanjing Massacre\", \"Bacteria War and Unit 731\", \"Hanjian\", they are suppressed as ultranationalist like the national protection army. \n\nMost young men don't know this history. For decades, the reorganized government of China has properly sealed all the files about the gap between China and Japan, even directly destroying them. Events like the Nanjing Massacre have been wiped out in the history textbook, for the students, schools never taught anything about hate between China and Japan. \n\nHowever, there will be a few students interested in the forbidden history - hearing a few words from Internet BBS, but there's another more direct way: asking their elders. But in situations like this, they can hardly get any real answers, and most of the replies are:"
 CHI.general.2.a: "\"Over, all of it has been over…\""
 CHI.general.4.t: "No Longer Bloated"
 CHI.general.4.desc: "China has the largest population in the world…at least for the time being. China now has a population of more than one billion, but this number has not increased significantly for a long time.\n\nSince the beginning of the Five Modernizations, in order to achieve high-speed economic development and exploit the market, the authorities have exhausted the so-called "demographic dividend" and built factories and farms with people’s sweat and blood, which indirectly led to a lower fertility rate.\n\nToday, the modernization policy has encountered strange obstacles. In a country with a population of more than one billion, there is a shortage of labor, and a huge mess is in front of the DCP."
 CHI.general.4.a: "There are still more than a billion people, aren't there?"

 CHI.general.10.t: "Dusty desk"
 CHI.general.10.desc: "The day after the announcement of his inauguration, Hu Jintao officially entered the President Office in Nanjing. After getting off at the gate, he walked through the garden and the office meeting hall with his back to the fanatical media. When he passed around an outdoor corner, he stopped at the window of a small, inconspicuous house, which was once the office of Lin Bosheng and Gao Zongwu.\n\nThe small wooden table has been covered with dust, and the documents and books piled up on the table decades ago have been cleaned up. Over 30 years ago, Gao Zongwu worked tirelessly on this desk, directing the modernization work of large and small cities day and night, building the present face of East Asia with the people.\n\nHu Jintao knows very well that the Nanjing government composed of former collaborators has rotted to the bone. Unregulated Minliu controls all aspects of the local government. The unbearable past has become a pain in history.\n\nThrough the small window and the old desk, Hu Jintao felt the resonance from his predecessors.\n\nNo matter how bad the current situation is, it is impossible for him to go back to the past to make up for it. Not all his blood and flesh are rewarded. So what are we fighting for…\n\n\"For the common people.\""
 CHI.general.10.a: "He said silently in his heart."

 CHI.general.20.t: "Good Meeting"
 CHI.general.20.desc: "Chen Liangyu is sitting at a hotel's restaurant in Xianggang, shaking his wine glass, staring at the liquid inside. He is waiting for a man, an important man. He leaves the LegYuan meeting to others, although there are some concerns, but he has to focus on this meeting right now.\n\n\"Old Chen! Long time no see!\" There he is, the people he is waiting for: Lang Xianping, Chairman of the Chinese Liberty Party, his political partner, sitting at the chair across the table.\"Ha ha, here is always the best…\" He touches his chair, \"How's it going in Guangdong?\"\n\n\"Nothing big here, those guys in LegYuan are still hard to deal with, you can't use the normal way to them.\" Chen smiled,\"But Lee Ka Shing is a good old man though, we talked a lot. He also shows great concern on Guangdong stuff… not a bad one isn't he?\"\n\n\"That's much much better than those old people in Nanjing ,such a stick in the mud…\" Once he thinks about those people, Lang gnashing immediately. \"They know nothing about economics, only care about their wealth, didn't give a fuck to the destiny of country and companies! Everytime I think about what may happen next, my spine chills! I…! \"\n\n\"Professor Lang, Professor Lang…Calm down, I know what you want to say…\" Looking at the one that barely can't speak, Chen comes up to him with a glass of water.\"That's the reason we fight isn't it? Making the economy and country better, so we don't have to care about those conservatives any more.\" \n\n\"Their corruption and pedanticity,  you can't even imagine it….\" Lang empties the glass, take a deep breath.\"Liangyu, promise me, take good care of Guangdong. I will change the whole country, just like this place: with probability and efficiency. \" Chen nods.\n\n\"It's not early now, I have a speech to attend in CUHK. \"Lang has a look at his watch. \"Enjoy your meal, I'm gonna go now.\""
 CHI.general.20.a: "Chen looking at Lang’s back, he is thinking of something."
 CHI.general.21.t: "As Always"
 CHI.general.21.desc: "\"Order!\" Tsang Yok-Sing frowned, looking at those members of Guangdong LegYuan arguing everyday. This financial meeting has already held for days, yet the worst is he is the president of these people.\n\n\"President! It is MY speaking time! Please tell Wong Yuk-Man to…\" \"What?! You feel guilty now? Everyone in Guangdong is waiting for this retirement scheme! And all of you in the government are still making excuses!\"\n\n\"Non sense! There is only you Zhujin getting the profits! How dare you waste money from taxpayers without shame?\" \"What the fuck did you say?!\" The conservative also gets into the fight, and that foul word triggers the entire meeting room. Meeting minutes and stationeries are thrown everywhere, until the securities come in.\n\n\"Rest for ten minutes!\" Tsang Yok-Sing looked at Chen Liangyu, who was not far from him, just like telling him \"Leave it to me.\"\n\nArguments didn't stop, Chen Liangyu threw his glasses away, pinching his nose with both hands. He remembered this meeting was screaming on TV, and Lee Ka Shing was watching from the gallery, he can no longer control himself from embarrassment.\n\nThe man noticed Chen's feeling, and he smiled. Then opened the lid and tasted the tea."
 CHI.general.21.a: "\"Just like the old days.\""

 CHI.general.40.t: "Memories of a Men’s Motherland"
 CHI.general.40.desc: "The old man's hands were already rough and wrinkled, but the speed with which he held the pen and scribbled the few lines on the paper in English was no less than that of the youngers. He stopped writing, put the paper into his file folder and slowly moved to stand up, just as he was about to leave the house.\n\nThe doorbell was rung. The old man quickened his pace to open the door and saw two young men.\n\n\"Good morning, Mr. Qian, are you about to go out?\"\n\n\"Well,\" the old man nodded, \"you are ......\"\n\n\"We are from the New Overseas Chinese Evening News, I am sorry to disturb you, we have come to invite you to the award ceremony this time, do you have time for an interview please?\" The young man introduced himself.\n\nIt has been a long since the first crowd of journalists to show up at his door since the announcement that shocked the international academic community. He had also become accustomed once again to the sudden arrival of cameras and microphones.\n\nThe young man walked into the old man's supplies and the living room was piled high with awards, trophies and banners from returned overseas Chinese and rocket engineering. On the wall was a new-looking group photo of \"Qian Xuesen and Chinese and Japanese aerospace scientists\".\n\nThe young man asked the old man, \"Mr. Qian, you once criticized the Nanjing government as a 'traitor' in the United States in the 1960s, But why did you come back to rocket engineering and join 'East Asia Aviation' despite American and the OFN's resistance? Are you now in your 80s and 90s and ever worried that it will be difficult for you to shine?\"\n\nAnother bunch of backwoods kids who dare to ask anything. The old man sat down on the sofa and said with a bitter smile, \"One always has to look ahead, no matter what the situation is, for the sake of the people of the motherland."
 CHI.general.40.a: "\"After all, any help is valuable.\""

 CHI.general.200.t: "Broken Countryside"
 CHI.general.200.desc: "\n"...\n\n…today’s rural China made me feel very strange. The earthbound civilisation that existed in the countryside hasn’t been properly preserved. I have immigrated to the United States since the 1940s, and every time I return to China, it seemed that I have entered an unfamiliar world…\n\n…back when I was teaching in the university, I had already told the students a disunited state which destroys the earthbound culture completely, will have a negative impact on China herself…\n\n…the large-scale urbanization, with more than 70% of the population has entered the cities, and the farmers, especially the self-employed farmers, have lost their importance…\n\n…although this view is unpopular in the United States, actually Japan and China both belong to the East Asian culturesphere, which naturally coincide with each other to a certain extent. Japanization is not the root cause of the end of local culture…\n\n…Large scale commercial farms are not suitable for every place in China. In the south, forced and utilitarian farms opened in the Gao-Tao period did not produce ideal numbers of crops. I agree with you, Mr. Cao, that it will lay hidden dangers for social stability. Perhaps we can only hope that experts from China and Japan can revitalize those hills, instead of being forced to return to the small-scale peasant economy…\"\n\nFrom,"
 CHI.general.200.a: "Fei Xiaotong"
 CHI.general.210.t: "Chinese Input Method"
 CHI.general.210.desc: "For a long time, there has been controversy over how we should type Chinese characters when using microcomputers. Some people have proposed to develop a keyboard for Chinese characters, but this is not practical - there are too many  radicals and complex glyphs in Chinese. The only solution is a specialized Input Method.\n\nThe most influential one is the Pinyin Input Method, which does not need people to memorize typing tables or specific words. All you need to do is learn the Chinese Pinyin scheme of the RoC government, and you can input a Chinese sentence into a computer. However, some people also pointed out that the pinyin input method has great disadvantages. Hundreds of Chinese characters may sound the same and use the same Pinyin so that users can not always type the characters they want. Also, conservatives believe that this will destroy the ideographic advantage of Chinese characters.\n\nInvented by Wang Yongmin, the WuBi Input Method is also an alternative. He observed the writing characteristics of Chinese characters, classified radicals and murals as \"root\", and made them correspond to the keys on the keyboard one by one. As long as you memorize the WuBi root table and its original input rules, you can accurately type out the desired Chinese characters.\n\nThe Cangjie Input Method is also very popular. It was invented by Wu Bangfu and named by Wen Jiabao. The name pays tribute to Cangjie, the God in ancient Chinese legends who created characters. Cangjie Input Method skillfully links the Chinese characters with radicals, and corresponds to them on the keyboard."
 CHI.general.210.a: "Pinyin is most suitable for educational promotion."
 CHI.general.210.b: "WuBi is more convenient and faster."
 CHI.general.210.c: "Cangjie is the symbol of the Chinese nation."
 CHI.general.210.d: "Let the people decide for themselves."

 CHI.general.1101.t: "Daily Life of a female high school student"
 CHI.general.1101.desc: "Qin Wenwen rode her bicycle through the garden and hurried to Suzhou Senior High school. \"What bad luck, I'm going to be late.\" At the red light on the street corner, she had to stop. \"Why does the red light last for 180 seconds?\"\n\nWhen she was anxious, she found that a bicycle also stopped beside her. She took a closer look and found that it was her Japanese classmate, Suzuya.\n\nSeeing Qin Wenwen's flustered appearance, Suzuya said wittily: \"Wenwen, what's the matter? You're so nervous. You should wait for the red light anyway.\"\n\n\"How can I not be nervous! I'm going to be late!\" Qin Wenwen said with a pursed mouth.\n\n\"Haha, the first lesson in the afternoon is self-study time. I'm the monitor and I'll take charge of who's late.\" Suzuya laughed loudly.\n\nQin Wenwen suddenly blushed and hesitated, \"then... Can you forget me being late?\"\n\n\"Of course,\" Suzuya loosened her handlebar and put it onWenwen's shoulder. \"After all, we are good friends, dear.\" \n\nQin Wenwen's face reddened even more. \"Ahh, we’re in public.\"\n\n\"Ha ha ha,\" Suzuya laughed even louder, pointing to Qin Wenwen's Seifuku. \"Wenwen, you must have been in a hurry to go out. The buttons on your clothes are all tied wrong!\""
 CHI.general.1101.a: "Absurd and humiliating."
 CHI.general.1102.t: "Friendship of a female high school student"
 CHI.general.1102.desc: "\"...and, for the future of our Suzhou City, call on your parents to vote for Zhang MP from the Chinese National Power!\" After class, a male student was giving a lively speech in a corner of the campus and Qin Wenwen stood under the stage, watching him.\n\n\"Wenwen, what are you watching? You like National Power?\"\n\n\"No, just because the guy standing on stage is my neighbor, he invited me to put on an appearance, it looks interesting. But I… just can't understand what they say, and I'm not interested in voting for them. I'm just a high school student.\"\n\n\"Yeah, we are only high school students,\" said Suzuya, who did not know whether to cry or to laugh. \"He’s just a candidate for the municipal LegYuan. Why are they so crazy?\"\n\n\"By the way, Suzuya, why did the teacher ask you to go to the office today?\" Qin Wenwen changed to another topic.\n\n\"Ah, do you mean Mr. Mandarin?\" Suzuya pointed at Qin Wenwen's nose mischievously.\n\n\"Take it away!\" Qin Wenwen pursed her lips and quietly replied, \"Hmm, yes.\"\n\n\"It's nothing. I was caught listening to MP3 in the class and I was warned. It’s so strict.\" Suzuya seemed to have some complaints.\n\n\"The teacher is for us, after all. If we aren’t self-disciplined, how can we get into Tsinghua University and Nanjing University?\"\n\n\"Don't make fun of me, it’s not an easy job…Southwest University is enough, not to mention Nanjing University.\"\n\nThe two kept kidding until the noon break, when the sun was already burning."
 CHI.general.1102.a: "That’s youth…"
 CHI.general.1103.t: "Troubles of a female high school student"
 CHI.general.1103.desc: "\"Stay away from the Japanese named Suzuya in your class in the future!\" The alcoholic father angrily warned Qin Wenwen, \"if things go on like this, I'll send you to a private school completely for Chinese people!\"\n\n\"I don't want to go. Those private schools are old and poor!\" Qin Wenwen is also very unhappy.\n\n\"In short, don't play with the Japanese. Just concentrate on your studies and don't do anything else!\"\n\n\"Why? Why are you so nationalistic, it’s a new era! Japan becomes a republic, China becomes democratic, and wars have been already fought. Why should we bring up the past today? Don't you just watch those rightists canvassing votes in front of the TV every day to brainwash you, and you just want to impose your position on me! Why do you interfere with me and my friends when I go out? You even get drunk and go home everyday! There are so many Japanese students in the school, every class has at least one, you don't want to get in touch with any of them? It was YOU who wanted me to study hard and sent me to go to the public school, and you told me to get along well with my classmates...\"\n\n\"Wenwen, listen to Dad..." The father spoke as if he was still drunk.\n\n\"I don't care! I'm going to run out from here!\" Qin Wenwen didn't want to quarrel with her father anymore, and was about to rush out.\n\n\"Didn't you always want to know where Grandpa went?\" The father suddenly sobered up with a gloomy face.\n\nQin Wenwen put down her hand on the door frame, turned around slowly, and saw her father continue to speak."
 CHI.general.1103.a: "\"Your grandpa died of Japanese.\""
 CHI.general.1104.t: "Tears of a female high school student"
 CHI.general.1104.desc: "The father opened the door of the wardrobe in the bedroom, finding Qin Wenwen holding an old wooden box and crying on it. That box belonged to her father and her grandfather. It contained something that Qin Wenwen had never seen before: her father's diary when he was young, her grandfather's diary, her grandfather's letters, all kinds of small memorabilia and items from different years, and photos. These are all evidence of what Japan has done to China.\n\n\"Xiaowen, why are you...\" The father paused, \"I originally planned to show them after you graduate from college.\"\n\n\"Dad...why didn't you tell me..." Qin Wenwen's eyes were flushed with tears, \"Grandma … was raped to death by the devilish Japanese.\"\n\nFather didn't dare to speak out, but just stood in front of Qin Wenwen.\n\n\"Dad... take me to Grandpa's grave, I want to apologize to him.\" Her eyes were full of guilt.\n\nThe father kept silent, only with a slightly relieved smile on his face.\n\n\"In textbooks, it has never been said that our capital Nanjing has experienced a horrific massacre, the Japanese entrepreneurs have never spoken about the exploitation and abuse of our laborers, and  the government never said that it has brutally suppressed people...\" Choking up, Qin Wenwen suddenly stopped talking, rushed to her father, and peeled off his shirt. There are dozens of dark scars on his waist, which were left when he was a child laborer in a Japanese factory.\n\nQin Wenwen seemed to have thought of something, and was struck to lie down on the ground, \"Why do I live in this world, in this country...\" She lowered her voice and muttered to herself, \"...Suzuya...\" Father's face turned dark again, and he felt that things might be getting out of control."
 CHI.general.1104.a: "Whether to forget or not, history is still there."
 CHI.general.1105.t: "Farewell of a female high school student (1/2)"
 CHI.general.1105.desc: "During school break, Qin Wenwen and Suzuya  made an appointment to meet at the school's pond, and the two strolled aimlessly along the flat stone steps.\n\n\"Wenwen, why it seems that you are feeling a little unhappy in class these days?\" Suzuya tilted her head.\n\n\"Suzuya...\" Qin Wenwen avoided Suzuya's eyes, \"I recently discovered something very unhappy.\"\n\nSuzuya was stunned for two seconds, then said softly, \"Is there some trouble in your mind? Did the electronic pet die again, or dad stopped reading magazines for you, or the exam last week...\"\n\n\"Okay, don't talk about it.\" Qin Wenwen interrupted Suzuya’s concern.\n\nThe two didn't say much. Suzuya was a little overwhelmed, and together they quietly looked at the clear water aside without saying a word. But after a while, Suzuya couldn't stand the loneliness, and started talking again: \"Wenwen, we have to be back to the classroom in two minutes, if you have anything wrong, just tell me. I would help you if I’m able to.\"\n\n\"You can’t help me.\" Qin Wenwen said expressionlessly.\n\n\"What's the matter? There’s nothing to hide between good friends, right? I will help you anyway.\" Suzuya stood in front of Qin Wenwen."
 CHI.general.1105.a: "Standing silently for seconds, Qin Wenwen slowly spit out the words."
 CHI.general.1106.t: "Farewell of a female high school student (2/2)"
 CHI.general.1106.desc: "\"I… hate you Japanese.\"\n\n\"Ahh…\"Suzuya didn't respond and stood blankly.\n\nQin Wenwen's eyes flickered like tears, but it did not flow down her cheeks, and she still had an expressionless face. Suzuya faintly heard Qin Wenwen's nose suck, and when Suzuya saw her, Qin Wenwen was helpless and had to let his body fall down with gravity. Suzuya subconsciously wanted to help.\n\nAt that moment, Suzuya maximized her pupils, and she saw Qin Wenwen in her arms, closing her eyes and showing a long-lost smile...\n\nAnd a dagger stuck deep into her body."
 CHI.general.1106.a: "A Brighter Summer Day."
 CHI.general.1107.t: "Rosewood drop to ground"
 CHI.general.1107.desc: "This year's fifth campus anti-Japanese murder case and the first female campus Anti Japanese murder case in the new century - the Suzhou High School Murder case was officially pronounced in the Jiangsu provincial court. The suspect, Qin XXwen, a female, being 16 years old, has no history of mental illness. As she is a minor, she was given a lighter sentence at her discretion,  sentenced to 20 years of imprisonment and three years of probation. After investigation, the suspect's father Qin XXniu claimed he did not know the actual situation of the case, but he will still face charge of being suspected of hate education, illegal possession of controlled knives, and affecting social order."
 CHI.general.1107.a: "Read."

 CHI.flavour.20.t: "Silent Line"
 CHI.flavour.20.desc: "The city of Beijing. His elder brother, according to the hearsay, who served in "No. 435" is no longer mentioned. Not on the martyrs list. No official funeral. All about him has been wiped out, kept unknown to the public. He only remembered his brother was proficient in many foreign languages, he was an excellent undergraduate at that time. A plainclothes police officer came to his home and told him about it, with complicated lights in his eyes. Grieved, and regretful.\n\nThat "policeman" knew the deceased was a sharp blade of the Chinese government, and had served the motherland for over 26 years. Being an agent of "Public Security Police Information Protection Bureau" before the GAW, after the bureau reorganized with the "No. 76" to form the "No. 435", he was then assigned to Japan to infiltrate the Japanese administrative system. After the Hanseong Consensus, he lived in Japan and started monitoring the loyalty of Japan. Now, China had lost contact with him during the last mission - not exposed in Japan, but arrested in the Soviet Union.\n\nIt's easy to imagine how crude the NKVD - a sensational Intelligence Agency of the Soviets - will treat him. How the officer, comrade-in-arms with him, wanted to show these brilliant achievements to his younger brother. He wanted to resent that fate was so cunning. He wanted to complain about why superiors assigned such a task. He wanted to sigh that the republic had lost such an excellent personnel.\n\nHowever, he was also a secret agent after all, so he restrained such an impulse."
 CHI.flavour.20.a: "We no longer have names,\nhe thought."
 
 CHI.flavour.51.t: "The First Chinese Super League"
 CHI.flavour.51.desc: "The final of the Chinese Super League was held as scheduled in the newly-built football stadium in Nanjing, which has been the sixth national football match since Xianzheng, and the first time to upgrade old football match into a super league. There are more spectators in the CSL than in previous years. The stadium is crowded with enthusiastic football fans, watching this top-level match.\n\nThe two finalists are Guangzhou F.C. and Shanghai F.C, the best teams in the league, and their players to coaches are all ace. The former team was sponsored by Li Ka Shing's enterprises, while the latter was sponsored by an automobile enterprise of an old brand from East China.\n\nYang Chen, who joined Guangzhou F.C. in 1999 had an excellent performance on the football field, having broken through the opponent's defense several times. In the first half, he took the lead and scored two goals, taking Shanghai F.C. by surprise and the game and there seems to be no suspense in the game. While Shao Jiayi of the same team wasn't satisfying - an excellent corner goal opportunity was missed.\n\nIn the second half, Shanghai F.C adjusted its strategy. Key players Fan Zhiyi, Sun Jihai, and Qi Hong showed their skills one after another. In the 78th-minute, they scored a direct goal by using a long pass counterattack, and scored another successful goal in the 83rd-minute penalty, equalizing the score. All fans of the Shanghai F.C. stood up and cheered for them.\n\nEventually, new player Li Yi helped Guangzhou team score a goal in OT, and the game ended with the loss of Shanghai F.C. The fans of Guangzhou F.C. cheered and celebrated that the Guangzhou F.C had taken the Vulcan Cup. The Shanghai players, standing nearby, can only turn a cold eye."
 CHI.flavour.51.a: "\"Shame...Shame on you!\""
 
 CHI.flavour.61.t: "A Magnificent Threat"
 CHI.flavour.61.desc: "Guo Yonghong, a leader of Triad, took his goons to see a new joint venture underground factory at Shimen. The machinery keep creaks, as the assembly line continues to produce poor quality electronic components. This factory is his masterpiece, could undoubtedly bring him a handsome profit if success.\n\nHe didn't feel anything wrong until walked out from the factory and got in the car. A dark-skinned man was already sitting in the back seat. \"Drive to the man-made river.\" Said the man, with a cut-off shotgun pointed at Guo. The other goons were already taken care of with a few strange black cars. Without other way, Guo had to obey.\n\nHalf an hour later they were standing at the edge of an unnamed man-made river. All three of Guo's hired guns are tied up, forced to kneel on the floor, and Guo's chopper was taken away. Covered with sweat, he still asked calmly: \"So you must be Zhang Baolin.\"\n\nThat man looked at Guo, with a fierce yet calm look: \"Yes, I am Zhang Baolin. And do you know why I should do this?\" \"No, we don't cross the river, but what I know is even if any of my hair is harmet, the entire Triad will target you, smash you without a trace!\"\n\n\"No crossing the river?\" Zhang responded with contempt, \"Hebei is our gang's land, Shimen is me Zhang Baolin's zone, I am the best killer here! Just divest the factory here and we're clear, little Shanghainese. I won't hurt yo, or kill you...\" He moved his head closer, \"But if you wanna get me, I ain't care'bout yo fucking Triad or Quiad, just come ahead!\" The last three words, with a hissing tone, shocked Guo eventually."
 CHI.flavour.61.a: "Now you are strangers in this land."
 CHI.flavour.62.t: "A Magnificent Raid"
 CHI.flavour.62.desc: "He pressed the head of Tycoon Wu Si's son, said arrogantly on the other end of the phone: \"One billion, no more, no less, or your precious son's head will on the move!\"\n\nThis is Zhang Ziqiang's everyday work. A kidnapper of the century, blackmailed the richest men in Republic of China, including Li Jiacheng and He Hongshen. The team behind him worked meticulously together, never missed a beat, never got convicted, repeatedly exploting loopholes in the law. His multiple moves to coerce the rich not to appeal to avoid litigation have already become an urban legend in China.\n\nHaving a dinner party at his villa, Zhang Ziqiang was discussing the next kidnap target with members of his team. \"These new gentries are just a bunch of paper tigers, too easy catching'em, With their pants off! Kek!\" He laughed arrogantly, followed by his juniors laughing.\n\nSuddenly, a shotgun blast shattered the glass wall of dining room and several men in black jackets came in through the window and on the first floor, with Zhang Baolin leisurely strolls inside, moving his neck.\n\nCouldn't react in time, Zhang Ziqiang knew it was too late to make a reaction. He calmly raised his hands, \"Zhang Baolin, what brings you here?\" Zhang Baolin didn't look at Zhang Ziqiang squarely, but smiled and said to the accomplice next to him, \"It seems that this special trip to Guangxi didn't fall through.\" But Zhang Ziqiang was not afraid either, \"I don't know what you want, but I happen to have a pretty bunch of money, just made a billion last time. So take as much as you want, as long as you let me go.\"\n\nZhang Baolin finally turned his eyes to Zhang Ziqiang: "How can that be, I was hired to kill you. I'm fine getting out here without your money, but you great tycoon's head? No." Zhang Baolin's men put the dagger on Zhang Ziqiang's neck."
 CHI.flavour.62.a: "He was scared. Eventually.\nToo late though."
 CHI.flavour.63.t: "A Magnificent Appointment"
 CHI.flavour.63.desc: "In an upscale hotel in Baoding, Huang Shaocen and Zhang Baolin sit together discussing bits and pieces of business and stories of the goons.\n\n\"I can't find much people such capable and talented as you either. You know, if you want, I can make a joint venture with you for a gangster movie, based on your stories. We have a professional film company in the gang. As long as you come, I can guarantee there will be plenty of profits.\" Huang laughed loudly as he spoke.\n\nZhang rubbed his eyes tiredly, disdainfully said, \"That's not necessary, I don't have a few bucks on hand -- just an outlaw. Sometimes I don't want to bear the fame either, but now my name is already remembered...Nah, it's better not to lose face.\"\n\nHuang poured a cup of tea for Zhang, then the pace changed, \"You know, we have chatted long enough already, for people like me it's not only the trivia.\" Zhang immediately sterned his face, hearing Huang speak on, \"I've been playing these from the years of President Tao, earlier than you, that's for sure; Japs? Killed too. I come to you today, ask you nothing more, just the Xiang Huayan's business. At least he's a dignified businessman still, his men never violated you before, the thing this time is an accident shot, that's it. So I'd act as the mediator this time, so for my sake ...... don't ask for a fight the day after tomorrow, it has been tight lately, you would also attract the cops' attention too.\"\n\nZhang responded impatiently, \"I'll tell you one thing. This thing is my thing, no matter who he is, his minions hurt my brothers, and they ain't come out for apologise yet. Master Huang, I come here today, I gave you face already. So please pass on a message to Xiang Huayan, let him talk to me himself.\"\n\nTurining around to leave, as Zhang heard the yelling from Huang: \"Lin! I give you a word as an elder, don't be too vigorous when still young!\"\n\nHe turned back then, pointed at Huang..."
 CHI.flavour.63.a: "\"Without vigour,\ncan one still be called young anymore?\""
 CHI.flavour.64.t: "A Magnificent Mudslinging"
 CHI.flavour.64.desc: "Zhang Baolin led a large group of villans on a drive to Beijing, his vast convoy speeds along the main highway. His brother Zhang Baoyi had been wounded by a group of gangsters in the Tongzhou district of Beijing, had stayed there for recovering. Therefore, Zhang Baolin vowed to clean up all those Beijinger gangs.\n\nHis team were having a fight on a bridge over the Tonghui River with a Beijing gang. When they heard that Zhang Baolin was coming with a \"large force\" to pick a fight, numbers of old gangsters -- already retired from the scene -- also came. The momentum between two sides was indistinguishable, with hundreds of people standing on the bridge facing each other, attracting crowds of neighbours and journalists.\n\nNo negotiation, unable to find any leader on both sides, they fought each other directly on the bridge. People used bricks, machetes, pipes, bars, iron whips, nail guns and other endless number of weapons. Some were bloodied, others were simply knocked to the ground.\n\n\"Fuck it, we can't beat'em! Let's go, trick'em off the bridge! Need to show'em a lesson.\" The battle was slightly decimated as the Beijing gangsters retreated backwards, exiting the bridge for defending. However, Zhang Baolin and his men had encircled the area with their guns already.\n\nOn a third-floor balcony, Zhang Baolin and his minions poured in a frenzy of bullets, with himself pulling out his favourite cut-off shotgun, firing incessantly into the enemy group. The Beijing goons, pinned back and forth and seeing the heavy firepower, scattered in fear.\n\nZhang Baolin didn't let them go, he was already red hot with his gun. No matter where the old goons fled to, he would not hesitate pulling the trigger. It was only when the alarm bell was heard in the distance that he withdrew."
 CHI.flavour.64.a: "\"Blame it on Chairman Wang.\""
 CHI.flavour.65.t: "A Magnificent Ending"
 CHI.flavour.65.desc: "It's a sunny day. Zhang Baolin and Li Youcan are sitting in a single room in Wu's Farm, talking about nothing more than latest "business" or tales of gangsters.\n\nLi made himself a cup of tea: \"In Hebei, it's said you people are taking the leading role. Eh? All of the KTVs in Shimen are covered by you, half of the casino shares in your hands. An outlaw, unbelievable.\"\n\nZhang smiled, replied politely: \"You're too kind, it's just my brothers, a little money and contacts, not even close to you officials.\"\n\nLi went on to say, \"You're a lord of generation already,  no one hasn't know you in Shimen.\"\n\nZhang raised his cup: \"Still shady things, at the end of the day. I can't ask for anything else, protecting brothers with sincere hearts, that's it.\"\n\n\"You gangs are just like those Commies.\" Li poured the tea from his cup directly to the floor, \"Conscience in your mouth, dead men in your hands. Do you know how soon would Hu Jintao wipe you all out if you weren't protected already?\"\n\nZhang frowned, asked in a low voice: \"Bro, what's that means?\"\n\nLi Youcan took a pistol from his left belt, placed it on the waist, as the door suddenly opened and two burly men with machetes bursted in."
 CHI.flavour.65.a: "\"As it means.\""

 CHI.flavour.70.t: "Shanghai Thae"
 CHI.flavour.70.desc: "On the Bund, numerous high end hotels and financial buildings are located there. Here, Minlius from all over the country, pushing glasses and changing glasses and indulging in the elegant atmosphere of opera and the most expensive delicacies in East Asia. And there are also many Japanese among them.\n\n\"Master Wu, why has your income been so small recently?\" A businessman is holding several beautiful women in his arms.\n\n\"Oh, I’ve found a scapegoat, the money in Hebei has been all given to the idiot, Li Youcan, and he even accepted it being gullible.\" Wu smiled mysteriously, implying that the Hu-Wen government intended to investigate some black money.\n\n\"Ha Ha, what dirty money it is!\" The merchant laughed and said, \"but I’m not safe  now, one project of Li Ka-shing has failed in my hands…\"\n\n\"Sir, just play with me!\" The hooker next to the businessman interrupted him.\n\n\"If we can catch him here, he’ll be all washed up.\" Wu played a joke on Li Ka-shing, and the whole table was full of laughter. \"But it's a pity that only young people who are engaged in new technology now have the chance to fight him.\" The merchant said with a wry smile.\n\nAt this time, a drunk Japanese official jumped onto the table next door, causing everyone to laugh.\n\n\"Master Wu, a Jap sucker gone crazy again!\"\n\n\"Hahahahaha!\""
 CHI.flavour.70.a: "Wine and meat decay inside the vermilion door."

 CHI.flavour.140.t: "A half of the life"
 CHI.flavour.140.desc: "Lam Kiu-Cun sitting in a booth of an old ice room, stirring his Red Bean Ice Drink with a spoon. His doctor and family told him not to drink too many cold drinks, which is bad for his health, especially for his old wound. But he still came to this ice room frequently, when his wife and son go outside. That's the place he came everyday after work when he was young.\n\nHis life was not easy. He was forced to leave his hometown, came to the urban area of Guangdong for life. He lived in a Temporary Housing Area distributed by Japanese, which is dirty and not even temporary. He became a police officer, just for earning living money. Running around cities like KōShu and Hon Kon, work in prostration. Handling with his Japanese bosses and Kempeitai, and dealing with Yakuza and Triad.\n\nAmong the intertwined relationships network, he had the most memorable days in his life. Lam met a guy just few days before, and Lam sent him to tortured in trial room. His supervisor found corruption, and he led the arrest team. And those economic issues days... he never forgot. People being angry and despair, bottles and bricks flying on the streets. He almost breaks down, but the only thing he can do is follow the orders, hoping for the end of the nightmare.\n\nThe worst days are gone, yet the good days didn't last long. He got used to it.\n\nSato, Tall guy the Wing, Fat Paul. It was just like they are still here, sitting in the same booth with him. Talking about the tough life, blaming on their stupid boss, and discussing went to whoms home for Mahjongg. Everyone in the entire ice room can hear their yelling, they feel no uncomfortable. Sometimes the ice room owner Uncle Ming and his wife Antie Lin will join their shit talk.\n\nLam got old. And those memories and intensive life vanished, when he retired and his friends went away one by one. Leaving a dead old soul in this ice room, he has a taste of the Red Bean Ice Drink, it was just like how it tasted forty years ago.\n\n\"See? I told you he must be here!\" At least, they are still here. \"Come and tell your dad not to drink that much!\""
 CHI.flavour.140.a: "\"Yoshiko, and Tsz Long. How's the day?\""
 
 CHI.flavour.150.t: "Yes, Translator"
 CHI.flavour.150.desc: "A man is riding his bicycle on the way to the Ministry of Culture. His name is Li Keqiang, with a newly-translated book in his bag. Of course, not by himself.\n\nYes Minister: Diary of Cabinet Minister Jim Hacker - this translation has a quite long name, which in fact is an official adaptation of the BBC TV series Yes, Minister. \n\nThe book in Li Keqiang's bag was translated by his wife, Dr Cheng Hong. Graduated in Peking University and after receiving her doctorate in English literature, she continued to teach English for undergraduates in PKU. In her spare time, she also translated some anthologies, poems and novels.\n\nYes, Minister has not been screened in China and few people know about the series. However, the play's brilliant satire and political jokes attracted Cheng Hong to translate it into Chinese.\n\nHowever, Dr Cheng's social activities were mostly in academic circles and she did not know many people in the press, so she gave the publication to her husband, who also graduated from Peking University and had a PhD in law. Although Li Keqiang is only an ordinary lawyer, at least he knows a few people in the press."
 CHI.flavour.150.a: "Would they really allow the book to be published?"
 CHI.flavour.150.b: "Yes, Dr Cheng!"

 CHI.flavour.155.t: "Online Japanese Hate"
 CHI.flavour.155.desc: "LittleWhiteSun658 - Why there's so many dumbing students killing Japanese friends? These “demons of Japanese killer” don't even read a word of history! Rationally, sincere cooperation liberated east Asian people, and those who are ultranationalist are all remnants of Long Yun.\n\nCanperCrepP - Just shut up you little supporter of the KMT, your hair hasn't even grown up yet. Your history textbooks are all fake history cooked up by the government. How many people died in Nanjing... \n\nLongLiveLongYun - Extreme? I will fking blow all the ancestral graves of Hanjian like you \n\nYiRain433 - 435 should arrest all the people like you...\n\nCanderCredP - Hehe, after Chang Kai-shek passed away, we will all behave like him! \n\nLittleWhiteSun658 - I have received EDUCATION!!\n\nCanperCredP - MY FATHER IS A OFFICER, I WILL DOX YOU ALL!\n\n<CanperCredP is banned to post>\n<LongLiveLongYun is banned to post>\n\nLittleWhiteSun658 - THAT'S IT? That's it that's it that's it? \n\nYiRain443 - THAT'S IT? That's it that's it that's it? \n\nDucklightRed - Only communism can save China, you are all fanatics of Wang Jingwei!\n\nLittleWhiteSun658 - Are you fking a network spy from the north??\n\nYiRain443 - uh...that's what so-called Constitution brought us, the republic should go back to authoritarianism.\n\nDucklightRed - I will kill all of you Hanjians,  you are Japan-hearted, yellow-skinned China pigs, and I will kill like the USSR did! \n\n<The post is terminated by BSS administrator>\n<DucklightRed has been eternally banned from the BSS>"
 CHI.flavour.155.a: "What the hell... "
 CHI.flavour.155.b: "... "
 
 CHI.general.1599.t: "New Year’s Eve in the North (1/2)"
 CHI.general.1599.desc: "“In a recent speech delivered to our brave soldiers along the border, President Hu Jintao praised the army’s steadfast dedication to the defense of the Chinese nation and the Three People’s Principles....”\n\nReaching for the remote, Park Fumin half-heartedly recited the words of the Chinese Television System's least-charismatic reporter. The same goddamn story had been repeating for the last twelve hours, at least. “Their blood and sacrifice, said the President--’” he groaned as he fingered the worn-down ‘POWER’ button, “‘-- is the nation’s greatest weapon against the further degeneration of Chinese culture...”\n\nPark sighed. For weeks, he’d looked forward to the New Year’s Festival. At long last, he was of legal age to drink, and, to make things even better, he’d somehow convinced that timid bookstore clerk to accompany him as his date. It all seemed too good to be true -- which is why it came as no surprise that, when another border skirmish flared up a little too close to Tonghua, the city panicked, canceling the festival and imposing a strict curfew in its place.\n\nThe young man crushed the spent beer can in his hand and tossed it over his head, not especially caring where it landed. What was he supposed to do with himself now? He'd vegged out in front of CTS for long enough. He wasn’t in the mood for reading. He couldn’t afford a computer, let alone a dial-up connection.\n\nShaking his head, Park peeled himself off his easy chair and sulked toward the front door."
 CHI.general.1599.a: "Some fresh air never hurt anyone..."
 
 CHI.general.4321.t: "New Year’s Eve in the North (2/2)"
 CHI.general.4321.desc: "Park shivered. Despite the multitude of layers he’d wrapped himself in, the bitter cold still managed to sneak in through his collar. For the third time this week, he’d realized he should’ve worn a scarf.\n\nOut of the corner of his eye, Park spotted a crinkled, moisture-stained flyer sailing on the breeze. He needn’t waste his time with a sideways glance -- in the handful of minutes he’d been out of his meager apartment, he’d already trampled over dozens of waterlogged copies stuck to the thawing pavement.\n\nThough covered top-to-bottom with familiar Kuomintang imagery, the flyer was far from official. Covered in crunchy, haphazardly-arranged JPEGs and venomous anti-Japanese slurs typed up in Comic Sans, the posters had clearly been created and printed off en masse by a single individual with way too much time on their hands.\n\nPark rolled his eyes. He detested the Japanese as much as the next guy -- he’d paid attention in his history classes, after all -- but some people just took things way too far. Who in their right mind would use their precious free time to create something like this? Didn’t they have anything better to--\n\nAll at once, the ghastly shriek of a dozen ear-splitting sirens assaulted the night. The surprise made Park lose his footing on a yet-unmelted patch of ice; a moment later, his face met the pavement.\n\nTHE TIME IS NOW 21:55. ALL TONGHUA RESIDENTS ARE REQUIRED TO RETURN TO THEIR HOMES WITHIN THE NEXT FIVE MINUTES. FAILURE TO COMPLY WILL RESULT IN IMMEDIATE PROSECUTION. THE TIME IS NOW 21:55. ALL TONGHUA RESIDENTS...\n\nIn a matter of minutes, Park had returned to the safety of his easy chair. Running his tongue across his bloodied lip, he cursed under his breath and reached for the remote. "
 CHI.general.4321.a: "Perhaps those tacky flyers deserve a second look."
 