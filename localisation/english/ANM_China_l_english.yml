 #Leaders
 CHI_Zhu_Rongji: "Zhu Rongji"
 POLITICS_ZHU_RONGJI_DESC: "Born in Changsha, Hunan, to a family of wealthy landowners. Raised by his uncle, Zhu Xuefang, after the death of his parents, he graduated from Beijing’s Tsinghua University. Joining a KMT student organization, he became the student leader of the local organization four years after the Great East Asian War ended. He would begin his career as a politician by becoming a civil servant independent of the North China Political Council. Primarily serving in Beijing, Rongji would grow attracted to Chen Gongbo’s Reorganization Faction, primarily because of his earlier ties to socialist organizations. Actively participating in the efforts to sabotage Baisheng’s Five Great Modernizations, Rongji would become a prominent member of the Reorganization Faction through his charisma, oratory skills, and friendliness toward rival members within the government. During Gongbo’s tenure as Premier, Rongji would be appointed the head of Hebei province, primarily focusing on the modernization and development of both Beijing and Tianjin. His state-capitalist policies would earn him great regard as a capable administrator and economic prodigy as Hebei became the second wealthiest province behind Zhejiang Province. During the beginning of the Great Asian War, Rongji’s infrastructure development would prove particularly helpful to ROCAF forces defending against IJA encroachments against Beijing. Mostly seen as a shadow politician, he would become a national hero for leading the city of Beijing through a three-week IJA siege. This popularity would make him unofficially the heir to Zhou Longxiang and the future leader of the Republic, at least before the formation of the Weixinpai faction. With the compromise between the two factions within the GMD, Qiao Shi, a rival of Rongji, would be chosen. Rongji, furious at the outcome, relegated himself to a background role in politics. When Shi retired in 1991, the party elite within the Gaizupai called upon Rongji once more as a partisan candidate to combat the growing influence of the Reformationists. Taking a stance against the market-oriented politics of the Chinese liberals, Rongji’s state-capitalist reforms would significantly reduce corruption within the bureaucracy and business sector at the cost of economic growth. With political polarization growing between the two factions of the GMD and facing external progressive opposition, Rongji seems determined to cement the National Revolution into Chinese society forever. But with the growing cracks in the foundation of the government, Rongji may shatter what he intends to cement."
 
