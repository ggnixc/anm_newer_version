 MEN_Dugursulong: "Dugursulong"

 CHI_minister_Wen_Jiabao_hog_desc: "Every leader needs a candidate for popular appeal. While populists in China are easier to find than rabbits on a sunny day, no populist can match the charisma and appeal of Wen Jiabao. Beginning his career as a geologist and resource prospector in the Shaanxi region, Jiabao built a reputation as an easygoing man, always listening to the concerns of his employees and subordinates. Through this polite and outgoing demeanor, he constructed a network of patronage, attracting the eye of the rising star, Zhu Rongji. Becoming fast friends, Jiabao would rise rapidly through government posts, becoming an advisor to Premier Zhou Longxiang. While Rongji took a break from politics after Qiao Shi’s appointment, Jiabao was appointed President of the Control Yuan, heading Shi’s central bureaucracy. Jiabao would work with the finance ministers to ensure the government could fund Shi’s reforms, especially in establishing the National Healthcare System. Jiabao’s work establishing the pensions and welfare state would make him very popular in Chinese society, and many people would see him as a statesman who truly cared about the people. When Shi retired in 1992, Jiabao was promoted to the President of the Legislative Yuan, spearheading Rongji’s anti-corruption efforts and limiting the size of the federal bureaucracy. As China enters the new millennium, Jiabao continues to be the popular appeal of the Rongji government, the man with the smiling face and the vanguard of the Reorganization faction."
 CHI_minister_Zhang_Qingwei_eco_desc: "Representing the new generation of the Gaizupai, Qingwei is a relatively new entry into politics.  A technocrat by heart, Qingwei graduated from Northwestern Polytechnical University in Xi’an, studying aerospace engineering. Heading the ROC's nascent air design department, Qingwei would aid the ROCAF’s air force by developing new fighters for the army. Those fighter designs would be instrumental in the Great Asian War by actively engaging Japanese fighters and contesting their air superiority over mainland China. For the success of his fighters, Qingwei was promoted to the chair of the National Science and Technology Commission within the Control Yuan. Heading Chinese research and development efforts into weapons and technology, Qingwei would become a party darling, particularly revered by the elders of the Gaizupai. Leaving his post to his protege, Chen Qiufa, Qingwei became an analyst for the Ministry of Economic Affairs, analyzing the effects of Premier Qiao Shi’s welfare reforms. With the retirement of Qiao Shi, Rongji promoted Qingwei to the head of the Ministry of Economic Affairs, earning Qingwei’s devotion. By formulating several policies to lower inflation from the extensive welfare state and excessive government spending, Qingwei quickly became the leader of the young guard of the Gaizupai. Now, as the Rongji government looks uncertain in the face of financial woes and the economic downturn of the Pearl SEZ, Qingwei looks to be the bright, shining flame of the Gaizupai, leading it into the new millennium."
 CHI_minister_Qian_Qichen_for_desc: "A prominent Chinese diplomat and statesman born in Tianjin, China, Qian has played a crucial role in shaping China's foreign policy and international relations for several decades. Qian held various high-ranking positions in the Chinese government.  Qichen's career in diplomacy began in the 1950s, and he steadily rose through the ranks due to his diplomatic skills and expertise. He is known for his pragmatic and prudent approach, advocating for dialogue and cooperation in international affairs. His contributions to China's foreign policy were characterized by a commitment to maintaining stability and fostering positive relationships with other nations. Playing a significant role in the diplomatic rapprochement between the Soviet Union and China during the late 80s, Qian was appointed official ambassador to the Soviet Union in 1986. Continuing his post until 1992, Qian was promoted to the Minister of Foreign Affairs to begin the policy of broad front diplomacy,  attempting to woo regional rivals like the Soviet Union and the Republic of India to ally against the Empire of Japan. Qian has worked tirelessly to foster good relations with both countries. Still, his personal affairs set a dark shadow over the Rongji government, especially the countless bribes he’s taken from other politicians. Ultimately, if anything could bring Rongji’s government crashing down, it would be Qian’s corruption and revelation of his grievances."
 CHI_minister_Zhou_Tienong_sec_desc: "A graduate in agricultural economics, Zhou began his career in local government and steadily climbed the political ranks. He served in various capacities, displaying a keen interest in rural affairs. His commitment to addressing agricultural challenges led him to become a prominent figure in the agricultural revitalization initiative, advocating for modernization and sustainable practices in farming communities.  Becoming a popular politician among rural communities, Zhou became the vice chair of the Control Yuan during the Qiao Shi premiership. A proponent of bridging the rural-urban divide, he would introduce significant agricultural subsidies into the Chinese economies, allowing for greater income for farmers and ensuring that farmers would have stable incomes. When Zhu Rongji ascended to the post of Premier, he appointed Zhou Tienong as the head of the Control Yuan, the cornerstone of his agricultural policy. Continuing his work as administrator of the Agricultural Bureau, he would ensure the agrarian stability of Chinese society by decentralizing large agricultural producers but keeping the extensive supply chains that kept most of China fed. By doubling agricultural output during his time as President, Zhou would contribute to the growing Chinese economy through significant agricultural exports to the Europäische Pakt. Seeing the peasantry of China well-fed, clothed, and educated, Zhou considers his work to be fulfilled and seeks to retire soon."
 
 #starting Ideas
 CHI_a_party_of_nation_and_revolution: "A Party of Nation and Revolution"
CHI_a_party_of_nation_and_revolution_desc: "Ever since the advent of the Tongmenghui and its transformation into the Guomindang, the foundations of the Chinese Revolution have been rooted in the Three Principles, Minzhu, Minquan, and Minsheng, a nearly universal concept in today’s China. Along with the universalism of Sun Yat Sen’s ideological principles and status as the nation’s founding father, the Guomindang has transformed into the colloquial Chinese party, representing the nation in its three stages of political development.\n\nEver since the liberation of China in the Great East Asian War, and under the guidance of Wang Jingwei and Chen Gongbo, the Guomindang has transformed into a party of societal revolution and of the nation of China. Even today, the Guomindang stands as the world’s premier party-state, a perfect synthesis of populism and technocracy, socialism and nationalism, and democracy and authoritarianism. While China's future is bright, it is up to the torchbearers of China, the paragons of the Guomindang, to ensure that the light of China keeps burning, under storm or fire."

CHI_a_miracle_in_the_midddle_kingdom: "A Miracle in the Middle Kingdom"
CHI_a_miracle_in_the_midddle_kingdom_desc: "In 1962, China was another post-colonial backwater in the GEACPS, with a devastated economy, which primarily relied on agriculture and trading natural resources to keep the nation afloat. Today, it is an economic giant, comparable to great powers like Italy and the Soviet Union, with a thriving industrial base, vast modern workforce, and rapidly innovating economy. This transformation would begin with the presidency of Chen Gongbo, who jumpstarted the process of industrialization and modernizing China with his transformative leadership, accelerating China into an export-oriented industrialization model.\n\nLater, under the presidency of Zhao Yaodong, China would begin its integration into the broader world markets, and its nascent industrial base allowed it to exploit a steady labor supply to become the workshop of the world and a manufacturing hub in the early 80s. Now under Wang Zhaoming, prosperity has continued with domestic industrial development, and a comprehensive welfare system has been established, allowing every Chinese citizen to share in the prosperity of this unparalleled economic expansion. However, the nation still has not reached its goal of eclipsing its former suzerain of Japan, a goal that, if achieved, could bear serious consequences on the dynamic of the Co-Prosperity Sphere."

CHI_two_suns_one_sky: "Two Suns, One Sky"
CHI_two_suns_one_sky_desc: "On November 5th, 1943, Wang Jingwei and Hideki Tojo signed an agreement to a hundred years of cooperation between China and Japan, and a millennium of pan-Asian prosperity. But the promise of the twin dragons taking their place in the sun was a lie, and the Japanese’s prosperity was founded on the sweat and the blood of the people of China.\n\nWith the Middle Kingdom's rapid modernization and the Japanese's failure to bring it under their boot, an uneasy tension has settled as the two powers now tread the balance that holds the continent together. As spheres of influence are carved out, it soon becomes apparent that this continent is not big enough to contain two competing ideologies, two competing visions of pan-Asianism, much less two different superpowers."

CHI_the_dagger_and_the_saber: "The Dagger and the Saber"
CHI_the_dagger_and_the_saber_desc: "As the struggle between the nationalist Radical and pan-Asianist conservatives drags on, the political conflict extends itself to the Republic’s institutions, including two of its most important, the armed forces and Jessfield 76, China’s premier intelligence agency. Ever since the Northwestern Wars and the reintegration of the junior ranks of the NRA, the army has been a bubbling pot of nationalism, anti-Japanese politics, and irredentism, only halted by the rhetoric of the radicals. In stark contrast is Jessfield, which has resisted all attempts at reform by Zhaoming and the GMD radicals, is filled with Japanophile leadership, and was instrumental in the 1976 incident.\n\nWith the president empowering the military, and allowing military intelligence to take a more prominent role, especially as the Xibei maneuvers draw to a close, China’s dagger, and its shield from foreign sabotage and surveillance have grown more complacent. As tensions with Japan grow ever higher, it becomes apparent that China must choose one, the sword or the dagger, to be its weapon in this new war."

CHI_bamboo_passage: "The Bamboo Passage"
CHI_bamboo_passage_desc: "Ever since the 1920s, the Kuomintang has maintained a network of patronage throughout communities of overseas Chinese, from Japan to the United States and Brazil, but their primary source of support has always been the Southeast Asian Chinese mercantile communities, who aided Sun Yat-Sen, Chiang Kai-Shek and now Wang Zhaoming.\n\nWith the Chinese economic miracle propelling China into a titan of the developing world and as China tries to gain more influence in the sphere, this network of Chinese diaspora, colloquially known as the Bamboo Network, has been essential for the furthering of Chinese interests within Indochina, the Philippines, Langkasuka, Myanmar and even in Indonesia. Allowing the establishment of concrete economic links and trade relations, the GMD has also utilized them to support Chinese-favored political movements throughout the area from the Kampuchean Social Republicans, to the Burmese Shan insurgents. With the economic and political war between the Chinese and Japanese growing stronger day by day within the GEACPS, the Bamboo Network is one of China’s strongest weapons within its economic arsenal."
 CHI_The_Seven_Rectifications_Campaign: "The 7 Rectifications Campaign - Middling"
 CHI_The_Seven_Rectifications_Campaign_desc: "As an initiative to promote state unity and cohesion in these turbulent times, President Wang Zhaoming launched the Seven Rectifications Campaign to weed out and annihilate prominent contradictions embedded in Chinese society. Targeting corruption, poverty, feudalism, inequality, regionalism, separatism, and communism, the President has announced that eliminating these ills would propel China into a modern society, finally leaving behind their shackles and joining the world stage as one of its premier superpowers.\n\nPresently, the progress of the Seven Rectifications campaign is middling. The government has made significant breakthroughs in combatting separatism, communism, and regionalism, but it still requires efforts to reduce feudalism, inequality, and poverty among rural populations."

