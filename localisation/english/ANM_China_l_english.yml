 #Leaders
 CHI_Wang_Zhaoming: "Wang Zhaoming"
 POLITICS_WANG_ZHAOMING_DESC: "Visionary. Radical. Ruthless. Paragon.\n\nThese are the 4 words that most commonly describe China’s current leader, Wang Zhaoming. A humble man from Fujian, his university studies would be interrupted by the outbreak of the Great East-Asian War, where he would join the collaborator government after the fall of Chongqing. Falling under the tutoring of Chen Gongbo’s deputies Zhou Huaren and Li Shengwu, Wang would become an ardent party member, and one of Chen’s ardent stalwarts. During Chen and Huaren’s leadership, Zhaoming became an essential member of the party’s central committee, aiding in decision-making and the continued revitalization of China.\n\nAfter the conservative takeover and dominance in the 80s, Wang would become one of the government’s most ardent critics, namely complete acquiescence to the Japanese. Launching a bid for power on nostalgia for the Chen era, populist economics, and further equitable development, Wang would easily wrest control from the conservatives in 1986, ushering his radical faction into power. After a decade in power, Wang is one of the most popular presidents ever to hold the office. With economic modernization finally reaching a zenith, the army reforms finally bearing fruition, and the entrenchment of the party-state, it seems that China is ready to enter its golden age. But Wang and his faction know that China has to accomplish one more goal if it can take its place in the sun, the achievement of true co-prosperity, for the nation and all of East Asia."
 
 #Ministers
 CHI_minister_Zhao_Yaodong_hog: "Zhao Yaodong"
 CHI_minister_Zhao_Yaodong_hog_desc: "Born in Jiangsu, Zhao Yaodong would be part of China’s first nationalist generation. Graduating from Wuchang University in 1940, Zhao would be mobilized as a part of the industrial effort during the Great East Asian War, serving in the national steel industry. After the war ended, Zhao joined the Reorganized Government in Nanjing, becoming a prominent part of Zhou Fohai’s faction within the government.  Following the consolidation of Chen Gongbo’s hold on the presidency, Zhao Yaodong would become the second-in-command of a broad grouping of anti-Chen and pro-Japanese conservatives.\n\nFollowing Ding Mocun’s negotiation of the Tri-Pearl Treaty and his ascendancy to president, he would serve as vice president. Mocun’s unpopular leadership and death from old age would thrust Yaodong to the position of president, and while serving competently, would be ousted as a result of China’s loss in the Sino-Soviet War in 1986, paving the way for Wang Zhaoming and his faction of neo–Chenist radicals to take control of the party. Now, Zhao sits as the most prominent inter-party opposition figure within the government, shuffling the same broad coalition he did under Chen to try and restore sensible governance to the nation."
 CHI_minister_Xu_Lide_eco: "Xu Lide"
 CHI_minister_Xu_Lide_eco_desc: "One of the most brilliant Chinese technocrats and considered to be a financial paragon throughout Asia, Xu Lide is the main force behind the conservative Renovationists, the second most powerful faction within the Kuomintang. Joining the civil service of the republic at a very young age, his unparalleled management skills would catch the eye of prominent conservative technocrat Zhao Yaodong, who would become his mentor in the political world. During Ding and Zhao’s leadership, Xu would serve as a prominent figure in the economic matters of China, with his leadership being credited with the rapid rate of industrialization during the 80s.\n\nLosing prominence with the Sino-Soviet War of 1985, Lide would be a backbencher in the Legislative Yuan till 1994 when he was appointed economic minister at the behest of President Wang Zhaoming, due to recent conservative gains within the party. Now, Xu stands as the strongest conservative voice within a cabinet full of radicals and seeks to restore a government of rationalism, pragmatism, and developmentalism, condemning the ideals of the radicals to the dustbin of history."
 CHI_minister_Qiu_Jinyi_for: "Qiu Jinyi"
 CHI_minister_Qiu_Jinyi_for_desc: "Another Jiangsu native, Qiu Jinyi, is part of the young guard within the radicals. He does not originate from the Youth League but from the affiliated chapter at the Academica Sinica. Rising to prominence as an international relations paragon and avid Japanophile, he graduated from Tokyo Imperial University with a degree in politics and international relations and joined the Chinese diplomatic corps, initially serving as China’s ambassador to Hindustan.\n\nRecognized for his diplomatic prowess during the negotiations to end the Sino-Soviet War, he was promoted to deputy minister in 1987. Secretly, Qiu is a part of the constitutionalist faction of the radicals, believers in true democracy, and his recent promotion to foreign minister has been interpreted as a move by President Wang to mend Radical unity, although a constitutionalist in such a high position of power could lead to unchecked consequences for the government."
 CHI_minister_Zhou_Shufu_sec: "Zhou Shufu"
 CHI_minister_Zhou_Shufu_sec_desc: "One of the most feared officials within the Guomindang and a terror even in the military, Zhou Shufu is the last of the ROCAF’s old guard. After graduating from  Huangpu Military Academy as an artillery officer, the end of the war would see many NRA units integrated into the new ROCAF, the official armed forces of the reorganized government, in which Zhou would become a junior officer. Recruited by the Military Affairs Commission as a part of reforming the ROCAF under initiatives by President Chen, Zhou would be recognized as a non-command security logistician. His work in the reformation of the army would prove invaluable during the Northwest Pacification, in which the ROCAF would finally triumph over the Northwest NRA.\n\nRetiring from politics during the 70s, Zhou would be recalled by Wang Zhaoming after the disastrous Sino-Soviet War, which would prompt another reorganization of the army, with Zhou serving as a senior advisor to the military. Building up a strong institution during Wang’s tenure, Zhou’s overseeing of the army would lead to the blooming of radical nationalist sentiments within the army, perhaps turning the organization into a tool beyond the control of the civilian government. But now, Zhou serves as the Minister of Defense, hoping to retire after the end of the Xibei Maneuvers and enjoy a post-political life like he did during the 70s."

