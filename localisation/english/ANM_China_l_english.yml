 CHI_get_law_tooltip: "[GetAssortedLawsDescCHI]"
 CHI_National_Republican_Youth_League_desc: "Established in the aftermath of the §eGreat East Asian War§! as a successor to the §QChiangist§! Three Principles of the People Youth League, the §MNational Republican Youth League§! has functioned as a mass organization, allowing the spread of Wang’s §QTridemism§! to the Chinese youth, building up party cadres from students to peasant youth, and most importantly, instilling a sense of national values and morals into the next generation, ensuring the passing the §Qrevolutionary republican§! torch onto a generation which is thoroughly educated and competent enough to take it.\n\nThe Youth League has also functioned as a source of party ideologues, particularly within the left, as the in-depth study of the §MGuomindang§!’s ideology has led to the formation and rise of radical crusaders and ideological purists within the party, contributing to the §QRadical Revolution§! of the late 1980s. Now, the League stands as one of the firmest institutional bases for the current regime, with more than half of the cabinet originating as a member of the National Republican Youth League."
 CHI_Tri_Pearl_Treaty_desc: "Officially a testament to §ppan-Asianist§! cooperation within the §cSphere§! and §EJapanese§! amenity to Chinese nationalism following the reformation of the §lChinese nation§! in the 1960s, the §STri-Pearl Treaty§! dissolved the §cState of Guangdong§! following its repeated failures and established the §MPearl Special Economic Zone§!, encompassing the three main cities of the region: Guangzhou, Makao, and Honkon. The rest of the territory of the former state was folded back into §lChina§! proper, and the new §Kspecial economic zone§! was governed by a dual administration between the §EJapanese§! and §lChinese§!."
 CHI_Special_Ethnic_Autonomous_Areas_desc: "With the reformation of the Republic of China during the 1960s and 1970s, the regions of §OMongolia§!, §qTibet§!, and §RSinkiang§! would fall under Nanjing’s control once again, reuniting a country that had not been under a single government since Yuan Shikai’s death. Following the demise of the rival government in Ningxia, Vice President Zhou Longxiang re-established the Mongolian and Tibetan Affairs Commission, tasked with the reconstruction of Xinjiang and Tibet, while also building up Kuomintang governments in Mongolia, Tibet, and Xinjiang.\n\nAfter the successful conclusion of the §jNational Reconstruction§! in 1974, President Zhou Huaren would establish §SEthnic Autonomous Areas§! in all three of the regions, formally providing a degree of regional autonomy to local governments in the region, with Mongolia relying on a dual GMD-Tribal administration and Tibet relying on a joint-administration with the Dalai Lama as the formal head of the local government with an extensive Guomindang apparatus backing him. However, during the §eSino-Soviet War§! of 1985, the Xinjiang Ethnic Autonomous Area was abolished in light of a nearly successful rebellion coordinated by the §eCommunist Party of China§! and the §jEast Turkestan Revolutionary Party§!, with it being folded back into China proper as a regular province."
 CHI_Constitutional_Party_State_desc: "Coming from the stage of xunzheng or political tutelage after the Great East Asian War and establishing a §Mconstitutional government§!, the §lReorganized Government§! would transition into the stage of government known as Xianzheng, where under Sun Yat-Sen’s vision, §Mfree elections§! being held and other parties allowed to participate in the political system. However, rather than transitioning to a §Mdemocratic system§!, the new constitution has been used to further entrench the concept of the party-state into the §lChinese government§!. Staying true to its original §eLeninist§! principles, Wang’s government has partified most institutions and offices, keeping the §MGuomindang§! as the sole legal party throughout most of modern China’s history.\n\nBut within the Guomindang, some members seek to make true to the founder’s promises, of a §Mdemocratic§! system, and a fair §lconstitution§!, and while the rest of the party does not seem to care, the concept of true §QXianzheng§! lives on within the §MGuomindang§!, even as they are eclipsed by the more prominent factions."
 CHI_Reorganized_Centralist_Corporatism_desc: "Built on Wang and Chen’s ideas of §cnational corporativism§!, the modern Chinese economy is a synthesis of §Bcapitalism§!, §qdevelopmentalism§!, and §Rsocialism§!, combined to make an ideal economy for rapid industrial transformation and national §amodernization§!. Harkening back to concepts of economic unification and national reconstruction during the 1930s, China’s economy also encompasses the notion of centralism and tying the economy to the national government rather than provincial development, condemned by President Wang Zhaoming as “regionalism”.\n\nFurther developed by the §MRenovationist§! faction has been the concept of state control over the economy, employing statist §jcorporatism§! by directing the national §Kbourgeoisie§! and capital flow through the §ostate apparatus§!, for a more thorough development of the economy during the 80s. The final aspect of the §lChinese economic model§! formulated by Chen and Wang, but developed thoroughly by Wang Zhaoming, has been the concept of §Sautarky§! or self-reliance, as a concept of national sovereignty, and independence from the Co-Prosperity Sphere. This versatile and encompassing economic model has transformed China from a feudal, devastated economy during the 50s and early 60s into the economic superpower and giant it is today."
 CHI_National_Agricultural_Cooperative_System_desc: "During the §lChinese reformation§! and national integration, the party’s biggest obstacle was the §Krural question§!, as they sought how to bridge the gap between the §odespondent and feudal rural areas§! With §athe prospering and developing cities§!. To solve the issue of economic integration and kill the §eCPC§!’s major base of support among the §Kpeasantry§!, Chen and the party would adopt a §Kproductivist§! approach, enabling a minor land reform, while reorganizing much of the countryside into §Krural cooperatives§!, directed by local §MKuomintang§! cadres, heavily increasing the efficiency of the §Kagricultural§! production throughout the nation, and easily integrating into the national economy.\n\nDuring Zhao Yaodong’s presidency, the §Krural cooperative system§! was further consolidated, with a national coordination agency established to account for agricultural domestic markets while maintaining domestic prices and §ainternational§! exports. The consolidated cooperative system now serves as the primary livelihood for millions of §lChinese§! farmers nationwide and has ensured that the famines that used to plague the  §jMiddle Kingdom §! are a thing of the past."
 CHI_Empowered_Executive_Yuan_desc: "Under the governmental structure of the reorganized government, the balance of powers between the §MNational Assembly§! and the §QExecutive Yuan§! is crucial, establishing a semblance of institutional coherence between the party and the president, and defining the bounds of autocracy and inter-party §qdemocracy§!. But with the ascension of the  §lradical clique§! within the §MGuomindang§! to the presidency, the executive yuan has been freed of the restraints established under the §Kconstitution§!, with Wang utilizing his political capital to push the amendment through the National Assembly.\n\nThe empowering of the executive yuan and the constitutional amendment have made China into a de-facto presidential dictatorship, while all the new National Assembly can do is impeach the president, under deemed violations of the constitution, which Wang has been careful not to do, treading the steady line between whatever remains of the balance of powers."
 CHI_Xibei_Maneuvers_desc: "From the fires of the §eGreat East Asian War§!, the §lRepublic of China’s Armed Forces§! had acted as a guardian to the new government in Nanjing. Despite its myriad of failures during the 50s and early 60s, under Chen Gongbo and the Military Affairs Commission, led by Chen Changzu would reform and modernize the armed forces, allowing them to finally defeat the NRA in both the Southwest and Northwest, reunifying the nation. 15 years later, however, that same §lROCAF§! had stagnated into a mess of factional politics, corruption, and patronage, and its humiliation would come full circle with the §eSino-Soviet war§!, the first time it would confront a competent major army, completely being overrun by the §eSoviet Red Army§! and being saved by the §EJapanese§!.\n\nWith the ascension of Wang Zhaoming to the presidency after the ousting of Zhao Yaoding, the first thing he would embark on would be the implementation of a 10-year §Mmodernization§! program for the ROCAF, spearheaded by junior officers, §MGuomindang§! political commissioners and technocrats. The §MXibei Maneuvers§!, as deemed by the president, ensure the transformation of the stagnant ROCAF into a competent, premier military within the Asian continent, ready to take any foe, from Berlin to Moskva or even Tokyo."
 
### Events ###
 CHI_news.1.t: "The Republic of China Seizes the Pearl River Delta."
 CHI_news.1.desc: "China's radical supporters cheer in jubilation as the government announces their official annexation of the Pearl River Delta Special Economic Zone. The region has long been an item of contempt between China and Japan, with China claiming it as rightful Chinese land, only putting up with Japanese control due to their superior strength. With the failure of President Wang Zhaoming's impeachment vote, he now has the confidence and backing to annex the region entirely, having previously already nationalized the region's Japanese assets. Now, China has won the excruciatingly long battle for the Pearl River Delta, and they not only gain control of some of the richest cities in Asia, but deal a huge blow to Japanese pride and its imperial ambitions. China revels  in Japan's shame, and capitalizes immensely, in what is a huge success for both the anti-Japan civilians and Wang himself."
 CHI_news.1.a: "Seems like the White Sun is eclipsing the Red Sun."