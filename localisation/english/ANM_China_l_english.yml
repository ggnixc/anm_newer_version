 CHI_Zhou_Tienong: "Zhou Tienong"

 CHI_minister_Wen_Jiabao_hog_desc: "Every leader needs a candidate for popular appeal. While populists in China are easier to find than rabbits on a sunny day, no populist can match the charisma and appeal of Wen Jiabao. Beginning his career as a geologist and resource prospector in the Shaanxi region, Jiabao built a reputation as an easygoing man, always listening to the concerns of his employees and subordinates. Through this polite and outgoing demeanor, he constructed a network of patronage, attracting the eye of the rising star, Zhu Rongji. Becoming fast friends, Jiabao would rise rapidly through government posts, becoming an advisor to Premier Zhou Longxiang. While Rongji took a break from politics after Qiao Shi’s appointment, Jiabao was appointed President of the Control Yuan, heading Shi’s central bureaucracy. Jiabao would work with the finance ministers to ensure the government could fund Shi’s reforms, especially in establishing the National Healthcare System. Jiabao’s work establishing the pensions and welfare state would make him very popular in Chinese society, and many people would see him as a statesman who truly cared about the people. When Shi retired in 1992, Jiabao was promoted to the President of the Legislative Yuan, spearheading Rongji’s anti-corruption efforts and limiting the size of the federal bureaucracy. As China enters the new millennium, Jiabao continues to be the popular appeal of the Rongji government, the man with the smiling face and the vanguard of the Reorganization faction."
 CHI_minister_Zhang_Qingwei_eco_desc: "Representing the new generation of the Gaizupai, Qingwei is a relatively new entry into politics.  A technocrat by heart, Qingwei graduated from Northwestern Polytechnical University in Xi’an, studying aerospace engineering. Heading the ROC's nascent air design department, Qingwei would aid the ROCAF’s air force by developing new fighters for the army. Those fighter designs would be instrumental in the Great Asian War by actively engaging Japanese fighters and contesting their air superiority over mainland China. For the success of his fighters, Qingwei was promoted to the chair of the National Science and Technology Commission within the Control Yuan. Heading Chinese research and development efforts into weapons and technology, Qingwei would become a party darling, particularly revered by the elders of the Gaizupai. Leaving his post to his protege, Chen Qiufa, Qingwei became an analyst for the Ministry of Economic Affairs, analyzing the effects of Premier Qiao Shi’s welfare reforms. With the retirement of Qiao Shi, Rongji promoted Qingwei to the head of the Ministry of Economic Affairs, earning Qingwei’s devotion. By formulating several policies to lower inflation from the extensive welfare state and excessive government spending, Qingwei quickly became the leader of the young guard of the Gaizupai. Now, as the Rongji government looks uncertain in the face of financial woes and the economic downturn of the Pearl SEZ, Qingwei looks to be the bright, shining flame of the Gaizupai, leading it into the new millennium."
 CHI_minister_Qian_Qichen_for_desc: "A prominent Chinese diplomat and statesman born in Tianjin, China, Qian has played a crucial role in shaping China's foreign policy and international relations for several decades. Qian held various high-ranking positions in the Chinese government.  Qichen's career in diplomacy began in the 1950s, and he steadily rose through the ranks due to his diplomatic skills and expertise. He is known for his pragmatic and prudent approach, advocating for dialogue and cooperation in international affairs. His contributions to China's foreign policy were characterized by a commitment to maintaining stability and fostering positive relationships with other nations. Playing a significant role in the diplomatic rapprochement between the Soviet Union and China during the late 80s, Qian was appointed official ambassador to the Soviet Union in 1986. Continuing his post until 1992, Qian was promoted to the Minister of Foreign Affairs to begin the policy of broad front diplomacy,  attempting to woo regional rivals like the Soviet Union and the Republic of India to ally against the Empire of Japan. Qian has worked tirelessly to foster good relations with both countries. Still, his personal affairs set a dark shadow over the Rongji government, especially the countless bribes he’s taken from other politicians. Ultimately, if anything could bring Rongji’s government crashing down, it would be Qian’s corruption and revelation of his grievances."
 CHI_minister_Zhou_Tienong_sec_desc: "A graduate in agricultural economics, Zhou began his career in local government and steadily climbed the political ranks. He served in various capacities, displaying a keen interest in rural affairs. His commitment to addressing agricultural challenges led him to become a prominent figure in the agricultural revitalization initiative, advocating for modernization and sustainable practices in farming communities.  Becoming a popular politician among rural communities, Zhou became the vice chair of the Control Yuan during the Qiao Shi premiership. A proponent of bridging the rural-urban divide, he would introduce significant agricultural subsidies into the Chinese economies, allowing for greater income for farmers and ensuring that farmers would have stable incomes. When Zhu Rongji ascended to the post of Premier, he appointed Zhou Tienong as the head of the Control Yuan, the cornerstone of his agricultural policy. Continuing his work as administrator of the Agricultural Bureau, he would ensure the agrarian stability of Chinese society by decentralizing large agricultural producers but keeping the extensive supply chains that kept most of China fed. By doubling agricultural output during his time as President, Zhou would contribute to the growing Chinese economy through significant agricultural exports to the Europäische Pakt. Seeing the peasantry of China well-fed, clothed, and educated, Zhou considers his work to be fulfilled and seeks to retire soon."
 
 #starting Ideas
 CHI_Fracturing_Dangguo: "Fracturing Dangguo"
 CHI_Fracturing_Dangguo_desc: "Essential to the government of the Kuomintang since 1921, the principle of the party-state has played a significant role in China's social and economic development. But as progressive democratic opposition to the central government and the Kuomintang itself grows divided among ideological lines, China’s transition to democracy seems to be soon by most international observers. \n\nHowever, as eager as the Chinese populace seems for democracy, the central government disregards this sentiment and shows no inherent desire for a democratic transformation. This has caused the political divide between the liberal-minded factions, the progressive independent organizations, and the Wangist old guard to deepen, with each faction promising their process and management of Minquan."
 CHI_visions: "The Visions of the Father, The Pursuits of the Uncle"
 CHI_visions_desc: "The ideas of Wang Jingwei and his visions for China have left a complex legacy behind in China. Chen Gongbo established the ideological framework of Wang Jingwei Thought when he took power, defining the social, economic, and foreign aspects that China would need to follow to become a credible nation. Constructing a social corporatist economy that combined corporatism and some aspects of socialism to construct an industrial base for China rapidly, Gongbo was seen as the savior of China. \n\nWang Jingwei Thought would become the paramount ideology within the country as every ideologue and political scientist would attempt to interpret it to suit their own needs. Today, the triumph of Wang Jingwei Thought and Chen Gongbo’s interpretations have contributed to the increase in legitimacy and popularity behind the Wangist Guomindang government, proving to be troublesome for the Western exiles and GMD reformists that comprise the Weixinpai."