 ### Ideas ###
 CAU_das_bergbaureich:0 "Das Bergbaureich"
 CAU_das_bergbaureich_desc:0 "Hitler did not invade the Caucasus in 1942 for their territory or their population; the Germans couldn't be more indifferent towards either. It was for what lay beneath the caucasian lands; the endless riches from the earth that fueled the German economy. If Ukraine is the Breadbasket of the Reich and Moskowien its Workshop, then Kaukasien is its Gold Mine - Though the gold here is not yellow, but black. §RAnd where there is Black Gold, there are Red Sands...§!"
 CAU_the_caucasian_experiment:0 "The Caucasian Experiment"
 CAU_the_caucasian_experiment_desc:0 "So different is the policy the Germans implemented in Kaukasien, one would not think it was written by the same men as the rest of Ostpolitik. The same ones who butchered Ukraine and Moskowien had a different target in Kaukasien: its soil, not its peoples.\n\nNational Committees exist in the former SSRs, and Regional Committees in former ASSRs. Above them stands a federal Caucasian Committee, however those below have proven unwilling to surrender their prerogatives to it. Mayors and village elders are elected, although on a non-partisan basis and from a pool of pre-approved candidates. This Caucasian arrangement has functioned for the past 20 years, even if some of the Committees are not as agreeable as the Germans would like. But one thing is certain: if they stand between the Germans and their oil, they will go into the ground and the oil will keep coming out."
 CAU_the_caucasian_experiment_1:0 "The Caucasian Experiment"
 CAU_the_caucasian_experiment_1_desc:0 "So different is the policy the Germans implemented in Kaukasien, one would not think it was written by the same men as the rest of Ostpolitik. The same ones who butchered Ukraine and Moskowien had a different target in Kaukasien: its soil, not its peoples.\n\nNational Committees exist in the former SSRs, and Regional Committees in former ASSRs. Above them stands a federal Caucasian Committee, however those below have proven unwilling to surrender their prerogatives to it. Mayors and village elders are elected, although on a non-partisan basis and from a pool of pre-approved candidates. This Caucasian arrangement has functioned for the past 20 years, even if some of the Committees are not as agreeable as the Germans would like. But one thing is certain: if they stand between the Germans and their oil, they will go into the ground and the oil will keep coming out."
