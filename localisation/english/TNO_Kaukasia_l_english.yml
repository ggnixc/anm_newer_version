 CAU_kontinentale_ol_ag:0 "Kontinentale ÖI AG"
 CAU_kontinentale_ol_ag_desc:0 "Founded as a public-private partnership in which the Government holds all the voting rights and German firms supply the capital, Konti Öl has become more than just a corporation, but also a showpiece of Germany's conquest. The membership list of its Supervisory Board is a who's who of the European economy, its Chairman the Reich Economics Minister himself. If once the IG Farben's Supervisory Board was undisputedly called the Council of the Gods, now it has a competitor for the title.\n\nThe subsidiary in Kaukasien, Ost Öl GmbH, is the main cog in Konti Õl's machine. The Reichskommissariat exists to ensure it has the conditions to operate undisturbed, so long as the contributions from Ost Öl to its budget make up for the tax revenue lost to the Committees."
 CAU_tripartite_government:0 "Tripartite Government"
 CAU_tripartite_government_desc:0 "After Arno Schickedanz's retirement in 1953. Theodor Oberländer took over Kaukasien. But with the Executed Spring, Hitler wanted a tested Party leader to take over, and so Gauleiter and Reich Governor of Upper Silesia Fritz Bracht replaced Oberländer. From his domain, dozens of senior civil servants and Party functionaries flocked to Kaukasien. Together they represent the §rSilesian Clique§! and dominate the politics and administration of the Reichskommissariat.\n\nThe §gWehrmacht§! has maintained a special position in Kaukasien since the war. The economic management, being so crucial to the Reich was never turned over to the Reichskommissariat, but remained under the auspices of a joint Wehrmacht and Four Year Plan institution, the Economic Inspectorate.\n\nBut the Black Gold is guarded by the Black Guard, the third force in this mix. The §bSS§! controls the police and security apparatus, as in other RKs, but has developed a strong hold over the Economic Inspectorate after Rudi Peuckert, an SS man, was appointed its Commander - §Rand the SS is quite keen to keep it this way.§!"

 ### Skeleton events

 
 ### Lost Legion Events
 cau.788.t:0 "A Lost Legion?"
 cau.788.desc:0 "A surprisingly disappointed looking expedition leader for the Kaukasien's in Turkey (investigating their laughably called 'Aryan Super City') has announced that the find was, in fact, not evidence of ancient Aryans colonizing Europe. Instead they have announced after the finding of multiple ancient Roman artifacts that they may have found the location of the infamous lost Roman Legion, the Legio IX - Hispania.\n\nWhile this has sparked much interest from the international community, especially as the Kaukasien's then proved their findings with footage of them unearthing several ancient shields, bits of armor, weapons, and several skeletons. The Kaukasiens however have been humiliated in the eyes of the international community, and the expedition has gotten far less boisterous in their proclamations of their finds. It seems whatever comes of this expedition from here on out will be far less exciting for them, and word has already come that an angered Josias will possibly be scrapping the dig."
 cau.788.a:0 "They find something interesting, and this is the reaction!?"
 
 cau.789.t:0 "An Ancient Calling"
 cau.789.desc:0 "Obergruppenführer Baader, the leader of our now failing Turkish expedition, has sent some strange news. He reports that the archeologists and their guards have reported strange nightmares and dreams, and several have come down with what seems like some form of radiation sickness. They have already procured radiation suits, but their Geiger counters have yet to actually find any sort of radiation poisoning the dig. Instead, they report something much stranger.\n\nBaader claims that while doing regular radio checks, they discovered a strange noise coming over one of the unused frequencies. With further investigation, they found that there is some sort of... signal, or a force, as Baader calls it, coming from somewhere in the site. Baader has already moved forward on investigating this without prompting, but *has* asked for permission to try and create a form of antenna for this strange force. He believes, that with the proper funding and of course, our support, he could potentially focus this energy into one spot.\n\nThe expedition has begun to get out of hand, but who knows what revelation we can make?"
 cau.789.a:0 "He has our blessing, surely the results shall be interesting."
 cau.789.b:0 "Shut down the expedition, this has been enough of a waste."
 
 cau.790.t:0 "Interlopers"
 cau.790.desc:0 "The Kaukasien dig had been nothing if not controversial, and had gained a permanent garrison of protesters, news commentators, and local police watching the ever-growing amount of soldiers and scientists the Kaukasiens have sent to investigate their finds. The most peculiar finding had been what seemed to be a sort of radio antenna that had slowly been erected in the center of the sight, bringing many questions that the international community had been unable to answer.\n\nAnd now it's all gone.\n\nFootage showed the Kaukasiens gathering around the antenna, one man flicking a switch. At first, nothing of peculiarity happened, most of the Kaukasiens even seemed to be growing bored.\n\nThen, it was like there had been a thunder clap. The sky darkened, the sun seemed to set despite it being the middle of the afternoon, and the entire expedition seemed to disappear.\n\nOver the crater a glowing, swirling vortex of energy sat, and from it spewed... Romans. As if they were the legions of old, hundreds of soldiers came out of this vortex, armed with what appeared to be, of all things, machine guns, rifles, tanks and other armaments. Gunshots were soon heard as these strange visitors opened fire on the remaining members of the expedition, and then at those civilians who had not already begun to ran.\n\nReports are saying that the Turkish military has already begun to engage, and that they are losing."
 cau.790.a:0 "W-what?"

