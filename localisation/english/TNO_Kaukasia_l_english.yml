 ## Characters ##
 POLITICS_FRITZ_BRACHT_DESC:0 "A certain mentality prevails throughout the ranks of the Reich's most influential statesmen. One iron-fisted in rule, but cunning in private, with a penchant for showmanship and the ability to produce near-sycophantic demonstrations of loyalty to one's immediate superiors. Fritz Bracht, a former Gauleiter of Silesia with an affinity for gardening, was never one for such politics.\n\nThe devastation of the West Russian War ended in Oberländer's departure from Kaukasien. In need of a successor, Hitler's vision had changed: in times of struggle and reconstruction, a tested party leader was necessary to steer the ship true. In this regard, Bracht was a premier choice, having cultivated a sterling reputation as a modest yet diligent party functionary, more akin to office politics than that of national policymaking.\n\nIt was in this comforting reassurance of stability that Bracht's administration remains a relatively quiet one, striking a needed balance between the powers of the Regional Committees and the arms of German control that hang over the natives. Party functionaries and civil servants across the Reich continue to flock into Kaukasien's governance at Bracht's behest, whilst Konti Öl contracts flourish upon the wings of unshackled corporate freedom.\n\nAnd yet, one must not mistake Bracht's passive nature for one of frailty. He is a figure of unflinching goals and uncompromising vision, and Kaukasien is to be his administrative chef-d'oeuvre. Through careful navigation of native affairs, inter-organizational rivalries between Party and SS officials, and the ever-encroaching demands of the Georgian National Committee, the ever-churning oil fields of the Reich may bellow away for a thousand years longer. For Bracht, there could be no greater pleasure."
 POLITICS_OTTO_WACHTER_DESC:0 "Dr. Otto Gustav von Wächter was never one for excuses. He tolerated none during his governorship of Krakau during the war, overseeing the extermination of Poles, Jews, and all the other rats who scurried beneath him. He accepted little from his predecessor in Galicia, Dr. Karl Lasch, when the latter begged Himmler for clemency before his execution. In this regard, Kaukasien would be no different.\n\nAn early member of the Austrian National Socialists, his life has been one of intimate correspondence with the German levers of state. It was his involvement in the July Putsch that lost him his Austrian citizenship, yet it would be these expressions of loyalty to the Reich that would soon earn him an audience, and a place, with the Reichsführer-SS. A knowledgeable lawyer, and fiercely devoted to the Aryan cause. What more could they desire from such a young man?\n\nWith Bracht's resignation, the Schutzstaffel did not hesitate to seize the tantalizing opportunity put before them. Their behest has produced a seasoned administrator, steadfast in loyalty, now charged to guide the oil-drenched ship of state true and provide a thirsting Reich its vital nectar.\n\nSuch a simple objective, yet as the Azeris and Armenians sharpen their swords, the tendrils of the Reichskommisariat continue to stretch beyond their limits. None of it matters to Wächter, for his objective was non-negotiable. No crisis would sway him. No council would impede him. Now, they would toil, as they always have. They must."

