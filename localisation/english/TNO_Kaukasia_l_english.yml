 CAU_Josef_Adams:0 "Josef Adams"
 CAU_Josef_Adams_hog_desc:0 "§YDeputy Reichskommissar & Head of Main Department of Administration\nRosenbergite Tendency§!\n------------\nBorn Adamczyk, Josef Adams was a power player in Silesian politics, both Party and state, before and beyond the war years—and a committed National Socialist throughout the movement's four-decade lifespan. Flocking to Kaukasien alongside dozens of senior civil servants and Party functionaries once Fritz Bracht was appointed Commissar in 1957, Adam has served as a loyal deputy to his colleague and mentor ever since. In this eastern land, he represents a pillar of the ruling Silesian clique."
 
 CAU_Hans_Joachim_Tesmer:0 "Hans-Joachim Tesmer"
 CAU_Hans_Joachim_Tesmer_hog_desc:0 "§YDeputy Reichskommissar & Head of Main Department of Administration\nNational Socialism§!\n------------" 
 
 CAU_Otto_Brautigam:0 "Otto Bräutigam"
 CAU_Otto_Brautigam_for_desc:0 "§YRepresentative of the Foreign Office to Reichskommissariat Kaukasien\nRosenbergite Tendency§!\n------------\nDr. Otto Bräutigam is a doctor of law by education, and has been a civil servant for over 40 years. Serving in diplomatic missions in the USSR prior to the war, he served in East Asian foreign affairs after that position's obsolescence. In Kaukasien, his position shapes interaction with neighboring states and Germania, affording him the freedom to resist association with cliques and assert his own vision. Through his associate Georg Leibbrandt and nephew Hans Otto, both in Ukraine, Bräutigam has developed a reformist bent."
 
 CAU_Rudi_Peuckert:0 "Rudi Peuckert"
 CAU_Rudi_Peuckert_eco_desc:0 "§YCommander of the Economic Inspectorate Kaukasien\nNational Socialism§!\n------------\nA man of agriculture by education and family, Rudi Peuckert seems at first glance unfit to manage this land of oil fields. Since 1933, however, he has also been an SS man, quickly rising up the organization's ranks to Peasantry Adviser until 1941. His focus shifted outside the SS for a time, but in Kaukasien it has again come to dominate his career, Peuckert now serving as a powerful anchor of the SS Clique. This territory, rich with the black blood of the Earth, shall be decided only by he who is willing to shed red blood upon it."
 
 CAU_Konstantin_Kammerhofer:0 "Konstantin Kammerhofer"
 CAU_Konstantin_Kammerhofer_sec_desc:0 "§YHigher SS and Police Leader in Kaukasien\nNational Socialism§!\n------------\nKonstantin Kammerhofer has always been a fighter. In the Great War, in the interwar years, and in Germany's rise to greatness. An Austrian, Kammerhofer has involved himself in paramilitaries and coup attempts in the Balkans and then the East for decades, building up a career in the Schutzstaffel throughout. As police commander, he wields fierce influence for Kaukasien's SS clique, but this may not last; Kammerhofer is a 19th century man, and younger blood may be needed for a new era."
 
