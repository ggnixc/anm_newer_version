 #LEADER DESCRIPTIONS#
 POLITICS_KONGULU_MOBUTU_DESC: "Once upon a time, a time almost beyond memory, ages and ages ago, Congo was a paradise. Then the Belgian colonialists came and destroyed everything. They forced our people to work in mines, to dig up precious stones for the vanity of their kings and rape our sacred land. Worst of all was the adoption of language and customs from them. Then came the Germans, who made the Belgians look like angels when it came to brutality. Kongulu's father tried to bring back that golden past, the days when a man could walk without fear through his own land. But people seem to refuse to wake up. They ousted his father and continue to deny their past. Kongulu was furious. Although he was a child when his father died, he was always proud of his father's work, and imagined himself fighting alongside his father against foreign influences in the nation and re-educating the people on what they should be proud of. It is inconceivable that the Congo would continue to live as if it were ashamed of its African heritage, for if a nation is ashamed of it's heritage, what is to be of that nation? There is no place in Zaire for all the nonsense of the OFN or the International, for these are but the white man's newest forms of colonialism. Kongulu will avenge his father, and his people will reconnect with their pre-colonial past, whether willingly or no."


