 #ideas
 GNG_Our_Identity:0 "What is Our Identity?"
 GNG_Our_Identity_desc:0 "What is the Identity of the Pearl River Delta? In Nanjing's eyes, the reintegration of Guangdong back into the rightful hold of the Republic of China would also disappear the connections of the people to the region. However, the Zhujin people and Japanese expats that remain in the Autonomous SEZ have had other thoughts. Many have resisted further integration and merger of the Mainland and the Pearl River Delta, with a separate identity having been formed in the years of Morita. \n\nAs China grows and enters the New Millennium, its ambitions continue to grow further. The desire of Nanjing for a Single, United and Unitary China and the peoples of the Pearl River Delta resisting such change will certainly butt heads in the future.§!"
 
 GNG_Sony_Empire:0 "The Sony Empire"
 GNG_Sony_Empire_desc:0 "The Ambitions of Morita and Li, along with the Strength of Sony and Chueng Chong have finally bested over their corporate rivals in Tokyo and implemented the Capitalism with a Human Face that Morita had dreamed of. Facing Opposition, Corruption and Balancing between the Two Giants of Asia, Morita and Li passed Ordinance by Ordinance in the Legislative Council slowly but surely, reforming Guangdong into a place where the Local Chinese and Zhujin can be proud of, live comfortably in, have an identity and a place to call home. \n\nThe Great Asian War came at a horrible time for Guangdong and Morita, as the Infernos in Asia threatened to put out the young flame of Guangdong. Li's Proposal of Reintegration into China as an Autonomous SEZ was surprisingly well received by Nanjing and Gao, with Guangdong being spared from the worst sieges and battles. Norio Ohga inherited Morita's Legacy in 1982 with the latter retiring due to old age, and he will continue to advance Sony into the New Millennium.§!"
 
 GNG_Across_The_Pearl_River:0 "Across the Pearl River"
 GNG_Across_The_Pearl_River_desc:0 "As one of the conditions for Guangdong to transition into a Special Economic Zone of the Republic of China, the Chinese Army and Nanjing has taken over the garrison and security duties of the Pearl River Delta. Unlike our times as an "independent" nation under Japan's watch, we are not allowed a token military force for self-defense and the testing of military equipment. \n\nWhile this has freed up our budget for investing in other purposes, the fact of the matter is whatever action is taken in the Legislative Council, the spectre of Nanjing will always be watching, and they will not be afraid to take action should the LegCo pass any Ordinance that China disapproves of.§!"
 
