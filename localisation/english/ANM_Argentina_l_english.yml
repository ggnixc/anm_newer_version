 #DESC
 POLITICS_MANUEL_ANCHORENA_DESC: "Manuel de Anchorena’s unorthodox, deeply-authoritarian government would make even the most radical of fascists green with envy — and it came to rule Argentina following the death of Juan Perón in 1974. Despite stiff opposition to his radical, authoritarian ideals, Anchorena’s tenacity, wealth, and connections would prove enough to crown him the supreme leader of the Justicialist Confederation of Argentina.\n\nOnce in power, Anchorena moved quickly to cement his dominant position, riding the coattails of Perón and Rosas to mount his own cult of personality. By 1978, a series of backroom deals, bribes, and purges had fully crystallized Anchorena’s hold on the reigns of power. With no one left to stop him, Anchorena worked around the clock to pass a number of reforms that would allow him to fully realize his vision of a fascist Argentina. Dissenting voices were silenced, rights were heavily curtailed, and any slight whiff of liberalism was scrubbed from the constitution.\n\nUnder Anchorena, Argentina’s extensive military buildup and aggressive posturing would make the nation a pariah among democratic states. Wielding the largest military in all of South America, Anchorena would intervene in what would become the Chaco War of 1983, decisively defeating Paraguay and shepherding the Camba Nation into Argentina’s sphere of influence.\n\nDespite Anchorena’s impressive resume of military accomplishments and populist policies, all is not well in the land of Argentina. The country’s flagging economy, beset by rampant inflation and frighteningly-high unemployment, leaves the strongman in a vulnerable position. From the left, pro-democracy forces wait in the shadows, ready to restore the old ways at the first sign of weakness. Elements from the Perónist far-right, meanwhile, lurk around every corner, determined to depose their leader should he stray too far from “true Perónism”.\n\n§VArgentina stands at a crossroads, and Anchorena can no longer take his position for granted. Such is the price he must pay for presiding over such interesting times — one wrong step could send him careening into the ash heap of history..."

 #Ideas
 ARG_Shadow_Peron: "The Shadow of Perón"
 ARG_Shadow_Peron_desc: "Juan Domingo Perón. How could it be that this single name could wield so much unfettered power? Perón’s looming legacy is as complicated as it is mystifying, but even among the former dictator’s most ardent critics, one thing is certain: Perón is Argentina, and Argentina is Perón.\n\nEven today, the cult of Peronism lingers above Argentine politics like an all-seeing eye. Though no explicit laws banning non-Peronist parties exist, the current government — and every politician, secretary, and bureaucrat working within it — must hold up the bizarre ideology’s perplexing ideals if they wish to wield any modicum of popular or institutional support. Any slight deviations from Peronist dogma could easily spell the end of any mandate, even that of the President.\n\nWith no end in sight, Perón’s ever-present shadow looms large over the land of the Silver River. It seems that only the second coming of Jesus Christ could ever return this impoverished, stagnant nation to some semblance of normalcy...\n\n§V...but, like everything else in Argentina, even that’s up for debate."
 ARG_Years_Hunger: "Years of Hunger"
 ARG_Years_Hunger_desc: "The Argentine economy is like an artificial tree stuffed into the corner of the world’s drabest office space — most don’t even notice it’s there, and no matter how much water is poured upon it, it will never, ever, ever grow.\n\nArgentina’s prospects weren't always so pessimistic. The nation experienced a respectable level of growth in the ‘60s and ‘70s, but thanks to a mismanaged, ideological government stuffed to the brim with incompetents, decades of stagnation have hampered any chance Argentina could have had at projecting its economic power throughout South America.\n\nWhile the top brass among Anchorena’s submissive suite of sycophants eat like kings, the poor and downtrodden of Argentina haul the crushing weight of their failures. Each year, poverty, unemployment, and inflation soar to new, horrifying heights — and, as the emaciated waistlines of the Argentine populace grow ever thinner, so too does their patience...\n\n§VBut what kind of change could a bunch of riled-up vagrants ever hope to achieve...?" 
 ARG_Bureaucratic_Nightmare: "Bureaucratic Nightmare"
 ARG_Bureaucratic_Nightmare_desc: "Between its oversized military, bloated bureaucracy, and overzealous system of totalitarian repression, everything is bigger in Argentina. Such a sprawling government apparatus seems absurd to anyone with a lick of common sense, but to President Anchorena, these excesses are a necessary step in Argentina’s path toward South American supremacy.\n\nGod bless whatever remains of Anchorena’s dwindling supply of devotees; the blind faith required to not see the writing on the wall is truly a superhuman feat of mental strength. In practice, Anchorena’s constant purges and strict standards for government participation have led to a considerable deficit in manpower — a pressing concern for any dictator wishing to helm such an incredibly large bureaucracy.\n\nBecause of this perennial labor shortage, the Argentine government employs almost as many empty chairs as actual people — a dire situation that greatly hampers the efficiency of its institutions. To remedy the situation, Anchorena’s “Great Dictatorship” has been forced to reach further and further toward the bottom of the barrel, filling vital positions with bootlickers, naive ideologues, and all manner of corrupt wastrels — anything to keep the trains running on time."  
 ARG_Grande_Dictadura: "La Gran Dictadura"
 ARG_Grande_Dictadura_desc: "Juan Perón’s own quixotic brand of populism has inspired many a copycat both inside and outside Argentina’s vast frontiers. But when Perón’s immediate successor — President Manuel de Anchorena — took command of the country in 1974, there was another autocrat he yearned to emulate — the “Restorer of Laws”, Juan Manuel de Rosas.\n\nLike soft clay, President Anchorena would, using de Rosas’ extreme methods as inspiration, mold his country into one of the most brutal totalitarian societies to ever exist in the Western Hemisphere. Whatever remaining scraps of individual liberties hitherto enjoyed by the Argentine populace were excised from the constitution with surgical precision, setting the stage for Anchorena’s total control — and all the state terrorism, obsessive surveillance, and mass purges that naturally came with it.\n\nThroughout all three million square kilometers of his sprawling fiefdom, President Manuel de Anchorena's regime is known, sometimes ironically, and sometimes not, as La Gran Dictadura — The Great Dictatorship. His power? Absolute. His word? Gospel. Nothing, it seems, can emancipate the River of Silver from his total control."
