 # Organization of American States
 RegionalOrganization_OAS: "Organization of American States"
 RegionalOrganization_OAS_colored: "§a$RegionalOrganization_OAS$§!"
 RegionalOrganization_OAS_desc_0: "The Organization of American States claims an illustrious heritage for its Pan-American vision, cloaking itself in Simón Bolívar's mantle. To its independent member states, the OAS offers a regional forum where all speak and vote with an equal voice, where the liberal values of non-intervention, individual rights, and representative democracy are promoted, and where disputes are resolved by the arbiter's pen instead of the warrior's sword.\n\nHeadquartered in Washington D.C., the OAS is also an instrument of U.S. power and diplomacy in Latin America. Its charter may hold the hemisphere's states equal, but one nation's military might and economic heft speaks louder than any document's words. So long as joint defense and collaborative development remain OAS priorities, only uncommon displays of Latin unity or moral force will divert the Organization from Washington's preferred course."

 # Veracruz Pact
 RegionalOrganization_VeracruzPact: "Pacto de Veracruz"
 RegionalOrganization_VeracruzPact_colored: "§K$RegionalOrganization_VeracruzPact$§!"
 RegionalOrganization_VeracruzPact_desc_0: "The Veracruz Pact is not an organization. It has no offices, it has no staff. Its sole physical manifestation is a rigorously compiled dossier in the Secretariat of External Relations, documenting extensive back-and-forth between President López Mateos, Secretary Tello Baurraud, and the Cuban and Venezuelan governments on how to deepen their nations' ad-hoc partnerships.\n\nThe files detail a meeting soon to be held in the Caribbean port of Veracruz, Mexico between Mateos, Castro and Larrazábal. They argue for the establishment of a forum, one to represent the disparate revolutionary states and movements of Latin America. Between their lines, one can read of a coalition to stand tall and proud against the imperialist forces of the world. One can read of a dream."

