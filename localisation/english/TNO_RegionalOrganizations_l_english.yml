 # Europäischer Staatenbund/European Confederation
 RegionalOrganization_EU: "Europäischer Staatenbund"
 RegionalOrganization_EU_colored: "§Q$RegionalOrganization_EU$§!"
 RegionalOrganization_EU_desc_0: "The £eec_texticon §QEuropean Confederation§!, a new political union of German-aligned European states, is the political evolution of the Europäische Wirtschaftsgemeinschaft. Joining together the states of the European regions of the Einheitspakt in bonds of iron, the EC structure and bodies will work to further European integration. The final goal: a pact of brotherly nations—or, more accurately, the willing and perpetual submission of the nations of Europe to their eldest and most noble kinsman, the German Reich, rightful hegemon of the European continent."

