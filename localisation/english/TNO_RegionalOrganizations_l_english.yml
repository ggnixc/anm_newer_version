 # Central Africa Development and Assistance Treaty
 RegionalOrganization_CADAT: "Central Africa Development and Assistance Treaty"
 RegionalOrganization_CADAT_colored: "§l$RegionalOrganization_CADAT$§!"
 RegionalOrganization_CADAT_desc_0: "As American officials put it, the Traité d'assistance et de développement pour l'Afrique centrale, or CADAT, is a 'great visionary program' which employs the US and the Congo as equal guarantors of prosperity; bulwarks of security within a region deeply threatened by Nazi imperialism and political instability. Among the African member countries, TADAC bears a more complicated image.\n\nBuilt upon a framework laid out by some of the last treaties to mention the United Nations, the organization's name belies what is, at its core, a security agreement. One that, much like the wartime treaty it sprung from, centers the Congo as the dominant member of a chain of American-aligned countries with Central Africa.\n\nMuch effort goes into keeping up appearances: bridges are built, rivers are threshed, roads repaired. But, no matter where the works are, the same guns guard them, the same badge adorns the engineers working them, the same flag proudly flies ahead of all but the star-spangled banner- golden stars, and a deep, oceanic, blue."

