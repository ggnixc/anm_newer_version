 # The Commonwealth (London)
 RegionalOrganization_CollabCommonwealth: "British Commonwealth"
 RegionalOrganization_CollabCommonwealth_colored: "§Z$RegionalOrganization_CollabCommonwealth$§!"
 RegionalOrganization_CollabCommonwealth_desc_0: "The Commonwealth was envisioned as a free association of nations united by the Crown, and indeed functioned as such—until that Crown was torn down and that free association collapsed. Today, the Commonwealth is a hegemonic organisation centered solely around Britain, operating mainly as a cultural and propaganda front for the British Empire.\n\nThe Empire exiled in Ottawa contents itself with an almost imaginary bond to its increasingly vestigial possessions. The modern British Commonwealth, on the other hand, is confined to three clades: Britain itself, Britain's African possessions, and German-aligned states with historical ties to Britain. What legitimacy and power the Commonwealth enjoys is inextricably tied to the Empire; it will accordingly live or die based on the success or failure of British forces in Africa."

 # Central African Federation
 RegionalOrganization_CentralAfricanFed: "Central African Federation"
 RegionalOrganization_CentralAfricanFed_colored: "§Z$RegionalOrganization_CentralAfricanFed$§!"
 RegionalOrganization_CentralAfricanFed_desc_0: "The Central African Federation is a child of Britain's post-war Empire, built to ensure that the colonies of Southern Rhodesia, Northern Rhodesia, and Nyasaland remain inter-linked and inter-dependent - all building their economies into one bloc under London's direction, to serve the interests of the settler population and the Colonial Office. However, the federation's boundaries are not strictly limited to the three Central African colonies, and several other candidates have been seriously proposed for it, including ones that are not de jure part of Britain's Empire.\n\nHowever, the purpose behind these proposals is not to integrate them into a true federation, but to facilitate economic partnerships. This is because the CAF is meant not to build a single state but to make the separation between the region's colonies economically feasible. The white supremacist regime of the British People's Party has naturally found a partner in the settler-colonists of Southern Rhodesia in their efforts at sustaining the Empire, and they serve within the CAF as the on-the-ground enforcers of Whitehall's policy, reaping economic rewards in exchange. The symphony may be composed in London, but the orchestra plays in Salisbury."

 # French Colonial Empire
 RegionalOrganization_FrenchEmpire: "French Empire"
 RegionalOrganization_FrenchEmpire_colored: "§Q$RegionalOrganization_FrenchEmpire$§!"
 RegionalOrganization_FrenchEmpire_desc_0: "Through all trials and tribulations, the French Empire has survived into the New Order, even if the assimilationist experiments of the late Republic have not. Paris now manages colonial affairs on the basis of explicit white supremacy and separate racialised societies via a "direct rule" system where the Métropole's orders are passed obediently along the line from the Governors-General down to appointed village chiefs. The National Revolution's technocratic streak has also made its mark on the colonies - major developmentalist projects and concerns run roughshod over local communities and have priority access to a wide pool of forced labor.\n\nAlthough the intricate and byzantine systems of imperial administration - with its so-called "imperial citizenship", civil servant schools, and the Council of the Empire - may be occluded from the everyday affairs of the French mainland, the average Frenchman is very proud of the Empire, and this is no accident; the state has always sought to instil a sense of prideful imperial consciousness in the people, be they in the Fatherland or the colonies. After all, the history of the last few decades has certainly shown that the fortunes of France are dearly bound to those of its Empire, one way or another."

 # The Commonwealth (Ottawa)
 RegionalOrganization_ExileCommonwealth: "Commonwealth of Nations"
 RegionalOrganization_ExileCommonwealth_colored: "§V$RegionalOrganization_ExileCommonwealth$§!"
 RegionalOrganization_ExileCommonwealth_desc_0: "A ghost of the pre-war world, the Commonwealth of Nations was once intended to be a 'free association of nations united by the British Crown' - it is now a free association of nations united by nothing. Like a decapitated body, the central economic, political, and military organs which bound the Commonwealth nations together have been long-since violently severed, and while Canada has de facto taken up the mantle of primus inter pares, they've struggled to establish real leadership.\n\nRather than the cruelty and brutality of the British Empire, the Canadians have trended toward a softer touch, preferring diplomatic means to manage relations between a massively disparate group of states including the 'White Dominions', the islands of the West Indies, and radical Pan-African republics, with limited success. The Commonwealth being such an eclectic ideological muddle even affects the organization's own geopolitics, with a pro-OFN attitude predominant but not universal amongst member states, and inter-Commonwealth disputes still a regular occurrence. United only by a nominal acknowledgement of the 'Queen over the Water', the Commonwealth is a vestigial organization that struggles to retain its identity and relevance in the New Order."

