 # Helsinki Treaty
 RegionalOrganization_HelsinkiTreaty: "Helsinki Treaty"
 RegionalOrganization_HelsinkiTreaty_colored: "§D$RegionalOrganization_HelsinkiTreaty$§!"
 RegionalOrganization_HelsinkiTreaty_desc_0: "The Helsinki Treaty came about through a diplomatic and political domino effect set off by the Åland Convention of 1921. The convention, intended to solve a territorial dispute between the two nations, was pushed further by Rickard Sandler, the Fennophilic foreign minister of Sweden, in 1939. By mutual agreement, the Åland Convention was dissolved and replaced with the Stockholm Plan wherein Finland and Sweden both acted as guarantors of the island's security while still keeping it demilitarised.\n\nSweden's final commitment to the agreement was what led to its entrance into the Winter War, laying the grounds for the Helsinki Treaty. During the late-Forties Fagerholm ministry, Helsinki sought to reorient itself back towards Sweden. This mutated the Stockholm Plan into the Helsinki Treaty, remilitarizing Åland completely and making Sweden and Finland defensive allies. The two nations have used this alliance to keep Germany at arms' length by increasing dependence on one another instead."
 
 # Adana Treaty Organization
 RegionalOrganization_ATO: "Adana Treaty Organization"
 RegionalOrganization_ATO_colored: "§e$RegionalOrganization_ATO$§!"
 RegionalOrganization_ATO_desc_0: "The Adana Treaty Organization; or Adana Pact, as it is more commonly known, was founded in 1949 as an organization for political and economic cooperation in the Middle East. Officially, ATO is a partnership of equals that tracks the needs of the member states with a cadre to devise development plans and acts as a diplomatic forum in the region, acting as a beacon of neutrality with a certain distance.\n\nWhile these aims are noble and well intended on paper, the following years quickly proved what the pact actually was; a shield for Turkey to protect itself from external influences, and a tool to preserve the existing system through counter-insurgency planning to keep Turkish aligned and allied regimes in power. And yet, despite not even anyone believing in the formal character of the pact, the leaders maintain an optimism to realize the ideals set at the beginning."

