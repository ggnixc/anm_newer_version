 # Iberian Empire
 RegionalOrganization_IberianEmpire: "Iberian Empire"
 RegionalOrganization_IberianEmpire_colored: "§f$RegionalOrganization_IberianEmpire$§!"
 RegionalOrganization_IberianEmpire_desc_0: "For centuries, Spain and Portugal have planted their flags on the African continent. However, the idiosyncrasies of each government caused them to have vastly different colonial systems, which, after the formation of the Iberian Union, caused severe headaches for the Caudillos. The colonies were thus put under a policy of non-interference between the two nations. Spain would not interfere in Angola, Mozambique, and other Portuguese colonies, and Portugal was not to interfere with Morocco or Guinea, but they would all be under the banner of the Iberian Colonial Empire. Even then, it cannot be considered a unified empire, but a sum of several different parts. As time progresses, the colonies have each developed its own system of governance; all under the watchful eye of the metropole."

 # Ibero-American Conference
 RegionalOrganization_IberoAmericanConference: "Ibero-American Conference"
 RegionalOrganization_IberoAmericanConference_colored: "§u$RegionalOrganization_IberoAmericanConference$§!"
 RegionalOrganization_IberoAmericanConference_desc_0: "Formed in the 1950s to improve relations between the Dominican Republic, Colombia, and the Iberian Union, the Ibero-American Conference has been used for a simple reason: managing the many friendship and cooperation treaties signed between Iberia and its American allies. The Union does not necessarily use it to further relations between member states, but there is nothing stopping those nations from using it for that purpose. At the organization's rare meetings, economic cooperation, cultural ties, and other subjects are all discussed - but further integration is off the table."

 # Lusophone Community
 RegionalOrganization_LusophoneCommunity: "Lusophone Community"
 RegionalOrganization_LusophoneCommunity_colored: "§&$RegionalOrganization_LusophoneCommunity$§!"
 RegionalOrganization_LusophoneCommunity_desc_0: "Created as a joint venture of Brazil and Portugal, the Lusophone Community was made to further cooperation within the Portuguese-speaking world. To outsiders, the Community is a simple economic organization, but its main members have very different goals for it. Portugal, even if under the banner of the Iberian Union, does not enjoy Spain's deterioration of relations with the OFN and encroachment into its politics. Thus, it has chosen to use the Community, and specially Brazil, as a way to defend its interests to the Americans. Brazil, on the other hand, uses the Community as a means to further its own international standing and champion the decolonization of Africa, much to the chagrin of Iberia."

 # African Labour Board
 RegionalOrganization_AfricanLabourBoard: "African Labour Board"
 RegionalOrganization_AfricanLabourBoard_colored: "§r$RegionalOrganization_AfricanLabourBoard$§!"
 RegionalOrganization_AfricanLabourBoard_desc_0: "The African Labour Board is an international treaty and organization made up of a wide array of colonial empires, settler states, and independent majority-rule nations in Africa, bilaterally managing areas of shared concern - migration control, workforce, and remittances.\n\nWith migrant labor a staple of the African economy continent-wide, the Board exists to formalize and regulate the migration of this labor force and the remittances they send back, so that migration quotas are met, and remittances can be extracted and taxed by the Board itself and the relevant signatory state. There are two types of signatories to the Board - the 'producers' of a labor force and the 'consumers.' South Africa is purely a consumer, the independent African nations are producers, and the colonial empires are both.\n\nFor the countless Africans who leave their homes to sell their labor abroad, the Board is a layer of bureaucracy they legally must interface with to provide for their families, but it is also a means to surveil and screen their political loyalties and affiliations. While European settlers face zero restrictions or regulations on their work or travel from the Board, the lives of the vast majority of migrant laborers are just input on a ledger, expected to suffer any abuse, exploitation, or indignity so long as there is still work to be done.\n\nAnd there is always work."

 # Italian Empire
 RegionalOrganization_ItalianEmpire: "Italian Empire"
 RegionalOrganization_ItalianEmpire_colored: "§K$RegionalOrganization_ItalianEmpire$§!"
 RegionalOrganization_ItalianEmpire_desc_0: "Only a few short decades ago, the world knew Italy as the 'last and the least' of the Great Powers. Mussolini inherited a stillborn empire when he took Italy's destiny into his own hands, but it emerged from the Second World War an empire straddling three continents, from the Aegean to the Indian Ocean.\n\nToday Italy is as much a product of its empire as the empire is a product of Italy. Life is shaped in uncountable ways by the nation's grand dominion: home pantries hold the harvest of far-off plantations; school textbooks proclaim the glory of this neo-Rome. Italy's colonial sudditi are also taught of this glory, but all that means to them is racial segregation, forced labor, degradation, and deprivation. The Vatican's state-sanctioned emissaries assure them that they are as much children of God as their European counterparts, but there is scant evidence to be found. Those living within protectorate states may fare better, but they too are ultimately subordinate to Italian interests.\n\nOwing to long-standing demographic concerns, Italy has prioritized settlement in the colonies, its hard-won spazio vitale. Promises of blooming deserts and frontier adventure have resulted in a new Italian diaspora: hundreds of thousands inhabiting segregated cities of neoclassical design while their sons are sent to guard against the unending threat of native resistance."

 # Southern African Customs Union
 RegionalOrganization_SACU: "Southern African Customs Union"
 RegionalOrganization_SACU_colored: "§J$RegionalOrganization_SACU$§!"
 RegionalOrganization_SACU_desc_0: "Conceived in the aftermath of the Second Anglo-Boer War, the Southern African Customs Union is the world's oldest Customs Union still functioning. Invented to strengthen trade links between the Southern African colonies and thus secure revenue and resources, the SACU has been repurposed following the fall of the Home Islands at the hands of the Germans and the seizure of the High Commission Territories by the Smuts government.\n\nFor all intents and purposes, the cause of colonial extraction of wealth and minerals continues, but with Pretoria reaping the benefits, the SACU acting as an extension of its economic dominance over its neighbors. While its reach has been limited, proposals have been made to expand upon the concept by establishing a "Commonwealth of Southern Africa" between the Republic and its regional partners."

 # Monrovia Conference
 RegionalOrganization_MonroviaConference: "Monrovia Conference"
 RegionalOrganization_MonroviaConference_colored: "§B$RegionalOrganization_MonroviaConference$§!"
 RegionalOrganization_MonroviaConference_desc_0: "A product of the OFN's wider African strategy of the 1950s, the Monrovia Conference is an organization founded and based in the capital city of the Republic of Liberia. As host nation and de facto leader, Liberia uses the organization as a means of managing its interests across the continent, particularly their West African neighborhood. Although the organization claims to be guided by liberal principles of self-determination and anti-colonialism, this is often merely a smokescreen for the virulently anti-communist and settler-colonialist project of the Liberian dictatorship.\n\nMonrovia's critics decry the naked hypocrisy at the core of the organization, which they further charge as being a front for American aid to be funnelled to Liberia's ruling class. Indeed, Liberian policy rarely strays far from American policy, as Washington habitually ignores Liberia's anti-democratic regime so it can use Monrovia to expand their own influence in Africa; this has only become more true as relations between the OFN and the revolutionary government in Ghana have grown colder. The primacy of Liberia is also cause for tension with the Congo, whose role in the organization is overshadowed by a nation far less populous and productive. This mess of contradictions leaves the Monrovia Conference's pretensions toward African unity increasingly suspect, and the organization itself solely propped up by American money and arms."

