 # Ostministerium
 RegionalOrganization_Ostministerium: "Ostministerium"
 RegionalOrganization_Ostministerium_colored: "§b$RegionalOrganization_Ostministerium$§!"
 RegionalOrganization_Ostministerium_desc_0: "The Ostministerium, or "Ministry for the Occupied Eastern Territories", is the administrative authority overseeing the vast eastern territories conquered from the Soviet Union following the 1941 campaign.\n\nIt exercises control over all civilian administration in these regions and enacts legislation within its jurisdiction. In order to replace the Soviet administrations, the German East has been divided into four Reichskommissariats: Ostland, Ukraine, Moskowien, and Kaukasien, each tasked with administering their part of the newly established Lebensraum. These entities fall under the authority of both the Ostministerium and the Führer, and are governed by a Reichskommissar appointed directly by the Führer. The Reichskommissars are responsible for the administration of their respective territories. They exercise legislative authority delegated by the Ostministerium and implement the Reich's policies in the East.\n\nTheir role is crucial, as they oversee the extraction of vital resources destined for the Reich's vast industrial powerbase, manage relations with the native populations as well as between natives and German settlers, and use their Reichskommissariats as as a strategic eastern bulwark intended to prevent any resurgence of Russia capable of threatening the Reich in the future."

