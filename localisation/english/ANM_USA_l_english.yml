 USA_narrative_event.1.t: "1996 Presidential debate"
 USA_narrative_event.1.desc: "Jim Lehrer held a document in his hands, and then spoke. “Gentlemen, the first topic tonight is trade. The North American Free Trade Agreement has drawn both praise and scorn since its implementation. President Dole, we’ll begin with you.”\n\n“Look, free trade is a cornerstone of American society,” says Dole. “It’s been our agenda since before the Second World War. It was policy under Eisenhower, under Reagan—and it’s worked out pretty well so far.”\n\nPat rolls his eyes, but Dole presses on.\n\n“I’ve been to Ohio. I’ve been to Michigan. I’ve seen the shuttered factories, and I know what they mean to people. But we can’t move backwards just because progress is hard. Free trade has helped build one of the most prosperous societies on Earth. We abandon that now, and we risk losing more than just jobs—we lose our future.”\n\n“Alright, and now for your rebuttal, Mr. Bucanan” says Lehrer.\n\nPat Buchanan starts, “Well, my opponent’s right about one thing. He’s been to Ohio and he's been to Michigan. But I live in that reality. I talk to factory workers who used to have jobs before some suit in Washington signed them away to their amigos down south”\n\nHe looks directly into the camera, a half-smile on his face.\n\n“They call it ‘free trade.’ I call it a raw deal. We’re losing factories, watching our towns rot, while the Mexicans get rich and the guys at Wall Street pop champagne. If this is what ‘prosperity’ looks like, I’d hate to see failure.”\nBuchanan turns back to Dole.\n\n“And let’s be honest—this isn’t just about economics. It’s about sovereignty. It’s about who runs this country. Because if NAFTA is the future, then it won’t be American workers”\n\nHe shrugs, arms open.\n\n“You call that progress. I call it surrender.”"
 USA_narrative_event.1.a: "Free Trade for a Free Society!"
 USA_narrative_event.1.b: "An America for Americans!"
 USA_narrative_event.2.t: "1996 Presidential debate round 2"
 USA_narrative_event.2.desc: "As the last words of Buchanan's closing remarks leave his mouth, he shoots Dole a smug look of satisfaction. Meanwhile, Lehrer reopens his portfolio in preparation for the next topic of debate.\n\n“I think it is time to tackle issues more closely related to the American people. Mr. President, what is your position on Mr. Buchanan's previous statements on environmentalism?” Trying to settle on an answer, Dole began speaking, this time with more confidence: “Of course. I fully believe global warming is real. As leader of the free world, America has a responsibility to address the problems it and its allies face. And while I do not intend to create more programs, I wish to uphold the initiatives that previous administrations have started to diminish—”\n\nBefore he could finish, Buchanan interrupted. “Don't tell me you really believe that communist-fueled hoax now, do you, Mr. Dole?” As his nemesis for the time being, Patrick sought to put forward a statement. Slamming his fist on his podium, Buchanan raised his voice. “This economic malaise is ruining livelihoods! The presidency deserves a candidate with decisive action and a vision for our Lord-abiding country! And what does Mr. Dole intend to do? Uphold programs that throw away taxpayer dollars on tall and shiny wind wheels? It's a sick jo—”\n\n“Gentlemen,” interspersed Lehrer with a solemn voice. “Let us move on to another topic of contention. Mr. Buchanan, do you believe the federal government has the right to guarantee the right to abortion on a national level?” Wasting not a moment, Buchanan erupted in a fiery statement. \n\n“Absolutely Not! The federal government shouldn’t protect abortion—it should end it. If Washington has any rightful role, it's to uphold our moral foundation. Congress must be pushed to act—restore respect for life, and reassert the traditional values this country was built on.”\n\n“I respect Mr. Buchanan's passion, but I believe we must show compassion, too. As a Christian I do not support abortion, however I also recognize there are tragic circumstances: rape, incest, the life of the mother. In those cases, we must allow for exceptions that take into account the tragic realities real Americans face.”\n\nMany accusations and speeches later, Lehrer remained in the room as the clean-up crew did its job. Sorting through his dossier, he could only wonder what the electorate had on its mind."
 USA_narrative_event.2.a: "A Better Man. For a Better America."
 USA_narrative_event.2.b: "America First!"