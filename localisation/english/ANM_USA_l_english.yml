 ###LEADER DESCRIPTIONS
 POLITICS_AL_GORE_DESC: "Albert Arnold Gore Jr. is a man not many would expect to be destined for the Presidency, though few can deny it is as entirely unlikely. Born to Senator Al Gore Sr. A man known for standing among a very few as a Southern Liberal in the 60s, Gore would eventually take his father’s values of staying true to your beliefs and run with them throughout his career.\n\nAfter finishing up his service in the West African War in the late 60s, inspired by his father Gore would enter the realm of politics as an investigative reporter were he would become well known and respected among his colleagues for his hard work and integrity. By the time 1976 rolled around few expected Gore would become a politician, he was interested in politics sure but he had just settled down and entered law school. But then to the surprise of all around him he decided to run for the House of Representatives taking over his father’s old seat.\n\nHe would hold this position for nearly a decade until he entered the Senate in 1985, in total he spent 15 years in Congress. During this time he would become known as a technocratic pragmatist, a champion of the new style of “Atari Liberalism” put forth by President Gary Hart. In terms of policy Gore would spend his time working to balance the budget, invest in new technologies like the internet, and defend the NASA and NHS programs. In 1992 he sought the Democratic nomination for President defeating Arkansas Governor Bill Clinton, He would go on to defeat incumbent Dick Cheney in a landslide victory.\n\nHe has now been President for 7 years, and the average American has come to appreciate his work, including the Mark II Shuttle, the Environmental Responsibility Act, the creation of a budget surplus and with the it the much mocked lockbox, the mass expansion of the internet, and the defense of Human Rights across the globe especially in the recent Congo Crisis. Now in the year 2000 he plans to stay neutral in the upcoming primaries and serve out the remainder of his term with grace and efficiency."
 POLITICS_JOE_BIDEN_DESC: "There is no man more qualified for the office of President Of The United States than Joseph Robinette Biden Jr., the honorable gentleman from Delaware. Born to a working class family in Scranton, Pennsylvania, Biden would start his career as a lawyer shortly after graduating from the University of Delaware and Syracuse in 1968.\n\nIn 1972, riding on the wave of Democratic support that accompanied President Hart’s reelection campaign, Biden found himself victorious in the Delaware Senate race. Elected at not even the minimum age of thirty years, he found himself just passing the age requirement mere months ahead of his inauguration, thus becoming the youngest member of the Senate. In his new role, Biden fostered a reputation as a staunch supporter of Phillip Hart’s Urban Renewal Initiative, defending it against an attempted repeal on the Senate floor during the Reagan years.\n\nAfter a failed run for President in 1984, Biden decided to refocus on his Senate career, going on to chair the Senate Foreign Relations and Judiciary Committees. During this time, he developed his reputation as a bipartisan moderate and a supporter of so-called “Atari Liberalism”. In 1992, he was one of the first Democrats to back his fellow senator Al Gore in his run for the Oval Office. Once Gore received the nomination, he would tap Biden as his running mate, bringing two decades of experience and connections onto the ticket.\n\nAfter 8 years of working alongside President Gore, Biden decided to once again pursue the Presidency for himself. After a hard-fought primary against progressive challenger Tom Harkin, Biden won the Democratic nomination and, later that year, the general election. Now, at last sitting at the head of the table, Biden stands at a crossroads between bipartisanship and real change."
 POLITICS_TOM_HARKIN_DESC: "Thomas Richard Harkin, the “fighting man from Iowa”, comes from humble beginnings. Born to a coal mining family in the small town of Cumming, Iowa, Harkin experienced the struggles of the American working class throughout his childhood. His rough upbringing, however, didn’t put a damper on his ambition. When Harkin’s 3rd Grade teacher asked him what he wanted to be when he grew up, Harkin didn’t hesitate with his answer -- He wanted to be President. Little Harkin’s dream didn’t falter throughout his school days, and he would eventually graduate from University with a degree in Government and Law.\n\nThe outbreak of the South African War, however, would put his career plans on hold. In the Veldt, Harkin spent most of his time in the cockpit of a fighter jet, flying countless death-defying missions to defend Africa’s last democracy from the fascist menace.\n\nIn 1976, Harkin ran for the House of Representatives despite every trend indicating he would lose in a landslide. Harkin, however, pulled off an upset victory, securing Iowa's 5th Congressional seat for the Democratic Party. In 1984, Harkin entered the Senate. There, in Congress’s so-called “cooling saucer”, the Gentleman from Iowa fought feverishly for improved working conditions for agricultural workers, a higher minimum wage, and increased access to healthcare for all Americans -- to name only a few.\n\nNow, following an unprecedented grassroots campaign, President Harkin finds himself sitting behind the Resolute Desk. His progressive agenda is as ambitious as it is controversial. His supporters clasp their hands in hope, the press is skeptical, and the right is outraged. Such obstacles, however, are nothing new to Harkin. The only limit  is how big he can dream."
 
