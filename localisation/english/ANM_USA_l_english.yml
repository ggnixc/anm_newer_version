 ###LEADER DESCRIPTIONS
 POLITICS_BOB_DOLE_DESC: "Robert Dole’s breed of Responsible Republicans is an endangered species, to put it generously. Some might even say it’s more accurate to describe Robert Dole as an endling. He has a lot of experience running for president in any event, having failed to secure nomination in 1976, 1984, and 1988. \n\nBut in 1992, having made every reasonable compromise he could and creating some hybrid of his Reaganite and Nixonite ideals into his own brand of Doleism, his time has finally come, if only barely. His position is highly precarious. His previous VP has sunk under the weight of sexual allegations and had to be replaced by Wilson. His tax policies are stalling in congress, and he faces strong opposition from Michell and Daschle. \n\nDole’s political career is a porous raft, held together by so much duct tape and prayers, sailing through ice and rough waters in a storm. But Dole is determined to succeed, by all means necessary. He is far too stubborn to consider failure."
 ###MINISTER NAMES + DESCRIPTIONS
 
 ### DOLE CABINET
 USA_Peter_Wilson_hog_desc: "Vice President\n--------------\nPeter Wilson can be seen as a model Republican: energetic, conservative, and unwaveringly loyal. Born during the depths of the Great Depression in a small town of Illinois, he was raised in a hard-working family. After graduating from high school, Wilson served in the U.S. Marine Corps at an American military base in Haiti in the early 1950s. \n\nAs a young conservative, he supported Richard Nixon’s presidential campaigns in California in 1960 and 1964. A few years later, Wilson moved to San Diego, where his political career flourished. Throughout the late 1970s and 1980s, he served as the city’s mayor, gaining statewide attention. He later defeated the prominent Democrat Jerry Brown to become the junior U.S. Senator from California. \n\nWilson’s moderately conservative stance helped him gain bipartisan respect, allowing him to replace Vice President Packwood and earn approval from a Democrat-controlled Congress. However, President Dole’s growing paranoia over a primary challenge, combined with Wilson’s assertive leadership and rising popularity, has led to open tensions between the President and his Vice President, with Dole’s administration further suffering from it."
 USA_Dick_Cheney_sec_desc: "Secretary of Defense\n--------------\n"
 USA_Donald_Rumsfeld_for_desc: "Secretary of State\n--------------\n"
 USA_James_Baker_eco_desc: "Secretary of Treasury\n--------------\nJames Baker is a lifelong Republican from Texas, holding conservative views since his youth. While serving in the U.S. Marine Corps at the Quantico military base, he actively participated in numerous Republican Party events, even at that early stage of his career. \n\nDuring Ronald Reagan’s presidency, Baker held several government positions. In 1977, he briefly served as Under Secretary of Commerce. From 1980 to 1984, he was White House Chief of Staff. During this time, he grew increasingly sceptical of traditional conservatism, believing it was ill-equipped to address emerging challenges. As a result, he shifted toward neo-conservatism and became involved with several neoconservative think tanks and NGOs in the late 1980s. \n\nFollowing Dole’s presidential victory, Baker was appointed United States Secretary of State, a role he held for one year before being named Secretary of the Treasury – a position he continues to hold to this day."
 
 ###IDEAS
 USA_The_Decaying_Establishment: "The Decaying Establishment"
 USA_The_Decaying_Establishment_desc: "Ever since the Reagan presidency and the inception of the sixth party system, the political duopoly of the United States has been slowly but steadily crumbling. Ideological orthodoxy in both parties has become a mere mirage, as activists and new trends gain more prominence. Within the Democratic Party, the old Farmer-Labor creed and the reformed New Left seek to take back power from a seemingly-apathetic technocratic elite, more focused on the preservation of their position in the pecking order than progress. \n\n On the right, religious crusaders and fusionist demagogues chant the mantra of small government and moral reconstruction, against an establishment solely concentrated on the expansion of foreign prowess at all cost, while also leaving behind the wretched in their quest for stability. As the donkey and the elephant repeatedly clash for dominance, it will ultimately be the malaise from within, not the threat from without, that brings down either titan."
 USA_Frankensteinian_Federalism: "Frankensteinian Federalism"
 USA_Frankensteinian_Federalism_desc: "The greatest reinvention of the Democratic Party, and perhaps the most defining institution of modern America, the New Deal is nothing compared to its glory days under the Roosevelt administration, decaying under a rot started by the Dewey presidency. While Eisenhower and Kefauver worked their hardest to preserve and renew it, Nixon’s presidency would see its foundation significantly weakened as funding cuts and devolution to the states crippled its ability to help Americans. \n\nAs Burton’s Fair Deal helped entrench and significantly expand the institution, Reagan would only mire it in more jeopardy with the elimination of entire programs and the deregulation of the industries it sought to govern. With the successive administrations having remained quite passive, the New Deal as it exists now resembles Frankenstein’s monster, a half-dead, half living institution, mired in the contradictions of the countless attempts at weakening and strengthening."
 USA_A_More_Perfect_Union: "A More Perfect Union"
 USA_A_More_Perfect_Union_desc: "Perhaps the greatest moral endeavor of the 20th century was the crusade for egalitarianism, sparking from the late 19th century trend of progressivism. First, women were welcomed into the political creed in the 20s, and then the Hispanics and Asians in the 50s, and finally the African-Americans in the 60s, with the end of the civil rights movement. And while most of America routinely celebrates these hallmarks of progress, activists and leaders are quick to remind us that liberty does not extend to those less fortunate sexual and gender minorities yet. \n\nBut underneath the gleaming image of civil rights lies the not so gilded truth of racial tension, socioeconomic disparity and vast inequality. While the Civil Rights movement may have given the black man his share in government, it has not taught him how to fish yet, leading to resentment and race riots throughout the country, while also feeding into white backlash as minorities slowly climb the weighted ladder of social mobility in America. As progress from the 60s endures under economic contradictions, it is apparent that the train of egalitarianism must keep chugging into the sunset if America truly wants to thrive, always striving for a more perfect union."
 USA_Corporate_Titans_Domestic_Leviathans: "Corporate Titans, Domestic Leviathans"
 USA_Corporate_Titans_Domestic_Leviathans_desc: "The fundamental premise of American corporatism lay in the collaboration between big business and big labor, a synthesis aided in unity by the federal government and so profound that it transformed America from a brutal victim of the Great Depression to a roaring economy by the time that the second World War rolled around. But as corporatism wasted under Nixon and Reagan, the class cooperation inherent within the New Deal also crumbled, with the hostile attitude between corporations and trade unions returning. \n\nNow, American society is polarized between the pitched battles of labor and business, with each party representing a side in the battle for America’s economy. As unions flailed under Reagan’s rabidly anti-labor policies, corporations filled the gaps where they hadn’t since the Gilded Age. Desperate to keep their share of the pie, unions have resorted to tactics unseen since the 30s, launching strikes and organizing efforts on a massive scale to combat outsourcing and offshoring, while also resolutely lobbying against deregulation and tax breaks. As the American economy grows entrenched in the battle between big business and labor, something must give way for the nation to finally prosper."

 ###EVENTS

 USA_successor.1.t: "A Message from Dole to His Successor"
 USA_successor.1.desc: " Mr. Harkin, \n\nAs a fellow American, you have my most sincere and honest congratulations on winning the presidential race. In this day and age, the United States of America needs a humble and compromising leader who has the ability to guide our nation and wash away the tragedies that lie before us. Personally, I think the previous guy in charge tried his best, even if many may disagree. \n\nThe best tip that I could ever give you is to never walk alone. I had the fortune of meeting many agreeable Republicans and Democrats alike while serving in Congress, and even if we did not share the same stances, I was privileged enough to work alongside them on a daily basis. Always look across the aisle for aid, even if your pride might stray you away from your goals. \n\nWhile I would lie if I were to say that being president is not a demanding job, you have the responsibility to stir America forward, ever so slightly. Never forget the hopes and aspirations millions of people have entrusted you with, and never forget who we are in service of. \n\nBetween the two of us, though, I must admit that when I first got the job, I would have personally paid millions just to make the place look more like Kansas. \n\nAll the best wishes,"
