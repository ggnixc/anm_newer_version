 ## Descriptions ##
 # Dole Cabinet #
 POLITICS_BOB_DOLE_DESC: "The President\n--------------\nA Kansas native and World War II veteran, Robert Dole was gravely injured in the field, returning to the United States in critical condition. Against all odds, he would recover with permanent but manageable damage and a changed outlook on life. Dole would rise from local politics to the U.S. Senate, earning a reputation as a tough, pragmatic Republican with a dry wit and deep party loyalty.\n\nRobert Dole’s breed of Responsible Republicanism is an endangered species, to put it generously. Some might even say it’s more accurate to describe Robert Dole as an endling. Dole, however, is no stranger to presidential runs, having failed to secure the nomination thrice in past elections.\n\nBy 1992, after making every reasonable compromise and fusing Reaganite flair with Nixonian pragmatism into a distinct strain of Doleism, his moment had finally—if only narrowly—arrived. His grip on the executive office is anything but secure. His previous running mate, having sunk under the weight of sexual allegations, was replaced by Peter Wilson. His tax agenda has stalled into a deadlock within Congress, and he faces intense opposition from Mitchell and Gerphardt.\n\nDole’s political career is a porous raft, held together with duct tape and kept afloat by grit and prayer, tossed between ice and storm. Yet Dole presses on, determined to succeed by any means necessary. He is far too stubborn to consider failure."
 POLITICS_BOB_DOLE_DESC2: "The President\n--------------\nA Kansas native and World War II veteran, Robert Dole was gravely injured in the field, returning to the United States in critical condition. Against all odds, he would recover with permanent but manageable damage and a changed outlook on life. Dole has now done what many thought impossible, guiding the sinking raft of both Doleism and the Republican Party to safe harbor.\n\nRobert Dole’s breed of Responsible Republicanism had been seen as an endangered species, an aging set of beliefs on its way out in America’s ever rapidly evolving political landscape. The 1996 presidential election would put all that out the window, as somehow rather by divine will, sheer luck, or country charm, Dole managed to eke out victory, securing a 2nd term to the office of the presidency.\n\nDole has now been given a final opportunity, by the mandate of the people, to carry on the torch of old-school Republicanism through his strain of Doleism into the 21st century. Now, after surviving a first term that can only be described as straight from the depths of hell, Dole is a changed man, more in tune with the conservative rabble-rousers and Pat Buchanans of his party that nearly cost him the last election's primary nomination. Although America may come out the other side with an uncertain future ahead of itself after 8 years of Doleism, old Bob is happy that he’s had his time in the spotlight and managed to make it count where it matters."
 USA_Peter_Wilson_hog_desc: "Vice President\n§iModern Conservatism§!\n--------------\nPeter Wilson can be seen as a model Republican: energetic, conservative, and unwaveringly loyal. Born during the depths of the Great Depression in a small town of Illinois, he was raised in a hard-working family. After graduating from high school, Wilson served in the U.S. Marine Corps at an American military base in Haiti in the early 1950s.\n\nAs a young conservative, he supported Richard Nixon’s presidential campaigns in California in 1960 and 1964. A few years later, Wilson moved to San Diego, where his political career flourished. Throughout the late 1970s and 1980s, he served as the city’s mayor, gaining statewide attention. He later defeated the prominent Democrat Jerry Brown to become the junior U.S. Senator from California.\n\nWilson’s moderately conservative stance helped him gain bipartisan respect, allowing him to replace Vice President Packwood and earn approval from a Democrat-controlled Congress. However, President Dole’s growing paranoia over a primary challenge, combined with Wilson’s assertive leadership and rising popularity, has led to open tensions between the President and his Vice President, with Dole’s administration further suffering from it."
 USA_James_Baker_eco_desc: "Secretary of the Treasury\n§iModern Conservatism§!\n--------------\nJames Baker is a lifelong Republican from Texas, holding conservative views since his youth. While serving in the U.S. Marine Corps at the Quantico military base, he actively participated in numerous Republican Party events, even at that early stage of his career.\n\nDuring Ronald Reagan’s presidency, Baker held several government positions. In 1977, he briefly served as Under Secretary of Commerce. From 1980 to 1984, he was White House Chief of Staff. During this time, he grew increasingly sceptical of traditional conservatism, believing it was ill-equipped to address emerging challenges. As a result, he shifted toward neo-conservatism and became involved with several neoconservative think tanks and NGOs in the late 1980s.\n\nFollowing Dole’s presidential victory, Baker was appointed United States Secretary of State, a role he held for one year before being named Secretary of the Treasury – a position he continues to hold to this day."
 USA_Dick_Cheney_sec_desc: "Secretary of Defense\n§iModern Conservatism§!\n--------------\nRobert ‘Dick’ Cheney is a quintessential WASP from Nebraska. While studying at the University of Wyoming, he began his political career as an intern for Congressman William Steiger during President Phillip Burton’s administration. He later managed Ronald Reagan’s 1976 presidential campaign.\n\nCheney went on to represent the state of Wyoming in the U.S. House of Representatives for ten years. During both of Reagan’s presidencies, he served as White House Chief of Staff. His loyalty and determination earned him a good place in the current administration.\n\nUnder President Dole, Cheney was appointed Secretary of Defense. With his extensive government background, he is considered one of the most experienced and capable figures within the Republican Party. In his current role, Cheney plays a central part in shaping U.S. foreign policy, military strategy, and expansion efforts – serving as a key pillar of the Dole administration."
 USA_Donald_Rumsfeld_for_desc: "Secretary of State\n§iModern Conservatism§!\n--------------\nDonald Rumsfeld is an unconventional figure in American politics, being the quintessential military hawk. In the 1950s, he served as a naval aviator in the U.S. Navy. In the 1960s, he represented Illinois in the U.S. House of Representatives and served on the Joint Economic Committee as well as on the Subcommittee on military and foreign operations in Congress.\n\nPart of the Republican Party’s so-called “Young Turks,” a group of rising politicians who encouraged Ronald Reagan to run for president,  Rumsfeld was appointed White House Chief of Staff during Reagan’s administration.\n\nRumsfeld embodies a blend of pre-Reagan “imperialist” American ideals and modern neoconservatism. Now holding the Secretary of State position in the current government, he is widely seen as a driving force behind U.S. military expansion and the formulation of neoconservative foreign policy."
 # Mitchell Cabinet #
 POLITICS_GEORGE_MITCHELL_DESC: "The President\n--------------\nOften regarded as one of the top congressional minds in the Democratic Party, Mitchell’s candidacy is seen as a comprehensive path to victory, at the helm of one of the most nationally recognized and popular Democrats. Mentored by Edmund Muskie, another liberal force within the Senate, Mitchell would succeed his mentor and become the junior senator for Maine, quickly growing to be a top foreign policy mind within the Democratic Party, especially on African and Middle Eastern matters.\n\nServing as Senate majority whip after Alan Cranston’s retirement in 1991, Mitchell would rise to national prominence helping negotiate the Alexandria Accords between Italy and Turkey and ensuring the passage of President Eagleton’s arms reduction acts within the Senate. Finally reaching the White House after 40 years in politics, Mitchell’s administration is aiming high, with his hallmark being the National Restitution Directive, a centerpiece of New Liberal politics and an initiative that seeks to transform America’s economy and society into being more productive and peaceful. With Vice President Howell Heflin at his back, Mitchell is confident that he can get his agenda passed and save America due to his prominence in the Senate, but ultimately, his arrogance combined with his lack of charisma may be his undoing."
 USA_Howell_Heflin_hog_desc: "Vice President\n§QIdiosyncratic Liberalism§!\n--------------\nCompromise, compromise, compromise is the mantra of the Senate and a Democratic presidency. And who better to exemplify that compromise than the Southern conservative like Howell Heflin to counterbalance the liberal in the White House. Coming from a prominent political dynasty within the state, Heflin’s experience and tenure in law as a professor and practicing attorney led him to be elected as Chief Justice of the Alabama Supreme Court in 1970, serving until 1977, where he would win election to succeed John Sparkman as Alabama’s junior senator, defeating prominent Wallace ally Representative Walter Flowers. \n\nRenowned as a socially conservative but economically populist Southern legislator, Heflin’s pull among his regional colleagues combined with his long tenure and experience in the Senate is what drove George Mitchell to select him for the Vice Presidential nomination. Regarded as a dud by the activists within the party, Heflin is nevertheless a necessary presence for the passage of Mitchell’s ambitious agenda."
 USA_John_Kerry_eco_desc: "Secretary of State\n§QDynastic Liberalism§!\n--------------\nA prominent anti-war activist turned establishment darling, John Kerry is perhaps the most apt example of the liberal activist’s journey in national politics. Born to prominent diplomat Richard Kerry, his upbringing was steeped in privilege as he went from private boarding school to attending Yale University as a youth. Following a spectacular stint as a Navy lieutenant in the West African War, Kerry would gain national prominence as an outspoken anti-war veteran, aiding in Phillip Burton’s election campaign. \n\nWinning an election to become a representative for Massachusetts, Kerry would later be appointed to the United States Senate by Governor Michael Dukakis in 1985, serving as a prominent liberal in matters of foreign policy, mentored by George Mitchell. Now, being drafted to serve as Secretary of State by his mentor, Kerry seeks to redefine the United States on the world stage as the primary practitioner of diplomacy, and is seen by many as an establishment dove, looking to significantly cool down tensions throughout the world, in line with President Mitchell’s focus on diplomacy as the means to conflict resolution."
 USA_Anita_Miller_sec_desc: "HUD Secretary\n§QDynastic Liberalism§!\n--------------\nOne of the leading members of Mitchell’s brain trust, Anita Miller is the only Cabinet member without a significant background in politics. With a significant career in the ACLU, Miller became a renowned resident of Rhode Island through her crusade for fair, desegregated housing throughout the state. Later, as a resident of New York, her work with the Workable Housing Program Committee, and the community redevelopment in East Harlem cemented her as an expert in urban renewal.\n\nRising to national fame through working as a senior consultant in the Ford Foundation, specifically in the South Bronx, through the South Bronx Development Corporation, where she worked to revitalize the formerly blighted neighborhood, turning it into a model for urban neighborhoods across the country. Now as the Secretary for Housing and Urban Development, Miller seeks to set the fair standards that she fought for throughout the nation while overseeing the successful passage of the National Restitution Directive. Having been a fighter her whole life, nothing seems to be as crucial as this fight for the American city’s future, and she is the primary strategist in this war."
 USA_Michael_Dukakis_for_desc: "Secretary of Transportation\n§QDynastic Liberalism§!\n--------------\nOne of the famed veterans within the Democratic Party’s list of governors, Dukakis is an essential component of Mitchell’s national revitalization plans. Born to Greek immigrants in the state of Massachusetts, the famed Duke was a member of the state legislature, before gaining the gubernatorial nomination for the Democrats in 1974. Presiding over the Massachusetts Miracle during his tenure as governor, he became a nationally renowned politician, even rumored to be Thomas Eagleton’s running mate in 1984 before he selected George Miller.\n\nStepping down in 1994 to be on the board of Amtrak, Dukakis is now Mitchell’s Secretary of Transportation, drafted for his public transit advocacy. Seeking to export the Massachusetts model of wide-reaching train and bus systems, he serves as the other essential administrator of the NRD, seeking to bridge America together by creating a national system of high speed rail. As the biggest name on Mitchell’s cabinet list, Dukakis certainly has a big promise to live up to, one he intends to do while connecting the nation together, both figuratively and literally."
 # Harkin Cabinet #
 POLITICS_TOM_HARKIN_DESC: "The President\n--------------\nThe last of a dying breed of liberal populism within the Democratic Party, Thomas Harkin is a dinosaur of the Democratic Party, seeking to revitalize the party and his brand of politics. Born to immigrants in Iowa, Harkin would graduate from college to serve in the Navy, before becoming an aide to veteran Iowa congressman Neal Smith. After graduating from law school in 1972, Harkin would get involved in Iowa politics, running in 1972 and winning an upset victory against established Republican Congressman William Scherle. After 4 terms as a congressman, Harkin would win election to represent Iowa in the Senate as its junior senator, quickly becoming renowned for his progressive advocacy and championing the cause of the farmer-labor politics that dominated his side of the prairie. \n\n Following Dole’s presidency and the revival of his re-election campaign, Harkin would jump into the primaries to seat the Labor wing as the leading partner of the Party. Securing victory against Mitchell by energizing grassroots support and the traditional Democratic base he plans to Supercharge the New Deal coalition of old on the path to the White House built by industrial workers and farmers. Finally representing the prairie populism his region is known for at a national level, Harkin promises renewal of American institutions, welfare and the American dream, an ambitious agenda that will either see him go down as one of the paragons of American liberalism or see progressive populism crash and burn."
 USA_Sam_Nunn_hog_desc: "Vice President\n§QIdiosyncratic Liberalism§!\n--------------\nIn American politics, the role of vice president is to exemplify a balance to the politics of the president, representing slightly more moderate or radical politics to appeal to a wide variety of voters, and have expertise where the president does not. For Tom Harkin, no one represents that balance better than Sam Nunn. A renowned Southern Democrat with a foreign policy expertise, Nunn covers all the bases of Harkin’s policy weakness, namely foreign policy and defense, while also being a line to the establishment that the President dislikes. Originally a small country boy in the Georgia House of Representatives, Nunn’s rise in national politics would be meteoric, starting with his election to the United States Senate in 1972, where he would quickly grow to be a key Democratic voice on foreign policy and defense.\n\nAlbeit a social and economic conservative, Nunn stands as bi-partisan and well-respected dove, seeking to cool down tensions with Germania and Tokyo, while also being an anti-nuclear advocate. Now, as Vice President, Nunn seeks to implement his idealistic foreign policy alongside Richard C. Holbrooke, and assist Harkin in getting his revitalization bills through Congress. Not having much ambition or desire for power himself, Nunn seeks to use the Vice Presidency as a vehicle to promote more dovish attitudes across America and hopefully, the entire world."
 USA_Robert_Reich_eco_desc: "Secretary of Labor\n§QBleeding-Heart Liberalism§!\n--------------\nA prominent intellectual in liberal circles, Reich’s appointment as Secretary of Labor was unsurprising to most. An alumnus of Yale University alongside fellow cabinet member William Clinton, he would later enter politics as a legal aide to several judges within the Burton and Reagan administrations. Stepping down to teach at Harvard University, Reich’s books on income inequality, economic redistribution and labor policy would become a foundation and fascination among the liberal left, hailed as a foundation for policy.\n\nDuring Thomas Eagleton's presidency, Reich would be appointed Deputy Secretary of Labor, collaborating with his superior Douglas Fraser in the strengthening of the NLRB and towing the line of the strong pro-labor policy that Eagleton's administration set out. Now, in the big seat himself, Reich seeks to fight back against free trade agreements and strengthen Big Labor, while diminishing the role of corporations in Middle America. Although his eagerness has left high expectations in the eyes of President Harkin, Reich will work his hardest to ensure that they are fulfilled, and that America will be left a more equal society after his tenure."
 USA_Bill_Clinton_sec_desc: "Secretary of Education\n§QIdiosyncratic Liberalism§!\n--------------\nPerhaps the most surprising nomination and acceptance into Harkin’s cabinet would Democratic superstar William “Bill” Clinton. Known nationally as the youthful and charismatic governor of Arkansas, Bill Clinton would gain fame as the one of the youngest governors in the country, elected to the gubernatorial office at the age of 31. 5 concurrent terms as Governor would do wonders for his credit within the party, launching a nomination in the 1992 Democratic primaries, narrowly losing to incumbent Vice President George Miller.\n\nWith one of the crowning achievements of his gubernatorial career being the educational reform that transformed the system and massively improved outcomes, Clinton was chosen as an earnest voice within Harkin’s administration, one with the capacity to bring the Arkansas model to the national level as well as carry the standard for progressive education practices, all while being the charming Southern governor representing the scary liberal administration to his Southern constituents. With a smiling face and youthful charisma, Clinton is perhaps the Democrats’ new Kennedy, most likely aiming for a presidential run after his tenure in the cabinet."
 USA_Jim_Hightower_for_desc: "Secretary of Agriculture\n§QBleeding-Heart Liberalism§!\n--------------\nAnother essential administrator within Harkin’s cabinet, Jim Hightower owes his presence in the administration due to a combination of being the President’s friend and his work in the Texas Department of Agriculture. Born to a working class family in Texas, Hightower would get his start in politics as an aide to progressive Texas senator Ralph Yarborough, later aiding in Henry Jackson’s campaign for election in 1976 in Texas. In 1982, he would be elected as Texas Agricultural Commissioner, leading the state in more regulations for big agrobusiness, helping small-time farmers directly market their produce to consumers and aiding in the development of more environmentally friendly and organic agricultural methods.\n\nBecoming a strong Democratic voice within Texas, he would heavily contribute to Thomas Eagleton’s campaign by mobilizing farmer and agricultural worker turnout throughout the state. Selected by the President to highlight his dual focus on the farmer and the laborer, Hightower seeks to export the Texas model into the Great Plains, breaking up agricultural monopolies, ensuring that subsidies aid the little guy more than the big business, while also promoting sustainable and environmentally sound agriculture. As the head of one of Harkin’s primary policy focuses, Jim Hightower has a hard burden, but for the sake of his friends  and farmers all over the country, he is determined to succeed."
 # Buchanan Cabinet #
 POLITICS_PAT_BUCHANAN_DESC: "The President\n--------------\nPerhaps one of the most feared men in America, the political class of America is still trying to convince themselves that Buchanan’s path to the White House was a fluke. Born to a wealthy family in Washington D.C., Buchanan’s political career, like most of his colleagues, would be through first the Nixon administration, and then the Reagan presidency. Serving as an adviser and campaigner to President Nixon throughout his presidency although he would support Reagan over Nixon’s favored candidate Nelson Rockerfeller in the 1968 primaries.\n\nShedding his moderacy and embracing conservatism to the fullest, he would play a vital role in Reagan’s 1976 campaign for president, as well as the communications director, while serving as a more right-wing counsel to the President.\n\nAlthough running in a number of primaries post-Reagan, Buchanan never seemed to find his edge, but his time came as an ultraconservative challenger to incumbent President Robert Dole. Grasping on broad conservative discontent, as well as religious concerns over Dole’s moderacy, Buchanan would successfully grasp the nomination for President in an upset victory. Now in the White House, Buchanan’s tenure seems to be on the leash of a fearful GOP establishment, with his vice president and cabinet opposing him at every turn. But Buchanan knows that if he truly wants to spread his wings and change America for the better, he must overcome every opponent, Republican or Democrat, and never back down in his fight to rewrite the future."
 USA_Jim_Jeffords_hog_desc: "Vice President\n§iResponsible Conservatism§!\n--------------\nAs a second fiddle to a man he is repulsed by, Jeffords feels that his presence in the administration is keeping from completely spreading its wings. Nationally known as a very moderate and bipartisan Republican, it would come as a shock to everyone when Jeffords would be announced as the vice president on Pat Buchanan’s ticket, with the two politicians having extremely opposing views from each other. Behind the scenes, Jeffords accepted the nomination from a quivering establishment, who promised him that he was the only man who could contain Buchanan’s fury.\n\nNow in the White House, the hostile relationship between Buchanan and Jeffords harkens back to the days of opposing Presidents and Vice Presidents, and an administration so chock full of contradictions, many view it as a wonder it hasn’t collapsed already. But in the eyes of Jeffords, his purpose in the Vice Presidency is very clear, to keep Buchanan as a lame duck until saner voices in the party, perhaps even himself,  can prevail. As he prepares to take on the ugly America that got this demagogue into office,  Jeffords readies himself, for he knows that failing in his task will be catastrophic for America’s soul."
 USA_Rudy_Giuliani_eco_desc: "Attorney General\n§iModern Conservatism§!\n--------------\nA creature of the establishment through and through, Rudy Giuliani is a political chameleon more than anything else. A New York native with a storied legal background, Giuliani was initially a Democrat in his youth, volunteering for Robert Kennedy’s 1964 presidential campaign. Shifting to the right after the presidency of Ronald Reagan, serving as associate attorney general during Reagan’s second term. \n\nPromoted to U.S. attorney for the Southern District of New York, Giuliani would become a darling through his work in the region. Drafted to become the Deputy Attorney General for President Robert Dole, Giuliani finally serves as the premier attorney of the land under President Buchanan. Being seen as a loyal party man by the president, he is perhaps the only member of the cabinet to earn the grudging respect of the President."
 USA_Herman_Cain_sec_desc: "Secretary of Commerce\n§iModern Conservatism§!\n--------------\nAnother establishment figure within Buchanan’s cabinet, Herman Cain is not your typical politician. Born to a poor family in Georgia, his innate talent for management and analysis would be utilized by the Pillsbury company, revitalizing Burger Kings across the state of Pennsylvania and reviving the Godfather’s Pizza subsidiary. Moving to DC after leaving Pillsbury, Cain would become a lobbyist associated with the National Restaurant Association.\n\nA chief adviser to Dole and one of his surrogates at the RNC during the 1996 Convention, Cain would quickly pivot to supporting Buchanan throughout the South, now being chosen to lead the Department of Commerce. Bringing his skills as a renowned efficiency expert and job creator to the department, Cain is intent to be the Architect of the greatest growth in businesses and Job Creations in Modern American history. Whether his ideas will succeed, or the constraints of the office will be too strong for even him to overcome, time will tell."
 USA_James_Hoffa_for_desc: "Secretary of Labor\n§iResponsible Conservatism§!\n--------------\nA maverick among Big Labor, James P. Hoffa’s overbearing and explosive attitude makes him yet another bombshell within Pat Buchanan’s administration. Son of the infamous Jimmy Hoffa, little Jim was always involved in the Teamsters from a young age, being involved with his dad’s meetings since he was a kid. Following the disappearance of his father,  James would become an attorney for the Teamsters throughout most of the 60s and 70s.\n\nAn overbearing and often toxic presence throughout the Big Labor scene, Hoffa would be an unusually conservative outsider when compared to his fellow leadership.  Even as a wavering Democrat, he would shock the labor world with his acceptance of President Buchanan’s invitation to lead the Labor Department. Speculated as an olive branch to the traditional workingman and unionmen on behalf of Buchanan’s idiosyncratic platform, Hoffa is unsure of his true role within the cabinet, although like many others, he sees it as a path to greater things, rather than to help the President’s policy truly take root."
