 HUN_gyorgy_matolcsy: "György Matolcsy"

 ## Descriptions ##
 POLITICS_MIKLOS_NEMETH_DESC: "A commoner man, for the commoner man. This is how Miklós Németh is described by those asked, and they are indeed not exaggerating what they say one bit. Born in 1948, in a peasant family, Németh rose into prominence first as a competent economist, joining the MÉP in 1974, then as the de facto leader of the young reformist movement of the party, that overtook the MÉP in 1982 in the aftermath of the Second West Russian War, before he finally ended up being elected the youngest ever Prime Minister of Hungary, in 1987.\n\nHe quickly became known for his uncompromising reformism, and his calls for liberalization, secularization and distancing from Germany have striked a deep worry into the heart of the traditionally conservative and religious elites of the country, and the German allies of the Kingdom - but with the blessing of the King, and the support of the people, he is confident he will one day achieve his hopes of a just and truly democratic Hungary, no matter how hard the forces of reaction may try to sabotage his work."
 HUN_Sandor_Lezsak_hog_desc: "Behind every great dreamer leader is their loyal sidekick, the thankless workhorse of the government, the moderator of their radicalism. For Miklós Németh, this person is Sándor Lezsák. Born in 1949, and working as a village teacher, he was always against the governmental opression on political thought, having been fired from his job in 1985 for his calls for political pluralism. Conservative enough to work within the MÉP, yet a democrat whose dream matches Németh, they have been the harmonic duo, of Hungary ever since 1989, when he joined the MÉP after its democratic reformation.\n\nAnd the future? He once famously said: “If am no longer needed on my post, then I will leave with dignity, knowing that someone more worthy will step in my place.” Whether Fate will satisfy him by making that person a democrat, or mocks him with a fascist taking his place, we can only wait and see."
 HUN_Ferenc_Karpati_sec_desc: "Born in 1926 in the city of Putnok, into a family of common workers, Ferenc Kárpáti saw the nature of warfare change so many times in his lifetime, he could hardly even count it. Joinging the Honvédség in 1948, he rose through its ranks with an unprecedented speed, and many speculations arose from his friends, that this man just might be the next leader of the army. He proved them true, as in 1982 he became General, in 84 Field Marshall, and finally in 1987, the Minister of Defense of Németh. He always emphasied the need for a radical modernization of the Army, proposing and implementing the military equipment modernization program dubbed the “Second Győri Program” between 1989 and 93.\n\nKárpáti is by all means a pragmatic person, with not too much personal love for Germany, but he does “Recognize and appreciate the benefits of military cooperation with the Reich.” As long as the Army stands, protecting the Nation, he does not care too much whether it is a democracy or a dictarorship he protects."
 HUN_Geze_Jeszensky_for_desc: "A democrat. A minister. A teacher. A writer. Géza Jeszenszky is all that and so much more. Born in 1941, into a noble family, his political beliefs were deeply affected by the German Civil War and the Slave Revolt. His core idea became the thought that oppression will always collapse to make way for liberty - and therefore liberty must be brought to Hungary, for its collapse to be avoided. While many believed that with such an idea, he could by no means become anything in Nazi-dominated Europe, he proved all doubts wrong, when, with an unprecedented strategic move of pragmatism he joined the MÉP in 1976, and then, from the background, he spearheaded the internal reformist movement that led Miklós Németh to his position as Prime Minister.\n\nTaking his well-deserved place by his side as Foreign Minister, Jeszenszky now prepares for his magnum opus: The total liberalization and democratization of Hungary, and its liberation from under the Nazi yoke. His opponents call him a Communist tool, a puppet of the OFN, an Elder of Zion - and he rejoices in it. The slurs and curses of tyrants are music to his ears. They are the signal that he is on the right track. That he will be successful."
 HUN_Gyorgy_Matolcsy_eco_desc: "It was said “You cannot serve God and mammon.”, and so when it came to choosing, György Matolcsy chose the latter. Born in 1955 in Budapest, growing up and graduating as an economist from the renown Corvinus University, his name by now has become a synonym of corruption in the government of Hungary. Always supporting and siding with whoever pays more, he made his way into the Ministry of Economy, where he soon became the most valuable asset of Germany.\n\nUplifted to and kept in his position solely by bribery and the Nazis' support behind him, who see him as a useful tool for subordinating the Hungarian economy, Matolcsy is loathed by every other member of the government, and the entire populace, but he doesn't care for their voices. He only cares about the sweet clinging of money, honeyed words of the grand love of his life."


### Ideas ###
 HUN_revizio: "Revízió"
 HUN_revizio_desc: "After the Treaty of Trianon, Hungary lost 2/3th of its territory, and a large portion of her native populace ended up stranded beyond hostile borders. The revision of the unfair peace diktat, and the demand for the return of the lost territories has been, to this day, the cornerstone of modern Hungarian politics, something every party, from left and right alike throws their support behind. No matter what will come, no matter who rules over Budapest, the memory of this injustice will only be erased once every last bit of it is promptly undone!"
 HUN_1000_year_kingdom: "1000 Year Old Kingdom"
 HUN_1000_year_kingdom_desc: "With the crowning of King Stephen the First on the Christmas Eve of 1000, the christian kingdom of Hungary was born. For the entirety of its existence, the Nation of Holy Mary had fought through thick and thin, suffered from conquest and subjugation, but despite all of it, in the end had managed to retain its independence.\n\nAs the 1000th anniversary of the country nears, all her people carry joy, pride... and determination. For they know, that it now falls upon them to live up to the legacy of the Holy King. We can only wait and see whether they will manage to live up to his legacy."
 HUN_the_transylvanian_fights: "The Transylvanian Fights"
 HUN_the_transylvanian_fights_desc: "After the Second Vienna Award, Northern Transylvania was ceded back to Hungary, yet a large number of ethnic Romanians remained living in the territory. As Magyarization efforts begun in the region, many Romanians took up arms and revolted. They are known as the Legiunea Română de Nord or Northern Romanian Legion, starting fights and clashes every now and then in Northern Transylvania, despite the constant efforts of the government to crush the rebellious organization that is no doubt supported by the Romanian government hiding behind their backs."
 HUN_jozsef_arpad: "József Árpád"
 HUN_jozsef_arpad_desc: "Habsburg József Árpád never expected to be the King of Hungary - even though the circumstances that led to it seemed to have made his upcoming fate quite obvious. Born in 1933, a member of the Hungarian branch of the Habsburg family, he followed in the footsteps of his father, becoming a supporter of Turanism, and taking the place of his father after his passing in 1957, both as a representative in the Upper House of the Parliament, and as the captain of the Order of Valor. Having a good personal friendship with both the late Regent Horthy István, and his son, he was restored into his position by national support in 1995, with the promise to oversee the completion of the liberalisation effort of Horthy Jr., and in order for the Kingdom to be able to celebrate its 1000th anniversary with a King at its helm.\n\nMany believe he is simply a puppet of the former Regent, but he personally declared he considers their relationship “A friendship of equals, both believing in doing what serves the people of Hungary the best.” Loved by the liberals, begrudgingly accepted by the conservatives, hated by the far-right, his position seems unstable, but he is confident he will live up to the title of his great-great-great grandfather - that of the “Most Hungarian Habsburg.”"