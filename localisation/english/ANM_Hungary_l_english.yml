 ### Leader Descriptions ###
 POLITICS_ISTVAN_HORTHYJR_DESC: "Entering the New Millenium, the grandson of Miklós Horthy certainly has big shoes to fill. Born in 1941, on the peak of Hungary’s success in the revision of Trianon, he was excepted to have a grand future. After succesfully graduating from Oxford, and becoming an architect, his grandfather’s passing and his father’s ascension to the position of Regent dragged him into the world of politics, where he quickly made connections with the democratic forces of the PDP and the MSZDP. After his father died in 1976, he became the next regent of Hungary, a task starting to feel harder and harder with each day passing.  With the 1000th aniversary of the Kingdom’s foundig on the corner, the pressure on the Regent to finally restore a legitimate king tot he throne is ever-incerasing. And with the democratic movement on the rise, he knows it is but a matter of time before the populace calls for his resignation. But until that moment comes, he must choose the direction Hungary will head for the years to come. He can only hope it will be the good one."

