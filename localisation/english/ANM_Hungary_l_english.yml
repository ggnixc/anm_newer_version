 ## Descriptions ##
 # Country Leader #
 POLITICS_MIKLOS_NEMETH_DESC: "Throughout history, many people have attained fame for presiding over the rise of something monumental. Others, however, are remembered by those who followed them for overseeing the fall of something once believed unfellable.\n\nNémeth Miklós belongs to this latter group. Born in 1948 to a peasant family, he appeared destined for the ordinary and uneventful existence of a typical party official. After joining the MÉP in 1976, he swiftly built a reputation as a skilled economist; however, unlike many of his contemporaries, he was acutely aware of the increasing fissures within the seemingly “perpetual” system that governed the nation, which led him to advocate for reforms.\n\nWhen his predecessor, Pártay Tivadar, announced his retirement in 1990, he and his associates seized the opportunity and seized the reins of the party, paving the way for his election as Minister-President. But upon taking the mantle of leadership, he was forced to discard any remaining illusions about preserving the status quo, as it became painfully clear that the MÉP’s rule is beyond all saving. Thus, the course he opted for, the one he continues to pursue even today, is what he deems the next best alternative: facilitating a peaceful and successful democratic transition, solidifying his legacy on the right side of history through this achievement."

 POLITICS_REZSO_NYERS_DESC: ""
 POLITICS_ISTVAN_SZENT_IVANYI_DESC: "The new millennium necessitates a fresh breed of politicians, who are eager to depart from the outdated ideas and policies of the past in order to create something new. This is how most try to explain the meteoric rise of Szent-Iványi István, who has become Hungary's youngest and newest Minister-President.\n\nHaving been elected as the leader of the liberal PSZP in 1994, few anticipated that he would approach the seat of power in the near future, yet he has successfully disproven his critics. Running on a platform of centrist national liberalism and distancing himself from the extremes of both right and left, his unexpected triumph is poised to bring significant changes to Hungary. He has pledged to enhance civil liberties, implement free-market capitalism, minimize state intervention, and foster stronger economic connections with the rest of the Europäischer Pakt, and seemingly both economists and ordinary citizens are looking forward with optimism to this anticipated “socio-economic golden age.”\n\nAs a young, moderate liberal, he stands out as a solitary figure amidst Europe’s tide of fascism. However, Szent-Iványi István has never shied away from challenges - and this time, he pledges, will not be any different."
 POLITICS_ZOLTAN_KIRALY_DESC: "More than seventy years after the last left-wing government in Hungary collapsed, another has finally emerged. Király Zoltán, along with many others, is determined to ensure that it won't be another seven decades until one emerges again.\n\nA former teacher, journalist, and television worker, he has been a committed member of the MSZDP since 1974, becoming one of Hungary's most popular politicians, despite facing numerous assaults from both the far-right and his so-called “allies” in the MÉP. He has ascended to power amidst a surge of public dissatisfaction with both the political and economic status quo, representing what could be the most significant transformations the Kingdom has experienced in the past decades. From the revival of long-marginalized trade unions to moderate nationalization initiatives, the MSZDP's agenda has been labeled everything from “radical” and “dangerous” to “the dangerous ramblings of Bolsheviks”.\n\nAs the party's factions compete for influence behind the guise of unity he is expected to embody, he can only hope this infighting will not come at the cost of never redeeming the legacy of the Hungarian political left."
 POLITICS_ARPAD_GONCZ_DESC: "It is often said that good things come to those who wait. After half a century of dedicated effort, Árpád Göncz finally assumes his long-deserved position at the forefront of Hungary.\n\nBorn in 1922, the son of a postal worker, he embarked on his political journey at the tender age of 23, quickly rising to lead the youth division of the FKgP. He rapidly climbed the party hierarchy, forging friendships with the late giants of the party, Tildy Zoltán and Nagy Ferenc. Following their deaths, he took the reins of the party, remaining committed to its Christian and agrarian values, even during the period of the “supercoalition.” After its dissolution, many anticipated his rise as the next leader of Hungary, a prediction that came to fruition with his election as Minister-President.\n\nPledging to protect and assist the marginalized and impoverished, his friendly, down-to-earth demeanor and popular policies have made him a beloved figure, despite some concerns regarding his age and its impact on his ability to foster and sustain the national stability he aims to achieve."
 # Ministers #
 HUN_Sandor_Lezsak_hog_desc: "Behind every great dreamer leader is their loyal sidekick, the thankless workhorse of the government, the moderator of their radicalism. For Miklós Németh, this person is Sándor Lezsák. Born in 1949, and working as a village teacher, he was always against the governmental oppression on political thought, having been fired from his job in 1985 for his calls for political pluralism. Conservative enough to work within the MÉP, yet a democrat whose dream matches Németh, they have been the harmonic duo, of Hungary ever since 1989, when he joined the MÉP after its democratic reformation.\n\nAnd the future? He once famously said: “If am no longer needed on my post, then I will leave with dignity, knowing that someone more worthy will step in my place.” Whether Fate will satisfy him by making that person a democrat, or mocks him with a fascist taking his place, we can only wait and see."
 HUN_Ferenc_Karpati_sec_desc: "Born in 1926 in the city of Putnok, into a family of common workers, Ferenc Kárpáti saw the nature of warfare change so many times in his lifetime, he could hardly even count it. Joinging the Honvédség in 1948, he rose through its ranks with an unprecedented speed, and many speculations arose from his friends, that this man just might be the next leader of the army. He proved them true, as in 1982 he became General, in 84 Field Marshall, and finally in 1987, the Minister of Defense of Németh. He always emphasied the need for a radical modernization of the Army, proposing and implementing the military equipment modernization program dubbed the “Second Győri Program” between 1989 and 93.\n\nKárpáti is by all means a pragmatic person, with not too much personal love for Germany, but he does “Recognize and appreciate the benefits of military cooperation with the Reich.” As long as the Army stands, protecting the Nation, he does not care too much whether it is a democracy or a dictarorship he protects."
 HUN_Geze_Jeszensky_for_desc: "A democrat. A minister. A teacher. A writer. Géza Jeszenszky is all that and so much more. Born in 1941, into a noble family, his political beliefs were deeply affected by the German Civil War and the Slave Revolt. His core idea became the thought that oppression will always collapse to make way for liberty - and therefore liberty must be brought to Hungary, for its collapse to be avoided. While many believed that with such an idea, he could by no means become anything in Nazi-dominated Europe, he proved all doubts wrong, when, with an unprecedented strategic move of pragmatism he joined the MÉP in 1976, and then, from the background, he spearheaded the internal reformist movement that led Miklós Németh to his position as Prime Minister.\n\nTaking his well-deserved place by his side as Foreign Minister, Jeszenszky now prepares for his magnum opus: The total liberalization and democratization of Hungary, and its liberation from under the Nazi yoke. His opponents call him a Communist tool, a puppet of the OFN, an Elder of Zion - and he rejoices in it. The slurs and curses of tyrants are music to his ears. They are the signal that he is on the right track. That he will be successful."
 HUN_Gyorgy_Matolcsy_eco_desc: "It was said “You cannot serve God and mammon.”, and so when it came to choosing, György Matolcsy chose the latter. Born in 1955 in Budapest, growing up and graduating as an economist from the renown Corvinus University, his name by now has become a synonym of corruption in the government of Hungary. Always supporting and siding with whoever pays more, he made his way into the Ministry of Economy, where he soon became the most valuable asset of Germany.\n\nUplifted to and kept in his position solely by bribery and the Nazis' support behind him, who see him as a useful tool for subordinating the Hungarian economy, Matolcsy is loathed by every other member of the government, and the entire populace, but he doesn't care for their voices. He only cares about the sweet clinging of money, honeyed words of the grand love of his life."

### Ideas ###
 HUN_the_transylvanian_fights: "The Northern Transylvanian Conflict"
 HUN_the_transylvanian_fights_desc: "Northern Transylvania has always been considered the crown jewel of the "Revision" by Hungarians, however, if one were to take a closer look at the allegoric jewel, they would find it plagued by rust. The Romanian population of the region was never too keen on once again becoming part of what they saw as a nation of oppressors - something the Magyarization policies of the 50s only helped to strengthen in their hearts and minds, and so, the Legiunea Română de Nord was born. \n\nAn armed group fighting for the return of the north to Romania, they enjoy the unofficial support of the Romanian government and population, despite countless Hungarian objections. They must never be allowed to achieve their vile dream, or the Hungarians of Northern Transylvania will have to experience horrors unimaginable at their savage hands..."
 HUN_jozsef_arpad: "III. József"
 HUN_jozsef_arpad_desc: "His Royal Apostolic Majesty József Árpád of Habsburg-Lorraine is a man, a king, and a symbol at once, an anchor grounding Hungary in the increasingly heavy turmoil of the New Order. Born in 1933 into the Hungarian branch of the House of Habsburg, he was originally a prince of little note, successfully pursuing a degree in economics and taking the place of his father in the House of Magnates after he died in 1957. \n\nElected King a decade later, he’s become the figurehead of the burgeoning democratic movement, and a popular symbol of national sovereignty and dignity. As a result, in times both peaceful and troubled, the Hungarian people look to their King for guidance."
 HUN_the_second_consolidation: "The Second Consolidation"
 HUN_the_second_consolidation_desc: "Between 1921 and 1931, there existed a state of affairs in Hungary that has come to be known as the “Consolidation”. During this period, all but the most fringe and radical movements lined up behind the reigning government, granting them near-absolute power in a system that was still more or less democratic. This, however, was not to last. The Great Depression dealt a death blow to the Consolidation, paving the way for three decades of tug-of-war between centrists and radicals. \n\nIn 1964, the conflict ended with the victory of the former, and while the people craved true democracy, it was deemed “too early and dangerous” by those who held the levers of power. Instead, this relic of the past was given new life by them, and ever since then, the Hungarian nation has prospered under a fair, democratic, and most importantly, stable system. \n\nOr that is what they would like the world to believe, but in reality, this new Consolidation is a pale shadow of its original namesake. Neither the King nor the political parties involved wish to prolong its existence. The people, weary of this charade that has persisted for thirty years, demand an end to it, and soon. And as the saying goes: \n\n“Though the current may be down below the galley, yet water is the lord!”"
 HUN_beginning_of_a_new_period: "Beginning of a New Period"
 HUN_beginning_of_a_new_period_desc: "150 years after the Hungarian nation first expressed its desire for independence, liberty, and democracy, that desire has finally been fulfilled. With the end of the Second Consolidation, the codification of the constitution, and the conclusion of the first democratic elections, many claim that an entirely new period of time has begun for Hungary. A period that shall be one of prosperity and victories, one that shall not end for decades to come. \n\nYet, even in the aftermath of this momentous achievement, much work remains to be done. There are still radicals lingering in the shadows, ready to unravel all that has been gained. Turmoil still simmers beyond the nation's borders, casting on it a shadow of uncertainty. Only time will unveil whether this new era will truly live up to the aspirations it has inspired as the nation enters the New Millennium"

