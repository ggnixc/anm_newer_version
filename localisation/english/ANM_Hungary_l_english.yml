 # Ministers #
 HUN_Sandor_Lezsak_hog_desc: "Behind every great dreamer leader is their loyal sidekick, the thankless workhorse of the government, the moderator of their radicalism. For Miklós Németh, this person is Sándor Lezsák. Born in 1949, and working as a village teacher, he was always against the governmental opression on political thought, having been fired from his job in 1985 for his calls for political pluralism. Conservative enough to work within the MÉP, yet a democrat whose dream matches Németh, they have been the harmonic duo, of Hungary ever since 1989, when he joined the MÉP after its democratic reformation.\n\nAnd the future? He once famously said: “If am no longer needed on my post, then I will leave with dignity, knowing that someone more worthy will step in my place.” Whether Fate will satisfy him by making that person a democrat, or mocks him with a fascist taking his place, we can only wait and see."
 HUN_Ferenc_Karpati_sec_desc: "Born in 1926 in the city of Putnok, into a family of common workers, Ferenc Kárpáti saw the nature of warfare change so many times in his lifetime, he could hardly even count it. Joinging the Honvédség in 1948, he rose through its ranks with an unprecedented speed, and many speculations arose from his friends, that this man just might be the next leader of the army. He proved them true, as in 1982 he became General, in 84 Field Marshall, and finally in 1987, the Minister of Defense of Németh. He always emphasied the need for a radical modernization of the Army, proposing and implementing the military equipment modernization program dubbed the “Second Győri Program” between 1989 and 93.\n\nKárpáti is by all means a pragmatic person, with not too much personal love for Germany, but he does “Recognize and appreciate the benefits of military cooperation with the Reich.” As long as the Army stands, protecting the Nation, he does not care too much whether it is a democracy or a dictarorship he protects."
 HUN_Geze_Jeszensky_for_desc: "A democrat. A minister. A teacher. A writer. Géza Jeszenszky is all that and so much more. Born in 1941, into a noble family, his political beliefs were deeply affected by the German Civil War and the Slave Revolt. His core idea became the thought that oppression will always collapse to make way for liberty - and therefore liberty must be brought to Hungary, for its collapse to be avoided. While many believed that with such an idea, he could by no means become anything in Nazi-dominated Europe, he proved all doubts wrong, when, with an unprecedented strategic move of pragmatism he joined the MÉP in 1976, and then, from the background, he spearheaded the internal reformist movement that led Miklós Németh to his position as Prime Minister.\n\nTaking his well-deserved place by his side as Foreign Minister, Jeszenszky now prepares for his magnum opus: The total liberalization and democratization of Hungary, and its liberation from under the Nazi yoke. His opponents call him a Communist tool, a puppet of the OFN, an Elder of Zion - and he rejoices in it. The slurs and curses of tyrants are music to his ears. They are the signal that he is on the right track. That he will be successful."
 HUN_Gyorgy_Matolcsy_eco_desc: "It was said “You cannot serve God and mammon.”, and so when it came to choosing, György Matolcsy chose the latter. Born in 1955 in Budapest, growing up and graduating as an economist from the renown Corvinus University, his name by now has become a synonym of corruption in the government of Hungary. Always supporting and siding with whoever pays more, he made his way into the Ministry of Economy, where he soon became the most valuable asset of Germany.\n\nUplifted to and kept in his position solely by bribery and the Nazis' support behind him, who see him as a useful tool for subordinating the Hungarian economy, Matolcsy is loathed by every other member of the government, and the entire populace, but he doesn't care for their voices. He only cares about the sweet clinging of money, honeyed words of the grand love of his life."


### Ideas ###
 HUN_the_transylvanian_fights: "The Northern Transylvanian Conflict"
 HUN_the_transylvanian_fights_desc: "Northern Transylvania was always considered the crown jewel of the Revision, however, if one were to take a closer look at the allegoric crown, they would find it plagued by rust. The Romanian population of the region was never too keen on once again becoming part of what they saw as a nation of oppressors - something that the Magyarization policies of the 50s only helped to strengthen in their hearts and minds, and so, the Legiunea Română de Nord was born. An armed group fighting for the return of the north to Romania, they enjoy the unofficial support of the Romanian government and population, despite the objections of the Hungarian government. They must never be allowed to achieve their vile dream, or the Hungarians of Northern Transylvania will have to experience horrors unimaginable at their savage hands..."
 HUN_jozsef_arpad: "III. József"
 HUN_jozsef_arpad_desc: "His Imperial and Royal Majesty József Árpád of Habsburg-Lorainne is a living contradiction: The liberal, democracy-supporting King of a nation that has been deeply embedded in the alliance of Nazism for as long as he lived. Born in 1933 into the Palatine branch of the House of Habsburg, he grew up to witness his homeland rise from the shackles of Trianon, only for it to fall into petty infighting in the years following it. Taking the place of his father in the Upper House of Parliament after he died in 1957, he became a steadfast supporter of the gradual liberalization of István Horthy, becoming a good friend of the late Regent in the process, which culminated in his decision to allow for the restoration of the Habsburg monarchy to the throne of Hungary after his passing, with the new King continuing the policy of gradual democratization and marginalization of fascism, much to the chagrin of the Reich. And as the New Millennium approaches Europe, he secretly hopes that a time in which liberty and democracy can spread beyond the borders of the Kingdom will finally arrive.\n\nOr to at least be able to preserve it in his homeland, should such a time never come."
 HUN_perpetual_coalition: "The Perpetual Coalition"
 HUN_perpetual_coalition_desc: "When Béla Imrédy was forced to step down from the Premiership in 1964, many in Hungary believed a new era of democracy was waiting on the horizon. Their hopes were soon tarnished, however, by the so-called "supercoalition" that would form from the marriage of the MÉP and every other non-MMP party in the Parliament, united only in their opposition to the aforementioned MMP.\n\nOriginally sold as a “temporary” measure until proper democratic foundations could be established, this anocratic arrangement has instead dominated the Hungarian political landscape for the last 30 years. The dissolution of this loathed coalition has been promised numerous times, only for the proverbial can to be kicked down the road time and time again — and at this point, most Hungarians doubt that they will ever live to see the day."

