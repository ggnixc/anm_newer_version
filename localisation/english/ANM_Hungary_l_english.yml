 ## Descriptions ##
 # Country Leader #
 POLITICS_MIKLOS_NEMETH_DESC: "Throughout history, many people have attained fame for presiding over the rise of something monumental. Others, however, are remembered by those who followed them for overseeing the fall of something once believed unfellable.\n\nNémeth Miklós belongs to this latter group. Born in 1948 to a peasant family, he appeared destined for the ordinary and uneventful existence of a typical party official. After joining the MÉP in 1976, he swiftly built a reputation as a skilled economist; however, unlike many of his contemporaries, he was acutely aware of the increasing fissures within the seemingly “perpetual” system that governed the nation, a recognition which led to him becoming a vocal advocate for internal reforms.\n\nWhen his predecessor announced his retirement in 1990, he and his associates saw their opportunity and seized the reins of the party. Németh was swiftly nominated as Minister-President, but upon taking the mantle of leadership, he was forced to discard any remaining illusions about preserving the status quo, as it became painfully clear that the MÉP’s rule is beyond all saving. Thus, the course he opted for, the one he continues to pursue even today, is what he deems the next best alternative: facilitating a peaceful and successful democratic transition and hopefully solidifying his legacy on the right side of history through this achievement."
 POLITICS_ISTVAN_SZENT_IVANYI_DESC: "Born in 1958, to a family of Unitarian public officials in Transylvania, Szent-Iványi István grew up in a colourful and diverse environment, which, according both to himself and others, contributed to his gravitation towards liberal ideas from an early age. His involvement in politics started during his university years, when he participated in the formation of multiple liberal student circles and organisations, before eventually joining the liberal PSZP in 1988 and making his way into its leadership within a few short years. His meteoric rise to prominence only continued from here, when he became the party's candidate in the first democratic elections. His successful mobilisation of a generation of discontent youth with his promises of humane liberalism, democratic centrism and support for stronger Pan-European cooperation led to an unexpected triumph, with him becoming Hungary's newest - and youngest ever - Minister-President.\n\nBut in spite of his victory, he seems poised for a long and gruesome uphill battle. Conservatives and aristocrats alike sneer and jeer at his pledges to enhance civil liberties and implement a truly free-market economy, while his coalition partners protest his plans to foster stronger connections with the rest of the Europäischer Pakt. However, Szent-Iványi has never been one to shy away from challenges - and this time, he pledges, will not be any different."
 POLITICS_ZOLTAN_KIRALY_DESC: "Eighty years after the fall of Hungary’s last left-wing government, a new one has finally emerged. And Zoltán Király, together with many others, is determined to ensure that the country will not have to wait another eighty years for one to rise yet again.\n\nA journalist-turned-politician, Király has been a committed member of the Social Democratic Party of Hungary since 1974. Over the years, he has come to be regarded as one of Hungary’s most popular politicians, renowned for his affable personality, sharp wit, and ability to connect with ordinary people. It was precisely this reputation that led his party to nominate him for the office of Minister-President in the aftermath of its unexpected electoral victory. Yet, despite his ascent to the highest office, his position remains deeply precarious. While workers and peasants, long suffering from unequal distribution of land and restrictions on trade unions, celebrate the victory of the Social Democrats, the party is plagued by bitter divisions between moderate and radical members, while the rest of Parliament regards the new government with anything from quiet suspicion to open contempt.\n\nBut Király is not dissuaded by the fear of failure; instead, he looks towards the future with hope and optimism. The work will be hard, gruesome even, yet if he is successful, then at long last, the Hungarian left will earn its redemption."
 POLITICS_ARPAD_GONCZ_DESC: "It is often said that good things come to those who wait, and as Árpád Göncz assumes the post of Minister-President after more than fifty years spent in politics, he cannot help but agree.\n\n He was born in 1922, and embarked on his political journey at the tender age of fifteen, after personally witnessing the aftermath of the First Vienna Award. He joined the FKgP in his early twenties, and climbed the party hierarchy rapidly, forging a good friendship with the late party giants Tildy Zoltán and Nagy Ferenc. His charisma, literary and oratory skills, and his humble and down-to-earth personality made him a favourite of many people both inside and outside the party - when the time came, his election as party leader was little more than a formality.\n\nNow in government, he continues to be a beloved figure, and his pledges to "protect and assist the marginalized and impoverished", to "serve those without servants" and to ensure "none are more equal than others" move great audiences, despite the concerns of some regarding his age and its impact on his ability to fulfill these promises."
 POLITICS_REZSO_NYERS_DESC: ""
 # Ministers #
 HUN_Sandor_Lezsak_hog_desc: "Behind every great dreamer leader is their loyal sidekick, the thankless workhorse of the government, the moderator of their radicalism. For Miklós Németh, this person is Sándor Lezsák. Born in 1949, and working as a village teacher, he was always against the governmental oppression on political thought, having been fired from his job in 1985 for his calls for political pluralism. Conservative enough to work within the MÉP, yet a democrat whose dream matches Németh, they have been the harmonic duo, of Hungary ever since 1989, when he joined the MÉP after its democratic reformation.\n\nAnd the future? He once famously said: “If am no longer needed on my post, then I will leave with dignity, knowing that someone more worthy will step in my place.” Whether Fate will satisfy him by making that person a democrat, or mocks him with a fascist taking his place, we can only wait and see."
 HUN_Ferenc_Karpati_sec_desc: "Born in 1926 in the city of Putnok, into a family of common workers, Ferenc Kárpáti saw the nature of warfare change so many times in his lifetime, he could hardly even count it. Joinging the Honvédség in 1948, he rose through its ranks with an unprecedented speed, and many speculations arose from his friends, that this man just might be the next leader of the army. He proved them true, as in 1982 he became General, in 84 Field Marshall, and finally in 1987, the Minister of Defense of Németh. He always emphasied the need for a radical modernization of the Army, proposing and implementing the military equipment modernization program dubbed the “Second Győri Program” between 1989 and 93.\n\nKárpáti is by all means a pragmatic person, with not too much personal love for Germany, but he does “Recognize and appreciate the benefits of military cooperation with the Reich.” As long as the Army stands, protecting the Nation, he does not care too much whether it is a democracy or a dictarorship he protects."
 HUN_Geze_Jeszensky_for_desc: "A democrat. A minister. A teacher. A writer. Géza Jeszenszky is all that and so much more. Born in 1941, into a noble family, his political beliefs were deeply affected by the German Civil War and the Slave Revolt. His core idea became the thought that oppression will always collapse to make way for liberty - and therefore liberty must be brought to Hungary, for its collapse to be avoided. While many believed that with such an idea, he could by no means become anything in Nazi-dominated Europe, he proved all doubts wrong, when, with an unprecedented strategic move of pragmatism he joined the MÉP in 1976, and then, from the background, he spearheaded the internal reformist movement that led Miklós Németh to his position as Prime Minister.\n\nTaking his well-deserved place by his side as Foreign Minister, Jeszenszky now prepares for his magnum opus: The total liberalization and democratization of Hungary, and its liberation from under the Nazi yoke. His opponents call him a Communist tool, a puppet of the OFN, an Elder of Zion - and he rejoices in it. The slurs and curses of tyrants are music to his ears. They are the signal that he is on the right track. That he will be successful."
 HUN_Gyorgy_Matolcsy_eco_desc: "It was said “You cannot serve God and mammon.”, and so when it came to choosing, György Matolcsy chose the latter. Born in 1955 in Budapest, growing up and graduating as an economist from the renown Corvinus University, his name by now has become a synonym of corruption in the government of Hungary. Always supporting and siding with whoever pays more, he made his way into the Ministry of Economy, where he soon became the most valuable asset of Germany.\n\nUplifted to and kept in his position solely by bribery and the Nazis' support behind him, who see him as a useful tool for subordinating the Hungarian economy, Matolcsy is loathed by every other member of the government, and the entire populace, but he doesn't care for their voices. He only cares about the sweet clinging of money, honeyed words of the grand love of his life."

### Ideas ###
 HUN_the_transylvanian_fights: "The Northern Transylvanian Unrest"
 HUN_the_transylvanian_fights_desc: "The Second Vienna Award and the subsequent return of Northern Transylvania to Hungary have always been a source of pride and joy for Hungarians. But this is not a sentiment shared by all inhabitants of the territory in question. The Romanians living in the region were not keen on once again becoming part of what they saw as a nation of oppressors, and while some remained politically passive or chose to fight against real and perceived injustices through legitimate means, others believed that it is only through force that their grievances can be resolved.\n\nArmed groups and resistance cells, fighting for the return of Northern Transylvania to Romania, sprung up all across the territory, enjoying the unofficial support of the Romanian government and population, despite countless Hungarian objections. As long as neither side is willing to consider a compromise, this state of affairs will likely remain the status quo."
 HUN_jozsef_arpad: "III. József"
 HUN_jozsef_arpad_desc: "His Royal Apostolic Majesty József Árpád of Habsburg-Lorraine is a man, a king, and a symbol at once, an anchor grounding Hungary in the increasingly heavy turmoil of the New Order.\n\nBorn in 1933, into the Hungarian branch of the House of Habsburg-Lorraine, he was originally a prince of little note, successfully pursuing a degree in economics and entering politics as a member of the House of Magnates in 1957. Merely a decade later, after the departure of Regent Horthy István, the ruling circles of the country approached him with the proposal to accept the Crown and become his successor, a proposal that, after much deliberation, he accepted.\n\nBut instead of serving merely as a complacent throne-warmer, József has taken on a far more assertive role, becoming the figurehead of Hungary's democratic movement and a popular symbol of national sovereignty and dignity. As a result, in times both peaceful and troubled, the Hungarian people look to their King to serve as the nation's guide and custodian."
 HUN_the_second_consolidation: "The Second Consolidation"
 HUN_the_second_consolidation_desc: "Between 1921 and 1931, there existed a state of affairs in Hungary that has come to be known as the “Consolidation”. During this period, all but the most fringe and radical movements lined up behind the reigning government, granting them near-absolute power in a system that was still more or less democratic. This, however, was not to last. The Great Depression dealt a death blow to the Consolidation, paving the way for three decades of tug-of-war between conservatives and radicals. \n\nIn 1964, the conflict ended with the victory of the former, and while the people craved true democracy, it was deemed “too early and dangerous” by those who held the levers of power. Instead, this relic of the past was given new life by them, and ever since then, the Hungarian nation has prospered under this fair, democratic, and most importantly, stable system. \n\nOr that is what they would like the world to believe. In reality, this new Consolidation is a pale shadow of its original namesake, not a source of stability, but of discontent. The people, weary of this charade that has persisted for thirty years, demand an end to it, and soon. And as the saying goes: \n\n“Though the current may be down below the galley, yet water is the lord!”"
 HUN_beginning_of_a_new_period: "Beginning of a New Period"
 HUN_beginning_of_a_new_period_desc: "150 years after the Hungarian nation first expressed its desire for independence, liberty, and democracy, that desire has finally been fulfilled. With the end of the Second Consolidation, the codification of the constitution, and the conclusion of the first democratic elections, many claim that an entirely new period of time has begun for Hungary. A period that shall be one of prosperity and success, one that shall not end for decades to come. \n\nYet, even in the aftermath of this momentous achievement, much work remains to be done. There are still radicals lingering in the shadows, ready to unravel all that has been gained. Turmoil still simmers beyond the nation's borders, casting on it a shadow of uncertainty. Only time will tell whether this new era will truly live up to the aspirations it has inspired as the nation enters the New Millennium"

