 ## Descriptions ##
 # Country Leader #
 POLITICS_MIKLOS_NEMETH_DESC: "Though he wishes it would be otherwise, Miklós Németh is nothing more than another face to hide the collapsing status quo. The newest Minister-President of Hungary knows his fate has already been sealed, that he will go down to the annals of history as a coward - and yet, perhaps as a show of his resolve, he marches on against all odds.\n\nBorn in 1948 into a family of peasants, Németh seemingly had the simple and uneventful life of an average party functionary ahead of him. Joining the MÉP in 1976, he witnessed with his own eyes the construction of the so-called Perpetual Coalition as he ascended to higher and higher positions within the government, but overtime, he also began to see the growing cracks within the ostensibly perpetual system. While the forced facade of unity between its countless parties still exists, for the longest time the question has no longer been if that will end, but rather when.\n\nAnd so, when his predecessor, Tivadar Pártay, announced his retirement in 1990, he was elected to the position of Minister-President by the MÉP, as a last desperate attempt to stabilise and renew the status quo. But Németh is no fool, for the writing is already on the wall: After six long decades, the rule of the party is coming to an end. And whenever he wonders about what will come after it, he quickly realises the futility of the question. Though for many it will certainly be a dream come true, for him it shall be nothing more than a bitter memory of failure."
 POLITICS_REZSO_NYERS_DESC: ""
 POLITICS_ISTVAN_SZENT_IVANYI_DESC: "A new millennium calls for a new generation of politicians, willing to break with the ideas and policies of the old, to create something that has never been seen before. At least this is how most explain the meteoric rise of István Szent-Iványi, the newest and youngest ever Minister-President of Hungary.\n\nElected as the leader of the liberal PSZP in just 1994, few believed that István Csurka would come close to the seat of power anytime soon, but he has proven all his critics wrong. Campaigning on a platform of centrist national liberalism, rejecting the radicals of both Right and Left, his unlikely victory will mean great changes for Hungary. Promising the strengthening of civil liberties, the reintroduction of a capitalism, the reduction of state intervention and the building of stronger economic ties with the rest of the Europakt - a surprising deviation from his otherwise anti-fascist platform - economists and common citizens alike look hopefully towards this promised “socio-economic golden age”.\n\nA young, moderate liberal, he is seemingly a lone island in Europe’s sea of fascism. But István Szent-Iványi has never been one to back down from a difficult task - and if successful, his current task might just end up being the most rewarding of them all."
 POLITICS_ZOLTAN_KIRALY_DESC: "Over seven decades after the last left-wing government of Hungary fell, at last another one has risen. And Zoltán Király vows to do everything in his power to ensure, it won’t be another seven decades until the coming of the next one.\n\nA former teacher, newswriter and television worker, Zoltán Király has been a dedicated member of the MSZDP since 1974, becoming one of the most popular politicians of Hungary, despite countless attacks from both the MMP and his supposed “allies” in the MÉP. Having been swept to power on the back of a wave of popular discontent against both the political and economic status quo, he now prepares to spearhead perhaps the most fundamental changes the Kingdom has seen in the last century. From the resurgence of the long-sidelined trade unions to the purge of every last remnant of Coalition’s rule, his program has been called everything, from “radical” and “dangerous” to “The treacherous ramblings of a Bolshevik.”\n\nBut Zoltán Király knows that if he succeeds, then it might just begin the long journey towards redeeming the legacy of the Hungarian political left."
 POLITICS_ARPAD_GONCZ_DESC: "It is said that good things come to those who wait. And takes his long-overdue place at the helm of Hungary after the diligent work of half a century, Árpád Göncz can’t help but agree.\n\nBorn in 1922 as the son of a Catholic post officer, Árpád Göncz began his political career in the tender age of 23, soon becoming the leader of the youth wing of the FKgP, before quickly ascending into the leadership of the party, becoming acquaintances and friends with the late titans of the party, Zoltán Tildy and Ferenc Nagy. After their passing, he had taken over leadership of the party, staying true to its Christian and agrarian principles, even during the existence of the loathed Supercoalition. After its fall, many expected him to become the next leader of Hungary, an expectation that has been proven true.\n\nSwearing to protect and serve the displaced and the poor, his down-to-earth personality and popular policies have made him a beloved figure, adoringly called “Uncle Árpi” by many. A champion of christian, conservative and agrarian policies at home, and an enthusiastic supporter of constructive diplomacy abroad, seeking to build amicable relations with Pakt and non-Pakt nations alike, many hope that under his guidance Hungary can begin to move towards the future without having to break with its past."
 # Ministers #
 HUN_Sandor_Lezsak_hog_desc: "Behind every great dreamer leader is their loyal sidekick, the thankless workhorse of the government, the moderator of their radicalism. For Miklós Németh, this person is Sándor Lezsák. Born in 1949, and working as a village teacher, he was always against the governmental oppression on political thought, having been fired from his job in 1985 for his calls for political pluralism. Conservative enough to work within the MÉP, yet a democrat whose dream matches Németh, they have been the harmonic duo, of Hungary ever since 1989, when he joined the MÉP after its democratic reformation.\n\nAnd the future? He once famously said: “If am no longer needed on my post, then I will leave with dignity, knowing that someone more worthy will step in my place.” Whether Fate will satisfy him by making that person a democrat, or mocks him with a fascist taking his place, we can only wait and see."
 HUN_Ferenc_Karpati_sec_desc: "Born in 1926 in the city of Putnok, into a family of common workers, Ferenc Kárpáti saw the nature of warfare change so many times in his lifetime, he could hardly even count it. Joinging the Honvédség in 1948, he rose through its ranks with an unprecedented speed, and many speculations arose from his friends, that this man just might be the next leader of the army. He proved them true, as in 1982 he became General, in 84 Field Marshall, and finally in 1987, the Minister of Defense of Németh. He always emphasied the need for a radical modernization of the Army, proposing and implementing the military equipment modernization program dubbed the “Second Győri Program” between 1989 and 93.\n\nKárpáti is by all means a pragmatic person, with not too much personal love for Germany, but he does “Recognize and appreciate the benefits of military cooperation with the Reich.” As long as the Army stands, protecting the Nation, he does not care too much whether it is a democracy or a dictarorship he protects."
 HUN_Geze_Jeszensky_for_desc: "A democrat. A minister. A teacher. A writer. Géza Jeszenszky is all that and so much more. Born in 1941, into a noble family, his political beliefs were deeply affected by the German Civil War and the Slave Revolt. His core idea became the thought that oppression will always collapse to make way for liberty - and therefore liberty must be brought to Hungary, for its collapse to be avoided. While many believed that with such an idea, he could by no means become anything in Nazi-dominated Europe, he proved all doubts wrong, when, with an unprecedented strategic move of pragmatism he joined the MÉP in 1976, and then, from the background, he spearheaded the internal reformist movement that led Miklós Németh to his position as Prime Minister.\n\nTaking his well-deserved place by his side as Foreign Minister, Jeszenszky now prepares for his magnum opus: The total liberalization and democratization of Hungary, and its liberation from under the Nazi yoke. His opponents call him a Communist tool, a puppet of the OFN, an Elder of Zion - and he rejoices in it. The slurs and curses of tyrants are music to his ears. They are the signal that he is on the right track. That he will be successful."
 HUN_Gyorgy_Matolcsy_eco_desc: "It was said “You cannot serve God and mammon.”, and so when it came to choosing, György Matolcsy chose the latter. Born in 1955 in Budapest, growing up and graduating as an economist from the renown Corvinus University, his name by now has become a synonym of corruption in the government of Hungary. Always supporting and siding with whoever pays more, he made his way into the Ministry of Economy, where he soon became the most valuable asset of Germany.\n\nUplifted to and kept in his position solely by bribery and the Nazis' support behind him, who see him as a useful tool for subordinating the Hungarian economy, Matolcsy is loathed by every other member of the government, and the entire populace, but he doesn't care for their voices. He only cares about the sweet clinging of money, honeyed words of the grand love of his life."


### Ideas ###
 HUN_the_transylvanian_fights: "The Northern Transylvanian Conflict"
 HUN_the_transylvanian_fights_desc: "Northern Transylvania was always considered the crown jewel of the Revision, however, if one were to take a closer look at the allegoric crown, they would find it plagued by rust. The Romanian population of the region was never too keen on once again becoming part of what they saw as a nation of oppressors - something that the Magyarization policies of the 50s only helped to strengthen in their hearts and minds, and so, the Legiunea Română de Nord was born. An armed group fighting for the return of the north to Romania, they enjoy the unofficial support of the Romanian government and population, despite the objections of the Hungarian government. They must never be allowed to achieve their vile dream, or the Hungarians of Northern Transylvania will have to experience horrors unimaginable at their savage hands..."
 HUN_jozsef_arpad: "III. József"
 HUN_jozsef_arpad_desc: "His Imperial and Royal Majesty József Árpád of Habsburg-Lorainne is a living contradiction: The liberal, democracy-supporting King of a nation that has been deeply embedded in the alliance of Nazism for as long as he lived. Born in 1933 into the Palatine branch of the House of Habsburg, he grew up to witness his homeland rise from the shackles of Trianon, only for it to fall into petty infighting in the years following it. Taking the place of his father in the Upper House of Parliament after he died in 1957, he became a steadfast supporter of the gradual liberalization of István Horthy, becoming a good friend of the late Regent in the process, which culminated in his decision to allow for the restoration of the Habsburg monarchy to the throne of Hungary after his passing, with the new King continuing the policy of gradual democratization and marginalization of fascism, much to the chagrin of the Reich. And as the New Millennium approaches Europe, he secretly hopes that a time in which liberty and democracy can spread beyond the borders of the Kingdom will finally arrive.\n\nOr to at least be able to preserve it in his homeland, should such a time never come."
 HUN_the_second_consolidation: "The Second Consolidation"
 HUN_the_second_consolidation_desc: "Between 1921 and 1931, there existed a state of affairs in Hungary that has come to be known as the “Consolidation”. During this period, all but the most fringe and radical movements lined up behind the reigning government, granting them near-absolute power in a system that was still more or less democratic. This, however, was not to last. The Great Depression dealt a death blow to the Consolidation, paving the way for three decades of tug-of-war between centrists and radicals. \n\nIn 1964, the conflict ended with the victory of the former, and while the people craved true democracy, it was deemed “too early and dangerous” by those who held the levers of power. Instead, this relic of the past was given new life by them, and ever since then, the Hungarian nation has prospered under a fair, democratic, and most importantly, stable system. \n\nOr that is what they would like the world to believe, but in reality, this new Consolidation is a pale shadow of its original namesake. Neither the King nor the political parties involved wish to prolong its existence. The people, weary of this charade that has persisted for thirty years, demand an end to it, and soon. And as the saying goes: \n\n“Though the current may be down below the galley, yet water is the lord!”"
 HUN_beginning_of_a_new_period: "Beginning of a New Period"
 HUN_beginning_of_a_new_period_desc: "150 years after the Hungarian nation first expressed its desire for independence, liberty, and democracy, that desire has finally been fulfilled. With the end of the Second Consolidation, the codification of the constitution, and the conclusion of the first democratic elections, many claim that an entirely new period of time has begun for Hungary. A period that shall be one of prosperity and victories, one that shall not end for decades to come. \n\nYet, even in the aftermath of this momentous achievement, much work remains to be done. There are still radicals lingering in the shadows, ready to unravel all that has been gained. Turmoil still simmers beyond the nation's borders, casting on it a shadow of uncertainty. Only time will unveil whether this new era will truly live up to the aspirations it has inspired as the nation enters the New Millennium"

