#Ministers
 IBR_mariano_rajoy_hog: "Mariano Rajoy"
 IBR_mariano_rajoy_hog_desc:  "Vice President\nConservatism§!\n------------\nBorn in 1955, Mariano Rajoy has occupied a multitude of positions in Aznar's cabinet, but none more important than his current role as First Vice President of the government.\n\nThe grandson of one of the writers of Galacia’s 1936 Statute of Autonomy, Rajoy got his political start as a young man when he joined up with a reactionary Carlist party. In 1981, he was elected to represent Galicia in the National Legislature. After the merger of several parties into the APD, Rajoy was hand picked to serve as Vice General Secretary of the newly-formed party.The APD’s victory in the 1992 General Election led to Rajoy’s service as the Minister of Education, Culture and Sports. In 1999, Rajoy would ascend to the Vice Presidency to replace Rodrigo Rato. Despite his reputation to the general public as a “gaffe machine” thanks to his propensity for mistakes and misunderstandings in his speech, most would agree that the vice President has the potential to become something more -- only time will tell.§!"
 IBR_jose_manuel_barroso_for: "José Manuel Barroso"
 IBR_jose_manuel_barroso_for_desc:  "Minister of Foreign Affairs\nMarket Liberalism§!\n------------\nSaying that Portugese-speaking José Manuel Barroso is a fish out of water in Aznar's primarily Spanish cabinet is the understatement of the century.\n\n A former Guevarist, Barroso started out as a member of the socialist PCTP/MRPP, but was expelled from the party when, in the midst of the Carnation Revolution, he was caught stealing a truck from the University of Lisboa. In 1980, Barroso was elected to represent Viseu under the banner of the liberal-conservative "Social Democrat Party" (PSD). Following the PSD's merger into the APD, Barroso would go on to represent the people of Lisboa, Portugal’s seaside capital.The latest stage of Barroso’s career, however, came about with his appointment to President Aznar’s cabinet as the Minister of Foreign Affairs. A Portuguese among Spaniards, Barroso enjoys a certain level of job security as the sole representative of the Portuguese people in the President’s cabinet.§!"
 IBR_rodrigo_rato_eco: "Rodrigo Rato"
 IBR_jaime_mayor_oreja_sec: "Jaime Mayor Oreja"
 IBR_josep_pique_i_camps_sec: "Josep Piqué i Camps"
 IBR_rodrigo_rato_eco_desc: "Minister of Economy and Finance\nMarket Liberalism§!\n------------\nThe man behind Iberia's economic growth and impulser of Aznar's "Silent Revolution", Rodrigo Rato is one of Aznar's main supporters and was his Vice President during most of his presidency. Starting as a representative for a small conservative political party and was one of the main attackers of the PSOI's economic policies, even becoming the party's spokesman.After the formation of the APD he supported Aznar's election as president of the party. During his time as minister he has lowered taxes and privatized many companies, continuing to follow Aznar's "Silent Revolution".Other than a politician, he has also been president of many corporations.\n\nNow Rato is the confirmed successor of Aznar and the APD's candidate for the upcoming general elections, and seems like he wil be the winner, but in politics, anything can happen.§!"
 IBR_josep_piIBR_josep_pique_i_camps_sec_desc: "Minister of Internal Administration\nConservatism§!\n------------\nWhen he was still young, Piqué i Camps found his home in a Communist Catalan party -- but all of that nonsense, as Camps has stated in many interviews, is far behind him. An experienced economist with a checkered history of fraud, the latest chapter of Camp’s career has dropped him into the fast-paced world of Iberian politics. /n/nThough Camps was reluctant to associate himself with any particular political party when first appointed to a government position, he has since aligned himself with the APD and occupied many important positions within Aznar’s government such as Minister of Industry, Trade, and Tourism. /n/nWhile Piqué i Camps isn’t exactly a household name in Iberia, the man can rest assured that, even if his time in politics comes to an early end, some Madrid highrise will always have a cushy office with his name on the door.§!"
 
#Ideas
 IBR_iberia_va_bien: "Iberia va bien!"
 IBR_iberia_va_bien_desc: "Under the tenure of President Gonzalez and President Aznar, the Iberian economy has, in defiance of all expectations, nearly tripled in size -- and shows no sign of stopping any time soon. The burgeoning Iberian middle class now has access to amenities that, years ago, only the most privileged of Iberian society could hope to afford: Cars, new homes, holidays abroad, and day trips to the nearest theme parks. Without a doubt, today’s youth enjoy a significantly higher quality of life than their parents before them. \n\nShould anything cause this growth to falter, however, §! §xDISASTER§! would surely befall the Iberian economy. Most of these amenities, after all, are afforded through generous loans from your local bank.  /n/nBut the Iberian public shouldn’t be worried -- with things as good as they are, how bad could this theoretical disaster possibly be?§!
 IBR_brick_fever: "Brick Fever"
 IBR_brick_fever_desc: ""Thanks to President Aznar’s “Soil Law”, Iberia has seen a veritable surge of new construction. Be they residential, commercial, or industrial, it seems that each and every urban development proposal that finds its way to a politician’s desk meets a stamp of approval.\n\nThis buzz of new development sounds great on paper -- but the reality of the situation is far less promising. Along with a flourishing speculation market, Iberia’s “Brick Fever” is driving property prices to unprecedented heights. If the situation doesn’t get under control, the average Iberian will be priced out of buying a home in the near future -- and §!§xthe bubble will pop§!.
 IBR_growing_nationalism: "Growing Nationalism"
 IBR_growing_nationalism_desc: "A quick glance at the 1999 edition of ‘La Historia de Iberia,’ the standard textbook issued to nearly every eighth grader in the Spanish-speaking regions of the country, will inform readers that the scourge of terrorism that rocked Iberia during the time of the Caudillos was stamped out long ago. The Iberia of today, it reads, is a harmonious landscape of divergent languages and cultures.\n\nThis sanitized history, unfortunately, couldn’t be farther from the truth.  Surfing the net reveals a litany of small, personal websites, all featuring name-filled guestbooks, hit counters in the thousands, and garish, repeating patterns of regional flags for backgrounds. These small sites, each with their own bustling forum of supporters, feature no shortage of hastily-typed manifestos bemoaning the injustices inflicted upon one region or another. The Portuguese, according to many such sites, are a minor partner in the Union, and Iberia is really controlled by the Spaniards. Other sites make the case for Galician autonomy, while others still demand outright independence for regions like Catalonia and the Basque Country -- through any means necessary.\n\nAs these websites grow in popularity, their users have moved their activities into the real world, organizing protests that, more often than not, result in violence. To the average Iberian, these fringe groups are barely even worth thinking about -- but, if left unchecked, their impact could be far greater than expected...§!
 IBR_la_mili: "La Mili"
 IBR_Tourist_Hotspot: "The Tourist Hotspot of Europe"
 IBR_Tourist_Hotspot_desc: "The Iberian peninsula is home to one of the strongest tourism-based economies in the European continent, thanks to its natural wonders such as the sunny beaches on the Mediterranean coast and its rich and historically important cities like Lisbon, Barcelona or Madrid. Every year thousands, if not millions, of tourists come from all over Europe, wherever it is for spending their holidays or only taking a pause from their monotonous lives and enjoy new activities thanks to the vast options that Iberian tourism offers to them. \n\nTherefore, our government profits from this high-intensity tourism, earning Iberia the record of being the most visited country in the world, only rivalled by few other countries around the globe. Nevertheless, this reliance on European Tourism from Britain and Germany has its downsides. §VShould we drift too close to the United States, we risk potentially losing our European Clients to a travel embargo.§!"
 IBR_State_of_Union_Strong: "State of the Federation - Strong"
 IBR_State_of_Union_Strong_desc: "The Iberian Federation remains united and strong in her resolve. The government is well-prepared to handle any threats, be they external or internal. While more work can be done, most generally agree that Iberia is a relatively stable country."
 IBR_Between_Two_Worlds: "Between Two Worlds"
 IBR_Between_Two_Worlds_desc: "Iberia’s position in Europe has put it on the center of contestation between the OFN and the Europäische Pakt, both superblocs fighting a silent and covert conflict to bring the Union in their respective spheres.  The current government wishes to continue its policy of neutrality in order to preserve the balance of power in Europe but with the passing of time it is starting to become apparent that soon or later Iberia must make its mind on who to support in the International chess game. \n\nIn the meanwhile, the two giants will continue their attempts to persuade Iberia into joining their orbits but will the OFN gain a foothold in the old world? Or shall the Reichsadler continue to take under its wings more sons and daughters of Europa?"
 IBR_Sociological_Francoism: "Sociological Francoism"
 IBR_Sociological_Francoism_desc: "Franco and Salazar may have passed for more than two decades, but their legacies have remained strong in Iberia. Politicians and the Citizenry who had hoped that the Restoration of Democracy would lead to a vibrant, thriving state throwing away the shackles of its past could not have been more wrong. \n\nAlejandro Rodríguez de Valcárcel, through Electoral Meddling and allying with the FET y de las JONS, led the Unión Nacional to victory in the 1970 Iberian Elections. He and his successors have maintained the Caudillos' Legacies, arguing that Catholicism and Tradition are what truly embodies Iberia. Left-Wing parties like the PSOE are but Terrorists out to destroy the nation and embroil the country in another Civil War like 1936. Iberia may have a New Face, but reshaping its insides will take a long long time."
 IBR_The_Basque_Conflict: "The Basque Conflict"
 IBR_The_Basque_Conflict_desc: "Although the Iberian Federation has assumed a somewhat-more democratic shape and has given the various ethnic minorities more representation in the government, not everyone has been content with this solution and still vies for the total independence of their native soil. The most prominent and troublesome force is the ETA, the Euskadi Ta Askatasuna for short, an openly active terrorist group calling for the Independence of the Basque region which has been active in Iberia since the late 50s. \n\nThey have not given up their goal, and have the blood of hundreds of innocent people on their hands through various terroristic activities ranging from bombings to assassinations on various civilian and military figures, with their activity intensifying in the later years. Should the government not take immediate and firm action against this rebellious scum, §VIberia may not live long enough to see the dawn of the new century.§!"

 IBR_la_mili_desc: "Currently, Iberia’s military requires constant military conscripts to fill positions in it’s lower ranks. Commonly known as the “Mili”, it’s one of Iberia’s hot topics, and has shaped Iberian society for decades. Reforms under the socialist government allowed boys to choose between the army and an alternative civil service, but still there are some who call for it’s complete elimination citing: civil liberties, disarmament or spending. But as the cold war between the Reich and OFN rages on, Iberia must protect itself using it’s young man. And so, for the time being, the Mili stands."
 #leader descs
 POLITICS_JOSE_MARIA_AZNAR_DESC: "Born in Madrid in 1953, Aznar was too young to remember the birth of the nation he’ll end up running, but sure does remember the dictatorship and fall of it.\nAs the child of a privileged family, his father was a falangist journalist. In university, he entered a falangist student organisation that oppposed Franco and defended the national-syndicalist ideology, but he left as he developed more conservative ideas.\n1974 would be a year that neither Aznar nor the entire Iberian nation would forget.\nThe Carnation Revolution saw a group of officers from the army overthrow the Franco dictatorship and install a democratic system.\nIt was during this early democracy that Aznar joined the Alianza Popular of Manuel Fraga, a conservative party that tried to absorb the right wing vote.\nAt first they seem overshadowed by the UCD of Torcuato Fernandez Miranda and Adolfo Suarez, but as the Suarez goverment had just developed into chaos and frustration, and the UCD collapsed, the AP rise thrived.\nIn 1980, they would see the AP from 5th position and near dissolution to second place and official opposition to the Gonzalez-led Partido Socialista Unificado de Iberia. During the 80s Aznar went climbing the leadership of the AP and the Iberian goverment, becoming president of Castilla y Leon in 1987.\nMeawhile the AP, in an internal crisis, searched for a new, young, candidate, and they found it in Aznar. Renaming themself Partido Popular, they went into the 1988 Iberian general election, which saw the PSUI lose it’s majority in the Iberian congress and having to relay in nacionalist and regional parties to govern.\nGonzalez’s third term didn’t go well. Terrorism rose, the economy stagnated and public opinion was low on Gonzalez.\nAnd so in 1992, with a boost from an attempted terrorist attack, Aznar took the PP to victory, be at just a minority of seat, but in time for the Barcelona Olympics.\nImmediatly after winning, Aznar took drastic measures to solve the economic crisis with his friend Rodrigo Rato: First, he privatized public companies, second, he cut taxes and business requirement, and third, he implemented his Magnum Opus: The law of the soil, a law that made all of Iberia urbanizable by the decision of different mayors.\nThis made Iberia experience a economic boom like it hadn’t seen before.\nWith the Iberians well served, Aznar now attempted to solve the terrorism problem. Though first with a strong position of non-negotiation, he subsequently established talks with ETA and managed a ceasefire.\nNow, with the majority won in 1996 and the economy booming, Aznar has decided not to go for a third term, but it will be he who chooses his successor.\nBut, for now, Aznar can relax on the good work done, and talk without complex with Führer Speer or president Cheney, for Iberia is doing great."
 IBR_Jose_Maria_aznar_desc: "Born some years after the birth of the Iberian Federation, Jose Maria Aznar hails from a privileged family of politicians and army officials. /n/nThanks to his father’s influence, Aznar identified as a Falangist during his college years. As he matured, however, his ideology deradicalized, and the future President would ultimately align himself with the conservative APD. Here, within the smoke-filled rooms of the APD’s Madrid headquarters, Aznar’s influence as one of the party’s  main reformers would ultimately push the APD’s ideology toward the center. /n/nIn 1992, Aznar would appear in the first televised presidential debate in Iberian history, and many say his calm, confident demeanor would contribute to his victory in the 1992 election. Though his AFD failed to win an absolute majority, Aznar would still manage to ascend to the Presidency through shrewd coalition building with several smaller parties. /n/nSeven years later, the Aznar Presidency has been one of the most prosperous that Iberia has seen in the post-Caudillo era. Under Aznar’s leadership, to name just one example, the Iberian Federation has secured its place as a key member of the Organization of Free Nations. Even if his opponents criticize him for allowing Iberia to be ‘subjugated’ by the ‘globalist American hegemony’, the economic advantages that come with joining the geopolitcal bloc are plain to see -- Iberians are undoubtedly happier, healthier, and far wealthier than they were prior to Aznar’s tenure. /n/nWithout a doubt, Jose Maria Aznar is one of the most popular Presidents in Iberian history. No matter who succeeds him, his will certainly be a difficult act to follow.§!
 IBR_Jose_Maria_aznar: "José María Aznar"
