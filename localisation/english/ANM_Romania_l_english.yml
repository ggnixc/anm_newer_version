### Ideas ###
 ROM_ethnic_tensions: "Ethnic Tensions"
 ROM_ethnic_tensions_desc: "The Kingdom of Romania is a lot more diverse than the Romanians themselves would approve of. Hungarians, Serbians, Ukranians, Gagauzians, they all form a meaningful fraction of the population despite the concentrated efforts of the Romanian government to colonize and integrate them. Yet the most prolific racial conflict would be between Hungarians and Romanians, especially around the subject of Northern Transylvania."
 ROM_avatar_of_democracy: "Avatar of Democracy, now a pale shadow"
 ROM_avatar_of_democracy_desc: "The Kingdom has served as a beacon of democracy  and stability in the balkans and Eastern Europe in general for decades, yet after years of political backtracking, infighting, inefficient  reforms, tension within the population and German hegemony over the Oil Industry, has left the Constitution weak and the Party in charge, unpopular. The people want change."
 ROM_michael_the_first: "Michael the First - Figurehead"
 ROM_michael_the_first_desc: "Michael the First has remained the Poster Boy for all of Europe during the Second World War and much of the 50's, not only because of his PlayBoy attitude and look,stealing the hearts of many both at home and internationally, but also because his politics has left a positive mark upon the ideals of Constitution Monarchy and the Crown in Romania."
 ROM_dealing_with_the_devil: "Dealing with the Devil and its Consequences"
 ROM_dealing_with_the_devil_desc: "The Marshall, the Eternal Leader of Romania during WW2 has led the Romanian Army all throughout the vast territories of Russia. From Odessa and Sevastopol, to Grozny and even Moscow. Indeed, in this grand expanse, Romania managed to regain its former territories  lost by the German-Soviet Pact.\n\nThis glory did not come out at a cost though,  as Romania traded its ample oil resources in exchange for weapons and ammunition, turning the Romanian Army into something truly to behold. Yet in a spectacular and cowardly backstab, the Reich allowed the Kingdom of Hungary to secure Northern Transylvania still, even if the Fuhrer negotiate with the Conducator and the Fuhrer guaranteed Romania its territories back because of the effort its armies put in defeating Judeo-Bolshevism. Our pride, tarnished and the rewards, bitter sweet."
 ROM_major_trade_partner_reich: "Major Trade Partner of the Reich"
 ROM_major_trade_partner_reich_desc: "Despite what many Romanians would proudly call their nation as the breadbasket of Europe, that title will inevitably fall on Ukraine. Yet, one thing is true about that name and that is the matter of fact which managed to keep the volatile Romanian economy afloat. Anything from grains and fertilizer to manufacturing components and jet schematics would be shipped to the reich in return of much needed economic stimulus."
 ROM_A_Decadent_Dream: "A Decadent Dream"
 ROM_A_Decadent_Dream_desc: "A return to normalcy. That was the hope of every Romanian after Antonescu's dictatorship ended. In the beginning, everyone thought that the restoration of democracy by King Mihai's wish would also mean a return to the good old times before the war. This was far from the case. Not even 10 years after democracy returned to the kingdom, the Odessa Hostage Crisis shook the country to it's core. Thankfully, or rather unfortunately, Penescu survived the the incident, followed by his so-called “safety measures” that ruined any resemblance of true democracy the country had. These changes effectively diminished every other party's chance at getting elected, besides the ruling one's.\n\nCorruption reappeared as a daily necessity for the average citizen to get by. Not only that, but the Oil Crisis practically crashed the Bucharest stock exchange market within hours. Just when it seemed the situation couldn't get any worse, the Slave Revolt in the Eastern Reichlands made it clear that a total revamp of the Pridnestrovian administration must take place in order for Romanian influence to survive. This, together with the seemingly endless wave of German colonists flocking from Moskovien in the midst of the 2nd West Russian War threw any progress the Romanian administration made out the window.\n\nNow, in 1996, the 114 year old kingdom puts its trust in the Europakt, as the resurging Soviet Union breathes down harder and harder on Eastern Europe. The question is: §VCan this dream ever come to fruition?§!"

