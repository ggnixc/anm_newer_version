 ## Descriptions ##
 POLITICS_RADU_VASILE_DESC: " "
 POLITICS_RADU_CAMPEANU_DESC: "Radu Câmpeanu, the president of PNL, is seen by his fellow Romanians as an icon of Democracy and the promises of Libertarianism. A prominent figure among Democrats at large, he was the Leader of the National Liberal Party’s Youth Wing and was briefly imprisoned after protesting against Antonescu’s Rule. After King Michael’s Restoration, Radu quickly rose to become part of the PNL Leadership. Yet the continuous winning streak of the PNT meant that it would be some time before PNL would once again guide Romania under its torch.\n\nWhen the PNL finally entered into power in the late 80s, he became the party’s president and nominee for Prime Minister. A purely neutral character, now ripe in his old age, he was the perfect candidate for the Germans, as he was too weak to contest the exploitation of Romania's soil in any significant manner. As much of a talented diplomat and politician as he is, nobody can resist the test of time.\n\nRadu finds himself in a difficult situation and the country even more so. Threats from the Balkans and USSR rear their head once more. The Government has grown inept, inflexible and out of date. The diplomats are the harvest of nepotism while the country is having its literal life sucked out by the predatory dealings with Germany. The people are calling for unification and change now more than ever.\n\nYou can't teach old dogs new tricks, but he sure as hell can play a few more old ones."