### Ideas ###
 ROM_michael_the_first: "Michael I - King of Romania"
 ROM_michael_the_first_desc: "King Mihai, as commonly addressed by most of the population, is the royal figurehead of the Romanian Kingdom. Son of Carol II, Mihai had quite the stains to wash away. From cheating scandals and corruption allegations, Carol built the baleful reputation of a degenerate monarch - who was illiberally feeding on the state’s wealth and organising extravagant parties with his wife.\n\nHowever, Michael tried to deviate from that image. From the moment he first became permanent King in 1940, he understood that his responsibility was to ensure peace and prosperity for all Romanians. The people were convinced about his good character when he, together with most of the country, pressured Gheorghe Brătianu to resign in favour of the formation of an intermediate government, followed by elections. Keen, charismatic and democratic. What more could the people want?"
 ROM_dealing_with_the_devil: "Under The Swastika's Shadow"
 ROM_dealing_with_the_devil_desc: "After the fall of the Bolshevik threat and the subsequent end of the Second World War, Ion Antonescu was the undisputed leader of Romania. One of his lasting legacies however, besides the Transnistrian folly, was the excessive dependence on the Reich’s intervention in its economic and internal matters. While the Führer was celebrating his victory in Germania the Romanian peasants were left wondering whether they would get their daily rations. As soon as Hitler's death shattered stability within the German sphere, Bucharest sought to retain some degree of self-sufficiency in hopes of re-establishing its position on the global scene.\n\nWhen the Oil Crisis set the Reich's eastern colonies on aflame and the global economy shrunk overnight, Europe was holding its breath, wondering what would follow. The Soviet army answered as they began their march into Moskowien in 1981. After Germany's defeat, the new Führer, Albert Friedrich Speer, wanted to find a new oil supplier after Subsidiarität Kaukasia was almost cut off from the rest of the colonial empire. Alluring economic deals, strategic investments and “friendly” pieces of advice dragged Romania back into the Reich's influence after a transient period of economic and political autonomy. Will Romania be able to free itself once more?"
 ROM_A_Decadent_Dream: "A Questionable Decision?"
 ROM_A_Decadent_Dream_desc: "In the 1964 election, Ion Rațiu was determined to keep the PNȚ in power. Running a campaign highlighting individual freedoms, the Premier wanted to heal most of the scars left by Antonescu's regime, one of them being the Governorate of Transnistria. Following the Odessa Hostage crisis, it was clear that urgent reforms were needed to take place in order for Romanian influence to survive. Gradual progress was made by the Rațiu administration to ensure a more stable Transnistria, and in 1968, a referendum took place in which all territories East of the Dniester Valley voted in favour of the creation of the Pridnestrovian Republic.\n\nMany within the government were quite sceptical of the decision to let go of the territory, but in the end, they accepted the fact that Antonescu's experiment had failed. While Transnistria is allowed to govern itself and has its own constitution and set of laws, it still relies heavily on the Romanian army and secret service to ensure its sovereignty, making Bucharest invest in the region to rehabilitate the decadent and mistreated lands of the ex-governorate. As long as Transnistria exists, it will use the Romanian shield to protect itself."

