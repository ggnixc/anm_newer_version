 ## Leader Descriptions ##
 politics_radu_vasile_desc: "Radu Vasile, born in 1942 in Sibiu county, is a Romanian historian, economist, and currently the Prime Minister of Romania. Before his participation in political activities, Radu entered the History University of Bucharest in 1960 and later held his thesis in 1977.\n\nWhen he joined the National Peasants' Party in 1980, he was enamoured with Rațiu's premiership and his faith in the rights of every citizen, regardless of ethnicity or background. An “underdog” at first, as they would say. But that would not last long however, as Vasile began to gradually rise up within the ranks of the party, starting as the head of a regional department, to public spokesman, and finally a senator in Bacău county.  While being a liberal stronghold, the PNL officials found themselves at odds with Vasile on many occasions, mainly over the annual budget and the city administration.\n\nFor a few years, the historian kept a low profile within politics, seeing it as a chance to influence liberal and social democratic voters and win their trust, at least during his time in the Senate. In the 1992 election however, Vasile decided to build up his support for Corneliu Coposu's electoral bid, even though he personally did not agree with some of his ideas. After seeing the results in late December, he was excited about being promoted to party vice-secretary. But that enthusiasm would not last forever, as Coposu, determined and persevering as he was, lost his battle with lung cancer on the 11th of November 1995, forcing Vasile to take the helm.\n\nNow, in 1996, Radu hopes to keep the situation as stable as much as he can in order to maintain PNȚ’s dominance in the senate and the polls. Will he live up to his predecessors?"

 ## Minister Descriptions ## 
 ROM_emil_constantinescu_for_desc: "Born in 1939 in Bessarabia, Emil Constantinescu would go on to live his childhood in Argeș County as his family was forced to flee their hometown after the Soviet Occupation. After finishing highschool, he would go on to be a university professor, specializing in geology. He later joined the PNȚ in 1987, being part of a group comprised of fellow intellectuals interested in politics. In 1991 he would go on a trip together with his colleagues to the United States, part of a research initiative sponsored by the leader of the OFN in order to attract hard-working and fresh scientists.\n\nWhen Coposu's government was being formed, Constantinescu was suggested multiple times by fellow party members, and the Peasantist leader sought to fulfil the wishes of the congress. As the never-ending German-Soviet rivalry seems to ignite Europe in flames once again, Emil is left wondering what he could do to make Romania's international position more desirable."
 ROM_gavril_dejeu_sec_desc: "Born in the Apuseni mountains, Cluj county, Gavril Dejeu had a mostly normal childhood. That is until the Magyar army occupied his village and mortally wounded his father. He was forced to flee to Sibiu together with his brother, a city in which he would also go to university and get his degree in law school.  He would later join the PNȚ in the late 1970s in order to kickstart his law career, however, the more he interacted with the government, the more he would become attracted to politics. In 1992, Gavril was chosen as the Minister of Interior thanks to his strong character. With fervently anti-Hungarian views, he is a vocal advocate for the reclamation of Northern Transylvania, something that every citizen is still unanimously in favour of.\n\nNo one shall get past Dejeu, and if they do, they will feel the agony of challenging a lawyer in his own courtroom."
 ROM_mircea_ciumara_eco_desc: "Mircea Ciumara was the local PNȚ deputy in Constanța County from 1988 to 1992. A famous economist and academic, Ciumara has shown himself again and again as a more than competent deputy, so much so that he was nominated as the National Peasantist's Minister of Finance after the 1992 election. It was finally time for Mircea to show his expertise. One of his first initiatives was to begin diversifying Romania's exports and opening up more markets for the country, such as Iberia, Italy, and Sweden. More opportunities opened up since the Reich's defeat at the hands of the Russians, which Ciumara knew he had to take advantage of. Economic collaboration with the Republic of Turkey was also one of his interests, as they have been cut from the Middle Eastern black gold for years, something which Romania had an abundance of.\n\nWhether the PNȚ retains the majority or not, it's clear that Ciumara will remain an influential figure on the economic scene."
 ROM_ion_diaconescu_hog_desc: "A virtual relic of the pre-war period in Romania, Ion Diaconescu seems to have beaten the test of time. Born in 1917, he is one of the party's strongest and most trustworthy members, even related to the fondly remembered Ion Mihalache.\n\nAfter the turbulent and corruption-filled 50s, Diaconescu thought that the next decades would be kinder to Romania, and to some degree, he had been proven right. Only after Rațiu's last term did the situation begin to worsen again, leaving the Peasantists to figure out how to minimize the damage the Oil Crisis was doing. All of this, together with the resurgence of the USSR, would mean that the country would need to radically change its economic perception within the Pakt and markets so as not to anger the Reich. A tired Diaconescu now sits as the PNȚ's deputy prime minister, wondering what could possibly come next."