 #ideas
 
 MRA_Revolutionary_Foquism: "Revolutionary Foquism"
 MRA_Revolutionary_Foquism_desc: "Foco is a revolutionary tactic developed by famous latin american communist Che Guevara, it bases itself on the idea of small guerrilla units who create revolutionary “focuses” along the countryside to inspire action against capitalism and create consciousness among the lower classes to take up arms themselves.\n\nThough usually applied in a pre-revolutionary context -as the guerrillas would serve only to bolster the population’s morale and not take over the state itself-, In this current war it has found its use during such a conflict, even as a conventional armies stand alongside the vanguard guerrillas. Thanks to the specific conditions of the MRA the vanguard guerrilla play a heavy role in inspiring the population to take up arms by acting as a third force that fights independent from the factionalism in the MRA.\n\nBy fighting as a separate vanguard the Foco creates points of revolutionary upheaval all over the nation, giving the MRA a cohesive propagandist force that allows the many different peoples of Peru to rally around, above all, their liberation. The parties may play politics around the councils, but it's the Focos that act as the revolutionary arm of socialism."
 
