## Mod Info
 MOD_INFO_TEXT: "§x==THE NEW ORDER: A NEW MILLENIUM==§!\n\n§xThe New Order - A New Millenium§! takes the popular mod The New Order to the Year 2000! As The Victors of the Second World War decline, new powers are on the rise. The German Eagle seeks to unite the Continent under its rule, with the fate of the fascist system and Albert Speer's Legacy uncertain. Japan's hegemony fades as the Chinese Dragon rises, seeking to reclaim their past might. Across the Ocean, the United States attempt to restore their honor lost during the Defeat of the Second World War. And the Russian Bear, brought back to its old strength by Zhukov and his Comrades, the fate of the revolution is at stake, as the forces of the reaction grow among the army. The Cold War rages on, as the menace of terrorism reveals itself, out of the ruins of the feared black state. Will you steer the world torwards a brighter future? Or lead it into darkness once again? \n\nFinally, here are the credits for the mod:\nCredits to\nTotinoBoy\nFluvi\nLove Craft\nSorrowful men\nHoly_Regen\nV1king5\nEmote\nOldZealand\ntara_kdn\nNishmair\nMidin\ntotalstgamer\nColonel Tahara\nArtz\nAliusars\nyasen\nBob69elysium\nAllyte\nDr.strangelove\nMax.lm\nRenShengRuMeng\nSunnyBoi\nli kuo jan\nPjero\nLockmart fan\nJordan\nWojt with an axe\nPeter17S\nsenko\nMaitiv\nPENTAKILLcommander\nGoulashdaddy\nArchy\nEmhyr\nCzeski Porucznik Burak\nxierOVO\nhisamatya\nBest Bean\nJohnDowland\n(note: unicode characters have been deleted or replaced due to game properties)\nsponge bob\nArashTheArcher\nTheDeveloper3\nDillosauras\nEl Presidente\nMolto Ritardando\ncragga\nMexican Mapper\nradcliffe\nsmokepapucho\nPapa Richard\nMyszak\nKaiserin\nShakespeareInLove\nDroody\nthePingusDingus\nF I N N\nSerena\ntortonho\nDrapit184§!\nFurther thanks to TNO, the TNO Submodding COOP server, the Hoi4 Modding Coop, our partner servers, Bruhingrad91 for portraits, GriffinFTW for the KdN flag, and Millennium Dawn for letting us use their 3D unit models.\n§u==THE NEW ORDER: A NEW MILLENIUM==§!\n\n§c §!"

