 ##NATIONAL SPIRITS###
 BLR_panopticon_unleashed:0 "Panopticon Unleashed"
 BLR_panopticon_unleashed_desc:0 "Belarus is a surveillance state, half life 2 combine. basically the thing slav kept talking about. Collabs (Belarusian Home Army) are used for policing alongside German polizei."
 
 BLR_the_leviathan:0 "The Leviathan"
 BLR_the_leviathan_desc:0 " Belarus' role in the eyes of the Leviathan is uncertain. is it mean to serve as an extraction colony for Germany, winds seem to be sailing there? Or an ideological project of sorts? (either for the germanization to be extended there or for nation building a Belarusian State to take hold). The latter is unpopular as consensus is beginning to see Belarusians as a people even more inferior to Russians.)"
 
 BLR_forge_of_empire:0 "Forge of Empire"
 BLR_forge_of_empire_desc:0 "Prompt: Belarus has become the launching point for lower ranking RMfdbO members to try and make a name for themselves, the stagnation of the colony has made more higher ranking nazis disinterested in dealing with it, vacuuming it in favor of lower ranks."
 
 BLR_the_second_prometheus:0 "The Second Prometheus"
 BLR_the_second_prometheus_desc:0 "Prompt: Germany's trouble with Belarus doesnt end at the lack of vision for the colony, it continues in the large scale partisan movement present. Belarus consists of two different partisan coalitions, in the west, AK has come to dominate with its catholic coalition of the AK command (governed in Nowogrodek), Polish Peasantists and Belarusian Christian Democrats (with some minor social democratic elements) and in the east, it has ossified around the Belarusian Communist partisans led by Masherov. These power blocs have elected to form a national front amongst each other to resist germany, which has led to the nationalization of belarusian communists. The sectarianism present in belarus is also a defining factor, with it dividing the partisan war, which is a positive for germany"
 
