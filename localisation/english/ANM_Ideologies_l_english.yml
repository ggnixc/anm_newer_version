### ANM Unique Subideologies ###
# Reich #
national_socialism_rosenbergite_tendency_subtype: "Rosenbergite Tendency"
national_socialism_rosenbergite_tendency_subtype_desc: "Within all movements, great and small, there are those who find themselves in a struggle against orthodoxy. Some are great men, struggling against rising systems of evil, ardently defending rights and liberties. Others, like Alfred Rosenberg, fought only for their own petty politics. Yet even years later, when the trends are clear and the dust is settling, their ideas, policies, and conceptions persist.\n\nThe Rosenbergite Tendency is not an organized movement, but a disparate collection of characters who, to one end or another, see the ideas of Alfred Rosenberg as the ideal German policy towards the East. To Rosenberg, a Baltic German, the East was more than a land to settle, but a set of nations to uplift and purify, to use as a wedge that can fully destroy the Russian nation. Though the man himself is long forgotten in Germania, his policies retain weight in the east, where his vision of the Reichskommissariats has not yet fully dimmed.\n\nIntellectuals and thinkers still heed Rosenberg's word, as a kind of pragmatic, humanitarian policy which might have prevented the maelstrom gripping the East. Yet make no mistake - its believers follow Hitler in every other aspect. They are as chained to the Reich and its violence as much as their colleagues. Rosenberg's word, no matter how sweet, is not an escape."
# USA #
liberalism_atari_liberalism_subtype: "Atari Liberalism"
liberalism_atari_liberalism_subtype_desc: "A modern world requires modern solutions, this is the origin of the Ideology referred to by its proponents and opponents as Atari Liberalism. Seeing Liberalism both social freedom and economic private enterprise as critical to the success of a society Atari Liberalism has become a popular belief system inside the Democratic Party advocating for decreased regulation, a protected welfare state, lower taxes, and social progressivism, though many have decreed it as typical Neoliberalism, no one can truly deny that at least so far it has brought about great economic success and societal advancement.\n\nAtari Liberalism derives itself from the proposed solutions of its proponents men like Presidents Al Gore and Gary Hart who advocate for greater advancement in science and technology, and increased investment in our environment, though it varies greatly from supporter to supporter it has one thing in come, that is seeking to bring about the world of tomorrow, today."
progressivism_western_progressivism_harkin_subtype: "Western Progressivism"
progressivism_western_progressivism_harkin_subtype_desc: "For good or ill, America's sense of nationhood is inextricably tied to the frontier. The rich canon of folk tales penned in honor of the west’s sprawling prairies and winding rivers are unified under a single theme – one of a land of opportunity in which any man, regardless of circumstance, could sow the seeds of a better life with nothing but raw grit and determination. Today, the West plays a distinct, but similar role in the ever-continuing American story. It is the epicenter of an ideology known as Western Progressivism, the latest attempt to mold the United States into a true bastion of liberty and justice for all.\n\nWhile East Coast Progressivism has a long history of compromising with the Washington establishment in order to enact limited reform, Western Progressives turn up their noses at such naive pragmatism. To the Western Progressive, the traditional institutions of political power – corpulent corporations, greasy machine politics, and plutocratic politicians – are nothing more than tools for the ultra-wealthy to keep the working-class entrenched in a never-ending cycle of poverty.\n\nTo their supporters, Western Progressives are an authentic, down-to-earth alternative to the faceless corporate suits on Capitol Hill. Such rigid authenticity, however, often brings with it a lack of unity. Sticking to one's principles is a great way to earn votes on the campaign trail, but when it comes to making policy, the characteristic stubbornness of Western Progressives can sometimes make it difficult to form a unified opposition to their ideological enemies to the right, even when doing so is necessary to political success.\n\nAfter a long trail of electoral failures, Western Progressivism has at last found its standard-bearer in President Harkin. With his inauguration, it appears that the left-wing of the Democratic party may finally get its chance to build an America that truly works for all, not just the 1%."
# Chile #
paternalism_pinochetism_subtype: "Pinochetism"
paternalism_pinochetism_subtype_desc: "Characterized by authoritarianism, neoliberal economics, and the rejection of collectivist ideals, the philosophy of Pinochetism ruled Chile from 1966 to 1988 — the dictatorship of General Augusto Pinochet.\n\nPinochetism emphasizes the need for a strong, centralized government, as well as the importance of a strong military to maintain order and stability. Followers of the ideology, even after the retirement of Pinochet, believe that Chile must be "modernized" through free-market reforms such as widespread privatization of industry and the large-scale deregulation of the economy. Brutal suppression of political opposition and media censorship is also commonly seen in these regimes.\n\nThough the man himself no longer participates in politics, Augusto Pinochet’s philosophy and governing style continues to shape Chilean society. While many Chileans reflect upon Pinochet’s reign as a dark period of dictatorship and suppression, others supported the now-retired despot, and still back his authoritarian ideals to the present day."
# Brazil #
socialist_lulism_subtype: "Lulism"
socialist_lulism_subtype_desc: "Oftentimes in Latin America we see political movements arise not from a single ideological basis, but from the will and popular support of a single figure, a great Caudillo who arises to fight for the people. So was the case for Luiz Inácio “Lula” da Silva and his own political movement, Lulism, who would arise from the ashes of the old left and the military dictatorship to represent one of the most relevant democratic left wing movements in the continent.\n\nLulism would come about from the creation of the Workers Party, a heterodox mixture of democrats, trade unionists, the intelligentsia and christian socialists who united under the banner of Lula’s independent and strong syndicalism, creating a party not only linked to Lula’s figure, but also ideologically independent from both mainstream trade unionist and marxist  thought.\n\nWhat unites Lulists is the rescue of an independent trade unionism, separating it from the conservative position of a state controlled one, rather, workers should utilize trade unions apart from the state and centralized under the Workers Party, who through non-marxist democratic socialism will reform the country internally in order to bring about social justice and equality.\n\nThe Lulist movement is its own force separate from the PTB and Communists and yet has managed to become the main left-wing force in Brazil, however, what this means as the pragmatism and personalism of Lula consolidate more and more over the country's politics is yet to be seen."
# Ecuador #
socialist_ecuadorian_model_subtype: "Ecuadorian Model"
socialist_ecuadorian_model_subtype_desc: "Ecuadorian Model, also called the South American Road to Socialism or Socialism with South American characteristics is less of a concrete system in of itself and more of a method and strategy to get to socialism, based on the thought of the founder of the Socialist Republic of Ecuador, Manuel Agustín Aguirre, it seeks to account for the specific material and external conditions in Latin America in order to fully achieve socialism.\n\nTaking Marx’s historical dialectic to heart Aguirre saw that Latin America could not achieve socialism the same way that Europe and North America could as it found itself lagging behind in production, still stuck in a semi-feudal state, therefore Latin America could not rush into socialism but allow the material forces to develop, this combined with his disappointment in the Second Ecuadorian Revolution where he saw that the national bourgeoisie’s position in the capitalist mode of production did not permit a natural transition into socialism.\n\nWith this in mind Aguirre established as a strategy the use of a proletariat and peasant state that was still nevertheless liberal and capitalist despite being driven by socialist forces, and that only such a state could develop Latin America into socialism, as such countries that follow the Ecuadorian Model tend to agglomerate socialist parties in its government and maintain markets and capitalist modes of production, while still securing total worker and peasant control of the state itself."
# Haiti #
progressivism_neocorporatism_subtype: "Neocorporatism"
progressivism_neocorporatism_subtype_desc: "Corporatism, once a fringe belief, has become one of the twentieth century's guiding philosophies. It is the stamp of the new order, but even in the old order's democracies, its influence can be felt. The product of this mix is a new corporatism, like and yet unlike its fascist predecessor.\n\nNeocorporatism advocates against the traditional class interests, responsible in their minds for so much of the conflict and wars of the past decades. In its place, they advocate for pillarization, whereby society is organized based on specific interest groups centered around religion, nationality, political background, or another factor, each with their own institutions and social organizations, each orientated to be as inclusive as possible to avoid possible sources of tension and unrest. Ties are created between these groups, reducing conflict between interest groups that would typically oppose each other, like labor unions and corporations, allowing for better coordination and cohesion regarding economic challenges. The end result is turning otherwise economically disastrous labor disputes into structured negotiations between a few committed actors.\n\nOverall, neocorporatism abandons the rampant nationalism and totalitarian structures of its ideological predecessors, but some of its ideological adherents hold grander plans regarding it. They believe that the tripartite institutions created to deal with simple economic matters are capable of far more, capable of running the government more efficiently than the traditional liberal democratic model of majoritarian decision-making. Whether or not this belief holds true outside of the textbooks remains yet to be seen."


