  ## Ideas ##
  POLITICS_OSMAN_AL_HUSSEIN_DESC:0 "The leader of the next generation of state and security forces was once the strongest voice in carrying out actions for the civilians and reduced the military force in Sudan.\n\n Today, it is almost impossible to believe that it is the same person. The loss of his party in the election has brought with it fears for the future of the country which is in a state of barely enduring with all the efforts of the military, and weaker leaders may even cause Sudan to lose its sovereignty. al-Hussein wasted no time. Together with his subordinates, he forcibly prevented the new government from convening and took control of the country by force of arm. \n\nIf all the concessions of the army did not make the citizens appreciate the army, then the army will go deeper into the lives of the citizens with all its might so that they will understand how important the army is to Sudan."
  SDF_legacy_of_1999_election:0 "Legacy of the 1999 elections"
  SDF_legacy_of_1999_election_desc:0 "The 1999 elections were supposed to introduce our nation to the ideas of democracy; these ideas were crushed by the military boots as they marched into Khartoum, ousting president Nugund, under supposed §REgyptian plot§! to turn Sudan into a puppet state of Cairo. Ever since then provincial authorities barely respond to the capital's dictates"
  SDF_insurgency_everywhere:0 "Insurgency everywhere"
  SDF_insurgency_everywhere_desc:0 "Ever since the military took over the capital insurgents started spreading their messages and rectruting everybody to their cause. Now we, the rightful leaders of Sudan have to deal with a large scale insurgency that naively opposes us."
