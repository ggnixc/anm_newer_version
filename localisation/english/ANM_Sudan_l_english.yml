  ## Events ##
  SDF_anm_starterevents.1.t:0 "A Night in Khartoum"
  SDF_anm_starterevents.1.d:0 "Without a second thought, Okhot Ibrahim stepped aside to avoid a muddy puddle in the same wide, unpaved road that he'd patrolled for the last three decades. It was a simple job, but it paid well — Each day, from dawn to dusk, he walked the streets of Khartoum, ensuring public order and reporting any suspicious goings-on to the military police. \n\n He'd always had an affinity for this street in particular. Farouk Street — Named after a dead king. The government had always intended on finding a new name for the two-mile strip of  open-air market stalls, but Sudan's perennial instability provided a bounty of far bigger fish to fry. \n\n Why were things so unstable, anyway? It seemed that his country couldn't go more than three years without some disgruntled faction seizing control of the government. Perhaps he should ask his friend Abdo — that egghead always spent the morning with his nose buried in the newspaper.\n\n 'Well! Fancy meeting you here!' \n\n Okhot turned on a dime. Speak of the devil. The aging soldier, dressed in his fatigues, approached him from the opposite end of the street. \n\n Donning a goofy grin, Okhot wrapped his friend in a tight bear hug. 'What are you doing here?' He said, failing to notice Abdo's worried frown. 'Did they reinstate the military police in this sector?' \n\n Abdo nodded. 'We raided Jamal’s just last night. The place was a hotbed for communist organizing, apparently.'\n\n 'The only half-decent bar this side of town? You’re joking!' \n\n Sighing, Abdo shook his head. 'To be honest, there are more important things on my mind. You are aware of the news, correct?' \n 'Al-Hussein’s coup?” Okhot chuckled. “That’s news?' \n\n Abdo’s face hardened. 'It isn’t a laughing matter. The Egyptians are —' \n\n 'Please. Did you really expect democracy to stick? We all knew that if elections went forward, the military would throw a shit fit.' \n\n 'And you’re just going to accept that!?' \n\n Okhot waved his hand. 'Sorry, but I just don’t have the energy to get worked up about politics. I’m just trying to keep my family fed day-to-day.' \n\n Abdo glanced at the ground for a few long moments, face strained in contemplation. 'I should get going.” He sighed, gripping his friend’s shoulder before continuing down the street. “It was nice to see you.' \n\n Okhot nodded, gripping his rifle and resuming his patrol. 'You too...' "
  SDF_anm_starterevents.1.a:0 " Tomorrow was payday. That’s as far as he needed to think about the future."

