 COUNTRY_INFO_NO_CONTENT: "                                    §bWELCOME TO THE NEW ORDER\n\n§R                                    THIS NATION IS NOT PLAYABLE§!\n\n§RThis nation is currently empty besides placeholder events and other filler content for other countries to bounce off. All nations with content are listed in the "Interesting Countries" menu.\n\nPlease play one of those if you want any actual content, and follow us on our social media (as found in the MOD INFO tab) if you want to follow development!§!"

 COUNTRY_INFO_VYATKA: "§G==THE PRINCIPALITY OF VYATKA==§!\n\nThe near-total collapse of Soviet authority in the wake of the West Russian War has, over the years, resulted in all manner of ambitious warlords rising through the ashes and staking their claim to Russia. One such group is a ghost from Russia's turbulent past: the remnants of the Romanov dynasty led by §xVladimir III§! and his allies.\n\nDuring the West Russian War, the hard-pressed German forces allowed a division of European émigrés loyal to the exiled §xVladimir Kirillovich§! to join the fight against the resurgent §RRed Army§!, where they would play a key role in a desperate Wehrmacht offensive. Although the Germans were eventually forced to withdraw, the monarchists pushed on regardless, and were able to establish a permanent foothold in §xVyatka§!. Now §xVladimir III§! and the émigré cliques oversee the strongest bastion of monarchism in Russia. That being said, §xVyatka§! is beginning to face internal divisions. The émigré cliques bicker amongst themselves and compete for political dominance, while the antiquated bureaucracy of the §xPrincipality§! continues to cause problems as time marches on. The Okhrana, the §xPrincipality's§! secret police led by Boris Smyslovsky, has so far been successful in ensuring stability for the regime, but the question of how much power they should wield remains. These issues will need to be addressed before any serious plans for reclamation can begin.\n\nInternally, the §xPrincipality§! is divided between three émigré cliques of equal import. Firstly are the Constitutional Democrats, led by the émigré §xRoman Gul§!, who represent the liberals. They wish to create a functioning constitutional monarchy, complete with guaranteed rights for minorities. Secondly, the Solidarists led by §xAleksandr Solzhenitsyn§! are staunch nationalists with some authoritarian tendencies. That being said, they still wish for some degree of reform from the antiquated systems of yesteryear. Finally, there is §xVasily Shulgin's§! faction, the All-Russian National Union. §xShulgin§! is a politician of the old school, with a history of service dating back to the days of Tsar Nicholas II. Like the liberals, he favors constitutionalism as well, but does not wish to disrupt the traditions of the old Empire.\n\nExternally, §xVyatka§! is surrounded by potential threats. To the southeast, the madmen of the §RAryan Brotherhood§! serve as the most pressing threat. In the north, the unstable §RRepublic of Komi§! is unpredictable and should be carefully monitored, while the §RWest Russian Revolutionary Front§! stirs. If §xVyatka§! is to unite Russia, conflict with them is inevitable. Meanwhile, raids from the §RTatar§! and §RBashkir§! warlords to the west and south are common but are unlikely to escalate into a full-blown conflict for now. Further to the southwest, however, is §RAndrey Vlasov§! and the so-called §RRussian Liberation Army§! based in §RSamara§!. Unlike the §RTatars§!, they harbor ambitions of expansion and may cause problems in the future if left unchecked. To the east lies the warlords of §GBerezniki§! and §GGayny§!. Although §GBerezniki§! pledges their resources to us, their governor may have ambitions of his own. On the other hand, relations with §GGayny§! have mostly been cordial, and it may be possible to sway them to the cause.\n\nThe §xPrincipality of Vyatka§! now stands poised to undertake the arduous task of uniting Russia once and for all. Will Russia find itself ruled by a Tsar once more? Only time will tell...\n\n§G==FEATURES==§!\n\n* Decide between constitutionalism or the old government.\n\n* Prepare the §xPrincipality's§! armies for conflict with rival warlords.\n\n* Unify the §xRussian Empire§! once more."

 COUNTRY_INFO_SAMARA: "§G==THE COMMITTEE FOR THE LIBERATION OF THE PEOPLES OF RUSSIA==§!\n\nIn the bloodiest days of the West Russian War, when it seemed like the Reich's hold on Russia was on the verge of slipping forever, the German high command turned to desperate means to stave off the collapse of their front line. Drawn from a range of auxiliary colonial militias of Russian conscripts that were meant to police German-held Russia, the §xRussian Liberation Army§! or §xROA§! was created. In propaganda, the §xROA§! was depicted as a proud Russian army, fighting the §Rbolshevik§! menace of the §RWest Russian Revolutionary Front§!. In desperation, the Germans even allowed the creation of the §xCommittee for the Liberation of the Peoples of Russia§!, or §xKONR§!, as the embryo of a free Russian Republic that would rule over areas liberated by the German counter offensives.\n\nReality was much less flattering to the §xROA§!. Its leader §xAndrey Vlasov§!, a former Red Army general, was nothing more than a puppet of the Wehrmacht's high command. His officers were a a disjointed bunch. Many were also captured Red Army officers, preferring to join the §xROA§! than die in a German POW camp. Others were fascist émigrés, joining the §xROA§! on a great crusade to defeat §RBolshevism§!. The common soldiers were desperate cannon fodder, drafted at gunpoint by the Germans and sent to reinforce the most desperate sectors of the front. Far from being welcomed as liberators, Russian people caught in the conflict area welcomed §xROA§! soldiers with rock and insults.\n\nDespite all this, the §xROA§! pushed on. The soldiers fought with the energy of desperation, and managed to help turn the tide in the sector around §xSamara§!. Soon the §xROA§! found itself beyond the German lines, freed from their former taskmasters. With the war winding down and the §RWRRF§! in retreat, the Germans wrote off their cannon fodder as mutinous Slav Untermensch. The new headquarters of the §xROA§! in Samara were not spared any of the terror bombing campaigns that followed.\n\nSince then the §xROA§! has huddled in Samara, having traded one prison for another. Unable to expand their area of control by the terror bombings, and forbidden to go back home in the west, the common soldiers of the army have languished for the better part of a decade in their garrisons. The §xROA's§! officers, meanwhile, have grown weary of §xVlasov's§! indecisiveness. They argue for a more decentralized leadership, and for the abandonment of §xKONR's§! original democratic mission in favor of a continuation of the §xROA's§! junta. Using general §xSergei Bunyachenko§! as their mouthpiece, the men of the Officer's Committee scheme to take advantage of §xVlasov's§! apathy and old age. However the officers are not all united in ideology. Quite a few have formed a pro-democracy faction, and argue that §xVlasov's§! heir as chairman of §xKONR§! should be §xMiletiy Zykov§!, a former journalist that has maneuvered his way into being the chief propagandist of the §xROA's§! regime in Samara. Zykov argues for the continued struggle to liberate Russia from §RBolshevism§! as well as German oppression. In between all this, many common soldiers and lower ranking officers have grown tired of the high command's bickering and seek to follow General §xOktan's§! goal to use the §xROA§! to build a strong, fascist state... and to enrich the soldiers in the process.\n\nThe §xROA§! is at a crossroad. Loathed by all their neighbors as German collaborators, yet feared for their veteran army and iron discipline, the men of the §xROA§! await the end of the terror bombing. Some seek to redeem their honor by rebuilding Russia. Others seek vengeance on the communists and on the Germans who have ruined their life. Finally, a growing minority simply want to lash out at the uncaring world that has forced them to lose a decade holed in Samara.\n\n§G==FEATURES==§!\n\n*Determine who shall win the power struggle to be the successor of §xVlasov§! as leader of the §xROA§!.\n\n*Finish what the Germans could not do and destroy the §RWRRF§! once and for all.\n\n*Show the world the perils of underestimating the so-called "traitorous dogs of the ROA.""
 
 COUNTRY_INFO_1_NIK: "§G==THE KOMI REPUBLIC==§!\n\nThe failures of §RNikolai Bukharin§!, the §RGerman§! invasion, and the defeat of the §RWest Russian Revolutionary Front§! against the §RGerman Reich§! bled the people of Russia far too much, subjecting them to unimaginable horror and destitution for little gain. Rather than the worker's utopia promised by the §RSoviet government§!, the communist experiment ended in failure, as apocalyptic warfare scorched West Russia for the second time in two decades.\n\nThe former government of the §GKomi ASSR§!, a faithful band of Soviet loyalist politicians, gladly went along with §RGrand Marshal Kliment Voroshilov§!'s plans for the restoration of the §RSoviet government§!, and Komi, despite the reservations that its highly politically deviant population held, gladly slipped into the pocket of the §RFront§!, until the West Russian War, and the transition of the §RFront§!'s capital to Syktyvkar.\n\nThe War, the political failures of the §RFront§!, the final assassination of Alexei Rykov, and the bombing of the §RPresidium of the West Russian Revolutionary Front§! marked the last straw for the Komi government, however. §GNikolai Alekseevich Voznesensky§!, the newly appointed head of the §GKomi ASSR§!, took executive action to declare independence from the §RFront§!, being aided in his operation by a slew of former §RWRRF§! politicians, including §xMikhail Andreyevich Suslov§!, foreign minister of the Front, and §SAndrey Alexandrovich Zhdanov§!, a prominent official of the ComIntern.\n\nWith the secession of the §GKomi ASSR§! from the §RFront§! under a newly declared §GRepublic§!, and the loss of yet another capital, the political cohesion of the §RFront§! dissolved, and more and more separatists ate away at the §RWRRF§!'s armies before operations could be launched to put down the rebellions and warlords.\n\nWith the democratic nature of the §GKomi Republic§! becoming well-known throughout West Russia, and the developed city of Syktyvkar becoming swollen with refugees from other, less accommodating warlord states, a climate of political radicalism began to fester within the §GRepublic§!, fed by §GVoznesensky§!'s collaboration with §SZhdanov§!'s communists, and the underground influence of §Rextremist politicians§! who had been set free from the many former GULAGs in the region. Political violence, grand scheming, and paramilitary activity became commonplace, with the corruption within the §GRepublic§!'s armed forces doing nothing to help matters, despite the efforts of talented officers such as §GPetro Grigorenko§! and §GIvan Korolkov§!.\n\n§bThe State of the Komi Republic:§!\nThe state of the §GRepublic§! in 1962 is hardly one conducive to functional democracy, or civilized life. Crime is at a recent high, with constant paramilitary street battles shattering the silence on the streets of Syktyvkar. The plots of shadowy ideologues are constantly pit against each other, in the form of assassinations, thefts, fraud, assault, extortion, and conspiracy against the Republic. While power is brokered within the §GNational Assembly§!, and the §G"Democratic Coalition"§! of relatively centrist parties attempts to keep order and sane governance, §xMikhail Suslov§!'s §xCommunist Party of Komi§! on the far left and §OLev Gumilyov§!'s §OPassionariyy Organization§! on the far right constantly attempt to bring down the government in the shadows, while maintaining a respectable public opinion.\n\n§bThe Players of the Game:§!\nThe §GKomi Republic§!'s politicians are infamous for a particular nature that seems to run through the §GRepublic§! as a whole - a pseudo-addiction to scheming, backstabbing, and power games. Regardless of whether they personally tolerate such underhanded tactics, the environment of the §GRepublic§! demands such tendencies, and so, the politicians which survive this unimaginably stressful environment tend to be forged into metaphorical diamonds - master schemers and maneuverers who can manipulate entire parties beneath their thumb.\n\nThe Centre:§!\nDespite the wide variety of democratic parties and the issues which cleave movements apart in Komi, the saving grace of the §GRepublic§! is that democracy, too, is a political question and hot-button topic. The intensity of the efforts to tear down democracy has forged the otherwise disparate centrist parties into a ramshackle coalition to preserve the electoral system at all costs, and fight radicalism. The ruling §PPeople's Democratic Socialist Party (DSNP)§!, §MUnion of Young Reformers (SMR)§!, and §gSovereign Democratic Party (PSD)§! have all become tempered allies in the environment of the §GRepublic§!.\n\n§PNikolai Alekseevich Voznesensky:§!\nThe §GPresident of the Republic§! and leader of the §PPeople's Democratic Socialist Party§! since its founding, §PNikolai Voznesensky§! is a rather controversial man. Despite his initial electoral popularity, his constant scandals, often revolving around his abrasiveness, racist comments, or allegations of corruption, have eroded his popularity and cast many members of his party into an unfavorable public light. His friendship with the communist leader §SAndrei Zhdanov§! has come under scrutiny in recent months, and it only remains to be seen whether the 1963 election shall be the end of §PVozesensky§!'s political career, or merely the start of his next term."
 
 COUNTRY_INFO_2_NIK: "§MAlexei Nikolayevich Kosygin:§!\nA prominent elected Deputy, and leader of the §MUnion of Young Reformers§!, §MAlexei Kosygin§! is famed as a rather quiet and respectful politician, who serves as the chief "peacemaker" within the center. However, his disillusionment with the current composition of the §GCoalition§! is growing with each and every new scandal §PVoznesensky§! finds himself in, and he constantly finds himself looking at his own potential bid for power. Along with his close friend, §gSvetlana Stalina§!, §MKosygin§! forms the "hardline" wing of the centrist coalition - the wing that will never allow for capitulation to the radicals.\n\n§gSvetlana Iosifovna Stalina:§!\nA former §PDSNP§! member who split to form the §gSovereign Democratic Party§! following yet another infamous scandal, §gSvetlana Stalina§! is a rather young and idealistic firebrand who has overcome her reputation as a splitter, and cut out a position as a force in her own right. §gStalina§! forms the trustworthy right flank of the coalition, with a platform that combines a patriotic, security-centered policy with a strong focus on welfare and public works. Her constant praise of institutional power and stability, as well as her desire to stabilize the foundation of the §GRepublic§! by any means necessary, has led to constant accusations of authoritarianism, but her coalition partners tend to dismiss these claims. After all, §gStalina§! is utterly uncompromising - in her eyes, a strong, democratic §GRussian Free Republic§! is worth the cost - no matter how painful the means are to get there.\n\n§xThe Left:§!\nThe §xCommunist Party of Komi§! is notable in that it is the most united political "wing" in the Republic. The infamous §xMikhail Suslov§! has forged an ironclad political machine out of the far left, leading successful operation after operation to stage scandals, shatter the people's confidence in the government, and establish an environment of constant pressure on the §GRepublic§!'s security forces. However, despite its unity, not all is well within the §xCommunist Party§!. The cracks between its leaders are invisible in public, but all too apparent behind closed doors. In the eyes of Party insiders, a conflict between §xMikhail Suslov§! and §rIvan Serov§!'s orthodox faction and §SAndrei Zhdanov§! and §lSvetlana Bukharina§!'s reformist faction is inevitable - all that remains to be seen is how destructive it shall be to the §xParty§!'s very foundations.\n\n§xMikhail Andreyevich Suslov:§!\nThe stories that one would hear of Komi's infamous "shadow master", §xMikhail Suslov§!, are awe-inspiring, and wide in scope. According to various citizens of the §GRepublic§!, §xSuslov§! is personally behind nearly every aspect of the chaos in Komi, personally orchestrating street battles, robberies, and blackmailing rings while he plays the violin in his townhouse. Not every story is true, of course, but §xSuslov§!'s reputation speaks for itself.\n\nA famed leader within the WRRF with such a fearful political reputation that §RMikhail Tukhachevsky§! condemned him for couping the government without any evidence, §xSuslov§! has maintained his talents throughout the Russian wasteland, honing them more and more as his career advances. §xSuslov§! is a brilliant man who views the §GRepublic§! as his chessboard - a complex machine made up of interlocking mechanisms of class conflict and civil strife. With every move of his paramilitaries and "unaffiliated" Deputies in the §GNational Assembly§!, he comes closer and closer to his goal - the end of the §GRepublic§!, and the restoration of the §RUSSR§!, with himself as the grey cardinal behind it all.\n\n§SAndrei Alexandrovich Zhdanov:§!\n§SAndrei Zhdanov§! is a walking contradiction. He is the leader of the §xCommunist Party§!'s §GNational Assembly§! delegation, and one of the highest figures in the Party - yet his libertarianism and populism seems to fly in the face of what §xSuslov§! is widely considered to want. §SZhdanov§! is a visionary in every way, a fierce, charismatic firebrand - yet he tends to align with §PVoznesensky§!'s government constantly, seemingly missing opportunities to perpetuate the §RRevolution§! that the §xCommunist Party§! so desires. The mystery behind §SZhdanov§!'s motivations and operations raise many questions, but none can doubt his character. According to many centrists across the aisle, if one Communist were to take power, it would have to be §SZhdanov§!. After all... where else could one find such charming, moderate, populist spirit?\n\n§lSvetlana Nikolaevna Bukharina:§!\nThe emergence of the daughter of the doomed §RNikolai Bukharin§! within the §GRepublic§! was hardly expected, but it was hailed by many communists as a sign that their movement was destined for greatness comparable to the strength of the old §RVKP(b)§!. §lSvetlana Bukharina§! rapidly rose into the ranks of the §xCommunist Party§!, being elected by unheard-of margins, bringing her unstoppable energy and ambition with her. Despite her comparative youth compared to many figures within the government, and her questionable adherence to the letter of the line that §xSuslov§! promotes within the §xParty§!, §lBukharina§! is most certainly one of the foremost communists within the §GRepublic§! - and the brightest, most radiant rising star among their number."
 
 COUNTRY_INFO_3_NIK: "§bThe Right:§!\nThe §OPassionariyy Organization§! is a singularly bizarre organization in Komi, a combination of a social club, a secret society, and an apparatus for political coalition-building. Under the wide-spanning umbrella of the §OPassionariyy§! are Eurasianists, "compassionate conservatives", monarchists, and other, smaller movements, all united solely by the desire for a new, right-wing path for the §GRepublic§!. The §OPassionariyy§! are easily the most wide-ranging coalition in Komi, stretching to every possible corner of right-wing thought, and, as of such, paradoxically both prone to infighting, and extremely effective at operating within the §GRepublic§!. Within the §OPassionariyy§!, there is someone for everyone, or so it is said - the media outlets controlled by the organization appeal to the people, rallies are held, and the §Gcenter coalition§! is forced to look closer and closer towards §OPassionariyy§!-affiliated politicians each day.\n\n§OLev Nikolayevich Gumilyov:§!\nThere is only one man in the §GRepublic§! with the cunning and political acumen to unite so many disparate rightist groups under one banner, and his name is §OLev Gumilyov§!. An eccentric philosopher and a well-spoken ideologue, §OGumilyov§! is the ideological heart of the §OPassionariyy Organization§!... and the brain, as well. His theories of a Eurasian civilizational empire are ones that most of the Komi right can at least pretend to get behind, and his ideals of rapid expansionism, the restoration of national strength, and a culture of patriotism appeal to the teeming multitudes that attend his rallies. Despite his seemingly unthinkable level of extremism, §OGumilyov§! is the center of the §OPassionariyy§! in spirit, and he will not halt his shadowy operations until his theories may be tested and realized on the grandest scale imaginable.\n\n§bIgor Rostislavovich Shafarevich:§!\nEvery movement needs a face, and §bIgor Shafarevich§! is a respectable face indeed. A well-respected academic in the §GRepublic§!, §bShafarevich§! heads the moderate "moralist" wing of the §OPassionariyy§! - the wing most keyed to gathering public support, and the support of the centrists within the §GNational Assembly§!. §bShafarevich§! is one of the most famous voices of the §OPassionariyy§!, and his calls for a "National Democracy" based off of "compassionate conservative" principles are heard around the §GRepublic§!, on widespread venues such as Radio Free Syktyvkar, the pre-eminent broadcasting service within the §GRepublic§!. As the left grows larger and more threatening, Shafarevich's commitment to democracy and willingness to cooperate with the Centre has driven more and more politicians amongst the right-wing of the ruling coalition to look his way, seeking deliverance from the communist threat.\n\n§jSergey Vladimirovich Taboritsky:§!\nThe black horse of Komi, the enigmatic §jSergey Taboritsky§! is famous as an almost anachronistic figure. His Imperial regalia, his nostalgic calls for the restoration of the §RRussian Empire§!, and his vast hidden personal wealth may, in a different state, tear the people away from supporting him, but in Komi, it merely serves to captivate the imagination. §jTaboritsky§! is quite possibly the most populist of the §OPassionariyy§!, tirelessly campaigning for his §jOVRI§! - the §jSociety for the Restoration of the Russian Empire§!. However, among those who have spent time close to him, it has become apparent that something is very, very wrong with §jTaboritsky§! - the look in his eyes is not quite that of a man driven by sheerly mortal energy, and his mannerisms have consistently grown more bizarre...\n\n==FEATURES==\n\n*Fight through the storm of intrigue to save the §GRepublic§!... or bring it §Rcrashing down§!.\n\n*Experiment with the many ideologies and parties present within the §GRepublic§!, and bring one to victory.\n\n*Put an end to §Rwarlordism and anarchy§!, uniting Russia under the flag of one of Komi's many contenders."

 COUNTRY_INFO_ONEGA: "§G==THE ANTI-COMMUNIST VOLUNTEER GUARD==§!\n\nThe Third Reich had assured the people of the §GFinnish Republic§! that the §RSoviet Union§! would never again threaten Finland, nor its territorial gains in §xKarelia§!.\n\nThe West Russian War proved this to be a damned lie. The §RWest Russian Revolutionary Front§! remnants of the Red Army in Western Russia nearly managed to derail Germany's new order in Europe. Once the dust had settled, the §GFinnish Republic§! found its eastern border occupied by the remnants of the §RWRRF§!. Looking only to themselves for safety, Finland turned to... unorthodox solutions. §xRussians§! living in Karelia and around lake Onega were captured by §GFinland's§! new military government. The men were separated from their family, and forcibly drafted into the new §GAnti-Communist Volunteer Guard§!. Led by former Red Army General §xVladimir Kirpichnikov§!, this army of the damned would hold the borderland between Finland and the §RWRRF§!. Helsinki's dictats were very simple: all the guardsmen had to do was to defend §xKarelia§! from §Rbandits§! and from the §Rcommunists§! to the east. Loyal service would let the Guardsmen see their family again.\n\nNearly a decade on, the men of the guard cling onto this promise of seeing their family once more. Their task is a gruelling, thankless one. As they patrol the Arctic land around lake §xOnega§!, fighting bandits and communist infiltrators, the Guardsmen look east with uncertainty. The winds are changing in Western Russia, and it is likely that soon their fellow countrymen will come knocking to recapture the land stolen by §GFinland§!. Ill-equipped, the Guard continues its watch. Their service will guarantee their freedom, one way or the other.\n\n§G==FEATURES==§!\n\n*Patrol the icy shores of §xLake Onega§! for §Rbandits§! and §Rcommunist§! infiltrators.\n\n*Prepare for the inevitable showdown with West Russian warlords attempting to reunify Russia...\n\n*Lead the Guard to the end of their grim duties, when they will be able to go home and see their families again."

 COUNTRY_INFO_WRRF: "§G==THE WEST RUSSIAN REVOLUTIONARY FRONT==§!\n\nThe §RGreat Patriotic War§! against the §Rfascist invader§! cost the Soviet people everything, and then some. The Nazis employed unimaginable cruelty in a crusade against Soviet civilization itself, to the extent where no single man or woman couldn't name someone close to them who had been cruelly torn from them by the hands of the §RHitlerites§!.\n\nIn the muddled anarchy after the total collapse of central government authority, the remnants of the §GRed Army§! in the west reorganized in the city of Kuybyshev under the leadership of §GGrand Marshal Kliment Yefremovich Voroshilov§!. Across the former territory of the Sovet Union, loyal §GRed Army§! units flocked to his banner, including the Sixth and Ninth armies under Marshals §GMikhail Nikolayevich Tukhachevsky§! and §GGeorgy Konstantinovich Zhukov§!, respectively. With these powerful mechanized forces, and an alliance with prominent political figures such as §RMikhail Andreyevich Suslov§!, the newly formed §xWest Russian Revolutionary Front§! was able to exert authority over all of the shattered remnants of the Union which remained west of the Urals.\n\nIn the late 1950's, with the §RReich§! paralyzed by the deadliest economic crash in history, and the §GRed Army§! only becoming more eager to avenge their defeat, §GGrand Marshal Voroshilov§! decided that the time had come to launch §ROperation Suvorov§!; the liberation of all Soviet lands currently occupied by §RGerman§! forces. Despite Lazar Kaganovich refusing to commit the forces of the West Siberian People's Republic to the operation, the §GRed Army§!'s advance was swift and brutal. Voroshilovgrad was liberated on day 28 of the operation, prompting an attempted coup by the §RSS§! under §RHeinrich Himmler§!. Spurred by the infighting within the enemy's ranks, §GRed Army§! troops reached the outskirts of Leningrad and Moscow by day 40.\n\nRiding high on this wave of success, few noticed the §Rcracks§! that had formed within the §xFront§!'s political structure over the years. The exact cause of the §Rdisintegration§! of the §xFront§! during the §RWest Russian War§! remains unknown, with theories ranging from an attempted seizure of power by §RSuslov§! to the breakdown of the critically overextended command structure. Facing threats to the security of the §Gmilitary leadership§! in the face of a §Rrenewed German offensive§! employing the collaborationist forces of the §RRussian Liberation Army§! and §RVladimir Romanov§!, the government was relocated to the city of Syktyvkar. Following the political turmoil, and the string of defeats at the hands of the enemy, the §RRepublic of Komi§! seceded from the §xFront§!, and the subsequent string of defections and secessions marked the end of the §RWest Russian War§! and the death of the §xWest Russian Revolutionary Front§!.\n\nOr so the §RGermans§! thought. The §xFront§! lives on, clinging to life amongst the permafrost tundra around the embattled city of §GArkhangelsk§!, with its generals bitterly divided after the catastrophic failure of §ROperation Suvorov§!. To the south sit the Military Districts of §xPlesetsk§! and §xUkhta§!, ostensibly loyal vassals trusted with the management of the Front's anti-aircraft defenses against the §RGerman terror bombings§!, and upkeep of the oilfields respectively. However, these domains serve a very different purpose, to keep §GTukhachevsky§! and §GZhukov§!, and all the factional politics that follow them far, far away from the leadership in Arkhangelsk.\n\nMarshals §GMikhail Nikolayevich Tukhachevsky§! and §GGeorgy Konstantinovich Zhukov§! are widely considered to be the two potential successors in the event of §GVoroshilov§!'s §Runtimely death§!;\n\n§GTukhachevsky§! is a talented, if somewhat eccentric officer who believes in the role of the §GRed Army§! as the primary driver of political change. A former noble who turned against the conformity of his class to join the Bolsheviks in the §GCivil War§!, §GTukhachevsky§! has gained support from a number of elements within the Front, who wish to avoid the mistakes made by §RBukharin§!, and return the §GUSSR§! to its former §Gmilitary glories§! and §Gbeyond§!, with every cog inside its machine turning towards one singular goal, every soldier marching towards final victory.\n\n§GZhukov§! is a talented, popular commander who received fame and admiration amongst his men from the §GCivil War§! to §ROperation Suvorov§!, leading the liberation of Voroshilovgrad together with §GMarshal Momyshuly§!. While §GZhukov§! is fiercely loyal to the communist cause, his clique has attracted the attention of some reform-minded figures such as §GAlexander Yakovlev§! and §GNikolay Ryzhkov§!, along with many of the hardliners unaffiliated with Tukhachevsky's faction such as §GSergey Akhromeyev§!.\n\nNow, in 1962, the §xFront§!'s situation is a precarious one. Beyond the territories controlled by §GArkhangelsk§! lie §Rstatelets§! run by §Rillegitimate secessionists, collaborators, Tsarists and other contenders§!. Only time will tell if the §xFront§! will regain its position as the defender of Western Russia, and, potentially, §Greunite the Motherland§!, to §Gavenge those who fell§! and deliver §Gjustice§! upon §RGermany§!.\n\n==FEATURES==\n\n*Manage squabbling cliques of generals to decide the future of the §xFront§!.\n\n*Put an end to §Rwarlordism and anarchy§!, uniting Russia under the §GSoviet flag§! once more.\n\n*Prepare for the continuation of the §RGreat Patriotic War§! against §RGermany§!."

 COUNTRY_INFO_ARYAN_BROTHERHOOD: "§G==THE ARYAN BROTHERHOOD==§!\n\nThe failure of the §RWest Russian War§! left deep scars in the Russian psyche. Three times §RRussia§! had fought §GGermany§! this century, each resulting in defeat and collapse. To many it was starting to seem that the §GNazi's§! claims of racial superiority held weight, and the Russian people would never have the strength to stand against the German §GÜbermensch§!. Some accepted this as a sad fact of life and resigned themselves to living in fear of the §Gmaster race§!, but one man refused to accept his subjugation.\n\nAs §RRussia§! fell into anarchy once more, §xGutrum Vagner§! gathered a band of derelicts and degenerates around himself. For him, the §RWest Russian War§! had been an awakening. He had seen the might of the §Gmaster race§! on display as the Germans had crushed the §RWest Russian Revolutionary Front§!. §GVagner§! knew he held that same strength within himself, as did the men around him. They were the first of many to realize that §GAryanism§! is not physical, but psychological. In the woods outside of §RPerm§! these men pledged to destroy the §RSlavic§! tyrants that had oppressed the §GÜbermensch§! of the east for so long. §xVagner§! proclaimed himself the §xFyurer§! of the §xAryan Brotherhood§!, and §RRussia's§! nightmare was born.\n\nWord of the §xBrotherhood's§! doctrine spread quickly, and before long §xVagner's§! following had grown into the thousands, bolstered by men seeking everything from redemption to safety to copious amounts of violence, all of which the §xBrotherhood§! offered. Sensing that the time had come to begin his crusade, the §xFyurer§! and his army stormed into §RPerm§!, slaughtering the §RSlavic§! warlords that had ruled the city and declaring the birth of a new §GAryan§! civilization that would liberate the §GÜbermensch§! in the east just as §GGermany§! had done in the west. The first step was to purify the newly christened §GPermhaym§!, killing or enslaving the §RUntermensch§! that still lived within the city.\n\nSince capturing §GPermhaym§! the §xBrotherhood§! has continued to pillage western §RRussia§!, scouring the east for loot, slaves, and the rare §GAryans§! hidden among the §RSlavic§! masses, waiting to be uplifted by their more enlightened brothers. To the §Rsubhuman§! warlords of the region the §xBrotherhood§! is a band of savages led by a madman. The §xFyurer§! knows better. He shall lead the §GÜbermensch§! in the last conquest of the east, finally purging the §RSlavic§! corruption from §RRussia's§! soil and securing the destiny of the §GAryan§! race once and for all.\n\n§G==Features==§!\n\n*Indoctrinate worthy Russians into §GAryanism§! to ensure the rule of the §Gmaster race§!.\n\n*Decide the future of the §GAryan§! race as either warriors or masters.\n\n*Codify the definition of §GAryanism§! and decide who is worthy of the title §GÜbermensch§!."

 COUNTRY_INFO_TYUMEN: "§G==WEST SIBERIAN PEOPLE'S REPUBLIC==§!\n\nWhen §RNikolai Bukharin§! ascended to the seat of Chairman in the old Union, he set about curtailing the influence of radical politicians. It was during the turbulent 1940s that §xLazar Kaganovich§! was reassigned to the §xUrals§!, an isolated post coveted by none. When the §GSoviet Union§! was destroyed by the §Rfascist invader§!, the true adherents of Communism fled to §xWestern Siberia§!, where §xComrade Kaganovich§! had organized the §xWest Siberian People's Republic§!. However, years of backstabbing and political indecisiveness have taken their toll, culminating in the §Rcollapse§! of the Republic into multiple splinter states.\n\nLed by §xLazar Kaganovich§! and §xNikita Khrushchev§!, the leaders of §GTyumen§! do not adhere to §Rorthodox communism§! - the failures of Bukharin's regime have taught them that the only effective forces in this world are those of §xiron and blood§!. §GMarshal Ivan Konev§! commands a respectable infantry and armored core, supplemented by Tyumen's well-trained militias. However, the Republic's greatest strength may lie in its goal of total industrialization through the so-called §G"5-Year Plans"§!, a §Rradical and potentially hazardous§! alternative to the NEP.\n\nThe steel city of §GTyumen§! stands alone against the §Rultratnationalists in Omsk§! and the §Rtreacherous 3rd Army in Sverdlovsk§!. However, in the darkest halls of the underground, a grand plot is brewing - one that may yet see the Union recover from four decades of humiliation. Far beneath the earth, an army bids its time - a million soldiers, workers, opponents of the old regime. It is only a matter of time until the mortal battle for Russia begins - and while the petty warlords hide from terror bombings, Tyumen gears for war. Its people have an iron will - they are well aware of their predicament: they will either §Greanimate the Soviet Union§!, crush the rebels that infest the Motherland, undo Bukharin's fatal mistakes - §Ror die trying§!.\n\n§G==FEATURES==§!\n\n*Rally the last of the Bolsheviks against the rest of Russia, driven by an ideology that never was.\n\n*Industrialize Siberia with the help of the 5 Year Plans while managing the agricultural and urban sectors.\n\n*Consolidate power to prepare for the Great Patriotic War against Germany."

 COUNTRY_INFO_SVERDLOVSK: "§G==THE URAL MILITARY DISTRICT==§!\n\nAs the §RGreat Patriotic War§! was lost and the §GUnion§! collapsed, the valiant soldiers of the §GSoviet 3rd Army§! fled to the Urals to regroup. There, they found an ally of circumstance in the irrelevant apparatchik §RLazar Moiseyevich Kaganovich§!, who proclaimed the West Siberian People's Republic with their support. As the terror bombing began and the Republic spiralled into disarray, the 3rd Army's leader took it upon himself to protect the Russian people from all manner of tyranny. That man was §GMarshal Konstantin Konstantinovich Rokossovsky§!, who rallied his forces and proclaimed a provisional government in the city of §GSverdlovsk§!.\n\nSverdlovsk lacks any defining ideological characteristics; instead it remains a fairly benevolent military dictatorship ruled by §GRokossovsky§! and his officer comrades. The military is a formidable force. Commanded by §GPavel Ivanovich Batov§!, it consists of the 3rd Army and a significant number of auxiliary units raised from the population of Sverdlovsk. It also employs some of the most skilled generals in all of Russia. Control of the city of Sverdlovsk provides the District with access to a sizable industrial base, which in turn has created a stable and relatively higher quality of life than most other warlords.\n\nDespite all of this, Sverdlovsk's internal situation is shaky. A great deal of the citizenry is at least sympathetic to §RTyumen§!, having only defected involuntarily when 3rd Army garrisons turned up on their doorstep. As a result, spies and saboteurs owing allegiance to §RKaganovich§! run rampant. Desertions are a consistent problem. The military - much of which has been conscripted - faces a similar problem with the added threat of §RBlack League§! infiltration.\n\nExternally, the situation is just as perilous. To the south, §RTyumen§! plots the return of the West Siberian People's Republic and the black city of §ROmsk§! stirs in preparation for the coming conflict. In the north, the motivations of the bandit state of §RYugra§! and the §RNKVD holdouts in Vorkuta§! are unknown, but for now they pose little threat. Sverdlovsk's trusted allies to the northeast, the §GFree Aviators§!, stand with the Marshal, and the merchant republic of §GZlatoust§! is always willing to do business with the 3rd Army - for a price, of course.\n\n§GRokossovsky§! grows older and weaker by the day, yet his resolve remains unshakeable. He is certain that, even if he does not complete his mission, his comrades in arms will. History will judge whether or not the old Marshal is right.\n\n§G==FEATURES==§!\n\nPurge the Red Army of §Runsavoury elements§! or face the consequences.\n\nContinue the military government or establish a semi-functional democracy.\n\nServe the people of Russia and reunite the fractured Motherland!."

 COUNTRY_INFO_OMSK: "§G==THE SIBERIAN BLACK LEAGUE==§!\n\nThe brightest flame had been flushed out by the darkest night, until all who remained were the children, a misguided flock clinging to §Rdead ideologies and false hopes§!. Their plans foiled each other, until the successor slew itself - and out of its corpse, the §xBlack League§! was born. The Russian people had forfeited their chance at prosperity, now thrown into a pit by the §RTeutonic Aggressor§!, doomed to witness generations waste away until justice be restored. The future is dead - but within the citadel city of §xOmsk§! burns a flicker of hope. Hope that one day the Russian people will climb out of the grave and into the light.\n\nThe §RGreat Trial§! approaches, but everybody else is blind to it - foretold by §xDmitry Karbyshev§!, whose dying eyes now gaze upon a monster birthed from the darkest night. The officers of the §xBlack League§!, led by §xDmitry Yazov§!, rally for the last battle that will determine the fate of the world. When the sun sets, men speak in hushed tones across Siberia, telling of a black spot on the map from which emerge ominous clouds, masking the movements of soldiers without lines, conditioned to ruthlessly execute anyone who stands in the way of §GNational Reclamation§!.\n\nIndeed, the philosophy of the §xLeague§! preaches §GNational Survival§! - the Russian people must be prepared for anything, be it the inevitable §RGreat Trial§! or a §Rnuclear apocalypse§!. Unbeknownst to many, however, the §xNew Guard§! of §GOmsk§! spiral further and further from Karbyshev's ideals. Within their iron hearts burns a passion for revenge on an unsurpassed scale. If the §xBlack League§! is to remain stable, it must fuel the pyre with tales of conquest, for momentum is of the essence. The very concept of "civilian" must be stamped out until every plowshare becomes a sword, the §RGreat Trial§! does not wait.\n\nOmsk is a city surrounded by enemies: communists in §RTyumen, the renegade Red Army in Sverdlovsk, not to mention the various warlords around old Russia§!. Will the §xBlack League§! crash and burn like its predecessor? Or will the night grow darker?\n\n§G==FEATURES==§!\n\n*Manage squabbling cliques of officers while fending off attacks from all sides and preparing to reunite all of Russia.\n\n*Reshape the very psyche of the Russian population to be prepared for total war.\n\n*The §RGreat Trial§! awaits!"

 COUNTRY_INFO_ZLATOUST: "§G==THE REPUBLIC OF ZLATOUST==§!\n\nThe old Soviet Union never liked good businessmen. Too much guile, too much ingenuity, too many resources, too little of the §Rslavish obedience§! craved by the government. Consequently, the opportunities for truly capable men to excel and reach beyond were nonexistent, at least, not until §Reverything fell apart§!. For millions of people, the §RGerman invasion§! was the greatest calamity possible. For §GYevgeny Dragunov§!, Russia's most gifted gunsmith, the collapse of the Soviet Union was the §Ggreatest of business opportunities§!.\n\nStationed in the Siberian city of §GZlatoust§!, the master armorer was sheltered comfortably from the disasters unfolding in the rest of the country. Seizing power, he turned the city into a §Gparadise§! of §Rwar profiteering§!. Legions of petty warlords desired the modern weapons produced by his genius, and §GDragunov§! was all too eager to satisfy their wishes. §GZlatoust§! stood as an §Goasis of peace and prosperity§! in §xWest Siberia§!, that wealth built off of §Rthe spoils of others' wars§!. Only the §RWest Siberian People's Republic§!, led by the same §RBolshevik§! goons who denied him his fortune, stood in his way.\n\nNow that the §RWest Siberian People's Republic§! has collapsed into its own turmoil, the business outlook is §Gbetter than ever§!. His former rivals stand humbled, and there is even more demand for his weapons in order to fight an increasing number of §Rpetty territorial conflicts§!. With his partner-in-crime §GMikhail Kalashnikov§!, he continues to innovate new and superior designs, ensuring that Russia stays §Gfighting itself§! for as long as it takes for them to make the §Gprofit of a lifetime§!. While §GDragunov§! certainly wouldn't mind unification, any §Rchallenge§! to his enterprise must be §Rput down§! - even if it leaves Russia divided in the process.\n\n§GDragunov's§! rivals - dogmatic §RTyumen§!, pragmatic §RSverdlovsk§!, and fanatic §ROmsk§! - battle among themselves in an §Gouroboros of death§! that he is all too eager to feed further. But this may not last forever, and if one party gains the upper hand, it will look upon its §Ghated enemies'§! benefactor and §Gseek revenge§!. For that possibility, §GZlatoust§! must always be prepared, and §GDragunov§! will sit on a §Gdragon's treasure trove§! if he succeeds.\n\n§G==FEATURES==§!\n\n*Become the richest fiefdom in Russia off an empire of blood money.\n\n*Sway regional conflicts with your endless stream of arms.\n\n*Defend your loot from regional rivals - to the death."

 COUNTRY_INFO_TOMSK: "§G==THE CENTRAL SIBERIAN REPUBLIC==§!\n\nThe fall of the Soviet Union brought untold hardships on the people of Russia. Yet in this darkest of hours, the embers of hope could not be crushed by German militarism. In Central Siberia, so recently developed by Bukharin's industrial ambitions, a new democratic Russian state was born: §xthe Central Siberian Republic§!. Led by the Poet-President §xBoris Pasternak§!, the new nation set out to build itself up as the basis of a new Russian Democracy, a heir to the one killed in 1918 by Lenin and his Bolsheviks.\n\nThis dream rapidly turned to a nightmare. Landlocked and unable to trade with the rest of the world, the Central Siberian economy struggled to adjust. Separatist sentiment in Barnaul, breadbasket of the Republic, brought instability and food riots throughout the nation. Sensing weakness, §RGenrikh Yagoda's§! §RFar Eastern Soviet Socialist Republic§! launched an invasion of the §xCentral Siberian Republic§!, no doubt lured by the industrial wealth left over from Bukharin's Central Siberian Plan. The war was the spark that set off a chain reaction of disasters. Regional military leaders in §RNovosibirsk§! seceded, citing the central government's inability to win the war and end the bloodshed. In the east, §Ranarchist§! rebels seceded from the failing Republic. An attempt to recapture the area by General Krylov led to further defeats after the betrayal of colonel §RAndreev§! and the loss of §RKrasnoyarsk§!. Broken, Krylov retreated to §RKemerovo§! where in a bout of insanity the fallen general declared himself the reincarnation of long dead king §RRurik§!.\n\nThrough all this the people in and around §xTomsk§! maintained their loyalty to the central government. President §xPasternak§! suspended elections after the fall of §RKrasnoyarsk§! and declared a provisional government to stabilize the failing Republic. Through all this, §xPasternak§! and his advisors worked long hours to stabilize the food situation and ensure some semblance of normal life could return to the capital. Even being diagnosed with cancer has not stopped President §xPasternak§! from his herculean struggle to prevent the collapse of the Republic.\n\nDespite §xPasternak's§! popularity, the people of §xTomsk§! can see the §xProvisional Government§! is only able to manage the Republic's decline instead of turning things around. All hope is not lost, however, as the Poet President has begun work on new foundations for the Republic. Believing that distance from the people and failure to mobilize the masses into supporting the nation has doomed the old §xCentral Siberian Republic§!, §xPasternak§! has begun drafting a new constitution, one that would allow the Republic to tap into the vast pool of intellectuals, artists and scientists in §xTomsk§!. The Siberian Athens, blessed with schools, universities and salons, shall rely upon its four greatest political associations in order to achieve its revival: the conservative §xDecembrists§!, led by Russian medievalist §GDmitry Likhachyov§!; the centralizing industrialists of the §xBastillard§! salon and their leader, avant-garde poet §GDaniil Kharms§!; composer §GDmitry Shostakovich's§! utopian socialists of the §xHumanist Society§!; and the liberal technocrats of §GAndrey Sakharov's§! §xModernist§! salon.\n\nCitizens, the Republic is at a crossroad! Only through experimentation, courage and dedication can the §xCentral Siberian Republic§! phoenix rise from its ashes!\n\n§G==FEATURES==§!\n\n*Make use of Tomsk's unique rotating constitution to rebuild the §xCentral Siberian Republic§!.\n\n*Explore four unique ideologies as the Siberian Athens attempts to build a better Republic.\n\n*Defeat separatists and traitors to unify Central Siberia and reclaim Bukharin's Industrial Plan."

 COUNTRY_INFO_KEMEROVO: "§G==THE PRINCIPALITY OF KEMEROVO==§!\n\nIt is no surprise that the many defeats suffered by Russia have broken the spirit of her people. Siberia is filled with §Rnationalist warlords, Red Army remnants, fascists§!... and §xKemerovo§!. Originally a part of the §RCentral Siberian Republic§!, the §RSiberian Wars§! saw any semblance of order crumble. And when proud men raised their own flags over the cities, declaring independence from the central government, §xMajor General Nikolai Ivanovich Krylov§! secured a fiefdom for his cause.\n\nThe Kingdom of Siberia follows an odd doctrine of maintaining certain socialist elements, such as labor unions, but mixes them with ancient aesthetics and a market economy. Indeed, §GGeneral Krylov§! now styles himself as §xRurik II§!, in honor of the viking who had founded the old state of Novgorod. His followers are mystified as to whether the cruelty of Russia has finally broken the man's sanity, or if the entire act is a desperate gamble to gain public support.\n\nTo the outside observer, the §xPrincipality§! appears erratic, without clear cause and an unachievable mission: the revival of the old Russian Empire. However, §xTsar Rurik II's§! actions are carefully guided by his two children: §xCrown Prince Yuriy§! and §xPrincess Lydia§!. The former has gained a positive reputation with the peasants as a reformer and populist, while Lydia is becoming popular with the military and Kingsguard. There can §Ronly be one successor§!, however, and neither child will let kin stand in the way of the §GCrown§!.\n\nIf the §xPrincipality of Kemerovo§! is to survive this age of darkness, it must carefully navigate the Siberian landscape. The §Rmutineers of Krasnoyarsk§! increase their raids every day, the §Rfalcon of Novosibirsk§! thirsts for new prey, and beyond lies the §RSiberian Black Army§! that had once defeated the King. Even at home, dissatisfied workers toil away at the remnants of the §GCentral Siberian Plan§!, but there are rumours of agitation and calls for §Rrevolution§!. §xTsar Rurik II§! must either be truly mad, or have a plan for survival.\n\n§G==FEATURES==§!\n\n*Balance court politics among the nobles and your successors.\n\n*Continue the development of Siberia with the help of the Central Siberian Plan, but beware of worker tensions.\n\n*Pick your battles carefully, as Kemerovo starts in a central and exposed location."

 COUNTRY_INFO_SBA: "§G==THE SIBERIAN BLACK ARMY==§!\n\nTo most, anarchy is a derogatory term, one that means the total collapse of society and best suits war torn nations, bursting at the seams with misery and suffering. To the §GBlack Army§! of §xCentral Siberia§!, anarchy is not a term to be spat out at a political opponent, anarchy is something to be cherished, to be embraced as the end state of the natural progression of humanity. While contrarians shout from the rafters of the failures of anarchism, the people residing within the communes care little for their opinion. The deep §Gsense of comradery and fellowship§! that has been fostered in the §xFree Territory§! over the last years can show that anarchism is the underdog ideology, seemingly impossible yet in practice, bringing prosperity to the people.\n\n§RAnarchy, of course, can be something, much, much darker.§!\n\nIf one were to ask §xGeneral Ivan Stepanov§! if he was an anarchist as he lead his division into §RYagoda's eastern rump state§!, the officer in the §RCentral Siberian Republic§! would most certainly turn you away. Not out of his commitment to Russian democracy or out of disdain for the tyranny of the §RYagoda regime§!, but out of opportunism. It was opportunism that got him transferred out of the western front. It was opportunism that got him within the highest echelons of the §RCSR.§! When §xStepanov§! looked out to his weary troops on the day of the final assault towards Irkutsk, he saw a decade of war and people yearning for peace, but more so, he saw an opportunity.\n\n§xYuri Galanskov§! was nothing more than a student when his life was ripped away from him. Growing up in Bukharin's Russia, §xYuri§! saw the failures of the state on a daily basis, but it was his father who had instilled in him the disdain for not just the §RTsar§! or the §Rfascist§!, but for the oppressive §Rstate§! in any form, in any clothes it may try to disguise itself in. Even as the §RCSR§! claimed to be the torchbearer of the people's struggle for peace, it marched it's war-torn men into war daily. §xGalanskov§! made impassioned speeches before his countrymen, calling for freedom from war and those who send men off to die in it.\n\nFate works in strange ways, in another life §xGeneral Stepanov§! would have mostly likely only seen §xYuri§! from the end of a long rifle, and yet, by pure chance, the two were able to strike a deal. §xStepanov§! would provide the §Gmilitary power§! and §xGalanskov§! would bring his §Gpopular support§! to the table. The pieces were sit and place and with a final act of rebellion, the §xFree Territory§! established itself as an independent land, far from the grip of the §Rstate§!. While the §xFree Territory§! may be equipped to deal with the external threats, §xGalanskov§! will soon find that the greatest threats are the ones that §Rcome from within§!...\n\n§G==FEATURES==§!\n\n*Decide the very fate of anarchism!\n\n*Muster a strong defense force to protect the people from the §Rstate§!!\n\n*Make §GMother Anarchy§! proud!"

 COUNTRY_INFO_NOVOSIBIRSK: "§G==THE FEDERATION OF NOVOSIBIRSK AND ALTAY==§!\n\nFrom the ashes of the Central Siberian Republic and Bukharin's industrial brainchild within it, the Siberian Plan, arises the §xFederation§!.\n\nWhen §Ranarchists, socialists§!, and, eventually, §Rinsane medievalists§! shattered the Republic, and the effete idealists in government proved unable to respond effectively, fighter ace and the Republic's former Marshal of Aviation, §xAlexander Pokryshkin§!, the 'Siberian Falcon,' took matters into his own hands. Declaring independence from the central government, he proclaimed himself President of the lands in and around Siberia's industrial capital of §xNovosibirsk§!, with §xAltay§!, which had also declared independence, joining soon after.\n\nFrom that city, §xPokryshkin§! has, in the years subsequent, established a strong foundation for his nation-state. Though his regime is fairly authoritarian, and his administration is dominated by the §Gsiloviki§!, politicians originating from the military and security services, it has provided security from the many hostile forces within the volatile region for the enormous population it encomapsses.\n\nThis security has enabled rapid economic expansion, which has in turn led to the rise of the §Gnational conglomerates§!, enormous business firms that are increasingly demonstrating their influence over the young state. Many welcome this change, eager for the wealth promised, but others decry the increasingly authoritarian centralization promoted by the firms' §Gsiloviki§! partisans.\n\nNone decry it moreso than §xVasily Shukshin§!, the Mayor of Barnaul and the second most important man in the §xFederation§!, after only §xPokryshkin§! himself. Extremely popular with the common people, he promises to be a thorn in the side of any attempt to further restrict freedoms in the pursuit of the industrialist or §Gsiloviki§! agendas.\n\nAnd besides such internal challenges, many external ones exist as well. §xNovosibirsk§! is a prize that all within Siberia would, and will, kill to acquire. If the §xFederation§! is to survive the coming storm, its leadership must leverage the advantages of location, industry, and population with which it has been blessed - or §Rrisk becoming little more than a province within another nation.§!\n\n§G==FEATURES==§!\n\n*Manage the Federation's industrial conglomerates and their influence within the nation.\n\n*Expand the economic and political base of the Federation, while managing tensions along various fronts.\n\n*Develop experimental, yet powerful, military machines through unique research and design mechanics."

 COUNTRY_INFO_PRC: "§G==THE PEOPLE'S REVOLUTIONARY COUNCIL==§!\n\nIn the wake of the West Russian War and the West Russian Revolutionary Front's collapse, Aleksandr Vasilevsky organized the retreat from the Mozhaisk Line. After this defeat Vasilevsky took up the task ensuring the Red Army would survive, no matter what. Gathering all the men that would follow him, Vasilevsky set out to regroup on the Mongolian steppe where the Luftwaffe could not reach them. There Vasilevsky hoped to regroup on the steppe, pushing out from the East to the West. His aim was to avoid the food scarcity and bombing that those who went north with Voroshilov suffer now. Unfortunately, the Imperial Japanese Army was advancing upon these lands already.\n\nWith their collaborators, the Japanese Imperialists would claim all of Mongolia. Would the Red Army abandon the Mongolian people to exploitation and deprivation? Could Vasilevsky rejoin with his brethren in the WRRF if he did so? An uneasy alliance was made with the remnants of the Mongolian Army, the Mongolian and Tuvan people. All would be treated equal by the Red Army, but the Red Army would have primacy over all else. This was the era of warlords and there could be no other compromise in this regard.\n\nAt first the bond of mutual destruction by Imperialists, a mad king, a rogue army, and the madman exploiting Bukharin's legitimacy for his paranoid insanity kept the Revolutionary Council united in purpose. Tensions mount as opportunities now arise to end this period of stagnation. Therefore, the Revolutionary Council has its attention drawn in two directions. The Russians, made up entirely of Red Army veterans, wish to return to their homeland and restore the Soviet order upon the warlords. The Mongolians, who hold solidarity with the Tuvans, desire to push against the puppets of the Sphere. They sense weakness now that Mengjiang is torn apart in open rebellion and see this as the perfect opportunity to unite the nation. If Vasilevsky is to keep the Council whole he must navigate the desires of both groups.\n\nIt will be no easy task. The Russians and Mongolians are both proud peoples. And they have every right to be, for we are unconquered. We are unconquerable! Let us proceed forward, as not a collection of separate peoples, but as a Soviet people!§!\n\n§G==FEATURES==§!\n\n*Maintain the interests of the Russian, Mongolian, and Tuvan people. Favor a slow approach or rapid conquest?\n\n*With the legacy of Bukharin's Siberian plan and some of the architects of it, rebuild industry to equip the Red Army with modern weaponry.\n\n*When and how should the Army become subordinate to the citizens of the Council? Should it at all until Russia is made whole once again?"

 COUNTRY_INFO_AMUR: "§G==THE ALL-RUSSIAN GOVERNMENT OF THE AMUR==§!\n\nWhen the perfidious Soviet Union collapsed under the stresses of German Invasion and the inherent weakness of the communist system, the Russian Fascist Party and her Japanese benefactors, long in exile in the Manchurian city of Harbin, were afforded an opportunity to take back Russia. §GKonstantin Rodzaevsky§!, Vozhd of the §xAll-Russian Government§!, took it upon himself to begin reclamation efforts in an attempt to seize Russia and save her from the depravities of Bolshevism.\n\nPlunging into the Russian Far East, the RFP and her allies in the old White Movement made it as far as the city of Chita, before their offensive was stunted. As the advance slowed, cracks began to show between the Tsarists and the fascists, and soon the Whites under §RAtaman Semyonov§! seized the city of Chita and officially distanced themselves from the party. If the Vozhd was surprised at this turn of events, he was enraged when former party member §RMikhail Matkovsky§! split the party and set up a rival government in the remote port of §xMagadan§!, posing a threat to the Vozhd's legitimacy and rule.\n\nSince then, based in the small town of Zeya, the Vozhd has become dejected and increasingly paranoid. His closest advisors, §xGeorgy Shekerev§! and §xAlexaner Bolotov§!, the head of the party's paramilitary Blackshirts and the security minister respectively, have indulged his paranoia, bringing the Vozhd lists of internal party members who are dissenters and troublesome figures within the regime.\n\nThe Vozhd plans on creating a strong Russia based in national socialism, where the Vozhd is paramount and his system, derived from the Germans, is law. However, to do this, he will need to cleanse the party of the people responsible for its failures. The Vozhd's immediate internal and external threats need to be dealt with before he can focus on ending the Bolshevik remnants to the West. To the north, Mikhail Matkovsky's so-called §RFree State of Magadan§! taunts the Vozhd's every waking hour, while to the west, based in Chita, the farcical §RTransbaikal Principality§! represents the remnants of the traitorous Whites. Both will need to be dealt with and their leadership annihilated before the Vozhd and his party can focus on the true threat in the Far East: §RGenrikh Yagoda's§! §RPresidium of the Supreme Soviet§! and their anarchistic mutineers based in §RBuryatia§!. None shall stand in §GKonstantin Rodzaevsky's§! path. §xFor God, Nation, and Labor!§!\n\n§G==FEATURES==§!\n\n*Purge the §Rrot§! from the Russian Fascist Party.\n\n*End the §RSplitters§! and defeat the §RBolsheviks§!, securing the Vozhd's position of power.\n\n*Reforge a §GNational Russian State§! in the image of the Vozhd."

 COUNTRY_INFO_MAGADAN: "§G==THE FREE STATE OF MAGADAN==§!\n\nOnce §GMikhail Matkovsky§! was an enthusiastic member of the §xRussian Fascist Party§!. Within the exiled community of §xHarbin§!, few still held any reverence for the old guards of the White movement, the old men that had lost Russia to the hands of the §RReds§!. Fascism, a modern ideology, a rejection of decadent liberalism and unnatural socialism, seemed to §GMatkovsky§! the way forward. Russia would be made strong. Once the §RSoviet Union§! Inevitably crumbled, the true heirs of Harbin would come forth from Japanese Manchuria and begin the great crusade to liberate Russia.\n\n§RKonstantin Rodzaevsky§! brought doubt to §GMatkovsky's§! mind. The so-called Vozhd of the §xRussian Fascist Party§! was an amoral brute. His associates; jumped-up thugs, men of no caliber, the refuse of the Russian community in Harbin. When Germany invaded Russia, brutalizing its people, the RFP's leader wrote sycophantic letters of praise to the men who despoiled Russia. No, §RRodzaevsky§! could not be trusted to save Russia. And so §GMatkovsky§! began to plot. With the help of §gNikolay Petlin§!, a man known in Harbin for his ties to the Russo-American community, §GMatkovsky§! waited.\n\nThe opportunity of a lifetime came in the late fifties. §RYagoda§!'s pathetic Soviet remnants launched a futile war to conquer the §xCentral Siberian Republic§!. The strain of fighting broke down both nations, letting the White community in Harbin free to strike. The invasion broke the back of §RYagoda's§! state, liberating Chita, Amur and Magadan. In this moment of triumph for the RFP, §GMatkovsky§! enacted his plan. The port city of Magadan was seized, along with a great deal of the RFP's invasion force. §RRodzevsky's§! thugs were pushed back to §RAmur§!, deprived of the critical port of §GMagadan§!.\n\nIn §GMagadan§! the true leader of the §GRussian Fascist Party§! Awaits. There is much work to be done. The remaining §RRodzaevsky§! loyalists must be purged. Foreign contacts must be reached, and critical supplies of weapons and mercenaries must be brought in. §GMatkovsky§!'s path ahead remains long and hard. Nevertheless he presses on. Only he has the strength to save §xRussia§! from its anarchy.\n\n§G==FEATURES==§!\n\n*Appeal to America's White émigré community to garner support and ensure Matkovsky's success.\n\n*Deal with the Mad Vozhd in Amur and the decrepit White Junta in Chita to unite the Far East against Bolshevism.\n\n*Begin the reunification of Russia under the true Vozhd."

 COUNTRY_INFO_BURYATIA: "§G==THE BURYAT AUTONOMOUS SOVIET SOCIALIST REPUBLIC==§!\n\nOn December 30th, 1922, the Treaty on the Creation of the USSR established the Soviet Union. Most Russians would say the Soviet Union was destroyed in 1942, when the Union shattered after the §RNazis§! reached the A-A line. §RYagoda§! and his §RPresidium§! claim the Soviet Union was never destroyed, and is still being legitimately governed from Irkutsk. But §xValery Sablin§! knows that the Soviet Union was truly destroyed in 1924, when §yNikolai Bukharin§! Won the power struggle to succeed Lenin and began dismantling everything that Lenin had stood for.\n\n§xSablin§! didn't always think this way. He used to be a dutiful commissar in Yagoda's army. He'd served valiantly in the §yCentral Siberian War§!, despite constant §RNKVD§! interference in his unit. He was a lifelong believer in the ideals of Lenin, and for most of his life he believed that §RYagoda§! and his §RPresidium§! upheld them. But as the years dragged on and the §RNKVD§! tightened their grip on the Soviet state, §xSablin§! began to doubt he was truly fighting for the liberation of the proletariat after all. He was not alone. He soon began to meet others who questioned §RYagoda§! and his growing §Rsecurocracy§!. He met §GBuryats§! who felt their culture was being destroyed by assimilationist policies, §GBukharinites§! who felt that an §RNKVD securocracy§! was antithetical to §yBukharin's§! Union, and he met §Gwomen§! who felt that their equal share of the socialist society was refused to them because of their sex. He united these and other disparate groups together to launch a §GRevolution§! against §RYagoda§!, seizing control of §xBuryatia§! in the process. Alongside §xMikhail Markheev§!, Buryat commander of the army, §xOtto Braun§!, German communist and veteran of Mao's communist uprising in China, §xMaya Ulanovskaya§!, Russian-Jewish dissident and political activist and his right-hand woman §xSusana Pechuro§!, dissident and survivor of the Gulag, he prepares to end §RYagoda's§! tyranny once and for all.\n\nYet, after the §GRevolution§!, what next? §xSablin§! is completely committed to liberating the Union and bringing freedom and equality to all Russians. §xSablin§! has also never governed a polity. The §RBukharinite§! wing of his movement will still be strong after §RIrkutsk§! is reclaimed. §xSablin§! will have to make difficult choices between §GLeninist§! idealism and §RBukharinite§! pragmatism. But for now, all he has to do is end §RYagoda's§! tyranny. After that, the restoration of the §GUnion of Soviet Socialist Republics§! will commence.\n\n§G==FEATURES==§!\n\n*Defeat §RGenrikh Yagoda§! and end his tyrannical grip over the Soviet state.\n\n*Implement §GLenin's§! vision of a free and equal Soviet Union, or give in to the §RBukharinite§! dictatorial temptation.\n\n*Free the Far East from the §Rfascists§! and §Rbandits§! and liberate the §GUnion of Soviet Socialist Republics§!!"

 COUNTRY_INFO_IRKUTSK: "§G==THE PRESIDIUM OF THE SUPREME SOVIET==§!\n\nOn December 30th, 1922, the Treaty on the Creation of the USSR established the Soviet Union. It was initially composed of the Russian, Ukrainian, Byelorussian, and Transcaucasian republics. As of January 1st, 1962, due to technical difficulties, the Soviet Union only governs the §xIrkutsk§! Oblast.\n\nWhen Moscow fell to the §RNazi§! invasion, General-Secretary §wNikolai Bukharin§! disappeared. The §xPresidium of the Supreme Soviet§! quickly elected §GNKVD§! Director §xGenrikh Yagoda§! as their provisional leader. The wise §xYagoda§! wasted no time in saving the Presidium. In a daring escape, his §GNKVD§! motorized divisions managed to spirit the Soviet government away to the East across old Siberian Plan infrastructure to the city of §xIrkutsk§!. Upon arrival, the §xPresidium§! tried to reassert control over the old Union, but few believed the old Bukharin government was relevant in the new Russia. The government began to lose their grip on the Far-East as military §Rstrongmen§!, native Siberian §Rreactionaries§!, and §rfascist§! collaborator "§RHeirs of Harbin§!" carved out their own slice of the Far-East for themselves. The latest blow to the Soviet state is the insurrection of §RValery Sablin§! in Buryatia. Formerly a loyal soldier, §RSablin§! has shown his true colors as a §Rutopian left-deviationist ultra§! seeking to remake the §GSoviet Union§! in his naive and puerile image.\n\nThis decline is, in the eyes of §xGeneral-Secretary Yagoda§!, directly attributable to the incompetence of the §xPresidium§!. Their beloved §wBukharin§! failed the Soviet Union and his toadies are repeating all of his mistakes. §xYagoda§! has thus begun empowering his loyal §GNKVD§! ever since the evacuation. While previously a secret police service, the §GNKVD§! has assumed more and more functions of the Soviet §GState§! over time. §xYagoda's§! §Rdetractors§! in the Party, often referred to as §Rthe Party faction§! and led by §RSergey Bessonov§!, allege that §xYagoda§! Is dismantling the Soviet proletarian bureaucracy to replace it with an §GNKVD securocracy§!. If that is true, then it is only because the §GNKVD§! are the last, loyal force that can save the §GRevolution§! from its §Renemies§! within and without.\n\nThe §xIrkutsk government§! is the legitimate government of the §GUnion of Soviet Socialist Republics§!, even if no one else seems to care. If §xYagoda§! and the §xPresidium§! can overcome the §RSablinite mutiny§! and restore order across the Far-East and beyond, then perhaps Soviet Russia will one day return to §Gthe way it was§!.\n\n§G==FEATURES==§!\n\n*Defeat §RValery Sablin§! and his treacherous mutineers.\n\n*Manage the balance of power between §xYagoda's State§! and the §xParty faction§!.\n\n*Rebuild the §GSoviet economy§! and establish a §GSocialist International§!\n\n*Restore the §GUnion of Soviet Socialist Republics§! as its legitimate government!"

 COUNTRY_INFO_CHITA: "§G==THE TRANSBAIKAL PRINCIPALITY==§!\n\nThe §RSoviet Union§! and her successor states have buckled under the weight of §xmilitary setbacks§! and §xinternal disputes§! alike, and the once-proud nation of §xRussia§! now lies in a thousand broken pieces. In the midst of these dark times, old wounds left over from the §RBolsheviks'§! violent struggle for power have surfaced once again, and the §GWhite Army§! exiles of Harbin have returned to §xRussia§! to continue their struggle.\n\nThe §GWhite Army§! represents the remnants of the forces who opposed the §RRed Army§! during the §RRussian Civil War§!. During the height of the §Rcivil war§!, §GAtaman Grigory Semyonov§! rallied the §GTransbaikal Cossack Host§! and fought alongside §GAleksandr Kolchak's§! provisional government in the §xRussian Far East§!. After several years of brutal §Rguerilla warfare§!, however, §GAtaman Semyonov§! was eventually §Rdefeated§! and forced to flee the country with his army in tow.\n\nThe Ataman, along with thousands of other Russian émigrés fleeing the Bolshevik regime, settled in the Manchurian city of Harbin. Here, the remnants of the White Army plotted and prepared for the eventual day they would triumphantly cross the §xAmur§! and continue the fight against §Rcommunism§! once again. As years went on, their dream seemed to slip further out of reach, but with the miraculous §Gcollapse§! of the §RSoviet Union§!, their chance finally came.\n\nNow, the remnants of the §GWhite Army§! and the §GTransbaikal Cossack Host§! find themselves based in their old stronghold of §GChita§!. Nominally, the statelet is ruled by §GMikhail II§!, also known as §GMichael Andreevich Romanov§!. Invited to §xHarbin§! under the pretense of a §xformal banquet§!, he instead found himself roped into a §xdaring scheme§! by the old §GWhites§! to place a §GRomanov§! on the throne of §xRussia§!, despite his §Rlack of a claim§!. Nowadays §GMikhail II§! is nothing more than a §xpuppet§!, with §GGrigory Semyonov§! and his second-in-command §GBoris Shepunov§! holding the true reins of power. The §GTsar§!, despite being the new face of the §GWhite movement§!, has little desire to remain in §xRussia§!, and hopes that one day he'll be able to go home again. Trapped in a foreign land far from home, Mikhail's situation seems hopeless indeed...\n\nThe situation in the region is far from secure. To the east lie the forces of the §RRussian Fascist Party§!. Formed by fellow §xémigrés§! from §xHarbin§!, they too claim the legacy of the §GWhite movement§!, albeit with a much more §Rextreme flavor§!. The §RFascists§! are currently §xdivided§! between the forces of the fearsome §RKonstantin Rodzaevsky§! and his former ally §RMikhail Matkovsky§!. The §RFascists§! must eventually be crushed in order for the §GWhites§! to prove themselves as the true heirs of §xHarbin§!. To the west, the remnants of the §RSoviet Union's§! presidium led by §RGenrikh Yagoda§! grapple with a §Rmutiny§! in the province of §xBuryatia§!. The mutineers, guided by a young §RNKVD§! officer known as §RValery Sablin§!, seek to overthrow §RYagoda's regime§!. The squabbles of the §RBolsheviks§! may yet buy the §GWhite Army§! time to prepare for the long awaited conflict against what remains of the §RSoviet Union§!. To the north, various petty §Rwarlord armies§! command §Rfiefdoms§! of their own, but pose little threat beyond the §Roccasional raid§!. Should the time come for military action, rooting these §Rwarlords§! out would not be a complicated affair.\n\nThe task that lies before the §GWhite Army§! is great indeed. From this frozen stronghold, they seek to continue the §Rconflict§! that began so long ago and restore the long lost §Gmonarchy§!. The §GAtaman§! grows old, and it is unclear what kind of direction his §Gmovement§! would take in his absence...\n\n§G==FEATURES==§!\n\n*§GUnite§! the Far East and prove yourself to be the true heir of §xHarbin.§!\n\n*§GStrengthen§! the §GWhite movement§! and liberate §xRussia§! from §RBolshevism.§!\n\n*Be §xwary§! of the puppet Tsar's §Rintentions.§!"

 COUNTRY_INFO_URAL: "§G==THE URAL LEAGUE==§!\n\nIn the chaos of post-war Russia, there are many villains and few heroes. Nowhere is this split more apparent than in the Urals, where the soldiers of the §xUral League§! face off against the mad scientists of §RMagnitogorsk§! and the horrific bandits of the §RDirlewanger Brigade§!.\n\nThe warriors of the §xUral League§! were once mere prisoners and guards, locked in the Siberian wasteland of Vorkuta and left to rot. When the §RGermans§! invaded, however, all differences had to be thrown aside. Bound together by the influence of §xFather Janis Mendriks§! and the knowledge that, if neither worked with the other, all would perish, the guards and prisoners embarked on a long trek southwards, leaving only the worst of their ranks behind. Through the mountains they went, fighting off §Renemy§! after §Renemy§! as their numbers dwindled, finally settling down at the southern edge of the Urals, where they swore to protect the good and the innocent in the region.\n\nThe §xUral Guard§! has only hardened since that time, as the situation in the §xSouthern Urals§! has deteriorated greatly since their arrival. To the south, §RDirlewanger's Brigade§! wreaks havoc through the undefended souls of the area, raping, looting, and killing as they please. To the east, the §RBlack Mountain§! churns smoke as thousands flee from the experiments of §RTrofim Lysenko§! and the §RNKVD§!. To the west, the §GOrenburg Communes§! stand immobile, paralyzed by the constant bickering of their bloated system and unable to defend themselves.\n\nThe goals of the §xUral Guard§! are still the same as they were when they arrived, and it's certain that they'll give their all in attempting to fulfill it. Whether they'll succeed, however, is a question that is yet unresolved.\n\n§G==FEATURES==§!\n\n*Defend your §xallies§! in the Orenburg Communes from the menace of Dirlewanger's Brigade and Magnitogorsk.\n\n*Choose between quality and quantity as you §xbuild§! your army for the coming war.\n\n*§xProtect§! the poor and damned throughout the Russian wastes from the myriad of bandits and thieves."

 COUNTRY_INFO_ORENBURG: "§G==ORENBURG==§!\n\nAmongst the vast Russian anarchy lies a secluded haven of stability: §xOrenburg.§! Existing as a neutral ground for the surrounding peasant villages, the city emerged as the de facto authority of the surrounding region following the collapse of the §GOld Soviet Union§!. §xOrenburg§! is a beacon of hope to the people of Russia in these dark and tumultuous times.\n\nPeasants and refugees are drawn to §xOrenburg§! like moths to a flame. Passing through the §GUral League§!, they bring with them stories, hungry mouths, and tired souls. So many make the long exodus to the promised land of the Southern Urals, giving everything for the chance at a better life, and so many are disappointed.\n\n§xOrenburg§! is bordered by the §GUral League§!, a militia dedicated to the protection of the people, and the §RDirlewanger Brigade§!, a bandit kingdom ruled by §RGerman§! fascists that never stopped their pillage. Beyond either of those lies §RMagnitogorsk, the Black Mountain§!, rumored to rest in the iron grip of a mad scientist and his §RNKVD§! minions.\n\nDecimated by the past war and constant §RGerman§! bombing runs, the economy of §xOrenburg§! grinds and struggles. Few major industrial centers exist and most of the population is employed on farms or in cottage industries. Even if the skies weren't filled with bombers, the §xOrenburg Worker's State§! lacks the organization and will to industrialize the region.\n\nDespite the legends, §xOrenburg§! is disorganized and fragile. The §xWorker's Council§! is consumed by indecision, infighting, and bureaucracy. The village communes it represents are fiercely independent and oppose any efforts to centralize the region into something resembling a functioning government. If §xOrenburg§! is to survive, it must adapt.\n\nNot all agree with the §xWorker's Council§!, however. Calls for reform grow by the day and proponents of progress have organized around two very different men, united in their desire for progress, but opposed in nearly everything else. §xAleksander Burba§! imagines a technocratic republic that can carry §xOrenburg§! into the modern world, while his opponent §xGeorgy Malenkov§! rallies around an older, more soviet style of governance.\n\nA bright future lies before §xOrenburg§!, and the Urals as a whole, but only if she is strong enough to seize it...\n\n§G==FEATURES==§!\n\n*Carefully manage political infighting in an effort to save the §xCouncil§! from destruction.\n\n*§xConfront§! bandits and mad scientists in a battle for the future of the Southern Urals.\n\n* Lead §xOrenburg§! into the modern age, or collapse into obscurity."

 COUNTRY_INFO_LYSENKO: "§G==MAGNITOGORSK==§!\n\nThe town of §xMagnitogorsk§! was a boom-town, built up throughout the 19th and early 20th centuries to mine and process the incredibly rich iron deposits within Mount Magnitnaya. When the Second World War ended, the steel mills closed and the mountain lay dormant. But §xDoctor Trofim Lysenko§! and the §x22nd NKVD Motor Rifle Division§! arrived, transforming the former network of mines into a base of operations where few entered and even fewer returned. The locals soon gave Mount Magnitnaya a new name more befitting of its ominous reputation: §xthe Black Mountain§!.\n\nFar beneath the mountain's surface, §xTrofim Lysenko§! continues the "scientific" work that he started more than three decades prior. He has rejected the concepts of Mendelian genetics and Darwinian evolution, considering them to be classist lies that falsely apply the capitalist theory of competition to nature. In reality, Mother Nature is a socialist and all things trend toward cooperation. Any rational scientist would call his theories Lamarckian pseudoscience, but they have long since been forced out of academia or purged from his clique of technocrats.\n\nPushed by the stress of his experienced, §xLysenko§! has realized that there is no boundary worth respecting when the future of socialism is on the line, and he has broken one of his few taboos: human experimentation. He has become desperate to apply his theories in the creation of a "New Soviet Man," something that the unfortunate residents of §xMagnitogorsk§! have learned firsthand.\n\nThose who aid in the kidnapping of test subjects are the §xNKVD§!, led by §xStepan Bunkov§!. Their path first crossed with the mad scientist's in the closing days of the Second World War, when they were charged with evacuating him and his research well behind the front lines. But when all order broke down, they were forced to cooperate and survive. §xLysenko§! convinced the officers that his work was vital to the restoration of the §GSoviet Union§!, and that any and all assistance they could render would be greatly rewarded when order was restored and the §RGerman invaders§! were expelled. It is a decision that §xBunkov§! may come to regret.\n\nDespite its relative isolation, §xMagnitogorsk§! is not alone. The surrounding warlord states of §RTyumen§!, §RZlatoust§!, and §RKostanay§! pay no attention to them, something they intend to reciprocate. The great foe to the west is the §RUral League§!, a band of Gulag prisoners turned altruistic militias who view §xLysenko§! and all his valuable aides as little more than bandits in need of driving out. A most unexpected ally, however, lies to the south: the §GDirlewanger Brigade§!, a handy supply of muscle whose loyalty can be bought with loot and liquor. With any luck, they can serve as a source of not only test subjects, but also manpower in the event of a war with the §RUral League§!. Of course, any alliance with them is not likely to last much longer after their victory.\n\n§G==FEATURES==§!\n\n* Push the limits of science and try to create a New Soviet Man!.\n\n* In the aim of mutual interest with the Dirlewanger Brigade, §xdestroy§! the Ural League's threat once and for all.\n\n* Keep the NKVD in §xcheck§!, for they will not hesitate to act if they feel Lysenko is no longer acting for the greater good..."

 COUNTRY_INFO_DIRLEWANGER: "§G==THE DIRLEWANGER BRIGADE==§!\n\n§xThe Dirlewanger Brigade§! is the bane of the Southern Urals, and not without reason. It is not so much a nation-state as it is a roving army that turned to banditry, sowing blood and terror across the steppe. At its head is §xOskar Dirlewanger§!, an officer turned bandit king who revels in the suffering he inflicts upon the villages around him.\n\nTheir origins lie not in the Urals, but in the §RThird Reich§!, as a a penal battalion called the §x36th Waffen Grenadier Division§! under the command of §xSS-Oberführer Oskar Dirlewanger§!, a long-serving veteran with a history of alcoholism, sadistic violence, and rape. Rather than demobilize during the West Russian War, §xthe Brigade§! fled the front lines and escaped into the wilderness. They have since accumulated a posse of thieves, exiles, bandits, deserters, and others who care more for bloodshed and loot than working alongside ex-§RNazis§!.\n\n§xThe Brigade§! pledges itself to no nation, swears loyalty to no foreign leader, and bows to no master but themselves. And although they are fenced into one of the poorest corners of the former §RSoviet Union§!, they have set their sights on greater prizes.\n\nTo the south and east lie the §RKazakh warlords§!, who are in a similar position: under-equipped, isolated, and without much in terms of loot. To the north are §Rthe Ural League§!, who in a way are an inverse of §xthe Brigade§!: instead of soldiers-turned-bandits, they are former gulag inmates who became respectable soldiers who oppose banditry. There is also the secretive state of §GMagnitogorsk§!, who have common ground with §xthe Brigade§! in their mutual hatred of §Rthe League§!, and their mutual interest may lead to an alliance of convenience. But to the west sits the crown jewel of §ROrenburg§!: untouched by warfare, led by a weak government, protected by a disorganized army, and ripe for the taking.\n\nThe goal of §xthe Brigade§! is simple: ride anywhere they have not been before, shoot anyone who shoots back, grab as much wealth as they can carry, use the women for their satisfaction, slaughter anyone they can see, burn down what's left, and ride off in search of their next victims.\n\nA day may soon come where they are stopped and the last bandit lies dead on the steppe, and the people of the Urals may live without fear. But until that day comes, §xthe Dirlewanger Brigade§! shall ride, and the world shall tremble before them!\n\n§G==FEATURES==§!\n\n* Launch §xraids§! upon neighboring warlords in the name of plunder and profit.\n\n* §xReach§! out to Lysenko and the Black Mountain in the name of friendship... for now.\n\n* Summon the banners of war and try to §xdestroy§! the Ural League and §ROrenburg once and for all."

 COUNTRY_INFO_OSTAFRIKA: "§G==RK. Ostafrika==§!\n\nWhen the §GReich§! gained control over the great mass of Sub-Saharan Africa, it quickly became clear that what that control meant varied massively from place to place. What exactly the term "National Socialist" means has never been entirely clear. However, if there is an 'orthodox' National Socialist colony, it is surely §xOstafrika.§! Under the leadership of §xHans Hüttig§!, the region is ruled under a strict militarist hierarchy. The Boers and Anglos stand above toiling African slaves, the Germans stand above them, and §xHüttig§! lords over them all, plotting to expand his empire and contemplating the wrongs he's suffered. There is no wall that is not decked in barbwire, no television not stuffed with listening devices and propaganda, and no (white) child that isn't raised to be a soldier.\n\nAs the other German Colonies denigrate ever further into degeneracy and the Reichskommissar's plots to expand the §GReich's§! control over the Dark Continent bare fruit, the people of Ostafrika shoulder their heavy burden without complaint, if only out of fear of the consequences. Hüttig's long-sought war with South Africa seems almost within reach, but the §GAmericans§! might prove to be a greater foe than he had imagined.\n\nHis East African Dystopia is perhaps the most successful of the §xGerman African colonies§!, as measured by the fervency and meticulousness of its soldiers.\n\nBut can §xHüttig's§! throne of bayonets remain stable much longer, or will the developing conflict be a tragic defeat for the National Socialist German will?\n\n==Features==\n\n*§xInvestigate§! your less reliable comrades for corruption and other high crimes against the Reich.\n\n* Lead the charge against the degenerate §xSouth Africans§! with the finest SS divisions of pure Aryan blood.\n\n* Balance the loyalty and §xbrutality§! of Hüttig's soldiers against their small numbers and frail allies."

 COUNTRY_INFO_SUDWESTAFRIKA: "§G==RK. Südwestafrika==§!\n\nHeil! §xSüdwestafrika§!, firstborn of the Reich's dominions beyond the Mittelmeer. From the Namib's oases to Angola's jungles do you stretch - an eagle perched atop the Dark Continent, wings unfurled in all their majesty. Bastion of the §GLuftwaffe§!, inheritors of von Richthofen's and Hartmann's legacies, your planes fly unimperiled thousands of leagues in every direction. The §REnglishman's§! perfidy has been repaid in full a year past; now you are safe and strong under §GGermania's§! care once more. May you remain so for a thousand years hence!\n\n...At least, that was how a Minister stooge addressed the §xReichskommissariat§! a year after the war. Reality bears more nuance than can be fit into a propaganda piece.\n\nThe broad brushstrokes are true, of course, like any good bit of misinformation. The §GReich§! had longed for its lost colonies after the Great War, and wrested them back and more after they won the Second. Distinguished pilot and §xReichskommissar Wolfgang Schenck§! has thereafter governed both his home and the erstwhile Portuguese colony of Angola. With a man of his stature and deeds, §GGermania§! was certain §xReichskommissariat Südwestafrika§! would flourish for the decades to come. At the surface level, it has.\n\nHundreds of the §GReich's§! finest planes have made Windhoek its African nest. Nevermind the onerous costs of maintaining such a large fleet, and the supply lines and facilities to keep them in proper shape. Nevermind the rust gathering on its pilots' hard-spent training, wasted on bombing runs against huts in the Niger or supply drops in the middle of nowhere. As trouble rumbles in §RSouth Africa§!, officers dread the moment their rusty sword is drawn past the Orange River.\n\nIts cities are bastions of civilization among the uncivilized. Conversely, the §xReichskommissariat's§! authority fades the farther one strays from a short list of settlements. Where its jurisdiction is nonexistent in practice flourish a myriad of resistances and united fronts against the colonial menace, biding for the crucial moment their handlers had taught them. Meanwhile, the villagers under their protection wait eagerly for the bird handing gifts from the sky at least once a week.\n\nAt its' apex is §xReichskommissar Schenck§!, a man with a proven record of getting the job done. But that was twenty years ago. Now he spends more time flying his personal craft than in apprising his advisors of this year's plans. Sometimes, his servants catch him heading surreptitiously to one of his mansion's unused rooms at the same exact hour for days on end. Perhaps he was merely a man of privacy?\n\nNevertheless, §xSüdwestafrika§! bustles with action belying its sleepy countenance. In the skies above Windhoek, a flight that never flew draws skeins of vapor that stretch to the far north. In the jungles along the Cubango River, a band of rebels flit their gaze between their watches and the clear blue horizon. And in a Windhoek mansion, a penitent man gazes at the ceiling as he awakes from yet another nightmare.\n\nThe wall clock ticks closer to midnight. Sooner or later, he will have to make his choice.\n\n§G==FEATURES==§!\n\n* §xSiphon§! money from the Reich to improve your air fleet - or your subjects' lives.\n\n* Lead the battle against South Africa from the §xskies§!.\n\n* Affirm your loyalty to Germania... or §xfree§! Angola from its chains."

 COUNTRY_INFO_ZENTRALAFRIKA: "§G==RK. ZENTRALAFRIKA==§!\n\n§xReichskommissariat Zentralafrika§! is often called the '§GJewel of Africa§!' by the citizens of the §GReich§!. Renowned for its safaris, mineral wealth, and of course for its eccentric §xReichskommissar§!, §xZentralafrika§! is often seen as the one bright spot for German Africa. A land of unprecedented colonial wealth (and exploitation) and prestige.\n\n§xReichskommissar Siegfried Müller§! is owed many thanks for the colony's strong management... or at least that's what the §GReich§! thinks. While often lauded as the model of a German explorer; brave, adventurous, and an impeccable host, the reality is that §xZentralafrika§! is the greatest example of financial fraud in human history.\n\nIndustrial equipment is shipped to §xMüller§!, who then has them sold abroad for well-under market value after they are 'lost' to actions against partisans that never actually occur. Those he does keep are, when not given to Africans to ostensibly use against themselves, stockpiled until they're sold back to the §GReich§! and branded as having been built in §xZentralafrikan§! factories.\n\nThese reprints are done in an §RAmerican§! owned factory, foreign corporations (half of which are officially embargoed) representing the vast majority of §xZentralafrika's§! production. On the ground, foreign mercenaries guard foreign factories in foreign controlled zones of occupation, while §xMüller§! presides over a bureaucracy almost as corrupt as he is, only running thanks to its owners fears of reprisal and personal greed.\n\nSaid mercenaries can be found working under the §xZentralafrikan§! umbrella across Africa. §xZentralafrikan§! mercenaries give German guns and training to guerrillas in all three Reichskommissariats, they assist the §RSouth African§! army in patrolling its borders, they even help operate anti-air weaponry in §RWestern Africa§!.\n\n§xMüller§! himself, despite being the lovechild of Germany and a character in seven different films, two moderately successful novel series, a popular recruitment poster for settlement in Africa, and somehow the interviewee on the §RAmerican§! 'Tonight Show', is not at all interested in good governance. Instead he focuses on hunting and carousing, and semi-secretly lives the life of Germany's greatest hedonist instead of its greatest patriot.\n\nLuckily, as long as peace lasts, nothing can stop the good times from rolling...\n\n§G==FEATURES==§!\n\n* §xSafari§! with foreign dignitaries for prestige and a damn good time\n\n* Balance pleasure and business as you negotiate with foreign and domestic §xinvestors§!\n\n* Use the §xmercenary§! companies of the Kongo jungle to do your dirty work"

 COUNTRY_INFO_SOUTHAFRICA: "§G==The Dominion of South Africa==§!\n\nLakes are few in Africa, islands even fewer, but there may as well be a sea between the §RReichskommissariats§! of §RHüttig§! and §RSchenck§! and the bright light burning at the tip of Africa.\n\nBacked against a wall, §xThe Dominion of South Africa§! carefully slinks across the narrow tightrope of international diplomacy, speaking words of liberty to §GWashington§! and whispering promises of segregation to the §RReich§!.\n\nThe battle for South Africa rages both abroad and at home. The nation is a paradox in and of itself. A dominion with no monarch, the minority governing the majority, §xPrime Minister De Graff§! carefully plays his opponents against each other in order to maintain the shaky stability his party, the United Party, has established. With stability, comes a price. To keep the §RGermans§! north of the Limpopo, §xSouth Africa§! cannot fully achieve the picture of liberty painted for the §GAmericans§!. The throne of §xSouth Africa§! lays dusty and barren, a dominion only in name, but far from a republic.\n\nAcross the aisle, the powerful orations of §RAlbert Hertzog§! echo out into the nation, attracting the Boer population to the National Party, a party established on cooperation with the §RReich§! and the domination of white §xSouth Africans§!, over the black. All the while, the African National Congress vigorously fights to have their voice heard, figuratively and literally. In the cities, the oppressed march in solidarity, demanding a continent free of division, meanwhile in the far flung outposts keeping watch on the §RReichskommissariats§!, reports trickle in of villages burned and families slaughtered in the conflict between partisan forces and the §RGerman African Army§!.\n\n§xThe Dominion§! truly does walk the tightrope, cautiously appeasing on all fronts. The conflict at the cape is quickly becoming an inevitability, §xPrime Minister De Graff§! must keep the country on the straight and narrow, for if §xSouth Africa§! were to slip from the high-wire, God only knows where she'd land...\n\n§G==FEATURES==§!\n\n* Explore the gifts exposed by De Beers with §xdiamond§! mining\n\n* Balance foreign §xinfluence§! and profit as you attempt to maintain trade with the §RPakt§!\n\n* Sway the upcoming §xelection§! in your favor"
 
 COUNTRY_INFO_1_USA: "§G==The United States of America==§!\n\nYears ago, before the talk of the §rNazi§! jackboot and the §xJapanese§! tyranny of the isles, the Stars and Stripes flew high and mightily above the likeness of a different worldwide sickness: that of the excesses of the Roaring Twenties, the explosion of the Wall Street Crash, and the dread of the Great Depression that journeyed forth, wreaking havoc upon a crippled §MAmerica.§! It was here that the ideas of a Rooseveltian New Deal burned, as comparisons to the failures of the Soviets' Nikolai Bukharin's own doings left the ideas unpopular and unsupported. And it was here that Al Smith§! came on top for the Democrats,§! allowing for then-incumbent President §SHerbert Hoover§! to maintain his stay in the White House.\n\nWith 1936, however, things changed for the §MUnited States,§! Joseph P. Kennedy§! promised an administration of balance and isolation, seeking to tip toe away from the breaking out of war in Europe by the §RNazi,§! despite the constant pleas from allied states. Peace and abstention reigned in North America, allowing the country to maneuver a recovery from the Great Depression and bolster the American economy; however, calm and stability hath reigned not. For, on December 7th, 1941, a date which will live in infamy, §Mthe United States of America§! was suddenly and deliberately attacked by naval and air forces of the §xEmpire of Japan,§! crippling §Mthe United States'§! fleet as it rested in §xPearl Harbor.§!\n\nWith a navy on the retreat and a new President to take hold, President Harry S. Truman§! promised the American people that they would see the Beacon of Liberty push through for the cause of democracy, a promise which sunk to the depths of the Pacific on July 4th, 1945, as a flash of light consumed the island of §bHawaii§! upon the dropping of an atomic bomb on the previously attacked §xPearl Harbor.§! To make matters worse, late August saw the signing of the §xAkagi Accords,§! officially ending the war with the first great American defeat in history, as it signed away the state of §bHawaii§! and the naval bases of Los Angeles and San Francisco to §xJapanese§! control, alongside endless amounts of reparations to pay and the lifting of embargoes to Axis-aligned states. The chaotic 1948 elections saw §SThomas Dewey§! signed trump the embarrassed Democrats§! over a reeling nation, having to deal with the planting of seeds towards the new political paths of §Mthe United States§!. In the first post-war election, an angry and bitter §MAmerican§! populace almost unanimously turned their backs upon the ruling Democratic Party.§!\n\nFacing waves of defections to the Republicans and the loss of nearly all of their senate seats, the party desperately sought a way to survive. Ultimately, a radical solution was proposed by several former Democrats§!-turned-§RRepublicans§! such as Senator §TLyndon B. Johnson§! – a union with the now triumphant §RRepublican§! Party. After much political wrangling, the two parties were united to form the §RRepublican§!-Democratic§! Party, briefly turning America into a one-party state.\n\nThus, the legendary General §SDwight D. Eisenhower,§! famed for his bold defense along the §REnglish§! line against the §rNazis,§! won the election as the first President under the §SRepublican§!-Democrats.§! Eisenhower worked hard in creating the §TOrganization of Free Nations,§! an economic and defensive alliance of the democratic forces left within the world. However, with the final declaration of §SEisenhower's§! intent to oversee §bHawaii's§! reintroduction into the §MUnion§! against the §xAkagi Accords,§! the §MUnited States§! has firmly entrenched its position in the dangerous world of today, whilst new, rising political stars come to sit in the most powerful seats of the country. Now, as we look forward into the 1960s, President §SRichard Milhous Nixon§! and Vice President John Fitzgerald Kennedy,§! son of former President Joseph P. Kennedy,§! find themselves at the helm of the White House.\n\nHowever, the Republican-Democrats no longer remain unchallenged in the political arena. As the American Depression wore on and the matter of civil rights began to enter the public consciousness, some Americans began to turn to alternative voices to represent their grievances. The §PNational Progressive Front§! formed by Henry A. Wallace and Glen Taylor in 1947 became a beacon of progressivism, while George S. Patton's §LPatriotic Party§! was established in 1951 to represent hard-line conservative interests. Both were able to carry states in the elections of 1952 and 1956, but neither could unseat the §RRepublican§!-Democrats.§! In the interests of presenting a united anti-establishment voice, the two parties made the controversial decision to unite under one banner – the §ONational Progressive Party§! – though whether this Frankenstein of a political movement can have an impact remains to be seen.\n\n§bWhere We're At Now:§!\nIn the year 1962, §RRichard Nixon§! is President of the §MUnited States of America.§! Fortunately, his work is cut out for him: Americans from coast to coast desire social reform at all levels. A new crisis is brewing in enemy-controlled §bHawaii§! as the aggressive §xJapanese§! place nuclear missiles on the island chain. Racism runs rampant across the South as African Americans plead for the Civil Rights Act to be signed, while many white Southerners fiercely oppose the Act. The Cold War between §Mus,§! §rGermany,§! and the §xEmpire of Japan§! is starting to heat up once again, and it is President §SNixon's§! job to bring his country to its rightful place on the world stage."
 
 COUNTRY_INFO_2_USA: "\n£us_voting_the_rd_senate\n\n\n\nWallace F. Bennett:§!\nSenator Wallace F. Bennett watches the presidency of §SRichard Nixon§! with growing concern that his distrust of others and near-obsessive need for control could be his undoing, even as America convulses from the twin pressures of the Cold War and Civil Rights unrest at home. The Utahn senator believes, above all else, that a steady hand is needed to stabilize the ship of state in these trying times - and if Nixon fails to deliver, then it may fall upon him to provide the leadership that America needs so desperately.\n\n§RLyndon B. Johnson:§!\nSenator Lyndon Baines Johnson's career is a case study in marrying high-minded ideals to the calculated opportunism of every great statesman. The Texan's passion for change began with a naked eye view of American poverty as a public school teacher, which followed him through every rung of the Lone Star State's cursus honorum. In the face of President Kennedy's§! inaction, the very same zeal had pushed the Democrat§! Congressman, and his like-minded colleagues, into the §RGrand Old Party's§! welcoming embrace. Yet it was also he who had convinced his new colleagues to caucus with his old party's tatters in 1952. For having helped restore their strength, the §RRepublicans§! and Democrats§! rewarded the man who was one of both their own with the Senate leadership - an iron gauntlet he has since bloodied against dissenters and rivals alike, to great effect. Now Johnson presides over the strongest majority in the august body's history. Many speculate when, not if, the Master of the Senate unveils his vision of the future as President... and what depths he will sink to thrust America towards it."
 
 COUNTRY_INFO_3_USA: "\n£us_voting_the_npp_senate\n\n\n\n§gStrom Thurmond:§!\nBefore there was a §ONational Progressive Party§!, there was Senator J. Strom Thurmond. In response to the Supreme Court declaring school segregation unconstitutional, he led an exodus of Southern Senators from the §MDemocratic Party§! to General Patton's §L§VPatriot Party§! in 1954. Two years later, he would negotiate a merger between that party and the §PNational Progressive Front§! to form the modern §ONPP§!. As Congressional leader of the §gFar-Right§!, alongside his lieutenants Richard Russell and Robert Byrd, he has used his power to quash any attempt at ending America's racial segregation. Though he has had no interest in running for President ever since his failed attempt in 1960, the elder statesman remains one of the most powerful politicians in America.\n\n§gMargaret Chase Smith:§!\nSenator Margaret Chase Smith of Maine is an anomaly in the §ONational Progressive Party,§! normally caucusing with the right on economic policy and the center on segregation. Resolutely opposed to the §RR§!-D§!s, who she sees as cowardly, unprincipled opportunists, she broke with them after the end of the war. One of the few §ONPP§! senators to maintain their seats after the §RR§!-D§! landslide in 1960, she has managed to gain a great deal of influence among the few remaining members. She fully intends to keep the §ONPP§! together as a §Gstrong§! and §xhawkish§! opposition to the §RR§!-D§!s while reigning in the more extreme impulses of §Msocialists§! and §gsegregationists§! alike.\n\n§gGeorge C. Wallace:§!\nAlabama's George Wallace is an enigma. As the old segregationist Democratic§! machine imploded, he happily jumped ship from party to party, ultimately winding up as one of the scions of the §ONational Progressive Party's§! §gfar right.§! Wallace portrays himself as both a proud Southerner and an American patriot, fighting for "law and order" at home and anti-fascism abroad. Truthfully, he's an opportunist who'll do what it takes to get elected. And if that means re-entrenching segregation across the United States, so be it.\n\n§PMichael Harrington§!\nIn the Midwest, Michael Harrington finds himself the unlikely standard-bearer of the §PCenter-NPP§!, the culmination of an ideological odyssey that brings the democratic socialist into the arms of the §ONational Progressive Party§!. But America has long turned a deaf ear to the plight of the poor and disenfranchised, and though he works tirelessly with his allies, including Maurine Neuberger of Oregon, the party continues to struggle for a coherent message between the more centrist Center politicians, such as Henry M. Jackson, and the regressive policies of the §gfar right§!. But he is prepared to take his case directly to the people, as he works on his great expose of §PThe Other America§!.\n\n§PHenry M. Jackson§!\nWhen one thinks of the §ONPP§!, Henry Martin "Scoop" Jackson comes to mind as easily as his name leaves their lips. The Senator and erstwhile Democrat§! from Washington was among the first to defect for the fledgling alliance between America's progressives and Southern conservatives. In effect, Scoop's message embodies such compromise by filling the niche between §PMichael Harrington§! and §gStrom Thurmond,§! eschewing radical and racist rhetoric while synthesizing the favorable features of America's political extremes - strong social nets, a hard-line stance against Japan, and others. The party could have carried the man and his ideas to the White House but for §gThurmond's§! own disastrous showing against §RNixon.§! For its moderates' standard-bearer, America's wishes were clear: someone better must take the §ONational Progressives'§! mantle in 1964.\n\nSomeone better than the Missourian rabble-rouser, at least...\n\n§G==FEATURES==§!\n\n-Chart §MAmerica's§! course by influencing its quadrennial §bElections§!, enacting §bBills§!, and vying for control of the august §bSenate.§!\n\n- Defend the old guard and old politics with the §RRepublican§!-Democrats§!... or offer the American people alternatives with the §ONational Progressives.§!\n\n- Contain §rfascism§! abroad through subterfuge and §xproxy wars.§!"

 COUNTRY_INFO_IBERIA: "§G==THE IBERIAN UNION==§!\n\n§xThe Iberian Union§!, formed in the aftermath of the new European order forged by the hated Greater German Reich, stands in a volatile position. The union, once viewed as a necessity to defend against further aggression, has devolved into a nightmare of §Rbureaucracy and disorder§!.\n\nWhen §RGermany§! plunged the world into conflict, the young regimes of §GFranco's Spain and Salazar's Portugal§! attempted to maintain their neutrality. With both the British and §RGermans§! attempting to court the Iberians into joining their respective alliances, the two leaders would sign the §bIberian Pact§! in 1942, guaranteeing peace between both nations. While peace would reign in the peninsula itself, the war would be brought to the colonial empires, first in 1942 with the §RJapanese§! seizure of Timor-Leste, and then in the later stages of the war, with the Spanish invasion of §bFrench West Africa§!.\n\nAs the war slowly fizzled out, the Spanish would seize the opportunity to reclaim §GGibraltar§! from the fading §bBritish Empire§!, as well as continuing their push into Africa, coming into conflict with local rebel groups that had swept the remaining Free French forces out of their lands. In the midst of this chaos, the victorious §RGermans§! would begin construction on the §bGibraltar Dam§!, the key piece to their ambitious §RAtlantropa plan§!.\n\nIn the late 40s, a §RGerman§! invasion would seize the gems of the Portuguese empire, Mozambique and Angola. Shocked and terrified of losing even more in the face of §RGerman§! aggression, the Spanish and Portuguese governments entered into negotiations to expand the §bIberian pact§!, culminating in the creation of §xthe Iberian Union§!, merging the two nations governments.\n\nThe newborn nation would immediately face the results of §RAtlantropa§!, seeing its eastern port cities devastated by the §RGerman§! project. In the early '50s, the §RGermans§! abandoned the Gibraltar Dam as the European economy collapsed, leaving the Iberians to pick up the pieces of the incomplete dam.\n\nThe Union, dominated by Anti-German sentiment, found unlikely allies in the §GItalian Empire§! and the Türkes regime in §GTurkey§!, forming an alliance of convenience against the Germans. Despite disputes over Algeria and rights in the now Italian Suez canal, the alliance has held against all odds.\n\nAs the years ticked by, the flaws in the Union's structure have begun to show, the equal power given to §GSalazar and Franco§!, while necessary in the creation of the union, has also proven a curse, with the near-constant §Rbickering of the Caudillos§! becoming an accepted reality of the nation.\n\nWith the upcoming Malta Conference between the §GTriumvirate§! member states and instability in the Reich, the future of Iberia and its place in the world is by no means certain.\n\n§G==FEATURES==§!\n\n* Manage the various interests of the §GCaudillos§!, as well as their popularity among the different groups that make up Iberia.\n\n* Complete the construction of the §bGibraltar Dam§!, turning it from an economic §Rdeadweight§! to a §Gboon§!.\n\n* Defend the stability of §xIberia§! through whatever means necessary, §Rlest the Union be brought to the brink of collapse§!."

 COUNTRY_INFO_BRITTANY: "§G==THE REPUBLIC OF BRITTANY==§!\n\nEver since Anna Breizh married Charles VIII in 1491, Brittany has been held in a stranglehold by our §beternal French oppressors§!. Until the §bGermans§! came. As their panzers rolled over the mighty Maginot and into Paris, we saw them as liberators, a nation that finally symphatized with the sorry fate of Bretons. Well, we were almost correct.\n\nAs the Second World War ended, Brittany had not achieved the liberty we had hoped §bHitler§! would grant us. Still under French rule, the future looked bleak. But history has a funny way of giving every cloud a silver lining. The cloud in question was dark purple, and §bHeinrich Himmler§! was the wind. In an ironic twist of fate, Brittany's greatest contemporary existential threat was the very same that caused us to finally gain freedom, as Brittany gained nominal independence in the wake of the formation of §bBurgundy§!.\n\nThough the lot of the Bretons looked to be improving, the world had different plans. As the Reich plummeted into economic chaos, the various client states, Brittany included, were left largely to their fates. As starvation and poverty loomed, it was §bOlier Mordrel§! who would first suggested the unthinkable; Brittany would have to turn to §bBlack Market trading§! in order to survive. While many worried about the impact government-sponsored crimes would have on the moral fiber of Bretons, the results could not be argued with. Brittany was not only saved, but by becoming a pipeline for Western goods into the Reich, we began acquiring wealth beyond our wildest dreams.\n\nThe Bretons have been through a lot, but our spirits were never broken. As the New Year's celebrations come to an end, and 1962 begins, the Breton republic looks into the future with eagerness, but also doubts. While the §bBlack Market§! shows much promise for the future of Brittany, Breton intelligence sources indicate that the deteriorating health of §bAdolf Hitler§! is the source of increasing power struggles within Germany. Any internal conflicts within Germany could negatively impact Brittany. Additionally, the ever-present §bBurgundians§! have been planning something nefarious for years; Only time will tell how their designs will affect us. Without doubt, the coming decade will be a decisive time for the Bretons.\n\n==FEATURES==\n\n- The time has come to make the §bBlack Market§! a true force to be reckoned with. Take charge of expanding the Market on a global scale, strategically selling weaponry to warzones and contraband goods to willing buyers. While some are interested in expanding the Market to even more dubious areas, some Bretons are also looking to end the whole system.\n\n- The Breton National Committee, the ruling political body of Brittany since the 1940's, has been held firmly in the hands of §bOlier Mordrel§! and the §bModerate Wing of the SBB§!. Supported by §bCélestin Lainé§! and the §bTraditionalist Wing and Burgundian Position of the SBB§!, the §bSBB§! is the undisputed leading party of the Committee. However, ever since leaving the §bSBB§!, §bRaymond Delaporte§! has been gathering force behind the democratic cause in Brittany. The democrats have united under the §bSAV§!, and while they hold a minority position at the moment, things could very well change."

 COUNTRY_INFO_YUNNAN: "==YUNNAN==\n\nFar from §RTokyo§!, §RNanjing§!, and modernity, §xYunnan§! is an idyllic backwater. Peasants toil in the mines and farms, using primitive tools and what machinery they can to extract endless raw resources from the land. Lording over all is §xLu Han§! and his cadre of generals, who grow fat off the labor of their countrymen.\n\nTo the east is §GGuizhou§! ruled by §GHe Yingqin§!. §xYunnan§! and §GGuizhou§! were once united as §xXinan§! and their combined wealth brought prosperity and riches to whoever controlled the region. Though many obstacles lie in the way, perhaps these two brothers will be united once more.\n\nAs the world changes, so must §xYunnan§!. If its mines and farms cannot compete with the rest of the §RSphere§!, then the province will fall and, worse still, so will §xLu Han's§! wealth. If the future is to be stable and profitable, §xYunnan§! must industrialize.\n\n§xYunnan's§! geo-political situation is as tenuous as its economic situation. §RChina§! and §RJapan§! compete for influence and control over §xYunnan's§! material resources, both for their own benefit as well as to deny the other. If §xLu Han§! is not careful, he may find his vaporous notion of pseudo-independence eroded suddenly and without warning.\n\nGreat wealth awaits §xYunnan§!, or, more specifically, §xLu Han§!, if only he is crafty enough to avoid the pitfalls of the modern world.\n\n==FEATURES==\n\n* Unite §xYunnan§! and §GGuizhou§! once more\n\n* Turn §xYunnan§! into an economic jewel of the §RSphere§!\n\n* §RWitness the return of the Lamb§!"

 COUNTRY_INFO_INDONESIA: "§G==THE REPUBLIC OF INDONESIA==§!\n\nTyranny, exploitation, and division. Such was the strategy of the §RDutch§!. Keep the people of Asia divided, keep them weak, but most importantly, keep the profits flowing. For three centuries, the people who would become §xIndonesia§! wriggled and writhed under the boot of imperialism, joining the symphony of the oppressed people of §GAsia§! crying out for freedom.\n\nSalvation would not come until March of 1942 when the §GEmpire of Japan§! first landed in §xIndonesia§!. To greet them, a man of many names stood on the shores. To his family, Kusno Sosrodihardjo, to his friends, Bung, but to the people of §xIndonesia§! he is a hero. §xSukarno§!'s monumental rise to power can be mostly attributed to his charisma and unwavering commitment to the people, but his continued control, nearly two decades after the §Rwestern§! devil was subdued, lies all in the hands of the §xTentara Nasional§!.\n\nWhile his county does battle with itself, rooting out the communists of the §RPKI§! and keeping close watch on the §Rethnic minorities§!, §xSukarno§! enjoys drinks in Palembang. While his people scavenge for all they can find, Sukarno's evenings would be incomplete without an exuberant amount of alcohol and gourmet dishes. Some say §xBung§! has lost his path, some say he's never changed, one thing is sure, for all the friends made wining and dining makes, just as many §Renemies§! are made. What §xSukarno§! may soon learn is that the greatest §Rthreat§! is §Ginside§! us...\n\n==FEATURES==\n\n- Guide democracy to your liking!\n\n- Balance the influence of the three leading power blocs: §xThe military§!, §xThe SKN§!, and §xThe politicians§!\n\n- Cement §xSukarno's§! power with §GThe Referendum§!"

 COUNTRY_INFO_1_CHI: "§G==THE REPUBLIC OF CHINA==§!\n\nFrom the South China Sea reefs to Mongolia Plateau, from the western caves to eastern isles, the ancient China state, yet modernised, has finally given an answer that satisfied history itself. Through the numerous trials of The Opium Wars, the Nanchang Uprising and the National Revolution to Restoring Nanjing, from the tribulations of §rFive Modernisations§! and §rGreat Asian War§!, §xChina§! eventually stands out as a global nation. During the midst of bloodshed, §xChina§! strengthened; inside the abyss of backwardness and enslavement, §xChina§! renewed. \n\nAfter Wang Jingwei passes away, §SGao Zongwu§! took the heavy burden of leading Reorganised ROC Government in Nanjing. Facing the broken homeland, Gao thrashed step by step for making his grand view on §rFive Modernisations§! of §xChina§! possible. He and Chinese people built every factory with incredible tenacity, made every house with commendable resilience. However, the path of collaborative salvation is destined to be full of thorns: pro-Japanese jackals’ gaze and dissenters’ sting can be deadly in the next moment, in anywhere. Fortunately, §STao Xisheng§!, as Gao’s best friend and comrade, made the most magnificent frontline with him, and forged an unexpectedly modernised §xChina§! as even a threat to Japanese “masters” inside the Kyōeiken.\n\nAfter Gao retired on accumulation of strain in 1974, Tao smoothly took over presidency – and promptly found himself in a path on tightrope. While complimenting the Japanese Loyalist regime, he still must make progress in military technology development, secret army training and intelligence office restructure. As Gao away from political practice, §SZhou Fohai§!, the infamous collaborationism ringleader, attempted to launch a coup against Tao, and the consequences of this uncovered conspiracy was bloody – Zhou ended up costing the lives of his whole family, and eventually, himself. During Tao’s term of office, patriotism recovered exponentially, and successfully covered all other social conflicts. However, as Sino-Japanese “friendship” still appears as a indoctrinated idea among a great number of Chinese from their childhoods, Nanjing government also cocooned itself in this issue.\n\nIn late 1979, that would no longer be the real dilemma. Tao heard an extremely shocking intel from Kasumigaseki – soon later, the whole world knew. After the loss of colonies, the failure in Japan-US cold war, the long-term infiltration from Soviets and the failed reign of Loyalists, §GJapan§! is facing a rising national Republican movement. Tao caught his chance, then made his decisions. After declaring the pro-Republican stance of §xChina§! in §GJapan§! issues and re-promoting Three principles of the People towards to the country, the first shots of Great Asian War was fired by Chinese never-seen armoured divisions to Manchukuo territory. After a series of drastic changes, in March 1980, §rthe Treaty of Kyoto§! was signed by Japanese Loyalist, Republicans and Republic of China, and the East Asian order has been liberalised from the paradoxical yoke of Japanese imperialism ever since. §rThe Hanseong Consensus§! later signed confirmed the independent status of §xChina§! and democratic order in §GJapan§!, and secured Sino-Japan goodwill relations with their common mission on building East Asia, defending Soviet Communism menace and striving for independent collaboration between German-US rivalry.\n\nIn his twilight years, §STao Xisheng§! abdicated his position to §SQiao Shi§!, the “idealistic reformer”. Qiao restored the goal of national modernisation, economic reform and headed towards a series of democratisation political rearrangement.\n\nAfter restoring peace and independence in 1980, the series of social conflicts, once covered under nationalism, turned on the table. The Collaborationism of “Peace Founding” once followed by current regime remained as a serious legitimacy flaw, while the sequel of forced industrialisation still tearing the country apart. And it’s not only people are apart from each other, factionalism inside KMT has raged from day to day, chaos in Legislative Yuan has become normal. Eventually, §SQiao Shi§! declared the success of §D“Historical Mission of National Democratic Revolution”§! and restructured (de facto dissolved) KMT and allow different factions to organize independent parties. After Qiao finished his term smoothly under the protection of securocrats and his personal charismatic authority, the first Special Election Congress was held and Qiao gave his power to not yet inaugurated president-elected, §SHu Jintao§!.\n\nAs the delegate of §mDemocratic Constitutional Party§!, Hu was a popular progressive centralist among both elites and ordinary people during KMT era. At the same time, other influential parties in the Legislative Yuan are unable to ignore: the central-right §zChinese National Power§! and centralist §ONational Harmony Party§! gained enough eyes on them from the very beginning, while traditional right §VPatriot Party§! and the §wNational Liberty Party§! urging for free trade having a great part of popularity; also, the moderate Pan-Asianist, §jAsia Solidarity Party§! is at the beginning of their rise. At the same time, minor parties are having their fight; however, they would not have their day unless something big happens.\n\n§xChina§!, as the leader of Asian Twin Dragons, will deliver her vibrant charm through lively gesture, and will tell the whole world her greatness by thriving economy and democratic politics...however, the seed of crisis still lurks beneath the peaceful vision, and a storm will test the great dragon once more."\n\n==FEATURES==\n\n- Sway the §xYuan§! in your favor and §Gexploit the support§! of your most trusted faction!\n\n- Follow the journey of an ancient nation in a modern world!\n\n- Guide a moderate modernization or charge full speed ahead towards the future!"

 COUNTRY_INFO_2_CHI: "\n\n£CHI_voting_banner\n\n\n\n§mDemocratic Constitutional Party§!:\nAfter “restructing” GMD during the 1995 Constitutional Reform, §SQiao Shi§! retained a large portion of the cadres, party assets and institutions within the Central Committee, transformed his mainstream faction into the §mDemocratic Constitutional Party§!. Meanwhile, the DCP also successfully inherited most of the Youth Organizations within GMD, including multiple of branches around the former Central Club and the Three Principles of the People Youth League. DCP takes “Orthodox Xianzheng” as core guiding principle, aimed at promoting the development and democracy within Chinese society. After the general election in 1999, DCP has become the absolute majority party with more than half seats in the Legislative Yuan, while §SHu Jintao§!, as a progressive candidate supported by a shared recognition within the party, smoothly inherited the presidency of §SQiao Shi§!. His close friend §mWen Jiabao§! becomes President of the Executive Yuan as one of the go-to guys and core leader of the party, giving Hu’s presidency a great advantage. However, as a loose coalition among late Xunzheng establishments, the divisions within the party are still not to be underestimated.\n\n§zChinese National Power§!:\nDuring the §STao Xisheng§! period, many Right-Wing GMD veterans were redressed, giving them the opportunity to unite central-right party members during the 1995 Constitutional Reform and formed their own party - §zChinese National Power§!. CNP mainly advocates that the idea of liberal democracy is not abused, and even holds the view that China can go back to the historical period of “Xunzheng”(Controlled Democracy). Currently, senior party members elected §zFeng Gong§! as the representative of §zChinese National Power§!, while §zHao Baicun§! used his own political experience to provide a platform for the newcomer.\n\n§ONational Harmony Party§!:\n§ONational Harmony Party§! is one of the opposition parties in the Legislative Yuan which upholds a “People’s Neutral” political position and has also attracted many former GMD members. NHP takes “Being intimate to masses, building a harmonious society” as their political slogan, while often has many different views against the §mDemocratic Constitutional Party§!. §OLian Zhan§! as a senior member dirently supports §OSong Chuyu§! to represent the NHP.\n\n§wNational Liberty Party§!:\n§wThe National Liberal Party§! was initially founded by the liberals of the former GMD and the  entrepreneurs of middle and small-sized enterprises, mainly from Guangdong during the Reorganized ROC Government period. It makes a stand against excessive intervention in the market, meanwhile advocates for a small government and free trade. As for social welfare, NLP calls for a balanced government budget so that the government shouldn't issue too many bonds for meeting the need of public welfare, it should cut welfare to keep the budget balanced, if necessary.\nNow the Cacus leader of the §wNational Liberty Party§! in Legislative Yuan is §wLang Xianping§!, founder and top public star of the NLP. §wChen Liangyu§!, the provincial governor of Guangdong, serves as Lang's coadjutant to help run the party, also acts as a core advisor, represents pragmatic bureaucrats within §wNational Liberty Party§!.\n\n§VPatriot Party§!:\nAs a Chinese old saying goes, “to cultivate the moral self, regulate the family, maintain the state rightly and make all peaceful.” The §VPatriot Party§! is a right-wing party that respects this old-fashioned tradition. The §VPatriot Party§! promotes traditional Chinese values, especially in the family aspect and advocates that the state should control the society like a father controls his family in old China. Naturally, the §VPatriot Party§! has no problem with Xianzheng and still peacefully participates in legislation and election campaigns.\nThe leader of the §VPatriot Party§! is §VZhang Houcan§! - daughter of Zhang Renli, a famous minister in the late Qing Dynasty. She herself and the §VPatriot Party§! also granted support from a Chinese culture master, §VZeng Shiqiang§!.\n\n§jAsia Solidarity Party§!:\nDespite the fact that former Dai Tōa Kyōeiken has been officially regarded by the Chinese administration as a product of Fascism, the idea of Asian Solidarity still remains in many. The §jAsia Solidarity Party§! is the product of this result which maintains the ideology of moderate Pan-Asianism and considers that China should take the responsibility of building a new, centralized East Asia order. ASP never officially denies the harm which Sphere has brought to asian people, but “the past is over, and these scars should be diluted now.”\n§jMei Aiwen§!, leader of §jAsia Solidarity Party§!, is also daughter of former Interior Minister under §SWang Jingwei§! administration §SMei Siping§!. She’s also supported and recognized by a senior scholar within the party, §jShi Ping§!."

