 COUNTRY_INFO_BURGUNDY: "==SS-ORDENSSTAAT BURGUND==\n\n§xThe SS-Ordensstaat Burgund§! is the youngest state in the Unity-Pakt, cobbled together with lands from the §QFrench§! and §bBelgian§! territories of the Reich in order to placate §PReichsführer-SS Heinrich Himmler§!. During the West Russian War, Himmler attempted to launch a coup against the ailing Führer §RAdolf Hitler§!, whom §PHimmler§! saw as a decrepit fool who was driving the Reich into chaos. However, §RHans Speidel§! and the Wehrmacht were able to crush the coup, forcing §RHitler§! to find a punishment for his once-loyal follower. It came in the form of §xthe Ordensstaat§!, a white elephant that would hopefully keep the SS too busy managing in order to plot. How wrong he was. §PHimmler§! has spent the past several years consolidating his power and ousting anyone in the administration who was not utterly loyal to him, and now he is ready to strike and succeed where he once failed. But even the best-laid plans may go awry...\n\n§xThe Ordensstaat§! is dominated by the SS, who are predominately loyal to §PHimmler§! above all. However, no man rules alone. The native German SS are joined by various collaborators: the §bSS-Legion Wallonien§!, led by the Walloon §RLéon Degrelle§!, the §OSS-Legion Langemarck§!, led by the Flemish §RBert Eriksson§!, and the §QSS-Division Charlemagne§!, led by the French §RChristian de la Mazière§!. All of these factions despise one another and vie for power, sometimes jockeying with one another and sometimes threatening to undermine the rule of the §PReichsführer-SS§!. If there is to be any hope of success, §Rthe collaborators must be kept on a close leash§!.\n\nThankfully, not everyone in the Reich is an enemy. §gReinhard Heydrich§! is as loyal as ever to §PHimmler§!, and more importantly, he resides in Germania, leads the Deutschen-SS, and has §RHitler§!'s ear. It is no secret that the old Führer is not long for this world, and §gHeydrich§! is poised to sweep in and seize power should some terrible tragedy befall the great leader. If he were to succeed, it would §Ggreatly expedite§! the fulfillment of the §PReichsführer-SS§!'s vision for the Aryan race...\n\n==FEATURES==\n\n* Manage the §bworkforce§!, carefully maintaining a balance between §xSicherheitspoleizi§! and §xskilled laborers§! in the §xOrdensstaat§!'s territories.\n\n* Launch §binvestigations§! into §Rtraitors§! who may be lurking in the ranks of the Waffen-SS.\n\n* Begin the §bGlobalpläne§!, sowing the seeds of chaos among the great powers of the world. But it does not come without a §Rprice§!."

 COUNTRY_INFO_OSTLAND: "==REICHSKOMMISSARIAT BALTIKUM==\n\n(The following description is kind of temporary and may be replaced in the future -Baltikum Dev)\n\nAfter the death of Albert Speer and the Second West Russian War in the 1980s, Ostland had split into two different nations by the names of Reichsland Baltikum and Reichsland Weißruthenien. Due to the slight democratization from his son, several political parties have sprung up in Baltikum. To prevent the loss of the iron fist on Baltikum, political parties are constantly monitored. Today, Baltikum is thriving off tourism and fishing and can be compared to OTL Japan in some cases (or at least, compared to Weißruthenien, that is) due to the access to the Baltic sea.\n\nEver since the split, Baltikum had terrorists that believe in different ideologies or that are unhappy with the current leadership. Most terrorists believe in the Burgundian System that was introduced by Heinrich Himmler, who influenced sent brainwashed SS officers to attempt to spread the ideology through Ostland to the main Reich as they saw it as a backdoor. Spread the ideology they did but it didn’t spread too far.\n\nThe current leader, Igors Šiškins, is extremely devoted to the National Socialist ideology. This is also one of the reasons as to why Mussgnug chose him to lead Baltikum. His leadership began ever since the proclamation of Baltikum. He secretly believes in the supremacy of Latvians, similar to how Adolf Hitler believed in the supremacy of the Aryan race.\n\nŠiškins isn’t the only person that has a grip on Baltikum. A young lawyer and right-wing populist by the name of Aldis Gobzems claims that he wants to make the Baltic people become great again.\n"
 
 COUNTRY_INFO_WAL: "§G==WALES==§!\n\nShortly after the §gGerman§! horde landed on the southern coast of §eEngland§!, a group of §GWelsh§! nationalists hurriedly declared their independence from the §eUnited Kingdom§!. It was a last ditch attempt to try and preserve at least some of the freedom their neighbour was sure to lose under occupation.\n\nThe §gGerman Reich§!, sufficiently weakened by the ordeal of conquering and subduing the §zEnglish§!, accepted the independence of the new republic; however §GWelsh§! freedom came at a price. The deal made with the §gGermans§! has forced the §GWelsh§! government to send a substantial portion of its coal output to the §gReich§!, the close proximity of the garrison in §gCornwall§! makes sure these shipments are made. This threat has constantly still remains to this day, and has constantly hung over §GWelsh§! leadership since. §LSaunders Lewis§! is currently the unlucky man who must shoulder this burden.\n\nHe leads the republic alongside his deputy, §LGwynfor Evans§!. However, their nationalist bloc is large and plagued by growing disunity; an issue that, if left unchecked, could cause the government to collapse at the first sign of failure. A not inconsiderable rift already exists between the two main parties; §xGoch Cymru§! and §LPlaid Cymru§!, who represent the left and the right of the party respectively. There is also the matter of the more volatile group in the coalition, known as the §jFree Wales Army§! they steadfastly refuse to allow the government to take any action they believe could lead to the end of the Republic.\n\nMany suspect that the §jFWA's§! connections go much deeper than their commanders are willing to admit, and they indeed do. Their leader, §jJulian Cayo-Evans§!, controls the largest and most feared paramilitary organization in §GWales§!. They claim to be the true protectors of the welsh people and their culture, willing to stop any and all §eEnglish§! encroachment through methods that are likely to become more and more foul.\n\nYet all their efforts may be in vain as, slowly emerging from behind the scenes, the §RUnionist Party§! has restarted its efforts to sway the Welsh people back into the arms of their neighbour. §RJohn Morris§!, alongside his broad array of political allies, will do all they can to overcome the chaos caused by the §jFWA§! and reverse the impacts that years of independence have wrought on §GWales§!.\n\nOver the coming years, all these factions will have to seek out ways to tame the erratic political situation. Some may find this task harder than others, as the governing party slowly chips away at a crisis that is sure to bring them tumbling down. No one in §GWales§! will be left unaffected and life in our nation will be forever changed, though if this will be for better or for worse is yet to be determined.\n\n==FEATURES==\n\nControl the deteriorating §Lpolitical situation§!.\n\nEndure the brunt of the looming §LCoal Crisis§!."

 COUNTRY_INFO_SCO: "§G==SCOTLAND==§!\n\nDuring Britain's darkest hour, a light that had lasted for three hundred years was finally extinguished. In its place a new one had been ignited, one that had not seen the light for three hundred years, Scotland§! had been formed out of desperation by General §QDouglas Wimberley§!, the famed general of the §Q51st Highlanders§! and §bJohn McCormick§!, the founder of the small Scottish nationalist party known as the §bScottish National Party§!. In the enduring chaos after the invasion, Scotland§! was flooded by refugees from §REngland§! looking to run away from the regime propped up by the §gGermans§!. The Scottish§! people and §bSNP§! as a whole are distrustful, seeing them as oppressors who had controlled them for three hundred years, many worrying that some of these refugees could have been agents sent by the §RCollaborators§!. As time has shown, these fears have yet to come.\n\nIn 1962, the Scottish Republic is led by its founder and President §bJohn MacCormick§!, known affectionately as "The King" being compared to the Scottish kings of old. His protege, §bRobert McIntrye§! has served as his Prime Minister, as well as serving as the member of the SNP. However not all is well in one of the last bastions of democracy on the British Isles. §bMacCormick§! is growing sicker and sicker everyday, with his health declining. His death after leading the country for nineteen years could leave drastic results. As parliament discusses bills and other proposals, many of the Scottish people worry that their country could be in a paralyzed state after his death. However, some opponents have used §bMacCormick's§! nickname against him comparing him to the dictators of Europe due to his uninterrupted rule.\n\nWhile it may seem like a one party state due to the dominance of the §bSNP§! for the past nineteen years, there had been two other primary parties who had been biding their time, campaigning to gather representatives in the Scottish Parliament. At the forefront of the two is the §PIndependent Labour Party§!. In the chaos and uncertainty of the Fall of §REngland§!, the §PLabour Party§! had faced fractures and the slow demise. Many of its members had been arrested and detained by the §gGestapo§! as many fled to Scotland§!. The Scottish§! branch of the §PLabour Party§! needed reform to stay afloat in this new country. In this, the §PIndependent Labour Party§! was formed, however it had been on a decline due to the stunning popularity of the §bSNP§!. It looked as if it would dissolve until §PWilliam Wolfe§!, a former member of the §bSNP§! had joined and reformed them into the force they are today.\n\nThe smaller of the three, the §OUnionist Party§! led by §OPriscilla Buchan§! is seen more of a rump party than an actual competitor compared to the juggernaut that is the §bSNP§! and the growing popularity of the §PILP§!. However §OBuchan§! and her party are hopeful for the future. §OBuchan§! herself was a former member of the Conservative Party before arriving in Scotland§!. After much consideration and funding arriving from a mysterious benefactor, the §OUnionist Party§! was formed. While seen as a laughingstock by both the §bSNP§! and §PILP§!, the §OUP§! is a party full of committed members who have been known for being quite large in attendance at the polling stations with the membership slowly growing. Other elements are at play however, and these may leave a lasting effect on Scotland§! forever.\n\nOne of the largest figureheads in Scotland§! is the de facto leader of the §QScottish Armed Forces§!, Marshal §QDouglas Wimberley§!. Loved by his soldiers and the local students of the many colleges and universities of Scotland§!, he has been known for bringing back dedication and pride into the many subjects he likes. Being one of the other founders of the current republic, he has quite the public image. To his more closest friends and advisors, they know that Wimberley can be a paranoid man. While all may seem well to the citizens of Scotland§!, the Armed Forces are in a constant state of alert. With the §RCollaborators§! on the border, the threat of attack is constant. This ideal has been drilled into the §QArmed Forces§! and is something that the generals and admirals live by. §QWimberley§! is a smart man and will put it on the line to protect Scottish independence and freedom as he sees it.\n\n==FEATURES==\n\nDecide the Future of Scotland§! as the Last Free Democracy in Europe.\n\nBalance the §QScottish Armed Forces§! with the Paranoia Mechanic.\n\nReunite the British Isles and save §REngland§! from the §RCollaborators.§!"
 
 COUNTRY_INFO_ENG: "§G==ENGLAND==§!\n\nOf Englishmen and the rest of the world, what is there to say but that they invaded most of it at one point or another. Perhaps then it is inevitable that they would be subjected to the same depredations they inflicted on a thousand nations at the hands of §gGermany§!. §xEngland§! in this new and untested era is not the same place as it once was, for instead of the traditional power structures it is lead by a loose alliance of all those who want no more war with the Reich. The §gRoyal Party§!. Under §gAlec Douglas-Home§! the party has recovered greatly from the miserable days of the war and the chaos following the 1953 London Uprising by communist revolutionaries. §gHome§! leads the §gModerate§! faction of the RP, the largest portion of the coalition dedicated more to stability than any true ideals beyond that. At his side is §zHarold Macmillan§! and the §zReformists§!, who nominally adhere to democratic principles but are willing to compromise with §gHome§! for the good of §xEngland§!. Also present are the §OHardliners§!, dedicated fascists led by §OArthur Kenneth Chesterton§! who advocate for a state closer to the German model. Despite their differences, all three of these groups have been willing to work together for the sake of §xEngland§!'s recovery. But recovery doesn't meant stability, for another faction exists within §xEngland§!, §eHMMLR§!.\n\nHer Majesty's Most Loyal Resistance is a network of several different rebel groups all answering to one unknown man, allegedly called "the Boss". The organisation itself can be traced back to the aftermath of the 2nd World War, but it wasn't until the defeat and nigh annihilation of the Communist Party of Great Britain at the Third Battle of Cable Street that §eHMMLR§! rose to the fore of the English rebel organisations. §eHMMLR§! proper are dedicated to the return of the person they believe is the rightful monarch of §xEngland§!, Queen Elizabeth II. A somewhat conservative organisation, it is surprising that they allied with the second largest faction, The §RLeft Resistance§!. Led by §RBill Alexander§!, a veteren of the West Russian War, Spanish Civil War and a dozen wars in between, along with being one of the few notable survivors of Third Cable Street, The §RLeft Resistance§! are an eclectic mix of communists, socialists and even most of the old Labour Party united under a common banner and cause. The third piece of the puzzle can be found in §GDavid Stirling§! and his §GCommando's§!. The only rebel group to be in active rebellion from the end of the 2nd World War when he deserted, §GStirling's§! §GCommando's§! are the smallest of the three major parts of §eHMMLR§! but also the best trained and equipped. What sets them apart from their brethren however is their fierce republicanism and an unquenchable desire for vengeance upon the traitors to §xEngland§!.\n\nThese two factions will eventually have to face off, though in what circumstances and when remains to be seen. But the victor will have an opportunity to decide not just the fate of England, but potentially the fate of Britain as well.\n\nFeatures\n\nDecide the fate of England through elections and politicking\n\nReunite the Isles, for better or worse.\n\nPlay your part in the great game between the Reich and the OFN.\n\nEngland Prevails!"

 COUNTRY_INFO_ITALY: "§G==THE ITALIAN EMPIRE==§!\n\nHow does one begin to describe the §GItalian Empire§!, birthplace of §xFascism§!, conqueror of Jerusalem, hegemon of the Horn, lord of the Suez, the §xfourth world power§!? And how can one possibly describe §GGaleazzo Ciano§!, the man systematically §xtearing it all down§!?\n\n§GThe Second World War§! saw §GItaly§! transcend from Kingdom to §GEmpire§!, conquering from lands British, French, Albanian, and Yugoslav alike - many wondered in those days how far §GItaly§! would rise under the gaze of §GBenito Mussolini§!. It seemed almost inevitable that it would grow to join the ranks of the §xburgeoning superpowers§! of the §RUnited States§!, §RGreater German Reich§!, and §REmpire of Japan§!. A fourth superpower, bound tightly in friendship to §RGermany§!, which would surely see the spread of §xFascism§! world wide.\n\nThe fifties saw this dream of §GMussolini§!'s transform into a nightmare from which the country still has not yet fully woken. Strong Armed into aiding with the §RAtlantropa Project§! by §RGermany§!, §GItaly§!'s coast was ravaged, and the §xadriatic destroyed§!, making way for nigh-useless §xsalt plains§!. The §xeconomic crash§! that swept from §RGermany§! into Europe decimated §GItaly§!'s struggling economy - and then, finally, when the §RGermans§! had the gall to attempt to drag §GItaly§! into a war against a resurgent §RRussia§!, §GMussolini§! had decided §GItaly§! would no more suffer under German treachery. The §GEmpire§! would withdraw from its alliance with §RGermany§! - and open its borders to those in the Reich that sought refuge. Political prisoners, escaped prisoners, and more fled to §GItaly§!.\n\nAs the fities wore on, §GMussolini§!'s decisions grew more erratic and unpredictable as the Duce aged. He moved against the King, §GUmberto II di Savoia§!, and very nearly plunged the country into civil war in an attempt to depose the monarchy. The only thing stopping him was his son-in-law, §GGaleazzo Ciano§!.\n\nA devout Fascist, §GCiano§! had nevertheless watched with growing horror as §GMussolini§!'s policies plunged the §GEmpire§! into greater economic ruin and political strife. He stepped in between the King and the Duce's political rivalry, convincing his father-in-law to forfeit the struggle to end the monarchy; some say the Duce's death some days later was a mere coincidence, some say §GCiano§! took the safety of §GItaly§! into his own hands. Whatever the case, il Duce was dead, and §GCiano§! had risen to take his place.\n\nThe New Duce's immediately began to liberalize the §GEmpire§!, not out of any dedication to §xDemocracy§!, but out of sheer pragmatism. §xFascism§!, at least the methods of it §GMussolini§! had employed, had failed. §GCiano§!'s reforms walked back on racial laws, brutal colonial systems, and, perhaps most importantly, the suppression of Italian §xDemocracy§!. Spurred on by King §GUmberto II§!, the Duce has slowly but surely began to reintroduce democratic systems to §GItaly§!'s people, and even as the hardliners in the PNF bluster and grumble, the masses of §GItaly§! have begun to turn away from §xFascism§!.\n\nYet this bloodless Revolution may yet fail. §GCarlo Scorza§!, the ad-hoc leader of the hardliners of the PNF, stands firmly against §GCiano§!'s reforms, blocking them when possible and causing public outcry when not. Italian Society has become polarized between these two opposites - the reform and liberalization of §GCiano§!, or the hardline §xFascism§! of §GScorza§!. The tensions have reached their boiling point.\n\nThe §GEmpire§! stands at a crossroads. Either §xDemocracy§! will rise from the ashes as a Phoenix, brighter than ever before, or it will be stomped out into dust, never again to light §GItaly§!'s way.\n\n§G==FEATURES==§!\n\n* Stoke the fires of §xDemocracy§! once more within §GItaly§!, bringing an end to §RFascist Tyranny§!.\n\n* Triumph over §RReformism§! and ensure §xFascism§! forevermore retains its grip on §GItaly§!!\n\n* Manage a massive Colonial §GEmpire§! - the fate of its people is §xin your hands§!."

 COUNTRY_INFO_IRE: "§G==THE REPUBLIC OF IRELAND==§!\n\nThe twentieth century opened in a dark time for the people of §GIreland§!, subjugated as they were by their overlords in §RLondon§!. But circumstance and stubbornness allowed the §GIrish§! to have a state of their own once more, and for a time it seemed as though peace would be the way of things between the §REnglish§! and their §Gformer subject§!. Then, the §qGerman Reich§! attacked. Through Warsaw, Paris and even London itself did the German boot march, and §bEamon de Valera§!, Prime Minister, leader of §LFianna Fáil§! and the Irish Hero, was faced with the choice of siding with a §Rdoomed power§! or making §Gthe republic's§! place in the §gnew world order§! assured through blood.\n\nThe §bde Valera§! administration authorised the §GIrish§! invasion with §gGerman§! assistance, of the region known as §ONorthern Ireland§!, the only part of the §Gemerald Isle§! kept under §SBritish rule§!. On the back of a successful albeit bloody campaign and long, §LFianna Fáil§! hasn't merely come to dominate §GIrish§! politics over the past decades but in effect become the sole ruling party. §cFine Gael§! has withered on the vine, whilst the socialist §eSinn Féin§! was banned outright. Yet not everyone is content with the state of affairs, especially §GIrish§! membership in the German dominated §qEinheitspakt§!. Following the Withdrawal of the German garrisons from Northern Counties at the time of the West Russian War, control over the §ONorthern Counties§! became increasingly difficult, necessitating the appointment of §bNeil Blaney§! as Minister for the Northern Counties. Through methods unknown to much of the government, he has maintained the boiling pot that is the region under control.\n\n§LFF§! dominance waned during the tumultuous times of the 50's, and whilst §bde Valera§! is well liked by the average Irishman there were many who began to tire of his rule as once small mistakes began to pile up slowly but surely. Thus when §LSeán Lemass§! suggested that §bde Valera§! take the more ceremonial position of the presidency where he could retain influence still, it was a trivial issue for the old man to accept, though he cautioned §LLemass§! not to coalition with §SLabour§!. It must have come as an unpleasant surprise to the elderly revolutionary when the new Prime Minister did exactly that and formed the current government as a §LFF§!-§SLabour§! coalition, with de Valera powerless to stop it. And in the midst of this disagreement §LFF§! has started to show even more vulnerability than before.\n\nNow after a disappointingly narrow victory in the '61 elections, three factions of §LFF§! stand to contest the parties future. The §LDe Valerists§!, supporters of the conservative old guard and §bLemass§!'s support base. The §qHardliners§! of the aforementioned §bNeil Blaney§!, catholic supremacists who are disliked fervently by the north, and §bJack Lynch§!'s awkwardly named §TLiberals§!. Who despite having little in common with the ideology are nonetheless the most reform minded of §LFF§!.\n\nWhile these factions spatter over mundane politics, the situation in the §ONorthern Counties§!, the largely protestant former British territories, continues to degrade. Few have taken well to §bNeil Blaney§!'s governance, and terrorism is rife from §OUlster§! to §ODerry§!. Three factions continue to gather strength under the noses of Dublin: The newest amongst these is the §yIrish Citizen Guard§!, a secretive splinter group of the IRA, which is known to be aligned with the interests of Germany. There is also the §eIrish Republican Army§!, an alliance of Irish nationalist and socialist groups opposed to German interference, and led by Seamus Twomey. Finally, there is the §OUlster Volunteer Force§!, a force opposed equally to Irish and German rule, led by the popular presbysterian preacher, §OIan Paisely.§!\n\nNow in 1962 §GIreland§! has a future uncertain set before it, one can say it has two visions for it: Fianna Fáil's vision of status quo and stability or the vision of change of Fine Gael. Only good governance and luck could save a nation so economically dominated by the interests of the §gReich§! and so politically torn on the inside. But perhaps the world will find a way to bring this about.\n\n§G==FEATURES==§!\n\n* Manage §LFianna Fáil§!'s inner affairs through all the means possible to avoid the worst things possible or finally bring §lchange§! to the country's political life.\n\n* Lift §GIreland§! out of poverty without running out of budget and the investors's trust.\n\n* Handle the ticking bomb that is §ONorthern Ireland§! as wisely as you can."


## Regional Info
 REGIONAL_INFO_WEST_RUSSIA: "§G==WEST RUSSIA==§!\n\nWhen the §GSoviet Union§! of Bukharin collapsed, the Germans thought the Russians broken and defeated. Reichskomissariat Moskowien was established on Russia's traditional heartland, home of its most important population center. The weak and cowardly Red Army would dissolve into irrelevance, and let the Germans build their thousand year empire at their leisure.\n\nThe §RWest Russian War§! came as a surprise. A thousand kilometer long offensive by the §GWest Russian Revolutionary Front§! of §GGrand Marshal Voroshilov§!, led by some of the best generals of the fallen Union. Commanders such as §GGeorgy Zhukov§! and §GMikhail Tukhachevsky§! pushed the complacent Germans hard, breaking their line in several areas. For a moment, the whole of RK Moskowien seemed lost.\n\nThis moment passed, and the §RWest Russian War§! took a turn for the tragic. No one within the §GWRRF§! could agree what had cost them the initiative. Russian collaborating with the Reich; incompetence within the front itself; treachery from politicians in §xSyktyvkar§!. No matter the cause, the WRRF's offensive stalled out. The §RWehrmacht§! fought back desperately, slowly turning the tide against the Red Army. In this they were aided by collaborators, men flocking to the banner of the imperial pretender §xVladimir III§! and to the so-called §GArmy of Russian Liberation§! of §xAndrey Vlasov§!. Little by little the front was pushed back, until collapse.\n\nNow West Russia Remains as it was in the months following the end of the West Russian Wars, frozen in place by the Luftwaffe's cruel §Rterror bombing§! Campaign. In the north near §GArkhangelsk§! the remnants of the WRRF endure. Ageing Grand Marshal Voroshilov is expected to choose a successor; his likeliest candidates are Marshals Tukhachevsky and Zhukov. Sent to govern the military districts of Plesetsk and Ukhta, the generals' absence has done little to change court politics in Arkhangelsk proper. To the south of the Front's holdings lies the §GKomi Republic§!, a democracy born from a secessionist province of the Front. President Voznesensky has managed to steer the young nation mostly successfully, yet increasing political instability from the far left and far right threaten the republic. Nevertheless, Komi holds a few trump cards of its own and is a contender for power in the region.\n\nSouth of the Front and west of Komi can be found §GVologda, Kostroma and Gorky§!. Once men of the Front, the soldiers in Vologda rebelled at the thought of continuing to fight fellow Russian soldiers. Since then they've attempted to sail a perilous course of diplomacy. In this they are aided by the wealth of Kostroma, a city state and important hub of black market trade with Germany. The final member of the trio of breakaway provinces, Gorky is home to some of the front's veterans armored division. Isolated from their former commanders, the men of Gorky live as bandits and raiders.\n\nFurther south can be found Vyatka and Samara. Captured by German collaborators in the dying day of the West Russian war, both regions hope to use their veteran armies to secure control of West Russia. The tsarists in §GVyatka§! at least hold on to imperial dignity, being led by the legitimate Romanov heir Vladimir III. Their rivals in §GSamara§! have nothing in the world but their own force of arms. Widely despised for their efforts to help the Germans win the §RWest Russian War§!, the men of the Russian Army of Liberation are cut off from their families west, and unsure as to their next objective.\n\nOther nation states try to carefully eke out a living in the ashes and ruins created by the endless German bombings. In §GBashkiria and in Tatarstan§!, local population waries of the resumption of a new Russian Civil war hope to be spared by the rising winds of war. In §xOnega§! the men of the §GAnti-Communist Volunteer Guard§! continue their endless watch. Forced by the Finnish Republic to serve as a wall between Finland's new land in Karelia and the Russian Anarchy, the men of the Guard await. Beyond their borders, the winds of war rise in Russia. Were the terror bombing campaigns to end, a new conflict to establish supremacy in Western Russia would begin. One likely to forge a new future for Russia.\n\n§G==FEATURES==§!\n\n*Put and end to the warlord era, and unite West Russia under the flag of your choosing.\n\n*Use your large population and powerful industrial base as a springboard to Russian reunification.\n\n*Prepare to retake occupied Russian lands from Germany."
 
 REGIONAL_INFO_EUROPE: " "
 
 REGIONAL_INFO_ENGLAND: "§G==BRITISH ISLES==§!\n\nAn empire long united must divide. And an empire long divided must unite. The United Kingdom of §PGreat Britain and Northern Ireland§! is no more, the horrors of World War 2 and the §gGerman§! Invasion sundering the nation apart.\n\nChief of the nations in former §PGreat Britain§! still is §xEngland§!. Though once at the head of an empire which spanned the globe, in the modern era §xEngland§! has fallen on hard times. The collaborationist government of the §gRoyal Party§!, a loose alliance of those unwilling to risk the ire of Germania, governs the country in a decidedly undemocratic manner. Nonetheless, under the leadership of §gAlec Douglas-Home§!, the collaborationists have managed to piece together a functional administration for the first time in years. Yet not all the men of §xEngland§! submit to the §gGerman§! yoke. Her Majesty's Most Loyal Resistance, the §eHMMLR§!, are the foremost group in the struggle against fascism. A mix of communists, monarchists and everything in between §eHMMLR§! is united almost solely by their mutual antipathy for the collaborationists and all who serve them. But the balance between these two groups is precarious, and who knows what could happen should the international stage move erratically?\n\nIn the north the §MRepublic of Scotland§! holds out as the last truly democratic nation in the isles. Formed not by treaty but by the rogue Field Marshal Wimberley and John McCormick's §bScottish National Party§! as a last bid to ward off advancing §gGerman§! forces, §MScotland§! is an eclectic mix of exiles, natives and soldiers that share only their hatred of the Reich and all who serve her in common. Yet despite existing for nigh on two decades the Republic is fundamentally unstable, riven by divides between nationalists, unionists and other parties still. The future of Scotland is dependent on that of §xEngland§!, and whether an independent Scotland is the future or a blip on the historical radar is yet to be seen.\n\nTo the west of §xEngland§! lies the nation of §GWales§!. Forcedly separated from §xEngland§! during the course of the treaty of surrender, the Welsh have attempted to rebuild their nation which hasn't existed in over seven centuries, to varying results. Internally the Welsh are even more split by the matter of unionism than their Scottish brethren, with parties all across the political spectrum holding a variety of opinions on the matter, the only consistent agreement being that a union at present would be disastrous. A potential issue in the future of Wales though might be with their primary export. The coal mines of the Welsh primarily export to §gGermany§! after all, and were something to interrupt this it might prove disastrous for the fledgling celtic nation.\n\nAcross the Irish Sea, the §yRepublic of Ireland§! eeks out a meagre existence as the second of the §gUnity§! §gPakt's§! allies in the British Isles. Aiding the Germans in their conquest of §oNorthern Ireland§! during the course of the Second World War, the Irish have few friends to be found outside the §gPakt's§! influence. With the situation growing ever more unstable in Europe however, the future of the emerald isle is an uncertain one, and is likely to be impacted heavily by whomever emerges victorious in Britain. But the Irish people are not known for giving in to inevitable results, one way or another the English will find that out firsthand when the time comes.\n\nBritain is a land of chaos, a land of unrest, a land of opportunity. Whom shall rise and whom shall fall is left up to those who take power for themselves. Let the winner take all!"
 
 REGIONAL_INFO_EAST_ASIA: "§G==EASTERN ASIA==§!\n\n§MEast Asia§!, a region now free of §RWestern Imperialism§! has a new master - §eThe Empire of Japan§!. With it's crushing victories in the Greater East Asia War, the Imperial State commands the loyalty of the liberated nations previously under the colonialist yoke, and the attention of the world. Her warring fury had swept across the east in a marvelous strike of military prowess and imperial strength. However, Tokyo's grip over its new client states is waning, and §edrums of war§! beat again.\n\nTo her north and west stand the §PEmpire of Manchuria§!, a loyal ally and puppet of the Japanese, and the §wRepublic of China§!, an increasingly rowdy satellite state angered by Tokyo's dominance over the east. To the south, the nations of §RIndonesia, Syonan§!, and various others pay homage to their Japanese allies, but the fires of revolt and rebellion burn louder and faster with each year that passes. Nonetheless, on the surface, Japanese hold of the Pacific is firm and secure, only threatened by the vexed postulations the Americans in the east and Germans to the west.\n\n§OThe Co-Prosperity Sphere§!, a geopolitical organization set up to hold together Japanese prizes from conquests, stands tall over Asia to unite the liberated nations under the leadership of the Imperial State. IJA garrisons stand to defend Japan's allies, marching from the banks of the Amur river to the jungles of Bengal, and IJN fleets patrol the eastern waters to guard from foreign incursion.\n\nIt is 1962, and Tokyo rules over The East. The New Order has resettled differences between nations and peoples, with entire civilizations now faced to bear witness to the might of the Rising Sun. However, old habits die hard, and generations will not forget their bitter rivalries with neighboring enemies and resent for their colonial oppressors."

 REGIONAL_INFO_WEST_SIBERIA: "§G==WEST SIBERIA==§!\n\nWith the death of the §GSoviet Union§! came the birth of the §xWest Siberian People's Republic§!, a Bolshevik state headed by the authoritarian §GLazar Kaganovich§!. Assigned to the isolated region under Bukharin, Lazar wove webs and forged alliances that put him at the helm of an iron nation. But with time came vengeance, so when §GWest Russia§! launched its infamous war against the §Rfascist aggressor§!, the Republic stood by. But with war came defeat, bitter loss that took its final toll upon the Russian people. City after city, civilization collapsed into anarchy, out of which arose idealist states and the stuff of nightmares.\n\nThe West Siberian People's Republic was thrown into chaos as well, suffering from a lack of initiative and back-stabbings against Kaganovich's regime. The collapse came with no surprise, fracturing into petty warlords:\n\nIn the center sits the steel city of §GTyumen§!, below which gather armies in preparation for the next war. Smoke bellows from massive factories to the sound of marching feet, soldiers heading in one direction, resettled peasants in the other. §GKaganovich§! and §GKhrushchev§! cling against hope that they may repudiate their past mistakes. But to the North lies a greater adversary - §xSverdlovsk§!, commanded by the aging §GGeneral Konstantin Rokossovsky§!. A father to his men, the military junta wields a powerful army but remains relatively apolitical. In its crosshairs is Tyumen, and next, all of Russia. In the South, hugging the wastes of Kazakhstan, sleeps a monster of great malice. The spartan city of §ROmsk§! extends its bony grip across Western Siberia, rallying men whose mere names conjure fear. Like a chessmaster, the §RBlack League§! calculates its every move, but whispers speak of death and a succession crisis.\n\nHigh atop the mountains sits the §bmerchant republic of Zlatoust§!. Content with one of the largest military complexes in Russia, the merchants of death help arm the armies which may one day lead to their own demise. But the Republic is also home to innovators, its stability and justice attracts many refugees. New rifles pour from modern assembly lines - anyone who wishes to obtain the treasures of the Mountain will have to come and take it. But Zlatoust is not alone - in the North is the §xThief Territory of Yugra§!. A country without laws, ran by bandits and thugs, Yugra launches constant raids for food and ammunition.\n\nCornered against the icy sea is §xVorkuta§!, remnants of the Vorkutan Corrective Labor camp. One of the largest §RGULAGs§! in Russia, its prisoners freeze before the guards, themselves confined to ancient structures, feeding on scraps. The last 'warlord' are the §xFree Aviators§!, remnants of the Soviet air corps. Unique in its leadership, the Aviators do not have a functioning government - rather, they are a collection of airfields, the last line of defense against the Lufwaffe's endless onslaught. The Aviators command respect from all factions, but their numbers dwindle every day, until there will be none left. Rumours of Hitler's imminent death and the Pakt's collapse may halt the terror bombings, paving the way for a war of national reclamation.\n\n§G==FEATURES==§!\n\n*Mobilize the industry and rally your armies to rebuild Western Siberia, either under the Crimson flag or the Black League.\n\n*Utilize superior industry to conquer Western Russia when the time is right, but do not forget about the Southern Urals.\n\n*Gear for the inevitable war against Germany."

 REGIONAL_INFO_CENTRAL_SIBERIA: "§G==CENTRAL SIBERIA==§!\n\nCentral Siberia once stood defiantly as the §xCentral Siberian Republic§!, the world's eyes on its capital §xTomsk§! as the young nation strove confidently into the future. Holding most of Russia's remaining industry as a result of Bukharin's Central Siberian Industrial Plan, the Republic was seen as the likeliest candidate for Russian Unification.\n\nIn the end however, it was not German Fascism but the inability of Russians to work together that brought down the nation. Internal strife and a foreign invasion broke the back of the Central Siberian Republic, leaving a myriad of successor states in its wake.\n\nTo the South West, the §xFederation of Novosibirsk and Barnaul§! plots to make good use of its agricultural land and heavy industry to reunite the region. Legendary ace pilot §xPokryshkin§! and his junta had a first row seat to the collapse of the old Republic. They plan not to repeat its mistakes. East of the federation one can find §xthe Principalty of Kemerovo§!. Led by §xKing Rurik II§!, the small statelets blend of medieval Russia and modernity leaves many confused. Some write off §xRurik II§! as a mad old fool. Others note that his well ran state and well trained army is likely to play an important part in future events.\n\nEast of §xKemerovo§!, another breakaway state led by a former §xCSR§! general can be found in §xKrasnoyarsk§!. The shaky democracy's future is uncertain; what is clearer is that §xNikolai Andreev§! and his fellow mutineers will fight tooth and nail to maintain their independence. Meanwhile, to the §xPrincipalty's§! south one can find the mountainous §xKarakorum Government of Oyrotia§!. Cut off from the §xCSR's§! central government, the small nation of Altai people and Old Believer refugees have united in their effort to avoid bloodshed and oppression for their religious beliefs.\n\nEast of §xKrasnoyarsk§! lies an expanse of villages and free cities. Imagining the area undefended would however be a dangerous mistake, for the §xSiberian Black Army§! zealously defends the region. Adherents of a particularly militarized variant of anarchism, the leadership of the §xBlack Army§! plots its next moves. All of Russia must be freed from statist oppression, beginning with Central Siberia.\n\nFinally to the north, the rump of the §xCentral Siberian Republic§! controls the city of Tomsk and the vast arctic expanses beyond. Many have written off the city of artists and thinkers as soft, decadent and unable to contend with the loss of a majority of its army to secessions and rebellions. Nevertheless, §xPresident Pasternak§! has not given up. Nearing the end of his life, the Poet President plans to entrust the rump §xCSR§! to a new political elite, one able to restore the §xCentral Siberian Republic§! to greatness.\n\nExhausted by war with the §RRussian Far East§! and civil conflicts for a few years, the rivalries of Central Siberia have begun to rouse the various warlords from their fragile peace. There is only enough room in Central Siberia for one nation, one heir to Bukharin's Industrial Cornucopia. The Soviet era's foundries and factories will cause yet more bloodshed as the unification wars begin!\n\n§G==FEATURES==§!\n\n*§xUnite§! the rich Central Siberian region and use it as a springboard to Russian Reunification.\n\n*§xManage§! your share of the Central Siberian industries, expanding it and dealing with worker's rights issues as the regional conflict heats up."

 REGIONAL_INFO_FAR_EAST: "§G==THE FAR EAST==§!\n\nThe §xRussian Far East§! is far and away the least populated region in Russia, and contains some of the most treacherous and hostile landscapes in the continent. The cataclysmic collapse of the §GSoviet Union§! did little to change this state of affairs, and even a far flung region such as this is now home to all manner of warlords seeking to stake their claim to Russia.\n\nIn the aftermath of the collapse, §GGenrikh Yagoda§! fled east with the remnants of the Soviet Presidium and reestablished order over the province of §GIrkutsk§!. From there, he has solidified an iron reign over the region that has frequently come into conflict with neighboring rival warlords such as the §RCentral Siberian Republic§!. It was not to last, however, as disaster soon struck.\n\nFrom the Manchurian city of §GHarbin§!, dark forces crossed the Amur and marched north to wage a bloody war of vengeance against §RBolshevism§!. §GKonstantin Rodzaevsky§! and his §GRussian Fascist Party§! were the tip of this invasion's spear, shattering Yagoda's influence in the East and establishing his own regime in the city of Zeya. It wasn't long, however, before Rodzaevsky himself was threatened with collapse.\n\nA "moderate" faction of the RFP led by §GMikhail Matkovsky§! grew disgusted with Rodzaevsky's admiration of the §RNazi invaders§!, and over time came to resent his dogmatic rhetoric. These tensions came to a head, and resulted in Matkovsky's loyalists snatching the key port of §GMagadan§! from Rodzaevsky's grasp. Sensing their chance, §GWhite Army§! remnants based in Harbin secured control over their old stronghold in §GChita§!. With a claimant of their own, one §GMikhail II§!, they plan to restore the monarchy to Russia by whatever means necessary.\n\nMeanwhile, The final threat to §GYagoda's§! power came in the form of a mutiny. Former NKVD officer §GValery Sablin§!, a young and idealistic revolutionary, seized control over the province of §GBuryatia§! and declared an open revolt against Yagoda and the Presidium. As of 1962, this war is still raging, and it is unclear who will come out on top.\n\nTo the north, the region has devolved into total anarchy. Very few have made their homes in this arctic hell, and there is not likely to be much in the way of action here. However, there are scattered rumors amongst the tribes and villages of the north of a §Gpowerful figure§! with the strength to reunify the nation...\n\nThe §xRussian Far East§! is a desolate and bloodsoaked land, and it is not likely to get any better until this wasteland is united once and for all.\n\n§G==FEATURES==§!\n\n*Defend the last remnant of the Soviet Union, or bring about its destruction.\n\n*Make the most with what you have in a desolate landscape.\n\n*Be wary of §Gthe North§!."

 REGIONAL_INFO_URAL: "§G==SOUTHERN URALS==§!\n\n§xThe Southern Urals§! represent the Russian Anarchy at its best and worst. To the west, §xThe Communes of Orenburg§! constitute thousands of citizens in its anarchic council, while the shrewd management of §xOrenburg§! itself has led to it gleaming brightly as the Gem of the Urals. While dysfunctional, §xOrenburg§! nevertheless represents the achievements of the Russian people even in this dark stage of their history. To the north sits the §xUral League§!, the paramilitary children of Vorkuta, who, after the union of both guards and prisoners in the 50s, have dedicated themselves to protecting the week and needy of Russia.\n\nTo their south, however, lies the §xDirlewanger Brigade§!. They are dastardly bandits, the result of in-fighting in the §RGerman§! ranks during the §xWest Russian War§!, Dirlewanger and his crew of only the most depraved criminals from the SS and Eastern Europe having carved themselves out a petty fiefdom in what was once §xOrsk§!. Their goal? §xOrenburg§!, and the great loot contained within. But he is not alone in this desire, for §xTrofim Lysenko§!, petty warlord of §xMagnitogorsk§!, also looks hungrily westward. The maddened remainder of the Soviet science program with his own pet army in the §x22nd Motor Rifle NKVD§!, §xLysenko§! plots his eventual invasion of §xOrenburg§! for the perfect opportunity to collect thousands of test subjects to create a secret weapon... a super soldier army capable of defeating the §RGermans§!.\n\nWhile §xOrenburg§! and §xThe Ural League§! will make natural allies in their defense against the bandits, §xLysenko§! is a pragmatist, and so is §xDirlewanger§!. It is likely that pacts will form, but the question is ultimately what to do once they outlast their use... and what to do if forces outside of the Urals some day come knocking to their door.\n\n§G==FEATURES==§!\n\n* A §xshort§!, five year game, aimed at defeating the opposing two (or three) factions in the Urals.\n\n* §xUnify§! the communes of Orenburg or handle Lysenko's waning §xsanity§!, §xravage§! Russia as the King of Bandits or §xprotect§! it as its staunchest defenders."

 REGIONAL_INFO_AFRICA: "§G==SOUTHERN AFRICA==\n\n§!From the Sahara's fringes to the Cape of Good Hope, Central and Southern Africa simmers with the aftershocks of conflicts both old and new. The §xReich's§! resurgence has not left the §bDark Continent§! untouched; its talons have gouged a sea out of its heartland, and its sons hold sway over a dominion past two thousand miles from end to end. But the glorious years have passed §xGermania§!. Now its grip loosens with every day bickering paralyzes the Volkshalle.\n\nNot all has fallen to the fascist menace, however. At the continent's tip burns defiant the §xUnion of South Africa§!, among the old Empire's last dominions across the seas - certainly the last of what had once stretched from Cape Town to Cairo. Its fortunes have waned since the war's end; with Namibia torn from its grasp and its own people split in three loyalties, Africa's last democracy flickers and wanes amidst incessant threats of secession, rebellion, and invasion. Nevertheless, the Union's men hold firm along the Orange River's banks, steeling themselves with the certitude of a death in defense of their homes.\n\nFor to their north stands a triumvirate of Africa's most powerful men: §bReichskommissars Wolfgang Schenck§!, §bSiegfried Müller§! and §bHans Hüttig§!, viceroys of a third each of the Reich's Mittelafrikan conquests. Though cartographers depict their lands as one contiguous stretch of pitch black the same shade as the Heimat's, each §xReichskommissariat§! cannot be any more different from the rest. Companies and mercenaries the world over loot §xZentralafrika's§! vast wealth unheeded as §bMüller§! eagerly plans his next hunting expedition. §bSchenck§! and his Luftwaffe dance among the clouds far above §xSüdwestafrika§!, heedless of the troubles plaguing his subjects below.\n\nOnly §bHüttig§!, master of the Dark Continent's true Aryan bastion and overseer of a million slaves, casts a frigid eye beyond §xOstafrika's§! borders. Few but his closest advisors can divine the plans lurking in the zealot's mind; with his tendencies, fewer bet they will bring the continent anything but misery and grief.\n\nIt is 1962, and the §xNew Order§! frays at its edges. Old enmities resurge as a thousand plans spring into action. Circumstance binds three desperate eagles into one hesitant, tenuous alliance. Far in the distance, like a thunderous tempest, war comes to spill blood onto the savannah's sands once more. Strap up your NF-LAG, pack your OD greens, and don't forget the old refrain as you wage the §RSouth African War§!: §xbravo don't surf.§!\n\n§G==FEATURES==\n\n§!* Fight a §Rconflict§! involving nations around the world, which may decide the Cold War's fate.\n\n* Set the stage for §bAfrica's§! future, with many possible outcomes in the continent.\n\n* New content - events, mechanics, nations - added since the previous demo."

 REGIONAL_INFO_AMERICA: "§G==THE AMERICAS==§!\n\n§PGuyana§!:\nThe situation in the §PRepublic of Guyana§! is tense, and grows worse with every passing day. The rights of §bIndo-Guyanans§! are continually being restricted or taken away by the iron-fisted president, §RForbes Burnham.§! Burnham himself is becoming increasingly combative and dismissive of the United States§!, who put him into power in the first place. As Guyana draws closer and closer to dictatorship, conflict seems §xinevitable.§!\n\n§RCanada§!:\n§RThe Dominion of Canada§! is, on paper, under the §wBritish Crown.§! In reality, she is far more shackled to her southern neighbor, the United States of America.§! As British exiles fled the isles, however, they brought much of their §wculture and more conservative ideals.§! This discrepancy with the local Canadians has led to a significant amount of friction between the native §GEnglish-speaking Canadians§!, the §QQuebecois§!, and the §wBritish exiles§!. As §RQuebecois terrorist§! groups like the §RFLQ§! and §RFUNQ§! grow larger by the day, Canada's problems are striking home in more ways than one.\n\nIceland§!:\nIceland is independent only in name, and is effectively a military protectorate of the United States§!. Nearly as many American soldiers live on the frigid island nation as there are §Gnative Icelanders§!. These Americans enforce law and protect the country from §xGerman influence§!, but also use Icelandic taxes, marry Icelandic women, and §wexploit Icelandic resources§!. In short, people are tired of American occupation and exploitation. It is a tense situation, at best, and §Rgrowing tenser by the day§!.\n\n§GMexico§!:\nHaving once prospered by staying away from other nations' wars, the §GRepublic of Mexico§! now seems poised to wage war on itself. Not a day passes by without squabbles erupting between the country's §Mprotectionist elites§! and the §Pambassadors of companies from New York to Tokyo§!. Moreover, the §wPartido Revolucionaro Institucional§! has shaped the country's image into the regime it had overthrown - a wealthy, maladroit, and contemptibly corrupt one-party state - to the chagrin of the many whose upliftment it had promised long ago. Mexico finds itself at many crossroads as the new decade trudges onward. Which fork it shall travel - §Rand what crises it shall invite§! - remain to be seen."
 
 REGIONAL_INFO_NO_CONTENT: "                                    §bWELCOME TO THE NEW ORDER\n\n§R                                    THIS NATION IS NOT PLAYABLE§!\n\n§RThis nation is currently empty besides placeholder events and other filler content for other countries to bounce off. All nations with content are listed in the "Interesting Countries" menu.\n\nPlease play one of those if you want any actual content, and follow us on our social media (as found in the MOD INFO tab) if you want to follow development!§!"

## Mod Features

 MOD_FEATURES_TEXT_1: "§x================\n==MOD FEATURES==\n================§!\n\n§b==ECONOMICS==§!\n§xThe New Order: Last Days of Europe§! features a complex §xeconomy§! mechanic. You can access your economic overview by clicking upon the §xdollar sign§! in between the §xproduction§! and §xconstruction§! tabs. The foundation of your national economy is your §GGDP§!, which will be the key to the economic prosperity of your state. Your §GGDP§! needs to be balanced out with your §Rdebt§!. Every year, interest upon your §Rdebt§! will be deducted as an expense, and ending up with too high of a §RDebt§! to §GGDP§! ratio could spell financial ruin.\n\nTo avoid troubling economic times, keep a watchful eye upon your §Gincome§! and your §bexpenditures§!. Your §Gincome§! is determined by multiple factors, the most obvious of which being your §GGDP§!. Many other factors come to play, however, such as your industry, poverty rate, academia, and much more! On the other hand, you have your §bexpenditures§!, the bane of any economist. §bExpenditures§! are a measure of factors such as military upkeep, social securities, construction projects, and more.\n\nIn §xThe New Order§!, balance is key. Reckless §bexpenditure§! can swiftly lead to high levels of §Rdebt§!, which can in time spiral into insolvency and §Reconomic meltdown§!. On the other hand, a carefully and cleverly guided economy can result in high levels of §GGDP growth§!, comfortable monetary reserves, and a bright future for your nation.\n\n§b==CUSTOM GUIs==§!\nMany of the countries in §xThe New Order§! feature expansive §GCustom GUIs§! designed to add more depth to your §Rgameplay experience§!, and make peacetime gameplay more interactive. §GDecision Custom GUIs§! are built directly into the §bdecisions tab§!, and can be accessed simply by opening the tab. This includes the §xTomsk Duma GUI§!, the §xSouth African Referendum GUI§!, and §Rmany§! others!\n\nOn the other hand, §GFull Custom GUIs§! are accessed via the §bpolitics tab§!, using a button located below your §xcountry leader's portrait§!, next to the §xHead of Government's portrait§!. These §GFull Custom GUIs§! tend to be much more in-depth, and are oftentimes vital to a country's §Rgameplay experience§!. This includes the §xUnited States Voting GUI§!, the §xSpeer Zollverein GUI§!, the §xJapan Legislature GUI§!, and §Rseveral§! others. Furthermore, most §GCustom GUIs§! also feature an §binfo button§!, which, when §Rhovered over or clicked on§!, will display helpful information on how the interface works and other features of the §Rintegrated mechanic§!.\n\n§b==OVERHAULED WAR==§!\n§RWar§! features heavily in §xThe New Order: Last Days of Europe§!. Players lead a military of the Cold War. Units have been nearly completely overhauled from Hearts of Iron IV. Helicopters and Air Cavalry ease ground attack and troop movement, and new tech trees devoted to §RAir Cavalry§! warfare have been developed. Armor featured in the mod is modern, with §GMBTs§! taking the mainstage on the battlefield and an entirely new armor setup. Players, however, should not forget about infantry and mobile infantry technologies. Armor and air technologies are no replacement for boots on the ground!\n\nOn the coasts, new naval technologies like §Rmodern aircraft carriers and stealth ships§! control the seas. TNO's reworked naval tech uniquely reflects the dynamic nature of warfare in the Cold War. In the air, the player may advance in bomber and fighter technologies that have been added to simulate the unstable world and wars of The New Order.\n\nPerhaps the most important decision any player must make is the future of their §Rmilitary doctrines§!. The introduction of long guerilla wars changed how wars were not just thought about, but fought. The blitz of the Second World War is no more, replaced by long slogs in hostile terrain. Victory is no longer a certainty, and a player's choices must reflect this. §ROrders of Battles§! have been changed and units shifted around to reflect this reality. §xThousands of new generals§! have been added to give the player a diversity of characters to lead their armies."
 
 MOD_FEATURES_TEXT_2: " "