 COUNTRY_INFO_JAPAN: "§G==THE EMPIRE OF JAPAN==§!\n\nThe Jewel of the East. §bThe Land of the Rising Sun§!. Dai-Nihon Teikoku. The Empire of Japan goes by many names, but none are disputing its status as the hegemon of East Asia. Following a grueling victory in the Second World War - a victory paid for in §Rblood and iron§!, §Gthe Empire of Japan stands triumphant§! in Asia, from the frigid waters of Sakhalin, to the bustling metropolis of Tokyo, to the far reaches of Calcutta and New Guinea.\n\nOn the surface, Japan has everything it could have ever wanted in 1962. The Zaibatsu champion §GAsia's economic growth at breakneck speed§!. The Imperial Japanese Navy§! is the most powerful maritime force in the world, from Tokyo Bay to San Francisco. The §OImperial Japanese Army§! is the enforcer of Tokyo's will throughout most of Asia. Most prominently, it guards Japan's crown jewel, and a once-immutable enemy, §RChina§! - now brought to heel. The politicians in Tokyo bicker, but the Taisei Yokusankai has stood strong for over twenty years, heralding a Shintaisei - a §GNew Order§! over both Japan itself and Asia, led by the conservative §xHiroya Ino§!.\n\nHowever, deep beneath this seemingly perfect victory lies a §Rbubbling cauldron of threats§! to the Empire's hegemony. In China and Southeast Asia, winds of dissent are brewing. The §OImperial Japanese Army§! is overstretched - there's only so much ground one force can cover thoroughly. Across the Pacific, the United States seems poised to avenge their defeat nearly twenty years ago. Deep inside Japan itself, the labyrinthine structure of the state hides a deep rot of corruption and deceit, one that is slowly working its way to the surface, and could potentially threaten the §Rvery foundations§! of the Japanese Empire.\n\n==FEATURES==\n\n- Course Japan's political destiny through §xunique parliamentary and ministerial mechanics§!.\n\n- Maintain your hegemony across the Co-Prosperity Sphere, through both diplomacy and §Rwar§!.\n\n- Engage in a grueling narrative of deception, deceit and corruption."
 
 COUNTRY_INFO_1_GER: "§G==DAS GROßGERMANISCHE REICH==§!\n\nIn the past century, Germany has experienced incredible change, power and weakness, peace and catastropic bloodshed.\nOut of the humiliation of the §RFirst World War§! and the interlude of a short, troubled republic,§RNational Socialism§! arose. Bent on taking revenge and achieving Lebensraum,  colonial territorry in the East, the 3rd Reich crushed the Allies and the Sovjets in battle.\n\nGermany proclaimed a New World Order, and asthey set foot on the moon,  it was believed to be eternal. The death of the Führer however led to crisis, as his sucessor Albert Speer was challenged by his opponents within the NSDAP,  leading to months of war, violence and destablisation of Germany's sphere.\n\nThe Reich's economy, relying on slave labour, would have collapsed, and Germany  fallen into even more destruction, if it were not for Speers reforms.\n\nAlthough highly controversial among the more conservative party members, they were sucessfull in creating immensive economic growth, restoring the Reich's power, and ending the institution of slavery, which had become a heavy burden on its prosperity. His policies,  dubbed 'New German National Socialism' were contested and even resulted in uprisings from both more conservative and liberal sides, but ultimately prevailed. However,  the iron grip of the party was to stay Advocates for further, even democratic reform, such as Helmut Schmidt, were exiled or arrested, while the more traditional,  Hitlerite party wing declined, as many of its leaders were suspected of treason. Führer Speer was suceededby Hans Speidel, and then by Speer's Son Albert Friedrich Speer,  both of them attempting more radical, pro-democracy reform.\n\nHowever, Albert Friedrich Speers efforts were for nothing, as the Reichs failure to defendMoskovien in the  2nd West Russian War against the now-restored Sovjet Union led to a coup within the party, headed by Martin Mußgnug. Speer was reduced to little more than a puppet,  with Mußgnug and his loyalists in control of most of the Government, ensuring Germany would not stray from his father's path.\n\nBut Speer has not given up. Many within  the party support him, and a battle for influence has begun in the capital of Germania.\n\nMußgnug also faces oppositonfrom a reactionary resurgence movement within the NSDAP, with Deckert at its head, aiming to undo Speer's reforms and returning to the ways of Hitler.\n\nAnd in the Shadows lurk the demons of Himmler and his SS, the most radical of them all.Although Heinrich Himmlers rogue state has been destroyed, an insurgency by fanatical SS members still haunts the Burgundian Occupation Zone, and rumours suggest that Himmlerite Terror Cells are spread throughout the Europapakt.Currently, Germany stands on top of the World again. Its economy is even above that of the United States, and its military, although defeated in the West Russian War, is still possibly the most powerful on earth. On the surface, Germany appearscalm and confident, its society satisfied - but soon, cracks might show up behind the surface...!\n\n==FEATURES==\n\n- Maneuver the massive entitiy of the §oNSDAP§! and its factions.\n\n- Strengthen, expand and reform the §xEuropapakt§!.\n\n- §xLead the Reich into the 21st Century§!, increase its wealth and secure its interests abroad."
 
 
 
 
 
 
 
 
 
 
 
