 #TNO_OPENING_DESC: "Welcome to The New Order: Old World Blues! Old World Blues is a demo for The New Order: Last Days of Europe and much smaller in scope than the released mod will be. In this demo, you will be able to fully enjoy four nations: The noble Ural League, the proud communes of Orenburg, the foul bandits of the Dirlewanger Brigade, and the ever-plotting Lysenko of Magnitogorsk.\n\nYou will find these nations fully playable for a bit over five years, primarily for the duration that they are all killing one another. The New Order does not play like many other mods, and is as a narrative experience as much as it is a gameplay one, though you will find the Southern Urals to be fairly gameplay driven regardless.\n\nAll other nations in the mod have had their content removed for the purposes of this demo. However, you will notice the world still changing as the demo progress, giving you hints at what else is to come!\n\nIf you are interested in the mod and like what you see here, please like and favorite the mod, and check us out on social media! You can find links to our Discord, Reddit, and several other sites on the main menu, as well from our Steam page.\n\nThe New Order has been created due to the tireless efforts of numerous developers, contributors, artists, writers, moderators, and a plucky composer. I started this mod over five years ago now, originally for Victoria 2, and it was a very different mod then. Now, for almost two years, me and my team have tirelessly been turning The New Order from a little pet project into something we can all truly be proud of. Over two hundred people have at some point contributed to our project, not counting the numerous donations of work and time given to us by our friends in the HOI4 Modding Coop and beyond, an organization I helped found and am proud to stand by to this day.\n\nWe have faced numerous challenges, but have been blessed with a community that has stood with us through it all. For their patience, dedication, and love, we wanted to reward them and give something back. To our beautiful community, this is for you. Thank you all so much. We are humbled every day just thinking of the great expectations and the amazing support you have given us.\n\nThank you everyone, and please enjoy the demo! There is so much more to come from us, and we hope you will be there along the ride!\n\n~ThePinkPanzer, Lead Developer.\n\n\n\n\n\n"
