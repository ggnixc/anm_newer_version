 #NATIONAL SPIRITS
 FNM_The_Finnmark_Situation: "The Finnmark Situation"
 FNM_The_Finnmark_Situation_desc: "Thanks to Soviet support and with Germany distracted by the 3WRW, the Norwegian resistance under Arne Treholt and his FNF will rise up in the isolated northern provinces of Norway, mainly in Finnmark. This rebellion sends the collab government into crisis and prevents the EP from sending troops to fight the Russians in the Far North."
 FNM_Loyal_to_Marx_and_Harald: "Loyal to Marx and Harald"
 FNM_Loyal_to_Marx_and_Harald_desc: "While many in the resistance’s political wing are self-declared Marxists and Republicans, a significant number are non-Socialists who wish to return the Monarchy and the Government in exile. This division between two different visions for Norway has caused infighting within the FNF."
 FNM_Limited_Supply_Lines: "Limited Supply Lines"
 FNM_Limited_Supply_Lines_desc: "The Northern Norwegian Provinces are very isolated from the rest of Norway and its neighbouring states, making supply lines within Finnmark towards it precarious at best due to limited routes, freezing temperatures and sparse population."