 Pakt_Leader: "Paktführung"
 Pakt_Leader_effect: "[!Pakt_Leader]"
 Pakt_Leader_desc: "The Europakt is a pan-European alliance, with Germany being its most influential and leading power. It is a merger of the military alliance of the Unity-Pakt and the Zollverein Economic Union, unifying the German Diplomatic Sphere under a single Block of Nations, the Europakt. With freedom of trade, joint economic programs and a planned common currency, the Europapakt has created a massive European market, an economic and military behemoth.\nGDP growth modifier: §G[?global.europaktgdpgrowthmodifier]§!"
