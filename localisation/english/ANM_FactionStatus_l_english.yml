 ### Europäische Pakt ### 
 Pakt_Leader: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n£sphere_middle_east_icon Mitteler Osten Verteidigungsbündnis\n--------------\nPaktführung"
 Pakt_Leader_effect: "[!Pakt_Leader]"
 Pakt_Leader_desc: "The §BEuropäische Pakt§!, commonly known as the Europakt, is the Pan-European alliance of the Nazi New Order. It is the instrument of European Brotherhood and Unity, guided by the German hegemon. The Europakt consists of many charters, detailing the economic, military and political relations of its many member states, each ultimately designed in German interest. With its unparalleled control over European affairs, the §BEuropäische Pakt§! truly is the lynchpin of European destiny - and Germany, the undisputed §BPakt Leader§!, is the Master of Europe."

