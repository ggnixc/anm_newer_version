 #Communist International
 COM_Member: "Member of the Communist International"
 COM_Member_desc: "GDP Growth Boost: 5%§!\n\nThis nation is a fully independent member of the Communist Internationale, aligned with the Union of Soviet Socialist Republics to liberate the workers of the world. Such nations may or may not align with Moscow's Ideological Line and may take a more independent stance in determining the Socialist System within their own borders. Nevertheless, they will join a war should any other member get attacked."
 COM_Member_displaykey: "GFX_COM_Member"

 COM_Satellite: "Satellite State of the Communist International"
 COM_Satellite_desc: "GDP Growth Boost: 5%§!\n\nThis nation is a satellite state of a member within the Communist Internationale. They will have to tow the ideological lines and practices of their master, and cannot deviate from the intepretations of Marxism by their overseer. Additionally, this nation will have to take a stance in international diplomacy and foreign conflicts with their suzerain."
 COM_Satellite_displaykey: "GFX_COM_Satellite"

 COM_Observer: "Observer of the Communist International"
 COM_Observer_desc: "GDP Growth Boost: 5%§!\n\nThis nation is an observer state of the Communist Internationale. While they are a Communist or Socialist nation, they are not obligated to take part in wars of the Communist Internationale nor are mandated to take part in economic activities. Such a status is usually granted to nations far away from the Union of Soviet Socialist Republics, whereby their full participation would be impractical."
 COM_Observer_displaykey: "GFX_COM_Observer"
