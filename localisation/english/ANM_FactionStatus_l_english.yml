 ##Levantine Union
 Levantine_Union_Member: "Levantine Union Member"
 Levantine_Union_Member_effect: "[!Levantine_Union_Member]"
 Levantine_Union_Member_desc: "GDP Growth Boost: 3%§!\n\nThe 'Levantine Union' emerged as agreements on Free Trade within the Levant and Security Promises to threats outside the Levant such as the Republic of Turkey in the Successful Jerusalem Conference that the Italian Empire offered to the various Negotiating Parties and Ethnicites following Italy's Victory in the Middle East War. Israel's second Prime Minister, Shimon Peres, has deliberately made this union much more comprehensive; he attempted to create a Levantine identity through joint cultural projects. There was great hope that the Levantine Union would eventually become a Confederation one day, and several politicians in Palestine and Lebanon even offered a single currency and an internal market, however, after Shimon Peres' time in power, the Levantine countries seemed to prefer to continue with the status-quo rather than expedite the process of integration."
 Levantine_Union_Member_displaykey: "GFX_Levantine_Union_Member"

 #PALF
 PALF_Faction_peace: "Member of the Pan-African Liberation Front"
 PALF_Faction_peace_desc: "GDP Growth Boost: 5%§!\n\nBorn in the fires of German terror bombings and the revolutionary halls of Yaoundé, the Pan-African Liberation Front has dedicated itself to the liberation of Africa from the colonialist devils that wrack it. Based primarily in Cameroon, the organization crosses borders and cultures, striving for one goal- freedom and unity for all Africans.\n\nPan-Africanism is not without its opponents, of course. The Germans and English occupy everything south of the Sahara, the Italians control much of what's left, and the rest is snapped up by Iberians and French alike, leaving only slivers free. Still, the PALF fights on, waiting for its opportunity- an opportunity which will surely come, for nothing can hold the African people down forever."
 PALF_Satellite_peace: "Liberated Satellite"
 PALF_Satellite_peace_desc: "GDP Growth Boost: 2%§!\nGDP to Sphere Leader Modifier: 7.5%§!\n\nThis nation is a Liberated Satellite, and has been freed by the Pan-African Liberation Front from the forces of colonialism and reaction. Its newly formed administration has chosen to cooperate with and be supervised by the Front in order to dismantle the remnants and legacies of imperialism. This nation and its leadership now follow the principles of Pan-Africanism, and work towards creating a united Africa, even if they are still nominally independent from their allies at this time. United by a common ideology, these Liberated Satellites shall work alongside the Front in order to create a new future for Africa."
 PALF_Faction_displaykey: "GFX_PALF_Faction"
 PALF_Satellite_displaykey: "GFX_PALF_Satellite"

