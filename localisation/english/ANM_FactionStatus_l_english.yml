 shortdescriptionofKdNmandate: "§MKoalition der Nationen - Mandate§!"
 shortdescriptionofKdNobserver: "§MKoalition der Nationen - Observer§!"
 shortdescriptionofKdNnormalmember: "§MKoalition der Nationen - Member§!"
 shortdescriptionofKdNcouncilmember: "§MKoalition der Nationen - Permanent Security Council Member§!"
 longdescriptionofKdNmandate: "The KdN was made to prevent international crises and devastating conflicts from happening. Unfortunately, peace remains a distant dream for many in the troubled areas of the world. For this purpose, KdN mandates are set up in certain regions which require international administration. Although nominally serving stability and the protection of civillians, they are at the mercy of the KdN Security Council, and can be used for their own benefit."
 longdescriptionofKdNobserver: "Although this nation cannot vote in the KdN Parliament and does not have the same status as a member state, usually due to not being recognized by other member states, it is heavily connected to the KdN institutions."
 longdescriptionofKdNnormalmember: "A brainchild of the Speerite foreign policy and German-American-Japanese attempts at de-escalation of the Cold War during the 70s, the Koalition der Nationen, Coalition of Nations, or KdN for short, is a powerful international institution for the purpose of preventing war, advancing international cooperation, and being a forum for international diplomacy. KdN membership is seen as the 'legitimisation' of a nation in front of the international community, and allows it to vote in the KdN parliament."
 longdescriptionofKdNcouncilmember: "Originating from the three major KdN members at the time of its foundation, Germany, America and Japan, the Permanent Council Members of the KdN security council hold enormous power over the international community. They decide on KdN intervention across the globe, and administrate the KdN Mandates. Multiple powers aspire to be on the permanent council, and be granted the rank of permanent member."
