 Republic_of_China_Autonomous_Region_effect: "[!Republic_of_China_Autonomous_Region]"
 Republic_of_China_Autonomous_Region_desc: "Due to Dr. Sun Yat-sen’s theory, China shall let the provinces and the same-level regions have their own power to rule their people, and that’s why “The Autonomous Region” has been built: these places’ situation doesn’t fit the laws and policies that set by the Nanking Government, so the central government set semi-constitutional laws and gave powers to the regions’ government. As time flies, the iron bar set by the central government may have changed, but there’s a strict rule that every autonomous region governor should know: never betray the country, thinking about some ridiculous thought such as independence..."
