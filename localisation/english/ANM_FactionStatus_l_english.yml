 ### Europäische Pakt ### 
 Pakt_Leader: "Paktführung"
 Pakt_Leader_effect: "[!Pakt_Leader]"
 Pakt_Leader_desc: "The §BEuropäische Pakt§!, a single block of nations unifying the German Diplomatic Sphere, was formed following a merger between the military alliance of the Einheitspakt and the Zollverein Economic Union. Member states enjoy freedom of trade, joint economic programs, and the copious advantages that will come with the Euromark, the union’s common currency, all under the banner of Pan-Europeanism and Germania.\n\nThe §BEuropäische Pakt§!, the world’s largest economy, is inhabited by a pure Aryan race, and protected by the most powerful army the world has ever seen under the German Reich, also known as the Paktführung. Our Prosperous and Dominant Empire is the envy of the world!"

