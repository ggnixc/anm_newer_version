 POLITICS_OLA_IBRAHIM_DESC: "Born as Ola Sa’ad Ibrahim in 1955. Young Ola was just eleven years old when the pan africanists went on their war path from Cameroon and stopping only when the French forces routed them on the Ivory Coast. The Cameroonians quickly took over his town and Ola’s childhood abruptly ended. He managed to survive the occupation of his hometown either by luck or by his wit but many of his fellow citizens were not that lucky. Only after the joint French and GBEuba forces routed the pan africanists and liberated Ilorim did Ola found out his true calling - the armed forces of GBEubaland.\n\nIn the following years he enlisted in the Free French navy as the relations between the two countries were friendly and he quickly ascended from a regular seaman to an officer in the Free French Navy, a position that granted him the right to study in their officer schools. But fate would not have it for Ola because a wave of radical reforms and the Gaullists party fall from grace paved the way to the racist regime of Renaud Camus so Ola finished his military education at the newly established Lagos Naval Academy. Being one of the most experienced naval officers in GBEubaland he was quickly approached by the now Marshal of the GBEuba people Ipoola Akinrinade to create an adequate navy for his country. Up until Ipoola’s death Ola Ibrahim did his job diligently, transforming the small navy into a somewhat formidable force but the sudden death of Ipoola in the mid 90s opened for him a much better job opportunity - the new marshal of GBEubaland.\n\nToday he is the most influential person of military origin in the council and a clear favorite in the upcoming elections that will determine the course of leadership for GBEubaland."
