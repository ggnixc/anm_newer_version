 POLITICS_LADOKE_AKINTOLA_DESC: "GBEubaland was not always free. It had to earn its independence from the yoke of the Cameroonian pan-Africanists, and key to its foundation was Ládòkè Akintola. When a circle of generals and officers rose up to end the socialist regime over his homeland, finding the skirmishes between them and Zentralafrika as the perfect opportunity, Akintola became their leader and figurehead. Under his command, the Cameroonians were driven out, and since then GBEubaland has managed to hold off any attacks made by them to reclaim their lost lands. And the nations of West Africa are thankful for that, for they are shielded from the pan-Africanists and can continue living in peace.\n\nHowever, things are not as clear and hopeful in Akintola's domain itself. The people admire him, and are thankful that he is there to safeguard the coast from any foreign invaders. And while he may he a dictator, he is not a brutal or a militaristic one, but rules benevolently over his citizens. This despotism will eventually have to end, though. Of course, the last thing he would want would be for the socialists to take power, even though he himself is implementing policies surprisingly similar to their own. Welfare has been established, and many freedoms have been given. As for actual elections, that is a complicated matter for Akintola. Perhaps a number of selected parties could participate in an electoral process, but how can he be so sure that his successors will be able to hold the country together, without the coast of GBEubaland falling to his enemies. He is not, and that is why installing democracy may not be that easy. For now, though, Akintola is content to continue his rule over the strip of land he can control, even if only to keep his enemies out."
 POLITICS_GBEUBAN_MILITARY_COUNCIL_DESC: "The GBEubaland Military Council was born from strange circumstances. After the loss of the West African Wars, the Socialist government was replaced with the previously in charge Samuel Ladoke Akintola who had been ousted by the pan-Africanists. Akintola would pass away in 1970, leading to his hand-picked successor, Ipoola Alani Akinrinade taking power.\n\nIpoola's rule would see the transformation of GBEubaland into the nation it is today. Democratic reforms were halted, political parties banned and the government officially became a military-ruled state. The international reaction to this was mixed, some praising the honesty of the move, while many disdaining the open authoritarianism. GBEuba's presidency was abolished, with the title of Marshall of the GBEuba people adopted for the head of state.\n\nIpoola's rule would be marked by a remarkable lack of corruption, despite the military regime. Encouraging foreign business and courting all major factions worldwide, GBEubaland's economy would see growth. This relative stability and growth would slam into a brick wall when Marshall Akinrinade passed away from a stroke.\n\nNow the Council itself, a clique of officers and bureaucrats from all sections of GBEubaland now find themselves ruling a country with no leader. The everlasting debate on who should succeed the Marshall. The factions mainly have split along three lines, the military supporters, who wish for a continuation of the military council, the socialists, who cite Ipoola's remarkable similarity and light hand to socialist movements. Finally, there are the bureaucratic faction, who wish for an end to the military council itself, and the establishment of a civilian Republic."
 POLITICS_BOLA_TINUBU_DESC: "Bola Ahmed Adekunle Tinubu was born in 1952. Born in Lagos he was 14 when the West African War started and was quickly employed as a child soldier for the GBEuban Army. He managed to survive the siege of Lagos by the Cameroonian forces and escaped the imminent encirclement of his hometown, a move he greatly dislikes even more than thirty years later. He fought till the war's end, seeing first hand the destruction of his country by the socialist troops as they were retreating back towards Cameroon when the war went south for them. When the war came to an end and Samuel Akintola was reinstated as the president of GBEubaland, Bola discharged from the army and pursued a more peaceful profession of being an accountant and helping his mother in her business endeavors that brought him and his family great wealth. It was this wealth that landed him various high ranking positions in the cabinet of Ipoola Akinrinade where he oversaw the distribution of foreign aid money that was granted to them by the Western countries. It was here when Bola was first acquainted with the idea of democracy as he made many international friends, especially from the United States. After the death of Ipoola Akinrinade he was one of the founders of the “Military” council as an representative of the bureaucratic faction and loudest proponent of a swift democratization of GBEubaland, citing that after four decades of military rule GBEubaland is finally ready to become a democratic country but many from the army are skeptical or downright against the idea of democratization as they fear it will lead GBEubaland to its doom."