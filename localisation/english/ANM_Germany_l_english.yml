 GER_flavour_event.20.t: "Face the Music"
 GER_flavour_event.20.desc: "Katharina sat in the courtroom dock, shoulders curled pitifully over her heaving chest. Her unwashed hair, damp with sweat, clung to a lumpy forehead beaten black and blue.\n     “This concludes the examination.” An elderly judge, backdropped by the standard of the Volksgerichtshof — the People’s Court — adjusted his round spectacles. Hitler, the Father, Spiedel, and the Son, immortalized as a quartet of bronze busts, flanked the polished wooden bench at which he sat. “Does the defense have any statements at this time?”\n     A small crowd of tears wobbled from Katharina’s quivering chin. She hung her head as low as it could go, already knowing her attorney’s answer: “No, Your Honor.”\n     “Very well. Before I render my verdict, would the accused like to offer any final statements?”\n     Trembling hands concealing her face, Katharina gasped for air between strained sobs. “I...I’m sorry...” She mumbled softly, not bothering to lift her head. What was she supposed to say? Did it even matter?  Her friends and family had all abandoned her, leaving her utterly powerless and utterly alone. “I...I...”\n     The judge eyed the clock mounted on the wall. Nearly twenty minutes had passed since this shrill, hysterical woman had been paraded into the courtroom — if he wanted to remain on schedule, he’d need to wrap things up, and fast. “Apparently not. Moving on...”\n     “W-Wait! No!” The weight of the world, like lightning to a reanimated corpse, jolted Katharina to attention. “No, no no! Please, you can’t do this—”\n     “Quiet. You’re clearly in no state to offer anything of value to these proceedings.” The judge turned to face the sparsely-attended galley. “Ladies and gentlemen, this court has been presented with irrefutable eyewitness accounts of the incident in question. What’s more, numerous character witnesses have testified to the defendant’s Jewish predilections and subversive tendencies.”\n     “P-Please! Wait! I’ll do anything! Anything!”\n     “Regarding both charges — sedition and aggravated assault against an NSDAP official — the People’s Court of Baden-Württemberg finds the defendant, Katharina Bronner, guilty on all counts. The defendant is hereby sentenced to death with no possibility of appeal.”\n     A haunting duet — the pounding of the gavel, and a quivering moan of despair — filled the stuffy courtroom."
 GER_flavour_event.20.a: "“This court is adjourned.”"
