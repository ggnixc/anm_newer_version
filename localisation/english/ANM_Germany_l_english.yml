 ## Flavour Events ##
 GER_flavour_event.1.t: "Kids These Days"
 GER_flavour_event.1.desc: "Basking in the pale glow of an aging CRT, Konrad shook his head. Sometimes, he wished he’d never bothered to learn English.\n     His teenage daughter Katharina had left the TV running on one of her favorite channels — MTV — that awful network that poisoned the airwaves with nothing but trashy American pop music. Currently playing was some vulgar song by an artist called ‘Eminem’. Or was his name Slim Shady? The refrain certainly seemed to drive that point into the ground.\n     Konrad couldn’t believe his ears. Impregnating Spice Girls? Fat pounds of grass? Stapler-assisted genital mutilation? Were the children of Germany really exposed to this utter filth on a daily basis?\n\nChanging the channel only provided momentary relief. The next network, some low-budget operation he’d never heard of, was playing another dull, cookie-cutter soap opera. Click.\n     A balding, half-dead NSDAP official droned on about adding more bike lanes to a city 200 miles away. Why was this on the local news? Click.\n     A game of...badminton?! Wait, did people really watch this? Willingly? Click! Click! Click!\n\nAt last, Konrad perked up — something remotely entertaining had finally appeared on the screen. A quiz show — the kind of program where contestants could earn huge sums of money for answering a series of increasingly-obscure trivia questions.\n     Backdropped by a buzzing studio audience, the sharply-dressed host turned to the contestant. “Ten seconds on the clock.” he smiled, “In which Swabian city was our nation’s third Führer, Hans Spiedel, born?”\n     “U-Uh...” The contestant, a young woman, looked as if she had seen a ghost. She glanced blankly at the camera, nervously twirling a lock of hair around her finger. “Well, if I recall correctly, I believe the answer is, uh...”\n     The timer hit zero. A sharp buzz cut off the woman’s stammering response.\n     “So sorry, ma’am...” The host tilted his head in what was certainly feigned sympathy. “Time’s up.”\n\nKonrad held his head in his hands. It took everything in his power not to chuck the remote through the TV."
 GER_flavour_event.1.a: "“It was Metzingen, you moron! What are they teaching kids these days!?”"
 GER_flavour_event.2.t: "The Burgunders"
 GER_flavour_event.2.desc: "Katharina wandered beneath the amber glow of buzzing street lamps, fingers clasped around the pillowy straps of her book bag. The excessive layers of clothing she wore were more fit for an Antarctic expedition than a stroll through the park, but the seventeen-year-old hardly cared. There were few things she hated more than the cold.\n     Mind teeming with worries, she paid little attention to her surroundings as she walked along the hedge-lined path. She’d soon need to work up the courage to ask Klaus to the dance...but how? It was embarrassing to admit at her age, but she’d never asked a boy out before, and—\n\nKatharina squeaked as a raspy, boisterous laugh erupted from behind the hedge. Clutching her thumping chest, she considered bolting home — but her simmering curiosity kept her feet firmly rooted to the sidewalk.\n     Swallowing her apprehension, she peeked through the dense leaves. Hidden behind the hedge was an encampment of a dozen or so homeless people — some milling about, others sleeping beneath patchy blankets. Shopping carts filled with random belongings were stationed beside makeshift tents fashioned from tattered tarps.\n\nBurgunders. In school, Katharina had learned about these refugees of Himmler’s deranged shadow state, but never imagined she would stumble across them here in Stuttgart.\n\nA sudden shout pulled her attention toward an emaciated figure limping into the camp. A tattered bag was clutched in his hand; he held it over his head as he approached. The others clambered toward him, eagerly exchanging cash, jewelry, and other valuables for small plastic bags filled with a white, crystalline substance.\n     Scattering like roaches, the Burgunders snorted and smoked their prizes, some barely able to hold their pipes in their trembling, skeletal hands. One after another, their lethargic behavior turned manic — some danced around, some started fights, while others wandered aimlessly, speaking in slurred, broken sentences with people who weren’t there.\n\nKatharina’s face wrinkled at the unnerving sight. Hands clutched close to her chest, she rushed home, swearing not to mention a word of this to Papa. If she did, that would certainly be the end of her treasured strolls through the park."
 GER_flavour_event.2.a: "Just say no to drugs."
 GER_flavour_event.3.t: "Smoking near the Gunpowder Barrel"
 GER_flavour_event.3.desc: "REICHSNACHRICHTENDIENST REPORT THE POLITICAL SITUATION WITHIN THE EMPIRE OF IRAN \n\nAGENT(S) INVOLVED:  R. ULLRICH, E. SPECKMANN, S. MITTERMEIER, M. REZA PARASTUI AND H. QAEDI\n—-----------------------------------------------\nIN RECENT MONTHS, THE CONTENTIOUS POLITICAL SITUATION WITHIN THE EMPIRE OF IRAN HAS CONTINUED TO DETERIORATE AT AN ALARMING RATE. THESE CONTINUED ESCALATIONS CAN BE ATTRIBUTED TO THE FOLLOWING FACTORS, IN NO PARTICULAR ORDER:\n\n1) RADICAL SECTARIANISM. RELIGIOUS TENSIONS BETWEEN THE TWO MAIN BRANCHES OF ISLAM — SUNNIS AND SHIAS — HAS BEEN A PERSISTENT PROBLEM IN IRAN FOR DECADES. IN RECENT YEARS, THESE TENSIONS HAVE ESCALATED TO POGROMS, TERROR BOMBINGS, AND OTHER ACTS OF INTER-ETHNIC VIOLENCE.\n\n2) SOVIET INFLUENCE. SINCE THE REUNIFICATION OF THE USSR, BOLSHEVIK AGENTS HAVE BEEN DEPLOYED TO IRAN’S MAJOR URBAN CENTERS TO PROSELYTIZE RADICAL COMMUNIST IDEOLOGIES. THESE EFFORTS HAVE PROVEN LARGELY SUCCESSFUL; OUR INTELLIGENCE INDICATES CONSIDERABLE SUPPORT FOR LEFTIST CAUSES IN IRAN, PARTICULARLY AMONG THE 18-29 AGE COHORT.\n\n3) ECONOMIC INEQUALITY. LACKLUSTER ECONOMIC RECOVERY FROM THE 1970 IRANIAN CIVIL WAR HAS LED TO ABYSMAL LIVING STANDARDS THROUGHOUT THE EMPIRE COMPARED TO PRE-WAR FIGURES, PARTICULARLY IN AREAS WITH CONCENTRATED POPULATIONS OF ETHNIC MINORITIES. THIS LOPSIDED ECONOMIC RECOVERY HAS LEAD  TO THE PROLIFERATION OF RADICAL NATIONALIST SENTIMENT, PARTICULARLY AMONG THE KURDISH AND AZERI  ETHNIC MINORITY GROUPS.\n\nTHE IRANIAN SITUATION IS PERILOUSLY UNSUSTAINABLE. OUR INTELLIGENCE SUGGESTS THAT, IF CONDITIONS CONTINUE TO WORSEN UNDER THE CURRENT TRAJECTORY, A PROTRACTED CIVIL CONFLICT IS LIKELY WITHIN THE NEXT THREE YEARS."
 GER_flavour_event.3.a: "Let’s hope the Shah can keep it together."
 GER_flavour_event.4.t: "A Debate on the Weltnetz"
 GER_flavour_event.4.desc: "(GER) VideospielMeister3341: lmao it is truly mind blowing how stupid the Americans on this forum are. Some fucking r****d just claimed Speer Sr. set up the slavery system. He was the one who fucking abolished it! Hypocritical yankees don’t like the fact, but Germany has done a whole lot more for freedom and equality than they ever did.\n\n(SWE) Gast1452: lol ok dumbass...sorry but who gives a shit. speer was still a nazi scumbag and he’s burning in hell...when will people finally learn from the past?? one day black gold and red will replace the swastika…\n\nUSA) ProSkaterKidd: YEAH LMAO NO ONE CARES KRAUT THE SOVIETS KICKED UR ASS IN 1981 AND THEY’LL BUTTFUCK YOU AGAIN\n\n(GER) VideospielMeister3341: ProSkater, are you seriously proud of the Soviets? Do you really think they’re better than Germany? They committed so many atrocities in the 2nd West Russian War it’s not even funny. You seriously need to educate yourself.\n\n(USA) ProSkaterKidd: I DONT GIVE A SHIT F****T THE ONLY GOOD GERMAN IS A DEAD GERMAN THE SOVIETS DIDNT KILL ENOUGH OF U FUCKHEADS IN LENINGRAD\n\n(UK) PrestigeChoose: bro turn off caps lock\n\n(GER) VideospielMeister3341: Average brainwashed American. When Germany does something, it’s genocide, but when America or its allies does something, it’s in the name 'freedom’. Need I remind you of the genocide of Native Americans perpetrated by your founding fathers?\n\n(USA) ProSkaterKidd: EAT SHIT NAZI F****T\n\n(GER) VideospielMeister3341: Wow, great rebuttal.\n\n(ITA) Birdmast84: LOLOLOL he’s mad\n\n(GER) xXxSchwarzeSonnexXx: Hahaha Videospiel still believing in the degenerate Reich. I needed this laugh. I wish the Ordenstaat were still around so I could laugh as you and your whole family got shoved on a train bound for Rodomo.\n\n(GER) Kornorks: Alright, that’s it. Thread locked. You people need some fucking therapy..."
 GER_flavour_event.4.a: "Anonymity doesn't always bring out the best in people."
 GER_flavour_event.5.t: "Fish Out of Water"
 GER_flavour_event.5.desc: "Franz had been pedaling for so long, he could hardly feel his legs anymore.\n     A few days ago, the hit counter on his GeoCities blog “Journey Across The Wild East!” had finally reached 1,000 — the whole reason why he found himself in his current unenviable position.  Here he was, deep in the vast Ukrainian countryside, sweating buckets and lugging around a dead camera in his backpack. All in the name of delivering some ‘unique content outside of big cities’ for random strangers he’d never met.\n     Franz cursed as he turned the corner, snapping a branch off of the first tree foolish enough to get in his way. All he wanted was a cold beer and a warm bed — but to do that, he’d need to find some sign of...\n\nThe enticing aroma of baking bread tore Franz away from his racing thoughts. He glanced up. A small village peeked over the horizon.\n\n“...Civilization?”\n\nDitching his bike in the tall grass, Franz dashed toward the nearest hut and knocked thrice. The place had seen better days — apart from a handful of electrical wires poking out of the wall, the small dwelling looked like it hadn’t been renovated since the Kievan Rus.\n     The door creaked open slightly. An old, frail-looking woman peeked through the crack. “Hm...?”\n     “G-Good evening, ma’am!” Franz smiled, still panting like a dog. “Sorry to bother you, but do you speak German?”\n     “U-Um...” The woman opened the door a few inches more. Her furrowed brow and forced stance betrayed her obvious discomfort. “Yes, sir. Is there a problem? I can assure you, we are all good, upstanding people...” \n     Franz’s squared shoulders relaxed at the sound of his native tongue, heavy accent or not. “Thank goodness! Listen, I’m a tourist from Germany, and I’m in a bit of a tight spot—”\n     “You...” The woman’s carefully-curated affect melted away in an instant. “...You are not a Reichsland official...?”\n     “No, ma’am. Like I said, I’m just a tourist, and I really—”\n     “A tourist. Is that a fact?” The woman spat out a venomous laugh. Opening the door fully, she stepped closer, closing the gap between herself and a shrinking Franz. “You’ve got a lot of nerve showing your face around here.” She growled, stabbing a finger towards the road out of town. “Get out. Now.”\n\nFranz didn’t even bother stammering out a reply. Limbs trembling, he scrambled to his discarded bicycle."
 GER_flavour_event.5.a: "He’d never pedaled so quickly in his life."
