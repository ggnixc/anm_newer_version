 GER_government_institution_4_leader: "Hans-Georg Wieck"
 GER_government_institution_4_leaderdesc: "The feared and renowned head of the Reichsnachrichtendienst, Hans-Georg Wieck, is one of the most important men in Germania today. Born on March 28, 1928, in Hamburg to a well-educated family, Wieck enrolled in University for a PhD in history and philosophy in 1947. After completing his studies, he became a diplomat, working for the Auswärtiges Amt.\n\nWieck was soon appointed as the official ambassador to the Imperial State of Iran. Recruited by the RND for a special mission in Iran to ensure stability and crack down on anti-Shah elements. Wieck earned a reputation within the organization for his masterful operational integrity and management not afraid to get his hands dirty when necessary, as well as his silver-tongued negotiation and interrogation skills.\n\nFollowing his tenure in Iran, Wieck was promoted to lead ambassador to the Mittlerer Osten Verteidigungsbündnis. Aspiring to become Foreign Minister, Wieck was instead poached by Speer Jr. to lead the RND for his exceptional intelligence talents—an offer he could not refuse. Today, he continues to leverage his diplomatic and intelligence expertise to ensure the security of Germania at home and abroad during these turbulent times."
