 government_jorg_haider: "Jörg Haider\n--------------\nReichsminister und Stellvertreter des Reichskanzlers\n[getGERgovernmentloyalty16]"
 government_jorg_haider_long: "Ein Volk, ein Reich, ein Führer. This was the motto that Jörg Haider, the new Deputy of the Reich Chancellor, was raised by, along with millions of others in Germany. His parents joined the DNSAP in 1929 and 1935 respectively, and this eventually led to most of his childhood being filled with iconography of Hitler's Germany and party. In his eyes, the only way towards greatness for humanity was through the workings of the Nazi ideology.\n\nDue to his noble lineage, Haider quickly ascended the ranks and became part of the Ministry of Labour and Social Affairs. In this branch of the regime, he showcased his exceptional talent in project management, being able to maneuver people left and right as the situation needed. Such a splendid record did not go unnoticed by party members, and as such, Führer Albert Speer Jr. rewarded him with the highest of honours; a personal audience. Every time that Haider met his Excellency, they conversed about state matters for hours on end, finding that they shared an almost identical view on the coming times for the Vaterland. Seeing unprecedented potential, the Führer decided to take the rising star under his wing, with the intent of further shaping the character of his loyal follower.\n\nAfter his predecessor resigned, he was entrusted his current position. For many people within the government, the relatively young civil servant serves as an example of what they should aspire to become; hardworking and loyal politicians that are in service to the Reich. Every night, when Haider's gaze is illuminated by the bleak light of his desk lamp, he wonders: does Germany's future really depend on faceless, bickering bureaucrats?"
