 GER_focus_event.34.desc: "Anime-fan-1977: So apparently this huge group of Ukrainian natives surrounded the place where Speer and Siech were meeting yesterday. They were throwing rocks and shit at the windows and chanting crazy anti-german slogans. Idk much about the East, so I have no idea what they were so pissed about...but what’s crazy is that Speer did absolutely NOTHING about it. No arrests, no executions, no nothing. WTF?!\n\nWalnut83: i heard they were protesting 4 better factory conditions. but don’t fall for the fake news. something tells me these “natives” were paid by MUSSGNUG 2 stir up yet another fake scandal...\n\nFruhenden: LOL SORRY BUT WHAT WENT DOWN IN UKRAINE WAS REAL AND 100% SPEER’S FAULT. HE PISSED OFF THE COSSACKS BY NEGLECTING THE EAST FOR YEARS...\n\nFruhenden: SPEER IS A WEAK JEW-LOVING BITCH AND IM NOT AFRAID 2 SAY IT. IDGAF IF ITS ILLEGAL. ITS ALSO AGAINST THE LAW TO CHANT DEATH TO GERMANY IN THE FÜHRER’S FACE BUT ALLIE DIDNT DO SHIT. AND THEY WERE RIGHT OUTSIDE WHERE HE WAS!!! PUSSY.\n\nFruhenden: MUẞGNUG WOULD HAVE SLAUGHTERED ALL THOSE SUBHUMAN SPEAR CHUCKERS. LMAO. BUT WITH SPEER AT THE HELM ANOTHER SLAVE REVOLT IS ON THE WAY. THE APPLE DOESNT FALL FAR\n\nAnime-fan-1977: Nice triple post, taint painter. Sooo tired of this constant flaming from these Mußgnug idiots. Like Walnut83 said, Mußgnug is obviously just trying to stir up shit. At this point, he would find a way to smear Speer for ordering the wrong type of mustard...\n\nWalnut83: thank you!!! it seems that no matter what speer does he just can’t win. if u can’t see that mußgnug is arguing in bad faith, that’s because u cant listen to reason over the sound of ur gargling...if you know what i mean. lol"
 GER_focus_event.34.a: "Another valuable exchange in the free marketplace of ideas."
 GER_focus_event.35.t: "A Professional Disagreement"
 GER_focus_event.35.desc: "“Why so stubborn, Herr Mußgnug?” Phone held to his ear, Gunter Deckert took a cautious sip from his oversized mug. Julia, his newest secretary, had made the brew far more bitter than he would have liked, but something so inconsequential had no chance of dampening his gleaming grin. “My Aussenkelet is the cutting edge we’ve been seeking since ‘81. Don’t you want, more than anything, to remind the Bolsheviks of their proper place in the world?”\n     “I want the fucking Führership!” Martin Mussgnung’s hoarse, compressed voice was barely intelligible through the tinny speaker on Deckert’s handset. “Fuck me! Speer wasn’t supposed to actually fund your crackpot pet project! Do you actually believe putting the Wehrmacht in power armor is the way of the future?! Are you twelve years old?!”\n     “Revolutionary ideas are often mocked by small-minded people.” Leaning back in his chair, Deckert waved his empty coffee mug in the air — a moment later, Julia got to work on the boss’ fourth cup of the day. “It’s true, Speer and I may have our personal disagreements, but our vision is aligned where it counts—” Deckert’s eyes lit up like stars, “— the future of German warfare!”\n     “Oh, I don’t doubt that. Because Speer, like you, is a complete fucking moron.”\n     “And do you know what else he is? The Führer.” Deckert smiled, “I’m out. Find someone else to do your bidding, Mister President.”\n     The distinct sound of a pencil snapping in half made its way through Deckert’s handset. “You’re nothing but a spineless coward! Is it any wonder you’ve spent half of this year’s defense budget on your whores? No woman in her right mind would so much as look at you — let alone touch you — without due compensation.”\n     “Tsk, tsk. Who’s the childish one, now?” Deckert chuckled, swirling his phone’s coiled cord around his finger. “Fine. I’m in a good mood, so I’ll play along: how’s your father?”\n     “SAY THAT TO MY FACE, YOU K*KE-NOSED, PIECE OF—”\n     Deckert’s handset clicked back onto the hook, abruptly silencing his colleague’s tidal wave of slurs. \n     “Julia? Do be careful measuring the grounds this time, will you?” Deckert called, grabbing one of the absurdly-thick binders stuffed into his alphabetized bookshelf. His fingers glided down the staircase of color-coded labels running down the side — he knew exactly the section he was looking for."
 GER_focus_event.35.a: "All this money won’t allocate itself."
 GER_focus_event.36.t: "Change of the Guard"
 GER_focus_event.36.desc: "“Cheers!”\n\nMußgnug’s bulbous glass sang a pure tone as it clinked against two more, its holder’s typical sly, knowing smile usurped by a silly smirk. The President’s inner circle, a tight-knit coterie recognised for both their ambition and unwavering support, sat together in the otherwise-vacant dining room. Jolly bouts of laughter danced gleefully through the air, intermingled with a symphony of crass jokes and cheerful toasts.\n     “That does it. He knows he’s cooked. He has to!” Mußgnug sat back, immersed in the kirschwasser's warm, radiant glow. “The Reich is falling apart at the seams, and he’s put gallivanting around the Continent at the top of his itinerary? France, Kaukasia, Ukraine, Britain...” Viscous droplets splattered across the table, “Is he scouting real-estate for a government-in-exile?”\n     “And we don’t even need to lift a finger — the story spins itself.” Christian Worch, a middle-aged fellow seated to Mußgnug’s right, quickly downed his drink. The horrendous taste only exacerbated his usual sour expression, but it hardly mattered. “How long do you think that senile half-wit can keep digging his own grave before his shovel finally scrapes bedrock?”\n     Wolfgang Nahrath — chestnut hair balding ever-so-slightly slower than Mußgnug’s — slumped back in the leftmost seat. “I still can’t believe this is actually happening, Martin...” He hiccuped, drunkenly fiddling with his tie, “All that we’ve worked for, down to our wildest dreams — everything’s really coming together!” A sniff and a few snivels later, a glint of emotion colored his slurred words, “You two are like brothers to me, y’know? And I really mean that...”\n\n“Woah there, Wolfie.” Mußgnug snickered, roughly patting his longtime friend’s quivering backside. “Three drinks in, and you’re already getting sentimental on us? That’s got to be a new record.”\n     “I’m sorry! I just...” Wolfgang took a deep breath. It didn’t help. “I just...”\n     Christian polished off his cocktail. “Here it comes...”"
 GER_focus_event.36.a: "“I just love you guys!”"
 GER_focus_event.37.t: "Change of Plans"
 GER_focus_event.37.desc: "“Fuckin’ hell...”\n\nMartin Mußgnug absentmindedly slid his glass around the dining room table, his typical sly, knowing smile muted by a sagging frown. The President’s inner circle, a tight-knit coterie recognised for both their ambition and unwavering support, sat together in the otherwise-vacant dining room. The clinking of glasses and forced toasts were mere rituals, offering no genuine merriment — any camaraderie that would have existed had been hollowed out by recent events.\n     Mußgnug sat forward, swishing around his latest swig of kirschwasser like it was mouthwash. “It would seem that recent events have...” he paused, “...complicated the narrative.”\n     Indeed, Speer's recent initiatives to bolster German production, redistribute industry between Weißruthena and Kaukasien, and enhance farming productivity in Ukraine had been closely observed by Mußgnug and his two right-hand men. Piecing together some kind of narrative that painted Speer in a negative light wouldn’t be impossible — but it would certainly lack the usual punch.\n     “The economy is limping, but the fact that it’s on its feet at all is a miracle.” Christian Worch, a middle-aged fellow seated to Mußgnug’s right, sipped on his cocktail. He winced. Then coughed. The characteristic bite of tonight’s booze was far more bitter than usual, a fact which only exaggerated his usual sour expression. “Dammit! What’s our angle, then? He’s done exactly what our side of the Reichstag has asked for — perhaps we could frame it as folding to our demands?”\n     “I hate to say it, but perhaps we ought to simply drop this and move onto the next issue.” Wolfgang Nahrath’s voice was tinged with frustration. Over the years, his chestnut hair had balded ever-so-slightly slower than Mußgnug’s, but after the past few weeks, he’d shed far more strands than usual. “The polls speak for themselves. No matter how we try to spin this, the public just isn’t buying what we’re selling. We’re fighting an uphill battle.”\n     “Wolfgang is right. Unfortunately.” Mußgnug audibly grit his teeth; the grating sound added the brewing storm of unspoken tension hanging in the air. “We drew a bad hand, so we’ll fold. It’s not the end of the game.”"
 GER_focus_event.37.a: "“Just wait. An opportunity will present itself...”"
 GER_focus_event.38.t: "Last Resort"
 GER_focus_event.38.desc: "An ensemble of sprinklers hissed somewhere nearby. Buzzing battalions of bees zoomed freely around the walled garden, leaping across archipelagos of budding branches and blooming flowers. \n     “Don’t mind the clutter. I’m still in the middle of a few projects.” An assortment of stones, paving the winding path between disheveled, half-weeded flower beds, crunched beneath Speer’s feet. “Ever since I cut back on the drinking, tending to my garden is the only thing that calms me down anymore. And considering all that I’ve been dealing with lately...”\n     Frey, looking deader than usual, rubbed his eyes. “I’ve canceled three meetings to be here. Do you want to talk about the Debt Crisis, or show off your backyard?”\n     With a hard sigh, Speer got to the point. “Our austerity measures have put a sizable dent in the debt bill, but thanks to Mußgnug’s endless maudling, each has passed with fewer votes than the last.” Speer said. “The Reichstag is a no-go. But what about a more top-down approach? If we were to convene another Europakt Summit—”\n     “And slam the door in the Reichstag’s face? Yes, I’m sure your friend would love that.” Frey halted his stride, plump finger prodding Speer’s chest. “Fall down seven times, stand up eight. So what if Mußgnug’s minions vote down your proposals? Hold another vote. Call an emergency session. Hell, convene a Party Congress! The more of a spectacle, the better.”\n     Speer’s eyes glazed over. “A Party Congress...?” He muttered, mindlessly stepping toward the well-fortified beehive perched on the tree branch above. He detested public rallies, and it would be a hell of a scramble to organize on such short notice, but perhaps such an event was just the power play he needed. \n     Still, a dreadful feeling loomed over him — the Party, and the German people writ large, were already wrapped snugly around Mußgnug’s finger. Speer still had some level of support, but was such a national stunt really a good idea? Speer had the world to gain if things went smoothly, but if this endeavor led to yet another humiliating defeat...\n     Speer scratched his chin, utterly spellbound by the turbulent thoughts swirling around his mind. He was so entranced, in fact, that the platoon of honeybee sentries swirling around his head needn’t wait long to make their move..."
 GER_focus_event.38.a: "Summ, summ, summ. Bienchen summ herum."
 GER_focus_event.39.t: "Wie? Wie? Wie?"
 GER_focus_event.39.desc: "Wie? Wie? Wie? Ihr an diesem Schreckensort? Nie, Nie, Nie! Kommt ihr wieder glücklich fort! \n     The well-worn needle traced the whirling vinyl, gracing the Führer’s study with a classical melody from a time long passed. The overplayed record popped and skipped, but the torrential rain rattling the windows masked the imperfections.\n     Rays of moonlight, gleaming through somber clouds, fell upon the tear-freckled paper clutched in Speer’s hands. A clap of lightning flashed the headline before his eyes: DEFIANT MUẞGNUG BOYCOTTS SPEER’S PARTY CONGRESS, ANNOUNCES RIVAL EVENT IN GERMANIA.\n     The newspaper slipped out of Speer’s trembling grip, scattering at his feet.\n     It was fitting. The endless manipulation, the shameless grift, the paradoxical pretzel logic he’d used to subjugate an entire continent had finally been wielded against him. Mußgnug’s web of lies had shepherded the already-traumatized German people even further into the Party’s endless labyrinth of madness. Millions of terrified, cornered animals gnashed their teeth at shadows and the whistling wind, desperate for a simple solution to a complex problem.\n     The Debt Crisis couldn’t have been caused by corruption and incompetence — no, a vast cabal of Jewish operatives, they said, was the only possible explanation for such a humiliating failure. The interlopers sought to weaken the Vaterland, to leave it vulnerable to Soviet invasion. And who was the mastermind behind this insidious Zionist plot?\n     Every station broadcast the same torrid flames and smoggy skies. Rabid mobs suffocated the streets, lynching innocents and spitting furious hexes of ethnic hatred. Glittering grains of shattered glass crunched beneath the vengeful mobs who cursed his name: Albert Speer.\n\nThe music raced toward its climax. Thunder crashed in tandem with the timpani’s raucous roar, and the Master of Europe stumbled. A rash of black spots sprayed across his vision as he grasped in vain for something — anything — to stop his fall.\n      Oh, wie? Oh wie? Oh—  The phonograph shrieked as its needle carved yet another imperfection into the antique vinyl. The final, whimpered words of Mozart’s quintet, trapped in an endless loop, repeated for an eternity."
 GER_focus_event.39.a: "Oh, wie? Oh, wie? Oh, wie? Oh, wie? Oh, wie? Oh, wie? "
 GER_focus_event.40.t: "Große Uhren Machen Tick Tack"
 GER_focus_event.40.desc: "Neck stiff, heart thumping, and head still aching from his fall, Speer discarded his novel onto the trembling table. The airsickness stabbing the walls of his stomach made it impossible to do anything besides whimper in pain, and this most recent patch of turbulence wasn’t exactly helping.\n     The Führer cradled his wrinkled brow, praying to God Almighty that his next slow, shaky breath would dislodge the dismal burden standing upon his shoulders. Not thirty minutes ago, he had seen for himself the gridlock paralyzing the capital as millions, in an act of blatant defiance, traveled to Germania to attend Mußgnug’s “true” Party Congress.\n     The disturbing turnout had made Speer reluctant to even board the plane to Nuremberg, but reason had ultimately nudged him aboard. The prospect of canceling his own event after making such a grandiose announcement would have far more repercussions than whatever mud Mußgnug intended to sling during his rival rally...right?\n     Drying his clammy palms on his sleeves, a groaning Speer dragged his worn-out gaze toward the window. He watched as the aircraft dove gently below the overcast sky, revealing to its sole passenger the sprawling congress of quaint, timber-framed buildings that spelt the city of Nuremberg.\n     “What...?” Speer rubbed his eyes as the medieval metropolis's most famous landmark — the Reich Party Congress Grounds — came into view. The opening ceremony was only three hours away, yet only a few thousand attendees milled about the train stations surrounding the historic venue. A handful of Heer transports, belonging to the division rehearsing its scheduled march down the parade avenue, idled in an otherwise-deserted parking lot. The stadium didn’t fare much better: It may have looked imposing from the ground, but from Speer’s birds-eye-view, it was clear that less than one-sixth of the seats had been filled. \n     Speer knew that he was unpopular, that he was operating on borrowed time. For years, exactly how many grains of sand remained in the hourglass lived comfortably in the abstract. But to be so bluntly confronted with the true reality of his situation? The Master of Europe was wholly unprepared for the sobering dread that speared his heart."
 GER_focus_event.40.a: "Die Sanduhren machen sch-sch-sch, sch-sch-sch..."
 GER_focus_event.41.t: "The Bigger They Are..."
 GER_focus_event.41.desc: "“...and the old Nuremberg Party Grounds have been showing their age as of late, haven't they?  I swear, during the last Congress, a half-buried Gothic sword nearly made me spill my Löwenbräu.”\n     A half million hearty chuckles tickled the overflowing streets, and for a moment, the striking image of Martin Mußgnug posed before the Volkshalle was cracked by a lighter, more graceful stance. “But I digress. Today, the tired traditions of yesteryear will finally pass the torch, lighting the way to a brighter future. Welcome, my friends, to the First Germania Party Congress!”\n     The raucous applause was right on script. Thumbs hooked into his belt loops, Mußgnug leaned toward the podium, hardly caring what the wind did with his hair. “The timing of our gathering is, of course, no coincidence.” Mußgnug continued, “Were the Führer and his goons not away on business, I doubt I would be able to share the long-awaited results of our investigation with you today.”\n     A weighty silence captured the crowd as Mußgnug held a thick manila folder aloft. “I regret to tell you that our worst fears have been realized.” He tossed a handful of papers — 100 copies of the same document — into the horde. “Take a look for yourselves! Our Führer worked in tandem with Moscow to fabricate this economic crisis. He stole your job, food from your child’s mouth, bullets from our soldier’s guns — all for a fat paycheck. Bah! Even Jews look out for their own!”\n     The jeers shook the ground like an explosion. A wave of clenched fists pummeled the sky, but just as many brandished weapons of war. The perimeter of policemen corralling the mob leered harshly at the contraband from behind glass shields — but didn’t dare do anything more.\n     “Alas, Adolf Hitler, in his endless wisdom, never imagined that such a twisted saboteur would succeed him.” With every word, Mußgnug’s budding grin became that much harder to hide. “There is no legal mechanism to do what needs to be done. So, what will we do? Will we surrender?”\n     Mußgnug didn’t wait for a reply. He marched across the stage. He tore a German flag from its base. He stabbed the golden eagle perched atop toward the supreme incarnation of German power, borne in marble and gilded by victory — the Volkshalle. “I choose our children! Our nation! Our race! I choose to fight!”"
 GER_focus_event.41.a: "“Heil Mußgnug!”"
 GER_focus_event.42.t: "...The Harder They Fall."
 GER_focus_event.42.desc: "Three. Countless patriotic anthems melded together in a chaotic, impassioned round as Mußgnug’s flock linked arms, marching in lockstep behind their rightful protector. The encroaching stampede, composed of Reichstag members, Party executives, and everyday Germans, held the standard of the Reich skyward, painting fluttering streaks of crimson across the horizon.\n     Within moments, the insurrection had drowned the base of Volkshalle in a boiling sea of discontent. The pithy column of guards stationed outside the great hall, utterly powerless against the frothing horde, simply set down their arms. They didn’t even try.\n\nTwo. Martin Mußgnug  — master of the Aryan race, shepherd of the Europakt, and supreme leader of the Greater German Reich — felt pride welling in his eyes as he passed through the Hall of Glory’s Doric columns, but the shadow of the grand portico kept his sentiments a secret. Not that he cared. Why should he? This was it. The final move. Every seed sown over two tireless decades — every sleepless night, every bitter pill, every slashed throat — had bloomed at long last.\n\nOne. The world belonged to him. Nothing could stand in his way. Neither the Party, nor Speer, nor the almighty hand of God could ever —\n\nZero.\n\nGermania shivered. In the blink of an eye, the Volkshalle disappeared, and a blustering storm of hellfire took its place. A dreadful choir of screams snuffed out the third stanza of the national hymn; the choir dropped their guns and banners, scrambling like roaches away from a rapacious facade of toxic smoke.\n\nThe haze would clear in time, unveiling the smoldering mountain of rubble hidden beneath."
 GER_focus_event.42.a: "But the Shepherd did not emerge."
 GER_focus_event.43.t: "Against the Garden Wall"
 GER_focus_event.43.desc: "An ensemble of sprinklers hissed somewhere nearby. Buzzing battalions of bees zoomed freely around the walled garden, leaping across archipelagos of budding branches and blooming flowers. \n     “Don’t mind the clutter. I’m still in the middle of a few projects.” An assortment of stones, paving the winding path between disheveled, half-weeded flower beds, crunched beneath Speer’s feet. “You know, ever since I cut back on the drinking, tending to my garden is the only thing that calms me down anymore...”\n     Frey, looking deader than usual, rubbed his eyes. “I’ve canceled three meetings to be here. Do you want to talk about the Debt Crisis, or show off your backyard?”\n     With a hard sigh, Speer got to the point. “Our austerity measures have shrank the debt, but thanks to Mußgnug’s endless maudling, each has passed with fewer votes than the last.” Speer said. “So much more needs to be done, but it would take a miracle at this point. What am I supposed to do? Perhaps if we were to convene another Europakt Summit, we could bypass the Reichstag entirely—”\n     “Yes. Yes! Of course!” Frey’s fingers curled around the head of a drooping flower. “I sacrificed my health, my marriage, years of my life  — all for the sake of this economy. My economy! And now, to watch Mußgnug’s mongrels gleefully puppeteer its corpse, all in the name of their petty political games...” The azure bloom was decapitated, just like that. “If you believe your plan will wipe that shit-eating grin off of Mußgnug’s face, you have my full support.”\n     Eyes glazed over in deep thought, the Führer wandered ahead, failing to notice the active beehive perched on a nearby tree. There hadn’t been a formal Europakt Summit since the eighties, and it would be a hell of a scramble to organize on such short notice — but it was the only way to break through Mußgnug’s obstinance.\n     Still, both the Party and the people were wrapped around Mußgnug’s finger. With the eyes of the nation judging his every move, was slamming the door in the Reichstag’s face really a good idea?\n     Speer scratched his chin, utterly spellbound by the turbulent thoughts swirling around his mind. He was so entranced, in fact, that the platoon of honeybee sentries swirling around his head needn’t wait long to make their move..."
 GER_focus_event.43.a: "Summ, summ, summ. Bienchen summ herum."
 GER_focus_event.44.t: "Whistling in the Dark"
 GER_focus_event.44.desc: "“Are you sure about this, Herr President?”\n     Peering through fingerprint-smudged glass, Martin Mußgnug held his phone to his ear, Germania a miniature of itself beneath his motionless gaze. A creaking ensemble of hydraulics pressed the elevator door shut, and, without fanfare, the car ascended. It had been a tedious, two-decade journey, but he was nothing if not tenacious.\n     Speer was cooked. The upcoming Europakt Summit was but the cherry on top of the mountain of atrocious humiliations already weighing on the nation’s conscience. By deferring to the Europakt rather than the Reichstag to rectify the Debt Crisis, Speer had acknowledged, for all the world to see, that the invincible German volk were anything but. Wrestling the reins of power from the Führer’s effete, geriatric grip would be an easy sell to the Party and the public at large...so why was his heart thumping so damn quickly?\n     The single sheet of paper folded up in his pocket weighed more than his head. In various shades of splattered ink, more words had been hastily scrawled upon it than had initially been clacked to life by mother’s reliable old typewriter. Entire paragraphs had been excised and replaced. And the opening sentence — how many versions had he penned today alone?\n     The first draft of his “emergency declaration” had been too pessimistic. The fourth, too verbose. The twentieth, far too passive. He needed to be decisive. Unforgiving. Holding back now would only hurt his chances.\n     A burrow of dramatic plotlines slithered around in his head, tying themselves into tangled knots. Perhaps Speer was secretly in league with the Himmlerites? Maybe he’d been caught in bed with one of Deckert’s “secretaries”, or better yet, that fairy Fischer? Speer could have a Jewish great-grandparent. Or two. Or eleven. Coherence hardly mattered — like all of the other slop, the public would swarm around the trough to scarf it down...\n     ...Right?\n     “Herr President...?” Twin chimes spelled a major third, announcing the car’s shuddering stop. “Are you—”\n     “I told you. I’m sure.” Mußgnug didn’t skip a beat, watching his round-nosed reflection disappear as the door creeped open behind him. He swallowed the rancid flavor haunting the back of his throat. “Do you take me for a man who would waste his own breath?”"
 GER_focus_event.44.a: "Weak men create hard times. Hard times create strong men."
 GER_focus_event.45.t: "The Call of the Void"
 GER_focus_event.45.desc: "Neck stiff, heart thumping, and head still aching from his fall, Speer discarded his novel onto the trembling table. The airsickness stabbing the walls of his stomach made it impossible to do anything besides whimper in pain, and this most recent patch of turbulence wasn’t exactly helping.\n     The Führer cradled his wrinkled brow, praying to God Almighty that his next slow, shaky breath would dislodge the dismal burden standing upon his shoulders. Two hours ago, he had seen for himself the gridlock paralyzing the capital as millions, in an act of protest against the Second Europakt Summit, traveled to Germania to attend Mußgnug’s so-called “Party Congress”.\n     The disturbing turnout had made Speer reluctant to even board the plane to France, but reason had ultimately nudged him aboard. The prospect of canceling such an internationally-significant event, especially after making such a grandiose announcement, would have far more repercussions than whatever mud Mußgnug intended to sling during his little rally...right?\n     Drying his clammy palms on his sleeves, a groaning Speer dragged his worn-out gaze toward the window. He watched as the aircraft dove gently below the overcast sky, revealing to its sole passenger the orderly cells of humble, red-tile roofs that spelt the city of Lyon.\n     Calm down. You’re okay. Just calm down. You hold the power. Calm down — breathe, for pity’s sake! No matter what happens, no matter how bad it gets, just remember: tomorrow, the sun will rise again, and you’ll still be alive to see it.\n     The Master of Europe’s throat tightened. His heaving breaths hushed to a timid whisper. Only the rumble of the engines made any sound in the plane’s lonely cabin.\n     ‘The sun will rise again, and you’ll still be alive to see it.’. The sobering reminder, picked up from his late father, had served him well throughout his life. It had always been the knife that cut through the myriad anxieties of everyday life, large and small. Even in the worst of circumstances, Speer could escape his spiraling thoughts. He could stop, close his eyes, and remind himself that life would go on.\n     But now? Father’s reliable old saying did nothing but drag him deeper into the abyss."
 GER_focus_event.45.a: "For the first time, he didn’t believe it. "
 GER_focus_event.46.t: "The Ocean is Vast..."
 GER_focus_event.46.desc: "“...and with his joke of a Europakt Summit, the Führer has surrendered whatever scraps remained of our pride in the name of so-called ‘European unity’. What a disgrace — but it gets worse! Do you know where this pathetic surrender will take place? Really, do you? Because I’d always assumed there was nothing left of France besides 60-year-old tank treads.”\n     A half million hearty chuckles tickled the overflowing streets, and for a moment, the striking image of Martin Mußgnug posed before the Volkshalle was cracked by a lighter, more graceful stance. “But we, the true heirs of the Reich, have gathered here today to venerate the Aryan race’s rightful place atop the world — welcome, my friends, to the First Germania Party Congress!”\n     The raucous applause was right on script. “And my, my. What good timing.” Mußgnug leaned toward the podium, “Were the Führer and his goons not away on business, I doubt I would be able to share the long-awaited results of our investigation with you today.”\n     A weighty silence captured the crowd as Mußgnug held a thick manila folder aloft. “My friends, our worst fears have been realized.” He tossed a handful of papers — 100 copies of the same document — into the horde. “Take a look! Speer worked in tandem with Moscow to fabricate this economic crisis. He stole your job, food from your child’s mouth, bullets from our soldier’s guns — all for a fat paycheck. Bah! Even Jews look out for their own!”\n     The jeers shook the ground like an explosion. A wave of clenched fists pummeled the sky, but just as many brandished weapons of war. The perimeter of policemen corralling the mob leered harshly at the contraband from behind glass shields — but didn’t dare do anything more.\n     “Alas, Adolf Hitler, in his endless wisdom, never imagined that such a twisted saboteur would succeed him.” With every word, Mußgnug’s budding grin became that much harder to hide. “There is no legal mechanism to do what needs to be done. So, what will we do? Will we surrender?”\n     Mußgnug didn’t wait for a reply. He marched across the stage. He tore a German flag from its base. He stabbed the golden eagle perched atop toward the supreme incarnation of German power, borne in marble and gilded by victory — the Volkshalle. “I choose our children! Our nation! Our race! I choose to fight!”"
 GER_focus_event.46.a: "“Heil Mußgnug!”"
