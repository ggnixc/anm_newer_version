### Focus Trees ###
 ## Phase 1 - Starting Tree ##
 GER_the_eagles_reign: "Reign Of The Eagle"
 GER_the_eagles_reign_desc: "Not long ago, the Greater German Reich seemed doomed to extinction. A devastating succession crisis, the collapse of Himmler’s insidious Shadow State, and a humiliating defeat in the Second West Russian War all appeared to spell the end of Adolf Hitler’s Thousand-Year Reich.\n\nBut the wise leadership of Hitler’s successors — Speer Sr. and Hans Spiedel — guided our nation away from the precipice of destruction. It was their thoughtless devotion to the Fatherland that, against all odds, allowed the immortal ideology of the pure Aryan man to live on into the dawn of the Third Millennium.\n\nAs was yesterday, as is today, as will be tomorrow. Nothing can stop us. No matter what challenges lie in wait, the German Eagle shall reign forevermore, uncontested by all but a handful of weak, degenerate nations."
 GER_a_new_wirtschaftswunder: "A New Wirtschaftswunder"
 GER_a_new_wirtschaftswunder_desc: "The numbers are in — all signs point to a German economic golden age within the first decade of the new millennium. At last, our wise investments are paying handsome dividends. Gone are the days of austerity, inflation, and fiscal uncertainty that haunted us following the Europakt’s disastrous launch.\n\nThe German middle class is flush with cash. Rather than worry about how to pay rent or where his next meal will come from, the average consumer is now free to squander away his free time debating which designer brand fits him best. High-tech industrial start-ups flourish in the Ruhrgebied, selling cutting-edge production advancements to a salivating international market.\n\nShould we continue at our current pace, it won't be long until our glorious Reich finally overshadows the United States, the world’s economic powerhouse since the end of the First World War . But unlike their detestable liberal dystopia, the Greater German Reich doesn’t need any help from the Elders of Zion. We have earned everything we have with Aryan blood, Aryan, sweat, and Aryan will."
 GER_introduce_the_euromark: "Euromark Preparations"
 GER_introduce_the_euromark_desc: "The economy of the Europakt, though guided by the wise hand of the Reich, is nevertheless encumbered by the myriad of different currencies used by its constituent nations. To remedy this situation, Germany’s best economists and policy-makers have crafted a new, innovative solution — the Euromark.\n\nThe Euromark — ‘Euro’ for short —  will further the integration of Germany's sphere by creating a single, stable currency for every country within the Europakt. Gone will be the days of clumsy conversions jamming up the gears of the Reich’s mighty economic machine. Instead, citizens of the Pakt can expect to reap the rewards of a unified currency — easier trade, expanded opportunities for investment, and the capacity for mutual economic support between nations.\n\nIf our economists are to be trusted, the buying power of the Euromark could surpass that of the U.S. Dollar in a matter of years, not decades. Should this prediction prove true, the European economy is destined to soar to even greater heights."
 GER_a_loyal_party: "A Harmonious Party"
 GER_a_loyal_party_desc: "Moreso now than at any point in its history, the NSDAP stands united and strong. Thanks to the great purges of the 1970s, the degenerate rats that once plagued the party with petty factionalism scheme no more.\n\nRaise a glass – Whether through the vision of our current leader, Albert Speer Jr., or the unified apparatus of the party, the immortal doctrines of Albert Speer will live on for a thousand years!"
 GER_a_satisfied_people: "A Satisfied People"
 GER_a_satisfied_people_desc: "The German lifestyle of today is defined by unprecedented prosperity, unencumbered by the economic anxieties faced by previous generations. The modern German husband works a stable nine-to-five to provide for his faithful wife and healthy children.\n\nShould any German’s luck run short, the Sozialgesetzbuch – Germany’s generous, well-funded welfare system – helps him back on his feet. Widows and orphans are well cared-for, and crime sits at an all-time low. Sodomy, drug use, and other degenerate activities are unheard from the Maas to the Memel.\n\nAt last, our fabled utopia has become reality, and the Reich can rest on its laurels. All that’s left to do is to celebrate the future, hand in hand."
 GER_endless_stability: "Eternal Stability"
 GER_endless_stability_desc: "Our flawless system of National Socialism has, at last, proven itself superior to the litany of failed, mongrel ideologies that once littered the gutters of Europe like common trash.\n\nThe German Reich is the most well-functioning, stable society that the Earth has ever known. Our loyal, productive citizens know their place within the hierarchy — well-mannered children honor their parents and teachers, industrious housewives tend diligently to their husbands, and content workers serve their bosses without uppity complaints.\n\nOur society is perfect — as are all things under National Socialism. Nothing short of the hand of God could possibly crack our immaculate façade."
 GER_a_thousand_years_more: "A Thousand Years More"
 GER_a_thousand_years_more_desc: "With the pillars of our rule secured forevermore, the Greater German Reich has achieved what Napoleon could only dream of. The lion of Europe has at last been tamed, standing nearly entirely united behind the Europakt, our glorious brotherhood of nations.\n\nSettlers have spread all across Europe, civilizing the natives with the Aryan way of life. Our superior culture is ubiquitous — all across the continent, store shelves are stuffed with electronics designed in Essen, cuisine from Cologne, and Viennese wine. Translated German magazines stuff French checkout lanes and stock Danish waiting rooms. Bratwurst, beer, and sauerkraut is enjoyed at Oktoberfest celebrations from Helsinki to Dublin.\n\nAll of this while the haughty Co-Prosperity Sphere crumbles and the decadent United States kowtows to the Talmudic Synagogue of Satan. Though there still remains a great deal of work to be done on our side of the world, it is thanks to Albert Speer Jr. 's skyward vision that Europe, a continent once defined by petty, squabbling statelets, can march into the 21st century united.\n\nOur virtuous reign shall last one thousand years — and then a thousand years more. Heil Speer!"
 GER_into_the_digital_age: "Into The Digital Age"
 GER_into_the_digital_age_desc: "The WeltNetz computer network, sometimes translated as the “Worldwide Web”, was first engineered in the late 1960s as a way for German universities and research centers to communicate between one another. Today, however, with the widespread adoption of the personal computer in households around the world, the WeltNetz has metamorphosed into a truly massive network of websites, chatrooms, and game servers accessible by any average joe willing to fork up the cash for a PC of their own.\n\nAs of 1996, a jaw-dropping 100,000 websites exist on the WeltNetz, lovingly crafted by enthusiasts of all stripes. Like magic, electronic mail allows users to send and receive messages from thousands of miles away in the blink of an eye. Typing skills have begun trickling into school curriculums around the world, and groundbreaking software such as Microsoft Excel makes organizing and computing large sets of numerical data a breeze — just don’t forget to save.\n\nBut there are two sides to every coin. Just as the WeltNetz has revolutionized the lives of everyday Germans, it has also been used by rouge cells of bolsheviks, liberals, and other Merovingian-Zionist groups to plot the downfall of our resplendent Aryan empire. Short of outright banning personal computers, there is currently no way for the German government to restrict these groups’ communications.\n\nThis is a problem. While the best way to combat these anti-German agents on the digital frontier remains unclear, we can use the existing eyes and ears scattered throughout the country to root out these anti-German agents in the meantime. After years of development, our innovative “social credit” scoring system is ready for launch — this simple system of tracking citizen’s actions will dramatically enhance our ability to arrest and eliminate these Jewish interlopers before they can flood the nascent WeltNetz with their lies"
 GER_sky_is_the_limit: "The Sky Is The Limit"
 GER_sky_is_the_limit_desc: "While the Steel Eagle settled the homely nest of its well-earned Lebensraum, her young flock, seeking to spread their wings even further, embarked on a daring journey into the unknown. Enter, Madagascar.\n\nRegarded as the ‘Wild West’ of the Greater German Reich, the island of Madagascar is Germany’s portal into two untamed frontiers — the sprawling African wilds, and the infinite expanse of space.\n\nEver since the founding of the RLR in the 1960s, the Wolfee Complex of Aerospace Operations (WCAO) has existed in Madagascar as the cradle of all major space missions for Germany. The sprawling facility is largely powered by aviation products from Antsiranana, where happy natives, thankful for their dependable employment by their German superiors, whistle cheerful tunes as they work from dawn to dusk.\n\nA hop, skip, and a jump away from this bustling factory town, one will encounter an intricate system of barricades, dividing the island between the Deutsch-Afrikaners and the native Malagasy. Heavy investments into the northern portion of the island — dubbed ‘Neueuropastadt’ by its German settlers — have attracted a large influx of European migration that has completely resculpted the demographic makeup of the region. Germany’s last foothold in Africa following the loss of its Central African holdings, the Neueuropastadt colony is well-known for producing the bountiful harvests of exotic fruits and vegetables that line store shelves all across the Fatherland."
 GER_army_of_the_future: "Army Of The Future"
 GER_army_of_the_future_desc: "A decade of relentless innovation has transformed the weak, feeble Wehrmacht that surrendered the East to the Reds into a truly indomitable force.\n\nOur disgraceful defeat in the Second West Russian War is an undeniable fact of history. Logically, a pure Aryan army could never lose to an untrained mongrel force — therefore, this fluke was obviously the result of sabotage by Zionist spies infecting the highest echelons of our officer corps. In the years since, these infiltrators, their families, and anyone else associated with them have been hunted. Purged. Erased from history.\n\nWe have learned from our past failures, and are stronger for it. The modern Wehrmacht is the gleaming sword of the pure Aryan race — one that is unsullied by insidious Jewish influence. Our forces stand ready; our morale is unimpeachable. Better yet, up-and-coming projects such as the Aussenskelet promise to keep the German military years ahead of its rival across the Atlantic.\n\nWe are invincible. Nothing can stop us."
 GER_society_redifined: "Society, Redefined"
 GER_society_redifined_desc: "Ever since we, the Aryan master race, came to walk upon the Earth, our pure bloodline and superior intelligence have made us perennial pioneers of technological progress. While the degenerate, thick-skulled Romans wandered the ancient world wearing skirts, we “barbarians” north of the Danube had the common decency and intellect to invent trousers — and we’ve been well ahead of the curve ever since.\n\nTwo thousand odd years later, it was Germany who invented the very first nuclear bomb, the original cellular telephone, and the paradigm-shifting WeltNetz. All of these awe-inspiring successes were made possible by Germany’s state-sponsored research institutions, robust public education system, and, most of all, our common-sense eugenics policies.\n\nWe Germans hold ourselves to a higher standard. We keep our stock pristine  — which necessitates the elimination of genetic impurities. While other nations waste resources coddling drooling, barely-human mistakes, we have the common sense to put these so-called “people” out of their misery. Weak-willed men call it cruel. Those interested in the constant, unquenching pursuit of humanity’s next great breakthrough call it a necessary sacrifice."
 GER_meet_with_security_council: "Meet With The Security Council"
 GER_meet_with_security_council_desc: "TO BE CHANGED"
 GER_onto_new_frontiers: "The Harvest Of Afar"
 GER_onto_new_frontiers_desc: "The Reich’s latest and greatest territorial conquest wasn’t the degenerate Slavic hordes, nor the backward tribes of the African savannah. Rather, the latest terrain to bow down to Aryan supremacy was none other than the pristine jewel of the night sky: der Mond.\n\nEver since the triumphant moon landing of 1962, the Greater German Reich has transformed the cold, craggy expanse of the lunar surface into a bustling hub of Aryan innovation: the Pionier Moon Base. There, within humanity’s second outpost on the moon, Germany’s best and brightest put their minds together to develop high-grade, space-age technology for the new millennium.\n\nCountless innovations have been theorized, tested, and brought to life within the Pionier base, but all of our discoveries combined pale in comparison to our latest, greatest achievement: the breathtaking power of nuclear fusion. While this technology has already been in use for decades in the production of nuclear weapons and nuclear power plants, these techniques look downright primitive when compared to the theoretical path toward efficient, cost-effective nuclear power recently discovered by our scientists.\n\nThe supreme Aryan race is truly the master of the universe — from the moon looming in the night sky to the microscopic atom, nothing can escape our grasp."
 GER_reichslander_index: "The Reichsländer Index"
 GER_reichslander_index_desc: "Ever since the establishment of the Reichsländs by the administration of Albert Speer Sr., the “Reichsländer Index”, an annual report on the economic development of the eastern colonies, has been written up and presented to the German Minister of Finance.\n\nInitially, the decision to replace the eastern Reichskommissariats with autonomous collaborationist governments was considered a complete betrayal of Hitler’s visionary world-to-be. Few could argue, however, that the vast number of resources — political and military — required to administer these vast swathes of empty land weren’t hampering our leaders’ ability to keep their own house in order.\n\nIn hindsight, it’s quite odd that our immaculate Aryan intellects didn’t think to make this transition sooner — but that’s probably the fault of Judeo-Israeli infiltration, like all our other supposed “missteps”. While extensive effort still had to be put into stabilizing the newly-established Reichsländs, the past ten years have at last returned optimistic numbers. Today, as the Ministry of Finance puts the finishing touches on the 1995 Reichsländer Index , economists and party executives alike dare to say that our Eastern holdings have turned a small profit.\n\nThis is huge. Should current trends continue, the East’s long-awaited profitability is expected to soar to even greater heights by the year 2000. Another win for our perfect Reich — but, as the youth love to say, “what else is new?”"
 GER_europakts_finest: "Europakt's Finest"
 GER_europakts_finest_desc: "Sweden, Norway, Finland, and Denmark, our dependable allies to the north, are the foundation of the mighty Europakt Alliance. Their pristine mountains and misty fjords are not only strategically important for control of the North Sea, but also harbor vast reserves of vital resources that the Reich’s war machine has depended on since the 1940s. Thus, maintaining the favor of this quartet of nordic nations remains one of the Reich’s highest diplomatic priorities.\n\nOn Germany’s dime, construction of the ‘Spirit of Europe’ bridge — a cutting-edge piece of infrastructure connecting Oslo and Stockholm over the Glomma River — is nearing completion. Once the final safety inspections are finished, Fuhrer Speer himself, accompanied by a few other cabinet members, is expected to attend the televised ribbon-cutting ceremony. We will make a speech, shake a hand or two, and snap a few pictures. In doing so, we shall ensure that the frozen north will remain in our corner as the Reich strides fearlessly into the new millennium."
 GER_breaching_the_unknown: "Breaching The Unknown"
 GER_breaching_the_unknown_desc: "The world held its breath in awe when the Reich planted its banner upon the lunar surface in 1962 — but what breakthrough shall become the next gem in our perfect empire’s gilded crown of scientific achievement?\n\nEmbryonic stem cell research is one particularly-promising endeavor. The use of harvested stem cells has already been shown to help epidemiologists understand how diseases occur and proliferate. They can assist pharmaceutical scientists in testing the effects of new drugs and treatments — including the long-sought cure for cancer.\n\nSuch research has received considerable political backlash in the United States, that perfidious den of mongrel degeneracy across the Atlantic. They say it is immoral to harvest human embryos for any purpose — our superior Aryan intellect, however, allows us to see right through the “peer-reviewed” lies of Jewish academia and embrace the undeniable truths of race realism.\n\nWe are all human — but some of us are more human than others. We, the ubermensch, will utilize the embryos of the lesser races we have tamed for the benefit of humanity as a whole. In doing so, the untermensch can take the first step toward redeeming themselves in the eyes of their Aryan betters."
 GER_launch_the_euromark: "Launch The Euromark"
 GER_launch_the_euromark_desc: "At last, after years of planning and preparation, the Euromark — the long-dreamt-of common currency for the Europakt — is on the cusp of becoming reality. From Paris to Baku, the litany of confusing, unreliable currencies hampering the steady flow of wealth into Germania shall be a thing of the past. In its place, a completely new coin, the first of its kind unspoiled by globalist avarice.\n\nWhen the clock strikes midnight on January 1st, 1997, the symphony of fireworks lighting the night sky will not simply herald a new year, but a new era of wealth and prosperity for millions of German citizens as well. The Euromark is destined to bring Europe even closer together in its neverending crusade for strength, tradition, and prosperity!\n\nIt’s been a long journey, but our tireless efforts have at last borne fruit. Raise a glass — it’s time to celebrate!"

 ## Phase 2 - The Euromark Thriumps ##
 GER_the_euromark_triumphs: "The Euromark Thriumps!"
 GER_the_euromark_triumphs_desc: "1 January 1997 will go into the history books as one of the most important dates in the history of the Reich as it established a single currency for the entire European market. Economists and Professors alike had their concerns over the consequences this would have on the local economies, but now, one month later, the Euromark still stands strong. \n\nWith the complete European economy irreversibly connected to that of the Fatherland, the possibilities are endless. It will not be long or the Euromark will overtake the US Dollar as the world's leading valuta."
 GER_does_it_really: "Does it, really?"
 GER_does_it_really_desc: "The first quarter of the year has passed, and it is time to consolidate the financial statements. Some concerns have surfaced within the local administration of our central european holdings as they saw a sharp decline of purchasing power, but there is no proof to link this to the launch of the Euromark instead of the general incompetence of the locals. \n\nEconomists from all over the Europakt gathered in Munich to oversee the creation of the Q1 1997 report, as this will be the most important financial document since the creation of the Reich proper."
 GER_red_elephant: "The Red Elephant In The Room"
 GER_red_elephant_desc: "Tensions with the Soviet Union have risen to the highest level since our shameful surrender in 84’, the Judeo-Bolsheviks have been taking more significant risks with their attempts to sabotage our glorious empire, and it does not seem there will be an end to it any time soon. With the snow thawed away the presence of ‘red’ soldiers near the borders have seen a 120% increase, it is of utmost importance that we react accordingly to these maneuvers to prevent another Great Mistake of 1980. \n\nEither choosing a diplomatic way, as the Reich has grown into a more knowledgeable administration, or picking a more militaristic stance to make sure the army is ready."
 GER_pull_fundings_from_esro: "Pull Fundings From ESRO"
 GER_pull_fundings_from_esro_desc: "The German Space program brings us more prestige all across the world, and keeps our new future frontier secure. Since its inception in the early 1950s, it has proved to the world what National Socialism can really accomplish, more than lazy capitalism or dirty communism. We are responsible for sending the first man into space. \n\nThe space program will be more of a subject of tomorrow, and not today. We don’t necessarily need to put such amounts of money into trying to conquer and explore space with such still fairly primitive technology. Perhaps when our technology is fairly more advanced, we may allocate more resources into exploring outer space."
 GER_reduce_survelance_budget: "Reduce State Surveillance Budget"
 GER_reduce_survelance_budget_desc: "State surveillance is very vital to keep order in our nation, and prevent any rebellion among our citizens. However, we need to reduce its budget in order to balance our budget. We can reduce the budget slightly, and allocate more resources into the military, since the military is more important than trying to keep an eye on our citizens. \n\nTo begin with, our people have been very loyal to us for the recent years, and deep down in their hearts they have always been loyal to our glorious regime. We can trust our people, and safely allocate more money to a different cause. "
 GER_our_central_european_allies: "Our Central European Allies"
 GER_our_central_european_allies_desc: "Hungary, Romania, Slovakia, Serbia. The four Central European members of the Europakt, they form our southern bulwark against the dastardly Italians, and they also carry a sizeable economic output. While the former two essentially own their existence to Germany, and are governed by loyal collaborators, Hungary and Romania retain a somewhat free and indenpendent power structure. However, with deepening our cooperation with them, estabilishing more contacts with their sizeable Svabian and Saxon minorities and maintaining our role as mediator in their long conflict over Siebenbürgen, we can keep them in our alliance with relative ease."
 GER_finalize_the_ostwall: "Finalize the Ostwall"
 GER_finalize_the_ostwall_desc: "The Ostwall projekt came to life the same night peace was signed against the Soviet Union. When the Soviet launched their invasion back in 1980' when it became quite clear the Reich was illprepared. Ostland, territory which had become very familiar to most German soldiers, was prepared as a fallback line. Movable fortifications and anti-armour weaponry were quickly collected from all over the Reich, but it was to be of no use. \n\nNow, more than a decade later, the full extent of these defensive plans are almost realized. The wall does not only serve as border fortifications against the Soviets but it also provides the people with the much needed feeling of security. We should perform one last inspection ourselves to see if the Ostwall truly lives up to its expectations."
 GER_reichslander_directive: "The Reichsländer Directive"
 GER_reichslander_directive_desc: "The Reichsländer, our homeland, must never fall to a foreign invader. Matters for national security should not be budgeted away, and the past years have proven why. It is time to call in the reservents and prepare the local garrisons forl combat as the frequent border clashes created a significant amount of weak spots. \n\nThe amount of troops we can take from the Reichsländer without hindering internal security is hard to guess, but we must do everything in or power to prevent another (Belarus Commie Problems)"
 GER_prepare_the_wehrmacht: "Prepare The Wehrmacht"
 GER_prepare_the_wehrmacht_desc: "The Wehrmacht, our beloved. The Reich's glorious army is modern, well equipped and more determined then ever before. Our Aryan Conscripts are trained in combat on all the different terrains found in the European continent. Most of this is thanks to Deckert and his never-ending push for improvements. \n\nWith the tensions reaching a boiling point it is the right time for.us to start flexing our muscles again. The Red Army stands no chance against our technological and ideological.supremecy, and if it gets to it, it will be German boots walking through Moscow again."
 GER_squeeze_megaprojects: "Squeeze the Megaprojects"
 GER_squeeze_megaprojects_desc: "..."
 GER_the_french_state: "The French State"
 GER_the_french_state_desc: "Originating from the empire of Charlemagne, the French and German peoples are brothers, fighting and feuding like every brother does when feeling resentment towards their sibling. However, just how brothers abandon their rivarly for familiar love when they age, so did our two nations ended their long conflict in the bloody World War, finally finding peace and cooperation inside the Pakt. While the issue of Burgundy still strains this brotherhood somewhat, we will work together to remove this barrier from the road. As good brothers should."
 GER_kaukasian_riches: "The Kaukasian Riches"
 GER_kaukasian_riches_desc: "Caucasia or Kaukasien is where they produce most of the materials and fuel for our industrial machine. Caucasia has a lot of fossil fuels that bring us more riches. We shall expand them to keep Europe fueled, and the industries fed. \n\nCaucasian situation is not all sunshine and rainbows. There are a lot of angry ethnic minorities that have been oppressed since the dawn of the Reichskommissariat. They are planning a rebellion, and we must stop them to keep the gas flowing to Germany and Europakt states."
 GER_pen_mightier_then_sword: "The Pen Is Mightier Than The Sword"
 GER_pen_mightier_then_sword_desc: "Staying true to the late Furher's Speer wish, the Reich should seek to become a more diplomatically orientated entity. The creation of the Europakt was the Reich's first actual success in establishing internetional influence without military intervention. \n\nGood diplomats are the ones that prevent the  losses of lives in an unnecessary war, and this is what we need to focus on right now. The tensions with the USSR have reached a boiling point, and to prevent another generation of mother's burying their children we should send our best diplomats to solve this one and for all."
 GER_no_time_for_diplomacy: "No Time For Diplomacy"
 GER_no_time_for_diplomacy_desc: "Gunther Deckert (or other general Army leader) our security minister, has informed us about a golden opportunity. Leaked Intel shows that the Soviets will be relocating a large chunk of the border troops the coming days. The skirmishes of the past months made it hard for us to get a good overview of their current technological advances. \n\nPerson suggests to prepare an ambush, and capture a detachment of these borderguards to interrogate them properly. Information is a valueble.tool and this is the chance for us to even the odds against the Soviets."
 GER_redistribute_infrastructure_funds: "Infrastructure Funds Slashed"
 GER_redistribute_infrastructure_funds_desc: "Although public infrastructure is important for our economy, we need to sacrifice infrastructure subsidies in order to keep our budget stable. We already have a fairly good infrastructure compared to our enemy number one, the United States of America, whose roads are full of potholes. \n\nWe can redistribute the funds for the public infrastructure for something better, for example, we can prepare for the conflict with the USSR by giving some money for the military. Education is important for us, and we can make use of the money to educate German children and young people."
 GER_minimize_redundant_military_budgets: "Minimize Redundant Pensions"
 GER_minimize_redundant_military_budgets_desc: "Most of our armed forces consist of older people who are near the retirement age of the army. The already retired ones are living a life of leisure with the large amounts of military pension money, that is off from the average German taxpayer. We must ease the burden of the elderly soldiers by cutting the redundant military pensions. \n\nMost of the retired soldiers are still able-bodied, and can fight for Germany and Europakt very well. The ones who have suffered disabilities in war need to be euthanized, since they are just all useless eaters and money drainers. "
 GER_the_atlantic_archipelago: "The Atlantic Archipelago"
 GER_the_atlantic_archipelago_desc: "The Kingdom of England is our last bastion in the UK, and its position has stayed the same after the Second World War. The collaborationist government is loyal to our cause, but there is still a lot of democratic and liberal resistance inside England, and they may rebel in the worst case scenario. \n\nThe Republic of Ireland is more loyal to us, since they benefited from us giving them the formerly British occupied Northern Ireland, and they have been very grateful to us for giving them Northern Ireland. However, Ireland is looking for closer ties with the US, so we must use some diplomacy to get them away from the United States of America."
 GER_ukranian_harvests: "The Ukrainian Harvests"
 GER_ukranian_harvests_desc: "Ukraine is the breadbasket of Europakt, and they are one of the largest exporters of grain and produce in the Europakt. Ukraine is also one of the largest manufacturing countries in Eastern Europe, and many companies are dependent on Ukraine. Ukraine is very important to us, and we must keep it that way. \n\nHowever, Ukraine is neighboring with the USSR, and if we lose Ukraine, it will cause us a lot of economic damage that will take many years to recover, or we will never recover from. Also rebel activities have been rising in Ukraine, and we must take care of Ukraine by sending the garrison some more resources to fight the rebels."
 GER_last_resort: "The Last Resort"
 GER_last_resort_desc: "All our attempts at diplomacy have failed. The Soviets are truly a folk of degenerates as they dared to laugh at our proposals. Already we see an increase in the amount of border skirmishes, and it seems the Soviets used this moment of temporary cease -fire to move their troops into position. \n\nWe must reposition the army immediately if we want to prevent another 84' from happening. In the meantime we must report this preposterous  to the Europakt Council, as they surely.will agree the Soviets are not a nation worthy of recognition anymore."
 GER_the_r_and_d_question: "The Price Of Loyalty"
 GER_the_r_and_d_question_desc: "Research and development is very crucial for us to survive, because Germany will become a backwater laughing stock if we don’t advance technologically. Many of our technocratic NSDAP officials think that we can’t afford to cut from the research and development in sake for some money. \n\nOur more fiscally conservative officials believe that we should do some budget cuts to the research and development sector because our technology is already pretty advanced compared to our rivals."
 GER_balance_the_europakt_partnership: "Balance Europakt Partnership"
 GER_balance_the_europakt_partnership_desc: "..."
 GER_feed_the_war_machine: "Feed The War Machine"
 GER_feed_the_war_machine_desc: "The war machine needs more resources to function more efficiently. If it functions more efficiently, our army and the air force gets stronger. We shall expand our industries in our Reichslands and of course Germany itself to boost our efficiency. The military industries must grow to meet the demands of our army and air force. \n\nThe Soviets have been expanding their military industrial complex ever since they were reunified. We must not fall behind the commies and get crushed by those dirty Soviets. They are a good motive to expand our war machine."
 GER_the_65th_nuremberg_party_congress: "The 65th Party Congress"
 GER_the_65th_nuremberg_party_congress_desc: "It is time for our 65th annual Party Congress. This congress will discuss preparing for the war with the Soviet Union, and building a road for the 21st century. There will be a lot of subjects to discuss, like the fate of the former Burgundian territories, the Euromark, the European identity, the threat of the Internet and its consequences on the Reich and the education reform question. \n\nMartin Mussnug, the leader of the conservative faction hopes that we shall make compromises that benefit the both conservative faction and the reformist faction, and we must proceed with caution."
 GER_the_europakts_second_summit: "The Europakt's Second Summit"
 GER_the_europakts_second_summit_desc: "..."
 GER_the_black_stain_of_europe: "The Black Stain of Europe"
 GER_the_black_stain_of_europe_desc: "The Burgundian territories are the underdeveloped wastes of the former Ordenstaat Burgund, the insane experiment of the late madman Heinrich Himmler. The whole territory is a humanitarian, political, and an economic disaster, and one of the most underdeveloped territories of Europe. \n\nThere are still some Burgundian SS remnants who traffic drugs to Germany, and try to cripple our society with their substances. We need to crush the remnants, provide humanitarian aid, and ultimately, rebuild the region. We may return the territory to the French, but only when the territory has been rebuilt from the wastes of the SS."
 GER_revaluate_the_euromark: "Revaluate the Euromark"
 GER_revaluate_the_euromark_desc: "The release of Euromark, the Germany’s and ultimately the Europakt’s new currency, was pretty difficult. The inflation in Europakt states started rising, and it caused a lot of economic confusion and instability there. The largest issue there was that Euromark was pretty much less valuable than the Europakt states’ native currencies. \n\nWe have full control over the value of Euromark, and it is in our and Europakt countries’ interest to reevaluate Euromark and therefore restabilize the Europakt states’ economy. This will make them used to our money, and be more willing to use Euromark. "
 GER_looming_threat_internet: "The Looming Internet Threat"
 GER_looming_threat_internet_desc: "After we did the deal with the devil also known as the United States of America, our NetzRam and American internet united to a single global network of computers. This brings us more opportunities, but this also brings more threats to our regime, since the German citizens can learn about our “immoral” decisions. \n\nWe have created our Drexler Score system, which allows us to control our citizens’ decisions. We can put punishments to their score if they access forbidden websites, or search for forbidden media. We need to track all their computers, so we can know what they are doing with the computers."
 GER_the_reichs_citizens: "The Reichs Citizens?"
 GER_the_reichs_citizens_desc: "..."
 GER_the_resources_of_the_future: "The Resources of the Future"
 GER_the_resources_of_the_future_desc: "The future of energy production does not necessarily need to depend on nuclear, solar and wind energy. Nuclear power is pretty risky, and it may destroy our planet. Solar power isn’t that reliable, especially in the colder and darker territories. Wind power is the least reliable of those three, since it doesn’t wind all the time. \n\nWhen you hear the word “diesel”, you may think of just another type of fossil fuel, but this isn’t necessarily the case. Biodiesel is a more environmentally friendly solution to replacing dirty fossil fuels of oil, gas and diesel. It’s also possible to reuse Carbon Dioxide, making the energy last longer. This technology allows us to be more independent in terms of energy to our competitors, and also keeping our territories clean."
 GER_the_purpose_of_education: "The Purpose Of Education"
 GER_the_purpose_of_education_desc: "Children and young people are the future of Germany. If we don’t educate them, we don’t have a future, and Germany will fall. We must continue educating them, and improve our education system to make our future better. We need to make sure that the German children are smarter than judeo-degenerate American children or dirty Soviet children. \n\nOur education system isn’t perfect. The picture of Hitler is in every classroom, and students do the führer salute every time school starts. More liberal NSDAP officials want to depoliticize education, but the more reactionary NSDAP officials want to keep it as it is, since it would raise our next generation loyal. Or we may tell the truth, but sugarcoat it."
 GER_the_nsdap_prevails: "The NSDAP Prevails!"
 GER_the_nsdap_prevails_desc: "We have fixed the issues in the Europakt, home and abroad. We have improved our education system, the economy with the launch of the Euromark, and have strengthened our position at the world stage, and have improved ourselves in the competition against the United States of America. \n\nThe threat of the Soviet Union is still looming, but Europakt is a military alliance that brings more safety to countries neighboring the Soviet Union. We have done great reforms that make our nation more ready for the 21st century. Sieg heil!"

 ## Finnish Civil War Tree ##
 GER_the_north_in_flames: "The North in Flames"
 GER_the_north_in_flames_desc: "Our greatest ally in the north, Finland has found itself in a new, horrendous civil war. The Soviet-backed communist bastards have caused an uprising, which has also caused the Finnish opposition to rise up, also. It’s our duty to support the Finnish government, which is friendly to our great nation. We need to aid them to crush the communist traitors, and wrangle up the opposition. If we fail to do this, the Soviets or Americans could have an important geostrategic point in the north by their side. We do not want this. Finland must be kept on our side. \n\nWe need to aid our brothers in arms, and contain the spread of the Soviet and American influence in Europe. Our agents have informed us that the Americans have a secret smuggling route in Sweden and Norway. The route must be intercepted in order to hinder their supplies. Lapland is a pretty poor region when it comes to industry, and production in general, which is the main reason why the opposition needs supplies."
 GER_cutting_the_route: "Safeguarding Stability"
 GER_cutting_the_route_desc: "The Americans have secretly built an arms transport route, whose purpose is to give aid to the anti-German opposition members. The Swedish and Norwegian officials haven’t noticed the routes, and are suspected of taking bribes from the Americans to turn a blind eye. We need to notify the Swedish and Norwegian officials about the route, and cooperate with them hindering the arms route. One good day, the route would be intercepted, and the opposition hillbillies would be starving in terms of ammunition."
 GER_there_is_no_lesser_evil: "Pulling The Strings"
 GER_there_is_no_lesser_evil_desc: "Why focus on destroying one of the ideological enemies of the Reich, when you could destroy both? The Americans and the Soviets are our natural enemies, and we must do everything to stop them. The opposition fighters aren’t so tough, since they are just some hillbillies who hate Germany and Europakt in general. The communists are also lazy, alcoholic, and ungrateful workers who don’t like their livable pay, and just want more. Those both factions are equally stupid, and we should destroy them both."
 GER_ripping_the_reds: "Ripping the Reds"
 GER_ripping_the_reds_desc: "The communists have been Finland’s worst enemies since their independence. The first and current civil wars are about Finland fighting the communist forces, and also during the Winter War, Finland fought against the Soviet Russians. The Soviet-backed communists do have better combat capabilities than the opposition members, which means we should focus more on defeating the communists than the Americans. We already have experience from fighting the Soviets, and we could use the same tactics."
 GER_lappland_investigations: "Lappland Investigations"
 GER_lappland_investigations_desc: "Lappland is Sweden's northernmost region, where the most important part of the route is located. From there they give the guns to the opposition fighters from Haparanda. The customs officers are corrupt, and turn a blind eye to trafficking. We must investigate the corruption further in order to hinder the arms route. We can then imprison the corrupt officers, and make sure that nobody accepts bribes from foreign enemies. We may continue using our assigned officers to tackle drug trafficking after the war."
 GER_hindering_their_supplies: "Hindering their supplies"
 GER_hindering_their_supplies_desc: "Without the supplies the opposition members would be just angry drunken farmers who love Americans. Probably they prefer Chevrolet over Mercedes. That’s pretty obvious when someone becomes so poor that they prefer the more inferior products. They better get used to our more superior products. Oh wait, they may not, since they may get imprisoned or executed. When we control more territory, we can surround the communists, and it would give us more advantages."
 GER_kuovola_offensive: "Kouvola Offensive"
 GER_kuovola_offensive_desc: "Kouvola is the eastern center of communists, and the city feels like one of the Soviet cities due to its architecture. It’s also the industrial center of communists, which means Kouvola needs to be captured in order to proceed to Karelia. However, if we destroy the factories in Kouvola, Finland may suffer for the damages after the war, and may be upset to us for destroying one of their city’s economies. Well, we can compensate for the damages in the future."
 GER_operation_karelia: "Operation Karelia"
 GER_operation_karelia_desc: "Karelia is Finland's easternmost region, where the Soviets can easily give aid to the communist partisans. Unlike the supply route to the opposition, we can’t destroy their supply routes. But since we have captured the main industrial city, we can push forward with our firepower. We may use some good tactics, too. After we crush the communists, the victory will be ours."
 GER_a_war_among_brothers: "A Brotherly War"
 GER_a_war_among_brothers_desc: "It’s time to liberate our Finnish brothers in arms from the evil communists and Americans. We will give the Finnish government more men, ammunition, planes, tanks, and other types of equipment. We shall start the final offensive to defeat the communist and Yankee bastards. We have already hindered the American supply routes, and have crippled the communist industry. This will be a piece of cake"


