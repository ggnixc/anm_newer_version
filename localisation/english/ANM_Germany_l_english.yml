### Focus Trees ###
## Phase 1 - Starting Tree ##
 GER_the_eagles_reign: "Reign Of The Eagle"
 GER_the_eagles_reign_desc: "Not long ago, the Greater German Reich seemed doomed to extinction. A devastating economic crash, the succession crisis, and a humiliating defeat in the Second West Russian War all appeared to spell the end of Adolf Hitler’s Thousand-Year Reich.\n\nBut the wise leadership of Hitler’s successors — Speer Sr., Hans Spiedel and now Speer Jr. — guided our nation away from the precipice of destruction. It is their thoughtless devotion to the Fatherland that, against all odds, will allow the immortal ideology of the pure Aryan man to live on into the dawn of the Third Millennium Anno Domini.\n\nAs was yesterday, as is today, as will be tomorrow. Nothing can stop us. No matter what challenges lie in wait, the German Eagle shall reign forevermore, uncontested by all but a handful of weak, degenerate nations!"
 GER_a_new_wirtschaftswunder: "A New Wirtschaftswunder"
 GER_a_new_wirtschaftswunder_desc: "The numbers are in — all signs point to a German economic golden age within the first decade of the new millennium. At last, our wise investments are paying handsome dividends. Gone are the days of austerity, inflation, and fiscal uncertainty that haunted us following the Europäische Pakt’s disastrous launch.\n\nThe German middle class is flush with cash. Rather than worry about how to pay rent or where his next meal will come from, the average consumer is now free to squander away his free time debating which designer brand fits him best. High-tech industrial start-ups flourish in the Ruhrgebied, selling cutting-edge production advancements to a salivating international market.\n\nShould we continue at our current pace, it won't be long until our glorious Reich finally overshadows the United States, the world’s economic powerhouse since the end of the First World War . But unlike their detestable liberal dystopia, the Greater German Reich doesn’t need any help from the Elders of Zion. We have earned everything we have with Aryan blood, Aryan, sweat, and Aryan will."
 GER_introduce_the_euromark: "Euromark Preparations"
 GER_introduce_the_euromark_desc: "The economy of the Europäische Pakt, though guided by the wise hand of the Reich, is nevertheless encumbered by the myriad of different currencies used by its constituent nations. To remedy this situation, Germany’s best economists and policy-makers have crafted a new, innovative solution — the Euromark.\n\nThe Euromark — ‘Euro’ for short —  will further the integration of Germany's sphere by creating a single, stable currency for every country within the Europäische Pakt. Gone will be the days of clumsy conversions jamming up the gears of the Reich’s mighty economic machine. Instead, citizens of the Pakt can expect to reap the rewards of a unified currency — easier trade, expanded opportunities for investment, and the capacity for mutual economic support between nations.\n\nIf our economists are to be trusted, the buying power of the Euromark could surpass that of the U.S. Dollar in a matter of years, not decades. Should this prediction prove true, the European economy is destined to soar to even greater heights."
 GER_a_loyal_party: "A Harmonious Party"
 GER_a_loyal_party_desc: "Moreso now than ever at any point in its history, the Nationalsozialistische Deutsche Arbeiterpartei stands united and strong. Decades have passed since the purges of the 1970s, when we cast out and vanquished the degenerate rats that once plagued the party with petty factionalism.\n\nRaise a glass—but not too high, lest the ever-watchful gaze of the regime take note. Whether through the vision of our leader, Albert Speer Jr., or the vast apparatus of the party and state, the immortal doctrines of Adolf Hitler and his successors, shall live on for a thousand years, and a thousand years more!"
 GER_a_satisfied_people: "A Satisfied People"
 GER_a_satisfied_people_desc: "The German lifestyle of today is defined by unprecedented prosperity, unencumbered by the economic anxieties faced by previous generations. The modern German husband works a stable nine-to-five to provide for his faithful wife and healthy children.\n\nShould any German’s luck run short, the Sozialgesetzbuch – Germany’s generous, well-funded welfare system – helps him back on his feet. Widows and orphans are well cared-for, and crime sits at an all-time low. Sodomy, drug use, and other degenerate activities are unheard from the Maas to the Memel.\n\nAt last, our fabled utopia has become reality, and the Reich can rest on its laurels. All that’s left to do is to celebrate the future, hand in hand."
 GER_endless_stability: "Eternal Stability"
 GER_endless_stability_desc: "Our flawless system of National Socialism has, at last, proven itself superior to the litany of failed, mongrel ideologies that once littered the gutters of Europe like common trash.\n\nThe German Reich is the most well-functioning, stable society that the Earth has ever known. Our loyal, productive citizens know their place within the hierarchy — well-mannered children honor their parents and teachers, industrious housewives tend diligently to their husbands, and content workers serve their bosses without uppity complaints.\n\nOur society is perfect — as are all things under National Socialism. Nothing short of the hand of God could possibly crack our immaculate façade."
 GER_a_thousand_years_more: "A Thousand Years More"
 GER_a_thousand_years_more_desc: "With the pillars of our rule secured forevermore, the Greater German Reich has achieved what Napoleon could only dream of. The lion of Europe has at last been tamed, standing nearly entirely united behind the Europäische Pakt, our glorious brotherhood of nations.\n\nSettlers have spread all across Europe, civilizing the natives with the Aryan way of life. Our superior culture is ubiquitous — all across the continent, store shelves are stuffed with electronics designed in Essen, cuisine from Cologne, and Viennese wine. Translated German magazines stuff French checkout lanes and stock Danish waiting rooms. Bratwurst, beer, and sauerkraut is enjoyed at Oktoberfest celebrations from Helsinki to Dublin.\n\nAll of this while the haughty Co-Prosperity Sphere crumbles and the decadent United States kowtows to the Talmudic Synagogue of Satan. Though there still remains a great deal of work to be done on our side of the world, it is thanks to Albert Speer Jr. 's skyward vision that Europe, a continent once defined by petty, squabbling statelets, can march into the 21st century united.\n\nOur virtuous reign shall last one thousand years — and then a thousand years more. Heil Speer!"
 GER_into_the_digital_age: "Into The Digital Age"
 GER_into_the_digital_age_desc: "As the world enters into a new digital age, so too must the state and her bureaucracy. Originally engineered in the late 1960s as the “NetzRAM”, a masterpiece of superior German engineering and intellect, it enabled Universities, research centers, and Wehrmacht installations to communicate and exchange knowledge. Over time, the NetzRAM has since evolved into something much greater.\n\nHaving proven its unparalleled efficiency in the transmission of data and as the fastest form of communication to date, it is only natural that the WeltNetz powers the Reich’s vast bureaucracy. With the ability to send messages at the blink of an eye and transfer megabytes of data in mere minutes, it is time now to usher in a new age of digital governance. As our first step into the new we will commence the process of nationwide adoption, initiating the full-scale integration of the WeltNetz for official government administrative functions.\n\nGermania was not built in a day and neither will be our digital Reich, this process will start at major government offices across the nation then later expanding to the lower levels of the bureaucracy. In a matter of years, paper will be a relic of the past."
 GER_sky_is_the_limit: "The Sky's The Limit"
 GER_sky_is_the_limit_desc: "While the Steel Eagle settled the homely nest of its well-earned lebensraum, her young flock, seeking to spread their wings even further, embarked on a daring journey into the unknown. Enter, Madagaskar.\n\nRegarded as the ‘Wild West’ of the EuroPakt, the island of Madagaskar is Germany’s portal into the last frontier — the infinite expanse of space.\n\nEver since the founding of the Reichsamt für Luft und Raumfahrt in the 1960s, the Wolfee Complex of Aerospace Operations (WCAO) has existed in Madagaskar as the cradle of all major space missions for Germany. The sprawling facility is largely powered by aerospace products shipped from the Fatherland and a local supply from Antsiranana, where happy natives, thankful for their dependable employment by their German superiors, whistle cheerful tunes as they work from dawn to dusk."
 GER_army_of_the_future: "Army of the Future"
 GER_army_of_the_future_desc: " A decade of relentless innovation and modernization has forged the once bloated and stagnant Wehrmacht that surrendered Moskowien to the Judeo-Bolshevik menace into a truly indomitable force.\n\nOur disgraceful defeat in the Second West Russian War is a bitter, undeniable fact of history. Logically, a pure Aryan army could never lose to an untrained mongrel force — therefore, this fluke was obviously the result of sabotage by Zionist spies infecting the highest echelons of our officer corps from within, allowing our grand Wehrmacht to stand idle well the Reds mounted there hordes. In the years since, these infiltrators, their families, and anyone else associated with them have been hunted. Purged. And erased from history.\n\nWe have learned from our past failures, and are stronger for it. The modern Wehrmacht is the gleaming sword of the pure Aryan race — one that is unsullied by insidious Jewish influence. Our forces stand ready; our morale is unimpeachable. Projects such as the Aussenskelet initiative herald the next generation of warfare, ensuring the Reich’s military remains years ahead of its rivals from Washington and Moscow, to Rome and Tokyo.\n\nWe are invincible, indivisible, and unstoppable!" 
 GER_society_redifined: "Society, Redefined"
 GER_society_redifined_desc: "Ever since we, the Aryan master race, came to walk upon the Earth, our pure bloodline and superior intelligence have made us perennial pioneers of technological progress. While the degenerate, thick-skulled Romans wandered the ancient world wearing skirts, we “barbarians” north of the Danube had the common decency and intellect to invent trousers — and we’ve been well ahead of the curve ever since.\n\nTwo thousand odd years later, it was Germany who invented the very first nuclear bomb, the original cellular telephone, and the paradigm-shifting WeltNetz. All of these awe-inspiring successes were made possible by Germany’s state-sponsored research institutions, robust public education system, and, most of all, our common-sense eugenics policies.\n\nWe Germans hold ourselves to a higher standard. We keep our stock pristine  — which necessitates the elimination of genetic impurities. While other nations waste resources coddling drooling, barely-human mistakes, we have the common sense to put these so-called “people” out of their misery. Weak-willed men call it cruel. Those interested in the constant, unquenching pursuit of humanity’s next great breakthrough call it a necessary sacrifice."
 GER_meet_with_security_council: "A Meeting of the Security Committee"
 GER_meet_with_security_council_desc: "Ah, the Europäische Pakt — the impossible dream of a unified Europe made manifest by Aryan blood, Aryan sweat, and Aryan spirit. As Übermensch — the human ideal — it is our burden to direct the members of our pan-European alliance to obliterate any threat from within or without.\n\nThe recent unrest in Finland is extremely troubling — our current intelligence suggests that Moscow is responsible for funding the barbaric communist militias currently terrorizing the Finnish countryside. Should the situation continue to escalate, as seems inevitable, preventing a Soviet-friendly government from taking control of the country is of paramount importance to European security.\n\nWe will not be idle. Joseph Fischer, our dependable soothsayer, will attend the next meeting of the Europäische Pakt Politics and Security Committee. He will direct our alliance to ensure that the festering, pestilential mass of Jewish degeneracy that once infested out continent shall never return."
 GER_onto_new_frontiers: "The Harvest Of Afar"
 GER_onto_new_frontiers_desc: "The Reich’s latest and greatest territorial conquest wasn’t the degenerate Slavic hordes, nor the backward tribes of the African savannah. Rather, the latest terrain to bow down to Aryan supremacy was none other than the pristine jewel of the night sky: der Mond.\n\nEver since the triumphant moon landing of 1962, the Greater German Reich has transformed the cold, craggy expanse of the lunar surface into a bustling hub of Aryan innovation: the Pionier Moon Base. There, within humanity’s second outpost on the moon, Germany’s best and brightest put their minds together to develop high-grade, space-age technology for the new millennium.\n\nCountless innovations have been theorized, tested, and brought to life within the Pionier base, but all of our discoveries combined pale in comparison to our latest, greatest achievement: the breathtaking power of nuclear fusion. While this technology has already been in use for decades in the production of nuclear weapons and nuclear power plants, these techniques look downright primitive when compared to the theoretical path toward efficient, cost-effective nuclear power recently discovered by our scientists.\n\nThe supreme Aryan race is truly the master of the universe — from the moon looming in the night sky to the microscopic atom, nothing can escape our grasp."
 GER_reichslander_index: "The Protectorate Papers"
 GER_reichslander_index_desc: "Ever since the establishment of the Reichsprotektorate by the administration of Albert Speer Sr., the “Protektorate Papiere”, an annual report on the economic development of the eastern colonies, has been written up and presented to the German Minister of Finance.\n\nInitially, the decision to replace the eastern Reichskommissariats with “guided” collaborationist governments was considered a complete betrayal of Hitler’s visionary world-to-be. Few could argue, however, that the vast number of resources — political and military — required to administer these vast swathes of empty land weren’t hampering our leaders’ ability to keep their own house in order.\n\nIn hindsight, it’s quite odd that our immaculate Aryan intellects didn’t think to make this transition sooner — but that’s probably the fault of Judeo-Israeli infiltration, like all our other supposed “missteps”. While extensive effort still had to be put into stabilizing the newly-established Reichsprotektorate, the past ten years have at last returned optimistic numbers. Today, as the Ministry of Finance puts the finishing touches on the 1995 Protectorate Papers , economists and party executives alike dare to say that our Eastern holdings have turned a small profit.\n\nThis is huge. Should current trends continue, the East’s long-awaited profitability is expected to soar to even greater heights by the year 2000. Another win for our perfect Reich — but, as the youth love to say, “what else is new?”"
 GER_europakts_finest: "Europäische Pakt's Finest"
 GER_europakts_finest_desc: "Sweden, Norway, Finland, and Denmark, our dependable allies to the north, are the foundation of the mighty Europäische Pakt Alliance. Their pristine mountains and misty fjords are not only strategically important for control of the North Sea, but also harbor vast reserves of vital resources that the Reich’s war machine has depended on since the 1940s. Thus, maintaining the favor of this quartet of nordic nations remains one of the Reich’s highest diplomatic priorities.\n\nOn Germany’s dime, construction of the ‘Spirit of Europe’ bridge — a cutting-edge piece of infrastructure connecting Oslo and Stockholm over the Glomma River — is nearing completion. Once the final safety inspections are finished, Fuhrer Speer himself, accompanied by a few other cabinet members, is expected to attend the televised ribbon-cutting ceremony. We will make a speech, shake a hand or two, and snap a few pictures. In doing so, we shall ensure that the frozen north will remain in our corner as the Reich strides fearlessly into the new millennium."
 GER_breaching_the_unknown: "Breaching The Unknown"
 GER_breaching_the_unknown_desc: "The world held its breath in awe when the Reich planted its banner upon the lunar surface in 1962 — but what breakthrough shall become the next gem in our perfect empire’s gilded crown of scientific achievement?\n\nEmbryonic stem cell research is one particularly-promising endeavor. The use of harvested stem cells has already been shown to help epidemiologists understand how diseases occur and proliferate. They can assist pharmaceutical scientists in testing the effects of new drugs and treatments — including the long-sought cure for cancer.\n\nSuch research has received considerable political backlash in the United States, that perfidious den of mongrel degeneracy across the Atlantic. They say it is immoral to harvest human embryos for any purpose — our superior Aryan intellect, however, allows us to see right through the “peer-reviewed” lies of Jewish academia and embrace the undeniable truths of race realism.\n\nWe are all human — but some of us are more human than others. We, the ubermensch, will utilize the embryos of the lesser races we have tamed for the benefit of humanity as a whole. In doing so, the untermensch can take the first step toward redeeming themselves in the eyes of their Aryan betters."
 GER_launch_the_euromark: "Launch The Euromark"
 GER_launch_the_euromark_desc: "At last, after years of planning and preparation, the Euromark — the long-dreamt-of common currency for the Europäische Pakt — is on the cusp of becoming reality. From Paris to Baku, the litany of confusing, unreliable currencies hampering the steady flow of wealth into Germania shall be a thing of the past. In its place, a completely new coin, the first of its kind unspoiled by globalist avarice.\n\nWhen the clock strikes midnight on January 1st, 1997, the symphony of fireworks lighting the night sky will not simply herald a new year, but a new era of wealth and prosperity for millions of German citizens as well. The Euromark is destined to bring Europe even closer together in its neverending crusade for strength, tradition, and prosperity!\n\nIt’s been a long journey, but our tireless efforts have at last borne fruit. Raise a glass — it’s time to celebrate!"

## Phase 2 - The Euromark Thriumps ##
 GER_the_euromark_triumphs: "The Euromark Triumphs!"
 GER_the_euromark_triumphs_desc: "1701. 1871. 1933.\n\nThese monumental dates, drilled into the head of every child who passes through our world-class education system, require no further explanation. With the arrival of the new year, however, another jewel has been set into the glorious crown of German history. One hundred years from today, the year 1997 will be taught to our children as  another landmark moment in the ever-unfolding history of the Germanic race.\n\nAfter years of careful planning, the Euromark — a single currency for the entire European market — has officially been launched. With the entire breadth of the European economy now irreversibly tied to the German Fatherland, the possibilities for future growth know no bounds. It’s only a matter of time, some even say, before the Euromark overtakes the US Dollar as the world's reserve currency.\n\nLet the feeble, female-minded “economists” who doubted us toil in obscurity from their ivory towers. The Greater German Reich has won the day once again — and the rest of the world looks on in awe as we take the next step in cementing Europa beneath our rightful rule.\n\nHeil Speer!"
 GER_does_it_really: "Does it, Really?"
 GER_does_it_really_desc: "With the first thirty days of the year now behind us, the time to consolidate January’s financial statements has arrived. Our economic health is stellar as usual, and the new Euromark continues to enjoy a fruitful debut. There is one very minor hiccup we will need to disclose to relevant stakeholders, however. But really — it’s no big deal.\n\nAs part of the Euromark transition agreement, our government agreed to assume a large portion of national debt from all Europäische Pakt member states in exchange for their participation. This arrangement, while not ideal, was determined to be a relatively safe investment based on the figures we were given. Unfortunately, it has now been revealed that many of our eastern partners have kept their books in less-than-perfect order for the last several decades. The manageable amount of debt we were prepared to assume is, in reality, significantly higher.\n\nNeedless to say, this egregious financial mismanagement was the fault of Zionist infiltration within our ranks, not any incompetence on our part. Nevertheless, our new, unexpectedly-high debt-to-GDP ratio necessitates that growth figures be slightly adjusted, and the budget minorly reallocated. That’s it. There is absolutely no need to panic. None. The German volk will rise to the challenge, as always — this curveball couldn’t have been thrown at a more capable people."
 GER_red_elephant: "The Red Elephant In The Room"
 GER_red_elephant_desc: "| From — £email_deckert  |\n| Subject — THE RED ELEPHANT IN THE ROOM |\n\nTO WHATEVER INTERN MONITORS THIS ELECTRONIC MAIL ADDRESS (IS IT STILL LARS?), PLEASE RELAY THE FOLLOWING MESSAGE TO FÜHRER SPEER:\n\nMESSAGE START. THE RECENT MISSILE ACCIDENT HAS PROPELLED GERMAN-SOVIET TENSIONS TO HEIGHTS UNSEEN SINCE THE PRELUDE TO THE 2ND WEST RUSSIAN WAR. ACCORDING TO THE MOST RECENT DATA (APPROX. 6 HRS AGO), THE PRESENCE OF SOVIET TROOPS ALONG THE EASTERN BORDER HAS INCREASED BY 120% AND CONTINUES TO GROW. I FEAR THE WORST. IT IS OF UTMOST IMPORTANCE THAT WE MOBILIZE THE WEHRMACHT ASAP (“AS SOON AS POSSIBLE”), LEST WE SUFFER ANOTHER “GREAT MISTAKE”.\n\nI WOULD LIKE TO SCHEDULE A F2F (“FACE TO FACE”) MEETING WITH YOU TO DISCUSS THESE MATTERS. DOES TUESDAY AT 11:00 WORK FOR YOUR SCHEDULE? I WOULD APPRECIATE A PROMPT RESPONSE. MESSAGE END."
 GER_pull_fundings_from_esro: "Funding For The RLR"
 GER_pull_fundings_from_esro_desc: "The Reich’s enemies are as shrewd as they are degenerate. Our revenge will come, but for now, the Elders of Zion have forced our hand. Many ideas to pay down the national debt have been proposed, but only two have enough support to survive a vote in the Reichstag: defunding the RLR space program, and severely paring down the state surveillance budget.\n\nMußgnug’s goons have stonewalled both ideas. Fortunately, a few smaller, more sensible factions can still be negotiated with to pass at least one: and our analysts have determined that the RLR cuts are the more palatable option.\n\nThe argument makes itself. While the moon landing proved to the world what National Socialism can really accomplish, it’s time to admit that our space exploration efforts have, in a sense, plateaued. While amateur enthusiasts and unqualified cranks have predicted a Mars landing by 2010, the actual experts don’t anticipate German boots on Martian soil until at least the mid 2020s.\n\nIn this time of crisis, we must prioritize. The Aryan flag is destined to fly proudly over the Red Planet — but we will leave that glorious conquest to the next generation."
 GER_reduce_survelance_budget: "Surveillance Budgets"
 GER_reduce_survelance_budget_desc: "The globalist moles responsible for the Debt Crisis will feel our righteous wrath in time — but first, we must rid ourselves of this burdensome debt before the situation spirals even further. To that end, we have floated two austerity measures in the Reichstag: defunding the RLR space program, and severely paring down the state surveillance budget.\n\nThanks to Mußgnug’s usual obstructionism, we likely won’t be able to pass both proposals. If we focus all of our efforts behind one, however, we might just convince some of the smaller factions to support it. Choosing which idea to campaign for hasn’t been easy, but after much deliberation, our caucus has decided that the surveillance budget cuts are the most convincing of the two.\n\nThe logic is simple. Though vigilant surveillance is one of most important tools to maintain order and civility within our borders, our current technology utterly failed to detect the widespread globalist infiltration responsible for the Debt Crisis. While it is  imperative that we develop the next generation of surveillance tech to strangle the rats before they can strike again, that timeline is measured in years, not months. For now, continuing to funnel money into something that has already failed to protect us will only lead to more damage down the line."
 GER_our_central_european_allies: "Our Central European Allies"
 GER_our_central_european_allies_desc: "The two heavyweights of Central Europe — Hungary and Romania — are essential partners in our greater project of European dominance, forming our bulwark against the Italian scum on our southern border. Given the contentious political situation in Germania, it would be prudent to not take our relationship with either country for granted. By helping to mediate their long-fought conflict over Siebenbürgen, we can ensure both nation’s support of our administration should the worst come to pass. \n\nJoseph Fischer has, in his free time, prepared just a meeting — in addition to a few minor visits to Serbia and Slovakia. Should these diplomatic missions prove successful, perhaps his idea could be expanded to a wider goodwill tour of the Europäische Pakt in general.\n\nEvery last painstaking detail has been planned and every contingency accounted for. Now, all Fischer has to do is present his idea to the Führer. And what better way to do so than over a friendly game of chess?"
 GER_finalize_the_ostwall: "Finalize The Ostwall"
 GER_finalize_the_ostwall_desc: "| From — £email_deckert  |\n| Subject — FINALIZING THE OSTWALL |\n\nLARS, THANK YOU FOR RELAYING MY PREVIOUS MESSAGE. I MUST REMIND YOU, HOWEVER, THAT IT IS CONSIDERED POLITE TO RESPOND PROMPTLY. 13 HOURS LATER IS NOT PROMPT. TY (“THANK YOU”).\n\nMESSAGE START. MY FÜHRER, SINCE YOU REFUSE TO MOBILIZE THE WEHRMACHT IN SPITE OF THE SOVIETS’ DISQUIETING POSTURING, I HAVE BEEN FORCED TO TAKE THE DEFENSE OF THE FATHERLAND INTO MY OWN HANDS.\n\nAS SUCH, THIS MESSAGE SERVES TO INFORM YOU THAT THE FOURTH AND FINAL PHASE OF THE OSTWALL’S CONSTRUCTION IS NOW UNDERWAY, FAR AHEAD OF SCHEDULE. THIS FINAL STRETCH, ENCOMPASSING THE SOVIET-BALTIKUM BORDER, BOASTS BOTH MOBILE AND FIXED GROUND FORTIFICATIONS, ANTI-AIRCRAFT GUNS, AND STATE-OF-THE-ART RADAR DETECTION SYSTEMS. I PRAY IT WILL BE ENOUGH TO WITHSTAND THE INEVITABLE COMMUNIST ONSLAUGHT.\n\nP.S. MANY OF THE FUNDS REDIRECTED TOWARD THE OSTWALL WERE ORIGINALLY ALLOCATED FOR AUSSENKELET DEVELOPMENT. WADR (“WITH ALL DUE RESPECT”), I EXPECT THIS MONEY TO BE REIMBURSED IN FULL. MESSAGE END."
 GER_reichslander_directive: "The Protektorat Decree"
 GER_reichslander_directive_desc: "| From — £email_deckert  |\n| Subject — FYI: PROTEKTORAT DECREE |\n\nTHANK YOU FOR ALL YOU DO, LARS, BUT I WOULD MUCH PREFER TO CORRESPOND WITH THE FÜHRER DIRECTLY. AFTER RELAYING THIS MESSAGE, PLEASE ENCOURAGE HIM TO LEARN HOW TO OPERATE THE PC (“PERSONAL COMPUTER”) CURRENTLY COLLECTING DUST IN HIS OFFICE.\n\nMESSAGE START. MY FÜHRER, THOUGH I COMMEND YOU FOR STANDING YOUR GROUND AMIDST THE SOVIETS’ RIDICULOUS DEMANDS, THE SITUATION ALONG THE EASTERN BORDER CONTINUES TO ESCALATE AS A RESULT.\n\nTHE RECENT BORDER CLASHES HAVE EXPOSED SEVERAL WEAK POINTS IN OUR EASTERN FORTIFICATIONS. IN THE FACE OF YOUR CONTINUED RELUCTANCE TO MOBILIZE, I HAVE TAKEN IT UPON MYSELF TO PREPARE THE LOCAL PROTEKTORAT GARRISONS IN UKRAINE, BALTENLAND, ETC FOR DIRECT COMBAT. I REALIZE THIS MOVE WILL COMPROMISE THE REICHS INTERNAL SECURITY, BUT I MUST DO EVERYTHING IN MY POWER TO REPEL THE COMING INCURSION.\n\nI WILL INTERPRET ANY LACK OF RESPONSE TO THIS E-MAIL AS TACET APPROVAL ON YOUR PART. MESSAGE END."
 GER_prepare_the_wehrmacht: "Prepare The Wehrmacht"
 GER_prepare_the_wehrmacht_desc: "| From — £email_deckert  |\n| Subject — PREPARING THE WEHRMACHT|\n\nLARS, ARE YOU FORWARDING THESE E-MAILS? I STILL HAVEN’T RECEIVED ANY REPLY TO MY 7 PREVIOUS MESSAGES. FNO (“FROM NOW ON”), PLEASE SEND A BRIEF MESSAGE ACKNOWLEDGING RECEIPT.\n\nMESSAGE START. MY FÜHRER, THE SOVIETS SMELL BLOOD. THEIR RECENT INCURSIONS INTO UKRAINIAN AIRSPACE HAVE SIGNALED THEIR CLEAR INTENT TO MAKE WAR. THE RETALIATORY BOMBINGS WE HAVE ENGAGED IN THUS FAR ARE NOT ENOUGH; THE WEHRMACHT MUST BE FULLY PREPARED TO PREVENT THESE RUSSIAN K***S FROM TAKING A SINGLE INCH MORE OF OUR SACRED LEBENSRAUM.\n\nAYN (“AS YOU KNOW”), I HAVE BEEN WORKING AROUND THE CLOCK TO ENSURE THAT OUR WAR STRATEGY — NOT JUST OUR LINEAGE — IS SUPERIOR TO THE BOLSHEVIK MONGRELS. I WOULD LIKE TO MEET WITH YOU SRTL (“SOONER RATHER THAN LATER”) TO DISCUSS SEVERAL PLANS DRAWN UP BY MY STAFF OUTLINING A FULL-SCALE INVASION OF WESTERN RUSSIA. \n\nTHE REDS HAVE PROVOKED OUR WRATH WITH OSTENTATIOUS BOMBAST, BUT IN TIME, THEIR ARROGANCE WILL OFFER MOSKOWIEN TO US ON A SILVER PLATTER. WE WILL PUT THE SNARLING BEAR OUT OF ITS MISERY ONCE AND FOR ALL. MESSAGE END."
 GER_squeeze_megaprojects: "Squeeze The Megaprojekts"
 GER_squeeze_megaprojects_desc: "The visionary architects of the Germanic race are utterly without peer. It’s simply a matter of phrenology. The superior shape of the Aryan skull has blessed us with a higher capacity for mathematical, logical, and visual-spatial reasoning — and we have harnessed that intellectual advantage to construct the modern marvels that draw millions of tourists to our shores each year.\n\nWhile the Americans’ biggest draw is the Grand Canyon — a big hole in the ground — visitors to the Fatherland are bestowed the privilege of standing before the elegant beauty of Neuschwanstein Castle, the gothic stoicism of Cologne Cathedral, and, of course, the humbling magnificence of the Volkshalle, Führer Albert Speer Sr.’s greatest gift to the architectural world.\n\nWithout the proper capital, however, a surplus of IQ will only get us so far. While regrettable, the current economic situation demands that many of our current architectural projects be gently pushed a year or two down the line.\n\nThe Reichstag can agree on that much — determining exactly which projects to delay, on the other hand, isn’t quite so unanimous."
 GER_the_french_state: "The French State"
 GER_the_french_state_desc: "Once united under the banner of Charlemagne, the French and German volk are blood brothers — and like all siblings, we have come to blows more than a few times over the years. Even the fiercest of childhood rivalries eventually disappear with age, however, and in the modern day, our two storied nations have finally found peace and cooperation within the Europäische Pakt.\n\nAlas, tensions still remain. The issue of profit sharing over Madagaskar, for example, has severely strained relations over the past few years. For a long time, we’ve kicked the proverbial can down the road, but now, thanks to the current Pakt-wide economic catastrophe, Führer Speer is in desperate need of allies. We cannot let this petty dispute put the entire European order at risk.\n\nThus, our friend-making tour shall add another destination. Joseph Fischer, our loyal Foreign Minister, and Susini, the “eccentric” President of France, will meet in Paris to finally hash out a solution to the Madagaskar question once and for all."
 GER_kaukasian_riches: "The Kaukasian Riches"
 GER_kaukasian_riches_desc: "Oil is the lifeblood of the Reich’s industrial machine, and Kaukasia is the beating heart that propels the black gold through its veins. Tengiz Kitovani — the two-faced miser who lords over Subsidarität Kaukasia — knows this well, and like a greedy piglet, he has used this leverage to suckle all he can from mother Germania’s teat. More infrastructure. More industry. More investments to bolster the Kaukasian economy and, by extension, funnel as much money into his bottomless pockets as possible.\n\nThus far, Speer has managed to ignore most of Kitovani’s more outlandish requests,  but now, as the possibility of a pro-Mußgnug coup grows more likely by the day, the Führer is no longer in a position to brush off any potential allies — no matter how aggravating they may be.\n\nLike every month prior, a request to meet with Kitovani in Tblisi has landed on Speer’s desk. As our diplomatic tour of the Europäische Pakt adds yet another stop, it would seem that this envelope won’t be “filed away” in the nearest trash can. For once."
 GER_pen_mightier_then_sword: "The Pen is Mightier Than The Sword"
 GER_pen_mightier_then_sword_desc: "In a dramatic escalation, the Soviet MVD has arrested Franz Katzmann, a German citizen attempting to cross the border to “blog” about life in the USSR. Their Jewish-controlled state media has blown up the situation into a massive public spectacle, broadcasting Franz’s kangaroo-court trial on national TV and exhibiting his broken bicycle like some sort of sick trophy.\n\nThis is bad. Even our most apolitical citizens have taken to the streets to demand Franz’s safe return. The ever-pragmatic Gerhard Frey, however, has advised the Führer against the bull-headed aggression that our citizens are calling for. In our current game of geopolitical cat-and-mouse, he says, engaging the Soviets in an all-out war is the only card we have left to play — and that is utterly out of the question at the moment.\n\nIt’s time to come to the table. Yes, caving to the Soviet’s demands after so much posturing will be politically costly, but the fast pace of modern life will erase this incident from the public’s memory in time. Allowing Franz to be executed, on the other hand, would create an immortal martyr that would haunt Speer’s political career long past its final breath."
 GER_no_time_for_diplomacy: "No Time For Diplomacy"
 GER_no_time_for_diplomacy_desc: "Thus far, the fighting over the yet-unresolved missile debacle has taken the form of small skirmishes and occasional airstrikes — but the Reds’ latest move has dramatically escalated the situation. According to Soviet state media, the MVD has arrested Franz Katzmann, a young German who, despite stern travel advisories, had crossed the border to “blog” about life in the USSR.\n\nAs the anointed protectors of the Aryan race, we must expend every effort to bring this young patriot safely home, yet any further escalations could spark a war that we are in no condition to fight. Alternatively, we could back down in exchange for his return, but such a display of cowardice would only further polarize the public against our administration — if such a thing is even possible.\n\nTo no one’s surprise, Deckert has endorsed a more aggressive strategy. He claims to have obtained leaked intel indicating that a large number of Soviet border troops are to be reshuffled in the coming days. Taking advantage of this, he plans to ambush the repositioning divisions and capture a few hostages for ourselves. Once we’ve evened the score, says Deckert, the Reds will be far more agreeable to a prisoner exchange."
 GER_redistribute_infrastructure_funds: "Infrastructure Grants"
 GER_redistribute_infrastructure_funds_desc: "Thus far, our austerity measures have significantly trimmed the budgetary fat — but slashing spending and pausing projects still isn’t enough. If we truly intend to wrangle the massive debt imposed on us by the cultural marxists, we must hunker down and tighten our belts even further.\n\nMußgnug’s clique has whipped the Reichstag into supporting a bill which would drastically reduce infrastructure spending. Their argument is fairly straightforward: While infrastructure investments reliably stimulate economic growth, there is credible evidence of widespread corruption among the officials responsible for handling these funds. Until a thorough investigation can be performed, we must tighten the money flow. Failing to do so is tantamount to dumping two out of every five marks spent on roads, bridges, and rail  into a paper shredder.\n\nWhile conceding to Mußgnug may be a difficult pill to swallow, our hands are tied. The majority of the Reichstag supports the bill — vetoing it would only further galvanize the chamber against our administration."
 GER_minimize_redundant_military_budgets: "Redundant Pensions"
 GER_minimize_redundant_military_budgets_desc: "We’re on the right track. Thanks to a few surgically-precise austerity measures, we can now begin the long, tedious process of paying down the monstrous debt bill the globohomo agenda has foisted upon us. Despite paring down wasteful programs and halting major projects, however, we’re not out of the woods just yet.\n\nTo further relieve the budget, we Speerites have proposed, somewhat controversially, a temporary downsizing of military pensions. We revere the Wehrmacht the same as all other well-meaning German patriots, but in these trying times, everyone must make sacrifices for the Fatherland — even our veterans. According to our calculations, skimming just 17.4% off every ex-soldier’s pension could make the difference between economic recovery and total collapse. Once the Debt Crisis is sorted out, of course, they will be handsomely re-compensated for the trouble.\n\nWe’ve managed to convince just enough pragmatic representatives from Mußgnug’s wing to pass the proposal — but let’s not act too rashly. Should our bill become law, after all, Mußgnug’s base will be less than pleased..."
 GER_the_atlantic_archipelago: "The Atlantic Archipelago"
 GER_the_atlantic_archipelago_desc: "With so many Germans struggling to make ends meet, the more time our administration “wastes” on this recent spate of foreign trips only gives Mußgnug more mud to sling our way. We had planned to make stops in Ukraine and Ireland as well, but Mußgnug’s meddling has forced us to turn our attention back toward domestic issues sooner rather than later. We will have to choose one or the other. \n\nEver since we granteed Ireland the formerly British-occupied North, the united Republic has stood by us as one of our most loyal partners. For unfathomable reasons, however, the Irish’s attitude toward us has grown noticeably colder as of late — and our recent economic woes have only pushed them further away.\n\nThe loss of Ireland as a Europäische Pakt member would be absolutely devastating — both to the greater European economy and Speer’s reputation back home. If we only have time for one final diplomatic trip, let it be to Dublin. We must play every card in our hand to keep the Americans from establishing a foothold on the Emerald Isle."
 GER_ukranian_harvests: "The Ukrainian Harvests"
 GER_ukranian_harvests_desc: "Führer Speer understands the vital importance of Fischer’s recent trip to Paris — and so does Mußgnug. Seeking to counter our alliance-building efforts, he has smeared us in the press, accusing our administration of wasting time on foreign trips while so many Germans continue to struggle back home. As usual, his scheming has worked perfectly, forcing us to reduce the last two stops in our diplomatic tour to just one: Ukraine or Ireland.\n\nAs one of the world’s largest exporters of grain, keeping Ukraine — the “Breadbasket of Europe” — firmly under our thumb is absolutely essential.  The nation’s vital importance to our food supply chain is understood well by the Reds, and it is exactly the reason why they have conspired to claw the country back into their pitiful sphere since the mid-80s. For years now, covert Soviet operations have provoked unrest among the natives — and the latest surge of protests have roped agricultural workers into the madness as well.\n\nDay-to-day life during the Debt Crisis is hard enough without massive grain shortages. Should Speer choose to visit Ukraine over Ireland, he will hold a meeting with Alexander Siech, the leader of Reichsland Ukraine, to discuss solutions to the farmer protests. While he’s at it, he’ll make sure to address any other concerns Siech may have on his mind — anything to ensure his undying support."
 GER_last_resort: "The Last Resort"
 GER_last_resort_desc: "Sharp as a tack, our Aryan wit lends itself greatly toward rational decision making — and it is this exact capacity for calm, civilized discourse that has allowed cooler heads to prevail in the recent diplomatic crisis. Apologies have been paid, and compromises made. After months of tense standoffs, our troops can finally march away from the eastern frontier...and straight into our ruined, fire-scarred cities.\n\nAs outrage over Speer’s deal with the Soviets tramples whatever remained of his reputation, the scope of Mußgnug’s deranged political cult has swelled to unforeseen heights. These groveling lowlifes, Aryan in name only, have decided that if they can’t have a war with the Reds, they will unleash their own in the streets. Local police, already stretched thin by the existing crime wave, now find themselves completely unable to control the massive protests paralyzing our major urban centers.\n\nEnough is enough. We are a nation of laws, not an effete, liberal cesspit that grants the teeming rabble a “right” to defy the word of their betters. As Führer, Speer is well within his rights to remind the masses of their rightful place beneath the jackboot."
 GER_the_r_and_d_question: "The Price Of Loyalty"
 GER_the_r_and_d_question_desc: "Deckert’s gambit, though risky, has paid off in spades, ushering in the long-sought conclusion of one of the tensest episodes in recent history. With the missle debacle now behind us — and Speer’s reputation secure — we can safely shift our focus back toward patching the economic wounds bleeding our nation dry.\n\nDue to Speer’s recent decision to grant Deckert’s Aussenkelet funding, however, there’s almost no money leftover to facilitate this desperately-needed recovery. In fact, the high-interest loans we took out to purchase the Wehrmacht’s loyalty have erased much of the progress made by many of our earlier debt payments.\n\nUnfortunately, what’s done is done, and the Führer has made his message loud and clear. Twice a day, another massive pile of funding requests for various R&D projects lands in Speer’s inbox, awaiting his signature. Spending so frivolously will only drag us closer to defaulting on our debt — yet, as Mußgnug’s shadow looms ever larger, keeping the Wehrmacht in our good graces is absolutely critical.\n\nWhat a headache..."
 GER_balance_the_europakt_partnership: "Balance Europäische Pakt Partnership"
 GER_balance_the_europakt_partnership_desc: "The Führer’s actions may have bolstered his personal relationships with several European heads of state, but the work to erase the immense damage inflicted upon the Europäische Pakt by the Debt Crisis is only just beginning.\n\nWe must secure the unity of our alliance at all costs. To that end, handwritten invitations to a Pan-European Conference, penned by Führer Speer himself, will be sent out to every Europäische Pakt member state. Unlike most other Pakt-wide meetings, we will take a backseat role, opening the floor to any nation who wishes to air out their grievances.\n\nIf the British need another German division to help crush the resistance within their country, we will send three. If the French ask for assistance redeveloping their formerly-Burgundian territories, we will hand them a blank check. If the Hungarians wish for more autonomy, we shall oblige...within reason.\n\nMaking amends won’t be easy, but after everything is said and done, the Europäische Pakt will more closely resemble what it was originally set up to be — not a collection of subservient states, but a true Pan-European alliance."
 GER_feed_the_war_machine: "Feed The War Machine"
 GER_feed_the_war_machine_desc: "Though Speer’s recent diplomatic tour has made him some important friends in high places, Mußgnug’s narrative cannot be allowed to continue. It’s time to turn our attention back toward domestic affairs before the German people’s simmering discontent boils over into an all-out revolution.\n\nCrushing the riots outright would only play into Mußgnug’s hand. Instead, we will embark upon an aggressive propaganda campaign to remind the people of their true enemy — the Jewish World Order and their globalist puppets in Moscow. Once the populace is sufficiently riled up against the Bolshevik threat, we will have all the pretense we need to begin feeding the war machine.\n\nA series of controlled burns will clear out the useless old-growth forests scattered throughout our living space. Thousands of sleek, modern military factories will be built atop the ashes, providing gainful employment for everyday Germans down on their luck. These new factory jobs, reserved for citizens with at least seven verifiable Aryan grandparents, will offer livable wages, guaranteed housing, and plenty of amenities to keep the people happy, docile, and off the streets."
 GER_the_65th_nuremberg_party_congress: "The 65th Party Congress"
 GER_the_65th_nuremberg_party_congress_desc: "Far from the simple political rally it once was, the “Nuremberg Congress”, held roughly once per year, is a televised, open forum in which members of the NSDAP make speeches, take interviews, and engage in spirited debate to unofficially set the NSDAP’s agenda for the year ahead.\n\nIt’s quite unusual to host such an event this time of year, but with the unbreakable deadlock crippling the Reichstag, shining a light on Mußgnug’s obstruction may be our only option to move forward. With any luck, we can put public pressure on the President to push him in the right direction — at least for a little while. \n\nBesides the pressing issue of Germany’s economic recovery, there will be a wealth of other high-priority topics of discussion: the reconstruction of formerly-Burgundian lands, clearly outlining the structure of Europe’s racial hierarchy, and comprehensive education reform. Displaying competent leadership and a willingness to compromise with Mußgnug’s faction on these issues won’t just break the deadlock — it will be just the PR opportunity the Führer needs to make it to the millennium in one piece.\n\nThis has to work. It just has to."
 GER_the_europakts_second_summit: "The Europäische Pakt's Second Summit"
 GER_the_europakts_second_summit_desc: "Mußgnug’s petulant obstruction has gone one step too far. The Reichstag bows to him and him alone — if we hope to make any progress in wrenching the nation back from the brink of total collapse, we cannot rely on our own lawmakers any longer. We must look beyond the Reichstag for concrete legislative solutions, no matter the cost.\n\nThough highly controversial, organizing a second Europäische Pakt Summit may be the only conceivable way out of the corner Mußgnug has trapped us in. Like its previous iteration, the heads of state of each Europäische Pakt member — each with their own varying vote weights — will have the opportunity to debate, discuss, and vote on continent-wide policies to combat the Debt Crisis. \n\nBesides the pressing issue of facilitating Europe’s economic rebound, policies pertaining to energy reform, curating our citizens' online experiences, and plans for a common, continent-wide K-12 curriculum will also be brought to the floor.  If all goes well, this collection of policies will fast-track Europe’s recovery and secure its future for years to come. And if not...\n\n...God help us all."
 GER_the_black_stain_of_europe: "The Black Stain of Europe"
 GER_the_black_stain_of_europe_desc: "Though Hitler was most certainly the greatest man to have ever lived, he was not without his mistakes. The greatest of which was most certainly the mestastisization of Ordenstaat Burgund — an artificial tumor on the face of Europe lorded over by the arch-traitor Heinrich Himmler.\n\nThough these blighted lands have since been reintegrated into their respective states, the legacy of the “Shadow State” still looms in the form of rampant poverty, dilapidated infrastructure, and seething unrest from a traumatized populace of invalids, refugees, and Werwolf terrorists.\n\nThis year’s meeting will play host to our announcement of our “Reset, Restore, and Rebuild” Burgundy reconstruction plan. In doing so, we can kill a whole nest of birds with just one stone — our standing both in the eyes of our allies and the international community will be greatly bolstered, the work opportunities provided by the reconstruction will help reduce the effects of the Debt Crisis, and, last but not least, we can finally scrub every last remnant of the mockery that bastard Himmler has made of our perfect system of National Socialism."
 GER_revaluate_the_euromark: "Revaluate the Euromark"
 GER_revaluate_the_euromark_desc: "The ill-fated launch of the Euromark — and the crippling Debt Crisis that it wrought — is a tragedy in its purest form. We did everything right, and yet, upon the new currency’s premier, globalist interlopers unleashed their well-laid plans to bring it all crashing down. The liberal media will tell you otherwise, but any good German instinctively knows to ignore such degenerate lies.\n\nWe cannot allow the zionist globohomo to prevail — we must do everything we can to stabilize the Euromark as fast as possible. At this year’s meeting, we will outline just such a plan: according to Herr Frey, we can sell off our foreign reserves to create capital outflow, thereby artificially lowering the amount of Euromarks in circulation. This in turn, will sharply increase demand and bolster the currency’s buying power."
 GER_looming_threat_internet: "The Looming Internet Threat"
 GER_looming_threat_internet_desc: "The advent of the World Wide Web has brought with it a wealth of new, exciting opportunities, but also a pale of new threats to the Aryan way of life. For the first time since the 1930s, we cannot protect our citizens from the mental pollution of degenerate media — a website cannot be burnt in a bonfire like books, videotapes, or CDs.\n\nSome have proposed the creation of a “great firewall” to block out the more unscrupulous portions of the net — but anyone tech-savvy enough to own a PC will likely have the know-how to circumvent such a heavy-handed measure. Instead, we will bring a more graceful solution to the table: incorporating each citizen’s browser history as a component of their Anton Drexler Social Credit Score.\n\nWe won’t waste resources blocking out every single un-German webpage. Rather, we will simply mark these pages as restricted and force users to click through a disclaimer before accessing them. Let them consume as much Jewish propaganda as they want — they’ll regret it once their regular visits to nytimes.com disqualify them from renting an affordable apartment."
 GER_the_reichs_citizens: "The Reichs Citizens"
 GER_the_reichs_citizens_desc: "The question of what exactly constitutes an “Aryan” has divided the NSDAP since day one. Scandinavians, genetically close to Germanic Aryans, are almost always included, but the Finnic peoples are not. We teach that Ancient Greek culture was developed by ancient Norse peoples, but modern Greeks are considered to be of alien blood.\n\nAt this year’s meeting, we will argue that the label of “Aryan” ought to be expanded to be as inclusive as possible — that way, the Reich can move toward a more Pan-European identity. We aim to not only define who is and is not deserving of the “Honorary Aryan” label, but delineate exactly where every race stands in the pecking order with innovative new terms like “Semiaryan”, “Uberaryan”, and “Peripheral Aryan”."
 GER_the_resources_of_the_future: "The Resources Of The Future"
 GER_the_resources_of_the_future_desc: "The impact of the Iranian Civil War on oil prices has been nothing short of catastrophic — and with the Bolshevik menace looming ever larger by the day, we cannot afford to tether ourselves to such a volatile fuel source. At the risk of sounding like the bleeding hearts we so despise, we must put our heads together to develop a reliable, alternative fuel source.\n\nThe long-sought solution to our oil woes may just be Biodiesel — a clean, cost-efficient replacement for traditional fossil fuels. Manufactured from plant oils and animal fats, this renewable fuel can be burned in diesel engines without relying on expensive petroleum.\n\nWe are replete with opportunities to seize upon this new technology. By 2015, we could dedicate up to 20% of Eastern European agricultural land to corn, cattle, and soybeans — not for food, but for fuel. Even better, once we have enough biodiesel plants up-and-running, some have even proposed launching a continent-wide campaign to collect citizens’ used cooking grease and recycle it into burnable fuel.\n\nThe world is ours for the taking — and sustainability is the key to our thousand-year reign. Seig heil!"
 GER_the_purpose_of_education: "The Purpose Of Education"
 GER_the_purpose_of_education_desc: "The Prussian model of education is easily the greatest in the world — there is simply no parallel. Every child in Germany, segregated into age cohorts, receives compulsory instruction in reading, writing, and arithmetic. Girls learn to be homemakers, and boys to be breadwinners. Beyond the classroom, extracurricular programs such as the Speer Youth and the League of German Girls help to crystallize each and every youngster’s undying adoration for all things German.\n\nUnfortunately, the same does not hold true for many of our Europäische Pakt partner states. French schools still spend tax dollars instructing students on degenerate modern art. Hungarian music teachers waste time on Do-Re-Mi instead of Beethoven, Bach, and Brahms. Horrific “sex-ed” programs, designed by homosexuals to recruit children into their depraved lifestyles, run rampant in British high schools.\n\nBehind jumpstarting the economy, our second-highest priority should be outlining our plan to standardize educational standards throughout the continent. Children are our future —  and every child under the Reich’s paternal wing must be educated on the same history, language, and values to secure a safe future for Mother Europa."
 GER_the_nsdap_prevails: "The NSDAP Prevails!"
 GER_the_nsdap_prevails_desc: "We’ve done it. After two tumultuous years, our administration’s clever political maneuvering has finally ushered the Debt Crisis — the horrible curse that once threatened to bring the whole Reich to its knees — into the chronicle of history.\n\nThey said it was impossible, but the Greater German Reich now stands stronger than ever before. With our economy up-and-running again, and the whole Party standing hand-in-hand, Germany is prepared to enter the new millennium with its head held high, dreaming of the eternal prosperity to come.\n\nSieg heil!"

## Phase 2 - Finnish Civil War Tree ##
 GER_the_north_in_flames: "The North in Flames"
 GER_the_north_in_flames_desc: "Following the collapse of Russia, the North was seen as an open frontier — a region of cooperation among civilized nations, all bearing the collective burden of bringing order to barbarian lands. By the mid ‘60s, however, some semblance of Russian authority had re-crystallized west of the Urals. The Finns, our honorary Aryan brothers, were forced out of Murmansk and Karelia in a surprise attack, forcing us to reframe our priorities.\n\nThus, the “Rigid North” approach came to be: we would offer military, logistical, and monetary support to the Finns so that the scourge of Communism would encroach no further. The North was to be a beacon of stability — a political dam preventing a flood of Soviet degeneracy. Despite our constant vigilance, however, the Jewish World Order is always one step ahead. The dam has burst, and now, Communist militias have taken up arms in a repeat of 1918.\n\nVictory is inevitable, but we must be careful to not act with too much haste. These “New Reds”, actively supported by Moscow and the OFN, are expected to be significantly more difficult to crush than their predecessors 80 years prior. As we focus on our way forward, we must set our sights upwards and northwards, towards glory and victory, for Finland and the Reich."
 GER_cutting_the_route: "Safeguarding Stability"
 GER_cutting_the_route_desc: "It’s no surprise that the Judeo-Liberal OFN, obsessed with spreading their malignant influence to every corner of the globe, have sunk their claws into the situation in Finland. \n\nOur intelligence shows evidence of an underground arms transport route running through the Scandinavian peninsula. This route — which bribed Swedish and Norwegian officials have turned a blind eye to — is the Finnish Communists’ lifeline, providing them with the supplies, munitions, and equipment they need to keep their ill-fated rebellion alive and kicking.\n\nWe needn’t waste valuable manpower to crush the Bolshevik vermin — only to sniff out their supplier’s tracks and strangle the route at its source. The moment the Reds are forced to fight fair, they will wither away to nothing, and the Finnish volk’s righteous purification can begin at last.\n\nWe can hardly wait."
 GER_there_is_no_lesser_evil: "Pulling The Strings"
 GER_there_is_no_lesser_evil_desc: "How much valuable time has been wasted endlessly debating our strategy for the War in Finland? One day, we reach a consensus to focus on cutting supply lines — the next, a majority of Wehrmacht higher-ups have changed their minds, itching to turn Jonesuu into a city-sized exhibition for our newest panzer model.\n\nIt’s time to look closer and acknowledge the shades of gray between the black and the white. Winning the war is inevitable, regardless of our primary strategy — so what’s the rush?\n\nThe Finnish bureaucracy is in a state of utter panic. Their whole world is crumbling to pieces, and they’re willing to do anything — anything — to put the pieces back together. Rather than drop everything to rush to Helsinki’s aid, why not take advantage of this once-in-a-lifetime opportunity to make a few one-sided deals?\n\nWhat do they have to lose?"
 GER_ripping_the_reds: "Ripping the Reds"
 GER_ripping_the_reds_desc: "The nation of Finland has spent its entire existence repelling Communist infiltration from both within and out — and today, the cycle has repeated anew. As the battlelines in this perennial conflict are drawn yet again, we, the sacred protector of the Aryan race, cannot allow our blood brothers to carry the burden of crushing the Soviet scum alone.\n\nNow is the time for decisive action. We will descend upon the sprawling boreal as living gods, righting all that is wrong. We will purify the tainted Finnish stock and cut loose the mind-poisoned fanatics. We will show Europe — no, the world — what happens to those who interfere with the European order."
 GER_lappland_investigations: "Lappland Investigations"
 GER_lappland_investigations_desc: "BURN AFTER READING.\n\nOUR INVESTIGATIONS HAVE REVEALED A MAJOR NODE IN THE SMUGGLING NETWORK RESPONSIBLE FOR FUNNELING OFN SUPPLIES TO THE BOLSHEVIK REBELS — THE LAPPLAND BRANCH OF THE FINNISH POSTAL SERVICE, LOCATED AT [ R E D A C T E D ].\n\nI WILL BE BRIEF. THROUGH ANY MEANS POSSIBLE, YOU ARE TO SHUT DOWN THIS OPERATION WITHIN [ R E D A C T E D ] DAYS. EXERCISE GREAT CAUTION; YOU ARE OPERATING IN FINNISH TERRITORY WITHOUT THE HELSINKI’S EXPRESS AUTHORIZATION.\n\nMAY YOUR SUCCESS BE SWIFT. HEIL SPEER.\n\nOPERATIONAL NOTES - - - - - - - - -\n* DAILY UPDATES ARE EXPECTED.\n* A WEEKLY STIPEND WILL BE ISSUED TO COVER LIVING COSTS.\n* SHOULD YOUR OBJECTIVE NOT BE CARRIED OUT WITHIN THE SPECIFIED TIMEFRAME, YOUR STIPEND WILL BE SUBTRACTED FROM YOUR REGULAR COMPENSATION."
 GER_hindering_their_supplies: "Hindering their supplies"
 GER_hindering_their_supplies_desc: "Without their fancy OFN toys, these female-minded communists don’t stand a snowball’s chance in hell against our forces. The natural way forward, then, is to deprive the rebels of their precious supply.\n\nWe will scour the land and declaw these unruly animals. We will watch every forest, every village, every highway with a keen eye. Nothing will come even close to crossing the Finnish border without our express permission — and should even a single piece of contraband make it through, every soul in Finland will bear witness to their righteous punishment."
 GER_kuovola_offensive: "Southern Offensive"
 GER_kuovola_offensive_desc: "BURN AFTER READING.\n\nTHE CITY OF KUOVOLA IS HOME TO ONE OF EUROPE’S LARGEST AIRCRAFT MANUFACTURING FACILITIES, [ R E D A C T E D ], LOCATED AT [ R E D A C T E D ]. THE POWERS THAT BE HAVE HAVE DETERMINED THAT ITS IMMEDIATE DESTRUCTION WOULD BE OF GREAT STRATEGIC BENEFIT — REGARDLESS OF WHO CONTROLS IT.\n\nYOU WILL ASSUME A NEW IDENTITY, SECURE A JOB AT SAID FACILITY, AND SEE TO ITS DESTRUCTION WITHIN [ R E D A C T E D ] DAYS.\n\nMAY YOUR SUCCESS BE SWIFT. HEIL SPEER.\n\nOPERATIONAL NOTES - - - - - - - - -\n* DAILY UPDATES ARE EXPECTED.\n* NO STIPEND WILL BE PROVIDED; YOUR FACTORY WAGES WILL COVER YOUR LIVING COSTS.\n* SHOULD YOUR MISSION BE COMPROMISED, EXTRACTION WILL NOT BE POSSIBLE."
 GER_operation_karelia: "Operation Karelia"
 GER_operation_karelia_desc: "The status of Karelia has always been a sore spot between the Soviets and the Finns. Now, to add insult to injury, we can do nothing but watch as the province’s pristine taigas are used as a forward base for the Red guerillas. The rats scurry freely across the border, confident that our watchmen cannot follow without stirring the Soviet beast. No matter how hard we push on the battlefield, these uncivilized brutes will continue to escape unless we can reassert Finland’s rightful border in the coming months.\n\nWhile our hands are tied with regard to directly attacking the Soviet bases, the art of sabotage can be just as effective in accomplishing our goals. A late truck here, an incorrectly-placed division there — perhaps even a misinterpreted attack signal sending them straight into enemy fire.\n\nKarelia may be a safe haven for their treachery for the time being — but we will ensure that their feeble minds never know rest."
 GER_a_war_among_brothers: "A Brotherly War"
 GER_a_war_among_brothers_desc: "For the brave Finnish soldiers manning the frontlines, fighting their former coworkers, schoolmates, and neighbors may be a heart-wrenching task — but our newest propaganda initiative will teach them that such lines of thinking are laughably foolish.\n\nThe Communist guerillas may be of the same Finnish blood, but even the purest blood can be tainted. By aligning themselves with the demons of Moscow, these uncivilized brutes have forfeited any claims to brotherhood that they may once have had. They deserve no pity from those who remain true to Finland — from those who have proven themselves faithful partners of the Reich.\n\nThe Future belongs to us. Glory to the Aryan race!"

## Phase 2 - Iranian Civil War Tree ##
 GER_the_troubled_empire: "The Troubled Empire"
 GER_the_troubled_empire_desc: "The boiling-over of religious and ethnic tensions, coupled with the extreme unpopularity of the Shah, has foisted the Empire of Iran into yet another chaotic civil war. Decades of economic, technological, and military investments are at stake. The German Reich must respond — but Speer’s inner circle is divided between two opposing strategies.\n\nLately, Deckert has made a habit of beginning cabinet meetings with long, impassioned speeches in favor of direct military involvement. While he openly acknowledges that the Shah’s chances of survival are slim to none, he argues that the conflict presents an excellent opportunity to grant our fresh recruits some much-needed field experience. Besides, he says, the Reich is obliged to protect the “honorary Aryan” Persian race.\n\nFrey, for his part, couldn’t care less about whose blood is “pure” enough to deserve Germany’s protection. The security of the Reich’s assets is paramount — and the chances of Imperial success are so vanishingly thin that backing the Shah is tantamount to forfeiting them entirely. In order to protect our investments, he posits, it would be far more prudent to monitor the conflict and quickly establish ties with whatever faction proves itself the most likely successor."
 GER_secure_our_assets: "Secure Our Assets"
 GER_secure_our_assets_desc: "The Empire of Iran is dead. The Shah’s authority has collapsed entirely, with only the capital of Tehran and the surrounding countryside still pledging their loyalty. The final, pathetic remnants of his military are trapped like cornered animals, encircled by bloodthirsty predators patiently waiting for their chance to strike the killing blow.\n\nIran being one of the Reich’s main oil extraction hubs, however, means that simply cutting our losses and pulling out isn’t an option. The Abadan Refinery alone — one of our most important foreign assets —  produces over 100,000 barrels of black gold per day.\n\nIn a matter of months, this vital organ of the Rech — and hundreds of similar facilities — will fall into the hands of the enemy. Rather than fight tooth and nail for a lost cause, we must do everything we can to transfer anything of value — equipment, manpower, reserves — back to the Fatherland before the rats take it for themselves. "
 GER_throw_a_lifeline: "Throw A Lifeline"
 GER_throw_a_lifeline_desc: "The Empire of Iran is among our most valuable geopolitical allies, and for good reason. Not only do the Persians share an inextricable cultural and economic link with the Master Race, but Iran’s strategically-important location holds distinguished economic, political, and military significance, as well. Losing this foothold would deal a fatal blow to our ability to project power in the Persian Gulf, thereby inviting the OFN, Co-Prosperity Sphere, and their Talmuldic, Judeo-Feminist puppeteers to swoop in and steal the spoils.\n\nNo more arguments. No more defeatism. The Greater German Reich is the greatest, purest, most powerful nation in the history of mankind, and we will shape the world according to its will. The enemies of the Shah will tremble before the unrivaled strength of the modern German Heer."
 GER_evacuate_the_embassy: "Evacuate the Embassy"
 GER_evacuate_the_embassy_desc: "We have salvaged what we can. It’s time to go.\n\nThough the Iranians have pleaded with us to reconsider, we now find ourselves in the final stages of evacuating the German embassy in Tehran. This move — a harrowing omen of the Pahlavi Empire’s ultimate fate — has severely strained relations with the Shah’s government, but so be it. Safeguarding the lives of our citizens will always be priority one.\n\nA token force will stay behind to discourage any riff-raff from looting the now-empty building. Meanwhile, all embassy staff will be temporarily resettled in a similarly-sized facility in Baku. If all goes to plan, we will be able to resume normal diplomatic operations in a matter of weeks — assuming the Shah lasts that long."
 GER_provide_humanitarian_aid: "Provide Humanitarian Aid"
 GER_provide_humanitarian_aid_desc: "The decision to evacuate our embassy in Iran was undoubtedly the correct one. Still, the mood in Tehran is now more dismal than ever, and our once-friendly relationship with the Pahlavis has frozen over.\n\nAccess to Iran’s resplendent oil deposits are essential for the continued operation of the German war machine. To keep the black gold flowing freely after the dust settles,  we will need to take the initiative in repairing the bridge we have burned.\n\nFischer has put forward a simple, but effective solution: as a show of goodwill, the Luftwaffe will provide Tehran with regular aid shipments from now until the war’s conclusion. The packages — airdropped into friendly territory — will contain desperately-needed food, clothing, and medical supplies. We will make it clear that the Greater German Reich is still as committed as ever to the safety and security of the Iranian people."
 GER_funding_the_war_industry: "Funding the War Industry"
 GER_funding_the_war_industry_desc: "| From — £email_deckert  |\n| Subject — FUNDING THE WAR INDUSTRY |\n\nLARS, PLEASE FWD (“FORWARD”) THE FOLLOWING MESSAGE TO FÜHRER SPEER:\n\nMESSAGE START. MY FÜHRER, THE CURRENT SCALE OF OUR WEAPONS AND AMMUNITION PRODUCTION IS ABSOLUTELY BELOW PAR. I HAVE SEVERAL CONCERNS. WERE THE RED HORDE TO ENACT THEIR PLAN FOR GERMANY’S TOTAL DESTRUCTION TOMORROW, I FEAR THAT THEIR PRODUCTION CAPABILITIES MAY ONCE AGAIN OVERPOWER OUR OWN.\n\nI UNDERSTAND THE PRESSURE YOU ARE UNDER. THANKFULLY, THE IRANIAN WAR PROVIDES US A CONVENIENT EXCUSE TO SHIFT THE TIDE.\n\nI HUMBLY REQUEST AN IMMEDIATE EXPANSION OF DOMESTIC ARMS PRODUCTION. IN THE SHORT TERM, THE SURPLUS WILL ENSURE A SMOOTH FLOW OF WEAPONS INTO THE HANDS OF OUR STRATEGIC ALLY. IN THE LONG TERM, OUR WORLD-CLASS INDUSTRY WILL BE FULLY PREPARED TO CRUSH THE RUSSO-ILLUMINATI WORLD ORDER WHEN THE NEXT WAR EVENTUALLY ARRIVES AT OUR DOORSTEP. MESSAGE END."
 GER_shipment_of_civilian_goods: "Shipment of Civilian Goods"
 GER_shipment_of_civilian_goods_desc: "| From — £email_frey  |\n| Subject — Shipments of Civilian Goods |\n\nHello, Lars. You are to forward the following message to Führer Speer within 12 hours of receipt:\n\nMy Führer, I’ve been absolutely fixated on the current situation in Iran as of late. The hopelessly-impoverished nation has never been more vulnerable, with its people suffering chronic shortages of food, fuel, and clean water. The functional collapse of the Iranian economy means that, even when these commodities are available, black markets, banditry, and bartering are the only reliable means to access them.\n\nI have never, in my 64 years of life, witnessed such a lucrative opportunity for exploitation. With your approval, I would like to focus my ministry’s efforts on preparing a series of contract templates to distribute to our “big five” corporations. Each will tweak the exact language to their respective specifications, but the general idea — offering humanitarian aid in exchange for exclusive economic rights — will persist across each.\n\nThose I have consulted with thus far have been rightly skeptical, as I assume you are as well. But let me assure you — the Shah is desperate. He would sign away his right arm to delay the demise of his regime for one more day.\n\nCheers."
 GER_send_fresh_recruits: "Send Fresh Recruits"
 GER_send_fresh_recruits_desc: "As a whole, Wehrmacht’s might is utterly unrivaled — but even the fiercest military force is only as strong as its weakest link. The relative peace of the last few years has deprived many of our freshest recruits of any real combat experience, severely diminishing their potential effectiveness on the battlefield.\n\nIran, however, presents the perfect opportunity to remedy this. Rather than waste our most refined troops on a likely-doomed endeavor, we can exploit this conflict to provide our greener recruits with some hands-on fighting experience. Even better, these brave young men will have the privilege of ironing any kinks out of our newer, untested tactics and tech.\n\nWe may need to order more body bags than usual, but such is the price of progress. As the specter of a third West Russian War looms ever larger, we must ensure that the next generation of Aryan warriors are as prepared as possible to carry the burden of defending the Fatherland."
 GER_a_technological_advantage: "A Technological Advantage"
 GER_a_technological_advantage_desc: "Though our steady weapons shipments to Iran have bolstered the Shah’s forces, more than a few of these guns have ended up in the hands of various rebel groups. This is certainly irritating, but ultimately of little concern — these irregulars have no training, no common sense, no comprehension of tactics. A few shiny playthings won’t make up for our crushing technological advantage.\n\nAmong many other military innovations, Iran has served as a testing ground for the idea of “network-centric warfare” — a doctrine that legerages computer networking technology to achieve a decisive informational advantage on the battlefield.\n\nThus far, this new approach, utilized primarily by the Luftwaffe, has been a massive success. Our informational superiority has afforded us total control over the Iranian airspace. Not even a bird could fly to its nest without the Luftwaffe's express permission — an unsettling reality for our stone-age opponents still rooted to the ground."
 GER_war_ruins_what_peace_built: "War Never Changes"
 GER_war_ruins_what_peace_built_desc: "As the fighting rages on across the Persian Plateau, there still remains so much more to do — more troops to send, more aid to deliver, more assurances to make. With the Debt Crisis still far from resolved, however, there is a hard limit to how many resources our government can safely divert toward Tehran — and we have reached it.\n\nWe have done all we can. The fate of the Shah now rests in the hands of his people. Should their long-fabled triumph come to pass, let us pray that they will be merciful."

