 government_franz_schonhuber: "Franz Xaver Schönhuber\n--------------\nReichsminister für Volksaufklärung und Propaganda\n[getGERgovernmentloyalty9]"
 government_franz_schonhuber_long: "Franz Xaver Schönhuber was born April 17, 1934, in Munich, Germany. He completed his Abitur in 1942, joining the Hitler Youth and subsequently the Nazi Party. A dedicated National Socialist, he volunteered for the Waffen-SS and completed training in the Charlemagne-SS Division as an interpreter and instructor. He participated in combat operations across the eastern front till the war's end. He retired from the SS, having been awarded the Iron Cross, second class.\n\nFor two decades after the war, Schönhuber worked in Bavaria's media sector, first at Abendzeitung and Großdeutsche Woche, later moving to the Bavarian department of the Reichs-Rundfunk-Gesellschaft. By the late 1970s, he had risen to prominence, becoming chairman of the Bayerischer Journalisten-Verband (BJV) and a member of the Großdeutscher Presserat. His success did not go unnoticed, attracting the interest of the RMVP, which offered him a position he could not refuse: state secretary of press.\n\nBy the early 1990s, Schönhuber had ascended to the position of Reichsminister for Public Enlightenment and Propaganda. A staunch hardliner within the NSDAP, he vehemently opposed the reforms spearheaded by Speer Jr.'s regime. Nostalgic for the “good old days,” Schönhuber resists any reforms that threaten his authority or that of the Ministry. Whether the new millennium will bring the return of the era he so cherished remains to be seen."
