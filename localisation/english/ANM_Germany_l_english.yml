## Descriptions ##
 # Country Leader #
 POLITICS_ALBERT_SPEER_JR_DESC: "Albert Friedrich Speer Jr. is a far cry from the powerful man he once was. Born July 29, 1934 to one of the most powerful men in the Greater German Reich, the younger Speer enjoyed quite a cushy, comfortable life until his ascension to the Fuhrership.\n\nUnder Speer’s leadership, Germany suffered a humiliating defeat in the Second West Russian War at the hands of the resurgent USSR. Speer’s approval rating nosedived to unforeseen lows, and have languished in those depths ever since. Martin Mußgnug’s conservative faction, seeing an opportunity in Speer’s sudden weakness, worked to undermine his government at every possible point, eventually elevating Mußgnug’s influence higher than the Fuhrer above him.\n\nIn the following decade, Speer’s fortunes seldom improved. The loss of the East inspired widespread anarchist agitation throughout the Reich. A decade of stagnation and political deadlock tarnished Speer’s reputation further with each passing year, and the hasty formation of the Europäische Pakt — a merger of the Zolvereinn and Einheitspakt — did little to stymie Germany’s economic woes. Only within the last few years has the Europäische Pakt paid dividends — a desperately-needed win for Speer’s flagging regime.\n\nToday, the sidelined Fuhrer battles with conservative and reactionaries alike in an effort to reassert his formerly-unbridled power. Despite his unenviable position, Speer remains steadfast in his effort to establish his personal vision upon Germany, no matter how unlikely such a dream may be."

 # Minister #
 GER_Martin_Mussgnug_hog_desc: "Martin Mußgnug, born in 1936 to an SA squad leader, was already a devout National Socialist by the time he entered kindergarten. He supported Speer Sr in the power struggle that followed Hitler’s death, and after the tensions cooled, a zealous Mußgnug began his arduous climb to the top of the political ladder. To young Martin's horror, the ensuing years would see the erosion of the Fatherland’s dominant posture on the world stage, culminating in the worst military disaster in German history; The Second West Russian War.\n\nMußgnug would never admit it, but he still remembers the bottle-smashing fit of rage he pitched upon hearing the news of Germany’s surrender. It was on that night that a life-changing realization dawned on him; If Germany was to be saved, he, and no one else, would need to ascend to the Führership.\n\nFor the next two decades, Mußgnug would grasp every opportunity to accumulate power, wealth, and influence; for his efforts, he eventually found himself elevated to the enviable role of Reichstag President. In this role, Mußgnug’s incredible influence would enable him to execute a sort of social coup against the unpopular Fuhrer Speer. Though Mußgnug lacks any formal authority, a healthy majority of the NSDAP are markedly more loyal to him than to the Fuhrer.\n\nOne would be a fool, however, to assume that President Mußgnug would be satisfied with anything short of absolute power. For now, he bides his time — but the writing is on the wall." 
 GER_Gerhard_Frey_eco_desc: "Dr. Erhard Frey, born in Cham, Bavaria in 1933, was raised to honor his race, his country, and his Führer — in that order. Excelling in mathematics during his youth, Frey’s industrious work ethic and natural curiosity would eventually earn him a doctorate in Economics from the University of Graz.\n\nPost graduation, Frey would join the ranks of the German conglomerate Mercedes-Benz, employing his expertise to oversee all of the company’s factories north of the Rhine. During the 60’s, Mercedes-Benz was not excluded from Speer Sr.’s conglomerate crackdowns, but Frey, one of the few competent managers among the corporation’s ranks, was spared Speer’s wrath. On the contrary, Frey would later be hand-picked to serve as Germany’s Economic Minister by Albert Speer Jr. amidst a purge of sycophants and incompetents within his cabinet.\n\nIn his current role, Gerhard Frey is well-regarded as one of the few apolitical figures within the Speer Administration. Frey values the German economy’s long-term health over all else, and rarely engages in the ever-present ideological bickering within the NSDAP. Frey’s judicious management skills prevented the total collapse of the German Economy after the Second West Russian War, and now, as the Millenium Rise leads the Reich toward its most prosperous year to date, Frey can at last rest on his laurels." 
 GER_Olaf_Rose_for_desc: "Olaf Volker Bernhard Rose was born into a traditionally conservative family who expected highly of their boy, wanting him to grow to be a proud Aryan warrior. That however, would not be Rose’s path, for he was rebellious. He despised his parents, and threw in with left-wing counter-culture crowds. After graduating, Rose went to college and wrote a paper on the Soviet Union, praising it for its so-called “bravery” in the West Russian War. Authorities arrested Rose and he was sentenced to a year of community service, luckily escaping a worse fate.\n\nDuring his community service in Berlin, Rose witnessed the left-wing terror attack on the Wehrmacht headquarters in Berlin. This traumatic experience gradually moderated his views, and Rose soon resented the former communist ideals he once espoused, seeing the terror that socialists brought upon his home. After college he entered local politics and quickly showed to be a silver-tongued orator, cautiously dubbed the Next Kurt Georg Kiesinger.\n\nHis skills led to him becoming Foreign Minister of the Reich. Chief among his foreign policy accomplishments is the preservation of the nascent Europäischer Unabhängigkeits- und Integritätspakt through the economically-stagnant ‘90s, as well as the recent détente talks with Japan and the United States. As the world enters the 21st century, his competent negotiation skills are assured to make the most of the Fatherland’s recent economic boom."
 GER_Rudiger_Lucassen_sec_desc: "Rüdiger Lucassen was born in 1951 in Schleswig-Holstein to a proud military family, his father having fought against the Red Menace in the West Russian War. Lucassen enlisted in the military right out of secondary school, entering officer training as early as possible. He excelled in the Wehrmacht and in university, taking economic classes during his time in the army.\n\nLucassen served as a general staff officer in the Wehrmacht, mostly managing logistics and operating with R&D. He worked extensively with the Falschimjagers, even learning to fly a helicopter himself. The terrorist attack on the Wehrmacht headquarters in Berlin by socialist perpetrators left countless dead, including the previous Minister of National Defense, Günter Kießling. Lucassen barely saved the head of the OKW, Gerd Schultze-Rhonhof, from the bombers. Inspired by the man, and needing a new Minister of National Defense, Schultze-Rhonhof polled Speer about a potential successor, and not much later Lucassen was placed as the new Minister of National Defense.\n\nLucassen now strives for extensive R&D and military funding, believing that a new wunderwaffe will destroy the Judeo-Bolshevik menace once and for all."

 
### Ideas ###
## Starting Ideas ##
 GER_the_puppet_fuehrer: "Overshadowed Fuhrer"
 GER_the_puppet_fuehrer_desc: "It was during Adolf Hitler’s thirty-year reign that the world at large was first introduced to the title of Fuhrer – the supreme, uncontested, all-powerful leader of the Greater German Reich.\n\nThe office’s current holder, Albert Speer Jr, can hardly be described in such glowing terms. Ever since the disastrous Second West Russian War and the resulting unpopularity of Speer Jr.’s government, the “true” leader of Germany has been, to many, Martin Mußgnung, the current Reichstag President. A tried-and-true conservative, President Mußgnug lacks any formal powers, but he nonetheless wields a considerably higher amount of influence in German politics than the “all-powerful” Speer Jr.\n\nToday, the sidelined Fuhrer and his small clique of loyalists, in an effort to regain the absolute power wielded by the three Fuhrers before him, engage in a never ending tug-of-war against their more influential adversaries in the Reichstag. Unfortunately for Speer, however, his persistence has thus far borne little fruit. The seeds of Mußgnung’s glacial coup have been sown; Nothing short of a miracle can stop him now."
 GER_millennium_rise: "The “Millennium” Rise"
 GER_millennium_rise_desc: "After the Europäische Pakt was founded as a single continental market, the war-weary German economy at last began to piece itself back together. With the support of its continental allies, the crawling Reich slowly learned to stand on its two feet, but not before enduring a grueling period of stagnation.\n\nAdversity, however, is no stranger to the German people — and neither is victory. Today’s Europäische Pakt is a veritable economic behemoth, and the “Millennium” Rise shows no signs of slowing down.\n\nThe Munich Stock Exchange, home to profitable firms such as BMW and IG Farben, attracts shrewd investors eager to stake their claim in the Reich’s flourishing market. As Daimler, Siemens, and Allianz join the ranks of the most valuable companies in Europe, the benevolent NSDAP ensures that their exorbitant profits trickle down to Germany’s prosperous middle class — as long as they have the right blood.\n\nThe year 1996 is projected to be yet another year of unprecedented growth. Germany stands on top of the world. What could possibly knock them down?"
 GER_the_ailing_order: "Fractionalized NSDAP"
 GER_the_ailing_order_desc: "Despite the Greater German Reich’s uneasy status as a superpower among superpowers, the NSDAP bureaucracy, having replaced the military and the Fuhrer as the driving force behind German politics, is irreparably divided.\n\nThe consequences of such factionalization have far-reaching implications for German society. The modern NSDAP can hardly be described as a mere political party; it is an omnipresent fact of life, with effectively the entire German middle class entangled to some degree in the NSDAP’s labyrinthian administrative apparatus.\n\nFrom the outside looking in, the NSDAP guides the German people with a strong, decisive voice. A keener eye, however, reveals the stammering thoughts trailing behind every word. Every day, Technocrats, Militarists, Environmentalists and Traditionalists alike squabble over the pettiest political minutiae. These divisions, in turn, create a myriad of inefficiencies that trickle down to affect the daily lives of even the most apolitical German citizens." 
 GER_space_spirit: "Eyes on the Stars"
 GER_space_spirit_desc: "The brainchild of engineering maverick Wernher von Braun, Germany’s RLR has distinguished the Greater German Reich as the world’s unrivaled technological trailblazer.\n\nFor years, the decades of chaos that followed the Reich’s triumphant moon landing appeared to spell the end of Germany’s celestial expeditions. However, the installation of a permanent moon base in 1994 — ESRO’s first major accomplishment since its revival in the late 80s — has once again turned the eyes of the German public toward the stars.\n\nWith the swastika planted proudly on the lunar surface, RLR’s new team of fresh-faced, ambitious engineers now turn their attention toward the red planet, aspiring to land a rover on the Martian surface by 2010. Such a feat seems utterly impossible within such a short timeframe, but then again, the same despondent doubts were common fifty years ago when the Reich first set its sights on the final frontier."
 
## Phase 1 Focus Tree Ideas ##
 GER_millennium_boom: "The “Millennium” Boom"
 GER_millennium_boom_desc: "After the Europäische Pakt was founded as a single continental market, the war-weary German economy at last began to piece itself back together. With the support of its continental allies, the crawling Reich slowly learned to stand on its two feet, but not before enduring a grueling period of stagnation.\n\nAdversity, however, is no stranger to the German people — and neither is victory. Today’s Europäische Pakt is a veritable economic behemoth, and the “Millennium” Boom shows no signs of slowing down.\n\nThe Munich Stock Exchange, home to profitable firms such as BMW and IG Farben, attracts shrewd investors eager to stake their claim in the Reich’s flourishing market. As Daimler, Siemens, and Allianz join the ranks of the most valuable companies in Europe, the benevolent NSDAP ensures that their exorbitant profits trickle down to Germany’s prosperous middle class — as long as they have the right blood.\n\nThe year 1996 became a year of unprecedented growth. Germany stands on top of the world, nothing can stop us now."
 GER_high_tech_military: "High-Tech Military"
 GER_high_tech_military_desc: "Half a century ago, the mighty Wehrmacht blitzed its way across Europe, bringing the Allies and Soviets to heel. However, in the years following WW2, the once-formidable Wehrmacht became bloated and mismanaged. Cracks began to appear one after the other, no matter how many fresh coats of paint we slapped on it.\n\nAll of the Wehrmacht’s problems came to show during the Second West Russian War. As Moskowien was torn from our grasp, all blame was thrown on the Wehrmacht. Had they been managed just slightly better, perhaps we would have bested Ivan for a second time.\n\nSince the end of the war, the Wehrmacht has seen not just an increase in budget, but heavy restructuring. New training has occurred on every level of every branch of the military. Our forces must be strong and disciplined if we are to continue to defend Europe from the red menace.\n\nRecent technological advancements have also bolstered the strength of the Wehrmacht, proving it really is the army of the future. When the time comes to reclaim Moskowien, our mighty Wehrmacht will knock the Russians to their knees!"
 GER_euromark_preperations: "Euromark Preperations"
 GER_euromark_preperations_desc: "On January 1st, 1997, the world will be forever changed. Years of planning and preparations have culminated in this upcoming moment. This will surely be the most important date in Germany’s history, besides our beloved Führer’s birthday of course! The future is now, friends, and the future starts with uniting our currency!\n\nThere is still much more preparation to come. We must work to collect and exchange all notes for currencies that will no longer matter. It is also very important we ensure that our people understand how the new currency works, and how it will positively affect their lives!\n\nHowever there are still many skeptics about the Euromark. Convincing investors that it would work was hard, convincing every person in the Europäische Pakt will be harder. Still, skeptics or not, this is a bold step towards building a brighter tomorrow, for all Germans!"
 GER_out_of_the_world_discoveries: "Out-Of-The-World Discoveries"
 GER_out_of_the_world_discoveries_desc: "Germany has always been at the forefront of technological advancement, from the nuclear bomb to the rocket that took man to space. Yet, in the 70s and early 80s we began to lag behind the other powers, specifically the USA. The Second West Russian war put a massive halt on any sort of science projects we were working on, and in the aftermath we forgot about them.\n\nBut now, we are making our comeback. Thanks to a period of general peace, we’ve raised a new generation of scientists and engineers, rather than soldiers. This has resulted in a “science boom” in ESOC, the likes of which have never been seen before!\n\nIt currently seems almost as if there is a new major idea or theory everyday, challenging ways of thinking that are generations old. This, mixed with recent breakthroughs in nuclear energy, has allowed Germany to crawl ahead of some of our major scientific competitors. Soon we will affirm our dominance as the world’s leading scientific power!"
 GER_fulfilled_people: "Fulfilled People"
 GER_fulfilled_people_desc: "Long gone are the days of hauling a wheelbarrow of cash to the market for a loaf of bread, in fact many Germans are too young to even remember that. With the way things are going in the Reich right now, Germans have next to nothing to complain about!\n\nAcross the Reich people enjoy the all time economic high and great job stability. They love learning about the great advancements we’ve made in the scientific field. For once the party is truly trusted by the German people, and Gauliga is actually interesting to watch!\n\nOverall, Germans are enjoying the first true prosperity we’ve seen since the early 50s. If the NSDAP and the Führer himself work to keep this stability high, Germany might truly be entering its first real decade of calmness, innovation, and most of all peace!"
 GER_the_weltnetz: "The Weltnetz"
 GER_the_weltnetz_desc: "The WeltNetz, a logical successor to the long outdated NetzRam, is perhaps the most groundbreaking invention the Reich has ever gifted the world. Hundreds of thousands of people can communicate with each other in mere instants, no matter the distance between them.\n\nAnd in the recent past the WeltNetz has grown even more, with everyone under the sun wanting to check out the new technology. As we transfer into the 21st century, many believe the WeltNetz will define it perfectly, as well as decide how people live their lives, and spend their free time.\n\nYet the WeltNetz is both a blessing and a curse. Despite our best efforts, some people use it as a tool to undermine our regime. We must work around the clock to ensure that the people don’t get any dangerous ideas from “trolls”. Still, it also provides the best opportunity to spread propaganda since the invention of the radio and television."

 
 GER_europapakt_member: "Center of the Europäische Pakt"
 GER_europapakt_member_desc: "The Europäische Pakt is the perhaps most ambitious international project of all time. Created as a merger of the Einheitspakt and the Zollverein economic union, it coordinates the Economy, Military and Politics of the German-aligned European Sphere. Travel, Trade and Borders are open for all members. It seems as if Europe has come together for the first time in millennia. However, the future of the Europäische Pakt is uncertain. With democratic and German-inspired regimes alike, the question of European Ideology is heavily debated. The more reactionary forces within Germany oppose the Pakt, some wish for more national control. Most of the EP power still rests within Germany itself, and conflicts are common, but \n§MEuropean Unity§! is not a distant dream anymore, although its character has not been decided."

