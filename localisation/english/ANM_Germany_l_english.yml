### Leader Bios ###
 POLITICS_ALBERT_SPEER_JR_GERMANY_DESC:0 "Albert Friedrick Speer Jr. is a far cry from the powerful man he once was. Born July 29, 1934 to one of the most powerful men in the Greater German Reich, the younger Speer enjoyed quite a cushy, comfortable life until his ascension to the Fuhrership.\n\nUnder Speer’s leadership, Germany suffered a humiliating defeat in the Second West Russian War at the hands of the resurgent USSR. Speer’s approval rating nosedived to unforeseen lows, and have languished in those depths ever since. Martin Mussgnug’s conservative faction, seeing an opportunity in Speer’s sudden weakness, worked to undermine his government at every possible point, eventually elevating Mussgnug’s influence higher than the Fuhrer above him.\n\nIn the following decade, Speer’s fortunes seldom improved. The loss of the East inspired widespread anarchist agitation throughout the Reich. A decade of stagnation and political deadlock tarnished Speer’s reputation further with each passing year, and the hasty formation of the Europakt — a merger of the Zolvereinn and Einheitspakt — did little to stymie Germany’s economic woes. Only within the last few years has the Europakt paid dividends — a desperately-needed win for Speer’s flagging regime.\n\nToday, the sidelined Fuhrer battles with conservative and reactionaries alike in an effort to reassert his formerly-unbridled power. Despite his unenviable position, Speer remains steadfast in his effort to establish his personal vision upon Germany, no matter how unlikely such a dream may be."


### Focus Trees ###
 ## Phase 1 - Starting Tree ##
 GER_the_eagles_reign:0 "Reign Of The Eagle"
 GER_the_eagles_reign_desc:0 "Not long ago, the Greater German Reich seemed doomed to extinction. A devastating succession crisis, the collapse of Himmler’s insidious Shadow State, and a humiliating defeat in the Second West Russian War all appeared to spell the end of Adolf Hitler’s Thousand-Year Reich.\n\nBut the wise leadership of Hitler’s successors — Speer Sr. and Hans Spiedel — guided our nation away from the precipice of destruction. It was their thoughtless devotion to the Fatherland that, against all odds, allowed the immortal ideology of the pure Aryan man to live on into the dawn of the Third Millennium.\n\nAs was yesterday, as is today, as will be tomorrow. Nothing can stop us. No matter what challenges lie in wait, the German Eagle shall reign forevermore, uncontested by all but a handful of weak, degenerate nations."
 GER_a_new_wirtschaftswunder:0 "A New Wirtschaftswunder"
 GER_a_new_wirtschaftswunder_desc:0 "The numbers are in — all signs point to a German economic golden age within the first decade of the new millennium. At last, our wise investments are paying handsome dividends. Gone are the days of austerity, inflation, and fiscal uncertainty that haunted us following the Europakt’s disastrous launch.\n\nThe German middle class is flush with cash. Rather than worry about how to pay rent or where his next meal will come from, the average consumer is now free to squander away his free time debating which designer brand fits him best. High-tech industrial start-ups flourish in the Ruhrgebied, selling cutting-edge production advancements to a salivating international market.\n\nShould we continue at our current pace, it won't be long until our glorious Reich finally overshadows the United States, the world’s economic powerhouse since the end of the First World War . But unlike their detestable liberal dystopia, the Greater German Reich doesn’t need any help from the Elders of Zion. We have earned everything we have with Aryan blood, Aryan, sweat, and Aryan will."
 GER_introduce_the_euromark:0 "Euromark Preparations"
 GER_introduce_the_euromark_desc:0 "The economy of the Europakt, though guided by the wise hand of the Reich, is nevertheless encumbered by the myriad of different currencies used by its constituent nations. To remedy this situation, Germany’s best economists and policy-makers have crafted a new, innovative solution — the Euromark.\n\nThe Euromark — ‘Euro’ for short —  will further the integration of Germany's sphere by creating a single, stable currency for every country within the Europakt. Gone will be the days of clumsy conversions jamming up the gears of the Reich’s mighty economic machine. Instead, citizens of the Pakt can expect to reap the rewards of a unified currency — easier trade, expanded opportunities for investment, and the capacity for mutual economic support between nations.\n\nIf our economists are to be trusted, the buying power of the Euromark could surpass that of the U.S. Dollar in a matter of years, not decades. Should this prediction prove true, the European economy is destined to soar to even greater heights."
 GER_a_loyal_party:0 "A Harmonious Party"
 GER_a_loyal_party_desc:0 "Moreso now than at any point in its history, the NSDAP stands united and strong. Thanks to the great purges of the 1970s, the degenerate rats that once plagued the party with petty factionalism scheme no more.\n\nRaise a glass – Whether through the vision of our current leader, Albert Speer Jr., or the unified apparatus of the party, the immortal doctrines of Albert Speer will live on for a thousand years!"
 GER_a_satisfied_people:0 "A Satisfied People"
 GER_a_satisfied_people_desc:0 "The German lifestyle of today is defined by unprecedented prosperity, unencumbered by the economic anxieties faced by previous generations. The modern German husband works a stable nine-to-five to provide for his faithful wife and healthy children.\n\nShould any German’s luck run short, the Sozialgesetzbuch – Germany’s generous, well-funded welfare system – helps him back on his feet. Widows and orphans are well cared-for, and crime sits at an all-time low. Sodomy, drug use, and other degenerate activities are unheard from the Maas to the Memel.\n\nAt last, our fabled utopia has become reality, and the Reich can rest on its laurels. All that’s left to do is to celebrate the future, hand in hand."
 GER_endless_stability:0 "Eternal Stability"
 GER_endless_stability_desc:0 "Our flawless system of National Socialism has, at last, proven itself superior to the litany of failed, mongrel ideologies that once littered the gutters of Europe like common trash.\n\nThe German Reich is the most well-functioning, stable society that the Earth has ever known. Our loyal, productive citizens know their place within the hierarchy — well-mannered children honor their parents and teachers, industrious housewives tend diligently to their husbands, and content workers serve their bosses without uppity complaints.\n\nOur society is perfect — as are all things under National Socialism. Nothing short of the hand of God could possibly crack our immaculate façade."
 GER_a_thousand_years_more:0 "A Thousand Years More"
 GER_a_thousand_years_more_desc:0 "With the pillars of our rule secured forevermore, the Greater German Reich has achieved what Napoleon could only dream of. The lion of Europe has at last been tamed, standing nearly entirely united behind the Europakt, our glorious brotherhood of nations.\n\nSettlers have spread all across Europe, civilizing the natives with the Aryan way of life. Our superior culture is ubiquitous — all across the continent, store shelves are stuffed with electronics designed in Essen, cuisine from Cologne, and Viennese wine. Translated German magazines stuff French checkout lanes and stock Danish waiting rooms. Bratwurst, beer, and sauerkraut is enjoyed at Oktoberfest celebrations from Helsinki to Dublin.\n\nAll of this while the haughty Co-Prosperity Sphere crumbles and the decadent United States kowtows to the Talmudic Synagogue of Satan. Though there still remains a great deal of work to be done on our side of the world, it is thanks to Albert Speer Jr. 's skyward vision that Europe, a continent once defined by petty, squabbling statelets, can march into the 21st century united.\n\nOur virtuous reign shall last one thousand years — and then a thousand years more. Heil Speer!"
 GER_into_the_digital_age:0 "Into The Digital Age"
 GER_into_the_digital_age_desc:0 "The WeltNetz computer network, sometimes translated as the “Worldwide Web”, was first engineered in the late 1960s as a way for German universities and research centers to communicate between one another. Today, however, with the widespread adoption of the personal computer in households around the world, the WeltNetz has metamorphosed into a truly massive network of websites, chatrooms, and game servers accessible by any average joe willing to fork up the cash for a PC of their own.\n\nAs of 1996, a jaw-dropping 100,000 websites exist on the WeltNetz, lovingly crafted by enthusiasts of all stripes. Like magic, electronic mail allows users to send and receive messages from thousands of miles away in the blink of an eye. Typing skills have begun trickling into school curriculums around the world, and groundbreaking software such as Microsoft Excel makes organizing and computing large sets of numerical data a breeze — just don’t forget to save.\n\nBut there are two sides to every coin. Just as the WeltNetz has revolutionized the lives of everyday Germans, it has also been used by rouge cells of bolsheviks, liberals, and other Merovingian-Zionist groups to plot the downfall of our resplendent Aryan empire. Short of outright banning personal computers, there is currently no way for the German government to restrict these groups’ communications.\n\nThis is a problem. While the best way to combat these anti-German agents on the digital frontier remains unclear, we can use the existing eyes and ears scattered throughout the country to root out these anti-German agents in the meantime. After years of development, our innovative “social credit” scoring system is ready for launch — this simple system of tracking citizen’s actions will dramatically enhance our ability to arrest and eliminate these Jewish interlopers before they can flood the nascent WeltNetz with their lies"
 GER_sky_is_the_limit:0 "The Sky Is The Limit"
 GER_sky_is_the_limit_desc:0 "While the Steel Eagle settled the homely nest of its well-earned Lebensraum, her young flock, seeking to spread their wings even further, embarked on a daring journey into the unknown. Enter, Madagascar.\n\nRegarded as the ‘Wild West’ of the Greater German Reich, the island of Madagascar is Germany’s portal into two untamed frontiers — the sprawling African wilds, and the infinite expanse of space.\n\nEver since the founding of the RLR in the 1960s, the Wolfee Complex of Aerospace Operations (WCAO) has existed in Madagascar as the cradle of all major space missions for Germany. The sprawling facility is largely powered by aviation products from Antsiranana, where happy natives, thankful for their dependable employment by their German superiors, whistle cheerful tunes as they work from dawn to dusk.\n\nA hop, skip, and a jump away from this bustling factory town, one will encounter an intricate system of barricades, dividing the island between the Deutsch-Afrikaners and the native Malagasy. Heavy investments into the northern portion of the island — dubbed ‘Neueuropastadt’ by its German settlers — have attracted a large influx of European migration that has completely resculpted the demographic makeup of the region. Germany’s last foothold in Africa following the loss of its Central African holdings, the Neueuropastadt colony is well-known for producing the bountiful harvests of exotic fruits and vegetables that line store shelves all across the Fatherland."
 GER_army_of_the_future:0 "Army Of The Future"
 GER_army_of_the_future_desc:0 "A decade of relentless innovation has transformed the weak, feeble Wehrmacht that surrendered the East to the Reds into a truly indomitable force.\n\nOur disgraceful defeat in the Second West Russian War is an undeniable fact of history. Logically, a pure Aryan army could never lose to an untrained mongrel force — therefore, this fluke was obviously the result of sabotage by Zionist spies infecting the highest echelons of our officer corps. In the years since, these infiltrators, their families, and anyone else associated with them have been hunted. Purged. Erased from history.\n\nWe have learned from our past failures, and are stronger for it. The modern Wehrmacht is the gleaming sword of the pure Aryan race — one that is unsullied by insidious Jewish influence. Our forces stand ready; our morale is unimpeachable. Better yet, up-and-coming projects such as the Aussenskelet promise to keep the German military years ahead of its rival across the Atlantic.\n\nWe are invincible. Nothing can stop us."
 GER_society_redifined:0 "Society, Redefined"
 GER_society_redifined_desc:0 "Ever since we, the Aryan master race, came to walk upon the Earth, our pure bloodline and superior intelligence have made us perennial pioneers of technological progress. While the degenerate, thick-skulled Romans wandered the ancient world wearing skirts, we “barbarians” north of the Danube had the common decency and intellect to invent trousers — and we’ve been well ahead of the curve ever since.\n\nTwo thousand odd years later, it was Germany who invented the very first nuclear bomb, the original cellular telephone, and the paradigm-shifting WeltNetz. All of these awe-inspiring successes were made possible by Germany’s state-sponsored research institutions, robust public education system, and, most of all, our common-sense eugenics policies.\n\nWe Germans hold ourselves to a higher standard. We keep our stock pristine  — which necessitates the elimination of genetic impurities. While other nations waste resources coddling drooling, barely-human mistakes, we have the common sense to put these so-called “people” out of their misery. Weak-willed men call it cruel. Those interested in the constant, unquenching pursuit of humanity’s next great breakthrough call it a necessary sacrifice."
 GER_meet_with_security_council:0 "Meet With The Security Council"
 GER_meet_with_security_council_desc:0 "TO BE CHANGED"
 GER_onto_new_frontiers:0 "The Harvest Of Afar"
 GER_onto_new_frontiers_desc:0 "The Reich’s latest and greatest territorial conquest wasn’t the degenerate Slavic hordes, nor the backward tribes of the African savannah. Rather, the latest terrain to bow down to Aryan supremacy was none other than the pristine jewel of the night sky: der Mond.\n\nEver since the triumphant moon landing of 1962, the Greater German Reich has transformed the cold, craggy expanse of the lunar surface into a bustling hub of Aryan innovation: the Pionier Moon Base. There, within humanity’s second outpost on the moon, Germany’s best and brightest put their minds together to develop high-grade, space-age technology for the new millennium.\n\nCountless innovations have been theorized, tested, and brought to life within the Pionier base, but all of our discoveries combined pale in comparison to our latest, greatest achievement: the breathtaking power of nuclear fusion. While this technology has already been in use for decades in the production of nuclear weapons and nuclear power plants, these techniques look downright primitive when compared to the theoretical path toward efficient, cost-effective nuclear power recently discovered by our scientists.\n\nThe supreme Aryan race is truly the master of the universe — from the moon looming in the night sky to the microscopic atom, nothing can escape our grasp."
 GER_reichslander_index:0 "The Reichsländer Index"
 GER_reichslander_index_desc:0 "Ever since the establishment of the Reichsländs by the administration of Albert Speer Sr., the “Reichsländer Index”, an annual report on the economic development of the eastern colonies, has been written up and presented to the German Minister of Finance.\n\nInitially, the decision to replace the eastern Reichskommissariats with autonomous collaborationist governments was considered a complete betrayal of Hitler’s visionary world-to-be. Few could argue, however, that the vast number of resources — political and military — required to administer these vast swathes of empty land weren’t hampering our leaders’ ability to keep their own house in order.\n\nIn hindsight, it’s quite odd that our immaculate Aryan intellects didn’t think to make this transition sooner — but that’s probably the fault of Judeo-Israeli infiltration, like all our other supposed “missteps”. While extensive effort still had to be put into stabilizing the newly-established Reichsländs, the past ten years have at last returned optimistic numbers. Today, as the Ministry of Finance puts the finishing touches on the 1995 Reichsländer Index , economists and party executives alike dare to say that our Eastern holdings have turned a small profit.\n\nThis is huge. Should current trends continue, the East’s long-awaited profitability is expected to soar to even greater heights by the year 2000. Another win for our perfect Reich — but, as the youth love to say, “what else is new?”"
 GER_europakts_finest:0 "Europakt's Finest"
 GER_europakts_finest_desc:0 "Sweden, Norway, Finland, and Denmark, our dependable allies to the north, are the foundation of the mighty Europakt Alliance. Their pristine mountains and misty fjords are not only strategically important for control of the North Sea, but also harbor vast reserves of vital resources that the Reich’s war machine has depended on since the 1940s. Thus, maintaining the favor of this quartet of nordic nations remains one of the Reich’s highest diplomatic priorities.\n\nOn Germany’s dime, construction of the ‘Spirit of Europe’ bridge — a cutting-edge piece of infrastructure connecting Oslo and Stockholm over the Glomma River — is nearing completion. Once the final safety inspections are finished, Fuhrer Speer himself, accompanied by a few other cabinet members, is expected to attend the televised ribbon-cutting ceremony. We will make a speech, shake a hand or two, and snap a few pictures. In doing so, we shall ensure that the frozen north will remain in our corner as the Reich strides fearlessly into the new millennium."
 GER_breaching_the_unknown:0 "Breaching The Unknown"
 GER_breaching_the_unknown_desc:0 "The world held its breath in awe when the Reich planted its banner upon the lunar surface in 1962 — but what breakthrough shall become the next gem in our perfect empire’s gilded crown of scientific achievement?\n\nEmbryonic stem cell research is one particularly-promising endeavor. The use of harvested stem cells has already been shown to help epidemiologists understand how diseases occur and proliferate. They can assist pharmaceutical scientists in testing the effects of new drugs and treatments — including the long-sought cure for cancer.\n\nSuch research has received considerable political backlash in the United States, that perfidious den of mongrel degeneracy across the Atlantic. They say it is immoral to harvest human embryos for any purpose — our superior Aryan intellect, however, allows us to see right through the “peer-reviewed” lies of Jewish academia and embrace the undeniable truths of race realism.\n\nWe are all human — but some of us are more human than others. We, the ubermensch, will utilize the embryos of the lesser races we have tamed for the benefit of humanity as a whole. In doing so, the untermensch can take the first step toward redeeming themselves in the eyes of their Aryan betters."
 GER_launch_the_euromark:0 "Launch The Euromark"
 GER_launch_the_euromark_desc:0 "At last, after years of planning and preparation, the Euromark — the long-dreamt-of common currency for the Europakt — is on the cusp of becoming reality. From Paris to Baku, the litany of confusing, unreliable currencies hampering the steady flow of wealth into Germania shall be a thing of the past. In its place, a completely new coin, the first of its kind unspoiled by globalist avarice.\n\nWhen the clock strikes midnight on January 1st, 1997, the symphony of fireworks lighting the night sky will not simply herald a new year, but a new era of wealth and prosperity for millions of German citizens as well. The Euromark is destined to bring Europe even closer together in its neverending crusade for strength, tradition, and prosperity!\n\nIt’s been a long journey, but our tireless efforts have at last borne fruit. Raise a glass — it’s time to celebrate!"

