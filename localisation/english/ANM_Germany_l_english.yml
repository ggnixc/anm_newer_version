 GER_flavour_event.10.t: "Mother Goose"
 GER_flavour_event.10.desc: "Breathing in a midsummer bouquet of freshly-cut grass, Katharina stared at the checkered picnic blanket beneath her. “So...” she spoke softly, racking her brain for something to fill the silence, “...what kind of music do you like? I usually just listen to whatever’s on the radio, but lately—”\n     Mathias swallowed. “Oh no, that won’t do.” The handsome young man, dressed up in full NSDAP regalia for his big date, shook his head. “Bach, Schumann, Wagner — ours is such a proud musical tradition. What could you possibly find appealing about that modern, computerized trash?”\n     A mousey Katharina ran her hand down the length of her arm. How did she let Papa force her into this? And, more importantly, was it too late to run away screaming? “Well, um, I like the classics, too. Last summer, I learned to play Für Elise on the piano—”\n     “I’m not familiar.”\n     Katharina munched on her sandwich, staring at her date like he’d sprouted a second head. “Beethoven...?”\n     “Let’s talk about something more important. You’ve heard of this Debt Crisis, yes? What if I told you it’s all a globalist hoax?”\n     Katharina’s heart sank. Oh, for the love of...\n     “Martin Mußgnung — he’s the Reichstag president — he said...” Mathias paused. “Hm. How to explain this so you’ll understand? The Reichstag is where laws are made.”\n     Katharina’s eyelid twitched. “Got it.”\n     “Anyway, don’t let them trick you. It’s all an excuse for the Zionists to dismantle our Reich from the inside-out. Mußgnug is the only one fighting back. Even Speer won’t talk about this!”\n     “Wow...” Katharina fought to maintain the mask of demure innocence she knew was expected of her. “You’re so, um, knowledgeable...”\n     “Oh, nevermind. What am I doing, saddling a beautiful fräulein with such complex matters?” Mathias embraced Katharina’s hand with a single, soft kiss.\n     Katharina shivered. The feeling of Mathias’s moist lips on her skin made her want to crawl into a hole and die — but her angelic smile was unshaken.\n     She watched as, a stone’s throw away, a mother goose led a parade of goslings across a shady riverbank. Papa was right — she was eighteen now. Those silly foreign dramas she watched were just stories. In the real world, women had but one purpose — a patriotic duty to raise the next generation of Aryan warriors. Anything more was simply unthinkable."
 GER_flavour_event.10.a: "“O-Oh! How sweet...”"
