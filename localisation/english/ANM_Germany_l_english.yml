 ## Flavour Events ##
 GER_flavour_event.1.t:0 "Kids These Days"
 GER_flavour_event.1.desc:0 "Basking in the pale glow of an aging CRT, Konrad shook his head. Sometimes, he wished he’d never bothered to learn English.\n     His teenage daughter Katharina had left the TV running on one of her favorite channels — MTV — that awful network that poisoned the airwaves with nothing but trashy American pop music. Currently playing was some vulgar song by an artist called ‘Eminem’. Or was his name Slim Shady? The refrain certainly seemed to drive that point into the ground.\n     Konrad couldn’t believe his ears. Impregnating Spice Girls? Fat pounds of grass? Stapler-assisted genital mutilation? Were the children of Germany really exposed to this utter filth on a daily basis?\n\nChanging the channel only provided momentary relief. The next network, some low-budget operation he’d never heard of, was playing another dull, cookie-cutter soap opera. Click.\n     A balding, half-dead NSDAP official droned on about adding more bike lanes to a city 200 miles away. Why was this on the local news? Click.\n     A game of...badminton?! Wait, did people really watch this? Willingly? Click! Click! Click!\n\nAt last, Konrad perked up — something remotely entertaining had finally appeared on the screen. A quiz show — the kind of program where contestants could earn huge sums of money for answering a series of increasingly-obscure trivia questions.\n     Backdropped by a buzzing studio audience, the sharply-dressed host turned to the contestant. “Ten seconds on the clock.” he smiled, “In which Swabian city was our nation’s third Fuhrer, Hans Spiedel, born?”\n     “U-Uh...” The contestant, a young woman, looked as if she had seen a ghost. She glanced blankly at the camera, nervously twirling a lock of hair around her finger. “Well, if I recall correctly, I believe the answer is, uh...”\n     The timer hit zero. A sharp buzz cut off the woman’s stammering response.\n     “So sorry, ma’am...” The host tilted his head in what was certainly feigned sympathy. “Time’s up.”\n\nKonrad held his head in his hands. It took everything in his power not to chuck the remote through the TV."
 GER_flavour_event.1.a:0 "“It was Metzingen, you moron! What are they teaching kids these days!?”"
 GER_flavour_event.2.t:0 "The Burgunders"
 GER_flavour_event.2.desc:0 "Katharina wandered beneath the amber glow of buzzing street lamps, fingers clasped around the pillowy straps of her book bag. The excessive layers of clothing she wore were more fit for an Antarctic expedition than a stroll through the park, but the seventeen-year-old hardly cared. There were few things she hated more than the cold.\n     Mind teeming with worries, she paid little attention to her surroundings as she walked along the hedge-lined path. She’d soon need to work up the courage to ask Klaus to the dance...but how? It was embarrassing to admit at her age, but she’d never asked a boy out before, and—\n\nKatharina squeaked as a raspy, boisterous laugh erupted from behind the hedge. Clutching her thumping chest, she considered bolting home — but her simmering curiosity kept her feet firmly rooted to the sidewalk.\n     Swallowing her apprehension, she peeked through the dense leaves. Hidden behind the hedge was an encampment of a dozen or so homeless people — some milling about, others sleeping beneath patchy blankets. Shopping carts filled with random belongings were stationed beside makeshift tents fashioned from tattered tarps.\n\nBurgunders. In school, Katharina had learned about these refugees of Himmler’s deranged shadow state, but never imagined she would stumble across them here in Stuttgart.\n\nA sudden shout pulled her attention toward an emaciated figure limping into the camp. A tattered bag was clutched in his hand; he held it over his head as he approached. The others clambered toward him, eagerly exchanging cash, jewelry, and other valuables for small plastic bags filled with a white, crystalline substance.\n     Scattering like roaches, the Burgunders snorted and smoked their prizes, some barely able to hold their pipes in their trembling, skeletal hands. One after another, their lethargic behavior turned manic — some danced around, some started fights, while others wandered aimlessly, speaking in slurred, broken sentences with people who weren’t there.\n\nKatharina’s face wrinkled at the unnerving sight. Hands clutched close to her chest, she rushed home, swearing not to mention a word of this to Papa. If she did, that would certainly be the end of her treasured strolls through the park."
 GER_flavour_event.2.a:0 "Just say no to drugs."
