 GER_government_institution_1_desc: ""
 GER_government_institution_2_name: "Sturmabteilung"
 GER_government_institution_2_desc: "The Sturmabteilung, or the Storm Division, was formed in 1921 as the paramilitary wing of the NSDAP. It was originally established to dispatch security tasks such as protecting party meetings and intimidating political opponents, but it rapidly expanded to become the muscular red right hand of the Nazi Party, becoming notorious for its rabblerousing in the streets with rivaling political factions during the Weimar Republic. Under the leadership of Ernst Rohm, it grew to over three million members in 1934, drawing heavily from the ranks of disenfranchised soldiers and jobless workers.\n\nThe SA’s influence and violent tactics were instrumental in helping Adolf Hitler attain power in 1933. But with increased organization of the body and Rohm’s ambitions, the fear of undermining Hitler’s consolidation of power became a threat; This reached the peak of its climax with the “Night of the Long Knives” in June 1934, where Hitler ordered a purge of the leadership in the Sturmabteilung, thereby neutering the department and crowning the SS under Heinrich Himmler dominant. Since then, functions of the SA—subsumed by the SS & Gestapo—were mostly ceremonial.\n\nIn the decades that have passed since World War II, the SA has only truly remained as an honorary token of the Reich. It no longer is a street enforcer; Instead, it has been given the role of declaring one's devotion to the Fatherland.—true to loyalty, discipline, and committed without further question to National Socialism."
 GER_government_institution_3_name: "Deutsches Rotes Kreuz"
 GER_government_institution_3_desc: "Founded in 1864 at a hospital in Germania (then Berlin) by Aaron Silverman, the Deutsches Rotes Kreuz (DRK) was established as a solely humanitarian organization to help civilians and the wounded of war. Following the Treaty of Versailles, the DRK was restricted from any military involvement, becoming a purely social welfare organization. This changed in 1933 when Adolf Hitler rose to power, and the DRK took a drastic shift away from social welfare, instead serving the needs of the NSDAP and the Wehrmacht.\n\nThe DRK carried out multiple forceful takeovers of other German humanitarian organizations, such as the Arbeiter-Samariter-Bund Deutschland (Workers' Samaritan Foundation Germany). The DRK also adopted the Law for the Restoration of the Professional Civil Service, conducting a purge of all left-wing and Jewish members of the organization. the DRK still remained a member of the International Committee of the Red Cross (ICRC), which prevented its full Nazification until 1938, when it was placed under the control of the Ministry of the Interior, de-facto becoming a Nazi organization. The new DRK embraced Nazi ideology, only helping those in the racial hygiene structure and assisting the Reich with its Eugenics programs and the holocaust.\n\nFollowing the end of World War II, the DRK further alienated itself from the ICRC, as it drifted more towards helping only those the Reich deemed worthy while actively harming those considered unworthy. Today, the DRK remains a member of the ICRC but is regarded as a black sheep, disgraced from the rest of the organization for participation in the Holocaust and its refusal to help individuals deemed racially inferior."
 GER_government_institution_4_name: "Reichsnachrichtendienst"
 GER_government_institution_4_desc: "The Reichsnachrichtendienst was founded in 1966 under the orders of Speer Sr. through the merger of all pre-existing intelligence agencies within the Reich, consolidating them under one central administration. Established to conduct both international espionage against foreign powers and counterintelligence from enemies within, the RND became integral to the Reich’s local and international ambitions. Overseeing the surveillance of dissidents, intelligence operations concerning foreign governments, and ideological policing within Germany.\n\nUnder Speer Sr., the foundation for the agency as it stands today was laid. Its functions expanded significantly to include the infiltration of resistance movements throughout the Pakt, sabotage of foreign operations, and aiding German proxies abroad. The agency maintains a vast network of paid informants and spies throughout most of Europe and parts of the world.\n\nToday, the RND has evolved into a near-omnipresent force within the Pakt's borders and one of the most expansive and powerful spy and intelligence networks in the world. The RND provides a watchful eye over the activity of each and every citizen within the Reichs ever present surveillance systems. Equipped with sophisticated monitoring technologies and an extensive network of operatives, the RND can identify and swiftly neutralize any threats to the regime—ranging from foreign spies to domestic dissenters. It actively censors the press, radio, and the Waltznet, ever vigilant against any content that might challenge the NSDAP's authority or promote undesirable attitudes. The Reichsnachrichtendienst is at once an organization of shadows, yet omnipresent in the Reich; Invisible, yet all-seeing."
 GER_government_institution_5_name: "Reichsarbeitsdienst"
 GER_government_institution_5_desc: "The Reich Labor Service was established in 1935 as part of the Nazi regime’s development of a government agency aimed at the German youth and National Socialist indoctrination. What had been an organization recruiting its members on a strictly volunteer basis now became compulsory for all young men and women, requiring six months of service before pursuing further education or employment. First of all, the RAD had to make young Germans hard working in honorary aims, such as infrastructural commissions, land reposition, and so on, as they needed to fill up the lack of labor force and support the needs of the military.\n\nUnder the leadership of Konstantin Hierl, the RAD became a key component in the Reich’s fight against unemployment whilst transforming the youth into model citizens who would serve the state unconditionally. Agriculture was just one of many projects operated by the RAD; major construction work was also part of this latter sector, even including the famed Autobahn network that established the RAD as one of the pillars of the Nazi infrastructure program.\n\nToday, the Reich Labor service is no longer restricted to dominating the youth but encompasses the entire German labor force within its compass. Its reach has extended into every form of labor, mobilizing the masses within a state-operated organization for the purposes of the Reich in the sphere of industry and war. Every German citizen, from the one just about to attain his teens to the aged retiree, is compelled to periodically undergo RAD service, which today has become an agency in the indoctrination of labor and ideological dogma. Conformity is compelled, and the suppression of individual aspirations brings with it severe penalties—most often entailing re-education camps for those showing themselves not sufficiently loyal to the state."
 GER_government_institution_6_name: "Schutzstaffel"
 GER_government_institution_6_desc: ""
 GER_government_institution_7_name: "Deutsche Christen"
 GER_government_institution_7_desc: "The Deutsche Christen movement formed in the early 1920s as a way to fit Christianity with Nazi ideology. Originally started as an independent movement, the Deutsche Christens took power of the newly formed German Evangelical Church in 1933. The Deutsche Christens sought to make Nazi ideology compatible with Christianity by removing any elements deemed Jewish, such as large portions of the Old Testament, and rejecting any notion that Jesus was Jewish. Along with promoting the idea that Aryans as a superior race, divinely chosen by God, while depicting Jews and other Untermenschen as evil and satanic.\n\nDespite these efforts to conform with Nazi ideals, the Reich had a strenuous relationship with the  Deutsche Christens, viewing them as a threat to total party authority by having a higher power than the party. During the Kirchenkampf (Church Struggle), the NSDAP tolerated the existence of the Deutsche Christens but suppressed its growth and wished to erase christianity through the course of many years.\n\nThis all changed when Speer Sr. rose to power following the power struggle in the 1960s. Speer Sr. took a more pragmatic approach, recognizing the failures of previous attempts to suppress the church. Instead of trying to eliminate the church, which he deemed impossible, he sought to use it to the party's advantage by positioning God as an ally to National Socialism. For the first time in decades, the Deutsche Christen were allowed to expand both their religious and political influence. Today, the Deutsche Christen movement stands as the largest and most influential Christian movement in the Reich, having significant influence over the moral fabric of German society."
 GER_government_institution_8_name: "Reichsjugend"
 GER_government_institution_8_desc: ""
