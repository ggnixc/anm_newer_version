 # Misc. Story Events #
 GER_misc_main_event.1.t:0 "Keeping the Status Quo"
 GER_misc_main_event.1.desc:0 "Sighing with relief, Albert Speer pecked the buttons of the same telephone used by his father. For once, luck seemed to be on his side.\n     Ireland had never been that close to Germania, but ever since the end of WWII, the small island nation, led by the conservative Fianna Fáil party, had been one of the few democracies willing to work with the Reich. Under Taoiseach Bertie Ahern, however, Fianna Fáil had become unabashedly corrupt, leading to the collapse of his Government and the call for snap elections.\n     Speer rubbed his eyes. He’d lost plenty of sleep over the last few days, doing everything in his power to ensure that Fianna Fáil’s successor party, led by Micheál Martin, prevailed in the election. Should they fail, there was a real threat of Ireland distancing itself from the Europakt —  or even leaving the alliance altogether. The Fuhrer, already desperately digging himself out of a deep trench of unpopularity, simply couldn’t afford another diplomatic blunder.\n\n“Herr Speer! Always a pleasure.” Micheál Martin’s voice rang out through the ancient phone’s tinny speaker, breaking Speer’s train of thought. “What can I do for you?”\n     Speer smiled — just the man he wanted to hear. “Just calling to congratulate you on your hard-earned promotion.” Reclining, the Fuhrer tapped on his desk, glancing at the Emerald Isle on the large map of Europe hanging on his wall. “I certainly didn’t expect you to ascend to the top job this way, though.”\n     Martin laughed. “You and me both.”\n     “I’m just thrilled to have someone of your skill leading the helm in Ireland. I trust that you will continue the prosperous partnership between our two countries, yes?”\n     “I—” An unnatural pause interrupted Martin’s reply. “— Yes. Of course.”\n\nSpeer could tell Martin was hesitant. If Ireland was anything, it was fiercely independent. “Well, I’m sure you’ve got plenty of work to do, so I won’t keep you too long.” Speer said, quickly changing the subject. He glanced out his window, spotting the Volkshalle gleaming beneath a cloudless sky. “Perhaps you’ll make a visit to Germania in the near future? The weather is certainly more pleasant in my neck of the woods.”\n     “You’ve got me there.” Martin laughed. “The constant rain over here has certainly gotten old. I’d be eager to jet to the north pole at this point.”"
 GER_misc_main_event.1.a:0 "“You know where to reach me. We’ll make your visit a pleasant one.”"

