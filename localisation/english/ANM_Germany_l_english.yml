### Ministers ###
 GER_minister_martin_mussgnug_hog:0 "Martin Mußgnug"
 GER_Martin_Mussgnung_desc:0 "--------------\nMartin Mußgnug, born in 1936 to an SA squad leader, was already a devout National Socialist by the time he entered kindergarten. He supported Speer Sr in the power struggle that followed Hitler’s death, and after the tensions cooled, a zealous Mußgnug began his arduous climb to the top of the political ladder. To young Martin's horror, the ensuing years would see the erosion of the Fatherland’s dominant posture on the world stage, culminating in the worst military disaster in German history; The Second West Russian War.\n\nMußgnug would never admit it, but he still remembers the bottle-smashing fit of rage he pitched upon hearing the news of Germany’s surrender. It was on that night that a life-changing realization dawned on him; If Germany was to be saved, he, and no one else, would need to ascend to the Fuhrership.\n\nFor the next two decades, Mußgnug would grasp every opportunity to accumulate power, wealth, and influence; for his efforts, he eventually found himself elevated to the enviable role of Reichstag President. In this role, Mußgnug’s incredible influence would enable him to execute a sort of social coup against the unpopular Fuhrer Speer. Though Mußgnug lacks any formal authority, a healthy majority of the NSDAP are markedly more loyal to him than to the Fuhrer.\n\nOne would be a fool, however, to assume that President Mußgnug would be satisfied with anything short of absolute power. For now, he bides his time — but the writing is on the wall." 
 GER_minister_guenther_deckert_sec:0 "Günther Deckert"
 GER_Guenther_Deckert_desc:0 "--------------\nBorn in 1940 in Heidelberg, Gunther Deckert is a man ruthlessly obsessed with progress. When he isn’t ranting to anyone who will listen about the looming Soviet threat on the eastern frontier, he is tirelessly advocating for more funding for military R&D — a vital expense, in his eyes, to ensure the redemption of the Wehrmacht should they ever come to blows with the Reds.\n\nDeckert styles himself a technocrat, prioritizing scientific advancement and technological innovation above all else. As expressed in his many, many manifestos, the Wehrmacht’s defeat in the Second West Russian War came about due the blase attitude toward technological innovation that persisted in the late ‘70s and early ‘80s. Deckert suggests that the Soviets, already at a numerical advantage, had been carelessly allowed to “catch up” with Germany’s tech and tactics prior to the war — and the rest is history.\n\nGunter Deckert’s near-obsessive fixation with the next technological breakthrough makes him an odd character to some, but none can deny his passion is rooted in an earnest adoration for his country. As the Greater German Reich strides into the new millennium, Deckert won’t be satisfied until the Wehrmacht stands as the most advanced military force in the world."
 GER_minister_joseph_fisher_for:0 "Joseph Fischer"
 GER_Joseph_Fisher_desc:0 "--------------\nBorn into an ethnically German family in Budakeszi, Hungary, Joseph Fischer’s peaceful childhood ground to a screeching halt upon the outbreak of the Hungarian-Romanian War.  Though his family’s flight to the Fatherland spared young Joseph the horrors of war, hardship did not elude him.\n\nIn his early adulthood, Fischer’s lack of formal education prevented him from securing a stable job, and his poor eyesight made him ineligible for Wehrmacht service. Eventually, his resentful attitude led him to join Revolutionärer Kampf, a student movement group notorious for civil disobedience and incidents of mob violence.\n\nLater in Fischer’s life, the proliferation of left-wing terrorism across the Reich would inspire him to moderate his positions. Despite his checkered past, Fischer joined politics as a member of the Reichstag, where his smooth oratorical skills and honest reputation earned him the admiration of Germany’s younger, more liberally-minded population.\n\nAs one of Germany’s longest-serving Foreign Ministers, Joseph Fischer is universally respected for his diplomatic aptitude. Chief among his foreign policy accomplishments is the preservation of the nascent Europakt through the economically-stagnant ‘90s, as well as the recent détente with China and the United States. As the world enters the 21st century, his competent negotiation skills are assured to make the most of the Fatherland’s recent economic boom." 
 GER_minister_gerhardfrey_eco:0 "Gerhard Frey"
 GER_Gerhard_Frey_desc:0 "--------------\nDr. Erhard Frey, born in Cham, Bavaria in 1933, was raised to honor his race, his country, and his Fuhrer — in that order. Excelling in mathematics during his youth, Frey’s industrious work ethic and natural curiosity would eventually earn him a doctorate in Economics from the University of Graz.\n\nPost graduation, Frey would join the ranks of the German conglomerate Mercedes-Benz, employing his expertise to oversee all of the company’s factories north of the Rhine. During the 60’s, Mercedes-Benz was not excluded from Speer Sr.’s conglomerate crackdowns, but Frey, one of the few competent managers among the corporation’s ranks, was spared Speer’s wrath. On the contrary, Frey would later be hand-picked to serve as Germany’s Economic Minister by Albert Speer Jr. amidst a purge of sycophants and incompetents within his cabinet.\n\nIn his current role, Gerhard Frey is well-regarded as one of the few apolitical figures within the Speer Administration. Frey values the German economy’s long-term health over all else, and rarely engages in the ever-present ideological bickering within the NSDAP. Frey’s judicious management skills prevented the total collapse of the German Economy after the Second West Russian War, and now, as the Millenium Boom leads the Reich toward its most prosperous year to date, Frey can at last rest on his laurels." 


 
### Ideas ###
 ## Starting Ideas ##
 GER_the_puppet_fuehrer:0 "Overshadowed Fuhrer"
 GER_the_puppet_fuehrer_desc:0 "It was during Adolf Hitler’s thirty-year reign that the world at large was first introduced to the title of Fuhrer – the supreme, uncontested, all-powerful leader of the Greater German Reich.\n\nThe office’s current holder, Albert Speer Jr, can hardly be described in such glowing terms. Ever since the disastrous Second West Russian War and the resulting unpopularity of Speer Jr.’s government, the “true” leader of Germany has been, to many, Martin Mußgnung, the current Reichstag President. A tried-and-true conservative, President Mußgnug lacks any formal powers, but he nonetheless wields a considerably higher amount of influence in German politics than the “all-powerful” Speer Jr.\n\nToday, the sidelined Fuhrer and his small clique of loyalists, in an effort to regain the absolute power wielded by the three Fuhrers before him, engage in a never ending tug-of-war against their more influential adversaries in the Reichstag. Unfortunately for Speer, however, his persistence has thus far borne little fruit. The seeds of Mußgnung’s glacial coup have been sown; Nothing short of a miracle can stop him now."
 GER_millenium_rise:0 "The “Millenium” Rise"
 GER_millenium_rise_desc:0 "After the Europakt was founded as a single continental market, the war-weary German economy at last began to piece itself back together. With the support of its continental allies, the crawling Reich slowly learned to stand on its two feet, but not before enduring a grueling period of stagnation.\n\nAdversity, however, is no stranger to the German people — and neither is victory. Today’s Europakt is a veritable economic behemoth, and the “Millenium” Rise shows no signs of slowing down.\n\nThe Munich Stock Exchange, home to profitable firms such as BMW and IG Farben, attracts shrewd investors eager to stake their claim in the Reich’s flourishing market. As Daimler, Siemens, and Allianz join the ranks of the most valuable companies in Europe, the benevolent NSDAP ensures that their exorbitant profits trickle down to Germany’s prosperous middle class — as long as they have the right blood.\n\nThe year 1996 is projected to be yet another year of unprecedented growth. Germany stands on top of the world. What could possibly knock them down?"
 GER_the_ailing_order:0 "Fractionalized NSDAP"
 GER_the_ailing_order_desc:0 "Despite the Greater German Reich’s uneasy status as a superpower among superpowers, the NSDAP bureaucracy, having replaced the military and the Fuhrer as the driving force behind German politics, is irreparably divided.\n\nThe consequences of such factionalization have far-reaching implications for German society. The modern NSDAP can hardly be described as a mere political party; it is an omnipresent fact of life, with effectively the entire German middle class entangled to some degree in the NSDAP’s labyrinthian administrative apparatus.\n\nFrom the outside looking in, the NSDAP guides the German people with a strong, decisive voice. A keener eye, however, reveals the stammering thoughts trailing behind every word. Every day, Technocrats, Militarists, Environmentalists and Traditionalists alike squabble over the pettiest political minutiae. These divisions, in turn, create a myriad of inefficiencies that trickle down to affect the daily lives of even the most apolitical German citizens." 
 GER_space_spirit:0 "Eyes on the Stars"
 GER_space_spirit_desc:0 "The brainchild of engineering maverick Wernher von Braun, Germany’s ESRO has distinguished the Greater German Reich as the world’s unrivaled technological trailblazer.\n\nFor years, the decades of chaos that followed the Reich’s triumphant moon landing appeared to spell the end of Germany’s celestial expeditions. However, the installation of a permanent moon base in 1994 — ESRO’s first major accomplishment since its revival in the late 80s — has once again turned the eyes of the German public toward the stars.\n\nWith the swastika planted proudly on the lunar surface, ESRO’s new team of fresh-faced, ambitious engineers now turn their attention toward the red planet, aspiring to land a rover on the Martian surface by 2010. Such a feat seems utterly impossible within such a short timeframe, but then again, the same despondent doubts were common fifty years ago when the Reich first set its sights on the final frontier."
 
 ## Focus Tree Ideas ##
 GER_millenium_boom:0 "The “Millenium” Boom"
 GER_millenium_boom_desc:0 "After the Europakt was founded as a single continental market, the war-weary German economy at last began to piece itself back together. With the support of its continental allies, the crawling Reich slowly learned to stand on its two feet, but not before enduring a grueling period of stagnation.\n\nAdversity, however, is no stranger to the German people — and neither is victory. Today’s Europakt is a veritable economic behemoth, and the “Millenium” Boom shows no signs of slowing down.\n\nThe Munich Stock Exchange, home to profitable firms such as BMW and IG Farben, attracts shrewd investors eager to stake their claim in the Reich’s flourishing market. As Daimler, Siemens, and Allianz join the ranks of the most valuable companies in Europe, the benevolent NSDAP ensures that their exorbitant profits trickle down to Germany’s prosperous middle class — as long as they have the right blood.\n\nThe year 1996 became a year of unprecedented growth. Germany stands on top of the world, nothing can stop us now."
