 GER_flavour_event.16.t: "Just a Girl in the World (1/2)"
 GER_flavour_event.16.desc: "A beaming Katharina sat on the edge of her seat, enchanted eyes glued to the silver screen. She’d been dying to watch “Titanic” ever since it came out in the States, but, like always, she’d had to wait for the Ministry of Culture to approve an edited version for German audiences — God forbid this nation of invincible supermen be exposed to Jack and Rose steaming up an antique car.\n     Katharina’s heart, always a sucker for romance, melted into a puddle of goo at the sight of a climactic kiss — but the tender scene just as quickly gave her pause. Perhaps she’d been too hard on Mathias lately.Sure, he drove her absolutely crazy sometimes, but at least he was sweet enough to take her out to the cinema. Technically, it was just to make up for what happened last Friday, but the soft-hearted Katharina still appreciated his willingness to—\n     A surge of adrenaline gripped Katharina as a five-headed serpent suddenly slithered across her thigh, leaving a trail of frigid numbness in its wake. Its ultimate destination was as obvious as it was unnerving. \n     “Mathias...!” Katharina angled her body away. “Really?! We’re in public!”\n     “Hm?” An unflinching Mathias sipped his soda, not even bothering to take his eyes off the screen. Moments later, his persistent fingers returned.\n     “Hey! I told you no!” Katharina swatted the back of Mathias’s hand. “Keep your hands off me!”\n     Like a child denied his favorite plaything, Mathias’s face snarled with a look of pure contempt. “Ungrateful bitch!” He snapped, snatching Katharina’s wrist, “Let’s go. You can watch this shitty movie with your own money.”\n     “Hey! Let go of me!” Katharina dug her heels into the floor, stubbornly resisting her boyfriend’s orders.\n     A head turned toward the commotion. Then two. Then ten. Mathias swallowed, his shame plain to see across his flushed face. “I said get up!” He demanded, at last wrenching Katharina out of her seat, “Are you trying to humiliate—”\n     “Fuck you, Nazi pig!” Trembling voice melding with the orchestral score bellowing from the theater’s speakers, Katharina snatched Mathias’s drink and thrust it toward the young man’s chest. A freezing cascade of cola doused the exhibition of baubles, medals, and Party insignias proudly displayed on his well-kept uniform."
 GER_flavour_event.16.a: "Assault of a Party official: -10,000, Slander against the Reich (2nd offense): -500 | Net Gain: -10,500"
 GER_flavour_event.17.t: "Just a Girl in the World (2/2)"
 GER_flavour_event.17.desc: "Each hastened stride worth three normal steps, Katharina slammed the theater’s front door behind her. The sound bellowed for all the world to hear, but Katharina paid no mind to the dozens of eyes turned her way.\n     She pulled her arms toward her core, eyes wet with tears. The feeling of Mathias’s hands groping, petting, stroking her body — the sensation haunted her, lingering still like a phantom limb. She didn’t care anymore. Not what Papa would think, not how she would get home. She was just so tired of it all—\n\nThe sudden, repetitive wail of sirens brought Katharina crashing back down to Earth. She tore her gaze away from her tear-spangled shoes in time to watch a drove of police cruisers, blue lights blaring, pull up to the curb.\n     Out of the corner of Katharina’s eye, a pigtailed child rode atop her father’s shoulders. Staring at the commotion with a curious glint in her eye, the little girl ungraciously patted her caregiver’s balding head.“Polizei!” she pointed..."
 GER_flavour_event.17.a: "“Papa, did they catch another yid?”"
