 ## Focus Tree Events ##
 GER_focus_event.1.t:0 "My Fuhrer, Green is Not Your Color "
 GER_focus_event.1.desc:0 "“...and with our economy booming, and our diplomatic position firmly secured, 1996 is slated to be another landmark year for our nation!”\n     A polite trickle of applause just barely echoed off the swastika-trimmed walls of the Volkshalle. The enormous golden eagle mounted at the far end of the rotunda scrutinized the uniformed audience with the same stern face it had worn since the days of Hitler.\n     Fuhrer Albert Speer Jr. — master of the Aryan race, shepherd of the Europakt, and supreme leader of the Greater German Reich — leaned away from the bouquet of microphones splayed across the podium. “Greatness is our destiny.” He punctuated his words with a precise roman salute. “Long live Germany!”\n     The audience  — occupying only a third of the available seats — stood in tandem. “Heil Speer!”\n\n                                             /// /// ///\n\nSpeer’s secretary wore her signature smile, holding open the door to the Fuhrer’s private dressing room. “Another fantastic New Year’s Address, my Fuhrer.”\n     The master of Europe’s sharp posture persisted until the very moment the door closed behind him. “You’re too kind, Monika.” He said weakly, hobbling toward a haughty leather couch with a gait more becoming of his age. “If you wouldn’t mind, I’d appreciate some time alone to unwind...”\n     Monika nodded. A moment later, the door clicked shut.\n     Sighing, Speer reached for the remote. At the click of a button, a bulky CRT crackled to life. The picture took a moment to crawl in from the edges of the screen, but the boisterous voice that came from the speakers was unmistakably familiar.\n    “Mussgnung...?” Speer could have crushed the remote in his trembling hand right then and there. “So this is why he was absent tonight?”\n     Martin Mussgnung — the Reichstag President, and the Fuhrer’s subordinate — stood at the center of a sold-out football stadium, surrounded on all sides by stuttering camera flashes. His words were peppered with pauses, forced to stop every time the crowd shouted their unwavering support.\n     The camera panned across the electric audience. Sure enough, Speer recognized more than a handful of the faces. These were party officials. Reichstag members. The occupiers of the vast sea of empty seats he’d just spoken to.\n     Grinding his teeth, Speer mashed the power button."
 GER_focus_event.1.a:0 "Next year, expect attendance to be mandatory."
 GER_focus_event.2.t:0 "Keeping Score"
 GER_focus_event.2.desc:0 "Franz inhaled. The familiar rush of nicotine tickled his fingertips.\n     The young man had never been too big on smoking, but ever since he started working part-time at the Aldi, he found the extra breaks too enticing to pass up. Taking one last puff, Franz discarded the spent cigarette onto the sidewalk and reached for another.\n     “Attention!” A pair of speakers mounted to a swastika-topped flagpole shrieked to life. “The following is a public service announcement.”\n     Franz clenched his eyes. Great. The headache he was nursing had just barely begun to fade, but the shrill squeak of the generation-old loudspeakers was undoing all of the nicotine's hard work.\n     “In 1985, Eric Rothberg, a childless man, collected 105,000 marks in welfare payments to support three phantom children. In 1990, Sofia Landau was found guilty of welfare fraud, having collected over 65,000 marks in ill-gotten disability payments. In 1993, Eric Morgenthau collected 88,000 marks in unemployment benefits despite earning a six-figure salary.”\n     “The German nation is pure. But even among Aryans, criminals lurk in the shadows, plotting to drain the Reich of its resources and leave it open to invasion by the Jewish USSR. What is to be done, you might ask, to ensure that our valuable resources are only spent on those who deserve them? Fret not — there is an innovative, computer-age solution. Introducing the Drexler Score.”\n     Franz perked up. Drexler? As in Anton Drexler, the founder of the NSDAP? What a coincidence — he’d just written a blog post about the man’s memorial statue in Warschau.\n     “Starting today, every citizen’s actions will be tracked and used to quantify their value to the nation. Responsible citizens with higher scores will be granted certain privileges not accessible to those of corrupted moral character, including eligibility for welfare payments. At last, good citizens will be rewarded for their selfless contributions to the nation, and lazy wastrels will be punished for their insolence. For more information, visit www.Volkshalle.de/Drexlerpunktzhal. Heil Speer!”\n    Franz hacked into his sleeve. Suddenly noticing the handful of surveillance cameras mounted all around him, the young man picked up his still-smoldering cigarette butt, trekked around the corner, and dropped it into an ashtray."
 GER_focus_event.2.a:0 "Proper Refuse Disposal: +1 | Illicit Drug Use: -100 | Net gain: -99"
 GER_focus_event.3.t:0 "You’ve Got Mail"
 GER_focus_event.3.desc:0 "The rapid, piercing chime of the telephone stirred him from his slumber. His head, cradled by his forearm, surveyed the cluttered mountain of papers, loose folders, and used coffee mugs scattered across his desk. Somewhere, underneath all of the chaos, a laser-etched nameplate bore his name: Gunter Deckert.\n     The boulder-sized monitor beside him cast a pale, blue glow — the only source of light in the modest home office. The curved glass screen still displayed last night’s half-finished email, patient cursor still blinking in wait for the next command.\n     Deckert rubbed his eyes and silenced the wailing telephone. Whoever it was, they could wait. Downing the freezing, hours-old coffee left atop his monitor, the square-jawed security minister sat up straight, reached for the keyboard, and continued typing as if he hadn’t just been drooling on his desk for the last five hours.\n\n...MY FUHRER, I FULLY UNDERSTAND YOUR FINANCIAL CONCERNS, BUT IT IS MY OPINION THAT MATTERS OF NATIONAL SECURITY SUPERSEDE ALL ELSE—\n\nDeckert hesitated. He thought for a moment, then prodded the backspace key.\n\n— ALL OTHERS. PER MY PREVIOUS EMAILS, I MUST REMIND YOU THAT THE AUSSENKELET POWERED EXOSKELETON IS THE KEY TO AVENGING 1981.\n     THE GLOBALISTS HAVE CONSPIRED TO REDUCE THE GERMAN BIRTH RATE AND INFLATE THAT OF THE RUSSIANS. IT IS A SIMPLE FACT THAT THE REDS WILL HAVE A DECISIVE NUMERICAL ADVANTAGE IN ANY FUTURE CONFLICT. IN ADDITION, RUSSIA’S INDUSTRIAL CAPABILITIES WERE VASTLY UNDERESTIMATED IN 1981, AND GLOBALIST DARK MONEY HAS ONLY FURTHER AUGMENTED THEIR CAPACITY IN RECENT YEARS.\n     IN 1521, HERNAN CORTES AND A SMALL BAND OF SPANISH SOLDIERS, THOUGH OUTNUMBERED AND TRAPPED IN A STRANGE FOREIGN LAND, SUBJUGATED MILLIONS OF DEGENERATE MEXICA THROUGH TECHNOLOGICAL MIGHT ALONE. MY FUHRER, WE MUST SWALLOW OUR PRIDE AND ACKNOWLEDGE THAT A DECISIVE TECHNOLOGICAL ADVANTAGE IS THE ONLY MEANS THROUGH WHICH THE WEHRMACHT CAN SUCCESSFULLY DEFEAT THE RED ARMY. R&D MUST BE MADE A PRIORITY. THE AUSSENKELET MUST BE MADE A PRIORITY. FAILURE TO DO SO WILL LEAD TO CERTAIN DISASTER."
 GER_focus_event.3.a:0 "PLEASE RESPOND."
 GER_focus_event.4.t:0 "Mouths to Feed"
 GER_focus_event.4.desc:0 "Somewhere nearby, a coffee machine gurgled to life, contributing a tangy note to the miasma of overzealously-sprayed air freshener hanging in the air. Hitler and Speer watched diligently over the modest waiting room, framed gazes gleaming beneath polished glass.\n     “ — But get this! The cashier said I wasn’t eligible for benefits.” Emilia Weber stood at the front of a lengthy queue — one of many in Munich’s Department of Citizen Affairs. “I ended up having to put over half of my cart back. Goodness, just thinking about it makes me want to never show my face in public again.”\n     “Mhm.” The man behind the counter, not even trying to feign interest, pecked at his keyboard. “Well, ma’am, the Drexler Score system is still new. It’s probably just a glitch.” He said, holding out his hand. “But let’s run your card to be sure.”\n     Emilia nodded. She dug around in her purse for a moment before handing the man a plastic card done up in patriotic imagery; Emilia had opted into the “Valkyrie” style.\n     “Let’s see...” The man swiped the card through the reader with practiced precision. After a moment of processing, a light on the terminal flashed red, accompanied by a high-pitched beep. “Ah. There’s your problem.”\n     Emilia swallowed. “...Problem?”\n     “Per the new system, you need a Drexler Score of at least 1200 to qualify for food assistance benefits. Yours is only 832.”\n     “What...?!” Emilia choked her purse strap, “No, no, no. Sir, I have four children! How am I supposed to—”\n     “Does the name Walter Weber mean anything to you?”\n     Emilia perked up. “Y-Yes sir. That’s my little boy.” She muttered, head tilted aside. “What does he have to do with any of this?”\n     “He’s flagged here as non-viable. If you’re looking to improve your score, I’d recommend taking advantage of the voluntary Racial Hygiene Incentive. Up to you, though.”\n     “I—” Emilia’s mouth opened, but no words came forth. “— I beg your pardon...?”\n     “Sunset Terminal Treatment Clinic is just a few blocks from here.” The man handed Emilia a pamphlet. “I understand that’s not what you wanted to hear, but maintaining a high Drexler Score means doing what’s best for your family, your nation, and your race”.\n     “You can’t be serious...” Emilia trembled, voice cracking. “Isn’t there another—”\n     “You’ve been helped.” The man palmed the bell on his desk. “Next!”"
 GER_focus_event.4.a:0 "If you want to make an omelet, you’ve got to break a few eggs"
 GER_focus_event.5.t:0 "The Natural Order of Things 1"
 GER_focus_event.5.desc:0 "Filtered through a pair of cheap speakers, the middle-aged anchor’s voice joined the cacophony of sounds swirling beneath the Stuttgart Mall’s lofty ceiling. “... Fuhrer Speer signed the Insulin Access Act into law yesterday afternoon. The new legislation makes insulin free for all citizens living below the poverty line. To fund the project without a tax hike, the price of insulin for non-eligible citizens and undesirables will see a 45% increase.”\n     A second news anchor, seated beside, chimed in with a laugh. “That’s a relief. I don’t want my tax bill getting any higher.” He remarked, straightening the stack of papers in his hands. “In other news, environmental groups around the globe continue to raise concerns about the hole in the Ozone Layer. On Tuesday, U.S. President Al Gore re-affirmed his administration’s dedication to protect the environment...”\n     “Gore?” Clad in a three-piece suit and a cocksure smile, a well-groomed businessman drummed his fingers on the shoeshine stand’s padded armrest. “Who cares what that fool has to say? We just made insulin free, while his joke of a country can’t even set up a functional healthcare system.” The businessman’s loafer — freshly shined — prodded the worker kneeling at his feet. “You get what I’m saying?”\n     “Yes, sir.” Gustav Walkowicz carefully massaged the toe cap of his customer’s shoe with a soft cloth. He took a breath to stall his racing thoughts — but the sight of his young daughter Franziska playing nearby furnished his stomach with nauseous dread.\n     He was already skipping meals — how the hell was he going to afford the kid’s insulin now? As a Polish national, he’d never qualify for citizenship in a thousand years — nor would his daughter, despite being born in Stuttgart. Would he have to take up a third job? Finding a decent-paying gig as an undesirable was already next to impossible—\n     Gustav halted his monologue with a hard sigh. He’d figure it out. He always did. For now, he  just needed to focus on the task at hand.\n     “We truly do live in the greatest country in the world, don’t we?” the businessman quipped, capping off the long, zealous sermon that his one-man captive audience hadn’t bothered listening to. “Don’t you agree?”\n     Gustav forced a smile."
 GER_focus_event.5.a:0 "“Who would want to live anywhere else?”"
 GER_focus_event.6.t:0 "The Natural Order of Things 2"
 GER_focus_event.6.desc:0 "The rag glided across the sleek dress shoe one final time. Gustav met his customer’s eyes, stuffing the stained cloth back into his well-worn apron. “There you go, sir. Good as new.”\n     “Hm.” The seated businessman nodded, inspecting his lustrous loafers from his plush throne. “Yes, yes. You’ve done a decent job. Thank you.”\n     Gustav handed his customer a freshly-printed bill. “Your total comes to 13 Deutschmarks—”\n     “Ojciec! Spójrz na to! Znalazłem skarb!” Little Franziska yipped, holding her “treasure” — a discarded bottle cap that gleamed with a faux-gold finish — above her head. Eyes sparkling with excitement, the seven-year-old dashed toward her father so quickly that she failed to see the customer standing directly in her path.\n     “What the—” Thinking quickly, the businessman stuck out his arms for balance. “Control your daughter! I nearly scuffed my shoes!”\n     “So sorry, sir!” Gustav flinched as his daughter retreated behind him, clutching his leg like a teddy bear. “Franziska.” Gustav wiggled his constrained limb, “You know better. Apologize.”\n     After a moment of hesitation, the child coyly emerged from behind her father. Hands shoved deep into her pockets, she spoke softly, eyes locked on her two fidgeting feet. “P-P-Przepraszam...”\n     The businessman’s face suddenly contorted. He glared at a wincing Gustav, who glanced at his daughter in turn.\n     “No, no! In German!”\n     “Oh. Um...” Franziska swallowed, face flushed. Somehow, the sickly little girl found a way to make herself even smaller. “I am, um, very big apologize, sir...”\n     “Hmph! She can’t even speak proper German?!” The businessman hissed, shoving his wallet back into his pocket. “I knew you were a fucking foreigner the moment I laid eyes on you. If you’re too lazy to speak the language, why don’t you go back to your own country? Oh, that’s right — we have to bomb the East into the stone age every few decades when you people get too uppity.”\n     The businessman stormed off; Gustav chased after, waving the unpaid bill in the air. “Sir! Where are you going? You still need to—”\n     “You want me to pay you?” The businessman spun on a dime and prodded Gustav’s chest. “How’s this — I won’t report you to the police for teaching your spawn to babble like a fucking caveman. There’s your payment.”"
 GER_focus_event.6.a:0 "Wisely, Gustav nodded without a word."
 GER_focus_event.7.t:0 "Ahead of the Curve"
 GER_focus_event.7.desc:0 "Merely stepping into the shadow of the Volkshalle sent an arctic chill down the Fuhrer’s spine. The grandiose facade of his father’s magnum opus only served as a stark reminder of the impossibly large shoes he had to fill.\n     Speer squared his shoulders, holding his head high as he stepped through the Capitol’s grandiose double-doors. “Indeed, we must put our petty differences aside and stand united—” He muttered softly, reciting a self-penned speech to a pair of worn-out dress shoes. “— lest our empire crumble before the insidious—”\n     He glanced up at a peculiar sound: muffled voices emanating from behind the door at the end of the corridor. A shot of adrenaline coursed through his veins — the same feeling he’d felt as a boy whenever he’d been late for class.\n     Squinting, Speer brought his watch up to his face. Right on time — thank goodness. Mere moments later, however, that fleeting moment of relief was smashed under the weight of the boulder plummeting into his stomach. If he wasn’t late, then that could only mean...\n     Clutching his briefcase with five white knuckles, Speer stomped towards the council chamber, mind boiling with a viscous stew of curses and condemnations. Would that son of a bitch Mussgnug stop at nothing to undermine his authority at every turn?!\n\nThe moment Speer stepped through the door, the muffled cacophony crescendoed, pummeling his ears with bullets of sound. The shameful scene was something one might expect from a pack of wolves fighting over a fresh kill — fingers stabbed, fists pounded, and globs of spittle, trailing behind bitter slurs, sailed through the air.\n     Speer didn’t so much as flinch. Just another day in the Reichstag.\n     “Order!” A hefty gavel pounded thrice, cutting cleanly through the uproar. “I will have order!” Slowly, the chaotic amalgam of angry howls and throaty barks faded into silence — and, in the aging Fuhrer’s case, an ear-splitting case of tinnitus.\n     “Mr. President!” Speer narrowed his eyes, marching down the central aisle. “You’ve started without me? What’s the meaning of this?!”\n     A smug smile crept onto Mussgnung’s face. “My Fuhrer. So good to see you.” he leaned forward from the chamber’s central podium, not bothering with the standard Roman salute. “Apologies. Today’s address must have slipped my mind.”"
 GER_focus_event.7.a:0 "The Master of Europe had never felt so small."
 GER_focus_event.8.t:0 "Please Silence Your Cell Phones"
 GER_focus_event.8.desc:0 "Speer’s eyes grew heavy as he listened to the man leaning on the podium — Joseph Fischer, the Reich’s chief diplomat. Backdropped by a set of alternating German and Norwegian flags, the man’s verbal parade of platitudes was a pied piper’s song, luring the elderly Fuhrer toward the precious sleep he’d missed over the last two nights.\n     "...Ergo! Thusly, this cutting-edge infrastructure is only the first step, among many, in the fruitful, long-lasting relationship of mutual cooperation between our two nations.” Fischer took a bow, “I thank you."\n     A round of mild applause painted a proud smile on Fischer's face. Straightening his tie, the long-faced minister practically skipped back toward his seat.\n     It took every ounce of willpower Speer had not to roll his eyes. That arrogant weasel could piss his name into the snow and call it a literary masterpiece. Knees popping, Speer approached the podium, where a fresh copy of his speech had already been laid out by a certain cabinet member. Speer sighed — at least Fischer was useful.\n\n"Distinguished guests..." Speer began. The awkward old man tried to punctuate his introduction with a heartwarming smile — yet the shuddersome smirk that actually found its way onto his face was less-than-charismatic. "We are gathered here on this momentous day to celebrate the inauguration of the Spirit of Europe bridge. This landmark achievement stands as a symbol of the Norwegian people’s unbreakable Aryan spirit. Thousands of years ago, our ancestors—"\n     The Fuhrer’s flow sputtered at the sound of a voice behind him — A low, neanderthal-like growl that could only belong to one man. The sensitive microphone on Speer’s podium broadcasted the words — mumbled and weak, but still clearly audible — to the entire audience.\n     “Yes, I can talk.” Mussgnung stood up from his seat, muttering into a bulky mobile phone. “No, no. You’re not interrupting anything important. Yes. Mhm. Of course. I can be in Munich by then. Okay. See you. Goodbye.”\n     A lightning storm of flashing cameras erupted not one second later, immortalizing Mussnung’s faux pas — and Speer’s wincing face — for all the world to see."
 GER_focus_event.8.a:0 "“Dammit! The press will have a field day with this!”"
 GER_focus_event.9.t:0 "A Picture’s Worth a Thousand Words"
 GER_focus_event.9.desc:0 "A wild look in his eyes, Speer scoured the pages of the "Germania Times'', one of the Reich’s least-reputable newspapers. After flipping past a full-page advertisement for Pervitin — the "magic" pill meant to help poor Aryan housewives get through the day — he found what he was looking for. His lip shuddered at the sight.\n     “Unbelievable!” Fischer jolted like a startled cat as Speer slammed the paper onto the floor. Gazing at his pale-faced, gnarled reflection in the private jet’s window, the Fuhrer wiped his wrinkled brow in a futile attempt to keep his unkempt hair looking half-presentable. “I bet that sniveling, rat-faced bastard called in his cronies to have the story leaked. Fuck me!” he slammed his fist into the armrest, “I ought to expel that piece of shit from the party!”\n     Fischer dared to pry open his eyes only after a few seconds of the world’s loudest silence had limped by. His gaze fell upon the discarded periodical at his feet — printed upon it, the grayscale photograph of his beloved Führer caught in pure bewilderment as Mussgnug, looking as smug as ever, chatted away on his mobile. A terrible shudder crawled up Fischer’s spine. He had failed — no matter how many bribes or threats he made, Mussgnug's inner circle was always one step ahead, culminating in that damned picture being plastered over every skeevy tabloid in Germany.\n     Rubbing his sweaty palms upon a pair of perfectly-ironed pants, Fischer opened his mouth, yet a silent stutter was all that managed to stumble out. Damn it — now was not the time to get tongue tied!\n     The smooth-talking diplomat crossed his legs and leaned into his armchair, meeting Speer’s sullen eyes. "Fret not, my Führer!” He purred with a practiced smile, “The ignorance of the masses concerning the inner nature of the Jew, the lack of instinct and narrow-mindedness of our upper classes — these things make the volk an easy victim for this Jewish campaign of lies. Mussgnug is nothing more than that — the Jew. The enemy. The press tremble before him, and thus...”\n     Speer blinked at his confidant as he babbled like a broken record. Was this bumbling idiot really the face of the Foreign Ministry?\n     He sighed, decisively cutting off his rambling colleague with a wave of his hand."
 GER_focus_event.9.a:0 "“I know Mein Kampf, you muppet. Shut your mouth for a change and fix me another drink.”"
 GER_focus_event.10.t:0 "These Malls Have Eyes"
 GER_focus_event.10.desc:0 "“Geez.” Katharina placed an empty styrofoam cup atop an overflowing garbage bin, taking extra care not to trigger an avalanche of soda cans and plastic straws. “That took forever...”\n    “Twenty minutes standing in line, all for a bland, runny milkshake.” Stefanie sneered, discarding her drink on a nearby shoe shine stand’s unoccupied seat.\n     “Uh, Stef, the trashcan’s right there...”\n     “Mhm.” Stefanie glanced at her reflection in a large display window, one of hundreds in the palatial shopping mall. “Oh! That reminds me.” The eighteen-year-old turned, finished fixing up her bangs. “Did you ever spend your birthday money?”\n     Grinning widely, Katharina stood on her toes, spotting a blinding neon sign inscribed with a Y2K-style logo. Rows upon rows of stylish, affordable clothing sang like a choir of silent sirens, beckoning her inside. “Not yet...”\n\n                                            /// /// ///\n\nStefanie squealed. Yanking a dress off the rack, she raced toward her friend, nearly flattening several other customers on the way. She held up an elegant sundress, branded with the logo of one of this season’s hottest designers. “Kathy! This is totally you!”\n    “Hm. It’s cute, but...” Katharina’s posture sagged. “Bruno Banani? I’ve heard some pretty messed up things about that brand...”\n    Stefanie’s brows came together. “Don’t tell me you’ve been watching more of those American shows...”\n    “So what if I have? You’ve heard of those sweatshops out East, haven’t you? They’re awful. Just awful!” Katharina’s voice swelled with emotion — but hushed to a whisper after a brief moment of realization. “I know I could get in trouble for saying this, but—”\n    “Then don’t. What are you, a fucking k**e?”\n     As if cued by a conductor, the buzzing conversations that filled the store a moment ago all screeched to a halt. A dozen pairs of eyes speared Katharina’s back.\n     “Undesirables are poor. Water is wet.” Stefanie lowered her head, studying her friend like she were an animal at the zoo. “But without us, they’d still be figuring out how to bang two rocks together to make fire. They’re better off.”\n     “I—” Katharina shrank back, pulling her hair in front of her face to hide herself. “— I was just kidding...”\n     Stefanie rolled her eyes. “So are you trying it on, or what?”"
 GER_focus_event.10.a:0 "Slander Against the Reich, (First offense): -250 | Net gain: -250"
 GER_focus_event.11.t:0 "Today’s Winning Numbers"
 GER_focus_event.11.desc:0 "“Caller?”\n     “I’m on air? O-Oh...” The frail voice of an elderly man, distorted by static, was divined into existence by the cheap radio’s loose antenna. “My question is for Dr. Spitzer. Landing a rover is one thing — but do you really believe that 2010 is a realistic timeline for putting a man on Mars?”\n     “I’ll put it this way. 74 kilobytes of memory put us on the Moon. Imagine what we could accomplish with today’s technology!”\n     “When you put it like that, it’s odd that we haven’t put a man on Mars yet.”\n     “Exactly! Now you’re getting it!”\n     The host spoke up. “Thanks so much for your question, caller. And Dr. Spitzer, thank you for sitting down with us today. Up next on BR24, today’s winning EuroJackpot numbers...”\n\n“Please...” Gustav bit his lip, trembling fingers barely able to hold his ticket. He sat on a cardboard box — one of many piled up in the damp, drafty apartment he and his daughter would get to call home for one more day.\n     Gustav’s heart skipped as the radio spoke the first numbers. Zero. Two. One. He needn’t check his ticket — he’d memorized the eight digits of Franziska’s birthday long ago.\n     “Eight.” the radio continued, “One. Nine. Eight.”\n     Time slowed to a crawl. Signs of life sparked within Gustav’s sunken eyes. Was this really happening? ‘Nine’ was all he needed to hear, and in an instant, all of his worries would be—\n     “...Three.”\n\nHis ticket fluttered to the floor.\n\n“Papa...?” Fransizka’s weakened voice broke Gustav out of his spiral. Were she a foot taller, she probably would have placed her hand on her father’s shoulder. Instead, she settled for tugging on his baggy t-shirt. “Did we win?”\n     Eyes clenched shut, Gustav shook his head. He couldn’t even bear to look at his daughter — just two weeks of rationing meals and insulin had turned her already-feeble frame frighteningly thin.\n     “Franziska?” Gustav blinked away budding tears. “If you could have anything to eat in the world, what would it be?”"
 GER_focus_event.11.a:0 "“Is today a special day, Papa?”"
 GER_focus_event.12.t:0 "The Thousand-Year Nightmare"
 GER_focus_event.12.desc:0 "The toe of his shoe chafed against the ledge.\n\nGustav’s lifeless eyes beheld the moon’s pale reflection, bent by the rippling void below. A December gale breezed past, biting the tears he hadn’t bothered to wipe away.\n     As a boy, he’d heard his mother’s story more times than he could count. The loathsome conqueror, he was told,  had died only a year after he was born. Seizing upon a shred of hope amidst the chaos, his mother had rallied with the people of Warsaw, yearning to cast off the Jackboot and breathe free once more. Like most of her compatriots, she didn’t live to tell the tale.\n     The uprising had taken his mother. Sickness had taken his wife. Father died a slave. His precious Franziska was all he had left — and despite it all, she was enough. Even in the darkest of times, her sunny laughter and toothy smiles broke through the fog of despair. Gustav fought to stay alive for her sake, clutching onto the hope that someday, somehow, his little girl would find a way to escape the Thousand-Year Nightmare.\n\nThis morning, she was laid to rest beside her mother.\n\nGustav’s world was empty; his soul hollow. Nothing remained — nothing to hope for, nothing to cry for, nothing left to take. The detestable machine that fueled the chosen people’s prosperity had used him for all he was worth. Had his ancestors planted their roots only nine miles further west, perhaps he’d be thriving with them.\n     Inching a trembling foot closer to the edge, Gustav filled his chest with the cool evening breeze. Franziska had always liked the cold, but he himself could never stand it. Only now did he learn to appreciate the frigid air’s light, purifying scent. He’d have to tell her once he reached the other side.\n\nThe thought brightened his face as he fell into the arms of the Lord."
 GER_focus_event.12.a:0 "Trespassing: -100 | Misuse of Public Infrastructure: -50 | Net Gain: -150"
 GER_focus_event.13.t:0 "SP-11’s Mysteries"
 GER_focus_event.13.desc:0 "White-tailed seabirds from every corner Madagascar tittered and squawked, greeting Hans as he approached the Reich’s premier rocket launch site — the Wolfee Complex of Aerospace Operations.\n     Hans’ gaze grew distant as he regarded the platoon of birds tottering about the sparsely-populated parking lot. The buzzing ecosystem of reporters and TV cameras that usually covered even the most routine launch was strangely absent. Was there some kind of strike going on?\n     Shrugging, Hans held his ID up to the card reader. A blinking green light disarmed the building’s security system.\n\n                                             /// /// ///\n\nCracking open a can of his favorite energy drink, Hans got to work checking on SP-11’s fuel levels, fuel tank pressurization, and engine conditions. By all means, the rocket was in shape for a successful mission. Now, only one step remained: checking the status of the payload to be delivered to the Pioneer lunar base.\n     Hans typed in his password, and a small text box popped up on the CRT’s curved glass screen. Access denied. Setting down his drink, Hans rolled his eyes. He entered the string of letters and numbers again, taking a bit more care to ensure everything was on the mark.\n     Access denied. What the hell?!\n\n“H-Hans?!” A door clicked open. In walked Sigmund, the head operator of the launch center. A scrawny twenty-something stumbled awkwardly behind the man. “I gave everyone the day off! What are you doing here?”\n     “Bored.” Hans spun back toward his computer. “Hey, did one of you change my password? I’m trying to check on the payload, but—”\n     “Let me stop you there. This is Volodimyr. A new hire.” Sigmund interrupted, gesturing at the stiff young man beside him. “We’re still training him, so he’ll handle the launch today.”\n     “...All by himself?”\n     “Er—” Sigmund wrung his hands. “Th-That’s right. So I really must insist that you enjoy your day off! It’s just a routine launch, after all. The kid can handle it.”\n     “Uh-huh...” Hans leered at the foreigner waiting to sit down at his desk. The tightness in his chest told him something wasn’t quite right, but who was he to talk back to his boss? Standing, Hans narrowed his eyes, reaching for the jacket draped across his chair. “See you tomorrow, sir.”"
 GER_focus_event.13.a:0 "“...What the fuck was in that rocket?”"
 GER_focus_event.14.t:0 "kdn.de/unterlagen/1996/F5G36SG093.pdf"
 GER_focus_event.14.desc:0 "KOALITION DER NATIONEN\nGENERAL ASSEMBLY | 17TH SESSION (MCMXCVI)\n1ST PLENARY MEETING | OFFICIAL TRANSCRIPT, PAGE 47 OF 65\n\nCO-CHAIR: B. AHERN . . . . . . . (PRIME MINISTER, R. OF IRELAND)\nCO-CHAIR: H. JINTAO . . . . . . . (PRESIDENT, R. OF CHINA)\n— — — — — — — — — — — — — — — — — — — — — — — — —\nMR. AHERN, CO-CHAIR: The Assembly recognizes His Excellency Mr. Joseph Fischer, Foreign Minister of the Greater German Reich.\n\nMR. FISCHER (SPOKE IN GERMAN): Today, the Fatherland reaffirms its commitment to shielding the Finnish volk against the cancer of international Communism. The people of Eastern Europe, lest we forget, toiled under the brutality of the criminal Soviet Empire For decades, enduring mass starvations, executions, and other unimaginable human rights abuses too graphic to repeat in this chamber. One pales to imagine what other sick acts of depravity would have befallen these peaceful people had they not been liberated by German arms.\n     Thankfully, the Republic of Finland was spared such a fate, having valiantly defended itself against Soviet incursion on multiple occasions throughout the 20th century. In recent years, however, the Finnish people have been inundated with a deluge of near-daily riots perpetrated by radical trade and labor unions — a transparent attempt by the modern Soviet state to install a friendly government via a popular Communist uprising. Despite this body’s repeated condemnations, the USSR’s underhanded efforts to stoke civil war have continued unabated. The prospect of a protracted, pro-Soviet insurgency tearing the Finnish Republic apart is no longer a matter of if, but when.\n     Once again, we call upon the General Assembly to join the Greater German Reich in delivering financial and material aid to the Republic of Finland, in hopes that the USSR’S impending coup can be swiftly and sufficiently crushed. History has laid bare the procession of horrors that inevitably transpire anywhere the Red flag flies — it is imperative that every action be taken to oppose the spread of this toxic, ruinous ideology."
 GER_focus_event.14.a:0 "MR. JINTAO, CO-CHAIR: Thank you, Mr. Fischer. The Assembly now recognizes His Excellency Mr. Albert Gore, President of the United States of America"
 GER_focus_event.15.t:0 "Another One Wipes the Dust"
 GER_focus_event.15.desc:0 "Kerstin sighed, placing the freshly-emptied laundry bin atop the buzzing washing machine. She leaned lifelessly over the vacant basket, wincing at the feeling of another dozen knives prodding her spine. Those painkillers sure were taking their time — but at least the laundry was finally finished.\n     She closed her eyes, breathing in the fleeting euphoria of a job well done before, like always, that feeling crumbled to dust.  Paltry tears, glittering like watery crystals in the dimming evening light, welled in the corners of her eyes as a neverending to-do list churned away within her scattered mind.\n     A mountain of work loomed overhead, but try as she might, Kerstin’s aching shoulders simply refused to budge. What was wrong with her? Why couldn’t she just be a good wife, happily serving her household like Andrea or Claudia? She had a duty to uphold the Aryan family, regardless of those pesky emotions rattling around in her head.\n     She shouldn’t resent her husband; Lukas was a good man, even if he lost his temper sometimes. Fear gripped her heart at the thought of him leaving — of being alone, of never remarrying. What bachelor in his right mind would take a once-divorced, 37-year-old bride?\n     She shouldn’t hate the twins; Even if they made everything ten times harder, the emptiness she felt whenever she held them wasn’t their fault.\n     Her heart stuttered as the hands of her watch — a wedding gift from her father-in-law — ticked ever-closer to sundown. A purple bruise sat just beneath the frayed band, reminding her of what waited for her if dinner wasn’t ready on time.\n     Wiping the corners of her eyes, Kerstin took a half-finished roll of Pervitin from the pocket of her dirtied apron. She closed her eyes, emptying her chest with a long, tranquil sigh as the magic pill dissolved upon her tongue. The pain, the uncertainty — it all disappeared within minutes.\n\nAll better.\n     Kerstin’s finger rapped on her temple as she pondered her next task. Now that the laundry was finished, the kitchen would need to be sweeped. Whistling her favorite tune, she grabbed the broom — if she hurried, she just might get a head start on dinner."
 GER_focus_event.15.a:0 "So much to do, yet so little time…"
 GER_focus_event.16.t:0 "Business In the Front, Business In The Back"
 GER_focus_event.16.desc:0 "“Again, I sincerely apologize for the delay...” Gerhard Frey — Fuhrer Speer’s hand-picked Minister of Finance — addressed the packed council chamber through clenched teeth. It had taken ten minutes to figure out how to get that newfangled “PowerPoint” program to function properly, and another ten to shoo away that goddamn talking paperclip. “Seeing as we’re considerably behind schedule, we’ll skip the formalities. Herr Baur...?”\n     Manfred Bauer adjusted the angle of his mic. “After three years of tireless work, there remains only a single hurdle to clear before the formal launch of the Euromark. Today’s objective is to determine precise rates of exchange through which Europakt member states will convert their existing legal tender to the new currency. Stefan, if you would...?”\n     An acne-riddled intern, crooked tie dangling awkwardly from his neck, clicked the computer mouse cradled in his hand. A hundred eyebrows flinched in shock as the projected slide transformed into a rotating, three-dimensional cube. The next slide, appearing on the adjacent face, filled the screen a moment later.\n     “Amazing what they can do nowadays.” A red laser pointer emphasized Herr Baur’s next words. “The following chart displays the average—”\n\n“The Slovaks know what money is?” Somewhere in the chamber, a hot mic broadcasted an unknown attendee’s snide remark. “I’m amazed they ever advanced past the barter system.”\n     A laugh. “No, no. I heard they were actually the first to invent currency.”\n     “Really?”\n     “Yeah, they used lumps of cow shit. Still do in the more remote areas. That’s where the smell comes from.”\n\nA scowling Frey loudly cleared his throat. “I’m sorry — This is the Europakt Central Bank, not a beer hall. If you’re incapable of taking today’s proceedings seriously, you’re free to leave. Encouraged, actually.”\n     Frey coughed. An excruciatingly-stiff silence, broken only by the shrill feedback coming from his mic, choked all traces of life from the room.\n     “Now, then.” Frey donned his reading glasses, scrutinizing the papers arranged neatly on his desk. “Herr Baur, please continue.”"
 GER_focus_event.16.a:0 "Someone got up on the wrong side of the bed."
 GER_focus_event.17.t:0 "Money Talks"
 GER_focus_event.17.desc:0 "“Sir?” A youthful staffer stepped into an ostentatiously-furnished office, struggling to keep an overstuffed binder snug beneath his arm. “I know you didn’t want anyone interrupting your work, but—”\n     Gerhard Frey’s fingers tap-danced across an unstylish ergonomic keyboard, a half-written email reflected in his specs. “The Reichslander Index. Is that why you’re here?” A pair of baggy eyes glanced up from the monitor, granting Frey’s staffer the miserly dignity of a half-second’s worth of eye contact. “Make it quick.”\n\n“Sir!” The young man snapped to attention, flipping urgently through a ring-bound tome of pie charts and line graphs. “Throughout 1995, our efforts to counter discontent across the East continued paying dividends. New Orthodox outreach programs have established strong roots in native communities, infrastructure investments are paying for themselves, and marginal wage increases have created profitable, stable economies with total economic dependence on Germania.“\n     A nodding Frey double-clicked his computer mouse. “Give the natives something to lose, and they’ll think twice about biting the hand that feeds them.”\n     “Precisely.” His staffer flipped to a new page. “Across the East, the textile industry continues to reap greater profits thanks to the successful rollback of several 70s-era child labor and safety regulations. Consumers are reaping rewards, too — in Germany proper, designer brands such as Bruno Banani are retailing at a fraction of what they cost only five years ago.”\n\n“Good on them for recovering so quickly.” Frey remarked, “Had that disaster pulled their stock price any lower, a huge segment of the economy would’ve gone down with them.”\n     The staffer blinked. “Disaster?”\n     “The Luhansk factory fire. Don’t you read the memos?” Frey folded his arms across his chest. “500 million marks worth of labor assets went up in flames — all because some harebrained worker couldn’t be bothered to walk five meters to an ashtray.”\n     “Ah — Of course! I remember.” Frey’s staffer offered an awkward smile. “Such a shame. Did they ever come out with an official count of the dead?”"
 GER_focus_event.17.a:0 "“500 million in labor assets. Weren’t you listening, boy?”"
 GER_focus_event.18.t:0 "Enriching the Youth"
 GER_focus_event.18.desc:0 "“...It’s not a child! It’s a four-day-old embryo!”\n     “Life begins at conception, and every good Catholic watching would agree.” A well-groomed fellow in a button-up shirt looked directly into the news studio camera. Below, a banner reading ‘BREACHING THE UNKNOWN: THE ETHICS OF STEM CELL RESEARCH’ spanned the bottom of the screen.“Terminating any human life is murder. Period.”\n     A middle-aged man, seated across the newsroom’s modern table, crossed his arms with a sigh. “But not every human life is necessarily equal! We know there are vast biological and mental differences between the races. For heaven’s sake, the Poles were all slaves less than thirty years ago. Why not sacrifice a few of their embryos for the sake of the greater good?”\n     “All are equal in the eyes of God.”\n     “Again with the bible-thumping! The millennium is just around the corner, and yet there are still people like you clinging to medieval superstitions. Your mind is clouded by religion!”\n     “And your heart is poisoned by hatred. I’ll pray for you.”\n     A series of sharp ‘bleeps’ punctuated the opening of the older man’s finger-jabbing rebuttal. “Race traitor! You’re the one who ought to be praying! You and the rest of your little cult would be shot dead in the streets if a real man like Mussgnung was in charge!”\n\n                                             /// /// ///\n\n“Papa...?” Katharina sighed. Staring at the television with a glazed look in her eyes, she leaned into the sofa’s plush armrest, head propped up by her fist. “This is boring. Can I go back to my room now?”\n     Konrad lowered the volume by a few ticks. “Why, so you can keep rotting your brain with more of your anti-German claptrap? Watching that garbage is what landed you in hot water in the first place.”\n     “What? How is Dawson’s Creek anti-German?”\n     “It just…is! Look, I love you, but you’re an adult now. You need to be spending your time doing something that contributes to the nation—”\n     “Oh, please. Don’t start with that! I have plenty of time to get married!” Katharina leapt to her feet, fists balled tight. “Have you ever considered that maybe I don’t want to waste the best years of my life raising some guy’s snotty kids? It’s not fair! Just because I’m a girl, why should I be forced to—”\n     A swift slap silenced her impassioned speech."
 GER_focus_event.18.a:0 "“That’s enough — You know they’re listening!”"
 GER_focus_event.19.t:0 "In Vino Veritas"
 GER_focus_event.19.desc:0 "Beneath the vaulted ceiling of the NSDAP headquarters, the clinking of glass and cutlery harmonized with a live rendition of “Eine kleine Nachtmusik”. The booze flowed freely, and with it, a symphony of boisterous laughter filled the sumptuous ballroom.\n\n“...I’m just having second thoughts, is all. I recently had a chance to take a closer look at the ‘95 Reichslander index, and, well, the numbers just don’t add up. Especially in the colonies—”\n     “Can it, four-eyes.” Downing the last of his kirschwasser cocktail, a jolly Mussgnug socked Frey on the arm. “I’m sure everything’s fine. It’s a party — have some fun for once in your life!”\n     “He’s right. We’re here to celebrate a momentous victory for the nation. You’re killing the mood.” Fischer cut precisely into a tenderloin steak. “Honestly, Frey, do you ever even stop working to pleasure the missus? Or is that the reason why you can’t keep a marriage together to save your life?”\n     A bitter smile hardened Frey’s features. “Charming. Remind me, how many years did you spend behind bars for being an ANTIFA k**e?”\n     “Enough!” Speer groaned. “We’re here to celebrate the eve of the Euromark launch. Could we please put a stop to the petty infighting for one evening?”\n     “That’s right. Better fall in line, fellas.” Mussgnug leaned back in his chair, gesturing for a waiter to refill his glass. “You wouldn’t like ol’ Allie when he’s angry.”\n     “Martin!” Speer hissed — so much for making peace. “I told you to stop fucking calling me that!”\n     Mussgnung’s freshly-filled glass concealed a self-absorbed smile. “Sincerest apologies, my Fuhrer.”\n\nCackling like a schoolboy, Deckert limply prodded Speer on the shoulder, slurring his words so severely that they barely even sounded like German. “God damn! Get a load of that smokin’ piece of ass...”\n     “Herr Deckert.” Speer squinted over his shoulder, then at the object clutched in Deckert’s other hand — a completely-drained bottle of brut champagne. “I believe you’ve had quite enough—”\n     “Aw, lighten up! Blue dress! Giant rack! Can’t miss ‘er!”\n     “Yes, I’m quite familiar." Speer straightened his posture, leering at his Defense Minister with murder in his eyes."
 GER_focus_event.19.a:0 "“That would be my daughter.”"
 GER_focus_event.20.t:0 "Yes, Dear"
 GER_focus_event.20.desc:0 "“Idiot!” Ducking into his bulletproof limousine, Speer winced; the sound of his own ragged voice speared through his pounding skull. “Is that slimy fuck really the best the Wehrmacht has to offer?!”\n     “Allie, calm down!” Ingmar Speer sat beside her husband, embracing his hand in hers. “You know how Deckert gets. He didn’t know.”\n     “Listen to yourself! This is our daughter we’re talking about!”\n     “Yes, dear. But let’s not lose our heads. Deckert was just doing what men do. It’s natural!”\n     “Lots of things are, but most have the decency to keep those activities to themselves.” Speer slashed his seatbelt across his chest. “I’d fire the shithead, but why bother? I’d just wind up with Deckert Mark II filling the empty chair!”\n\nWhat happened? How and when did the NSDAP become infested with these incompetent, immature wastrels? Things hadn’t always been this bad. Not by a longshot. Had he really let his Father’s masterpiece degrade to this point?\n     Under his own leadership, the mighty Wehrmacht that beheaded France in six weeks had mutated into a money-gobbling dragon that couldn’t even fend off a savage horde of Slavic barbarians. After the East was lost, a decade of stagnation and political deadlock preceded the economic catastrophe that consumed Germany in the wake of the Europakt’s formation.\n\nAnd the Euromark launch — oh, God. This had to go smoothly. Another abysmal catastrophe would be like slipping concrete shoes onto the feet of his already-drowning regime.\n     Through the limousine window stood his father, regarding him sternly from the Germania skyline. Speer’s stance hardened beneath the weight of it all. What was he thinking? His was a nation of Aryan warriors — an unspoiled island in a sea of western degeneracy. Father’s legacy would withstand the test of time, and his own legacy would prove that. No, the Party wasn’t perfect, but neither were the deities of his volk’s noble Germanic ancestors. Flaws abound, both were as gods, shaping the earth to their whim like soft clay.\n     Silencing himself with an affirmative nod, Speer squeezed Ingmar’s hand. “Perhaps I’m overreacting...”"
 GER_focus_event.20.a:0 "“Now fasten your seatbelt, or we’ll never get home.”"
