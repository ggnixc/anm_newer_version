 GER_Reichskonkordat_II_desc: "For 45 years the Reich has persecuted christianity under the §OKirchenkampf§! attempting to erase the influence of the church and christianity in its entirety. These institutions were seen as a threat to the £GER_Laws_Desc_NSDAP §jNSDAP§!’s total control of all aspects of life by providing the Germanic people access to an authority outside that of the party. In lieu of Speer Sr. assuming the throne of Germania a new philosophy arose, the church is not a threat to the £GER_Laws_Desc_NSDAP §jNSDAP§!’s authority but a useful tool that can be utilized to further control the Germanic people. Under the renewed Reichskonkordat the Reich has reconciled with the £GER_Laws_Desc_Church §EHoly See§! and Pius XIII,  quilling church-related social unrest. The government has now successfully imposed its own §GAryan§! interpretations of Catholicism and Lutheranism putting God as an ally to the Germanic people and §GAryan§! race."
 GER_Grossdeutsche_Volksliste_desc: "The §oLaw for the Restoration of the Professional Civil Service§! was the first racial law enacted under the authority of the £GER_Laws_Desc_NSDAP §jNational Socialist§! government, barring any §sNon-Aryan§! from holding civil service roles. It came into effect on April 7, 1933, two months after Adolf Hitler's rise to the chancellery, and ever since the racial construct of the Reich has only become harsher.\n\nThe current situation in the Reich can be broken down into a racial hierarchy, placing those of Germanic and Anglo-Saxon descent at the top as §GPure Aryans§! with full rights. Next are the §rGermanized§! Deutschstämmige; Livonians, Ukrainians, and French, who now carry their Aryan ancestry with pride. While this group differs in origin, generations of cohabitation and harmonization has allowed them access to most, if not all, public amenities. Then there are §GHonorary Aryans§!, which are not considered pure-blooded enough to be true §GAryans§! but have shown themselves as a worthy race. This group includes Hungarians, Slovaks, Finns, Turks and Pakistanis. Below that are all non-Europeans and §sMischlings§!. §sMischlings§! are of European descent but are considered mixed or not Aryan enough; these groups consist of Italians, people of Iberian descent, Bosniaks, Croats, and Serbs. Both §sMischlings§! and non-Europeans have limited rights within the Reich but are not viewed as subhuman.\n\nAt the bottom are, as decreed by the §oNuremberg Laws§!, the §xUntermensch§!. Jews, Eastern Slavs, Roma, and Negroes are all seen as subhumans. Throughout the decades the policy of extermination and enslavement of all §xUntermensch§! did not end, but instead gradually faded into obscenity."
 GER_Deutsche_Weltgemeinschaft_desc: "The £GER_Laws_Desc_Welt §BDeutsche Weltgemeinschaft§! is the de facto term for the extensive network of treaties, alliances, and pacts that collectively form the Reich's global alliance. A large component of this network is the £GER_Laws_Desc_Europakt §BEuropäischer Unabhängigkeits- und Integritätspakt§!, established after the defeat in the §VSecond West Russian War§!. The treaty, signed by all European nations allied with the Reich, aims to protect European sovereignty. Over the years, the alliance has grown in military, economic, and political significance, with member nations standardizing infrastructure, such as railway gauges and powerline networks.\n\nEconomic integration is driven by the §OCommission for the European Economic Sphere§!, a body of technical and economic experts from all member countries. The joint military defense treaty, further expanded under the §QSecurity Council of the Europakt§!, obliges all member states to support each other in the event of foreign hostilities.\n\nAdditionally, the £GER_Laws_Desc_ME §BMittlerer Osten Verteidigungsbündnis§! provides the legal framework for the Reich's influence in the Middle East. First and foremost this alliance solidifies German control over the region and ensures steady access to its abundant natural resources. In return, member states receive substantial economic investments from the §OMiddle-East Group§!, their administrators are responsible for crafting economic and political policies for the broader region. Reich-aligned nations also receive extensive military equipment and advisors through the §QMiddle East Defense Commission§!, a committee of German, Pakistani, and local military administrators dedicated to maintaining regional stability."
 GER_Das_Euromark_Projek_Preparation_desc: "With the scars of the §VSecond West Russian War§! finally healed, a transformative economic project is underway that will change the continent forever. The Euromark-projekt is a continent-wide initiative among all £GER_Laws_Desc_Europakt §BEuropakt§! members to establish a unified European currency. This new currency, the £GER_Laws_Desc_Euromark §OEuromark§! will replace all pre-existing national currencies within the Pakt. Since the beginning of this year national mints have ceased production of their respective currencies and begun minting marks. Well-timed citizens already exchanged soon-to-be obsolete currencies for new marks at their local banks. The £GER_Laws_Desc_Euromark §OEuromark§! is expected not only to strengthen the economies of all participating nations, but also to outperform the £GER_Laws_Desc_Dollar §OUnited States Dollar§! as the leading global currency. January 1, 1997, will be a date recorded in history books worldwide, marking yet another time when German innovation shook the world."
 GER_Das_Euromark_Projek_Launched_desc: "WIPWIPWIP"
 GER_Lebensraum_Im_Osten_desc: "In the aftermath of §VOperation Barbarossa§! in 1941, the first eastern £GER_Laws_Desc_Subject §sReichskommissariats§! emerged to administer the Reich's newly acquired territories. These newly established administrative bodies systematically subjected the Slavic populace and former USSR territories to enslavement, colonization, exploitation, with selective assimilation and §rGermanization§! efforts. However the onset of the §VSuccession Crisis§! halted decades of oppression as unrest spiraled beyond control, prompting the Reich to reassert control over the regions before resuming regular administrative functions. Faced with these challenges, Führer Albert Speer Sr. promptly ordered the immediate execution of §oGeneralplan Ost§!’s remaining phases.\n\nHowever, renewed Soviet hostilities once again disrupted these efforts, forcing German retreats from Moskowien and portions of former Ostland. Following the conflict's resolution, the Führer disbanded the £GER_Laws_Desc_Institutions §oOstministerium§! and put an end to decades of dramatic administrative events. Eastern territorial administrations now directly receive orders from Germania, albeit in a less centralized manner than the £GER_Laws_Desc_Subject §sReichsgaue§!. These £GER_Laws_Desc_Subject §sReichsprotektorats§! are the mantle of the principal administrative apparatus in the Reich's eastern territories. \n\nBaltenland stands as an exemplar, showcasing their robust economy, superior infrastructure, and successful §rGermanization§! initiatives. Leveraging its fertile Chernozem fields and numerous industrial centers, Ukraine has become the Reich's economic backbone generating a diverse array of raw materials and consumer goods. Conversely, Weißruthenien remained a perpetual drain on Reich resources, plagued by recurrent insurgencies since the conclusion of the §VSecond West Russia War§!. With its populace demonstrating sustained disloyalty the Reich has initiated the §GGreen Heart Project§! which aims to swiftly de-industrializing and depopulating Weißruthenien, ultimately transforming it into a massive nature reserve with most population centers consigned to history."
 GER_1948_Nuremberg_Constitution_desc: "From 1933 to 1947, the £GER_Laws_Desc_NSDAP §jNSDAP§! government never formally ratified their authority. Instead they suspended the Weimar constitution and, utilizing temporary emergency measures like the §VEnabling Act§! and §VReichstag Fire Decree§!, established governance. Following the war's conclusion the Reich convened a new constitution at the §oReich Party Congress of 1948§! in Nuremberg to fully legitimize the German government.\n\nThe new constitution builds upon the framework of the Weimar constitution, adapting it to suit the requirements of the £GER_Laws_Desc_NSDAP §jNational Socialist§! government. The §oNationalsozialistische Verfassung des Großgermanischen Reiches§! enables the German government to function more efficiently, embedding £GER_Laws_Desc_NSDAP §jNational Socialism§! into the constitution while introducing new institutions like the £GER_Laws_Desc_Senate §EReich Senate§!. Moreover, it augments the authority of the Reichstag, empowering it to effectively balance power between the executive and legislative branches."
 GER_Drexler_Score_desc: "§rDas Soziale Volksprotokoll§! is a social credit system assigning every Reich citizen a baseline credit score based on §GGenetic Purity§!. Utilizing the Reich's extensive surveillance camera network the daily activities of citizens are closely monitored. Actions deemed treacherously disloyal to the Reich, or detrimental to the German people—such as visiting §xDegenerate§! websites or littering—result in the deduction of credit points. Conversely, actions demonstrating loyalty to the Reich or exemplifying model citizenship—such as regularly consuming party-approved media—earn individuals additional credit points.\n\nA §GHigh Score§! grants citizens access to exclusive privileges unavailable to those with average or below-average scores, including food discounts, priority access to welfare programs, medical services, and advanced educational opportunities. Having a longstanding §xLow Score§! leads to loss of access to social and welfare benefits and placement on a watch list. Failure to conform to the protocol’s principles necessitates §xMandatory Re-Education§!."
 GER_Prevailing_Partocracy_desc: "The Reich's §oPartocracy§! operates on principles of absolute authority, extending its reach from the tiniest hamlets to the grandest cities, all under the dominion of the £GER_Laws_Desc_NSDAP §jNSDAP§!. The party's objective is to cultivate a populace bound by unwavering allegiance and obedience, elevating the party above all other considerations. Within the party hierarchy the most esteemed £GER_Laws_Desc_NSDAP §jNSDAP§! members rigorously uphold a cadre of unwavering adherents throughout the lower and middle echelons.\n\nWhile only the upper echelons of the party enjoy the privilege of questioning decisions without risk of immediate retribution, those in middle and lower ranks face constant peril of displacement should their loyalty falter. This policy of §xAbsolute Allegiance§! has engendered a complete fusion of state and party functions, rendering them indistinguishable; the party embodies the state, and the state embodies the party."


