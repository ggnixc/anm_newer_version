 # World News Events #
 WORLD.18186.t: "Nuclear Fusion Cracked!"
 WORLD.18186.desc: "Hours ago, German representatives from the European Commission of Collaborative Research announced the successful development of the world’s first fusion-powered nuclear reactor on Pionier, Germany’s moonbase.\n\nEfforts to crack the golden goose of nuclear fusion have long been written off as an impossible feat, but the rush to claim credit for the discovery suggests that theory has at last become reality. Compared to existing nuclear power plants, the newly-discovered method would produce thousands of volts with extreme efficiency, powering entire provinces with little effort.\n\nThough the astounding scientific achievement has been met with applause from the international scientific community, many OFN-aligned leaders have reacted with shock. Unconfirmed reports suggest that the United States plans to revitalize previously-unsuccessful attempts to create their own fusion program."
 WORLD.18186.a: "The power of the sun, in the palm of your hand."
