 GER_flavour_event.4.desc:0 "(GER) VideospielMeister3341: lmao it is truly mind blowing how stupid the Americans on this forum are. Some fucking r****d just claimed Speer Sr. set up the slavery system. He was the one who fucking abolished it! Hypocritical yankees don’t like the fact, but Germany has done a whole lot more for freedom and equality than they ever did.\n\n(SWE) Gast1452: lol ok dumbass...sorry but who gives a shit. speer was still a nazi scumbag and he’s burning in hell...when will people finally learn from the past?? one day black gold and red will replace the swastika…\n\nUSA) ProSkaterKidd: YEAH LMAO NO ONE CARES KRAUT THE SOVIETS KICKED UR ASS IN 1981 AND THEY’LL BUTTFUCK YOU AGAIN\n\n(GER) VideospielMeister3341: ProSkater, are you seriously proud of the Soviets? Do you really think they’re better than Germany? They committed so many atrocities in the 2nd West Russian War it’s not even funny. You seriously need to educate yourself.\n\n(USA) ProSkaterKidd: I DONT GIVE A SHIT F****T THE ONLY GOOD GERMAN IS A DEAD GERMAN THE SOVIETS DIDNT KILL ENOUGH OF U FUCKHEADS IN LENINGRAD\n\n(UK) PrestigeChoose: bro turn off caps lock\n\n(GER) VideospielMeister3341: Average brainwashed American. When Germany does something, it’s genocide, but when America or its allies does something, it’s in the name 'freedom’. Need I remind you of the genocide of Native Americans perpetrated by your founding fathers?\n\n(USA) ProSkaterKidd: EAT SHIT NAZI F****T\n\n(GER) VideospielMeister3341: Wow, great rebuttal.\n\n(ITA) Birdmast84: LOLOLOL he’s mad\n\n(GER) xXxSchwarzeSonnexXx: Hahaha Videospiel still believing in the degenerate Reich. I needed this laugh. I wish the Ordenstaat were still around so I could laugh as you and your whole family got shoved on a train bound for Rodomo.\n\n(GER) Kornorks: Alright, that’s it. Thread locked. You people need some fucking therapy..."
 GER_flavour_event.4.a:0 "Anonymity doesn't always bring out the best in people."
 GER_flavour_event.5.t:0 "Fish Out of Water"
 GER_flavour_event.5.desc:0 "Franz had been pedaling for so long, he could hardly feel his legs anymore.\n     A few days ago, the hit counter on his GeoCities blog “Journey Across The Wild East!” had finally reached 1,000 — the whole reason why he found himself in his current unenviable position.  Here he was, deep in the vast Ukrainian countryside, sweating buckets and lugging around a dead camera in his backpack. All in the name of delivering some ‘unique content outside of big cities’ for random strangers he’d never met.\n     Franz cursed as he turned the corner, snapping a branch off of the first tree foolish enough to get in his way. All he wanted was a cold beer and a warm bed — but to do that, he’d need to find some sign of...\n\nThe enticing aroma of baking bread tore Franz away from his racing thoughts. He glanced up. A small village peeked over the horizon.\n\n“...Civilization?”\n\nDitching his bike in the tall grass, Franz dashed toward the nearest hut and knocked thrice. The place had seen better days — apart from a handful of electrical wires poking out of the wall, the small dwelling looked like it hadn’t been renovated since the Kievan Rus.\n     The door creaked open slightly. An old, frail-looking woman peeked through the crack. “Hm...?”\n     “G-Good evening, ma’am!” Franz smiled, still panting like a dog. “Sorry to bother you, but do you speak German?”\n     “U-Um...” The woman opened the door a few inches more. Her furrowed brow and forced stance betrayed her obvious discomfort. “Yes, sir. Is there a problem? I can assure you, we are all good, upstanding people...”\n     Franz’s squared shoulders relaxed at the sound of his native tongue, heavy accent or not. “Thank goodness! Listen, I’m a tourist from Germany, and I’m in a bit of a tight spot—”\n     “You...” The woman’s carefully-curated affect melted away in an instant. “...You are not a Reichsland official...?”\n     “No, ma’am. Like I said, I’m just a tourist, and I really—”\n     “A tourist. Is that a fact?” The woman spat out a venomous laugh. Opening the door fully, she stepped closer, closing the gap between herself and a shrinking Franz. “You’ve got a lot of showing your face around here.” She growled, stabbing a finger towards the road out of town. “Get out. Now.”\n\nFranz didn’t even bother stammering out a reply. Limbs trembling, he scrambled to his discarded bicycle."
 GER_flavour_event.5.a:0 "He’d never pedaled so quickly in his life."
