 GER_europapakt_member:0 "Center of the Europakt"
 GER_europapakt_member_desc:0 "The Europakt is the perhaps most ambitious international project of all time. Created as a merger of the Einheitspakt and the Zollverein economic union, it coordinates the Economy, Military and Politics of the German-aligned European Sphere. Travel, Trade and Borders are open for all members. It seems as if Europe has come together for the first time in millennia. However, the future of the Europakt is uncertain. With democratic and German-inspired regimes alike, the question of European Ideology is heavily debated. The more reactionary forces within Germany oppose the Pakt, some wish for more national control. Most of the EP power still rests within Germany itself, and conflicts are common, but \n§MEuropean Unity§! is not a distant dream anymore, although its character has not been decided."

