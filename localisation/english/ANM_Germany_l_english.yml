 GER_focus_event.33.desc: "Fruhenden: ATTENTION ALL SPEER SUPPORTING SHITHEELS ON THIS SITE. PLZ EXPLAIN WTF ALLIE IS DOING GIVING MONEY TO BRITAIN?! GERMANY IS IN THE MIDDLE OF AN ECONOMIC CRISIS AND HE WANTS TO HELP THEIR ECONOMY? AM I MISSING SOMETHING HERE?! HOW ABOUT WE SPEND THAT MONEY ON OUR OWN COUNTRY?!\n\nAnime-fan-1977: Calm down. First of all, that money was allocated months ago. Second, Britain is our ally. When their economy does well, ours does too. It’s basic economics.\n\nWalnut83: also its called soft power dickhead. making friends is just as important as having a strong army...\n\nFruhenden: LMAOOOO THE ONLY THING SOFT HERE IS BETWEEN SPEER’S LEGS\n\nAnime-fan-1977: Good god, this constant wailing from Mußgnug supporters is really trying my patience. Every fucking day there’s a new “scandal”. I can’t wait to read tomorrow’s headline about Speer wearing the wrong color suit. Honestly...\n\nFruhenden: OR HOW ABOUT YOU STOP RIDING SPEER’S DICK AND JOIN THE RIGHT SIDE OF HISTORY? LMAO IF I WERE YOU I’D SCRUB THAT COMMENT FROM THE WEB...SPEERITES ARE IN FOR A BIG SURPRISE SOON ;)\n\nAnime-fan-1977: LOL is that a threat? Ok cock-for-brains, give me one sec to look something up...\n\nAnime-fan-1977: (DELETED)\n\nxXFederstXx (MOD): Well done, Anime-fan-1977. Enjoy your permaban. I can tolerate you constantly posting this cultural marxist horseshit, but outright doxxing is a step too far. Let this be a warning to the rest of you.\n\nFruhenden: HAHAHAHA GOOD RIDDANCE F****T"
