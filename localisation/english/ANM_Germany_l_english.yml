 GER_flavour_event.28.t: "Ask Your Doctor"
 GER_flavour_event.28.desc: "“And now, a word from our sponsors...”\n\nThe TV spot began with a grayscale shot of a clock ticking in slow motion. Each melodramatic twitch of the minute hand echoed louder as the camera zoomed out, revealing a gloomy pencil pusher slouched over at his desk.\n     “Feeling sluggish at the office?” Began the smooth-talking voiceover. “Are the tasks piling up?” A dense facade of sticky notes smothered every inch of the cramped cubicle wall. Messy mountains of loose documents covered the floor, with even more fluttering down from above.\n     The worker sighed and set down an empty mug. “The boss needs that report on his desk tomorrow morning, but coffee just doesn’t give me that extra push I need anymore…” he eyed the clock sadly, “Guess I’m in for another late night…”\n     “And leave the wife all alone? There’s a better way: Pervitin!” The voiceover continued, “Just two tablets a day can boost  your confidence and concentration, granting you the power to reign in that neverending to-do list.”\n     A little white tablet magically appeared in the worker’s hand. The moment he popped it into his mouth, a tide of color swept away the gray, brightening the drab office with stark, saturated colors. He began typing furiously, and the endless papers piled up slowly disappeared.\n     After a cut, the worker dropped a thick report onto his superior’s desk.\n     “What? Already?” The boss smiled, flipping through the packet. “Simply outstanding! How’d you like to leave early today?”\n     “Don’t wait.” The medicine’s sleek logo flashed onto the screen, accompanied by its technical name — methamphetamine — in a much-smaller typeface. “Ask your doctor if Pervitin is right for you.”\n     The remainder of the commercial consisted of a montage of seemingly-unrelated clips of a happy Aryan family; over top, a sped-up voice read through the odyssey of disclaimers at the bottom of the screen. “Pervitin is a highly-addictive substance. Severe dependence is likely to develop with regular use. Do not exceed one tablet per day. Side effects may include mood swings, aggression, weight loss, cirrhosis of the liver, psychosis, an increase in risk-taking behaviors, stroke, heart attack, seizures, and in rare cases, death.”"
 GER_flavour_event.28.a: "Brought to you by Temmler Pharmaceuticals."
 
 ## Focus Tree Events ##
 GER_focus_event.1.t: "My Führer, Green is Not Your Color"
 GER_focus_event.1.desc: " “...and with our economy booming, and our diplomatic position firmly secured, 1996 is slated to be another landmark year for our nation!”\n     A polite trickle of applause just barely echoed off the swastika-trimmed walls of the Volkshalle. The enormous golden eagle mounted at the far end of the rotunda scrutinized the uniformed audience with the same stern face it had worn since the days of Hitler.\n     Führer Albert Speer Jr. — master of the Aryan race, shepherd of the Europakt, and supreme leader of the Greater German Reich — leaned away from the bouquet of microphones splayed across the podium. “Greatness is our destiny.” He punctuated his words with a precise roman salute. “Long live Germany!”\n     The audience  — occupying only a third of the available seats — stood in tandem. “Heil Speer!\n\n                                             /// /// ///\n\nSpeer’s secretary wore her signature smile, holding open the door to the Führer’s private dressing room. “Another fantastic New Year’s Address, my Führer.” \n     The master of Europe’s sharp posture persisted until the very moment the door closed behind him. “You’re too kind, Monika.” He said weakly, hobbling toward a haughty leather couch with a gait more becoming of his age. “If you wouldn’t mind, I’d appreciate some time alone to unwind...”\n     Monika nodded. A moment later, the door clicked shut.\n     Sighing, Speer reached for the remote. At the click of a button, a bulky CRT crackled to life. The picture took a moment to crawl in from the edges of the screen, but the boisterous voice that came from the speakers was unmistakably familiar.\n     “Mußgnug...?” Speer could have crushed the remote in his trembling hand right then and there. “So this is why he was absent tonight?”\n     Martin Mußgnug — the Reichstag President, and the Führer’s subordinate — stood at the center of a sold-out football stadium, surrounded on all sides by stuttering camera flashes. His words were peppered with pauses, forced to stop every time the crowd shouted their unwavering support.\n     The camera panned across the electric audience. Sure enough, Speer recognized more than a handful of the faces. These were party officials. Reichstag members. The occupiers of the vast sea of empty seats he’d just spoken to.\n     Grinding his teeth, Speer mashed the power button."
 GER_focus_event.1.a: "Next year, expect attendance to be mandatory."
 GER_focus_event.2.t: "Keeping Score"
 GER_focus_event.2.desc: "Franz inhaled. The familiar rush of nicotine tickled his fingertips.\n     The young man had never been too big on smoking, but ever since he started working part-time at the Aldi, he found the extra breaks too enticing to pass up. Taking one last puff, Franz discarded the spent cigarette onto the sidewalk and reached for another.\n     “Attention!” A pair of speakers mounted to a swastika-topped flagpole shrieked to life. “The following is a public service announcement.”\n     Franz clenched his eyes. Great. The headache he was nursing had just barely begun to fade, but the shrill squeak of the generation-old loudspeakers was undoing all of the nicotine's hard work.\n     “In 1985, Eric Rothberg, a childless man, collected 105,000 marks in welfare payments to support three phantom children. In 1990, Sofia Landau was found guilty of welfare fraud, having collected over 65,000 marks in ill-gotten disability payments. In 1993, Eric Morgenthau collected 88,000 marks in unemployment benefits despite earning a six-figure salary.”\n     “The German nation is pure. But even among Aryans, criminals lurk in the shadows, plotting to drain the Reich of its resources and leave it open to invasion by the Jewish USSR. What is to be done, you might ask, to ensure that our valuable resources are only spent on those who deserve them? Fret not — there is an innovative, computer-age solution. Introducing the Drexler Score.”\n     Franz perked up. Drexler? As in Anton Drexler, the founder of the NSDAP? What a coincidence — he’d just written a blog post about the man’s memorial statue in Warschau.\n     “Starting today, every citizen’s actions will be tracked and used to quantify their value to the nation. Responsible citizens with higher scores will be granted certain privileges not accessible to those of corrupted moral character, including eligibility for welfare payments. At last, good citizens will be rewarded for their selfless contributions to the nation, and lazy wastrels will be punished for their insolence. For more information, visit www.Volkshalle.de/Drexlerpunktzhal. Heil Speer!”\n    Franz hacked into his sleeve. Suddenly noticing the handful of surveillance cameras mounted all around him, the young man picked up his still-smoldering cigarette butt, trekked around the corner, and dropped it into an ashtray."
 GER_focus_event.2.a: "Proper Refuse Disposal: +1 | Illicit Drug Use: -100 | Net gain: -99"
 GER_focus_event.3.t: "You’ve Got Mail"
 GER_focus_event.3.desc: "The rapid, piercing chime of the telephone stirred him from his slumber. His head, cradled by his forearm, surveyed the cluttered mountain of papers, loose folders, and used coffee mugs scattered across his desk. Somewhere, underneath all of the chaos, a laser-etched nameplate bore his name: Gunter Deckert.\n     The boulder-sized monitor beside him cast a pale, blue glow — the only source of light in the modest home office. The curved glass screen still displayed last night’s half-finished email, patient cursor still blinking in wait for the next command.\n     Deckert rubbed his eyes and silenced the wailing telephone. Whoever it was, they could wait. Downing the freezing, hours-old coffee left atop his monitor, the square-jawed security minister sat up straight, reached for the keyboard, and continued typing as if he hadn’t just been drooling on his desk for the last five hours.\n\n...MY FÜHRER, I FULLY UNDERSTAND YOUR FINANCIAL CONCERNS, BUT IT IS MY OPINION THAT MATTERS OF NATIONAL SECURITY SUPERSEDE ALL ELSE—\n\nDeckert hesitated. He thought for a moment, then prodded the backspace key.\n\n— ALL OTHERS. PER MY PREVIOUS EMAILS, I MUST REMIND YOU THAT THE AUSSENKELET POWERED EXOSKELETON IS THE KEY TO AVENGING 1981.\n     THE GLOBALISTS HAVE CONSPIRED TO REDUCE THE GERMAN BIRTH RATE AND INFLATE THAT OF THE RUSSIANS. IT IS A SIMPLE FACT THAT THE REDS WILL HAVE A DECISIVE NUMERICAL ADVANTAGE IN ANY FUTURE CONFLICT. IN ADDITION, RUSSIA’S INDUSTRIAL CAPABILITIES WERE VASTLY UNDERESTIMATED IN 1981, AND GLOBALIST DARK MONEY HAS ONLY FURTHER AUGMENTED THEIR CAPACITY IN RECENT YEARS.\n     IN 1521, HERNAN CORTES AND A SMALL BAND OF SPANISH SOLDIERS, THOUGH OUTNUMBERED AND TRAPPED IN A STRANGE FOREIGN LAND, SUBJUGATED MILLIONS OF DEGENERATE MEXICA THROUGH TECHNOLOGICAL MIGHT ALONE. MY FÜHRER, WE MUST SWALLOW OUR PRIDE AND ACKNOWLEDGE THAT A DECISIVE TECHNOLOGICAL ADVANTAGE IS THE ONLY MEANS THROUGH WHICH THE WEHRMACHT CAN SUCCESSFULLY DEFEAT THE RED ARMY. R&D MUST BE MADE A PRIORITY. THE AUSSENKELET MUST BE MADE A PRIORITY. FAILURE TO DO SO WILL LEAD TO CERTAIN DISASTER."
 GER_focus_event.3.a: "PLEASE RESPOND."
 GER_focus_event.4.t: "Mouths to Feed"
 GER_focus_event.4.desc: "Somewhere nearby, a coffee machine gurgled to life, contributing a tangy note to the miasma of overzealously-sprayed air freshener hanging in the air. Hitler and Speer watched diligently over the modest waiting room, framed gazes gleaming beneath polished glass.\n     “ — But get this! The cashier said I wasn’t eligible for benefits.” Emilia Weber stood at the front of a lengthy queue — one of many in Munich’s Department of Citizen Affairs. “I ended up having to put over half of my cart back. Goodness, just thinking about it makes me want to never show my face in public again.”\n     “Mhm.” The man behind the counter, not even trying to feign interest, pecked at his keyboard. “Well, ma’am, the Drexler Score system is still new. It’s probably just a glitch.” He said, holding out his hand. “But let’s run your card to be sure.”\n     Emilia nodded. She dug around in her purse for a moment before handing the man a plastic card done up in patriotic imagery; Emilia had opted into the “Valkyrie” style.\n     “Let’s see...” The man swiped the card through the reader with practiced precision. After a moment of processing, a light on the terminal flashed red, accompanied by a high-pitched beep. “Ah. There’s your problem.”\n     Emilia swallowed. “...Problem?”\n     “Per the new system, you need a Drexler Score of at least 1200 to qualify for food assistance benefits. Yours is only 832.”\n     “What...?!” Emilia choked her purse strap, “No, no, no. Sir, I have four children! How am I supposed to—”\n     “Does the name Walter Weber mean anything to you?”\n     Emilia perked up. “Y-Yes sir. That’s my little boy.” She muttered, head tilted aside. “What does he have to do with any of this?”\n     “He’s flagged here as non-viable. If you’re looking to improve your score, I’d recommend taking advantage of the voluntary Racial Hygiene Incentive. Up to you, though.”\n     “I—” Emilia’s mouth opened, but no words came forth. “— I beg your pardon...?”\n     “Sunset Terminal Treatment Clinic is just a few blocks from here.” The man handed Emilia a pamphlet. “I understand that’s not what you wanted to hear, but maintaining a high Drexler Score means doing what’s best for your family, your nation, and your race”.\n     “You can’t be serious...” Emilia trembled, voice cracking. “Isn’t there another—”\n     “You’ve been helped.” The man palmed the bell on his desk. “Next!”"
 GER_focus_event.4.a: "If you want to make an omelet, you’ve got to break a few eggs"
 GER_focus_event.5.t: "The Natural Order of Things (1/2)"
 GER_focus_event.5.desc: "Filtered through a pair of cheap speakers, the middle-aged anchor’s voice joined the cacophony of sounds swirling beneath the Stuttgart Mall’s lofty ceiling. “... Führer Speer signed the Insulin Access Act into law yesterday afternoon. The new legislation makes insulin free for all citizens living below the poverty line. To fund the project without a tax hike, the price of insulin for non-eligible citizens and undesirables will see a 45% increase.”\n     A second news anchor, seated beside, chimed in with a laugh. “That’s a relief. I don’t want my tax bill getting any higher.” He remarked, straightening the stack of papers in his hands. “In other news, environmental groups around the globe continue to raise concerns about the hole in the Ozone Layer. On Tuesday, U.S. President Al Gore re-affirmed his administration’s dedication to protect the environment...”\n     “Gore?” Clad in a three-piece suit and a cocksure smile, a well-groomed businessman drummed his fingers on the shoeshine stand’s padded armrest. “Who cares what that fool has to say? We just made insulin free, while his joke of a country can’t even set up a functional healthcare system.” The businessman’s loafer — freshly shined — prodded the worker kneeling at his feet. “You get what I’m saying?”\n     “Yes, sir.” Gustav Walkowicz carefully massaged the toe cap of his customer’s shoe with a soft cloth. He took a breath to stall his racing thoughts — but the sight of his young daughter Franziska playing nearby furnished his stomach with nauseous dread.\n     He was already skipping meals — how the hell was he going to afford the kid’s insulin now? As a Polish national, he’d never qualify for citizenship in a thousand years — nor would his daughter, despite being born in Stuttgart. Would he have to take up a third job? Finding a decent-paying gig as an undesirable was already next to impossible—\n     Gustav halted his monologue with a hard sigh. He’d figure it out. He always did. For now, he  just needed to focus on the task at hand.\n     “We truly do live in the greatest country in the world, don’t we?” the businessman quipped, capping off the long, zealous sermon that his one-man captive audience hadn’t bothered listening to. “Don’t you agree?”\n     Gustav forced a smile."
 GER_focus_event.5.a: "“Who would want to live anywhere else?”"
 GER_focus_event.6.t: "The Natural Order of Things (2/2)"
 GER_focus_event.6.desc: "The rag glided across the sleek dress shoe one final time. Gustav met his customer’s eyes, stuffing the stained cloth back into his well-worn apron. “There you go, sir. Good as new.”\n     “Hm.” The seated businessman nodded, inspecting his lustrous loafers from his plush throne. “Yes, yes. You’ve done a decent job. Thank you.”\n     Gustav handed his customer a freshly-printed bill. “Your total comes to 13 Deutschmarks—”\n     “Ojciec! Spójrz na to! Znalazłem skarb!” Little Franziska yipped, holding her “treasure” — a discarded bottle cap that gleamed with a faux-gold finish — above her head. Eyes sparkling with excitement, the seven-year-old dashed toward her father so quickly that she failed to see the customer standing directly in her path.\n     “What the—” Thinking quickly, the businessman stuck out his arms for balance. “Control your daughter! I nearly scuffed my shoes!”\n     “So sorry, sir!” Gustav flinched as his daughter retreated behind him, clutching his leg like a teddy bear. “Franziska.” Gustav wiggled his constrained limb, “You know better. Apologize.”\n     After a moment of hesitation, the child coyly emerged from behind her father. Hands shoved deep into her pockets, she spoke softly, eyes locked on her two fidgeting feet. “P-P-Przepraszam...”\n     The businessman’s face suddenly contorted. He glared at a wincing Gustav, who glanced at his daughter in turn.\n     “No, no! In German!”\n     “Oh. Um...” Franziska swallowed, face flushed. Somehow, the sickly little girl found a way to make herself even smaller. “I am, um, very big apologize, sir...”\n     “Hmph! She can’t even speak proper German?!” The businessman hissed, shoving his wallet back into his pocket. “I knew you were a fucking foreigner the moment I laid eyes on you. If you’re too lazy to speak the language, why don’t you go back to your own country? Oh, that’s right — we have to bomb the East into the stone age every few decades when you people get too uppity.”\n     The businessman stormed off; Gustav chased after, waving the unpaid bill in the air. “Sir! Where are you going? You still need to—”\n     “You want me to pay you?” The businessman spun on a dime and prodded Gustav’s chest. “How’s this — I won’t report you to the police for teaching your spawn to babble like a fucking caveman. There’s your payment.”"
 GER_focus_event.6.a: "Wisely, Gustav nodded without a word."
 GER_focus_event.7.t: "Ahead of the Curve"
 GER_focus_event.7.desc: "Merely stepping into the shadow of the Volkshalle sent an arctic chill down the Führer’s spine. The grandiose facade of his father’s magnum opus only served as a stark reminder of the impossibly large shoes he had to fill.\n     Speer squared his shoulders, holding his head high as he stepped through the Capitol’s grandiose double-doors. “Indeed, we must put our petty differences aside and stand united—” He muttered softly, reciting a self-penned speech to a pair of worn-out dress shoes. “— lest our empire crumble before the insidious—”\n     He glanced up at a peculiar sound: muffled voices emanating from behind the door at the end of the corridor. A shot of adrenaline coursed through his veins — the same feeling he’d felt as a boy whenever he’d been late for class.\n     Squinting, Speer brought his watch up to his face. Right on time — thank goodness. Mere moments later, however, that fleeting moment of relief was smashed under the weight of the boulder plummeting into his stomach. If he wasn’t late, then that could only mean...\n     Clutching his briefcase with five white knuckles, Speer stomped towards the council chamber, mind boiling with a viscous stew of curses and condemnations. Would that son of a bitch Mußgnug stop at nothing to undermine his authority at every turn?!\n\nThe moment Speer stepped through the door, the muffled cacophony crescendoed, pummeling his ears with bullets of sound. The shameful scene was something one might expect from a pack of wolves fighting over a fresh kill — fingers stabbed, fists pounded, and globs of spittle, trailing behind bitter slurs, sailed through the air.\n     Speer didn’t so much as flinch. Just another day in the Reichstag.\n     “Order!” A hefty gavel pounded thrice, cutting cleanly through the uproar. “I will have order!” Slowly, the chaotic amalgam of angry howls and throaty barks faded into silence — and, in the aging Führer’s case, an ear-splitting case of tinnitus.\n     “Mr. President!” Speer narrowed his eyes, marching down the central aisle. “You’ve started without me? What’s the meaning of this?!”\n     A smug smile crept onto Mußgnug’s face. “My Führer. So good to see you.” he leaned forward from the chamber’s central podium, not bothering with the standard Roman salute. “Apologies. Today’s address must have slipped my mind.”"
 GER_focus_event.7.a: "The Master of Europe had never felt so small."
 GER_focus_event.8.t: "Please Silence Your Cell Phones"
 GER_focus_event.8.desc: "Speer’s eyes grew heavy as he listened to the man leaning on the podium — Joseph Fischer, the Reich’s chief diplomat. Backdropped by a set of alternating German and Norwegian flags, the man’s verbal parade of platitudes was a pied piper’s song, luring the elderly Führer toward the precious sleep he’d missed over the last two nights.\n     “...Ergo! Thusly, this cutting-edge infrastructure is only the first step, among many, in the fruitful, long-lasting relationship of mutual cooperation between our two nations.” Fischer took a bow, “I thank you.”\n     A round of mild applause painted a proud smile on Fischer's face. Straightening his tie, the long-faced minister practically skipped back toward his seat.\n     It took every ounce of willpower Speer had not to roll his eyes. That arrogant weasel could piss his name into the snow and call it a literary masterpiece. Knees popping, Speer approached the podium, where a fresh copy of his speech had already been laid out by a certain cabinet member. Speer sighed — at least Fischer was useful.\n\n“Distinguished guests...” Speer began. The awkward old man tried to punctuate his introduction with a heartwarming smile — yet the shuddersome smirk that actually found its way onto his face was less-than-charismatic. “We are gathered here on this momentous day to celebrate the inauguration of the Spirit of Europe bridge. This landmark achievement stands as a symbol of the Norwegian people’s unbreakable Aryan spirit. Thousands of years ago, our ancestors—”\n     The Führer’s flow sputtered at the sound of a voice behind him — A low, neanderthal-like growl that could only belong to one man. The sensitive microphone on Speer’s podium broadcasted the words — mumbled and weak, but still clearly audible — to the entire audience.\n     “Yes, I can talk.” Mußgnug stood up from his seat, muttering into a bulky mobile phone. “No, no. You’re not interrupting anything important. Yes. Mhm. Of course. I can be in Munich by then. Okay. See you. Goodbye.” \n     A lightning storm of flashing cameras erupted not one second later, immortalizing Mussnung’s faux pas — and Speer’s wincing face — for all the world to see."
 GER_focus_event.8.a: "“Dammit! The press will have a field day with this!”"
 GER_focus_event.9.t: "A Picture’s Worth a Thousand Words"
 GER_focus_event.9.desc: "A wild look in his eyes, Speer scoured the pages of the “Germania Times”, one of the Reich’s least-reputable newspapers. After flipping past a full-page advertisement for Pervitin — the “magic” pill meant to help poor Aryan housewives get through the day — he found what he was looking for. His lip shuddered at the sight.\n     “Unbelievable!” Fischer jolted like a startled cat as Speer slammed the paper onto the floor. Gazing at his pale-faced, gnarled reflection in the private jet’s window, the Führer wiped his wrinkled brow in a futile attempt to keep his unkempt hair looking half-presentable. “I bet that sniveling, rat-faced bastard called in his cronies to have the story leaked. Fuck me!” he slammed his fist into the armrest, “I ought to expel that piece of shit from the party!”\n     Fischer dared to pry open his eyes only after a few seconds of the world’s loudest silence had limped by. His gaze fell upon the discarded periodical at his feet — printed upon it, the grayscale photograph of his beloved Führer caught in pure bewilderment as Mußgnug, looking as smug as ever, chatted away on his mobile. A terrible shudder crawled up Fischer’s spine. He had failed — no matter how many bribes or threats he made, Mußgnug's inner circle was always one step ahead, culminating in that damned picture being plastered over every skeevy tabloid in Germany.\n     Rubbing his sweaty palms upon a pair of perfectly-ironed pants, Fischer opened his mouth, yet a silent stutter was all that managed to stumble out. Damn it — now was not the time to get tongue tied!\n     The smooth-talking diplomat crossed his legs and leaned into his armchair, meeting Speer’s sullen eyes. “Fret not, my Führer!” He purred with a practiced smile, “The ignorance of the masses concerning the inner nature of the Jew, the lack of instinct and narrow-mindedness of our upper classes — these things make the volk an easy victim for this Jewish campaign of lies. Mußgnug is nothing more than that — the Jew. The enemy. The press tremble before him, and thus...”\n     Speer blinked at his confidant as he babbled like a broken record. Was this bumbling idiot really the face of the Foreign Ministry?\n     He sighed, decisively cutting off his rambling colleague with a wave of his hand."
 GER_focus_event.9.a: "“I know Mein Kampf, you muppet. Shut your mouth for a change and fix me another drink.”"
 GER_focus_event.10.t: "These Malls Have Eyes"
 GER_focus_event.10.desc: "“Geez.” Katharina placed an empty styrofoam cup atop an overflowing garbage bin, taking extra care not to trigger an avalanche of soda cans and plastic straws. “That took forever...”\n    “Twenty minutes standing in line, all for a bland, runny milkshake.” Stefanie sneered, discarding her drink on a nearby shoe shine stand’s unoccupied seat.\n     “Uh, Stef, the trashcan’s right there...”\n     “Mhm.” Stefanie glanced at her reflection in a large display window, one of hundreds in the palatial shopping mall. “Oh! That reminds me.” The eighteen-year-old turned, finished fixing up her bangs. “Did you ever spend your birthday money?”\n     Grinning widely, Katharina stood on her toes, spotting a blinding neon sign inscribed with a Y2K-style logo. Rows upon rows of stylish, affordable clothing sang like a choir of silent sirens, beckoning her inside. “Not yet...”\n\n                                            /// /// ///\n\nStefanie squealed. Yanking a dress off the rack, she raced toward her friend, nearly flattening several other customers on the way. She held up an elegant sundress, branded with the logo of one of this season’s hottest designers. “Kathy! This is totally you!”\n    “Hm. It’s cute, but...” Katharina’s posture sagged. “Bruno Banani? I’ve heard some pretty messed up things about that brand...”\n    Stefanie’s brows came together. “Don’t tell me you’ve been watching more of those American shows...”\n    “So what if I have? You’ve heard of those sweatshops out East, haven’t you? They’re awful. Just awful!” Katharina’s voice swelled with emotion — but hushed to a whisper after a brief moment of realization. “I know I could get in trouble for saying this, but—”\n    “Then don’t. What are you, a fucking k**e?”\n     As if cued by a conductor, the buzzing conversations that filled the store a moment ago all screeched to a halt. A dozen pairs of eyes speared Katharina’s back.\n     “Undesirables are poor. Water is wet.” Stefanie lowered her head, studying her friend like she were an animal at the zoo. “But without us, they’d still be figuring out how to bang two rocks together to make fire. They’re better off.”\n     “I—” Katharina shrank back, pulling her hair in front of her face to hide herself. “— I was just kidding...”\n     Stefanie rolled her eyes. “So are you trying it on, or what?”"
 GER_focus_event.10.a: "Slander Against the Reich, (First offense): -250 | Net gain: -250"
 GER_focus_event.11.t: "Today’s Winning Numbers"
 GER_focus_event.11.desc: "“Caller?”\n     “I’m on air? O-Oh...” The frail voice of an elderly man, distorted by static, was divined into existence by the cheap radio’s loose antenna. “My question is for Dr. Spitzer. Landing a rover is one thing — but do you really believe that 2010 is a realistic timeline for putting a man on Mars?”\n     “I’ll put it this way. 74 kilobytes of memory put us on the Moon. Imagine what we could accomplish with today’s technology!”\n     “When you put it like that, it’s odd that we haven’t put a man on Mars yet.”\n     “Exactly! Now you’re getting it!”\n     The host spoke up. “Thanks so much for your question, caller. And Dr. Spitzer, thank you for sitting down with us today. Up next on BR24, today’s winning EuroJackpot numbers...”\n\n“Please...” Gustav bit his lip, trembling fingers barely able to hold his ticket. He sat on a cardboard box — one of many piled up in the damp, drafty apartment he and his daughter would get to call home for one more day.\n     Gustav’s heart skipped as the radio spoke the first numbers. Zero. Two. One. He needn’t check his ticket — he’d memorized the eight digits of Franziska’s birthday long ago.\n     “Eight.” the radio continued, “One. Nine. Eight.”\n     Time slowed to a crawl. Signs of life sparked within Gustav’s sunken eyes. Was this really happening? ‘Nine’ was all he needed to hear, and in an instant, all of his worries would be—\n     “...Three.”\n\nHis ticket fluttered to the floor.\n\n“Papa...?” Fransizka’s weakened voice broke Gustav out of his spiral. Were she a foot taller, she probably would have placed her hand on her father’s shoulder. Instead, she settled for tugging on his baggy t-shirt. “Did we win?”\n     Eyes clenched shut, Gustav shook his head. He couldn’t even bear to look at his daughter — just two weeks of rationing meals and insulin had turned her already-feeble frame frighteningly thin.\n     “Franziska?” Gustav blinked away budding tears. “If you could have anything to eat in the world, what would it be?”"
 GER_focus_event.11.a: "“Is today a special day, Papa?”"
 GER_focus_event.12.t: "The Thousand-Year Nightmare"
 GER_focus_event.12.desc: "The toe of his shoe chafed against the ledge.\n\nGustav’s lifeless eyes beheld the moon’s pale reflection, bent by the rippling void below. A December gale breezed past, biting the tears he hadn’t bothered to wipe away.\n     As a boy, he’d heard his mother’s story more times than he could count. The loathsome conqueror, he was told,  had died only a year after he was born. Seizing upon a shred of hope amidst the chaos, his mother had rallied with the people of Warsaw, yearning to cast off the Jackboot and breathe free once more. Like most of her compatriots, she didn’t live to tell the tale.\n     The uprising had taken his mother. Sickness had taken his wife. Father died a slave. His precious Franziska was all he had left — and despite it all, she was enough. Even in the darkest of times, her sunny laughter and toothy smiles broke through the fog of despair. Gustav fought to stay alive for her sake, clutching onto the hope that someday, somehow, his little girl would find a way to escape the Thousand-Year Nightmare.\n\nThis morning, she was laid to rest beside her mother.\n\nGustav’s world was empty; his soul hollow. Nothing remained — nothing to hope for, nothing to cry for, nothing left to take. The detestable machine that fueled the chosen people’s prosperity had used him for all he was worth. Had his ancestors planted their roots only nine miles further west, perhaps he’d be thriving with them.\n     Inching a trembling foot closer to the edge, Gustav filled his chest with the cool evening breeze. Franziska had always liked the cold, but he himself could never stand it. Only now did he learn to appreciate the frigid air’s light, purifying scent. He’d have to tell her once he reached the other side.\n\nThe thought brightened his face as he fell into the arms of the Lord."
 GER_focus_event.12.a: "Trespassing: -100 | Misuse of Public Infrastructure: -50 | Net Gain: -150"
 GER_focus_event.13.t: "SP-11’s Mysteries"
 GER_focus_event.13.desc: "White-tailed seabirds from every corner Madagascar tittered and squawked, greeting Hans as he approached the Reich’s premier rocket launch site — the Wolfee Complex of Aerospace Operations.\n     Hans’ gaze grew distant as he regarded the platoon of birds tottering about the sparsely-populated parking lot. The buzzing ecosystem of reporters and TV cameras that usually covered even the most routine launch was strangely absent. Was there some kind of strike going on?\n     Shrugging, Hans held his ID up to the card reader. A blinking green light disarmed the building’s security system.\n\n                                             /// /// ///\n\nCracking open a can of his favorite energy drink, Hans got to work checking on SP-11’s fuel levels, fuel tank pressurization, and engine conditions. By all means, the rocket was in shape for a successful mission. Now, only one step remained: checking the status of the payload to be delivered to the Pioneer lunar base.\n     Hans typed in his password, and a small text box popped up on the CRT’s curved glass screen. Access denied. Setting down his drink, Hans rolled his eyes. He entered the string of letters and numbers again, taking a bit more care to ensure everything was on the mark.\n     Access denied. What the hell?!\n\n“H-Hans?!” A door clicked open. In walked Sigmund, the head operator of the launch center. A scrawny twenty-something stumbled awkwardly behind the man. “I gave everyone the day off! What are you doing here?”\n     “Bored.” Hans spun back toward his computer. “Hey, did one of you change my password? I’m trying to check on the payload, but—”\n     “Let me stop you there. This is Volodimyr. A new hire.” Sigmund interrupted, gesturing at the stiff young man beside him. “We’re still training him, so he’ll handle the launch today.”\n     “...All by himself?”\n     “Er—” Sigmund wrung his hands. “Th-That’s right. So I really must insist that you enjoy your day off! It’s just a routine launch, after all. The kid can handle it.”\n     “Uh-huh...” Hans leered at the foreigner waiting to sit down at his desk. The tightness in his chest told him something wasn’t quite right, but who was he to talk back to his boss? Standing, Hans narrowed his eyes, reaching for the jacket draped across his chair. “See you tomorrow, sir.”"
 GER_focus_event.13.a: "“...What the fuck was in that rocket?”"
 GER_focus_event.14.t: "europ.de/unterlagen/1996/F5G36SG093.pdf"
 GER_focus_event.14.desc: "KOALITION DER NATIONEN\nGENERAL ASSEMBLY | 17TH SESSION (MCMXCVI)\n1ST PLENARY MEETING | OFFICIAL TRANSCRIPT, PAGE 47 OF 65\n\nCO-CHAIR: B. AHERN . . . . . . . (PRIME MINISTER, R. OF IRELAND)\nCO-CHAIR: H. JINTAO . . . . . . . (PRESIDENT, R. OF CHINA)\n— — — — — — — — — — — — — — — — — — — — — — — — —\nMR. AHERN, CO-CHAIR: The Assembly recognizes His Excellency Mr. Joseph Fischer, Foreign Minister of the Greater German Reich.\n\nMR. FISCHER (SPOKE IN GERMAN): Today, the Fatherland reaffirms its commitment to shielding the Finnish volk against the cancer of international Communism. The people of Eastern Europe, lest we forget, toiled under the brutality of the criminal Soviet Empire For decades, enduring mass starvations, executions, and other unimaginable human rights abuses too graphic to repeat in this chamber. One pales to imagine what other sick acts of depravity would have befallen these peaceful people had they not been liberated by German arms.\n     Thankfully, the Republic of Finland was spared such a fate, having valiantly defended itself against Soviet incursion on multiple occasions throughout the 20th century. In recent years, however, the Finnish people have been inundated with a deluge of near-daily riots perpetrated by radical trade and labor unions — a transparent attempt by the modern Soviet state to install a friendly government via a popular Communist uprising. Despite this body’s repeated condemnations, the USSR’s underhanded efforts to stoke civil war have continued unabated. The prospect of a protracted, pro-Soviet insurgency tearing the Finnish Republic apart is no longer a matter of if, but when.\n     Once again, we call upon the General Assembly to join the Greater German Reich in delivering financial and material aid to the Republic of Finland, in hopes that the USSR’S impending coup can be swiftly and sufficiently crushed. History has laid bare the procession of horrors that inevitably transpire anywhere the Red flag flies — it is imperative that every action be taken to oppose the spread of this toxic, ruinous ideology."
 GER_focus_event.14.a: "MR. JINTAO, CO-CHAIR: Thank you, Mr. Fischer. The Assembly now recognizes His Excellency Mr. Albert Gore, President of the United States of America"
 GER_focus_event.15.t: "Another One Wipes the Dust"
 GER_focus_event.15.desc: "Kerstin sighed, placing the freshly-emptied laundry bin atop the buzzing washing machine. She leaned lifelessly over the vacant basket, wincing at the feeling of another dozen knives prodding her spine. Those painkillers sure were taking their time — but at least the laundry was finally finished.\n     She closed her eyes, breathing in the fleeting euphoria of a job well done before, like always, that feeling crumbled to dust.  Paltry tears, glittering like watery crystals in the dimming evening light, welled in the corners of her eyes as a neverending to-do list churned away within her scattered mind.\n     A mountain of work loomed overhead, but try as she might, Kerstin’s aching shoulders simply refused to budge. What was wrong with her? Why couldn’t she just be a good wife, happily serving her household like Andrea or Claudia? She had a duty to uphold the Aryan family, regardless of those pesky emotions rattling around in her head.\n     She shouldn’t resent her husband; Lukas was a good man, even if he lost his temper sometimes. Fear gripped her heart at the thought of him leaving — of being alone, of never remarrying. What bachelor in his right mind would take a once-divorced, 37-year-old bride?\n     She shouldn’t hate the twins; Even if they made everything ten times harder, the emptiness she felt whenever she held them wasn’t their fault.\n     Her heart stuttered as the hands of her watch — a wedding gift from her father-in-law — ticked ever-closer to sundown. A purple bruise sat just beneath the frayed band, reminding her of what waited for her if dinner wasn’t ready on time.\n     Wiping the corners of her eyes, Kerstin took a half-finished roll of Pervitin from the pocket of her dirtied apron. She closed her eyes, emptying her chest with a long, tranquil sigh as the magic pill dissolved upon her tongue. The pain, the uncertainty — it all disappeared within minutes.\n\nAll better.\n     Kerstin’s finger rapped on her temple as she pondered her next task. Now that the laundry was finished, the kitchen would need to be sweeped. Whistling her favorite tune, she grabbed the broom — if she hurried, she just might get a head start on dinner."
 GER_focus_event.15.a: "So much to do, yet so little time…"
 GER_focus_event.16.t: "Business In the Front, Business In The Back"
 GER_focus_event.16.desc: " “Again, I sincerely apologize for the delay...” Gerhard Frey — Führer Speer’s hand-picked Minister of Finance — addressed the packed council chamber through clenched teeth. It had taken ten minutes to figure out how to get that newfangled “PowerPoint” program to function properly, and another ten to shoo away that goddamn talking paperclip. “Seeing as we’re considerably behind schedule, we’ll skip the formalities. Herr Baur...?”\n     Manfred Bauer adjusted the angle of his mic. “After three years of tireless work, there remains only a single hurdle to clear before the formal launch of the Euromark. Today’s objective is to determine precise rates of exchange through which Europakt member states will convert their existing legal tender to the new currency. Stefan, if you would...?”\n     An acne-riddled intern, crooked tie dangling awkwardly from his neck, clicked the computer mouse cradled in his hand. A hundred eyebrows flinched in shock as the projected slide transformed into a rotating, three-dimensional cube. The next slide, appearing on the adjacent face, filled the screen a moment later. \n     “Amazing what they can do nowadays.” A red laser pointer emphasized Herr Baur’s next words. “The following chart displays the average—”\n\n“The Slovaks know what money is?” Somewhere in the chamber, a hot mic broadcasted an unknown attendee’s snide remark. “I’m amazed they ever advanced past the barter system.”\n     A laugh. “No, no. I heard they were actually the first to invent currency.”\n     “Really?”\n     “Yeah, they used lumps of cow shit. Still do in the more remote areas. That’s where the smell comes from.”\n\nA scowling Frey loudly cleared his throat. “I’m sorry — This is the Europakt Central Bank, not a beer hall. If you’re incapable of taking today’s proceedings seriously, you’re free to leave. Encouraged, actually.”\n     Frey coughed. An excruciatingly-stiff silence, broken only by the shrill feedback coming from his mic, choked all traces of life from the room.\n     “Now, then.” Frey donned his reading glasses, scrutinizing the papers arranged neatly on his desk. “Herr Baur, please continue.”"
 GER_focus_event.16.a: "Someone got up on the wrong side of the bed."
 GER_focus_event.17.t: "Money Talks"
 GER_focus_event.17.desc: "“Sir?” A youthful staffer stepped into an ostentatiously-furnished office, struggling to keep an overstuffed binder snug beneath his arm. “I know you didn’t want anyone interrupting your work, but—”\n     Gerhard Frey’s fingers tap-danced across an unstylish ergonomic keyboard, a half-written email reflected in his specs. “The Reichslander Index. Is that why you’re here?” A pair of baggy eyes glanced up from the monitor, granting Frey’s staffer the miserly dignity of a half-second’s worth of eye contact. “Make it quick.”\n\n“Sir!” The young man snapped to attention, flipping urgently through a ring-bound tome of pie charts and line graphs. “Throughout 1995, our efforts to counter discontent across the East continued paying dividends. New Orthodox outreach programs have established strong roots in native communities, infrastructure investments are paying for themselves, and marginal wage increases have created profitable, stable economies with total economic dependence on Germania.“\n     A nodding Frey double-clicked his computer mouse. “Give the natives something to lose, and they’ll think twice about biting the hand that feeds them.”\n     “Precisely.” His staffer flipped to a new page. “Across the East, the textile industry continues to reap greater profits thanks to the successful rollback of several 70s-era child labor and safety regulations. Consumers are reaping rewards, too — in Germany proper, designer brands such as Bruno Banani are retailing at a fraction of what they cost only five years ago.”\n\n“Good on them for recovering so quickly.” Frey remarked, “Had that disaster pulled their stock price any lower, a huge segment of the economy would’ve gone down with them.”\n     The staffer blinked. “Disaster?”\n     “The Luhansk factory fire. Don’t you read the memos?” Frey folded his arms across his chest. “500 million marks worth of labor assets went up in flames — all because some harebrained worker couldn’t be bothered to walk five meters to an ashtray.”\n     “Ah — Of course! I remember.” Frey’s staffer offered an awkward smile. “Such a shame. Did they ever come out with an official count of the dead?”"
 GER_focus_event.17.a: "“500 million in labor assets. Weren’t you listening, boy?”"
 GER_focus_event.18.t: "Enriching the Youth"
 GER_focus_event.18.desc: " “...It’s not a child! It’s a four-day-old embryo!”\n     “Life begins at conception, and every good Catholic watching would agree.” A well-groomed fellow in a button-up shirt looked directly into the news studio camera. Below, a banner reading ‘BREACHING THE UNKNOWN: THE ETHICS OF STEM CELL RESEARCH’ spanned the bottom of the screen. “Terminating any human life is murder. Period.”\n     A middle-aged man, seated across the newsroom’s modern table, crossed his arms with a sigh. “But not every human life is necessarily equal! We know there are vast biological and mental differences between the races. For heaven’s sake, the Poles were all slaves less than thirty years ago. Why not sacrifice a few of their embryos for the sake of the greater good?”\n     “All are equal in the eyes of God.”\n     “Again with the bible-thumping! The millennium is just around the corner, and yet there are still people like you clinging to medieval superstitions. Your mind is clouded by religion!”\n     “And your heart is poisoned by hatred. I’ll pray for you.”\n     A series of sharp ‘bleeps’ punctuated the opening of the older man’s finger-jabbing rebuttal. “Race traitor! You’re the one who ought to be praying! You and the rest of your little cult would be shot dead in the streets if a real man like Mußgnug was in charge!”\n\n                                             /// /// ///\n\n“Papa...?” Katharina sighed. Staring at the television with a glazed look in her eyes, she leaned into the sofa’s plush armrest, head propped up by her fist. “This is boring. Can I go back to my room now?”\n     Konrad lowered the volume by a few ticks. “Why, so you can keep rotting your brain with more of your anti-German claptrap? Watching that garbage is what landed you in hot water in the first place.”\n     “What? How is Dawson’s Creek anti-German?”\n     “It just…is! Look, I love you, but you’re an adult now. You need to be spending your time doing something that contributes to the nation—”\n     “Oh, please. Don’t start with that! I have plenty of time to get married!” Katharina leapt to her feet, fists balled tight. “Have you ever considered that maybe I don’t want to waste the best years of my life raising some guy’s snotty kids? It’s not fair! Just because I’m a girl, why should I be forced to—”\n     A swift slap silenced her impassioned speech."
 GER_focus_event.18.a: "“That’s enough — You know they’re listening!”"
 GER_focus_event.19.t: "In Vino Veritas"
 GER_focus_event.19.desc: "Beneath the vaulted ceiling of the NSDAP headquarters, the clinking of glass and cutlery harmonized with a live rendition of “Eine kleine Nachtmusik”. The booze flowed freely, and with it, a symphony of boisterous laughter filled the sumptuous ballroom.\n\n“...I’m just having second thoughts, is all. I recently had a chance to take a closer look at the ‘95 Reichslander index, and, well, the numbers just don’t add up. Especially in the colonies—”\n     “Can it, four-eyes.” Downing the last of his kirschwasser cocktail, a jolly Mußgnug socked Frey on the arm. “I’m sure everything’s fine. It’s a party — have some fun for once in your life!”\n     “He’s right. We’re here to celebrate a momentous victory for the nation. You’re killing the mood.” Fischer cut precisely into a tenderloin steak. “Honestly, Frey, do you ever even stop working to pleasure the missus? Or is that the reason why you can’t keep a marriage together to save your life?”\n     A bitter smile hardened Frey’s features. “Charming. Remind me, how many years did you spend behind bars for being an ANTIFA k**e?”\n     “Enough!” Speer groaned. “We’re here to celebrate the eve of the Euromark launch. Could we please put a stop to the petty infighting for one evening?”\n     “That’s right. Better fall in line, fellas.” Mußgnug leaned back in his chair, gesturing for a waiter to refill his glass. “You wouldn’t like ol’ Allie when he’s angry.”\n     “Martin!” Speer hissed — so much for making peace. “I told you to stop fucking calling me that!” Mußgnug’s freshly-filled glass concealed a self-absorbed smile. “Sincerest apologies, my Führer.”\n\nCackling like a schoolboy, Deckert limply prodded Speer on the shoulder, slurring his words so severely that they barely even sounded like German. “God damn! Get a load of that smokin’ piece of ass...”\n     “Herr Deckert.” Speer squinted over his shoulder, then at the object clutched in Deckert’s other hand — a completely-drained bottle of brut champagne. “I believe you’ve had quite enough—”\n     “Aw, lighten up! Blue dress! Giant rack! Can’t miss ‘er!”\n     “Yes, I’m quite familiar.” Speer straightened his posture, leering at his Defense Minister with murder in his eyes."
 GER_focus_event.19.a: "“That would be my daughter.”"
 GER_focus_event.20.t: "Yes, Dear"
 GER_focus_event.20.desc: "“Idiot!” Ducking into his bulletproof limousine, Speer winced; the sound of his own ragged voice speared through his pounding skull. “Is that slimy fuck really the best the Wehrmacht has to offer?!”\n     “Allie, calm down!” Ingmar Speer sat beside her husband, embracing his hand in hers. “You know how Deckert gets. He didn’t know.”\n     “Listen to yourself! This is our daughter we’re talking about!”\n     “Yes, dear. But let’s not lose our heads. Deckert was just doing what men do. It’s natural!”\n     “Lots of things are, but most have the decency to keep those activities to themselves.” Speer slashed his seatbelt across his chest. “I’d fire the shithead, but why bother? I’d just wind up with Deckert Mark II filling the empty chair!”\n\nWhat happened? How and when did the NSDAP become infested with these incompetent, immature wastrels? Things hadn’t always been this bad. Not by a longshot. Had he really let his Father’s masterpiece degrade to this point?\n     Under his own leadership, the mighty Wehrmacht that beheaded France in six weeks had mutated into a money-gobbling dragon that couldn’t even fend off a savage horde of Slavic barbarians. After the East was lost, a decade of stagnation and political deadlock preceded the economic catastrophe that consumed Germany in the wake of the Europakt’s formation.\n\nAnd the Euromark launch — oh, God. This had to go smoothly. Another abysmal catastrophe would be like slipping concrete shoes onto the feet of his already-drowning regime.\n     Through the limousine window stood his father, regarding him sternly from the Germania skyline. Speer’s stance hardened beneath the weight of it all. What was he thinking? His was a nation of Aryan warriors — an unspoiled island in a sea of western degeneracy. Father’s legacy would withstand the test of time, and his own legacy would prove that. No, the Party wasn’t perfect, but neither were the deities of his volk’s noble Germanic ancestors. Flaws abound, both were as gods, shaping the earth to their whim like soft clay.\n     Silencing himself with an affirmative nod, Speer squeezed Ingmar’s hand. “Perhaps I’m overreacting...”"
 GER_focus_event.20.a: "“Now fasten your seatbelt, or we’ll never get home.”"
 GER_focus_event.21.t: "My Fellow Aryans (1/2)"
 GER_focus_event.21.desc: "A half-dressed, half-shaven Albert Speer ripped the phone out of its wall-mounted cradle. “Precisely what part of ‘stop calling me’ isn’t making its way through your thick skull?!” he fumed, wiping away the goatee of foaming toothpaste dribbling from his chin. “Your pestering won’t get me out the door any faster!”\n     An aria of compressed background noise — shuffling papers, frantic footsteps, and dozens of phones ringing off the hook — filled in the stunned silence from the other line. “...I beg your pardon?”\n     “Herr Frey! Apologies, I thought you were...” Threading his belt, Speer cradled the handset between his neck and his shoulder. “...Nevermind. Look, if this is about the missile accident, I’ve been briefed. Extensively.”\n     “...Missile? No, no.” Frey’s typical dry, groveling cadence was seeded by urgency. “My Führer, the Euromark—”\n     “Let me guess, our GDP growth shrank by a tenth of a percentage point again? I’m sorry, but national security takes priority. I don’t have time for your paranoid catastrophizing. Not today.”\n     “What?! No! Listen to me, you need to—”\n     “I’m running late.” Speer slammed the handset back into its mount and grasped for his coat."
 GER_focus_event.21.a: "So much to do, so little time."
 GER_focus_event.22.t: "My Fellow Aryans (2/2)"
 GER_focus_event.22.desc: "From the Maas, to the Memel, from the Etsch, to the Belt, millions of panicked families watched the bleak address with baited breath. A menagerie of cameras filled every spare corner of the Volkshalle, mechanical eyes trained on the burly, balding man standing behind the gilded sanctum’s central podium.\n     “...and, despite repeated cries from myself and my colleagues to halt this ill-fated Euromark experiment....”  Martin Mußgnug emphasized his words with a pregnant pause, “...we were flatly ignored. Make no mistake, my dear friends, our very way of life is barrelling toward total destruction. The Marxists, the Jews, the Liberal World Order — they are circling us like vultures, waiting to feast on the desiccated corpse of our dying empire.”\n     Heads turned. Eyes widened. All throughout the assembled crowd, simmering murmurs boiled over into bewildered jeers as a cyclone of discontent tore through the chamber.\n     Slow and steady, Mußgnug exhaled, gripping the sides of the podium. The corners of his mouth curled into a near-imperceptible smile as the crowd’s rage spread beneath the rotunda like a virus. Even Speer’s pathetic clique of loyalists, as few as they were, couldn’t help but embrace the unfolding chaos.\n     “Certain members of this government will attempt to explain away this debt crisis with a neverending barrage of half-truths and excuses. But, to the people of Germany, I make this solemn vow.” Mussgnung jabbed his finger forward, “I will be heading a full-scale investigation into the source of this financial catastrophe. Whether these conspirators have come from within or without, I will not rest until the rope of justice denies their final, gasping breaths.”\n     Had the Volkshalle not been designed with acoustics in mind, the thunderous cries of support that flooded the chamber may have deafened the entire NSDAP. Chants and slogans bellowed above an ocean of clenched fists, and —\n\nA sudden silence choked the room, cued by the distinct squeaking of the doors leading into the Volkshalle’s central chamber. Hundreds of eyes swiveled toward the central corridor in which Albert Speer stood."
 GER_focus_event.22.a: "This...isn’t about the missile, is it?"
 GER_focus_event.23.t: "Between a Hammer and Sickle"
 GER_focus_event.23.desc: "A brimming glass of retsina quaked in the Führer’s jittering hand. His thousand-yard stare could have bored holes into the map of the Reich’s eastern frontier — and the vast territory of western Russia beyond it — sprawled out before him.\n     “So.” Speer spoke through gritted teeth. “...What are our options?”\n     “Very few.” A childlike smile cracked Deckert’s stony facade. “Newborns from the day we lost Moscowien are barely old enough to drive now. The Reds haven’t lost any confidence — I don’t foresee them backing down without some kind of concession.”\n     “...Then why are you smiling?”\n     “This is an opportunity, Al.” Deckert drew a long breath through his nose, regarding the two-dimensional battlefield beneath him as squares on a chessboard. “A chance to take back what’s ours.”\n     “You’re joking.” Speer’s slumped posture abruptly straightened. “We’re broke, you mouth-breathing cretin — or have you been too busy ogling your secretaries’ breasts to do your job properly?”\n     Deckert’s fist pounded the table. “How many times do I need to apologize before you’ll put that stupid incident to rest?! I’ve supported your ancient ass since the beginning. And this is how you speak to me?! Need I remind you of the position you’re in—”\n     “If you don’t like it, you’re free to resign.” Speer said coldly. “Representing the Reich is part of your job. Do it properly, or get lost.”\n\n“...My Führer?” A distant door creaked open. “Am I interrupting something...?”\n     Speer and Deckert twisted toward the door — each the others’ reflection. “Nothing of use, Herr Fischer.” Speer paid no mind to his seething colleague. “Have you reached a tentative agreement?”\n     “Y-Yes, my Führer.” Furrowed brow sparkling with sweat, Joseph Fisher eschewed his usual sharp salute. “The Reds are willing to put this whole issue to rest in exchange for financial compensation, and...”\n     Speer’s features tightened. “...and?”\n     “...an official apology. Televised.”\n     “How interesting!” Deckert abruptly rose to his feet. “Certain members of the Reichstag would love to see that. It’s your call, Al — prepare for a conflict as I’ve advised, or grovel like the impotent weakling Mußgnug says you are. It’s your ass on the line.”"
 GER_focus_event.23.a: "Talk about rocks and hard places."
 GER_focus_event.24.t: "Auf der Mauer, auf der Lauer"
 GER_focus_event.24.desc: "Speer’s eyes bulged at the number. Not even von Tresckow proposed this much for the Wehrmacht back during Father’s day — which is just as well, because back in the ‘70s, the Reich wasn't collapsing under an honest-to-god economic apocalypse.\n     For the tenth time in under a minute, Speer furtively scanned Deckert’s ambitious budget proposal from top to bottom. The logical answer, he knew, was to flatly refuse. Germany was in no shape to fight a war, and besides, why waste all that money on the Wehrmacht when something called diplomacy existed? Speer’s heart recoiled at the thought of shaking hands with the Reds, but his logical half knew that, on some occasions, pragmatism was necessary — and this was certainly one of them.\n     “This is a joke, right?” Speer finally pried his eyes away from the absurdly-expensive budget proposal laid in front of him. “Spending this much during an economic meltdown...”\n     Leaning on Speer’s desk with one arm, Deckert forced out an overacted sigh; he hoped it was enough to conceal the childish glint flashing across his eyes. All according to plan. Speer would be off his rocker to accept such a cartoonishly-large budget, and his stubborn sidelining of the Wehrmacht was just what Mußgnug needed to rally his supporters into even more of a hysteric frenzy. Once Speer was history, the new Führer would owe Deckert more than a few favors, and he’d finally have the leverage he needed to finally secure funding for—\n     “The Aussenkelet?! Give me a break! Do you think we have piles of money just laying around to shovel into these pointless projects?” Speer crumpled the document into a ball and tossed it over his shoulder. He missed the trash bin by several inches. “You know who would have been all over your freak of a brainchild? Hermann fucking Göring. And thank God my Father shot that bloated twat between the eyes before his colossal ass could get anywhere close to the Führership. Maybe I ought to follow his example.”\n     Deckert molded his face into a hard smile, fingers clutched around the tape recorder in his pocket. Mußgnug may have been a brash, knuckle-dragging brute — but anything was better than the ancient stick-in-the-mud currently occupying the Reich Chancellery.\n     This wasn’t about the Aussenkelet anymore. Now, it was personal."
 GER_focus_event.24.a: "“Whatever you say, mein Schatz...”"
 GER_focus_event.25.t: "Leap of Faith"
 GER_focus_event.25.desc: "Speer’s eyes bulged at the number. Not even von Tresckow proposed this much for the Wehrmacht back in the day — which is just as well, because back during his tenure, the Reich wasn't collapsing under an honest-to-god economic apocalypse.\n     Speer scanned the ambitious budget proposal from top to bottom. The logical answer was to flatly refuse — But on second thought, the money wouldn't be wasted. It would be spent on protection, both from the Reds on the outside and from Mußgnug’s haw haw-men on the inside.\n     Slowly, Speer inhaled. He wouldn't let that bastard smear more grime on his name. Not this time. “Hear me out, Herr Deckert. Spending this much during an economic meltdown is an absolute liability...”\n     Deckert forced out a sigh; he hoped it was enough to hide the childish glint flashing across his eyes. All according to plan. Speer would be off his rocker to accept such a cartoonishly-large budget, and his stubborn sidelining of the Wehrmacht was just what Mußgnug needed to rally his supporters into even more of a hysteric frenzy. Once Speer was history, the new Führer would owe Deckert more than a few favors, and he’d finally have the leverage he needed to finally secure funding for—\n     “This Aussenkelet project of yours — and everything else in this god-forsaken budget — had better pay off in spades.” Speer’s pen landed on the signature line. “Listen. I’m just as eager as you to leave the past in the past. If I grant you this money, I expect you to spend every last pfenning well. Every single one.”\n     Frozen like a deer in headlights, Deckert watched as the Führer’s pen glided across the paper. “...Wait. You’re serious?”\n     “Do I look like I’m joking?” Speer grimaced at the sight of his signature next to all those zeroes — but he knew this was the only way. “You are in my debt, Herr Deckert. Literally, materially, metaphorically, figuratively, and in every other possible way.” Speer jabbed the budget with the tip of his pen, defacing the document with three inky freckles. “You. Owe. Me.”\n     Deckert’s face perked up as Speer handed the signed document back to him — it might as well have been written in gold. Fingering the ‘erase’ button on the tape recorder stashed away in his pocket, he pulled out his hand to strike a precise Roman salute."
 GER_focus_event.25.a: "“Heil Speer!”"
 GER_focus_event.26.t: "Beneath the Fortified Skies"
 GER_focus_event.26.desc: "Sweat, exhaust, and cigarette smoke — the construction site’s punchy odor was perhaps the biggest insult to the tranquil forest that had stood in its place for thousands of years before. Steel bars and bagged cement, protected from the elements by plastic tarps, were scattered haphazardly throughout the barren, tread-stamped dirt. Before long, they too would become a part of the half-built fortifications tracing the Soviet frontier as far as the eye could see.\n     “Hmph, can you believe the price tag on all this?” Klaus, the crew’s seasoned foreman, unscrewed a thermos of soup. A plume of steam drifted upward in the crisp Baltic air, fogging up the safety glasses he wore on his grizzled face. He’d been supervising military construction sites for over thirty years now, but even he couldn't help but shake his head at the astronomical costs of the new project.\n     Dieter, a diligent engineer known for his meticulous calculations, couldn’t wait to finish chewing before adding his two cents. “Tell me about it! Isn’t the government supposed to be out of money?”\n     “It’s a Debt Crisis.They have less than no money.” Klaus rolled his eyes. “A lot less.”\n     “So what gives? Are they really that dense, or is someone trying to make things worse for shits and giggles? If they’ve got extra money to burn, they ought to throw us a few extra pfennings instead of funding another pointless wall for the Reds to blast through.”\n     “Don’t get me wrong — I’m with you one-hundred percent. But be real, Deiter. It’s the government. They’re paid to be stupid.”\n     Amidst the groans and grumbles, Fritz, the youngest member of the crew at only eighteen, shrugged his shoulders. He would have preferred to not think about work during his meager thirty-minute lunch, but if his buddies really didn’t have anything else to talk about, he might as well inject a note of optimism into the doom and gloom. “Hey now, at least we've got jobs, right?” he quipped. “Yeah, the pay sucks, but in times like these, we’re blessed to be working at all.”\n     “Yeah, yeah...” The others chuckled in reluctant agreement, matching the hum of the heavy machinery in the distance. Fritz had a point — they all knew at least a handful of folks who had lost their livelihood in the fallout of the disastrous Euromark launch. And besides..."
 GER_focus_event.26.a: "...they weren’t paid to ask questions."
 GER_focus_event.27.t: "Bulls on Parade"
 GER_focus_event.27.desc: "A storm was brewing — not the kind of downpour that darkened the skies or drenched the cobblestone streets, but a turbulent tempest of discontent. At the center stood Engel, a sophomore from the University of Hamburg. Fire in his eyes, he held a yellow boombox high above his gelled hairdo; jolting the park to life with the ravenous wailing of electric guitars.\n     Engel had joined the protesters with unwavering determination, believing that their peaceful assembly — illegal or not — could make the difference between peace and war. Engel's throaty chants blended with the crowd’s as they raised their homemade signs aloft: “DROP SPEER, NOT BOMBS”, “PEACE TAKES BRAINS”, “MY SONS WON’T KILL OR DIE FOR MOSCOWEIN”.\n     Their collective voices, bellowing through the streets, grew hoarser with each rousing chant. Hope surged within young Engel; he truly believed in the one-in-a-million chance that his message would reach the hearts of those in power. Surely, they had a conscience. Surely, the guilt of their misdeeds kept them up at night. Surely.\n     But as Engel appealed for cooler heads to prevail, the inevitable unfolded. A single cry was the first warning. What followed was a panicked aria of curses that tipped off those assembled  to the wall of riot shields descending upon the scene. The officers came armed with batons and tear gas, their faces obscured.\n     A volley of rubber bullets sent the front line tumbling to the ground; a single second of shocked silence passed before the assembly’s cries for peace were trampled beneath black boots and panicked shrieks. The lucky ones were engulfed in stinging clouds of pepper spray. The unlucky were mercilessly beaten. The least fortunate never knew what hit them.\n     By noon, the dust would settle. Engel, and hundreds more like him, would find themselves discarded into windowless vans, wrists rubbed raw by the handcuffs that bound them. Bloodied knees and broken bones would roar in pain, dragged across the splattered pavement by the long arm of the law.\n     Yet Engel's yellow boombox continued to sing, defiant lyrics resonating through the streets. A somber reminder of the price of dissent lingered in the air, a testament to the enduring spirit of those who dared to say no."
 GER_focus_event.27.a: "Weapons, not food, not homes, not shoes, not need..."
 GER_focus_event.28.t: "Fair and Balanced"
 GER_focus_event.28.desc: "“With all due respect, Mr. President, the money to weather this crisis has to come from somewhere.” A small-framed reporter pointed his mic toward his interviewee. “Don’t you think you’re being a little too harsh?”\n     “Let me be clear. Mr. Speer’s decision to slash the RLR budget is nothing short of a complete capitulation to the Americans.” Martin Mußgnug leered severely into the camera — and into the eyes of millions of viewers from all across the country. “I spoke to a young boy earlier today; couldn’t have been older than six or seven. Do you know what he said?” Mußgnug crossed his arms, “His lifelong dream was to walk on Mars. To be the first of his proud volk to witness his flag flying over the red planet. As of today, this innocent boy’s dream is just that: a dream. A childish fantasy, forever out of reach thanks to the Führer’s shortsighted solution.”\n     The reporter pursed his lips. “...A first-grader said all that?”\n     “For nearly half a century, the cosmos have been the exclusive domain of the Aryan. But now? Bah!” Gripping the fabric of his sleeve, Mußgnug continued, entirely ignoring the reporter’s question. “The gates of the final frontier have been cast wide open. It’s just a matter of time before the vermin come scurrying in.\n\n                                             /// /// ///\n\n“Hell yeah!” A crushed can of beer soared across the unkempt living room. Karl’s hooting and hollering only grew more obnoxious once his refuse landed cleanly into the garbage bin. “You tell ‘em!”\n     “Come on, man. You’re smarter than this.” Ludwig’s hand slid down the length of his face. “Mußgnug’s just using this whole debt crisis to stir his supporters into a frenzy. Do you really think that convenient little anecdote actually happened?”\n     “So he bends the truth for dramatic effect. Who cares?! He’s still right!” Karl replied. “First, RLR’s budget got fucked. What’s next? The Wehrmacht? Germany’s the weakest it’s been since 1918. Mark my words, the Reds are sharpening the knife as we speak. And thanks to this whole missile thing, they have a perfect excuse to cross the border...”\n     With a heavy sign, Ludwig set his empty beer on the table."
 GER_focus_event.28.a: "“Alright. I get it. Can we just change the channel, already?”"
 GER_focus_event.29.t: "Just Asking Questions"
 GER_focus_event.29.desc: "“But Mr. President, the funds need to come from somewhere.” Backdropped by the imposing dome of the Volkshalle, a well-dressed reporter tipped his mic toward his interviewee. “Don’t you think—”\n     “No.” Martin Mußgnug crossed his arms. “Mr. Speer’s disastrous decision to slash the state surveillance budget is nothing short of a complete capitulation to the Soviet Union.” \n     Mußgnug stared directly into the news camera; it was a wonder his piercing gaze didn’t crack the millions of CRTs that displayed it from Danzig to the Danube. “This debt crisis would be par for the course in lesser nations — but our stock is supreme, our strength unparalleled. How could our leaders’ response be so blatantly misguided? Our investigation is ongoing, but one possible explanation points to a vast cabal of Judeo-Bolshevik spies operating within the highest levels of our government, sabotaging the state from within to prime us for a Soviet takeover.”\n     The reporter gawked with a furrowed brow. “Really...?”\n     “I’m just asking questions.” Mußgnug gripped the fabric of his sleeve. “But isn’t it interesting that Mr. Speer’s response to this crisis has been to dismantle our ability to root out these Jewish interlopers? The very same ones who may be responsible for our current situation?”\n\n                                             /// /// ///\n\n“Oh, give me a break!” Fingers splayed, Ludwig stabbed his arm toward the television. “He’s just making shit up, now!”\n     “He’s speculating. Chill.” Karl shrugged and cracked open another beer. “Besides, he’s absolutely right. There’s something fishy about all of this. Of all the places to cut funding...”\n     “You’re acting like we’re completely defenseless. We still have the Wehrmacht—”\n     “Yeah, for now!”\n     Ludwig groaned. “You’re impossible!”\n     “Think back to history class, man! We’re surrounded on all sides by our enemies — by Jews, degenerates, and homosexual demons chomping at the bit to conquer our nation and enslave us. We’re surveilled for our own protection. I can only think of one reason why they’d start rolling things back...”\n     Ludwig shook his head. With a heavy sigh, he flung his empty beer into the trash."
 GER_focus_event.29.a: "“Maybe they ought to look into this...”"
 GER_focus_event.30.t: "Inaction and Reaction"
 GER_focus_event.30.desc: "“...thus, in order to relieve budget pressures—” the bespectacled Herr Welker raised his voice, hoping to overpower the torrent of jeers pouring out of every other mouth on the Reichstag floor. “— Listen! The current Kriegsmarine revitalization plan simply must be scaled back!” The man, sitting beside several other Speerites, had trouble getting the final words out as the heckling around him grew more and more obnoxious.\n     Herr Braun, a Mußgnug supporter, chimed in with an uproarious cackle. Standard procedure required him to raise his hand and wait to be recognized, but the baker’s dozen of other voices currently trampling over each other didn’t wait their turn either. “Are you serious? The battle of the North Sea was the only theater in which the Bolsheviks didn’t entirely overrun us in the last war. You intend to let them catch up even further?”\n     “A few subs here and there are nothing to worry about!”\n     “And what of the American fleet?” Three more voices chimed in to reply; a former naval officer wearing a uniform crammed with jingling medals was one of them. “We’re already neck-and-neck. If we keep cutting corners, they’ll lap us by the turn of the century—”\n     “Forget the navy!” Representative Edelstein jabbed his finger into his desk. Many were relieved of the notion to move on. “Our infrastructure expenditures have ballooned exponentially since 1990! Should that not be our focus?”\n     “You want to talk cuts? Let’s start with your salary!” was one unhelpful reply. Another, shouted from across the room, was slightly more constructive: “Any reduction in infrastructure funding would lead to spiraling unemployment in the public sector!”\n     “As would Herr Welker’s proposal to pause the North Seaport Initiative.”\n     “That is no longer a forwarded proposal, I will not debate it further.”\n     “The Führer has indicated otherwise!”\n     “You think I give a damn what that traitor wants?! He’s to blame for this whole crisis to begin with!” The representative’s venomous words stirred up Mußgnug’s other supporters, who hollered in support. “Speerite scum! Sit down and shut your mouth!”\n     “Son of a bitch!” The target of the derision stood up sharply, reaching into the inner pocket of his jacket. Thankfully, his colleagues managed to tackle him to the ground before the verbal firefight turned real."
 GER_focus_event.30.a: "The trenches sat, unmoving."
 GER_focus_event.31.t: "Game Changer"
 GER_focus_event.31.desc: "“My Führer, with all due respect....” \n     Speer’s hand, looming over his last remaining pawn, tensed abruptly. “For fuck’s sake. What is it now?”\n     “Well, if you do that, I’m going to do this.” Fischer spoke calmly, pantomiming his bishop sniping Speer’s queen. “If you do this, I’ll counter with that.” Fischer’s knight routed Speer’s. “And if you try that—”\n     Speer cradled his head in his hands. “Why are we wasting time playing this stupid game, again?”\n     “To take your mind off things. Besides, chess proficiency is correlated with improved strategic thinking—”\n     “I can hardly remember the names of the pieces!” Speer roughly grabbed what he had called the “horse” up until the current game. ”Dammit! I can’t even get my head around a pastime from the middle ages. How the hell am I supposed to navigate this Euromark nightmare?!”\n     “It’s simple. You don’t.” Thumb stroking his chin, Fischer scanned the board, scheming his next play. “The bomb is already counting down. Scrambling to defuse it at this point would only make you more vulnerable. The question isn’t how to stop the blast. It’s whether or not you’ll have something to duck behind when the timer hits zero.”\n     Fischer continued. “You need friends. Doesn’t matter who. Mußgnug already has the lion’s share of the Party doing his dirty work — and that was before the Euromark went belly-up. Our spherelings out east, however,  are too tied up in their own affairs to care about the petty goings-on in Germania. And they just so happen to control quite a lot of resources. Natural and military.”\n     Speer’s fingers, formed into a sharp steeple, pressed against his lips. “True...”\n     “Alternatively, if you were to make some deals west of the Rhine, that balding twit would think twice about seizing power — it would come at the cost of alienating our Europakt partners. The Wehrmacht is a joke; what is he going to do if they refuse to recognize him as Führer? Another Sealion?”\n     After a moment of thought, Speer exhaled through his nose. He made his move at last. “Once again, Herr Fischer, you’ve proven yourself to be one of my most dependable confidants.”\n     “I try.” Fischer’s face lit up — partly from the praise, but mostly from the satisfaction of sliding his lowly pawn toward his opponent’s cornered king. “In any case...”"
 GER_focus_event.31.a: "“...that’s checkmate.”"
 GER_focus_event.32.t: "Message Received"
 GER_focus_event.32.desc: "“...It’s a travesty! A shameless injustice!” Tengiz Kitovani, the fearless leader of the Kaukasus, pointed a dull, butter-glazed knife toward Speer. “Why should Hungary, Romania, and Slovakia be first in line for these new industrial projects? Just because they’re a stone’s throw from Germania? What about my people?”\n     A wincing Speer, looking more like a scolded child than the leader of a continent, swirled the tines of his fork around his empty plate. Just great — the turbulent flight from Germany to Tbisi had already given him the worst back pain of his life, and now he had a pounding headache to top it off. “Herr Kitovani, if you wouldn’t mind lowering your voice just a touch—”\n     “Considering your recent conduct, I’ll speak as loudly as I please.” Kitovani raised his scratchy voice even louder — and the gaggle of servants buzzing around his private residence turned their heads. “I’ve sent, what, twenty messages about this matter? All ignored!”\n     “Pardon...? I haven’t received any letters.”\n     “Don’t you check your email?!”\n     “Ah. An intern set up that silly nonsense for me last year.” Speer groaned. “I’m waiting out the fad. Sure, people are excited over the novelty now, but in the end, messages on a screen just don’t have the personal touch of a handwritten letter.”\n     Kitovani, still chewing his food like a caveman, replied with a silent glare.\n     “But, uh, I digress. What can I do to ease your concerns?”\n     “Even the playing field.” Kitovani swallowed a chunk of steak. “I want contracts. Investments. Industry, for God’s sake! I don’t care how you do it, just get it done.”\n      Speer exhaled. His gaze drifted to the quaint, mountainous cityscape surrounding him. Kitovani did have a point: besides the handful of modern buildings owned by the city’s wealthy German minority, the bulk of Tbilisi — and the Kaukasus at large — still consisted of miniscule, medieval buildings one windy day from crumbling into dust.\n     Yet Kitovani’s demands, childish and self-serving, betrayed an alarming lack of economic sense. The nucleus of the Europakt was Central Europe, and, naturally, the bulk of its production capacity lived there — not 2,000 kilometers away in the Kaukasus. But, then again, Speer wasn’t exactly in the position to be carelessly drawing lines in the sand..."
 GER_focus_event.32.a: "“Well, it won’t be easy, but the Kaukasus region does have quite a lot of development potential...”"
 GER_focus_event.32.b: "“Perhaps in ten year’s time. For now, I’m afraid that the infrastructure just doesn't exist.”"
