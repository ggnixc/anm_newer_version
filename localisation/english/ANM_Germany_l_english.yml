 GER_focus_event.47.a: "But the Shepherd did not emerge."
 GER_focus_event.48.t: "Half a Mind, Half a Plan"
 GER_focus_event.48.desc: "“February ‘97. A single death from a misguided missile nearly sparked the demise of millions more.” Gunter Deckert scratched his chin, completing his third meandering lap around the crowded conference room. “Gentlemen, War with the Soviet Union is not a matter of if, but when. And when that time comes, control of Finland...”\n     Deckert’s robotic stride came to an abrupt halt, and for the first time in several minutes, the man looked up from his worn-down dress shoes. “...Well, I don’t really need to explain the strategic advantages, do I?”\n     A muted ballad of mumbles and nods signaled agreement from the two dozen middle-aged men huddled at the room’s central table. They concurred on the ‘what’, the ‘where’, and the ‘why’ — but the problem, as always, was the ‘how’.\n     “Let’s fight smarter, not harder!” A low-ranking officer, considerably younger than his septuagenarian peers, uncapped one of the dry-erase markers scattered across the table. “Given our current economic situation, we can’t afford to take our current stockpile for granted.” His marker glided across a large, laminated map, drawing a handful of wandering lines between Oslo and Murmansk. “Let the Finns handle the real fighting. The Wehrmacht ought to put its weight behind starving out the Reds — they’re nothing without their OFN lifeline.”\n     An older, overweight officer snatched the marker from his younger collegue’s hand. With a condescending chuckle, he drew an arbitrary line from Who Cares, Sweden to Middle-of-Fuck, Finland. “And as soon as we snuff out one smuggling route, another will pop up to take its place. We need to be aggressive! So what if the rebels get their hands on a few shiny toys? All the OFN arms in the world won’t matter when German tanks roll over their lines.”\n     A third officer, calmly cleaning his glasses, simply offered: “Why not both?”\n     “Wonderful contribution, Ernst. Why come to a consensus when we could just half-ass two half-baked plans?”\n     Tuning out his bickering advisors, a silent Deckert turned toward the gallery of Wehrmacht banners displayed proudly on the western wall. His chest tightened, and a glassy sheen of emotion glistened within his sleep-deprived, drooping gaze. The path ahead was wracked with doubt, but a single, stubborn column of light shone defiantly through the darkness:"
 GER_focus_event.48.a: "Failure was not an option."
 GER_focus_event.49.t: "Operation ERLKÖNIG"
 GER_focus_event.49.desc: "The sun had only just started its retreat beneath the horizon, yet only the sighing wind, rustling through the leaves, dared to make a sound. City life had been that way ever since the beginning of this godforsaken civil war. It mattered not if the rumbling tanks and tittering machine guns were within earshot or a hundred towns over — anyone with their wits intact didn’t dare leave the house after dark.\n     Yet, despite it all, here Paavo stood. A gale of wind battered the old steel bridge on which he stood, and the shivering man, donning only a light jacket, scrubbed his arms for warmth. He’d been waiting for nearly twenty minutes — where the hell was this guy? If he stayed out here any longer, he’d—\n     “Mr. Salo.” A bassy voice, speaking with an unmistakably-thick German accent, sounded from behind.\n     Paavo flinched, nearly stumbling into the water as he spun towards the looming silhouette. He took a moment to calm himself. “My...my son.” he simply stated, grabbing the thick wad of cash stashed in his pocket. An incredible weight flew off his shoulders as he offered the—\n     “Names.” The German pushed away Paavo’s hand.\n     Paavo blinked; the sheer bluntness of the man’s words had caught him off-guard. “Names? Whose names?”\n     “Playing dumb won’t help your son, Mr. Salo.”\n     Paavo swallowed the overwhelming urge to scream. Of course. He should have known this had something to do with the war. “Why me? I make minimum wage — I’m not even involved in the smuggling! What gives you the right to terrorize my family—”\n     “Right or not, the boy is in our custody, and he’s getting quite hungry.” The German spoke slowly, each syllable slithering up Paavo’s spine. “In two days, you and I will have another pleasant meeting on this bridge. You will provide the names of everyone facilitating the foreign traffic passing through your site. Assuming you do that, I can assure you your son will be returned to you unharmed. Perhaps a tad thinner, but unharmed.”\n     Paavo emptied his chest with a long breath, pondering the German’s outstretched hand. A whirlwind of thoughts swirled through his mind. Could he really just rat out his co-workers like this? What would happen to them if he did? What would happen to his son if he didn’t?\n     In the end, however, only one was spoken aloud:"
 GER_focus_event.49.a: "“...Yes. I can do that.”"
 GER_focus_event.50.t: "Operation VOGELFÄNGER"
 GER_focus_event.50.desc: "Christian hardly paid attention to the endless lines of military convoys humming through the city streets: The faded insignias painted upon the vehicles — be they that of the Finnish government, or the insurgents fiercely opposing them — hardly mattered. German intelligence had traced the source of a Communist arms smuggling ring to a specific factory here in Kouvola, and Christian — or as his colleagues at the RND knew him, Agent VOGELFÄNGER — had been tasked with snuffing it out.\n     The easy part was done. Now came the wait — the long, tedious, wait.\n     Palms insulated by a steaming styrofoam cup, Christian sat back in his chair, breathing in the final moments of morning calm. His eyes followed a young couple as they entered the coffeehouse behind him; the bell mounted atop the door jingled lightly to announce their arrival. As the door closed behind them, the cozy air swirling within the cafe — tingling spices melded with the nutty aroma of espresso — enticed Christian inside. \n     He glanced at his watch. The mouthwatering bouquet certainly stirred up a mighty hunger, but he didn’t dare budge from his seat. Any second now —\n\nAn auburn fireball erupted several blocks away, consuming one of the larger factories dotting Kuovola’s skyline. Swirling plumes of smoke slithered between buildings, corrupting the crisp morning air with a thick, toxic haze. A choir of screams and sirens, near and far, blared out-of-sync from all corners of the city as countless terrified onlookers stampeded away. Some stood still, frozen in terror amongst the chaos — even as the ashen clouds swallowed them whole.\n     Christian, watching calmly from afar, suddenly flinched — something from above had clunked against the plastic brim of his hard hat. He glanced between his dust-splattered work boots to see what it was: a little songbird, small enough to fit in the palm of his hand.\n     It didn’t move. It didn’t do anything. The shockwave, he thought, must have done the poor thing in."
 GER_focus_event.50.a: "Der Vogelfänger bin ich ja."
 GER_focus_event.51.t: "Ready or Not..."
 GER_focus_event.51.desc: "“Morning. Snipe any Commies?” Private Hans chuckled, handing Private Andreas a steaming cup of black coffee. Back home, everyone always sweetened their brew, but ever since his deployment, he’d grown quite accustomed to the Finnish way of doing things. It wasn’t like the taiga gave him much of a choice, anyway.\n     “Well, it’s quarter to nine, and I’m barely awake. You tell me.”\n     “I’ll take that as a no...?”\n     Andreas grumbled, squinting into his binoculars. “As if I could even shoot anyone with this piece of shit, anyways. It’s jammed. Again.”\n     Hans picked up the rifle in question. He inspected it closely, making sure nothing had broken off or chipped. “Well, good thing you haven’t had to use it lately.” He shrugged, sitting against the wall of the shallow, makeshift trench. Without Lieutenant Holm here to breathe down his neck, he could already tell he wasn’t going to get much done this morning — and he was prepared to savor every second of it.\n     “I swear I should have grabbed that gun from yesterday’s raid...” Andreas shook his head. “Sometimes, I think the Soviet equipment is more reliable than ours.”\n     “What? Fuck no!” Hans guffawed. “Those mongrels couldn’t even bang together a functioning human, let alone a rifle.”\n     With a genuine chuckle, Andreas went back to scouting the land. The boreal forest, sheathed in an evergreen shawl, was far easier on the eyes than the other hellholes he’d visited over the past few weeks. For once, there was no visible destruction. No craters, no fire, no charred, leaf-bare trees sticking out like spikes in the no-man’s-land  — just himself, his buddy Hans, and mother nature...\n\n“Wait, wait!” Andreas flinched. “Behind the tree line! You see that?!”\n     Hans nodded, radio in hand. “Report. This is Grenadier Menzel at Eastern Forward to Outpost V. Movement spotted. Come in.”\n     A crackled voice replied a moment later. “East Forward. Go ahead.”\n     “Enemy troops. We don’t know how many, but we think we’ve spotted some movement just behind—” A deafening crack cut off Hans’ report. Ducking for cover, he pulled Andreas down with him, but in the end, his efforts weren’t necessary. The warm blood seeping between his fingers told him that much.\n     “East Forward? What is your status? Come in.”"
 GER_focus_event.51.a: "“Sh-Shit! Man down! Send a medic! Now!”"
 GER_focus_event.52.t: "...Here I Come."
 GER_focus_event.52.desc: "To the tune of distant gunfire, Private Hans discarded the tattered tarp that, moments ago, had hidden a family of three amongst the rubble of a bombed-out storm drain. “So this is where all that crying was coming from...”\n     It took only a moment for the family’s youngest, a little girl held tightly in her mother’s arms, to shriek in terror. “No!” She wailed in her native Finnish, tears rolling down her soot-stained, emaciated cheeks. “Go away! Go away!”\n     “Aww...” Private Markus crouched down, flicking his spent cigarette onto the muddy, tank-treaded snow. He studied the well-snuggled plush clutched in the child’s arms — its owner’s name was scrawled onto the tag in awkward, rudimentary handwriting. “What’s the matter, Anja?”\n     “Yeah. Don’t worry! We don’t bite...much.” A wicked smile stretched across Hans’ unshaven face. The barrel of his rifle prodded Anja’s shoulder, prompting a breathy whimper.\n\n“Please...” Eyes wide with terror, the girl’s father glanced around for a viable route of escape. None existed. “Please, no hurt!” He pleaded in broken German, “We just try to go border, and—”\n     “Leave us alone!” Anja’s shrill shriek was loud enough to make both soldiers’ ears ring. “Daddy! Make them go away!”\n     “Anja, please! Just calm down!” The mother soothed, rubbing circles around her daughter’s trembling back. “It’s going to be okay. Th-The soldier man won’t hurt us if we do what he says...”\n     “I WANNA GO HOME!” The crest of Anja’s head butted against her mother’s chest as her whines reached a new, ear-splitting octave. “I WANNA GO HOME!” She wailed again and again, filling the space between each outburst with a pathetic intermission of sobs and snivels.\n     “Fuck, this kid is annoying.” Hans stood, casually aiming his rifle at the howling first-grader’s head. He looked Markus in the eye. Markus shrugged.\n     Spellbound, Anja’s parents could do nothing but stare as a twitch of Hans’ finger put an abrupt end to their little girl’s tantrum. Anja’s stuffed companion fell from her limp, lifeless hands, landing face-first in a quickly-expanding pool of blood.\n     Hans reloaded."
 GER_focus_event.52.a: "“That was for Andreas.”"
 GER_focus_event.53.t: "Last Flight from Tehran"
 GER_focus_event.53.desc: "Quarter till noon. In exactly seventeen minutes, the last of the Luftwaffe’s civilian evacuations was set to take off from Tehran. The capitol was still technically under the control of the Shah’s Government, but only in the sense that the anarchy paralyzing its streets was the fault of civilians, not any of the armed militant groups currently sweeping through the countryside.\n     Adolf slowly exhaled, eyeing the shadow of the air base’s barbed wire perimeter stretching across the sun-bleached highway. Hesitant to leave his precious investments behind, he had stuck things out for as long as possible, hoping things would simply blow over. It wasn’t until two of his three factories went up in smoke that Adolf finally decided to throw in the towel.\n     Gravel crunched beneath his sleek sports car as he turned onto the sideroad leading to the base. Hordes of desperate, ragged poors were camped on either side, begging in broken German to be allowed to hitch a ride out of the country. Adolf swerved to miss them — he’d rather die than have any of their greasy hands smudge his paint job.\n     Like they deserved his pity. These were the same ingrates who whined constantly about their pay, yet had the nerve to treat themselves to the newest gadgets out of Guangdong every year. The same hypocrites who bemoaned the ‘unsafe’ air quality inside of his factory, yet slept on the floor every evening rather than go home. The same rabble who filled the ranks of the radical Communist cells that reduced two of his most profitable income streams to rubble.\n\nEyeing the checkpoint up ahead, Adolf grabbed his ID and passport — but not before slamming on the gas to kick up an ample cloud of brown dust for the rabble. He chuckled at the amusing sight in the rear mirror as a uniformed officer meandered over to his approaching vehicle.\n     “Nice ride.” The officer smiled, barely even glancing at Adolf’s documents before handing them back. It didn’t take a genius, after all,  to deduce Adolf’s country of origin. “Get home safe.”\n     Adolf drove off without any further ado, filling his lungs with one final whiff of that intoxicating “new car” smell. He hated that idea of leaving his new convertible behind on the tarmac, but he’d just buy a new one back home — his dependable workers here in Iran had afforded him the privilege."
 GER_focus_event.53.a: "He wished them the best of luck with their little worker’s paradise."
 GER_focus_event.54.t: "Bailing out the Iranians"
 GER_focus_event.54.desc: "“Every day for twenty-five fucking years!” General Nadar Jahanbani growled like a rabid dog, hunched ungraciously over the wrinkled, coffee-ringed map sprawled across the table. Dozens of irregularly-shaped zones of control, differentiated by dotted lines and clashing colors, carved the Pahlavi Empire into the pitiable mosaic of a failed state for the second time in a generation. “I told them reform was the only way for the Empire to survive. But did anyone listen? Of course not!” He whipped his beret across the room, exposing a bad comb-over sated with sweat. “No one ever listens to me!”\n      “I understand, General.” The feet of Hans Helmut Spiedel’s chair scooted backwards as the gentleman from Germany inched away from his Iranian counterpart. “Just take a deep breath.” He said, feeling more like a therapist than a military attaché, “In and out.”\n      “Don’t patronize me!” The force of Jahanbani’s fist sent ripples through Spiedel’s lukewarm, over-sweetened coffee. “I’ve more than earned the right to be pissed off! Our support amongst the people was poor before, but now? We’re one  wrong move away from losing everything!”\n      Spiedel laced his fingers. His cadence was slow, cool, and calculated. “I fully recognize the weight of the situation. But, with all due respect, do you really think it’s prudent to spend our time stating the obvious? Or should we finish discussing the logistics of—”\n      “Logistics?! What logistics?! Every port is under rebel control. Our people are starving, the economy is collapsing!” Jahanbani held his head in his hands. His voice cracked as a tide of rage retreated, exposing a soft bed of sorrow hidden underneath. “What’s the use in even trying...?”\n     “Oh, for fuck’s sake! This is pathetic!” Spiedel suddenly stood, sending a handful of loose papers flying. “If you’re so certain of how this war will end, why am I even here? To watch you wallow in your own pity?”\n     The air conditioner’s rattling growl suddenly disappeared, slashed into silence by Speidel’s scathing words. Jahanbani looked up; his face looked just like a corpse, every muscle having gone completely slack.\n     “R-Right. Excuse me.” Jahanbani cleared his throat after a long, long pause. “Let’s take this one step at a time...”"
 GER_focus_event.54.a: "Heil the Shah."
 GER_focus_event.55.t: "Cutting Ties"
 GER_focus_event.55.desc: "“There’s no need to act so rashly!” Ramin had been through hell and high water during his long career as a diplomat for Tehran, but in all that time, he’d never reached the point of sweating all the way through his suit jacket until today. Stray hairs clung to his wrinkled brow as he wrung his hands, pacing after his German counterpart like a lost child. “Please! I understand your concerns, but the Shah will weather the storm! Have you no faith in—”\n      Ambassador Weinberg exhaled sharply. “For the last time, it’s not up to me.” He grabbed the final item left on his desk — a worn mousepad custom-printed with a photo of his grandchildren — and let it flop into a cardboard box. “Germania’s ordered the embassy to vacate. And even if they hadn’t, I’d still be catching the first flight out of this place.”\n     “But...!”\n     Weinberg pulled a roll of packing tape across the box’s lid; both men winced at the sharp shriek. “Iran is a second home to me, Ramin. You know that better than anyone. But when the rebels lurking in the countryside finally reach Tehran, I’d rather not spend my twilight years as a bargaining chip for whatever freak show comes after the Pahlavis.”\n     Ramin paced left, and right, and left again. Just like he had every day since the fighting began, he racked his brain, scavenging for something, anything, that could paint a gilded sheen over the nightmare he found himself in.\n     This wasn’t happening. It couldn’t be! For as long as he could remember, the Shah was the Shah, chosen by the twelve Imams to lead the people of Iran to greatness. How could all of that history, all of that tradition just...go away?\n     “I just...” he said at last, “Is there nothing more Germany can do?”\n     “We could delay the inevitable.” Weinberg forcibly pushed down the lid of his overstuffed suitcase. With a little bit of effort, the lock finally snapped into place. “Ramin, I say this with love, but...it’s over.” Box tucked beneath his arm, he glanced at the door. “I’m sorry.”\n     The door shut behind Weinberg, and Ramin’s eyes dimmed. He slumped into what used to be the Ambassador's chair, staring longingly at one of the volumes left behind on the office’s barren shelves: “The History of Iran, 1925 to Present.”"
 GER_focus_event.55.a: "He pitied the authors of the next chapter."
 GER_focus_event.56.t: "Welcome to Iran"
 GER_focus_event.56.desc: "A gust of wind raced into the fuselage the moment Private Franz cracked open the door, scattering flecks of scorching desert sand into the eyes of himself and his fellow recruits. All spat and cursed accordingly.\n     Despite the protection afforded by his gloves, Franz could feel the handrail slowly searing his palm as he led his squad down the boarding stairs. A hazy mirage rippled all across the runway, burnt asphalt bending and warping the air floating above it. Damn — Bavaria had its fair share of summer scorchers, but those days paled in comparison to the sweltering heat currently roasting him alive inside his bulky fatigues.\n     Soles sizzling on the tarmac, Franz wiped away the beads of sweat trickling down his brow. “Mediterranean climate my ass...” he grumbled, cursing the indignity of it all. When he’d signed his papers, he’d pictured himself fighting in the same snowy woodlands he’d blogged about for years. If he had known he’d end up in this dust-caked backwater, he’d have just carried on stocking shelves at the Aldi.\n\n“Heil Speer!” One of the officers patrolling the runway — a sergeant, based on his regalia — greeted the recruits with a precise salute. Franz quickly returned the greeting. Most of the others did the same, although the dehydration affecting some left a few arms slightly flaccid.\n     “Christ alive...” The sergeant’s nose crinkled as if he’d stepped in shit. “Have you twerps even been through basic? Or are they just handing out free guns with every kindergarten diploma these days?”\n     The sergeant marched down the line, arms folded neatly behind his back. “You can call me Sergeant Graf.” He turned sharply toward one recruit at random. “And you are?”\n     Franz swallowed. He dared not stutter. “My name is—”\n     “Wrong.” Graf shoved Franz back with an open palm. “You are a cog in a machine, utterly useless outside of your service to the greater whole. Forget your name. It isn’t worth shit here. You and your unit will live together, fight together, and die together in the name of the Fatherland.”\n     “Sir, yes sir!” Franz and his squad didn’t skip a beat. Their new home, the city of Tehran and its millions of inhabitants, sprawled across the horizon behind them."
 GER_focus_event.56.a: "Voluntary Service (12 Months): +3600 | Net gain: +3600"
 GER_focus_event.57.t: "Entering into a Volatile Market"
 GER_focus_event.57.desc: "“In conclusion, the situation in Iran presents us with a once-in-a-century-opportunity to gain an enormous market share in the region.” Rolf Macher, an executive of the Aldi-Delhaize corporation, used the computer’s mouse to draw circles around the map projected onto the pulldown screen. “I’ve provided you each with a copy of the proposed contract. Please, take a moment to look it over.”\n     The gaggle of suits sitting around the table flipped through the thin packets laid in front of them, and a stiff silence — punctuated by clicking pens and sips of coffee — hung over the boardroom.\n     The Director of Marketing was the first to speak up. “I’m sorry, but they can’t possibly be desperate enough to agree to this.” Looking over the rims of his glasses, he read over the words a second, third, and fourth time. “We’re talking about a complete monopoly on food shipments to and throughout Iran.”\n     “Well, the territories the government still controls, at least.” Herr Macher nodded, advancing to the next slide. “It seems too good to be true, but the Shah doesn't have much of a choice. Iran’s food distribution supply chain has collapsed, and store shelves throughout the country sit empty. Humanitarian aid is tiding over the population in the meantime, but when that runs out? The handful of provinces still loyal to the Shah may look for...” he cleared his throat. “...alternative leadership.”\n     “And what if that happens regardless? What happens when Tehran gets leveled by rebels, and we lose our investment?”\n     “Well, that’s where our friends in the Reichstag come in, isn’t it?” Franz Muller, the clean-cut CEO seated at the head of the table, leaned back in his chair. “I'm sure we could work out some kind of agreement to partly insure any losses we endure in Iran.”\n     The Director of Marketing swallowed hard. It wasn’t like him to question the boss, but his livelihood was on the line here. “And if that doesn’t pan out?”\n     “We’ll go in anyway.” Muller shrugged — it was easy to be confident when three out of every five of Germany’s supermarket chains answered directly to you. “It’s true. We’re rolling the dice on this one, but when will we ever get another chance like this? If we don’t see this deal through now, someone else will swoop in and gain that leverage.”"
 GER_focus_event.57.a: "You can’t win if you don’t play."
