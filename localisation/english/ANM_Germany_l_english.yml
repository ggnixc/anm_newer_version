 GER_flavour_event.13.t: "Traitors Need Not Apply (1/2)"
 GER_flavour_event.13.desc: "Johann Müller limped down one of Hamburg’s many litter-strewn sidewalks, arms aching under the weight of a plain-looking cardboard box. Inside, the contents of his cramped office desk — a half-decade worth of old calendars, overstuffed binders, and cheap ballpoint pens that only wrote if you scribbled on an old receipt first — shifted around with every step.\n     At the very bottom, squashed beneath an old snowglobe from some stupid office party he barely remembered, was a balled-up piece of carbon paper. When Johann had first laid his eyes upon it, his racing mind had only managed to pick out a scant few keywords: Recent developments. Financial circumstances. Unfortunate. Professional relationship. Terminated.”\n\nHe shook his head. What a crock of shit.\n\nJohann knew the real reason for his firing — it wasn’t a coincidence that he was suddenly left without a job after, under the influence of a healthy serving of alcohol during happy hour, he’d let his thoughts on current events slip. That he had actually gone through a brief communist phase in his youth — it was a foolish little stint, and he’d since wisened up after a lengthy prison sentence, but it happened.\n     It wasn’t fair. Why should he be punished for the actions of a few radicals? Why should he lose his livelihood just because some washed-up Reds decided to derail a train full of NSDAP officials? He hadn’t done anything wrong. He wasn’t a terrorist — he wasn’t anything. He was just Johann. Didn’t they know that?\n\nJohann kicked an empty aluminum can into the street. He should have seen this coming."
 GER_flavour_event.13.a: "A man should be judged by what he is, not what he was."
 GER_flavour_event.14.t: "Traitors Need Not Apply (2/2)"
 GER_flavour_event.14.desc: "The click of the front door unlocking barely registered. Johann stepped into Apartment 203. It was a small, one-bedroom abode — more suited for a bachelor pad than a family dwelling — but it was the only home his son Wilhelm had ever known. And that was enough.\n     Speaking of the boy, besides a brief flick of the eyes toward the front door, he didn’t react much to his father’s arrival. He’d just cracked open a brand new comic book, after all. The one he’d saved up his allowance for months to buy.\n    “Sweetie! What a surprise!” His wife Frida pecked him on the cheek — it was practically a reflex at this point. The thirty-something was as radiant as the day he’d first laid his eyes upon her, carefully woven braids framing her dimpled smile. “What are you doing home so early?”\n\nA lifetime of memories flashed behind Johann’s bleary eyes. He remembered the despair he’d felt when he had been sentenced for his crimes. By the skin of his teeth, he’d made it out after ten grueling years.\n     He remembered when he’d first met Frida — she didn’t care about his worn-out clothes and unshaven face. She was the first person, after nearly a year of living on the street, who’d treated him like a human being.\n     He remembered how grateful he’d felt when he’d found a stable job, how his chest had swelled with pride when he’d first held his son in his arms. Against the odds, Johann had left the ghosts of his past behind him. He’d won.\n\nBut now...? Now what? What was even the point of it all...?\n\nA serious look crept onto Frida’s face. It found its way to little Wilhelm’s soon after. The boy put down his new comic.\n     “Honey,” Johann croaked, at last meeting his wife’s crinkled gaze,”"
 GER_flavour_event.14.a: "“...Do we still have that old bottle of whiskey that your father left you?”"
