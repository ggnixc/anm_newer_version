 ### Events ###
 flavoranm.1.t:0 "Me at the Zoo"
 flavoranm.1.desc:0 "Today, on, a new and promising website known as YouTube, intended to allow for users to create videos and share them with others across the world, the very first public video has been uploaded.\n\"Me at the Zoo\" is a short clip, depicting one of the site's co-creators, Jawed Karim, visiting a zoo in San Diego.\nWhile it is not yet known how this site will affect the World Wide Web, the ability for everyone to 'broadcast' content is definately a revolutionary development."
 flavoranm.1.a:0 "I cannot wait for entertaining and non-hostile conversations in the comment section!"
 
 flavoranm.3.t:0 "Dragostea Din Tei (Numa Numa)"
 flavoranm.3.desc:0 "The Song \"Dragostea Din Tei\", from the Romanian group O-Zone, has gained popularity across Europe.\nThe single has risen to place one in various nations including Germany, France and Switzerland.\nLiterally translating to \"Love from the linden tree\", the Romanian Song has gained cult status in the Europakt, and is spreading throughout the Weltnetz. "
 flavoranm.3.a:0 "   Have you seen the funny video of the guy who dances to this song on Newgrounds yet?"


flavoranm.4.t:0 "The Matrix Reloaded"
flavoranm.4.desc:0 "The Sequel to the very successful movie 'The Matrix' - set in a dystopian future, in which humanity has been trapped in a digital simulation by a rogue artifical intelligence - has finally been released.\nThe movie features revolutionary visual effects and expands upon its predecessor, explores the society of the free city of Zion and the internal mechanisms of the Matrix, with the now resurrected and self-multiplying Agent Smith posing a new threat.\n\nThe film will be released for the Europakt and other markets soon.[GetANM_ger_matrixreleased]"
flavoranm.4.a:0 "\"It is purpose that created us...\""
Anm_matrixreleasedger:0 "Even German Political Leader Martin Mussgnug has expressed his desire to see the movie soon after its relese to German Cinemas."
