### Ideas ###
 FIN_connecting_people: "Connecting People"
 FIN_connecting_people_desc: "Finland is the home of the largest telecommunications company in Europe, Nokia. Nokia’s phones are the most popular mobile phones on the European Market and are major players in outside markets like China and South America as well. It has made constant innovations on its mobile phones, with the latest now able to fit in your pocket and send text messages around the world.\n\nWhile Nokia has been a major economic boom and job creator for the Finnish economy, its outsized role could make it a severe liability to the economy if it were to collapse."
 FIN_finlandsierung: "Finlandsierung"
 FIN_finlandsierung_desc: "Like many other nations in Europe, Finland is allied with Germany and is a Europakt member state. While this arrangement has helped bring security and prosperity to Finland, in many ways, it has undermined its status as an independent nation. Germania influences Finland’s politics from the shadows, so their policies won’t be too progressive to Germany, with many of Finland’s parties having connections with the Reich, either outright or behind closed doors. This arrangement has agitated much of the Finnish Populace, especially those who seek to align with the Comintern or OFN, but it's unlikely to change in the coming years"
 FIN_population_shelters: "Population Shelters"
 FIN_population_shelters_desc: "The Finnish loss in the Second Winter War and the resurgence of Russian Bolshevik forces on the Karelian border forced the Finns to rehaul its defence strategy. As part of this overhaul, the Finnish government decided to build population shelters within high-risk and densely populated areas to ensure safety for the Finnish people in case of an emergency or conflict. While the program has encountered cost overruns and capacity issues, the Shelter System has been a cornerstone of Finnish Defence Policy since the loss of the eastern territories"
 FIN_civil_war: "Second Finnish Civil War"
 FIN_civil_war_desc: " "

 FDR_russian_influence: "Russian Influence"
 FDR_russian_influence_desc: "The Soviet Union gave our movement the first push to the revolution. They assisted us, gave us arms, and men to overthrow the fascist government of the pretender Bourgeois Republic. They are our greatest ally and we must respect them.\n\nNevertheless, the Soviets have expressed a desire to monitor our civilian affairs in order to ensure operational efficiency against the Fascist puppets. They have appointed Sergei Katanandov to observe our regime. However, Katanandov may have desires beyond being just a mere advisor, therefore we must ensure that he is kept in check. Despite this fact, we should proceed with caution, as if we make him feel threatened, he may ask for further Soviet assistance."
 FDR_trade_unions: "Trade Unions’ Happiness"
 FDR_trade_unions_desc: "The Trade Unions are the lifeblood of our economy. Without them, our movement would not have risen up in the first place. They rose up against their capitalist oppressors and are making the lives of the workers happier.\n\nHowever, the Trade Unions are sceptical about our ideas of Nationalisation and Planned Economy, thus we must negotiate with them. If we make them unhappy, they may rise up against us, causing another headache for the regime."
 FDR_red_guard_partisans: "The Red Guard Partisans"
 FDR_red_guard_partisans_desc: "The partisans are the heroes of our cause. They eliminate the bourgeois and Fascist bootlickers, and are willing to liberate Finland from Capitalist Tyranny. As we do not have a Regular Armed Force, the Partisans operate as the military for our nation for the time being.\n\nThe Red Guard Partisans don’t only operate in our territories. They also operate in the enemy territories sabotaging their war effort to make it easier to conquer them."

### Events ###
 WORLD.18185.t: "Second Finnish Civil War"
 WORLD.18185.desc: "The following weeks have not been kind to the nation of Finland. Originally protests against the government's response to the “Euroshock”, the May Day Riots became day-long clashes between the police and civilians. The government's bitter response to Left and Far-left groups who participated took what was seen as a delicate, yet salvageable situation, and sent Finland into a repeat of its 1918 Civil War.\n\nCurfews were enacted while fighting bloodied between the police and armed forces, against the partisans, who received supplies and support from the Soviet Union. The German Reich, which lacks any legal obligations, but holds a special relationship with Finland, has pledged its total support against this uprising, while others are fearful the fighting will cascade into something larger."
 WORLD.18185.a: "May the voices of reason soon prevail."
 WORLD.18185.b: "Let the past be corrected and our brothers avenged."
 WORLD.18185.c: "A Country cannot be saved by its Traitors."
