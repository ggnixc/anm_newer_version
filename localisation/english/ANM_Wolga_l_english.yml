 VLG_philip_anschutz: "Philip Anschutz"

 ## Descriptions ##
 POLITICS_EDUARD_ROSSEL_DESC: "Rossel never had an easy upbringing. Born to Wolga German Parents in Gorky, he was barely a year old when the NKVD shot his father in 1938. His Stepfather was then sent to a labour camp in 1942, and his mother barely escaped the NKVD. In the chaos of Operation Barbarossa, Rossel and his mother fled across the frontlines to the German Army as the USSR began to collapse and began settling in the Wolgan Autonomy within RK Moskowien. Whilst he was no supporter of the Nazi Ideology, he and many Wolga Germans preferred it over the Oppressive Soviets, who now had a vengeance against them.\n\nNow settled in the renamed ‘Hitlerstadt’, he began studying economics and mingling with groups of German Immigrants to Wolga. The messy and chaotic administration of RK Moskowien and the Wolga Autonomy, and the disorder following Hitler’s death, began to turn many Wolga Germans against Nazism, including Rossel.\n\nThe Fall of the Reich’s Eastern Territories, including the Wolga Autonomy, proved to be the straw that broke the camel's back for the Wolga Germans. Fearing a potential rebellion, Germania granted the remaining Wolga Territories new sweeping levels of Autonomy and Self-Rule, with Rossel becoming the New Leader of Gouvernement Wolga. As the leading Wolga German, Rossel passed major reforms to grant freedoms to the population and lessen the grip of Nazism in the area. While nominally loyal to the Reich, under his leadership, the Gouvernement’s future shall be decided by the Wolga Germans, not Germania."
 

### Ideas ###
 VLG_the_free_germans: "The Free Germans"
 VLG_the_free_germans_desc: "In the aftermath of the 2WRW, the Reich’s Leaders feared the remaining Wolgans could rebel after they had lost significant amounts of Wolga territory and had failed to protect them as the Russians soon began a persecution of the Volga Germans. To keep them on their side, they promised the Wolgans more autonomy and even the right to self-right rule rather than as an autonomous region within the Russian territories.\n\nThe Reich hoped this would solidify their loyalty, but it soon had the opposite effect. The Wolgans never had a real relationship with the Reich, as they accepted their rule primarily to stop their Soviet persecution. They soon began to distance themselves from the Reich and removed their influence within Wolga, including the famous NSDAP Swastika as a state symbol. Since the 2WRW, the German population in Wolga has doubled, with many seeing Wolga as a “Home away from Home”. It seems many prefer the simpler life promised by the Wolgan Government rather than the radical fanaticism within the Reich."
 VLG_russo_wolgan_split: "Russo/Wolgan Split"
 VLG_russo_wolgan_split_desc: "After the devastating 2WRW, most of the Reich’s Russian Territory was lost to the USSR. This included large amounts of the Wolgan Autonomy within Paktkomission Russland, home to the “Wolgadeutsche”, or the Volga Germans. What remains of the Wolgan Autonomy is a state that is a shadow of its former self.\n\nThe border between Wolga and Russia is a boiling pot of tensions between the two sides, with clashes, sabotage and false flag operations along the border a common occurrence. Additionally, people frequently cross the border to try and find their disconnected families, further fanning the border's heat as border patrols try to keep the border locked up. This has resulted in the Wolga/Russian border being one of the most militarised sections of the wider Reich/USSR border and a source of heavy worries for both Germania and Moscow."
  
