 ARM_Armenian_Revival: "Revival of the Armenian Culture"
 ARM_Armenian_Revival_desc: "Armenia is a land that has undergone great tragedy in its history. A people tossed about among the Turkish, Russian and Iranian empires, it is a country that has been partitioned among its larger nations for centuries. The great calamity of 1942 occurred when the Turkish Axis forces invaded the Soviet Caucasian republics, and 'freed' the Armenian republic as an independent state following the collapse of the Soviet Union. Several traitorous Turkish Armenians sold their soul to the devils who committed the 1915 genocide, like Mıgdıç Şellefyan, and began the Turkification of our glorious lands by acting as collaborators to their Ankaran masters. \n\nRegardless of these mishaps, the story of Armenia being passed around its bigger neighbours has another new chapter written. The reinvigorated Soviet Union, following its victory in the Fourth Great Patriotic War, has reclaimed the Armenian Soviet Republic from the vile Turkish. At last, Armenia can once again experience its cultural freedoms and begin the process of de-Turkification. Collaborators that have served their Turkish overlords will be swiftly punished and sentenced, and our people can finally breathe a sigh of relief. The misery of 1915 and 1942 have at last been righted."

