 ANM_mex_extremist_watch_category_desc: "\n\n\n\n\n\n\nThe fragile democracy that we only recently secured after years of rule by one party is once again threatened by dark forces that would forever destroy our noble nation. On the left, the §RMovimiento por el Gobierno Autónomo§! demands full decentralization of all government authority, and is calling for a proletarian democracy, ruled by the disenfranchised and disillusioned of the rural provinces who feel abandoned by us. On the far right, the §OEjército Nacional Indígena Guerrila§! gathers support from the various indigenous groups that make up our nation, demanding full independence for the Chiapas region and restoration of native rule. \nWe must act quickly, or else our governments legitimacy will decrease and we will loose all support. §VFailing to secure the hearts and minds of our people will result in total catastrophe.§!\n\n§GLegitimacy§! is a measure of how well people respond to our rule and democratic mandate. If we fail to maintain enough legitimacy, for example by getting exposed for corruption or various other misdeeds, our legimacy will fall. Fighting crime and firing corrupt ministers will increase our legitimacy\n\nCurrently our government is perceived as: [getMEXLegitmacyanm]([?MEX_ANM_legitmacy|-0]) \n\nDEV NOTE: I need to create some variables to measure the strength of the extremist groups."
