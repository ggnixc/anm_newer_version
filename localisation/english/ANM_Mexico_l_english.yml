 MEX_Francisco_Labastida: "Francisco Labastida"
 MEX_Humberto_Roque_Villanueva: "Humberto Roque Villanueva"

 POLITICS_LUIS_DONALDO_COLOSIO: "Born to party veteran Luis Colosio Fernández, Luis Donaldo Colosio was always destined to be a member of the PRI. Studying economics at the Instituto Tecnológico y de Estudios Superiores de Monterrey, he would join Porfirio Muñoz Ledo’s cabinet as the Secretary of Budget and Planning. Influenced by populists like Carlos Madrazo and Javier Barros Sierra, Colosio would become a stalwart of the left-populists during the 80s, opposing the technocratic strain of governments under Jesús Reyes Heroes to Carlos Salinas de Gortari. Under Colosio’s tenure, the populist faction would transform into the Corriente Democratico, seeking to lead a widespread reformation of the PRI into a left-wing populist party guiding a genuine democratic transition. \n\nFollowing the retirement of Carlos Salinas de Gortari, Colosio was formally nominated as the PRI’s presidential candidate for the 1994 election, with the Populists finally dominating the factional composition of the PRI. The revolutionary mandate wielded by Colosio is a double-edged sword. Still, he is determined to use the power in his hands for good, finally making good on the original promises of the Mexican Revolution, as envisioned by Cardenas, Madrazo, Sierra, and Heroles."

 POLITICS_CUAUHTEMOC_CARDENAS: "Born May 1st, 1934, in Mexico City to the late former President Lázaro Cárdenas, Cuauhtémoc Cárdenas is Mexico's foremost democratic crusader. Champing himself as a reformer, Cárdenas rode the democratic current in the 80s, attempting to secure the office of President. However, Mexico’s globalization curtailed his presidential ambitions, leading to technocratic forces perpetrating the old-order status quo. \n\nNow, following his tenure as secretary of the Interior, Cardenas has ridden the popularity of the Colosio administration to the Presidency, winning the election on a broadly populist platform. It seems that the New Democratic Revolution will continue under Cardenas as the welfare state is entrenched and opposition parties left and right continue to be permitted in national elections. As his father led Mexico into the brave new world of the 20th century, it seems fate has tasked him with guiding Mexico into the order of the new millennium and ensuring its prosperity and stability."

 POLITICS_VICENTE_FOX: "Vicente Fox has achieved what seemed to be impossible by many. For the first time in 71 years, the PRI has been defeated in a Mexican election. Born in 1942 in Mexico City, Fox was born into a family of immigrants, with a father of German-American descent and a Basque mother. Following his graduation from the Harvard Business School, Fox entered into the field of politics, as a candidate for the PAN representing León. Running for the position of governor of Guanajuato in 1995, which he lost four years prior with allegations of election fraud, he was successfully elected. What differed Fox from his predecessors was that he promoted government efficiency, transparency and did not hide the expenses of the state from the people. Additionally, he also introduced policies that benefited the poor by allocating loans for them to purchase necessities. \n\nRunning as president to contest decades of PRI rule in Mexico, Fox has promised to extend to all of Mexico the reforms he had conducted in Guanajuato. As President, Fox is expected to continue to market reforms established by previous presidents, and a pivot towards America in foreign policy to take down the remaining autocrats in Latin America. Furthermore, Fox has championed Mexico to move away from secularism due to his nature as a devout catholic. He had sent a letter to the CEM before the election which outlined various reforms he would conduct in favour of Catholicism in Mexico, with notable details including his pro-life stance and allowing churches access to the media, privileges for priests, and tax cuts for churches. \n\nNo longer would the people suffer under the stagnation, corruption, and poverty of PRI rule. The Mexican people have given Fox a mandate to sweep it all away. It all comes down to whether or not Fox can enact his agenda to the fullest."

 POLITICS_FRANCISCO_LABASTIDA: "Another princeling within the PRI, inheriting a vast political background from his family, Francisco Labastida is not a populist like his predecessor but rather a pragmatist and rationalist. An economist by profession,  Labastida’s ascension to PRI would come during dramatic times, as Carlos Madrazo would take the helm of the revolutionary party and lead it on a course most bureaucrats despised him for. Belonging to the ever-longing opposition, Labastida would become a key player during the 80s, as a governor of Sinaloa, and advisor to Heroles. \n\nSpending most of his time organizing opposition to Colosio, it seems that the gambit has finally paid off, with inter-party opposition ousting the Corriente Democratico from power and nominating Labastida as the presidential candidate for 2000. Now steering the helm like his mentors did, he must tread a careful line between democracy and paternalism, and reignite the Developmental Revolution begun by his predecessors. Only time will tell if the old guard of the PRI will finally succeed, or if Labastida will be condemned to the footnotes of history."

 POLITICS_HUMBERTO_ROQUE: "A key leader of the inter-party opposition to Colosio, Humberto Roque Villaneuva is no stranger to power. Born in Torreon, Mexico, Villanueva's work in the PRI was mainly with the CTM, being seen as a more popular technocrat among Mexico's working class. But along with his popularity also comes rumors of corruption, denied as unfounded by the man himself. Defining himself as an idiosyncratic "populist technocrat", Villanueva has foregone Colosio's promises of democracy with a sole promise to keep the PRI in power, no matter what it takes. \n\nHis agenda of increased social welfare has resounded well among the Mexican population, with his strange blend of factional ideology propelling him to the top of the ladder, eventually earning the party's nomination for president for the 2000 election. Now in power, Villanueva is determined to make true his promise, resorting to whatever tactics he can find to keep the PRI, and more importantly himself, in power. But a man like him will not be hard to topple, especially a man with so many skeletons in his closet, so Villanueva must prove to the Mexican people that he can get it done, not out of the goodness of his heart, but for his own selfish goals."

