 POLITICS_ADOLFO_LOPEZ_MATEOS_DESC: "While the world journeys onwards with the cracking bells of revolution and the marching boots of invasion, some men must find themselves able to write themselves out of the hell of ignorance and resistance. Adolfo López Mateos stands as one of these men, dedicating himself as a man for his country in his work as a simple secretary before his rise to electoral success in the Mexican Senate, a place as equally fiery and changing as the Revolution that instituted it in the first place. Smiles, shaking hands, and attending parties would dominate his next few years, as through the hands of smiling friends in the Senate came the birth of his new title, as Secretary of Labor in the wake of the position's immense growth.\n\nAs the Nazi raged across Europe and the Japanese blitzed across the Pacific, Mexico stood shakily by, with Mateos swearing by the Estrada Doctrine as his gospel of neutrality in hopes of preserving a safe and secure Mexican nation. And through this neutrality came pesos for the Mexican, as Mateos continued to drive forth ideals of neutrality backed by Mexican nationalism, seeking to bring the Mexican working class together and managed to win the Presidency after his nomination by the Institutional Revolutionary Party in 1958. Through his Presidency, Mateos has worked diligently to ensure that the Mexican state maintains unity and independence past the grabbing hands of powers throughout the world.\n\nHowever, President Adolfo López Mateos's fight for Mexico's individuality continues to entrench itself across the country. Throughout the Mexican government, Senators, Deputies, and Mateos's own cabinet officials find themselves wooed by the ever growing influence of the Americans and the Japanese, where some have argued the path for Mexico's future, and the path to economic boom, lie. With discussions of trade and the end of Mateos's Presidency on the horizon, the questions of Mexico's future lie on everyone's mind, as the PRI's one party domination means a choice for Mateo to choose an heir to his Presidential throne, one who may throw the country to American or Japanese winds..."

 POLITICS_LUIS_ECHEVARRIA_DESC: "To much of the world, Luis Echeverría Álvarez is a chimera, a stitched-together symbol of everything wrong with the PRI.  To the people of Mexico, he is much the same, but he portrays himself as everything RIGHT with the PRI.  Born in Mexico City in 1922, Echeverría joined the party as a young man.  He quickly gained favor in the office of the Party President, and over the decades, he would move from job to job, culminating in a stint as Secretary of Exterior Relations.  Now, as President of the United Mexican States, he seeks to establish Mexico as a truly independent nation, insulated from the great power conflicts of the present age, and secure in its neutrality.  The American and Japanese corporate barons have other plans, of course, but they will face a fearsome man in Echeverría.  If he succeeds, Mexico will achieve that revolutionary goal of standing on its own, free from the interference of foreign capital.\n\nWith himself in charge, of course."

 POLITICS_RAUL_LOZANO_DESC: "Raul Salinas Lonzano is a true product of the twentieth century in Mexico, in both a positive and negative sense.\n\nBorn near the Mexico-U.S border in Nuevo Leon, Lonzano studied at the Autonomous University of Mexico, the American University in Washington, and Harvard before entering Mexican politics under the Mateos government. A classically liberal counter to the historically protectionist Mexican economic climate, his presidential nomination surprised many. He campaigned on lowering taxes and opening Mexico's borders to all sorts of foreign capital, positing an open economy to the path to national wealth. However, his ties to the gargantuan Japanese Zaibatsus have caused quite a bit of controversy, both in the Mexican political establishment and the American embassy in Mexico City. Whether or not his presidency will be a opening for Tokyo's influence in Latin America is yet to be seen.\n\nAlthough the idea of his government might seem discomforting to some, Lozano believes that the time has come for Mexico to forge its own path in the world."

 POLITICS_GUSTAVO_ORDAZ_DESC: "The dust has settled over the arid lands of Mexico, and with it, a new President and Face of the Institutional Revolutionary Party comes to sit in the greatest position in all of Mexico. Gustavo Díaz Ordaz, well-known for having worked as the Minister of the Interior under President Adolfo López Mateos, has come to power, leaving the youth and powerful in a state of unknown regarding the future of their country.\n\nPresident Ordaz, in his past, was well known for having a stone-cold attitude in regards to the fire of the youth, and has been either praised for, or accused of, depending on who you ask, masterminding the falls of various protests led by students and lesser-powerful social groups throughout Mexico. Meanwhile, the other most prominent feature of Ordaz's political past has been his fierce goading of the Mexican government towards a pro-American stance, and has been documented as having advocated for the pushing of greater nations towards the government of our Northern border. Some accuse Gustavo Díaz Ordaz as being backwater, and against reforms which may help reshape the national power of the Mexican nation through his undermining of student protests and other liberal-minded calls for change. Some accuse Gustavo Díaz Ordaz as being a sellout to both the United States government and the businessmen who trail behind it, willing to sell the Mexican nation into obedience towards the American President and his administration.\n\nNo matter who you ask, however, all can agree on one thing: Gustavo Díaz Ordaz is a man ready to dig in to preserve his country through the status-quo, and a man with a strong enough will to do it."

