MEX_manufacturing_giant: "The Manufacturing Giant"
MEX_manufacturing_giant_desc: "After decades of economic stagnation, the United States of Mexico has flourished in recent years as one of the world’s paramount manufacturing hubs, second only to the Republic of China. As corporations the world over look for ways to maximize profits, factory jobs that were once plentiful in the Global North have migrated south of the border, where lax work regulations have created a lucrative goldmine of cheap labor.\n\nThese days, “German” Volkswagens are really manufactured in Durango, “Japanese” electronics are assembled in Sonora, and “American” semiconductors come from an assembly line in Veracruz. Spanish may be far from the next lingua franca, but consumers around the world know exactly what is meant by “Hecho en Mexico”."
