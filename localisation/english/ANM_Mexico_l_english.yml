 MEX_despotism_party_long:0 "(Revolutionary Institutional Party)§F\n--------------\nThe PRI is heir to the triumphs and tragedies of the Mexican Revolution. Beholden to its promises of land reform and workers' rights, the party has devoted more effort into preventing its chaos and bloodshed yet again. Whether through Cárdenas's corporatist framework or national development, the PRI aims to ensure social peace and continued success for its vast electoral machine. All powerful, yet rigidly centralized, this Leviathan's course is to be set by the President's will.§!"

