 ########################

 MEX_Cuauhtemoc_Cardenas_Solorzano: "Cuauhtémoc Cárdenas Solórzano"
 MEX_Enrique_Cervantes_Aguirre: "Enrique Cervantes Aguirre"
 MEX_Carlos_Rojas_Gutierrez: "Carlos Rojas Gutiérrez"
 MEX_Javier_Trevino_Cantu: "Javier Treviño Cantú"

 MEX_Cuauhtemoc_Cardenas_Solorzano_hog_desc: "Born May 1st, 1934, in Mexico City to the late former President Lázaro Cárdenas, Cuauhtémoc Cárdenas is Mexico's foremost democratic crusader. Champing himself as a reformer, Cárdenas rode the democratic current in the 80s, attempting to secure the office of President. However, Mexico’s globalization curtailed his presidential ambitions, giving rise to technocratic forces who perpetrated the old-order status quo. \n\nNow, under President Colosio's efforts, the people's call for democracy is louder than ever. Cárdenas' dreams of presidency may not be so tarnished after all. As the new democratic current rises, Cárdenas leads the charge into the new millennium promising democratization, social reform, and an end to corruption."
 MEX_Enrique_Cervantes_Aguirre_sec_desc: "A graduate of the Heroico Colegio Militar,  Enrique Cervantes Aguirre is one of the foremost veterans within the Defense Ministry, appointed by Gortari to reform the military. Shoring up connections with the United States during his time as military attache, Aguirre would return to Mexico to take charge of his former alma mater, and later become the head logistician within the Mexican military. \n\nHis recent promotion comes after the stagnation of the army following the Mexican-Guatemalan war, following revolutionary flare-ups in Mexican-allied Guatemala. Kept in place by Colosio who saw his reform efforts as essential to safeguard Mexico, it is apparent that Aguirre is one of the key figures in the reformation of Mexico, protecting Mexico from external threats, and from both fascism and communism alike."
 MEX_Carlos_Rojas_Gutierrez_eco_desc: "An industrialist at heart, Carlos Rojas Gutiérrez grew up in Mexico city having earned a degree in Industrial engineering at La Universidad Nacional Autónoma de México the same university he would go on to teach. He joined the PRI in 1979 and 4 years later joined the Secretariat of Programming and Budget. \n\nOver a decade Gutiérrez would at first work as the undersecretary for the Secretariat of Programming and Budget before transferring to the Secretariat of Urban Development and Ecology to head the department as the new secretary. This was until the 1994 election which saw the regeneration of the Secretary of Commerce and Industrial Development and Gutiérrez’s appointment to the position."
 MEX_Javier_Trevino_Cantu_for_desc: "Javier Treviño Cantú was Born December 11th, 1960, in Nuevo León, Cantú attended both El Colegio de México and Harvard University, earning degrees in International Relations and in Public Policy respectively. He would then go on to become planning director for the nonprofit organization Arturo Rosenblueth Foundation before entering into the political scene. \n\nCantú would serve a number of positions in government from director of Social Communication, Minister of Information at the Mexican Embassy in the United States, and Secretary of Social Development till finally settling as Secretary of Foreign Relations. \n\nHe now oversees Mexico's renewed commitment to globalization, drawing the nation closer politically and economically to the United States and the greater free world."

 # National Sprits

 MEX_The_New_Popular_Revolution: "The New Popular Revolution"
 MEX_The_New_Popular_Revolution_desc: "In 1915, the Mexican Revolution triumphed over the forces of reaction and greed that were dooming the country. To safeguard everything the revolution sought to accomplish, the Partido Revolucionario Institucional was founded. \n\nNow, the PRI stands at the precipice of another revolution, begun by Carlos Madrazo and continued by Heroles and Colosio. This populist revolution seeks to transform the repressive Mexican party state into a democracy, tearing down the old order of political dominance and rigged elections. But as the PRI’s dominance over the government continues to unravel, the bloody past of Mexico’s dirty war must be unveiled, even as it tries to cover its faults."
 MEX_Those_In_The_Shadows: "Those in the Shadows"
 MEX_Those_In_The_Shadows_desc: "Ever since the establishment of modern Mexico, the specter of the drug trade has always haunted the nation. However, in recent times, the consolidation of the trade throughout Central America has led to the establishment of strong organized crime networks in Mexico, mainly focused on the drug trade. \n\nNow, the drug cartels are extrajudicial paramilitaries operating on Mexican soil, poisoning our nation with their vices, and killing anyone who opposes them. As the cartels grow stronger and stronger by the day, it becomes apparent that the Mexican government must take a firm stand against this new breed of criminal."
 MEX_The_Gilded_Rot: "The Gilded Rot"
 MEX_The_Gilded_Rot_desc: "With the economic renaissance of the 80s, the opening of Mexico to the world through the removal of trade barriers and trade agreements from the OFN and GEACPS has led to unbridled prosperity as domestic manufacturing and industrialization have skyrocketed. But along with this newfound abundance have come the ghosts of revolutionary past, the ghosts of corruption. \n\nThe party’s uninterrupted grip on power, along with economic control of the nation has led to a bureaucracy choking in the opulence of their new fortunes. As Colosio’s reforms threaten to take away their holdings, it seems that this new class of bureaucrat will not stand idly as the Popular New Revolution grips Mexico, and will fester the rot within the party’s shadows. "
 MEX_The_Rusting_Sword: "The Rusting Sword"
 MEX_The_Rusting_Sword_desc: "The Mexican army has been one of the most important institutions in Mexico. It was the initial vanguard of the revolution and defended Mexico from threats like Trujillo and communist insurgents. However, the army’s poor performance in the Mexican-Guatemalan War exposed the cracks within its foundation. \n\nSince then, the army reform issue has weighed quite heavily on the government, although no leader has scratched more than the surface with any attempt. As Mexico enters a millennium bound to be full of threats and dangers, the sword of the Revolution must be reforged."