 MEX_conservatism_party_1_long: "(Party of National Action)§F\n--------------\nDwarfed by the PRI Leviathan, its beleaguered opposition, the PAN, staggers on. Carrying the concerns of its largely middle class base, the party decries the overreach and corruption of Mexico's corporatist system, and calls for an end to the harsh atheism of years past. United in support of democracy, the PAN has experienced its lack for decades, a victim of consistent fraud and repression at the ballot box."

