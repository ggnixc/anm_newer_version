KazakhCrisis_Tab1_Rad_RUS_tt: "§F§YIvan Viktorov\n\nLeader of the §UProtectors of Rus§!§!\n\n--------------\n§LBiograph§!§!"
KazakhCrisis_Tab1_Rad_KAZ_tt: "§F§YNurulla Almagambetov\n\nLeader of the §sArmed Forces§!§!\n\n--------------\n§LBiograph§!§!"

KazakhCrisis_Tab1_Lib_title: "[KazakhCrisis_Tab1_GetLibTitle]"
KazakhCrisis_Tab1_Alash_title: "§MLIBERALS§!"
KazakhCrisis_Tab1_Guard_title: "§QNEUTRALS§!"
KazakhCrisis_Tab1_Lib_tt: "[KazakhCrisis_Tab1_GetLibTT]"
KazakhCrisis_Tab1_Lib_RUS_tt: "§F§YNikolai Shchelokov\n\nLeader of the §QRussian Guard§!§!\n\n--------------\n§LIn the vast expanse of Northern Kazakhstan, an unusual scene unfolded as Nikolai Anisimovich Shchelokov, a bureaucrat from Luhansk, became a regional police leader. His ascent was a byzantine chain of promotions—many he may not have been fully qualified for. Despite that, Russians loved him. He protected Russian businesses, lavishly rewarded Russian servants of the people, and stood up for Russian refugees entering the border. For some reason though, Kazakhs weren't quite as enamored.\n\nWhile deeply tied to the Soviet group, his devotion to Marxism was spotty. In spite of his outspokenness, few found coherence in the policies he espoused. What seemed to matter most to him was that he was revered as an icon, and a handful of roubles often put criticism to rest.\n\nAs war erupted, he took charge of the Russian Guard, militias devoted to the idea of the Russian state, whatever that might be. Shchelokov was the hero of Russia, the socialist union, Russia, the grand empire, and Russia, the country with the best benefit schemes. Whether this enigmatic man could unify these strange bedfellows and restore this brotherly republic to the loving embrace of the Motherland remained to be seen.§!§!"
KazakhCrisis_Tab1_Lib_KAZ_tt: "§F§YMakhmet Kulmagambet\n\nLeader of the §MAlash National Committee§!§!\n\n--------------\n§LBiograph§!§!"

KazakhCrisis_Tab1_Soc_title: "[KazakhCrisis_Tab1_GetSocTitle]"
KazakhCrisis_Tab1_Socialist_title: "§XSOCIALISTS§!"
KazakhCrisis_Tab1_Commie_title: "§ZCOMMUNISTS§!"
KazakhCrisis_Tab1_Soc_tt: "[KazakhCrisis_Tab1_GetSocTT]"
KazakhCrisis_Tab1_Soc_RUS_tt: "§F§YMikhail Solomentsev\n\nLeader of the §X1st Guard Army§!§!\n\n--------------\n§LMikhail Sergeyevich Solomentsev is nothing if not hard to pin down. To some audiences, he portrays himself as the only true communist left in Kazakhstan - yet he has a history of decidedly unprincipled scandals surrounding his marriage. He deplores "Kazakh chauvinism" in his every speech, and yet his "Soviet Group" works with open chauvinists more radical than he ever could be. How can one understand the man who never explains himself?\n\nThe answer is less interesting than one might expect. Solomentsev is not a radical Communist. He is tactical, and he has made many allies with many positions, but he simply sees his view of the Soviet Union as the norm, one he has held since he was first assigned to Kazakhstan in the twilight years of Stalin's government. To him, his love of Russia, Stalin, and the Former Union are all one and the same. All of this was the Soviet Union, the greatest nation ever created. All of this was ours.\n\nKazakhstan simply needs to understand this reality.§!§!"
KazakhCrisis_Tab1_Soc_KAZ_tt: "§F§YZhumabek Tashenev\n\nLeader of the §ZNational Communists§!§!\n\n--------------\n§LSince the era of Stalin, the Kazakh people have gradually grown independent. A new generation of thinkers in cities like Almaty see themselves not as continuing a Soviet project, but a uniquely Kazakh ideal, a series of values that allowed the Kazakh armies to protect Central Asia while so much of Russia fell into disunion. Zhumabek Tashenev, once just one of many such thinkers, now leads the nation.\n\nFrom first a series of publications and then an important post as deputy to Dinmukhamed Kunaev during his time in office, Tashenev has preached a vision of the Kazakh socialist government largely divorced from the wider Soviet project, citing a simple argument - the Soviet Union is no more. He sees the unwillingness to reorganize and redevelop as a concession to the Russians, and he has argued that this state of agrarian semi-independence only served to flatter the Russian imagination of Kazakhstan as their colony.\n\nAs civil war rages, he fears that he was right.!§!"

