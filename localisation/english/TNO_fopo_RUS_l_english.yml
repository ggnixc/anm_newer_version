KAZ_KazakhCrisis_Info_tt: "§F[KAZ.GetFlag] §MKazakhstan§! is the cradle of §RTurkic§! civilization, the §MGreat Steppe§!, Atameken. This land bears many names. For a long time, the §eheart of Eurasia§! remained an island of stability, but in the end, due to accumulated internal contradictions, a civil war between §BQZQ§! and §KOPSU§! broke out in the country. And this is the perfect chance for intervention by the one who ruled these territories for hundreds of years—[RWS.GetFlag][SIB.GetFlag]§KRussia§!.\n\nBoth [KAZ.GetFlag] §BQZQ§! and [KZR.GetFlag] §KOPSU§! include three factions each: §Uradicals§!, §Mliberals§!, and §Zsocialists§!. We should support the one whose ideology is closest to ours. If the political course of the current leadership runs §Rcounter§! to §Your§! interests, we can either §Yswitch sides§! in the conflict or §Gincrease§! our influence and the popularity of our desired faction through §Ydecisions§! to trigger a §gcoup d'état§!.\n\nAt the same time, we §Rmust not forget§! to keep an eye on the §Xother contender§! for the unification of Russia—they pursue their own ambitions, which will inevitably §Xclash§! with ours. If we both support the same ruling faction, we must remember: the one whose §Sinfluence§! over it is higher wins. In any case, our main goal is to maintain our §Sinfluence§! at a consistently §Ghigh§! level, keep a loyal faction in power, and direct the course of the war for the sake of §Gvictory§!. All necessary information is available on the three different tabs.§!"

## [=====| TABS |=====]

### [====| TAB 1 |====]

