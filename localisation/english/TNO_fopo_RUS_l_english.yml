KAZ_KazakhCrisis_RWS_Actual_tt: "The §Ywestern regime§! has endured through hard times, but they were §Rmore than wrong§! to compete with us."
KAZ_KazakhCrisis_SIB_Actual_tt: "The §Yregime of the wastelands§! has endured through many things, but §gPokoreniye Sibri§! may have to be §Rreenacted§!."

KAZ_KazakhCrisis_state_tt: "§Y[?ROOT.KAZ_KazakhCrisis_CorrespondingState^var:state_i.GetName]§!\nThis state is currently being controlled by: §Y[?KAZ.KazakhCrisis_StateController^var:state_i.GetNameWithFlag]§![KazakhCrisis_Map_GetKZPStatus]."
KZP_KazakhCrisis_Participant: ", which is in an alliance with the §Y[KZR.GetNameWithFlag]§!"
