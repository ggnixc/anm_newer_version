 ##Ideas##
 #########
 LAO_Socialism_Pan_Asianist_Characteristics: "Socialism with Pan-Asianist Characteristics"
 LAO_Socialism_Pan_Asianist_Characteristics_desc: "The Neo Lao Hak Sat champions itself as a revolutionary torchbearer within Southeast Asia, drawing broad internal party support from its commitment to socialist economic principles and Marxist ideals. At the same time, standing as a vocal advocate of pan-Asianism within the Sphere.\n\nHowever, the party's staunch loyalty to Tōkyō has begun to provoke growing reproval within its monolithic unity, predominantly from opposition factions and junior officials. Socialism's anti-imperialist essence clashes sharply with Japan's overt imperialist policies and is becoming increasingly difficult to reconcile. If left unresolved, this tension threatens to evolve from a minor rift into a full-blown schism. "
 LAO_Tripartite_Tug_of_War: "The Tripartite Tug of War"
 LAO_Tripartite_Tug_of_War_desc: "Laos stands at a pivotal crossroads of competing interests within the Sphere. While its loyalty to Japan and the broader Pan-Asianist vision remains evident, due to continued Japanese backing of competing local rivals; Thailand and Kampuchea, it has alienated the nation, making it hesitant to fully anchor itself to a single benefactor.\n\nSeeking to diversify its support, Laos has opened its doors to alternative avenues of aid, drawing attention from both Hindustan and China. Now entangled in a geopolitical tug-of-war between the three powers for influence as tensions mount, Laos finds itself teetering on the edge, and soon may be forced to choose a side."
 LAO_Golden_Shadow: "The Golden Shadow"
 LAO_Golden_Shadow_desc: "Despite being relentlessly hunted and fragmented over decades, the remnants of the National Revolutionary Army have managed to avoid total extinction, stubbornly maintaining their existence as a major thorn in the side of Laos. The once grand army of the Republic, now turned cartel state, finds refuge in the mountains of the Northern Shan region where it fuels its survival on vast opium trafficking networks.\n\nIn an attempt to deal with this multi-generational issue, once and for all China has committed to joint counter-narco operations aiming to bring a swift end to the NRA. However, behind closed doors, Thailand and Burma quietly bolster the NRA's strength, hoping to keep their rivals preoccupied."
 LAO_Never_Ending_War: "The Never-Ending War"
 LAO_Never_Ending_War_desc: "Prime Minister of Kampuchea Khieu Samphan has renewed his predecessor's aggressive rhetoric, boldly claiming the Laotian providence of Stung Treng. Kampuchea has taken an increasingly confrontational posture, recently staging a series of military exercises along its border with Laos.\n\nSeizing the opportunity to challenge Laos, Thailand has allied itself with Kampuchea, fully endorsing its position on the border issue. Meanwhile, Japan has taken a more pragmatic approach, supporting Kampuchea but withholding any unequivocal support. In response to Kampuchean revanchist policy along with their Thai backers, we have entered into joint military cooperation with Vietnam and China over the issue."

 #Leaders
 LAO_Samane_Vignaket: "Samane Vignaket"
 POLITICS_SAMANE_VIGNAKET_DESC: "An ethnic Vietnamese, born to a poor family in Laos, Samane Vigkanet has certainly come far from his hometown of Phichit. Joining the Lao Patriotic Front in 1948, Vigkanet would be one of the most prominent members of the NLHX Young Guard, one that reviled the Indochinese Communist Party and subscribed to the socialism of pan-Asianism. Instrumental in the efforts of the monarchy referendum, his connections would allow him to climb ranks in the party following the establishment of the republic, becoming the primary face of the young guard, along with Sisana Sisane, who would replace the traitorous Souphanavong as the country’s prime minister, and the NLHX’s leader.\n\nTaking over the mantle of leadership from his friend in 1989, Vignaket’s tenure as the Prime Minister of Laos has seen the gradual move away from Japan towards avenues like Kolkata and Nanjing, where the new Young Guard advocates for a complete renunciation of the Japanese imperialists. Ultimately a pragmatist, Vignaket will wait for the winds to blow in a certain direction before setting sail, whether that wind is red, blue, or green."
 
