 jet_bomber_equipment_engines: "Heavy Jet Engines"
 jet_bomber_equipment_engines_desc_REMOVE: "This piece of equipment has the same principles as its counterpart. However, a key difference is that the size of the turbine has increased to accommodate for an engine with a larger displacement, allowing for planes of heavier weight and increased payload to take flight, such as our bombers and transport planes."
