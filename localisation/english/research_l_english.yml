  ## Special Forces Generic ##
    special_forces_tech: "Special Forces Tech"
    tech_special_forces: "Special Forces"
    tech_special_forces_desc_REMOVE: "Unconventional fighting requires specialist training. We need to ensure that our troops are prepared and able to adapt to harsh conditions at a moment's notice."

    advanced_special_forces: "Advanced Special Forces Training"
    advanced_special_forces_desc_REMOVE: "With extensive training, we can ensure that our special forces will be able perform above and beyond that of normal men.\n\n"

    improved_special_forces:1 "Expanded Special Forces Program"
    improved_special_forces_desc:1 "Special forces are able to perform missions that ordinary soldiers can not. We need to expand the training programs to get more of our soldiers qualified.\n"

    extreme_environment_training: "Extreme Environment Training"
    extreme_environment_training_desc_REMOVE: "We need to be able to fight in the harshest of environments. With the right training and equipment, our troops will be able to fight in the most extreme conditions."

    survival_training: "Survival Training"
    survival_training_desc_REMOVE: "Our special forces will often fight behind enemy lines and with limited resources. We need to train them to endure harsh weather and fight with minimal supplies."

    elite_forces: "Elite Forces"
    elite_forces_desc_REMOVE: "Only the best of the best will become special forces. The soldiers that make it through the training will be stronger, faster and fight harder than anyone else."

    jungle_warfare: "Jungle Warfare"
    jungle_warfare_desc_REMOVE: "Special training to make our soldiers effective in the jungle."

    jungle_warfare1: "Harsh Terrain Training"
    jungle_warfare1_desc_REMOVE: "Special training to make our soldiers effective in harsh terrain. A focus on fast movement and strikes against the enemies will keep casualties low."

    infiltration_specialization: "Infiltration Specialization"
    infiltration_specialization_desc_REMOVE: "More training in urban warfare will make our soldiers more effective in the brutal door-to-door combat that occurs in the urban environment."

    SpecOps_Elite_of_the_Elite: "The Elite of the Elite"
    SpecOps_Elite_of_the_Elite_desc_REMOVE: "By investing more into more newly developed training and even better equipment we can make our special forces the spearhead of our army.\n"

    SpecOps_Independent_Strike_Groups: "Independent Strike Groups"
    SpecOps_Independent_Strike_Groups_desc_REMOVE: "Our special forces will take the form of a elite shadow group, deadly in all arts of infiltration and with special training in decimating the enemy with quick strikes behind their lines.\n"

    SpecOps_Assault_Squadrons: "Assault Squadrons"
    SpecOps_Assault_Squadrons_desc_REMOVE: "With a myriad of training in all kinds of warfare, our special forces will be ready for operations in any condition. Deceptive battles will make sure our units get the drop on their enemies.\n"

    SpecOps_Massed_Forces: "Massed Forces"
    SpecOps_Massed_Forces_desc_REMOVE: "Cost effective training and veteran recycling will make our special forces a large and deadly fighting force, ready at any time be deployed in large numbers.\n"

    SpecOps_Veteran_Experience: "Veteran Experience"
    SpecOps_Veteran_Experience_desc_REMOVE: "With a focus on veteran opportunities, our special forces will further be expanded with the addition of seasoned officers and captains, truly making it a fighting force to be reckoned with.\n"

    SpecOps_Army_Integration: "Army Integration"
    SpecOps_Army_Integration_desc_REMOVE: "Our special forces should be a standing and regular unit in our army groups. All divisions shall be fitted with trained specialists, ensuring that any and all situations can be dealt with.\n"
