   light_SPART_1980_soft_attack_2_desc_REMOVE: "Light self-propelled artillery is currently equipped with smaller-caliber weaponry. The addition of short-range machine guns will mean that these self-propelled artillery batteries still have some level of defensive capabilities."
   light_SPART_1980_soft_attack_3: "2010's Light SPART Shell Redesign"
   light_SPART_1980_soft_attack_3_desc_REMOVE: "Light self-propelled artillery has usually used simple shells without significant upgrade. By using new molding technologies and recalculating aerodynamics, we can make our shells go faster and longer."
   light_SPART_1980_armor: "2010's Light SPART Armor Upgrade"
   light_SPART_1980_armor_desc_REMOVE: "By refining our designs, our artillery will go farther and be more fuel efficient."
   light_SPART_1980_armor_2: "2010's Light SPART Ceramic Armor"
   light_SPART_1980_armor_2_desc_REMOVE: "New technologies like ceramic armor are becoming a mainstay in armored vehicles. Applying them to our self-propelled artillery will require some adaptation, but is a no-brainer."
   light_SPART_1980_armor_3: "2010's Light SPART Composite Armor"
   light_SPART_1980_armor_3_desc_REMOVE: "Composite armor is expensive and still a new field, but the promises it offers to protection and it's lightweight qualities are worthy of implementation across the field."
   SPART_1980_soft_attack: "2010's SPART Lighted Frame"
   SPART_1980_soft_attack_desc_REMOVE: "After early use of self-propelled artillery, the next advances made in the field allowed self-propelled artillery to be airdropped to support airborne forces."
   SPART_1980_soft_attack_2: "2010's SPART Larger Caliber Guns"
   SPART_1980_soft_attack_2_desc_REMOVE: "If there is one simple fact in war, it is that bigger guns and bigger bullets cause more destruction. There's no harm in increasing caliber size."
   SPART_1980_soft_attack_3: "2010's SPART Shell Redesign"
   SPART_1980_soft_attack_3_desc_REMOVE: "Self-propelled artillery has usually used simple shells without significant upgrade. By using new molding technologies and recalculating aerodynamics, we can make our shells go faster and longer."
   SPART_1980_armor: "2010's SPART Armor Upgrade"
   SPART_1980_armor_desc_REMOVE: "By refining our designs, our artillery will go farther and be more fuel efficient."
   SPART_1980_armor_2: "2010's SPART Ceramic Armor"
   SPART_1980_armor_2_desc_REMOVE: "New technologies like ceramic armor are becoming a mainstay in armored vehicles. Applying them to our self-propelled artillery will require some adaptation, but is a no-brainer."
   SPART_1980_armor_3: "2010's SPART Composite Armor"
   SPART_1980_armor_3_desc_REMOVE: "Composite armor is expensive and still a new field, but the promises it offers to protection and it's lightweight qualities are worthy of implementation across the field."
   artillery_1980_soft_attack: "2010's Artillery Armament Upgrade"
   artillery_1980_soft_attack_desc_REMOVE: "Compounding on earlier designs, these shells pack a higher yield for a lower cost. Effective at softening hard targets, as well as providing fire support, they are a must have in modern warfare."
   artillery_1980_soft_attack_2: "2010's Artillery 'Base Bleed'"
   artillery_1980_soft_attack_2_desc_REMOVE: "One innovation recently developed in artillery to increase range is "base bleed" - a controlled amount of fuel being let go out of the back of the shell in order to increase aerodynamic efficiency. When engineered correctly, this technique can allow shells to go 18-30% farther."
   artillery_1980_soft_attack_3: "2010's Artillery Rocket Assisted Projectiles"
   artillery_1980_soft_attack_3_desc_REMOVE: "While perhaps the most expensive option, rocket assisted projectiles have small rocket engines inside that can shoot shells as far as practically needed."
   light_SPAA_1980_air_attack: "2010's Light SPAA Armament Upgrade"
   light_SPAA_1980_air_attack_desc_REMOVE: "With additional seed the light SPAA is capable of quickly maneuvering to strategic positions in order to support infantry against enemy aircraft."
   light_SPAA_1980_air_attack_2: "2010's Light SPAA Larger Guns"
   light_SPAA_1980_air_attack_2_desc_REMOVE: "Jet planes have rendered the smaller caliber weapons of the past useless. Larger guns, with longer ranges and faster shell velocities, are the only real practical option in our new, terrifying world."
   light_SPAA_1980_air_attack_3: "2010's Light SPAA Radar Guides"
   light_SPAA_1980_air_attack_3_desc_REMOVE: "With conventional guns it is almost impossible to take down jets. However, the introduction of radar guiding will allow for bullets to land, even with a ton of inaccuracy."
   light_SPAA_1980_armor: "2010's Light SPAA Armor Upgrade"
   light_SPAA_1980_armor_desc_REMOVE: "By refining our designs, our anti-aircraft weapons will go farther and be more fuel efficient."
   light_SPAA_1980_armor_2: "2010's Light SPAA Ceramic Armor"
   light_SPAA_1980_armor_2_desc_REMOVE: "New technologies like ceramic armor are becoming a mainstay in armored vehicles. Applying them to our self-propelled anti-aircraft weapons will require some adaptation, but is a no-brainer."
   light_SPAA_1980_armor_3: "2010's Light SPAA Composite Armor"
   light_SPAA_1980_armor_3_desc_REMOVE: "Composite armor is expensive and still a new field, but the promises it offers to protection and it's lightweight qualities are worthy of implementation across the field."
   SPAA_1980_air_attack: "2010's SPAA Armament Upgrade"
   SPAA_1980_air_attack_desc_REMOVE: "With the onset of the Cold War, the SPAA increased in the power of the gun-based platforms and increased range to better combat jet aircraft."
   SPAA_1980_air_attack_2: "2010's SPAA Larger Guns"
