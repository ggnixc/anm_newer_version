  mountain_gun: "Mountain Gun"
  mountain_gun_desc_REMOVE: "The mountainous terrain of Northern India led to the development of an artillery piece that could be dismantled and carried on muleback to wherever it was needed."
  
  ## Rocket Arty (OLD)
  rocket_artillery2: "Rocket Artillery Upgrade I"
  rocket_artillery2_desc_REMOVE: "Self-propelled artillery utilizing multiple rockets will be able to cause large-scale destruction rapidly, while maintaining mobility to avoid counter-fire."
  rocket_artillery3: "Rocket Artillery Upgrade II"
  rocket_artillery3_desc_REMOVE: "Sacrificing range for impact, we can mount heavier rockets on larger vehicles. Operating in teams, these artillery batteries can cooperate to reload and relocate quickly."
  rocket_artillery4: "Rocket Artillery III"
  rocket_artillery4_desc_REMOVE: "Spin-stabilized rockets can increase the range of lighter artillery batteries."

  ## Anti-Tank (OLD)
  antitank1: "Anti-Tank Upgrade"
  antitank1_desc_REMOVE: "The importance of effective anti-tank weapons was established in the Great War. Introducing a new generation of these weapons will be necessary to combat modern tank designs."
  antitank2: "Anti-Tank II"
  antitank2_desc_REMOVE: "Most anti-tank guns are so far fairly light. Larger caliber guns will be required to combat heavier tanks with sloped armor."
  antitank3: "Improved Anti-Tank Upgrade I"
  antitank3_desc_REMOVE: "HEAT (high-explosive anti-tank) rounds can be used in anti-tank artillery to make up for limited muzzle velocity."
  antitank4: "Improved Anti-Tank Upgrade II"
  antitank4_desc_REMOVE: "New versatile anti-tank guns employing armor-piercing discarding sabot shots can penetrate the armor of nearly any tank."
  antitank5: "Anti-Tank V"
  antitank5_desc_REMOVE: "By combining different kinds of new ammunition technology with guns with higher muzzle velocities, we can be prepared for whatever new armor our enemies may develop."

  ## Anti-Air (OLD)
  antiair1: "Anti-Air Upgrade"
  antiair1_desc_REMOVE: "With faster reloading mechanisms, anti-air guns carrying large rounds can still maintain necessary firing rates."
  antiair2: "Anti-Air II"
  antiair2_desc_REMOVE: "To target high-flying aircraft, longer cartridges and barrels will be needed on anti-air guns."
  antiair3: "Improved Anti-Air Upgrade I"
  antiair3_desc_REMOVE: "As radar systems improve, employing radar direction of anti-aircraft guns becomes more viable. Keeping up with this technology will allow us to make some of the most accurate anti-air systems available."
  antiair4: "Improved Anti-Air Upgrade II"
  antiair4_desc_REMOVE: "Combining modern systems of radar, computerization and autoloaders will be necessary to react quickly against faster aircraft."
  antiair5: "Anti-Air V"
  antiair5_desc_REMOVE: "Surface-to-air missiles are the future of anti-aircraft warfare. Developing a mobile platform for these should be our next goal."
