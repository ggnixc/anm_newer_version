 combined_operations_desc_REMOVE: "The intergration of land and air forces in combined arms warfare can allow seamless coordination between the two branches"
 army_interoperability: "Digital Communications"
 army_interoperability_desc_REMOVE: " "
 global_positioning_system_doctrinetech: "Global Positioning System"
 global_positioning_system_doctrinetech_desc_REMOVE: "Utilization of satillite technology in order to geolocate our troops can bring units together closer and thus fight more effectively"
 
 support_companies: "Interservice Cooperation"
 support_companies_desc_REMOVE: "By further developing strategies that would induce cooperation between military branches we can the reduce problem of inter-branch rivalries."
 tactical_support: "Unity of Effort"
 tactical_support_desc_REMOVE: "Unity of effort means practitioners of joint warfare must acknowledge the importance of the inter-agency process, including the priorities, capabilities, and resources of other non-uniformed agencies"
 unity_of_command: "Unity of Command"
 unity_of_command_desc_REMOVE: "Unity of command means that all forces operate under a single commander with the requisite authority to direct all forces employed in pursuit of a common purpose. Unity of command may not always be possible, but the requirement for unity of effort becomes paramount."
 
 
 artillery_barrage: "Echelon Communication"
 artillery_barrage_desc_REMOVE: "The increased capabilities of data transmission have allowed higher ranking generals to understand situations on the battlefield"
 preemptive_strike: "Self-Synchronisation"
 preemptive_strike_desc_REMOVE: "Through the use of improved communications our plans on the field can be done on unison"
 self_synchronisation: "C2: Command and Control"
 self_synchronisation_desc_REMOVE: "C2 are organizational and technical attributes processes that employs human, physical, and information resources to solve problems and accomplish missions to achieve the goals for our objective"
 
 
 organic_units: "Global Information Grid"
 organic_units_desc_REMOVE: "By acquring the neccessary system, equipment, software, or service that transmits, stores, or processes information we can then use that to achieve information superiority"
 
 land_navy_coordination: "R3FIA"
 land_navy_coordination_desc_REMOVE: "Robust, Resilience, Responsiveness, Flexibility, Innovation, Adapation are the key philosophies of Power to the Edge and understanding these theoretical concepts may help us win the next battles"
 marine_elite: "Elite Marines"
 marine_elite_desc_REMOVE: "Dedicated Marine units are vital to the modern battlefield. Trained to carry out a variety of expeditionary operations, amphibious or otherwise, they pick up the slack left by other armed forces. Our marines will be dutiful, competent, and ready for asymmetrical warfare.\n\n"
 commando_landing_operations: "Commando Landing Operations"
 commando_landing_operations_desc_REMOVE: "By using reliable and covert insertion methods, we can deploy our elite commando units behind the enemy lines to wreak havoc upon their organization, morale, and supply lines. These tactics are specially effective in reducing the effectiveness of enemy forces in preparation for larger operations\n\n"

 airland_strikes: "3A"
 airland_strikes_desc_REMOVE: "By following the 3A, Assured System and Network Availability"
 vertical_envelopement: "Battle Space"
 vertical_envelopement_desc_REMOVE: "Battle-space is a term used to signify a unified military strategy to integrate and combine armed forces for the military theatre of operations"
 air_ground_task_forces: "Full Spectrum Dominance"
 air_ground_task_forces_desc_REMOVE: "Also known as full-spectrum superiority, is a military entity's achievement of control over all dimensions of the battlespace, effectively possessing an overwhelming diversity of resources in such areas as terrestrial, aerial, maritime, subterranean, extraterrestrial, psychological, and bio- or cyber-technological warfare."
 
 ## Maneuver Warfare
 maneuver_warfare: "Guerilla Warfare"
 maneuver_warfare_desc_REMOVE: "The enemy advances, we retreat; the enemy camps, we harass; the enemy tires, we attack; the enemy retreats, we pursue."
 
 night_assault_tactics_anm: "Night Assault Tactics"
 night_assault_tactics_anm_desc_REMOVE: "Soldiers who are used to moving and fighting at night can either pre-position themselves for an attack, or directly attack unsuspecting enemy forces."
 
 fabian_strategies: "Fabian Strategy"
 fabian_strategies_desc_REMOVE: "Fabian strategy is a military strategy where pitched battles and frontal assaults are avoided in favor of wearing down an opponent through a war of attrition and indirection. While avoiding decisive battles, the side employing this strategy harasses its enemy through skirmishes to cause attrition, disrupt supply and affect morale. "
 
 
 
 schwerpunkt_tactics: "Infiltration Assault"
 schwerpunkt_tactics_desc_REMOVE: "In the opening moves of an attack infantry must target weak points in the enemy line to bypass and isolate the more well-defended sections; which can then be wiped out by the rest of the attacking forces "
 spearpoints: "Infiltration In-Depth"
 spearpoints_desc_REMOVE: "Our forces are now trained to bypass and isolate enemy strongpoints to a much greater depth, ideally our assault forces should not stop until they reach the enemy's rear areas and their forces are completely cut off."
 swarming: "Swarming"
 swarming_desc_REMOVE: "By surrounding our enemies through numbers. intelligence, and local surroundings, we can we overwhelm them before they have time to respond"
 improvized_explosive_devices: "Improvized Explosive Devices"
 improvized_explosive_devices_desc_REMOVE: "The large scale use of IED's can hamstring enemy combatants so severly that it can reduce our enemies ability to move safely."
 nondiscriminatory_conscription: "Nondiscriminatory Conscription"
 nondiscriminatory_conscription_desc_REMOVE: "Elderly, Children, Invalids and cripples are just another source to be used to fight our enemies. There can be no such thing as a civilian."
 suicide_bombers: "Suicide Bombers"
 suicide_bombers_desc_REMOVE: "The will of our people is greater than the will of the enemy. By strapping bombs to our soldiers we can strike true fear into our enemies "
 cyberwarfare: "Cyberwarfare"
 cyberwarfare_desc_REMOVE: "Cyberwarfare is the use of digital attacks against an enemy state, causing comparable harm to actual warfare andfor disrupting the vital computer systems. Many countries have active cyber capabilities for offensive and defensive operations. There is significant debate among experts regarding the definition of cyberwarfare, and even if such a thing exists."

 rapid_response: "Shock and Awe"
 rapid_response_desc_REMOVE: "Even a well-prepared enemy can be thrown off of their footing by an impressive enough display of firepower and force. By leveraging massed artillery fire, coordinated air strikes, and overwhelming numbers at the point of contact any enemy can be crushed.\n\n""
 force_concentration: "Force Concentration"
 force_concentration_desc_REMOVE: "By concentrating our mechanized and armored forces to strike weakpoints in enemy lines we would be able to encircle and/or disorganize them "
 infrastructural_servicing: "Infrastructural Servicing"
 infrastructural_servicing_desc_REMOVE: "The safety and maintenance of logistical lines is important for any large-scaled operations "
 disbursal_anm: "Disbursal"
 disbursal_anm_desc_REMOVE: "Disbursal is a concept where miltary units are distributed and spread out to find targets, gather intel, and secure lightly defended infrastructure."
 coalescence_anm: "Coalescence"
 coalescence_anm_desc_REMOVE: "Coalesce is a concept in which units team up to concentrate all of their firepower on large, heavily defended targets of opportunity, high value targets, perhaps with the aid of air and sea-based bombardment."
 pathogenic_response: "Pathogenic Response"
 pathogenic_response_desc_REMOVE: "Distributed Operations is like an immune system, pathogens are found and destroyed, with close coordination with supporting elements to destroy such pathogen"
 database_collection: "Database Collection"
 database_collection_desc_REMOVE: "By Gathering operational intel on the enemy, we can effectively utilize our forces to maximal extent"
 information_warfare: "Information Warfare"
 information_warfare_desc_REMOVE: "Information warfare is the manipulation of information trusted by a target without the target's awareness so that the target will make decisions against their interest but in the interest of the one conducting information warfare. It is much broader than cyberwarfare."
 electronic_warfare_department: "Electronic Warfare Department"
 electronic_warfare_department_desc_REMOVE: "By having specific detachments dedicated to the utilization or combatment of electronic elements we can ensure that our army understands the importance of the digital world"
 combined_action_programs: "Combined Action Programs"
 combined_action_programs_desc_REMOVE: "Developed and tested during the South African War by Reichkommissariat units, military units are placed near possible areas of insurgent operations alongside close coordination of local elements are to hunt, destroy, and protect needed areas"
 command_and_obedience: "Command and Obedience"
 command_and_obedience_desc_REMOVE: "A Military organization must be able to exercise authority and direction in order to achieve it's objective in the field"
 citizens_in_uniform: "Citizens in Uniform"
 citizens_in_uniform_desc_REMOVE: "Soldiers are obedient to both their commanders and to the state. By instilling their loyalties to that only we can ensure that our lowly troops are dedicated and non-interfering in civilian politics"
 commanders_intent: "Commanders Intent"
 commanders_intent_desc_REMOVE: "A Commander on the field or higher up must always have a common goal for the operations as a whole, both to maintain cohesion and flexibility."
 digital_communications: "Digital Communications"
 digital_communications_desc_REMOVE: "The 21st Century offers new technological advancments in communications. By intergrating these technologies within our army we can respond to threats with immediate action"
 subordinate_control: "Subordinate Control"
 subordinate_control_desc_REMOVE: "By allowing lower ranking officers and, (if needed) nco's, in order to make battlefield decisions so that we can ensure flexibility in an everchanging plan"
 concepts_of_annihiliation: "Concepts of Annihilation"
 concepts_of_annihiliation_desc_REMOVE: ""Schwerpunkt", "Blitzkrieg", "Vernichtungsschlacht", all of these are old age ideas of war that enabled military forces to destroy enemy cohesion of both the ability to fight offensively and defensively. By continuing to teach these methods and intergrating modern advances, we can achieve effectiveness that the modern world offers    "
 division_and_conquest: "Backline Reserves"
 division_and_conquest_desc_REMOVE: "If our forces are ever caught on the backfoot of an enemy spearhead, the utilization of backline reserves to both thin and distract enemies are important in keeping the front stable"
 
 massive_bombardment: "Cordon & Search"
 massive_bombardment_desc_REMOVE: "Cordon and search is a military tactic to cordon off an area and search the premises for weapons or insurgents. It is one of the basic counterinsurgency operations."
 overwhelming_strikes: "Aerial Sweep"
 overwhelming_strikes_desc_REMOVE: "By utilizing the vertical aspect of warfare we can easily track down and destroy insurgents with ease "
 combined_blitz: "Pocket Defense"
 combined_blitz_desc_REMOVE: "It is possible that, on the defensive, our troops may be caught in a pocket. In this case, they must hold out until reinforcements can relieve them."
 
 demining_landdoctrine: "Demining"
 demining_landdoctrine_desc_REMOVE: "The widespread use of hidden explosives have placed a priority to intergrate technology with existing strategies to remove such threats."
 forward_operating_bases: "Forward Operating Bases"
 forward_operating_bases_desc_REMOVE: "By creating localized areas of control we can effectively respond to any threats rather than amass our troops in one singular area."
 sniper_infiltration: "Sniper Infiltration"
 sniper_infiltration_desc_REMOVE: "Snipers are capable of reporting insurgent activity, taking out high value targets, and help manage support operations making them extremely valuable and flexible  "
 
 adaptive_command_training: "Adaptive Command Training"
 adaptive_command_training_desc_REMOVE: "The tides of war can be as unpredictable as those of a stormy sea, and we must train our officers to account for this reality. Soon not even surprise and circumstance are acceptable excuses.\n\n"
 mission_type_tactics: "Mission-Type Tactics"
 mission_type_tactics_desc_REMOVE: "While we cannot always expect our officers to predict the circumstances of combat, we can train them in every scenario we can think of. The more familiar they become with the situations they are likely to encounter, the better our officers will be able to confront our enemies in a more efficient fashion.\n\n"
 military_deception: "Military Deception"
 military_deception_desc_REMOVE: "Part of the problem of adopting a strategy used to win the biggest war in history is that tactics are developed to counter it. Our enemies are doubtless ready to rush reinforcements to wherever we attack - therefore, we shall use feints to trick them into sending their forces away from the true battle.\n\n"

 assault_concentration: "Assault Concentration"
 assault_concentration_desc_REMOVE: "Our officers shall conduct en masse attacks as resources and war's fortunes permit. They may be adepts in fighting equal or superior forces, but they are savants in fighting with the deck stacked in their favor.\n\n"
 strategic_depth_exploitation: "Strategic Depth Exploitation"
 strategic_depth_exploitation_desc_REMOVE: "We will strive to keep a significant distance between our front lines and the vulnerable home front. The use of depots and armories along the routes and airports for transportation will ensure that we are able to attack and defend without worrying about throwing our defenses into disarray.\n\n"
 supply_chain_extension: "Supply-Chain Extension"
 supply_chain_extension_desc_REMOVE: "Fighting deep into enemy territory is often required of the mobile modern army, likewise leaving them vulnerable to supply shortages and encirclement. We will train our generals to extend their supply lines through the use of rear echelon forces and garrisons that can secure the roads from home.\n\n"

 shock_and_awe: "Shock And Awe"
 shock_and_awe_desc_REMOVE: "Even a well-prepared enemy can be thrown off of their footing by an impressive enough display of firepower and force. By leveraging massed artillery fire, coordinated air strikes, and overwhelming numbers at the point of contact any enemy can be crushed.\n\n"

 ## Strategic Theorem
 strategic_theorem: "Wartime Industry"
 strategic_theorem_desc_REMOVE: "Napoleon had learned that an army marches on his stomach; a century and a half later, the army's stomach has grown enough to necessitate a nation's worth of factories and workers. Ours shall step up to the task.\n\n"
 deep_operations: "Deep Operations"
 deep_operations_desc_REMOVE: "The concept of Deep Operations, or Deep Battle, is to break through the enemy's defensive lines at multiple points and destroy his operational reserves, his operational depth, and occupy as much of his strategic depth as possible."

 central_communications: "Central Communications"
 central_communications_desc_REMOVE: "By organizing our  communications networks where command can respond effectively to the problems in battle"
 
 prepared_defense: "National Reservists"
 prepared_defense_desc_REMOVE: "By forming a national registry of able-bodied soldiers, we can be ready to mobilize vast amounts of troops in short time."
 army_reserve_training: "Strategic Defense Plan"
 army_reserve_training_desc_REMOVE: "The forumlation of defense plans for the protection of vital areas in our nation will guarentee success in the future"
 infrastructural_reserve: "Simultative Military Exercises"
 infrastructural_reserve_desc_REMOVE: "By training our armies in large-scale military exercies. We can test our military capabilities and doctrines for future conflicts"
 
 operational_assault: "Operational Concentration"
 operational_assault_desc_REMOVE: "By bringing bear overwhelming superiority in certain, more concentrated points. Our army could achieve local ground breakthroughs"
 large_front_operations: "Combined Supply Chains"
 large_front_operations_desc_REMOVE: "It is vital that we utilize a variety of supply chain methods to ensure that any operations that we do can be properly supplied"
 overwhelming_force: "Complex Defeat"
 overwhelming_force_desc_REMOVE: "Complex defeat emphasizes military hostilities at a time, date, and location of its choosing, the terms of its choosing, and extensive preparation of the battlespace for operations and the ultimately, the defeat of the enemy"
 
 comprehensive_strategic_analysis: "Force Multiplication"
 comprehensive_strategic_analysis_desc_REMOVE: "force multiplication or a force multiplier is a factor or a combination of factors that gives personnel or weapons the ability to accomplish greater feats than without it."
 large_scale_exercises: "Large Scale Exercises"
 large_scale_exercises_desc_REMOVE: "Individual recruit training is of course, a requirement for any professional army, but so too is strategic training. Using divisions, corps, and even entire armies we can simulate massive battlefields in which our generals will be able to learn the skills of directing troops and our soldiers will better learn to fight in their greater roles together.\n\n"

 supply_routes: "System Warfare"
 supply_routes_desc_REMOVE: "By not limiting development and operations, command information systems throughout the chain of command can be shared and increased due to the robustness of the military transmission network"
 wartime_industry: "Active Defense"
 wartime_industry_desc_REMOVE: "It is imperative that in our strategy that we choose a time and place favorable to the success of military operations "
 the_art_of_war: "The Art of War"
 the_art_of_war_desc_REMOVE: "Old Age deceptions from millennias ago still have use today. By understanding these techniques in the modern day, we can ensure that our strategical plans are not laid to waste"
 
 strategic_cycles: "Nonkinetic Warfare"
 strategic_cycles_desc_REMOVE: " non-kinetic warfare strategies include disinformation campaigns, cyber attacks, and economic espionage against us. Thus we must develop countermeasure systems that protect our forces both in high command and in the field"
 concurrent_front_assaults: "Infrastructural Targeting"
 concurrent_front_assaults_desc_REMOVE: "By targeting infastructure vulnerable to hacking, such as power plants, we can effectively cripple an enemies ability respond quickly"
 digital_combat_units: "Digital Combat Units"
 digital_combat_units_desc_REMOVE: "In the world of the information age, digital combat units specialize in taking down, hacking, and confusing advanced enemy equipment"
