 DECEPTIVE_STRATEGEMS_LABEL: "DECEPTIVE STRATEGEMS"
 DECEPTIVE_STRATEGEMS_LABEL_TT: "Deceptive Strategems emphasize the importance of confusing and diverting enemy from our main objectives "
 BATTLESPACE_DESTABILISATION_LABEL: "BATTLESPACE DESTABILISATION"
 BATTLESPACE_DESTABILISATION_LABEL_TT: "Armies are made of weapons, tech, and men that work together in a system, that system is called battlespace. Thus by destabilizing one or two of said systems, we can seriously dampen or cripple an enemies ability to fight "
 
 DISTRIBUTED_OPERATIONS_LABEL: "DISTRIBUTED OPERATIONS"
 DISTRIBUTED_OPERATIONS_LABEL_TT: "Distributed Operations (DO) is a war-fighting concept drafted by the German Heer and developed primarily as a response to the changing environment of the Global War on Terror. Adaptive enemies and a more complex environment were seen as requiring conventional forces to maintain the ability to decentralize decision making and distribute their forces in order maximize Task Force ability to employ tactical units across the depth and breadth of a non-linear battlespace."
 LEADING_BY_MISSION_LABEL: "LEADING BY MISSION"
 LEADING_BY_MISSION_LABEL_TT: "Better known as Mission-Type Tactics or "Auftragstaktik" is a form of military tactics where the emphasis is on the outcome of a mission rather than the specific means of achieving it. Mission-type tactics have been a central component of the military tactics of German armed forces since the 19th century. "
 
 MISSION_COMMAND_LABEL: "MISSION COMMAND"
 MISSION_COMMAND_LABEL_TT: "Drawing elements from German Heer \"Mission Type Tactics\", Mission command seeks to harmonize both high command and the decentralized execution of military operations "
 JOINT_WARFARE_LABEL: "JOINT WARFARE"
 JOINT_WARFARE_LABEL_TT: "Joint warfare is in essence a form of combined arms warfare on a larger. national scale. in which complementary forces from a states army, navy, air, and special forces are meant to work together in joint operations, rather than planning and executing military operations separate from each other. "
 
 POWER_TO_THE_EDGE_LABEL: "POWER TO THE EDGE"
 POWER_TO_THE_EDGE_LABEL_TT: "Power to the edge refers to the ability of an organization to dynamically synchronize its actions; achieve command and control (C2) agility; and increase the speed of command over a robust, networked arid."
 NETOPS_LABEL: "NETOPS"
 NETOPS_LABEL_TT: "NetOps is the operational, organizational, and technical capabilities for operating and defending the Global Information Grid. "
 
 DESPERATE_DEFENSE_LABEL: "IRREGULAR STRATEGIES"
 DESPERATE_DEFENSE_LABEL_TT: "Irregular warfare is warfare employing the tactics commonly used by irregular military organizations. This involves avoiding large-scale combat, and focusing on small, stealthy, hit and-run engagements"
 MODERN_BLITZKRIEG_LABEL: "COUNTERINSURGENCY OPERATIONS"
 MODERN_BLITZKRIEG_LABEL_TT: "The totality of actions aimed at defeating irregular forces. Counterinsurgency may involve attempting to win the hearts and minds of populations supporting the insurgency. Alternately, it may be waged in an attempt to intimidate or eliminate civilian populations suspected of loyalty to the insurgency through indiscriminate violence."
 DISPERSED_SUPPORT_LABEL: "SOCIETAL MOBILISATION"
 DISPERSED_SUPPORT_LABEL_TT: "Mobilizing society itself in its role to the build-up to war. we can be prepared to respond to threats both domestically and internationally."
 INTEGRATED_SUPPORT_LABEL: "OPERATIONAL WARFARE"
 INTEGRATED_SUPPORT_LABEL_TT: "Operational Warfare sacrifices tactical flexibility and adaptability for strategic and operational flexibility and adaptability: tactical personnel are trained as relatively inflexible executors of specific, detailed orders, while the operational-strategic level of military doctrine is where most innovation takes place."
 AIRLAND_BATTLE_LABEL: "NATIONAL CAUSE"
 AIRLAND_BATTLE_LABEL_TT: "Rally the population in the name of warfare and the nation."
 SHOCK_AND_AWE_LABEL: "DEFENSIVE STRATAGEM"
 SHOCK_AND_AWE_LABEL_TT: "Mobilizing society itself in its role to the build-up to war, we can be prepared to respond to threats both domestically and internationally."
 ASSAULT_LABEL: "TRAINING"
 ASSAULT_LABEL_TT: "Create well designed and efficient ways of training to prepare troops for warfare."
 INFILTRATION_LABEL: "INDUSTRY"
 INFILTRATION_LABEL_TT: "Design your infrastructure and production to be ready for the challenges of warfare."
 OFFENSIVE_LABEL: "OFFENSIVE THEORY"
 OFFENSIVE_LABEL_TT: "Focus on overwhelming offensive force."
 DEFENSIVE_LABEL: "DEFENSIVE THEORY"
 DEFENSIVE_LABEL_TT: "Focus on a strong, flexible defense."
 DEEP_BATTLE_LABEL: "DEEP BATTLE"
 DEEP_BATTLE_LABEL_TT: "Improve support and abilities to strike deep into enemy territory."
 MASS_MOBILIZATION_LABEL: "MASS MOBILIZATION"
 MASS_MOBILIZATION_LABEL_TT: "Maximize recruitment and strength in numbers."
 FLEET_IN_BEING_DESC: "While we may not have the conditions to deploy a mighty fleet on the blue seas we are to make sure to defend our coastal areas by the means of littoral warfare."
 TRADE_INTERDICTION_DESC: "Against a stronger naval opponent we can focus on tying up their fleet and destroying supply lines to starve their war machine."
 BASE_STRIKE_DESC: "Our nation's navy shall be large and flexible - a force powerful enough to project power and contest the high seas."
 AIR_SUPERIORITY_DESC: "Our fighters are the backbone of the air force and both defend our skies, escort bombers and clear the skies of enemies for our ground troops."
 BATTLEFIELD_SUPPORT_DESC:1 "Our air force will completely control the skies, maintaining a degree of air superiority where the opposing air force will be incapable of effective interference. We must be able to provide air support to our military options around the globe, and have a fully equipped long-range bomber fleet that can strike anytime, anywhere."
 OPERATIONAL_INTEGRITY_DESC: "Our nation's airspace is our own, and we require an air force that is fully capable of protecting the skies over our country. We will maintain local dominance in order to provide full support to our ground and sea forces, without prohibitive interference by opposing air units."
 STRATEGIC_DESTRUCTION_DESC: "The main goal of our air force will be to provide air support for units in the field. While our air force may not be the biggest, having dedicated COIN aircraft and light helicopters can make a large difference in low-intensity or guerrilla engagements."
