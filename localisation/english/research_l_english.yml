 ### Electro-Mechanical Engineering
 electronic_mechanical_engineering: "Electronic Mechanical Engineering"
 electronic_mechanical_engineering_desc_REMOVE: "The digital revolution has changed industry, information and warfare forever and even greater possibilities await. These technologies form the core of a new industrial revolution."
 
 ## Radio & Radar
 radio: "Radio"
 radio_desc_REMOVE: "Adopting the inventions of amateur radio operators and extending the use of FM radio will reduce radio interference and allow us to find new uses for radio technology."
 radio_detection: "Radio Detection"
 radio_detection_desc_REMOVE: "The development of RADAR, Radio Detection and Ranging, allows using radio waves to detect physical objects. Research is highly secretive, considering the impact these inventions could have on locating units."
 decimetric_radar: "Decimetric Radar"
 decimetric_radar_desc_REMOVE: "Many units rely on the element of surprise for their efficiency. Development of decimetric radar allows us to deprive them of this advantage."
 improved_decimetric_radar: "Improved Decimetric Radar"
 improved_decimetric_radar_desc_REMOVE: "The use of radar has already proven crucial, but our decimetric radar sets are too few to ensure good coverage. Fitting more units with radar will allow us to maximize our technological edge."
 centimetric_radar: "Centimetric Radar"
 centimetric_radar_desc_REMOVE: "New radar operating in the microwave bands enable us to detect objects too small for previous radars to pick up."
 improved_centimetric_radar: "Improved Centimetric Radar"
 improved_centimetric_radar_desc_REMOVE: "Introducing cutting-edge radar techniques like monopulse radars in key operations will allow for extreme tracking accuracy."
 advanced_centimetric_radar: "Advanced Centimetric Radar"
 advanced_centimetric_radar_desc_REMOVE: "Despite our advanced radars, there are still ways for the enemy to avoid detection. New developments like the Pulse-Doppler radar allows us to eliminate many of these limitations in our equipment."
 radar_1950: "Synthetic-Aperture Radar"
 radar_1950_desc_REMOVE: "Utilizing the motion of the radar antenna to get a two dimensional image of the terrain of our enemies, synthetic-aperture radar leaves nothing hidden."
 radar_1960: "Over-the-Horizon Radar"
 radar_1960_desc_REMOVE: "Pushing the boundaries of the extent of modern radar technology, Over-the-Horizon radar systems are capable of detecting enemy aircraft from thousands of kilometers away."
 radar_1970: "Low-Noise Amplification"
 radar_1970_desc_REMOVE: "Allowing for the better transmission of our signals, alongside the added bonus of being able to listen in on our enemies, Low-Noise Amplification will revolutionize the field of radio wave communication."
 radar_1980: "Pulse-Power Amplification"
 radar_1980_desc_REMOVE: "As the world continues to spiral in to chaos and alliances fall apart, Pulse-Power Amplification will be essential to keep our messages heard to the military as they venture across the far flung corners of the world."
 radar_1990: "Digital Radar Integration"
 radar_1990_desc_REMOVE: "Transitioning away from the obsolete technology behind most early radar systems, digital radar integration across the entire nation will give us the leg up in finding out where our enemies may strike next."

 # Naval Radar
 flight_radar_1950: "Synthetic-Aperture Guidance Radar"
 flight_radar_1950_desc_REMOVE: "The Second World War has seen the first serious use of radar technology in the history of warfare. By its terminus, conventional radars were able to create two- and three-dimensional images of objects miles away."
 flight_radar_1960: "Comparted Guidance Radar"
 flight_radar_1960_desc_REMOVE: "Most naval radar systems in the 1960s are fitted onto the hull as a separate module, rather than as an integral part of the ship itself. Though easier to build, ships with modular radar cannot draw as much power from its infrastructure."
 flight_radar_1970: "Integrated Guidance Radar"
 flight_radar_1970_desc_REMOVE: "By now radar systems have been fully united with the ship's electronics; its antennas are as much a part of the ship itself as the anchor which tethers it to port. "
 flight_radar_1980: "Digital Guidance Radar"
 flight_radar_1980_desc_REMOVE: "As a new generation of electronics beckons, so too does another class of radar enter military applications. Newer, more powerful computers can sweep larger swathes of battlespace and pinpoint cross-sections as slim as a floorboard."
 flight_radar_1990: "Automated Radar-Landing System"
 flight_radar_1990_desc_REMOVE: "Thanks to automated radar systems, planes are able to land painlessly even with injured or rattled pilots. This will significantly reduce the amounts of damaged material and wasted training."

 # Air Radar
 naval_radar_1950: "Silhouette Deduction"
 naval_radar_1950_desc_REMOVE: "By analyzing the shape and rough outline of enemy ships, we can deduce their class, yield, and threat potential. This technique will be employed en masse amongst our sailors, and we will upgrade our systems with the necessary equipment to do so."
 naval_radar_1960: "Edge Detection"
 naval_radar_1960_desc_REMOVE: "Edge detection involves identifying points on a detected entity that change sharply, disclosing key information on enemy vessels and granting an edge in combat."
 naval_radar_1970: "Air-Naval Radar Integration"
 naval_radar_1970_desc_REMOVE: "Coordination between airborne reconnaissance craft and shipboard radar systems is vital in the field of battle. To destroy your enemy, you must see him before he finds you."
 naval_radar_1980: "Pulse Array Detection"
 naval_radar_1980_desc_REMOVE: "Pulse array detection is an advanced method of ultrasonic measurement, that allows for rapid and accurate object detection, even under limiting circumstances."
 naval_radar_1990: "Automatic Radar Detection"
 naval_radar_1990_desc_REMOVE: "The introduction of automatic radar technology enabled the aircraft to engage in evasive maneuvers before shots were even fired."

 ## Computing
 mechanical_computing: "Transistor Computing"
 mechanical_computing_desc_REMOVE: "Continuing from the vacuum tube, the computers of the 60s have undergone the first steps of miniaturization. As machines get smaller, their performance increases, making them more and more ideal and affordable to use outside academic settings."
 computing_machine: "Early Personal Computers"
 computing_machine_desc_REMOVE: "From transistors into circuits - the next step was the embedded microcontroller, or the chip. This allows citizens to buy their own, personal computers at affordablde prices. Long gone were the days where the computer were only tools used by the government. Commercial and industrial usage abound, increasing research speed and productivity."
 improved_computing_machine: "Advanced Personal Computers"
 improved_computing_machine_desc_REMOVE: "As the year 2000 approaches, chips become smaller and smaller, with their sizes shrinking to the nanometers. Usage of computers becomes prevalent, and a new era dawns as these machines learn to communicate and transfer data from one another. With the creaton of the Weltnetz/Internet, the seeds for a digital revolution are sown."
 
 
