  motorized_infantry: "Motorized Infantry"
  motorized_infantry_desc_REMOVE: "By extending the use of motor vehicles in infantry transports in the field, the mobility of otherwise slow-moving infantry units can be greatly improved, enabling faster responses and new strategies."

  bicycle_infantry: "Bicycle Infantry"
  bicycle_infantry_desc_REMOVE: "Regular infantry with bicycles are more mobile than their marching counterparts, for a very modest price."

  amphibious_mechanized_infantry: "Amphibious Tractors"
  amphibious_mechanized_infantry_desc_REMOVE: "Amphibious Tractors, or Amtracs, allow Marines to be landed on a beach under armored protection. However, this comes at the cost of poor fuel efficiency."

  amphibious_mechanized_infantry_2: "Improved Amphibious Tractors"
  amphibious_mechanized_infantry_2_desc_REMOVE: "These Amtracs feature several improvements over the base version, such as a rear loading ramp for easier unloading on the beach."

  amphibious_tank: "Amphibious Tank"
  amphibious_tank_desc_REMOVE: "Amphibious Tanks are designed to give Marines armored fire support during a beach assault."

  amphibious_tank_2: "Improved Amphibious Tank"
  amphibious_tank_2_desc_REMOVE: "The second generation of amphibious tanks feature better protection and increased fire power."

