 ### IFV ###
  # See 'equipment_l_english.yml' for equipment loc

  ## Improvements - Armor ##
   # 1950
   IFV_1950_basic_armor: "Open-Topped IFVs"
   IFV_1950_basic_armor_desc_REMOVE: "Early IFV technologies held little real protection for infantrymen being transported. Often, hatches were non-existent and IFV's held no protection against chemical, nuclear, or biological destruction. Soldiers were exposed to the open air."
   IFV_1950_improved_armor: "WMD Protection"
   IFV_1950_improved_armor_desc_REMOVE: "Adding hatches and sealing the inside of the IFV, as well as providing clean ventilation, allowed for troops to have effective protection against chemical weapons and, in the case of a nuclear war, radiation. These early WMD protection systems made IFVs far safer."
   IFV_1950_advanced_armor: "NBC Protection Innovations"
   IFV_1950_advanced_armor_desc_REMOVE: "Advances in ventilation technology as well as the innovation of providing filtered air meant troops could fight and move in even the worst conditions. Advancing upon previous technologies greatly increased protection."

   # 1960
   IFV_1960_basic_armor: "Frontal Arc Armor Innovation"
   IFV_1960_basic_armor_desc_REMOVE: "Increased armor on the front sheets of the IFV finally achieved one of the key goals of any effective IFV; real protection from large caliber rifles. Advancing IFVs could now safely move towards enemy fire without sustaining damage to the vehicle. "
   IFV_1960_improved_armor: "Modernized Internal Structure"
   IFV_1960_improved_armor_desc_REMOVE: "Using new alloys and synthetic materials in the interior of IFVs provided greater protection to infantry in the IFV. Even if bullets penetrated the first layer, shrapnel would be stopped on the wall of the interior."
   IFV_1960_advanced_armor: "Composite Armor"
   IFV_1960_advanced_armor_desc_REMOVE: "Layering different ceramics, metals, and plastics atop one another isn't just cheaper then a single steel body - it provides unparalleled protection, deflecting bullets and allowing nothing to penetrate farther then a few inches. Adopting these composite armor developments is revolutionary in IFV design."

   # 1970
   IFV_1970_basic_armor: "Reorganized Blueprint"
   IFV_1970_basic_armor_desc_REMOVE: "Increased efficiency and reforms in blueprint design allow for faster mass production and the development of more exact armor measurements. This decreases production costs and increases protection."
   IFV_1970_improved_armor: "Hull Floor Reinforcement"
   IFV_1970_improved_armor_desc_REMOVE: "Increasing hull thickness at the hull while using cheaper and lighter metals means that mines no longer will be a death sentence for the IFV and the infantrymen inside. It will also provide protection against any other explosives and allows for a far more stable ride. "
   IFV_1970_advanced_armor: "Aluminum Alloy Hull"
   IFV_1970_advanced_armor_desc_REMOVE: "The use of not just aluminum, but complex aluminum alloys, allows for far lighter IFVs. These hulls would become present in most IFVs and fighting vehicles of the time. "

   # 1980
   IFV_1980_basic_armor: "Reactive Armor"
   IFV_1980_basic_armor_desc_REMOVE: "Reactive armor systems increase deflection of both large and small arms, while providing greater resistance to explosions, making it an all around good option. With the development of complex reactive armor, many armor systems integrated this into tanks and IFVs designed for close combat and work on the front lines."
   IFV_1980_improved_armor: "Explosive Resistance System"
   IFV_1980_improved_armor_desc_REMOVE: "Explosive reactive armor has been successfully implemented on tanks in the past, and has dramatically increased their survivability against penetrator rounds, shaped charges, and other armor-piercing weapons. We should do the same for our IFVs."
   IFV_1980_advanced_armor: "Active Protection System"
   IFV_1980_advanced_armor_desc_REMOVE: "As guided anti-tank missiles become more advanced, so too must the systems that defend against them. Electronic countermeasures, radar chaff and counter-rockets or other missile interceptors can keep our tanks safe from even the deadliest projectiles."
  ## Improvements - Armor ##

  ## Improvements - Turret ##
   # 1950
   IFV_1950_basic_turret: "IFV 20mm Autocannon"
   IFV_1950_basic_turret_desc_REMOVE: "The 20mm autocannon is the standard of IFVs worldwide, something to give the vehicle more firepower than an APC whilst remaining understanding that it is not supposed to be in the direct line of fire in most circumstances. "
   IFV_1950_improved_turret: "Firing Ports"
   IFV_1950_improved_turret_desc_REMOVE: "One of the main advantages of an IFV is that infantry are not rendered unable to engage in combat whilst traveling. With firing ports and IFV can engage an assailant with its troop complement and not just the arms of the vehicle itself."
   IFV_1950_advanced_turret: "Improved Cannon Rotation"
   IFV_1950_advanced_turret_desc_REMOVE: "Cannon rotation is important for a vehicle expected to fight on the move, and will give the IFV greatly increased capabilities for engaging hostile forces. However this does not mean it should do so outside exceptional circumstances."

   # 1960
   IFV_1960_basic_turret: "IFV 73mm Autocannon"
   IFV_1960_basic_turret_desc_REMOVE: "Whilst most IFV's retain the standard 20mm armament there is room for specific models to have greatly increased firepower depending upon their desired role. Additionally, this will assist in fighting entrenched enemy positions."
   IFV_1960_improved_turret: "Co-axial Machine Guns"
   IFV_1960_improved_turret_desc_REMOVE: "Machine guns are an important part of the armament of an IFV, and their placement is important so as to provide the widest firing arc possible. Suppression is an under appreciated factor of warfare upon occasion."
   IFV_1960_advanced_turret: "Enclosed Firing Ports"
   IFV_1960_advanced_turret_desc_REMOVE: "An improvement to firing ports is to give the infantrymen using them better protection. It is, after all, best if an IFV can get its entire complement to the fight as opposed to losing a man needlessly."

   # 1970
   IFV_1970_basic_turret: "Anti-Tank Capabilities"
   IFV_1970_basic_turret_desc_REMOVE: "The tank is a significant threat to any IFV, but they may be more wary if the IFV has some teeth of its own. No IFV should seek an engagement with armor of course, but circumstances sometimes demand difficult decisions."
   IFV_1970_improved_turret: "Improved Armament Setups"
   IFV_1970_improved_turret_desc_REMOVE: "One of the more important factors of any IFV design is its actual weapon setup. The main gun needs to be capable of effectively engaging foes, as well as being a moderated support weapon arrangement for additional combat firepower."
   IFV_1970_advanced_turret: "90mm Cannon"
   IFV_1970_advanced_turret_desc_REMOVE: "Whilst an IFV might not be exactly designed for sustained combat, it should not be helpless. A 90mm cannon works wonders against vehicles, perhaps moreso on soldiers."

   # 1980
   IFV_1980_basic_turret: "Two Man Guns"
   IFV_1980_basic_turret_desc_REMOVE: "A two man cannon is arguably superior to a one man design, as it removes some of the vulnerabilities associated with one man being knocked out in combat or being distracted doing two things at once."
   IFV_1980_improved_turret: "More Firing Ports"
   IFV_1980_improved_turret_desc_REMOVE: "Increasing the number of firing ports will allow to troops to return fire from the safety of the IFV, even when they are engaged while moving or unable to exit the vehicle."
   IFV_1980_advanced_turret: "Anti-Tank Missiles"
   IFV_1980_advanced_turret_desc_REMOVE: "The next logical step in increasing the fighting capabilities of our IFVs is mounting them with anti-tank missiles. This will allow them to engage heavier armor with moderate success."
  ## Improvements - Turret ##
 ### IFV ###

 ### MBT ###
  # See 'equipment_l_english.yml' for equipment loc

  ## Improvements - Armor ##
   # 1950
   MBT_1950_basic_armor: "Rudimentary Composite Ceramics"
   MBT_1950_basic_armor_desc_REMOVE: "It has been demonstrated that a thin layer of enamel will improve the ballistic properties of steel. We should test this out and begin looking for ways to expand on this concept."
   MBT_1950_improved_armor: "Siliceous-Cored Armor"
   MBT_1950_improved_armor_desc_REMOVE: "Putting a piece of fused silica glass between two rolled steel plates almost doubles the armor effectiveness of the steel plates. This will help our tanks shrug off enemy fire much easier."
   MBT_1950_advanced_armor: "Combination K Ceramic Type"
   MBT_1950_advanced_armor_desc_REMOVE: "Instead of glass, our experiments have found a layer of plastic reinforced by glass and ceramic plates works much better. We can defend against HEAT rounds and shaped charges better without sacrificing defense against kinetic energy penetrators."

   # 1960
   MBT_1960_basic_armor: "Multi-layered Steel-Ceramic Composite"
   MBT_1960_basic_armor_desc_REMOVE: "By incorporating many spaced layers of hardened steel with layers of boron carbide composite, the effectiveness of our armor plate becomes enormously greater, as the projectile shatters as it travels through the different materials."
   MBT_1960_improved_armor: "Advanced Armor Skirts"
   MBT_1960_improved_armor_desc_REMOVE: "By placing strong armor composites on the outside of the tank hull, spaced just a few inches from the main armor, we can radically increase its effectiveness, as the spaced armor causes shaped-charge projectiles to shatter and explode before they can strike the main plate."
   MBT_1960_advanced_armor: "Prototype Reactive Armor"
   MBT_1960_advanced_armor_desc_REMOVE: "We can equip our tanks with additional armor composed high explosive sandwiched in between composite metallic-ceramic plating, which, when struck by an armor-piercing round, should explode and shatter the projectile, greatly decreasing its damaging potential, if not negating it entirely. However, this armor is could prove expensive and unreliable."

   # 1970
   MBT_1970_basic_armor: "Improved Ceramic Compounds"
   MBT_1970_basic_armor_desc_REMOVE: "More research into ceramic technology has given us a number of interesting possibilities. We now have many new combinations of materials to stick between our steel plates."
   MBT_1970_improved_armor: "Boron-Carbide Aggregate"
   MBT_1970_improved_armor_desc_REMOVE: "Boron-Carbide is one of the hardest known materials out there, and attempts must be to made into integrate it into the armor of our vehicles. We will put it in between the steel plates to make a hard composite armor."
   MBT_1970_advanced_armor: "Chobham Armor"
   MBT_1970_advanced_armor_desc_REMOVE: "Ceramic plating may provide more protection than the current materials. An improved version of the early ceramic prototypes is now being produced, and it gives us better protection against HEAT shells than anything else out there."

   # 1980
   MBT_1980_basic_armor: "Depleted Uranium Composites"
   MBT_1980_basic_armor_desc_REMOVE: "Depleted Uranium, a by-product of uranium enrichment, can be incorporated into some of the layers of already established composites. Due to its high density, it can shatter the projectile more effectively than standard composites."
   MBT_1980_improved_armor: "Advanced Explosive Reactive Armor"
   MBT_1980_improved_armor_desc_REMOVE: "More advanced and more sensitive high explosives can be incorporated into our reactive armor plates, allowing them to more effectively destroy incoming projectiles before they damage their targets."
   MBT_1980_advanced_armor: "Non-Energetic Reactive Armor"
   MBT_1980_advanced_armor_desc_REMOVE: "Instead of using high explosives sandwiched in-between armor plates, we could use a porous material like rubber. When struck by a shaped charge warhead, the warhead's energy causes a dramatic increase in pressure and counter-explosion in the rubber, destroying the warhead. While slightly less effective, it is much safer and lighter than the explosive variety."
  ## Improvements - Armor ##

  ## Improvements - Turret ##
   # 1950
   MBT_1950_basic_turret: "Early Auto-loaders"
   MBT_1950_basic_turret_desc_REMOVE: "Mechanical aids for our tank crews can facilitate loading and extraction of tank shells, reducing the tasks necessary to operate a tank in the middle of combat."
   MBT_1950_improved_turret: "HEAT Integration"
   MBT_1950_improved_turret_desc_REMOVE: "A High-Explosive Anti-Tank (HEAT) warhead relies on a shaped charge to punch through enemy armor and send a molten stream of it into the vehicle, messing it up. It should be the primary anti-armor round used by our main battle tanks."
   MBT_1950_advanced_turret: "APFSDS"
   MBT_1950_advanced_turret_desc_REMOVE: "Armour-Piercing Fin-Stabilized Discarding Sabot (APFSDS) rounds will give our tanks heavier striking power against modern armor systems, by adding fins to increase the stability and range of traditional Sabot shells."

   # 1960
   MBT_1960_basic_turret: "Mechanical Ballistic Computer"
   MBT_1960_basic_turret_desc_REMOVE: "We can introduce a very basic sort of computer that will allow our gunners to hit more accurately in adverse conditions, such as strong winds."
   MBT_1960_improved_turret: "Turret Range Finders"
   MBT_1960_improved_turret_desc_REMOVE: "By placing automatic range finders into a gunner's sight, we allow the exact measurement of distance to a particular target, allowing for more precise, longer range hits."
   MBT_1960_advanced_turret: "Advanced Cannon Stabilization"
   MBT_1960_advanced_turret_desc_REMOVE: "By implementing a complex series of shock absorbers and hydraulics throughout the tank, we can improve the stabilization of the gun to such a degree that it will be able to fire accurately even when moving."

   # 1970
   MBT_1970_basic_turret: "AOS"
   MBT_1970_basic_turret_desc_REMOVE: "Add-on stabilization mechanisms allow the tank to have greater accuracy while firing, improving the effectiveness of the vehicle while at speed. This will improve our existing guns immensely."
   MBT_1970_improved_turret: "Depleted Uranium Munitions"
   MBT_1970_improved_turret_desc_REMOVE: "Enemy tanks are getting harder to penetrate, so we use harder weaponry. After much research, our scientists have decided that depleted uranium shells will allow us to breech enemy armor most effectively."
   MBT_1970_advanced_turret: "IR Detector and Night Vision"
   MBT_1970_advanced_turret_desc_REMOVE: "Installing infrared and night vision systems on our tanks allow our tank crews to see more, avoiding ambushes and camouflage, and allowing our tanks to operate more effectively at night."

   # 1980
   MBT_1980_basic_turret: "Fire-Control Computer"
   MBT_1980_basic_turret_desc_REMOVE: "The introduction of integrated fire-control electronics within our turrets will increase sight effectiveness by a high margin. Our systems are capable of producing all the figures a gunner needs in mere seconds, delivering a quick and accurate firing solution."
   MBT_1980_improved_turret: "Thermal Coating"
   MBT_1980_improved_turret_desc_REMOVE: "Using an advanced thermal shielding on the interior of the turrets barrel should reduce the level of deformation that occurs from high temperatures. This advancement will allow a greater fire rate within our tank, as the heat becomes more thoroughly managed."
   MBT_1980_advanced_turret: "Anti-tank Laser-guided Missiles"
   MBT_1980_advanced_turret_desc_REMOVE: "Gun launched guided missiles will give our gunners a degree of flexibility that is much needed within tank battles. These missiles can be hand guided right into enemy armor, with a considerable amount of flight time."
