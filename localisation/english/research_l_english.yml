 ### Special Forces ###
  ## Marines ##
    marines: "Marines I"
    marines_desc_REMOVE: "Troops specializing in amphibious warfare are growing ever more indispensable. Improvised methods and equipment become things of the past as our naval infantry is supported by specialized landing craft and training."

    marines2: "Marines II"
    marines2_desc_REMOVE: "Amphibious warfare requires constant innovation. Improved logistical support and portable harbors can enable our marines to perform landings that may otherwise have been impossible."

    marines3: "Marines III"
    marines3_desc_REMOVE: "Marines can be more than just amphibious infantry. In the future, our marine corps will be among the most disciplined and organized special forces, receiving our best equipment and logistical support."

    marines4: "Marines IV"
    marines4_desc_REMOVE: "Unconventional stealth and hand-to-hand combat techniques, learned and honed by our forces during past conflicts, will be taught to our special forces to ensure that the knowledge is not lost."

    marines5: "Marines V"
    marines5_desc_REMOVE: "Nighttime operations are becoming increasingly viable thanks to new technologies. Night vision scopes and goggles allow our marines to operate just as well in the dark as they do in the light."

    marines6: "Marines VI"
    marines6_desc_REMOVE: "Cutting edge military weaponry can enhance the combat abilities of even our best marines. Civilians aren't aware of its existence, and much of it isn't even known to the rest of our armed forces."
  ## Marines ##

  ## Mountaineers / Mountain Infantry ##
    tech_mountaineers: "Mountain Infantry I"
    tech_mountaineers_desc_REMOVE: "Combat in mountain ranges exposes troops to many perils, but sometimes cannot be avoided. We can minimize these risks by providing our soldiers with specialized training for this environment."

    tech_mountaineers2: "Mountain Infantry II"
    tech_mountaineers2_desc_REMOVE: "Going beyond survival, our forces can be trained to use mountains to their advantage. With light equipment and mule transports, they can maneuver this terrain better than other infantry."

    tech_mountaineers3: "Mountain Infantry III"
    tech_mountaineers3_desc_REMOVE: "Specialized mountaineering equipment, from sturdy climbing rigs to well-fitting boots, are a necessity for any mountaineering unit in order to remain mobile in harsh, rocky terrain."

    tech_mountaineers4: "Mountain Infantry IV"
    tech_mountaineers4_desc_REMOVE: "Preparing for the most arduous mountain missions in high altitudes and low temperatures will require extraordinary training and discipline from our mountain troops."

    tech_mountaineers5: "Mountain Infantry V"
    tech_mountaineers5_desc_REMOVE: "While our men have been trained to survive and thrive in arduous conditions, their weapons must also be handle sub-zero temperatures. Making special weapon variants for our mountaineers may prove beneficial."

    tech_mountaineers6: "Mountain Infantry VI"
    tech_mountaineers6_desc_REMOVE: "Helicopters capable of being used in high altitudes and vehicles that can traverse treacherous mountain terrain are key to making sure that our mountaineering units are as mobile and advanced as possible."
  ## Mountaineers / Mountain Infantry ##

  ## Paratrooper / Air Cavalry / Paratroopers ##
    paratroopers: "Paratrooper I"
    paratroopers_desc_REMOVE: "By incorporating air assault forces into our army, we can make tactical entries and position key troops in previously inaccessible areas, allowing for new tactical opportunities."

    paratroopers2: "Paratrooper II"
    paratroopers2_desc_REMOVE: "Transitioning from small operations with only a few soldiers to skilled airborne divisions paves way for more intensive combat landings, taking these forces beyond a novelty to a natural part of warfare."

    paratroopers3: "Paratrooper III"
    paratroopers3_desc_REMOVE: "Learning to adapt air assault operations according to weather, standardizing equipment such as fast-roping gear, and extended specialized training will minimize the confusion and risks involved in these dangerous missions."

    paratroopers4: "Paratrooper IV"
    paratroopers4_desc_REMOVE: "Special helicopter modifications that enable our troops to repel and exit from their transports more quickly will allow for smoother operations in harsh conditions."

    paratroopers5: "Paratrooper V"
    paratroopers5_desc_REMOVE: "Compact weaponry and lightweight equipment increases the mobility of our air assault units, allowing them to carry more gear when a specialized mission demands it."

    paratroopers6: "Paratrooper VI"
    paratroopers6_desc_REMOVE: "Further training enhancements designed to help our air assault units during nighttime operations will make these missions more viable and lower the risk associated with them."
    
