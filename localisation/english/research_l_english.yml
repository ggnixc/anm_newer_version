    basic_infantry_equipment: "Basic Infantry Equipment"
    basic_infantry_equipment_desc_REMOVE: "The most basic equipment necessary for fielding contemporary infantry, such as uniforms, helmets, mess kits, and other essentials needed to keep our troops looking (at least somewhat) professional and proper."
  ## Rifles ##

  ## Unsure ##
    infantry_weapons2: "Improved Infantry Equipment I"
    infantry_weapons2_desc_REMOVE: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."

    improved_infantry_weapons_2: "Improved Infantry Equipment II"
    improved_infantry_weapons_2_desc_REMOVE: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Improved weapon models and more specialized equipment."

    advanced_infantry_weapons2: "Improved Infantry Equipment III"
    advanced_infantry_weapons2_desc_REMOVE: "Personal and crew served weapons for infantry as well as the various other bits of kit a soldier needs. Further Modernized to include personal Assault Rifles and anti-tank rockets. Improved availability of weapons previously distributed to a limited extent."
  ## Unsure ##

  ## Improvements ##
    infantry_weapons_improvements_1: "Infantry Weapon Improvements I"
    infantry_weapons_improvements_1_desc_REMOVE: "Basic rifle improvements based on lessons and reports from combat during the Second World War, generally leading to slight improvements in reliability and accuracy."

    infantry_weapons_improvements_2: "Infantry Weapon Improvements II"
    infantry_weapons_improvements_2_desc_REMOVE: "Improvements to the rifle's internal systems can help to resolve mechanical problems and other overlooked issues during the weapon's initial production run."

    infantry_weapons_improvements_3: "Infantry Weapon Improvements II"
    infantry_weapons_improvements_3_desc_REMOVE: "New metallurgy techniques can make key components last longer without breaking or wearing down, as well as reduce corrosion and other adverse effects."

    infantry_weapons_improvements_4: "Infantry Weapon Improvements IV"
    infantry_weapons_improvements_4_desc_REMOVE: "While further internal changes may not be possible, developing weapon attachments to resolve any remaining shortcomings can help to extend the rifle's lifespan."

    infantry_weapons_improvements_5: "Infantry Weapon Improvements V"
    infantry_weapons_improvements_5_desc_REMOVE: "Replacing wooden stocks and handguards with metal can lead to improved performance in harsh conditions, as well as help to improve the lifespan of the rifle."

    infantry_weapons_improvements_6: "Infantry Weapon Improvements VI"
    infantry_weapons_improvements_6_desc_REMOVE: "Combat usage has revealed weapon defects and problem areas that can rectified by making internal changes to the rifle, which will hopefully fix any reliability issues."

    infantry_weapons_improvements_7: "Infantry Weapon Improvements VII"
    infantry_weapons_improvements_7_desc_REMOVE: "New developments in weapon sight technology can greatly improve the long-range capabilities of our rifles, as well as improve accuracy and precision in general."

    infantry_weapons_improvements_8: "Infantry Weapon Improvements VIII"
    infantry_weapons_improvements_8_desc_REMOVE: "Producing magazines with increased ammunition capacity will allow our troops to carry more ammunition at a lower weight, whether it be in extended box magazines or compact drum magazines."

    infantry_weapons_improvements_9: "Infantry Weapon Improvements IX"
    infantry_weapons_improvements_9_desc_REMOVE: "Incorporating modern rifling patterns into our weapons will improve rifle accuracy and increase the service life of the weapon's barrel, and possibly a higher muzzle velocity."

    infantry_weapons_improvements_10: "Infantry Weapon Improvements X"
    infantry_weapons_improvements_10_desc_REMOVE: "Making improvements to the gas system are needed to increase rifle reliability, but can also help to increase fire rate and reduce the chance of the weapon jamming."

    infantry_weapons_improvements_11: "Infantry Weapon Improvements XI"
    infantry_weapons_improvements_11_desc_REMOVE: "Metal grips, stocks, and handguards can be replaced with plastic or polymer components, which reduces the rifle's weight and increases its ergonomics."

    infantry_weapons_improvements_12: "Infantry Weapon Improvements XII"
    infantry_weapons_improvements_12_desc_REMOVE: "By making tweaks to the rifle's ejection system, the chance of jamming can be decreased, and it can be modified to work more smoothly in harsh weather conditions."

    infantry_weapons_improvements_13: "Infantry Weapon Improvements XIII"
    infantry_weapons_improvements_13_desc_REMOVE: "Attachable under-barrel grenade launchers drastically increase the firepower of our troops, and still allow the rifle to be fired normally, unlike older types of rifle grenades."

    infantry_weapons_improvements_14: "Infantry Weapon Improvements XIV"
    infantry_weapons_improvements_14_desc_REMOVE: "Developing better barrel extensions such as muzzle compensators and flash suppressors can have a variety of beneficial effects to improve overall weapon effectiveness."

    infantry_weapons_improvements_15: "Infantry Weapon Improvements XV"
    infantry_weapons_improvements_15_desc_REMOVE: "Making the last few internal improvements to the rifle can solve any remaining issues regarding reliability; anything further will require a new weapon entirely."

    infantry_weapons_improvements_16: "Infantry Weapon Improvements XVI"
    infantry_weapons_improvements_16_desc_REMOVE: "Adjustable stocks and other attachments dedicated to increasing our rifle's ergonomics can help greatly if weapon accuracy can not be improved further."
