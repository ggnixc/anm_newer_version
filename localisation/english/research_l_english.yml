   artillery1_desc_REMOVE: "With more modern materials and mechanisms, howitzers and field guns from the Great War can be re-chambered and modernized for modern warfare."
   artillery2: "Improved Artillery Upgrade I"
   artillery2_desc_REMOVE: "Upgrading old pieces can only get us so far. New howitzer designs will be needed, taking advantage of new hydraulic recoil devices and longer barrels."
   artillery4: "Artillery IV"
