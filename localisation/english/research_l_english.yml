 # Assorted Deprecated
 widespread_mechanisation: "Widespread Mechanization"
 widespread_mechanisation_desc_REMOVE: "With a focus on mechanized troops we have a moderately strong force ready to quickly respond in battle."
 tactical_explotion: "Tactical Exploitation"
 tactical_explotion_desc_REMOVE: "With a coordination of tank and infantry attack we can achieve a force multiplier when attacking."
 hej_hej: "Assault Concentration"
 hej_hej_desc_REMOVE: "By concentrating a assault with a total support we can create a large opening in the enemy line."
 independant_formations: "Independent Formations"
 independant_formations_desc_REMOVE: "By making all squads self-sustainable for a short while we can lessen the effect on cut-off troops, and give our other troops more time to respond."
 asymmetric_warfare: "Asymmetric Warfare"
 asymmetric_warfare_desc_REMOVE: "Fight with your strengths, at your chosen place. The enemy does not know who they are picking a fight with."
 strategic_deployments: "Strategic Deployments"
 strategic_deployments_desc_REMOVE: "With carefully planned deployments we can have a greater coordination of unit positions and operations."
 popular_support: "Popular Support"
 popular_support_desc_REMOVE: "National pride roars with your people. They will defend their country until their last breath.\n\n"
 home_guards: "Home Guards"
 home_guards_desc_REMOVE: "Years in advance of a attack we can prepare reserves, taught in the art of war and ready to stand up for their nation.\n\n"
 guerilla_warfare1: "Guerilla Warfare"
 guerilla_warfare1_desc_REMOVE: "The enemy advances, we retreat; the enemy camps, we harass; the enemy tires, we attack; the enemy retreats, we pursue."
 mobilisation_caches: "Mobilization Caches"
 mobilisation_caches_desc_REMOVE: "Preparation is key to repelling the invaders. Across our nation are secret military caches waiting to restock our equipment pool."
 improvised_attrition: "Improvised Attrition"
 improvised_attrition_desc_REMOVE: "A bush trembles, a knife is pulled and a man dies. A soda can is cracked open, and from afar a man sees another man open a can and get blown to pieces."
 strategic_demolition: "Strategic Demolition"
 strategic_demolition_desc_REMOVE: "By preparing bridges, tunnels, ports and roads in a way that they can quickly be destroyed we can halt the enemy advance."
 improvised_forts: "Improvised Forts"
 improvised_forts_desc_REMOVE: "We have taught our troops how to do improvised defensive positions. While they are crude, they come in great numbers."
 local_strongholds: "Local Strongholds"
 local_strongholds_desc_REMOVE: "By preparing strongholds and other highly defensive positions, along with defensive training our troops are hard to displace."
 conscription_reserves: "Conscription Reserves"
 conscription_reserves_desc_REMOVE: "By having former conscripts as reserves we can have a even larger population ready to be installed into the military"
 international_support: "International Support"
 international_support_desc_REMOVE: "TODO"
 covert_arms_production: "Covert Arms Production"
 covert_arms_production_desc_REMOVE: "We lack hidden massive factories for tanks and airplanes, but a gun can be made in a basement. A gun can be made from a pipe."
 one_people: "One People"
 one_people_desc_REMOVE: "One for all and all for one. A determined people will never be defeated, and our enemies will flee!\n\n"
 national_redoubt: "National Redoubt"
 national_redoubt_desc_REMOVE: "The pinnacle of defensive stratagems: A National Redoubt will make enemy penetration extremely hard, and hopefully force them to rethink their intentions.\n\n"

