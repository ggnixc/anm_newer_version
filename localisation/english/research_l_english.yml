 ## Recon Company
 tech_recon: "Recon Company I"
 tech_recon_desc_REMOVE: "Sending smaller groups to scout ahead before moving in the main force allows us to gather intelligence about where the enemy is and how many we are facing, and report other vital information about the mission."
 tech_recon2: "Recon Company II"
 tech_recon2_desc_REMOVE: "Reconnaissance missions are often dangerous and casualties are high. Preparing our patrols to move and withdraw rapidly and equipping them to clear obstacles placed by the enemy will increase their chances of coming back alive."
 tech_recon3: "Recon Company III"
 tech_recon3_desc_REMOVE: "Improvements in radio technology changes the way reconnaissance missions can be executed, enabling rapid communication of gathered intelligence using new encrypted frequencies."
 tech_recon4: "Recon Company IV"
 tech_recon4_desc_REMOVE: "Deep reconnaissance operations that mix espionage, guerrilla operations, and commando training will aid our tactical choices and allow us to adapt our decision-making rapidly to new intelligence."
 tech_recon5: "Recon Company V"
 tech_recon5_desc_REMOVE: "Giving our teams lightweight and highly mobile reconnaissance vehicles will help them move faster and escape more quickly from potentially deadly situations that may arise during operations."
 tech_recon6: "Recon Company VI"
 tech_recon6_desc_REMOVE: "Nigh vision equipment will allow our reconnaissance teams to operate under the cover of the night, reducing the chance of being seen and allowing them to more safely gather information."
 
 ## Field Hospital Company
 tech_field_hospital: "Field Hospital I"
 tech_field_hospital_desc_REMOVE: "A casualty doesn't need to mean a dead soldier. Having immediate medical attention available for the wounded brought back to the rear is the first step towards ensuring this."
 tech_field_hospital2: "Field Hospital II"
 tech_field_hospital2_desc_REMOVE: "By establishing the use of portable hospitals, to bring medical care to where it is needed on the battlefield, we can stop many unnecessary deaths and permanent injuries."
 tech_field_hospital3: "Field Hospital III"
 tech_field_hospital3_desc_REMOVE: "Surgery is among the most common emergency procedures needed in the field. Sterile tools for this must be available closer to the front, and we must ensure that skilled surgeons are part of the military medical units."
 tech_field_hospital4: "Field Hospital IV"
 tech_field_hospital4_desc_REMOVE: "Although many improvements have been made in field medicine, many techniques are improvised and we lack an established doctrine. With more experience, we can transform improvised innovations into permanent fixtures."
 tech_field_hospital5: "Field Hospital V"
 tech_field_hospital5_desc_REMOVE: "Cleanliness is key to preventing further injury and sickness after a combat injury. Keeping our field hospitals clean and as free of germs as possible will reduce the chance of infection later on and increase survival rates."
 tech_field_hospital6: "Field Hospital VI"
 tech_field_hospital6_desc_REMOVE: "Medical teams that are trained to operate in transport helicopters for medical evacuation procedures can help during even the most critical and serious medical emergencies that can arise in the field."
 
 ## Logistics Company
 tech_logistics_company: "Logistics Company I"
 tech_logistics_company_desc_REMOVE: "Having dedicated logistics officers among our ranks will ensure that support networks are leveraged to minimize lost and wasted equipment, and to manage supplies while waiting for a delivery."
 tech_logistics_company2: "Logistics Company II"
 tech_logistics_company2_desc_REMOVE: "Adapting our risk analyses to the new circumstances of war will improve the safety of our logistical support and ensure that all supply shipments reach their destination in an appropriate time."
 tech_logistics_company3: "Logistics Company III"
 tech_logistics_company3_desc_REMOVE: "Continued statistical evaluation of troop supply needs will contribute to maximizing the utility of our resources, allowing us to prioritize units are more important to our current operations."
 tech_logistics_company4: "Logistics Company IV"
 tech_logistics_company4_desc_REMOVE: "Developing standardized classifications for supplies will minimize confusion and make planning more efficient, as well as aid in internal record keeping for our research and logistics branches."
 tech_logistics_company5: "Logistics Company V"
 tech_logistics_company5_desc_REMOVE: "By enabling our logistics companies to work together with our military engineers, they can plan and construct roads to bridges to facilitate the transportation of supplies straight to the front line"
 tech_logistics_company6: "Logistics Company VI"
 tech_logistics_company6_desc_REMOVE: "Using transport planes and helicopters to move shipments can help us get key supplies to isolated units and operating bases, and reduce the risks associated with transporting the equipment, for an increased cost."

 ## Military Police / MP Company
 tech_military_police: "Military Police I"
 tech_military_police_desc_REMOVE: "Regular troops may be able to manage occupation for a short while, but they are first and foremost soldiers. Having dedicated military police will ensure we have people on the ground to respond to resistance and sabotage."
 tech_military_police2: "Military Police II"
 tech_military_police2_desc_REMOVE: "By engaging in regular police duties in occupied territories, such as traffic control and maintaining public order, our military police can minimize the chaos and confusion in which partisan movements thrive."
 tech_military_police3: "Military Police III"
 tech_military_police3_desc_REMOVE: "Cooperating with local spy networks and informers established before occupation, our military police can proactively prepare for where resistance is likely to arise."
 tech_military_police4: "Military Police IV"
 tech_military_police4_desc_REMOVE: "Safely policing occupied territory is as much about returning to normalcy as it is about ruthlessly eliminating opposition. Our military police must ensure that this process starts early to protect soldiers and civilians alike."
 tech_military_police5: "Military Police V"
 tech_military_police5_desc_REMOVE: "Effectively putting an end to resistance cells is a key aspect of any competent military police. Equipping our MPs with up to date weaponry and equipment will significantly increase their effectiveness in the field."
 tech_military_police6: "Military Police VI"
 tech_military_police6_desc_REMOVE: "Equipping some of our military police units with riot gear and equipment, such as tear gas, will help them to disperse protests that get out of hand and provide a non-lethal way to deal with resistance movements."

 ## Signal Company
 tech_signal_company: "Signal Company I"
 tech_signal_company_desc_REMOVE: "Establishing and maintaining communications in the field has always required special skills. With the advent of new communications and detection technology in the Second World War, new possibilities for the practice lie ahead."
 tech_signal_company2: "Signal Company II"
 tech_signal_company2_desc_REMOVE: "Increasingly portable communications technology is becoming more reliable and able to be carried more easily. This increased mobility of signal corps must be utilized if we hope to keep our troops coordinated."
 tech_signal_company3: "Signal Company III"
 tech_signal_company3_desc_REMOVE: "Signal companies focusing on communication between the different branches of the military can ensure that ground forces are able to coordinate efforts with sea and air operations and plan their movements more rapidly."
 tech_signal_company4: "Signal Company IV"
 tech_signal_company4_desc_REMOVE: "Among our signal specialists are people with unparalleled first-hand knowledge of field use of this equipment. By involving them in the research of new communication technologies, we can make use of their expertise."
 tech_signal_company5: "Signal Company V"
 tech_signal_company5_desc_REMOVE: "Giving our signal companies the ability to easily encrypt their transmissions will allow for faster communications without the need for a relay station, and will help to drive more advanced encryption research."
 tech_signal_company6: "Signal Company VI"
 tech_signal_company6_desc_REMOVE: "Setting up what are essentially mobile telephone networks will enable our units to communicate almost instant, allowing them to share important information with other troops and request air or naval support at a moment's notice"

 ## Maintenance Company
 tech_maintenance_company: "Maintenance Company I"
 tech_maintenance_company_desc_REMOVE: "Maintenance, repair and overhaul are important to keep military equipment reliable and safe to use. Having support companies dedicated to this will ensure that it's given appropriate attention."
 tech_maintenance_company2: "Maintenance Company II"
 tech_maintenance_company2_desc_REMOVE: "Routine operational maintenance procedures minimize the risks of equipment breaking down and will make sure malfunctioning equipment is replaced before it breaks down in combat."
 tech_maintenance_company3: "Maintenance Company III"
 tech_maintenance_company3_desc_REMOVE: "Making sure that our troops always have the basic materials in the field to perform common repairs will prevent the continued use of damaged equipment and make later repairs easier to do."
 tech_maintenance_company4: "Maintenance Company IV"
 tech_maintenance_company4_desc_REMOVE: "Experiences with designing for active redundancy in the Second World War can be renewed to work with more modern equipment to make maintenance easier, and ensure that accidents are not as severe."
 tech_maintenance_company5: "Maintenance Company V"
 tech_maintenance_company5_desc_REMOVE: "Proving our maintenance companies with an easily accessible supply of spare parts, we can get that break down back into service in the field as soon as possible."
 tech_maintenance_company6: "Maintenance Company VI"
 tech_maintenance_company6_desc_REMOVE: "By designing of military vehicles with repairability in mind, we can make the job of our maintenance companies as easily as possible, allowing them to spend less time on complex repairs."

 ## Attack Helicopter Company
 tech_attack_helicopter_company: "Helicopter Company I"
 tech_attack_helicopter_company_desc_REMOVE: "As helicopters have become bulkier and able to carry heavier loads, their potential for military use is obvious. Supporting our units with helicopters powerful enough to carry military armaments, such as autocannons and anti-tank missiles, may prove extremely beneficial."
 tech_attack_helicopter_company2: "Helicopter Company II"
 tech_attack_helicopter_company2_desc_REMOVE: "Helicopters have begun to prove their worth on the battlefield. Improving the armor and armaments of  helicopters will help to increase their survivability in the event that they are engaged by anti-air or MANPADS equipment while on patrol."
 tech_attack_helicopter_company3: "Helicopter Company III"
 tech_attack_helicopter_company3_desc_REMOVE: "Improved rotor blades and engines will make our helicopters quieter when in the air and increase their velocity, allowing them to cover more ground with a reduced chance of detection."
 tech_attack_helicopter_company4: "Helicopter Company IV"
 tech_attack_helicopter_company4_desc_REMOVE: "Helicopters are becoming indispensable to ground warfare, it has revolutionized the way we fight wars, and we must make sure that this progress does not stop. Lighter frames, more powerful armaments, and easier production all must be looked into."
 tech_attack_helicopter_company5: "Helicopter Company V"
 tech_attack_helicopter_company5_desc_REMOVE: " "
 tech_attack_helicopter_company6: "Helicopter Company VI"
 tech_attack_helicopter_company6_desc_REMOVE: " "

