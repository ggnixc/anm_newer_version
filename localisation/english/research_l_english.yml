 ### Industry
 countrywide_improvements: "Practical Industrial Administration"
 countrywide_improvements_desc_REMOVE: "Educating our industrial management personnel on the basics of industrial administration such as economies of scale and labour specialisation is a necessity to get any industrial base up and running."
 enhanced_industrial_administration: "Enhanced Industrial Administration"
 enhanced_industrial_administration_desc_REMOVE: "Once the rudiments of industrial administration are established throughout our industrial base, more advanced administrative techniques such as cartels, conglomerates and inter-firm cooperation will be taught to our men on the ground."

 ## Concentrated Industry
 concentrated_industry1: "Vertical Industrial Organization I"
 concentrated_industry1_desc_REMOVE: "Industrial society benefits from the conglomeration of firms, labor, and resources. It is a simple fact of economics that centralization equates efficiency."
 concentrated_industry2: "Vertical Industrial Organization II"
 concentrated_industry2_desc_REMOVE: "Transportation is the veins that carry life through the nation. More railways, more roads, and more cars will increase productive forces."
 concentrated_industry3: "Vertical Industrial Organization III"
 concentrated_industry3_desc_REMOVE: "Modern industry is a way of life. Every act is an industrial act, every belief an industrial belief. We work to live and live to work."
 concentrated_industry4: "Vertical Industrial Organization IV"
 concentrated_industry4_desc_REMOVE: "High rise apartments condense labor in a way never seen before. Now people can live, work, and die all within the confines of a single neighborhood."
 concentrated_industry5: "Vertical Industrial Organization V"
 concentrated_industry5_desc_REMOVE: "Efficiency, progress, and technology never stop. The centralization of research with industry creates a wealth of opportunity."
 concentrated_industry6: "Vertical Industrial Organization VI"
 concentrated_industry6_desc_REMOVE: "Factories and farms are two sides of the same coin. Industrial agriculture is not an oxymoron, but rather the future. Farms benefit from advanced mechanics and in turn benefit society."
 concentrated_industry7: "Vertical Industrial Organization VII"
 concentrated_industry7_desc_REMOVE: "Labor and life are not separate. Work doesn't end at home anymore than it begins in the work place. We are always working, always producing."
 concentrated_industry8: "Vertical Industrial Organization VIII"
 concentrated_industry8_desc_REMOVE: "History is but a single infinite line stretching towards an industrial singularity. Farms, homes, and factories are all just the means of production, but so are we. The ideal human form is one of creation, endless creation for endless consumption. The human body is but a factory built for one purpose: production."

 ## Dispersed Industry
 dispersed_industry1: "Horizontal Industrial Organization I"
 dispersed_industry1_desc_REMOVE: "By decentralizing our industrial base and spreading it across our nation, all will share in the jobs and wealth that industry brings, at a cost to ease of transportation."
 dispersed_industry2: "Horizontal Industrial Organization II"
 dispersed_industry2_desc_REMOVE: "By improving the infrastructure of the nation, we shall improve our efficiency and productivity by a large margin, as well as making transport of goods easier."
 dispersed_industry3: "Horizontal Industrial Organization III"
 dispersed_industry3_desc_REMOVE: "Modern industry shall dominate our nation. Where once there was nothing but wilderness and empty space, new factories shall spring up as a source of prosperity, and the people will flock to them."
 dispersed_industry4: "Horizontal Industrial Organization IV"
 dispersed_industry4_desc_REMOVE: "By spreading our industry out around the country, we make it easy for any worker, in any place, to get to their shiny new factory job without having to pack up and move."
 dispersed_industry5: "Horizontal Industrial Organization V"
 dispersed_industry5_desc_REMOVE: "More railways and roads must be built to speed our transport of goods. The profits come first, and without the profits, our system will certainly die."
 dispersed_industry6: "Horizontal Industrial Organization VI"
 dispersed_industry6_desc_REMOVE: "Our industry shall be spread into smaller towns and cities in order to boost the prosperity of those who our industrial revolution has left behind. All will have the chance to work in industry."
 dispersed_industry7: "Horizontal Industrial Organization VII"
 dispersed_industry7_desc_REMOVE: "Continued investment into our industrial base is bound to increase the profits that we take in. After all, more money in means more money out."
 dispersed_industry8: "Horizontal Industrial Organization VIII"
 dispersed_industry8_desc_REMOVE: "Our nation is dotted with factories, each selling their own wares and their own goods. Everyone can share in the industrial prosperity that our economic plan has brought us. There is no place left behind here. All have seen the light of the industrial way, and we shall prosper because of it."

 ### Resources
 ## Resource Extraction
 resource_extraction_methods: "Modernized Resource Extraction Techniques"
 resource_extraction_methods_desc_REMOVE: "As a wise man once said "We can never dig too deep." With refinement to our resource gathering operations, whether through new machinery or better procedures, it shall allow us to extract more resources to better our economic position and harness Mother Earth's gifts."
 constructionmethods: "Modernized Construction Methods"
 constructionmethods_desc_REMOVE: "Rome wasn't built in a day, but neither would've our nation's factories and railways been without the strict  discipline and education our architects and builders had to undergo. With the quality of our workers, they ensure that our buildings are finished in a timely manner."
 excavation0: "Resource Extraction I"
 excavation0_desc_REMOVE: "With modern industry and warfare requiring even more raw materials, new extraction methods will allow the mining industry to provide what it needs."
 excavation1: "Resource Extraction II"
 excavation1_desc_REMOVE: "With new electric and automated equipment, mines and extraction facilities can easily surpass the most dedicated workers of the past decade."
 excavation2: "Resource Extraction III"
 excavation2_desc_REMOVE: "Gone are the days of pickaxe and shovel: now, pneumatic drills and electric carts allow for extremely fast resource production and transportation, perfect for fueling any growing industry."
 excavation3: "Resource Extraction IV"
 excavation3_desc_REMOVE: "New prospecting techniques, as well as deep-boring equipment, allow for the exploitation of ore veins and deposits that were previously unaccessible or even undiscovered."
 excavation4: "Resource Extraction V"
 excavation4_desc_REMOVE: "New automated routines and computers make their entry in the mining industry, allowing greater precision to both machinery and working crews, dramatically increasing efficiency and yield."
 excavation5: "Resource Extraction VI"
 excavation5_desc_REMOVE: "Miners are becoming more and more akin to engineers, as the new equipment requires highly skilled personnel to follow their complex programs. Still, the results cannot be denied."
 excavation6: "Resource Extraction VII"
 excavation6_desc_REMOVE: "Highly-automated extraction protocols and newly-developed waste inspection techniques allow even small crews to achieve more than hundreds of their counterparts did just a few decades ago."
 excavation7: "Resource Extraction VIII"
 excavation7_desc_REMOVE: "With automation reaching all corners of the extraction process, nothing is left to chance or human fallibility. Efficiency is skyrocketing, and profits with it."
 excavation8: "Resource Extraction IX"
 excavation8_desc_REMOVE: "The new age of mining has come. With fully-automated extraction and computerized resource processing, nothing is wasted, and ore veins are exploited with perfect efficiency."
 
 ## Oil Processing
 oil_processing: "Oil Processing"
 oil_processing_desc_REMOVE: "The last war taught how important fuel is. The new wave of aircraft and self-propelled equipment requires a far larger output, and the scientific world is ready to take the challenge."
 improved_oil_processing: "Improved Oil Processing"
 improved_oil_processing_desc_REMOVE: "Moving previously experimental methods for distillation to large-scale operations will provide higher yields at lower costs, allowing for greater expansion of the synthetic industry."
 advanced_oil_processing: "Advanced Oil Processing"
 advanced_oil_processing_desc_REMOVE: "New experimental purification techniques like hydrotreating can be used in oil manufacturing to greatly improve the final product, substantially increasing production rates and decreasing costs."
 modern_oil_processing: "Modern Oil Processing"
 modern_oil_processing_desc:1 "Our oil refineries can be further improved with new advanced oil processing methods like hydrocracking, alkylation, mercaptan oxidation and isomerization. Automatized processes and biological fuels will also increase efficiency and output."
 
 ## Rubber Processing
 rubber_processing: "Rubber Processing"
 rubber_processing_desc:1 "With rubber having become a staple of industry, large-scale processing of synthetic rubber is needed to reduce a nation's dependency on natural rubber."
 improved_rubber_processing: "Improved Rubber Processing"
 improved_rubber_processing_desc:1 "Large-scale production of synthetic rubber can be further improved and made cheaper with new automated processes to accelerate dehydrogenation reactions."
 advanced_rubber_processing: "Advanced Rubber Processing"
 advanced_rubber_processing_desc:1 "A general-purpose synthetic rubber recipe with improved processes such as dodecyl mercaptan polymerization modifiers will allow the nations with the means to afford it to expand synthetic rubber production."
 modern_rubber_processing: "Modern Rubber Processing"
 modern_rubber_processing_desc:1 "Fully-optimized and computer-checked polymerization processes will result in lower costs and higher output, projecting rubber production into the new age."
 
 ### Construction
 ## Civilian Construction
 construction0: "Civilian Construction I"
 construction0_desc_REMOVE: "Better housing and equipment for our workers allows for us to quickly complete our building projects on schedule.\n\n"
 construction1: "Civilian Construction II"
 construction1_desc_REMOVE: "The introduction of mechanization and automation in building operations, such allows for the faster construction of our various industries.\n\n"
 construction2: "Civilian Construction III"
 construction2_desc_REMOVE: "The organization of the workers via timetables and schedules allows for synchronization between the different groups in completing projects on time.\n\n"
 construction3: "Civilian Construction IV"
 construction3_desc_REMOVE: "With the improvement of modern heavy-duty vehicles such as bulldozers, cranes, excavators, and concrete mixers, it should allow for more work completed for less time.\n\n"
 construction4: "Civilian Construction V"
 construction4_desc_REMOVE: "With better urban planning, it will allow for larger and more numerous buildings to be constructed while maximizing our space.\n\n"
 construction5: "Civilian Construction VI"
 construction5_desc_REMOVE: "By contracting massive building projects with large firms, we may be able to work on multiple amounts of widespread industrial expansions\n\n"
 construction6: "Civilian Construction VII"
 construction6_desc_REMOVE: "New tools allow for quicker and more efficient build speed. Another boon is that it can be easily used and even some inexperienced workers can quickly learn and operate them.\n\n"
 construction7: "Civilian Construction VIII"
 construction7_desc_REMOVE: "With the advent of massive skyscrapers, the size of the vehicles to carry larger and increased load of construction materials has increased.\n\n"
 construction8: "Civilian Construction IX"
 construction8_desc_REMOVE: "Our cranes are spotted on every block. Empty lots one day, replaced by towering factories the next. There is a shortage, not of jobs, but of people to fill them.\n\n"
 
 ## Military Construction
 military_construction0: "Military Construction I"
 military_construction0_desc_REMOVE: "Military construction has long held a reputation for haphazard and poorly considered design paradigms. Thankfully, modern developments will allow us to make this process more efficient than ever before.\n\n"
 military_construction1: "Military Construction II"
 military_construction1_desc_REMOVE: "The advent of new equipment and technology has allowed us more quickly produce tanks, artillery and other weapons of war.\n\n"
 military_construction2: "Military Construction III" 
 military_construction2_desc_REMOVE: "Military factories are being upgraded with the latest technology stolen from civilian factories around the world. Soon we will have the best machines that money can buy.\n\n"
 military_construction3: "Military Construction IV"
 military_construction3_desc_REMOVE: "Better coordination among work staff and management will allow us to produce equipment and vehicles faster, and of better quality.\n\n"
 military_construction4: "Military Construction V"
 military_construction4_desc_REMOVE: "Using computer-assisted design, we'll be able to keep our schematics up-dated and as effective as possible. Soon there will be nothing that can stop the unstoppable production lines of our nation.\n\n"
 military_construction5: "Military Construction VII"
 military_construction5_desc_REMOVE: "By introducing more modern and carefully calibrated drill and design mechanisms, we will be able to produce military equipment faster and more efficiently.\n\n"
 military_construction6: "Military Construction VII"
 military_construction6_desc_REMOVE: "Modern designs allow for factories with fewer workers each, allowing a better spread of equipment production. This will allow for greater flexibility and productivity overall.\n\n"
 military_construction7: "Military Construction VIII"
 military_construction7_desc_REMOVE: "Our workers know no world beside their work. Our managers keep them to their place. The line keeps moving. The wheels keep turning. The tanks roll straight off the assembly line and onto the battlefield.\n\n"

