  ## Normie Artillery ##
   artillery_1950_soft_attack: "90's Artillery Armament Upgrade"
   artillery_1950_soft_attack_desc_REMOVE: "Compounding on World War II era designs, these shells pack a higher yield for a lower cost. Effective at softening hard targets, as well as providing fire support, they are a must have in modern warfare."
   artillery_1970_soft_attack: "Late 2000's Artillery Armament Upgrade"
   artillery_1970_soft_attack_desc_REMOVE: "Continued improvements in efficiency and yield have allowed for highly destructive payloads. These armaments make their decade old counterparts foolish in comparison"
  ## Normie Artillery ##

  ## Light Self-Propelled Artillery / Light SPART ##
   # Upgrade- Speed (OLD)
   light_SPART_1950_speed: "90's Light SPART Speed Upgrade"
   light_SPART_1960_speed: "2000's Light SPART Speed Upgrade"
   light_SPART_1970_speed: "Late 2000's Light SPART Speed Upgrade"
   light_SPART_1980_speed: "2010's Light SPART Speed Upgrade"

   # Upgrade- Armament
   light_SPART_1950_soft_attack: "90's Light SPART Armament Upgrade"
   light_SPART_1950_soft_attack_desc_REMOVE: "The early upgrades to SPART guns allowed for more mobility and a higher firing rate within the driving brand, enabling greater lethality."
   light_SPART_1960_soft_attack: "2000's Light SPART Armament Upgrade"
   light_SPART_1960_soft_attack_desc_REMOVE: "Our combat experience shows that maneuverability is key to providing fire support in close firefights. We will improve our designs accordingly."
   light_SPART_1970_soft_attack: "Late 2000's Light SPART Armament Upgrade"
   light_SPART_1970_soft_attack_desc_REMOVE: "We can improve the accuracy and the reliability of the main gun, which several of our soldiers have complained about. This will allow our system to be even more effective in combat."
   light_SPART_1980_soft_attack: "2010's Light SPART Armament Upgrade"
   light_SPART_1980_soft_attack_desc_REMOVE: "Our missile systems can be updated to fire longer range rockets, and include GPS guidance systems for laser-sharp accuracy to compliment their overwhelming firepower against the enemy."
  ## Light Self-Propelled Artillery / Light SPART ##

  ## Self-Propelled Artillery / SPART ##
   # Speed Upgrade (Deprecated)
   SPART_1950_speed: "90's SPART Speed Upgrade"
   SPART_1960_speed: "2000's SPART Speed Upgrade"
   SPART_1970_speed: "Late 2000's SPART Speed Upgrade"
   SPART_1980_speed: "2010's SPART Speed Upgrade"

   # Upgrade- Armament
   SPART_1950_soft_attack: "90's SPART Armament Upgrade"
   SPART_1950_soft_attack_desc_REMOVE: "After early use of self-propelled artillery during World War II, the next advances made in the field allowed self-propelled artillery to be airdropped to support airborne forces."
   SPART_1960_soft_attack: "2000's SPART Armament Upgrade"
   SPART_1960_soft_attack_desc_REMOVE: "An increased diversity of armament types on SPARTs designed in the 1960s allowed better operational and tactical flexibility."
   SPART_1970_soft_attack: "Late 2000's SPART Armament Upgrade"
   SPART_1970_soft_attack_desc_REMOVE: "The 1970s saw the introduction of missiles to supplement the armaments of SPARTs, increasing their range and killing power against both infantry and armor."
   SPART_1980_soft_attack: "2010's SPART Armament Upgrade"
   SPART_1980_soft_attack_desc_REMOVE: "The more advanced SPART cannons allowed for an almost universal coverage of the modern battlefield. Just moments after the beginning of an engagement, infantry could be fully supported."
  
   # Stuff That Was Added Last Minute
   
   light_SPART_1950_soft_attack: "90's Light SPART Barrel Improvements"
   light_SPART_1950_soft_attack_desc_REMOVE: "The early upgrades to SPART guns allow for more mobility and a higher firing rate within the driving brand, enabling greater lethality."
   light_SPART_1950_soft_attack_2: "90's Light SPART Machine Guns"
   light_SPART_1950_soft_attack_2_desc_REMOVE: "Light self-propelled artillery is currently equipped with smaller-caliber weaponry. The addition of short-range machine guns will mean that these self-propelled artillery batteries still have some level of defensive capabilities."
   light_SPART_1950_soft_attack_3: "90's Light SPART Shell Redesign"
   light_SPART_1950_soft_attack_3_desc_REMOVE: "Light self-propelled artillery has usually used simple shells without significant upgrade. By using new molding technologies and recalculating aerodynamics, we can make our shells go faster and longer."
   light_SPART_1950_armor: "90's Light SPART Armor Upgrade"
   light_SPART_1950_armor_desc_REMOVE: "By refining our designs, our artillery will go farther and be more fuel efficient."
   light_SPART_1950_armor_2: "90's Light SPART Ceramic Armor"
   light_SPART_1950_armor_2_desc_REMOVE: "New technologies like ceramic armor are becoming a mainstay in armored vehicles. Applying them to our self-propelled artillery will require some adaptation, but is a no-brainer."
   light_SPART_1950_armor_3: "90's Light SPART Composite Armor"
   light_SPART_1950_armor_3_desc_REMOVE: "Composite armor is expensive and still a new field, but the promises it offers to protection and it's lightweight qualities are worthy of implementation across the field."
   SPART_1950_soft_attack: "90's SPART Lighted Frame"
   SPART_1950_soft_attack_desc_REMOVE: "After early use of self-propelled artillery, the next advances made in the field allowed self-propelled artillery to be airdropped to support airborne forces."
   SPART_1950_soft_attack_2: "90's SPART Larger Caliber Guns"
   SPART_1950_soft_attack_2_desc_REMOVE: "If there is one simple fact in war, it is that bigger guns and bigger bullets cause more destruction. There's no harm in increasing caliber size."
   SPART_1950_soft_attack_3: "90's SPART Shell Redesign"
   SPART_1950_soft_attack_3_desc_REMOVE: "Self-propelled artillery has usually used simple shells without significant upgrade. By using new molding technologies and recalculating aerodynamics, we can make our shells go faster and longer."
   SPART_1950_armor: "90's SPART Armor Upgrade"
   SPART_1950_armor_desc_REMOVE: "By refining our designs, our artillery will go farther and be more fuel efficient."
   SPART_1950_armor_2: "90's SPART Ceramic Armor"
   SPART_1950_armor_2_desc_REMOVE: "New technologies like ceramic armor are becoming a mainstay in armored vehicles. Applying them to our self-propelled artillery will require some adaptation, but is a no-brainer."
   SPART_1950_armor_3: "90's SPART Composite Armor"
   SPART_1950_armor_3_desc_REMOVE: "Composite armor is expensive and still a new field, but the promises it offers to protection and it's lightweight qualities are worthy of implementation across the field."
   artillery_1950_soft_attack: "90's Artillery Armament Upgrade"
   artillery_1950_soft_attack_desc_REMOVE: "Compounding on earlier designs, these shells pack a higher yield for a lower cost. Effective at softening hard targets, as well as providing fire support, they are a must have in modern warfare."
   artillery_1950_soft_attack_2: "90's Artillery 'Base Bleed'"
   artillery_1950_soft_attack_2_desc_REMOVE: "One innovation recently developed in artillery to increase range is "base bleed" - a controlled amount of fuel being let go out of the back of the shell in order to increase aerodynamic efficiency. When engineered correctly, this technique can allow shells to go 15-30% farther."
   artillery_1950_soft_attack_3: "90's Artillery Rocket Assisted Projectiles"
   artillery_1950_soft_attack_3_desc_REMOVE: "While perhaps the most expensive option, rocket assisted projectiles have small rocket engines inside that can shoot shells as far as practically needed."
   light_SPAA_1950_air_attack: "90's Light SPAA Armament Upgrade"
   light_SPAA_1950_air_attack_desc_REMOVE: "With additional seed the light SPAA is capable of quickly maneuvering to strategic positions in order to support infantry against enemy aircraft."
   light_SPAA_1950_air_attack_2: "90's Light SPAA Larger Guns"
   light_SPAA_1950_air_attack_2_desc_REMOVE: "Jet planes have rendered the smaller caliber weapons of the past useless. Larger guns, with longer ranges and faster shell velocities, are the only real practical option in our new, terrifying world."
   light_SPAA_1950_air_attack_3: "90's Light SPAA Radar Guides"
   light_SPAA_1950_air_attack_3_desc_REMOVE: "With conventional guns it is almost impossible to take down jets. However, the introduction of radar guiding will allow for bullets to land, even with a ton of inaccuracy."
   light_SPAA_1950_armor: "90's Light SPAA Armor Upgrade"
   light_SPAA_1950_armor_desc_REMOVE: "By refining our designs, our anti-aircraft weapons will go farther and be more fuel efficient."
