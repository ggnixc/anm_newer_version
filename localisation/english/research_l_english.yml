  ## Cruisers ##
   # Missiles (Modifier)
   improved_cruiser_missile: "Ship Based Missiles I"
   improved_cruiser_missile_desc_REMOVE: "Missiles are a natural addition to the capabilities of a cruiser class vessel. Naval warfare will no longer be dominated by torpedoes and cannons."
   advanced_cruiser_missile: "Ship Based Missiles II"
   advanced_cruiser_missile_desc_REMOVE: "Improved missiles are better at hitting their targets while also exploding."
   early_modern_cruiser_missile: "Ship Based Missiles III"
   early_modern_cruiser_missile_desc_REMOVE: "Advanced ship based missiles are armed with more powerful warheads and stronger engines, a deadly combination that improves the capabilities of our cruisers."
   modern_cruiser_missile: "Ship Based Missiles IV"
   modern_cruiser_missile_desc_REMOVE: "Modern ship based missiles scream through the air at the speed of sound. Advanced computers, powerful warheads, and strong propulsion create a truly awe inspiring weapon."

   # Nuclear Reactor (Modifier)
   improved_cruiser_nuclear: "Cruiser Nuclear Reactor I"
   improved_cruiser_nuclear_desc_REMOVE: "Cruisers are capable of carrying large nuclear reactors which can supply them with energy for long, extended periods of time allowing them to fight without docking for large campaigns."
   advanced_cruiser_nuclear: "Cruiser Nuclear Reactor II"
   advanced_cruiser_nuclear_desc_REMOVE: "Advanced nuclear reactors have better fuel efficiency and greater output."
   early_modern_cruiser_nuclear: "Cruiser Nuclear Reactor III"
   early_modern_cruiser_nuclear_desc_REMOVE: "Improved nuclear reactors are capable of truly great outputs along with a revolutionary waste disposal system which reduces the chance of contamination."
   modern_cruiser_nuclear: "Cruiser Nuclear Reactor IV"
   modern_cruiser_nuclear_desc_REMOVE: "Modern nuclear reactors, along with being comically large, provide equally large outputs, dwarfing previous models in terms of both size and productivity."
  ## Cruisers ##

  ## Battleships ##
   # Nuclear Reactor (Modifier)
   improved_battleship_nuclear_engine: "Battleship Nuclear Reactor I"
   improved_battleship_nuclear_engine_desc_REMOVE: "When the philosophers asked how to get more speed and power out of a massive floating hunk of steel and explosives that is the modern battleship, the engineers answered that they could make it nuclear powered."
   advanced_battleship_nuclear_engine: "Battleship Nuclear Reactor II"
   advanced_battleship_nuclear_engine_desc_REMOVE: "The second generation of nuclear powered reactors for battleships are for more fuel efficient and less prone to sudden explosions than their ancestors. Yet they still in some ways feel like the prototypes of greater things."
   early_modern_battleship_nuclear_engine: "Battleship Nuclear Reactor III"
   early_modern_battleship_nuclear_engine_desc_REMOVE: "Third generation nuclear reactors for battleships are some of the most advanced of their kind in any ship on earth, fueling a several thousand tonne hunk of metal is no easy feat after all. They manage it still."
   modern_battleship_nuclear_engine: "Battleship Nuclear Reactor IV"
   modern_battleship_nuclear_engine_desc_REMOVE: "The modern nuclear reactor of a battleship is a work of art in many ways, eking every scrap of energy out of the nuclear reactions going on within its heart. The battleships of the modern era might not be the most tactically viable, but they are certainly fearsome."
  ## Battleships ##

  ## Carriers ##
   # Nuclear Reactor (Modifier)
   improved_carrier_nuclear_engine: "Nuclear Ship Reactor"
   improved_carrier_nuclear_engine_desc_REMOVE: "Onboard nuclear reactors allow for long periods of deployment, the only downside being the dangerous fuel, waste, and possibility of meltdown."
   advanced_carrier_nuclear_engine: "Advanced Reactor"
   advanced_carrier_nuclear_engine_desc_REMOVE: "Advanced reactors are more fuel efficient, produce more energy, and have more fail safes."
   early_modern_carrier_nuclear_engine: "Early-Modern Reactor"
   early_modern_carrier_nuclear_engine_desc_REMOVE: "Improvements in uranium enrichment processes allows for extended use of nuclear reactors beyond the capabilities of previous designs."
   modern_carrier_nuclear_engine: "Modern Reactor"
   modern_carrier_nuclear_engine_desc_REMOVE: "Modern nuclear reactors are defined by enormous energy output, remarkable efficiency, and a lessened tendency to explode."
  ## Carriers ##

  ## Submarines ##
   # Nuclear Reactor (Modifier)
   improved_nuclear_submarine: "Submarine Nuclear Reactor I"
   improved_nuclear_submarine_desc_REMOVE: "Submarines are lone, solitary hunters. Nuclear reactors are a natural development, allowing them to prowl the seas for extended periods of time without having to dock."
   advanced_nuclear_submarine: "Submarine Nuclear Reactor II"
   advanced_nuclear_submarine_desc_REMOVE: "New reactors are less likely to explode and thus poisoning the ocean with radioactive waste and killing thousands of animals and plants."
   early_modern_nuclear_submarine: "Submarine Nuclear Reactor III"
   early_modern_nuclear_submarine_desc_REMOVE: "New reactors produce more power for less uranium. Will a fuel so rare and expensive, efficiency is king."
   modern_nuclear_submarine: "Submarine Nuclear Reactor IV"
   modern_nuclear_submarine_desc_REMOVE: "Top of the line nuclear reactors are good at making the submarine move safely and quietly."
