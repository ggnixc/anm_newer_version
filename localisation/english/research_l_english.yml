 support_folder: "Support"
 support_folder_desc_REMOVE: "Reconnaissance, engineers, field hospitals, transport helicopters, and other support companies"

 # Headers / Section Titles (Zilch)

 ## Engineer Company
 tech_engineers: "Engineer Company I"
 tech_engineers_desc_REMOVE: "Construction of fortifications and breaching obstacles make combat engineers vital in the field. Giving our engineers a versatile role enables us to deploy them in the diverse situations where they will be needed."
 tech_engineers2: "Engineer Company II"
 tech_engineers2_desc_REMOVE: "With modern equipment and high explosives, our engineers can go beyond their traditional tasks and surprise the enemy with their ingenuity, at land and sea."
 tech_engineers3: "Engineer Company III"
 tech_engineers3_desc_REMOVE: "Military engineering projects are approaching a larger scale. The construction of advanced infrastructural aid enables operations requiring supplies beyond what is normally available."
 tech_engineers4: "Engineer Company IV"
 tech_engineers4_desc_REMOVE: "The development and implementation of armored military engineering vehicles will significantly improve the scope of what our engineering teams can accomplish while in the field."
 tech_engineers5: "Engineer Company V"
 tech_engineers5_desc_REMOVE: "In addition to proving logistics for our own troops, we can instruct our combat engineers on counter-mobility techniques, such as destroying bridges, blocking roads, and creating airstrips for friendly CAS."
 tech_engineers6: "Engineer Company VI"
 tech_engineers6_desc_REMOVE: "Maintaining local mobility while constructing what would previously have been considered permanent fortifications and supply systems, our combat engineers will ensure that our troops will be prepared no matter where they are attacked."

