 internettech_4: "Web 2.0"
 internettech_4_desc_REMOVE: " "
 internettech_5: "Blockchains"
 internettech_5_desc_REMOVE: " "
 internettech_6: "Information Society"
 internettech_6_desc_REMOVE: "The Weltnetz/Internet has changed society as much as the Industrial Revolution itself. The majority of the population uses the web on a daily basis, the most remote corners of the world have been connnected, and a seemingly infinite ammount of information is created, stored and accessed on a daily basis. Terrabytes of data are not an astromically high number anymore, but mere fractions of the Weltnetz/Internets size."
 # Fire Control Systems
 basic_fire_control_system: "Basic Fire Control System"
 basic_fire_control_system_desc_REMOVE: "Dating from the 1930s and the 1940s, fire control systems make use of radar operations, analogue computers and gyroscopes to plot fire missions. While rather rudimentary and crude by modern standards, basic GFCS are still effective to this date."
 improved_fire_control_system: "Improved Fire Control System"
 improved_fire_control_system_desc_REMOVE: "Improved fire control systems implemented the beginning of digital computing technology, allowing guns to better communicate with their operators and track their targets."
 advanced_fire_control_system: "Advanced Fire Control System"
 advanced_fire_control_system_desc_REMOVE: "Advanced fire control systems have in-built chips allowing them to predict target movement and aim and engage correspondingly. Few can escape."

 # Encryption (DEPRECATED)
 basic_encryption:1 "Encryption - Polyalphabetic Ciphers"
 basic_encryption_desc_REMOVE: "With new methods of communication comes new risks for interception. Rotor cipher machines can be used to allow for rapid, complex encryption."
 improved_encryption:1 "Encryption - Cyclic Permutations"
 improved_encryption_desc_REMOVE: "Limitation in the randomization of cipher machines can be exploited to break the ciphers. By improving the randomness of the rotor mechanics, we can make this kind of cryptanalysis more difficult."
 advanced_encryption:1 "Encryption - Pulse-code Modulation"
 advanced_encryption_desc_REMOVE: "Technological improvements and hard-earned experience allows us to implement more traffic flow security measures in our communication."
 encryption_1950: "Encryption - Non-reciprocal rotary"
 encryption_1950_desc_REMOVE: "In this variation of a reciprocal rotary, The key needs to be shifted either by three or its negative counterpart when converting from cypher to plaintext and vice versa. This ensures a harder code to decrypt."
 encryption_1960: "Encryption - Shift registers"
 encryption_1960_desc_REMOVE: "The system is timed with each shift at each tick interval. Once all registers are filled, the rightmost number gets pushed out, shifting the position of the number and jumbling the message."
 encryption_1970: "Encryption - Block cipher"
 encryption_1970_desc_REMOVE: "A systematic process where the program always uses an algorithm to block a section of the text rather than slowly encrypting one piece at a time. This ensures that encryption is quick and reliable."
 encryption_1980: "Encryption - Oblivious transfer"
 encryption_1980_desc_REMOVE: "The sender sends one of its potential pieces of information to the receiver while remaining unaware that it did transfer a piece at all." 
 encryption_1990: "Encryption - Asymmetrical cryptography"
 encryption_1990_desc_REMOVE: "The system uses a pair of keys, a key which could be for public use, and a private key that only the receiver would hold. This allows for easy encryption via public key, however the message can only be decrypted by the private key, held by a sole owner."

 # Decryption (DEPRECATED)
 basic_decryption:1 "Decryption - Frequency Analysis"
 basic_decryption_desc_REMOVE: "Cryptanalysis is increasingly becoming an advanced mathematical science. Systems like card catalogs and devices like cyclometers can aid the necessary work."
 improved_decryption:1 "Decryption - Side-channel Attack"
 improved_decryption_desc_REMOVE: "The development of more sophisticated computers allows for new applications of cryptanalysis methods like differencing, which can be used to break advanced cyphers when combined with new hand codebreaking methods."
 advanced_decryption:1 "Decryption - Automated Deduction"
 advanced_decryption_desc_REMOVE: "The increased computation power that improved our cryptanalysis so far threatens to create nearly unbreakable ciphers in the future. To stay ahead, we must be prepared to work more aggressively on gaining inside information on the technology."
 decryption_1950: "Decryption - Chosen-plaintext attack"
 decryption_1950_desc_REMOVE: "The earliest forms of decryption involved using glorified guesswork to acquire the secret key. That it is still being used today is a testament to its timeless efficiency."
 decryption_1960: "Decryption - Adaptive plaintext attack"
 decryption_1960_desc_REMOVE: "If it doesn't work, try again with a different approach. The adage holds no less true in brute force decryption."
 decryption_1970: "Decryption - Chosen-ciphertext attack"
 decryption_1970_desc_REMOVE: "If even brute force doesn't work, then one can always trick a fool to lend their key instead."
 decryption_1980: "Decryption - Adaptive ciphertext attack"
 decryption_1980_desc_REMOVE: "Sometimes it's a hassle to snatch the fool's key. In that case, one can always send him a multitude of malformed keys which he'll soon set straight."
 decryption_1990: "Decryption - Related-key attack"
 decryption_1990_desc_REMOVE: "So assured are some keyholders with their possession's complexities that they never bother to check if someone else shares a similar key to theirs."

 ## Rockets & Nukes (DEPRECATED)
 # Rockets
 experimental_rockets: "Experimental Rockets"
 experimental_rockets_desc_REMOVE: "Advancing the science of rocketry by improving the range and reliability of liquid-fuel rockets will teach us enough about the technology to allow the construction of launch sites for more advanced models."
 rocket_engines: "Rocket Engines"
 rocket_engines_desc_REMOVE: "Knowledge of rocket propulsion is reaching a point where we can construct flying bombs and rocket-powered aircraft, operating at previously unreachable speeds."
 improved_rocket_engines: "Improved Rocket Engines"
 improved_rocket_engines_desc_REMOVE: "The first long-range ballistic missiles can be built and made ever more precise, reaching distant enemy cities and even into space."
 advanced_rocket_engines: "Advanced Rocket Engines"
 advanced_rocket_engines_desc_REMOVE: "The future of rocketry opens up possibilities like intercontinental missiles, the range of which knows few limits while the payloads grow more lethal."

 # Rocket Interceptors
 rocket_interceptor: "Rocket Interceptor"
 rocket_interceptor_desc_REMOVE: "Rocket-powered interceptor aircraft based on gliders can, for short periods of time, move faster than any other plane. While volatility of the fuel puts the planes at risk, they can take off and react to attacks faster than any enemy will expect."
 rocket_interceptor_2: "Rocket Interceptor II"
 rocket_interceptor_2_desc_REMOVE: "Still considered extremely dangerous to operate, the rocket-powered fighters are now aided by auto-pilots and towing by other aircraft to maximize the use of their extreme speed but short fuel window."
 rocket_interceptor_3: "Rocket Interceptor III"
 rocket_interceptor_3_desc_REMOVE: "New landing techniques and safer fuel systems have improved rocket fighters' chance of success and survival significantly, fulfilling the once theoretical potential of these cutting-edge vehicles."

 # Nukes
 atomic_research: "Atomic Research"
 atomic_research_desc_REMOVE: "In nuclear fission, splitting the atom yields enormous amounts of energy and limitless destructive capability."
 nukes: "Nuclear Bombs"
 nukes_desc_REMOVE: "A project to construct an atomic bomb will be one of the most secretive and difficult tasks a nation can undertake, but, if successful, may change not only the course of today's wars but of the future of the world."
