   antiair_1950_air_attack: "90's Anti-Air Armament Upgrade"
   antiair_1950_air_attack_desc_REMOVE: "While our anti-air cannons are powerful, it has grown quite difficult to effectively land hits on an enemy jet. Improved sights will be added to the weaponry, as well as a radar scanner and improved announcement to do maximum damage."
