### Leader Descriptors ###
 ## Country Leader ##
 POLITICS_HOGNI_HOYDAL_DESC: "No one likes cleaning up someone else's mess, but unfortunately for Anfinn Kallsberg, that's his new job as Prime Minister of the Faroes.\n\nBorn just a year after Independence, Kallsberg joined the People’s Party and became an MP in 1985. When the People’s Party entered into a Coalition Government with the Republicans in 1989, he became the Fisheries Minister. While in Coalition, he became aware of the nation's almost total reliance on the Fishing Industry. However, before he could do anything meaningful to fix this, the Coalition Government Collapsed and the Equality Party returned to power.\n\nKallsberg became party leader in 1992, right as the Faroese Economy began to collapse. The Equality Party’s poor response and Kallsberg’s early warnings about the economy helped lead his party back to power in 1993 and form a new government alongside the Centre Party. Kallsberg’s Government had successfully stabilised the economy, but the slow economic recovery has agitated many Faroese Citizens, who could once again return to the Equality Party under the Dam Family to save their nation."
 The_Cautious_Reformer: "The Cautious Reformer "
 ## Ministers ##

### Ideas ### 
 FAR_Economic_Disaster: "The Economic Disaster"
 FAR_Economic_Disaster_desc: "In the Early 1990s, the Faroese Fishing Industry began to collapse due to falling fish stocks, competition from Iceland, the Shetlands and Britain and poor economic management. Since the Fishing Industry was by far the largest sector of the economy and was an Export-Heavy Industry, the Wider Faroese Economy started to collapse with it.\n\nThis Economic Disaster led to the Equality Party being ousted from power in 1993 and replaced by a Conservative Coalition under Anfinn Kallsberg. Kallsberg’s government had managed to stabilise the economy and start a slow recovery process. However, many in Tórshavn are now wary of the current state of the Faroese Economy and whether its almost total reliance on the Fishing Industry is the best plan."
 FAR_Dam_Legacy: "The Dam Legacy"
 FAR_Dam_Legacy_desc: "Peter Mohr Dam and Atli Dam, Father and Son Duo, and the men responsible for forging the Faroes into what it is today. Both men sought to tie the Islands closer towards the OFN while at the same time, negotiating with the OFN to grant them more Independence. This Agenda was very popular with voters, which in turn made their Equality Party the Dominant Party in Faroese Politics, with Atli Dam the on-and-off-again Prime Minister since the 1970s."
 FAR_Can_We_Be_Independent: "Can we truly be Independent?"
 FAR_Can_We_Be_Independent_desc: "Ask a Faroese Student when the Faroe Islands became Independent, and they’ll tell you 1946. Ask a Faroese Politician the same question, and they’ll tell you it’s yet to happen. Since its Declaration of Independence, the Faroes have already demanded total Independence, but the OFN’s influence over the Islands had prevented this for many decades, treating the Faroes like a glorified military base.\n\nSince the Iceland Crisis, the Faroese Government has slowly begun to claw back complete control of the nation. However, the Islands seemed to have peaked in its Independence. The lack of a functioning native army and almost total reliance on trade with the OFN and Energy with the Shetlands has made total Independence almost impossible. Unless there was to be a radical shift in the Geo-Political Scene, there isn't much the Faroese can do to change this situation."