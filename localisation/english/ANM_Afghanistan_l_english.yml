 ################
 ##LEADER DESCS##
 ################
 POLITICS_AKRAM_YARI_DESC: "Head of SPRA Akhram Yari and his Progressive Youth Organization (PYO) that was founded after the collapse of Gulbuddin government after that the peaceful protest called “Milion moments for democracy” started the Afghan spring. Akhram Yari and PYO used violence only when radical islamists from Taliban clashed with them at the gates of Daral Aman Palace. Popular by youth and among the urban people of afghanistan. Akhram Yari is beloved by youth, inteligence and commoners.§!"
 POLITICS_COUNCIL_OF_GENERALS_DESC: "After GAW result of siding with japan and defeat against false believers in indian government collapsed and was established a strong dictatorship on which head was general council of Hezb-e Islami Gulbuddin. Hezbi Islami seeks to emulate the Muslim Brotherhood and to replace the various tribal factions of Afghanistan with one unified Islamic state. This puts them at odds with the more tribe-oriented Taliban. Ultimate goal of general council of Hezb-e Islami Gulbuddin is to seek vengeance for GAW and keep the traditional values of afghanistan. Most of the reformists fled to Socialist People's Republic of Afghanistan.§! "
 POLITICS_AKRAM_MANSOUR_DESC: "Pashtun Islamic fundamentalist, militant Islamist, and jihadists. After the collapse of the Gulbuddin regime they broke out of the government and refused to form a new goverment under de-facto millitray junta the noradical enough islamist generals and announced to conquer Kabul and Afganistan under Mujahideen warlord led by Amir al-Mu'minin Akhtar Mansour.§!" 
