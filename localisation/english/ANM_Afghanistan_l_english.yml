### National Spirits ###
 AFG_Beggars_Cant_Be_Choosers: "Beggars Can't Be Choosers"
 AFG_Beggars_Cant_Be_Choosers_desc: "As always, foreign aid funds Afghanistan, and currently it comes from the Soviets. Amin’s regime no longer gets aid from Germany and Japan, meaning the little the Soviets give forces Amin to be harsher on the general populace. Resentment towards his regime has grown from these economic policies."
 AFG_Graveyard_Of_Exiles: "Graveyard of Exiles"
 AFG_Graveyard_Of_Exiles_desc: "the NRA and ETRP (East Turkestan Revolutionary Party) have a semi-stable alliance backing the Afghan government (forced to cooperate in a way). The Central Asian dissidents, including Islamists and general anti-Soviet actors, hide out in the mountains and receive minor funding from Iranian and Turkish contacts, fighting MGB and Afghan government troops. Dissatisfied Islamists, aristocrats, and others in Afghanistan also chafe under Amin’s rule and several actors have been building strength in Pakistan. The Afghan and Central Asian dissidents ache for total war, and if they get the opportunity perhaps they’d take advantage of the situation and go after the government."
 AFD_Spirit_1: "Spirit One"
 AFD_Spirit_1_desc: "Something about the backing of the Pashtun landed class/Afghan landed class."
 AFD_Spirit_2: "Spirit Two"
 AFD_Spirit_2_desc: "Something about the Pakistani chokehold and how they are basically subservient to Pakistan."
 AFD_Spirit_3: "Spirit Three"
 AFD_Spirit_3_desc: "A natspirit detailing how the aristocratic/royalist groups get along with the Islamist ones. Also a small bit detailing the Central Asian dissident role in the revolt."
 