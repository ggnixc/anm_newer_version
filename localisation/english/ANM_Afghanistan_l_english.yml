##################
##IDEAS Starting##
##################

AFG_defeat_in_the_great_asian_war: "Defeat in Great Asian War"
AFG_defeat_in_the_great_asian_war_desc: "Great Asian War was supposed by Hekmatyar regime win the glory to Afghan nation and unite all Muslims west and east of Indus river but Hekmatyar's regime lost and Afghanistan needed to pay a big price for their actions. Treaty of Kabul was a big humiliation for the Afghan nation and to this day the nation is in shame.§!"

AFG_afghan_civil_war: "Afghan Civil War"
AFG_afghan_civil_war_desc: "The Treaty of Kabul saw humiliation of the Afghan people and government. Afghans stopped trusting Hekmatyar's regime and riots spread.  Various tribes across country declared Hekmatyar as enemy within. Afghan Generals turned against their leader and deposed him from power, hanging him in the streets of Kabul. Shortly after the students and Mujahadeens rose up and assaulted Kabul pushing the Military junta west. Students with popular support and new aid from the Soviet Union pushed Mujahadeens south of the city and a stalemate was settled. Afghanistan is now in a 2 year long warlord era that brink Afghanistan into pre-196s levels. §!"

AFG_soviet_support: "Soviet support Low§!"
AFG_soviet_support_desc: "Soviet Union after 2WRW setted a new goal and to prevent spreading of fascism and helped various socialist factions across the world. Progressive Youth Organization of Akhram Yari was one of them. Soviet leadership funded and teached PYO and helped them financially to help secure Kabul and areas around the capital. Now after 2 years of socialist rule over Northeastern Afghanistan soviet influence grows.§!"

AFG_us_support: "US Support Minimum§!"
AFG_us_support_desc: "The United States of America is politically supporting a small fraction of social democrat neo-baathists from PDPA called  Afghan Spring Party (ASP) led by Abdul Rahim Hatif. Main goal of this support is to spread more moderate socialism across the Arab world and stop radicalisation of Middle East.§!"

AFG_Zahir_Shah: "Zahir Shah"
AFG_Zahir_Shah_desc: "Zahir Shah, the King of Afghanistan.§!"

AFG_saudi_support: "Saudi support §HMedium§!"
AFG_saudi_support_desc: "Saudis wahhabistic theories bring Taliban under their nose. Saudi Arabia has great political and economic interest in Taliban controlled Afghanistan. Taliban and Saudi Arabia have simillar religiouse opinions and this convinced Saudis to support the islamist fundamentalists. Another reason for Saudi support is economic reason because of great deposits of lead,copper,Aluminium and gold all these sites are controlled by Taliban.§!"

AFG_secret_aid_baluch: "Baluchistan secret aid route §R1 route§!"
AFG_secret_aid_baluch_desc: "Baluchistan intelligence agency is only properly functioning ministry in new Baluchistan solly controlled by Saudi Arabia. BIA established series of routes to Afghanistan to support Taliban thru this routes many resources, arms and troops are transported in and out of afghanistan.§!"

AFG_uae_influence: "UAE influence §RHigh§!"
AFG_uae_influence_desc: "United Arab Emirates is oil rich country and their leaders are people with massive wealth and how better use this wealth other than gain more wealth. This exactly what happened to Afghan government after end of GAW and treaty of Kabul UAE saw its moment to seize recourse rich country of Afghanistan and thru Iran supported routes deposed Hekmatyar and established de-factopuppet regime the non popular Council of Generals. Majority of Generals are on UAEpayroll these actions are all secretly kept in Dubai.§!"

AFG_corrupt_generals: "Corruped generals §RHigh§!"
AFG_corrupt_generals_desc: "Corrupt Generals who deposed Hekmatyar and took power in afghanistan. Its council of Generals a military junta in warlord mode. Corruption in Afghan Chifdom is widely spread like cancer and funded by foreign powers.§!"

