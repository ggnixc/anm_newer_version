### Ideas ### 
 BUL_History_Nonpartisanship: "A History Of Non-Partisanship"
 BUL_History_Nonpartisanship_desc: "In 1939, the first Bulgarian election held on a "non-partisan basis" took place. Being the first electoral event after the 1934 coup d'état, Tsar Boris III wished to diminish the influence of Kimon Georgiev and the Zveno by appointing right-wing monarchist, and member of the Military League, Pencho Zlatev, as the de-facto military leader within the government. Tightly controlled by the tsar, pro-government candidates led by Georgi Kyoseivanov won the election in a landslide, cementing the rule of the monarchy. \n\nSince then, every election held in Bulgaria has been won by tsar loyalists and sympathizers, who dared not disturb Boris in his mission to make Bulgaria a great power once more. However, with the untimely death of the monarch, his son, Simeon II, took up the throne. Wanting to modernize the outdated system, the new leader decided to form a political party known as the "National Movement for Stability and Progress" or the NDSV, representing his vision for Bulgaria in the new Millennium. The future election will be held in 1999, where the people will determine whether he was worthy of his title or not. Or, so they think."
 BUL_Skopje_Miracle: "The Miracle At Skopje"
 BUL_Skopje_Miracle_desc: "As the Einheitspakt suffered grand revolts in their Reichsprotektorates, so did Bulgaria, but on their own national soil.\n\nMacedonia has always been a disputed region, owned a multitude of nations throughout its history. Skopje has always had issues distinguishing whether they have an identity of their own or not. Their apparent "brothers in arms" liberated them from the Yugoslav occupation in 1941, and have been under the Tsardom's jurisdiction ever since.\n\nAt least that is what the government wants its citizens to believe. As tsar Boris' royal dictatorship became more and more centralized, socialist revolutionaries named NOV i POM rose up in the Macedonian countryside, being aided by the Yugoslav partisans. Through years of horrid guerrilla warfare and assassinations of local administrators, the government in Sofiya finally conceded and invited the partisans to negotiate. After months of tense arguments, insults and even death threats being thrown around, an agreement was reached. The territory was to be renamed to the "Macedonian Autonomous Oblast", gaining a lot of liberties that the other subdivisions within the Tsardom did not have a right to. Though many people still yearn for their country's independence, the majority is satisfied that blood isn't being spilled on their homeland anymore."
 BUL_Skopje_Mircale_tt: "§VThe Bulgarian army is prohibited from entering Macedonia, unless the Tsardom finds itself at war.§!"
 BUL_Lackluster_Development: "Lackluster Development"
 BUL_Lackluster_Development_desc: "Compared to the other countries in the Balkan Peninsula, Bulgaria was never a hot spot for ground-breaking technological or social advancement. But, after the end of the Second World War, the Tsardom stood as a proud ally of the victorious Reich. And with that came the benefits of strong economic cooperation with Germany, a booming tourism sector and a well-needed wave of national pride.\n\nHowever, in 1966, the Macedonian Crisis shattered the illusion of stability that blinded the population. As the guerrilla warfare in the countryside intensified, so did the pressure put on by the "Fatherland front". In what many people call a miracle, the government led by Dobri Bozhilov managed to secure a deal with the NOV i POM resistance movement. Even after peace had returned, the country found itself in an undesirable situation, and an economic malaise began to plague Bulgaria, as the Oil Crisis hit the entire world, shaking the colonial empires of Germany and Japan alike."