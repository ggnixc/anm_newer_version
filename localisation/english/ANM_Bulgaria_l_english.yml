## Descriptions ##
# Country Leaders #
 POLITICS_SIMEON_II_DESC: "Following the death of Tsar Boris III, the revered Father of the nation and of Simeon II, Simeon was coronated Tsar of all Bulgarians. The time had finally come for the young heir to rule, but if you were to ask the Prince what he felt during the grandiose enthronement, fear and uncertainty would have been indecipherable. The final years of his father's reign had been laden with strife, yet the young Tsar's admiration for his father's legacy remained unbroken. Determined to safeguard the Non-Partisan system his father had built, Simeon would publicly announce general elections would be held, and established the NSDV to give a renewed look to the dated system.\n\nThe National Movement Simeon II claimed victory at the polls by a landslide, solidifying its position in Bulgarian politics. Characterized by its right-wing social principles and developmentalist economic policies, the party serves as an extension of the Tsar's rule used to maintain the previous electoral system in a limited capacity. All members nominated for supereminent positions are handpicked by the Tsar; those who defy his authority would find themselves dismissed on the spot, or worse.\n\nFor some time, the status quo had been proven to be fruitful, something which greatly pleased the monarch. In the present, the Tsar can most often be found at his residence of Vranya on the outskirts of Sofiya, where he basks in the grandeur befitting his lineage. But from time to time, when the duties of kingship draw him back to the city proper for official meetings and party gatherings, he asks himself:\n\nWhat would Father think of Bulgaria today?"
 POLITICS_ALEKSANDER_LILOV_DESC: ""
# Ministers #
 BUL_Ongyan_Gerdzhikov_hog_desc: "The 1994 general election ushered Ognyan Gerdzhikov into the office of Prime Minister. A highly respected jurist hailing from Sofiya and a trusted confidant of the Tsar, he entered office with one goal in mind: stability.\n\nWhile the official narrative attributes his victory in the national election to widespread public approval, suggesting he achieved this triumph without internal support would be naive. A graduate of Sofiya University, Gerdzhikov may lack the natural charisma expected of a politician, but has nonetheless managed to garner a respectable reputation across the continent, in part due to his various unofficial tours across European countries. Domestically, the prime minister envisions plans to enact small-scale reforms in order to sustain the delicate balance of the Non-Partisan system. But the unresolved tensions of the Muslim minority in Thrace loom large, threatening to test his resolve and define his legacy."
 BUL_Stoyan_Stalev_for_desc: "The son of a famed researcher, Stoyan Stalev currently serves as the minister of Foreign Affairs and Worship. Born December 5th, 1952, and attended Sofiya University, the oldest and most prestigious institute in the entire country. Upon completing his studies, he would establish himself as a local lawyer in the Capital. Later in life, broadening his horizons to a specialization in medicine, achieving a doctorate in the field.\n\nStalev's knowledge of the legal field eventually reached the ears of the Tsar himself, leading to a personal summons by the all-powerful monarch, who presented the offer to become a personal advisor; soon he was dispatched to Germania as Bulgaria's ambassador. When the new government was sworn in, he was selected as the new minister of Foreign Affairs. Levering the network of connections he had forged in Germania, he has  maintained a tranquil status-quo between Bulgaria and the Reich."
 BUL_Kiril_of_Saxe_Coburg_eco_desc: "Kyril of Saxe-Coburg, better known by his title Prince of Preslav, is the second son of Tsar Simeon II. Born on 11th of July 1964. Kyril, much like his older brother Kardam, lived a mostly peaceful childhood, not bearing the pressure their father had to endure following the death of Boris III. Although Kardam was set to become the successor of Simeon, that fact did bother Kyril, who enjoyed not having the burden of the shadow of direct succession. He Graduated with top honors from Sofiya University, where he majored in economic management.\n\nKyril soon entered into politics, his pater familias ensuring he would be handed a high ranking position within the administration. Appointed as the Minister of Finance and economic advisor to the Tsar, rumors of nepotism and corruption spread immediately after he was sworn in. However, Kyril soon proved his doubters wrong, cultivating a smooth trade environment with the Europakt, while also balancing the country's economic independence. Now he is tasked with preparing Bulgaria for the adoption of the Euromark."
 BUL_Boyko_Borisov_sec_desc: "Contrary to the belief of many, a leader is not "all-seeing". Even the benevolent Tsar needs to ease his mind at times. As such, his right-hand man, Boyko Borisov, is tasked with the maintenance of order and peace in the Kingdom. Tragedy befell the youngster's family when his great-grandfather, mayor of his ancestral village, was assassinated by communist partisans during the Second World War.\n\nHis paterfamilias had also served the Ministry of Interior in the past, a fact which greatly aided Boyko in showing his loyalty not only to the Tsar, but to Bulgaria itself. Ascending through government and societal ranks, he received the title of Minister of the Interior, additionally earning the position of the Tsar's bodyguard. If the King finds himself in danger, the Rook can be found at his side."

 
### Ideas ### 
 BUL_A_Tsarist_System: "A Tsarist System"
 BUL_A_Tsarist_System_desc: "“§BThere is no place for kings in the new European order.§!” - Hermann Göring on Tsar Boris III.\n\nNews of a counter-coup against the Zveno cabinet of Kimon Georgiev would erupt from Sofiya in 1935, an event which had Tsar Boris III at the helm. In its immediate aftermath emerged the Non-Partisan System, characterized by its oligarchic and nepotistic nature, a far cry from the Tarnovo Constitution.\n\nIn modern times, the National Movement Simeon II represents a de-facto continuation of Tsarist policies, with the monarch being directly represented in parliament by close aides and business benefactors. While the status-quo has proven to be stable, many believe that the upcoming New Millennium will bring challenges to the once-indomitable order. "
 BUL_Soldiers_Of_Tato: "Soldiers of Tato"
 BUL_Soldiers_Of_Tato_desc: "“§BWe must make a radical turn, at 360 degrees.§!” - Todor Zhivkov\n\nFor two decades, the Communist Party has been the greatest threat to the stability of the Bulgarian nation. Overflowing with aid from their "eternal brothers" stationed in Moscow, pride would overtake their leader's rationality, resulting in the assassination of Nikola Petkov at the hands of socialist agitators. Seeing this as an act of betrayal, the BZNS would exit the coalition, leaving the People’s Liberation Insurgent Army as the last spark of militant resistance.\n\nZhivkov, the last hope that the BKP is holding onto, is nearing his fate as a mortal. Should a fitting successor come, the Soviet Union must not fail in its crusade against Nazism."
 BUL_New_Fatherland_Front: "The New Fatherland Front"
 BUL_New_Fatherland_Front_desc: "“§BThe people want deep reforms, we are obliged to give them.§!” - Aleksandar Stambolyiski\n\nWith the reintroduction of a dominant-party system in the 1980s, an electoral farce needed to be constructed for the public. The BZNS, which now found itself separated from the Fatherland Front, shortly began negotiations with the government. Their democratic brethren, the BRSDP, having faced internal crises that resulted in a radical splinter, lead to the Broad faction entering talks with Sofiya.\n\nBoth organizations are currently led by senior politicians and former political prisoners - Petar Dertliev and Milan Drenchev, people held alive by the hope that Bulgaria may experience the freedom of Spring."
 BUL_Muslim_Tensions: "Muslim Tensions"
 BUL_Muslim_Tensions_desc: "“§BI have a weakness for pre-crisis and crisis phenomena, because they awaken the will to live.§!” - The Thracian Falcon\n\nThe Soviet Union may not be the only foreign power seeking to destabilize our Tsardom. In recent years, the Republic of Turkey has fallen under suspicion of arming rebel groups of Muslim origin in the Thracian region.\n\nNot much is known about their internal structure, but their goal of independence from Bulgaria is as clear as day. While Ankara awaits the day that conflict between the two European giants will ignite, the Prussia of the Balkans will make sure to uphold its title."

