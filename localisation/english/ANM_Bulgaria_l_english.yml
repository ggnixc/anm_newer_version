### Ideas ### 
 BUL_A_Tsarist_System: "A Tsarist System"
 BUL_A_Tsarist_System_desc: "“There is no place for kings in the new European order.” - Hermann Göring on Tsar Boris III.\n\nNews of a counter-coup against the Zveno cabinet of Kimon Georgiev would erupt from Sofiya in 1935, an event which had Tsar Boris III at the helm. In its immediate aftermath emerged the Non-Partisan System, characterized by its oligarchic and nepotistic nature, a far cry from the Tarnovo Constitution.\n\nIn modern times, the National Movement Simeon II represents a de-facto continuation of Tsarist policies, with the monarch being directly represented in parliament by close aides and business benefactors. While the status-quo has proven to be stable, many believe that the upcoming New Millennium will bring challenges to the once-indomitable order. "
 BUL_Soldiers_Of_Tato: "Soldiers of Tato"
 BUL_Soldiers_Of_Tato_desc: "“We must make a radical turn, at 360 degrees.” - Todor Zhivkov\n\nFor two decades, the Communist Party has been the greatest threat to the stability of the Bulgarian nation. Overflowing with aid from their "eternal brothers" stationed in Moscow, pride would overtake their leader's rationality, resulting in the assassination of Nikola Petkov at the hands of socialist agitators. Seeing this as an act of betrayal, the BZNS would exit the coalition, leaving the People’s Liberation Insurgent Army as the last spark of militant resistance.\n\nZhivkov, the last hope that the BKP is holding onto, is nearing his fate as a mortal. Should a fitting successor come, the Soviet Union must not fail in its crusade against Nazism."
 BUL_New_Fatherland_Front: "The New Fatherland Front"
 BUL_New_Fatherland_Front_desc: "“The people want deep reforms, we are obliged to give them.” - Aleksandar Stambolyiski\n\nWith the reintroduction of a dominant-party system in the 1980s, an electoral farce needed to be constructed for the public. The BZNS, which now found itself separated from the Fatherland Front, shortly began negotiations with the government. Their democratic brethren, the BRSDP, having faced internal crises that resulted in a radical splinter, lead to the Broad faction entering talks with Sofiya.\n\nBoth organizations are currently led by senior politicians and former political prisoners - Petar Dertliev and Milan Drenchev, people held alive by the hope that Bulgaria may experience the freedom of Spring."
 BUL_Muslim_Tensions: "Muslim Tensions"
 BUL_Muslim_Tensions_desc: "“I have a weakness for pre-crisis and crisis phenomena, because they awaken the will to live” - The Thracian Falcon\n\nThe Soviet Union may not be the only foreign power seeking to destabilize our Tsardom. In recent years, the Republic of Turkey has fallen under suspicion of arming rebel groups of Muslim origin in the Thracian region.\n\nNot much is known about their internal structure, but their goal of independence from Bulgaria is as clear as day. While Ankara awaits the day that conflict between the two European giants will ignite, the Prussia of the Balkans will make sure to uphold its title."

