 ##Ideas##
 #########
 CAM_Khmer_National_Revolution: "The Khmer National Revolution"
 CAM_Khmer_National_Revolution_desc: "Began by the great Son Ngoc Thanh and expanded upon by the revolutionary paragon Khieu Samphan, the Khmer Revolution has transformed Kampuchea into a model nation within the Sphere, modernizing its economy and saving the Khmer people from foreign imperialists—or at least that’s what Samphan’s government claims.\n\nIn reality, the nationalization of Chinese and Japanese assets, the disastrous land reform, and the constant ethnonationalist persecution of minorities within the nation have made Kampuchea into a nation living in the worst of both modernity and tradition. Combined with Samphan’s attempted agricultural revitalization and the near-total collapse of the urban economy, the situation in Kampuchea is only held together by chauvinist sentiment and appeals to ethnonationalism. When Samphan inevitably runs out of races, nations, and people to blame for his own faults, the house of cards that the revolution has been built on will come toppling down, opening the deluge of misery and chaos to new heights."
 CAM_Wayward_Son: "The Wayward Son"
 CAM_Wayward_Son_desc: "Shaped by the Thai, and hated by the Vietnamese and Laotians, the nation of Kampuchea is the true child of Issara, and more importantly the Mekong. Under Thanh, ethnonationalism and irredentism were forced to reconcile with diplomatic pragmatism and good relations with China, Azad Hind, and most importantly, Japan and Thailand.\n\nBut with the failure in Strung Treng and economic turbulence, and the appointment of Khieu Samphan as Prime Minister, ethnonationalism dominated Kampuchean politics, a distraction from the failures of the KRPA. Now, ethnonationalism and irredentism have completely taken over the political consciousness of the Khmer nation, with the population crying for the reclamation of their lost territories. As China and Japan continue their great war over the peninsula, the Khmer people might finally have a chance to reclaim their lands from the wretched foreign imperialists that occupy them."
 CAM_Fractured_Phalanx: "The Fractured Phalanx"
 CAM_Fractured_Phalanx_desc: "Once the premier party of Kampuchea and a synthesis of different political factions, the Kampuchean Revolutionary People’s Alliance has been merely reduced to a corrupt, incompetent, and oppressive vehicle, driven by the party’s left, led by the magnanimous Khieu Samphan.\n\nKilling opponents and ethnic minorities within the party, Samphan’s grand vision of a mass party, idolized by the public and revered by the nation has come to fail, leaving splinters of the party to flee to the jungles, waging a war against the dictator.  From royalists to socialists to rightists, all have seemingly united under the banner of the Khmer Social Republican Party, backed in secret by the Chinese, and more overtly by Vietnam and Laos, as it seeks to overthrow Samphan and restore a sense of normalcy to the nation."
 CAM_Devarajas_Death_Throes: "Devaraja’s Death Throes"
 CAM_Devarajas_Death_Throes_desc: "Far from the removed concept of the natural order of absolute monarchy, the Buddhist Devaraja has come to represent the values of the Khmer Revolution, the true interpretation of Buddha’s ordinances. The KRPA acts upon the will and preachings of Devaraja, the steward of the revolution, who used to be the great Son Ngoc Thanh.\n\nBut now Kampuchea’s Devaraja is the feeble extremist Khieu Samphan, who has wrecked the unity of Thanh’s party, his state, and his nation. The Khmer race has not triumphed over its enemies, its people are starving, and its nation is in a state of complete turmoil. In this period of national strife, it seems that Devaraja is slowly dying, the populist breed of absolute power giving way to a new set of politics."

 #Leaders
 CAM_Khieu_Samphan: "Khieu Samphan"
 POLITICS_KHIEU_SAMPHAN_DESC: "Oh Kampuchea, what has befallen you? Why do the foreign vultures pick at your bones? Why do your people cry out for salvation? Why is Devaraja dying? Why have the cities been choked out?\n\nThe answer to all these questions lies within the story of one man,  Khieu Samphan. Ironically born half-Khmer and Chinese, Samphan’s childhood would be marked by tragedy, with him rising as a terrible phoenix from the ashes of his upbringing. Studying at the Imperial University of Tokyo, and being inspired by Kishi Nobosuke and the Social Masses Party in Japan, would return to his nation, joining the KRPA and becoming a staunch advocate of the party’s left, mentored by Achar Sok.\n\nFollowing the loss of the Strung Treng War, Kampuchean president Son Ngoc Thanh would seek an alliance with the left, allowing Samphan to become Prime Minister. Following Thanh’s death in 1976, Samphan assumed the reins of the presidency, purging most of his allies on the left, leaning into agrarian ethnonationalism, combined with hawkishness against Vietnam and Laos. Holding the country together against Chinese-backed rebels, economic collapse, and racial disorder with heavy Thai and Japanese aid, Samphan’s presidency has grown to be one of the most unpopular governments within the Sphere, and as time goes on, this new Devaraja will inevitably be toppled, in one way or the other."
 
