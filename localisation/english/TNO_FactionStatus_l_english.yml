#Levantine Union
LEV_UNION_Member: "Levantine Union Member"
LEV_UNION_Member_desc: "This nation is a member of the Levantine Union, a mutual alliance, a powerful economic bloc, and a foreign alignment at the same time. Born after the Jerusalem Conference, this nation is young but promising. If the Union survives, perhaps it could be the first of a new breed of cooperation between nations..."
LEV_UNION_Mandate: "Levantine Union Mandate"
LEV_UNION_Mandate_desc: "This 'nation' is a Mandate of the Levantine Union, the mutual alliance, economic bloc, and alignment born after the Jerusalem Conference. Jerusalem is, in theory, a completely neutral zone, free from the sectarian conflicts that divide the rest of the Levant. As tensions rise, though, it remains to be seen if the Union's mandate system will remain in place..."


### Philippines
UFF_Faction: "Co-Founder of the United Filipino Front"
UFF_Faction_desc: "Malayang magkaisa; aliping mag-iisa. United we stand; divided we fall.\n\nThese are the tenets that the United Filipino Front abide to. This alliance of convenience is in truth, more than that. The §RAFRSR§! and the §DFPR§!, though heavily contrasted in ideals, share a common goal: to preserve the independence and freedom of the Philippines from any invaders willing to take it from them. Perhaps, this alliance may just be the key to their freedom, though perhaps it may not be enough as the rays of the rising sun loom above..."

### Haiti
HUF_Faction: "Haitian United Front Bulwark"
HUF_Faction_desc: "This alliance between the Haitian government and the PPLN guerrillas under Jacques Stephen Alexis is only one of convenience. In the face of Trujillo's invasion, Port-au-Prince and the PPLN have agreed to put old grudges aside and work together to repel the Dominican offensive. Perhaps this shared struggle will bring the two together - or perhaps their agreement will collapse as soon as Trujillo is out of the picture. Who knows how the future will turn out? Let's just get through the present first."

HRF_Faction: "Fighter of the Hispaniolan Revolution"
HRF_Faction_desc: "Once bitter enemies in their tragic past, common cause in the workers' struggle has united the newly-revolutionary Dominican Republic and the Haitian PPLN. Now, against the forces of reaction in Port-au-Prince and their capitalist masters in Washington, they have formed an official bond. From Les Cayes to Punta Cana, the Hispaniolan Revolutionary Front will bring liberation to the island's proletariat."

# UAR
UAS_Member: "Member of the United Arab States"
UAS_Member_desc: "The United Arab States is born in the ashes of the faltering Italian, as a host of nations proclaim their sovereignty and unite in the struggle to cast off the chains of colonialism, and take hold over their own destiny. These newly christened revolutionary states are committed to the unification of the Arab world in its entirety, from the Atlas Mountains to the dunes of the Arabian Peninsula, into a single whole assailing the forces of imperialism and protecting against what they may perceive as threats to the continued survival of their Pan-Arab experiment."

# Indonesian Civil War
INS_leader: "Central Government Leader"
INS_leader_desc: "The promises of the Garuda seemed broken at the outset of the war. Sukarno, founder and a hero of independence, faces down an unprecedented rebellion that had rent the Unitary Republic of Indonesia in twain. Sukarno is no stranger to dissent; he had faced separatist revolts within the nation before, and purged those who did not agree with his idea of unity in archipelago. "Bhinneka Tunggal Ika," the Garuda promised, its talons holding aloft the scroll that proclaimed the Sanskrit motto of "Unity in Diversity." Sukarno and his followers prepare themselves for a long war to uphold this ideal once more and again into eternity."

INS_loyalist: "Central Government Loyalist"
INS_loyalist_desc: "Comprised of emergency governments and loyal regional commands, the NKRI itself is split into four factions, one in each Sukarnoite strongholds in Djakarta, Soerabaja, Makassar, and Palembang. Each has differing interests to explain their alignment. Nonetheless, they present a united front against the rebel forces led by Hatta, and every hard-won victory would advance the loyalist cause that much more."

PRIM_leader: "PRIM Leader"
PRIM_leader_desc: "The promises of the Garuda seemed broken before the outset of the war. The ideal of unity and plurality, the overarching themes towards which every Indonesian nationalist should strive, were broken at every turn by the central government. Moehammad Hatta once counted himself among the most loyal of Sukarno's inner circle. Now, his disillusionment channeled the breakages the nation had suffered in the thirty years since the nation's independence, becoming a rebellion that spread like wildfire. The split ideals now hold themselves in martial contest and a brother spills a brother's blood."

PRIM_loyalist: "PRIM Loyalist"
PRIM_loyalist_desc: "Eclectic and mismatched, the forces of the Free Government of Indonesia nonetheless bring its strength to bear in the field. A theme unites them: a disdain against the central government that had festered since Sukarno decided to continue on the centralizing course first decided by the Sidik government. Comprising of military councils led by colonels in various parts of the country, Islamists in South Sulawesi, separatists in Atjeh, and communist militias in Madiun and Soerakarta, they face a united front presented by the NKRI government."

#ITW Temp Faction
ITW_temp_faction_member: "Member of the Accordo di Difesa Levantina"
ITW_temp_faction_member_desc: "[This.GetNameDefCap] is a member of the [This.GetFactionName]. They are in a faction, which means that if any of its members were to be attacked or otherwise have entered a war, members of the alliance will join their war in aid for their comrade. They can act as a unison in the world stage, and can project their influence as a result of their collective power. It may also not be limited to a military pact, but it can expand on many fronts, such as economic co-operation and other forms of collaboration that mutually benefits its members."

# Hegemon of South America
BRA_Hegemon_of_South_America: "Hegemon of South America"
BRA_Hegemon_of_South_America_effect: "[!BRA_Hegemon_of_South_America]"
BRA_Hegemon_of_South_America_desc: "The bells of war toll as Brazilians march in their millions to fight for their motherland's status as hegemon of South America. They are joined hand-in-hand by those nations persuaded or forced into Brazil's arms by the Itamaraty, spinning tales about the havoc an unchallenged Argentina will wreak upon the continent without a police to watch over them, to stop their evil.\n\nIt is a battle they will not use; God is on their side, the side of the righteous who will inherit South America."

ARG_Hegemon_of_South_America: "Hegemon of South America"
ARG_Hegemon_of_South_America_effect: "[!ARG_Hegemon_of_South_America]"
ARG_Hegemon_of_South_America_desc: "Patriotic men, women, and children line the streets of Buenos Aires to defend their homeland, to stop the march of the savages from the north, and free themselves from the oppression of Brazilian imperialism. Across the Río de la Plata, their allies emerge to counteract their menace once and for all, to rid the continent of the notion that there was ever more than one true hegemon of South America.\n\nIt is a battle they will not use; God is on their side, the side of the righteous who will inherit South America."

BRA_aligned_state: "União de Defesa Sul-Americana Member"
ARG_aligned_state: "Alianza del Plata Member"

# Union of African States
Ghana_Member: "Member of the Union of African States"
Ghana_Member_effect: "[!Ghana_Member]"
Ghana_Member_desc: "§YMember§! states of the §&Union of African States§!, titled §YUnion States§!, retain their national independence under the Union Treaty but are obliged to defend other §YUnion States§! from attack and give a minimum of aid to other States. Ghana is the undisputed primary partner in the §YUAS§!, leading many large-scale financial investments in allied countries. Regional integration and political unity for Africa are core tenets of Ghanaian President Kwame Nkrumah's state ideology, which holds that cooperation is the key to development in the formerly imperialized continent.\n\nOne manifestation of these principles is the §&Union of African States§!, a quasi-economic, political, and defensive union formed between Ghana and Guinea during the onset of the French West African Independence Wars. This action put Ghanaian military power behind Guinean sovereignty and created a channel by which both nations could modernize their economies.\n\nWhether the §YUAS§! will fulfill the idealistic vision of a unified and mutually beneficial pan-African federation or become another tool at the disposal of President Nkrumah's brinksman foreign policy remains to be seen, though already the dream of an anti-imperialist bulwark in Africa has inspired many across the continent to mobilize for their independence."

