 ## Descriptions ##
 POLITICS_FRANK_SCHWERDT_DESC: "Part of the First Generation raised after WWII, Schwerdt was born in Germania to a family of Nazi Supporters, with his Father and Grandfather both Card-Carrying Members of the NSDAP. Originally a Surveying Technician, he had little purpose in life until he met his wife while on deployment in Riga after the Ostland Civil War. He married her and moved to Ostland but was forced to quit his job. He used this free time to attend local NSDAP meetings and build political connections.\n\nWhen Speer Sr. split Ostland into RK Baltikum and Weißruthenien, the resulting political vacuum allowed Schwerdt to launch a career in Politics, becoming the leader of his local Reichsgau. He associated himself with a Clique of Baltik-Deutsche and Germans from the Homeland who sought to have Baltikum under “Rightful” German Rule with a truly German Leader. He soon joined the Lettland Reichstag and became the Infrastructure Minister for Baltikum.\n\nThe death of Estonian collaborator and Reichsstatthalter Herald Riipalu kicked off a scramble for succession, but Schwerdt’s Clique were able to convince Germania to appoint Schwerdt as the new Baltikum Leader. With Baltikum’s unquestionable loyalty in check, Germania allows Schwerdt to run the Reichsland as he sees fit. As long as he keeps in line."


 ### Ideas ###
 OST_the_ostwall: "The Ostwall"
 OST_the_ostwall_desc: "Batikum had always been the most vulnerable part of the Reich’s eastern frontier — a reality which was laid bare the day Soviet shells rained over Tallin. Following the end of the Second West Russian War, the German High Command worked overtime to ensure such a humiliation would never happen again.\n\nOver the course of the last decade, the Baltik-Soviet border has undergone a massive transformation. A hostile grove of barbed wire, a labyrinth of concrete bunkers, and a web of cavernous trenches now shields the once-vulnerable Reichsland from Soviet invasion. This massive network of fortifications, colloquially known as the “Ostwall”, earned its nickname from a 1994 speech in which Reichstag President Martin Mußgnug named it the successor to its pre-WWII German-Polish predecessor.\n\nTake a peek inside any Riga souvenir shop; the shelves upon shelves of medieval-knight-themed merchandise will serve as definitive proof that, ever since Mußgnug’s speech, the “shield” theme has earned itself a place among Baltikum canon of national symbols. "
 OST_favorite_son: "Favorite Son of the Reich"
 OST_favorite_son_desc: "Like any parent, when the German Reich is asked which of their Reichlands is their favorite, they say they love all the Reichlands equally, but deep down, they do have a favorite child. In the Reichlands case, it’s the Baltikum who receives the most investments from Germania, the most advanced technology and has the highest standard of living within the Reichlands.\n\nEver since the creation of its predecessor RK Ostland, the Baltics have always been viewed most favorably in Germania, with their population seen as ripe for Germanization due to old German Nobility roots within the region. This has led its leaders in the Reich to spend plenty of money in the Baltikum, improving its infrastructure and economic links between it and the Reich. This has also led to the Reich ruling over the Baltikum with a lighter touch than its other Reichlands counterparts.\n\nThe Reichlands may be puppet states under the machiavellian hands of the Reich, but it’s clear to many that the Baltikum is their favorite puppet."

