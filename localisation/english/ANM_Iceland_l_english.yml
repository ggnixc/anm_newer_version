 ###IDEAS###
 ICE_spirit_almost_there:0 "Almost There!"
 ICE_spirit_almost_there_desc:0 "Iceland was subjugated under a foreign heel for too long. During the middle ages by Norway and then by the Danes, Iceland hasn’t tasted true independence for a very long time. During the second world war native Icelanders hoped that with the arrival of American troops on the small and frozen island they would be granted independence from the occupied Denmark but the only thing Americans brought with them was once again foreign occupaiton. Sixty years have passed since the end of the last world war, thirty since the start of the American retreat from Iceland that was followed by installing Icelanders in the government, many are hopeful that now at the dawn of a new century the United States would acknowledge Iceland as a free, equal and independent state."
 ICE_spirit_high_commissioner:0 "The High Commissioner"
 ICE_spirit_high_commissioner_desc:0 "Under the constitution from the 70s it was decided that Iceland should become a parliamentary democratic republic in which the president serves as a head of state while the country’s prime minister is its head of government. The same constitution also featured a stopgap measure by the Americans, a just in case button that they can press if Iceland decided to go contrary to the interests of the United States. So the office of the United State’s High Commissioner for Iceland was created. Many of the Icelanders protested this institution, political parties with the sole purpose of disbanding it were being created by the day but nothing came out of it. Today after numerous amendments and revisions of the Icelandic constitution and willing cooperation with OFN the position and powers of the High Commissioner are more symbolic and similar to an ambassadorship rather than the almost dictatorial powers they wielded in the past. The current commissioner, James I. Gadsden was also quoted saying that given the climate he might even be the last one."
 ICE_spirit_fish:0 "Declining Fish Industry" 
 ICE_spirit_fish_desc:0 "Iceland is a small and almost inhospitable island. It's no wonder that the bulk of its populace is centered around the capital city and its coast. The further one goes from the coast the more he will encounter the mountains and volcanoes which paired with the freezing climate leave little to no land arable. This left Iceland to turn to the only “flat” area around it, the sea. Cod is our most prized export to the world but due to our turbulent history and overreliance on the fishing sector it is becoming more obvious by the day that our exports are shrinking in size and that soon something will have to be done."


