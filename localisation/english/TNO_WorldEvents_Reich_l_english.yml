# Germany World Events #
########################

#|=|========[ Germany General World Events ]========|=|#
 WORLD_REICH.1.t: "[Get_newspaper_header]Germans First to Orbit Earth"
 WORLD_REICH.1.desc: "Adolf Hitler announced today that Germany had won the race to put a man into Earth's orbit, with Wilfried von Engelhardt being the first man to circle the planet and return safely. Calling it the stepping stone to German domination of the stars, the German Führer proclaimed the achievement as a victory for Aryan peoples across the world. Adolf Hitler did not take any questions from journalists due to his early departure from the stage after having looked extremely disoriented from the crowd's flashing lights.\n\nNevertheless, the world is shocked at the rate of German scientific advancements, after having seemingly been on the back foot in the months prior compared to their competitors. Panic has become widespread within Washington's halls as the German black eagle flies ahead of America in the Space Race.\n"
 WORLD_REICH.1.a: "Deutschland über alles!"
 WORLD_REICH.1.b: "How did we just blow our lead?"
 WORLD_REICH.1.c: "Have the Imperial General Headquarters convene, immediately..."
 WORLD_REICH.1.d: "Another frontier for man to explore."

 WORLD_REICH.2.t: "[Get_newspaper_header]Adolf Hitler Has Died"
 WORLD_REICH.2.desc: "Tragedy has consumed Germany as the news spread first throughout the Reich and then the world. Adolf Hitler, Führer of Germany and victor of the Second World War, has died. Whilst the Führer's declining health had been speculated about for some time, the news has nevertheless left Germany in a state of complete shock. The Reichstag has announced that three months of mourning shall be held, and that the Führer shall be buried beside his late wife, Eva Hitler, with dignitaries from around the world invited to the funeral.\n\nWhile Germany mourns, internationally many are celebrating the death of the man held responsible for three decades of suffering throughout the world. Yet many international commentators fear what may now become of Germany, the Third Reich having already been embattled in a bitter power struggle over the rightful successor to the Führership."
 WORLD_REICH.2.a: "A day to remember..."

