###################################
# Reichskommissariat World Events #
###################################
 WORLD_REICH.1000.t: "[Get_newspaper_header]Germany's Eastern Territories Collapse"
 WORLD_REICH.1000.desc: "Today, communications from Reichskommissariat Moskowien ceased, confirming that the German authority had virtually disappeared. To observers, this is the climax of Germany's loss of control in its European colonies.\n\nFirst, starting with Ostland's breakdown into a full-blown guerilla conflict, the chaos was succeeded by a Polish revolt in eastern German provinces. Soon after, the shaky control of Reichskommissariat Ukraine collapsed into civil war following months of instability when the previous Reichskommissar was incapacitated.\n\nIt remains unclear whether or not the remaining German forces will be able to firmly assert their authority once more. All that is known is that retaking these territories will prove a costly affair for the master of Europe if its grip is finally released from them.\n"
 WORLD_REICH.1000.a: "After Hitler, the flood."
 WORLD_REICH.1000.b: "All we can do is survive the tide."
 WORLD_REICH.1000.c: "One last chance at freedom."
 WORLD_REICH.1000.d: "Nations run wild as an empire hibernates."
 WORLD_REICH.1000.e: "The just consequences of rampant imperialism."


