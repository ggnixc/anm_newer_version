#|=|========[ Ostland World Events ]========|=|#


#|=|========[ Ukraine World Events ]========|=|#
 WORLD_REICH.1400.t: "[Get_newspaper_header]Erich Koch Severely Injured in Kiew Bombing"
 WORLD_REICH.1400.desc: "The second attempt on the life of a German leader this year, martial law has been declared across Reichskommissariat Ukraine following an attempt on the life of Reichskommissar Erich Koch. Reportedly injured when a bomb hidden within his personal vehicle detonated as he left his home yesterday morning, two soldiers and Koch's driver were killed whilst Koch suffered severe injuries to his chest, right arm and face. Following emergency surgery, the German administrator reportedly remains in critical condition.\n\nWith undercover foreign press having extensively exposed the levels of violence and poverty within Ukraine since the German capture of the region from the Soviet Union during the Second World War, many internationally now fear for the welfare of the Ukrainian people as the Reich begins its hunt for those responsible."
 WORLD_REICH.1400.a: "Troubling news from a troubled land."

 # Ukrainian Emergency Victory World Events
 UKR_UCW_NEWS.0.t: "[Get_newspaper_header]German Forces Suppress the Ukrainian Emergency"
 UKR_UCW_NEWS.0.desc: "Little surprise in Germany's breadbasket today, as the Reichskommissariat government has retained control over Ukraine. In a statement from the Ukrainian government, Kiew has celebrated the end of the insurrection and reaffirmed its commitment to "National Socialism, the Führer, and the German people." However, some in the Kiew government, including current acting Reichskommissar Georg Leibbrandt, have proposed reforms to the Reichskommissariat.\n\nThough the situation remains stable at present, cracks may be growing across the Reichskommissariat. While leadership lies ostensibly with Leibbrandt, the current ruling "Security Council", composed of Leibbrandt, Otto Ohlendorf, and Hans-Otto Bräutigam, is on the brink of collapse as the three vie for power. While the conflict is not projected to come to the battlefield, it is clear that further chaos lies within Ukraine's future.\n"
 UKR_UCW_NEWS.0.a: "True leadership is found in those who take it."
 UKR_UCW_NEWS.0.b: "German superiority defeats all."
 UKR_UCW_NEWS.0.c: "The jackboot continues to stomp."

 UKR_UCW_NEWS.1.t: "[Get_newspaper_header]The Ukrainian People's Republic Is Established"
 UKR_UCW_NEWS.1.desc: "In the aftermath of the collapse of the Reich's eastern holdings, a light of hope has finally emerged from the dark fog of war. After a months-long civil conflict in the so-called Breadbasket of the Reich, the Ukrainian territories are now in the hands of a liberal and democratic partisan group that has begun installing a new democratic government.\n\nAppealing to the people of Ukraine's dreams of a free nation, the now Ukrainian People's Republic has won the hearts and minds of the oppressed people of Ukraine, and has since established a sovereign state, with the native Ukrainians being the main holders of power within the government.\n\nThe international community remains skeptical as to what will happen next, though the leader of the Republic, Yuriy Horlis, assures all that Ukraine will remain free.\n"
 UKR_UCW_NEWS.1.a: "We are finally free."
 UKR_UCW_NEWS.1.b: "Liars! False Promises!"
 UKR_UCW_NEWS.1.c: "A light from the darkness of Europe?"

 UKR_UCW_NEWS.2.t: "[Get_newspaper_header]The Restoration of the Ukrainian Socialist Soviet Republic"
 UKR_UCW_NEWS.2.desc: "A great reversal has occurred in Eastern Europe. Once thought a relic of a bygone era, the Ukrainian Workers' and Peasants' Red Army has bested the various warring factions of the Ukrainian Emergency and wrested control over the entire Reichskommissariat. Despite its Soviet origins, they are not merely a continuation of the Soviet regime - First Secretary Oleksandr Shumskyi has distanced himself from the ideology of Bukharin, declaring his belief in National Communism and emphasizing the continued liberation of the Ukrainian people.\n\nAs red banners fly across Germany's breadbasket, the world now waits with bated breath to see how the Reich will retaliate. But for now, many Ukrainians rejoice for the proclamation of the Ukrainian Socialist Soviet Republic, representing a great moment of liberation from decades of hardship and cruelty.\n"
 UKR_UCW_NEWS.2.a: "A new revolution has begun!"
 UKR_UCW_NEWS.2.b: "History cannot be allowed to reverse."
 UKR_UCW_NEWS.2.c: "Liberation comes at a cost."

 UKR_UCW_NEWS.3.t: "[Get_newspaper_header]The Ukrainian State is Established"
 UKR_UCW_NEWS.3.desc: "The Ukrainian State, a nation born of the remnants of Stepan Bandera's Organization of Ukrainian Nationalists, has completely upended the 20 year status quo of Ukraine. Their leader, Dmytro Klyachkivsky, a staunch adherent of Bandera's ultranationalism, has shown a clear desire to create a Ukraine free of any "parasites." Already, German settler families and other minorities swarm the borders, hoping to flee Ukraine before the "reprisals" begin.\n\nAll is not well in Ukraine, however, as whispers of dissidents and rebels undermine the newly founded state's stability. Dmytro Klyachkivsky dismissed these rumors, declaring on the radio, "Ukraine is free of the malicious influences of the vile German, Russian, and Pole! Those who still serve the exploiters can reunite with them in death! Slava Ukraini, Heroiam Slava!" Only time will tell if the newborn Ukrainian State will rise above the flames or be buried in the ash.\n"
 UKR_UCW_NEWS.3.a: "Slava Ukraini, Heroiam Slava!"
 UKR_UCW_NEWS.3.b: "Clearly the Ukrainians have learnt nothing from the last twenty years."
 UKR_UCW_NEWS.3.c: "Bandera's shadow grows ever longer."

 # Germany goes nuclear (literally)
 WORLD_REICH.1599.t: "[Get_newspaper_header]Germany Destroys Kiew"
 WORLD_REICH.1599.desc: "In a development sparking horror and outrage worldwide, Germany today used a nuclear weapon against the city of Kiew, killing or injuring hundreds of thousands. The decision to deploy overwhelming force against a city which Germany considers its sovereign territory reportedly emerged after the German military proved incapable of stopping a rebellion within the Reichskommissariat Ukraine. Faced with a threat to German dominance and fears that instability could spread, the Führer took "extreme measures."\n\nWhile no statement from Germania is forthcoming, reaction elsewhere has been swift. OFN member-states issued a joint statement condemning "this act of unprecedented barbarism." An appalled spokesman of the Empire of Japan expressed outrage and informed press that the Empire would be re-evaluating its limited relations with Germany. Protests have roiled several European cities.\n"
 WORLD_REICH.1599.a: "They make a desert and call it peace."

#|=|========[ Moskowien World Events ]========|=|#

 WORLD_REICH.1600.t: "[Get_newspaper_header]German Government in Muscovy Disrupted"
 WORLD_REICH.1600.desc: "The chaos set off by recent German internal disorder after the demise of Hitler has now spread to the Reichskommissariat of Muscovy, where the remaining partisan groups in the German colony have used the ongoing squabbling in the Reich to deal a proper blow against the Pakt. Insurgent cells, remnant detachments, and even some lesser collaborator groups have now openly rebelled, seizing control of large sections of the territory.\n\nNone of the partisan organizations have the resources or manpower needed to completely break German hegemony over Muscovy. However, the German government therein has nonetheless responded ruthlessly, fearing that that could change at any moment. The costliness of the resulting police action will likely mean significant changes in the government of Muscovy."
 WORLD_REICH.1600.a: "An empire divided."
 WORLD_REICH.1600.b: "Disgraceful."

 WORLD_REICH.1601.t: "[Get_newspaper_header]Helldorf Becomes Reichskommissar of Moskowien"
 WORLD_REICH.1601.desc: "The chaos in the Reichskommissariat of Muscovy has recently reached a favourable end for its former deputy, now Reichskommissar, Wolf-Heinrich Graf von Helldorf, who has defeated his predecessor-turned-rival Globocnik after a tumultuous power struggle.\n\nDetails on the subject are extremely vague, but it appears that Helldorf attained control after successfully courting the bureaucracy to recommend him for the position and uncovering the skeletons in Globocnik's closet after a corruption scandal. As far as is possible to understand, Helldorf intends to cast away the sclerotic, hardly-functional Reichskommissariat apparatus inherited from Globocnik and reinvent it in a "properly National Socialist" fashion."
 WORLD_REICH.1601.a: "What came before wasn't National Socialist, you're saying?"
 WORLD_REICH.1601.b: "Interesting..."
 
 WORLD_REICH.1602.t: "[Get_newspaper_header]Globocnik Restores Order in Muscovy"
 WORLD_REICH.1602.desc: "The chaos in the Reichskommissariat Moskowien has recently reached a favourable end for its incumbent Reichskommissar, Odilo Globocnik. Globocnik has defeated his deputy Wolf-Heinrich von Helldorf after a protracted struggle for control.\n\nGlobocnik is a Nazi hardliner appointed by the longtime Reichsführer-SS, Heinrich Himmler. It seemed that his regime was going to fail after the onset of what is now called the Disruption of Muscovy, but even this massive crisis was not enough. Having defeated Helldorf's attempt by revealing his ex-deputy's corrupt and "sleazy" tendencies to Germany and the world, the once and future Reichskommissar is now more than ready that the colony does not further decay."
 WORLD_REICH.1602.a: "No further decay? Who is he fooling?"
 WORLD_REICH.1602.b: "If it isn't broken, ..."
 
 WORLD_REICH.1603.t: "[Get_newspaper_header]Martial Law in Muscovy Made Permanent"
 WORLD_REICH.1603.desc: "The ongoing chaos in the Germany colony of the Reichskommissariat Moskowien resulted in an outright collapse of the uppermost echelons of the AOdNSDAP. Their acting Reichskommissar Globocnik and deputy von Helldorf were exiled in disgrace, a blow from which the AOdNSDAP has not recovered.\n\nAs a result of this lack of recovery, the temporary martial law order given to the Muscovite Wehrmacht has been made permanent. A new system has settled in. The army measures of military commander General von Stauffenberg have begun to expire as the Chief of Military Administration Fritz-Dietlof Graf von der Schulenburg has taken center stage in the creation and maintenance of this new colonial rule."
 WORLD_REICH.1603.a: "Stauffenberg, that name reminds me of something."
 WORLD_REICH.1603.b: "We had better keep an eye on that "red count"..."
 
 WORLD_REICH.1604.t: "[Get_newspaper_header]All-Muscovite Congress Forms Collaborator Protectorate"
 WORLD_REICH.1604.desc: "The ongoing chaos in the German colony of the Reichskommissariat Moskowien resulted in an outright collapse of the uppermost echelons of the AOdNSDAP. It was expected that the Wehrmacht government in Muscovy would be able to stabilize the colony, but this also has failed, with the ongoing insurgency making further gains at Muscovite expense.\n\nThe last pillar of stability in the colony is the collaborationist All-Muscovite Congress. With no options left, authorities in Germany proper have allowed for the creation of a protectorate headed by the Congress and the two primary political organizations that comprise it: the Union of Struggle Against Bolshevism and the People's Socialist Party of Russia."
 WORLD_REICH.1604.a: "Who would've thought the Germans would do it?"
 WORLD_REICH.1604.b: "Horrible, letting slaves run the plantation like this..."

 WORLD_REICH.1605.t: "[Get_newspaper_header]Martial Law in Muscovy"
 WORLD_REICH.1605.desc: "The ongoing chaos in the Germany colony of the Reichskommissariat Moskowien has resulted in an outright collapse of the uppermost echelons of the AOdNSDAP, Eastern Work Area of the NSDAP. Their acting Reichskommissar Globocnik and deputy von Helldorf have been implicated in a massive corruption scandal that has been met with disgust in Germany proper.\n\nGlobocnik and Helldorf having been recalled in disgrace amidst a massive insurgent offensive, the Ministry for the Eastern Territory has issued an emergency authorization to the head of the Military Command of Muscovy, Claus Schenk Graf von Stauffenberg, to declare martial law and install a temporary military administration. Sources report that the general has his work cut out for him, with unprecedented chaos and haphazardness prevailing throughout Germany's largest colony.\n"
 WORLD_REICH.1605.a: "One jackboot to another, isn't it? What changes?"
 WORLD_REICH.1605.b: "What choice did we have?"

