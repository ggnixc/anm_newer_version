# Icon tooltip
ANM_icon_tt: "A New Millennium, a TNO-TL Continuation"
ANM_icon_tt_delayed: "As the victors of the Second World War decline, new powers are on the rise. The German Eagle seeks to finally unite the Continent under its rule, with the fate of National Socialism and Albert Speer's legacy uncertain. The Rising Sun begrudgingly tolerates the rise of the Chinese Dragon and the Indian Tiger, seeking to unite Asia under the banner of Pan-Asianism — but would their continued partnership lead to potential conflicts for the dominance of Asia? \N\NAcross the Ocean, the United States attempt to restore their lost honour following the end of the Second World War. Along with the Russian Bear, brought back to its old strength by Suslov and his Comrades seeks vengeance for their losses. The Cold War rages on, as further signs of tensions reveal itself. Will you steer the world towards a brighter future? Or lead it into darkness once again?"

####=== The tooltips that are shown when hovering over the menu pictures ===####

## SINGLE PLAYER
ANM_menupic_tooltip_1: "“Of course, the sins of the father should never be visited on the son. But, in this case, when the son borrows essential elements of his father’s principles and serves a regime that seeks to use it for the same reasons that animated Hitler, is he not willingly reflecting those sins?”" - Unnamed reporter on Albert Speer Jr."

## MULTIPLAYER
ANM_menupic_tooltip_2: "§F"When our party had only seven men, it already had §jtwo principles§!. First, it wanted to be a party with a true ideology. And second, it wanted to be the §Vone and only power§! in Germany." - Adolf Hitler§!" 

## QUIT
ANM_menupic_tooltip_3: "§F"If the day should ever come when we must go, if someday we are compelled to §vleave the scene of history§!, we will slam the door so hard that the §Vuniverse will shake§! and mankind will stand back in stupefaction." - Joseph Goebbels§!"
