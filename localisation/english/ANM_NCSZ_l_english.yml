## Descriptions ##
 POLITICS_JOHN_GORMAN_DESC: "Northern Ireland has changed a lot over the past century, and nothing symbolises this more than its current First Minister John Gorman, a Catholic leading a Protestant State, and a Unionist in an Irish Republic.\n\nAn Omagh native, Gorman was a British Veteran who fought valiantly to defend Britain during Operation Sealion. Britain’s fall forced Gorman to flee with the rest of the British Exiles to Canada. He soon joined the remnants of MI5 and began working as an undercover agent in Northern Ireland for the exiled British Government, regularly reporting back on the tense situation in the North and even helping with some smuggling runs for Unionist paramilitaries.\n\nHe was transferred to the Foreign Department soon after the start of the Ulster Crisis, playing a major role in the St Brigid's Day Agreement, helping to convince the Irish, British and Unionist representatives to sign the agreement despite their reservations. After the agreement, Gorman was able to move back to Northern Ireland officially where he soon joined the moderate unionist UUP. He quickly joined the new Northern Ireland Government, often playing as the mediator in disputes within Government and Parliament.\n\nThe collapse of the Trimble Administration in 1993 and the subsequent election in 1994 delivering a rise in support for more extreme parties, made the next government formation difficult. However, after months of talks, a new devolved government was formed, with the Catholic Unionist John Gorman as First Minister and the Protestant Nationalist John Turnly as Deputy First Minister. Now at the helm as a unity candidate in a state intent on dividing itself, Gorman has a tough mandate to uphold, but good British soldiers never surrender."


