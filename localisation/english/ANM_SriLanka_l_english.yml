 #####Leaders####
 ################

 CYL_Chandrika_Kumaratunga: "Chandrika Kumaratunga"
 CYL_Ranil_Wickremesinghe: "Ranil Wickremesinghe"
 
POLITICS_CHANDRIKA_KUMARATUNGA_DESC: "Born to one of the founding fathers of independent Sri Lanka, S. W. R. D. Bandaranaike, Kumaratunga \nhas always represented the Sinhalese political establishment. With the assassination of her father at a particularly young age, the young Chandrika was seen as his natural heir, \none to carry on the mantle of the left-wing nationalist agenda of the Sri Lankan Freedom Party. 

\n\nServing as an administrator in the central government during the JVP insurrection, she would be instrumental in crushing the rebellion, with heavy aid for the United States. \nNow, as Sri Lanka stands at a crossroads, as the ethnic conflict between Tamils and Sinhalese grows ever bloodier, \nit seems that Chandrika Kumaratanga can be the only to determine which path Sri Lanka will take. 
"
 #########
 ##Ideas##
 #########

 CYL_Rampant_Tamil_Discrimination: "Rampant Tamil Discrimination"
 CYL_Rampant_Tamil_Discrimination_desc: "Since the beginning of Sri Lanka’s independence, a remnant of the old colonial order has remained, \nthe prominent community of Tamils that live in Sri Lanka. With the passage of the Ceylon Citizenship Act, \nthe effective denial of the Tamil population has been a common political theme throughout the history of the nation. 

\n\nWith the systematic oppression of the Tamil population as well as extra-judicial pogroms occurring, while the parliament is deadlocked over whether to appease the \nTamils or to get rid of them once and for all, it seems that the country is finally reaching its breaking point, and rapidly at that. 
"
 
 CYL_The_Eagles_Last_Watchman: "The Eagle’s Last Watchman"
 CYL_The_Eagles_Last_Watchman_desc: "Ever since the collapse of the Republic of India in 1968 to the invading Government of Free India and Pakistan, \nSri Lanka has been the last democracy on the subcontinent and the OFN’s Asian bastion. Benefitting from increased \ninvestment and security aid, the country has been transformed into a crucial maritime hub, \nthe king of trade in the Indian Ocean. 

\n\nAnd with the advent of OFN membership has also come the claws of the Japanese and Hindustanis, \nwho destabilize the country, arm Tamilian terrorists, and aid communists in overthrowing our government. As alignment with the OFN \nlooms over the nation like the sword of Damocles, it becomes clear that Sri Lanka will reach \nnew heights or be torn down and destroyed as another victim of Hindustani imperialism."
