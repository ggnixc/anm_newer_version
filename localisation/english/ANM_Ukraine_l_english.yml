 ### Ideas ###
 UKR_positive_orthodox_christianity:0 "Positive Orthodox Christianity"
 UKR_positive_orthodox_christianity_desc:0 "After the infamous Slave Revolt was crushed beneath the German heel, the reintegration of the eastern colonies was made priority one. In Ukraine, granting Reichsland status greatly contributed to regional compliance, but more work would need to be done to restore full stability. The New Ukrainian Orthodox Church, then, was established as a state-sponsored religion.\n\nWhile the church puts up a facade of neutrality, in practice, it primarily serves as a loudspeaker for NSDAP propaganda. Sermons are openly political, educating the natives more about subjugation and patience than Jesus Christ and His teachings. Nordic runes, swastikas, and stern-faced eagles are ubiquitous motifs in churches from Kyiv to Luhansk.\n\nWithout a doubt, what remains of the old Orthodox Church still holds significant influence within the populace. Time will tell whether the new German ways will sweep the old into the dustbin of history."
