 ### Ideas ###
 UKR_positive_orthodox_christianity: "Positive Orthodox Christianity"
 UKR_positive_orthodox_christianity_desc: "After the infamous Slave Revolt was crushed beneath the German heel, the reintegration of the eastern colonies was made priority one. In Ukraine, granting Reichsland status greatly contributed to regional compliance, but more work would need to be done to restore full stability. The New Ukrainian Orthodox Church, then, was established as a state-sponsored religion.\n\nWhile the church puts up a facade of neutrality, in practice, it primarily serves as a loudspeaker for NSDAP propaganda. Sermons are openly political, educating the natives more about subjugation and patience than Jesus Christ and His teachings. Nordic runes, swastikas, and stern-faced eagles are ubiquitous motifs in churches from Kyiv to Luhansk.\n\nWithout a doubt, what remains of the old Orthodox Church still holds significant influence within the populace. Time will tell whether the new German ways will sweep the old into the dustbin of history."
 UKR_made_in_ukraine: "Made In Ukraine" 
 UKR_made_in_ukraine_desc: "Since the mid to late 19th Century, Ukraine has always been the centre of goods production for any empire who had the nation under its heel. It benefited its overlords in the Russian Empire, the Kaiserreich, the Soviet Union, and now the Third Reich. Ukraine has always been a breadbasket, but as time passed on, it has turned into an major industrial hub.\n\nGermania relies on Ukraine for many of its goods, from clothes to food to cups — it can do it all. However, the NSDAP encourages factory owners to push their workers to the limit. Many companies from Aldi to Mercedes are known for their harsh treatment of workers within the Reichsland, and the Reich’s open support for it.\n\nUkraine has become the backbone of the German Economy — if it is not to be tamed, it would be the singular entity to cause the downfall of the German Economy, and soon the Fall of the Reich itself."
 UKR_unfinished_business: "Unfinished Business"
 UKR_unfinished_business_desc: "When Bräutigam stood victorious as Reichskommissar after the Ukrainian Civil War, many expected his reign to be unquestioned as both Bräutigam and the new Führer shared the same ‘reformist’ ideals for Nazism. Bräutigam managed to elevate the Ukrainian people above the rest of the Slavic population (thanks to a well-timed publication by the Ahnenerbe) and attract significantly greater production opportunities to the nation. However, the creation of the Reichsländer was seen as a betrayal of the Radical Reformism Bräutigam envisioned, putting a definitive final nail in the coffin of the possibility of an Independent Ukrainian State. It took less than a year after the humiliation for Bräutigem to receive a letter from Germania announcing his resignation in favour of Pieter Schelte Heerema.\n\nAnd with the hopes and dreams of an Independent Loyal Ukraine ended, the Ruthless corporate exploitation has entered a new phase in Ukraine."


