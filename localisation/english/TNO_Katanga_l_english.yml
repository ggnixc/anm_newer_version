 #LEADER DESCRIPTIONS#
 POLITICS_ANTOINE_GIZENGA_DESC:"Antoine was born under Belgian rule, and grew up under German rule for a large part of his life. It seemed to Antoine that there was very little difference in the rule of one European nation as opposed to another. They were all ruthless, cruel and inhumane to the core. Antoine dreamed in those years of a different Africa, not one under the jackboot of the Germans or the whip of the Belgians, but a strong and free Africa, but it seemed then like only a distant dream or perhaps even a distant memory of what once was. Antoine heard stories though. Stories about another people in a far off land, who rose against their oppressors and rebuilt their nation through the power of socialism. Then came the liberation of Africa in the 1960s, and the failure of the new colonial empires of the so-called 'Organization of Free Nations.' The time had come for socialism to shatter the spiritual and physical chains of his people. But it seems some people cannot break those chains, so deeply rooted is their mental slavery. This drove Antoine mad. He realized that liberation cannot come via the ballot box, but through the barrel of a rifle He came to the understanding that Congo should not enslave its proletariat after Europe enslaved every Congolese, but rather Congo should strive to free all it can. The inability of the Congolese people to understand this drove Antoine mad. If liberation cannot come via the ballot box, then liberation will arrive through the barrel of a rifle."

