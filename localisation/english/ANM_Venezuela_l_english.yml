### NAT. SPIRITS ###
VEN_Oil_Baron: "The Oil Baron"
VEN_Oil_Baron_desc: "As the largest Oil producer outside of the Middle East, Venezuela's vast oil fields have made the country very wealthy. Thanks to close co-operative between them and Saudi Arabia, they’re able to negotiate the price of oil to their benefit, flooding the country full of trade and investment money.\n\nAlthough its a member of the OFN, the power Venezuela receives from its oil fields and reserves allows it to sell not just to the United States and its allies but to China, the USSR and Japan. If anyone refuses to play along with Venezuela, then Venezuela will have them deal with angry crowds of people demanding gas for their cars. No self-serving politician wants a repeat of the Early 1970s Oil Crisis, so it’s best to play by Venezuela’s rules."

