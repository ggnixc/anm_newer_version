 ### Leaders ### 
 POLITICS_JOZEFSASIK_DESC_SLOVAKIA:0 "Jozef Sasík is a well-educated spokesman, a true man for the Slovak course. Jozef Sasík born in 1958 saw the greatest and lowest points of Alexander Mach's regime and set his life all around saving the Slovak state and bringing it back to the top and even trying to reason with German Overlords. Sasík studied at Žilina's State University in the faculty of history and politics. Jozef Sasík a young figure in Slovak politics before October 1980 a pretty much nobody only once appearing in an anti-Hungarian protest in 1979 and in his 18 years old he joined the Army and was assigned to the 7th garrison in Southern Slovakia in a small city of Levice where he met on a state visit the Great Vodca Mach. Mach and Sasík in the beginning become close friends.  He was even a first-hand witness of violent Hungarian-Slovak clashes in Levice. Sadly on October 15th, Great Vodca Alexander Mach died of a stroke and a political vacuum followed were young and courageous Sasík, known in HSLS only as a “close friend of Mach”, gave a passionate and loud speech about the future of Slovak State and how would Mach wants us to vote and shape the future of Slovakia. With a close victory in HSLS internal elections, he assumed with the great burden the role of Vodca, and his great battle for influence began. After months of influence battle inside the HSLS and days of protests outside of Slovak Snem, desperate Sasík signed the executive that allowed leftist parties to participate in Slovak elections and by this assured vote from Reformists and Centrists inside the HSLS. After the turbulent years of his rule, he set his government on a course of reformism and economical independence from Germany.§!"
