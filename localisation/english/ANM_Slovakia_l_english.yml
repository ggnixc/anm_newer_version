 ## Descriptions ##
 # Country Leader #
 POLITICS_PETER_DUBCEK_DESC: "Germany's most loyal “Ally” since the days of the Second World War, Slovakia has followed Germany through the Economic Crisis, Civil War, and Russian Humiliation. For nearly 60 years Slovakia has followed the Reich, and Peter Dubček won't be changing course anytime soon. \n\nSon of Czechoslovak politician Alexander Dubček, Peter has lived a life shaped by the hardships of the Slovak state. He joined the HSLS in his early adulthood, rising through the party ranks and becoming the President of Slovakia after Alexander Mach’s passing in 1980. With decades of political experience, he navigated Slovakia’s subjugation under the German Reich, pursuing a cautious reformist agenda to maintain limited autonomy without provoking them. \n\nDubček’s leadership is shaped by blending religious authority with fascist ideals. He envisions Slovakia’s salvation through a strict union of faith and nationalism, demanding racial and spiritual purity for the nation’s redemption. Critics of Dubček see him as a German bootlicker, more focused on appeasing the Reich than securing meaningful stability or autonomy for Slovakia. His prioritization of loyalty to Germania over the well-being of his nation has made him a divisive and ineffective leader."
 POLITICS_JOZEF_SASIK_DESC: "Germania’s most loyal “Ally” since the days of the Second World War, Slovakia has always followed Germany through Economic Crisis, Civil War and Russian Humiliation. It has followed them for nearly 60 years, and Vodca Jozef Sásik won’t be changing course anytime soon.\n\nBorn in 1958, Sasík studied Forestry Management at Žilina's State University. He soon became involved in Youth Fascist and Religious organisations, becoming a follower of the Jozef Tiso and joining the Slovaks People Party. When Vodca Alexander Mach died of a stroke in 1980, a political vacuum followed, Sasík saw an opportunity to embed himself in the Slovakian Government. At the HSLS party conference that followed Mach’s death, he gave a passionate and fiery speech about the legacy of Tiso and Mach and the future of the Slovak State.\n\nHis speech earned him much support and allies in the HSLS, and he soon became the Agriculture Minister in the new government. He became known as a staunchly pro-German voice in the Government who advocated for a return to the days of Jozef Tiso. When the Vodca position was vacated once again in 1986, he managed to snag the top job for himself thanks to strong support from the Reich. Since then, he has kept Slovakia loyal to the Reich, and as long as he stays, that's set to continue for the foreseeable future."
 POLITICS_VLADIMIR_CHOVAN_DESC: "Chovan is a skilled and pragmatic technocrat who worked in agricultural engineering before entering Slovakia's bureaucracy. As the HSLS's technocratic faction leader, he advocates for modernization and efficiency within the party and the state. \n\nHis expertise and loyalty to the nation allowed him to rise rapidly through the ranks, ultimately securing the position of Minister of Economy. In this role, he focused on industrial reform and economic stability, ensuring Slovakia remained an integral part of the Reich’s economic sphere."
 POLITICS_MILAN_FOGAS_DESC: "Formerly a signalman at the Brunovce railway station, ascended to power as the Vodca of the Hlinka’s Guard, and ultimately assumed the presidency of the fractured Slovak Republic. His rise was cemented by a decisive coup d’état following the collapse of the HSLS after the end of the Third West Russian War, during which he leveraged his position within the paramilitary organization to seize control during a moment of national chaos. \n\nFogaš presents himself as a staunch nationalist and a defender of Slovak traditions. However, his critics argue that his rule is characterized by authoritarianism and suppression of dissent. Under his leadership, the Hlinka’s Guard transitioned from a militant faction to the primary enforcer of state authority, consolidating control over Slovakia’s fractured political system. Despite his controversial methods, Fogaš enjoys considerable support among those who view him as a savior from the instability that plagued the nation post-SNS collapse."
 POLITICS_ANDREJ_DANKO_DESC: "Born on October 12, 1965, Andrej Danko joined the Slovak Nationalist Party in his youth, rising through the ranks for his unwavering dedication to Slovak identity and sovereignty. By the late 1990s, Danko had established himself as a powerful voice for reactionary nationalism. \n\nIn the chaos that followed the Third West Russian War, Slovakia plunged into political instability. The government’s refusal to hold elections in 1999 sparked widespread unrest, leading to riots throughout the summer of 2000. Amid this turmoil, the Hlinka Guard, led by Milan Fogaš, seized power in a military coup. The assassination of Peter Dubček further fueled the nation’s descent into chaos. \n\nWith Slovakia now under military rule, Germany, unable to pacify the country, was forced to allow the first free elections in years. Danko’s Slovak Nationalist Party emerged victorious, gaining significant support from a population eager for stability and national pride."
 POLITICS_SERGEJ_KOZLIK_DESC: "Once an economist and prominent figure within the Ministry of Finance, Sergej Kozlík carved a path through Slovakia’s economic bureaucracy, serving as the Head of the Department and later Director of the Industrial Prices Department. His extensive expertise in economics earned him recognition as one of Slovakia’s most capable administrators during a period of economic turbulence. \n\nFollowing Germany’s defeat in the Third West Russian War, Slovakia's reliance on the Reich for economic and political stability came to a head, resulting in the country’s collapse. Amid the ensuing chaos, Germany, unable to reassert direct control, allowed the first “fair“ elections in Slovak history. Kozlík’s party, the SOŽ-K, emerged victorious, pledging to restore order and rebuild the economy while maintaining Slovakia’s ties to Germany in a framework that preserved national sovereignty. As head of state, Kozlík seeks to guide Slovakia toward recovery, balancing economic revival with the realities of its relationship with Germania."
 POLITICS_VLADIMIR_MECIAR_DESC: "Once an economist and prominent figure within the Ministry of Finance, Sergej Kozlík carved a path through Slovakia’s economic bureaucracy, serving as the Head of the Department and later Director of the Industrial Prices Department. His extensive expertise in economics earned him recognition as one of Slovakia’s most capable administrators during a period of economic turbulence. \n\nFollowing Germany’s defeat in the Third West Russian War, Slovakia's reliance on the Reich for economic and political stability came to a head, resulting in the country’s collapse. Amid the ensuing chaos, Germany, unable to reassert direct control, allowed the first “fair” elections in Slovak history. Kozlík’s party, the SOŽ-K, emerged victorious, pledging to restore order and rebuild the economy while maintaining Slovakia’s ties to Germany in a framework that preserved national sovereignty. As head of state, Kozlík seeks to guide Slovakia toward recovery, balancing economic revival with the realities of its relationship with Germania."
 # Minister #
 SLO_Jozef_Sasik_hog_desc: ""
 SLO_Jozef_Tuchyna_sec_desc: "He began his career as a freelance designer and architect, establishing a reputation for innovation and precision. Between 1985 and 1990, he taught at the Faculty of Architecture of the Slovak University of Technology, sharing his expertise with the next generation of Slovak architects. \n\nAfter leaving academia, Paška transitioned to politics, joining the HSLS and rising quickly through its ranks. His aptitude for diplomacy and vision for Slovakia’s role in the world secured him the Minister of Foreign Affairs position. As foreign minister, he navigates the complexities of a nation under the boot of a fading order, striving to balance national sovereignty with the realities of Slovakia’s dependence on the Reich. His architectural mindset shapes his diplomatic strategies—methodical, deliberate, and focused on building a stable foundation for Slovakia’s future on the international stage."
 SLO_Jaroslav_Paska_for_desc: "He began his career as a freelance designer and architect, establishing a reputation for innovation and precision. Between 1985 and 1990, he taught at the Faculty of Architecture of the Slovak University of Technology, sharing his expertise with the next generation of Slovak architects. \n\nAfter leaving academia, Paška transitioned to politics, joining the HSLS and rising quickly through its ranks. His aptitude for diplomacy and vision for Slovakia’s role in the world secured him the Minister of Foreign Affairs position. As foreign minister, he navigates the complexities of a nation under the boot of a fading order, striving to balance national sovereignty with the realities of Slovakia’s dependence on the Reich. His architectural mindset shapes his diplomatic strategies—methodical, deliberate, and focused on building a stable foundation for Slovakia’s future on the international stage."
 SLO_Ludovit_Cernak_eco_desc: ""

 
### Ideas ###
 SLO_German_Autonomous_Zones: "German Autonomous Zones"
 SLO_German_Autonomous_Zones_desc: "Due to the number of German settlers that flooded Slovakia through the decades and the signing of treaties between the Greater German Reich and the Slovak Republic, some regions inside the minuscule country enjoyed high levels of autonomy from Bratislava thanks to their German ethnic majority.\n\nThe Karpatendeutsche have the right to elect their own leadership and representatives while also having the privilege of responding directly to Germania rather than the local Slovak government, much to the latter's dismay. These agreements have ensured the settlers are protected directly by the Reichsadler, ensuring their continuous and ever-lasting well-being."
 SLO_Out_Of_Date_Military: "Out-Of-Date Military"
 SLO_Out_Of_Date_Military_desc: "Slovakia’s current armed forces’ status could be (and often is) considered laughable, thanks to the government cutting the national defense budget in favor of more civilian-friendly fields.\n\nPerhaps the most underfunded and unqualified army in the whole Europäische Pakt, the Republic heavily relies on the German Wehrmacht for military defense due to its use of an outdated and small army alongside aging tactics and a non-existent air force.\n\nMany in the armed forces have proposed large-scale modernization programs that should give the state a proper fighting force. Still, their pleas fall on deaf ears in Bratislava… although it will become evident that sooner or later, Slovakia will need the ability to defend itself and partake in the defence of Europa."
 SLO_Helplessly_Dependent: "Helplessly Dependent"
 SLO_Helplessly_Dependent_desc: "Slovakia’s future remains deeply bound to the German Reich, with its policies and administration shaped by directives directly from Germania. Decades of reliance on the Reich’s economic and military dominance have left Slovakia unable to function independently despite maintaining the appearance of self-governance.\n\nEvery decision must align with the goals of its powerful overlord, leaving little room to address the country’s needs. As this dependency grows, the Slovak people bear the strain of foreign dominance, with no clear path to autonomy or stability."


