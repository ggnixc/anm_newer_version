 ## Descriptions ##
 POLITICS_JOZEF_SASIK_DESC: "Germania’s most loyal “Ally” since the days of the Second World War, Slovakia has always followed Germany through Economic Crisis, Civil War and Russian Humiliation. It has followed them for nearly 60 years, and Vodca Jozef Sásik won’t be changing course anytime soon.\n\nBorn in 1958, Sasík studied Forestry Management at Žilina's State University. He soon became involved in Youth Fascist and Religious organisations, becoming a follower of the Jozef Tiso and joining the Slovaks People Party. When Vodca Alexander Mach died of a stroke in 1980, a political vacuum followed, Sasík saw an opportunity to embed himself in the Slovakian Government. At the HSLS party conference that followed Mach’s death, he gave a passionate and fiery speech about the legacy of Tiso and Mach and the future of the Slovak State.\n\nHis speech earned him much support and allies in the HSLS, and he soon became the Agriculture Minister in the new government. He became known as a staunchly pro-German voice in the Government who advocated for a return to the days of Jozef Tiso. When the Vodca position was vacated once again in 1986, he managed to snag the top job for himself thanks to strong support from the Reich. Since then, he has kept Slovakia loyal to the Reich, and as long as he stays, that's set to continue for the foreseeable future."

 
### Ideas ###
 SLO_German_Autonomous_Zones: "German Autonomous Zones"
 SLO_German_Autonomous_Zones_desc: "Due to the number of German settlers that flooded Slovakia through the decades and the signing of treaties between the Greater German Reich and the Slovak Republic, some regions inside the small country enjoy high levels of autonomy from Bratislava thanks to their German ethnic majority.\n\nThe Karpatendeutsche have the right to elect their own leadership and representatives while also having the privilege of responding directly to Germania rather than the local Slovak government, much to the dismay of the latter. These agreements have made sure that the settlers are protected directly by the Reichsadler, ensuring their continuous and ever-lasting wellbeing."
 SLO_Out_Of_Date_Military: "Out-Of-Date Military"
 SLO_Out_Of_Date_Military_desc: "Slovakia’s current armed forces’ status could be (and often is) considered laughable, thanks to the government cutting the national defence budget in favour of more civilian-friendly fields.\n\nPerhaps the most underfunded and unqualified army in the whole Europäische Pakt, the Republic heavily relies on the German Wehrmacht for military defence due to its use of an outdated and small army alongside ageing tactics and a basically non-existent air force.\n\nMany in the armed forces have proposed large-scale modernisation programs that should give the state a proper fighting force, but their pleas fall on deaf ears in Bratislava…although it will become evident that sooner or later, Slovakia will need the ability to defend not only itself but also partaking in the defence of Europa."

