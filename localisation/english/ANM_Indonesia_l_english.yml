 INS_Eros_Djarot: "Eros Djarot"

 ################
 ##Leader Descs##
 ################

 POLITICS_SUKARNO_DESC: "Disloyalty has been cast to the dustbin of history, and both cosmopolitan and military turncoats have found their rightful place at the bottom of unmarked graves. War has been chased off the coasts, and the Equatorial Emerald shines again. Soekarno has won, and so has Indonesia.\n\nThe question of the costs at which such a triumph was achieved shall be left to the historians, for the President's ambitions have waited long enough. Traitors shall be punished, and centralization shall be imposed, for petty regionalism has caused enough suffering. Indonesia shall attain its rightful place on the world stage, for the so-called "great" powers have toyed with it long enough. To put it simply, compromise has shown its limits, and its biggest proponents have been outed as the traitors they were.\n\nThe President, now more popular than ever with the masses with his fearlessness, has shown that there is nothing that can stop the unyielding force of Indonesian sovereignty. For Bung Karno has shown his spirit - his Gelora - one to light up the nation forevermore."

