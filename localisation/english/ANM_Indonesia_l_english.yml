 INS_Guided_Democracy: "An Eternal Guided Democracy"
 INS_Guided_Democracy_desc: "The System Built by the Father of Indonesia, Sukarno, blending nationalism and religion into a co-operative Nasakom governmental system has withstood the test of time. Challengers to Sukarno's rule have all been banished following the end of the Indonesian Civil War in 1968, providing Sukarno with limitless popularity and political power to shape the image of Indonesia to his own vision. Militarists, Communists, Islamists have no place in our new Indonesia, and the PNI will be the shining beacon in order to lead Indonesia into the New Millennium, guiding our populace towards a new age."
 
