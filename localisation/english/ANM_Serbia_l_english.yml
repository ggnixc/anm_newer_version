### Ideas ###
 SER_German_Controlled_Economy: "German Controlled Economy"
 SER_German_Controlled_Economy_desc: "Serbia’s Economy acts not like one designed for Serbia but like an economy designed for Germany. The Serbian Economy is almost entirely built around extracting every single speck of wealth from the nation and exporting it to Germany. German firms have monopolised the nation’s mining, industrial and financial sectors of the economy. Serbia’s Arms Industry works for the German Garrison rather than the Serbian Army. In many ways, the Reich treated Serbia more akin to a colony like Kaukasia or Ukraine rather than as an allied nation under their guidance.\n\nThis state of affairs has left precious little economic wealth for the Serbs themselves. The Serbian People are some of the poorest in Europe, with very little of the economic profits returning to their hands. Despite this extreme economic inequality and clear neglect of Serbian citizens, Germany seems to be in no hurry to alleviate our burdens."
 SER_German_Garrison: "The Wehrmacht Garrison"
 SER_German_Garrison_desc: "The Communist Uprising in the wake of Hitler’s Death showed the Reich how unstable Collaborator Rule was in Serbia. When the Reich reasserted itself after the Führer ’s Death, it decided to take action to keep their interests in Serbia safe. They reinforced the German Garrison in Serbia by dispatching the 342nd Infantry Division. This extensive garrison within Serbia is one that is ready to put down any resistance, be that from Partisan Actors or Government Officials, if they show any signs of defying their Germanic overlord.\n\nThe Garrison forbids the Serbians from expanding or properly training its military (Though small Serbian Militias still exist to help assist the Army and Police) to ensure that resisting their might will never be an option. Additionally, Serbia is forced to pay for every single one of the Garrison's expenses as thanks for them “protecting” the Kingdom's Sovereignty."
 SER_Chetnik_Kingdom: "King Alexander II"
 SER_Chetnik_Kingdom_desc: "Alexander Karađorđević II, King of Serbia and reigning head of the Karađorđević dynasty spent much of his early life in exile, and was even born in Canada instead of his native Serbia. He returned to Serbia with his parents when the Royalist Chetniks asserted their power in the aftermath of the Serbian National Uprising, and proclaimed his father Peter II King of Serbia once again. He soon joined the Serbia Army, and rose to become a Captain by the time of his Father’s Death in 1972.\n\nA staunch believer of Constitutional Monarchy, Alexander has done everything in his limited power to better the lives of his subjects however these efforts have been mitigated by the German Interests in Serbia. While a full-fledged Serbian democratic institution seems like an impossible utopia, the recent political changes in the Kingdoms of Hungary and Romania (of which he’s a first cousin of Michael I) have brought a small flame of hope that a free and democratic Kingdom of Serbia is possible."

