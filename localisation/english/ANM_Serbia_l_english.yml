 ## Descriptions ##
 POLITICS_VOJISLAV_SESELJ_DESC: "Serbia shall be pure, Serbia shall be strong, Serbia shall be free.\n\nWith the Chetnik forces successful in the power struggle in the aftermath of the Serbian National Uprising, a dark chapter of history closed, and a fresh one opened. Many had hoped this new chapter would bring with it the much-needed changes to society, to better the lives of the oppressed Serbs and to gain back their lost national pride, but nothing could be further from the truth. Vojislav Šešelj is the latest head of the Chetnik government, a group of hardline Serbian royalists and nationalists who brought back the Karađorđević dynasty to rule the Kingdom once again in 1963.\n\nHis speeches, while radical, are the only thing that’s keeping the facade of an independent Serbian state alive. Nothing has changed since the Chetnik clique came into power, the king is a mere figurehead and the frustration towards their German oppressors has been redirected towards their lost brothers in occupied former lands. Šešelj calls for the return of Serbian Territory stolen by the Italian-aligned Croatia and Bulgaria, but for now these are just mere empty threats. Germania pays little attention to the Chetniks Ethnonationalist rants, as the permanent Wehrmacht presence makes sure anything not in favour of Germania’s policies would be dealt with quickly.\n\nSerbia shall be poisoned, Serbia shall be weak, Serbia shall be a puppet."
 

 
