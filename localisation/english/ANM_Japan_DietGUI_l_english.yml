JAP_GUI_actions_timing_30: "Available every §Y30 days§!"

JAP_GUI_action_1: "[getJAPGUIAction1]"
JAP_GUI_action_1_tt: "[getJAPGuiAction1tt]"
JAP_government_action_1: "§GEmbellish Accomplishments§!"
JAP_government_action_1_tt: "Results are still the best way to convince people to side with you. Sometimes, it takes a little convincing - and what better way is there to convince someone than to dress up the truth?"
JAP_opposition_action_1: "§RDiscredit Faction§!"
JAP_opposition_action_1_tt: "The strife for dominance over the House of Representatives is an eternal battle between its factions. Thankfully, all that some people need to switch sides is learning just how bad their current benefactors are - even if it may be somewhat exaggerated..."
JAP_opposition_action_1_cost: "§Y25§!£GFX_political_power_texticon  | §Y2%§! £GFX_podium_texticon"

JAP_GUI_action_2: "[getJAPGUIAction2]"
JAP_GUI_action_2_tt: "[getJAPGuiAction2tt]"
JAP_government_action_2: "§GUse the Public§!"
JAP_government_action_2_tt: "One does not necessarily have to rule with the people's assent, but having it makes governing considerably easier. This includes convincing Members of Parliament to join ranks with you, even if at the cost of some of the public's respect."
JAP_opposition_action_2: "§RAttack Publicly§!"
JAP_opposition_action_2_tt: "Our enemies in the House of Representatives are fair game. It is part and parcel of the life of a politician to discredit adversaries whenever they can, however they must."
JAP_opposition_action_2_cost: "§Y25§!£GFX_political_power_texticon  | §Y2%§!£GFX_approval_texticon"

JAP_GUI_action_3: "[getJAPGUIAction3]"
JAP_GUI_action_3_tt: "[getJAPGuiAction3tt]"
JAP_government_action_3: "§GLaunch Propaganda Campaign§!"
JAP_government_action_3_tt: "Although the right to rule is constitutionally mandated for the government, the people and House of Peers must be supportive of it for it to come to any fruition. A well-funded propaganda campaign is sure to foster this belief amongst them."
JAP_opposition_action_3: "§RLaunch Slander Campaign§!"
JAP_opposition_action_3_tt: "A concerning amount of people, both in the general public and the House of Peers, continue to support our government's adversaries. It is time for them to learn the truth about them, no matter how ugly we claim it is."
JAP_opposition_action_3_cost: "§Y50§!£GFX_political_power_texticon  | §Y50M§!£GFX_dollar_sign"

#IJA/IJN/Tension

IJA_button_1_title: "§G+¥§!"
IJA_button_1_tt: "§OINCREASE BUDGET§!\n\nInvesting into the budget of the §OIJA§! will surely grant our government their favor and support.\n\n§R+25M USD Expenditures§!\n§G+5% §OIJA§! Support§!\n§R-2.5% IJN§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJA_button_2_title: "§G+§!£GFX_army_experience"
IJA_button_2_tt: "§OPROMOTE OFFICERS§!\n\nOfficers known to be friendly to our government will be promoted, satisfying the §OIJA§! as a whole and granting us useful allies.\n\n§R-10 Army Experience§!\n§G+10% §NIJA§! Support§!\n§R-5% IJN§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJA_button_3_title: "§R-¥§!"
IJA_button_3_tt: "§RDECREASE BUDGET§!\n\nSlashing the budget of the §OIJA§! won't be liked by them, but at least it'll save us some money.\n\n§G-25M USD Expenditures§!\n§R-5% §OIJA§! Support§!\n§G+2.5% IJN§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJA_button_4_title: "§R-§!£GFX_army_experience"
IJA_button_4_tt: "§RDEMOTE OFFICERS§!\n\nWhatever may be the reason, the government will demote several §OIJA§! officers deemed unruly. This will, however, cause the branch to become even more §Rparanoid§!.\n\n§R-5 Army Experience§!\n§R-5% §OIJA§! Support§!\n§G+2.5% IJN§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"

IJN_button_1_title: "§G+¥§!"
IJN_button_1_tt: "INCREASE BUDGET§!\n\nInvesting into the budget of the IJN§! will surely grant our government their favor and support.\n\n§R+25M USD Expenditures§!\n§G+5% IJN§! Support§!\n§R-2.5% §OIJA§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJN_button_2_title: "§G+§!£GFX_navy_experience"
IJN_button_2_tt: "PROMOTE OFFICERS§!\n\nOfficers known to be friendly to our government will be promoted, satisfying the IJN§! as a whole and granting us useful allies.\n\n§R-10 Navy Experience§!\n§G+10% IJN§! Support§!\n§R-5% §OIJA§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJN_button_3_title: "§R-¥§!"
IJN_button_3_tt: "§RDECREASE BUDGET§!\n\nSlashing the budget of the IJN§! won't be liked by them, but at least it'll save us some money.\n\n§G-25M USD Expenditures§!\n§R-5% IJN§! Support§!\n§G+2.5% §OIJA§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"
IJN_button_4_title: "§R-§!£GFX_navy_experience"
IJN_button_4_tt: "§RDEMOTE OFFICERS§!\n\nWhatever may be the reason, the government will demote several IJN§! officers deemed unruly. This will, however, cause the branch to become even more §Rparanoid§!.\n\n§R-5 Navy Experience§!\n§R-10% IJN§! Support§!\n§G+5% §OIJA§! Support§!\n§R+1.5% Paranoia§!\n\n§YAvailable every month§!"

Tension_button_1_tt: "§GINTERSERVICE TRAINING PROGRAMS§!\n\nBy holding training programs involving both the Army and the Navy, we can slightly increase the support of both and act to lessen military paranoia.\n\n§R+25M USD Expenditure§!\n§G+2.5% IJN§! Support§!\n§G+2.5% §OIJA§! Support§!\n§G-5% Paranoia§!\n\n§YAvailable every month§!"
Tension_button_2_tt: "§GENCOURAGE INTERSERVICE WAR GAMES§!\n\nFor a larger cash investment, we can stage complex war games requiring cooperation between the branches of the Military, increasing the support of the Army and Navy and decreasing paranoia to a significant degree.\n\n§R+350M USD Expenditure§!\n§G+5% IJN§! Support§!\n§G+5% §OIJA§! Support§!\n§G-25% Paranoia§!\n\n§YAvailable every 180 days§!"
Tension_button_3_tt: "§RFIGHT INTERSERVICE CORRUPTION§!\n\nFighting corruption within the Army and the Navy will decrease paranoia, but we will lose a degree of goodwill with both. No one likes having their dirty laundry aired out in public...\n\n§R-10% IJN§! Support§!\n§R-10% §OIJA§! Support§!\n§G-10% Paranoia§!\n\n§YAvailable every 48 days§!"
Tension_button_4_tt: "§RREMOVE GENERAL HQ'S COMMAND ROLE§!\n\nWe can take drastic measures to decrease the ability of the Armed Forces to create instability. Yet in doing so, we will strongly harm our relationship with both. That, in itself, could have dire consequences.\n\n§R-25% IJN§! Support§!\n§R-25% §OIJA§! Support§!\n§G-40% Paranoia§!\n\n§YAvailable once every §Ryear§!§!"

