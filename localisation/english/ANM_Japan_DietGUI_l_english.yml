JAP_Peers_support_average: "§YAverage§!"
JAP_Peers_support_high: "§OHigh§!"
JAP_Peers_support_veryhigh: "§GVery High§!"

JAP_Peers_support_tt: "The §MSupport of the House of Peers§! is viable to have for any Prime Minister of Japan, as it is the §WHouse of Peers§! and Privy Council that ultimately nominate the Prime Minister to begin with. As such, keeping them content is of paramount importance. Should their §MSupport§! fall below §Y50%§!, the Prime Minister's reign falls in §Rcritical danger and may collapse§!!"

JAP_Peers_support_increase_small: "The §MSupport of the House of Peers§! §Gincreases§! somewhat."
JAP_Peers_support_increase_med: "The §MSupport of the House of Peers§! §Gincreases§! moderately."
