JAP_GUI_IJA_tt: "§OSupport from the Imperial Japanese Army§! ([?JAP_IJA_support|Y]§Y%§!)\n\nSupport from both branches of the Imperial Japanese Armed Forces is important to the §Ggovernment's§! stability and paramount to the Empire's ability to defend itself. Should the §OIJA§! and IJN§! not be approximately in equal favor of the §Ggovernment§!, §RParanoia§! will increase."
JAP_GUI_IJA_title_sl: "§OThe Imperial Japanese Army§!"

JAP_GUI_IJN_tt: "Support from the Imperial Japanese Navy§! ([?JAP_IJN_support|Y]§Y%§!)\n\nSupport from both branches of the Imperial Japanese Armed Forces is important to the §Ggovernment's§! stability and paramount to the Empire's ability to defend itself. Should the §OIJA§! and IJN§! not be approximately in equal favor of the §Ggovernment§!, §RParanoia§! will increase."
JAP_GUI_IJN_title_sl: "The Imperial Japanese Navy§!"

JAP_GUI_balance_title_sl: "§WNo branch§!"
JAP_GUI_Tension_tt: "§RParanoia§! ([?JAP_Tension|R]§R%§!)\n\n[getJAPDominatingFaction] §Wis currently dominating the military.§!\n\n§RParanoia§! is an abstract measure of the Japanese military's unhingedness and willingness to take actions into their own hands, a possibly §Rextremely dangerous§! problem for the Empire of Japan. The higher §RParanoia§! becomes, the more infighting the military suffers and the lesser the §Ggovernment's§! control over the military becomes." 

