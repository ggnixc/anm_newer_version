#Public Approval

JAP_Public_support_none: "§xHostile§!"
JAP_Public_support_weak: "§RUnpopular§!"
JAP_Public_support_average: "§YWary§!"
JAP_Public_support_high: "§OHigh§!"
JAP_Public_support_veryhigh: "§GVery High§!"

JAP_Public_support_tt: "§TPublic Support§! is crucial to any government wishing to safely rule over its state, and the Empire of Japan is not an exception to this. The Prime Minister's government thrives and shrivels under the §TPublic's§! watchful eye, and their demeanor is crucial to how much support the ruling faction has in the §WHouse of Representatives§!. Falling below §Y30%§! will §Rrapidly diminish the ruling faction's power§!."

