 CFS_congo_war_congo_democratic_front: "The Congo War"
 CFS_congo_war_congo_democratic_front_desc: "A recurring theme is present in the entire history of the Congo since its colonisation - Bloodshed and conflict. The cruel Belgian overlords were replaced by Siegfried Müllers equally careless, mercenary-led German fiefdom, until liberation by the OFN finally came. It was the military which dominated the Congo's government in the following decades. With Jean-Philibert Mabaya being elected president in the country's first free election in 1999, it seemed as if Congo was on the road to democracy - a development cut short with the military marching on Kinshasha.\nOnce more, the Congo has to suffer, as internal and external factions fight for control over the Heart of Africa."
 CFS_congo_spirit_of_freedom: "Spirit of Freedom"
 CFS_congo_spirit_of_freedom_desc: "In the horrible times our nation is going through; with despots and extremists alike sieging lands and slaughtering the innocent, we are the only faction that can claim to fight for democracy.\nThe struggle for the liberty of the Congo and it's people is a fair cause and a difficult task at the same time.\nThe only thing that keeps our men marching is hope, hope that this ends someday, hope for a country where they're families can live happy, peaceful lives, hope that, in the end, it'll be worth the effort."
 
