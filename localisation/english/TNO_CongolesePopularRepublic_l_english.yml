 #LEADER DESCRIPTIONS#
 POLITICS_JAMES_KABAREBE_DESC:"James Kabarebe is an anomaly amongst the contenders for the rulership over Congo. Born in Reichskommisarat Ostafirka, he would grow up in a post-nazi East African Federation. He grew up in a family of staunch anti-communist workers where he embraced the ideals of the market and the state. His life changed drastically in 1979 when his father was accused of dissidence and put on show trial. The verdict proclaimed him guilty and he alongside three other persons went missing under suspicious circumstances. That event cemented Kabarebe's hatred for socialism and he vowed to do everything in his power to eradicate it. He fled to the jungles near the Congo borders and lake Kivu where he formed the April 13 movement or more commonly know as A13. He terrorized EAF patrols alongside the lonely and outback dirt roads, killed anyone suspected of helping the regime in finding him, and stole numerous quantities of food, livestock, and grain, all in the name of liberating Rwanda from the EAF. His adventures did not go unnoticed as soon CIA approached his group in hopes of establishing a deal. They would supply him with guns and ammo if he continues to destabilize the region. Kabarebe would accept American support and would continue the terror campaign, culminating in an America and DRC-backed uprising that would be utterly crushed due to a massive lack of popular support for the uprising.Almost all high-ranking members of the A13 movement were killed or disappeared. Karabebe would be the only surviving member.  He would begin a trail of fire. Burning, slashing, and salting everything in his path to the Congolese border, he would be accepted by the military regime that funded him. Due to his well-known skills in military matters, he would begin a meritorious rise in the regime that few would have expected.He became the only non-Congolese Major General in the nation, being one of the few generals against the military step-down in 1998. He would start his party, the People's State Alliance, that would get a large amount of the military's vote in the following election. When that dammed populist, Mabaya won the election and began slashing the military's budget, he rose, he stood against populism. Karabebe intends to unite the Congo with the only force that has ever given it stability. And he will do so no matter the cost."
 
