 #Nat Spirits
 NZL_Perfect_Little_Economy: "The Perfect Little Economy"
 NZL_Perfect_Little_Economy_desc: " For as long as people have lived on these islands, life has been simple. Wake up, feed the animals, have dinner with your family, and go to bed. This is how life has been for generations, and how it will continue. Despite modernization in recent years the daily life of the humble worker stays simple. Whether you’re a dairy farmer in Taranaki or a factory worker in Auckland, things are good. New Zealand’s economy favors small workers by providing good wages, food on the table, and plenty of roofs to live under. All these factors has led to New Zealand having one of the healthiest economies for a nation of its size.\n\nThe “Perfect Little Economy”, as it’s been affectionately dubbed, has taken years to build. In the years following the Second World War, our economy was suffering. However after a small series of reforms and a new major trading partner in the United States, we began to bounce back. As the world approaches a new century, New Zealand remains a role model for how to manage an economy. Turbulence is surely on the horizon for many nations, but New Zealand continues to confidently stride towards the next millennium."

