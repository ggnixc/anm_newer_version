ANM_paktgui_increasebudget_tt:0 "§MWe will invest §G2000B§!§M into economic projects across the Pakt, increasing the §GGDP growth factorB§!§M of member states by §G0.1§!"
ANM_paktgui_expandpaktinstitutions_tt:0 "§MWe will expand cooperation between the Europapakt members, spending §x75 Political Power§!§M and gaining §G5 Unity§!§M.§!"
ANM_paktgui_usepaktpoliticalbenefits_tt:0 "§MWe will use the Pakt's achievements to advance our domestic political situation, giving us  §G100 Political Power§!§M at the cost of §x15 Unity§!§M.§!"
ANM_paktgui_redirectpaktincome_tt:0 "§MWe will redirect the Pakt's Budget to increase the German economic reserves by §G50B.§!§M The member states will be provoked by this, costing us §x3 Pakt Stability§!§M and §x20 Unity§!§M.§!"

ANM_tt_pakt_reform_europeanscience:0 "§xCosts §G50 Unity\n\n§DEuropean Research will be connected to boost scientific efforts of Europakt members, increasing Pakt Member Research by §G20 percent."
ANM_tt_pakt_reform_erhaltungsgesetz:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DEuropean civillisation must be secured from degeneracy. §xThe Tolerance Laws of Pakt Members will become harsher§!"
ANM_tt_pakt_reform_toleranzgesetz:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DThere is no reason to use outdated concepts of race and supremacism.§xThe Tolerance Laws of Pakt Members will become less restrictive§!"

ANM_tt_pakt_reform_standardisedeconomy:0 "§xCosts §G50 Unity\n\n§DWe will begin a large-scale project to create standards for a wide range of producs, from welding equipment to waterslides and alarm systems, to aid our industrial efficiency, increasing the §GGDP growth factorB§!§M of member states by §G0.2§!"

ANM_tt_pakt_reform_commonlaw:0 "§xRequires all other law reforms and the leadership of Helmut Kohl and costs §G50 Unity\n\n§xA common set of civil law will be defined as the lowest common denominator across the Europakt.§!"
ANM_tt_pakt_reform_commonforeignpolicy:0 "§xRequires all other political reforms and the leadership of Helmut Kohl and costs §G50 Unity\n\n§xThe foreign policies and relations of the Europakt member states will be united in a single pan-European bureau.§!"
ANM_tt_pakt_reform_commoneconomy:0 "§xRequires all other economic reforms and the leadership of Helmut Kohl and costs §G50 Unity\n\n§xThe economic policies of the Europakt member states will be united in a single pan-European bureau.§!"

ANM_tt_pakt_reform_einwanderungsrichtlinie:0 "§xCosts §G50 Unity\n\n§xThe Immigration Policy of the Europakt will be decided§!"
ANM_tt_pakt_reform_changingpaktsitz:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DAnually, a different member nation will be selected for the Europakt presidency.§xInfluence in the Europakt will be divided more evenly among members.§!"
ANM_tt_pakt_reform_pakthauptstadtgermania:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DThe Europakt will center its institutions in Germania itself.§xThe Europakt will fall under greater German Influence§!"


ANM_tt_pakt_reform_fundingrepresentation:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DNationality representation in the Pakt institutions is based on their nation's contribution to the Europakt finances.§xThe Europakt will fall under greater German Influence§!"
ANM_tt_pakt_reform_proportionalrepresentation:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DNationality representation in the Pakt institutions is based on their nation's population.§xInfluence in the Europakt will be divided more evenly among members.§!"
ANM_tt_pakt_reform_sozialgesetz:0 "§xCosts §G50 Unity\n\n§DCommon welfare and social standards will be implemented across the Europakt.§xSocial Laws across the Europakt will be updated."
ANM_tt_pakt_reform_standardtaxation:0 "§xCosts §G50 Unity\n\n§DA minimum tax rate will be implemented across the Europakt.§xTaxation Laws across the Europakt will be updated."
ANM_tt_pakt_reform_schutzmachtdeutschland:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DGermany will form the backbone of European defense, and the Wehrmacht will serve as the Europakt's main military force.§xThe Europakt will fall under greater German Influence§!"
ANM_tt_pakt_reform_europaheer:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DThe militaries of the Europakt, while the original structures of member state's militaries are kept, will be united under a single command at the top.§xInfluence in the Europakt will be divided more evenly among members.§!"
ANM_tt_pakt_reform_weltnetzgesetz:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DIdeological inflitration from America and other subversive forces cannot be allowed inside Europe. The European Weltnetz will be isolated, and imported media strictly controlled.§xThe Europakt will fall under greater German Influence§!"
ANM_tt_pakt_reform_informationsfreiheitsgesetz:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DThe Weltnetz and Television cannot be allowed to be censored by autocratic regimes. All Europakt member states must ensure freedom of expression for their citizens.§xInfluence in the Europakt will be divided more evenly among members.§!"
ANM_tt_pakt_reform_fairmarket:0 "§xRequires a defeat of the conservative and costs §G50 Unity\n\n§DThe markets of the Europakt will be opened for fair competition.§xInfluence in the Europakt will be divided more evenly among members.§!"
ANM_tt_pakt_reform_germancompanyprimacy:0 "§xRequires a defeat of the reformists and costs §G50 Unity\n\n§DSelect German-based companies will be subsizied by the Europakt and prioritized for Pakt economic ventures.§xThe Europakt will fall under greater German Influence§!"
