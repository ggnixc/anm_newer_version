 ##IDEAS##
 SYR_a_mosaic_of_sects: "A Mosaic of Sects"
 SYR_a_mosaic_of_sects_desc: "Syria is a land of many faiths and ethnicities. Kurds, Syriacs, Armenians, Circassians, Chechens and Arabs. Each divided within many faiths, from Alawites, Ismailis, Twelvers, Sunnis, Druze, Jews Maronites, Melkites, Greek Orthodox, Armenian Orthodox and so on and so forth. While the annexation of the North has ensured a solid Arab majority, it has also shaken the stability of the previous system. Some sects that held disproportionate political power before are now relegated to small neighbourhoods in Damascus, meanwhile, small and mostly irrelevant minorities find themselves suddenly a larger and more important proportion of the Syrian population. This has greatly destabilised the local systems of power."
 SYR_but_the_cheikh_said: "But the Cheikh Said..."
 SYR_but_the_cheikh_said_desc: "Though not as bad as neighbouring Lebanon, Syria's politics suffer from what is called academically \"Zua'ama clientelism\". Local notables such as Cheikhs, village doctors, or historically landed families are often able to influence the entire population of the village in their specific direction. This system is particularly prevalent in the countryside, though the cities are not spared. This has led to the various politicians across the years to campaign for the support of the local notable rather than the people actually voting. In turn, bribery, intimidation and electoral dishonesty are rife and considered normal. At least, it is a stable system...as long as the zua'ama are content."
 SYR_a_return_to_1842: "A Return to 1842"
 SYR_a_return_to_1842_desc: "Syria is an independent, sovereign, Arab Republic working as best as it can for its people. That's what the government says, at least. In reality all of Syria's resources under the current government are turned towards two things: Keeping the population pacified, or extracting resources to send back to Turkey. Very little actually reaches the Syrian people, and that is generally the remains of the generous handouts given to notables. Some say this is an inherently unstable, dangerous and unworkable situation. But for Ankara, it's just business as usual."
 SYR_a_return_to_1842_tt: "§bTurkey§! receives heavily favored access to Syrian trade and industry, while Syrian production units are siphoned away."
 SYR_the_traitors_miracle: "The Traitors' Miracle"
 SYR_the_traitors_miracle_desc: "Despite the Imadi Government being nothing more than a facade for Turkish exploitative colonialism, it is undeniable that Imadi and his fellow economists have managed to transform Syria's economy and bring it to par with the economies of all the countries of the modern world."
 SYR_the_kindness_of_the_shadow: "The Kindness of the Shadow"
 SYR_the_kindness_of_the_shadow_desc: "Mohamed al-Imadi is many things, depending on whom you ask. A traitor for nationalists eager to shake off the Turk's boot. A good business partner for Turkish businessmen visiting south. A faceless, nameless figure for most Syrians. And an adoptive father, for thousands of orphans. Whether out of religious duty, genuine affection for children, or something that goes far deeper in the depths of his heart, al-Imadi has invested millions in networks of orphanages, and educational opportunities for orphaned children."
 SYR_the_national_guard: "The National Guard"
 SYR_the_national_guard_desc: "In order to alleviate concerns among the population about the Turkish garrison, the National Guard, recruited from both amongst Syrians in Turkish territory and from Syria proper, is a brainchild of Cemil Cahit Toydemir. The Guard is segregated by sect and ethnicity to avoid fostering a unified national identity. While technically reporting to Damascus, in reality the Guard is armed and ordered directly from Ankara. While relations between the government and the army were already cold, there are now audible whispers of sedition and treason, with many prominent officers fearing that the Guard will eventually come to replace them. They could not be more right."

 SYR_the_bloodied_papers_of_the_99: "The Bloodied Papers of the 99"
 SYR_the_bloodied_papers_of_the_99_desc: "The Declaration of the 99 started the protests and Jasmine Revolution. The National Guard and Turkish garrison tried to end them. In Damascus, men, women, children, the elderly, all were shot and the streets ran with blood. If they thought the Syrian nation could be silenced however, they were wrong. More people enter the streets, placing more and more pressure than the government can handle. The Army is already threatening to remove him if a single more peaceful protestor is so much as grazed by a bullet. Syria's future is in the balance."

