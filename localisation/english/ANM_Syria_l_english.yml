 WORLD.18242.t: "Revolution in Syria"
 WORLD.18242.desc: "Mass protests have been reported in the Turkish associated state of Syria. After decades of calm in the supervised civilian government, the reduction of Turkish personnel in the country has led to civil unrest amongst the Syrian population, that for the most part consider their country occupied by foreign invaders.\n\nThe Ankara-sponsored National Guard has reportedly began taking drastic measures to intimidate protestors and secure the government's grip on the country. Turkish and Syrian officials have refused to comment on the situation. "
 WORLD.18242.a: "No effort will spared to stop this in its tracks."
 WORLD.18242.b: "Troubling news from Turkey."
 WORLD.18242.c: "A measured response from a wounded Nation."
 WORLD.18242.d: "May they succeed in finding their freedom!"
 WORLD.18242.e: "The 'Kemalist Empire' frays at the seem."

 #News of the Turkish withdrawal from Syria was received with incredulity and shock in capitals across the world. The newly formed "Republic of Syria"

 SYR_flavour_event.1.t: "To Stomp a Flower"
 SYR_flavour_event.1.desc: "Mazen Al-Hamada was a brilliant young man with a bright future awaiting him. Syria’s economy had started to boom, and with it, the exploitation of the petroleum near Al-Hamada’s native Deir-ez-Zor. In just a few years, he was poised to join the class of youth who would easily find themselves within the government’s good graces, and prosper.\n\nYet Mazen was not the type to join the elites and leave his people behind. When the Turkish left and the Jasmine Revolution began, Mazen joined the protestors on the streets, demanding a free, democratic and independent Syria. He would pay the price dearly for his patriotism.\n\nThe National Guard, growing ever more anxious, employed evermore brutal intimidation tactics, trying to snuff the Revolution in its cribs. They roamed around the streets of the cities, taking protestors and forcing them to confess to false charges. If they refused, they would be shot in the foot. Most immediately caved upon being subjected to the torture.\n\nMazen refused. They shot his other foot, beat him to a pulp and broke every bone in his body. He paid with his life, but did not relent. The crowd went wild witnessing his bravery, trying to push through the barriers to save him. One of the Guardsmen fired, and blood ran down the streets. Martyrs across Aleppo, Damascus, Daraa, Suwayda, Tartus would not live to see Syria free..."
 SYR_flavour_event.1.a: "And the Guardsmen turned the delicate Jasmine into a ferocious Brown Bear."

 SYR_report_situation.1.t: "Intelligence Report"
 SYR_report_situation.1.desc: "Report on the Syrian Situation\n\nSECRET\n\nMilli İstihbarat Teşkilatı\n\nINTELLIGENCE ASSESSMENT REPORT\n\n06/10/1996\n\nSubject: THE ESCALATION OF TENSIONS IN SYRIA\n\nSecrecy: SECRET\n\nSince the redeployment of troops from the Syrian garrison to the areas of Southern and Eastern Turkey, the government of the Syrian Federation has been unable to contain the civil unrest which has risen steadily.\n\nAfter the withdrawal, the Syrian National Guard was brought in to plug the security gap, however repression by the Guard on the demonstrators has exacerbated tensions.\n\nElements of the Syrian Army, generally considered disloyal, have openly threatened to attack the Guard to protect insurrectionist elements.\n\nDespite this, the Guard's suppression of protests remains the best option to end the unrest. The threats by the Army are likely a bluff, given their acute inferiority in weapons and training compared to the Turkish Army.\n\nNo further action on our part is recommended outside of reinforcing the Syrian National Guard.\n\n"
 SYR_report_situation.1.a: "For The Homeland, At Every Moment, Everywhere."

 SYR_report_situation.2.t: "RND/LAGE/1996/SYR/47"
 SYR_report_situation.2.desc: "REICHSNACHRICHTENDIENST\nREPORT ON THE DETERIORATING SITUATION IN SYRIA\n\nAGENT(S) INVOLVED : E. SPECKMANN, S. MITTERMEIER, H. GHAFFARI\n___________________________________________________________\n\nSYRIA - UNDER THE DOMINION OF TURKEY\n\nTHE ESCALATION OF THE CIVIL UNREST IN THE SYRIAN NATIONAL STATE FOLLOWING THE WITHDRAWAL OF TURKISH TROOPS FROM THE REGION IS REACHING A TIPPING POINT. TWO DAYS AGO, A SECRET MEETING TOOK PLACE BETWEEN MEMBERS OF THE SYRIAN MILITARY STATIONED IN DAMASCUS AND LEADERS OF THE INSURRECTIONARIES AROUND THE CITY. THE CONTENTS OF THE DISCUSSION REMAIN UNKNOWN, YET CREDIBLE EVIDENCE SUGGESTS COOPERATION BETWEEN THE TWO PARTIES WILL INCREASE IN THE DAYS TO COME.\n\nTURKEY HAS SO FAR TAKEN A MUTED APPROACH, WITH THEM RELYING ON THE SYRIAN NATIONAL GUARD TO COMBAT THE UNREST. FURTHER OPERATIONS TO ESTABLISH CONCRETE INFORMATION ON THE COOPERATION BETWEEN THE ARMY AND THE INSURRECTION WILL HAVE TO BE UNDERTAKEN. MORE IN PAGE 3 TO PAGE 7. SEE APPENDIX B) ABOUT FURTHER INFORMATION REGARDING TURKISH MILITARY CAPABILITIES. DUE FOR FURTHER RESEARCH. END OF PAGE.\n\nMAY GERMANY BE IN SAFE HANDS."
 SYR_report_situation.2.a: "Understood."

