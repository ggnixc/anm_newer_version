 ###LEADER DESCRIPTIONS
 POLITICS_SALVADOR_LAUREL_DESC: "Every Filipino politician has a brother in the Senate, a cousin who’s a local Governor, and a father who was a former President. This is no different in Salvador “Doy” Laurel’s case.\n\nThe fifth son of former President Jose P. Laurel, he was only a teenager when his father became President of the Philippines Collab Government. Like his brothers, he studied law and graduated in 1960, just after his father’s death, which left the Government in Political Chaos. He was soon pressured by Japanese Officials into joining the Senate at only 31 years old to help provide stability. In the following decades, he was instrumental in reforming Phillopino Judicial Law, introducing the “Laurel Laws”.\n\nLaurel’s brothers soon began scheming against each other for political gain, each trying to outmanoeuvre the other to become their father’s successor as President. Laurel preferred staying in the Senate due to his hesitancy towards supporting his Japanese Overlords. However, when the Presidency opened up in 1994, the Japanese managed to manoeuvre Parliament into supporting Laurel over his brothers to prevent their scheming from undermining each other. Laurel begrudgingly accepted the position and has served as President since then, gathering support to try and reform the Republic into something greater."

 #Ideas
 PHI_religious_divide: "Religious Divide"
 PHI_religious_divide_desc: "Ever since our colonial history, the Philippines has been divided between Muslims in Mindanao and Catholics in the country. The divide between the two religions has caused lots of tension and conflict for several years, thus fueling inequality and discrimination against fellow Filipinos. In recent years, the previous administrations attempted to make efforts to address the issue of the country's religious divide. However, despite all of the administration's efforts, religious tensions persist in several areas of the country, particularly within Mindanao.§VIf this problem is not fixed urgently, the Muslim population might rise up against the government." 

