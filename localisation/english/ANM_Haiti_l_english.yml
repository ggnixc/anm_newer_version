### Characters ###
 ## Names ##
 HAI_Edgard_Leblanc_Fils: "Egard Leblank Flis"
 ## Descriptions ##
 POLITICS_HAITI_DESC: "Born in Miragoâne, Edgard Leblanc Fils is another inheritor of the United Front and a paragon of Haitian corporatism. As a civil engineer, his work at the Ministry of Public Works gained him prominence among the Parti Socialiste Populaire. With a technocratic background within his party, Fils was appointed president following his victory over Rene Preval of the MOP. \n\nAs president, Fils has continued the corporatist legacy of his predecessors, while maintaining an equal balance between Mexico and Washington, helping keep the Haitian Miracle. Furthering military cooperation with Cuba, Fils is generally seen as a hawk against the neighboring regime in Santo Domingo. As the new millennium dawns on Haiti, Fils will ensure its prosperity, its stability, and most of all, its security."


### Ideas ###
 HAI_Haitian_System: "The Haitian System"
 HAI_Haitian_System_desc: "Since Haiti fended off Trujillo from invading in the Blitz, the united front between the PSP and the MOP has reigned supreme within Haitian politics. Combining socialism with liberalism, Hudincourt would construct a corporatist system in Haiti, one focused equally on socioeconomic equality and economic growth.\n\nToday, that same corporatist system is responsible for the extraordinary growth of Haiti in the 70s and 80s, through Hudincourt’s corporatist system providing the perfect basis for the export-oriented development that Haiti has undergone. With aid from the Veracruz Pact and specifically Mexico and Cuba, Haiti has transformed itself into an economy that rivals its next-door neighbors, hosting many refugees and Dominican migrants as the situation in Santo Domingo gets worse and worse."
 HAI_Frontline: "The Frontline of Hispaniola"
 HAI_Frontline_desc: "Ever since Trujillo’s alignment with the reactionary powers of Europe, an iron curtain has been cast across the island of Hispaniola, with the nation of Haiti standing for the values of freedom, democracy, and liberty while the Dominican Republic has spiraled into a state of repression and authoritarian control, putting down several protests by students and liberal activists.\n\nWith the curtain interrupted at times like the Puerto Plata landing or the Dominican invasion of Haiti, the Haitian government has made it its top priority to construct an armed force capable of resisting invasion, and with Veracruz Pact aid, has become a host to one of the most heavily armed borders in the world, comparable to the Italo-German or even the Hindustani-Pakistani border. Only time will tell if this iron curtain will ever collapse, and which nation will ultimately win this cold war on Hispaniola."
