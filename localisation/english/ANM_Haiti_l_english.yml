 HAI_Jewel_Hispaniola: "The Jewel of Hispaniola"
 HAI_Jewel_Hispaniola_desc: "Haiti, the Jewel of Hispaniola, shines with immense potential. Unlike our neighbour in the east, Haiti is seen as a shining gem. One of the key factors that made Haiti shine brightly was its partnership with the United States, opening doors for trading and investments, making Haiti a potential economic powerhouse in the region.\n\nAdditionally, Haiti boasts a rich array of natural resources. From its fertile agricultural lands to mineral deposits like copper and gold, the country holds significant potential for resource extraction and development."
