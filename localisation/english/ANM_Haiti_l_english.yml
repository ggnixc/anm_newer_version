 HAI_Edgard_Leblanc_Fils: "Egard Leblank Flis"
 POLITICS_HAITI_DESC: "Born in Miragoâne, Edgard Leblanc Fils is another inheritor of the United Front and a paragon of Haitian corporatism. As a civil engineer, his work at the Ministry of Public Works gained him prominence among the Parti Socialiste Populaire. With a technocratic background within his party, Fils was appointed president following his victory over Rene Preval of the MOP. \n\nAs president, Fils has continued the corporatist legacy of his predecessors, while maintaining an equal balance between Mexico and Washington, helping keep the Haitian Miracle. Furthering military cooperation with Cuba, Fils is generally seen as a hawk against the neighboring regime in Santo Domingo. As the new millennium dawns on Haiti, Fils will ensure its prosperity, its stability, and most of all, its security."

 HAI_Jewel_Hispaniola: "The Jewel of Hispaniola"
 HAI_Jewel_Hispaniola_desc: "Haiti, the Jewel of Hispaniola, shines with immense potential. Unlike our neighbour in the east, Haiti is seen as a shining gem. One of the key factors that made Haiti shine brightly was its partnership with the United States, opening doors for trading and investments, making Haiti a potential economic powerhouse in the region.\n\nAdditionally, Haiti boasts a rich array of natural resources. From its fertile agricultural lands to mineral deposits like copper and gold, the country holds significant potential for resource extraction and development."
