l_english:
 BM_HISTORY_TITLE: "Brief History"
 THENEWORDER_NAME: "A New Millennium"
 THENEWORDER_DESC: "A NEW MILLENNIUM:\n\nFrom Times Square to Tokyo, champagne pops, confetti rains, and jubilant crowds roar, gleefully welcoming another new year as the Third Millennium approaches ever closer.\n\nDespite the internal conflicts faced by Germany and Japan -- the power struggle for who was to succeed Adolf Hitler, along with Western interference in sparking revolutions among the Co-Prosperity Sphere nations, the “New World Order” has stood the test of time. The Greater German Reich, United States and the Empire of Japan continue to command a world in the midst of a dramatic metamorphasis. The Dotcom bubble swells, and the world around it shrinks. New tech usurps the old, putting old challenges to rest and planting the seeds of those to come. As centers of manufacturing relocate from the First World to the Third, previously irrelevant nations now find themselves tempting prizes to be sought after in the next Great Game. This time around, however, the resurgent Soviet Union, China and Hindustan will not bend as easily as they did before.\n\nThe ink dries on the lastest verse of mankind’s great saga. As the pen of history delves into the well to start anew, let us all pray that the next stanza won't be the last."

 ANMBACKTEXT: "Back"
## OFN ##
 USA_THENEWORDER_DESC: "While America joined the Second World War, it was too late. The United States performed admirably, humbling the Kriegsmarine in the Atlantic and beginning to turn the tide in the Pacific, but the invention of the atom bomb ended any hopes of American victory for those few remaining Allies.\n\nNow, twenty years later, America stands divided. While the depression is slowly ending, the American political scene sits in chaos. The government remains locked between the uneasy Republican-Democrats and the National Progressive Party, a failing union of America's political outcasts. With the Civil Rights movement greatly shifting the political sphere, the 60's will herald the greatest threats America has ever faced."
 CAN_THENEWORDER_DESC: "In the wake of the fall of Britain the Canadians turned their heads to their southern neighbors for leadership and guidance, even as the Royal Family settled in Ottawa. Rising from the shadows of George Drew's conservative political machine, Lester Pearson and his Liberal Party have risen through snap elections to stand at the helm of a nation struggling to define itself. Constitutional monarchy or a free republic? British, French, Quebecois, or all of the above, or none? Is the nation forever doomed to be an appendage of US foreign policy? What can be done about the increasingly virulent separatism afflicting Quebec? In the uncertainty, one thing is certain: Canada must stand together, both within and without, or the land that stretches from sea to sea will quickly find itself becalmed by currents it cannot withstand."
 CUB_THENEWORDER_DESC: "Socialism and freedom from foreign domination. These were the values Fidel Castro fought for against the government of Fulgencio Batista- at least until he received an offer from the CIA. In exchange for covert support in overthrowing the worryingly pro-German Batista, Castro would refrain from advocating revolution or anti-Americanism in the Western Hemisphere and allow American corporate investment into Cuba. Although it angered communist hardliners, the deal allowed Castro's socialist revolutionaries to sweep into power. But as hardliners plot to expel the CIA's influence from Cuba, and as opposition builds in the States to this bastion of communism so close to American shores, who knows how long this will last?"
 ICE_THENEWORDER_DESC: "It's become something of a joke, that Iceland is as free a nation as Greenland is green.\n\nWhile ostensibly independent, the presence of the United States military is felt everywhere. Bases dot the island and nearly as many of its inhabitants live in a military base as outside of them. While at first the arrival of American troops was seen as a positive mark, a sure sign of the nation's continued freedom against German rule in Europe, this has quickly turned against the Americans. Now seeing as occupiers and with unrest growing, the US holds onto the island ever harder, fearing a soft German coup in the northern Atlantic."
 AST_THENEWORDER_DESC: "Australia- a continent, an island, and a country, located on the edge of the world. Sitting just below Japan's Co-Prosperity Sphere, it either narrowly avoided or repelled invasion in the Second World War, depending on who you ask. In the years after, Australian society, encouraged by their American allies, became more and more militarized to ward off the looming Japanese threat, even as the Sphere pulled back towards defending what it had already gained. Postwar Australian politics came to be dominated by two political blocs- the conservative coalition between the United Australia Party and Australian Country Party, and the Australian Labour Party. The two would spar on issues from Australia's military involvement to the controversial White Australia Policy, and as further conflicts flare up around the globe, who will come out on top?"
 NZL_THENEWORDER_DESC: "New Zealand is a small island nation on the periphery of the world, often forgotten among the superpower politics of Washington and Tokyo. However, for New Zealanders, superpower politics could not be closer to home. Thousands of New Zealanders fought the Japanese in the Second World War, many of them perishing in the process. After the war ended, its scars remained, with New Zealand facing demographic damage, lost trade partners, economic crisis, and an increasingly pushy America using the nation's islands as bases for its military transport to Australia. Although the conservative National Party has managed to steer the ship of state thus far, for how long will they be able to maintain their strength?"
 SAF_THENEWORDER_DESC: "A monarchy without a monarch and a nation without direction, the Union of South Africa has found itself increasingly struggling to hold back the forces of unrest waiting to tear the nation asunder.\n\nWhile the Boers have never managed to take power in the nation, their presence is felt as more and more they clamor for either representation or outright independence. Elsewhere, the Africans shout from the streets against a nation of segregation, if not in law than in practice. If its domestic issues were not enough, South Africa finds itself torn between two spheres, constantly being pressured by the Americans to join the OFN and the Germans to bow to the Reich."
 GUY_THENEWORDER_DESC: "As German panzers rolled along Downing Street, British Guiana suddenly found itself free of Imperial influence, and from the ashes of the war, the Republic of Guyana was born. Not all is fine in the Republic, however. Hers is a story told far too often throughout history; a feeble nation used and shackled down to suffer. Their own beloved President, Cheddi Jagan, was voted out and exiled by a CIA-rigged election in the 50's.\n\nGuyana's new president inspires not hope, but fear. Forbes Burnham an iron-fisted strongman, and under his leadership, the liberties of Guyanans grow weaker with each passing day. Strict racial segregation laws have been introduced, restricting the rights of Indo-Guyanans. Will Burnham continue to strike down his opponents? Or will Guyana break her chains and be freed?"
 
## UP ##
 BRT_THENEWORDER_DESC: "Brittany owes much to the hun.\n\nWhile the nation claims to be a proud member of the Unity-Pakt, in reality Brittany is the greatest thorn in the alliance's side. The largest black market in Europe, some have called Brittany the 'syndicate with a state'. Seeing the amassing of wealth and the weakening of the Pakt as its best chance to ensure domestic stability and keep itself protected, Brittany's only interest in the Pakt is how long it can use it to stave off the looming threat of Burgundy. There are those, however, scorned old friends of President Mordrel, who believe new direction is necessary on the peninsula."
 MAD_THENEWORDER_DESC: "Madagaskar is falling down.\n\nThe garrison seems to be increasingly paranoid and ever crueler in its attempts to prove itself as true children of Germany despite their blood and pasts. The Jewish, a leftover from a time when Germany hoped it could simply remove its untermensch by shipping them overseas, have increasingly begun calling the nation their 'Israel' and the insurgency has proven both bloody and nearly impossible for the garrison to contain. When these two groups are not causing trouble, the rising tides of African nationalism has also brought the natives up in arms. While this all threatens to tear the nation apart, Reichskommissar Maurice sits in his office, quietly committing treason."
 GGN_THENEWORDER_DESC: ""Germanization is at an all time high! Dissent is at an all time low! Poland is pacified, hell, it mind as well be named Southern Prussia!"\n\nThis sentence was the first in one of the many reports Hans Frank has sent to the Reichstag, as he has done dutifully for over a decade. On paper, his rule is the strongest and most impressively done in the Reich, having followed Nazi policy to a T and done so with the finesse and ability of the greatest of politicians. In reality, Poland is a collapsing mess, and in shadows and sewer tunnels, the resistance waits for the German grip to slip..."
 OST_THENEWORDER_DESC: "The crown jewel in the Nazi crown, Ostland is seen as the model colony for all German administrators to follow.\n\nGermanization in Ostland is the highest in the Reich, its industrial and rural production is reaching all time highs, and Reichskommissar Lohse has taken the first steps towards signing a permanent ceasefire with several of the largest partisan groups in the nation.\n\nOf course, as Lohse ails and the homeland falls, one must wonder what will happen to the colony that has so closely modeled itself after its master..."
 MCW_THENEWORDER_DESC: "Kasche sits on a throne of failure. Oddly enough, this has given him great success, just not in the eyes of the Reich.\n\nOnce a staunch proponent of hardline Nazism, his near death at the hands of partisans during the West Russian War has left him as a shell. Now he merely presides over Moskowien with the lightest of hands, hoping to merely prevent more bloodshed from consuming the colony and possibly reaching himself. Every report he sends to Germany, brutally honest with how little progress Germanization has had, is another step towards the firing line. But as the Reich seems to be crumbling, Kasche has already prepared for the inevitabilities. Still, one must wonder what will happen without the colony's apathetic leadership..."
 ENG_THENEWORDER_DESC: "Although American aid came to the English in the World War, it was too late, and for the first time, England was invaded by a foreign power. Her empire stripped away, and with an occupation force ensuring 'good order and civility' of the English people, England now faces its darkest hour, with no Arthur to save it. If anything can be said of the British however, it is that they are hard headed, and even now, twenty years later, whispers of rebellion spread.\n\nThe nation now sits on a tipping point, collaborate with the wicked Hun, or risk everything to stop them?"
 BRG_THENEWORDER_DESC: "Much of northern France remained under direct German occupation when the Second World War ended. Life there was cruel and oppressive, but eventually settled into something resembling normalcy. But it would not last. After his failed coup during the West Russian War, Heinrich Himmler was given northern France and Belgium as his fiefdom by Hitler, hoping it would leave him content to no longer meddle in German politics. But what was meant to be a sinecure became a staging ground. The land of the nascent SS-Ordensstaat Burgund is clay in Himmler's hands, free for him to mold as he sees fit. And with his plans growing more audacious and destructive by the day, the \"Shadow State\" will soon play host to greater and greater dangers to the Reich, Europe, and eventually the world."

 GER_THENEWORDER_DESC: "When the Greater German Reich erupted into civil war in the final weeks of 1963, its contemporaries smugly declared the premature death of Adolf Hitler’s Thousand Year Reich. Today, thirty-six years after the fact, nothing need be said to prove their predictions unquestionably wrong.\n\nFollowing the victory of Fuhrer Albert Speer Sr. in the civil war, Germany underwent a dramatic transformation, swiftly clawing itself back to the top of the European pecking order. Rather than continue the policies that nearly led to the end of Germany’s empire, the elder Speer’s softer interpretation of National Socialism filed down the Reich’s jagged edges. The practice of slavery was abolished, Hitler’s cult of personality was dismantled, and the free practice of religion was legalized -- to mention only a handful of the second Fuhrer’s reforms. Slowly but surely, foreign ambassadors that had previously refused to even look in the direction of their German counterparts began trickling into Germania on official business. The Reich’s shattered hegemony began to coalesce anew, molded not by an iron fist, but by a velvet glove.\n\nToday, in the year 2000, the Greater German Reich sits atop the Europäische Pakt -- the world’s most prosperous economic sphere. The Reichsmark has replaced the US Dollar as the most popular reserve currency. As Germany’s latest invention, the WeltNetz, spreads across the globe, the German language is on pace to usurp English as the world’s lingua franca.\n\nAgainst the odds, the Greater German Reich remains a superpower among superpowers. Whether or not the Germans will be able to maintain their position of primacy over the course of the coming century, however, is another question entirely."
 CZE_THENEWORDER_DESC: "Bohemia should have been part of the Reich by now, but not all things are meant to be.\n\nWhile the protectorate was well on its way towards integration in the 50s, the rapid deterioration of the Reich's power soon put all of these plans on hold.\n\nDespite this, Bohemia ran as normal, before oddly enough the resistance seemed to reappear. Once small cells apparently doubled and tripled in size almost overnight, and the garrison now struggles to hold the line. One can only wonder who would possibly raise so much trouble behind the shadows."
 CRN_THENEWORDER_DESC: "The brave sons of Germany watch eternal. Their charge? All of England for the security of the Fatherland. Only the finest soldiers can find posting in the Cornwall Governorate, the center of operations for the entirety of the garrison of occupied England. Having been proven right in Halder's insistence that the English would never peacefully aid in Germany's unification of Europe after their unsuccessful rebellion in the 50s, the garrison now stands on the alert at all times, prepared to do battle for the prosperity of the Pakt.\n\nWords muttered under quiet breaths speak of Germany facing its twilight, and if such a time would come, the Garrison must be ready to do whatever it must do for the homeland. The isles will be secure!"
 ANG_THENEWORDER_DESC: "The pilots of Reichskommissariat Südwestafrika rule the skies even while Africa remains locked in chaos. From the airstrips of Angola, hundreds of German bombers filter in and out en-route to bomb West Africa into the dust. From his squadron headquarters, Reichskommissar Schenck rules, treating the natives with a light hand and his duties even more lightly, many have criticized his hands off attitude and apparent disregard to actually rule the nation.\n\nTo Schenck, however, only the skies can provide him solace from the hell that he had a hand in creating, and some whisper that the Reichskommissar is not entirely loyal to the Reich, but from all reports, Schenck remains as loyal as he has ever been, a model hero of German aviation."
 MZB_THENEWORDER_DESC: "Some say that each Reichskommissariat is but a mirror of its ruler. Indeed, Ostafrika is very similar to Reichskommissar Hans Hüttig: both are dry, pitiless and utterly devoid of humanity.\nUnder the watchful eye of their Aryan masters, the inferiors toil, their blood, their tears and their deaths nothing but the perfect fuel for the Reich. Even the watchers, however, are under scrutiny: Hüttig despises incompetence and pity, and will crush anyone displaying said defects. What awaits his enemies is a lifetime of suffering, where even death is a luxury.\nIn a world of degenerates and traitors, Hans Hüttig will uphold the Aryan standard, no matter the odds, no matter the means, no matter the price."
 COG_THENEWORDER_DESC: "Covered by a lush jungle and filled with wildlife that would make all hunters weep in joy, the former Belgian Congo is the richest of all the German colonies. Under the perfect façade, however, lies a dangerous world, far more dangerous than any safari may be.\nReichskommissar Siegfried Müller spends his days hunting, neglecting the administration, and the entire colony has been turned into a private business for the many corporations, both German and foreign, lusting after Zentralafrika's resources.\nHowever, despite being a seasoned hunter, Müller might find himself prey to far larger predators: there are dangers lurking in the jungles, and sometimes, ink and paper can cause more slaughter and suffering than any set of fangs."
 CAU_THENEWORDER_DESC: "Reichskommissariat Kaukasien was originally meant to be a \"model colony\" of sorts, one where the natives would live peacefully under the Reich's watchful eye. The natives, of course, had different ideas. When the West Russian War broke out, the \"Transcaucasian Soviet\" launched a mass rebellion, besieging the capital of Tiflis and almost linking up with the Red Army. They were defeated, but it was clear that a firmer hand was needed. Enter Josias, Prince of Waldeck and Pyrmont. He was renowned for his methodical efficiency, but after being captured and tortured by Transcaucasian partisans, he also became known for his methodical extermination of rebels. The Reich doesn't bother him as long as the oil flows, but they fail to notice that his loyalties may lie elsewhere..."
 IRE_THENEWORDER_DESC: "Ireland's entry into the Second World War ensured its territorial unification, but it came at a cost.\n\nThroughout the 1950's, Ireland attached itself ever closer to the seemingly prosperous German Reich, adopting its military as a model, and its companies as sources of revenue. This close attachment has meant that Ireland went down with the sinking ship that was the German economy. While extremism on both sides of the isle rose since the crash, Éamon de Valera's successor, Seán Lemass, took the necessary steps to protect Irish democracy and independence, at the great expense of individual freedoms.\n\nMeanwhile, Ireland's northern counties, ruled by Neil Blaney, appear more unstable by the day, and its mismanagement could well prove the final nail in democracy's coffin."
 ## CPS ##
 JAP_THENEWORDER_DESC: "The sun never sets on the Japanese Empire, or at least it hasn't yet. Reigning over the single largest population of any nation on Earth, the Japanese maintain the largest military, industrial base, and navy in the world. With treaty ports in America and ownership of the Pacific, Japan has gone from a shut in nation behind the Europeans to the masters of the sea and land. All is not well, however, as the increasingly byzantine Imperial Court constantly undermines the monarchy, and the more Japan uses China's resources, the more their grip on the colonies slip."
 
 ## NEUTRAL ##
 IBR_THENEWORDER_DESC: "With Germany victorious in the Second World War, many expected Spain to rise alongside it. When Spain refused to bend to the will of Germany however tensions soon began to rise. The Germans finally demanded they bend to their demands to build the Dam of Gibraltar, which the Spanish finally relented to.\n\nThis led to chaos however as the Atlantropa plan failed, and as Germany confiscated Portugal's Africa colonies and began sabre rattling against their southern neighbors, Portugal and Spain agreed to unification to better hold off German invasion. This invasion never came however, and now the two rest uneasily with one another. As German might fades into the past, so too does this uncomfortable union..."

 ## RUSSIA ##
 SOV_THENEWORDER_DESC: "As the Soviet Union burned following its failure in the First West Russian War of 1955, its loyal Red Army and Politburo Members refused to yield to the German invaders. In the dark days after the Union's collapse, Mikhail Suslov, Marshal Zhukov, Lazar Kaganovich and Genrikh Yagoda carried on the dreams of the Union into separate entities, cast adrift by Traitors, Idealists and Fascists who wished to emulate the Horrid German ideology. \n\nDespite these setbacks, the loyal men of the Union of Soviet Socialist Republics managed to reunite the country in 1972, putting an end to Russia's Warlord Era. Taking advantage of Germany's Stagnation and its slow recovery in the oil crisis, the Union launched Operation Bagration in 1976 and liberated Muscovy by 1980, which was still healing from the Slave Revolt and the Militarists' Rebellion. Premier Mikhail Suslov's signed the Treaty of Riga which ended the Second West Russian War with the cessation of Moscowien. \n\nSome in the Communist Party however decry these gains as but a mere Pyrrhic Victory, and that Russia should never rest until every Slav in Eastern Europe is liberated from the German Yoke.."
