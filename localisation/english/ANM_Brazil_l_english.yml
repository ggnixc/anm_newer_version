 #Leader description
 POLITICS_MARIO_COVAS_DESC: "Born in Santos, Mário Covas was always a man of firm convictions and moderate ideas. A civil engineer graduated from the Polytechnic School of the University of São Paulo (POLI-USP), Covas began his political activism in his youth, standing out as vice president of the National Union of Students in 1955. During his academic journey, he had Paulo Maluf as a colleague, who decades later would become his greatest political rival. After graduating, he worked as an engineer for the city hall of Santos, but his calling for politics soon led him to legislative and executive positions. \n\nCovas began his political career in the PST, a dissident party of the PSD, but soon returned to the original party, where he built a solid trajectory. As a deputy, mayor, and governor, he consistently defended an efficient and transparent state, combining economic growth with fiscal responsibility and sustainable social policies. His tenure in São Paulo was marked by austerity, anti-corruption efforts, and administrative reforms, which earned him a reputation as a competent and honest leader. \n\nAfter what he called the catastrophic governments of Paulo Maluf and Egydio Martins, which plunged Brazil into a sea of corruption and instability, Covas and his vice president, Geraldo Alckmin, reached the presidency with the promise of rebuilding the country. His challenge is immense: restoring trust in institutions, reorganizing the economy after years of rampant corruption, and proving that a moderate, clean government guided by liberal principles can lead Brazil to progress. He has already cleaned up the PSP’s mess in São Paulo—now, if his health and the Brazilian people allow, he will try to do the same across the entire country."