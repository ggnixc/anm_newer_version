 #Leader description
POLITICS_LULA_SILVA_DESC:0"Born in 1945 in the verdant hills of Pernambuco, Luis Ignacio Lula de Silva’s childhood was marked by poverty, hardship, and struggle. Growing up, Lula witnessed firsthand the grievous inequalities that separated the haves from the have-nots in Brazilian society. Determined to fight for a fairer Brazil, Lula became involved in the labor movement from a young age, striking, petitioning, and protesting in the name of the working man.\n\nBefore long, Lula's infectious charisma and tireless spirit mobilized Brazil’s political left, capturing the hearts and minds of working-class people throughout the nation. It should come as no surprise, then, that Lula, standing at the forefront of the Brazilian labor movement, would inevitably take his activism to its next logical step by announcing his candidacy for the 1995 Brazilian general election.\n\nLula’s campaign painted a rosy picture of a rehabilitated Brazil — one which addressed income inequality, invested in education, and was rife with new opportunities for the other half. His persuasive oratory skills resonated deeply with blue-collar voters yearning for change, and after all the votes were tallied at last, candidate Lula became Brazil’s President-elect.\n\nToday, President Lula enjoys near-universal support from his base, but stark opposition from  conservative demagogues and shameless grifters remains a persistent thorn in his side. Each day, without fail, trashy tabloids and right-wing mouthpieces of all stripes relentlessly accuse his administration of doing nothing.\n\nThus far, however, President Lula has managed to navigate the minefield of political obstacles laid in his path. He has already planned a good on a number of reforms from his campaign promises, and his unwavering commitment to social justice has allowed him to maintain popular support throughout his new tenure. By all means, Luiz Inácio Lula da Silva may be able pull his country out of the darkness — but the battle for Brazil’s destiny is far from over..."