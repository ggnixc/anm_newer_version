 #NATIONAL SPIRITS
 BRA_Beacon_Democracy: "The Beacon of Latin American Democracy"
 BRA_Beacon_Democracy_desc: "Throughout the tumultuous 20th Century, The Republic of Brazil was defined by constant corruption, chaotic coups, and crippling crises. The 100 Day Crisis pushed the nation to its breaking point, and the country’s fragile democracy appeared to be dead in the water. Against all odds, however, Brazil has breezed past the finish line in the race to the top, striding into the Third Millennium as a shining model of Latin American democracy.\n\nBrazilians enjoy a number of freedoms not permitted to many of their neighbors, including the right to free speech, freedom of the press, and freedom of religion. Thanks to the “Liberal Socialist” policies of President Lula and his immediate predecessors, Brazil’s Human Development Index is Latin America’s highest, and it continues to climb higher as immigrants pour in to fuel the nation’s booming labor market." 
 BRA_Stains_Corruption: "Stains of Corruption"
 BRA_Stains_Corruption_desc: "Despite President Lula’s plans to improve Brazil, the pestilential stain of political corruption, like the biblical plagues of the Old Testament, have remained a persistent scourge on the Brazilian political system for decades.\n\nMuch has been done to put Brazil’s fragile democracy back in order, yet so much work remains to be done. Laws against hush money, kickbacks, and blackmail exist on the books, but are entirely unenforced except in the rarest of circumstances. Politicians from all major parties — and most of the minor ones, too — maintain clear ties to organized crime that one need only squint to plainly see.\n\nThe proverbial can has been kicked far enough down the road. If the Land of Brazil wishes to ascend to superpower status in the new millennium, it will first need to reckon with the viral malfeasance strangling its potential from within."
 BRA_Rising_Star: "Rising Star in Geopolitics"
 BRA_Rising_Star_desc: "Though the Republic of Brazil faces a litany of internal problems — rampant inequality, political instability, perennial economic crises — no credible analyst can deny the nation’s burgeoning influence on the world stage. The Brazilian Expeditionary Force proved a significant asset to the Allied war effort during the Second World War. During the height of the Cold War, Brazilian battalions shipped out to South Africa, West Africa, and the perilous peaks of Colombia to fight alongside its international allies.\n\nThough Brazil may not be able to hang with the heavyweights just yet, gone are the days of obscurity and international apathy. Alongside India, China, and Argentina, any discussion of the new millennium’s next major power would feel empty without a mention of South America’s largest country.\n\nBut while Brazil’s newfound prominence comes with clear benefits, the heat of the spotlight that now looms overhead has spurned an identity crisis among the Brazilian populace. White or Black — what side will Brazil choose in the world-sized game of chess it has fought like hell for a chance to finally play? Who are its friends? Who are its foes? The ultimate answer hinges on but a single factor:\n\n§GWho’s asking?"
 BRA_Populist_Republic: "The Populist Republic"
 BRA_Populist_Republic_desc: "Since the Portuguese Crown first saw to colonize Brazil the land had always been one of the elites, the landed gentry, be they a colonial aristocracy, imperial landowners or a secular positivist oligarchy, have always held the reins of power within Brazil while the population was left to languish in poverty and settle with being used for their labor. That, until the 30’s Revolution, where Getúlio Vargas would take control and install a reign of populism that has not stopped since.\n\nNot to say the people have collectively that much of a say, so much of this populism is mediated through personalism and coronelism, with politicians playing the political game and only using the populace as a tool for their success, nevertheless, populism is absolute, and there is no success in Brazilian politics without first affirming your allegiance to the “People”.\n\nWhile many critics warn of the demagoguery and the tyranny that may arise from this rampant populism and personalism, with faults in the administration of the state being already felt, only a few go against the populist wave, with the population as a whole being ready to dedicate themselves to the next great speaker that captures their hearts."
