 #NATIONAL SPIRITS
 BRA_Beacon_Democracy:0 "The Beacon of Latin American Democracy"
 BRA_Beacon_Democracy_desc:0 "Throughout the tumultuous 20th Century, The Republic of Brazil was defined by constant corruption, chaotic coups, and crippling crises. The 100 Day Crisis pushed the nation to its breaking point, and the country’s fragile democracy appeared to be dead in the water. Against all odds, however, Brazil has breezed past the finish line in the race to the top, striding into the Third Millennium as a shining model of Latin American democracy.\n\nBrazilians enjoy a number of freedoms not permitted to many of their neighbors, including the right to free speech, freedom of the press, and freedom of religion. Thanks to the “Liberal Socialist” policies of President Lula and his immediate predecessors, Brazil’s Human Development Index is Latin America’s highest, and it continues to climb higher as immigrants pour in to fuel the nation’s booming labor market." 
 BRA_Stains_Corruption:0 "Stains of Corruption"
 BRA_Stains_Corruption_desc:0 "Despite President Lula’s plans to improve Brazil, the pestilential stain of political corruption, like the biblical plagues of the Old Testament, have remained a persistent scourge on the Brazilian political system for decades.\n\nMuch has been done to put Brazil’s fragile democracy back in order, yet so much work remains to be done. Laws against hush money, kickbacks, and blackmail exist on the books, but are entirely unenforced except in the rarest of circumstances. Politicians from all major parties — and most of the minor ones, too — maintain clear ties to organized crime that one need only squint to plainly see.\n\nThe proverbial can has been kicked far enough down the road. If the Land of Brazil wishes to ascend to superpower status in the new millennium, it will first need to reckon with the viral malfeasance strangling its potential from within."
 BRA_Rising_Star:0 "Rising Star in Geopolitics"
 BRA_Rising_Star_desc:0 "Though the Republic of Brazil faces a litany of internal problems — rampant inequality, political instability, perennial economic crises — no credible analyst can deny the nation’s burgeoning influence on the world stage. The Brazilian Expeditionary Force proved a significant asset to the Allied war effort during the Second World War. During the height of the Cold War, Brazilian battalions shipped out to South Africa, West Africa, and the perilous peaks of Colombia to fight alongside its international allies.\n\nThough Brazil may not be able to hang with the heavyweights just yet, gone are the days of obscurity and international apathy. Alongside India, China, and Argentina, any discussion of the new millennium’s next major power would feel empty without a mention of South America’s largest country.\n\nBut while Brazil’s newfound prominence comes with clear benefits, the heat of the spotlight that now looms overhead has spurned an identity crisis among the Brazilian populace. White or Black — what side will Brazil choose in the world-sized game of chess it has fought like hell for a chance to finally play? Who are its friends? Who are its foes? The ultimate answer hinges on but a single factor:\n\n§GWho’s asking?"
 BRA_Populism_Debate:0 "Populism and Establishment Debate"
 BRA_Populism_Debate_desc:0 "Be they aristocrats, oligarchs, or industrial barons, Brazil has been a land of the elite ever since the Portuguese first set foot in the Americas. With the ascension of President Vargas in 1930, however, this status quo dramatically shifted. The Land of the Holy Cross deeply entrenched itself in left-wing populism — so much so that, even after Vargas’ removal, his “Populist Republic” did not perish with him...at least, not right away.\n\nThe second half of the 20th century was not kind to Brazil’s stability. But today, one junta and one oligarchy after the fall of Vargas, the light of democracy has sparked anew on Brazil’s sparkling shores.\n\nThat long-sought stability, though, remains perilously out of reach. Modern-day Brazilian politics, traumatized by decades of constantly-shifting governments, ideologies, and national narratives, takes the form of constant mud-slinging between populist and establishment elements. A politician’s connections, promises, and record hardly matter to the deeply-atomized voting public. Instead, the political tribe to which they’ve hitched their wagon — the egalitarian populists or the technocratic establishment — makes the difference between overwhelming support and bitter rejection by any given populace."

