 #Leader description
 POLITICS_MARIO_COVAS_DESC: "Born in Santos, Mário Covas was always a man of firm convictions and moderate ideas. A civil engineer graduated from the Polytechnic School of the University of São Paulo (POLI-USP), Covas began his political activism in his youth, standing out as vice president of the National Union of Students in 1955. During his academic journey, he had Paulo Maluf as a colleague, who decades later would become his greatest political rival. After graduating, he worked as an engineer for the city hall of Santos, but his calling for politics soon led him to legislative and executive positions. \n\nCovas began his political career in the PST, a dissident party of the PSD, but soon returned to the original party, where he built a solid trajectory. As a deputy, mayor, and governor, he consistently defended an efficient and transparent state, combining economic growth with fiscal responsibility and sustainable social policies. His tenure in São Paulo was marked by austerity, anti-corruption efforts, and administrative reforms, which earned him a reputation as a competent and honest leader. \n\nAfter what he called the catastrophic governments of Paulo Maluf and Egydio Martins, which plunged Brazil into a sea of corruption and instability, Covas and his vice president, Geraldo Alckmin, reached the presidency with the promise of rebuilding the country. His challenge is immense: restoring trust in institutions, reorganizing the economy after years of rampant corruption, and proving that a moderate, clean government guided by liberal principles can lead Brazil to progress. He has already cleaned up the PSP’s mess in São Paulo—now, if his health and the Brazilian people allow, he will try to do the same across the entire country."
 POLITICS_LEONEL_BRIZOLA_DESC: "Leonel de Moura Brizola, the tireless labor leader, is a unique historical figure in Brazilian politics. Born in 1922 in Rio Grande do Sul, his childhood was marked by struggle and the loss of his father, who was killed by federalist forces during the Revolution of 1923. He graduated as a civil engineer, but it was in politics that he found his true calling, joining the PTB in 1945. Over the decades, he served as a congressman, governor, and senator, always fiercely defending the labor policies of Getúlio Vargas. Even after the crises that weakened the PTB in the 1970s and 1980s, Brizola remained resilient, reorganizing the party and solidifying his position as the most prominent voice of the Brazilian left. \n\nBrizola represents the last great leader of classical laborism, but his vision extends beyond the legacy of Vargas. His political program advocates for a profound transformation of Brazil: agrarian reform, the strengthening of public education, the expansion of workers' rights, and a national-developmentalist economic model aimed at achieving independence from foreign capital. Inspired by ideals of social justice and national sovereignty, he attracts both progressive and Marxist factions within the PTB, forging a broad opposition front against the neoliberal and conservative forces that have dominated the country in recent decades. \n\nNow, in the 2000 elections, Brizola sees his last great opportunity to lead Brazil toward the future he has always envisioned: a more just, sovereign, and prosperous nation. With a discourse focused on workers and the dispossessed—especially the landless rural masses—he confronts a political elite weakened by scandals and economic crises, betting that the Brazilian people desire a break from the past and a return to the developmentalist ideal. But time does not stop, and the old caudillo must prove, once again, that his struggle is far from over."
 POLITICS_ROSEANA_SARNEY_DESC: "With the arrival of the new millennium, Roseana Sarney emerges as a reflection of the contradictions of both Brazil and her own party. Daughter of José Sarney, former president and historical figure of the UDN, Roseana grew up surrounded by politics and pursued a career as a businesswoman and administrator before fully entering the electoral scene. Her trajectory blends tradition and renewal: the heir to a political dynasty, yet a woman in a male-dominated field; a self-proclaimed moderate liberal in a historically conservative party. \n\nChosen as the UDN candidate for the 2000 elections, Roseana seeks to balance different narratives to appeal to an increasingly fragmented electorate. To younger voters and entrepreneurs, she presents herself as a modernizer, aligned with liberal economic policies and the need to revitalize the country after the scandals and crises of recent administrations. To more traditional sectors, she reaffirms her commitment to public order and Christian morality, standing against corruption, crime, and what she calls "leftist terrorist land invaders," invoking the legacy of figures such as Sandra Cavalcanti and her own father. \n\nHowever, the UDN is no longer the undisputed political force it once was. Since its last presidency, the party has seen its electoral base erode while its rivals gain ground. Divided between historical conservatives and a rising liberal wing, the party sees in Roseana an opportunity to redefine its future. If elected, she will face not only the challenge of governing a nation in transition but also the task of keeping together a UDN struggling to reinvent itself in the 21st century."
 POLITICS_SILVIO_SANTOS_DESC: "Senor Abravanel, better known as Silvio Santos, was born into a family of Sephardic Jewish immigrants in Rio de Janeiro and built a media empire from scratch. Starting as a street vendor and radio host, Silvio rose to stardom on television, becoming one of Brazil’s most prominent businessmen, or so he says. As the owner of the Silvio Santos Group, he established a vast media and retail empire, including SBT, installment plan networks, and the iconic "Baú da Felicidade". However, after decades of witnessing corrupt politicians squander the country’s wealth, Silvio decided it was time to act. \n\nThe moral bankruptcy of traditional politics, especially after the PSP-Maluf-Martins scandal, created a vacuum in the PSP party, who now, more than ever tainted by corruption, desperately needed a strong name untainted by the past. Like a miracle, Silvio Santos joined the party and the PSP quickly launched his candidacy, presenting him as the face of a reformed PSP, ready for the future. Silvio presents himself as the man who can rescue Brazil from the old political establishment, a common citizen who has never been involved in corruption and knows how to manage large businesses. "If I can run SBT, why can’t I run a country?" became the unspoken slogan of his campaign. \n\nSilvio Santos’ proposals blend populism and liberalism: lotteries and prizes to boost the economy, a "National Reporting Network", cuts to bureaucracy and public spending, and zero tolerance for corruption and organized crime. In foreign policy, he promises pragmatism: "Brazil does business with whoever pays more – except Nazis."His campaign is a media spectacle. At rallies, he throws money to the crowd, and on TV, he turns debates into entertainment. Tired of traditional politics, the people see him as a new hope. If he wins, no one knows what to expect – but Brazil will never be the same again."
 POLITICS_ENEAS_CARNEIRO_DESC: "From the picturesque views enthralled by the beauty of the Brazilian coast, to the untamed wilderness living in the Amazon Rainforest, the republic is home to an exceptional number of diverse customs, cultures and personalities. Is it so shocking, then, that Enéas Ferreira Carneiro managed to usurp the cemented dominance of the mainstream quartet of parties? \n\nBorn and raised in the westernmost state of Acre, Enéas would embark on his scholarly journey in 1958, leaving for Rio de Janeiro, where he would graduate in physics and mathematics. Growing accustomed to his orientation in the field of work, the future politician would go on to build a name for himself in the ever-growing eastern cities in Brazil, in areas such as mathematics, writing, cardiology and military service. Not long after, the physicist joined political life, being attracted by far-right ideas, chiefly in the principles of Integralism espoused by its progenitor, Plinio Salgado. Fortunately for Enéas, he would go on to inherit the party leadership after the demise of his predecessor, together with its underlying drawbacks. But the fervent anti-semite would not back down, and driven by his unshaken faith in a moral and organic society, the demagogue would appear on television day and night in hopes of gaining voters, possibly disappointed by the detriment of the PSP. \n\nSuccessful he was, and eventually the Integralist entered the Presidential Palace not with the assistance of firepower and bloodshed, but chosen by his compatriots to lead the country. A die is cast over the fate of Brazil. The consequences remain to be seen."
 POLITICS_GERALDO_ALCKMIN_DESC: "Geraldo José Rodrigues Alckmin Filho was born in 1952 in Pindamonhangaba, São Paulo, into a traditional family of physicians. He graduated in Medicine from the University of Taubaté but soon exchanged the scalpel for public service. Inspired by JK's developmental legacy, he began his political career as a city councilman and mayor before becoming a state and federal deputy. Naturally moderate and conviction-driven, Alckmin built a reputation as a serious and efficient administrator. He rose through the ranks of the PSD during the PSP’s downfall and was a key figure in Mario Covas’ victorious 1995 campaign. That same year, he became Vice President—quiet, loyal, and reliable. \n\nDuring Covas’ administration, Alckmin was instrumental in enacting administrative reforms and strengthening technocratic governance. A firm believer in responsible management, he supported the creation of regulatory agencies, public sector modernization, and public-private partnerships. Following Covas’ resignation due to health issues, Alckmin assumed the presidency in 1999, governing with the same calm and competence that had earned him political respect. He avoided controversy and ideological clashes, projecting an image of stability and pragmatism. To allies, he represents institutional continuity; to critics, he lacks charisma and boldness. Nevertheless, he emerged as the natural heir to the PSD’s centrist-reformist legacy. \n\nRunning for president in 2000, Alckmin presents himself as the rational continuation of the Covas era. His platform focuses on fiscal responsibility, expansion of technical education, partnership between private and public health sectors, and support for entrepreneurship. Unlike the populists of the PSP or the authoritarian UDN, he bets on institutional building and federal dialogue. He advocates for an “efficient and present State,” fighting privileges without dismantling social guarantees. Aware of voters’ post-scandal skepticism, he promises a government without turmoil. His greatest asset is his image as a dependable manager—and his greatest promise, a smooth, sober, and technocratic transition."

 # ASSORTED LAWS
 BRA_Lott_Act_law: "Lott Act"
 BRA_Sarneys_Labor_Laws_law: "Sarney's Labor Laws"
 BRA_Clean_Streets_Act_law: "Clean Streets Act"
 BRA_Racial_Democracy_law: "Racial Democracy"
 BRA_Plano_Maluf_law: "Plano Maluf's Legacy"
 BRA_Neglected_Land_Reform_law: "Neglected Land Reform"

 BRA_Lott_Act_law_desc: "For the past decades, Brazil has managed to stay with democracy thanks to the monumental undertaking that President Henrique Teixeira Lott went through in the early 60s. The eponymously named piece of legislation managed to do what for many was considered impossible - it depoliticized the military."
 BRA_Sarneys_Labor_Laws_law_desc: "President José Sarney’s "labor modernization" of the 1970s gutted the once-powerful Consolidação das Leis do Trabalho (CLT), stripping back worker protections in the name of "free-market efficiency." Minimum wages were slashed, employer obligations reduced, and union power deliberately undermined—all while Sarney’s oligarchic allies reaped the benefits. The reforms sparked isolated strikes and quiet fury among laborers, but with state-backed repression and a neutered labor court system, resistance was futile. Brazil’s economy grew, but at the cost of its social contract—leaving a bitter legacy of exploitation that would haunt the nation for decades."
 BRA_Clean_Streets_Act_law_desc: "The 'Clean Streets Act' is not a single law, but rather a power project—a sinister synthesis of Sandra Cavalcanti’s policies of 'urban renewal' and Paulo Maluf’s doctrine of 'security without limits.' Since the 1980s, the Brazilian state has erected invisible barriers around the elites: favelas were razed in the name of 'progress,' public transportation was restructured to enforce class segregation, and the police were given free rein to 'cleanse' the streets of 'undesirables.' Black people, the poor, Indigenous communities, LGBT individuals, and other minorities are treated as threats to be contained, not as citizens. Brazil shines for a select few—but its splendor is built on blood and exclusion."
 BRA_Racial_Democracy_law_desc: "While Europe and the U.S. practiced explicit racism, Brazil perfected a 'polite' version: it doesn't pursue bloodlines or ancestry, but merely a darker skin tone is enough to condemn someone to underemployment, humiliation, and perpetual police suspicion. The system denies its own existence - praising the 'export-quality mulatta' and 'noble Indian' as national symbols, so long as they remain far from real power. In the peripheries, Black, mixed-race, and Indigenous people face precarious jobs and institutional violence; Asians and Arabs endure glass ceilings and 'harmless' jokes. The media glorifies miscegenation only when whitened, universities maintain invisible barriers, and Congress remains pale and European. The result? 54% of the population (Black and mixed) holds just 28% of wealth, Afro features are ridiculed, and the genocide of Black youth becomes routine statistics. 'Racial democracy' is no accident - it's the most effective oppression system ever created, where the chains of the past have been replaced by awkward smiles."
 BRA_Plano_Maluf_law_desc: "Paulo Maluf’s presidency (1985–1990) left an indelible mark on Brazil—both in concrete and corruption. His Plano Maluf was a whirlwind of borrowed money and bulldozers: shantytowns were "upgraded" to cramped apartment blocks (with rents conveniently tied to half the minimum wage), highways cut through favelas, and state companies like ELETROBRAS swallowed smaller utilities. Globo-produced propaganda touted milk programs and smoking bans as proof of his "progressive" vision, while kickbacks oiled the gears of every project. The economy soared initially—5% growth in Year One!—but the foundations were rotten. The cruzado novo currency masked inflation, and the "health cooperatives" became patronage mills. Brazil sparkled with new stadiums and bridges... yet the bill would come due, with interest."
 BRA_Neglected_Land_Reform_law_desc: "Brazil’s countryside remains frozen in time—a feudal nightmare where landowning oligarchs rule with absolute power. Denied even the most basic reforms for decades, rural workers endure conditions of debt slavery, violent reprisals, and legalized exploitation as the natural order. Peasants who resist are evicted, blacklisted, or worse; independent smallholdings are systematically strangled by economic sabotage and paramilitary force. While the cities thrive under the regime’s favor, the fields run red with silent suffering, their cries ignored by a state that serves only the powerful."