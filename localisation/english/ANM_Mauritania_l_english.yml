 MAU_slavers_heaven: "Slaver's Heaven"
 MAU_slavers_heaven_desc: "While the ban on slavery is maintained by most of the “civilized” world Mauritania still considers slavery in all its forms completely legal. Everything from slave labor to concubinage is accepted, sometimes even supported by governmental and religious institutions. It is a seller's market, and demand is high.\n\nThis wretched institution and popular support of said institution has led to Mauritania gaining the nickname of “Slaver’s heaven”. In this new millennium, there is a spark of hope yet for Mauritania. Figures like Biram Dah Abeid are still advocating for the abolition of slavery to this day. Although this position has endangered his life."

