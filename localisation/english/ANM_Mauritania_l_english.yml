 POLITICS_MODIBO_KEITA_DESC: "If one was to tread through the various fiefdoms of West Africa, the state of Mauritania would be seen as rather quiet and ordinary, the people seeming less repressed than the various others. This is the nation of Modibo Keïta, a man trapped between the strength of his morals, but the danger of radical beliefs in a place as unstable as West Africa.\n\nBorn in a neighbourhood of Bamako, Keïta could claim ancestors in the founders of the Mauritania Empire, but he was never an advocate for wild expansionism. Instead, Keita found his home in Socialist Groups across French West Africa, uniting many across Mauritania in the quest for Mauritaniaan freedom and properity.\n\nHe ran into a roadblock in this noble goal with the German Victory over France. As Charles De Gaulle's forces secured what it could of West Africa, Keïta stayed in open revolt against the French, creating his own Militias and mobilising against De Gaulle's army, much to their chagrin. And then, the bombs began dropping. The French were not only pushed out of Mauritania, but pushed to the Ivory Coast, and Keita maintained what control he had... at least when they weren't afraid to step outside on a clear day for the planes dropping fire from the sky. At this point, the militias were a melting pot of everyone wishing for any kind of Mauritaniaan autonomy. Islamists, Socialists, Liberals, Fascists, everyone rubbing up against eachother. Fights constantly erupted between various members in the Mauritaniaan State to the point of farce. Keïta's constant progressive reforms to the maintenance of the state didn't help, as it simply made the more conservative militiamen angry.\n\nThen, one day, the bombs stopped, and ironically, while the chaos in the desert silenced, the chaos in the state only became more aggressive. The dissident Moussa Traoré has united the Islamist militiamen into a stable army, and has siezed the city of Kayes as his own. It seems that a battle for the future of Mauritania has begun, and Modibo Keïta is leading his armies into the future."
