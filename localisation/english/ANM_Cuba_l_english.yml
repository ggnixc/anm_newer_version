 ### Leaders ###
 
  POLITICS_FIDEL_CASTRO_DESC: "In order to halt potential German influence in Cuba, the Americans needed their own man in Havana. That man is Fidel Castro. A lawyer-turned-Marxist guerrilla who was armed and aided by the CIA in overthrowing Fulgencio Batista's military junta, he is a living testament to the adage that "politics makes for strange bedfellows." The Americans justify their behavior by claiming necessity; they could not allow a Nazi puppet state in their backyard at any cost, and who is more staunchly anti-fascist than a communist?\n\nCastro is a brave fighter but also a devoted ideologue, confident that his policies will transform Cuba into a modern, self-sufficient, and progressive workers' paradise that will serve as a beacon of hope for the world's proletariat. But despite his professed love of Marx, he is also quite cooperative towards the CIA and their interests. This seemingly hypocritical compromise has worked out fairly well for Castro: as long as he stays within Washington's orbit, they are content to let him govern the island as he pleases. That being said, he is required to provide certain economic concessions for American corporations, and other socialist figures denounce him as a traitor to the cause and an agent of Yanquí reactionaries. Castro believes that his agreement is the best way to ensure some form of proletarian government in Cuba and is the only way available to achieving a classless society, but he is left in a careful balancing act between American interests and the support of his anti-imperialist comrades."

 #IDEAS
 CUB_Rev_Hotspot_LATAM: "Revolutionary Hotspot of Latin America"
 CUB_Rev_Hotspot_LATAM_desc: "As the Darkness of Fascism and the Greediness of American Capitalism engulfs the World, Cuba stands as Last Bastion of Light, bearing the Torch of Socialism that is ready to liberate Latin America. Although Castro and the United States of America are de-facto Allies against the Fascists of the Dominican Republic and Venezuela, countering German and Iberian influence in the region, Castro nevertheless secretly works against American interests in South America, providing covert aid to the Shining Path in Peru along with assisting Aguilera's regime in Ecuador. \n\nOnly time can tell if the fragile alliance between the OFN and Cuba will last."
 
 
