 ### Leaders ###
 
 CUB_Amando_Hart_Davalos: "Vladimiro Roca"
 
 POLITICS_CUBA_DESC: "One of Fidel Castro’s most devoted disciples since the July 26th movement, Armando Hart Davalos is the natural successor to the populist democratic legacy that Castro has built in Cuba. A member of the Cuban People’s Party since being a student at the University of Havana, Davalos was part of the first opposition against Bautista, and when push came to shove, he joined the armed struggle against Bautista and became a part of the July 26th Movement, led by Fidel Castro and Che Guevara. After the revolution had triumphed, with Cuban democracy restored, Davalos would become Castro’s deputy within the party, as the PPC would emerge as the dominant party within Cuba.\n\nAfter Castro retired from politics in 1986, Davalos would take over the mantle of leadership within the PPC and the presidency of the Cuban state. Firmly committed to socialism, democracy, and anti-fascism,  Davalos will ensure that the revolutionary order throughout the Caribbean persists, even in the face of Santo Domingo and other reactionary forces throughout the region."

 #IDEAS
 CUB_Rev_Hotspot_LATAM: "Revolutionary Hotspot of Latin America"
 CUB_Rev_Hotspot_LATAM_desc: "As the Darkness of Fascism and the Greediness of American Capitalism engulfs the World, Cuba stands as Last Bastion of Light, bearing the Torch of Socialism that is ready to liberate Latin America. Although Castro and the United States of America are de-facto Allies against the Fascists of the Dominican Republic and Venezuela, countering German and Iberian influence in the region, Castro nevertheless secretly works against American interests in South America, providing covert aid to the Shining Path in Peru along with assisting Aguilera's regime in Ecuador. \n\nOnly time can tell if the fragile alliance between the OFN and Cuba will last."
 
 
