### Leaders ###
 ## Names ##
 CUB_Amando_Hart_Davalos: "Amando Hart Davalos"
 ## Descriptions ##
 POLITICS_CUBA_DESC: "One of Fidel Castro’s most devoted disciples since the July 26th movement, Armando Hart Davalos is the natural successor to the populist democratic legacy that Castro has built in Cuba. A member of the Cuban People’s Party since being a student at the University of Havana, Davalos was part of the first opposition against Bautista, and when push came to shove, he joined the armed struggle against Bautista and became a part of the July 26th Movement, led by Fidel Castro and Che Guevara. After the revolution had triumphed, with Cuban democracy restored, Davalos would become Castro’s deputy within the party, as the PPC would emerge as the dominant party within Cuba.\n\nAfter Castro retired from politics in 1986, Davalos would take over the mantle of leadership within the PPC and the presidency of the Cuban state. Firmly committed to socialism, democracy, and anti-fascism,  Davalos will ensure that the revolutionary order throughout the Caribbean persists, even in the face of Santo Domingo and other reactionary forces throughout the region."

### Ideas ###
 CUB_Revolutionary_Democratic_State: "The Revolutionary Democratic State" 
 CUB_Revolutionary_Democratic_State_desc: "Since the overthrow of Batista by the July 26th movement, Cuba has been a democratic state, with multiple political parties, organizations, and interests competing in local, regional, and national elections. However, the majority of the national elections are dominated by the PPC or Partido del Pueblo Cubano, alternatively known as the Orthodox Party.\n\nFounded by Eduardo Chibas and later led by Fidel Castro during the 1962 elections, the PPC has espoused an ideology of Gaitan-inspired socialism, Cuban nationalism, and anti-fascism, with broad internationalist tendencies. With Castro fondly remembered as Cuba’s savior and Davalos seen as Castro’s natural successor, the electoral fortunes of the party are unlikely to go anywhere, and the democratic revolution in Cuba stays put."
 CUB_Vanguard_Anti_Fascism: "Vanguard of Anti-Fascism"
 CUB_Vanguard_Anti_Fascism_desc: "Ever since the failure of the Puerto Plata landing in 1963, a specter has been haunting Latin America, the specter of fascism. Even with Brazil and America maintaining their hegemony over South America, fascist black spots throughout the hemisphere continue to exist in Dominica, in Paraguay, and most importantly in Buenos Aires, where the regional fascist powerhouse of Manuel Anchorena’s Argentinian government presides.\n\nThe people of Latin America have seen the horrors that fascism has entailed, and the Cuban government has made it their top priority to extinguish the black flame wherever it pops up. Being one of the primary contributors to defense within the Veracruz Pact, Cuba’s Foreign Legion and its armed forces have experience fighting fascist forces, and they will ensure that another Trujillo nor Anchorena props up anywhere else in the world."
 CUB_Shining_Light: "The Caribbean's Shining Light"
 CUB_Shining_Light_desc: "Throughout the Caribbean and Central America, Cuba has been the ideal state, a near-perfect state, with a vibrant democracy, flourishing economy, and comprehensive welfare system, contributing to the economic security of its entire populace.\n\nFrom the peasants who toil on their land to industrial workers in market cooperatives, to even schoolchildren, who go to school without a penny being spent by their parents, the nation of Cuba is the best example of an ideal Latin American society, the model that many nations are trying to replicate."