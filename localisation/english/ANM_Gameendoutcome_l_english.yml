 Anm_gameendoutcome_mussngugite_frey: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. Not ideological dogmatism, but the pursuit of productivity will define this new age - as envisioned by Mußgnug's second in command, Gerhard Frey. The Führer's health is declining, and sooner or later, Frey will suceed him, realizing the dream of a highly capitalist, ever-developing Germany."
 Anm_gameendoutcome_mussngugite_haider: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. A new concept of Speerite thought will define this age - one envisioned by Mußgnug's second in command, Jörg Haider. The Führer's health is declining, and sooner or later, Haider will suceed him, realizing his concept of a synthesis between Speerite thought, Western democracy and German nationalism."
 Anm_gameendoutcome_mussngugite_grund: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. Modernisation and national pride will define this new age - as envisioned by Mußgnug's second in command, Johanna Grund. The Führer's health is declining, and sooner or later, Grund will suceed him, realizing the dream of a militaristic Germany adapted to the 21th century."
 Anm_gameendoutcome_mussngugite_kaindl: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. Discipline and absolute state control will define this new age - as envisioned by Mußgnug's second in command, Gerhard Kaindl. The Führer's health is declining, and sooner or later, Kaindl will suceed him, realizing his vision of a morally perfect, utopian Germany, ensured through mass surveillance and the might of the ORPO."
 Anm_gameendoutcome_mussngugite_dehoust: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. The victory and expasion of German identity and culture will define this new age - as envisioned by Mußgnug's second in command, Peter Dehoust. The Führer's health is declining, and sooner or later, Dehoust will suceed him, realizing the dream of a expansionist, militarist Germany, ensuring its global dominance."
 Anm_gameendoutcome_mussngugite_schoenhuber: "Speerite National Socialism has solidified its reign, against both reactionary Hitlerism and democratic reformism.\nAs the Europakt and Germany continue to grow wealthier and stronger, Mußgnug's dream of a \"German Century\" is about to come true. Pride in European Unity and the victory of European civillisation will define this new age - as envisioned by Mußgnug's second in command, Franz Schönhuber. The Führer's health is declining, and sooner or later, Schönhuber will suceed him, realizing the dream of a powerful Europakt and the victory of Speerite thought."
 Anm_gameendoutcome_deckertwonlol: "National Socialism has returend to its roots. With Capitalism, cultural liberalisation, and the Europakt banished, Germany is more reminiscent of Hitler's times than the nation it was a decade ago.\nFührer Deckert will ensure the prevalence of Hitlerite thought - and if necessary, removing all those who might stand in its way. Needless to say, Germany's state as a world power has greatly declined, following its return to isolationism, and with most of the economy under the party's grasp, Germany cannot hope to remain the economic powerhouse it was at the turn of the millennium. Constant purges, economic recession and its foreign policy have led to a new conflict - the system's sustainability versus its princicples."
 Anm_gameendoutcome_kohlwonlol: "A nation, a continent, under the swastika. Having brought so much suffering, so many lives to claim, and seemingly all-powerful, National Socialism was thought to be eternal.\nNow, Germany has become so much more, risen above its past. German democracy is no longer a dream, but a reality.\nOnce more, the Black-Red-Gold flag waves once more as millions rejoice. Willy Brandt's \"other Germany\" has, after so many long decades, triumphed over totalitarianism and supremacism.\nWith Kohl's focus on European Unity, a bright future awaits for the Europakt, as the realisation of the Pan-European idea becomes possible."
 Anm_gameendoutcome_merkelwonlol: "A nation, a continent, under the swastika. Having brought so much suffering, so many lives to claim, and seemingly all-powerful, National Socialism was thought to be eternal.\nNow, Germany has become so much more, risen above its past. German democracy is no longer a dream, but a reality.\nOnce more, the Black-Red-Gold flag waves once more as millions rejoice. Willy Brandt's \"other Germany\" has, after so many long decades, triumphed over totalitarianism and supremacism."
 Anm_gameendoutcome_schroederwonlol: "A nation, a continent, under the swastika. Having brought so much suffering, so many lives to claim, and seemingly all-powerful, National Socialism was thought to be eternal.\nNow, Germany has become so much more, risen above its past. German democracy is no longer a dream, but a reality.\nOnce more, the Black-Red-Gold flag waves once more as millions rejoice. Willy Brandt's \"other Germany\" has, after so many long decades, triumphed over totalitarianism and supremacism."
 Anm_gameendoutcome_speerwonlol: "Once a mere puppet, a vessel of his father's dreaded legacy, Albert Friedrich Speer has freed himself.\nHe remains the absolute leader of Germany, but not one of Mußgnugs or his fathers liking, not a Führer in the old, National Socialist sense.\nInstead, his goal is to root out all traces left by them, to wash off the stain of Germany's past, to bring justice, and to redefine the nation as a democracy, free of the swastika's shadow. For now, his powers remain, but he does not intend to rule forever - only for as long as National Socialism still threatens Germanys democratisation process."