### Ideas ###
 MOS_anti_soviet_fanatiscism: "Anti-Soviet Fanaticism"
 MOS_anti_soviet_fanatiscism_desc: "There are only a few who know first-hand about the atrocities committed by the Soviets during the 2WRW. This wasn’t because there was only a handful to witness them, but rather because the vast majority did not make it back alive. A man who claims the Reich's treatment of its citizens is depraved has not experienced the chaos and carnage of the USSR’s troops during the 2WRW. Combined with the failure to protect the Russian People during the initial German Invasion in the early 40s, the people of Homel have turned into fierce Anti-Soviets, ready to tear down the USSR.\n\nThis sentiment has become the driving force behind Militärbezirk Homel: Never again shall the innocent suffer at the hands of these ruthless monsters, never again shall there be a communist uprising near the borders, never again shall the Russian people be subjected to the terrors of the Soviets."
 MOS_refugee_conscripts: "Refugee Conscripts"
 MOS_refugee_conscripts_desc: "During and mainly after the 2WRW, the Reich experienced a massive flock of refugees from all possible nationalities. Russians, Germans and Belarussians, just to name a few. At first, the people were sheltered, saved from the terrors of the Soviets. But when the Soviets used this opportunity to launch a full-scale rebellion within Weißruthenien, the Reich had to close its borders to prevent further saboteurs from entering and destabilising the Reichslands further. The Insurgency was crushed, and so were the hopes of safety and salvation of all fleeing the war.\n\nSince allowing the people access to the Reich was too great of a safety concern, General Horst Stechbarth devised a plan: We shall relocate all people crossing the border towards Homel, a ghost city within the former Moscowien borders. The strong shall be recruited and trained to defend the good people of the Reich against the same faith they had, while the rest could earn a living working In the local factories.\n\nThis policy was not supposed to last long, but it has continued ever since."
