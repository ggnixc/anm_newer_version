 ## Descriptions ## 
 POLITICS_HELGE_HANSEN_DESC: "Helge Hansen is a seasoned Wehrmacht general and the current leader of Bryansk, a volatile enclave of anti-communist resistance on the Soviet border, born from the ashes of Moskowien. Previously serving as Horst Stechbarth’s second-in-command during the Second West Russian War, Hansen played a critical role in defending the region before assuming leadership after Stechbarth’s retirement.\n\nUnlike his predecessor, Hansen is less ideologically driven, focusing on stability through financial pragmatism and collaboration to erase the failures of Moskowien. His leadership emphasizes efficiency and personal gain, transforming his domain from a military stronghold into a warlord state where profit often outweighs principle.\n\nHansen continued Stechbarth’s policy of arming Russian collaborators, a cost-effective solution that bolstered Bryansk’s defenses while drawing ire from Wehrmacht traditionalists. To many, his reliance on local militias echoes the failures of Moskowien, but Hansen sees it as a necessary strategy to maintain control with minimal Reich resources.\n\nDespite outwardly supporting anti-communist efforts, Hansen’s true loyalty lies with whoever ensures his continued pay. This mercenary approach has kept Bryansk intact as a fractured melting pot of ideologies, bound together by necessity and the remnants of German funding."
 POLITICS_KONSTANTIN_PETROV_DESC: "Born in Moscow, Konstantin Pavlovich Petrov became infamous as a loyal collaborator of the Reich. Petrov began his career in Kaminski’s militia, and rose through the ranks with ruthless effectiveness and unbreakable reliability, eventually leading the force during the Second West Russian War.\n\nUnder Petrov’s merciless leadership, the militia force was a battered but ragtag one. Battered and on the retreat, his troops fought alongside the 74th Panzer Division when they defended Bryansk. His skill in leading inadequately equipped collaborators had earned him a reputation as a crafty commander and survivor.\n\nPetrov’s militia became the de facto state army, with the Wehrmacht troops stationed alongside them. His fascination with the occult and the esoteric led him to ally with a certain “Dobroslav”, a self-styled “Aryan Harbinger” whose guidance influences Petrov’s actions. \n\nA leading figure in Bryansk today, Petrov combines ideological ferment with pragmatic ambitions. Publicly associated with the Reich, he works with them, but his rising authority and unorthodox ideas hint at ambitions that go beyond mere cooperation, making him both a useful asset and a threat to the fragile regime of Bryansk."
 POLITICS_DMITRIY_VASILYEV_DESC: "Dmitriy Vasilyev’s life has been marked by exile, failure, and ruthless ambition. Born in Kirov during the collapse of the Soviet Union, he grew up under the rule of the Tsar and his army, and soon fell under the influence of radical monarchist ideals. Captivated by the dream of restoring the glory of imperial Russia, Vasilyev joined the Tsar’s forces, fighting fiercely against competing warlords in an attempt to re-establish the old order. Yet, that dream was crushed when Soviet remnants surged back, retaking his homeland.\n\nForced to flee for his life, Vasilyev crossed the border into Moskowien, a defeated man in a shattered nation. There, his passion for history led him to join an academic society, where his monarchist sympathies found fertile ground. From these circles, Vasilyev founded the National Patriotic Front (NPF), a group dedicated to the restoration of Russia’s monarchy and Orthodox traditions, under German oversight.\n\nHowever, fate would intervene again—when the Second West Russian War erupted, he was forced once again to flee, this time to the city of Bryansk, where Vasilyev found more than refuge - he found opportunity. His party grew rapidly, becoming the largest collaborationist faction in the city. No longer a mere exile or an insignificant ideologue, Vasilyev became a powerful political figure, commanding respect among collaborators and fear among his rivals.\n\nNow, with Moskowien under his control, Vasilyev’s ambitions have begun to bear fruit. His vision of a reborn monarchy and the restored Orthodox Church is no longer a distant hope - it is a reality in motion. Under his leadership, the NPF shall make Russia an empire once again, one forged in loyalty to tradition, faith, and the iron will of history."
 POLITICS_ALEXEY_DOBROVOLSKY_DESC: "Alexey Dobrovolsky's story is one of deep inferiority and cold cruelty. As a teenage soldier during the West Russian War, he saw the horrors that scarred him deeper than any wound. Watching the might of the Nazis sweep the West Russian Revolutionary Front aside so easily—and watching his fellow Russians collude with the enemy—broke his pride and sense of belonging. That crushing shame grew into a dark obsession with power, strength, and the ruthless efficiency of those who had once been his enemies.\n\nHe changed his name to Gurtrum Vanger and began rallying a cadre of devout Nazis into an organization known as the Arische Bruderschaft, which swiftly seized control of Perm in the aftermath of the West Russian War.When the inevitable purge arrived after the Second Smuta and most of his followers were slaughtered, he fled into exile. He traveled deep into the forests of Moskowien, where he lived as a hermit, once more renaming himself as Dobroslav to reflect his pagan views, surrounded by the old gods and the primal essence of Russia’s long-forgotten past. Years of isolation hardened him until the fires of war once again forced him out of hiding.\n\nFleeing towards Germany, Dobrovolsky eventually found refuge in Bryansk, where he discovered fertile ground for his twisted ideology. Disillusioned orphans, radical neo-pagans, and fanatical young Nazis flocked to him, eager to embrace his vision of spiritual purity and brutal power. His cult grew rapidly, competing with the established NPF, as whispers of a darker, more primal Russia spread through the city’s underworld. Now, with Bryansk's victories extending over Moskowien, Dobrovolsky’s vision of a pure, ascendant Russia—untainted by Judeo-Bolshevism, Christianity, or weakness—has already taken root, reshaping the nation in the image of the ancient gods and blood-soaked might."
 POLITICS_KLAUS_NAUMANN_DESC: "For his decades of service to the German nation and its people, for all his victories in battle, and for the trials and tribulations he endured to rise as high as he has, what has Klaus Naumann been given? A throne of dust and ash.\n\nBorn in 1939 just as the war began, he rapidly rose through the ranks of the Wehrmacht and seemed to be destined for greatness. He acquired a reputation for efficient and deadly strategic planning. His ascent was unstoppable, and the world was his oyster.\n\nNowadays, he can only sit and bitterly laugh at what the future seems to hold for him. Instead of being the one to lead the Reich to a final victory over the Russian menace, he has become a symbol of a hollow victory, forced to rule over the frontier that was once Moskowien. Grenzland only exists to serve as a buffer region between Russia and Germany. It has no other purpose, and its administration reflects that. Less of a proper occupation zone and more of a bandit kingdom with Naumann on top, he presides over a land of fortified cities and an anarchic countryside, pockmarked by empty battlefields and mass graves. He will suffer for his failure by being trapped inside the hell of his creation."


### Ideas ###
 MOS_anti_soviet_fanatiscism: "Russia’s Bulwark of Anti-Communism"
 MOS_anti_soviet_fanatiscism_desc: "Bryansk stands as the final “hope” for those seeking liberation from Bolshevik rule, drawing in a chaotic mix of anti-communist Russian factions. This fractured refuge has become a melting pot of ideologies, where desperate dreams of a free Russia collide and intertwine.\n\nAt its heart lies the staunchly Orthodox monarchist National Patriotic Front, dedicated to the restoration of the glory of the Russian Empire and reviving the authority of the Tsar and Church. Yet, alongside them rise far darker forces—young, fervent Russian Nazis led by the enigmatic neo-pagan fanatic Dobroslav, who calls himself the “Aryan Harbinger.”\n\nIn Bryansk, these conflicting visions of Russia’s future coexist uneasily, bound together only by their shared hatred for the Judeo-Bolshevist threat."
 MOS_refugee_conscripts: "The Remnant Garrison"
 MOS_refugee_conscripts_desc: "Bryansk is an unrecognized state—a shadow anomaly on the eastern frontier. Secretly funded by the German Reich, it is led by veterans who have become mercenaries and who operate alongside opportunistic Russian collaborators. Although the city loudly proclaims its independence, its true power derives from covert German support in the form of hidden funds and secret orders, sustaining it.\n\nThese mercenary armies impose brutal discipline, ruthlessly repressing any Soviet influence and suppressing dissent that threatens the anti-communist movement. Behind the pretense of self-rule, Bryansk is only a shadow state—a grim union of occupation and opportunism that hangs on desperately to its fragile resistance against the inevitable communist wave."
 MOS_Meatgrinders_Sweatshops: "Meatgrinders and Sweatshops"
 MOS_Meatgrinders_Sweatshops_desc: "Have you ever seen hell?  For most people who aren’t the infantrymen of the Legion, Bryansk is both a prison and a personal hell. Following the final measure taken by General Stechbarth, father of this hell-those who couldn’t fight were set up to work entirely for the Reich’s eastern ambitions. From day to night, those too weak or too young to fight labor away within Ausbeuterbetriebe to make the war materiel necessary to keep the rotten heart of Bryansk beating.\n\nThe very masters that the civilians work every day for are far from noble warriors. Militiamen at best-bandits at worst, maintain the state of Bryansk for Germany itself, acting on both personal greed, whether that be for cash, goods, or delicacies, and a supposed “righteous belief”, that being mostly anti-communism. Their job, the hell they endure, and the ideas they hold to keep the Soviet Army and her Partisans locked in an endless war within Bryansk, the only region in the Reich where the Second West Russian War never ended"
 MOS_Harbringers_of_Rod: "The Harbingers of Rod"
 MOS_Harbringers_of_Rod_desc: "The great cathedrals lie empty, their gilded icons broken, their sanctuaries left to the dust. Where once the faithful gathered in worship, there is now silence. In their place, a new faith is emerging—one not of Christ’s mercy, but of iron will and ancient fire. Shiropayev and Dobrovolsky do not want to restore the past, but to rewrite it,  to create a Russia unbound by cross or conscience, a land cleansed by blood and belief.\n\nThe cults of the old Slavs are twisted into a gruesome pantomime, their traditions molded into the service of the Reich and its unrelenting vision. Pagan altars stand where churches used to be, the symbols of foreign gods burned in ritualistic defiance. No place for weakness, no room for the universal brotherhood—just the raw strength of those willing to claim it. Russia will bow its knee no more, neither to Judeo-Bolshevism, nor to Christianity, but only before the brutal, unrelenting truth of its new masters."
 MOS_Anarchy_to_Anarchy: "From Anarchy to Anarchy"
 MOS_Anarchy_to_Anarchy_desc: "When the Wehrmacht swept through Western Russia, conquering Moscow and St. Petersburg once again, the men in Germania rejoiced, for they believed that this would restore order to the “anarchy” of the Soviet Union, that Moskowien would once again become an integral part of the dominion of the Reich. The ascension of Dobroslav to the halls of power has shattered their hope.\n\nThe swastika may be hanging over the Kremlin once more, but beneath it lies only misery and rot. Dobroslav’s ascension to the leadership of the new regime has not heralded stability but instead only deepened the anarchy ravaging the territory now under his control. His regime, intoxicated by its own beliefs, blind to the suffering of the people it claimed dominion over, is paradoxically the greatest threat to the continuity of German rule.\n\nThe dream of Moskowien as a jewel in Germania’s crown has become a nightmare of anarchy and ruin, the sweet taste of victory turning to ash in their mouths."
 MOS_Liberation_of_Russia_Rod: "The “Liberation” of Russia"
 MOS_Liberation_of_Russia_Rod_desc: "Although Russia is hailed as liberated from communism by Germany, the taste of freedom is sourly bitter. The economy of the newborn state is dominated by German corporations that suck dry vital resources in order to fuel the Reich’s ambitions. In a calculated move to weaken Russian unity, Volga Germans, Norwegian settlers, and Cossacks have been granted far-reaching autonomy, deliberately fracturing central authority and eroding national cohesion.\n\nIn this new order, the illusion of liberation is nothing but a facade. While the people celebrate nominal freedom, true power remains firmly in German hands, binding Russia into an unrelenting cycle of economic and political dependence."
 MOS_Liberation_of_Russia_God: "The “Liberation” of Russia"
 MOS_Liberation_of_Russia_God_desc: "Although Russia is hailed as liberated from communism by Germany, the taste of freedom is sourly bitter. The economy of the newborn state is dominated by German corporations that suck dry vital resources in order to fuel the Reich’s ambitions. In a calculated move to weaken Russian unity, Volga Germans, Norwegian settlers, and Cossacks have been granted far-reaching autonomy, deliberately fracturing central authority and eroding national cohesion.\n\nIn this new order, the illusion of liberation is nothing but a facade. While the people celebrate nominal freedom, true power remains firmly in German hands, binding Russia into an unrelenting cycle of economic and political dependence."
 MOS_Orthodoxy_Autocracy: "Orthodoxy, Autocracy, and Nationality"
 MOS_Orthodoxy_Autocracy_desc: "For too long, Russia was led astray, forced into godlessness under the yoke of Judeo-Bolshevism. But no more. The Russian Orthodox Church and the Monarch have done their divinely appointed work and returned Russia to the light—by faith and force. Christ’s love is not a choice; it is a demand, and those who resist shall be broken. The people will once more kneel before God and their ruler once more, their prayers echoing beneath the watchful eyes of the new rulers of this land, their souls tied in service to His divine will.\n\nThey now stand as the supreme authority, its word law, its power absolute.  To differ is heresy, to disagree is blasphemy, and neither will be tolerated. With an iron fist wrapped in velvet scripture, the righteous shall rule, purging the unclean, crushing the impious, and building a Russia where only the faithful can prosper. This is not just governance—it is salvation, and it will be enforced as ruthlessly as God commands."
 MOS_Mikhail_II: "Mikhail II"
 MOS_Mikhail_II_desc: "Franz Wilhelm von Preußen, great-grandson of Kaiser Wilhelm II never imagined he would sit on a throne, let alone as the Emperor and Autocrat of All Russia, but history’s unpredictable currents have made it so. Chosen under the auspices of the Reich, he is meant to be a stabilizing figure - one who upholds Germania’s interests and keeps the Russian collaborators in check.\n\nIn the eyes of the NPF, he is the face of Orthodox restoration, legitimizing their rule and transforming the new Empire from an occupation into a supposed rightful heir to Russia’s legacy.\n\nYet beneath the carefully crafted image of a devout monarch, the Emperor's true role is far more practical. His frequent meetings with NSDAP officials and German corporate executives reveal where his true loyalty lies. Rather than a sovereign ruler, he is nothing more than a guardian of German supremacy, securing the Eastern frontier for the New European Order from the maelstrom of “Judeo-Bolshevik degeneracy” to the East, as Russia’s future is decided in boardrooms far from Moscow."
 MOS_New_Frontier: "The New Frontier"
 MOS_New_Frontier_desc: "As the Third West Russian war ground to a stalemate and the military administration was imposed, the borderlands descended into chaos. Deep in former Russian land, the military struggles to impose order amid rampant banditry, partisan warfare, and endless logistical setbacks.\n\nEven the Wehrmacht, which has been charged with keeping things in order, finds itself stretched to the breaking point as its soldiers become little more than reluctant wardens of an ungovernable land. Local populations suffer under a dual yoke of unchecked criminality and oppressive military oversight—an illusion of order maintained only through sheer force, as hope and stability slip further away each day."
 MOS_Bandit_Administration: "Bandit Administration"
 MOS_Bandit_Administration_desc: "The Grenzland-Militärverwaltung exists in name only. What should be a disciplined military occupation has turned into a haven for soldiers of fortune and outright banditry. Wehrmacht troops, tasked with enforcing order, have instead embraced marauding lifestyles, spending more time plundering local resources than administering the territory. Civilians are routinely robbed at gunpoint as these renegade soldiers strip the region of its meager wealth, all under the pretext of wartime necessity.\n\nEvery available resource is being funneled straight into the Reich’s war machine, while local populations suffer under their relentless pillaging. In this lawless frontier, the military has become less an organized force and more a loosely bound gang of brutal enforcers, armed with the Reich’s finest weaponry."

###Events###
 MOS_flavour_event.1.t: "A Hollow Victory"
 MOS_flavour_event.1.desc: "The bitter wind of Bryansk swept through the empty square as the final German convoy prepared to leave. Commander Hansen stood tall among his men, his uniform pristine, but the weight of defeat, hidden beneath polished medals, was written across their faces. The introduction of the Euromark had marked more than just economic reform; it had signaled a tightening of the Reich’s belt. The budget cuts hit hard, and Hansen’s orders were clear—withdraw from Bryansk.\n\nStanding before him was Petrov, a collaborator who had fought his way back to the top under German oversight. Now, Hansen was to hand over the reins, trusting him with the city’s fragile stability.\n     “You understand the terms,” Hansen said coldly, his eyes sharp beneath the brim of his cap. “Bryansk is yours now. You’ll have limited aid—no more German boots to keep the peace. This city stands—or falls—on your shoulders.”\n     Petrov nodded, swallowing the dryness in his throat. “And if the Partisans resurface?” His voice lacked conviction, carrying the weight of a man who knew the thin ice beneath him.\n     “Then you’ll handle it.” Hansen stepped closer, his voice lowering. “Or you’ll face the consequences—alone.”\n\nThe soldiers packed up their final supplies in silence. Hansen gave one last nod to his men before turning back to Petrov with a final, cold warning. “We’re leaving, but our eyes aren’t blind. Don't forget who granted you this power—and how quickly it could be removed from you.”\n     The engines roared to life,  shattering the tense silence. As the convoy disappeared over a distant hill, Petrov was left standing alone under German withdrawal. The city was his now—a hollow victory built on fear, dwindling support, and the mounting realization that with no German protection, the ground under him was crumbling."
 MOS_flavour_event.1.a: "“Bryansk is yours now—make sure it stays that way.”"
 MOS_flavour_event.2.t: "Echoes of the Past"
 MOS_flavour_event.2.desc: "The heavy wooden doors of the old cathedral creaked shut behind them, muting the winter winds that clawed at Bryansk’s crumbling walls. Vasilyev, draped in the somber black of the clergy, sat at the head of the long table like a judge over penance. His supporters—aristocrats, loyalists, and men of fading influence—sat in tight silence, their faces lined with fear, doubt, and exhaustion.\n     Petrov hung back at the far end, a shadow of authority observing rather than participating. His posture was relaxed, but his cold, unreadable gaze betrayed the power that clung to him since Hansen left. The meeting wasn’t his, but everyone knew who held the true power now.\n     “Brothers,” Vasilyev began, his voice carrying a fragile weight. “Our position grows weaker with each passing day. Hansen’s final orders leave us exposed. Without the Reich’s hand guiding us, we are forced to weather the storm alone.”\n\nThere was a murmur of discontent, cut short by Rostislav Polchaninov—a nobleman draped in old-world arrogance. “It’s not only the absence of the Germans we have to fear. The paganists grow bolder by the day—Nazis turned even more radical, heretics defiling both faith and order.”\n     Vasilyev’s jaw tightened. “We are the last stronghold of tradition and faith. We must hold strong—”\n     “Strong?” Polchaninov snapped. “What strength is left when our enemies gather like vultures, and those who should lead sit silently at the end of the table?”\n     All eyes shifted to Petrov. For an instant, the room was thick with expectation—then Petrov slowly got up, the chair scraping against the cold stone floor.\n\n“This meeting is over,” Petrov said flatly, voice like frost on steel. “Pray if you wish. It won’t stop what’s coming.”\n     He turned without a word, the sound of his steps filling the silence. The clergy and nobles remained seated, suffocating under the weight of realization—their destiny was no longer at the mercy of sermons or lines of nobility but in the hands of a man who had no need for faith or legacy."
 MOS_flavour_event.2.a: "“Pray if you wish. It won’t stop what’s coming.”"
 MOS_flavour_event.3.t: "Whispers in the Darkness"
 MOS_flavour_event.3.desc: "The militia encampment on the outskirts of the city was little more than a collection of ruined buildings and improvised barricades, guarded by young men in ragged uniforms. They stood at attention as Petrov and Barkashov arrived, the tension between them heavy. The word had already spread—punishment was coming for the assault on the clergyman and the desecration of his church. The men responsible were dragged forward, their expressions flickering between defiance and fear.\n     Petrov’s voice was calm but heavy with finality. “You shame this city with your chaos. You shame our cause with your stupidity.”\n\nBefore the punishment could be carried out, a figure emerged from the gathered militia. A gaunt man, his features sharp, his presence magnetic. He stepped forward with unnatural confidence, a smirk tugging at his lips.\n     “I ordered them to do it,” he declared, his voice carrying through the night air. “The old gods demand their place. The weak must obey.”\n     Barkashov bristled, his fists clenched. “And who do you think you are?”\n     The man’s smirk widened. “Their guide. Their Aryan magi. They listen because I speak the truth.”\n     Petrov glared at him for a long moment, something unreadable flickering behind his eyes. “Then tell me your name,” he said at last.\n     The man bowed slightly, mockingly. “Dobrovolsky. Alexey Dobrovolsky”\n\nThe name hung in the air like a challenge. Petrov took a slow breath, then gestured toward his truck. “Come with me. We have much to discuss.”\n     Barkashov gave Petrov a wary look but said nothing. The punishment could wait—something far more dangerous had just walked into their midst."
 MOS_flavour_event.3.a: "“A new voice enters the fray…”"
 MOS_flavour_event.4.t: "The Pawns of Power"
 MOS_flavour_event.4.desc: "The conference room was dimly lit, the air heavy with cigarette smoke. At the head of the table sat Speer Jr., listening intently as Hans-Georg Wieck laid out the key figures who would shape the future of Russland. A dossier lay open before him, every page detailing a different name, a different player in the unfolding game of power.\n\n“Petrov remains our strongest asset,” Wieck began, adjusting his glasses. “But there’s a problem. He has taken an interest in a certain spiritual figure—a man who refers to himself as ‘The Aryan Harbinger’. His influence is growing, though to what end, we do not yet know.”\n     Speer Jr. flipped through the pages, his fingers pausing over Vasilyev and his deputy, Mikhail Nazarov. “And the Anti-Bolshevik Committee?” he asked.\n    “Firmly in Vasilyev’s hands, for now. Nazarov is more radical, however. His rhetoric is... concerning.”\n     “Polchaninov?” Speer Jr. leaned back, lacing his fingers.\n     Wieck nodded. “The White Russian Scout has been effective in rallying support, but he's an idealist. He'll only serve us if he thinks it benefits his cause first.”\n     “And what about our economic situation?” Speer Jr. tapped the last page.\n     “Herman Gref is competent, but his Volga-German heritage makes him an outsider. And then there's Barkashov...” Wieck sighed. “A thug. Useful, but dangerous. He commands the militia with an iron fist and harbors deeply nationalist views.”\n\nSpeer Jr. closed the file, exhaling slowly. The pieces were falling into place, but whether they would form a stable foundation or a house of cards only time would tell."
 MOS_flavour_event.4.a: "“A fragile balance…”"
 MOS_flavour_event.5.t: "Forging the Blade"
 MOS_flavour_event.5.desc: "The fields outside Bryansk rang with the sound of barking orders and heavy boots pounding the frozen earth. A sea of disparate militias stood before the gathering storm—Nazi pagans, White Russian monarchists, Orthodox ultranationalists, and desperate anti-communist volunteers. Each had fought separate wars under one banner or another, but were now being united into one cutting blade.\n     Petrov stood at the edge of the parade ground, a cold, unreadable mask carved onto his face. His gaze swept across the assembled men—ragged and undisciplined, yet burning with enthusiasm. They would need more than fire; they needed iron and control.\n     Barkashov, his voice sharp as a whip, cut through the cold air as he drilled the men into line. Conings, the German advisor, watched with cold professionalism, occasionally stepping in to adjust formations and offer curt, calculated advice. Efficiency was his creed, and every movement had to serve a purpose—no motion unaccounted for, no room for weakness.\n\nAt Petrov’s side, Dobrovolsky leaned in, his voice low and intense. “You think they’re ready for what's to come?” His eyes didn’t leave the struggling formations.\n     Petrov did not respond right away, his eyes narrowing at a militiaman fumbling with his rifle. “They’ll be ready when they have no other choice.”\n     Dobrovolsky gave a bitter chuckle, arms crossed. “That’s what I thought back in Russia. Men only become soldiers when they’ve seen what dying for nothing looks like. Until then, they’ll keep marching like sheep.”\n     “And you’ll make sure they don’t die for nothing,” Petrov said flatly, not as a question, but as an order. The two shared a brief, understanding silence.\n     Across the field, Barkashov’s voice roared again: “If you can't hold a rifle, you’ll be digging graves for those who can!”\n\nThe training ground seemed endless, each moment carved out with sweat and fear. But in that fear, something else began to stir—discipline, unity, and the making of an army united by something far more potent than ideology: survival."
 MOS_flavour_event.5.a: "“They will be ready—or they will be buried.”"
 MOS_flavour_event.6.t: "Fractured Loyalties"
 MOS_flavour_event.6.desc: "The air in the council chamber was thick with smoke and ambition. Nazarov presided over the meeting like a statue, unmoving and unblinking, as the future of the nation unraveled before him.\n     Alexey Shiropayev, always the firebrand, slammed his fist on the polished table. “This nation will never survive if we keep clinging to outdated ideals! We need to embrace the future — purge weakness, destroy the remnants of Bolshevism completely!”\n     Across from him, Konstantin Smirnov-Ostashvili leaned forward, his face carved from stone. “And replace it with what? A hollow imitation of German brutality? Russia’s soul lies in tradition and monarchy. You would have it crushed beneath foreign boots for the sake of your fanaticism.”\n     Ilya Lazarenko, Shiropayev’s mirror image in both belief and fury, joined the fray. “Tradition is weakness. You speak of the Tsar as if he were a god — he was nothing but a relic. If we follow your path, we’ll be nothing more than a museum piece for Germania to gawk at.”\n\nThe tension cracked through the room like ice breaking under weight. Nazarov remained silent, observing every slight movement with a predator’s patience. Then, the door creaked open.\n     Gerold Braunmühl, the Reich’s diplomat, stepped in with the cool ease of a man who owned the room without ever needing to raise his voice. “Gentlemen, this is not the time for conflict.” His words cut through the chaos. “Your concerns are noted — and they will be addressed. The Reich understands your… frustrations. You will have answers soon.”\n\nSilence settled, but not peace. The fractures remained — deep, growing, and far from healing."
 MOS_flavour_event.6.a: "“The Reich will ease our burdens soon… or so they say.”"