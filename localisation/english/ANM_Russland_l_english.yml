 ## Descriptions ## 
 POLITICS_HORST_STECHBARTH_DESC: "If you want loyalty, call up Horst Stechbarth. If you want experience, call up Horst Stechbarth. If you want tenacity, call up Horst Stechbarth.\n\nStechbarth was born into a farming family and drafted into the Wehrmacht at the height of the Second World War to fight the Soviet Union. After the War, he completed his advanced training and began serving as a Tank Commander. He fought against the Soviets again during the West Russia War, serving in the Defence of Moscow, and was promoted again after the war's conclusion. Despite his age, he fought the USSR once more during the 2WRW as a Lieutenant General of the 74th Panzer Division.\n\nHe oversaw the retreat to Homel near the end of the War with his 74th and several other divisions. In Homel, he led an unauthorised yet successful defence of the city against the Red Army with the Wehrmacht Divisions under his leadership. Instead of Punishment, he was met with Praise and Admiration for his actions at Homel. Speer Jr. made him the Generalfeldmarschall of the newly established Militärbezirk Homel and was ordered to lead the Slavic Anti-Communist Resistance against the USSR should War break out once more, and Stechbarth is determined to prepare Homel for the inevitable. For its Destiny."
