CFS_a_hard_fought_victory: "A Hard-Fought Victory"
CFS_a_hard_fought_victory_desc: "We did it!\n\nThe road was rough and painful, but we finally defeated our foes. After all this time the Front is victorious and Mabaya is on his way to Kinshasa to take his rightful place in the presidential palace.\n\nWho knows, maybe a bright future awaits Congo for the first time in the country’s long history."
# EVENTS
congo_war_event.1.t: "The Presidential Address"
congo_war_event.1.desc: "Jean-Philibert Mabaya stood on the creaky, makeshift podium. He looked down on the people who had gathered around. He hid his dismay, noticing how few were present. The speech should have been put in an urban background, but the city he currently inhabited was not exactly in pristine condition, so he chose a spot in the jungle, far from the fighting. It was not exactly a grand location, but it might be something useful to broadcast after the war. Something to boost morale, which was sorely needed. \n\nThe heat was unbearable, but he tried his best to maintain composure. The camera crew had set up, and Field Marshall Nadine stood nearby to ensure nothing went awry. He straightened his tie, the sweat dripping down his face and spoke: \n\n"People of the Democratic Republic of Congo," he said, a few disinterested eyes looking at him, "We live in a time of crises! We need to unite against our foes..." \n\nNo one was listening. No one was watching. The men and women standing by him began wandering off into the city. Field Marshall Nadine climbed the podium, lighting a cigarette as he went. \n\n"These are the people who voted for me, Nadine. Why do they not care?" said Mabaya. \n\nNadine smiled at him, and offered him a cigarette, when waved off, the Field Marshal chuckled and said, "You should start smoking, the stress of this job is either going to take your head or your lungs, your choice." \n\n"You are avoiding my question." \n\n"I avoid a lot of things. Four months ago I was a Sergeant, it was my job to do as little as possible. Then that bastard Karabebe made me stand up for something.You were voted in to bring reforms, not to lead a nation through its worst period since Muller. I guess we can't shirk our duties anymore.`` \n\n"Nadine, I am not shirking my duties, I am taking them very seriously." \n\nThe Field Marshal's teeth flashed white once again, "Then get some bloody spirit man! You can do this. You are a leader of men, you are going to be a fucking hero if you pull this off. These people need the man they voted for to be a pillar on a hill. You and I don't agree on everything, but if you are going to lead us through this crisis, you need charisma, machismo, at the very least try to get more than four people to watch you when you make a speech." \n\n"I am not cut out fo-" \n\n"Of course you aren't but then who is! You weren't expecting this, and you shouldn't beat yourself up about it. Look, you failed today. But one of these days you will need to inspire the people, and you won’t be able to do it by looking nervous and doing it in the middle of the jungle. You need to lead your people, and you need to do it quickly. If you do, we might just win this war." \n\nThe President gave him a pained smile, "Yes, Field Marshall. We just might.""
