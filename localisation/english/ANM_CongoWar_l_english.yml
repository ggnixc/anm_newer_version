# FOCUS TREE
CFS_presidential_adress: "Presidential Address"
CFS_presidential_adress_desc: "The chaos of the war has subsided a little. When the onslaught of the People's Republic had nearly reached the gates of Kisangani, we were exhausted. Only Field Marshal Nadine's intervention. The President has now organized a rally in the city, although his aides have requested that he hold it in the northern outskirts to ensure the war does not reach him. \n\nWith the soldiers demoralized in the south, and the prospect of total collapse looming, we need a strong leader in these desperate times."
CFS_hopes_bastion: "Hopes Bastion"
CFS_hopes_bastion_desc: "With the despotic militarists holding the west, mad Mobutuites desperately trying to keep control over the south and the communists holding the east of our once unified and strong country, it is up to Mabaya and his Congolese Democratic Front to bring back democracy. We endured a century of hardships and front will be the bastion of hope in the north for any and all that want to believe and fight for democracy."
CFS_challengers_of_democracy: "Challengers of Democracy"
CFS_challengers_of_democracy_desc: "While Kabarebe and his military goons are in the best position to contest our leadership of the Congo, the great Lake Libre is separating our borders. \n\nThe general staff has drafted a proposal that awaits Mabaya’s and Field Marshal Nadine's approval. The Front is to either focus on crushing the mad Mobutuites in the south, the communists to the east, or maintain our sites firmly on the false republic."
CFS_relief_to_the_starving: "Relief to the Starving"
CFS_relief_to_the_starving_desc: "With the CDF being able to only control the north eastern parts of Congo a major problem arised, hunger. North eastern Congo is predominantly made up of jungles with Kisangani being the largest city in the region. The already poor logistics and food reserves of the city had led us to a be on the brink of a famine. \n\nThe governing body of the Front now stands at an impasse, either they can appeal to a foregin bank asking for money to feed their people or stretch their budget to its absolute limits in hopes that it will grant them enough money to postpone the famine."
CFS_african_arms: "African Arms"
CFS_african_arms_desc: "My African Arms are tired, give me loc, father"
CFS_rely_on_our_brothers: "Rely on our Brothers"
CFS_rely_on_our_brothers_desc: "No"
