CFS_take_out_loans: "Take out Loans"
CFS_take_out_loans_desc: ""
CFS_put_prisoners_to_work: "Put Prisoners to Work"
CFS_put_prisoners_to_work_desc: "With the war ravaging our country and it’s end is nowhere near we are forced to take drastic measures to ensure that our infrastructure is still intact and operational.\n\n President Mabaya’s newest piece of temporary legislation will allow the use of all captured POWs to be put to work for the benefit of all. While some see this newest law a bit too radical Mabaya ensures everybody that the POWs will be handled with dignity, respect and that no prisoner will be forced to work until he collapses from exhaustion."
