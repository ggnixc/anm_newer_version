congo_war_event.4.t: "Terrifying Prospect"
congo_war_event.4.desc: "Mabaya sat alone in his office. The small desk fan was working at full power but it was of little help, the jungle heat and the stress that Mabaya was going through made him constantly sweat. The heat didn’t help with the food problem, the overseer of the Kisangani food reserves had sent his report. He picked up the small brown dossier that he had avoided the entire day, and opened it. Jean slowly exhaled looking at the numbers that clearly showed how in a handful of months the reserves would be empty. If nothing was done, a famine would be unavoidable. He sat back in his chair dropping the papers on the table with his right hand and picked up a phone with his left. \n\n"Get Mister Muadiamvita in my office, tell him it's of great importance.” \n\nSoon after Noel Muadiamvita, his economy minister entered the claustrophobic office. \n\n“Take a look at these and tell me the analyst made a miscalculation." \n\nNoel glanced at the papers, his expression quickly turned from normal to sour as he placed the reports back at the president’s table. \n\n“Sir, I can’t.”, said the economic minister of the Front, “I’m not going to sugarcoat this sir, the situation is beyond dire, the jungle, nonexistent logistical support and the civil war has already stretched most of our already small budget to its limits, but there are two options on how to at the very least postpone this tragedy.” \n\n“Tell me.”, said Mabaya, desperate to help the people who had chosen him as President. \n\n“We can maybe cut the infrastructure budget and divert some of the designated military rations to the civilian sector, it will make traversing the jungle a nightmare and our soldiers will be demoralized for it. This solution will make the war hell, but we could certainly prevent a famine.” \n\n“Or we can appeal to the Royal Bank of Uganda, I have contacts there so the rip off will probably be smaller but the funds would still only help us if the war ends by the end of the year. The other one is the South African Reserve Bank, they can grant us a sizable sum of money but seeing our current situation the interest rates would be sky high.” \n\nMabaya put his fist to his mouth, weighing the options in his head. He almost resembled a statue. He answered,"
congo_war_event.4.a: ""Contact both banks, see what they are offering""
congo_war_event.4.b: "“Cut the army’s budget”"
