congo_debt_event.1.t: "Mabaya's Gamble"
congo_debt_event.1.desc: "A couple of days had passed since their last exchange about the food situation. After Mabaya accepted the loan proposal Noel Muadiamvita had contacted both the Ugandan Royal Bank and the South African Reserve Bank. \n\nJean-Philibert Mabaya was looking through the office room window when he heard a knock on the door.\n\n“Come in.”\n\nThe Front’s economy minister entered and placed two dossiers on the table.\n\n“Both banks made us an offer, which one do you want to hear first?”, he said while looking at the president.\n\n“Tell me what the Ugandans have to offer.”, the President answered.\n\n“I have spoken with my contacts in the Royal Bank of Uganda and they are able to grant us a loan of 100 million. The interest rate is relatively acceptable, with the total sum coming up to double what we loaned. Since they are doing this for during the civil war aswell, we are not expected to pay until we have won the war.”,\n\n“That is not a bad proposal, we would be able to repay them and 100 million dollars can buy us some time. Now tell me about the South African proposal.” Mabaya leaned back in the chair.\n\n“It took me some time to speak with anybody of note in the SARB due to our current situation but I managed to get a deal. The South Africans will offer us 200 million dollars, with us paying them 350 million.”\n\nMabaya was silent for a moment, then he got out of his chair and poured himself and Noel a glass of water.\n\n“350 million? That's basically a robbery! The payments on?”, he asked Noel.\n\n“Yes, payments for both offers will start after the war. The other advantage is that the 200 million will ensure that a famine will not hit us for the duration of the war.”\n\n“Very well, then tell…"
congo_debt_event.1.a: "...the Ugandans that they have a deal.""
congo_debt_event.1.b: "...the South Africans that we accept""
