### Ideas ### 
 FRA_rrn_infighting: "RRN Unity: Broken"
 FRA_rrn_infighting_desc: "Since it has risen to power, the RRN, or Rassemblement pour la Révolution Nationale, has been anything but united. President Jean-Jacques Susini has been ruling the nation with an iron fist since his ascension, wishing to foster cooperation between France and the Reich, to demonstrate that the French nation is worthy of being Germany's ally. Unbeknownst to him, party members have begun to openly attack one another, calling each other “traitors to the nation” and “Bolshevik agents that deserve to be hanged”. Ranging from national syndicalists, stratocrats, and even technocrats, it is safe to say that the RRN has greatly suffered from their apparent incompetence to remain a united front against Bolshevism. To the victor shall go the spoils."
 FRA_memory_of_burgundy: "Memories of Bourgogne"
 FRA_memory_of_burgundy_desc: "The Maréchal's biggest failure undoubtedly was the loss of Eastern France. Although he realized that Alsace was a lost cause, as it was already integrated into the Reich, he hoped that, with enough time, he could persuade the Führer to cede back the French lands. But as many citizens have realized, this was but a distant dream. What emerged from those territories was the nightmarish regime known as the Ordenstaat Burgund. An abomination that thrived on the suffering of others, killing citizens as they saw fit, regardless if they had political connections or were of Jewish decent. Not even the most fanatic supporters of the Nazi party could excuse the meaningless and horrific crimes that the French, Walloons and Flemish were subjected to.\n\nRetribution finally came in 1981 however, as the bastard Heinrich Himmler finally bit the dust together with his failed state. Now, France has to deal with territories that have experienced horrors beyond comprehension, as generations will undoubtedly suffer irreversible psychological damage.\n\nLa France va-t-elle un jour guérir?"
 FRA_the_sol: "The Service d'Ordre Legionnaire"
 FRA_the_sol_desc: "The S.O.L, otherwise known as the Service d'Ordre Legionnaire, is one of the pillars of the modern French State. Originally a paramilitary body headed by Joseph Darnand, the S.O.L has shown it's intent of being a political force to be reckoned with from the start. After the degenerate and outright Bolshevik modifications done by the traitorous Antoine Pinay to the constitution, the true sons of France could no longer stand by and watch their beautiful homeland be consumed by something inferior to them.\n\nIn December of 1967, the S.O.L stormed the presidential building in Bordeaux, and killed off Pinay. As a result, Joseph Darnand emerged as a leading figure, only to be killed off less than a month after his inauguration. Afterwards, Jean-Jacques Susini was appointed as president of the French State in 1968, and has ruled the nation ever since. The Algerianist clade of the RRN, where Susini originated from, and the S.O.L cooperated extensively in the Algeria War, resulting in the S.O.L's blessing for Susini's Presidency. The S.O.L however, still lingers in the shadows, and is more than willing to destroy, break and eliminate every threat that may destabilize their dear nation.\n\nL'Algérie est française, et le restera."
 FRA_legacy_of_marechal: "Maréchal, nous voilà!"
 FRA_legacy_of_marechal_desc: "The Lion of Verdun, long thought as the one who “betrayed” the French nation, turned out to be the one who saved France in her darkest times. Through many deals and meetings with Adolf Hitler, the partial return and rehabilitation of French territories was agreed upon. Once again, Maréchal Philippe Pétain proved that cooperation with the Reich was only in the interests of the country.  Many skeptics, who loathed the Vichy administration, were silenced, as the one who carried the strong axe of France rose victorious. Wether president Susini shall carry out his agenda or not, one thing is certain. That the country shall be reborn in the Maréchal's glorious image.\n\nPour travail, famille, et patrie!"

	
 

  
