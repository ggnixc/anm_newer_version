 ## Descriptions ##
 POLITICS_JEAN_JACQUES_SUSINI_DESC: "30 years ago, Jean-Jacques Susini was a Pied-Noir paramilitary solider fighting against Algerian Independence forces. Even when France wasn't able to stand up to the Algerians, his comrades in the SOL were able to save Algeria. Now, Susini is leader of France and Algeria. Algeria lives in France, and Susini will now forever make sure he doesn't lose his home.\n\nBorn in Algiers to French parents, Susini was forced from a young age to deal with the countless terror attacks from the FLN and ALN against the Pied-Noirs and French settlers like himself. Determined not to lose his home, he joined forces with fellow countrymen to form the SOL, a Pied-Noir paramilitary group who fought against the Algerian independence groups with the likes of Pierre Lagaillarde and Raoul Salan. Leading the political and propaganda front of the SOL, he was crucial in rallying Pied-Noir and Government forces together against the Algerians.\n\nWhen the war finally ended in a French victory in the late 60s, Susini and the SOL were initially sidelined by the Pinay Administration. However when Pinay attempted to gain emergency powers after the Oil Crisis, the SOL was crucial in orchestrating the RRN inter-party coup that brought Pinay down, with Susini being appointed the governor of Algeria after the coup. Susini helped formed the Algiers clique within the RRN in the ensuing decades alongside the party reactionaries to make ensure Algeria was always on the agenda.\n\nThe death of Raymond Le Bourre in 1986 allowed Susini his chance as he allied with the Reactionaries and Petianists to support his candidacy for French Prime Minister, succefully beating his Conservative and Technocrat opponents. 10 years from that victory, Susini still leads France with an iron grip, something he has no intention of letting go of any time soon."


### Ideas ### 
 FRA_rrn_infighting: "RRN Unity: Broken"
 FRA_rrn_infighting_desc: "Since it has risen to power, the RRN, or Rassemblement pour la Révolution Nationale, has been anything but united. Prime Minister Jean-Jacques Susini has been ruling the nation with an iron fist since his ascension, wishing to foster cooperation between France and the Reich, to demonstrate that the French nation is worthy of being Germany's ally. Unbeknownst to him, party members have begun to openly attack one another, calling each other “traitors to the nation” and “Bolshevik agents that deserve to be hanged”. Ranging from Neo-Petainists, Technocrats and even Monarchists, it is safe to say that the RRN has greatly suffered from their apparent incompetence to remain a united front against Bolshevism. To the victor shall go the spoils."
 FRA_memory_of_burgundy: "Memories of Bourgogne"
 FRA_memory_of_burgundy_desc: "The Maréchal's biggest failure undoubtedly was the loss of Eastern France. Although he realized that Alsace was a lost cause, as it was already integrated into the Reich, he hoped that, with enough time, he could persuade the Führer to cede back the French lands. But as many citizens have realized, this was but a distant dream. What emerged from those territories was the nightmarish regime known as the Ordenstaat Burgund. An abomination that thrived on the suffering of others, killing citizens as they saw fit, regardless if they had political connections or were of Jewish decent. Not even the most fanatic supporters of the Nazi party could excuse the meaningless and horrific crimes that the French, Walloons and Flemish were subjected to.\n\nRetribution finally came in 1981 however, as the bastard Heinrich Himmler finally bit the dust together with his failed state. Now, France has to deal with territories that have experienced horrors beyond comprehension, as generations will undoubtedly suffer irreversible psychological damage.\n\nLa France va-t-elle un jour guérir?"
 FRA_the_sol: "The Service d'Ordre Legionnaire"
 FRA_the_sol_desc: "The S.O.L, otherwise known as the Service d'Ordre Legionnaire, is one of the pillars of the modern French State. Originally a paramilitary body headed by Joseph Darnand, the S.O.L has shown it's intent of being a political force to be reckoned with from the start. After the degenerate and outright Bolshevik modifications done by the traitorous Antoine Pinay to the constitution, the true sons of France could no longer stand by and watch their beautiful homeland be consumed by something inferior to them.\n\nIn August 1971, S.O.L soldiers assisted in the coup against Pinay in both Algeria and France, integrating into the wider RRN party in the coup's aftermath due to their crucial involvement. The S.O.L and Algiers Clique became key players in the Fay, Sage, Le Pen and Le Bourre administrations. After Le Bourre's death, the appointment of Susini as Prime Minister allowed the S.O.L to finally be in the leading position of the RRN. The S.O.L however, still lingers in the shadows, and is more than willing to destroy, break and eliminate every threat that may destabilize their dear nation.\n\nL'Algérie est française, et le restera."
 FRA_legacy_of_marechal: "Maréchal, nous voilà!"
 FRA_legacy_of_marechal_desc: "The Lion of Verdun, long thought as the one who “betrayed” the French nation, turned out to be the one who saved France in her darkest times. Through many deals and meetings with Adolf Hitler, France was able to recover most of the Métropole after the war, albeit at the cost of some of its border territories . Once again, Maréchal Philippe Pétain proved that cooperation with the Reich was only in the interests of the country.  Many skeptics, who loathed the Vichy administration, were silenced, as the one who carried the strong axe of France rose victorious to lead the National Revolution. Whether Prime Minister Susini shall carry out his agenda or not, one thing is certain. That the country shall be reborn in the Maréchal's glorious image.\n\nPour travail, famille, et patrie!"

	
 

  
