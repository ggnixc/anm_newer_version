 ## Descriptions ##
 POLITICS_FRANCOIS_MITTERRAND_DESC: "President\n\n -------------- \n\nDisastrous times are often said to create strong men. People willing to push aside their individual beliefs in order to protect what is dear and close to their hearts. Is François Mitterrand not the perfect exemplar of this proverb? \n\nThe legacy that the French Prime Minister will leave behind will be a difficult one to overshadow. While steered forward by his inner hunger for power, Mitterrand genuinely wanted to establish a respectable democracy, one which, in his eyes, would serve in the broad interest of the population. That was his wish, until he came to the realization that if a radical, rabidly anti-German candidate were to ever win the national ticket, France would undoubtedly suffer a somber fate under the German yoke. During the turbulent times of the 70s, seeing that reactionary elements were becoming increasingly less stable, François Mitterrand purged the conservative bureaucracy and consolidated power within the party around his position. To many, this was the death of the young dream of democratization, but to others, this was a much more preferable alternative to what could have been. Calling the prime minister unpathetic would also be an all-out lie, since his progressive reforms are what led to the booming French economy. \n\nBut all things must reach their eventual end, including the life of this dictator. Unknown to the populace, Mitterrand was diagnosed with cancer years ago, a secret that has been eating at his soul since the discovery. Defined by his contradictions, the aged prime minister looks fondly at his political career, and while he was unable to introduce his vision of a respectable democracy, he was capable of protecting his glorious homeland. But will his chosen successor do as much of a fine job?"

