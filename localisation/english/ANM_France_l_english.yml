### Ideas ### 
 FRA_liberation_in_name: "Liberation in Name"
 FRA_liberation_in_name_desc: "The tricolour again flies freely and proudly over Paris, and our republican motto Liberté, égalité, fraternité rings true once more. Or does it? We may have overthrown the shackles of Pétain and the corrupt, overbloated RRN, but the deeper one may look, the less things have changed. \n\nOn paper, France is a multiparty democracy, in practice, the nation is dominated by the Union Nationale and the MDS. Much like the preceding RRN, the UN is rife with factionalism, including conservative Gaullists, right-wing Catholics, and former RRN members, with the MDS offering a token opposition. Furthermore, our beloved nation is still beholden to the Master of Europe and its economic muscle.\n\nThe chaos of the 70s may have restored normalcy in Europe's first Republic, but true liberation and democratization will certainly take longer to achieve."



