 ### Ideas ###
 FRA_the_great_divide: "The Great Divide"
 FRA_the_great_divide_desc: "Already in the early days, Poujadisme was divided, firstly between Gingembre’s pragmatists and Brigneau’s populists, and the case remains the same, with Mégret and Nicoud in their places, respectively, but with the weakening of the Poujadistes, the divided has now grown into a even greater one, with new parties and factions appearing to challenge the Status Quo.\n\nThe Énarquistes led by François Asselineau, the Rassemblement National Populaire under Roland Goguillot, the Réformistes under Jacques Chirac, and the unruly military all have one common trait, their share a goal, the end of Poujadism. And if not stopped, they may soon enough succeed, but afterwards, what would happen to France ? One simple Act, could bring the whole house of cards down… "
 
