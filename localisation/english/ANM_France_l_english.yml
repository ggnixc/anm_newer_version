 ## Descriptions ##
 POLITICS_FRANCOIS_MITTERRAND_DESC: "Disastrous times are often said to create strong men. People willing to push aside their individual beliefs in order to protect what is dear and close to their hearts. Is François Mitterrand not the perfect exemplar of this proverb? \n\nThe legacy that the French Prime Minister will leave behind will be a difficult one to overshadow. While steered forward by his inner hunger for power, Mitterrand genuinely wanted to establish a respectable democracy, one which, in his eyes, would serve in the broad interest of the population. That was his wish, until he came to the realization that if a radical, rabidly anti-German candidate were to ever win the national ticket, France would undoubtedly suffer a somber fate under the German yoke. During the turbulent times of the 70s, seeing that reactionary elements were becoming increasingly less stable, François Mitterrand purged the conservative bureaucracy and consolidated power within the party around his position. To many, this was the death of the young dream of democratization, but to others, this was a much more preferable alternative to what could have been. Calling the prime minister unpathetic would also be an all-out lie, since his progressive reforms are what led to the booming French economy. \n\nBut all things must reach their eventual end, including the life of this dictator. Unknown to the populace, Mitterrand was diagnosed with cancer years ago, a secret that has been eating at his soul since the discovery. Defined by his contradictions, the aged prime minister looks fondly at his political career, and while he was unable to introduce his vision of a respectable democracy, he was capable of protecting his glorious homeland. But will his chosen successor do as much of a fine job?"


### Ideas ### 
 FRA_rrn_infighting: "RRN Unity: Broken"
 FRA_rrn_infighting_desc: "Since it has risen to power, the RRN, or Rassemblement pour la Révolution Nationale, has been anything but united. Prime Minister François Mitterrand has been ruling the nation with an iron fist since his ascension. Unbeknownst to him, party members have begun to openly attack one another, calling each other “traitors to the nation” and “Bolshevik agents that deserve to be hanged”. Ranging from Fascists, Technocrats and Reformists, it is safe to say that the RRN has greatly suffered from their apparent incompetence to remain a united front against Bolshevism. To the victor shall go the spoils."
 FRA_legacy_of_marechal: "Maréchal, nous voilà!"
 FRA_legacy_of_marechal_desc: "The Lion of Verdun, long thought as the one who “betrayed” the French nation, turned out to be the one who saved France in her darkest times. Through many deals and meetings with Adolf Hitler, France was able to recover most of the Métropole after the war, albeit at the cost of some of its border territories . Once again, Maréchal Philippe Pétain proved that cooperation with the Reich was only in the interests of the country.  Many skeptics, who loathed the Vichy administration, were silenced, as the one who carried the strong axe of France rose victorious to lead the National Revolution. Whether Prime Minister Mitterrand shall carry out his agenda or not, one thing is certain. That the country shall be reborn in the Maréchal's glorious image.\n\nPour travail, famille, et patrie!"

	
 

  
