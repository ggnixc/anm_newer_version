 ## Descriptions ##
 POLITICS_JEAN_JACQUES_SUSINI_DESC: "30 years ago, Jean-Jacques Susini was a Pied-Noir paramilitary solider fighting against Algerian Independence forces. Even when France wasn't able to stand up to the Algerians, his comrades in the SOL were able to save Algeria. Now, Susini is leader of France and Algeria. Algeria lives in France, and Susini will now forever make sure he doesn't lose his home.\n\nBorn in Algiers to French parents, Susini was forced from a young age to deal with the countless terror attacks from the FLN and ALN against the Pied-Noirs and French settlers like himself. Determined not to lose his home, he joined forces with fellow countrymen to form the SOL, a Pied-Noir paramilitary group who fought against the Algerian independence groups with the likes of Pierre Lagaillarde and Raoul Salan. Leading the political and propaganda front of the SOL, he was crucial in rallying Pied-Noir and Government forces together against the Algerians.\n\nWhen the war finally ended in a French victory in the late 60s, Susini and the SOL were initially sidelined by the Pinay Administration. However when Pinay attempted to gain emergency powers after the Oil Crisis, the SOL was crucial in orchestrating the RRN inter-party coup that brought Pinay down, with Susini being appointed the governor of Algeria after the coup. Susini helped formed the Algiers clique within the RRN in the ensuing decades alongside the party reactionaries to make ensure Algeria was always on the agenda.\n\nThe death of Raymond Le Bourre in 1986 allowed Susini his chance as he allied with the Reactionaries and Petianists to support his candidacy for French Prime Minister, succefully beating his Conservative and Technocrat opponents. 10 years from that victory, Susini still leads France with an iron grip, something he has no intention of letting go of any time soon."


### Ideas ### 
 FRA_rrn_infighting: "RRN Unity: Broken"
 FRA_rrn_infighting_desc: "Since it has risen to power, the RRN, or Rassemblement pour la Révolution Nationale, has been anything but united. Prime Minister François Mitterrand has been ruling the nation with an iron fist since his ascension. Unbeknownst to him, party members have begun to openly attack one another, calling each other “traitors to the nation” and “Bolshevik agents that deserve to be hanged”. Ranging from Fascists, Technocrats and Reformists, it is safe to say that the RRN has greatly suffered from their apparent incompetence to remain a united front against Bolshevism. To the victor shall go the spoils."
 FRA_the_sol: "The Service d'Ordre Legionnaire"
 FRA_the_sol_desc: "The S.O.L, otherwise known as the Service d'Ordre Legionnaire, is one of the pillars of the modern French State. Originally a paramilitary body headed by Joseph Darnand, the S.O.L has shown it's intent of being a political force to be reckoned with from the start. The S.O.L and Algiers Clique were key players in the shadows of the RRN during the Algerian Conflict, tracking down and eliminating subversive separatist elements in the Algerian French Departments, along with exterminating the remaining Resistance traitors on Mainland France. The S.O.L still lingers in the shadows, and is more than willing to destroy, break and eliminate every threat that may destabilize their dear nation.\n\nL'Algérie est française, et le restera."
 FRA_legacy_of_marechal: "Maréchal, nous voilà!"
 FRA_legacy_of_marechal_desc: "The Lion of Verdun, long thought as the one who “betrayed” the French nation, turned out to be the one who saved France in her darkest times. Through many deals and meetings with Adolf Hitler, France was able to recover most of the Métropole after the war, albeit at the cost of some of its border territories . Once again, Maréchal Philippe Pétain proved that cooperation with the Reich was only in the interests of the country.  Many skeptics, who loathed the Vichy administration, were silenced, as the one who carried the strong axe of France rose victorious to lead the National Revolution. Whether Prime Minister Mitterrand shall carry out his agenda or not, one thing is certain. That the country shall be reborn in the Maréchal's glorious image.\n\nPour travail, famille, et patrie!"

	
 

  
