### Ideas ### 
 FRA_pn_infighting: "Parti National Unity: Broken"
 FRA_pn_infighting_desc: "Since it has risen to power, the Parti National has been anything but united. President Jean-Jacques Susini, co-founder of the O.A.S, has been ruling the nation with an iron fist since his ascension, wishing to foster cooperation between France and the Reich, to demonstrate that the French nation is worthy of being Germany's ally. Wether it was unbeknownst to him or not, party members have begun to openly attack one another, calling each other “traitors to the nation” and “socialist masons that deserve to be hanged”. Ranging from national syndicalists, stratocrats, and even technocrats, it is safe to say that the PN has greatly suffered from their apparent incompetence to remain a united front against bolshevism. To the victor shall go the spoils."
 FRA_memory_of_burgundy: "Memories of Bourgogne"
 FRA_memory_of_burgundy_desc: "The Maréchal's biggest failure undoubtedly was the loss of Eastern France. Although he realized that Alsace was a lost cause, as it was already integrated into the Reich, he hoped that, with enough time, he could persuade the Führer to cede back the French lands. But as many citizens know, this was but a distant dream. What emerged from those territories was the nightmarish regime known as the Ordenstaat Burgund. An abomination that thrived on the suffering of others, killing citizens as they saw fit, regardless if they had political connections or were of Jewish decent. Not even the most fanatic supporters of the Nazi party could excuse the meaningless and horrific crimes that the French, Walloons and Flemish were subjected to.\n\nRetribution finally came in 1981 however, as the bastard Heinrich Himmler finally bit the dust together with his failed state. Now, France has to deal with territories that have experienced horrors beyond comprehension, as generations will undoubtedly suffer irreversible psychological damage.\n\nLa France va-t-elle un jour guérir ?"
 FRA_the_aos: "The Organisation Armée Secrète"
 FRA_the_aos_desc: "The O.A.S, otherwise known as the Organisation Armée Secrète, is the foundation of the modern French State. Originally a group comprised of French colonials in Algeria during the revolt, the O.A.S has shown it's intent of being a political force to be reckoned with from the start. Even president Jean-Jacques Susini, the “Heir of the Maréchal”, was a co-founder of the organization. After the degenerate and outright bolshevik modifications done by the traitorous Antoine Pinay to the constitution, the true sons of France could no longer stand by and watch their beautiful homeland be consumed by something inferior to them.\n\nIn December of 1967, the O.A.S stormed the presidential building in Bordeaux, and killed off Pinay. As a result, Raoul Salan emerged as a leading figure, only to be killed off less than a month after his inauguration. Jean-Jacques Susini was appointed as president of the French State in 1968, and thus, ruled the nation ever since. The O.A.S however, still lingers in the shadows, and is more than willing to destroy, break and eliminate every threat that may destabilize their dear nation.\n\nL'Algérie est française, et le restera."
 FRA_legacy_of_marechal: "Maréchal, nous voilà!"
 FRA_legacy_of_marechal_desc: "The Lion of Verdun, long thought as the one who “betrayed” the Republic, turned out to be the one who saved France in her darkest times. Through many deals and meetings with Adolf Hitler, the partial return and rehabilitation of French territories was agreed upon. Once again, Maréchal Philippe Pétain proved that cooperation with the Reich was only in the interests of the country.  Many skeptics, who loathed the Vichy administration, were silenced, as the one who carried the strong axe of France rose victorious. Wether president Susini shall carry out his agenda or not, one thing is certain. That the country shall be reborn in the Maréchal's glorious image.\n\nPour travail, famille, et patrie!"

	
 

  
