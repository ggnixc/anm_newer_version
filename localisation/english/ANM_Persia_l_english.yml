 ##MINISTERS##
 #############

### National Spirits ###
 PER_Opposition_To_The_House: "Opposition To The House"
 PER_Opposition_To_The_House_desc: "Adjacent to the Middle East lies the Imperial State of Iran, a nation that tries to not only convince foreigners that it is indeed a member of the developed world, but its citizens as well. The disproportionate distribution of capital in the country defines Iran in the modern era. Rural neglect and unequal developmentalism are prevalent, observers noting that the preponderance of funds is being invested into Tehran and oil-rich areas, while in the meantime the eastern peripheries have not yet seen mechanical farming tools.\n\nThe government has also faced issues in the form of ethnic tensions between the Persians, the Kurds and the Arabic people in the western lands near Iraq and Turkey. Many of the aforementioned economic difficulties fall along ethno-religious lines, and in order to avoid mass resistance or distress, Tehran began passing limited reforms aimed at placating workers and minorities, campaigns which ended with varying degrees of success."
 PER_Mother_Of_Wealth: "Mother Of Wealth"
 PER_Mother_Of_Wealth_desc: "The Perfidious Albion, a nemesis to Iran, its people and its wealth. The fall of London in the Second World War gave Tehran the perfect opportunity to nationalize the oil fields previously owned by British conglomerates. Naturally, profits began to rise, with Iran ultimately gaining full sovereignty over their natural resources.\n\nThe aftermath of the war also brought a victorious Reich in need of an oil supply outside of Caucasia. With the signature of a pen, millions of oil barrels began their shipment to Germania, further fueling the warmongering state. This economic bond is vital to both partners, where Germany manages to import fossil fuels from a secure area, Tehran not only gains a guaranteed trade partner with an insatiable thirst for back gold, but access to the wider European market."
 PER_Berlins_Right_Hand_Man: "Berlin's Right Hand Man"
 PER_Berlins_Right_Hand_Man_desc: "Iran's geopolitical situation has always been a precarious one, serving as a buffer state between the infamous empires of bygone eras. Today, their standing has suffered a large shift ever since the capitulation of Great Britain following Operation Sealion. Ascending to the throne of European hegemon, the German Reich sought to establish a lasting relationship with Middle Eastern nations, and Iran has fit the mold ever since 1943.\n\nBy 1996, the situation could be considered somewhat more favourable, as Pakistan had also consolidated itself off of German ammunition and cash, but taking into account the looming crop crisis brewing underneath the surface, it is closer to a curse. To the occident, Turkey and Italy still find themselves in an affray of influence and intelligence, making Iran the lone German-aligned nation that is stable enough to exert a mark of influence."
 
