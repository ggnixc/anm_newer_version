 ##LEADER DESCS##
 ################
 POLITICS_REZA_PAHLAVI_DESC: "“Only by enduring the trials of heaven can one be a true hero, and only those who face jealousy are not mediocre."\n\nReza Pahlavi has witnessed innumerable hardships in his forty years. Regardless of how the river of time flows, Reza will never forget the nightmarish events that followed his tenth birthday — the assassination of his father and the brutal civil war which left an indelible imprint on his soul.\n\nIn 1972, after the embers finally cooled, twelve-year-old Pahlavi was crowned Shah. Too young to rule, Pahlavi’s mother Farah steered the Empire in his stead. Pahlavi was powerless to stop his regent as she, among other innumerable atrocities, collaborated with genocidal Nazis and slaughtered all who dared to oppose her — all in Pahlavi's name The little Shah’s heart, already troubled by trauma and strife, would be forever blackened by his mother’s malevolence.\n\nAs a young man, Pahlavi studied abroad in Germany, where his mother’s connections earned him special treatment from the German government. Pahlavi made fast friends with another boy in a similar position to his own — Albert Speer Jr. — with whom he would often take long, meandering walks to discuss the curiosities of life and the ever-changing world.  In the years that followed, time and distance would test the bond of these kindred spirits — but the trials served only to make their connection stronger.\n\nWhen Pahlavi turned eighteen, he fully ascended to the throne of the Iranian Empire — at least, as far as the law was concerned. In reality, Farah, her grip secure on the levers of power, pulled the strings behind the scenes, puppeteering the Imperial bureaucracy as she pleased.\n\nStill, forward-thinking Pahlavi tried every possible way to maneuver around his mother’s machinations and bring about reform. His hard work paid off — but just as his dream of a new Iran was within reach, his hand-picked Prime Minister was murdered in the streets of Tehran, paving the way for his mother's damnable Nazi ally to grasp the reigns of government.\n\nThe cards are stacked against the Shah. But regardless of the past, regardless of the future, Reza Pahlavi still holds the dream of a free, democratic Iran in his wounded soul. This is the destiny of his people, and he will see it fulfilled — no matter the cost."
