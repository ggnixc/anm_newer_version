### AC ###
  GER_armored_car_equipment: "Armored Car"

  GER_armored_car_equipment_0: "Early Armored Car"
  GER_armored_car_equipment_0_desc: "A lightly armored vehicle good for providing reconnisance and support, armed with a light gun and high speed."

  GER_armored_car_equipment_1: "Basic Armored Car"
  GER_armored_car_equipment_1_desc: "Armored cars with a higher degree of protection against small arms fire, as well as improved firepower from the main gun and machine guns."

  GER_armored_car_equipment_2: "Improved Armored Car"
  GER_armored_car_equipment_2_desc: "Taking some of the role of the APC, our Armored Cars will carry troops in combat situations, and also be designed to handle rough terrain and have amphibious capability."

  GER_armored_car_equipment_3: "Advanced Armored Car"
  GER_armored_car_equipment_3_desc: "Our Armored Cars will have increased suspension capabilities, so they can carry heavier weaponry into combat to fill fire support and AT roles."

  GER_armored_car_equipment_4: "Semi-Modern Armored Car"
  GER_armored_car_equipment_4_desc: "Combining the maneuverability of a utility vehicle with the armor and firepower of an armored car, this new class will provide our troops with a versitile unit for all combat needs."

  GER_armored_car_equipment_5: "Advanced Armored Car"
  GER_armored_car_equipment_5_desc: "Upscaled Armored Car to carry larger loads of troops and keep them safe from mines and roadside bomb attacks, while not sacrificing maneuverability and defense."

