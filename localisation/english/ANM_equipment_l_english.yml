##### Infantry #####
 ### Infantry Equipment ###
 GER_infantry_equipment_0: "Mauser G 3/64"
 GER_infantry_equipment_0_short: "Mauser G 3/64"
 GER_infantry_equipment_0_desc: "Basic infantry rifle developed before and during the Great War. Typically bolt action, this rifle can still be produced in a pinch if need be, although it may prove less effective in this modern age."

 GER_infantry_equipment_1: "Mauser G 41"
 GER_infantry_equipment_1_short: "Mauser G 41"
 GER_infantry_equipment_1_desc: "Infantry rifle developed during the later stages of the Second World War. Whether it is fully- or semi-automatic, this rifle's design is well adapted to the challenges faced by its mother country."

 GER_infantry_equipment_2: "Mauser G 50"
 GER_infantry_equipment_2_short: "Mauser G 50"
 GER_infantry_equipment_2_desc: "Rifle improving upon shortcomings noticed in the Second World War. Less complex and more reliable, this rifle can be modified fairly easily to meet the demands of the environment it is serving in."

 GER_infantry_equipment_3: "Mauser XM8"
 GER_infantry_equipment_3_short: "Mauser XM8"
 GER_infantry_equipment_3_desc: "An improved gas operated piston rifle, often equipped with choice fire and gas blowback. This rifle is designed for the anticipated conflicts of the Cold War, from urban streets to African jungles."

 GER_infantry_equipment_4: "Mauser XM29 OICW"
 GER_infantry_equipment_4_short: "Mauser XM29 OICW"
 GER_infantry_equipment_4_desc: "A rifle incorporating lighter polymer materials, with more advanced addons available. This rifle generally fires a newly developed, relatively smaller, high-velocity bullet to allow for better recoil control and accuracy."

 GER_infantry_equipment_5: "VACANT"
 GER_infantry_equipment_5_short: "VACANT"
 GER_infantry_equipment_5_desc: "A rifle incorporating lighter polymer materials, with more advanced addons available. This rifle generally fires a newly developed, relatively smaller, high-velocity bullet to allow for better recoil control and accuracy."

 ### Infantry Kits ###
  GER_infantry_kit_eq_36: "M68 Feldbluse"
  GER_infantry_kit_eq_36_desc: "Influenced by the experiences of World War I, in which pistols and knives were essential for trench warfare, this infantry kit contains a set of them apart from a gas mask. The steel helmet is designed to deflect overhead shell fragments."

  GER_infantry_kit_eq_45: "M78 Feldbluse"
  GER_infantry_kit_eq_45_desc: "During the Second World War gas attacks were not as common as in the First one, so the importance of masks was reduced. Helmet technology advanced, making head injuries less common, but the helmets are not bulletproof still."

  GER_infantry_kit_eq_52: "Fieldkit Improvement I"
  GER_infantry_kit_eq_52_desc: "In general, given the superplus of military equipment left from World War II, infantry kits haven't evolved too much. Some designs have been revised and in the case of footwear, synthetic rubber has been adopted fully as a material."

  GER_infantry_kit_eq_58: "M88 Feldbluse"
  GER_infantry_kit_eq_58_desc: "With the Cold War generating a series of proxy wars for the superpowers to test their new toys, the already observed need of acclimating equipment and uniforms for tropical or cold conditions has been met with new innovations in material and armor technology."
 
  GER_infantry_kit_eq_64: "Fieldkit Improvement II"
  GER_infantry_kit_eq_64_desc: "As a result of the magazines for assault rifles being too short for the universal pouch, a shorter ammo case has been introduced. It is attached to the belt and has a series of straps on both sides for attaching hand grenades."

  GER_infantry_kit_eq_70: "21M1 Feldbluse"
  GER_infantry_kit_eq_70_desc: "In the helmets, new liners made of ballistic nylon with removable suspension have replaced the older pattern liners. Cotton camouflage covers have become prevalent, with buttonholes for inserting natural foliage for additional camouflage."

  GER_infantry_kit_eq_76: "Fieldkit Improvement III"
  GER_infantry_kit_eq_76_desc: "The invention of Kevlar in the US has revolutionized body armour, with the other superpowers rushing to create similar materials. Lightweight, tough, and resilient, bullet-resistant plates have been incorporated in infantry combat vests in a 15-layer pattern covering most vital organs that have greatly increased infantry survivability."

  GER_infantry_kit_eq_82: "21M2 Feldbluse"
  GER_infantry_kit_eq_82_desc: "The eruption of full-scale war across the world has lead to gigantic leaps in infantry kit design greatly aided by accurate battlefield feedback. Innovations once thought to be several decades in the future are being forced onto the soldiers of today, as ballistic protection and shrapnel defence become key focuses of current design."

  GER_infantry_kit_eq_88: "Fieldkit Improvement IV"
  GER_infantry_kit_eq_88_desc: "Experience from recent total conflicts have brought into sharp relief the critical importance of integrating communications equipment directly into kit, resulting in radio-enabled helmet-visors and the beginnings of realtime vital sign monitoring. However, manufacturing expenses are starting to become so great that only superpowers and their closest allies can afford the cutting edge"

### Support Equipment ###
 ## Infantry Anti-Tank ##
 GER_anti_tank_equipment_0: "Panzerfaust 3"
 GER_anti_tank_equipment_0_desc: "Developed during the Second World War, this rudimentary shoulder-fired anti-tank system enables our troops to pose a decent threat to most armored vehicles."

 GER_anti_tank_equipment_1: "Panzerfaust 3-IT"
 GER_anti_tank_equipment_1_desc: "An improved shoulder-fired missile launcher, incorporating design improvements, such as lighter materials and better sights, and high-explosive anti-tank (HEAT) warheads."

 GER_anti_tank_equipment_2: "MATADOR RGW90"
 GER_anti_tank_equipment_2_desc: "Wire-guided shoulder-fired missile using a recoilless blowback system, with multiple types of warheads available, depending on the situation at hand."

 GER_anti_tank_equipment_3: "NAME?"
