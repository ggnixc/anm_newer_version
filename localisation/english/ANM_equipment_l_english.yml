l_english:

##### Infantry #####
 ### Infantry Equipment ###
 GER_infantry_equipment_0: "Mauser LAG 41"
 GER_infantry_equipment_0_short: "Mauser LAG 41"
 GER_infantry_equipment_0_desc: "Basic infantry rifle developed before and during the Great War. Typically bolt action, this rifle can still be produced in a pinch if need be, although it may prove less effective in this modern age."

 GER_infantry_equipment_1: "Mauser G36"
 GER_infantry_equipment_1_short: "Mauser G36"
 GER_infantry_equipment_1_desc: "Infantry rifle developed during the later stages of the Second World War. Whether it is fully- or semi-automatic, this rifle's design is well adapted to the challenges faced by its mother country."

 GER_infantry_equipment_2: "Mauser 416"
 GER_infantry_equipment_2_short: "Mauser 416"
 GER_infantry_equipment_2_desc: "Rifle improving upon shortcomings noticed in the Second World War. Less complex and more reliable, this rifle can be modified fairly easily to meet the demands of the environment it is serving in."


 GER_infantry_equipment_3: "Mauser XM8"
 GER_infantry_equipment_3_short: "Mauser XM8"
 GER_infantry_equipment_3_desc: "An improved gas operated piston rifle, often equipped with choice fire and gas blowback. This rifle is designed for the anticipated conflicts of the Cold War, from urban streets to African jungles."

 GER_infantry_equipment_4: "Mauser XM29 OICW"
 GER_infantry_equipment_4_short: "Mauser XM29 OICW"
 GER_infantry_equipment_4_desc: "A rifle incorporating lighter polymer materials, with more advanced addons available. This rifle generally fires a newly developed, relatively smaller, high-velocity bullet to allow for better recoil control and accuracy."


### Support Equipment ###
 ## Infantry Anti-Tank ##
 GER_anti_tank_equipment_0: "Panzerfaust"
 GER_anti_tank_equipment_0_desc: "Developed during the Second World War, this rudimentary shoulder-fired anti-tank system enables our troops to pose a decent threat to most armored vehicles."

 GER_anti_tank_equipment_1: "Panzerfaust 2"
 GER_anti_tank_equipment_1_desc: "An improved shoulder-fired missile launcher, incorporating design improvements, such as lighter materials and better sights, and high-explosive anti-tank (HEAT) warheads."

 GER_anti_tank_equipment_2: "MATADOR RGW90"
 GER_anti_tank_equipment_2_desc: "Wire-guided shoulder-fired missile using a recoilless blowback system, with multiple types of warheads available, depending on the situation at hand."


 ## Infantry Anti-Air ##
 GER_anti_air_shoulder_equipment_0: "FLIEGERFAUST D2"
 GER_anti_air_shoulder_equipment_0_desc: "Experimental equipment for granting air-denial power to common infantry without the need for heavy duty equipment or emplacements. Of limited effectiveness, but great future potential."

 GER_anti_air_shoulder_equipment_1: "FLIEDERFAUST D3"
 GER_anti_air_shoulder_equipment_1_desc: "Basic man-portable air-defense system (MANPADS) developed shortly after the Second World War, with integrated sensors to track aircraft engine heat-signatures"

 GER_anti_air_shoulder_equipment_2: "RBS 70"
 GER_anti_air_shoulder_equipment_2_desc: "An improved MANPADS incorporating design improvements to both the rocket and warhead to increase velocity and damage, respectively, along with aircraft signature tracing."


### Mobile Infantry ###
 GER_motorized_equipment_0: "UNIMOG 435"
 GER_motorized_equipment_0_desc: "Motorizing infantry is the first stage towards the mechanization of an army. Civilian trucks are readily adaptable to military uses of transporting soldiers, towing guns, and carrying equipment and supplies."

 GER_motorized_equipment_1: "MAN HX60"
 GER_motorized_equipment_1_desc: "Custom military variants of civilian trucks with military-only improvements, such as upgraded engines and hardened components tailored to survive the harsh conditions and demands of military operations."

 GER_motorized_equipment_2: "RMMV TG-MIL"
 GER_motorized_equipment_2_desc: "Specially designed vehicles, geared specifically for military usage, these vehicles feature a host of design choices based on lessons learned from recent wars, along with compatibility tweaks for use with other military equipment."


### MBT ### 
  GER_MBT_equipment: "Main Battle Tank"

  GER_MBT_equipment_0: "Early MBT"
  GER_MBT_equipment_0_desc: "Instead of developing a multitude of tank variants, it is much more efficient and effective to design a vehicle that can fill any role. Early main battle tanks were developed from medium tanks used during the Second World War."
  
  GER_MBT_equipment_1: "Basic MBT"
  GER_MBT_equipment_1_desc: "With the development of more powerful engines, lighter tanks can carry heavier armaments and thicker armor, all while keeping a respectable top speed. This main battle tank will form a key component of our armored forces."

  GER_MBT_equipment_2: "Improved MBT"
  GER_MBT_equipment_2_desc: "More powerful main cannons, with calibers around 100mm, can penetrate nearly any type of armor at long ranges. Specialized armor will help to increase tank survivability as anti-tank weapons continue to become more advanced."

  GER_MBT_equipment_3: "Advanced MBT"
  GER_MBT_equipment_3_desc: "Further increasing the capabilities of the engines in our main battle tanks will allow us to make their armor even thicker and cover more of the vehicle, as well as increase overall reliability and fuel efficiency."

  GER_MBT_equipment_4: "Semi-Modern MBT"
  GER_MBT_equipment_4_desc: "Explosive reactive armor and other countermeasure system can further increase vehicle survivability, as helicopters and missiles continue to become a greater threat to our armored vehicles."

  GER_MBT_equipment_5: "Modern MBT"
  GER_MBT_equipment_5_desc: "Integrated electronic fire control systems can make use of newly developed computing technology, allowing our tanks to engage targets over longer distances with higher accuracy, and lighten the workload of the crew during an engagement."

  GER_MBT_chassis: "Main Battle Tank Chassis"
  GER_MBT_chassis_desc: "MBT"

  GER_MBT_chassis_0: "Early MBT Chassis"
  GER_MBT_chassis_0_desc: "Instead of developing a multitude of tank variants, it is much more efficient and effective to design a vehicle that can fill any role. Early main battle tanks were developed from medium tanks used during the Second World War."
  
  GER_MBT_chassis_1: "Kampfpanzer Leopard 1"
  GER_MBT_chassis_1_desc: "With the development of more powerful engines, lighter tanks can carry heavier armaments and thicker armor, all while keeping a respectable top speed. This main battle tank will form a key component of our armored forces."

  GER_MBT_chassis_2: "Kampfpanzer Leopard 2"
  GER_MBT_chassis_2_desc: "More powerful main cannons, with calibers around 100mm, can penetrate nearly any type of armor at long ranges. Specialized armor will help to increase tank survivability as anti-tank weapons continue to become more advanced."

  GER_MBT_chassis_3: "Kampfpanzer Leopard 2A4"
  GER_MBT_chassis_3_desc: "Further increasing the capabilities of the engines in our main battle tanks will allow us to make their armor even thicker and cover more of the vehicle, as well as increase overall reliability and fuel efficiency."

  GER_MBT_chassis_4: "Kampfpanzer Leopard 2A6"
  GER_MBT_chassis_4_desc: "Explosive reactive armor and other countermeasure system can further increase vehicle survivability, as helicopters and missiles continue to become a greater threat to our armored vehicles."

  GER_MBT_chassis_5: "Kettenfahrzeug Panther 2"
  GER_MBT_chassis_5_desc: "Integrated electronic fire control systems can make use of newly developed computing technology, allowing our tanks to engage targets over longer distances with higher accuracy, and lighten the workload of the crew during an engagement."

### IFV ###
 GER_IFV_equipment_0: "MARDER AFV"
 GER_IFV_equipment_0_desc: "Armored fighting vehicle that was developed during the Second World War, generally with a half-track or light tank design. Able to transport a squadron of soldiers while also having an autocannon or heavier gun for direct fire support."

 GER_IFV_equipment_1: "MARDER 1A3"
 GER_IFV_equipment_1_desc: "Intended to fill the gap between an APC and a MBT, this vehicle is purpose-designed with both troop transport and combat capability in mind. Its heavier armaments can prove useful in a firefight when no other support is available."

 GER_IFV_equipment_2: "MARDER 1A5"
 GER_IFV_equipment_2_desc: "This new generation of AFV is both heavily armed and armored, packing a powerful automatic cannon and adorned with armor nearly as thick as an APC. It can serve as an effective assault vehicle that can fight alongside the troops inside."

 GER_IFV_equipment_3: "Schützenpanzer Puma"
 GER_IFV_equipment_3_desc: "Featuring additional armaments such as a mounted machine gun in addition to the cannon, this AFV allows troops to fight from both within the vehicle using gun ports, or from outside the vehicle, using its heavier armor as cover."


### APC ###
 GER_APC_equipment_0: "MOWAG DURO YAK"
 GER_APC_equipment_0_desc: "Armored troop transport vehicle that was developed during the Second World War to carry personnel into combat. A bit crude in design, but effective enough to stop small arms and light artillery fire, and carry some light armaments."

 GER_APC_equipment_1: "Spähwagen Fennek"
 GER_APC_equipment_1_desc: "A more refined transport vehicle, this APC can hold a larger number of soldiers and is more adapted to harsh combat environments. The vehicle's heavier armor can prove useful if ambushed or transporting troops through hostile areas."

 GER_APC_equipment_2: "FUCHS 2"
 GER_APC_equipment_2_desc: "Building our APC with amphibious capabilities in mind, and including features such as an exhaust snorkel or water jets, will allow them to preform river crossing if bridges are unavailable and be used in naval assaults."

 GER_APC_equipment_3: "GTK BOXER"
 GER_APC_equipment_3_desc: "By improving the suspension system in the wheel or track system of our APCs, we can make them more comfortable to be in during transport, and allow the passengers to disembark more quickly when a rapid exit is required."


### Close Air Support ###
  cas: "CAS"
  jet_CAS: "Jet CAS"
  cv_jet_CAS: "Carrier Jet CAS"
  CAS_equipment: "Close Air Support"
  CAS_equipment_desc: "Close Air Support"

  # 1945
  CAS_equipment_1: "Early CAS"
  CAS_equipment_1_desc: "The aircraft that defined the early years of the Second World War was the dive bomber. An aircraft that could pounce upon and destroy enemy troops, factories, and ships was a terrifying sight that shocked the world, and made every Air Force develop a model of their own."
  CAS_equipment_1_short: "Early CAS"

  cv_CAS_equipment_1: "Early CAS CV"
  cv_CAS_equipment_1_desc: "It was only a matter of time until the navies of the world recognized the potential of a sea-based air fleet at their disposal. These carrier borne attack aircraft played a pivotal role in the war, especially in the Pacific Theater."
  cv_CAS_equipment_1_short: "Early CAS CV"

  # 1950
  GER_jet_CAS_equipment_1: "Dornier Sturmvogel"
  GER_jet_CAS_equipment_1_desc: "The end of the war and the invention of jet and turboprop aircraft has caused many aircraft designers to reimagine the ground attack aircraft. These new models move faster and carry more payload to drop on the enemy."
  GER_jet_CAS_equipment_1_short: "Dornier Sturmvogel"

  cv_jet_CAS_equipment_1: "Basic Jet CAS I CV"
  cv_jet_CAS_equipment_1_desc: "No navy in their right mind would say no to a carrier capable jet attack aircraft. It would have all the benefits of a regular ground support aircraft, but with the range of an aircraft carrier, even if some modifications were necessary."
  cv_jet_CAS_equipment_1_short: "Basic Jet CAS I CV"

  # 1960
  jet_CAS_equipment_2: "Improved Jet CAS I"
  jet_CAS_equipment_2_desc: "Supersonic CAS aircraft will be able to strike fast and get away before the enemy knows they are there. They also carry even heavier payloads than their predecessors, making an upgrade advisable to anyone serious about developing a tactical air arm."
  jet_CAS_equipment_2_short: "Improved Jet CAS"

  cv_jet_CAS_equipment_2: "Improved Jet CAS CV"
  cv_jet_CAS_equipment_2_desc: "Jet-powered carrier CAS is wonderful, and is a concept worth pursuing. New catapults and carrier deck designs allow us to use far better aircraft than we had used in this role before."
  cv_jet_CAS_equipment_2_short: "Improved Jet CAS CV"

  # 1970
  jet_CAS_equipment_3: "Advanced Jet CAS"
  jet_CAS_equipment_3_desc: "Dedicated CAS Aircraft can be produced that take advantage of our advancements in avionics to provide ground support. These aircraft are designed to destroy the enemy's ground forces first and foremost; everything else is secondary."
  jet_CAS_equipment_3_short: "Advanced Jet CAS"

  cv_jet_CAS_equipment_3: "Advanced Jet CAS CV"
  cv_jet_CAS_equipment_3_desc: "There is a need for a light attack carrier-based aircraft that can make supersonic speeds, carry larger loads, and fly further than its ancestors. With new technological advancements, we can give our naval pilots what they need."
  cv_jet_CAS_equipment_3_short: "Advanced Jet CAS CV"