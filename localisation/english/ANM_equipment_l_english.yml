### MBT ### 
  GER_MBT_equipment: "Main Battle Tank"

  GER_MBT_equipment_0: "Early MBT"
  GER_MBT_equipment_0_desc: "Instead of developing a multitude of tank variants, it is much more efficient and effective to design a vehicle that can fill any role. Early main battle tanks were developed from medium tanks used during the Second World War."
  
  GER_MBT_equipment_1: "Basic MBT"
  GER_MBT_equipment_1_desc: "With the development of more powerful engines, lighter tanks can carry heavier armaments and thicker armor, all while keeping a respectable top speed. This main battle tank will form a key component of our armored forces."

  GER_MBT_equipment_2: "Improved MBT"
  GER_MBT_equipment_2_desc: "More powerful main cannons, with calibers around 100mm, can penetrate nearly any type of armor at long ranges. Specialized armor will help to increase tank survivability as anti-tank weapons continue to become more advanced."

  GER_MBT_equipment_3: "Advanced MBT"
  GER_MBT_equipment_3_desc: "Further increasing the capabilities of the engines in our main battle tanks will allow us to make their armor even thicker and cover more of the vehicle, as well as increase overall reliability and fuel efficiency."

  GER_MBT_equipment_4: "Semi-Modern MBT"
  GER_MBT_equipment_4_desc: "Explosive reactive armor and other countermeasure system can further increase vehicle survivability, as helicopters and missiles continue to become a greater threat to our armored vehicles."

  GER_MBT_equipment_5: "Modern MBT"
  GER_MBT_equipment_5_desc: "Integrated electronic fire control systems can make use of newly developed computing technology, allowing our tanks to engage targets over longer distances with higher accuracy, and lighten the workload of the crew during an engagement."

  GER_MBT_chassis: "Main Battle Tank Chassis"
  GER_MBT_chassis_desc: "MBT"

