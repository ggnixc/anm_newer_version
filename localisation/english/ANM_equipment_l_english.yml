### Close Air Support ###
  cas: "CAS"
  jet_CAS: "Jet CAS"
  cv_jet_CAS: "Carrier Jet CAS"
  CAS_equipment: "Close Air Support"
  CAS_equipment_desc: "Close Air Support"

  # 1945
  CAS_equipment_1: "Early CAS"
  CAS_equipment_1_desc: "The aircraft that defined the early years of the Second World War was the dive bomber. An aircraft that could pounce upon and destroy enemy troops, factories, and ships was a terrifying sight that shocked the world, and made every Air Force develop a model of their own."
  CAS_equipment_1_short: "Early CAS"

  cv_CAS_equipment_1: "Early CAS CV"
  cv_CAS_equipment_1_desc: "It was only a matter of time until the navies of the world recognized the potential of a sea-based air fleet at their disposal. These carrier borne attack aircraft played a pivotal role in the war, especially in the Pacific Theater."
  cv_CAS_equipment_1_short: "Early CAS CV"

  # 1950
  GER_jet_CAS_equipment_1: "Dornier Sturmvogel"
  GER_jet_CAS_equipment_1_desc: "The end of the war and the invention of jet and turboprop aircraft has caused many aircraft designers to reimagine the ground attack aircraft. These new models move faster and carry more payload to drop on the enemy."
  GER_jet_CAS_equipment_1_short: "Dornier Sturmvogel"

  cv_jet_CAS_equipment_1: "Basic Jet CAS I CV"
  cv_jet_CAS_equipment_1_desc: "No navy in their right mind would say no to a carrier capable jet attack aircraft. It would have all the benefits of a regular ground support aircraft, but with the range of an aircraft carrier, even if some modifications were necessary."
  cv_jet_CAS_equipment_1_short: "Basic Jet CAS I CV"

  # 1960
  jet_CAS_equipment_2: "Improved Jet CAS I"
  jet_CAS_equipment_2_desc: "Supersonic CAS aircraft will be able to strike fast and get away before the enemy knows they are there. They also carry even heavier payloads than their predecessors, making an upgrade advisable to anyone serious about developing a tactical air arm."
  jet_CAS_equipment_2_short: "Improved Jet CAS"

  cv_jet_CAS_equipment_2: "Improved Jet CAS CV"
  cv_jet_CAS_equipment_2_desc: "Jet-powered carrier CAS is wonderful, and is a concept worth pursuing. New catapults and carrier deck designs allow us to use far better aircraft than we had used in this role before."
  cv_jet_CAS_equipment_2_short: "Improved Jet CAS CV"

  # 1970
  jet_CAS_equipment_3: "Advanced Jet CAS"
  jet_CAS_equipment_3_desc: "Dedicated CAS Aircraft can be produced that take advantage of our advancements in avionics to provide ground support. These aircraft are designed to destroy the enemy's ground forces first and foremost; everything else is secondary."
