l_english:

##### Infantry #####
 ### Infantry Equipment ###
 GER_infantry_equipment_0: "MAUSER LAG 41"
 GER_infantry_equipment_0_short: "MAUSER LAG 41"
 GER_infantry_equipment_0_desc: "Basic infantry rifle developed before and during the Great War. Typically bolt action, this rifle can still be produced in a pinch if need be, although it may prove less effective in this modern age."

 GER_infantry_equipment_1: "Heckler & Koch G36"
 GER_infantry_equipment_1_short: "Heckler & Koch G36"
 GER_infantry_equipment_1_desc: "Infantry rifle developed during the later stages of the Second World War. Whether it is fully- or semi-automatic, this rifle's design is well adapted to the challenges faced by its mother country."

 GER_infantry_equipment_2: "HK416"
 GER_infantry_equipment_2_short: "HK416"
 GER_infantry_equipment_2_desc: "Rifle improving upon shortcomings noticed in the Second World War. Less complex and more reliable, this rifle can be modified fairly easily to meet the demands of the environment it is serving in."


 GER_infantry_equipment_3: "HK416 A5"
 GER_infantry_equipment_3_short: "HK416 A5"
 GER_infantry_equipment_3_desc: "An improved gas operated piston rifle, often equipped with choice fire and gas blowback. This rifle is designed for the anticipated conflicts of the Cold War, from urban streets to African jungles."

 GER_infantry_equipment_4: "HK416 A8"
 GER_infantry_equipment_4_short: "HK416 A8"
 GER_infantry_equipment_4_desc: "A rifle incorporating lighter polymer materials, with more advanced addons available. This rifle generally fires a newly developed, relatively smaller, high-velocity bullet to allow for better recoil control and accuracy."


### Support Equipment ###
 ## Infantry Anti-Tank ##
 GER_anti_tank_equipment_0: "PANZERFAUST 3"
 GER_anti_tank_equipment_0_desc: "Developed during the Second World War, this rudimentary shoulder-fired anti-tank system enables our troops to pose a decent threat to most armored vehicles."

 GER_anti_tank_equipment_1: "FFV AT4"
 GER_anti_tank_equipment_1_desc: "An improved shoulder-fired missile launcher, incorporating design improvements, such as lighter materials and better sights, and high-explosive anti-tank (HEAT) warheads."

 GER_anti_tank_equipment_2: "MATADOR"
 GER_anti_tank_equipment_2_desc: "Wire-guided shoulder-fired missile using a recoilless blowback system, with multiple types of warheads available, depending on the situation at hand."


 ## Infantry Anti-Air ##
 GER_anti_air_shoulder_equipment_0: "FLIEGERFAUST D2"
 GER_anti_air_shoulder_equipment_0_desc: "Experimental equipment for granting air-denial power to common infantry without the need for heavy duty equipment or emplacements. Of limited effectiveness, but great future potential."

 GER_anti_air_shoulder_equipment_1: "FLIEDERFAUST D3"
 GER_anti_air_shoulder_equipment_1_desc: "Basic man-portable air-defense system (MANPADS) developed shortly after the Second World War, with integrated sensors to track aircraft engine heat-signatures"

 GER_anti_air_shoulder_equipment_2: "RBS 70"
 GER_anti_air_shoulder_equipment_2_desc: "An improved MANPADS incorporating design improvements to both the rocket and warhead to increase velocity and damage, respectively, along with aircraft signature tracing."


### Mobile Infantry ###
 GER_motorized_equipment_0: "UNIMOG 435"
 GER_motorized_equipment_0_desc: "Motorizing infantry is the first stage towards the mechanization of an army. Civilian trucks are readily adaptable to military uses of transporting soldiers, towing guns, and carrying equipment and supplies."

 GER_motorized_equipment_1: "RMMV HX2"
 GER_motorized_equipment_1_desc: "Custom military variants of civilian trucks with military-only improvements, such as upgraded engines and hardened components tailored to survive the harsh conditions and demands of military operations."

 GER_motorized_equipment_2: "RMV TG MIL TGM"
 GER_motorized_equipment_2_desc: "Specially designed vehicles, geared specifically for military usage, these vehicles feature a host of design choices based on lessons learned from recent wars, along with compatibility tweaks for use with other military equipment."
