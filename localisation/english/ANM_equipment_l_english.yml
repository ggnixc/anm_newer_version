 ## Infantry Anti-Air ##
 GER_anti_air_shoulder_equipment_0: "STROM"
 GER_anti_air_shoulder_equipment_0_desc: "Experimental equipment for granting air-denial power to common infantry without the need for heavy duty equipment or emplacements. Of limited effectiveness, but great future potential."

 GER_anti_air_shoulder_equipment_1: "Wildbach"
 GER_anti_air_shoulder_equipment_1_desc: "Basic man-portable air-defense system (MANPADS) developed shortly after the Second World War, with integrated sensors to track aircraft engine heat-signatures"

 GER_anti_air_shoulder_equipment_2: "Wildbach E"
 GER_anti_air_shoulder_equipment_2_desc: "An improved MANPADS incorporating design improvements to both the rocket and warhead to increase velocity and damage, respectively, along with aircraft signature tracing."

 GER_anti_air_shoulder_equipment_3: "VACANT"
 GER_anti_air_shoulder_equipment_3_desc: "An improved MANPADS incorporating design improvements to both the rocket and warhead to increase velocity and damage, respectively, along with aircraft signature tracing."

