 ### Ideas ###
 SAU_Islamic_Revolution:0 "The Islamic Revolution"
 SAU_Islamic_Revolution_desc:0 "The first victory in our holy war against the West was secured when, with Allah’s blessing, our forces toppled the decadent Saudis and the Italian swine pulling their strings. Now, it falls upon our fellow brothers of the faith to rise up and join our righteous campaign against the Western devils. Allah willing, they will come, and Good shall triumph over Evil.\n\n"Permission to fight is given to those who are fought against, because they have been wronged, and surely, Allah is Able to give them victory". (Quran 22:39)"
 SAU_Saudi_Resistance:0 "Saudi Resistance"
 SAU_Saudi_Resistance_desc:0 "Before the Revolution, the insidious hooks of Western decadence were deeply entrenched in the minds of our countrymen, leading them to reject Allah’s compassionate, merciful cause. Brute force alone has proven largely ineffective in reversing this Jewish brainwashing — in fact, our methods seem to have earned us far more enemies than friends.\n\nCells of armed resistance, no doubt bolstered by the Israeli Mossad, have cropped up all across our territory to defy our mandates. These infidels must be crushed with unforgiving force. Should these rats be allowed to establish a foothold within our lands, the consequences could be dire...\n\n“Prophet! Rouse the believers to wage war. If there are twenty amongst you, patient and persevering, they will subdue two hundred: if a hundred, they will subdue a thousand of the disbelievers: for these are a people without understanding”. (Quran 8:65)"
 SAU_Kafir_Problem:0 "The Kafir Problem"
 SAU_Kafir_Problem_desc:0 "Be it the failed Crusades or the vain colonial ventures of the British, French, and Italians, the cursed Kafirs — those haughty fools who deny Allah’s divine authority — have done everything in their power to slaughter our people, ravage our cities, and annihilate our humble way of life.\n\nThe Quran is clear — we must drive back the Kafir horde and remind these satanic infidels of their rightful place. The nonbelievers shall pay for their arrogance in storms of fire and rivers of blood.\n\n“Permission to take up arms is hereby given to those who are attacked because they have been oppressed – Allah indeed has the power to grant them victory – those who have been unjustly driven from their homes, only because they said: ‘Our Lord is Allah’”. (Quran 22:39-40)"