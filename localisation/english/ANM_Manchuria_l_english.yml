 MAN_communist_party_long: "Northeast Anti-Japanese United Army"

 MAN_Masashi_Ishibashi: "Masashi Ishibashi"

 POLITICS_SEJIMA_RYUZO_DESC: "Sejima Ryūzō's rule of Manchukuo, the Crown Jewel of the Empire of Japan, has been turbulent at best. Following Puyi's death in 1967, Sejima came up on top in the power struggle for leadership and abolished the Monarchy, removing the last semblance of legitimacy for Manchukuo. He built up the Military-Industrial Complex of the country with high efficiency, purging the Concordia Association in the process, effecting ruling Manchuria as a military dictator. \n\nSejima's work was cut short with the Great Asian War, as he witnessed Morita switching sides to the traitors in Nanjing to preserve his fiefdom in Guangzhou, along with the Republic of China gaining its independence after a bloody war which tore apart Asia. Unlike the rat Morita, Sejima will never be a traitor to Japan, and he will do his utmost to ensure Manchukuo will remain a loyal subject in defending Tokyo's interests against the backstabbers in Nanjing or the Bolsheviks in Moscow."
 
 MAN_Problem_Of_NAJUA: "The Thorn of the Northern Bandits"
 MAN_Problem_Of_NAJUA_desc: "Bandits in the Manchurian countryside, or officially the Northeast Anti-Japanese United Army, are a Communist insurgent army wrecking havoc on our military forces in a bid to unlawfully unite with the Republic of China. Although the partisan attacks had largely subsided during the 1950s, they have once again sprung up due to the funding and support of the resurgent Soviet Union and China. Therefore, should any political crises flare up in Tokyo, the northern bandits are sure to take advantage of the situation.."

 MAN_Chained_To_Japan: "The Rising Sun’s Rays, Inescapable"
 MAN_Chained_To_Japan_desc: "The backstabbing and rebelling of Nanjing has once again left Manchukuo in the frontlines against an antagonistic China and the Soviet Union, much like 60 years ago. As such, the Kwantung army has once more been armed to the teeth, the factories of Manchuria continue to slave away to produce industrial and military equipment for its masters in Japan, and the Manchurian railways continue to be under the exclusive control of Mantetsu. We are but a mere colony in all but name, for Japan to siphon its resources and act as a meat shield to protect Chōsen."

 MAN_A_Horseshoe_Of_Contradictions: "A Horseshoe of Contradictions"
 MAN_A_Horseshoe_Of_Contradictions_desc: "From the paramilitary clashes in Weimar Germany, to Adolf Hitler’s Mein Kampf calling for the extermination of Bolshevism, along with the countless German-Soviet wars, it is safe to assume that Fascism and Communism are polar opposites that can never reconcile.\n\nNevertheless, Manchukuo’s leaders have disregarded petty ideological squabbles to create a Frankenstein-esque state. Wada Hiro and Katsumata Seiichi, men who were implicated in the 1941 Planning Institute Incident designed to reduce Marxist influence in Japan, were exiled to Manchuria in the 50s.\n\nIt was Katsumata who eventually rose up to the role of Sōmucho Director-General following the failures of Sakomizu Hisatsune during the Oil crisis. It is Manchukuo where economic planning, Five Year Plans strikingly similar to its northern neighbour, corporate exploitations and Japan’s ‘civilising’ mission of the natives intertwine to form a state of contradictions."

 MAN_Nissans_Playground: "Nissan’s Playground"
 MAN_Nissans_Playground_desc: "The failure of the Corporate experiment in Kōshu has cemented Manchukuo as the one and only loyal servant to project Japanese business interests internationally. Meanwhile, Morita has proven how being soft to the locals will eventually bite. Many of his compatriots, especially his sidekick Li Ka-shing, possessed zero loyalty to the Empire of Japan and its ambitions abroad, instead defecting to the traitorous Nanjing the first chance they could.\n\nTherefore, Nissan, the sole kingmaker of Manchuria, continues to ruthlessly exploit the native population in order to maximise profits and keep rebellion to a minimum. An overworked and exhausted worker is one that will not rebel against the ideals of Pan-Asianism. As such, the Yin of Morita’s humanisitic capitalism has resulted in the Yang of Nissan’s further exploitation of Manchuria."
 
 WORLD.18189.t: "The NAJUA Rises Up again in Manchukuo!"
 WORLD.18189.desc: "On 0500 hours this morning, the Northeast Anti-Japanese United Army, or NAJUA for short, has declared a liberation war in Manchuria to free the territory from Japanese imperialism. Following the victory of the USSR in the German-Soviet War, Moskva has begun funding and equiping the armies of the NAJUA in hopes of reclaiming Outer Manchuria and reclaim its Far Eastern warm water port. \n\nMoskva has reacted positively to this news, commenting that the long oppressed peoples of Manchuria have finally had enough of Japanese oppression, while Tokyo has condemned this blatant interference of Sphere affairs."
 WORLD.18189.a: "Will Tokyo's Hegemony in Asia finally collapse?"

 WORLD.18190.t: "Manchukuo and Japan prevail in the NAJUA war!"
 WORLD.18190.desc: "As the dust settles on Manchukuo and the last partisan cells have been eradicated, Tokyo has announced that the traitorous units within Manchuria have at last been eliminated. While the NAJUA had the element of surprise and initially had momentum, the trained and professional Manchukuo army with its Kwantung Army counterparts proved too much to match for the partisans. Modern tanks and aircraft easily dispersed the determined freedom fighters, and many NAJUA units have fled across the border to the USSR. \n\nIt appears the spirit of Pan-Asianism will not be shattered anytime soon."
 WORLD.18190.a: "Japanese domination in all of Manchuria, lasting forever more."

 WORLD.18191.t: "The NAJUA prevails in Manchuria!"
 WORLD.18191.desc: "As the dust settles on Manchuria, the Northeast Anti-Japanese United Army has achieved a surprise victory over the technologically superior Kwantung Armies. Taking advantage of their initial momentum and popularity among the peoples of Outer Manchuria, who have never stopped identifying as Russian or Chinese even after decades of Japanese occupation, the NAJUA easily dispatched the distraught collaborator forces and marched into Khabarovsk victorious, ending Manchukuo's occupation of Outer Manchuria and Japan's buffer with the USSR. \n\nMoskva has congratulated the brave partisans for their efforts in reversing the humiliations of World War Two. Meanwhile, Tokyo has condemned this blatant act of invasion of its fellow Sphere member, and vows to enact revenge."
 WORLD.18191.a: "The victorious Red Army marches on."

