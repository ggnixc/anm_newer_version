 MAN_Masashi_Ishibashi: "Masashi Ishibashi"

 POLITICS_SEJIMA_RYUZO_DESC: "Sejima Ryūzō's rule of Manchukuo, the Crown Jewel of the Empire of Japan, has been turbulent at best. Following Puyi's death in 1967, Sejima came up on top in the power struggle for leadership and abolished the Monarchy, removing the last semblance of legitimacy for Manchukuo. He built up the Military-Industrial Complex of the country with high efficiency, purging the Concordia Association in the process, effecting ruling Manchuria as a military dictator. \n\nSejima's work was cut short with the Great Asian War, as he witnessed Morita switching sides to the traitors in Nanjing to preserve his fiefdom in Guangzhou, along with the Republic of China gaining its independence after a bloody war which tore apart Asia. Unlike the rat Morita, Sejima will never be a traitor to Japan, and he will do his utmost to ensure Manchukuo will remain a loyal subject in defending Tokyo's interests against the backstabbers in Nanjing or the Bolsheviks in Moscow."
 
 MAN_Problem_Of_NAJUA: "The Problem of the NAJUA"
 MAN_Problem_Of_NAJUA_desc: "The NAJUA, or Northeast Anti-Japanese United Army, is a Communist Insurgent Army operating in the Countryside of Manchuria, wrecking havoc on our military forces in a bid to unite with China. Although the partisan attacks had largely subsided during the 50s and 60s, they have once again sprung up due to the funding and support of the Resurgent USSR and China following the Chinese-leaning Ceasefire in the Great Asian War. Therefore, should any political crises flare up in Tokyo, the NAJUA are sure to take advantage of the situation.."

 MAN_Chained_To_Japan: "Chained to Japan"
 MAN_Chained_To_Japan_desc: "The backstabbing and rebelling of the RGOC has once again left Manchukuo in the frontlines against an antagonistic China and the Soviet Union, much like 60 years ago. As such, the Kwantung army has once more been armed to the teeth, the factories of Manchuria continue to slave away to produce industrial and military equipment for its masters in Japan, and the Manchurian railways continue to be under the exclusive control of Mantetsu. We are but a mere colony in all but name, for Japan to siphon its resources and act as a Meat Shield to protect Chōsen."

 WORLD.18189.t: "The NAJUA Rises Up again in Manchukuo!"
 WORLD.18189.desc: "On 0500 hours this morning, the Northeast Anti-Japanese United Army, or NAJUA for short, has declared a liberation war in Manchuria to free the territory from Japanese imperialism, citing the works of the long deceased Chinese Revolutionary, Mao Zedong. Following the 1998 Asian financial crisis, Tokyo has been left paralysed with its economy screeching to a standstill. Thus, the NAJUA has taken full advantage of this fact and with the help of the USSR and China, declared that the so-called 'Pan Asian Unity' will be driven out from all of China at last. \n\nBoth Moskva and Nanjing have reacted positively to this news, commenting that the long oppressed peoples of Manchuria have finally had enough of Japanese oppression, while Tokyo has condemned this blatant interference of Sphere affairs."
 WORLD.18189.a: "Will Tokyo's Hegemony in Asia finally collapse?"

 WORLD.18190.t: "Manchukuo and Japan prevail in the NAJUA war!"
 WORLD.18190.desc: "As the dust settles on Manchukuo and the last partisan cells have been eradicated, Tokyo has announced that the traitorous units within Manchuria have at last been eliminated. While the NAJUA had the element of surprise and initially had momentum, the trained and professional Manchukuo army with its Kwantung Army counterparts proved too much to match for the partisans. Modern tanks and aircraft easily dispersed the determined freedom fighters, and many NAJUA units have fled across the borders to the USSR or China itself. It appears Pan-Asianism has had its last stand, and will not be broken anytime soon."
 WORLD.18190.a: "Japanese domination in Manchukuo, lasting forever more."

 WORLD.18191.t: "The NAJUA prevails in Manchuria!"
 WORLD.18191.desc: "As the dust settles on Manchuria, the Northeast Anti-Japanese United Army has achieved a surprise victory over the technologically superior Manchurian and Kwantung Armies. Taking advantage of their initial momentum and popularity among the peoples of Manchuria, who have never stopped identifying as Chinese even after 65 years of Japanese occupation, the NAJUA easily dispatched the distraught collaborator forces and marched into Xinjing victorious, ending the Manchukuo experiment and Japan's grand dreams of Pan-Asianism. Japan's economic crisis can only go further South from here. \n\nOn the other hand, representatives from Nanjing and the NAJUA have proposed a summit in Beijing with the participation of the USSR, with the intention to line out conditions of the reintegration of Manchuria into mainland China, at last righting the wrong that was inflicted in 1931."
 WORLD.18191.a: "The Chinese nation, long divided, must unite once more."

