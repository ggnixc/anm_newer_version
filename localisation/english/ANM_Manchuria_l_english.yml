 POLITICS_SEJIMA_RYUZO_DESC:0 "Sejima Ryūzō's rule of Manchukuo, the Crown Jewel of the Empire of Japan, has been turbulent at best. Following Puyi's death in 1967, Sejima came up on top in the power struggle for leadership and abolished the Monarchy, removing the last semblance of legitimacy for Manchukuo. He built up the Military-Industrial Complex of the country with high efficiency, purging the Concordia Association in the process, effecting ruling Manchuria as a military dictator. \n\nSejima's work was cut short with the Great Asian War, as he witnessed Morita switching sides to the traitors in Nanjing to preserve his fiefdom in Guangzhou, along with the Republic of China gaining its independence after a bloody war which tore apart Asia. Unlike the rat Morita, Sejima will never be a traitor to Japan, and he will do his utmost to ensure Manchukuo will remain a loyal subject in defending Tokyo's interests against the backstabbers in Nanjing or the Bolsheviks in Moscow."
 
 MAN_Problem_Of_NAJUA:0 "The Problem of the NAJUA"
 MAN_Problem_Of_NAJUA_desc:0 "The NAJUA, or Northeast Anti-Japanese United Army, is a Communist Insurgent Army operating in the Countryside of Manchuria, wrecking havoc on our military forces in a bid to unite with China. Although the partisan attacks had largely subsided during the 50s and 60s, they have once again sprung up due to the funding and support of the Resurgent USSR and China following the Chinese-leaning Ceasefire in the Great Asian War. Therefore, should any political crises flare up in Tokyo, the NAJUA are sure to take advantage of the situation.."

 MAN_Chained_To_Japan:0 "Chained to Japan"
 MAN_Chained_To_Japan_desc:0 "The backstabbing and rebelling of the RGOC has once again left Manchukuo in the frontlines against an antagonistic China and the Soviet Union, much like 60 years ago. As such, the Kwantung army has once more been armed to the teeth, the factories of Manchuria continue to slave away to produce industrial and military equipment for its masters in Japan, and the Manchurian railways continue to be under the exclusive control of Mantetsu. We are but a mere colony in all but name, for Japan to siphon its resources and act as a Meat Shield to protect Chōsen."