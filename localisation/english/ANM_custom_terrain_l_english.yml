 mauritius: "Mauritius-Stadt"
 mauritius_desc: "§YMauritius-Stadt§! is the result of an ambitious city-planning project following the establishment of the Sonderwirtschaftszone Mauritius. After years of endless construction and many frustrating delays, the old city of Port Louis has evolved into Mauritius-Stadt, a rapidly expanding metropolis on the shores of the Indian Ocean."
