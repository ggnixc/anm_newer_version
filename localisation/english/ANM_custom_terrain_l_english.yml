 ### Cities
 berlin: "Germania"
 berlin_desc: "Germania is the center of Germany, Europe and the world. Besides the commerce-focused Frankfurt, the maritime Hamburg or the industrial Ruhr area, Germania, once known as Berlin, serves as the political and cultural capital."
 la: "Los Angeles"
 la_desc: "City of Angels§! as the Spanish used to call it, §YLos Angeles§! is the biggest city on the West Coast and boasts the second largest populus, rivaling that of §RNew York City's.§!"
 laport: "Port of Los Angeles"
 laport_desc: "Acquired from the Americans during the peace negotiations, the ports of San Francisco and Los Angeles serve as forward bases for the Japanese Navy and are a show of Japanese might. Many Americans detest its existence, calling it a sign of weakness. While some demand the United States take action and reclaim it, their pleas fall deaf, §Rfor now.§! §YPerhaps one day, a President bold enough may take back the ports, or possibly even more.§!"
 sanfran: "San Francisco"
 sanfran_desc: "§YSan Francisco§!, or as the young ones call it: "San Fran§!," is the second largest city around the West Coast area. What it lacks in population, it makes up for in density. San Francisco is the second most densely packed city, only comparable to the §RBig Apple§! itself."
 sanfranport: "Port of San Francisco"
 sanfranport_desc: "Acquired from the Americans during the peace negotiations, the ports of San Francisco and Los Angeles serve as forward bases for the Japanese Navy and are a show of Japanese might. Many Americans detest its existence, calling it a sign of weakness. While some demand the United States take action and reclaim it, their pleas fall deaf, §Rfor now.§! §YPerhaps one day, a President bold enough may take back the ports, or possibly even more.§!"
 nyc: "New York City"
 nyc_desc: "The very definition of a city that never sleeps, New York City is the fruit of the labor of generations of hardworking individuals, with an astounding amount of commerce passing through it each and every day. First settled by the Dutch in 1624 as New Amsterdam, it changed hands over the centuries and now stands as a proud bastion of American freedoms, exemplified by the Statue of Liberty in its harbor. Countless different cultures have taken root in the city, long a relative safe haven for oppressed peoples from all over the world from tyranny in their distant homelands. Equally attractive as the open mindedness of the city, however, are its open markets, being one of the premier centers of international business and finance as well as the greatest display of American economic might. There’s always something to do in New York City for any person willing to pay the right price."
 rome: "Roma"
 rome_desc: "Rome, the Eternal City, stands as the jewel of the Mediterranean and the capital of the Italian Empire. Founded millennia ago by Romulus on the banks of the Tiber, few cities- if any- can claim such an expansive history. Indeed, there's not an inch of the city that isn't rich with the legacy of the Roman Empire, the pride of Italian history. Despite the invasions, plagues, and misfortunes that have fallen on the city before, Rome has always emerged from the rubble, ready to rebuild- and, in doing so, has cemented its place as the center of Italy. It is here where the King, the Pope, and the Duce stay, and it is here that the Italian government sits, along with artists, culinary geniuses, and romantics from across the world. Make no mistake- Rome has survived thousands of years before, and- barring the apocalypse- it will survive thousands of years more."
 madrid: "Madrid"
 madrid_desc: "Previously devastated by over two years under siege during the Spanish Civil War, Madrid has recovered to become the largest and wealthiest city in Iberia. The unique and varied designs of Madrid's "Gran Vía" is admired by architects and artists the world over. Most of the country's brightest minds attend university here, nearly all Iberian films are produced here, and most of Iberia's largest companies are headquarted here. destination in the country. As Iberians increasingly choose to leave the countryside for the city, tens of thousands move to Madrid every year, this rapid expansion has made Madrid into one of the single largest cities in Europe--and there are no signs that this growth is slowing down."
