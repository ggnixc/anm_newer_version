 quito: "Quito"
 bogota: "Bogota"
 telaviv: "Tel Aviv"
 telaviv_desc: "Tel Aviv§! is the Hebrew title of Theodor Herzl's Altneuland. Although founded in 1909 as a small settlement on the sand dunes north of Jaffa, one of the oldest port cities in the world, Tel Aviv was envisaged as a future city from the start. The third aliyah in 1918–1923 brought many immigrants to then small community, and from 1921 onwards, the development of Tel Aviv increased. In 1921, Tel Aviv was declared a local authority by the British authorities and Meir Dizengoff became the first mayor. In 1924, the fourth aliyah began, which brought merchants and business owners to Tel Aviv. Cultural life flourished: theaters were established, including Ohel and Habima. Writers and poets also arrived to Tel Aviv from its early years: Ahad Ha'am, Bialik, Uri Zvi Greenberg and Shlonsky. On January 12, 1934, Tel Aviv was declared a city, and at that time a historic complex of buildings was created, which is collectively called the "White City": more than 4,000 buildings associated with the International Style in architecture. Tel Aviv then annexed neighboring Jaffa, on the orders of the Italian government in the 1950s to reduce bureaucracy and improve management in the metropolitan area. After almost all of Tel Aviv's land reserves were depleted, the trend of high-rise construction began in the 1980s, which intensified in the 1990s. Today, Tel Aviv is a metropolis that is the center of Israel's politics, economy, culture, media and art."
 rodomo: "Rodomo"
 rodomo_desc: "The word §xRodomo§! evokes images of unspeakable horrors and unimaginable suffering across the world, as it once served as the centre of the Burgundian industrial concentration camp system. Rodomo is more of a gigantic slum than a true city, where the masses of the poor dwell in the brutalist, concrete ruins of their former prisons."
