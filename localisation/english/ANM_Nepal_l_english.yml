 ## Names ##
 NEP_Sher_Bahadur_Deuba: "Sher Bahadur Deuba"
 POLITICS_SHER_BAHADUR_DEUBA_DESC: "Commonly referred to as the Lion of Nepal by friends and enemies alike, Sher Bahadur Deuba is the image of the modern Nepalese nation. Born to an impoverished family in Nepal, it would take quite a while for Mr. Deuba to enter Nepalese politics. But when he finally did, he would dominate attention like the lion did to the jungle.\n\nJoining the Nepali Congress Party in 1972, he would go on to become a staunch opponent of the absolutist monarchy that governed Nepal, fiercely protesting against it.\n\nJailed from 1962 to 1971, Deuba’s work against the monarchy would pay off in 1986, when the aftershocks of the Great Asian War would lead to the collapse of the monarchy and the election of the Nepali Congress Party. Nepal has seen a turbulent political climate since, with Deuba himself being elected to the post of Prime Minister in 1993.\n\nDeadlocked in parliament by conservative reactionaries and quickly losing ground to more popular Maoist rebels, the Lion of Nepal must quickly act to save his party and his country from imminent disaster."