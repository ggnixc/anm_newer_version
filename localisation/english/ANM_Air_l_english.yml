 ### LEADER DESC ###
 POLITICS_UMARU_IBN_UMARU_DESC:0 "Sultan Umaru Ibrahim Umaru has lived his life in the sweltering heat of the Sahara. He rules a hopeless nation that only just rebuilt the villages that fell during the German bombings. The scars of thousands of deaths left their marks on the society of Tuaregs that live in his nation. Nomadic life became prevalent, and hope to settle Air was set back by decades, but hope is not lost.\n\nThe German civil war ended the bombings of Africa. Umaru's father, Ibrahim Umaru, united the Tuaregs into the reborn Sultanate of Air, bringing a modicum of stability to the region. With little authority outside of the Sultan, the traveling council was established, with nine months out of the year spent settling disputes across the vast territory.\n\nWhen his father passed, the tradition lived on with Umaru Ibrahim. Three months of the year, he would administer his capital city and go on international trips worldwide. The other nine months, from October to May, he would spend traveling in his nation, attempting to unify it and bring stability to the outlying regions of his country.\n\nThis objectively terrible method of ruling his nation has made the Sultan weary, and he longs for a more stable method to rule. His father's legacy was banning slavery in Air, an unpopular move that ended one of humankind's worst institutions. A near-impossible legacy to surpass, but the Sultan has a plan."
