 ## Descriptions ##
 POLITICS_JIM_WALLACE_DESC: "Shetland’s First Prime Minister since Independence is, ironically enough, someone born on the British Mainland. Born in “Occupied Britain” in Southern Scotland, Wallace was only a teenager when the British Civil War broke out, and his family fled to the Shetlands for Safety. Despite not being a native Shetlander, he became interested in Shetland Politics and joined the Independent Liberal Party in the late 70s, which called for greater autonomy for the Islands. Wallace was at the forefront of the Autonomy Movement and even sued the Canadian Government to try to force their hand on autonomy.\n\nHe became leader of the ILP in 1984, and when the Shetlands became a Crown Dependency the following year, the ILP became the largest party in the Island's first national elections. Since 1985, he has led the Islands as their Prime Minister. He has become immensely popular thanks to his Bipartisan Nature, successful push for Oil Exploration around the Shetlands and promoting Shetland's Unique Culture. He has also made strides in uniting the Native Shetlanders, British Refugees and Norwegian Refugee Populations on the Islands.\n\nBeyond anything else, Wallace and everyone in the Shetlands are determined to keep the light of British Freedom and Liberty Alight, even as Great Britain chaffs under Fascist Rule."


### Ideas ###
 SHL_Last_Free_Soil: "The Last Free Soil of Britain"
 SHL_Last_Free_Soil_desc: "As the British Mainland fell during Operation Sealion, the Shetlands were the only part of Britain not occupied by the Wehrmacht. Thanks to fleeing British Marines and Naval Ships, the Islands were secured while the Reich tried to establish their hold on Great Britain and was put under Canadian Administration before becoming a Crown Dependency in 1985.\n\nThe Islands have turned into a strong symbol of British Freedom and Resistance, becoming a Hub for British Refugees fleeing the tyrannical Collab Government and a Haven for Resistance Fighters. While this has caused tensions with the Tracy Regime in London, the Shetlands refuse to bow to Bootlickers and will keep the light of liberty aflame for as long as Britain is occupied."
 SHL_Newfound_Autonomy: "Newfound Autonomy"
 SHL_Newfound_Autonomy_desc: "Since the fall of the British Empire after Operation Sealion, the Shetlands were occupied by Canadian troops and directly ruled from Ottawa. While some autonomy was granted to the newly established Shetland Islands Council, in many ways, the Islands were treated exactly as they were before WWII.\n\nThis led to resentment among Shetlanders, who felt like a Colony under the faraway Canadian Administration. In the aftermath of the Icelandic Crisis, the Canadian government realised the threat of Shetlanders potentially breaking away from Canada and the OFN. Ottawa finally began granting more autonomy to the Islands over the 70s and 80s before granting the Shetlands Crown Dependency Status in 1985. This allowed the Shetlands a new National Parliament, Prime Minister and control over its own domestic issues."
 SHL_Battle_For_Oil: "The Battle for Oil"
 SHL_Battle_For_Oil_desc: "The Oil Crisis sent national economies into freefall, so when Oil was discovered in the North Sea in the Mid ‘70s, there was a scrabble over the Oil Reserves. While most of the Oil Fields lie in the Europakt’s territorial waters, the Shetlands were able to allow the OFN to tap into the reserves within its waters.\n\nThe tense relations between the OFN and Europakt have resulted in incidents between the Royal Navy and the Kriegsmarine. The most notable was the ramming of the SMS Hannes Gessner by the HMS Lerwick in 1982. This has led to a Flotilla of Royal Navy Ships to be stationed in the Shetlands and Faores in order to protect the Shetland Oil Rigs from an Europakt interference and helps serve as a symbol of defiance against the Nazi Empire."
