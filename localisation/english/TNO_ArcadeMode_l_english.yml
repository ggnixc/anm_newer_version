 ArcadeMode.2.t: "[Get_newspaper_header]Tortorelli Wins Uruguayan Elections!"
 ArcadeMode.2.desc: "Concerning news from Montevideo: Domingo Tortorelli and the Concordancia Laboral have won the recent Uruguayan special elections.\n\nTortorelli's mostly senseless proposals, such as placing two-hundred cinema halls in every neighborhood and redeveloping an Uruguayan valley into a carbon-copy of Venice, have captivated the Uruguayan imagination, securing the support of no less than 51 voters, enough to annihilate every opposition candidate.\n\nSome think that Tortorelli may have strange and dark connections lying behind his apparently inoffensive proposals, but experts are unanimous that such assertions are just rumors. What is more substantive, in the words of Luis Batlle Berres, is that "some motherfucker is screwing around" with the people of Uruguay. To be more exact..."
 ArcadeMode.2.a: "...some prick's been fiddling around with the bloody console!"

 ArcadeMode.7.t: "[Get_newspaper_header]Barrios Elected in Uruguay"
 ArcadeMode.7.desc: "Bizarre news from Montevideo: Pilar Barrios and the Black Indigenous Party have won the recent Uruguayan special elections.\n\nWhile the "Switzerland of America" is world-renowned as a progressive state, the reality of the situation is that the condition of the Afro-Uruguayans is one of the blind spots in the system. The recent decision of the government to demolish the conventillo Mediomundo and kick off its black population proved controversial enough so as to cause a deeper understanding of the Afro-Uruguayans situation, leading to the refunding of the PAN.\n\nBarrios, inexplicably for foreign observers, has been able to convince a people otherwise proud of "coming from the boats" into supporting him; something conspiracy theorists have blamed on the strange "wololo" noises reported."
 ArcadeMode.7.a: "Stop smoking ANCAP cigarettes!!!"

