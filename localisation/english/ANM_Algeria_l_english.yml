 ## Descriptions ##
 POLITICS_MOHAMED_BOUDIAF_DESC: "President\n--------------\n"
 ALG_Kasdi_Merbah_hog_desc: "Vice President\n§sSocial Nationalism§!\n--------------\nKasdi Merbah is perhaps one of the most infamous Algerian politicians of the 20th century. Born in Northern Algeria in the Tizi-Ouzou Commune, he proved to be a good student and joined the General Union of Algerian Muslim Students to protest for Algerian freedom. It was not long before this journey led to him becoming a member of the FLN and its militant wing the ALN.\n\nAfter rising through the ranks, he was appointed head of the first troop of Algerian intelligence officers, the Sécurité Militaire, and made head of intelligence and counter espionage efforts. His expert administration of this organisation, which would soon grow into the infamous Department of Intelligence and Security (DRS) and his success in turning it into a loyal instrument of the party earned him both the respect and fear of his colleagues in the FLN.\n\nAfter Boudiaf's rise to power in Algeria, his veteran party credentials and orthodox views made him the natural choice for the second in command, a role in which he proved generally competent. His influence within the party and the intelligence services has seen him become the second most powerful man in Algeria, making him the clear frontrunner to succeed an ageing Boudiaf."
 ALG_Mohamed_Yahiaoui_sec_desc:  "Minister of Defense\n§qRevolutionary Statism§!\n--------------\nFor any revolution to succeed, there must be those willing to fight and to die for it. In Algeria, that responsibility falls to the Algerian military and the Defence Minister, Mohamed Salah Yahiaoui. Joining the resistance movement at the age of 20, he fought to liberate his homeland against French rule.\n\nFollowing the successful conclusion of the rebellion, he joined the newly formed Algerian Army and was made the commander of the 3rd military District in 1966 and promoted to the rank of Colonel in 1969. He was then sent to the Republic of Hindustan as part of an officer training program, where he learned crucial lessons that he would also apply to the Algerian military when he returned. He also went on to build deep connections among the military to secure his influence.\n\nAppointed Defence Minister in 1977, he now serves as the sword and shield of Algeria, ready to defend the nation against enemies foreign but also domestic, should he feel the need to act."
 ALG_Mohammed_Benyahia_for_desc: "Minister of Foreign Affairs\n§VLeft-Wing Nationalism§!\n--------------\nSeddik Ben Yah was, from his days as a student, a champion of a free Algeria. Fervently nationalistic, he joined the resistance movement against France at a young age to fight for Algerian independence. After joining the FLN following the revolution, he quickly rose through the ranks of the Foreign Ministry, being appointed Ambassador to the Republic of Hindustan.\n\nAfter serving there, he returned to Algeria and was appointed Foreign Minister by President Boudiaf, becoming one of the youngest politicians in Algeria. A staunch left-wing presence in the administration, he is supported by the left wing of the FLN as well as FFS as a possible successor to the ageing Boudiaf, to finally bring revolutionary socialism to Algeria."
 ALG_Ali_Laskri_eco_desc: "Minister of Labor\n§VLeft-Wing Nationalism§!\n--------------\nEven within the FLN Presidency, there is one role always kept for a representative of the workers; the Labor Ministry. Currently this position belongs to Ali Laskri, a rising star within the Socialist Party and the nascent unions of Algeria. Born in the commune of Chabet el Ameur, Laskri went on to achieve a diploma in management and administration sciences before joining the Socialist Party of Algeria.\n\nFrom there he rose through the ranks, serving as a legislator in multiple Parliaments and seeing the early stages of the revolution in Algeria. After the ascendancy of Muhammad Boudiaf to the Presidency, he was seen as the perfect link between the unions and the state and was thus appointed to the Labor Ministry to serve as a representative of the unions to the state."

 ### Ideas ###
 ALG_Little_Brother: "Little Brother in the West"
 ALG_Little_Brother_desc: "Ever since the beginning of Algeria’s national revolution, one nation has been a consistent benefactor and patron, the Republic of Hindustan. Providing the armaments and political support necessary to liberate themselves from the French, the Indian nation has been the primary inspiration of many of Algeria’s institutions, while the FLN aspires to construct the political model of the HSS.\n\nWith the relationship extending far past the revolutionary war, Algeria has become an earnest partner of the Kolkata regime, aiding in Hindustani intelligence operations, educating its bureaucracy in India, while Algerian officers train under the command of Hindustani advisors. This relationship, albeit a unique one, is a fundamental concept of the modern Algerian nation, and is unlikely to go away soon."
 ALG_Gateway: "Gateway of the Revolutionary Axis"
 ALG_Gateway_desc: "Ever since independence, Algeria has become a regional and international beacon for the emerging subaltern revolution. Expanding on the Cameroonian networks used to smuggle in aid, Algeria’s connections to Ghana and Cameroon have been strengthened resolutely following the renovation of the Trans-Saharan Railway, a method used to better oppress the Africans of West Africa now turned into the primary railroad for the revolutionary axis.\n\nThrough its contacts in West Africa and its partnership with Hindustan, Algeria has become a torchbearer for the Arab world, acting as an active sponsor and patron in revolutionary movements in Italian and Turkish client regimes, especially the Dusturi in Tunisia and the Ila al-Amam in Morocco ,and  also to the Arab Ba’ath Party, the Arab Socialist Union, and the Yemeni Liberation Front. As long as the spark of revolution lives on in the Mashriq, Algeria will be there to actively light it."
 ALG_Enlightened_Ummah: "The Enlightened Ummah"
 ALG_Enlightened_Ummah_desc: "Heightened by its propaganda and stature in the Arab world, Algeria, in the eyes of many Arabs, has become a shining example of the Arab nation, alongside Egypt and Palestine.  Although a fundamentally undemocratic state, the quality of living and standard set within Algeria is close to that of the Gulf monarchies, while the state remains secular, allowing for the suffrage and emancipation of women, and the relatively gentle treatment of ethnic minorities.\n\nThis relatively relaxed social environment has also led to Algeria becoming a migration hub for increasingly marginalized scientists, technicians and engineers. Algerian universities have flourished because of the increased migration, while also entertaining a plethora of politically heterodox thinkers from across the Arab world, so long as they do not conflict with the FLN’s party line. As West Asia and Northern Africa  continue to choke on the tightened grip of the three major powers, Algeria remains an example of what could be, especially after the process of national liberation and revolution."