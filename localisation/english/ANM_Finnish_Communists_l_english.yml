 #Leaders
 FDR_Yrjo_Hakanen: "Yrjö Hakanen"
 POLITICS_YRJO_HAKANEN_DESC: "Yrjö Hakanen, the voice of the Finnish workers, the lower class and ultimately, the Finnish communists is one of the most influential figures in Finnish politics. Hakanen was born in Helsinki in 1952 to a middle class family, whose parents were architects. His family was mostly politically unaffiliated, but he fraternised with various radical left wing groups during the 1960s. \n\nCommunism in Finland started to rise due to the Finnish distrust in the government, which had passed several right-wing reforms during the 1970s. As such, Hakanen joined the illegal Communist Party of Finland during that period. Hakanen wrote for the Kansan Uutiset newspaper during the late 1970s, which further enticed the ideas of Socialism to the Finnish youth. Afterwards, he graduated from college in 1982, which gave him the opportunity to focus more on his political career. Hakanen was featured several times on public television, and was therefore a very controversial figure in Finland due to this pro-Soviet alignment. Thus, Hakanen was often harassed in his private life, and had to hide from the paparazzis and angry Finns who branded him as a traitor. \n\nThe controversial legislature passed by the Finnish Government to adopt Germany's Euromark as the national currency was the last straw for the SKP. German imperialism in Finland had to end, right here and now. Therefore, the SKP and Hakanen once more fanned the flames of revolution in the Nordic state, hoping to reverse the fortunes of the first failed revolution of 1918."

 #Events
 FIN.red.1.t: "Commies Win in Finland"
 FIN.red.1.desc: "The Soviets get an upper hand"
 FIN.red.1.a: "SKP Victory"

 WORLD.18187.t: "Communist Victory in the Finnish Civil War"
 WORLD.18187.desc: "The unthinkable has occurred. Finland, which has been a Northern Bulwark against the Soviet Union and a steadfast German ally since the days of 1918, has been upended by the Communist Revolutionaries. It appears that the fate of the First Civil War has been reversed, and the workers of Finland have had their last laugh. \n\nTaking advantage of poor economic management with the adoption of the Euromark, the lowering of workers' rights and government actions against the Trade Unions, the Revolutionary Front of the Democratic Republic of Finland has proclaimed victory against its bourgeois enemies and their fascist masters, with assistance from the Soviet Union. Germania has condemned the blatant violation of sovereignty of a Europäische Pakt ally, and vows to commit revenge for such a heinous act, while Moscow has extended its congratulations."
 WORLD.18187.a: "How long will the German European order last?"