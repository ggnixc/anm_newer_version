 #Concordato di Parma
 TRI_Founder_IT: "Concordato di Parma Founder" #use as new ITA sphere for ANM
 TRI_Founder_IT_effect: "[!Concordato_di_Parma_Founder]"
 TRI_Founder_IT_desc: "Founded after the collapse of the Triumvirate in 1962, the Concordato di Parma serves as a faction for Italy's interests first and foremost. It is made up of members directly in Italy's sphere of influence, be it satellites, autonomous regions or willing members. Despite the Oil Crisis and collapse of large parts of the Italian Colonial Empire, the CDP is still a significant player in Mediterranean and European Affairs."

 TRI_Member: "Concordato di Parma Member" #use as new ITA sphere for ANM
 TRI_Member_effect: "[!Concordato_di_Parma_Member]"
 TRI_Member_desc: "This nation is part of the Concordato di Parma, and is allied with Italy in foreign affairs in order to counter German and Turkish Imperialism and Aggression, safeguarding peace and prosperity in the Mediterranean."

 TRI_Member_Client: "Concordato di Parma Satellite" #use as new ITA sphere for ANM
 TRI_Member_Client_effect: "[!Concordato_di_Parma_Satellite]"
 TRI_Member_Client_desc: "This nation is a Satellite State in the Concordato di Parma. Its Foreign Affairs are controlled by Italy as a result, and they will have to take a stand with their Suzerain in International Affairs."

 TRI_Observer: "Concordato di Parma Observer" #use as new ITA sphere for ANM
 TRI_Observer_effect: "[!Concordato_di_Parma_Observer]"
 TRI_Observer_desc: "GDP Growth Boost: §Y2%§!\n\nA state that is potentially interested in fully joining the Concordate, a country like this usually has strong ties with another member of the alliance or Italy proper, and as a result it may one day become a fully-fledged companion of the Concordate."