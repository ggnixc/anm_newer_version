 #Patto di Roma
 TRI_Founder_IT: "Patto di Roma Founder" #use as new ITA sphere for ANM
 TRI_Founder_IT_effect: "[!Patto_di_Roma_Founder]"
 TRI_Founder_IT_desc: "Founded after the collapse of the Triumvirate in 1962, the Patto di Roma serves as a faction for Italy's interests first and foremost. It is made up of members directly in Italy's sphere of influence, be it satellites, autonomous regions or willing members. Despite the Oil Crisis and collapse of large parts of the Italian Colonial Empire, the CDP is still a significant player in Mediterranean and European Affairs."

 TRI_Member: "Patto di Roma Member" #use as new ITA sphere for ANM
 TRI_Member_effect: "[!Patto_di_Roma_Member]"
 TRI_Member_desc: "This nation is part of the Patto di Roma, and is allied with Italy in foreign affairs in order to counter German and Turkish Imperialism and Aggression, safeguarding peace and prosperity in the Mediterranean."

 TRI_Member_Client: "Patto di Roma Satellite" #use as new ITA sphere for ANM
 TRI_Member_Client_effect: "[!Patto_di_Roma_Satellite]"
 TRI_Member_Client_desc: "This nation is a Satellite State in the Patto di Roma. Its Foreign Affairs are controlled by Italy as a result, and they will have to take a stand with their Suzerain in International Affairs."

 TRI_Observer: "Patto di Roma Observer" #use as new ITA sphere for ANM
 TRI_Observer_effect: "[!Patto_di_Roma_Observer]"
 TRI_Observer_desc: "GDP Growth Boost: §b2%§!\n\nA state that is potentially interested in fully joining the Concordate, a country like this usually has strong ties with another member of the alliance or Italy proper, and as a result it may one day become a fully-fledged companion of the Concordate."