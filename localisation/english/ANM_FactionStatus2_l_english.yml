### German World Community ###
## Level 5 - Observers ##
 Pakt_Observer: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nPaktbeobachter"
 Pakt_Observer_effect: "[!Pakt_Observer]"
 Pakt_Observer_desc: "This nation is one with close ties to the [GER.GetFlag]German Reich and its allies in the £sphere_europe_icon §BEuropean Independence and Integrity Pact§! and has been granted observer status within the organisation. While it maintains its independence from the £sphere_europe_icon '§BEuropakt§!' by not being a formal member, this nation is given the privilege of participating in some of the Pakt's programs and activities while in turn, sharing some of the members' responsibilities and obligations to ensure both sides are rewarded for their cooperation."
 Pakt_Observer_2: "£sphere_main_icon Deutsche Weltgemeinschaft\n--------------\nPaktbeobachter"
 Pakt_Observer_2_effect: "[!Pakt_Observer_2]"
 Pakt_Observer_2_desc: "This nation is one with close ties to the [GER.GetFlag]German Reich and has been granted observer status within their £sphere_main_icon §BWorld Community§!. While it maintains complete diplomatic, defensive and financial independence from the alliance this nation is given the privilege of participating in their, otherwise closed-off, economy."
 Pakt_Observer_3: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n£sphere_middle_east_icon Mitteler Osten Verteidigungsbündnis\n--------------\nPaktbeobachter"
 Pakt_Observer_3_effect: "[!Pakt_Observer_3]"
 Pakt_Observer_3_desc: "Observer text 3"

 ## Level 4 - Colonial Administrations ##
 Pakt_Military_Authority: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nMilitärbehörde"
 Pakt_Military_Authority_effect: "[!Pakt_Military_Authority]"
 Pakt_Military_Authority_desc: "Established under a series of treaties between the [GER.GetFlag]German Reich and its host state, the Military Authority receives its orders directly from the offices of the Oberkommando des Heeres. With its special authority, it manages nearly all affairs of its granted territory, overseeing police operations, intervening in local government, and above all, watching its host for any sign of indiscretion. It is by these means that the Military Authority is known to be the most pronounced arm of German control, with almost all aspects of state and society under their control, or at the very least, their watch."
 Pakt_Kolonialverwaltung: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nKolonialverwaltung"
 Pakt_Kolonialverwaltung_effect: "[!Pakt_Kolonialverwaltung]"
 Pakt_Kolonialverwaltung_desc: "A Kolonialverwaltung is a colonial administration."

 ## level 3 - Government Administrations ##
 Pakt_Reichsprotektorat: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nReichsprotektorat"
 Pakt_Reichsprotektorat_effect: "[!Pakt_Reichsprotektorat]"
 Pakt_Reichsprotektorat_desc: "While by no means free from German supervision, a Reichsprotectorate enjoys a certain degree of autonomy within the [GER.GetFlag]German Reich. Rather than being directly administered by the Reich, the government of a Reichsprotectorate is composed of both Germanized natives and German settlers, led by the Reichsprotektor. This being said, these lands are still subject to the passive Germanization supported by the Reich - and are fully intended to one day be made part of the Fatherland, though their effects vary between different protectorates."
 
 ## level 2 -  Supervisory Administrations ##
 Pakt_Nebenland: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nNebenland"
 Pakt_Nebenland_effect: "[!Pakt_Nebenland]"
 Pakt_Nebenland_desc: "This nation is a Nebenland, the vestige of a former nation now almost fully integrated into the Reich. By Germania's account, the Nebenländer are special regions of the Reich chosen to administer themselves and manage their affairs with some degree of autonomy. However, under this facade of autonomy rests a system of economic and political control, ultimately drawing them back to Germania. Their economies commanded by German companies, their politics under the approval of German stamps, Nebenländer are the extended shadow of the Reich."
 Pakt_Subsidiaritat: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nSubsidiarität"
 Pakt_Subsidiaritat_effect: "[!Pakt_Subsidiaritat]"
 Pakt_Subsidiaritat_desc: "An Subsidiarity is not a nation but rather a unique colonial administration employed by the [GER.GetFlag]German Reich to administer its Caucasian territories. Headed by a Führer-approved Reichskommissar, these administrative regions have been granted a significant degree of autonomy from the usually close oversight from Germania, either due to their distance from the homeland or regional particularities. The guise of autonomy applies only to its elite, and what they do with it is theirs only to decide, but the German Eagle remains on the lookout in case they think they actually have total power."
 Pakt_Protectorate: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nProtektorat"
 Pakt_Protectorate_effect: "[!Pakt_Protectorate]"
 Pakt_Protectorate_desc: "This nation is a Protectorate,"
 
 ## Level 1 - Alliance Administrations ##
 Pakt_Schutzstaat: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nSchutzstaat"
 Pakt_Schutzstaat_effect: "[!Pakt_Schutzstaat]"
 Pakt_Schutzstaat_desc: "This nation is a Protected State, an ostensibly independent member of the £sphere_europe_icon §BEuropean Independence and Integrity Pact§!. So close is the brotherhood between this country and the Reich that they vote wholly in each other's interests during £sphere_europe_icon '§BEuropakt§!' Councils, closely following the lines put forward by Germanian representatives. There are Germans in the streets, at business ventures, in the barracks, and in the Halls of Government - showing the unity between the two nations and their support for the Pan-European Ideals. The Alliance Administrations all are close brothers-in-arms of the Reich, but the Protected States are even closer, dancing at string's end to the Horst-Wessel-Leid."
 Pakt_Bundnispartner: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n--------------\nBüdnispartner"
 Pakt_Bundnispartner_effect: "[!Pakt_Bundnispartner]"
 Pakt_Bundnispartner_desc: "This nation is a ‘Free’ member state of the £sphere_europe_icon §BEuropean Independence and Integrity Pact§!, an ambitious alliance that united the economic, diplomatic and military power of German-dominated Europe into one organisation. While these nations are free to decide their own fate and don’t follow orders from Germania, the [GER.GetFlag]German Reich still holds significant influence within the nation to help prevent their ally from deviating too far from the line."
 Pakt_Bundnispartner_2: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_middle_east_icon Mitteler Osten Verteidigungsbündnis\n--------------\nBüdnispartner"
 Pakt_Bundnispartner_2_effect: "[!Pakt_Bundnispartner_2]" 
 Pakt_Bundnispartner_2_desc: "This nation is a ‘Independent’ member state of the £sphere_middle_east_icon §BMiddle-East Defense Alliance§!, a defensive military alliance that solidifies broader German interests within the region. While these nations are free to decide their own fate and don’t follow orders from Germania, Germany exclusively guarantees their independence to prevent them from drifting away from the Reich's direct sphere of influence." 
 Pakt_Bundnispartner_3: "£sphere_main_icon Deutsche Weltgemeinschaft\n£sphere_europe_icon Europäischer Unabhängigkeits- und Integritätspakt\n£sphere_middle_east_icon Mitteler Osten Verteidigungsbündnis\n--------------\nBüdnispartner"
 Pakt_Bundnispartner_3_effect: "[!Pakt_Bundnispartner_3]" 
 Pakt_Bundnispartner_3_desc: "This nation is a ‘Free’ member state of the £sphere_europe_icon §BEuropean Independence and Integrity Pact§!, an ambitious alliance that united the economic, diplomatic and military power of German-dominated Europe into one organisation. Additionally these nations are part of the §BMiddle-East Defense Alliance§! to uphold their former colonial connections within the region. While these nations are free to decide their own fate and don’t follow orders from Germania, the [GER.GetFlag]German Reich still holds significant influence within the nation to help prevent their ally from deviating too far from the line." 


 #Sphere
 Sphere_Leader: "Leader of The Sphere"
 Sphere_Leader_effect: "[!Sphere_Leader]"
 Sphere_Leader_desc: "The Dai Tōa Kyōeiken, commonly referred to as "The Sphere", is an international organization of independent Asian nations, liberated in the War Against Western Colonialism and Imperialism. At least, that's the official version. In reality, beyond its few voluntary members, the Sphere is filled with colonial governments in all but name, geared towards serving their Japanese slaveholders. The Co-Prosperity Sphere combines aspects of an economic union, a political superstructure, a military alliance and an integration project. Most importantly, however, it serves as a further extension of the Imperial stranglehold."
 Sphere_Leader_tt: "§MAs the leader of the Sphere, our yearly budget is further increased, thanks to regular payments from subordinate Sphere members.\n\nAdditionally, a fraction of each subject's industrial capacities will be transferred to us, according to their level of dependency.§!"
 
 Sphere_Core_Member: "Core Member of the Sphere"
 Sphere_Core_Member_effect: "[!Sphere_Core_Member]"
 Sphere_Core_Member_desc: "GDP Growth Boost: §b10%§!\nGDP to Sphere Leader Modifier: §b7.5%§!\n\nWhen Pan-Asianism was in its infancy under the name of Japanese-Manchurian-Chinese Special Relationship, Xinjing and Nanjing were forced into an economic bloc with Tokyo in 1940, fueling the Empire's oppressive war machine. The cultural ties between the two Chinese puppets and Japan, combined with the two regimes' early participation in Japan's self-proclaimed War of Liberation, earned Manchukuo and the Republic of China their special places in the Sphere as permanent members of the Sphere Governing Council.\n\nHowever, while they enjoy a de jure seniority over other members of the Sphere, the reality is far less rosy than it appears. Both Xinjing and Nanjing have to, thanks to their on-paper seniority, contribute a greater share into the Sphere's - or more accurately Japan's - defense and infrastructure fund. Needless to say, the "Core Membership" serves merely as an excuse to extort the peoples of China, yet neither the "Republic" of the South or the "Empire" of the North would give up this title upon which their legitimacy hinges."

 Sphere_Coequal: "Co-Equal Member of The Sphere"
 Sphere_Coequal_effect: "[!Sphere_Coequal]"
 Sphere_Coequal_desc: "This nation is a fully independent nation of the Dai Tōa Kyōeiken, serving as a member by choice rather than as an involuntary puppet government. As an independent member of the Sphere, these nations are primarily regional powers, playing a part in keeping the peace in other, more dependent nations. However, there is the highest probability of the loyalty of these nations being called into question."
 
 Sphere_Economic_Dependent: "Economically Dependent Member of The Sphere"
 Sphere_Economic_Dependent_effect: "[!Sphere_Economic_Dependent]"
 Sphere_Economic_Dependent_desc: "Despite being mostly independent, this nation's economy requires foreign intervention to stay afloat in the Dai Tōa Kyōeiken. This also includes further military cooperation with more independent members, and also generally more direct involvement from their overlords in general, as well as other regional powers in the Sphere.\n\n§MThis country will have to pay§! §b15%§! §Mof its§! §bGross Annual Income§! §Mto the§! §eLeader§! §Mof the§! §eCo-Prosperity Sphere§!§M.§!"
 
 Sphere_Fully_Dependent: "Fully Dependent Member of The Sphere"
 Sphere_Fully_Dependent_effect: "[!Sphere_Fully_Dependent]"
 Sphere_Fully_Dependent_desc: "This nation is entirely dependent on a foreign nation, in military, economic, and political aspects. They are involuntarily brought into the Dai Tōa Kyōeiken as a puppet nation, and are frequently subject to involvement in the Sphere's wars and diplomacy. However, control may often sow discord in these societies, which is likely to become rebellion.\n\n§MThis country will have to pay§! §b25%§! §Mof its§! §bGross Annual Income§! §Mto the§! §eLeader§! §Mof the§! §eCo-Prosperity Sphere§!§M.§!"
 
 Sphere_Imp_Protectorate: "Imperial Protectorate"
 Sphere_Imp_Protectorate_effect: "[!Sphere_Imp_Protectorate]"
 Sphere_Imp_Protectorate_desc: "This nation is under protection by Japan, and, as such, is brought into the Dai Tōa Kyōeiken as a result of Japan's leadership. Such nations are directly subservient to Japan, and answer to them. This is the most direct form of Japanese influence in a nation aside from complete annexation.\n\n§MThis country will have to pay§! §b40%§! §Mof its§! §bGross Annual Income§! §Mto the§! §eLeader§! §Mof the§! §eCo-Prosperity Sphere§!§M.§!"
 
 Sphere_Corporate_Dependency: "Corporate Dependency"
 Sphere_Corporate_Dependency_effect: "[!Sphere_Special_Econ_Zone]"
 Sphere_Corporate_Dependency_desc: "GDP Growth Boost: §b10%§!\nGDP to Sphere Leader Modifier: §b10%§!\n\nMuch less a nation and more of a giant corporate playground, the State of Guangdong's primary purpose is to facilitate trade and cheap manufacturing for the electronics conglomerates in the territory - which exert explicit political influence via their representation on the Legislative Council of Guangdong. The entire country, especially the cities, is largely void of trade laws and restrictions. Endless sweatshops dot the land, with corporate symbolism appearing in such magnitude one forgets that it is Japan, not the corporations, that ultimately benefits most from this unnatural arrangement."

 Sphere_Observer: "Sphere Observer"
 Sphere_Observer_effect: "[!Sphere_Observer]"
 Sphere_Observer_desc: "GDP Growth Boost: §b5%§!\n\nThis status represents a nation gradually transitioning into full membership in the Co-Prosperity Sphere, usually through the means of extensive economic and diplomatic agreements and low-level military personnel training. Markets between these nations are often dominated by Japanese goods and are subject to the whims of Japanese investors, but the political landscape is usually untouched by Japanese interests, allowing the nation certain freedoms from Tokyo control."

# OFN
OFN_President_of_Military_Committee: "President of Military Committee and Supreme Allied Commander in Europe"
OFN_President_of_Military_Committee_effect: "[!OFN_Leader_of_The_Free_World]"
OFN_President_of_Military_Committee_desc: "The Military Committee of the Organization of Free Nations acts as the alliance's sword, responsible for coordinating the collective military knowledge of all member states to deliver recommendations to its Security Council. The Committee President is the kingmaker for actioning these recommendations, being the body's most senior officer, and chief rulesmaker. Without exception, this position is and will always be occupied by an American."

OFN_Supreme_Allied_Commander_in_Europe: "Supreme Allied Commander in Europe"
OFN_Supreme_Allied_Commander_in_Europe_effect: ""
OFN_Supreme_Allied_Commander_in_Europe_desc: "Since World War Two, Europe is considered to be a lost cause by most in the free world, trapped under the confines of Nazism. However, the few remaining democratic outposts opposed to German rule are of considerable interest to the Organization of Free Nations. As such, the Supreme Allied Commander in Europe is responsible for maintaining these safe harbours, pertinent to the duty of extending democracy's reach in the fight against fascism."

OFN_Supreme_Allied_Commander_in_the_Pacific: "Supreme Allied Commander in the Pacific"
OFN_Supreme_Allied_Commander_in_the_Pacific_effect: ""
OFN_Supreme_Allied_Commander_in_the_Pacific_desc: "From Suva to Savai'i, the Organization of Free Nations' power in the Pacific may have waned following America's defeat to Japan, but its interest to the alliance's security aims have not alleviated. As Supreme Allied Commanders in the Pacific, Australia and New Zealand form the Military Committee's main vessel against Japanese control in the sector, strengthening susceptible free nations against foreign influence, and aiding nascent resistance movements to hinder the Co-Prosperity Sphere."

OFN_Standing_Committee_for_the_South_Atlantic: "Standing Committee for the South Atlantic"
OFN_Standing_Committee_for_the_South_Atlantic_effect: ""
OFN_Standing_Committee_for_the_South_Atlantic_desc: "The Standing Committee for the South Atlantic of the Organization of Free Nations is a body created to administer and develop the archipelagos and territories formerly controlled by the colonial powers of the old world. The Committee seeks to guide these nations in formation through the path of independence with gentle care, allowing them to emerge as stable democracies that have earned their place in the free world."

OFN_Supreme_Allied_Commander_Africa: "Supreme Allied Commander Africa"
OFN_Supreme_Allied_Commander_Africa_effect: ""
OFN_Supreme_Allied_Commander_Africa_desc: "Africa has and continues to suffer under colonial control in most parts of the continent, as the Organization of Free Nations attempts to nurture democratic governments in the few independent countries on the continent. The responsibility for this thrust falls under the remit of Libera as Supreme Allied Commander in Africa, aiding democratic resistances within colonies, alongside counteracting extremist movements influenced by the Co-Prosperity Sphere."

OFN_Member_of_the_OFN_Military_Committee: "Member of the OFN Military Committee"
OFN_Member_of_the_OFN_Military_Committee_effect: ""
OFN_Member_of_the_OFN_Military_Committee_desc: "The Military Committee of the Organization of Free Nations acts as the alliance's sword, responsible for coordinating the collective military knowledge of all member states to deliver recommendations to its Security Council. Each member state is permitted to join the Military Committee, contributing to planning actions and operations to curtail the spread of fascism, alongside facilitating war games and other training exercises to further their combined strength."

OFN_Security_Council_Member: "OFN Security Council Member"
OFN_Security_Council_Member_effect: ""
OFN_Security_Council_Member_desc: "The Security Council for the Organization of Free Nations operates as the bloc's primary political organ concerning leadership within the alliance. Every member is allowed to appoint one representative on the Security Council to give a voice to their country's needs, including partner states, but only full members are given voting rights. The Security Council tends to be unanimous in its decision-making, directed by America, but informed by other nations."

OFN_Partners: "OFN Partner"
OFN_Partners_effect: ""
OFN_Partners_desc: "An informal term, a "partner" for the Organization of Free Nations represents a nation that is a member of organizations affiliated with the bloc, but not part of the alliance themselves. Partners are permitted to appoint non-voting representatives to committees and subcommittees within the alliance, giving a voice to policy positions otherwise neglected. However, these privileges can be revoked if a partner is found to be in breach of the organization's guiding principles."

OFN_Offices_Military_Government: "OFN Office"
OFN_Offices_Military_Government_effect: ""
OFN_Offices_Military_Government_desc: "An uncommon practice, the formation of a military government is a practice that may be conducted by the Organization of Free Nations if a country has experienced severe turmoil or an immediate regime change. Administered by personnel from across the alliance, their rule focuses on stabilizing the host nation as soon as possible, before conducting free and fair elections overseen by internal observers. Ideally, the lifespan of this government is short, but factors can lead to them being in place for years."

OFN_Offices_Trust_Government: "OFN Office"
OFN_Offices_Trust_Government_effect: ""
OFN_Offices_Trust_Government_desc: "Formerly the holdings of colonial powers that were seized during World War Two, the Organizations of Free Nations possess control over these territories, administering them as trust governments. The governments are defined as transitional phases for the countries under them to undergo before the administrations can dissolve themselves and transfer authority to a government representative of the popular will of the native population."

 #old OFN
 OFN_Leader_of_The_Free_World: "Leader of the Free World"
 OFN_Leader_of_The_Free_World_effect: "[!OFN_Leader_of_The_Free_World]"
 OFN_Leader_of_The_Free_World_desc: "Surrounded by existential threats from both East and West, the United States mustered allies wherever it could before drawing a line its enemies shall not cross. No matter the cost and state of affairs, the superpower swore, its leaders and armies will faithfully keep watch over the thin border it had formed between sanity and madness.\n\nIn recognition, governments and oppressed peoples alike turn towards Washington for guidance, security, and material support. Yet these privileges come with an unwritten demand: America must continue to uphold the high standards of its moniker, lest the Free World family suddenly find itself without a patriarch worth following..."
 
 OFN_Independent_Member: "Independent Member of the OFN"
 OFN_Independent_Member_effect: "[!OFN_Independent_Member]"
 OFN_Independent_Member_desc: "The OFN is, first and foremost, a mutual defense alliance between countries with liberal and democratic inclinations. It comprises signatories of the New York Charter, who (barring some exceptions) are expected to "maintain and develop their individual and collective capacity to resist armed attack" in accordance with Article 3 of the aforementioned document. A council of representatives from every member-state, each entitled to one vote, manages the alliance's daily and long-term affairs.\n\nIndependent members refer to member-states which maintain political, economic, and military autonomy from the United States. The alliance's first independent members are Canada, Australia, and New Zealand."
 
 OFN_Dependent_Member: "Dependent Member of the OFN"
 OFN_Dependent_Member_effect: "[!OFN_Dependent_Member]"
 OFN_Dependent_Member_desc: "For member-states with neither the resources nor the manpower to maintain anything larger than a self-defense force, Article 5 - which mandates signatories to “assist the Party or Parties so attacked by taking forthwith... the use of armed force” - entails beggaring their economies for a standing force which they themselves scarcely use. Minor nations' place in the OFN, with these constraints in mind, was subject to vigorous debate until a compromise solution was amended into the San Francisco Charter.\n\nThe now-termed “Dependent Status Clause” exempts member-states which fit a list of strict criteria from fulfilling their Article 5 obligations. In effect, the US Armed Forces subsumes a large portion of the duties their militaries are expected to perform. The West Indies Federation, Haiti, Belize, Guyana, Suriname, Netherlands Antilles, Shetlands and the Faroes classify for the special status as of 1996."
 
 OFN_Military_Government: "American Military Government"
 OFN_Military_Government_effect: "[!OFN_Military_Government]"
 OFN_Military_Government_desc: "The United States has had experience instituting military districts - occupation zones whose inhabitants are subject to military, rather than extant local civilian laws - since the Reconstruction era. Aimed to enforce immediate peace and stability in war-torn or disputed regions, military governments are overseen by generals and involve sizable numbers of deployed American servicemen. Administrations may decide to continue this practice, for some reason or another, in the modern day.\n\nThe most recent example is US Forces Iceland, the eponymous island's de facto authority since 1941."
 
 OFN_Mandate: "OFN Mandate"
 OFN_Mandate_effect: "[!OFN_Mandate]"
 OFN_Mandate_desc: "Given the goals outlined by its framers, the OFN is not only expected, but also pressured to intervene in conflicts where the Free World's interests are at stake. Oftentimes the entities which emerge from them lack the stability, institutions and experience to maintain a successful democracy post-independence.\n\nArticle 12 of the New York Charter has presciently authorized the alliance to establish civil administrations in the aforementioned entities until capable local governments can oversee free and fair elections within their jurisdictions. Such a transitional period, it is hoped, will help create countries better equipped to seize their own destinies than otherwise."

 OFN_Observer: "OFN Partner"
 OFN_Observer_effect: "[!OFN_Observer]"
 OFN_Observer_desc: "GDP Growth Boost: §b5%§!\n\nWhile not a full member of the Organization of Free Nations, partner nations have close defense ties with the United States and are connected with the alliance through various programs. OFN Partnership is an informal title characterized by conditional defense development arrangements between a partner nation and the many OFN-affiliated intergovernmental organizations.\n\nPartnership programs began in 1950 with the OFN-OAS Defense Compact, whereby the OFN could offer defense modernization to members of the Organization of American States. Partnerships also facilitate military missions, grants, and other OFN aid. Through their affiliation with these programs, partner nations may be granted observer status in the OFN Security Council and put on track for eventual full membership in the alliance."
 
