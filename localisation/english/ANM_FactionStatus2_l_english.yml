 ### Europakt ###
 # level 5 #
 Pakt_Observer: "Paktbeobachter"
 Pakt_Observer_effect: "[!Pakt_Observer]"
 Pakt_Observer_desc: "This nation is one with close ties to the German Reich and its allies in the §BEuropakt§! and has been granted observer status within the organisation. While it maintains its Independence from the §BEuropakt§! by not being a formal member, this nation is given the privilege of participating in some Europapakt programs and activities while in turn, sharing some of the Pakt Members' responsibilities and obligations to ensure both sides are rewarded for their cooperation."

 # level 4 #
 Pakt_Military_Authority: "Kolonialverwaltung: Militärbehörde"
 Pakt_Military_Authority_effect: "[!Pakt_Military_Authority]"
 Pakt_Military_Authority_desc: "Established under a series of treaties between the §BEuropakt§! and its host state, the Militärbehörde receives its orders directly from the offices of the Oberkommando des Heeres. With its special authority, it manages nearly all affairs of its granted territory, overseeing police operations, intervening in local government, and above all, watching its host for any sign of indiscretion. It is by these means that the Militärbehörde is known to be the most pronounced arm of German control, with almost all aspects of State and Society under their Control, or at the very least, their watch."

 Pakt_Paktkommission: "Kolonialverwaltung: Paktkommission"
 Pakt_Paktkommission_effect: "[!Pakt_Paktkommission]"
 Pakt_Paktkommission_desc: "A Paktkommission is a colonial administration employed by the §BEuropakt§!, which serves as an overseas territory of the §BEuropakt§!, at least in theory. The administration is increasingly being tied to that of the Reich itself, to the point that business and people now flow without issue across their boundaries. The increasingly more political appointments within the Paktkommission's administrations by Germania are only one of several signs of where their loyalty truly lies."

 Pakt_Distrikt: "Kolonialverwaltung: Distrikt"
 Pakt_Distrikt_effect: "[!Pakt_Distrikt]" 
 Pakt_Distrikt_desc: "Distrikt " 

 # level 3 #
 Pakt_Reichsprotektorat: "Regierungsverwaltung: Reichsprotektorat"
 Pakt_Reichsprotektorat_effect: "[!Pakt_Reichsprotektorat]"
 Pakt_Reichsprotektorat_desc: "While by no means free from German supervision, a Reichsprotektorat enjoys a certain degree of autonomy within the German sphere. Rather than being directly administered by the Reich, the government of a Reichsprotektorat is composed of both Germanized natives and German settlers, led by a Reichstatthalter. This being said, these lands are still subject to the passive Germanization supported by the Reich - and are fully intended to one day be made part of the Fatherland, though their effects vary between each of the protektorate"
 
 # level 2 #
 Pakt_Nebenland: "Aufsichtsverwaltung: Nebenland"
 Pakt_Nebenland_effect: "[!Pakt_Nebenland]"
 Pakt_Nebenland_desc: "This nation is a Nebenland, the vestige of a former nation now almost fully integrated into the Reich. By Germania's account, the Nebenländer are special regions of the Reich chosen to administer themselves and manage their affairs with some degree of autonomy. However, under this facade of autonomy rests a system of economic and political control, ultimately drawing them back to Germania. Their economies commanded by German companies, their politics under the approval of German stamps, Nebenländer are the extended shadow of the Reich."

 Pakt_Subsidiaritat: "Aufsichtsverwaltung: Subsidiarität"
 Pakt_Subsidiaritat_effect: "[!Pakt_Subsidiaritat]"
 Pakt_Subsidiaritat_desc: "An Subsidiarität is not a nation but rather a unique colonial administration employed by the Greater German Reich to administer its Caucasian territories. Headed by a Führer-approved Reichskommissar, these administrative regions have been granted a significant degree of autonomy from the usually close oversight from Germania, either due to their distance from the homeland or regional particularities. The guise of autonomy applies only to its elite, and what they do with it is theirs only to decide, but the German Eagle remains on the lookout in case they think they actually have total power."
 
 # level 1 # 
 Pakt_Schutzstaat: "Bündnisverwaltung: Schutzstaat"
 Pakt_Schutzstaat_effect: "[!Pakt_Schutzstaat]"
 Pakt_Schutzstaat_desc: "This nation is a Schutzstaat, an ostensibly independent member of the §BEuropakt§!. So close is the brotherhood between this country and the Reich that they vote wholly in each other's interests during §BEuropakt§! Councils, closely following the lines put forward by Germanian representatives. There are Germans in the streets, at business ventures, in the barracks, and in the Halls of Government - showing the unity between the two nations and their support for the Pan-European Ideals. The Büdnisverwaltungen all are close brothers-in-arms of the Reich, but the Schutzstaaten are even closer, dancing at string's end to the Horst-Wessel-Leid."

 Pakt_Bundnispartner: "Bündnisverwaltung: Büdnispartner"
 Pakt_Bundnispartner_effect: "[!Pakt_Bundnispartner]"
 Pakt_Bundnispartner_desc: "This Nation is a ‘Free’ member state of the §BEuropakt§!, an ambitious alliance that united the economic and military power of German-dominated Europe into one organisation. While these nations are free to decide their own fate and don’t follow orders from Germania, the Reich still holds economic and political influence within the nation to help prevent their ally from deviating too far from the line."

 # unused / legacy #
 Pakt_Mitstreiter: "Mitstreiter"
 Pakt_Mitstreiter_effect: "[!Pakt_Mitstreiter]"
 Pakt_Mitstreiter_desc: "A proud §YMitstreiter§! of the Greater German Reich, this nation has thrown off the shackles of degeneracy and entered into a new age. Now regarded as a close brother-in-arms in the fight for European Unity and Prosperity under the Europapakt, its fate is intertwined with Germany's. Germania insists this is a mutual and prosperous relationship, although in truth the so-called brother-in-arms serves more as an instrument than an equal partner.\nGDP growth modifier: §G[?global.europaktgdpgrowthmodifier]§!"
 Pakt_Ordensstaat: "Ordensstaat"
 Pakt_Ordensstaat_effect: "[!Pakt_Ordensstaat]"
 Pakt_Ordensstaat_desc: "Unique among the Pakt, this nation is an §YOrdensstaat§!, a military administration controlled exclusively by the SS. While formally politically, militarily, and economically part of the Reich as a whole, under the ultimate command of the Führer, in reality the §YOrdensstaat§! is little more than a private fiefdom of the Reichsführer-SS, Heinrich Himmler. Little information is revealed to the public on the inner workings of the §YOrdensstaat§!, but rumors abound of total and complete control of the citizenry's actions, words, and even thoughts. The illusion of German control over the §YOrdensstaat§! is a shaky one, and a single spark could set the whole thing ablaze..."
