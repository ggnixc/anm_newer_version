 SOV_Republic_RSFSR_desc_tt: "The RSFSR was an independent federal socialist state from 1917 to 1922, and afterwards the largest and most populous Soviet socialist republic of the Soviet Union (USSR) from 1922 onwards. The Russian SFSR is composed of sixteen smaller constituent units of autonomous republics, five autonomous oblasts, ten autonomous okrugs, six krais and forty oblasts. Russians formed the largest ethnic group. The capital of the Russian SFSR and the USSR as a whole is Moscow and the other major urban centers included Leningrad, Stalingrad, Novosibirsk, Sverdlovsk, Gorky and Kuybyshev." # to be changed
 SOV_Republic_kazakh_desc_tt: "During the Russian Smuta Period, Kazakhstan was not spared from the chaos. Taking advantage of the upheavel in the Motherland, traitorous elements within the Soviet Republic attempted to secede from the Soviet Project in 1968 to create an independent republic, following the disastrous rule of Dinmukhamed Kunaev. Fortunately, Mikhail Solomentsev managed to subdue these fifth columnists, and brought Kazakhstan back into the Motherland's fold. The locals may lament as much as they wish, but the reality for Kazakhstan is a future in our Grand Union."
