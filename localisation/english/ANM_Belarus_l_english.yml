 ## Descriptions ##
 POLITICS_ZIANON_PAZNIAK_DESC: "Many would find the idea of a Belarusian still leading RK Weißruthenia laughable. Considering the Open Heart Project, the shifting of its industrial capital to other Reichslands and the high levels of resistance within the state, you’d be hard-pressed to find a native collaborator willing to lead RK Weißruthenia. However, someone has to do the job, and that someone is Jonas Paschnek.\n\nBorn as Zianon Pazniak just a few years after the start of the German Occupation of Belarus in 1944, Paschnek was one of the few native Belarusians able to attend the German-dominated Riga Arts and Culture University thanks to his father’s connections as a bureaucrat in the local Belarusian Administration. After Paschnek graduated, he became a Historian primarily focused on documenting the Soviet Occupation of Belarus, focusing on their crimes and atrocities. This included the NKVD’s involvement in the disappearance of his own grandfather.\n\nHe worked as a Historian within the administration up until the 2WRW. With the forced resignation of the previous leader of RK Weißruthenia due to the mass sabotage efforts by Soviet Collaborators, the Germans drew up plans to wipe out the Belarusian nation once and for all. When they checked for willing collaborators, Paschnek was the only one (who wasn’t a whackjob) who volunteered.\n\nWhy would he volunteer? In Paschnek’s eyes, he is the only one who could save Belarus. A German in charge would destroy the entire nation, but thanks to him, he was able to convince the leaders in Germania to leave a few cities left due to their economic benefits. Paschnek is doomed to be remembered as a Villain, the man who helped destroy his country, culture, and people. But he'll take it if being damned as a traitor is the only way to save his people."

 
### Ideas ###
BLR_green_heart_project: "The Open Green Heart Project"
BLR_green_heart_project_desc: "Reichsland Weißruthenien has always been seen as the most disobedient of the Reichslands. From the Ostland Civil War, the Slave revolt and the chaos of Soviet Collaborators in the 2WRW, its native population refuses to follow the ways of National Socialism. Thus, radical action needed to be taken, and the Reich looked to the previously tossed-out Open Green Heart Project.\n\nOriginally devised during its initial occupation, the Open Green Heart Project will effectively destroy Weißruthenia as a nation, a culture and a concept. Most of its towns and cities will be leveled in favour of turning them into a massive nature reserve. Soon, Weißruthenia as a county will soon no longer exist, in its place will be a giant forest and a few distantly connected towns and cities deemed productive enough to be spared the Reich’s destructive hands."
BLR_deindustrialisation: "De-Industrialisation"
BLR_deindustrialisation_desc: "Every nation seeks to industrialise to improve its economy, provide jobs and for technological advancement. However, under direct orders from Germania, the leaders of Weißruthenien have instead decided to make the stunning decision to de-industrialise themselves. After Communist sympathisers rose up in Weißruthenia during the 2WRW, the collaborator government began a massive crackdown on any suspected communists. Thus, the Reich decided to shut down the places where Communism was believed to be most active, the factories.\n\nWorking in tandem with the Open Green Heart Project, the vast bulk of Weißruthenia’s industry has been relocated to the other Reichslands, primarily RK Ukraine. The only industry it has left are specialised prototype plants (which only the Germans themselves can actually work in). Most of its native population now mainly works in the nation’s farms, mines and whichever aspects of the government’s administration are willing to employ them."
