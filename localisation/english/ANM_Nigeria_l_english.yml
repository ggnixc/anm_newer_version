 POLITICS_MOTHERLY_FIGURE_DESC:0 "You did this patrick. You did this to yourself."

 # FOCUS TREE
 congo_beauty_in_flames:0 "Beauty in Flames"
 congo_beauty_in_flames_desc:0 "The lands of the Congo have been set ablaze. banditry, rivalry, conflict, and war. we must now work to reunify our shattered nation, for we do not wish to perish."
 congo_aid_from_our_benefactors:0 "Aid from Our Benefactors"
 congo_aid_from_our_benefactors_desc:0 "No man fights alone. to defeat our foes, we must reach out to our closest of confidantes, and recieve their assistance."
 congo_emergency_armament_production:0 "Emergency Armament Production"
 congo_emergency_armament_production_desc:0 "In our current state, we seem incapable of properly supplying our soldiers. in order to achieve victory, we must make yet another sacrafice, to rally out people, and all we can, in order to facilitate the production of additional weapons."
 congo_relief_efforts:0 "Relief Efforts"
 congo_relief_efforts_desc:0 "Our current... administration of the territories we inhabit lies on pillars of sand. in order to ensure our continued existence, and the continued existence of our people, we must work to provide necessities to our people."
 congo_convert_the_capital:0 "Convert the Capital"
 congo_convert_the_capital_desc:0 "Our Headquarters are purely administrative at this time, a status which must end. We will now work to fortify our capital and turn it into a productive part of the war effort."
 congo_forced_mobilization:0 "Forced Mobilization"
 congo_forced_mobilization_desc:0 "We need more warriors to man the front, and they will come from all places from which we can get them!"
 congo_a_sour_option:0 "A Sour Option"
 congo_a_sour_option_desc:0 "When we decided more warriors were needed, we meant it. no matter their size, no matter their shape, no matter their innocence."
 congo_the_last_resort:0 "§RThe Last Resort§!"
 congo_the_last_resort_desc:0 "§RWE ARE RUNNING OUT OF TIME! WE MUST WIN, THE COST DOES NOT MATTER, WE MUST WIN.§!"
 congo_a_mighty_arsenal:0 "A Mighty Arsenal"
 congo_a_mighty_arsenal_desc:0 "Our men are outgunned, we must acquire more weapons and continue the fight, no matter what"
 congo_a_breath_of_fresh_air:0 "A Breath of Fresh Air"
 congo_a_breath_of_fresh_air_desc:0 "§CAlas, we can rest upon the laurels of our victory, even if for a fleeting moment.\n\n We won.§!"
 # NATIONAL SPIRITS
 #COG_Heart_Of_Afrika_0:0 "Heart of Afrika"
 #COG_Heart_Of_Afrika_0_desc:0 "Controlling the great Congo Basin and the sprawling plantations surrounding it, and with extensive foreign investment, Zentralafrika controls the vast wealth of German Africa. German ships fill the various rivers and canals, taking these riches across the continent and to the heart of the Reich itself."