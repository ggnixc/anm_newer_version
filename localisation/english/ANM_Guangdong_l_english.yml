 GNG: "State of Guangdong"
 GNG_DEF: "State of Guangdong"
 GNG_ADJ: "Canton"

 GNG_despotism_party: "Rippoukai - Zaikaiha"
 GNG_despotism_party_long: "Rippoukai - Zaikaiha§F\n--------------\nThe ascendancy of Guangdong's corporations in economic life came with a corresponding need for their interests to be represented in politics. The members of the Legislative Council - supposedly apolitical and independent - proved to be easily swayed by promises of money, status, and power offered by the corporates, in exchange for their loyalty. These individuals - now more loyal to their corporate benefactor than their Chief Executive - form the backbone of Corporate political influence in Guangdong.§!"
 GNG_despotism_1_party: "Rippoukai - Zaikaiha (Matsushita)"
 GNG_despotism_1_party_long: "Rippoukai - Zaikaiha (Matsushita)§F\n--------------\nThe ascendancy of Guangdong's corporations in economic life came with a corresponding need for their interests to be represented in politics. The members of the Legislative Council - supposedly apolitical and independent - proved to be easily swayed by promises of money, status, and power offered by the corporates, in exchange for their loyalty. These individuals - now more loyal to their corporate benefactor than their Chief Executive - form the backbone of Corporate political influence in Guangdong.§!"
 GNG_fascism_party: "Kanton Minseifu"
 GNG_fascism_party_long: "Kanton Minseifu§F\n--------------\nThe Legislative Council is, in theory, an apolitical advisory body appointed by the Chief Executive to advise and legitimize their actions as part of an unified political corpus - the Guangdong Civil Administration. In practice, of course, the capture of the Legislative Council by corporate interests have made political factionalism a fact of life. Those who remain loyal to the appointed Chief Executive Suzuki's vision, to the prerogatives of the state above that of moneyed interests, are seen as the executors of the Civil Administration in the Legislative Council.§!"
 GNG_paternalism_party: "Rippoukai - Minseiha (Sony)"
 GNG_paternalism_party_long: "Rippoukai - Minseiha (Sony)§F\n--------------\nMoney will never not be a part of Guangdong's politics. But the logic of money is not infallible, argue some, and sometimes the impulse to maximize profit must be balanced against the need to preserve stability. Whether they be more paternalistic corporate men or unreconstituted believers in a civil society backed by more than just greed, these individuals in the Legislative Council back a heterodox theory of economics that balances State interests with corporate prerogatives.§!"

 GNG_Naoyuki_Akikusa: "Naoyuki Akikusa"
 GNG_Naoki_Kuruda: "Naoki Kuruda"

 #ideas
 GNG_Our_Identity: "What is Our Identity?"
 GNG_Our_Identity_desc: "What is the Identity of the Pearl River Delta? In Nanjing's eyes, the reintegration of Guangdong back into the rightful hold of the Republic of China would also disappear the connections of the people to the region. However, the Zhujin people and Japanese expats that remain in the Autonomous SEZ have had other thoughts. Many have resisted further integration and merger of the Mainland and the Pearl River Delta, with a separate identity having been formed in the years of Morita. \n\nAs China grows and enters the New Millennium, its ambitions continue to grow further. The desire of Nanjing for a Single, United and Unitary China and the peoples of the Pearl River Delta resisting such change will certainly butt heads in the future.§!"
 
 GNG_Sony_Empire: "The Sony Empire"
 GNG_Sony_Empire_desc: "The Ambitions of Morita and Li, along with the Strength of Sony and Chueng Chong have finally bested over their corporate rivals in Tokyo and implemented the Capitalism with a Human Face that Morita had dreamed of. Facing Opposition, Corruption and Balancing between the Two Giants of Asia, Morita and Li passed Ordinance by Ordinance in the Legislative Council slowly but surely, reforming Guangdong into a place where the Local Chinese and Zhujin can be proud of, live comfortably in, have an identity and a place to call home. \n\nThe Great Asian War came at a horrible time for Guangdong and Morita, as the Infernos in Asia threatened to put out the young flame of Guangdong. Li's Proposal of Reintegration into China as an Autonomous SEZ was surprisingly well received by Nanjing and Gao, with Guangdong being spared from the worst sieges and battles. Norio Ohga inherited Morita's Legacy in 1982 with the latter retiring due to old age, and he will continue to advance Sony into the New Millennium.§!"
 
 GNG_Across_The_Pearl_River: "Across the Pearl River"
 GNG_Across_The_Pearl_River_desc: "As one of the conditions for Guangdong to transition into a Special Economic Zone of the Republic of China, the Chinese Army and Nanjing has taken over the garrison and security duties of the Pearl River Delta. Unlike our times as an "independent" nation under Japan's watch, we are not allowed a token military force for self-defense and the testing of military equipment. \n\nWhile this has freed up our budget for investing in other purposes, the fact of the matter is whatever action is taken in the Legislative Council, the spectre of Nanjing will always be watching, and they will not be afraid to take action should the LegCo pass any Ordinance that China disapproves of.§!"
 
 
 POLITICS_NAOKI_KURUDA_DESC: "Once the brightest mind of the Japanese financial sector, Naoki Kuroda is nothing more than a husk of his former self. Joining the recently nationalized Bank of Japan shortly after the Yasuda Crisis, Naoki would rise through its ranks quickly as his work in previous government sectors helped him easily coordinate financial policy. Reassigned to work in Guangdong after a shakeup in government ministries following the Oil Crisis, Kuroda would become one of the most powerful non-corporate individuals within the corporate state through his excellent work in the civil service.\n\nWhen push came to shove in Guangdong, and the political scene started rapidly deteriorating, Kuroda was appointed the state's Chief Executive in the face of corporate failure to deal with the power vacuum emerging in the state due to the crisis. Having presided over the position for 8 years, Kuroda is regarded as nothing more than Tokyo’s lapdog by Guangdong’s corporations while reviled by the Chinese and Zhijun populace for his relative inaction on civil reform. As his administration grows unpopular among all aspects of society, it becomes apparent that Kuruda will finally get a chance to return to the Home Isles, leaving this wretched paradox to its misery."

