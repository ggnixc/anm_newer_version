 ## Descriptions ##
 POLITICS_POVL_HEINRICH_RIIS_KNUDSEN_DESC: "Whilst there is no such thing as an Uncontroversial Nazi, Knudsen has managed to anger not only those who do not follow National Socialism but even many who do follow it. Simply listen to his speeches, and you’ll see why.\n\nRaised by an SS Officer, Knudsen was able to attend College and become a Professor in Political Studies in Copenhagen, where he began to forge his Political Beliefs. While he was raised to be a Loyal Nazi by his Father, he began following Social Revolutionary Ideals by niche Revolutionary Nazi Movement in the DNSAP. Knudsen began leading the small group within the DNSAP. His mixture of Marxist and Nazi Ideals and Rhetoric led to several accusations of him being a Crypto-Nazi, but he was not deterred.\n\nThe Group slowly began to grow over the years before rapidly growing after the increasing factionalisation of the Late 80s within the DNSAP. This was put on full display when Knudsen successfully managed to oust Erik Grevenkop-Castenskiold as party leader in 1989 and replaced him with himself due to deep party divisions.\n\nDon’t let Knudsen’s Marxist-style speeches fool you, he’s just as power-hungry and willing to keep his grip on power by any means necessary as any other Nazi in Denmark. A Nazi draped in the colour of Marx and Lenin is still a Nazi at heart."
 
### Ideas ###
 DEN_dnsap_factionalism: "DNSAP Factionalism"
 DEN_dnsap_factionalism_desc: "Whilst united under Martinsen’s Rule, the DNSAP has dissolved into factionalism over the last decade since his departure between the Orthodox Nazis, who follow German Party-Line National Socialism, and the Revolutionary Nazis, who seek a ‘Truly Revolutionary’ Style of Nazism. This reached a fever pitch under Castenskiold’s Rule when he was successfully voted out as leader by the Revolutionaries, who installed Knudsen to succeed him.\n\nCurrently, the party is caught in an internal battle between the Revolutionaries under Knudsen and the Orthodox Nazis under Jonni Hansen, who have sought to undermine each other over the years, neitheEconomic Misdirectionr able to dominate the other entirely."
 DEN_economic_misdirection: "Economic Misdirection"
 DEN_economic_misdirection_desc: "For most of the 20th Century, Denmark was a Nation of Agriculture, albeit with a growing Industrial Sector. This Status Quo held up until Martinsen’s Coup, which soon began a major shift towards Industrialisation to ensure Denmark wasn’t simply Germany’s Backyard Farm. His Successor, Castenskiold, toned down the Industrialisation Efforts to allow the Farming Sector and Infrastructure to catch up, but after Knudsen forced him out, Knudsen proceeded to take Denmark towards another major and even more radical economic direction.\n\nWhilst Knudsen doubled down on industrialisation, he focused on enforcing state control over the new factories rather than leaving them in private hands. However, the powerful private corporations have resisted his efforts thus far, leaving Denmark’s Economic Future in Question."
 DEN_dreams_of_a_kingdom: "Dreams of a Kingdom"
 DEN_dreams_of_a_kingdom_desc: "The Danish Royal Family have fallen from Grace and its Kingdom even more so. Once stretching from Greenland to Finland, by the end of the Second World War, only Denmark itself remained. The Death of Hitler and the DNSAP Coup in its wake forced the Royal Family into Exile, eventually ending up in Canada alongside many of Europe's other Royal Families.\n\nHer Majesty Margrethe II of Denmark still claims the House of Glücksburg rule over Denmark, but with Nazi Rule cemented for over 30 years and the Royal Family’s Collaboration tainting its legacy, its overdue return may not happen."