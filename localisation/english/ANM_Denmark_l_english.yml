 ## Descriptions ##
 POLITICS_POVL_HEINRICH_RIIS_KNUDSEN_DESC: "Whilst there is no such thing as an uncontroversial Nazi, Knudsen has managed to make enemies both within and outside the Global Nazi Movement. Simply listen to his speeches, and you’ll see the mixed rhetoric of a Nazi and Marxist and understand why even many in the DNSAP loath the man who rules over them.\n\nRaised by an SS Officer, Knudsen became a Professor in Political Studies in Copenhagen, where he began to forge his Political Beliefs. While he was raised to be a Loyal Nazi by his father, he began following the Social Revolutionary Ideals of the niche Revolutionary Nazi Movement within the DNSAP during the ‘70s. Knudsen began leading the small group within the DNSAP, with his mixture of Marxist and Nazi Ideals and Rhetoric leading to several accusations of him being a Crypto-Communist, but he remained undeterred.\n\nThe group slowly grew over the years before rapidly expanding its profile after the increasing factionalisation of the Late ‘80s within the DNSAP. This was put on full display when Knudsen successfully managed to oust Erik Grevenkop-Castenskiold as party leader in 1989 and replaced him with himself due to deep party divisions.\n\nDon’t let Knudsen’s Marxist-style speeches fool you however, he’s just as power-hungry and loyal to the Nazi cause as any other Nazi in Denmark. A Nazi draped in the colour of Marx and Lenin is still a Nazi at heart."
 
### Ideas ###
 DEN_dnsap_factionalism: "DNSAP Factionalism"
 DEN_dnsap_factionalism_desc: "Whilst united in its early years of power, the DNSAP has dissolved into factionalism over the last decade between the Orthodox Nazis, who follow German Party-Line National Socialism, and the Revolutionary Nazis, who seek a ‘Truly Revolutionary’ Style of Nazism. This reached a fever pitch under Castenskiold’s Rule when he was successfully voted out as leader by the Revolutionaries, who installed Knudsen in his place.\n\nCurrently, the party is caught in an internal battle between the Revolutionaries under Knudsen and the Orthodox Nazis under Jonni Hansen, who have sought to undermine each other over the years, neither able to dominate the other entirely."
 DEN_economic_misdirection: "Economic Misdirection"
 DEN_economic_misdirection_desc: "For most of the 20th Century, Denmark was a Nation of Agriculture, albeit with a growing Industrial Sector. This Status Quo held up until the DNSAP Coup, which soon began a major shift towards Industrialisation to ensure Denmark wasn’t simply Germany’s Backyard Farm. Castenskiold sought to double down on the Industrialisation Efforts, but also to pursue privatisation of the economy, to benefit his friends in the private sector.\n\nWhilst his successor Knudsen continued down the road of industrialisation, he focused on enforcing state control over the new factories rather than leaving them in private hands. However, the powerful private corporations boosted by Castenskiold’s reforms have tried to resist his efforts, leaving Denmark’s Economic Future in Question."
 DEN_dreams_of_a_kingdom: "Dreams of a Kingdom"
 DEN_dreams_of_a_kingdom_desc: "The Danish Royal Family has fallen from Grace and its Kingdom even more so. Once stretching from Greenland to Finland, by the end of the Second World War, only Denmark itself remained. The DNSAP Coup in the wake of mass instability by resistance groups forced the Royal Family into Exile after King Frederick IX refused to appoint the DNSAP leader as Prime Minister, eventually ending up in Iceland as privileged guests.\n\nHer Majesty Margrethe II of Denmark still claims the House of Glücksburg rule over Denmark, but with Nazi Rule cemented for nearly three decades and the Royal Family’s Collaboration tainting its legacy, its overdue return may not happen."
 DEN_shadow_of_the_dkp: "The Shadow of the DKP"
 DEN_shadow_of_the_dkp_desc: "The Rebellion on Bornholm by the DKP and other resistance forces have been the centre of nightmares for DNSAP and Reich officials, demonstrating the lack of loyalty many Danes hold towards Germany. The DNSAP Coup in the late ’60s was seen as a reaction to these events, to try and crack down on resistance sympathisers and prevent another rebellion.\n\nHowever the DNSAP, especially under Knudsen’s leadership, has also tried to buy off the Danish population with reinforcements towards the Danish Welfare State and has even promoted (very limited) forms of egalitarianism to try and at least keep Denmark content. While certainly not typical Nazi policy, it keeps the DNSAP in power, and for many in the party, that’s all that matters."

