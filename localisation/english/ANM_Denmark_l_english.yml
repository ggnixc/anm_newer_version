#Leader Descriptions#
 POLITICS_WERNER_BEST_DESC: "Werner Best was a staunch German nationalist who bounced between several far-right parties, so it was little surprise that he eagerly joined the Nazi Party in 1930. He became a part of the SS, using his legal and administrative skills to help organize the nascent Gestapo and coordinate the Night of the Long Knives in Munich. After rivals forced him out of his Gestapo position in 1940, he served in the military occupation of France, and was appointed as the Reich's Plenipotentiary to Denmark in 1942. Best found himself in an odd position, as Denmark was still permitted to retain its monarchy, a cabinet and a semi-democratic parliament. Many compromises were struck, and Best even advised against deporting Denmark's Jewish population to the concentration camps for the sake of maintaining stable relations with the Danish government. An attempt at organizing free elections and a series of labor strikes in 1943 led to Best placing the country under German military occupation and dissolving parliament, but the Danish monarchy, cabinet, and much of the bureaucracy was left intact. Best was also oddly ineffective in stopping the majority of the nation's Jews from escaping to Sweden, and rumors of being a Jewish sympathizer have clung to him for decades.\n\nAfter the war, Denmark stayed in its strange limbo. It remained nominally independent, but still under close supervision, and with the threat of a return to German martial law constantly looming. Best still retained his office, and he briefly attempted to implement wide-reaching Germanization programs. The economic collapse of the 1950s caused funding to dry up and the programs were shuttered, but Best still hopes that his dream of turning Denmark into part of a Greater Germanic Reich will one day be reality."
 
#Ideas#
 DEN_germanias_puppet: "Germania's Puppet"
 DEN_germanias_puppet_desc: "Ever since the death of our feeble democracy, in favor of Fascism, our proud nation has just become another Reichsland in all but name. Firstly led by the incompetent buffoon Mogens Glistrup, nicknamed the "Unterfuhrer" and now by his old deputy who replaced him in 1992, Martin Durvad, an even more pro-German politician.\n\nAs the Eagle of the Reich seems eternal and unbeatable, Denmark’s future remains fundamentally tied with Germany’s and an independent Denmark seems like a faraway dream for many ordinary Danes..."
 DEN_a_collapsing_economy: "A Collapsing Economy"
 DEN_a_collapsing_economy_desc: "The pillar of Denmark’s economy was agriculture for ages but it fully collapsed after Germany’s eastern acquisitions and under the leadership of Mogens Glistrup, the agrarian sector was heavily attacked as he despised it. With forceful mass industrialisation  and privatization policies that he started the economy simply collapsed under itself. These failures became a leading factor in the replacement of the Unterfuhrer.\n\nIn the 90’s the economy started to somewhat get back on track, and this era would be considered to be -relatively- prosperous; but under Bendt Bendtsen’s ministership, the economy would again slowly fall apart, as no one truly took care of it, with Bendsten on constant vacations, and his deputies squabbling with the rest of the government about the direction to take."
 DEN_olshausens_garrison: "Olshausen‘s Garrison"
 DEN_olshausens_garrison_desc: "Nicknamed by many as the New Silkeborg Garrison, is a garrison just north of our border with Germany, surveying the happenings in Denmark. It is led by Klaus Olshausen, the Danish Minister of Defense. \n\nThis move from Silkeborg to the South was motivated by one factor, to make Denmark truly seem free from the Reich’s control, although mostly unsuccessful in this, it has at least managed to diminish the attacks of the Communists on German divisions in Denmark."
 DEN_the_crimson_flag_rises_once_again: "The Crimson Flag Rises Once Again…"
 DEN_the_crimson_flag_rises_once_again_desc: "In 1963, a revolution for freedom, liberty and equality rose in Denmark, led by the DKP, it was eventually crushed by the mighty jackboot of Germania, and the hopes of the reds died.\n\nBut today, the Danmarks Kommunistiske Parti has risen once again, supported by the USSR and the Komintern, it has began regaining it’s strength and started bringing hope to the population of a new revolution which would succeed against the terror of fascism.\n\nAnd this time, there is no silver lining, with constant attacks against our government and new cells appearing every day in our nation, §twe need to immediately act to stop this threat or we could face grave consequences...§!"

#Ministers#
#hog
 DEN_minister_Pia_Merete_Kjaersgaard_hog: "Pia Merete Kjærsgaard"
 DEN_minister_Pia_Merete_Kjaersgaard_hog_desc: "§iNew National Socialism\n--------------\nPia Merete Kjærsgaard was born in Copenhagen to an impoverished family due to the war, and nothing destined her in life for power, influence and victory. But she would triumph over life. Starting her career in politics in 1979 in the ranks of the local DNSAP in Ryvangen, she would eventually become known as the ‘Queen of Copenhagen’, for having through clever political maneuvering and alliances build a political machine in the capital. This political machine’s influence is so strong that even the German-appointed leader Gilstrup would seek authorisation from her to be able to appoint his friends and family to local positions in the city. Through her political machine, she would be propelled to the front of national politics, being made Speaker of the Folketing. As the Unterfuhrer was seemingly losing his hand on state matters, and his replacement seemed imminent many (including Kjærsgaard) expected her to get chosen as the new leader Denmark. But Mussgnug, deeming her too independent, and her being a woman, got her disqualified from the line of succession, effectively giving power to Durvad, but now, Kjærsgaard is set on taking back her rightful place on the throne, and nothing will stop her..."
#eco
 DEN_minister_Bendt_Bendtsen_eco: "Bendt Bendtsen"
 DEN_minister_Bendt_Bendtsen_eco_desc: "§iLiberal Conservatism\n--------------\nBendtsen was born on March 25th, 1954. Most of his early life is unknown, however, he quickly rose to prominence as head of the Odense Police Force. This was a stepping stone for his political career, having served as a member of the Odense City Council in 1989, and also the vice-chairman of the city’s Criminal Policy Association throughout the early 1990s, before going to Copenhagen. Today, Bendtsen is a questionable member of the party, having both democratic leaning ideals similar to the other Scandinavian states but still exhibiting some authoritarian tendency. He promotes reforming Denmark to be more democratic to some degree and for the markets to be more free than they are, believing it will fix the Danish economy. Despite this, his popularity is not high amongst the youth of the nation. He barely does his job, leaving tasks to his deputies while he enjoys his hobbies of golfing and hunting. He is also very corrupt, allegations have shown shady deals with rich businessmen including bribes."
#sec
 DEN_minister_Klaus_Olshausen_sec: "Klaus Olshausen"
 DEN_minister_Klaus_Olshausen_sec_desc: "§iMilitary Mandate\n--------------\nBorn during the twilight of the Second World War some would say that Klaus was predestined to join the army.  A simple and well mannered man from Eisenberg Klaus Olshausen is the current commander of the Danish Security Garrison but his deeds are not reserved only to Denmark. He joined the Wehrmacht forces first as a volunteer for the Speerite forces during the German civil war at the behest of his brother, a law student and a fierce Speer supporter before being formally enlisted in April of ’64 after Speer Sr. emerged victorious from the civil war. In the Wehrmacht he quickly finished his general training which granted him the ability to seek officer training in a newly formed engineering division. It was during his officer training in the early 70s that his superiors noticed a keen interest about guerrilla warfare and its countering developed in young Klaus' mind so with a rank of a lieutenant Klaus was assigned a platoon leader and sent into Serbia to help quell still persisting resistance movements. The Second West Russian War found Klaus still stationed in the Serbian State where he was pulled from active service so he could teach more effective anti-guerrilla tactics to the local troops but a need for experienced men quickly forced Germania to assign him to the 13th Panzer Division which saw heavy fighting all throughout Moskowien. There during one particular heavy fight around the fields of Prokhorovka Olshausen was wounded in the leg which rendered him unable to fight for the rest of the already decided war. After the discharge from the military hospital he was moved around various academies where he taught new soldiers of the Reich. He lived the academic life until the early 90s when a series of unfortunate events in Denmark led to the sacking of Glistrup from the leadership position and reassigning of the previous garrison commander left the spot wide open for the taking. Today he is a well respected figure amongst the German troops stationed in Denmark and he would like it to stay that way."
#for 
 DEN_minister_Povl_Heinrich_Riis-Knudsen_for: "Povl Heinrich Riis-Knudsen"
 DEN_minister_Povl_Heinrich_Riis-Knudsen_for_desc: "§iNeosocialism\n--------------\nPovl Heinrich Riis-Knudsen was born on October 29th, 1949. He is a national socialist, having been prominent in Danish politics ever since the foundation of power through the Zollverein and Koalition der Nacionen cemented German power for good. His policies, however, are questionable to say the least. Throughout the 1980s, Riis-Knudsen spent his years in France at the behest of the former Danish leader Mogens Glistrup. There he came in contact with a new wave of French politicians that began to emerge under the guidance of Roland Goguillot a French politician who aimed to revive neosocialism in France. Together with him and under the influence of the works of Henri de Man, Knudsen published two books that some called controversial and others revolutionary. This new way of thinking defined the rest of his life.Today he holds the post of Denmark’s foreign minister but his more open dissatisfaction with the way Durvard is leading the country and his alleged meetings with Günter Deckert leave many with the same question. How long will Knudsen keep his post before something happens to him?"
#Focus Tree#
 CAL_FREE_DENMARK: "Going Strong for 35 Years"
 CAL_FREE_DENMARK_desc: "We, since our coming to power 35 years ago, have done incredible sacrifices to make sure our marvelous and proud country could run as smoothly as possible.\nIndeed, we hunted down traitors across the state but most importantly, we made proud our southern benefactors residing in the halls of the Volkshalle.\nStill under us, the economy prospered thanks to our competent rulership and it still does today, as we dance on the tunes of our brotherhood between Denmark and the Reich.\n\nNow, if we want this dream to continue, we simply have to keep going like this, like those 35 years and ensure to remove problems from the root or better, even before the plant is given the opportunity to put deep roots in the soil, as we will eradicate the vermin from our country to make sure our idyllic dream continues to take place…Of course all of this with the support of our Teutonic brothers in Germania, that’s for sure."
 DEN_convene_the_folketing: "Convene the Folketing"
 DEN_convene_the_folketing_desc: "The third millenium has finally arrived, a new era of technological progress and economical growth; but, unlike the Liberal westerners and the Judeo-Bolsheviks in the east, we mustn’t forget our roots. Like our ancestors used to do in the glorious ancient times, we will call a ting, an assembly, where we, free men of Denmark can legislate and debate for the future of our great nation, a tradition that must be kept at all cost, and which has been kept thanks to the fruits of New National Socialism.\n\nThis new session of the Folketing is an opportunity, all men and women of the DNSAP will be able to express their views on the issues plaguing our great state, and how to fix those problems -with Germania’s approval, of course- for a better future for the Ariske Folk and for the strength and glory of our grand and proud nation."
 DEN_the_state_of_the_economy: "The State of the Economy"
 DEN_the_state_of_the_economy_desc: "Although it hurts to admit it, our economy isn’t in its best form in the third millennium, and even before 2000, it wasn’t good at all.\nIn fact, our proud nation is dependent on an archaic form of economic development: Agriculture.\n\nIt doesn’t matter that we hold a record in European agricultural production, as one of the most important sectors in the economy of a normal state is non-existent in Denmark, and we are fully dependent on German products.\n\nIndeed, the efforts made up  by our current government to industrialize the country have been a catastrophic failure, as we were unable to enact these policies in a correct way, instead we just wasted precious resources and funds, when they could have been used to save this country in a proper way, if it wasn’t for some minor bureaucratic issues…"
 DEN_mistakes_of_gilstrup: "Mistakes of Gilstrup"
 DEN_mistakes_of_gilstrup_desc: "Mogens Glistrup, nicknamed the Unterfuhrer by many, has probably been the worst ruler for Denmark since Christian IV; being gifted a land full of potential by our Aryan brethren in Germania. Glistrup ruined it all, with increasingly unrealistic taxation plans which angered the populace, failed industrialisation policies which left our country as an agrarian state, seldom able to suffice for it’s needs with the ever expanding globalised economy, and isolating a potential source of support towards New National Socialism in Denmark which the government desperately needed.\n\nBut now, is not the time to weep and cry over the mistakes and scars of the past committed by the Unterfuhrer. No. Now is the time to fix Denmark. To save it from the abyss and destruction that Glistrup brought upon our once great state. Now it is time to follow a plan, a plan which shall revive our nation as the dominator of Scandinavia, a plan which will revive our economy, a plan which will revitalize our culture and our fidelity towards the route to New National Socialism!"
 DEN_review_the_dnsap: "Review the DNSAP"
 DEN_review_the_dnsap_desc: "We cannot hide the truth, for everyone knows it, the party is divided. The DNSAP initially divided on two lines the Glistrupist Line, led by the Unterfuhrer and then Kim Behnke, and the Moderate Line led by Martin Durvad, a more Germanophile and Speerist wing of the Party. \n\nBut now the first has fallen into irrelevancy and the latter has taken over the party, only to be confronted to two new enemies, based on the same divisions as in the NSDAP. On the left, Bendt Bendtsen and his reformists have been advocating for the end of New National Socialism in the profit of democracy, liberalism and other such western ideas which are being sent here by agents of international judeo-bolshevism; but on our right something worse has appeared, Povl Heinrich Riis-Knudsen, a Hitlerite has been advocating for the end of Speerism and for the return to Orthodox National Socialism, while this is already bad enough Riis-Knudsen has interpreted National Socialism as being a leftist ideology, and has recently started to integrate ideas from the Rassemblement National Populaire in France. \n\nWhile the center under Durvad has been able to hold for now, only time will tell if they will maintain their hegemony over party affairs, or if they will succumb to the threats of factionalism and be forced to cede their position to either one of the radicals."
 DEN_dealing_with_the_dkp: "Dealing with the DKP"
 DEN_dealing_with_the_dkp_desc: "For too many years did the communists and judeo-bolsheviks plague our beautiful Germanic state. They are nothing more than a general nuisance to the people and to the government, preying on the weak-willed and the weak-minded by promising them an illusion of a so called workers utopia where everyone will be free. But we know better, we know to what does subscribing to communism usually leads, ruin, both economical and national. With the newest tip on a local headquarters that was presented to us by our loyal secret services we will begin an authorisation process to eradicate this scum from the face of the planer once and for all."
 DEN_decide_on_the_yearly_budget: "Decide on the Yearly Budget"
 DEN_decide_on_the_yearly_budget_desc: "It is now time to put up to vote in the Folketing a proposal for a new budget for the year, of course this important factor in our society and life does not come without controversy. \n\nOn one hand, Bendsten and his reformers want to heavily increase funding for industrial development and subsidizing private companies, while Riis-Knudsen and his reactionaries want to instead give that funding to the army and the police as to counter the communist threat. And for us, this situation is very annoying and problematic, as accepting either of these proposals will not only harm the sector without the extra funding, but will also strengthen one of the factions challenging our hegemony…"
 DEN_acquireolshausenssupport: "Acquire Olshausen's Support"
 DEN_acquireolshausenssupport_desc: "We have authorized an intervention against the newly-found cell of the DKP in Favrskov, but a problem comes to mind, we simply do not have enough troops for such an operation, if we were to move even half a division from one area to another, the radical commies would profit from such an occasion to blow half of the country, so we need someone’s help.\n\nThe only one who can provide us with the necessary support would be Klaus Olshausen, and he’ll definitely need some convincing to assist us in this difficult operation; but if we succeed, we will at least wipe out a good piece of those idiotic rebels."
 DEN_attempt_economic_revitalisation: "Attempt Economic Revitalisation"
 DEN_attempt_economic_revitalisation_desc: "Our economy is not doing so well, and this issue is severely hampering our progress, and so under Bendsten an economic trajectory has been devised: \n\nWe will firstly increase our investment in the construction of light industry, to sustain our state, and to produce goods, consumer goods. These consumer goods are what will satisfy the people, keep them happy, and keep them buying our products, this is what German Capitalism has taught us, and it is what we should have been focusing on since we got into power. \n\nBut we mustn’t forget about economic development itself, while our companies are currently weak, we need to strengthen them, tax exemptions and subsidisation shall help our Danish companies to grow and to expand their business; but supporting our home-grown corporations will not be enough, we need Germania’s finest to help grow the Danish industry, as so we shall request from our ambassador in Germania Søren Espersen to go negotiate deals with the German magnates and industrialists.\n\nHopefully all of this will eventually set us on the right path to economic recovery, to satisfy our rebellious population and to convince them of the righteousness and strength of New National Socialism."
 DEN_send_the_report: "Send the Report"
 DEN_send_the_report_desc: "Now that we have successfully wiped out the radical commies in Favrskov with Olshausen’s support, and we have set in motion our plans for economic progress, we should send a report to Germania to inform them about our new successes. \n\nNow we can simply sit back, continue to develop our state, our economy and our army, and everything will go fine for New National Socialism and the Danish State!"  