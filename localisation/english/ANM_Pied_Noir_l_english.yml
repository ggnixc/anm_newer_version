 #MINISTER NAMES AND DESCRIPTIONS#
 FFR_minister_jacques_bompard_hog:0 "Jacques Bompard"
 FFR_minister_jacques_bompard_hog_desc:0 "------------\nJacques Bompard is a man who has totally lost any hope, hope in Free France, hope in Democracy. The son of a French Officer Manuel Bompard, he was originally a Gaullist member of the Resistance in the mainland, after his activities were found out about in 1961, he would flee from Montpellier, his hometown, to join the exiled government in Abidjan, but instead of finding a patriotic land ready to fight for the freedom of the fatherland, he would find a government in disarray, living truly only thanks to the Général. During the West African War, he would serve in the Free French army, and meet in there Jean-Marie Le Pen, and with the war ending in failure, according to him, he decided that Conservatism has had it’s chance, and that it was the time for a new system. \n\nAfter the democratization of Free France under the Général Leclerc, he would participate in 1977 in the foundation of the Front National and would after Jean-Marie Le Pen’s victory in 1984 be made Minister of Foreign Affairs, and after the death of Marie-France Charles in 1988, he would become the new Prime Minister of Free France. But, seeing the decadence of the system under Le Pen, he has established an ever-growing faction in the party opposed to the Nepotism of JMLP."
 FFR_minister_bruno_gollnisch_for:0 "Bruno Gollnisch"
 FFR_minister_bruno_gollnisch_for_desc:0 "------------\nBruno Gollnisch was born in Paris, in 1950, coming from a long dynasty of academics, politicians, officers, and industrialists. While like his parents initially a supporter of the French Regime, seeing the creation of Britanny and Burgundy, he would become convinced that the Maréchal was wrong, collaboration has failed, and that the Général was right. Soon enough he started drawing up plans to flee the French State, even learning Japanese and Malay for one of his schemes. But, in the end, he finally created his master plan, one that would bring hope to thousands of French people, and annoy the Vichy government.\n\nHe joined the Marine Nationale, patiently rising the ranks, and to finally, in 1978, he would, inspired by the mutiny of a certain Valery Sablin, make a radio broadcast denouncing the Poujadiste government and German authorities which occupy it. Meanwhile he would also start fleeing with his boat, and while many excepted he was going to America, he instead went down south into West Africa, there he would be welcomed as a hero by Chaban, but he was still a nationalist at heart, and he became a convinced supporter of Jean-Marie Le Pen, joining the Front National in 1983, and, he would manage Jean-Marie Le Pen's campaign in 1984, which he won, and with this, Gollnisch had quickly risen throughout the ranks of the party and even became Minister of Foreign Affairs in 1989."
 FFR_minister_louis_aliot_eco:0 "Louis Aliot"
 FFR_minister_louis_aliot_eco_desc:0 "------------\nLouis Aliot was born in 1969, coming from a mostly leftist family with Jewish origins, they would shift to the right after the start of the West African War. Originally a student who militated in favor of Jacques Chaban-Delmas, he would soon lose his respect towards him and the Gaullist cause and found in the Front National the new hope of Free France.\n\nIn 1990 he would join the FN and become a local leader of the Front National de la Jeunesse in Kabadougou, where he would have much success. Soon enough he would come to the attention of Jean-Marie Le Pen and Jacques Bompard as a promising element, and he would rise further and further in the party and government, eventually becoming the new Minister in charge of the Economy in 1999, with a more Free-Market approach than his predecessors. "
 FFR_minister_roger_holeindre_sec:0 "Roger Holeindre"
 FFR_minister_roger_holeindre_sec_desc:0 "------------\nRoger Holeindre, born in 1929 in Corsica, was a member of the Resistance, but while being among the rebels, he had sympathies to the Maréchal’s cause, and opposed the Général’s views, belonging to the giraudist tendency. Eventually, in 1952, he would stop fighting the Vichy government and instead join the newly-created Organisation de l'Armée Secrète, afterwards, he would go to fight in Algeria, where he would become a renowned commander, but for some mysterious reasons, after the war, he would leave the OAS.\n\nLater on, it would be found out, that he  defected to the Free French government where he became a general, and fight in the West African War. At last, in 1984, after the election of JMLP, he would be named the head of the army. Nonetheless, the military under him fell into disorganization and constant mutinies, with Jean-Marie Le Pen even thinking of replacing him, but, as a Hail Mary attempt to save his career, Holeindre proposed the creation of the Zone Militaire de la Haute-Volta et de la Guinée, which was surprisingly accepted, saving his skin for now. Nonetheless, Holeindre's future is still very uncertain, with most of the older members of the government having already been replaced, it is very likely that he will be the next one..."


 WORLD.18151.t:0 "JMLP Resigns From Leadership"
 WORLD.18151.d:0 "Jean-Marie Le Pen, the authoritarian and to some tyrannical ruler of the French Republic, has today announced his resignation as head of the Free French Government for unknown reasons, with most political analysts assuming this as a move to control the affairs of Free France from behind. Nevertheless, his old position is now held by his own daughter Marie-Caroline Le Pen, striking further division in the already unstable state, as many doubt her capacities to be able to lead Free France into the future of the 21st century. For the beginning of her already controversial leadership she has stated in her inaugural speech that Free France will be reformed, into a modern state with many more liberal reforms already being promised by Le Pen and while some greet these reforms with open arms many see them as treason with some of her father's associates already leaving her side. Most notable are Jacques Bompard supported by Alain Robert and François Bel-Ker who formed the Comité de la France Souveraine to actively oppose MCLP."
 WORLD.18151.a:0 "They still exist?"
 
 ANM_freefrance.1.t:0 "A Meeting behind Closed Doors"
 ANM_freefrance.1.d:0 "\"What do you mean resign, or I will make you ? You think I will fall for a such a blunt tactic of bluff ? Sure, you may be surrounded by many traitors in your kind, but in the end, your childish plot has no meaning, your cause is purposeless,  you are in no position to demand anything, truthfully, you should be the one asking clemency from me, to not destroy your career after this coup attempt.\n\" The room was silent, but she smirked at the answer of her father.\n\"What is so funny to you about this ? You think this is just a bad attempt at a joke, you are a lost cause my child, why did I ever think it was good decision to choose you as my heir, to guide our glorious state into a pure and free future?\nFree from the scum of the earth, like your supporters… Stop your foolish plan now, and I may be mo-\"\nShe laughed, and seeing his dumbfounded expression, she finally stopped the monologue of the old fool: \"You don’t seem to understand, you may be saying that you are in a superior position, but truly, everyone knows you are at a loss, you are dying politically, and I have the last dagger needed to shatter completely your regime.\"\n\"You, you my own flesh and blood, you are blackmailing me?\nYou think I will stop, because of such a disgusting attempt to sully my reputation?\nYou are a dishonor on the family name, GET OUT OF HERE NOW !\"\n\"Oh well, too bad for you… they will know all about your past in Vichy, and your original purpose here…\"\nAnd with these words the discussion ended.\nJean-Marie had to make a decision.He started mumbling; \"Who does that idiotic girl think she is, no one can stop me, no one, not her, not Bompard, and certainly not those pesky Anglos or Bosches !\"\nHe hit the shelf in anger, a few books fell down, he took one up, and seeing that it was a writing of Zemmour, immediately threw it at the door.\nHe sat down, his blood was boiling, what could he do, would he kill her? Go that far, to stop liberalism ? Kill his heir ? The person he has groomed all this time, prepared, educated, taught…\nHe has truly lost, he is stuck, just like the miserable Judeo-Bolshevik scum he hunted down in Alger, oh the good old times, he wished he could live in the olden days, in those times, everything seemed so simple to him.\nHe didn’t have to deal with all these miserable cockroaches, he didn’t have to negotiate with such antisexual vermin as Camus or crazed idiots like Robert.\nHe knew that it was time to abdicate, for he had lost.\"What do we do now ?\"\n\"Well, it’s simple Philippe, we just sit tight, and wait, eventually, the old man will come to sense and accept the truth-\"\nAnd as she said this, her parent came into the room and simply declared: "
 ANM_freefrance.1.a:0 "\"You won.\""