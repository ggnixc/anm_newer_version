 ##STARTING SPIRITS##
 FFR_luc_michel_laws:0 "The Luc-Michel Laws"
 FFR_luc_michel_laws_desc:0 "The Protection of the French Legacy act or more commonly known in the Pied-Noir Republic as the Luc Michel laws are a controversial piece of legislation that was passed in the early years of the republic. Penned by the late Luc Michel it was supposed to stop anybody who could damage the French identity from ever holding any power. The laws forbid any non-French citizen from voting and running in any election. A French Citizen is defined as any citizen who was born in the nation and has a French Citizen as a father. Citizenship may also be bestowed by the government, usually on white french refugees from France. "
 FFR_return_of_the_exiles:0 "Return of the Exiles"
 FFR_return_of_the_exiles_desc:0 "One of the Consequences of the recent coalition between the National Party of France, and the French Monarchist Leagues, is that the government was forced into repealing the law of exiles. This was due to the Monarchist Leagues refusing to join unless the government promised to pass the law, and with much teeth-clenching, the law was repealed. Despite not being the mainland, many french aristocrats and exiles have decided to move to the nation, maintaining the hope of seeing a French nation with a glorious Monarchy."
 FFR_growing_industry:0 "Growing Industry"
 FFR_growing_industry_desc:0 "It has been many years since the Germans bombed the North African states into the ground, and while we have diligently been reconstructing the region, the economy has born many scars from the bombings. Those scars are healed, and industrialization has finally begun. The main effects of this are the new companies that have grown to become the Titans of the PNR. With the National Party of France claiming this is necessary for the development of the nation."
 FFR_ppao_lays_dormant:0 "PPAO lays dormant"
 FFR_ppao_lays_dormant_desc:0 "Parti Pan-African d’Afrique de l’Ouest or PPAO for short is a radical communist and terrorist organization that aims to destroy our way of living. Ever since it formed in 1990 it provoked fear among our law-abiding French citizens. Our government managed to decentralize its command back in the '90s but PPAO still exists and causes minor terror attacks in the heartland of our nation.\n\n§RPPAO LAYS DORMANT FOR NOW§R"
 
 POLITICS_JEAN_MARIE_LE_PEN_DESC:0 "Jean-Marie Le Pen is a controversial figure, but, Le Pen, thinks of himself as a savior, who would bring back France from the dead and Chaban's pro-western and liberal policies inspired from no other evil, but zionism itself.\nJean Louis Marie Le Pen was born in 1928 in the French Region of Brittany as the sole  son of a humble Fisherman and since he was a boy, he always showed interest in work. But fate was cruel with the young Jean, becoming an orphan when his father died in 1942, claiming that his father died fighting the German occupier.\n\nMost of his past after that is at best vague, as JMLP makes it sure that no one can truly make a correct assumption about his previous activities, claiming this and declaring that to confuse those who even dare to ask him questions about his past life. Western media commonly compares this strategy to ‘doublethink’ a concept from the famous book 1984 written by George Orwell. \n\nWhat is certain, is that Jean Louis Marie Le Pen started his career in Free France as an officer in the Free French army where he illustrated himself as a great commander and was hailed as a hero. After Philippe Leclerc de Hauteclocque's resignation in 1977, he left the military, founded the Front National, and on the advice of his wife, renamed himself Jean-Marie Le Pen to seduce the Catholic electorate. He then ran against Jacques Chaban-Delmas in the presidential election, but he lost, only by a small margin. But in 1984, Chaban's luck wouldn't be enough, and Jean-Marie Le Pen, who allied himself with Libération and Restauration Nationale would win. \nBut under Le Pen, things would only go worse for the rump state that was Free France, he would establish a fascistic dictatorship, but he would also deceive many of his followers, as he would use his new powers to reward his family with more money and positions. He would also establish a more moderate version of the Statuapart, the brainchild of Renaud Camus the leader of Libération. These decisions would further alienate the OFN and the heavily gaullist military, bringing even more instability to the Fourth Republic. Now Le Pen is slowly loosing his iron grip on the French nation, as both his daughter and his dauphin struggle to take more and more influence away from him."
 
 
 ##TNO IMPORTS TO AVOID DAMAGE##
 FFR_military_administration:0 "Military Administration"
 FFR_military_administration_desc:0 "Our current situation has forced Charles de Gaulle to put under military control most of our territory. The generals are free to befriend the local chiefs and leaders, giving them access to their personal troops. While it is an efficient method, this prevent us from knowing what is happening in the rest of the nation, and is leaving a lot of power in the hands of our generals."
