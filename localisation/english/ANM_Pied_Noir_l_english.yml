 FFR_spirit_french:0 "Spirit of the French Republic"
 FFR_spirit_french_desc:0 "In the sole existence of Free France, the spirit of our long lasting democratic traditions still lives. While our armed hand on the continent is still the Résistance, even here in the deep lands of the Ivory Coast, we still fight for our ideals. Through the Comet Line, exiles were sent here from France and Belgium, believing in the all powerful nature of democracy and freedom, fighting for their country, even across oceans."
 FFR_case_belgian_citizenship:0 "The Belgian Question"
 FFR_case_belgian_citizenship_desc:0 "The Comet Line has brought to Free France not only French résistants, but also Belgians. The Belgian resistance movement was a great help in France's struggle, and when the war was over De Gaulle proposed to the Belgians to come in Free France until Belgium, in exchange of promising the liberation Belgium right after liberating France. After more than 15 years of exile the Belgian political status is still undetermined, and the Belgians are urging the Free French government to find a solution."

 FFR_ami_plan:0 "Amilakhvari's Plan"
 FFR_ami_plan_desc:0 "WIP LOL"
 
 
 
 FFR_statuapart:0 "Statuapart"
 FFR_statuapart_desc:0 "Statuapart is a controversial set of laws that are the brain child of Renaud Camus who created them in a debate during his time in the Front National but it was Jean-Marie Le Pen who presented them to the world stage in their current form. While Camus advocated for a complete segregation of the natives and non natives last seen during the Jim Crow era in the United States, Le Pen advocated for and later implemented a more pragmatic and diluted version of the segregation laws. With them in power any black native of the French Republic is barred from holding any and all political office and is also banned from voting."
 
 FFR_espirit_de_la_france_libre:0 "Esprit de la France Libre"
 FFR_espirit_de_la_france_libre_desc:0 "Sixty years ago a great tragedy befell us when the Germans crushed our forces at Sedan and subsequent capitulation of our country when Paris fell. What was left of the French forces that still sought to fight the Germans reorganised under general de Gaulle in Algeria and other French colonies but as the war progress it became ever so apparent that France will not be liberated in this war and the German peace deal that ended the war in Europe completely shattered the French colonial possessions except on the Ivory Coast were even to this day a defiant French state exists and with it the spirit of French liberation."
 
 FFR_le_pen_oligarchy:0 "The Le Pen Oligarchy"
 FFR_le_pen_oligarchy_desc:0 "Jean-Marie Le Pen, even before the start of his infamous presidency, had firmly put the Front National under his rule, and, has been awarding positions and roles to his family without any qualifications, this nepotist oligarchy of the Le Pen family is hated by many of the supporters of Jean-Marie Le Pen, and even more by his ennemies. Certain people even suspect, that he is grooming his eldest daughter, Marie-Caroline Le Pen to be the new leader, instead of Jacques Bompard, his dauphin. While for now these all seem like rumours, they may very well prove themselves to be true…"
 
 FFR_unloyal_army:0 "Disloyal Army"
 FFR_unloyal_army_desc:0 "The Army, supposedly apolitical, is still filled with the same people as in Leclerc's and Chaban's time. This has led to mass tension between the Gaullist Military and the Free French Government ever since the controversial election of Jean-Marie Le Pen.\nThis division needed a solution quickly, or else the Front National could be overthrown, as so, Roger Holeindre proposed the creation of the Zone Militaire Française de la Haute-Volta et du Soudan was created on the pretext of crushing the Pan-Africanist Resistance in the area, but in reality was just a way to reassign the Gaullist Generals. §xBut as Le Pen grows old, and his regime weakens, the military sees a new opportunity...§!"
 
