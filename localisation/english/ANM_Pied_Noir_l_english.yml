 #LEADER DESCRIPTIONS#
 POLITICS_JEAN_MARIE_LE_PEN_DESC:0 "Jean-Marie Le Pen is a controversial figure, but, Le Pen, thinks of himself as a savior, who would bring back France from the dead and Chaban's pro-western and liberal policies inspired from no other evil, but zionism itself.\n\nJean Louis Marie Le Pen was born in 1928 in the French Region of Brittany as the sole  son of a humble Fisherman and since he was a boy, he always showed interest in work. But fate was cruel with the young Jean, becoming an orphan when his father died in 1942, claiming that his father died fighting the German occupier.\n\nMost of his past after that is at best vague, as JMLP makes it sure that no one can truly make a correct assumption about his previous activities, claiming this and declaring that to confuse those who even dare to ask him questions about his past life. Western media commonly compares this strategy to ‘doublethink’ a concept from the famous book 1984 written by George Orwell. \n\nWhat is certain, is that Jean Louis Marie Le Pen started his career in Free France as an officer in the Free French army where he illustrated himself as a great commander and was hailed as a hero. After Philippe Leclerc de Hauteclocque's resignation in 1977, he left the military, founded the Front National, and on the advice of his wife, renamed himself Jean-Marie Le Pen to seduce the Catholic electorate. He then ran against Jacques Chaban-Delmas in the presidential election, but he lost, only by a small margin. But in 1984, Chaban's luck wouldn't be enough, and Jean-Marie Le Pen, who allied himself with Libération and Restauration Nationale would win. \nBut under Le Pen, things would only go worse for the rump state that was Free France, he would establish a fascistic dictatorship, but he would also deceive many of his followers, as he would use his new powers to reward his family with more money and positions. He would also establish a more moderate version of the Statuapart, the brainchild of Renaud Camus the leader of Libération. These decisions would further alienate the OFN and the heavily gaullist military, bringing even more instability to the Fourth Republic. Now Le Pen is slowly loosing his iron grip on the French nation, as both his daughter and his dauphin struggle to take more and more influence away from him."
