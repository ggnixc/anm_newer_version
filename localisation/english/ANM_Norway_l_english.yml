 ## Descriptions ##
 POLITICS_JACK_ERIK_KJUUS_DESC: "Can a man be born with hatred in his heart? Or does hatred only seep through the cracks of a broken, battered soul? The life of Jack Erik Kjuss may just prove the latter.\n\nBorn in Oslo in the late 1920s, Kjuus was only a boy when the Germans conquered the craggy cliff sides of his home town; life was never the same after that. By the time German rule had solidified in the late 40s, Kjuss had found a home in the Nasjonal Samling Party — a fiercely racist, pro-German political organisation. Becoming enamoured with the so-called “Aryan supremacy” of his Norwegian blood, Kjuus rapidly aligned himself with the radical Fascists within the party.\n\nAfter entering the Storting in 1975, he became known for his fervent support of harsh, Nazi-adjacent racial policies. As increasing economic hardship and an ever-emboldened resistance movement claimed the careers of several Minister-Presidents, Kjuss threw himself into the running in 1990 — determined to succeed where other “degenerates” failed, .\n\nBacked by radicals, German settlers and a handful of mainstreamers, Kjuss’s bid for the top job paid off handsomely. Now, as Minister-President of Norway, Kjuus has dragged his country kicking and screaming into a new era of fascism, enacting extreme sterilisation policies and pledging fierce loyalty to Germania. Kjuss’s “accomplishments”, however, have come at the price of extreme unpopularity — a situation which has worried many of his allies in the Storting. As each of Kjuus’ moves earns him far more enemies than friends, some fear that, like his predecessors, the reins of power may soon be wrestled out of his hands..."

### Ideas ###
 NOR_parliamentary_fascism: "Parliamentary Fascism"
 NOR_parliamentary_fascism_desc: "Whilst Norway is by no means a Democracy, in many ways, the Storting still acts like any democratically-elected parliament. With the Minister-President and Cabinet still accountable to Parliament, the factions and groupings in the Storting vie for influence and power, much like their ideological brethren in Britain or Germany. While many Radicals in the Nasjonal Samling seek to curb its power and Influence, they remain a fringe grouping with most Norwegian politicians fiercely supportive of the current order.\n\nWith the Chamber split between the Norwegian NSDAP (Representing the sizeable German Settler Community), the Radical and Mainstream Factions of the Nasjonal Samling Party and the Reformist National Sovereignty Group, the Storting is willing to stand up to the Minister-President and remove them should they desire to."
 NOR_deep_unpopularity: "Deep Unpopularity"
 NOR_deep_unpopularity_desc: "Whilst no Minister-President has ever been popular with the Norwegian People, since Kjuus was elected Minister-President in 1990, he has been the most unpopular Norwegian Leader since Quisling was forced out of power by the Storting in the Mid-40s. Whilst Kjuus can rely on the support from the NS Radicals, Fascist Militias and parts of the German Settler Community, he is despised by the remaining 95% of Norway due to his hardcore fascist rhetoric, extreme sterilisation policies and the common view of him being a lapdog to the Reich.\n\nThanks to this deep unpopularity, many groups have begun to oppose the Fascist State with Partisan attacks outright. Monarchists, Republicans, Liberals, Conservatives, Socialists and Nationalists, divided in many ways, but united in their hatred of Kjuus."
 NOR_great_oil_robbery: "The Great Oil Robbery"
 NOR_great_oil_robbery_desc: "The Discovery of Oil in the North Sea in the Mid ‘70s promised Norway a new age of economic prosperity. Thanks to Gulbrand Lunde, Norway and Germany were able to negotiate a deal where Germany would pay fair compensation for Norwegian Oil. It was meant to propel Norway into a Golden Era. Then Gulbrand Lunde passed away and left behind a decade of Political Instability.\n\nExploiting this opportunity, German Diplomats were able to extract concessions from Norway every time a new Minister-President was elected in exchange for their “support” for the new Minister-President. By the time of Kjuus’s elevation to MP, Germany essentially had a monopoly on Norwegian Oil, with over 90% of Norway’s Oil going straight to Germania. This Golden Opportunity has now turned into a Spoiled Can of Hope."
