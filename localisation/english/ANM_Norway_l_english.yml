 ## Descriptions ##
 POLITICS_JACK_ERIK_KJUUS_DESC: "Can a man be born with hatred in his heart? Or does hatred only seep through the cracks of a broken, battered soul? The life of Jack Erik Kjuss may just prove the latter. \n\nBorn in Oslo in the late 1920s, Kjuus was only a boy when the Germans conquered the craggy cliff sides of his home town. Life was never the same after that. By the time German rule had solidified in the late 40s, Kjuss had found a home in the Nasjonal Samling Party — a fiercely racist, pro-German political organization. Kjuss would become enamored with the so-called 'Aryan supremacy' of his Norwegian blood, and, in a matter of time, would align himself with the radical Fascists within the party. \n\nKjuss entered the Storting in 1975, where he became known for his fervent support of harsh, Nazi-adjacent racial policies. Increasing economic hardship and a boiling-over resistance movement would claim the careers of more than a few Minister-Presidents in the ensuing years, and, Kjuss, determined to succeed where other 'degenerates' failed, threw himself into the running in 1990. \n\nBacked by radicals, German settlers and a handful of mainstreamers, Kjuss’s bid for the top job paid off handsomely. Now, as Minister-President of Norway, Kjuus has dragged his country kicking and screaming into a dark new era of fascism, enacting extreme sterilization policies against those he deems 'unworthy' and pledging fierce loyalty to Germania. Kjuss’s 'accomplishments', however, have come at the price of extreme unpopularity — a situation which has worried many of his allies in the Storting. As each of Kjuus’ moves earns him far more enemies than friends, some fear that, like his predecessors, the reins of power may soon be wrestled out of his hands..."

