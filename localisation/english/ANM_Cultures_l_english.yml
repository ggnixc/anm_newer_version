  var_nationality.900: "Taafien§F, made up of a motley assortment of colonial soldiers, career bureaucrats, greedy whalers, and naive adventurers. The residents of the Kerguelen Islands, though distinctly §bFrench§!, are a diverse bunch. The struggle for life in this harsh wasteland has led to the creation of a sense of shared identity. The inhabitants have even developed an ad-hoc variation on the §bFrench§! language for themselves known as Taafien. Deriving its name from TAAF or the Terres australes et antarctiques françaises, the unique slang dialect is a mix of military and technical jargon combined with years of inside jokes and references§!"
