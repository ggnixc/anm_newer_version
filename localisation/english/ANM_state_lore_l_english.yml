 # Notes
 
 # [GetSLName] is a scripted loc used to get custom names, for example, Guangzhou, Hong Kong, and Macaw's name is called "The Three Pearls" instead of the usual state name it's parented in, located in TNO_state_lore_misc_scripted_localisation.txt
 
 # INITIALS are preferably airport codes: for example LAX as Los Angeles, but not when it doesn't make sense, i.e. OPO as Porto. I chose to use POR in that case.

 state_lore_initials.1: " SCL "
 state_lore_name.1: "Santiago"
 state_lore_desc.1: "Backdropped by the picturesque Andes Mountains, Santiago is a city with a deep-rooted history. Founded in 1541 by Spanish conquistador Pedro de Valdivia, the city's colonial past is evident in its well-preserved architecture — particularly in the historic Plaza de Armas.\n\nModern-day Santiago is a bustling metropolis that seamlessly blends its historical charm with modernity. The city's vibrant cultural scene includes numerous museums, galleries, and theaters that celebrate Chilean art, music, and literature. Visitors can immerse themselves in the rich cultural tapestry of the country, experiencing its uniquely Chilean blend of ancient traditions and contemporary luxuries."

 state_lore_initials.2: "LED"
 state_lore_name.2: "Leningrad"
 state_lore_desc.2: "The city now known as Leningrad has gone through more renamings in its history than most families have children. When Peter the Great established it, he called it Sankt-Pieter-Burch, then he had it renamed to Saint Petersburg. In 1914, it was renamed Petrograd; in 1924 it was renamed Leningrad after the death of Lenin. After the German conquest in the Second World War, it returned to the German translation of its original name. After yet another war, the Third Great Patriotic War, the Union once again renamed it back to Leningrad after its reclamation. \n\nMuch like anywhere else in the former Reichskommissariat Moskowien, the ethnic German population were expelled and repopulated with Russians following the end of the war. Leningrad once again serves as the heart of the Soviet Baltic Fleet, guarding the Northern Flank of the Union."

 state_lore_initials.3: "VOG"
 state_lore_name.3: "Stalingrad"
 state_lore_desc.3: "The city now known as Stalingrad was founded as the fortress of Tsaritsyn in 1589. By the 1800s, this fortress had become an important Volga riverport and commercial centre, which caused a population explosion. In 1917, Tsaritsyn fell under Soviet control, but the Whites fought hard to regain control over it for three years. Five years after the Whites were defeated, the city was named Stalingrad for Iosef Stalin, who played a key role in the battle; it was known by this name until Field Marshal Paulus conquered the city during the Second World War.\n\nFollowing the Soviet Victory in the Third Great Patriotic War, the city was once again renamed to Stalin's namesake, with his role in official Soviet history reinstated by Mikhail Suslov. The Russian population returned from their long exile, while the Volga German population residing there were expelled."

 state_lore_initials.4: "MOW"
 state_lore_name.4: "Moskva"
 state_lore_desc.4: "Moscow, in Russian Moskva, is for five hundred years the centre of the unified Russian state, and in that role led the Russian conquests and defenses against countless enemies. Even when the Tsardom fell, Moskva retained its importance as the capital of the Soviet Union and the place from which the Revolution was to be spread. \n\nThe temporary German occupation during the Soviet Union's moment of weakness never put an end to the importance of Moscow. With the city's reclamation by the Union in the Third Great Patriotic War, and the Kremlin being restored to its previous glory, the Revolution once again marches forward. A spectre is haunting Europe — the spectre of communism, and Moscow will be the shining beacon that leads it forward."

 state_lore_initials.5: "MMK"
 state_lore_name.5: "Murmansk"
 state_lore_desc.5: "In the bloody days of World War One, Tsar Nicholas ordered that a naval port be built in the White Sea, so that Russia's allies could continue to send her supplies without fear of German U-Boat attacks. With such a vital strategic role, it took Murmansk just a few years to become humanity's largest city beyond the Arctic Circle.\n\nThough it held against the Axis armies for years, Murmansk ultimately fell during the final months of World War Two, becoming Finland's 2nd largest city temporarily. In 1968 however, the reborn Russian Soviet Federative Socialist Republic once again knocked on Finland's doors to reclaim its priced Arctic port. Despite the intervention of nearby Sweden, Russia prevailed in its reclamation and the port was vital in supplying Russia during the Third Great Patriotic War against the Germans."

 state_lore_initials.6: "LSS"
 state_lore_name.6: "Leningradskaya Station"
 state_lore_desc.6: "Formerly named George Anderson Jr. Station under the OFN Antarctic Administration, the naval base was often utilised by the Americans to keep an eye out on German and Japanese movements in Antarctica. Nevertheless, following the dissolution of the OFN Antarctic Administration due to differences between the three countries, New Zealand inherited the station as part of its claimed Antarctic territories in Victoria Land. \n\nLow funding and political apathy from Wellington resulted in the neglect of the station, until a surprising candidate showed up; the Union of Soviet Socialist Republics, fresh from its victory in reclaiming Muscovy. In order to regain legitimacy on the world stage as a Great Power, the Soviet Union proposed to lease the station in exchange for a sum of money, which was accepted. Today, the station hosts various research expeditions to study meteorology, Earth's magnetism, oceanology and glaciology, and is a sign of the Soviet Union's resurgence on the world stage."