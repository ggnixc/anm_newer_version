 # Notes
 
 # [GetSLName] is a scripted loc used to get custom names, for example, Guangzhou, Hong Kong, and Macaw's name is called "The Three Pearls" instead of the usual state name it's parented in, located in TNO_state_lore_misc_scripted_localisation.txt
 
 # INITIALS are preferably airport codes: for example LAX as Los Angeles, but not when it doesn't make sense, i.e. OPO as Porto. I chose to use POR in that case.

 state_lore_initials.1: "SCL"
 state_lore_name.1: "Santiago"
 state_lore_desc.1: "Backdropped by the picturesque Andes Mountains, Santiago is a city with a deep-rooted history. Founded in 1541 by Spanish conquistador Pedro de Valdivia, the city's colonial past is evident in its well-preserved architecture — particularly in the historic Plaza de Armas.\n\nModern-day Santiago is a bustling metropolis that seamlessly blends its historical charm with modernity. The city's vibrant cultural scene includes numerous museums, galleries, and theaters that celebrate Chilean art, music, and literature. Visitors can immerse themselves in the rich cultural tapestry of the country, experiencing its uniquely Chilean blend of ancient traditions and contemporary luxuries."

 state_lore_initials.2: "LED"
 state_lore_name.2: "Leningrad"
 state_lore_desc.2: "The city now known as Leningrad has gone through more renamings in its history than most families have children. When Peter the Great established it, he called it Sankt-Pieter-Burch, then he had it renamed to Saint Petersburg. In 1914, it was renamed Petrograd; in 1924 it was renamed Leningrad after the death of Lenin. After the German conquest in the Second World War, it returned to the German translation of its original name. After yet another war, the Third Great Patriotic War, the Union once again renamed it back to Leningrad after its reclamation. \n\nMuch like anywhere else in the former Reichskommissariat Moskowien, the ethnic German population were expelled and repopulated with Russians following the end of the war. Leningrad once again serves as the heart of the Soviet Baltic Fleet, guarding the Northern Flank of the Union."

 state_lore_initials.3: "VOG"
 state_lore_name.3: "Stalingrad"
 state_lore_desc.3: "The city now known as Stalingrad was founded as the fortress of Tsaritsyn in 1589. By the 1800s, this fortress had become an important Volga riverport and commercial centre, which caused a population explosion. In 1917, Tsaritsyn fell under Soviet control, but the Whites fought hard to regain control over it for three years. Five years after the Whites were defeated, the city was named Stalingrad for Iosef Stalin, who played a key role in the battle; it was known by this name until Field Marshal Paulus conquered the city during the Second World War.\n\nFollowing the Soviet Victory in the Third Great Patriotic War, the city was once again renamed to Stalin's namesake, with his role in official Soviet history reinstated by Mikhail Suslov. The Russian population returned from their long exile, while the Volga German population residing there were expelled."

 state_lore_initials.4: "MOW"
 state_lore_name.4: "Moskva"
 state_lore_desc.4: "Moscow, in Russian Moskva, is for five hundred years the centre of the unified Russian state, and in that role led the Russian conquests and defenses against countless enemies. Even when the Tsardom fell, Moskva retained its importance as the capital of the Soviet Union and the place from which the Revolution was to be spread. \n\nThe temporary German occupation during the Soviet Union's moment of weakness never put an end to the importance of Moscow. With the city's reclamation by the Union in the Third Great Patriotic War, and the Kremlin being restored to its previous glory, the Revolution once again marches forward. A spectre is haunting Europe — the spectre of communism, and Moscow will be the shining beacon that leads it forward."

 state_lore_initials.5: "MMK"
 state_lore_name.5: "Murmansk"
 state_lore_desc.5: "In the bloody days of World War One, Tsar Nicholas ordered that a naval port be built in the White Sea, so that Russia's allies could continue to send her supplies without fear of German U-Boat attacks. With such a vital strategic role, it took Murmansk just a few years to become humanity's largest city beyond the Arctic Circle.\n\nThough it held against the Axis armies for years, Murmansk ultimately fell during the final months of World War Two, becoming Finland's 2nd largest city temporarily. In 1968 however, the reborn Russian Soviet Federative Socialist Republic once again knocked on Finland's doors to reclaim its priced Arctic port. Despite the intervention of nearby Sweden, Russia prevailed in its reclamation and the port was vital in supplying Russia during the Third Great Patriotic War against the Germans."

 state_lore_initials.6: "LSS"
 state_lore_name.6: "Leningradskaya Station"
 state_lore_desc.6: "Formerly named George Anderson Jr. Station under the OFN Antarctic Administration, the naval base was often utilised by the Americans to keep an eye out on German and Japanese movements in Antarctica. Nevertheless, following the dissolution of the OFN Antarctic Administration due to differences between the three countries, New Zealand inherited the station as part of its claimed Antarctic territories in Victoria Land.\n\nLow funding and political apathy from Wellington resulted in the neglect of the station, until a surprising candidate showed up; the Union of Soviet Socialist Republics, fresh from its victory in reclaiming Muscovy. In order to regain legitimacy on the world stage as a Great Power, the Soviet Union proposed to lease the station in exchange for a sum of money, which was accepted. Today, the station hosts various research expeditions to study meteorology, Earth's magnetism, oceanology and glaciology, and is a sign of the Soviet Union's resurgence on the world stage."

 state_lore_initials.7: "SLP"
 state_lore_name.7: "Schirmacher Station"
 state_lore_desc.7: "The vast reach of the German Reich extends across much of the globe, and at its extremity, Schirmacher Station stands resolute against the desolation of Antarctica. Situated within the Antarctic oasis, discovered and named by Richardheinrich Schirmacher during the 3rd German Antarctic Expedition. These oases are patches of land naturally free of snow and ice, which, along with the oasis' easy access to freshwater lakes and vast 25 km long and 3 km wide size, made it advantageous for settlement during the Scramble for Antarctica.\n\nOriginally, Schirmacher Station was established as the military counterpart to Germany’s colonial initiatives on the icy continent. However, where broader colonial efforts faltered, Schirmacher Station has significantly exceeded its initial purpose, accommodating approximately 1,250 permanent residents. While people come and go with the seasons, there's always another project requiring their direct attention. The nearby Admiral Graf Spee harbour and double-runway airfield cement Schirmacher Station as the central supply hub for the administration, distributing goods to interdependent stations on a bi-weekly basis."

 state_lore_initials.8: "BGH"
 state_lore_name.8: "Begerheim"
 state_lore_desc.8: "During the evacuation of the German Antarctic colonies in Neuschwabenland, a cadre of the Reich's most "accomplished" minds were discreetly relocated to a new base on the Kiss Ice Shelf, named Begerheim. This base, named after the intrepid Aryan explorer Bruno Beger, was formerly an Ahnenerbe stronghold tasked with finding evidence to support various fundamental scientific theories.\n\nThe population of Begerheim is small compared to other Antarctic settlements, comprising two hundred and twenty individuals, divided between German civilian personnel and Norwegian scientists. It operates a heliport for supply sorties and a submarine bay for deep ocean surveillance teams to conduct their operations.\n\nBegerheim, temporarily occupied by the Uruguayans, is now part of the German claim on Neuschwabenland. Due to growing interest from their European satellite state, local operations are primarily organised by the Norwegian Polar Institute. The base conducts its research autonomously, but all relevant information is openly distributed within Europe's academic circles."

 state_lore_initials.9: "PAF"
 state_lore_name.9: "Port-aux-Français"
 state_lore_desc.9: "More of an outpost than a city, Port-aux-Français, with its seven hundred semi-permanent residents, exists in a state of melancholy on the frigid, foggy shores at the edge of the world. Though claimed by the French for centuries and occasionally visited by whalers and scientists, it wasn't until the Scramble For Antarctica in the 1950s that anything resembling civilization emerged on the Kerguelen Islands. Hastily assembled on behalf of the Germans as a transit point in their conquest of Neuschwabenland, a flurry of activity and investment turned the rocky islands into a functional military base, complete with an airstrip and harbour.\n\nPrimarily administered by the French with a significant German garrison, the daily life of Port-aux-Français's residents remains unremarkable. Determined to maintain their empire, Paris invested heavily to ensure the base's role as a vital supply depot for Neuschwabenland. Despite the significant progress made over the decades to make the residents feel at home, the recent influx of the German diaspora has disrupted the harmony. Germans and French are now cohabitating on an island marked by barbed wire and concrete fortifications, reflecting the similar sentiment found on the European continent."
 
 state_lore_initials.10: " BNE "
 state_lore_name.10: "Brisbane"
 state_lore_desc.10: "Founded in 1824 as the Moreton Bay Penal Settlement, Brisbane was relocated southward along the Brisbane River in 1825 and now sits as the Capital of Queensland. Brisbane has had a tumultuous last few decades having weathering a storm it has only just emerged from. In 1971, Brisbane entered a state of emergency during the Springboks’ all-white rugby team tour, which ignited large-scale protests as OFN opinions on South African segregation continued to sour.\n\nThroughout the 1970s, mounting demonstrations against the Bjelke-Petersen government led to severe restrictions of civil liberties in Brisbane. Riot police cracked down on civil unrest, book burnings were staged, and it all culminated with the total ban of all forms of protest in 1977. The 1980s saw a time of damage control by the Bjelke-Petersen government with strategic propaganda campaigns to recast these measures as taking a strong stance against dissidents and showing decisive leadership. Paired with mining initiatives aimed at driving economic growth. These efforts have transformed Brisbane from a city rife with Anti-Bjelke-Petersen sentiment to his most loyal supporting bases in the span of a mere 2 decades."
 
 state_lore_initials.11: " SYD "
 state_lore_name.11: "Sydney"
 state_lore_desc.11: "Sydney stands as Australia's largest and most prominent city, established in 1788 upon the shores of Port Jackson as a penal colony. It has since flourished into a center of the Western world in the east. Considered both the cultural and financial capital of Australia, Sydney hosts the iconic Sydney Opera House, a grand construction completed in 1973. This architectural marvel is seen as the defining symbol of the city, recognized by many as one of the great wonders of the modern world.\n\nSydney also boasts an expansive inter-regional finance and commerce sector, taking full advantage of its strategic position as the gateway to the east for the OFN. Its crowded port not only serves as a vital conduit for trade and supplies but also houses many naval fleets that stand ever-ready, with their guns trained to the north, towards the Rising Sun.\n\nHowever, beneath Sydney's bright and prosperous exterior, there lies unrest. Labor movements, once quiet, now grow restless as an increasing number of citizens take to the streets fed up with the status quo."
 
 state_lore_initials.12: " MEL "
 state_lore_name.12: "Melbourne"
 state_lore_desc.12: "The area of Melbourne has long been inhabited by Aboriginal tribes, but it was not until the arrival of British-Australian colonial settlers to Port Phillip Bay in the 1800s that modern Melbourne was founded. In 1835, the first permanent Australian settlement in Melbourne was established by free Australian settlers from Tasmania. Throughout the 1800s, Melbourne experienced exponential growth, driven by its strategic port location and the 1860s Victorian gold rush that led to the settlement's population doubling in just 6 months.\n\nBy the 1880s, Melbourne had become the wealthiest and fastest-growing city in the world, experiencing a major population boom and massive infrastructure expansion. Melbourne's boom slowed only with the financial crisis of the 1890s. Between 1901 and 1927, Melbourne served as the provisional capital of the newly united Australia, hosting the first Australian Federal Parliament until the establishment of Canberra.\n\nSince the federalization of Australia, Melbourne has been the Labor Party's foremost stronghold, a fact that remains true today. Despite decades of efforts to break Labor's hold on the city, Joh Bjelke-Petersen and his government have been unable to extinguish the unyielding flame of the Labor Party in Melbourne."
 
 state_lore_initials.13: " CBR "
 state_lore_name.13: "Canberra"
 state_lore_desc.13: "Canberra is the corrupted, beating heart of Australia—a city born not from unity but from dispute. Built completely from the ground up due to an inability to agree on whether Melbourne or Sydney should host the nation's capital. This spirit of contention is a trend that would follow the city into the halls of government.\n\nUnique for Australian cities, Canberra’s development was entirely planned. Designed by a team of American architects with the sole purpose of housing the federal government. Yet, despite its planned origins, the city feels more disorganized than its unplanned sister cities. It has been criticized for being sprawling, disjointed, and lacking a sense of soul. Its carefully crafted layout often feels more like an experiment in isolation than the foundation of a thriving community.\n\nCorruption and inefficiency have long plagued Canberra, even before Joh Bjelke-Petersen and his National Party rose to power. Whatever hope existed to root out corruption in the city was snuffed out with the election of the National government. This allowed the initial infestation to take deep roots to the city’s very core, reflected both in the dysfunction of local governance and in the inefficiency, cronyism, and brutality of the national level government. As a result, Canberra has become a symbol of a system bogged down by its own dysfunction."
