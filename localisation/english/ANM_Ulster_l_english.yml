## Descriptions ##
 POLITICS_JOHN_GORMAN_DESC: "First Minister\n--------------\nNorthern Ireland has changed a lot over the past century, and nothing symbolises this more than its current First Minister John Gorman, a Catholic leading a Protestant State, and a Unionist in an Irish Republic.\n\nAn Omagh native, Gorman was a British Veteran who fought valiantly to defend Britain during Operation Sealion. Britain’s fall forced Gorman to flee with the rest of the British Exiles to Canada. He soon joined the remnants of MI5 and began working as an undercover agent in Northern Ireland for the exiled British Government, regularly reporting back on the tense situation in the North and even helping with some smuggling runs for Unionist paramilitaries.\n\nHe was transferred to the Foreign Department soon after the start of the Ulster Crisis, playing a major role in the St Brigid's Day Agreement, helping to convince the Irish, British and Unionist representatives to sign the agreement despite their reservations. After the agreement, Gorman was able to move back to Northern Ireland officially where he soon joined the moderate unionist UUP. He quickly joined the new Northern Ireland Government, often playing as the mediator in disputes within Government and Parliament.\n\nThe collapse of the Trimble Administration in 1993 and the subsequent election in 1994 delivering a rise in support for more extreme parties, made the next government formation difficult. However, after months of talks, a new devolved government was formed, with the Catholic Unionist John Gorman as First Minister and the Protestant Nationalist John Turnly as Deputy First Minister. Now at the helm as a unity candidate in a state intent on dividing itself, Gorman has a tough mandate to uphold, but good British soldiers never surrender."
 POLITICS_GERRY_LOUGHREN_DESC: "First Minister\n--------------\nThe character of Gerry Loughran is not important to the people of the Northern Counties. He holds no big press conferences, he announces no grand plans, and he attends no new interviews. He does not represent the people, for that isn’t his job. Instead, he represents the thousands of civil servants who run the day-to-day affairs of the government.\n\nThe uniqueness of Northern County politics, which requires a cross-community government made up of Unionists and Nationalists, often means that for long periods of time, there is no political government in charge, or even a legislature. When this happens, the responsibility is placed in the hands of Loughran and the other top civil servants, whose only expectation and requirement is to keep this ship going until the political leaders finally negotiate a new government. They keep printing the papers, collecting the taxes and paying the public sector workers under the latest political policies and budget.\n\nNaturally, this setup has faced backlash from voters and non-sectarian politicians, who bemoan the ineffectiveness of the political structures, meaning that even the most bipartisan legislation cannot be passed unless a government and parliament are in place. But such is the reality, since for many, no government is preferable to one that may seek to suppress their community once again."

### Ideas ###
 ULS_sectarian_state: "The Sectarian State"
 ULS_sectarian_state_desc: "If one were to call themselves an Atheist in Northern Ireland, the first question they’d get asked is “A Catholic Atheist or Protestant Atheist?”. Northern Ireland is a deeply divided state between the Catholic and Protestant sects of Christianity. While some people have crossed religious lines, your religion often determines what side you are on, with the Nationalist Community under Rome's doctrine and the Unionist Community under Martin Luther's doctrine. Each side, at one point, wore the boot that allowed them to oppress the other, doing so out of both fear and power.\n\nWhile the growing Atheist and Non-Sectarian Movements have tried to bridge the religious gaps in Northern Ireland, alongside the mandatory Cross-Community Governments in Northern Ireland, tensions between the two churches still play their role in the North."
 ULS_rifle_for_every_man: "A Rifle for Every Man"
 ULS_rifle_for_every_man_desc: "To say Northern Ireland had a paramilitary problem would be an understatement. Dozens of paramilitaries run out of Northern Ireland, loyal to either the Republic or the Union as they shoot their opponents, set off bombings in the name of freedom and smuggle whatever arms they needed into the North. These paramilitaries of different colours were a major issue for the Irish Government, with most finally being manageable after the St. Brigid's Agreement after they demobilised and disarmed.\n\nHowever, small numbers of extremist paramilitaries still remain active in Northern Ireland, claiming to fight for a true Irish Socialist Republic or a true Independent Ulster. The Irish State has to permanently keep an eye on these groups to prevent the oil barrel from burning, lest the Island explode once more"
 ULS_home_away_from_home: "A Home Away From Home"
 ULS_home_away_from_home_desc: "As part of the St. Brigid's Day Agreement, the Irish Government allowed British exiles and their families to resettle in Northern Ireland from Canada and other Commonwealth realms. While this arrangement angered Irish Nationalists and the Social Credit Regime in London, it was considered a necessary section of the agreement for Unionists to prevent them from being outnumbered by the Nationalists in the long run.\n\nSince the agreement's implementation, British Exile immigration from the Free Commonwealth has boomed, with tens of thousands moving to Belfast and its surroundings to reclaim what is left of their homeland, even if most of it is still under 'foreign occupation'. Naturally, this has caused tensions between the native nationalist communities and the Dublin Government due to their staunch support for hardline Unionist parties like the VUP. But the price for peace in Northern Ireland is worth any cost lest the next generation is forced to take up arms to defend their livelihood."

