 ## Ideas ##
 BRG_reconstruction_of_burgundy:0 "The Reconstruction of Burgundy"
 BRG_reconstruction_of_burgundy_desc:0 "While Heinrich Himmler and his fiefdom lie dead beneath the ground, it has become woefully clear the sheer extent of life it took during its bloody existence. Cities, families, cultures, even history itself, fed into a genocidal machine that bit and tore into them without mercy, never to return to this Earth in the way it once was.\n\nThe reconstruction will begin, but it will take time. The dead may be buried, but the memory of the nightmare lingers on for those who still live, those who could never forget even if they tried. What was once the Ordenstaat Burgund will move on, but the memory may never fade."

