 COL_Widespread_Poverty: "Widespread Poverty"
 COL_the_rogue_state_of_america_desc: "As the 21st century approaches, Colombia, is still plagued by rampant poverty that hampers the nation's development and stability. The dire economic conditions and social disparities have deeply affected the population, leaving them in a state of despair and vulnerability.\n\nColombia is considered as one of the poorest Latin American nations, it is only through addressing the root causes of poverty and implementing effective policies that the nation can break free from the cycle of poverty and create a brighter future for its people."
 COL_the_arroyave_regime: "The Valenzuela Ruiz Regime"
 COL_the_arroyave_regime_desc: "In the final years of the civil war, the National Front, Colombia's traditional government, splintered into radicalzing, hostile factions. For Armando Valenzuela Ruiz, this presented a golden opportunity. Reuniting the National Alliance under his far-right wing and subduing the moderate core, he was able to defeat the FARC and re-seize all urban centres throughout Colombia in the 90s.\nIn this 'new Colombia', Corruption and luxury seem to coexist with extreme discipline and totalitarian ruthlessness. Although an admirer of Hitler and Himmler, Armando Valenzuela Ruiz does not seek to implement National Socialism on Colombia, a 'foreign and incompitable' system. Instead, Colombia follows his own synthesis of totalitarianism and occult beliefs, as the regime indulges into more eccentric rituals and megalomaniac phantasies day by day."
 COL_conflictwiththechurch: "Conflict with the Church"
 COL_conflictwiththechurch_desc: "There remains a single institution in Colombia which has not been completely brought under Valenzuela Ruiz's iron fist - the Catholic Church.\nAlthough the clergy's influence is shrinking day by day, and does not dare to openly oppose the government, the church will either be reduced to a mere puppet, or outright destroyed."
 COL_drug_trafficking: "Cocaine Trafficking"
 COL_drug_trafficking_desc: "During and after the devastating civil war, a boom in cocaine trade across the Americas drastically changed the criminal underworld. All major factions, despite their moral and ideological opposition, relied on cocaine trade, and the influence of powerful cartels, factions which have now been either eliminated or incorporated.\nTo prevent the return of cartels similar to those which had risen during the civil war, the regime has established an (unofficial) state monopoly on cocaine production, and cocaine trade significantly contributes to the isolated Colombian economy."
 
