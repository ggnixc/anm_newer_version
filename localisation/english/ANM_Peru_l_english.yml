 PRU_Cesar_Saucedo_Sanchez:0 "César Saucedo Sánchez"
 
 
 
 
 PRU_stabilitycrisisverybad:0 "Political Instability"
 PRU_stabilitycrisisverybad_desc:0 "Peruvian democracy is in peril. People are beginning to abandon the country's democratic principle as they have become too disillusioned with it. The country's political class is looked down upon  and radical change is demanded. To solve this issue, massive changes will need to be made, starting with changing the Peruvian Constitution of 1933."
 PRU_shiningpathinsurgency:0 "El Sendero Luminoso"
 PRU_shiningpathinsurgency_desc:0 "The Shining Path, also known as Sendero Luminoso is an insurgency, with the goal of overthrowing the Peruvian government and establishing a communist state. Ever since the 60s, the Shining Path insurgency has been a huge problem towards the government and the people of Peru. During the 80s, they posed a big threat towards the stability of Peru by conducting ambushes, hostages, and assassinations towards Peruvians. Although they have went silent as of lately, it is ideal to watch their activities before they grow stronger.\n\n§VIf we underestimate and ignore the insurgency, dire consequences may occur to our country.""
 PRU_highinflation:0 "High Inflation Rates"
 PRU_highinflation_desc:0 "Though inflation has been around  in Peru for some time, the late 80s and 90s proved to be disastrous for the economic stability of the country's currency The Inti, a currency created by former President Alan Garcia has become basically worthless and unreliable.  Several governments have tried to fix  the problem, though none have succeeded. The problem cannot remain unsolved for much longer and decisive actions will need to be taken to restore value to our currency."
 PRU_americanjapanesecompetition:0 "Inbetween Two Spheres"
 PRU_americanjapanesecompetition_desc:0 "Peru has been the place of a longstanding feud between the US and Japan for nearly 50 years. Both countries have tried to sway the Andean nation to align with themselves. American businessmen alongside their Japanese counterparts own key parts of the country's economies, however they are unwilling to collaborate with one another and actively try to sabotage the other side. Peru needs to choose which country to align themselves with if they want to finally end this long  struggle."

