 PRU_Armed_Socialists: "Armed and United Socialists"
 PRU_Armed_Socialists_desc: "How many years has it since the Peruvian peasant managed to eat well? If you want to know then just look at the year Peru came to be as a nation. For long have the people been doomed to poverty while military men and oligarchs shoved their maws fool of wealth, while the downtrodden in Peru fought for a long time the 20th century was one of disappointments, the suspension of democracy, Velasco’s failed coup, failed and corrupt presidents, all was too much, and soon the people of Peru found radical socialism and armed insurrection as the only way for achieving their wellbeing.\n\nWhile socialist guerrillas have been active and striking against the government since the 1960’s such activity only kept intensifying, specially with the formation of the Shining Path in 1980 which brought terror to much of the Peruvian countryside, with Fujimori becoming full time dictator and the war between socialist and the government becoming hotter and hotter the disparate socialist guerrillas would form an alliance known as the “Movimiento Revolucionario Amplio” uniting Ecuadorian Socialists, Amazonists and the Shining Path under one banner ready to engage in full blown conflict."
 PRU_Fujishocked: "Fujishocked"
 PRU_Fujishocked_desc: "In the 1990 presidential campaigns current Peruvian president Alberto Fujimori proposed an ambitious plan to take Peru’s economy out of the dumpster fire it was for the previous decades, and that he did. Through a policy of massive privatization and austerity alongside an expansion of foreign trade known as the Fujishock Fujimori would manage to bring Peru’s economy into the fold as one of the continent’s greatest, those policies continue even as Peru drops whatever other hints of liberalism it had as it falls into dictatorship.\n\nThe consequences of these however haven’t been as great for the average Peruvian as it was for the oligarch, foreign investor or other capitalists, for the worker it meant less regulation, less pay and less safety, for the peasant; less land and overall for the poor it meant less welfare, as many people were plunged even deeper into poverty and hunger.\n\nThe Fujishock allowed Peru to recover from an awful economy downturn but those very same policies don’t allow the average Peruvian a slice of the pie, and as such, resentment against the elites becomes endemic."
 PRU_Aristocratic_Alliance: "Aristocratic Alliance"
 PRU_Aristocratic_Alliance_desc: "While nominally an autocratic dictatorship led by Alberto Fujimori’s iron fist it would be very reductive to describe Peru’s political rulership as just that. For a long time Peru didn’t deal with a Liberal and Conservative rivalry like other Latin American nations, instead the political fight was between the military and the civilians. With decades of military rule leading to an aristocratic republic and later the dialectic finally resolved itself as in the 1960’s the civilian oligarchs and military leaders would form an alliance to rule over Peru together.\n\nEven throughout democracy and military junta this alliance remained, and at present it is this alliance that gives Fujimori the right to play Ceaser. However, the rivalry can return at any moment, as the military becomes ever more impatient with continuous failed civilian rule and oligarchs become ever more militant against the military’s constant intervention. Despite the choice between military strongmen and corrupt oligarchs not being a great one, when the communists push the liberals ever more towards the cliff it becomes clear that this has to remain lest Peru be plunged into further chaos."
 PRU_americanjapanesecompetition: "Inbetween Two Spheres"
 PRU_americanjapanesecompetition_desc: "Peru has been the place of a longstanding feud between the US and Japan for nearly 50 years. Both countries have tried to sway the Andean nation to align with themselves. American businessmen alongside their Japanese counterparts own key parts of the country's economies, however they are unwilling to collaborate with one another and actively try to sabotage the other side. Peru needs to choose which country to align themselves with if they want to finally end this long  struggle."
 PRU_Peruvian_Civil_War: "The Peruvian Civil War"
 PRU_Peruvian_Civil_War_desc: "The inevitable has come to pass, Peru has finally slipped off the edge as Vargas Llosa lies dead, the military rules Lima with an iron fist and revolutionaries sweep the country in a red flood. The Andes burn and the flames will only be quelled when the one side is wiped off completely, with this, the whole nation mobilizes for a great conflict not seen before.\n\nGiven the necessities and conditions of the war each side is constantly on its feet, less resources mean living off the land. Peruvian geography means constant guerrilla and counter-guerrilla warfare. Manpower is still a huge factor, if you can’t fire a gun then you’re going to work in producing one or making sure those who can are well fed.\n\nNeedless to say, such a situation, specially due to its ideological nature means each side also has to keep its population with the morale to keep fighting. Convincing them of the righteousness of the conflict and the sureness of victory. Propaganda and manufactured consent plays as much of a role as guns and artillery, both during this war and for an eventual peace."
 #Events
 
 WORLD.18178.t: "Mario Vargas Llosa Assassinated by Leftist Radicals"
 WORLD.18178.desc: "Peruvian President Mario Vargas Llosa was assassinated by left-wing militants of the Movimiento Revolucionario Amplio. The attack occurred at the Government Palace in Lima where Vargas Llosa was giving a speech.\n\nEyewitnesses reported hearing several loud explosions before chaos erupted as people scrambled to flee the scene. Security forces quickly arrived on the scene but were unable to prevent the attackers from escaping. The Movimiento Revolucionario Amplio has since claimed responsibility for the attack in a statement released to the media. The group cited Vargas Llosa's role in the government's crackdown on leftist rebels, leading to the deaths of thousands of people.\n\nThe news of Vargas Llosa's assassination has sent shockwaves throughout Peru, where he remains a controversial figure. Supporters have expressed their outrage at the attack, while critics argue that Vargas Llosa's legacy is one of human rights abuses and corruption.\n\nThis event serves as the boiling point of tensions between the government and the insurgency, as both sides began to mobilise it's forces."
 WORLD.18178.a: "The tide continues to turn."
