 ### Characters ###
 ## Names ##
 PRU_Enrique_Chacon: "Enrique Fernández Chacón"
 PRU_Genaro_Ledesma: "Genaro Ledesma"
 PRU_Hugo_Galdos: "Hugo Blanco Galdós"
 PRU_Justiniano_Apaza: "Justiniano Apaza"
 PRU_Emeterio_Huarcaya: "Emeterio Tacuri Huarcaya"
 ## Descriptions ##
 POLITICS_ENRIQUE_CHACON_DESC: "Head of State\n--------------\nBorn in Lima in 1942, Fernandez Chacon was raised in a working class environment, graduating from the Institución Educativa Emblemática Ricardo Bentín and then going to work in an automotive plant. There, he would go on to join the factory union, quickly rising to be its leader. Soon becoming a nationally reputable labor leader,  Fernández Chacón would found the Socialist Workers' Party of Peru, and participate in the revolution alongside the broad front of socialist parties against Odria’s junta. \n\nRising to be one of the foremost critiques of Blanco Glados’s leadership, which favored agrarian interests and left industrialization to a slow pace,  Fernández Chacón and the rest of the young guard would get a chance when most of the First Revolutionary Offensive would fail, leading into an inter-party putsch, placing him in the Presidency. Now, he must juggle the interests of Peru’s burgeoning working class, and its much more prescient peasant class to keep the revolutionary regime stable, all while trying to avoid being ousted like his predecessor. Desperate times call for desperate measures, and as  Fernández Chacón’s position is subject to more scrutiny, he must look for the ace up his sleeve."
 PRU_Genaro_Ledesma_hog_desc: "Head of Government\n§rIDEOLOGY§!\n--------------\nBorn in Cajamaba in 1931, Ledesma’s background is very similar to many of the old guard, being a dying breed within his own party. Studying law and education at the National University of Trujillo, his experiences as a teacher in the highlands city of Cerro de Pasco would shape his political views, experiencing the suffering and immense poverty of rural Peruvians.\n\nBecoming mayor of Cerro de Pasco, Ledesma would gain prominence as a socialist activist, being imprisoned by military and civilian governments alike, before finally participating in the revolution of 1972, and establishing a socialist republic. Being more of a horizontalist within the Old Guard, Ledesma would be elevated after Galdos’s ousting, serving as an olive branch to the old guard. Overseeing the rapid industrialization and societal transformation of Peru, Ledesma is one of the rare uncontroversial politicians within the party, being viewed neutrally by every faction."
 PRU_Hugo_Galdos_sec_desc: "Minister of the Interior\n§rIDEOLOGY§!\n--------------\nThe former leader of Revolutionary Peru, Hugo Blanco Galdos has been involved in the agrarian struggle since his youth. Born in Cusco in 1934, Blanco Galdós would graduate from the National College of Sciences in the city, with an interest in agronomy. Traveling to Argentina for further studies, he would become enamored with the Trotskyist movement, abandoning his studies to join the Revolutionary Workers’ Party, an underground militant organization, which would go on to overthrow Odria’s military junta.\n\nLeading the revolutionary government through crises and instability, Blanco Glados would be seen as an icon to many of the populace but disliked by the party’s young guard, who would see his stubborn adherence to agrarian doctrine as an inherent weakness within the country. Stepping down in 1985, Blanco Glados would return to being an agricultural minister, aiding the Peruvian peasantry and indigenous people. Now he stands as a relic of a past that starkly divides the party, reminding some people of better times but to others being reminiscent of a background they’d rather forget."
 PRU_Justiniano_Apaza_eco_desc: "Minister of Labor\n§rIDEOLOGY§!\n--------------\nBorn to a working class family in the city of Puno, Justiniano Apaza is one of the primary industrial radicals within the party. Involved in union activity from a young age, he would eventually become the general secretary of the Arequipa Truck Drivers' Union, a nationally prominent position, especially involved in the struggles against the dictatorship during the 60s. Partaking in the general strike that would eventually spiral into the revolution, Apaza would gain a reputation as one of the PRT’s young and radical voices.\n\nAdvocating for a renewed commitment to reindustrialization and union democracy, Apaza and the young guard would get their chance with the failure of the First Revolutionary Offensive, where Galdos and most of the old guard would be ousted from power. Now as the head of the revolutionary labor apparatus, Apaza seeks to revitalize the economy, especially in areas of national defense in preparation for a potential Revolutionary Offensive, vowing not to fail where his predecessors had."
 PRU_Emeterio_Huarcaya_for_desc: "Minister of Foreign Affairs\n§rIDEOLOGY§!\n--------------\nBorn to a small peasant family in the department of Puno in Peru,  Emeterio Tacuri Huarcaya is the Peruvian revolution’s model citizen. Graduating from the National College of Sciences in the city of Cusco, Huarcaya would get his introduction to radical left politics while studying at university. Becoming a Trotskyist agitator and returning to his hometown of his Puno, he would become an agrarian advocate for peasants and impoverished indigenous populations, taking part in the revolution of 1973 against the military government.\n\nWhile the initial focus of the revolution would be the liberation of peasants, the failure of the First Revolutionary Offensive would leave many young members of the party disillusioned with the agrarian old guard, but Huarcaya would remain firm in his rural-first approach, a young voice seen as the deputy of former Premier Hugo Blanco Glados. Now with the proletarian faction in charge, he has been put in charge of Foreign Affairs, officially to shore up alliances among old allies and new, but in reality to relocate a possible rival from the capital."


 
 ### Ideas ###
 PRU_Vanguard_Eternal_Revolution: "Vanguard of the Eternal Revolution"
 PRU_Vanguard_Eternal_Revolution_desc: "Following our victory against the fascists and the military in 1968, Peru has become the standard bearer of the revolution within Latin America, hosting the alliance of Latin American communist parties known as the Revolutionary Coordination Junta. Domestically, the solidification of this regime has also created an atmosphere of undeniable national pride, stemming from the extensive revolutionary reforms within the communist nation. Whatever the future holds for the South American continent in the new millennium, one thing is sure: the red standard will be raised high in Peru no matter what. "
 PRU_Smoldering_Flame: "The Smoldering Flame"
 PRU_Smoldering_Flame_desc: "As the premier communist power in Latin America, we have a duty towards our brothers, who remain oppressed by the imperialists and running dogs of Washington, and are endlessly caught in the bourgeois conflict between Brasilia and Buenos Aires. But ever since our failed revolutionary offensives during the 70s, the spirit of Hispanic liberation has slowed down in the Peruvian revolutionary project.\n\nContinental liberation no longer appeals to the new generation, who have fully reaped the benefits of our new society and grown complacent, preferring to focus our revolution in our country alone. But as the imperialist siege on the revolution rapidly increases through the new president in America, it becomes apparent that we must find new allies to stay alive, or the Southern red flame will be extinguished forever, replaced by a hollow servant to imperialism."
 PRU_Hammers_Sickles: "Rusting Hammers and Dulling Sickles"
 PRU_Hammers_Sickles_desc: "The revolutionary modernization and transformation of Peruvian society have been a boon, allowing a primarily agrarian economy to rapidly modernize, industrialize, and urbanize into a second-rate South American economy, guided by a military-industrial complex. But with this rapid transformation of society has also arisen a new conflict, one between the new proletariat and the traditional agrarian base of the Communist Party.\n\nAs urban migration occurs more frequently, agrarian and indigenous wings of the party have opposed this rapid industrialization, preferring a more gradual transition that preserves agricultural customs and culture. However, the proletarian young guard has been much more eager in the hyper-industrialization in Peru, consisting of union activists and party bureaucrats. As preparations for the Second Revolutionary Offensive begin to take place, it is apparent that the agrarian-industrial conflict must be resolved before another offensive takes place."


 #Events
 
 WORLD.18178.t: "Mario Vargas Llosa Assassinated by Leftist Radicals"
 WORLD.18178.desc: "Peruvian President Mario Vargas Llosa was assassinated by left-wing militants of the Movimiento Revolucionario Amplio. The attack occurred at the Government Palace in Lima where Vargas Llosa was giving a speech.\n\nEyewitnesses reported hearing several loud explosions before chaos erupted as people scrambled to flee the scene. Security forces quickly arrived on the scene but were unable to prevent the attackers from escaping. The Movimiento Revolucionario Amplio has since claimed responsibility for the attack in a statement released to the media. The group cited Vargas Llosa's role in the government's crackdown on leftist rebels, leading to the deaths of thousands of people.\n\nThe news of Vargas Llosa's assassination has sent shockwaves throughout Peru, where he remains a controversial figure. Supporters have expressed their outrage at the attack, while critics argue that Vargas Llosa's legacy is one of human rights abuses and corruption.\n\nThis event serves as the boiling point of tensions between the government and the insurgency, as both sides began to mobilise it's forces."
 WORLD.18178.a: "The tide continues to turn."
