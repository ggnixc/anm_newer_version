 ### Leader Descriptions ###
 POLITICS_TENGIZ_KITOVANI_DESC:0 "Around every corner and alleyway in Georgia, you hear whispers of the men who betrayed their nation during the 2WRW. Many names are uttered in bitterness and hatred, with Tengiz Kitovani often one of them.\n\nOnly a boy when the Nazi Empire occupied Georgia, he, like many Georgians, saw first-hand their treatment by their “Nazi Saviours”. The factories and mines of Industrial Barons soon covered up the bodies and bones of those who stood up to their Occupiers. But instead of Opposition, Kitovani turned to Collaboration as he joined the new Georgian Police that kept the new Status Quo secure.\n\nHe revealed the lengths he was willing to go to benefit himself when he sold out his comrades in the Police Force during the 2WRW, who had occupied Tbilisi in an attempted rebellion to free Georgia from the Nazi Grip. Grateful for his loyalty, the Nazi administrators made him the Chief of Police for Tbilisi. He used this position to become the head of RS Georgien soon after and, finally, the Head Administrator for Kaukasus as his Azerbaijani predecessor was purged in response to the Ganja Incident. Kitovani is a traitor to himself, to his community and his nation, but he doesn't care. Power trumps Morality in his mind."
 
