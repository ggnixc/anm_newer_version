 ### Ideas ###
 CAU_unequal_federation:0 "Unequal “Federation”"
 CAU_unequal_federation_desc:0 "Unlike its more centralised counterparts in the west, Kaukasia is a devolved federation, comprised of smaller Reichsstaaten, such as Reichsstaat Georgien, Aserbaidschan, Armenien and Tschetschenien. The Kaukasia Central Government, instead of dealing with all the country’s issues, often delegates tasks the Reichsstaats can deal with (Or rather, that the Central Government doesn't want to do themselves).\n\nThis has allowed the various regions in the Federation limited self-governance, but the German Administrators in the Central Government always keep them in check whenever they actually think they have power and can quickly replace any regional leaders they wish to be gone. This was most famously illustrated when the entire Aserbaidschan Leadership was “replaced” after they tried to block the expansion of various mines near Ganja. Whilst it may be a Federation of Equals in theory, the Germans are slightly more equal in practice."
 CAU_blood_of_the_empire:0 "Blood Of The Empire"
 CAU_blood_of_the_empire_desc:0 "Ukraine is often called the Breadbasket of Europe, as they grow the food to keep the German Machine going, but the resources to make that machine in the first place are sourced from Kaukasia. Ever since the German Victory in the Second World War and the occupation of the Caucasus, the Nazis have aggressively been exploiting and extracting its vast and various resources, with factories dotted all across the mountain range.\n\nEvery day, new pockets of earthly materials are uncovered, and every day new mines and industrial centers are established. This has cost the people who live here, with entire towns destroyed to extract more wealth beneath them and the blue sky they used to live with replaced with grey smog. All in the name of the Reich’s interest. The Reich is Kaukasia, as without it, there will be no Reich."

 