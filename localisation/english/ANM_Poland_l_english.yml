 #Ideas
 GGN_the_quiet_place: "The Quiet Place?"
 GGN_the_quiet_place_desc: "Every day, there is always news when the Fuhrer reads reports from the Reichsland territories. A Border Clash in Wolga, a new military outpost in Baltikum or a bombing in Weißruthenien. But news rarely, if ever, comes out of RK Polen. Ever since the Slave Revolt during the early 70s, Polen has been quiet. No grand infrastructure projects, important events, or high-level visits, be they from within or outside the Reich.  But to Germania, considering its history with Poland, from the Humiliation of the Treaty of Versailles to the Polish Liberation during the German Civil War, that's never a bad thing to them.\n\nThey say no news is good news, and for the Reich, that's exactly what they want from Polen."
 GGN_declining_population: "Declining Population"
 GGN_declining_population_desc: "The Independent Polish Nation has been dead for nearly 60 years. Now her people, under the boot of Nazi Oppression, are dying too. At first, there were just a few hundred more deaths than births in the Mid-80s, but the latest data from 1995 has revealed that the Polish population has fallen by over 100,000 a year.\n\nTowns across the remaining “Semi-Free” Polish territories are slowly being abandoned as their residents either die out or move to the larger cities, which are barely managing to keep their populations from declining. This fall in population has become a crisis for the Polen Collaborators, who have been trying to introduce new measures to reverse the decline. However, their German Masters don’t seem to be as worried as they are."
 GGN_anniversary_poland_occupation: "57th Anniversary of the Conquest of Poland"
 GGN_anniversary_poland_occupation_desc: "Poland is not yet lost... with the emphasis being on the "yet" part. Having been conquered and split up again and again, numerous times, by her stronger neighbours, be they the Russians, the Austrians or the Germans, the people of Poland lost hope of ever seeing their homeland stand proud and free again. As more and more Germans settle in their lands, while their numbers increasingly dwindle, the men and women of Polska know, they are witnessing the closing act of their national tragedy.\n\n§VOne day, the Polish nation will be no more. Perhaps then, they will find rest in whatever footnote of history Fate will relegate them to."


