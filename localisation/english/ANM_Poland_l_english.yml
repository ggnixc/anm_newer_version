 POL_anniversary_poland_occupation: "57th Anniversary of the Conquest of Poland"
 POL_anniversary_poland_occupation_desc: "Poland is not yet lost... with the emphasis being on the "yet" part. Having been conquered and split up again and again, numerous times, by her stronger neighbours, be they the Russians, the Austrians or the Germans, the people of Poland lost hope of ever seeing their homeland stand proud and free again. As more and more Germans settle in their lands, while their numbers increasingly dwindle, the men and women of Polska know, they are witnessing the closing act of their national tragedy.\n\n§VOne day, the Polish nation will be no more. Perhaps then, they will find rest in whatever footnote of history Fate will relegate them to."


