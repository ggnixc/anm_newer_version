 GGN_edward_flak: "Edward Flak"
 GGN_siegfried_emil_spindler: "Siegfried Emil Spindler"

 ## Descriptions ##
 POLITICS_HENRYK_KROLL_DESC: "When Poland finally dies and is lost forever, Henryk Kroll shall be the only mourner for its funeral, for no one else in the Reich or Wider Europakt would care.\n\nBorn to Category 3 Volksdeutsche Parents, Kroll was granted the luck and luxury of being an “Ethnic German”. He worked in an animal shelter in his youth. Kroll soon attended the Technical University of Dresden thanks to new college funds for Polen youth created by Speer Sr. to help grant them new skills. After graduating, he became a Civil Engineer for the local Krakau Government, slowly working his way up the Civil Administration.\n\nHe helped rebuild the city after the destruction due to the reoccupation and slowly rose to become the Mayor of Krakau in 1988 and, finally, the Reichsstatthalter of Polen in 1992. To say skill was the main reason for Kroll’s slow rise up the Political Hierarchy would be false. Instead, his rise can mainly be attributed to simply knowing the right people and the right connections, be they within the Wehrmacht, Reichstag or the wider NSDAP. Polen deserves better. It deserved better."
