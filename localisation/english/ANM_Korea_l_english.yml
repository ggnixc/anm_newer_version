 ## Leader Bios ##
 
 POLITICS_LEE_KUN_HEE_DESC: "Born in 1942, Lee Kun-hee is the third son of Lee Byung-chul, the founder of the Samsung Group. After earning his Masters in Economics, Lee worked for several companies under the umbrella of the Samsung Group.  After the death of his father, Lee would take over the chairmanship of the entire conglomerate in 1987.\n\nAs the Chairman of one of Korea’s “Big Four” megacorporations, Lee wielded an enormous amount of power and influence — enough to “earn” himself the Chosen Mandate’s top job after the fall of Prime Minister Chun Doo Hwan. Unabashadley corrupt, Lee would use his position as Prime Minister to force through numerous policies meant to enrich his family and friends in the Samsung Group. His crowning achievement, however, known as  the “Sunshine Deal”, would fatten wallets all across the Korean Peninsula. The legislation massively liberalized the Korean market; for the first time, the levers of power moved out of the government’s hands and into those of private firms.  As wealth slowly moved into native households, Korean culture, once thought to be facing a slow, inevitable extinction, flourished for the first time in decades.\n\nFor better or for worse, Lee’s premiership has transformed the Korean way of life. It is truly difficult to imagine anyone else filling his shoes — which, of course, begs an important question; What happens after he’s gone? Will this current era of prosperity continue? Or will everything he has built collapse like a house of cards in his absence?"

 
