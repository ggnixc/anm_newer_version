KOR.general.10.t: "On the chessboard"
KOR.general.10.desc: "In an exuisite Chinese restaurant at Hanson, the VIP room was closed off due to an important dinner. They were served by the best Chinese chefs and waiters Chosen had to offer, eating only the best and most well prepared Chinese meals.\n\n“Zhang old friend, I think you know that Old Man wants us to have a fruitfull cooperation here in Chosen, neither of us could stand against Japanese and Koreans alone.” Although he spoke gently and smoothly, Wang Jianlin slowed down while mentioning the “Old Man”.\n\nHe had a taste of the Chinese Fenjiu that was just brought by a waitress, waiting for Wang Jianlin who was sitting opposite him to respond. Zhang was cutting braised chicken that he ordered, slowly putting the meat in his mouth, closing his eyes to enjoy the taste of the meat more fully.\n\n“Haier did well with our own,” Zhang Ruimin chewed the meat without disturbing his speech. He then swallowed the meat, opening his eyes and looked at Wang. “Our business did not cross into each other's line of work, nor did we destory any possiblity of a fruitful cooperation.” \n\nWang pursed his lips, he knew that this job isn't easy, but he has to do it. “I know what both of you are thinking, but they both work in groups, and your boss won’t care about your career, I am the only choice for you to complete your goal…” \n\n“What goal? Your small goal?”Zhang responded immediately, shocking Wang. He poured more wine during this silent moment and then stood up with the glass in his hand walking towards Wang. \n\n“I will make the cooperation look good on paper, that benefits both of us.” Zhang was now standing next to him looking down, “But if you become an obstacle on my way, you know what will happen.”\n\nWang tidied his tie and took a breath. \n\n“It’s good that you know what you should do.” Wang said with a small giggle on his face.\n\n“But I have my own goals too, we both have.” A clean clink surrounds the room, soon echoing in Hanson, then the entire Chosen. "
KOR.general.10.a: "Two pawns made their steps."

KOR.general.11.t: "Reply 2000"
KOR.general.11.desc: "Morning has come to the neighbourhood of Ssangmun, the sun shined onto the many houses that were inhabited by the locals of Choseon. The sparrows were chirping, and the 7/11 convenience store on the side of the road had just opened.\n\n"Kin Chuichi!" the young woman shouted in Japanese from downstairs of a house, "Are you ready to go to Yamato Aotaki's house to play together?"\n\n"Eung!" A young man in sportswear leaned out from the window on the second floor, replied with a word that sounded like a Korean language, and then said in Japanese, "I'm ready, wait for me to put on my earphones. "\n\nFive minutes later a slim looking boy came out from the door. \n\n"Why did it take you so long?" The girl seemed to be a little annoyed but the boy quickly deflected the qustion and instead started to talk about his new earphones.\n\n"Look, this is the Sony earphones that my dad rewarded me with for doing well in the midterm exams. They are very expensive." \n\n"Why should they matter to me?" \n\n"Look, can't you see that they are the brand new MDR-EX70SL. If you fancy it, we can listen to your favorite pop songs together?" The boy said, followed by a smile.\n\nThe girl looked at his sincere and kind face, full of youthful vigor. She lowered her head and said slowly and shyly,\n\n"After leaving Yamato Aotaki's house this afternoon, let's go to the night market together.""
KOR.general.11.a: ""Of course!""

KOR.general.12.t: "The Korean Financial Crisis"
KOR.general.12.desc: "Yesterday's discovery of thousands of financial documents allegedly forged by Korean officials continues to wreak havoc upon the Chosen economy. Already, the Hwan has lost 45% of its value as foreign speculators, having lost faith in the Korean Government’s credibility, have dumped their investments into the nation’s currency.\n\nThis economic catastrophe has beget the bankruptcies of the Daewoo Conglomerate, a major employer, and Shinan Alpha, the nation’s largest real estate company. The sudden failure of these firms, and the certainty that there are still yet more dominoes to fall, has shocked the Hangseong Stock Exchange to its core.\n\nAlready, a sharp uptick in suicides has been recorded, and thousands more are expected as mass layoffs continue. This is but a minor tailwind, however, in the greater typhoon of instability and violence that now tears its way across the Korean Peninsula."
KOR.general.12.a: "Thus crumbles the corporate kingdom."

KOR.general.101.t: "Emotionless Public Answer"
KOR.general.101.desc: "One week after the news of Zhongtou crisis reached the Honson City, an emergency meeting was held at the Mitsuboshi headquarters. Secrecy of such meetings is never long lived and soon reporters from all around have gathered in front of the Mitsuboshi Company HQ, asking various questions.\n\nRi Kenki came out soon after the meeting's conclusion and faced the curious reporters. Blinded by the flashing of camera lenses and deafened by the multitude of questions about the state of his company, Kenki took a small breath and said one simple sentence.\n\n"Mitsuboshi will not be stopped by such crisis and we will not fail."\n\nAs quickly as he said the sole sentence he retreated back into the building. He was contempt with his response but the reporters left outside were just as confused as when they arrived if not even more.""
KOR.general.101.a: "The camera flashes didn't stop."

KOR.general.13.t: "Latter-Day Sinking Feeling"
KOR.general.13.desc: "“Leftovers? Again?”\n\n“I don’t appreciate that tone, Trevor.” Cindy Olsen shut the microwave door. A series of electronic beeps cued the plate of spaghetti inside to dance to the tune of a low-pitched hum. “You should be grateful to the Lord that we’re able to eat at all. There are children starving in Burgundy, you know.”\n\nKnowing better than to argue with Mom, Trevor dragged himself back into the living room with a huff. Not only was he not going to see his brother until he returned from his mission trip in two years, it seemed his family would be eating the same old leftover catering until that day came. Why in the world did Mom and Dad buy so much food for the sending-off party?\n\nThe fourth-grader collapsed onto the couch, landing squarely on the remote control laid across the cushions. The obnoxious cartoon playing on Channel 49 was switched off, replaced by the evening news.\n\n“...economic catastrophe. In related news, chaos unfolded on the floor of the New York Stock Exchange today as panicked brokers, desperate to fulfill an avalanche of ‘sell’ orders, swarmed the trading booths of several failing Korean firms including Samsung, Chosen Bank, and Daewoo. The President has yet to comment...”\n\nTrevor blinked at the TV. He could usually comprehend the news, but this? The anchors might as well have been speaking Japanese. What was a stock exchange? What did all these graphs with downward red lines mean? And why did his teachers always fuss about walking in an orderly line when these full-grown adults clearly couldn’t handle it?\n\n“We interrupt this story to bring you further developments on the Korean situation.” The news program abruptly cut to a new segment — A macabre collage of flaming cars, burning buildings, and masked men wielding guns appeared above the scrolling ticker tape. The carnage was like something out of a movie.\n\n“The State Department has officially designated Korea as a ‘Do Not Travel’ zone, citing civil unrest and the likelihood of armed conflict in the wake of the unfolding financial crisis. Americans are strongly encouraged to reconsider all travel...”\n\n“Mom...?” The boy shifted in his seat. Suddenly, the couch wasn’t as comfortable as it had been a few moments ago. “What country did Matthew go to on his mission trip, again?”"
KOR.general.13.a: "Korea, honey. Why do you ask?"

KOR.general.14.t: "Fudging The Numbers"
KOR.general.14.desc: "Hae Hyun-Seok sighed, glancing at the clock mounted on the wall of his stuffy cubicle. This was going to be a long day. Closing his aching eyes did little to block out the reality of being stuck at work on a Saturday — The distant clicking of keyboards, squeaky office chairs, and the incessant beeping of whining copiers refused to let his mind wander to happier places for even a moment.\n\nThe thirty-something shook himself awake and gulped down the last of his coffee. The sooner he finished this month’s financial report, the sooner he could go home to his family...if he was lucky.\n\nHae pulled a paper off the disorganized stack on his desk. It was a listing of the profits made this month by the Daewoo Conglomerate’s subsidiaries — some great, some not-so-great. The names of several, circled in red, were accompanied by a sticky note at the bottom of the page:\n\n“These three CANNOT take a loss. Fix it.”\n\nWithout thinking twice, Hae reached for his calculator and began crunching numbers. The Daewoo Conglomerate’s total profits didn’t need to change — all he needed to do was scrape a little off one of the more profitable subsidiaries and attribute that income to one that was in the red. Rinse and repeat until everything was looking good for the shareholders.\n\nThe twist in his stomach that he’d felt in the early days hadn’t cropped up in a while, and Hae suspected it wouldn’t return any time soon. The Daewoo Conglomerate wasn’t corrupt — every big company did a little bit of ‘creative accounting’ here and there to stay afloat. It was just business."
KOR.general.14.a: "The numbers aren’t fiction... just based on a true story."

KOR.general.15.t: "The Collapse of the Morning Calm"
KOR.general.15.desc: "Echoes of 1981 radiate across East Asia as, for the second time in 20 years, native Koreans lash out en masse against their Japanese suzerains.\n\nYesterday’s brutal crackdown marked a dramatic escalation in the ongoing civil unrest paralyzing the Korean peninsula. Mobs of enraged demonstrators, brandishing weapons looted from Japanese caches, responded to the Chosen Garrison’s brutality by seizing control of several Korean-majority cities.\n\nThe modern resistance, unlike the ill-fated revolt of 1981, is highly organized. Though unified in their cause to oust the colonial regime, they are split across two ideologically-opposed factions: the communist People’s Emancipation Army and the republican Korean Liberation Front.\n\nAccording to Tokyo, no direct intervention is planned at this time. Should the Chosen Garrison fail to re-establish order, however, this circumstance is certain to change."
KOR.general.15.a: "The final domino comes crashing down."

