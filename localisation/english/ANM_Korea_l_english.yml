 ## Ministers ##
 KOR_minister_Lee_Hong_Koo_hog: "Lee Hong Koo" 
 KOR_minister_Seiichiro_Hirata_for: "Seiichiro Hirata" 
 KOR_minister_Hiroshi_Yoshikawa_eco: "Hiroshi Yoshikawa"
 KOR_minister_General_Nakatani_sec: "Gen Nakatani" 
    
 KOR_minister_Lee_Hong_Koo_hog_desc: "Deputy Prime Minister\n--------------\nLee Hong Koo, a 15th-generation descendant of King Seongjong of Joseon, was born in 1934 to a fairly privileged family  — one of the Yangban of the Jeonju Yi clan. Raised in Gyeongseong (‘Seoul’ to the natives), Lee studied abroad in the United States through the Hart Education Openness Program, eventually graduating from Emory University with a degree in political science. Post-graduation, Lee would return to his home country to teach in his area of expertise at Seoul National University, one of the most prestigious schools in the Chosen Mandate.\n\nLee, a vocal reformist, had always been interested in politics, but his first foray into “real” political work came about in the 1980s when he was hired as a policy advisor in Lee Kim Hee’s administration. In 1998, Lee would be appointed Deputy Prime Minister of the Chosen Mandate, selected due to his intelligence, integrity, and his many connections within the Chosen Democratic Party." 
 KOR_minister_Seiichiro_Hirata_for_desc: "Chosen Garrison Commander\n--------------\nWhen Seiichiro Hirata was sworn in as the Chosen Garrison’s commanding officer, he recited his vows with a dull, monotone cadence. When all was said and done, he looked his Emperor in the eye and bluntly remarked; “It is only over my rotting corpse that Korea shall ever break free from your righteous lordship”.\n\nThus far, he has held fast to his promise.\n\nIndeed, Seiichiro Hirata’s appointment represents a dramatic shift in Japan's attitude toward Korea’s wayward autonomy. Unlike his soft-hearted predecessor, Hirata is an avowed Japanese ultranationalist. Perhaps more so than any of his peers, he is steadfast in his resolve to keep Korea firmy under the Empire’s thumb — and he is prepared to do so through any means necessary." 
 KOR_minister_Hiroshi_Yoshikawa_eco_desc: "Chairman of Chosen Bank\n--------------\nBorn in Tokyo in 1951, Hiroshi Yoshikawa, ever a precocious child, graduated from high school three years earlier than his peers. His college days were similarly truncated, and by the time he began his career as an Economics professor at the University of Tokyo, he had only just turned 23.\n\nYoshikawa would quit his teaching career a mere three years later, however, when a series of shrewd investments and ambitious business ventures made him one of the most wealthy men in all of Japan. Eventually, Yoshikawa’s prominence, power, and vast network of connections led to his appointment as Chairman of the Chosen Bank.\n\nToday, Yoshikawa sits atop one of the largest asset-holding banks in all of East Asia. His authority is nothing short of godlike, with nearly every corporation in Korea — and a handful in Japan — fully dependent on the loans, bailouts, and cash injections provided by his firm. It would be prudent, then, for any aspiring businessman to remain on his good side..." 
 KOR_minister_General_Nakatani_sec_desc: "Defense Minister\n--------------\nLieutenant General Gen Nakatani is a man living on borrowed time. Having served for four years as a commissioned officer in the Imperial Japanese Army, Nakatani was rewarded for his exemplary service with an appointment to head of the Chosen Garrison.\n\nAlthough Nakatani’s service to the Empire has heretofore been admirable, he is far from universally admired. A small, but vocal minority of his subordinates — most of them military hardliners — have decried Nakatani’s openness toward pro-Korean reforms, even going as far as to accuse him of being a Korean native impersonating a ‘pure-blooded’ Japanese citizen.\n\nNakatani’s controversial political stances have made his future within the Chosen Garrison uncertain. Despite the swell of angry voices demanding his resignation, however, Nakatani intends to hold fast to his vow to serve his Emperor."
    
  
 ## Ideas ##
 A_nation_divided: "A Nation Divided"
 A_nation_divided_desc: "Though vast stretches of the Korean countryside remain as culturally distinct as they were before 1910, entire villages now exist only in memory, razed to make room for the enclaves of Japanese settlers that now dot the peninsula. Even beyond these settlements, Japan’s customs, language, and culture have irreversibly infiltrated Korean society, with one in five Koreans now able to claim some degree of Japanese ancestry.\n\nThis deliberate erasure of Korean culture has stirred as much controversy as one might expect. Riots and terror bombings regularly make headlines as native Koreans, tired of existing as second-class citizens within their own country, lash out against their colonizers. Harsh crackdowns have done little more than add fuel to the fire, and at this point, it seems that nothing can be done to stamp out the flames of rebellion engulfing the Korean peninsula."
 The_Corporate_Nation: "The Corporate Nation"
 The_Corporate_Nation_desc: "The four trigrams of the Taegukgi, the traditional flag of Korea, are officially said to represent the four classical elements. One of the oldest, most tired jokes in modern Korean culture, however, posits that these symbols actually stand for the quartet of megacorporations that puppeteer the Chosen Mandate from behind the scenes; Samsung, Hyundai, Sony, and Mitsubishi. Together, these four companies form Korea’s true government — a sprawling oligarchy that wields its exorbitant wealth to bribe and blackmail its way to neverending profit."
 uprising: "The Memories of The Great Korean Uprising"
 uprising_desc: "The 1981 murder of Japan-sympathizer Park Chung Hee by Korean rebels, and the subsequent crackdown by Japanese forces, led to the most significant Korean nationalist revolt since 1965 - the Great Korean Uprising. The people lashed out against their foreign occupiers to establish a free Korea, only for their hopes to be trampled under the boot of the IJA.\n\nThe fighting has long since ended, but its memory lives on in the eyes of the unfortunates who witnessed its horrors. The desperate, tearful shrieks of deflowered virgins, dragged from their homes and never seen again. Scores of innocents, gutted by Japanese steel, laying face-down in the shallow rivers of blood that flooded the streets of Seoul.\n\nThe battle may have been lost, but the war rages on. From the shadows, the survivors of the Japanese terror plan out their next move with careful precision, the dream of a free Korea still flickering in their hearts."
 agricultural_collapse: "Agricultural Collapse"
 agricultural_collapse_desc: "Over the past few decades, the terraced rice paddies and amber fields of barley that once defined the Korean countryside have steadily disappeared, choked into extinction by industrial sprawl.\n\nWhile this rapid industrialization has done wonders to enhance Korea's GDP, the steady decline of the nation’s capability to produce enough food for its burgeoning population has set the country up for potential disaster. It is only thanks to regular, massive food imports from China and Japan that the Chosen Mandate has managed to maintain such explosive population growth.\n\nThis solution, of course, is utterly unsustainable. Should any unforseen circumstances cause either of Korea’s benefactors to suddenly cut off food shipments, a devastating famine would plunge the country into chaos."
 land_chaotic_morning: "Land of the Chaotic Morning"
 land_chaotic_morning_desc: "To the poets of centuries past, Korea was known as the Land of the Morning Calm — a title which, today, is fitting only in an ironic sense.\n\nEvery day, businessmen flying in from Tokyo can expect to balk at the plumes of smoke billowing from Korea’s flickering, riot-scarred cities. The crime rate climbs ever-higher as organized crime slithers into the cracks left behind by an incompetent police force. Workers are pawns in never-ending economic wars between megacorporations that rule by decree.\n\nThe government is utterly indifferent to the millions languishing in filthy, disease-ridden shantytowns. It cares not for the hundreds of striking workers gunned down each month by ruthless strike breakers. The Chosen Mandate exists to enrich the Empire of Japan by extracting as much wealth as possible from the Korean people, and it fulfills this purpose with perfect, cruel efficiency."

 
 
