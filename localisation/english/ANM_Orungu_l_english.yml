 #Ideas
 GAB_lenguage_tensions: "Lenguage Tensions"
 GAB_lenguage_tensions_desc: "Our country, comprising the regions of Gabon and Equatorial Guinea; suffers from a terrible discrimination between people, based on language.\nWhile most of the territory is french-speaking, the more populated Northeastern region still retains spanish as it's main dialect.\nDuring the times of the tyrant Macías-Nguema, spanish-speaking fang were favoured.. The dictator's iron grip assured any tensions based on language or ethnicity were tucked under the rug.\nNow that Nguema is gone, though, violence between the regions is increasing, spanish-speakers might be violently assaulted from talking in the wrong language at the wrong place. while francophones are terribly discriminated from getting education or a job in spaniard areas.\nThe conflict is deepening every year, the salvation goverment must resolve this, lest they get tired of eachother."