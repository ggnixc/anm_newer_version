 ## Descriptions ##
 POLITICS_LARS_LEIJONBORG_DESC: "Born in 1949, not long after the Nazi victory in the Second World War, Lars Leijonborg was a committed Liberal and Anti-Fascist early on in his life. Leijonborg became involved in Politics in the early 70s, joining the Liberal People’s Party (FP) while he was studying in Stockholm and was frequently involved in Anti-Nazi Protests at College. Leijonborg rose rapidly within the party, becoming the Editor of the Party’s Magazine in 1974, and joining the Riksdag in 1978, serving as a backbench FP parliamentarian in Sweden’s first non-SAP Government since WWII.\n\nWhen the FP were returned to the Opposition in 1982, Leijonborg slowly worked his way up the party once again, succeeding Westerberg when he stepped down as Party Leader after the 1991 Election and leading the party into the 1995 election. With the SAP lacking a majority after the election, the FP, Moderates, Christian Democrats and Centre Party would negotiate over a potential centre-right government for weeks.\n\nFinally, on March 12th 1995, Leijonborg would emerge as Sweden’s new Prime Minister after several rounds of negotiations, leading a diverse Coalition Government which soon began to squabble amongst each other over every policy issue. It may be a family of parties working together, but that doesn't mean they won’t try to undermine each other."


### Ideas ###
 SWE_made_in_sweden: "Made in Sweden"
 SWE_made_in_sweden_desc: "While the Swedish Military has had its moments in war, its current state and fame are nothing to write home about. However, the same cannot be said for the weapons they wield and the vehicles they drive into battle. Under Liberal Prime Minister Ola Ullsten in the Early 80s, the Swedish State began subsidising native military manufacturers such as the Saab Group to build up a native domestic arms industry and make itself more Independent from the Reich.\n\nThis move towards military dependency allowed Sweden to become a hub of military weapon and vehicle manufacturing for the Nordic nations and the Wider Europäische Pakt both during and after the 2WRW, cementing its place as the Europäische Pakt’s arms dealer."
 SWE_bloated_welfare_state: "The Bloated Folkhemmet"
 SWE_bloated_welfare_state_desc: "The concept of Folkhemmet in the modern era almost forms a core part of the Swedish identity and culture. The brainchild of the SAP, it tries to strike a middle ground between Socialism and Capitalism by implementing a large and generous welfare state that any Swede can use.\n\nHowever, in recent years as the Swedish Economy slugs along, the Swedish Centre and Right have criticised the high cost of maintaining the current system, calling for rational and necessary cuts to be made. Despite similar calls being made within the SAP, the party continues to support keeping the current level of spending and refuses to compromise on its Social Democratic Principles."
 SWE_the_coalition_cracks: "The Coalition’s Cracks"
 SWE_the_coalition_cracks_desc: "Unlike the Leftists in the SAP, the centre and right wings of Swedish Politics have always been divided between the Moderates, Centre Party and Liberal People’s Party. This lack of unity under one party and subsequent battle for centrist and conservative voters was a key reason why the SAP held onto political dominance since WWII.\n\nEven together in Government, the parties still continue fighting with each other, with disagreements over the Welfare State, Privatisation and Sweden’s position in the Europäische Pakt. In many ways, it is a miracle the Coalition is still standing, with only a dislike for the SAP keeping the parties together in chaotic harmony."
 SWE_sap_dominance: "SAP Dominance"
