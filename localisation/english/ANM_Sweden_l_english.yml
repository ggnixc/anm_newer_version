#ideas
SWE_folkhemmet: "Folkhemmet"
SWE_folkhemmet_desc: "The model of the Swedish state is one where the state acts as a home for the people. A home in which its residents are sheltered from the elements of nature. If a "home" leaves its inhabitants to die at the jaws of a wolf, or at the mercy of a storm, is it truly an abode at all? Similarly, what is a state if it cannot protect her people from the unpredictable elements of everyday life, or from the hostile actors in an ever changing environment?\n\nIndeed, the Swedish state exists not for prestige, nor for grandeur, but for her people. It facilitates the social and political participation of a populace whose most basic needs are never put into question. A bastion of warmth in a cold world."
SWE_schwedenisierung: "Careful Collaboration"
SWE_schwedenisierung_desc: "The Swedish state, despite being popularly known as a bastion of light and liberty, is in close collaboration with an empire which can only be described as quite the opposite. Surrounded by the Germans and their empire, the Unity Pakt, Sweden partakes in constructive and close collaboration with the German Reich -- and it has proven to be a boon. German industrial investments provide direct employment for thousands of Swedes.\n\nSo long as the Swedish government occasionally bends for the Reich, the Germans are content to maintain this beneficial relationship. The Reich's grasp upon Sweden is much less of a stranglehold, and more of a warm handshake, and with this, the people of Sweden are content."
SWE_exports_to_germany: "Exports to Germany"
SWE_exports_to_germany_desc: "The demands of the mighty German industries are great, and with great industries, comes a great demand for ores. Swedish mining firms have made great use of this, employing many thousands of Swedes in iron mines across the country and profiting handsomely. Additionally, German firms, such as Reichswerke, have been granted concessions to run large mines within the country, employing hundreds of imported slaves to extract the bounties beneath Swedish soil(who are quietly documented as migrant labourers). As a result, Sweden enjoys some rather large trading privileges with the nations of the Unity Pakt. Privileges that, to any Swedish businessmen, are worth far greater than the lives of some foreign slaves."

