#Leader Descriptions:
POLITICS_OLOF_PALME_NOTUSED_DESC: "A champion of the Swedish labor in his adult years, Olof Palme could not boast about coming from a humble background, being born into a well-to-do Conservative Lutheran family in Stockholm. A sickly child with much time to read books, he learned the English, French and German languages at a young age, something would benefit him greatly later in life. During the Second World War, Palme briefly served the Swedish army and experienced the worst of the nation's fear of a German invasion. Palme would go the United States to continue his education and it was here that he began to formulate his political ideas. Meetings with the National Progressive Front introduced him to the issues of racism and class struggle, while a brief journey to Asia showed him the horrors of the Japanese imperialism. Returning to Sweden in the late 50s, Palme was ready to enter Swedish politics. The 1958 election saw him enter the first chamber of parliament and his service in various government agencies made him even more popular as a semi-radical and progressive figure. Within two years he was made Deputy Prime Minister and in late 1961, Tage Erlander retired in favor of his protegé.\n\nAlthough he has not served long as Prime Minister, Olof Palme has quickly made quite the impression. His skills as an orator proved vital when the public first reacted to such a young man becoming their next Head of Government. The visits of Prime Minister to certain diplomatically isolated countries proved to very contentious by the Swedish concerned population and the world community alike, especially his visit to Communist Cuba. The Prime Minister did not hesitate to make some subtle jabs at the dictatorships that dominate Europe, while simultaneously upholding a cautious appeasement policy. 1962 begins and Olof Palme now starts his tenure in earnest. His policies are often criticized as controversial and sometimes even unpopular, but no one can claim that he hasn't taken to his new role well."
POLITICS_TAGE_ERLANDER_DESC: "In 1945, Prime Minister Per Albin Hansson died suddenly while stepping off a train in Stockholm. Hansson left an immense legacy in his wake. His tenure as head of government had dramatically altered the state of the Swedish nation and at the time of his death he had shown no sign of wishing to stop. So it fell, somewhat unexpectedly, to Minister of Education Tage Erlander to take the reins of both the Social Democratic Party and Sweden itself. Erlander's government was formed at a time of great uncertainty for Sweden. Europe, as the country had known it, was now gone; replaced by Germany's new order. Sweden was now the only Scandinavian country not under direct German rule. Even as the war in Europe came to a close, it seemed possible that the country might not survive that way for long. In order to prevent such a fate, Erlander opened Sweden to trade and cooperation with Germany. This decision quickly became the core argument against the Social Democratic government; as the People's Party began to take a clear pro-american stance.\n\nSince those days, Erlander has proven himself to be a diligent disciple of the Hansson days. While not as charismatic as his predecessor, the Prime Minister's policies have kept him popular. Universal health insurance, larger pensions and expanded child care are but some of the reforms implemented during the late forties and fifties. Much of this has been affordably achieved due to the small size of the army, as well as the surprising benefits to trade with Germany.\n\nHowever, all is not well in Sweden. Erlander is more than aware of Germany's subtle attempts to influence the nation; something that the opposition is very public about too. The coming years will demonstrate if the price paid for 'Folkhemmet' can still be justified."

