 #LEADER DESCRIPTIONS#
 POLITICS_JEAN_PHILIBERT_MABAYA_DESC:0 "Jean-Philibert Mabaya grew up during the Nazi occupation of his homeland, where he, like many others, would resist the occupation. His methods were controversial, as he would engage in business with the corrupt Zentralafrika regime, trading and selling weapons to the different armed resistance groups. He would amass a small fortune in reichsmarks, which he would trade for dollars as the Americans rolled over the Nazis. He became a large business holder, corrupt and wealthy, and when the Americans gave his nation freedom, he was high on the list of oligarchs to be the new king of the Congo. The Young Democratic Republic of Congo would not last, as Mobutu Sese Seko was elected to the position of President. Mobutu would entrench national corruption to the very fiber of the republic, and his brutal repression of worker rights and gross political manipulation would lead to Jean-Philibert's wealth being nationalized by the state, no doubt to be used for political bribes and paying off the military. After the 1980 military coup that would see Mobutu publicly shot, Jean would begin a new rise. In the military regime, he would be appointed as an economic minister, keeping the nation's funds afloat despite the massive military overspending. He would be the only member of the civilian cabinet of the military regime that was never replaced nor purged. When the Military regime finally stepped down, Jean-Philibert created his political party to be an image of his life. A party for the people, for business, for the ideals that had been tarnished all those years ago. He was elected on a progressive populist platform, which lead to the military to revolt, due to his intentions to slash the military spending and remove their power. Jean-Philibert intends to unite his nation once again. He will be the leader that the people have longed for, for all these years, and the Congo will finally and truly be free."
