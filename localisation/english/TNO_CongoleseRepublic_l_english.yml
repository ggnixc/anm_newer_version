 GENERAL_KONGOLOU_NADINE_DESC:0 "Kongolo "Sseth" Nadine has been a soldier for the Democratic Republic of the Congo since he came of age. He served as a major in the army for most of his tenure, serving the military government until 1998. When the elections were announced, Kongolo was joyous, thinking his nation would finally become the democracy it deserved to be. In 1998 he cast his vote, as many others did, for the progressive party. When the New president was elected, a calm fell upon the nation.\n\nFor a brief year, things seemed well, it seemed that democracy was improving, corruption was declining, the nation appeared to be stronger than ever before. Then James Kabarebe marched on Kinshasa. Reeling from this, Kongolo immediately began preparing for war. The insane mobutuites rose in the Katanga region and the socialists in the East. His post in the northern part of the Republic, Kisangani, would prove vital to the survival of the democratic movement.\n\nHe rallied his men in the City of Kisangani, repelled the first communist onslaught, and held his ground while awaiting the President of the Republic, who had rallied the Republican Guard to the city. Kisangani ultimately became the temporary capital for the Democratic Front, with Kongolo being one of the few high-ranking officers staying loyal. While he did not expect his sudden rise through the ranks, he has decided to not take advantage of his position. This has led to him becoming a well-respected member of the general staff, seen as one of the least corruptible military leaders in the Democratic Front."

