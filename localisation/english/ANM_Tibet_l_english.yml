 #Leader Descs
 POLITICS_TENZIN_GYATSO_DESC:0 " Born as Lhamo Thondup, the Dalai Lama began his life in Qinghai province, which is known to the tibetans as the Amdo region. Out of the 6 brothers in his family, 3 of them were recognized as reincarnated Rinpoche, or spiritual leaders. As the 14th Dalai Lama, he was both the spiritual and political leader of an independent Tibet for over 35 years. However, when the Great Asian War concluded, China turned her attention back towards the West. Tibet was forced to the negotiating table, and the Dalai Lama negotiated a treaty in which the religious leadership of the Tibetan people shall be untouched by the Guomindang government, and in return Tibet will join as an autonomous province of China. As such, Tibet has been politically dominated by elitist section of the Guomindang's bureaucracy for the past 20 years, and while the Dalai Lama certainly wishes to assert Tibet as an independent nation, the probability of this dream seems to fade more and more by the day.§!"

# Minister Names
 TIB_minister_Sonam_Topgyal_hog:0 "Sonam Topgyal"
 TIB_minister_Yang_Chuantang_eco:0 "Yang Chuantang"
 TIB_minister_Tenzin_Tethong_for:0 "Tenzin Tethong"
 TIB_minister_Meng_Hongwei_sec:0 "Meng Hongwei"
 
 TIB_minister_Sonam_Topgyal_hog_desc:0 " Sonam, as the temporal leader of the Tibetan people, is fiercely loyal to the Dalai Lama. A seperatist at heart, Sonam constantly pushes against the different Chinese ministers sent to Tibet, trying to assert as much autonomy at every point possible. This angers much of the Chinese bureaucracy in Lhasa, but unless a violent insurgency were to occur, Beijing seems to be content to let Sonam play his resistance game.§!"
 TIB_minister_Yang_Chuantang_eco_desc:0 " Yang Chuantang used to be a military man. He was one who destroyed infrastructure, not built it. However, after being sent to Lhasa to oversee state economic investment in the region, Yang has become fascinated with Tibetan culture, and one of the only true advocates for Tibetan cultural interests in the Chinese administration.§!" 
 TIB_minister_Meng_Hongwei_sec_desc:0 " There are many adjectives you could use to describe Meng Hongwei. Violent, Brooding, Authoritarian, Calculated are just a few. However, there is no pair of adjectives that describe Meng better than 'hopelessly corrupt'.§!"
 TIB_minister_Tenzin_Tethong_for_desc:0 " Tenzin Tethong has spent the last 30 years of his life in direct service of the Tibetan people. From his time as the Dalai Lama's representative in the United Nations to his negotiations with bordering nations such as India and Nepal, Tenzin has made it his goal to increase public sympathy for Tibet and as such spread the cause of Tibetan sovereignity.§!"
 
 #Starting Ideas
 TIB_steadymarchofprogress:0 "The Steady March of Progress"
 TIB_steadymarchofprogress_desc:0 " Change has arrived at the roof of the World.\nSerfdom, Aristocracy, Theocracy. These are institutions that have no place in 21st Century Tibet, and certainly not in 21st Century China. The Guomindang regards Tibetan society, isolated from the rest of the world for so long, as archaic and backwards. The Chinese Bureaucrats sent from Beijing and Nanjing to Lhasa work tirelessly alongside Tibetan reformers to uplift Tibetan society. This, however, puts them in direct conflict with the nobility and clergy. Many of them ignore Beijing’s orders outright! While the Dalai Lama sympathizes with many reformist ideals, they are not received well in the monasteries. As such, modernity and tradition clash in the Himalayas.§!"
 
 TIB_anueasypeacea:0 "An Uneasy Peace"
 TIB_anueasypeacea_desc:0 " The Tibetan acceptance of Chinese control was not out of any genuine desire for Chinese Republicanism but out of necessity. Tibetan elites are generally very wary of Chinese influence and do not trust the Guomindang’s civilian administration in Tibet by any means. As China drags Tibet, kicking and screaming, into modernity, it alienates much of the more conservative population, who are becoming anxious about the possible erosion of Tibetan culture and identity. One does not have to be a political analyst to see that the only thing keeping the peace in Tibet is the Dalai Lama’s aversion to violence and bloodshed.§!"
 
 TIB_trouble_with_autonomy:0 "The Trouble with Autonomy"
 TIB_trouble_with_autonomy_desc:0 " While having such a high degree of autonomy is often seen as a net positive for the Tibetan people, there are some significant drawbacks. The Chinese government partakes in a variety of Affirmative Action programs meant to help uplift different ethnic minorities, but this does not apply to Tibetans living inside of the Autonomous Region. Furthermore, there are various welfare benefits distributed by the Chinese government that are not allocated to the Autonomous Region. This is in exchange for a lessened tax rate, which was negotiated during integration into the Republic of China. While this may make the province attractive to investors and encourages growth, it also causes those in poverty to suffer needlessly.§!"
 
