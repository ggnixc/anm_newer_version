POLITICS_SAADU_IBRAHIM_ABUBAKAR_DESC: "The Sultan of Sokoto, Ibrahim Muhammadu Maccido dan Abubakar, was already old when he took power in 1988. He knows he is old, and while he is not ready to give in just yet, his knowledge of his ever-approaching mortality has encouraged him to work harder than ever before. All to ensure the legacy of his father would live on through him.\n\n His father, Sultan Siddiq Abubakar III was a great man, a famous and popular leader who brought Sokoto its independence. Despite many turbulent revolutions and wars around it, after 1970, Sokoto went into a period of stability and reconstruction. Denying the popular notion of democracy, the country instead formalized itself as an absolute monarchy, at the time a seemingly obvious choice of government. In practice, the nobility still held vast sway over the government, although the power balance had shifted to favor Sultan Siddiq.\n\n Sokoto's years in the 80s and early 90s were a period of growth, but not of prosperity. Modernization was hampered by the near-feudal government, as Emirs would stop the Sultan from passing necessary reforms. A rare achievement of the intervening years was the rebuilding of Sokotan infrastructure and the opening of three major factories. The nation, however, was stratified, and civilian life barely improved during the 80s.\n\n When Siddiq passed on to paradise, Muhammadu was elected as Sultan. He was notably more authoritarian than his father, curtailing the rule of the Emirs and instead  making attempts to centralize the state around the Sultan. The government enacted small amounts of welfare and even passed laws that allowed an open court once a month for any citizen in Sokoto to speak with the Sultan.\n\n Muhammadu has been hard at work trying to forge Sokoto into a fully-fledged nation-state, and while the work has been slow, and may not even be completed before his departure. His confidence is in his Son, Ahmed, who has styled himself as a competent leader, who would unite the Sokotan people under his benevolent rule and open its arms to the Muslims of the world.\n\n However, the Sultan himself does not choose his heir. The ever-ambitious Sa'adu Abubakar has also been chosen as a candidate for when the Muhammedu passes. His talks of Fulani supremacy in Sokoto and his ties to the powerful Emirs make him a likely choice. Sa'adu also proclaims the unity of the people of Sokoto in Sunni Islam, an easy way to curry favor with the Anti-Shia nobility.\n\n Despite these struggles,  Muhammadu Maccido Abubakar has hope for the future of the Sokoto people, and he wants to be the man who brought Sokoto into the modern era. His tireless work to put Sokoto on the map will pay off for his descendants. He trusts Allah for that."