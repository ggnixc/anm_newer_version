#Ideas

CHL_Legacy_of_Pinochet:0 "The Legacy of Pinochet"
CHL_Legacy_of_Pinochet_desc:0 "Who was Augusto Pinochet? To those on the left, Pinochet, who came to power following the overthrow of  a democratically-elected president, was an abhorrent, atrocious demagogue — an affront to the very concept of liberal democracy. To those on the right, Pinochet was the greatest leader Chile has ever known — a strongman who forcibly grabbed the steering wheel of a nation careening toward total collapse.\n\nThough many credit Pinochet for leading Chile into an era of unprecedented economic prosperity, this progress came at a cost. Democracy was effectively snuffed out under his junta’s watch, with thousands arrested, tortured and executed every year. It was only after heavy pressure — from the Chilean people, that the dictator was at last deposed eight years ago.\n\n§VAgainst all odds, democracy has returned to Chile, but the battle to preserve it has just begun.  Despite Pinochet’s brutal, repressive policies, many Chilean conservatives still view the fallen dictator in a favorable light. They pine for a return to the Pinochet years — and are not opposed to resorting to violence to accomplish their goals..."
CHL_Socialist_Fighting:0 "Dysfunctional Infighting"
CHL_Socialist_Fighting_desc:0 "Though Patricio Aylwin’s interim government has taken concrete steps to right the many wrongs of the Pinochet regime, the deepest scar of Chile’s recent past — the contentious cold war between the Pinochetistas, the Socialistas, and the Centrists — continues to fester with no end in sight.\n\nThis three-way conflict has not only caused an irreparable rift in the Chilean political system, but extreme polarization of the populace, as well. Vulgar political slogans, hastily scrawled in spray paint, are now commonly found defacing the charming, colonial facades of Santiago. Underfunded, underequipped police departments throughout the country can do nothing but gawk as paramilitaries routinely clash, transforming Chile’s once-quiet streets into bullet-scarred war zones.\n\n§VA torrid flame rages beneath the feet of every Chilean. If nothing is done to pacify the nation of poets’ quiet civil war, Chile’s final stanza may be just over the horizon..."
CHL_Military_Factionalism:0 "Crippling Military Factionalism"
CHL_Military_Factionalism_desc:0 "During the Pinochet years, the Chilean military was the bedrock of the regime — a powerful, united institution responsible for maintaining order within the country. History would not rule in Pinochet’s favor, however. The liberals and socialists, united in their calls for democracy, would ultimately spell the end of Pinochet’s government — and with it, the same winds of revolution would blow the Chilean military off its gilded pedestal of power.\n\nThe moderate coup of 1987 divided the military between moderate, pro-Pinochet, liberal, and socialist camps. And even though the establishment of an interim government prevented a full-on civil war, the shattered Chilean military never truly mended the rifts that had torn it apart.\n\nIt goes without saying that such rampant factionalism poses critical national security risks — yet even middling reform seems impossible. Each faction has had plenty of time to get cozy with at least one squabbling government sect, meaning that any slight whiff of reform is destined to inflame outrage and instability. The toothpaste, so to speak, has already left the tube, ensnaring the Chilean military in a lethal trap of its own design."

