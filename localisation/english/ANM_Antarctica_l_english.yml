## Descriptions ##
# Country Leader #
 POLITICS_VIKTOR_FEDOROV_DESC: "Viktor Dmitrievich Fedorov was born in 1947 into a family with a military background, with his grandfather having served as a commander in a Cavalry Brigade on the China front during the Russian Empire. His family had moved to Irkutsk following the collapse of the Union of Soviet Socialist Republics at the end of the First Great Patriotic War. As Irkutsk began to reclaim the Pacific coast of Russia during the Second Smuta, Fedorov served on surface ships of the Pacific Fleet, where he rose through the ranks from combat unit commander to formation commander. Additionally, he also graduated from the Naval Academy earning him a top rank in the Soviet Navy. \n\nFollowing the Union's successful reclamation of Muscovy, Moscow and Wellington sat down to negotiate a lease of a naval station on the Ross Dependency for Soviet Antarctic Expeditions to begin in earnest. As such, Fedorov was assigned to be the overseer of the White Continent's only Red naval station, and to defend against harassment from German and Japanese incursions. Despite his sense of duty for the motherland, Fedorov cant help but ponder; perhaps once the lease of the naval station is over, he would finally be able to head home once and for all and to reunite with his family."
 POLITICS_INGO_STAWITZ_DESC: "Ingo Stawitz, born on August 18, 1950, in Hamburg, was shaped by the iron grip of postwar National Socialism. Raised in a party-loyal family, he absorbed early in his life the doctrines of the NSDAP and carried them into a career defined by rigid order and bureaucratic precision. Working his way up the administrative ranks throughout the 1980s, he became well known within Reichsgau Schleswig-Holstein as a reliable, if uncharismatic figure - ideal to be in charge of the Reich's more remote ambitions.\n\nHis arrival in Neuschwabenland in the early 1990s was a turning point in the Antarctic colony. The region had only just recovered from the previous resource shortages and administrative inefficiencies of the past decade. Newly supplied and directed to restore order, Stawitz began the task in his pragmatic way. Facilities were constructed, a number of the science stations were converted into permanent facilities, and the party asserted itself again with the creation of winter camps, isolation test camps, and logistics training bases. During his rule, the Norwegian Polar Institute at Bergheim was granted partial autonomy - an unusual but calculated allowance in exchange for full cooperation within the European Research Cooperative.\n\nEven these victories have not rid the region of tension. The chaos brewing in the mainland is felt even here, on the edge of the world. Where Stawitz presents Neuschwabenland as the model of party strength and scientific potential, discontent mutters in the frozen halls of its stations. The bureaucrats grow bolder, resources become more strained, and the outward facade of calm may at any moment succumb to the cold reality of failure."
 POLITICS_ROBERT_MARTEL_DESC: "Robert Martel was born in Algiers in 1921 and came of age as the French Empire disintegrated—a period which would set itself to become his life's mission. Witnessing the fall of Algiers made its mark on him indelibly, leaving in its place an enduring commitment to the preservation of France’s global prestige. Unlike his contemporaries who turned inward, Martel directed his ambitions southward, toward the wind-lashed coast of Antarctica. To him, the French Southern and Antarctic Lands were not merely administrative backwaters, but the final redoubt of true French civilization. When he succeeded Xavier Richert in 1982, it was with the solemn conviction that he was inheriting not an outpost, but a sacred trust.\n\nOperating under dire financial hardship, Martel continued to drive a bold agenda. Adélie Land, long overshadowed by foreign occupation, was to become the symbol of his cause. While Paris focused on détente and managed decline, Martel employed the language of revanche. His administration emphasized civic order, colonial pride, and the building of a distinctly French identity—an identity increasingly hostile to the presence of German families who had arrived with the Wehrmacht deployments.  Martel saw not just cultural intrusion in their arrival but also a violation of France’s rightful dominion.\n\nThough few in Port-aux-Français share the fire of his convictions, Martel’s words have struck a chord with segments of the population bent for so long to stagnation and foreign encroachment. Now nearing the end of his time, he is determined to make a last gesture—an act that will be sure to remind both Paris and the world of France's reputation for frontiers, as well as those who defend them. Whether remembered as a stubborn relic or as a visionary patriot, Martel’s legacy is one of defiance: to time, to compromise, and most notably, to retreat."
 POLITICS_REX_MONCUR_DESC: "Born in 1942 to Melbourne, Australia, Rex Moncur's fascination with science and technology was evident from a young age. At eighteen, he became a licensed radio operator and two years later would graduate from the Royal Melbourne Institute of Technology with a degree in communication engineering.\n\nAfter college, Moncur worked for the Bureau of Meteorology, where he contributed to the development of telemetry systems. Looking to advance his career, he would move to Canberra in 1973, where he would accept an administrative role within the Department of Science. His dedication and merit propelling him to Secretary of the Australian Research Grants Committee.\n\nThe late 70s saw the collapse of the OFN Antarctica Administration, leaving the newly established Australian Antarctic Territory in dire need of capable, non-American scientists to guide its future. However, Moncur would decide not to imminently dive into the politically frantic continent, opting to wait for the return of stability in the region. In the following years, stability would return to the icy tundra and in 1985 Moncur transferred to the Australian Antarctic Division, eager to pursue new research. His leadership skills and passion would quickly set him apart from his peers, and in 1987, he was appointed to lead the territory.\n\nFor nearly a decade, Moncur has been at the forefront of Antarctic exploration, organizing numerous scientific expeditions and keeping a vigilant eye on the activities of the Reich. Yet, what truly fuels him is a profound love for Earth's great last frontier—a vast, icy wilderness that continues to inspire his tireless quest for knowledge."
 POLITICS_CHRISTIAN_BOUCHET_DESC: ""
# Ministers #


### National Spirits ###
## German Antarctica ##
 AAG_Norsk_Polarinstitutt: "Norsk Polarinstitutt"
 AAG_Norsk_Polarinstitutt_desc: "The former Ahnenerbe headquarters in Bergheim has, over the decades, transformed into the heart of Norwegian Antarctic research. A gathering place for polar scientists, it has facilitated the exchange of knowledge and the consolidation of expertise in some of the harshest environments on Earth. Recognizing its value, Stawitz granted the Norwegian Polar Institute autonomous control over the facility, provided it remained self-sustaining and cooperated within the broader European Research Cooperative.\n\nWith a strong contingent of dedicated researchers, the Norwegian presence in Neuschwabenland has flourished, driving advancements in glaciology, meteorology, and oceanography. Their meticulous studies and extensive expeditions have not only bolstered Norway’s influence in the Antarctic but also positioned the NPI as one of the leading institutions in the field of polar science. Though their work remains strictly scientific, the wealth of data they accumulate could hold broader implications, especially in a world where control over the poles is becoming increasingly strategic."
 AAG_German_Bureaucracy: "German Bureaucracy"
 AAG_German_Bureaucracy_desc: "Neuschwabenland has been transformed into the NSDAP’s private playground, a frozen testing ground where ideology and ambition meet the harsh realities of the Antarctic. Alongside the might of the party comes the full weight of the German bureaucracy, a vast and self-perpetuating machine that ensures every project, no matter how outlandish, is meticulously documented, reviewed, and categorized. \n\nWhere the possibilities are endless, so too is the paperwork. From winter survival camps to psychological isolation experiments, Neuschwabenland hosts a variety of party-affiliated initiatives, each requiring an ever-growing army of clerks, inspectors, and officials to oversee its implementation.\n\nThis rigid structure of German administration ensures that even the most bizarre proposals, be they extreme endurance tests or ideological training retreats, can become a reality, provided they navigate the labyrinth of regulations and gain the favor of the right bureaucrats. Efficiency is praised, but nothing moves forward without the proper authorizations, ensuring that the Antarctic colony is as much a triumph of administrative complexity as it is of political will."
 AAG_In_Atoms_Light: "In Atom’s Light"
 AAG_In_Atoms_Light_desc: "Where resources are scarce and conditions unforgiving, survival in Neuschwabenland hinges on the power of the atom. Scattered across the frozen wastes, the outposts that maintain permanent habitation are sustained by compact nuclear reactors, their steady hum a lifeline in an environment where failure means death. These reactors provide not only electricity but also the crucial heat needed to prevent entire facilities from succumbing to the relentless Antarctic cold. Without them, life on this continent would be nearly impossible, and the icy grip of nature would reclaim all that man has built.\n\nYet, while these reactors ensure survival, they are shrouded in secrecy. Access is restricted to only the most trusted personnel, and those permitted within do not speak of what transpires behind their reinforced doors. Rumors swirl—of experimental energy projects, classified military applications, and research ventures that push the boundaries of science beyond what is publicly acknowledged. Whether these whispers hold any truth remains uncertain, but one fact is undeniable: in the heart of the Antarctic, the atom reigns supreme, casting its light over the last frontier of German ambition."
## French Antarctica ##
 AAF_The_Last_Bastion: "The Last Bastion of.."
 AAF_The_Last_Bastion_desc: "The last and only remaining colony of France, French Antarctica, stands as the final remnant of a once-vast empire, a symbol of French resilience in an era where its global influence has all but vanished. Yet, for all its importance, the colony remains fractured, haunted by the shadow of what it lost. The dissolution of French Madagascar—once the heart of France’s Indian Ocean holdings—left the colony weakened, stripped of its economic and strategic centerpiece.\n\nWithout Madagascar, French Antarctica finds itself struggling to maintain unity as local administrators, military officials, and settlers argue over the direction of the colony’s future. Tensions simmer between those who still dream of reclaiming what was lost and those who believe a new path must be forged. All the while, the world watches, waiting to see if this last vestige of France’s imperial past will endure—or finally collapse."
 AAF_Sailors_Haven: "Sailors Haven ‘Méduse’"
 AAF_Sailors_Haven_desc: "Nestled in the frozen expanse, ‘Méduse’ is a remote and isolated outpost, situated roughly 2.5 km away from the main civilians' base. Primarily occupied by personnel of the French Navy, this encampment operates with a quiet but unwavering commitment, the residents having minimal interaction with the outside world. Life within the encampment is one of rigid discipline and routine, with its sailors uncompromisingly devoted solely to their various tasks—be it maintaining patrols in position, overseeing vital logistics, or ensuring the readiness of their vessels in these hostile conditions.\n\n‘Méduse’ is no more than a distant enigma to the civilian population, a place where strict order reigns and its inhabitants are not concerned with the day-to-day struggles of those beyond its perimeter. Yet, despite its seclusion, the outpost’s presence is a necessity, providing a secure foothold in an environment where survival itself is a constant challenge. In these frozen wastes, where the land offers no mercy, a well-guarded haven such as Méduse is not just an asset—it is a lifeline."
 AAF_German_Presence_1: "German Presence: Overwhelming"
 AAF_German_Presence_1_desc: "Though the flag flying over the settlement remains French, the reality on the ground is a different story. German soldiers and even civilian personnel are everywhere, their numbers growing with each passing day. What was once a distinctly French foothold in the icy wilderness now bears the mark of German influence, their authority felt in every outpost, supply depot, and watchful patrol. Though officially allies, tension lingers—interactions remain cold, cooperation is hesitant, and both are aware that mutual allegiance goes a short way toward mending deep-seated rivalries.\n\nThe presence of the Germans is undeniable, and even in the absence of outright conflict, resentment bubbles beneath the surface. French personnel are like outsiders in their own territory, unable to shake the looming specter of foreign control. Whether this is a new reality or merely a phase remains uncertain, but one thing is certain: as long as the Germans remain entrenched, true autonomy remains only an illusion."
 AAF_German_Presence_2: "German Presence: Declining"
 AAF_German_Presence_2_desc: "The colony now stands firmly under French control, its borders free of the foreign presence that once loomed above them. Where there once was an unspoken tension in the icy air, now there is relief—orders are given in a single language, posts are maintained continuously, and the people can move with a renewed sense of greater security. There is no longer a quiet power struggle beneath the surface, no hushed orders from another hand shaping the course of daily life.\n\nYet, the traces of their presence remain. The abandoned barracks, the silent radio towers, and the memory of a time when control felt fragile still haunt the minds of those who endured it. Others see their departure as a victory, proof that perseverance can reclaim what was nearly lost. Others remain uneasy, knowing that even in this frozen wasteland, old rivalries are never truly buried."


### Events ###
## German Antarctica ##
 AAG_flavour_event.1.t: "URGENT FAX: White Silence"
 AAG_flavour_event.1.desc: "A dire situation has developed at Führer-Station in the Neuschwabenland Antarctica colony. The most recent expedition team dispatched to the Thorshavnheiene mountain range has not responded to three radio check-ins. The team, composed of some six researchers led by Abschnittsleiter and geologist Ernst Herrmann, was tasked with mapping out the region's large network of ice caves for scientific purposes. Their last known position has placed them approximately 30 kilometers southeast of Base Camp Adler.\n\nOur attempts to establish contact with the expedition have failed. There has been zero response on any channels, including emergency frequencies. Dangerous weather conditions have developed unexpectedly to reports, and remain unpredictable, leaving possible interference from a heavy blizzard.\n     Of greater concern to us is Herrmann’s status. His personal involvement in the survey was intended to expedite future infrastructure construction in our colony and was considered sensitive, particularly in light of his access to experimental research technology from the mainland.\n\nGiven the proximity of the expedition to the vague Australian territorial boundary and the limited operational capacity of the Führer-Station’s internal security forces, we must begin immediate action. A recovery team must be assembled and dispatched posthaste"
 AAG_flavour_event.1.a: "Authorize Search-and-Rescue"
 AAG_flavour_event.2.t: "Minutes Past Protocol"
 AAG_flavour_event.2.desc: "The outpost kitchen was empty when Dr. Gustav Amundsen walked in, there was no usual idle talk from the engineers, but only the hum of the overhead lights and the whistle of the cold wind pouring into the walls. He poured himself a cup of bitter and rather over-brewed coffee, then stood by the frost-lined window, watching the snow drift across the tarmac.\n     The clock above the stove read 06:47. He had overslept by nearly an hour. That wasn't usually like him.\n     He dressed hastily, the cold biting through his shirt before he'd even finished lacing his boots. The hallway to the comms room was unusually quiet; there was no chatter nor incoming radio signals. It wasn't until he passed the operations board and saw the red marker on Sitzungsraum B that he realized something was wrong.\n\nThe meeting was already in progress. Ten or so personnel sat in foldout chairs while Stationleiter Kraus stood at the front, pointing to a topographical map of the local region spread across a steel table. Amundsen slipped in, unnoticed by most but not Kraus, who paid no mind and continued.\n     “The Herrmann team missed their third scheduled contact window. Weather over the mountain range remains unstable. Last satellite sweep suggests a pressure system moving along the southern ridge, strong enough to knock out line-of-sight.”\n     He gestured to another chart, which had temperatures, wind speed, and storm drift.\n     “We'll mobilize once the visibility improves. Current estimates suggest a break in three to five days, but it could be more. Until then, prep your gear and check rations. No one moves until we get a clear picture.”\n\nSomeone raised a hand. “Do we have any clue whatsoever of what they were doing before contact broke?”\n     Kraus paused, then continued. “Only what was in the report—they were doing geological mapping… caves.”\n     The room fell silent; Amundsen felt the silence settle in his chest. The caves weren't that unfamiliar to him; their unforgiving, but at atleast could protect from the harsh wind.\n     He said nothing. He continued sipping his coffee, which had now gone cold."
 AAG_flavour_event.2.a: "“There's nothing else we can do right now but wait.”"
 AAG_flavour_event.3.t: "Trapped Between Frost and Fear"
 AAG_flavour_event.3.desc: "The wind has blurred the horizon completely. Ernst Herrmann stood beside the half-buried snowcat, one gloved hand pressed against its frozen hull, listening with dread as the engine died in sputters. Snow peeled sideways across the plateau like a white curtain. The visibility was near zero, and even his own men, bundled behind him, looked like smudges.\n     The storm had arrived with no warning. One moment they were crawling east at a slow but steady pace back to base, and the next, the radio was static, their maps unreadable, and their tracks vanishing behind them almost as fast as they were made.\n\nThey had made it perhaps ten kilometers before the snowleopard could go no further. Its tracks clawed uselessly in the deep snow. Two of the six men had already begun showing early signs of exposure. Another, Zeller, had blood in his cough.\n     Hermann stepped away from the vehicle, snow already climbing past his boots as he looked southwards. Unfortunately, all he saw was white.\n     Behind him lay the caves. They were cold but windless. Cramped, but defensible. A place to hold out and wait for rescue. He hated the thought, sheltering like scared animals in that blue ice but hated more the odds of six men surviving the long journey completely blind and sick across open ground through this.\n\nHe turned back to face his team. “We unfortunately have two choices now,” he said, raising his voice over the wind. “We go back to the caves and wait for a rescue team to find us. Or we keep heading towards the general direction of the Führer station and try to beat this storm.”\n     No one answered. They looked at him, tired, rimmed with frost. He knew there wasn't a proper choice."
 AAG_flavour_event.3.a: "Turn back to the caves."
 AAG_flavour_event.3.b: "Attempt the journey home."
 WORLD.18214.t: "Extraordinary Antarctic Isolation Experiment!"
 WORLD.18214.desc: "Beyond the remaining traces of civilization, in the heart of the frozen wasteland, a new endeavor has been undertaken—‘Projekt Blaumeise’. Far from the comforts of the main habitation center, this isolated facility has been constructed as a proving ground for the extremes of human endurance, technological resilience, and long-term survival. Here, researchers, engineers, and specially selected personnel face unbroken stretches of time in utter isolation, subject to brutal cold, logistical scarcity, and psychological stress.\n\nEquipment is tested under relentless exposure, life-support systems are refined, and the chosen few who reside within the project’s confines must adapt to a world where failure is not an option. Everything that is learned here brings humanity one step closer to true extraterrestrial habitation. Yet, as weeks turn to months and the walls of the facility feel ever smaller, one is left wondering—are they simulating life on another planet, or are they just embracing the void that already surrounds them?"
 WORLD.18214.a: "‘Projekt Blaumeise’ is a go!"