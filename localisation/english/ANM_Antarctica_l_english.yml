### National Spirits ###
## German Antarctica ##
 AAG_Norsk_Polarinstitutt: "Norsk Polarinstitutt"
 AAG_Norsk_Polarinstitutt_desc: "Talks about the large Norwegian presence in station X that work for the institute, strictly focussed on polar research this group has been quite successful in their respective fields of operation. "
 AAG_German_Bureaucracy: "German Bureaucracy"
 AAG_German_Bureaucracy_desc: "Neuschwabenland has been turned into the NSDAP’s playground, which has brought with itself the glory and might of its bureaucracy. Where the possibilities are endless, so is the paperwork."
 AAG_In_Atoms_Light: "In Atom’s Light"
 AAG_In_Atoms_Light_desc: "Where resources are scarce, and conditions unknown, one can rely on the power of the atom. The outposts that enjoy permanent habitation are often accompanied by one or more mini-reactors. Those facilities provide the needed energy and heat to prevent the endless cold from consuming the habitat. Inhabitants are not commonly allowed to enter the premises, and the ones that are do not speak of what occurs behind closed doors. (Nuclear weapons rumour)"
## French Antarctica ##
 AAF_The_Last_Bastion: "The Last Bastion of.."
 AAF_The_Last_Bastion_desc: "The last and only remaining colony of France, their only display of actual independence and strength on the world stage, and yet it’s disunited because it misses the largest part of it (Adélie Land)."
 AAF_Sailors_Haven: "Sailors Haven ‘Méduse’"
 AAF_Sailors_Haven_desc: "About 2.5km away from the Civilian population a second, smaller, encampment has been formed. Mostly occupied by members of the French Navy, this establishment distances themselves from the commonfolk, solely occupied by their direct duties the inhabitants bear little notion to them."
 AAF_German_Presence_1: "German Presence: Overwhelming"
 AAF_German_Presence_1_desc: "Variable spirit about the presence of German soldiers, and now even civilian personele, that’s spreading through the town. The French and Germans don’t really like one another, even if they are sailing under the same flag."
 AAF_German_Presence_2: "German Presence: Declining"
 AAF_German_Presence_2_desc: "Variable spirit about the presence of German soldiers, and now even civilian personele, that’s spreading through the town. The French and Germans don’t really like one another, even if they are sailing under the same flag."
