## Descriptions ##
# Country Leader #
 POLITICS_VIKTOR_FEDOROV_DESC: "Viktor Dmitrievich Fedorov was born in 1947 into a family with a military background, with his grandfather having served as a commander in a Cavalry Brigade on the China front during the Russian Empire. His family had moved to Irkutsk following the collapse of the Union of Soviet Socialist Republics at the end of the First Great Patriotic War. As Irkutsk began to reclaim the Pacific coast of Russia during the Second Smuta, Fedorov served on surface ships of the Pacific Fleet, where he rose through the ranks from combat unit commander to formation commander. Additionally, he also graduated from the Naval Academy earning him a top rank in the Soviet Navy. \n\nFollowing the Union's successful reclamation of Muscovy, Moscow and Wellington sat down to negotiate a lease of a naval station on the Ross Dependency for Soviet Antarctic Expeditions to begin in earnest. As such, Fedorov was assigned to be the overseer of the White Continent's only Red naval station, and to defend against harassment from German and Japanese incursions. Despite his sense of duty for the motherland, Fedorov cant help but ponder; perhaps once the lease of the naval station is over, he would finally be able to head home once and for all and to reunite with his family."
 POLITICS_INGO_STAWITZ_DESC: "Ingo Stawitz, born on August 18, 1950, in Hamburg, rose to prominence within the NSDAP during the turbulent period following the 2WRW. Growing up under Nazi control, Stawitz has been deeply influenced by the party's doctrines from a young age. His political journey began as a member of the administration in Reichsgau Schleswig-Holstein from 1982 to 1988. His early career was distinguished by his strategic acumen and his unwavering devotion to the Nazi ideology.\n\nIn the early 1990s, Stawitz was appointed head of Neuschwabenland. This came at a time when the Antarctic administration was grappling with the aftershocks of the economic turmoil of the 80s. He arrived with a fresh infusion of funds and a vision to transform Neuschwabenland into a thriving stronghold for the NSDAP. Under his leadership, the outpost saw infrastructural developments and scientific initiatives that revitalized the region once more.\n\nThe once-struggling administration became a symbol of resilience and renewal, reflecting the indomitable spirit of its leader. But nothing is made to last, the troubles of the mainland have arrived on the icy continent, and with it came an end to progress."
 POLITICS_ROBERT_MARTEL_DESC: "Robert Martel, born in Algiers in 1921, became a fervent advocate for French colonialism because the turmoil of decolonization he experienced first-hand. This instilled in him a deep-seated belief in France and her colonial empire. His early years were characterized by a relentless pursuit of military and political knowledge, eventually leading him to the French Southern and Antarctic Lands—the last bastion of colonial rule.\n\nIn 1982, Martel succeeded Richert, and his tenure has been marked by miniscule budgets and ambitious plans. His obsession with reclaiming Adélie Land became the focal point of his rule, viewing it as a crucial step toward restoring French integrity. Despite his nostalgic longing for a bygone era clashing with present realities, Martel remained steadfast in his mission.\n\nHis speeches, filled with fervour and nationalistic rhetoric, often went unheard. However, the immigration of families of stationed German soldiers presented him with a perfect opportunity. Martel rallied the relatively sombre French citizens to unite behind a common cause; to remove the Germanic pest from their city. Although till this day his dream of restoring French territorial claims remains unrealized, its lasting influence underscores the enduring allure of colonial ambitions."
