### Ideas ###
 IRE_the_bloated_giant: "The Bloated Giant"
 IRE_the_bloated_giant_desc: "Most Irish citizens see Fianna Fáil — Ireland’s largest political party for nearly 70 years — as the “natural” party of government in Ireland, and for good reason. The leaders of smaller opposition parties, who could only dream of such ubiquity, envy the dominant position of Fianna Fáil. Behind closed doors, however, the Emerald Isle’s largest political bloc is a corrupt ideological circus.\n\nThe Modern-Day Fianna Fáil has few unifying characteristics. Nominally, it’s your typical right-wing conservative party, in truth, their deputies range from Liberal Progressives to Republican Hardliners. The single thread keeping the disparate party together, it would seem, is a unified adoration for money and power and old Civil War grudges."
 IRE_echoes_ulster_crisis: "Embers of the Ulster Crisis"
 IRE_echoes_ulster_crisis_desc: "The idea of Irish reunification had always been a problematic issue, but when Ireland reclaimed Ulster after the fall of Britain in WWII, they never expected the situation to become this dire.\n\nBy the Mid-1960s, the North had broken into a warzone, with Unionist Paramilitaries frequently attacking Government forces and Nationalist Paramilitaries. It wasn't until 1986 that all sides finally sat down and negotiated the St. Brigid’s Day Agreement, ending the conflict and enforcing a tenuous peace. Under the terms, the four-Unionist-dominated counties would be granted a devolved parliament with partial control over their domestic affairs, and a Government which must be made up of both Nationalists and Unionists.\n\nToday, peace still holds in the North, but tensions remain between the Nationalists and the Unionists. They’re cooperating for now, but everyone fears what the Nationalist and Unionist paramilitaries are up to."
 IRE_pakts_middleman: "The Pakt’s Middleman"
 IRE_pakts_middleman_desc: "The little nation of Ireland doesn't bring much to the Europakt's table, but the one benefit it does provide overshadows all other shortcomings— access to the OFN. Thanks to its close trading and cultural relationship with the United States, Ireland acts as a mediator between the OFN and Europakt, both diplomatically and economically.\n\nHome to dozens of embassies and consulates, Ireland has connections across the globe, serving as an optimal neutral ground for any groups that wish to negotiate with the Europakt. On the other side of the coin, American goods slide into Europe via the Irish Corridor and vice versa, with American computers popping up in offices in Oslo and German cars driving around the streets of Caracas, with Irish Civil Servants collecting taxes every time they pass through Irish ports. These connections are crucial for the diplomatic and trade functions between Europe and the Americas but are based on the precarious balance of global power in the Cold War, which can shift in the blink of an eye, putting Ireland's special position at risk."
 IRE_only_in_for_the_money: "Only in it for the Money"
 IRE_only_in_for_the_money_desc: "Ireland's loyalty to the Reich has never been guaranteed over the decades. Ever since Germany assisted with Ireland's reclamation of the North, they've tried to keep the Germans at arm's length, always willing to take their investments but never committing to any membership or mutual defence treaty with the Europakt. These circumstances have annoyed German diplomats in Dublin who sought to pull Ireland fully into the German sphere, but Ireland's shifting politics and instability in the North always prevented these plans from coming to full fruition.\n\nDespite open OFN ambitions by some Irish politicians and the Exiled British Government's involvement in the St. Birigids Day Agreement, putting Germany in an awkward spot regarding its unofficial recognition of both British Governments, German interests have always won out in the end. Their allies in Fianna Fáil gladly accept European investments and 'donations' in order to fill the state and party coffers."

 ULS_home_away_from_home: "A Home Away From Home"
 ULS_home_away_from_home_desc: "As part of the St. Brigid's Day Agreement, the Irish Government allowed British exiles and their families to resettle in Northern Ireland from Canada and other Commonwealth realms. While this arrangement angered Irish Nationalists and the Social Credit Regime in London, it was considered a necessary section of the agreement for Unionists to prevent them from being outnumbered by the Nationalists in the long run.\n\nSince the agreement's implementation, British Exile immigration from the Free Commonwealth has boomed, with tens of thousands moving to Belfast and its surroundings to reclaim what is left of their homeland, even if most of it is still under 'foreign occupation'. Naturally, this has caused tensions between the native nationalist communities and the Dublin Government due to their staunch support for hardline Unionist parties like the VUP. But the price for peace in Northern Ireland is worth any cost lest the next generation is forced to take up arms to defend their livelihood."

