### Ideas ###
IRE_the_bloated_giant: "The Bloated Giant"
IRE_the_bloated_giant_desc: "Most Irish citizens see Fianna Fáil — Ireland’s largest political party for nearly 70 years — as the “natural” party of government in Ireland, and for good reason. The leaders of smaller opposition parties, who could only dream of such ubiquity, envy the dominant position of Fianna Fáil. Behind closed doors, however, the Emerald Isle’s largest political bloc is a corrupt ideological circus.\n\nThe Modern-Day Fianna Fáil has few unifying characteristics. Nominally, it’s your typical right-wing conservative party, in truth, their deputies range from Liberal Progressives to Republican Hardliners. The single thread keeping the disparate party together, it would seem, is a unified adoration for money and power and old Civil War grudges."
IRE_echoes_ulster_crisis: "Embers of the Ulster Crisis"
IRE_echoes_ulster_crisis_desc: "The idea of Irish reunification had always been a problematic issue, but when Ireland reclaimed Ulster after the fall of Britain in WWII, they never expected the situation to become this dire.\n\nBy the Mid-1960s, the North had broken into a warzone, with Unionist Paramilitaries frequently attacking Government forces and Nationalist Paramilitaries. It wasn't until 1986 that all sides finally sat down and negotiated the St. Brigid’s Day Agreement, ending the conflict and enforcing a tenuous peace. Under the terms, the four-Unionist-dominated counties would be granted a devolved parliament with partial control over their domestic affairs, and a Government which must be made up of both Nationalists and Unionists.\n\nToday, peace still holds in the North, but tensions remain between the Nationalists and the Unionists. They’re cooperating for now, but everyone fears what the Nationalist and Unionist paramilitaries are up to."
IRE_pakts_middleman: "The Pakt’s Middleman"
IRE_pakts_middleman_desc: "The little nation of Ireland doesn’t bring much to the Europäische Pakt’s table, but the one benefit it does provide overshadows all other shortcomings— access to the OFN.\n\nThanks to its close trading and cultural relationship with the United States, Ireland acts as a mediator between the OFN and Europäische Pakt. Home to dozens of embassies and consulates, Ireland has connections across the globe, whether it be diplomatic, economic or cultural. However, recently espionage has become a problem for Ireland. With this new threat, Ireland will need to find a way to deal with this issue, but its international status won’t make it easy."

