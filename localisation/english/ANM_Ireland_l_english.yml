 ## Descriptions ##
 # Leaders #

 POLITICS_BERTIE_AHERN_DESC: "What does Bertie Ahern honestly believe in? That’s a question that only the man himself can answer — but, as hundreds of frustrated reporters could tell you, getting anything out of him besides the same tired, overwrought platitudes is an exercise in futility. Thankfully, it doesn’t take a gifted mind to infer that Bertie Ahern is upwards of lukewarm toward the age-old vices of money and power.\n\nFirst elected to the Dáil as a low-key backbencher, Ahern moved to the frontbench as a faithful Fianna Fáil spokesman following the 1982 Election — a contest which the party would ultimately lose to a cross-party coalition. When Fianna Fáil returned to power three years later, Ahern’s distinguished record would lead to his appointment as Ireland’s Minister for Finance.\n\nAlmost immediately, Ahern took full advantage of his new position to establish connections with the well-to-dos of the Emerald Isle. Never a master of subtlety, he didn’t back down from politely requesting “discretionary contributions” from his new friends in exchange for favors.\n\nAhern would become party leader in 1990, but his significant baggage from his time as Minister of Finance sparked embers of corruption within Fianna Fáil; embers which consumed the party like a wildfire by the time the 1994 elections rolled around. Thankfully, the contest went off without a hitch, and Ahern would find himself nominated Taoiseach after all the ballots were counted.\n\nAs Taoiseach, Bertie Ahern employs his party’s tried-and-true populist rhetoric and generous welfare schemes to maintain a high degree of popularity among his constituents. Despite this, the road ahead will not be an easy one, as whispers of Fianna Fáil’s corruption seep into the public consciousness. This, coupled with the recent wave of support for liberal reform, threatens to topple Ireland’s shady sovereign from his gilded throne."

  # Advisors #

 IRE_Desmond_Omalley_hog_desc: "Taoiseach Ahern’s faithful deputy, and one of the biggest names in Fianna Fáil, Desmond O’Malley is widely known for his flexible mindset, staunch moral values, and his ability to hold a grudge.\n\nFirst elected to his uncle’s seat in 1968, O’Malley was a fervent supporter then-Fianna-Fáil-leader Jack Lynch. Under growing pressure from a faction of the party led by Charles Haughey, however, O’Malley’s political idol was forced to resign in 1976. Unsurprisingly, it was Charles Haughey himself , the man who led the charge to oust Lynch, who would take his place as party leader and Taoiseach.\n\nOutraged, O’Malley ferociously opposed Haughey from day one, going so far as to attempt multiple no-confidence votes in an effort to oust the usurper. Eventually, O’Malley would be granted his wish, and when Bertie Ahern finally replaced Haughey, the newly-crowned Taoiseach nominated O’Malley — one of a handful of men who could hope to unite the quarreling party — to be his deputy.\n\nAs Tánaiste, O’Malley’s policy positions gravitate toward the liberal end of things, a stark contrast to his overwhelmingly conservative peers within Fianna Fáil. O’Malley has used his platform to call for a number of liberal reforms — the most controversial of which being his proposal to establish a constitutional separation between the Catholic Church and the Irish Government.\n\nSomewhat disappointingly, though, O’Malley seldom has time to push for reform — the majority of his efforts are spent keeping the Pro-Haughey and Anti-Haughey wings of the party from clawing at each other’s throats."
 IRE_Willie_Odea_sec_desc: "In most other countries, the Defense Minister — the top dog of the military hierarchy — commands just as much hard power as he does respect and prestige. In Ireland, a dinky nation with a dinkier military, the job is considered a low-level ministry position. Someone’s got to do the job, though, and as of right now, it’s Willie O’Dea.\n\nFirst elected in 1982, O’Dea, a Haughey supporter, was confined to the backbenches until assuming a minor Minister-of-State role following the 1985 election. He returned to the backbenches after the party’s defeat in 1990, but when Bertie Ahern brought Fianna Fáil back to power in ‘94, O’Dea was rewarded for his decade of loyalty with an appointment as Ahern’s Minister of Defence.\n\nAs Ireland’s Defense Minister, O’Dea is hardly content to simply collect a paycheck for a do-nothing job; he is determined to reform Ireland’s stagnant armed forces into a capable fighting force. How successful his planned reforms will be — and more importantly, who will foot the staggeringly-steep bill — is anyone’s guess, however."
 IRE_Micheal_Martin_for_desc: "It doesn’t take a crystal ball to accurately predict that, if you were to tour the world asking the average citizen who their nation’s Foreign Affairs Minister was, you would be met with quite a lot of blank stares and shrugged shoulders — with one notable exception. With the Irish public caring quite a lot about their nation’s image abroad, Ireland’s chief diplomat receives no shortage of media coverage, making the prestigious cabinet position a household name. Today, the man lucky enough to hold the job is Micheál Martin, a relatively new face in Irish politics.\n\nStarting his career as the Mayor of Cork City — the ‘cultural capital’ of Ireland — Martin was first elected to the Dáil in 1989. He was appointed to the front bench as Fianna Fáil’s spokesman on Education and Health following Bertie Ahern’s rise to power in 1990, and when Ahern announced his new cabinet after becoming Taoiseach in ‘94, he made the surprise decision to appoint Martin to his current job.\n\nNow enjoying the national limelight as Ireland’s Foreign Affairs Minister, Micheál Martin's daily life is a high-stakes balancing act. He walks a precarious tripwire between appeasing two of the world’s most powerful international alliances — Germania’s Europäische Pakt and Washington’s OFN. Thus far, it’s been smooth sailing on the ship of state, but stormy weather may lie in wait just beyond the horizon..."
 IRE_Brian_Cowen_eco_desc: "In Irish politics, the position of Finance Minister is a double-edged sword. As the steward of Ireland’s treasury, he is beholden to circumstance — depending on the way the winds blow, he is either the hunched, pitiable suit dodging tomatoes as he announces controversial spending cuts, or the knight in shining armor that tends to the people with popular welfare schemes.\n\nBrian Cowen, like his predecessors, does his best to be viewed as the latter.\n\n elected in 1984 to replace his father in the backbenches, Cowen emerged as a prominent critic of Fianna Fáil leader Charles Haughey early in his career. Cowen was promoted to the frontbenches in 1990 when Bertie Ahern succeeded Haughey, and in 1994, Cowen would join Taoiseach Ahern’s cabinet after Fianna Fáil returned to power.\n\nDuring his tenure as Ireland’s Finance Minister, Cowen hasn’t been shy about spending the nation’s coffers on lofty public welfare programs — a reputation which has earned him a great deal of popularity among Fianna Fáil’s populist voting base. Cowen’s name is so well-regarded, in fact, that many speculate him to have a decent chance of succeeding Ahern as the Emerald Isle’s next Taoiseach."
 IRE_Sile_De_Velera_hog_desc: "The death of long-time Fianna Fáil TD and Hardline Republican TD Neil Blaney at the end of 1995 left a hole in the Hardliner Wing of Fianna Fáil. The last of the Giants of the Fianna Fáil Republicans, with the earlier retirements of Charles Haughey and Kevin Boland, the party’s hardliner wing had no clear leaders. However, a new generation of Irish Republicans has stepped up to the plate, with Síle de Valera, granddaughter of the famed Éamon de Valera, as their torchbearer. \n\nElected in the late 1970s amid the Unionist Uprising in Northern Ireland, she quickly made a name for herself as a hardcore Republican, one who strongly supported party boss Charles Haughey and detested the British Governments in both London and Ottawa. However, she also deviated from her fellow Republicans by criticising Ireland’s ties to Germany and its allies, instead seeking closer ties to the United States. \n\nEven as Haughey faced growing pressure to resign, she vocally supported him as leader until his retirement. To kill two birds with one stone, Ahern appointed her as deputy prime minister to ensure support from Haughey’s supporters and to present the party as one willing to break the glass ceiling by appointing Ireland’s first female deputy prime minister. The de Valera name still carries weight in Irish politics even over 70 years after independence."
 


