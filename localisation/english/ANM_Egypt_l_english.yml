 EGY_Enemie_united_in_opposition: "Enemies United in Opposition" 
 EGY_Enemie_united_in_opposition_desc: "In the 1991 election, the Muslim Brotherhood once again emerged as the largest bloc in parliament, though by a slimmer margin than usual. The Brotherhood had largely controlled Egypt since King Farouk's death, except for a brief period between 1969 and 1973 when they were ousted by the Wafd in the 1969 special election following their failure to keep up with their promises and fully eliminate Italian influence. The 1980s were also a difficult time for the Brotherhood, despite the departure of Italian troops from Egypt. They struggled to revitalize the Egyptian economy, faced humiliation from the attacks in Alexandria and the Egyptian identification card controversy, which led to the disenfranchisement of Egyptians who did not identify as Muslim, Christian, or Jewish under the unresolved 1981 identity card law.\n\n These mounting problems intensified opposition to the Brotherhood, particularly after their controversial decision to begin the process of abolishing the monarchy in 1992. This move was intended to appease the republicans, socialists and far-right factions within the Brotherhood itself and distance Egypt from its British and Italian past. In 1995, after 190 years of Muhammad Ali Dynasty rule, the monarchy was officially abolished. However, this decision backfired, especially in Upper Egypt, a region historically divided in its support between the Brotherhood and the Wafd Party. Despite the Brotherhood's urban-focused agenda, Upper Egyptians were united in their love for the monarchy and tradition. As a result, it is expected that Upper Egypt will largely support the Wafd in the next election.\n\n Historically, the Wafd Party, the military, progressives, and monarchists had been at odds; particularly the Wafd with both the military and the monarchy. However, these groups have now come together in a united front to oppose the Muslim Brotherhood in the upcoming election, forming a broad and formidable coalition."

 EGY_Brotherhood_coalition: "Brotherhood Coalition"
 EGY_Brotherhood_coalition_desc: "Beginning mostly in the early 1960s, during the Al Hudaibi government following the death of King Farouk and the Day of Anger, the Muslim Brotherhood initially allied itself with socialists, and for a brief period, with the Saadist and Ahrar parties before those parties were reincorporated into the Wafd in the early 1970s. In the 1980s, the Brotherhood added republicans to their coalition to strengthen support in the northern coastal regions. This move coincided with the rise of the Arab/Islamic Liberal Wave, which grew from increasing opposition to reactionary, Islamist and authoritarian regimes in the Arab and Muslim worlds, as well as their cooperation with Imperialist powers such as Germany, Japan and Italy. The Liberal Wave gained momentum in Egypt, especially in the early 1990s, as the Egyptian economy continued to collapse following the 1980s recession and the failure of the Islamist mixed economy and corporatist policies." #Liberal Wake is the parallel to the Arab Islamist Wake

 EGY_the_crippled_mother: "The Cripped Mother"
 EGY_the_crippled_mother_desc: "Egypt is mostly known as Um al-Dunya (Mother of the World) has been suffering from a collapsing economy since the 1980s"