 ANM_debug.7.t:0 "Losing control over Silesia!"
 ANM_debug.7.desc:0 "We have lost contact with Wehrmacht and ORPO units in Silesia, Germania's control over the area is nonexistant.\nThe Koalition der Nationen has decided, without our consent, to establish a 'security zone' protected by the 'blue helmets' near Kattowitz.\n[LIE.GetLeader] holds onto Liegnitz in the name of the NSDAP, while loyal to us, rules the area essentially like his personal domain.\n[OPP.GetLeader] has opportunistically siezed a slice of Silesia for himself as well, but, unlike the former, not declared any allegiance whatsoever.\nMost worrying of all, the city of Breslau has been overrun by our worst enemies - The terrorists of the SS-Werwolf, which experienced major grow in the past years, and have now seized the moment."
 ANM_debug.7.a:0 "Germany must not splinter."
 ANM_debug.7.b:0 "(Play as [LIE.GetLeader] in Liegnitz)"
 ANM_debug.7.c:0 "(Play as the SS-Werwolf in Breslau)"
 ANM_debug.7.d:0 "(Play as [OPP.GetLeader] in Kattowitz)"
 ANM_debug.7.e:0 "(Play as the KdN Blue Helmet Mandate of Germany)"
 
 
 
 ANM_debug.7.t:0 "Losing control over Austria!"
 ANM_debug.7.desc:0 "We have lost contact with Wehrmacht and ORPO units in the Alpen-und-Donaugaue, sometimes still refered to as Austria. Germania's control over the area is nonexistant.\nLower Austria has declared independence under a new, radical catholic government, claiming to purge Austria from the 'pagan' NSDAP and the 'atheist' liberal movement.\nFomer actor and activist [STY.GetLeader], recently returned to Germany, presumably to form alliances amidst the turmoil, has taken control over Styria, and declared an independent, democratic state.\nLower Austria seemed to remain loyal at first, however, local Wehrmacht units have mutineered under the command of a certain [OOE.GetLeader], who, while not affiliated with the SS, seems to have constructed a state with uncanny similarities to the Ordenstaat.\nOnly the deep Alpine territorries under Jörg Haider remain loyal, although he finds himself at odds with Slovene independence movements."
 
 ANM_debug.7.a:0 "Germany must not splinter."
 ANM_debug.7.b:0 "(Play as [WIE.GetLeader]'s catholic revivalist Lower Austria)"
 ANM_debug.7.c:0 "(Play as [OOE.GetLeader]'s Spartanist-Esoteric Upper Austria)"
 ANM_debug.7.d:0 "(Play as [ALP.GetLeader]'s Alpine statelet)"
 ANM_debug.7.e:0 "(Play as [STY.GetLeader]'s Styria)"
 
 ANM_debug.9.t:0 "Losing control over Bohemia-Moravia!"
 ANM_debug.9.desc:0 "We have lost contact with Wehrmacht and ORPO units in Bohemia-Moravia, inofficially referd to as Czechia, Germania's control over the area is nonexistant.\nThe area is split, not only inbetween political allegiances, but also in terms of language and ethnicity. The culturally mixed population of Bohemia, opposing the NSDAP, has made an unusual decision - a royalist German-Czech government, with the possibility of a Habsburg returning to the throne, has been formed as a compromise.\nIn Moravia meanwhile, Czech Ultranationalists under [MRV.GetLeader] have sworn to purge the remainder of Czechia from German language and its people.\nThe Sudetenland meanwhile has isolated itself, under a neutral, republican government."
 ANM_debug.9.a:0 "(Play as the German-Czech Monarchists)"
 ANM_debug.9.b:0 "(Play as the Czech Ultranationalists)"
 ANM_debug.9.c:0 "(Play as the Sudeten German Republic)"
 
 
 ANM_debug.10.t:0 "Losing control over Southwest Germany!"
 ANM_debug.10.desc:0 "We have lost contact with Wehrmacht and ORPO units in Swabia, Baden and Württenberg, Germania's control over the area is nonexistant.\nTwo radical factions have established themselves here. \"Uriella\", as she calls herself, a swiss-born woman residing in Baden alongside her followers, is the leader of a religious cult known as the Fiat Lux. Using her vast network of loyalities and her rapidly growing base of converts in the area, she has effectively replaced the German government in Baden, establishing a theocratic regime.\n\nStuttgart, a center of protestor activity, has experienced an uprising by a loose coalition of revolutionaries. It seems that the most radical faction among them, inspired by 'Totalitarian Socialism', has purged their former allies, and turned Württenberg into a self-declared socialist utopia."
 ANM_debug.10.a:0 "Germany must not splinter."
 ANM_debug.10.b:0 "(Play as [BDE.GetLeader]'s cult)"
 ANM_debug.10.c:0 "(Play as [WUE.GetLeader]'s revolutionary faction)"
 
 ANM_debug.11.t:0 "Losing control over Bavaria!"
 ANM_debug.11.desc:0 "We have lost contact with Wehrmacht and ORPO units in Bavaria and Franconia, Germania's control over the area is nonexistant.\n\nTwo leaders have emerged with sympathies to our rivals in the National Revival Front, however distinct in ideology. [FRK.GetLeader] has seized Nürnberg, the 'NSDAP capital' due to his connections within the party bureaucracy, and advocates for a very conservative German regime.\n\n[NBY.GetLeader] on the other hand seeks not a return to the past, but an even more radical system, truly 'socialist' National Socialism.\n\nMeanwhile, München, desperate to prevent a takeover from the former two, yet divided into factions itself, has rallied behind [OBY.GetLeader], a popular, apolitical astronaut, as a figurehead. The vast ressources of the Bavarian space center and space industry, which make up a significant ammount of the Bavarian economy, have cooperated with both Reformist and Mußgnugite to temporarily seize control over the area."
 ANM_debug.11.a:0 "Germany must not splinter."
 ANM_debug.11.b:0 "(Play as [OBY.GetLeader]'s Upper Bavaria)"
 ANM_debug.11.c:0 "(Play as [NBY.GetLeader]'s Lower Bavaria)"
 ANM_debug.11.d:0 "(Play as [FRK.GetLeader]'s Franconia)"


