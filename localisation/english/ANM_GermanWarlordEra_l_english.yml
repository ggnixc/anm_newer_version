 ANM_ger_thebigwarlordera_category:0 "The German Collapse"
 ANM_ger_thebigwarlordera_category_desc:0 "A situation none could have expected has become a reality - The §MGerman Central Government§! is no more.\nTo the absolute shock - or delight, to some - of the nation, the coup attempt has left the Reich divided into many factions.\nFrom §Mregime loyalists§!, §oHitlerites§!, §aDemocrats§! and §fseperatists§! to §Iopportunists§!, §wwarlords§!, §Mgcultists§! and §Vrevolutionaries§!, they have seized this moment of weakness.\nIf we wish to establish control over all of Germany, we must §mintegrate the territorries we bring under our control§!, §xfight or reunite with rival factions§!, and finally, §Mlay claim to German Leadership§!\n\n§M[GER.GetFactionName]§!\n§Y[GER.GetName]§! \nAllegiance - §M[GER.GetFactionName]§! - Relative Power - [?GER.alliance_strength_ratio|V2]\n§Y[HSS.GetName]§! \nAllegiance - §M[HSS.GetFactionName]§! - Relative Power - [?HSS.alliance_strength_ratio|V2]\n§Y[MEC.GetName]§! \nAllegiance - §M[MEC.GetFactionName]§! - Relative Power - [?MEC.alliance_strength_ratio|V2]\n§Y[THR.GetName]§! \nAllegiance - §M[THR.GetFactionName]§! - Relative Power - [?THR.alliance_strength_ratio|V2]\n§Y[LIE.GetName]§! \nAllegiance - §M[LIE.GetFactionName]§! - Relative Power - [?LIE.alliance_strength_ratio|V2]\n[getANMGerCivilwar_Faction_ALP]\n[getANMGerCivilwar_Faction_FRK_fasc]\n\n§M[NSF.GetFactionName]§!\n§Y[NSF.GetName]§! \nAllegiance - §M[NSF.GetFactionName]§! - Relative Power - [?NSF.alliance_strength_ratio|V2]\n§Y[WPH.GetName]§!\nAllegiance - §M[WPH.GetFactionName]§! - Relative Power - [?WPH.alliance_strength_ratio|V2]\n§Y[RHE.GetName]§!\nAllegiance - §M[RHE.GetFactionName]§! - Relative Power - [?RHE.alliance_strength_ratio|V2]\n§Y[HNO.GetName]§! \nAllegiance - §M[HNO.GetFactionName]§! - Relative Power - [?HNO.alliance_strength_ratio|V2]\n[getANMGerCivilwar_Faction_OBY]\n[getANMGerCivilwar_Faction_FRK_natsoc]\n\n§MLeague for a Democratic Germany§!\n[getANMGerCivilwar_Faction_BRN]\n[getANMGerCivilwar_Faction_STY]\n[getANMGerCivilwar_Faction_SDT]\n[getANMGerCivilwar_Faction_HBR]\n\nOthers\n§Y[KTW.GetName]§! \nAllegiance - §M[KTW.GetFactionName]§! - Relative Power - [?KTW.alliance_strength_ratio|V2]\n§Y[WIE.GetName]§! \nAllegiance - §M[WIE.GetFactionName]§! - Relative Power - [?WIE.alliance_strength_ratio|V2]\n§Y[STB.GetName]§! \nAllegiance - §M[STB.GetFactionName]§! - Relative Power - [?STB.alliance_strength_ratio|V2]\n§Y[OPP.GetName]§! \nAllegiance - §M[OPP.GetFactionName]§! - Relative Power - [?OPP.alliance_strength_ratio|V2]\n§Y[POM.GetName]§! \nAllegiance - §M[POM.GetFactionName]§! - Relative Power - [?POM.alliance_strength_ratio|V2]\n§Y[OFT.GetName]§! \nAllegiance - §M[OFT.GetFactionName]§! - Relative Power - [?OFT.alliance_strength_ratio|V2]\n§Y[SLR.GetName]§! \nAllegiance - §M[SLR.GetFactionName]§! - Relative Power - [?SLR.alliance_strength_ratio|V2]\n [BHM.GetName]§! \nAllegiance - §M[BHM.GetFactionName]§! - Relative Power - [?BHM.alliance_strength_ratio|V2]\n§Y[SSC.GetName]§! \nAllegiance - §M[SSC.GetFactionName]§! - Relative Power - [?SSC.alliance_strength_ratio|V2]\n"
 
 
