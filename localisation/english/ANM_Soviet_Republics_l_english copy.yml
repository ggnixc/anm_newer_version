 # Nat Spirits
 SOV_A_Scarred_People: "A Scarred People"
 SOV_A_Scarred_People_desc: "Decades of Fascist occupation have no doubt ruined the psyche of the people who dwell in the lands of the former Soviet Republics. The once prosperous lands of the 1930s were forever changed, as citizens were wrongfully evicted from their homes in cities to be replaced by Teutons, and crops were funnelled to Germany causing mass starvations. The Proletariat, who were once free from the chains of capitalism and bourgeoisie dictatorship, were shackled as serfs and slaves in the lands that they used to call home. \n\nWhichever direction one decides to look, mass graves litter the land as far as the eye can witness. Cities that used to bustle with life are now but deserted marsh. Former collaborators, nationalists and Teutons continue to conduct partisan warfare and hinder our re-integration efforts. It may take decades, even centuries for the reclaimed territories to recover back to how it was prior to the First Great Patriotic War, with the pessimistic predicting it may never recover back to that extent ever again."
 SOV_Torn_Apart_Industry: "Torn Apart Industry"
 SOV_Torn_Apart_Industry_desc: "As the Teuton Vermin retreated from their unlawful occupations to our West, they conducted cruel Scorched Earth policies in order to slow down our advance and Liberation of our former Soviet Socialist Republics. Wehrmacht Army Groups stole crops, destroyed farms, blew up oil fields, razed cities and its industry, along with carrying whatever material they could back to Germany proper to prevent it from landing in our hands. \n\nSuch policies have unfortunately placed the burden of reconstruction on us. Nevertheless, such a setback will not prevent the Union from reclaiming its rightful spot on the world stage, as the Germans have performed this exact sly tactic during their retreat from Muscovy. We will learn from our past experiences, and rebuild the former Soviet Republics into shining beacons of Marxism-Leninism to be proudly displayed on the world stage."
 SOV_Freedom_At_Last: "Freedom At Last"
 SOV_Freedom_At_Last_desc: "Rejoice, dear Soviet people! Our promise made 50 years ago that the Motherland will return has at last come into fruition. No longer will the Soviet proletariat have to toil and serve their Teuton masters as mere slaves, and they can finally raise their heads up as equal and upstanding members of society. \n\nCities will be renamed back to their native languages, the expulsion of Germans will begin and the repatriation of homes that rightfully belong to the native people will be conducted. The immortal science of Marxism-Leninism will once again serve as the guiding principle for the liberation of mankind in the quest for a classless and stateless society in the reclaimed Soviet Republics."