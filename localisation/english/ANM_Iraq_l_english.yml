#Leader Descriptions
 POLITICS_ABD_AL_RAHMAN_AL_BAZZAZ_DESC: "Al Bazzaz was born in a Baghdadi suburb after the 1920 revolution, he was taught in Katateeb and memorized the Quran at a young age, he graduated from Baghdad's Highschool and later entered Law School, he Graduated in 1935 and went to study in the Royal Academy in London, he returned with the outbreak of the 2nd World War, he supported King Ghazi and the Golden Square in their war against England and he was appointed a general attorney in 1946 and a Judge in 1953. \n\nAl Bazzaz was a Pan Arabist, Nationalist, and Reformist Socialist, Nationalism is cool and all but Al Bazzaz wanted democracy and socialism, he advocated against the Monarchy and Golden Square and was arrested after King Ghazi's assassination, he was later released after the 1958 coup and appointed minister of Justice again, in the following years he realized his mistakes and his Republican Dream shattered after the Civil War broke out so he and his comrades alongside Monarchists, Liberals and Social Democrats, formed the Democratic Coalition to defeat Ba'athism and Islamism. \n\nThe Civil War raged for years before ending in 1970 when Al Bazzaz entered the city and declared that Iraq was extremism free and held elections, he later restored the Monarchy, allowed Pluralism under state control, and unified Iraq and Palestine. \n\nAl Bazzaz isn't a Champion of democracy nor a Tyrant, he's just a Guy who loves his country and loves his People and their well-being, so God is the Greatest, Long live the Nation, the People, the king, and Al Bazzaz"
 POLITICS_FAISAL_II_DESC: "Faisal II, King of Iraq and President of the Hashemite Arab Federation, Faisal was born in 1935 to King Ghazi the Pan-Arabist, and Queen Aliyah the Social Democrat, he was raised by Iraqi traditions and costumes instead of Hejazi ones. \n\nHe was the student of influential Iraqi men and women in the first half of the 20th century, but his Father was trying to teach him to be a Benevolent Dictator, when Faisal became a teen he was sent to study in Sweden, the Last democracy in Europe and the only place untouched by War, perfect for a future Monarch, in Sweden he will learn about the Nordic system and Faisal returns home in hopes to make Iraq a Nordic country in everything except the Weather. \n\nUnfortunately, King Ghazi was assassinated in Rome and Faisal II became King at the age of 21, his Rapid efforts to democratize Iraq and implement Welfare programs angered the conservative Military and Italians who couped him in 1958 under the banner of liberation even if the Iraqi Republic under Qassim was worse than ever and more oppressing. \n\nFaisal returned as King of Iraq in the 1970s and thanks to Al Bazzaz, Iraq is now a developed country with one of the best welfare systems in the World even if democracy and liberty are limited, he's still happy with the result."
 POLITICS_KING_HUSSIEN_DESC: "Hussien II, King of Palestine and Vice President of the Hashemite Arab Federation, Hussien was born in 1935 a few months after his cousin Faisal II, His Father Talal was also a Pan-Arabist and had his son raised in the old-fashioned military and Hejazi Traditions. \n\nHe was sent to study at Baghdad military academy at the age of 14 and later shipped to Rome's military academy, Hussien cared about his people but he wanted to rule them the same way as his Grandfather Abdullah I, he will succeed his Grandfather who died of old age in the midst of the 1960s, Hussien will be Palestine's second Independent King after his Grandfather as the country independence in 1964, his father Talal never became King as he was claimed by his Italian doctors to be Mentally ill in 1958. \n\nAfter the end of the Iraqi Civil War, the Iraqi Monarchy was restored and therefore it was a matter of months for the Unification to happen so Hussien only asked for the Union to be an Equal confederation and the two countries to have different governments under a federal one, this was approved and Hussien became Vice President of the Federation."

#Tooltips

 
 
#Ideas
 IRQ_Idea_Faisal_II_Hussien_II: "Dual Monarchy"
 IRQ_Idea_Faisal_II_Hussien_II_desc: "After the people of Iraq broke their chains from the despotic Republic led by Abdul Salam, Iraq sought to find allies in the region, and to most in the Iraqi government, the choice was obvious. The monarchy in Jordan then Palestine was also led by a Hashemite and cousin of King Faisal II, King Hussein. The Palestinians sought to merge or atleast seek an alliance with Iraq as to secure their independence form the Italians. In 1974, the two nations officially merged in the treaty of Baghdad, and the long awaited Hashemite Arab Federation was formed. The constitution states that the two monarchies have equal power in this Federation, and equal say on key issues in the nation as to make sure both parties equally benefit. This so far, while having some troubles, has mostly worked out well enough for both parties."
 IRQ_Idea_Faisal_II: "Faisal II"
 IRQ_Idea_Faisal_II_desc: "Faisal II, King of Iraq and President of the Hashemite Arab Federation, Faisal was born in 1935 to King Ghazi the Pan-Arabist, and Queen Aliyah the Social Democrat, he was raised by Iraqi traditions and costumes instead of Hejazi ones. \n\nHe was the student of influential Iraqi men and women in the first half of the 20th century, but his Father was trying to teach him to be a Benevolent Dictator, when Faisal became a teen he was sent to study in Sweden, the Last democracy in Europe and the only place untouched by War, perfect for a future Monarch, in Sweden he will learn about the Nordic system and Faisal returns home in hopes to make Iraq a Nordic country in everything except the Weather. \n\nUnfortunately, King Ghazi was assassinated in Rome and Faisal II became King at the age of 21, his Rapid efforts to democratize Iraq and implement Welfare programs angered the conservative Military and Italians who couped him in 1958 under the banner of liberation even if the Iraqi Republic under Qassim was worse than ever and more oppressing. \n\nFaisal returned as King of Iraq in the 1970s and thanks to Al Bazzaz, Iraq is now a developed country with one of the best welfare systems in the World even if democracy and liberty are limited, he's still happy with the result."
