 IRQ_Nasser_Chaderchi: "Nasser Al Chaderchi"
 IRQ_Nasser_Chaderchig_hog_desc: "--------------\nOur Deputy Prime Minister, Nasser Al Chaderchi was Born in Baghdad in 1933 to an Aristocratic family, his Grandfather was an Ottoman Pasha and Politican, his Father was a Social Democrat, Anti Monarchist Political Activist, and Member of Parliament also the founder of the ruling National Democratic Party, his brother, Rifat, is currently a World famous Architect. \n\nHis Political career started after the overthrow of the Monarchy and his father becoming a Minister for the First time, but his father will lose his job after the death of Qassim and the Outbreak of the Civil War, Ironically he and his father will fight alongside the Monarchists, Liberals and Radical Social Democrats they both hated. \n\nAfter the end of the War, Al Chaderchi's father became Deputy Prime Minister for Al Bazzaz and after a few years he will die succeeded by Multiple incompetent men until the Opportunity came in 1995 on King Faisal II, 60th birthday when Nasser will be offered by the King to be Deputy Prime Minister."
 IRQ_Arif_Abdul_Razzaq: "Arif Abdul Razzaq"
 IRQ_Arif_Abdul_Razzaqg_desc: "--------------\nArif Abdul Razzaq Al Kabbesi, the Man of Coups, even if he had stopped his coup hobby in 1970, he still has a story to be called that nickname. \n\nBorn in a village on the outskirts of the City of Al Ramadi on the Iraqi Syrian border, Arif became an Orphan at the age of 10 and went to Highschool in Baghdad, he was later admitted to the Military academy, graduated amidst the 2nd World War and Joined the airforce to bomb the British. \n\nIn 1953, he was assigned by King Ghazi to be the personal Pilot of Crown Prince Faisal, he will join his first coup in 1958 which is the one that overthrew the Monarchy, a year later he will counter the coup and then he plotted to assassinate Qassim and succeded, he first joined the Ba'ath side of the Civil War but later couped them and Joined the National Democratic Party and Monarchists and finally in 1970, Arif Abdul Razzaq will enter Baghdad victorious for the First time in his 15 years coup career, he will be a Brigadier and later lieutenant, until his retirement in 1995 when he received a message to be Defense Minister in Al Bazaz 5th cabinet."
 IRQ_Tariq_Aziz: "Mikhail Yohana"
 IRQ_Tariq_Azizg_desc: "--------------\nBorn to a rich Catholic Family in a dirt-poor Catholic Cheladean village in northern Iraq, Mikhail's parents managed to send him to Baghdad and he later worked as a Journalist, his career as a horse races and Labour issues Journalist will be cut short after the Overthrow of the Monarchy, he joined the National Democratic Party as the alternative to the German Aligned Ba'ath party, who saw them as Traitors and anti-Catholic party. \n\nHe became the editor of the ASP newspaper Al Jamheer Al Arabyah, he later became a commander in the Civil War and Propagandist, and by the end of the War he became A General, after the War he went on to have a doctorate in Media and Political science, he later worked as the Head of Iraqi TV and Radio and as Media Minister. \n\nMikhail became Minister of Foreign Affairs after years of Hard work, experience, diplomatic wit, and being a Christian, which is something irrelevant in Iraqi society but in order to be more productive with Italy and OFN you can use a Christian in that position."
 IRQ_Fakhri_Qadouri: "Fakhri Qadouri"
 IRQ_Fakhri_Qadourig_desc: "--------------\nFakhri was born in Baghdad in 1932, next to the Japanese Embassy. He hailed from a middle-class Shia family and completed high school with classes in the Japanese language through embassy programs. While studying, he joined the Ba'ath Party and organized rallies during his time at the College of Trade. He later left the party after the overthrow of the monarchy and joined the National Democratic Party. Subsequently, he became the Central Bank Manager under Qassim but resigned soon after. \n\nWhen the Civil War broke out, Fakhri traveled to Japan to seek support for the NDP, but they refused to avoid angering the Germans. He then left for the USA, where he earned a Master's in Economics from Iowa State University. \n\nReturning home in the 1970s, he was appointed governor of the Central Bank and later became the Minister of Trade. Currently, he serves as the Economy Minister."

 IRQ_Welfare_state: "Welfare Programs"
 IRQ_Welfare_state_desc: "The National Democratic Party is the dominant party of the Hashemite Federation so they can pass their legislation virtually without any opposition save for the two kings occasionally. With this power they have passed laws that have greatly improved the lives of the citizens of the Federation. Using oil money and high taxes social programs in the Federation are some of the best and most developed in the region with free healthcare, pensions, and social safety nets, the prosperity of the Federation and its people is almost guaranteed as long as these programs stay in place."
 IRQ_Controled_Democracy: "State Sponsored Liberty"
 IRQ_Controled_Democracy_desc: "Even though we have a Parliament, elections, and a Constitution, it is apparent that the National Democratic Party is in control, and our civil liberties are granted with certain restrictions and regulations to ensure the safety of the state. For example, one cannot insult the government or the monarchy, separatists are not tolerated, and expressing favorable opinions of enemy countries is forbidden."
 IRQ_Baath_Threat: "Ghost of Ba'athism"
 IRQ_Baath_Threat_desc: "Baathism has influenced our country a lot and caused it a lot of suffering because of the Civil War that they caused, now we have rehabilitated the Baathists but we don't trust them to not do the same as they died in the 1960s and even if we're keeping them in line, we don't know when they will show their real skin."
