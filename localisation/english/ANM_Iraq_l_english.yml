 IRQ_Idea_Hussien_II_desc: "Hussien II, King of Palestine and Vice President of the Hashemite Arab Federation, Hussien was born in 1935 a few months after his cousin Faisal II, His Father Talal was also a Pan-Arabist and had his son raised in the old-fashioned military and Hejazi Traditions. \n\nHe was sent to study at Baghdad military academy at the age of 14 and later shipped to Rome's military academy, Hussien cared about his people but he wanted to rule them the same way as his Grandfather Abdullah I, he will succeed his Grandfather who died of old age in the midst of the 1960s, Hussien will be Palestine's second Independent King after his Grandfather as the country independence in 1964, his father Talal never became King as he was claimed by his Italian doctors to be Mentally ill in 1958. \n\nAfter the end of the Iraqi Civil War, the Iraqi Monarchy was restored and therefore it was a matter of months for the Unification to happen so Hussien only asked for the Union to be an Equal confederation and the two countries to have different governments under a federal one, this was approved and Hussien became Vice President of the Federation."


