 #LEADER DESCRIPTIONS#
 POLITICS_MARGARET_THATCHER_DESC:0 "Margaret Thatcher can only be described as Powerful.\n\nOnce a symbol of youth, having risen to power after the English Civil War, she became a Leader, assuming power in the aftermath of the resignation of Alec Douglass-Home. she then became a Unifier, bringing Scotland and Wales into the Union she Restored, and tearing the Oppressive Cornwall Garrison into pieces. Then a diplomat, balancing the needs of West and South. Left and Right, fighting for the Independent Britain she always envisioned. ensuring that her beloved nation is as strong as it once was.\n\nBut the Iron Lady begins to rust, going through the motions at a slowing pace. and all know, a rusted iron cannot keep the nation together, and it won't."
